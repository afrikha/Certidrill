id: dp420-1d-hot-range-hotarea
objective: "1.3.7"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware hosts a multitenant application in an Azure Cosmos DB for NoSQL container partitioned by `/tenantId`. The container has 24,000 RU/s of manual throughput and four physical partitions. Clients received HTTP 429 responses during a sales event.

    You aggregate the diagnostic logs of the incident. For each PartitionKeyRangeId, the following table shows the peak RU consumed in one second and the logical partition key that consumed the most RUs in that range.

    Answer each prompt by selecting the appropriate cell.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware héberge une application multilocataire dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/tenantId`. Le conteneur dispose d'un débit manuel de 24 000 RU/s et de quatre partitions physiques. Les clients ont reçu des réponses HTTP 429 pendant un événement commercial.

    Vous agrégez les journaux de diagnostic de l'incident. Pour chaque PartitionKeyRangeId, le tableau suivant indique le pic de RU consommées en une seconde et la clé de partition logique qui a consommé le plus de RU dans cette plage.

    Répondez à chaque consigne en sélectionnant la cellule appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The physical partition that was rate limited", fr: "La partition physique qui a été limitée en débit" }
    - id: p2
      text: { en: "The logical partition key that caused the rate limiting", fr: "La clé de partition logique à l'origine de la limitation du débit" }
  grid:
    header:
      - PartitionKeyRangeId
      - { en: "Peak RU consumed in one second", fr: "Pic de RU consommées en une seconde" }
      - { en: "Top logical partition key", fr: "Clé de partition logique principale" }
      - { en: "RU consumed by the top key", fr: "RU consommées par la clé principale" }
    rows:
      - [{ text: "0", area: r0 }, { text: "5,700" }, { text: tenant-0412, area: k0 }, { text: "2,100" }]
      - [{ text: "1", area: r1 }, { text: "6,450" }, { text: tenant-0007, area: k1 }, { text: "5,300" }]
      - [{ text: "2", area: r2 }, { text: "4,100" }, { text: tenant-1180, area: k2 }, { text: "650" }]
      - [{ text: "3", area: r3 }, { text: "5,950" }, { text: tenant-0051, area: k3 }, { text: "1,400" }]
answer:
  values: { p1: r1, p2: k1 }
explanation:
  correct:
    en: |
      Provisioned throughput is divided evenly among physical partitions, so each of the four partitions gets 24,000 / 4 = 6,000 RU/s. Only range 1 consumed more than 6,000 RUs in one second, so it is the rate-limited partition. In that range, tenant-0007 alone consumed 5,300 RUs, a disproportionate share that indicates a hot logical partition; adding RU/s would only be a short-term workaround.
    fr: |
      Le débit approvisionné est réparti uniformément entre les partitions physiques ; chacune des quatre partitions reçoit donc 24 000 / 4 = 6 000 RU/s. Seule la plage 1 a consommé plus de 6 000 RU en une seconde : c'est la partition limitée en débit. Dans cette plage, tenant-0007 a consommé à lui seul 5 300 RU, une part disproportionnée qui révèle une partition logique chaude ; ajouter des RU/s ne serait qu'une solution de contournement à court terme.
  options:
    r3: { en: "Range 3 peaked at 5,950 RUs, which stays below its 6,000 RU/s share.", fr: "La plage 3 a culminé à 5 950 RU, ce qui reste sous sa part de 6 000 RU/s." }
    k3: { en: "tenant-0051 is in a range that was not rate limited.", fr: "tenant-0051 se trouve dans une plage qui n'a pas été limitée en débit." }
references:
  - title: Troubleshoot Request Rate Too Large Exceptions - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-request-rate-too-large
  - title: Partitioning and horizontal scaling - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning
