id: dp420-1b-python-replace
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nightly Python job recalculates customer profiles and writes the complete new version of each profile to an Azure Cosmos DB for NoSQL container by using the `azure-cosmos` SDK.

    If a profile was deleted while the job was running, the write must fail instead of recreating the profile.

    Which method should the job call?
  fr: |
    Un traitement Python nocturne recalcule les profils clients et écrit la nouvelle version complète de chaque profil dans un conteneur Azure Cosmos DB for NoSQL avec le SDK `azure-cosmos`.

    Si un profil a été supprimé pendant l'exécution du traitement, l'écriture doit échouer au lieu de recréer le profil.

    Quelle méthode le traitement doit-il appeler ?
body:
  options:
    - { id: a, text: upsert_item }
    - { id: b, text: create_item }
    - { id: c, text: patch_item }
    - { id: d, text: replace_item }
answer: { optionId: d }
explanation:
  correct:
    en: "replace_item overwrites an existing item with the new body and raises CosmosHttpResponseError when the item with the given id does not exist, so a deleted profile is never recreated."
    fr: "replace_item remplace un élément existant par le nouveau corps et lève CosmosHttpResponseError quand l'élément portant l'id indiqué n'existe pas : un profil supprimé n'est donc jamais recréé."
  options:
    a: { en: "upsert_item creates the item when it does not exist, which would recreate the deleted profile.", fr: "upsert_item crée l'élément s'il n'existe pas, ce qui recréerait le profil supprimé." }
    b: { en: "create_item fails for every profile that still exists, which is the normal case.", fr: "create_item échoue pour chaque profil qui existe encore, ce qui est le cas normal." }
    c: { en: "patch_item applies at most 10 operations to selected paths; it does not write the complete new version of a document.", fr: "patch_item applique au plus 10 opérations à des chemins choisis ; il n'écrit pas la nouvelle version complète d'un document." }
references:
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy
