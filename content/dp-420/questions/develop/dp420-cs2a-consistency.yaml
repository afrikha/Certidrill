id: dp420-cs2a-consistency
objective: "1.1.1"
type: single
caseStudy: dp420-cs2a-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the default consistency level of cosmos-fourthcoffee to meet the first requirement.

    Which consistency level should you use?
  fr: |
    Vous devez configurer le niveau de cohérence par défaut de cosmos-fourthcoffee pour respecter la première exigence.

    Quel niveau de cohérence devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Strong", fr: "Fort (Strong)" } }
    - { id: b, text: { en: "Bounded staleness", fr: "Obsolescence limitée (Bounded staleness)" } }
    - { id: c, text: { en: "Consistent prefix", fr: "Préfixe cohérent (Consistent prefix)" } }
    - { id: d, text: { en: "Session", fr: "Session" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Session consistency guarantees read-your-writes within a client session, so the member sees the balance that the purchase just updated, while other sessions can read slightly older data. Session reads are served by a single replica, so they cost half the RUs of Bounded staleness reads, and Session is supported on accounts that have multiple write regions.
    fr: |
      La cohérence Session garantit la lecture de ses propres écritures dans une session cliente : le membre voit le solde que l'achat vient de mettre à jour, tandis que les autres sessions peuvent lire des données légèrement plus anciennes. Les lectures Session sont servies par un seul réplica et coûtent donc deux fois moins de RU que les lectures Bounded staleness, et Session est pris en charge sur les comptes qui ont plusieurs régions d'écriture.
  options:
    a: { en: "Strong consistency cannot be used on an account that has multiple write regions.", fr: "La cohérence Strong ne peut pas être utilisée sur un compte qui a plusieurs régions d'écriture." }
    b: { en: "Bounded staleness reads from two replicas, which doubles the read RU charge, and it is an anti-pattern on multi-region write accounts.", fr: "Bounded staleness lit deux réplicas, ce qui double le coût en RU des lectures, et c'est un anti-modèle sur les comptes à écritures multirégions." }
    c: { en: "Consistent prefix guarantees the order of writes but not that a client reads its own latest write, so the old balance might be shown.", fr: "Consistent prefix garantit l'ordre des écritures, mais pas qu'un client lise sa propre écriture la plus récente : l'ancien solde pourrait s'afficher." }
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
