id: dp420-1c-synth-strategy-dragdrop
objective: "1.3.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind is reviewing the partitioning strategy of four Azure Cosmos DB for NoSQL workloads.

    You need to select the partitioning strategy that meets the requirements of each workload.

    Which strategy should you use for each workload? To answer, drag the appropriate strategies to the correct workloads. Each strategy may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind examine la stratégie de partitionnement de quatre charges de travail Azure Cosmos DB for NoSQL.

    Vous devez sélectionner la stratégie de partitionnement qui répond aux exigences de chaque charge de travail.

    Quelle stratégie devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les stratégies appropriées vers les charges de travail correspondantes. Chaque stratégie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: concat, text: { en: "Synthetic key that concatenates two properties", fr: "Clé synthétique qui concatène deux propriétés" } }
    - { id: random, text: { en: "Synthetic key with a random suffix", fr: "Clé synthétique avec un suffixe aléatoire" } }
    - { id: precalc, text: { en: "Synthetic key with a precalculated suffix", fr: "Clé synthétique avec un suffixe précalculé" } }
    - { id: hpk, text: { en: "Hierarchical partition key", fr: "Clé de partition hiérarchique" } }
    - { id: date, text: { en: "Partition key on the date property", fr: "Clé de partition sur la propriété de date" } }
  targets:
    - id: logs
      text: { en: "Ingest a day of log events as fast as possible; events are only read by a job that processes the whole day", fr: "Ingérer une journée d'événements de journal le plus vite possible ; les événements ne sont lus que par un traitement qui parcourt toute la journée" }
    - id: vehicles
      text: { en: "Spread a day's vehicle readings while still allowing a point read of one vehicle's reading for a date", fr: "Répartir les mesures de véhicules d'une journée tout en permettant la lecture ponctuelle de la mesure d'un véhicule pour une date" }
    - id: tenants
      text: { en: "New container: queries filter on tenantId alone or with userId, and large tenants exceed 20 GB", fr: "Nouveau conteneur : les requêtes filtrent sur tenantId seul ou avec userId, et les grands locataires dépassent 20 Go" }
    - id: legacy
      text: { en: "Existing container with a single-path key on /pk that cannot be recreated; queries always specify both deviceId and year", fr: "Conteneur existant avec une clé à chemin unique sur /pk qui ne peut pas être recréé ; les requêtes précisent toujours deviceId et l'année" }
answer:
  mapping: { logs: random, vehicles: precalc, tenants: hpk, legacy: concat }
explanation:
  correct:
    en: |-
      A random suffix maximizes write parallelism when items are not read individually. A precalculated suffix, derived from a value the reader knows, keeps the spread and allows point reads. A hierarchical partition key, defined when the container is created, routes tenant-only queries to the tenant's partitions and lets a tenant exceed 20 GB. When the key path cannot change, writing a concatenation of deviceId and year into the existing /pk property gives a key that every query can compute.
    fr: |-
      Un suffixe aléatoire maximise le parallélisme d'écriture quand les éléments ne sont pas lus individuellement. Un suffixe précalculé, dérivé d'une valeur connue du lecteur, conserve la répartition et permet les lectures ponctuelles. Une clé de partition hiérarchique, définie à la création du conteneur, route les requêtes sur le seul locataire vers les partitions de celui-ci et permet à un locataire de dépasser 20 Go. Quand le chemin de clé ne peut pas changer, écrire une concaténation de deviceId et de l'année dans la propriété /pk existante donne une clé que chaque requête peut calculer.
  options:
    date: { en: "A date key sends all the writes of the day to one logical partition.", fr: "Une clé sur la date envoie toutes les écritures du jour vers une seule partition logique." }
references:
  - title: Create a synthetic partition key
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/synthetic-partition-keys
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
