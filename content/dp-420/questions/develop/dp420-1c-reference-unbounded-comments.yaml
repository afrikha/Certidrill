id: dp420-1c-reference-unbounded-comments
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin stores blog posts in an Azure Cosmos DB for NoSQL container partitioned by `/postId`. Each post item currently embeds an array of all its comments. Some popular posts now receive tens of thousands of comments, and writes to those posts are slow and expensive.

    The post page must still show the post and its 10 most recent comments with one point read, and older comments are loaded page by page on demand.

    What should you do?
  fr: |
    Tailspin stocke des billets de blog dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/postId`. Chaque billet incorpore actuellement un tableau de tous ses commentaires. Certains billets populaires reçoivent désormais des dizaines de milliers de commentaires, et les écritures sur ces billets sont lentes et coûteuses.

    La page d'un billet doit toujours afficher le billet et ses 10 commentaires les plus récents avec une seule lecture ponctuelle, et les commentaires plus anciens sont chargés page par page à la demande.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep all comments embedded and enable bulk execution for the comment writes", fr: "Conserver tous les commentaires incorporés et activer l'exécution en bloc pour les écritures de commentaires" } }
    - { id: b, text: { en: "Store each comment as a separate item in a container partitioned by /id", fr: "Stocker chaque commentaire comme un élément distinct dans un conteneur partitionné par /id" } }
    - { id: c, text: { en: "Store each comment as a separate item with the postId, and keep only the 10 latest comments in the post", fr: "Stocker chaque commentaire comme un élément distinct avec le postId, et ne garder que les 10 derniers commentaires dans le billet" } }
    - { id: d, text: { en: "Split the comment array of a post across several post items that share the same id", fr: "Répartir le tableau de commentaires d'un billet entre plusieurs éléments de billet qui partagent le même id" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An unbounded array should not be embedded. Each comment becomes its own item carrying the `postId`, so it lives in the post's logical partition and older comments are read with a single-partition query. A bounded copy of the latest comments stays embedded in the post so the page still needs only one point read.
    fr: |-
      Un tableau non borné ne doit pas être incorporé. Chaque commentaire devient un élément distinct portant le `postId` : il se trouve dans la partition logique du billet et les commentaires plus anciens sont lus par une requête sur une seule partition. Une copie bornée des derniers commentaires reste incorporée dans le billet, de sorte que la page ne nécessite toujours qu'une lecture ponctuelle.
  options:
    a: { en: "Bulk execution does not shrink the item; every comment still rewrites a large, growing document that heads toward the 2 MB limit.", fr: "L'exécution en bloc ne réduit pas la taille de l'élément ; chaque commentaire réécrit toujours un document volumineux et croissant qui se rapproche de la limite de 2 Mo." }
    b: { en: "With /id, loading the older comments of a post becomes a cross-partition query.", fr: "Avec /id, charger les commentaires plus anciens d'un billet devient une requête entre partitions." }
    d: { en: "The id must be unique within a logical partition, and the page would need several reads.", fr: "L'id doit être unique dans une partition logique, et la page nécessiterait plusieurs lectures." }
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
