id: dp420-1a-sdk-python-client
objective: "1.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum is writing a Python analytics service that runs on an Azure virtual machine with a managed identity. The Azure Cosmos DB for NoSQL account uses Session as its default consistency level and has regions in West Europe and North Europe. The client must meet the following requirements:

    - authenticate with Microsoft Entra ID, without account keys;
    - read with Eventual consistency, because the service tolerates stale data;
    - send requests to West Europe first and to North Europe if West Europe is unavailable.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum écrit un service d'analytique Python qui s'exécute sur une machine virtuelle Azure dotée d'une identité managée. Le compte Azure Cosmos DB for NoSQL utilise Session comme niveau de cohérence par défaut et possède des régions dans West Europe et North Europe. Le client doit respecter les exigences suivantes :

    - s'authentifier avec Microsoft Entra ID, sans clés de compte ;
    - lire avec la cohérence Eventual, car le service accepte des données obsolètes ;
    - envoyer les requêtes d'abord vers West Europe, puis vers North Europe si West Europe n'est pas disponible.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import os
    from azure.identity import DefaultAzureCredential
    from azure.cosmos import CosmosClient

    client = CosmosClient(
        os.environ["COSMOS_ENDPOINT"],
        [[cred]],
        consistency_level=[[level]],
        preferred_locations=[[regions]],
    )
  slots:
    - id: cred
      options:
        - { id: dac, text: DefaultAzureCredential() }
        - { id: key, text: "os.environ[\"COSMOS_KEY\"]" }
        - { id: dacclass, text: DefaultAzureCredential }
    - id: level
      options:
        - { id: strong, text: "\"Strong\"" }
        - { id: none, text: None }
        - { id: eventual, text: "\"Eventual\"" }
    - id: regions
      options:
        - { id: weonly, text: "\"West Europe\"" }
        - { id: weneu, text: "[\"West Europe\", \"North Europe\"]" }
        - { id: neuwe, text: "[\"North Europe\", \"West Europe\"]" }
answer:
  values: { cred: dac, level: eventual, regions: weneu }
explanation:
  correct:
    en: |
      The credential parameter accepts a `TokenCredential` instance, so you pass `DefaultAzureCredential()`, which uses the VM's managed identity. `consistency_level` relaxes the account's consistency for this client; `None` keeps the account level. `preferred_locations` is an ordered list of region names, used in that order.
    fr: |
      Le paramètre credential accepte une instance de `TokenCredential` : vous transmettez `DefaultAzureCredential()`, qui utilise l'identité managée de la machine virtuelle. `consistency_level` assouplit la cohérence du compte pour ce client ; `None` conserve le niveau du compte. `preferred_locations` est une liste ordonnée de noms de régions, utilisés dans cet ordre.
  options:
    key: { en: "An account key doesn't meet the Microsoft Entra ID requirement.", fr: "Une clé de compte ne respecte pas l'exigence Microsoft Entra ID." }
    dacclass: { en: "The class itself isn't a credential; you must pass an instance.", fr: "La classe elle-même n'est pas une information d'identification ; vous devez transmettre une instance." }
    strong: { en: "A client can't make reads stronger than the account's Session level, and the requirement is Eventual.", fr: "Un client ne peut pas rendre les lectures plus fortes que le niveau Session du compte, et l'exigence est Eventual." }
    none: { en: "None uses the account default, Session.", fr: "None utilise la valeur par défaut du compte, Session." }
    neuwe: { en: "The list order is the order of preference, so North Europe would be used first.", fr: "L'ordre de la liste est l'ordre de préférence : North Europe serait utilisée en premier." }
references:
  - title: azure.cosmos.cosmos_client.CosmosClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.cosmos_client.cosmosclient
  - title: Get started with Azure Cosmos DB for NoSQL using Python
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-python-get-started
