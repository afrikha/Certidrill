id: dp420-1c-hpk-large-tenants
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum builds a multi-tenant SaaS application on Azure Cosmos DB for NoSQL. There are 2,000 tenants; most are small, but a few large tenants will store more than 100 GB each. Every item has `tenantId`, `userId` and `id` properties.

    80 percent of the queries filter on `tenantId` and `userId`; the other queries are tenant-wide reports that filter on `tenantId` only. Tenant-wide reports must not be sent to every physical partition, and no tenant must be blocked by a storage limit.

    Which partition key should you configure for the new container?
  fr: |
    Adatum développe une application SaaS multilocataire sur Azure Cosmos DB for NoSQL. Il y a 2 000 locataires ; la plupart sont petits, mais quelques grands locataires stockeront chacun plus de 100 Go. Chaque élément a les propriétés `tenantId`, `userId` et `id`.

    80 % des requêtes filtrent sur `tenantId` et `userId` ; les autres requêtes sont des rapports à l'échelle du locataire qui filtrent uniquement sur `tenantId`. Ces rapports ne doivent pas être envoyés à toutes les partitions physiques, et aucun locataire ne doit être bloqué par une limite de stockage.

    Quelle clé de partition devez-vous configurer pour le nouveau conteneur ?
body:
  options:
    - { id: a, text: { en: "A hierarchical partition key with /tenantId and /userId", fr: "Une clé de partition hiérarchique avec /tenantId et /userId" } }
    - { id: b, text: { en: "A synthetic key that concatenates tenantId and userId", fr: "Une clé synthétique qui concatène tenantId et userId" } }
    - { id: c, text: { en: "/tenantId", fr: "/tenantId" } }
    - { id: d, text: { en: "/userId", fr: "/userId" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With a hierarchical partition key, the logical partition is the full tenantId + userId value, so a large tenant can span several physical partitions and exceed 20 GB. Queries on tenantId and userId target one partition, and queries on tenantId alone are routed only to the physical partitions that hold that tenant.
    fr: |-
      Avec une clé de partition hiérarchique, la partition logique est la valeur complète tenantId + userId : un grand locataire peut s'étendre sur plusieurs partitions physiques et dépasser 20 Go. Les requêtes sur tenantId et userId ciblent une seule partition, et les requêtes sur tenantId seul ne sont routées que vers les partitions physiques qui contiennent ce locataire.
  options:
    c: { en: "A whole tenant would be one logical partition, blocked at 20 GB.", fr: "Un locataire entier formerait une partition logique, bloquée à 20 Go." }
    b: { en: "A concatenated value does not let a filter on tenantId alone be routed: tenant-wide reports would fan out.", fr: "Une valeur concaténée ne permet pas de router un filtre sur tenantId seul : les rapports du locataire seraient diffusés partout." }
    d: { en: "Tenant-wide reports would fan out to all physical partitions because tenantId is not in the key.", fr: "Les rapports du locataire seraient diffusés vers toutes les partitions physiques, car tenantId ne fait pas partie de la clé." }
references:
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
