id: dp420-1a-cfg-setting-match
objective: "1.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is configuring an Azure Cosmos DB for NoSQL account that has a write region in West Europe and a read region in North Europe, and a container named **orders** partitioned on `/customerId`.

    Which setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso configure un compte Azure Cosmos DB for NoSQL qui possède une région d'écriture dans West Europe et une région de lecture dans North Europe, ainsi qu'un conteneur nommé **orders** partitionné sur `/customerId`.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: multiwrite, text: { en: "Multi-region writes (account)", fr: "Écritures multirégions (compte)" } }
    - { id: consistency, text: { en: "Default consistency level (account)", fr: "Niveau de cohérence par défaut (compte)" } }
    - { id: ttl, text: { en: "Default time to live (container)", fr: "Durée de vie par défaut (conteneur)" } }
    - { id: unique, text: { en: "Unique key policy (container)", fr: "Stratégie de clé unique (conteneur)" } }
    - { id: failover, text: { en: "Service-managed failover (account)", fr: "Basculement géré par le service (compte)" } }
    - { id: conflict, text: { en: "Conflict resolution policy (container)", fr: "Stratégie de résolution des conflits (conteneur)" } }
  targets:
    - id: t1
      text: { en: "Orders must also be writable in North Europe", fr: "Les commandes doivent aussi pouvoir être écrites dans North Europe" }
    - id: t2
      text: { en: "Orders must be deleted automatically 90 days after their last update", fr: "Les commandes doivent être supprimées automatiquement 90 jours après leur dernière mise à jour" }
    - id: t3
      text: { en: "A customer must never have two orders with the same orderNumber", fr: "Un client ne doit jamais avoir deux commandes avec le même orderNumber" }
    - id: t4
      text: { en: "Reads in North Europe must never lag the write region by more than 300 seconds", fr: "Les lectures dans North Europe ne doivent jamais avoir plus de 300 secondes de retard sur la région d'écriture" }
answer:
  mapping: { t1: multiwrite, t2: ttl, t3: unique, t4: consistency }
explanation:
  correct:
    en: |
      Multi-region writes make every region of the account writable. A container's default TTL deletes items a set number of seconds after their last modification. A unique key on /orderNumber is enforced within each logical partition, here each customer. The lag bound is set by the account's default consistency level (Bounded staleness with T = 300 seconds).
    fr: |
      Les écritures multirégions rendent toutes les régions du compte accessibles en écriture. La durée de vie par défaut d'un conteneur supprime les éléments un nombre défini de secondes après leur dernière modification. Une clé unique sur /orderNumber s'applique dans chaque partition logique, ici chaque client. La limite de retard se définit par le niveau de cohérence par défaut du compte (Bounded staleness avec T = 300 secondes).
  options:
    failover: { en: "Service-managed failover promotes a read region during an outage; it doesn't make two regions writable or bound the lag.", fr: "Le basculement géré par le service promeut une région de lecture pendant une panne ; il ne rend pas deux régions accessibles en écriture et ne limite pas le retard." }
    conflict: { en: "A conflict resolution policy decides which concurrent write wins in a multi-write account; it doesn't enforce uniqueness.", fr: "Une stratégie de résolution des conflits décide quelle écriture simultanée l'emporte dans un compte multi-écriture ; elle n'impose pas l'unicité." }
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: Unique key constraints in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/unique-keys
