id: dp420-1c-pk-python-scoped-query
objective: "1.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are writing a Python application that uses the azure-cosmos SDK. The application stores orders in a container named **orders**. The most frequent request lists the open orders of one customer.

    You need to create the container so that the most frequent request is served by a single logical partition, and run that request as a single-partition query.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui utilise le SDK azure-cosmos. L'application stocke des commandes dans un conteneur nommé **orders**. La requête la plus fréquente liste les commandes ouvertes d'un client.

    Vous devez créer le conteneur pour que la requête la plus fréquente soit servie par une seule partition logique, et exécuter cette requête comme une requête sur une seule partition.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    container = database.create_container_if_not_exists(
        id="orders",
        partition_key=PartitionKey(path=[[path]]),
    )

    open_orders = container.query_items(
        query="SELECT * FROM c WHERE c.customerId = @id AND c.status = 'open'",
        parameters=[{"name": "@id", "value": customer_id}],
        [[scope]],
    )
  slots:
    - id: path
      options:
        - { id: pcust, text: '"/customerId"' }
        - { id: pplain, text: '"customerId"' }
        - { id: pstatus, text: '"/status"' }
        - { id: pc, text: '"c.customerId"' }
    - id: scope
      options:
        - { id: spk, text: "partition_key=customer_id" }
        - { id: scross, text: "enable_cross_partition_query=True" }
        - { id: spath, text: 'partition_key="/customerId"' }
        - { id: smax, text: "max_item_count=1" }
answer:
  values: { path: pcust, scope: spk }
explanation:
  correct:
    en: |-
      A partition key path starts with a slash and names the property, here `/customerId`. Passing the customer's value in `partition_key` targets the query at that single logical partition; without it, the SDK runs a cross-partition query.
    fr: |-
      Un chemin de clé de partition commence par une barre oblique et nomme la propriété, ici `/customerId`. Passer la valeur du client dans `partition_key` cible la requête sur cette seule partition logique ; sans ce paramètre, le SDK exécute une requête entre partitions.
  options:
    pplain: { en: "A partition key path must start with a slash.", fr: "Un chemin de clé de partition doit commencer par une barre oblique." }
    pstatus: { en: "status has few values and is not the property that identifies the customer.", fr: "status a peu de valeurs et n'est pas la propriété qui identifie le client." }
    pc: { en: "The path uses slash notation, not the query alias.", fr: "Le chemin utilise la notation avec barres obliques, pas l'alias de la requête." }
    scross: { en: "This allows a cross-partition query instead of scoping it to one logical partition.", fr: "Ce paramètre autorise une requête entre partitions au lieu de la limiter à une partition logique." }
    spath: { en: "partition_key expects the value, not the path.", fr: "partition_key attend la valeur, pas le chemin." }
    smax: { en: "max_item_count sets the page size; it does not target a partition.", fr: "max_item_count définit la taille de page ; il ne cible aucune partition." }
references:
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
