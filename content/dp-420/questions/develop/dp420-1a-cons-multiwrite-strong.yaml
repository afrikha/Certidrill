id: dp420-1a-cons-multiwrite-strong
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL account named **cosmos-fab** that is replicated to West Europe and North Europe. Multi-region writes are enabled, and the default consistency level is Session.

    A new settlement service requires linearizable reads: every read must return the most recent committed write, in any region. Write latency can increase.

    What should you do first?
  fr: |
    Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-fab** répliqué dans West Europe et North Europe. Les écritures multirégions sont activées et le niveau de cohérence par défaut est Session.

    Un nouveau service de règlement exige des lectures linéarisables : chaque lecture doit renvoyer la dernière écriture validée, dans n'importe quelle région. La latence d'écriture peut augmenter.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Set the default consistency level to Bounded staleness with the lowest bounds.", fr: "Définir la cohérence par défaut sur Bounded staleness avec les limites les plus basses." } }
    - { id: b, text: { en: "Configure the account with a single write region.", fr: "Configurer le compte avec une seule région d'écriture." } }
    - { id: c, text: { en: "Set ConsistencyLevel to Strong in the service's CosmosClientOptions.", fr: "Définir ConsistencyLevel sur Strong dans les CosmosClientOptions du service." } }
    - { id: d, text: { en: "Set ConsistencyLevel to Strong in the ItemRequestOptions of each read.", fr: "Définir ConsistencyLevel sur Strong dans les ItemRequestOptions de chaque lecture." } }
answer: { optionId: b }
explanation:
  correct:
    en: Strong consistency is the only level that provides linearizability, and it can't be used by an account with multiple write regions. You must first go back to a single write region; you can then set the account's default consistency level to Strong.
    fr: Strong est le seul niveau qui fournit la linéarisabilité, et il ne peut pas être utilisé par un compte doté de plusieurs régions d'écriture. Vous devez d'abord revenir à une seule région d'écriture ; vous pourrez ensuite définir le niveau de cohérence par défaut du compte sur Strong.
  options:
    c: { en: "The client-level setting can only relax the account's consistency; it can't make reads stronger than Session.", fr: "Le paramètre au niveau du client peut uniquement assouplir la cohérence du compte ; il ne peut pas rendre les lectures plus fortes que Session." }
    d: { en: "A request-level ConsistencyLevel can also only relax the account default, never strengthen it.", fr: "Un ConsistencyLevel au niveau de la requête peut lui aussi uniquement assouplir la valeur par défaut du compte, jamais la renforcer." }
    a: { en: "Bounded staleness still allows reads to lag (at least 100,000 writes or 300 seconds in a multi-region account), so reads aren't linearizable.", fr: "Bounded staleness autorise toujours un retard des lectures (au moins 100 000 écritures ou 300 secondes dans un compte multirégion) : les lectures ne sont pas linéarisables." }
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: Manage consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-consistency
