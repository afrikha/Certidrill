id: dp420-1d-python-parallel
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum is building a Python service that projects the changes of an Azure Cosmos DB for NoSQL container named **shipments** into a reporting database. The container has three physical partitions. The service runs as three worker processes.

    The workers must process all the changes of the container in parallel, each change must be processed by only one worker, and each worker must be able to resume after a restart.

    What should you implement?
  fr: |
    Adatum développe un service Python qui projette les modifications d'un conteneur Azure Cosmos DB for NoSQL nommé **shipments** dans une base de données de reporting. Le conteneur compte trois partitions physiques. Le service s'exécute sous forme de trois processus de traitement.

    Les processus doivent traiter toutes les modifications du conteneur en parallèle, chaque modification ne doit être traitée que par un seul processus, et chaque processus doit pouvoir reprendre après un redémarrage.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "A change feed processor in each worker, sharing one lease container", fr: "Un processeur de flux de modification dans chaque processus, avec un conteneur de bail partagé" } }
    - { id: b, text: { en: "The pull model in each worker, reading the whole container and skipping the items handled by other workers", fr: "Le modèle de tirage dans chaque processus, qui lit tout le conteneur et ignore les éléments traités par les autres processus" } }
    - { id: c, text: { en: "The pull model with one feed range from read_feed_ranges per worker and a persisted continuation token", fr: "Le modèle de tirage avec une plage de flux issue de read_feed_ranges par processus et un jeton de continuation persistant" } }
    - { id: d, text: { en: "The pull model in each worker with the partition_key parameter set to the worker number", fr: "Le modèle de tirage dans chaque processus avec le paramètre partition_key défini sur le numéro du processus" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The change feed processor library exists only for .NET and Java, so a Python service uses the pull model. read_feed_ranges returns one feed range per physical partition; giving each worker its own range splits the work without overlap, and saving the continuation token lets a worker resume where it stopped.
    fr: |
      La bibliothèque du processeur de flux de modification n'existe que pour .NET et Java ; un service Python utilise donc le modèle de tirage. read_feed_ranges renvoie une plage de flux par partition physique ; attribuer à chaque processus sa propre plage répartit le travail sans chevauchement, et enregistrer le jeton de continuation permet à un processus de reprendre là où il s'est arrêté.
  options:
    a: { en: "The Python SDK does not include the change feed processor.", fr: "Le SDK Python n'inclut pas le processeur de flux de modification." }
    b: { en: "Every worker would read every change, which triples the RU consumption and needs extra coordination.", fr: "Chaque processus lirait chaque modification, ce qui triple la consommation de RU et exige une coordination supplémentaire." }
    d: { en: "partition_key reads the changes of one logical partition key value, not one third of the container.", fr: "partition_key lit les modifications d'une seule valeur de clé de partition logique, pas d'un tiers du conteneur." }
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
