id: dp420-1a-sdk-singleton
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an ASP.NET Core API that reads from Azure Cosmos DB for NoSQL by using the .NET SDK v3 in Direct mode. Each controller action creates a new `CosmosClient`, runs one point read, and disposes the client. Under load, latency is high and the host runs out of ephemeral ports.

    You need to fix the problem by following the SDK guidance.

    What should you do?
  fr: |
    Fabrikam dispose d'une API ASP.NET Core qui lit Azure Cosmos DB for NoSQL au moyen du SDK .NET v3 en mode Direct. Chaque action de contrôleur crée un nouveau `CosmosClient`, effectue une lecture ponctuelle, puis libère le client. Sous charge, la latence est élevée et l'hôte épuise ses ports éphémères.

    Vous devez corriger le problème en suivant les recommandations du SDK.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Use a single CosmosClient instance for the lifetime of the application.", fr: "Utiliser une seule instance de CosmosClient pendant toute la durée de vie de l'application." } }
    - { id: b, text: { en: "Keep one client per request and switch the connection mode to Gateway.", fr: "Conserver un client par requête et passer le mode de connexion à Gateway." } }
    - { id: c, text: { en: "Keep one client per request and increase MaxRetryAttemptsOnRateLimitedRequests.", fr: "Conserver un client par requête et augmenter MaxRetryAttemptsOnRateLimitedRequests." } }
    - { id: d, text: { en: "Keep one client per request and replace point reads with queries.", fr: "Conserver un client par requête et remplacer les lectures ponctuelles par des requêtes." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `CosmosClient` is thread-safe and manages connections and address caches. The SDK guidance is to keep a single instance per account for the lifetime of the application, for example registered as a singleton in dependency injection, instead of creating and disposing a client for each request.
    fr: |
      `CosmosClient` est thread-safe et gère les connexions et les caches d'adresses. Les recommandations du SDK consistent à conserver une seule instance par compte pendant toute la durée de vie de l'application, par exemple inscrite comme singleton dans l'injection de dépendances, au lieu de créer et de libérer un client pour chaque requête.
  options:
    b: { en: "Gateway mode may use fewer connections, but creating a client per request still repeats the initialization work on every call.", fr: "Le mode Gateway peut utiliser moins de connexions, mais créer un client par requête répète toujours le travail d'initialisation à chaque appel." }
    c: { en: "This setting controls retries on HTTP 429 responses; it doesn't address connection churn.", fr: "Ce paramètre contrôle les nouvelles tentatives sur les réponses HTTP 429 ; il ne règle pas le renouvellement constant des connexions." }
    d: { en: "Queries cost more RUs than point reads and don't change how connections are managed.", fr: "Les requêtes coûtent plus de RU que les lectures ponctuelles et ne changent pas la gestion des connexions." }
references:
  - title: Performance tips for Azure Cosmos DB and .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
  - title: CosmosClient Class (Microsoft.Azure.Cosmos)
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclient
