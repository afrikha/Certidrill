id: dp420-1a-mgmt-replace-resets
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL container named **events** partitioned on `/deviceId`. The container was created with `default_ttl=86400`, so items expire one day after their last modification.

    A developer adds a composite index by running the following Python code:

    ```python
    database.replace_container(
        container="events",
        partition_key=PartitionKey(path="/deviceId"),
        indexing_policy=new_policy,
    )
    ```

    You need to determine how the call affects the expiration of items.

    What is the effect of the call?
  fr: |
    Litware dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **events**, partitionné sur `/deviceId`. Le conteneur a été créé avec `default_ttl=86400` : les éléments expirent un jour après leur dernière modification.

    Un développeur ajoute un index composite en exécutant le code Python suivant :

    ```python
    database.replace_container(
        container="events",
        partition_key=PartitionKey(path="/deviceId"),
        indexing_policy=new_policy,
    )
    ```

    Vous devez déterminer l'effet de l'appel sur l'expiration des éléments.

    Quel est l'effet de l'appel ?
body:
  options:
    - { id: a, text: { en: "All existing items are deleted, because the container is recreated with the new policy.", fr: "Tous les éléments existants sont supprimés, car le conteneur est recréé avec la nouvelle stratégie." } }
    - { id: b, text: { en: "The default TTL is reset, so items no longer expire by default.", fr: "La durée de vie par défaut est réinitialisée : les éléments n'expirent plus par défaut." } }
    - { id: c, text: { en: "The default TTL of 86,400 seconds is kept, because only the indexing policy is passed.", fr: "La durée de vie par défaut de 86 400 secondes est conservée, car seule la stratégie d'indexation est transmise." } }
    - { id: d, text: { en: "The call fails, because default_ttl is a required parameter of replace_container.", fr: "L'appel échoue, car default_ttl est un paramètre obligatoire de replace_container." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `replace_container` resets the container's properties: any property that isn't specified returns to its default value, and when `default_ttl` isn't specified, items don't expire. The developer must pass `default_ttl=86400` again, together with the new indexing policy.
    fr: |
      `replace_container` réinitialise les propriétés du conteneur : toute propriété non spécifiée revient à sa valeur par défaut, et lorsque `default_ttl` n'est pas spécifié, les éléments n'expirent pas. Le développeur doit transmettre de nouveau `default_ttl=86400` avec la nouvelle stratégie d'indexation.
  options:
    c: { en: "Properties that aren't passed to replace_container aren't preserved; they are reset to their defaults.", fr: "Les propriétés non transmises à replace_container ne sont pas conservées ; elles reprennent leur valeur par défaut." }
    d: { en: "Only the container and the partition key are required; default_ttl is optional.", fr: "Seuls le conteneur et la clé de partition sont obligatoires ; default_ttl est facultatif." }
    a: { en: "Replacing the properties updates the container in place; it doesn't recreate it or delete its items.", fr: "Le remplacement des propriétés met à jour le conteneur sur place ; il ne le recrée pas et ne supprime pas ses éléments." }
references:
  - title: azure.cosmos.database.DatabaseProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.database.databaseproxy
