id: dp420-1d-shared-lease-units
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has two .NET services that use the change feed processor on the same Azure Cosmos DB for NoSQL container named **orders**:

    - **Mailer** sends a confirmation email for each order.
    - **Indexer** updates a search index for each order.

    Both services must receive every change of the orders container. To limit costs, both services must use the same lease container named **leases**.

    How should you configure the processors?
  fr: |
    Proseware dispose de deux services .NET qui utilisent le processeur de flux de modification sur le même conteneur Azure Cosmos DB for NoSQL nommé **orders** :

    - **Mailer** envoie un e-mail de confirmation pour chaque commande.
    - **Indexer** met à jour un index de recherche pour chaque commande.

    Les deux services doivent recevoir chaque modification du conteneur orders. Pour limiter les coûts, les deux services doivent utiliser le même conteneur de bail nommé **leases**.

    Comment devez-vous configurer les processeurs ?
body:
  options:
    - { id: a, text: { en: "Use the same processorName in both services and a different instance name on each instance.", fr: "Utiliser le même processorName dans les deux services et un nom d'instance différent sur chaque instance." } }
    - { id: b, text: { en: "Use a different processorName in each service and a unique instance name on each instance.", fr: "Utiliser un processorName différent dans chaque service et un nom d'instance unique sur chaque instance." } }
    - { id: c, text: { en: "Use the same processorName and the same instance name in both services.", fr: "Utiliser le même processorName et le même nom d'instance dans les deux services." } }
    - { id: d, text: { en: "Use the same processorName in both services and start Indexer with a later start time.", fr: "Utiliser le même processorName dans les deux services et démarrer Indexer avec une heure de début plus tardive." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Several deployment units can share a lease container when each one watches a different monitored container or uses a different processorName; each unit then keeps independent lease state and receives every change. Within a unit, every instance needs a different instance name. Check that the lease container's throughput is enough for both units.
    fr: |
      Plusieurs unités de déploiement peuvent partager un conteneur de bail lorsque chacune surveille un conteneur différent ou utilise un processorName différent ; chaque unité conserve alors un état de bail indépendant et reçoit chaque modification. Au sein d'une unité, chaque instance doit avoir un nom d'instance différent. Vérifiez que le débit du conteneur de bail suffit aux deux unités.
  options:
    a: { en: "With the same processorName and lease container, the instances of both services form one deployment unit and share the leases, so each change reaches only one service.", fr: "Avec le même processorName et le même conteneur de bail, les instances des deux services forment une seule unité de déploiement et se partagent les baux : chaque modification n'atteint qu'un seul service." }
    c: { en: "The services would compete for the same leases, and duplicate instance names prevent correct lease ownership.", fr: "Les services se disputeraient les mêmes baux, et des noms d'instance identiques empêchent une propriété correcte des baux." }
    d: { en: "The start time only applies when the leases are first initialized and does not separate the two flows.", fr: "L'heure de début ne s'applique qu'à la première initialisation des baux et ne sépare pas les deux flux." }
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
