id: dp420-1e-kit-capabilities
objective: "1.5.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to give its developers the Azure Cosmos DB Agent Kit in their AI coding assistants. The developers also want their assistants to read current Microsoft documentation. The production data is in an Azure Cosmos DB for NoSQL account named **cosmos-prod**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de fournir Azure Cosmos DB Agent Kit aux assistants de codage IA de ses développeurs. Les développeurs souhaitent aussi que leurs assistants lisent la documentation Microsoft à jour. Les données de production se trouvent dans un compte Azure Cosmos DB for NoSQL nommé **cosmos-prod**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After the Agent Kit is installed, an assistant can query the items in cosmos-prod to check its recommendations.
        fr: |
          Une fois Agent Kit installé, un assistant peut interroger les éléments de cosmos-prod pour vérifier ses recommandations.
    - id: s2
      text:
        en: |
          A developer can install the Agent Kit and get code reviews without an Azure subscription.
        fr: |
          Un développeur peut installer Agent Kit et obtenir des révisions de code sans abonnement Azure.
    - id: s3
      text:
        en: |
          Connecting an assistant to the Microsoft Learn MCP server lets it search official documentation.
        fr: |
          Connecter un assistant au serveur MCP Microsoft Learn lui permet de rechercher dans la documentation officielle.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Agent skills provide guidance only. Installing the kit does not authenticate the assistant to Azure or grant it access to a database, and no Azure subscription is needed to install the skills and review code. The Microsoft Learn MCP server is a separate capability that searches and retrieves documentation, without access to your data; querying cosmos-prod would require separately configured tools and permissions.
    fr: |
      Les compétences d'agent ne fournissent que des recommandations. L'installation du kit n'authentifie pas l'assistant auprès d'Azure et ne lui donne accès à aucune base de données, et aucun abonnement Azure n'est nécessaire pour installer les compétences et réviser du code. Le serveur MCP Microsoft Learn est une fonctionnalité distincte qui recherche et récupère la documentation, sans accès à vos données ; interroger cosmos-prod nécessiterait des outils et des autorisations configurés séparément.
references:
  - title: Supported AI coding assistants for Azure Cosmos DB Agent Kit - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/compatibility
  - title: Azure Cosmos DB Agent Kit overview - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/overview
