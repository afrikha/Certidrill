id: dp420-1b-point-read-ru
objective: "1.2.2"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Contoso estimates the throughput of three workloads on Azure Cosmos DB for NoSQL. Each workload performs point reads with the account's default consistency level. The items are indexed with the default indexing policy.

    What is the approximate RU charge of one point read in each workload? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso estime le débit de trois charges de travail sur Azure Cosmos DB for NoSQL. Chaque charge de travail effectue des lectures ponctuelles avec le niveau de cohérence par défaut du compte. Les éléments sont indexés avec la stratégie d'indexation par défaut.

    Quelle est la charge approximative en RU d'une lecture ponctuelle dans chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - Item of 1 KB, account with Session consistency: [[s1]] RU
      - Item of 100 KB, account with Session consistency: [[s2]] RU
      - Item of 1 KB, account with Bounded Staleness consistency: [[s3]] RU
    fr: |
      - Élément de 1 Ko, compte en cohérence Session : [[s1]] RU
      - Élément de 100 Ko, compte en cohérence Session : [[s2]] RU
      - Élément de 1 Ko, compte en cohérence Bounded Staleness : [[s3]] RU
  slots:
    - id: s1
      options:
        - { id: v1, text: "1" }
        - { id: v2, text: "2" }
        - { id: v5, text: "5.5" }
        - { id: v10, text: "10" }
    - id: s2
      options:
        - { id: v1, text: "1" }
        - { id: v10, text: "10" }
        - { id: v20, text: "20" }
        - { id: v100, text: "100" }
    - id: s3
      options:
        - { id: v1, text: "1" }
        - { id: v2, text: "2" }
        - { id: v4, text: "4" }
        - { id: v10, text: "10" }
answer:
  values: { s1: v1, s2: v10, s3: v2 }
explanation:
  correct:
    en: "A point read of a 1-KB item costs 1 RU, and a point read of a 100-KB item costs 10 RUs; item size is what drives the cost. With Strong or Bounded Staleness consistency, the RU cost of every read is doubled, so the 1-KB read costs 2 RUs."
    fr: "Une lecture ponctuelle d'un élément de 1 Ko coûte 1 RU, et celle d'un élément de 100 Ko coûte 10 RU ; c'est la taille de l'élément qui détermine le coût. Avec la cohérence Strong ou Bounded Staleness, le coût en RU de chaque lecture est doublé : la lecture de 1 Ko coûte donc 2 RU."
  options:
    v5: { en: "About 5.5 RUs is the cost of inserting a 1-KB item without indexing, not of reading it.", fr: "Environ 5,5 RU correspond au coût d'insertion d'un élément de 1 Ko sans indexation, pas à sa lecture." }
references:
  - title: Optimize Request Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
