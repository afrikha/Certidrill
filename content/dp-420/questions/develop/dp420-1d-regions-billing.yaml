id: dp420-1d-regions-billing
objective: "1.3.8"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    An Azure Cosmos DB for NoSQL account has one write region and two read regions. It contains one container with 15,000 RU/s of standard (manual) throughput and no other databases or containers.

    You need to estimate the provisioned throughput that is billed for each hour.

    What should you use in the estimate?
  fr: |
    Un compte Azure Cosmos DB for NoSQL dispose d'une région d'écriture et de deux régions de lecture. Il contient un conteneur avec un débit standard (manuel) de 15 000 RU/s et aucune autre base de données ni aucun autre conteneur.

    Vous devez estimer le débit approvisionné facturé pour chaque heure.

    Quelle valeur devez-vous utiliser dans l'estimation ?
body:
  options:
    - { id: a, text: "15,000 RU/s" }
    - { id: b, text: "30,000 RU/s" }
    - { id: c, text: "45,000 RU/s" }
    - { id: d, text: "60,000 RU/s" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The throughput configured on databases and containers is reserved in every region associated with the account. With T RU/s configured and N regions, the account is billed for T × N RU/s each hour, here 15,000 × 3 = 45,000 RU/s. Storage is also billed in each region.
    fr: |
      Le débit configuré sur les bases de données et les conteneurs est réservé dans chaque région associée au compte. Avec T RU/s configurées et N régions, le compte est facturé T × N RU/s chaque heure, ici 15 000 × 3 = 45 000 RU/s. Le stockage est lui aussi facturé dans chaque région.
  options:
    a: { en: "Read regions also hold the provisioned throughput and are billed.", fr: "Les régions de lecture disposent elles aussi du débit approvisionné et sont facturées." }
    b: { en: "This counts only two of the three regions.", fr: "Ce calcul ne compte que deux des trois régions." }
    d: { en: "There are three regions, not four.", fr: "Il y a trois régions, pas quatre." }
references:
  - title: Optimize Cost for Multi-Region Deployments - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-regions
