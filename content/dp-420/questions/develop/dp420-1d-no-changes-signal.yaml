id: dp420-1d-no-changes-signal
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You read the change feed of an Azure Cosmos DB for NoSQL container by using a `FeedIterator` in the .NET SDK. You want the code to pause only when there are currently no new changes to read.

    Which condition should the code check?
  fr: |
    Vous lisez le flux de modification d'un conteneur Azure Cosmos DB for NoSQL avec un `FeedIterator` du SDK .NET. Vous voulez que le code ne fasse une pause que lorsqu'il n'y a actuellement aucune nouvelle modification à lire.

    Quelle condition le code doit-il vérifier ?
body:
  options:
    - { id: a, text: { en: "The response has the status code 200 (OK) and contains zero items.", fr: "La réponse a le code d'état 200 (OK) et contient zéro élément." } }
    - { id: b, text: { en: "The HasMoreResults property of the iterator is false.", fr: "La propriété HasMoreResults de l'itérateur vaut false." } }
    - { id: c, text: { en: "The response has the status code 304 (NotModified).", fr: "La réponse a le code d'état 304 (NotModified)." } }
    - { id: d, text: { en: "The ContinuationToken property of the response is null.", fr: "La propriété ContinuationToken de la réponse est null." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The pull model signals that no new changes are available with an HTTP 304 NotModified response. The code should then wait and poll again, keeping the same iterator or its continuation token.
    fr: |
      Le modèle de tirage signale qu'aucune nouvelle modification n'est disponible par une réponse HTTP 304 NotModified. Le code doit alors attendre puis interroger de nouveau, en conservant le même itérateur ou son jeton de continuation.
  options:
    a: { en: "An empty 200 response does not mean the end of the feed; more changes can still be available.", fr: "Une réponse 200 vide ne signifie pas la fin du flux ; d'autres modifications peuvent encore être disponibles." }
    b: { en: "HasMoreResults is always true for a change feed iterator because the feed includes all future changes.", fr: "HasMoreResults vaut toujours true pour un itérateur de flux de modification, car le flux inclut toutes les modifications futures." }
    d: { en: "The response keeps returning a continuation token so that reading can resume later.", fr: "La réponse continue de renvoyer un jeton de continuation pour que la lecture puisse reprendre plus tard." }
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
