id: dp420-1d-id-key-queries
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind runs a product catalog in an Azure Cosmos DB for NoSQL container named **products**. The container is partitioned by `/id`, stores 300 GB of data and has 60,000 RU/s of throughput.

    Almost all requests are queries that filter on `categoryId`. There are 12,000 categories, and the largest category holds less than 1 GB of data. The queries consume far more RUs than expected.

    You need to reduce the RU charge of these queries.

    What should you do?
  fr: |
    Northwind exploite un catalogue de produits dans un conteneur Azure Cosmos DB for NoSQL nommé **products**. Le conteneur est partitionné par `/id`, stocke 300 Go de données et dispose d'un débit de 60 000 RU/s.

    Presque toutes les requêtes filtrent sur `categoryId`. Il existe 12 000 catégories, et la plus grande contient moins de 1 Go de données. Les requêtes consomment beaucoup plus de RU que prévu.

    Vous devez réduire la charge en RU de ces requêtes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Move the data to a new container partitioned by /categoryId.", fr: "Déplacer les données vers un nouveau conteneur partitionné par /categoryId." } }
    - { id: b, text: { en: "Add a composite index on categoryId and id to the indexing policy.", fr: "Ajouter un index composite sur categoryId et id à la stratégie d'indexation." } }
    - { id: c, text: { en: "Increase the throughput of the products container to 100,000 RU/s.", fr: "Augmenter le débit du conteneur products à 100 000 RU/s." } }
    - { id: d, text: { en: "Replace the queries with point reads that use categoryId as the item id.", fr: "Remplacer les requêtes par des lectures ponctuelles qui utilisent categoryId comme id d'élément." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With `/id` as the partition key, a filter on any other property is a cross-partition query that checks every physical partition, and a 300 GB container has many of them. For a large, read-heavy container, the partition key should be the property used in the equality filter of most queries; categoryId has high cardinality and small partitions. The partition key cannot be changed in place, so the data must move to a new container.
    fr: |
      Avec `/id` comme clé de partition, un filtre sur toute autre propriété est une requête entre partitions qui interroge chaque partition physique, et un conteneur de 300 Go en compte beaucoup. Pour un grand conteneur dominé par les lectures, la clé de partition doit être la propriété utilisée dans le filtre d'égalité de la plupart des requêtes ; categoryId présente une cardinalité élevée et des partitions petites. La clé de partition ne peut pas être modifiée sur place : les données doivent être déplacées vers un nouveau conteneur.
  options:
    b: { en: "An index makes the filter efficient inside each partition, but the query still fans out to all physical partitions.", fr: "Un index rend le filtre efficace dans chaque partition, mais la requête est toujours distribuée à toutes les partitions physiques." }
    c: { en: "More RU/s reduces throttling but does not lower the RU charge of each query.", fr: "Davantage de RU/s réduit la limitation du débit mais ne diminue pas la charge en RU de chaque requête." }
    d: { en: "A category contains many items; a point read returns one item identified by its id and partition key.", fr: "Une catégorie contient de nombreux éléments ; une lecture ponctuelle renvoie un seul élément identifié par son id et sa clé de partition." }
references:
  - title: Partitioning and horizontal scaling - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning
