id: dp420-1c-model-statements
objective: "1.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware is designing the data model of an order management application on Azure Cosmos DB for NoSQL. Orders, order lines and shipment items will be stored in one container partitioned by `/orderId`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit le modèle de données d'une application de gestion des commandes sur Azure Cosmos DB for NoSQL. Les commandes, les lignes de commande et les expéditions seront stockées dans un même conteneur partitionné par `/orderId`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Azure Cosmos DB rejects an order line whose orderId does not match an existing order item.
        fr: |-
          Azure Cosmos DB rejette une ligne de commande dont l'orderId ne correspond à aucun élément de commande existant.
    - id: s2
      text:
        en: |-
          An order item and its shipment items can be stored in the same logical partition even though they have different properties.
        fr: |-
          Un élément de commande et ses éléments d'expédition peuvent être stockés dans la même partition logique, même s'ils ont des propriétés différentes.
    - id: s3
      text:
        en: |-
          The JSON representation of a single item can be up to 2 MB.
        fr: |-
          La représentation JSON d'un élément peut atteindre 2 Mo.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      Azure Cosmos DB does not enforce relationships between items; references are "weak" and must be validated by the application. The database is schema-agnostic, so items of different shapes, told apart by a type property, can share a container and a logical partition. The maximum item size is 2 MB (UTF-8 length of the JSON representation).
    fr: |-
      Azure Cosmos DB n'impose pas de relations entre les éléments ; les références sont « faibles » et doivent être validées par l'application. La base de données ne dépend d'aucun schéma : des éléments de formes différentes, distingués par une propriété de type, peuvent partager un conteneur et une partition logique. La taille maximale d'un élément est de 2 Mo (longueur UTF-8 de sa représentation JSON).
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
  - title: Azure Cosmos DB service quotas and default limits
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/concepts-limits
