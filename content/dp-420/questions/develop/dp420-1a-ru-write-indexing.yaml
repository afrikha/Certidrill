id: dp420-1a-ru-write-indexing
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware ingests telemetry into an Azure Cosmos DB for NoSQL container that uses the default indexing policy. Each item has about 200 properties, and the application writes 4,000 items per second. The only query filters on `/deviceId` and on a range of `/timestamp` values.

    The write RU charge is higher than budgeted. You need to minimize the RU charge of the writes while keeping the query efficient.

    What should you do?
  fr: |
    Litware ingère des données de télémétrie dans un conteneur Azure Cosmos DB for NoSQL qui utilise la stratégie d'indexation par défaut. Chaque élément comporte environ 200 propriétés, et l'application écrit 4 000 éléments par seconde. La seule requête filtre sur `/deviceId` et sur une plage de valeurs de `/timestamp`.

    La charge en RU des écritures dépasse le budget. Vous devez réduire au minimum la charge en RU des écritures tout en conservant une requête efficace.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the default consistency level of the account to Eventual.", fr: "Changer le niveau de cohérence par défaut du compte en Eventual." } }
    - { id: b, text: { en: "Include only /deviceId/? and /timestamp/? in the indexing policy and exclude /*.", fr: "Inclure uniquement /deviceId/? et /timestamp/? dans la stratégie d'indexation et exclure /*." } }
    - { id: c, text: { en: "Set the indexing mode of the container to none.", fr: "Définir le mode d'indexation du conteneur sur none." } }
    - { id: d, text: { en: "Set EnableContentResponseOnWrite to false in the client options.", fr: "Définir EnableContentResponseOnWrite sur false dans les options du client." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With the default policy, every property is indexed, so the write charge grows with the number of properties. Indexing only the two paths that the query filters on removes most of the index updates on each write and keeps the query served by the index.
    fr: |
      Avec la stratégie par défaut, chaque propriété est indexée : la charge d'écriture augmente avec le nombre de propriétés. N'indexer que les deux chemins sur lesquels la requête filtre supprime la plupart des mises à jour d'index à chaque écriture et permet à l'index de continuer à servir la requête.
  options:
    c: { en: "With indexing disabled, writes are cheapest, but the query would have to scan the container, which isn't efficient.", fr: "Sans indexation, les écritures coûtent le moins cher, mais la requête devrait parcourir tout le conteneur, ce qui n'est pas efficace." }
    d: { en: "This setting removes the item body from write responses to save bandwidth and client CPU; the RU charge still depends on item size and indexing.", fr: "Ce paramètre supprime le corps de l'élément des réponses d'écriture pour économiser la bande passante et le processeur du client ; la charge en RU dépend toujours de la taille de l'élément et de l'indexation." }
    a: { en: "The RU cost of a write is the same at every consistency level.", fr: "Le coût en RU d'une écriture est le même à tous les niveaux de cohérence." }
references:
  - title: Optimize request cost in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
