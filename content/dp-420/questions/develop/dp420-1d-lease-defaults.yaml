id: dp420-1d-lease-defaults
objective: "1.4.3"
type: dragdrop
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You are tuning the advanced lease configuration of a change feed processor in a .NET application. Before changing anything, you document the default values of the lease settings.

    What is the default value of each setting? To answer, drag the appropriate values to the correct settings. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajustez la configuration avancée des baux d'un processeur de flux de modification dans une application .NET. Avant toute modification, vous documentez les valeurs par défaut des paramètres de bail.

    Quelle est la valeur par défaut de chaque paramètre ? Pour répondre, faites glisser les valeurs appropriées vers les paramètres correspondants. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: v5, text: { en: "5 seconds", fr: "5 secondes" } }
    - { id: v13, text: { en: "13 seconds", fr: "13 secondes" } }
    - { id: v17, text: { en: "17 seconds", fr: "17 secondes" } }
    - { id: v30, text: { en: "30 seconds", fr: "30 secondes" } }
    - { id: v60, text: { en: "60 seconds", fr: "60 secondes" } }
  targets:
    - id: acquire
      text: { en: "Lease acquire: how often a host checks the lease store to acquire leases", fr: "Acquisition des baux : fréquence à laquelle un hôte consulte le magasin de baux pour acquérir des baux" }
    - id: renew
      text: { en: "Lease renewal: how often a host renews the leases it owns", fr: "Renouvellement des baux : fréquence à laquelle un hôte renouvelle les baux qu'il détient" }
    - id: expire
      text: { en: "Lease expiration: how long a lease can go without renewal before another host acquires it", fr: "Expiration des baux : durée pendant laquelle un bail peut rester sans renouvellement avant qu'un autre hôte l'acquière" }
answer:
  mapping: { acquire: v17, renew: v13, expire: v60 }
explanation:
  correct:
    en: |
      By default, a host runs the lease acquisition query every 17 seconds, renews its leases every 13 seconds, and a lease expires after 60 seconds without renewal. Lowering any of these values speeds up rebalancing or recovery but increases RU consumption on the lease container, and the expiration must never be lower than the renewal interval.
    fr: |
      Par défaut, un hôte exécute la requête d'acquisition des baux toutes les 17 secondes, renouvelle ses baux toutes les 13 secondes, et un bail expire après 60 secondes sans renouvellement. Abaisser l'une de ces valeurs accélère le rééquilibrage ou la reprise, mais augmente la consommation de RU sur le conteneur de bail, et l'expiration ne doit jamais être inférieure à l'intervalle de renouvellement.
  options:
    v5: { en: "Five seconds is the default server-side request timeout, not a lease setting.", fr: "Cinq secondes correspondent au délai d'expiration par défaut des requêtes côté serveur, pas à un paramètre de bail." }
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
