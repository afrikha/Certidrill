id: dp420-1c-pk-write-heavy-id
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove ingests audit events into an Azure Cosmos DB for NoSQL container at 40,000 writes per second. Each event has the properties `id` (a GUID), `eventDate`, `sourceSystem` (15 values; one system produces 60 percent of the events) and `severity` (4 values).

    The application never queries the container. It only reads an event by its `id` when an investigator opens a link.

    You need to choose a partition key that distributes the writes evenly and keeps reads as cheap as possible.

    Which partition key should you use?
  fr: |
    Woodgrove ingère des événements d'audit dans un conteneur Azure Cosmos DB for NoSQL à raison de 40 000 écritures par seconde. Chaque événement a les propriétés `id` (un GUID), `eventDate`, `sourceSystem` (15 valeurs ; un système produit 60 % des événements) et `severity` (4 valeurs).

    L'application n'interroge jamais le conteneur. Elle lit seulement un événement par son `id` lorsqu'un enquêteur ouvre un lien.

    Vous devez choisir une clé de partition qui répartit uniformément les écritures et rend les lectures aussi économiques que possible.

    Quelle clé de partition devez-vous utiliser ?
body:
  options:
    - { id: a, text: /eventDate }
    - { id: b, text: /sourceSystem }
    - { id: c, text: /severity }
    - { id: d, text: /id }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      For a write-heavy container whose items are read individually, the item id is a good partition key. It has the highest possible cardinality, spreads writes and storage evenly, and each read is a point read that supplies the id as both the item id and the partition key value.
    fr: |-
      Pour un conteneur à dominante écriture dont les éléments sont lus individuellement, l'id de l'élément est une bonne clé de partition. Sa cardinalité est maximale, il répartit uniformément les écritures et le stockage, et chaque lecture est une lecture ponctuelle qui fournit l'id comme id d'élément et comme valeur de clé de partition.
  options:
    a:
      en: |-
        All the events of the current day share one value, so every write targets the same logical partition, which is limited to 10,000 RU/s and 20 GB.
      fr: |-
        Tous les événements du jour partagent une même valeur : chaque écriture cible la même partition logique, limitée à 10 000 RU/s et 20 Go.
    b:
      en: |-
        The dominant source system would receive 60 percent of the writes, which creates a hot partition.
      fr: |-
        Le système source dominant recevrait 60 % des écritures, ce qui crée une partition chaude.
    c:
      en: |-
        Four values are far too few to distribute 40,000 writes per second.
      fr: |-
        Quatre valeurs sont bien trop peu nombreuses pour répartir 40 000 écritures par seconde.
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
