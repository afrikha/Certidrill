id: dp420-1c-embed-conditions
objective: "1.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are designing the data model of an application on Azure Cosmos DB for NoSQL. For each relationship, you must decide whether to embed the related data in the parent item or to store it in separate items.

    Which two conditions favor embedding the related data in the parent item?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez le modèle de données d'une application sur Azure Cosmos DB for NoSQL. Pour chaque relation, vous devez décider d'incorporer les données associées dans l'élément parent ou de les stocker dans des éléments distincts.

    Quelles sont les deux conditions qui favorisent l'incorporation des données associées dans l'élément parent ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The related data is shared by many parents and changes frequently.", fr: "Les données associées sont partagées par de nombreux parents et changent souvent." } }
    - { id: b, text: { en: "The related data is contained by the parent, like the addresses of a person.", fr: "Les données associées sont contenues dans le parent, comme les adresses d'une personne." } }
    - { id: c, text: { en: "The number of related entries can grow without any limit.", fr: "Le nombre d'entrées associées peut augmenter sans aucune limite." } }
    - { id: d, text: { en: "The related data is bounded and usually queried together with the parent.", fr: "Les données associées sont bornées et généralement interrogées avec le parent." } }
    - { id: e, text: { en: "The relationship is many-to-many and each side is queried on its own.", fr: "La relation est de type plusieurs-à-plusieurs et chaque côté est interrogé séparément." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Embedding fits contained and one-to-few relationships whose data is bounded, changes infrequently and is read together with the parent. A denormalized item then returns everything in a single read.
    fr: |-
      L'incorporation convient aux relations contenues et de type un-à-quelques dont les données sont bornées, changent peu et sont lues avec le parent. Un élément dénormalisé renvoie alors tout en une seule lecture.
  options:
    a: { en: "Shared, frequently changing data should be referenced, or every change must update many items.", fr: "Des données partagées et qui changent souvent doivent être référencées, sinon chaque changement doit mettre à jour de nombreux éléments." }
    c: { en: "Unbounded data should be referenced; an embedded array would grow toward the 2 MB item limit.", fr: "Des données non bornées doivent être référencées ; un tableau incorporé grossirait jusqu'à la limite de 2 Mo par élément." }
    e: { en: "Many-to-many relationships are modeled with references, possibly with a few denormalized properties.", fr: "Les relations plusieurs-à-plusieurs se modélisent avec des références, éventuellement avec quelques propriétés dénormalisées." }
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
