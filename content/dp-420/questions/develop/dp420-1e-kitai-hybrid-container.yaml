id: dp420-1e-kitai-hybrid-container
objective: "1.5.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip builds a travel-planning agent on Azure Cosmos DB for NoSQL, with vector search enabled on the account. Your AI coding assistant, which has the Azure Cosmos DB Agent Kit installed, generates a container definition for the **destinations** container. The definition already contains a vector embedding policy and a `diskANN` vector index on `/embedding`.

    The agent must run hybrid search queries that combine `VectorDistance` with `FullTextScore` on the `/overview` property, and the full-text part must use an index rather than consume extra request units.

    Which two settings should you add to the container definition? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip crée un agent de planification de voyages sur Azure Cosmos DB for NoSQL, avec la recherche vectorielle activée sur le compte. Votre assistant de codage IA, sur lequel Azure Cosmos DB Agent Kit est installé, génère une définition pour le conteneur **destinations**. La définition contient déjà une stratégie d'incorporation vectorielle et un index vectoriel `diskANN` sur `/embedding`.

    L'agent doit exécuter des requêtes de recherche hybride qui combinent `VectorDistance` et `FullTextScore` sur la propriété `/overview`, et la partie texte intégral doit utiliser un index plutôt que de consommer des unités de requête supplémentaires.

    Quels sont les deux paramètres à ajouter à la définition du conteneur ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A full-text policy that lists /overview in fullTextPaths with its language", fr: "Une stratégie de texte intégral qui liste /overview dans fullTextPaths avec sa langue" } }
    - { id: b, text: { en: "A composite index on /overview and /embedding in the indexing policy", fr: "Un index composite sur /overview et /embedding dans la stratégie d'indexation" } }
    - { id: c, text: { en: "A fullTextIndexes entry for /overview in the indexing policy", fr: "Une entrée fullTextIndexes pour /overview dans la stratégie d'indexation" } }
    - { id: d, text: { en: "A unique key policy on /overview", fr: "Une stratégie de clé unique sur /overview" } }
    - { id: e, text: { en: "A spatialIndexes entry for /overview in the indexing policy", fr: "Une entrée spatialIndexes pour /overview dans la stratégie d'indexation" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      For hybrid search, the container needs a vector policy, a full-text policy, a vector index and a full-text index. The full-text policy declares the text paths and their language, and the fullTextIndexes entry in the indexing policy indexes them; without them, full-text functions do not use the full-text index and can consume more RUs.
    fr: |
      Pour la recherche hybride, le conteneur a besoin d'une stratégie vectorielle, d'une stratégie de texte intégral, d'un index vectoriel et d'un index de texte intégral. La stratégie de texte intégral déclare les chemins de texte et leur langue, et l'entrée fullTextIndexes de la stratégie d'indexation les indexe ; sans elles, les fonctions de texte intégral n'utilisent pas l'index de texte intégral et peuvent consommer davantage de RU.
  options:
    b:
      en: |
        Composite indexes serve ORDER BY and filters on several properties; they are not used for BM25 scoring.
      fr: |
        Les index composites servent les ORDER BY et filtres sur plusieurs propriétés ; ils ne sont pas utilisés pour le score BM25.
    d:
      en: |
        A unique key enforces uniqueness of values within a logical partition; it does not index text for search.
      fr: |
        Une clé unique impose l'unicité des valeurs au sein d'une partition logique ; elle n'indexe pas le texte pour la recherche.
    e:
      en: |
        Spatial indexes are for GeoJSON geometry, not for text.
      fr: |
        Les index spatiaux concernent les géométries GeoJSON, pas le texte.
references:
  - title: Use Hybrid Search - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
