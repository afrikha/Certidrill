id: dp420-1a-thr-cli-migrate
objective: "1.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL container named **carts** in a database named **shop**. The container uses manual throughput, and its traffic has become unpredictable.

    You need to switch the container to autoscale throughput and then set its maximum to 8,000 RU/s by using the Azure CLI.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **carts** dans une base de données nommée **shop**. Le conteneur utilise un débit manuel, et son trafic est devenu imprévisible.

    Vous devez faire passer le conteneur en débit à mise à l'échelle automatique, puis définir son maximum sur 8 000 RU/s, au moyen d'Azure CLI.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cosmosdb sql container throughput [[verb]] \
        -a cosmos-fabrikam -g rg-shop -d shop -n carts \
        [[type]]

    az cosmosdb sql container throughput update \
        -a cosmos-fabrikam -g rg-shop -d shop -n carts \
        [[max]] 8000
  slots:
    - id: verb
      options:
        - { id: migrate, text: migrate }
        - { id: update, text: update }
        - { id: show, text: show }
    - id: type
      options:
        - { id: tmanual, text: "-t 'manual'" }
        - { id: tput, text: "--throughput 8000" }
        - { id: tauto, text: "-t 'autoscale'" }
    - id: max
      options:
        - { id: ttl, text: "--ttl" }
        - { id: maxtp, text: "--max-throughput" }
        - { id: tp, text: "--throughput" }
answer:
  values: { verb: migrate, type: tauto, max: maxtp }
explanation:
  correct:
    en: |
      `az cosmosdb sql container throughput migrate -t 'autoscale'` switches an existing container from manual to autoscale throughput. You then set the autoscale maximum with `throughput update --max-throughput`; `--throughput` sets manual throughput.
    fr: |
      `az cosmosdb sql container throughput migrate -t 'autoscale'` fait passer un conteneur existant du débit manuel au débit à mise à l'échelle automatique. Vous définissez ensuite le maximum avec `throughput update --max-throughput` ; `--throughput` définit un débit manuel.
  options:
    update: { en: "update changes the throughput value but doesn't switch the throughput type.", fr: "update modifie la valeur du débit mais ne change pas le type de débit." }
    tp: { en: "--throughput sets a manual RU/s value, not an autoscale maximum.", fr: "--throughput définit une valeur manuelle de RU/s, pas un maximum de mise à l'échelle automatique." }
    ttl: { en: "--ttl is a parameter of az cosmosdb sql container update and sets the default time to live, not the throughput.", fr: "--ttl est un paramètre de az cosmosdb sql container update et définit la durée de vie par défaut, pas le débit." }
references:
  - title: Manage Azure Cosmos DB for NoSQL resources using Azure CLI
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/manage-with-cli
