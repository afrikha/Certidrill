id: dp420-1c-model-type-discriminator
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam stores books and their reviews in Azure Cosmos DB for NoSQL. The product page reads a book and all its reviews in one query that filters on `bookId`. A book receives at most a few hundred reviews.

    You need a design that serves the product page from a single logical partition.

    What should you do?
  fr: |
    Fabrikam stocke des livres et leurs avis dans Azure Cosmos DB for NoSQL. La page produit lit un livre et tous ses avis en une seule requête filtrée sur `bookId`. Un livre reçoit au plus quelques centaines d'avis.

    Vous avez besoin d'une conception qui serve la page produit à partir d'une seule partition logique.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Store books in a container partitioned by /id and reviews in a container partitioned by /bookId", fr: "Stocker les livres dans un conteneur partitionné par /id et les avis dans un conteneur partitionné par /bookId" } }
    - { id: b, text: { en: "Store books and reviews in one container partitioned by /type and filter on the type property", fr: "Stocker les livres et les avis dans un même conteneur partitionné par /type et filtrer sur la propriété type" } }
    - { id: c, text: { en: "Store books and reviews in one container partitioned by /bookId and add a type property to each item", fr: "Stocker les livres et les avis dans un même conteneur partitionné par /bookId et ajouter une propriété type à chaque élément" } }
    - { id: d, text: { en: "Store books and reviews in one container partitioned by /id and add a bookId property to each review", fr: "Stocker les livres et les avis dans un même conteneur partitionné par /id et ajouter une propriété bookId à chaque avis" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Different entity types can share a container. With `/bookId` as the partition key, a book and its reviews share the same logical partition, so the product page is a single-partition query. A `type` property (for example `book` or `review`) lets the application tell the items apart.
    fr: |-
      Des types d'entités différents peuvent partager un conteneur. Avec `/bookId` comme clé de partition, un livre et ses avis partagent la même partition logique : la page produit est une requête sur une seule partition. Une propriété `type` (par exemple `book` ou `review`) permet à l'application de distinguer les éléments.
  options:
    a:
      en: |-
        Two containers mean at least two requests per page, because a query cannot span containers.
      fr: |-
        Deux conteneurs impliquent au moins deux requêtes par page, car une requête ne peut pas porter sur plusieurs conteneurs.
    b:
      en: "/type has only a couple of values: every book or every review would land in the same logical partition, which creates a hot partition and hits the 20 GB limit."
      fr: "/type n'a que quelques valeurs : tous les livres ou tous les avis se retrouveraient dans la même partition logique, ce qui crée une partition chaude et atteint la limite de 20 Go."
    d:
      en: |-
        With /id, each item is alone in its logical partition, so reading a book with its reviews becomes a cross-partition query.
      fr: |-
        Avec /id, chaque élément est seul dans sa partition logique : lire un livre avec ses avis devient une requête entre partitions.
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
