id: dp420-1d-lease-pk-path
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are creating a partitioned lease container named **leases** for a change feed processor that monitors an Azure Cosmos DB for NoSQL container named **orders**. The orders container is partitioned by `/customerId`.

    Which partition key path should you use for the leases container?
  fr: |
    Vous créez un conteneur de bail partitionné nommé **leases** pour un processeur de flux de modification qui surveille un conteneur Azure Cosmos DB for NoSQL nommé **orders**. Le conteneur orders est partitionné par `/customerId`.

    Quel chemin de clé de partition devez-vous utiliser pour le conteneur leases ?
body:
  options:
    - { id: a, text: /customerId }
    - { id: b, text: /partitionKey }
    - { id: c, text: /id }
    - { id: d, text: /leaseToken }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Partitioned lease containers must have a /id partition key definition, whatever the partition key of the monitored container. Each lease document tracks the progress of one range of the monitored container.
    fr: |
      Les conteneurs de bail partitionnés doivent avoir une définition de clé de partition /id, quelle que soit la clé de partition du conteneur surveillé. Chaque document de bail suit la progression d'une plage du conteneur surveillé.
  options:
    a: { en: "The lease container does not reuse the partition key of the monitored container.", fr: "Le conteneur de bail ne reprend pas la clé de partition du conteneur surveillé." }
    b: { en: "A partitioned lease container requires /id, not another path.", fr: "Un conteneur de bail partitionné exige /id, pas un autre chemin." }
    d: { en: "A partitioned lease container requires /id, not another path.", fr: "Un conteneur de bail partitionné exige /id, pas un autre chemin." }
references:
  - title: Use Change Feed With Azure Functions - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-functions
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
