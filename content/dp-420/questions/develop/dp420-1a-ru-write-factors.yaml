id: dp420-1a-ru-write-factors
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum stores product documents in an Azure Cosmos DB for NoSQL container. Each document embeds a base64-encoded product image of about 400 KB and is indexed with the default indexing policy. Queries filter only on `/category` and `/price`. The account uses Strong consistency and 20,000 RU/s of manual throughput.

    You need to reduce the RU charge of each document creation.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke des documents produits dans un conteneur Azure Cosmos DB for NoSQL. Chaque document incorpore une image produit encodée en base64 d'environ 400 Ko et il est indexé avec la stratégie d'indexation par défaut. Les requêtes filtrent uniquement sur `/category` et `/price`. Le compte utilise la cohérence Strong et un débit manuel de 20 000 RU/s.

    Vous devez réduire la charge en RU de chaque création de document.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the container throughput to 40,000 RU/s.", fr: "Augmenter le débit du conteneur à 40 000 RU/s." } }
    - { id: b, text: { en: "Store the images in Azure Blob Storage and keep only their URL in the documents.", fr: "Stocker les images dans Stockage Blob Azure et ne conserver que leur URL dans les documents." } }
    - { id: c, text: { en: "Exclude every path except /category/? and /price/? from indexing.", fr: "Exclure de l'indexation tous les chemins sauf /category/? et /price/?." } }
    - { id: d, text: { en: "Change the default consistency level of the account to Session.", fr: "Changer le niveau de cohérence par défaut du compte en Session." } }
    - { id: e, text: { en: "Switch the container from manual to autoscale throughput.", fr: "Faire passer le conteneur du débit manuel au débit avec mise à l'échelle automatique." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      The RU charge of a write depends on the size of the item and on the number of indexed properties. Moving large binary content to Blob Storage shrinks each item, and indexing only the queried paths reduces the index work done on each write.
    fr: |
      La charge en RU d'une écriture dépend de la taille de l'élément et du nombre de propriétés indexées. Déplacer le contenu binaire volumineux vers Stockage Blob réduit chaque élément, et n'indexer que les chemins interrogés réduit le travail d'indexation de chaque écriture.
  options:
    d: { en: "Consistency changes the RU cost of reads only; a write costs the same at every level.", fr: "La cohérence ne modifie que le coût en RU des lectures ; une écriture coûte le même prix à tous les niveaux." }
    e: { en: "Autoscale changes how throughput is provisioned and billed, not the RU charge of an operation.", fr: "La mise à l'échelle automatique change la façon dont le débit est approvisionné et facturé, pas la charge en RU d'une opération." }
    a: { en: "More RU/s reduces throttling, but each creation still consumes the same number of RUs.", fr: "Davantage de RU/s réduit la limitation du débit, mais chaque création consomme toujours le même nombre de RU." }
references:
  - title: Optimize request cost in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
  - title: Request Units as a throughput and performance currency - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/request-units
