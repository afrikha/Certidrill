id: dp420-1d-avad-statements
objective: "1.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind reads the change feed of an Azure Cosmos DB for NoSQL container named **subscriptions** in all versions and deletes mode. The container has a default time to live (TTL) of 90 days.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind lit le flux de modification d'un conteneur Azure Cosmos DB for NoSQL nommé **subscriptions** en mode toutes les versions et suppressions. Le conteneur a une durée de vie (TTL) par défaut de 90 jours.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: For a replace operation, the change contains the version of the item before the replace.
        fr: Pour une opération de remplacement, la modification contient la version de l'élément antérieure au remplacement.
    - id: s2
      text:
        en: When an item is deleted because its TTL expired, the delete change has a metadata flag that identifies the TTL expiration.
        fr: Lorsqu'un élément est supprimé à l'expiration de sa durée de vie, la modification de suppression comporte un indicateur de métadonnées qui identifie l'expiration TTL.
    - id: s3
      text:
        en: If an item is updated twice between two reads of the change feed, the consumer receives both updates.
        fr: Si un élément est mis à jour deux fois entre deux lectures du flux de modification, le consommateur reçoit les deux mises à jour.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The previous version of replaced or deleted items is currently not available; a replace change carries the current item and the previousImageLSN metadata only. Deletes from TTL expirations are captured, with timeToLiveExpired set to true, when the item is purged. This mode records each change in order, including intermediate changes between reads.
    fr: |
      La version précédente des éléments remplacés ou supprimés n'est actuellement pas disponible ; une modification de remplacement ne contient que l'élément actuel et la métadonnée previousImageLSN. Les suppressions dues aux expirations TTL sont capturées, avec timeToLiveExpired défini à true, lorsque l'élément est purgé. Ce mode enregistre chaque modification dans l'ordre, y compris les modifications intermédiaires entre deux lectures.
references:
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
