id: dp420-1c-impact-partition-metrics-hotarea
objective: "1.3.4"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You review the Insights of an Azure Cosmos DB for NoSQL container that has four physical partitions. The following table shows, for each partition key range, the maximum **Normalized RU Consumption** over the last 24 hours and the current storage.

    Answer each prompt by selecting the appropriate partition key range.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les Insights d'un conteneur Azure Cosmos DB for NoSQL qui compte quatre partitions physiques. Le tableau suivant indique, pour chaque plage de clés de partition, la valeur maximale de **Normalized RU Consumption** sur les dernières 24 heures et le stockage actuel.

    Répondez à chaque consigne en sélectionnant la plage de clés de partition appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The hot physical partition", fr: "La partition physique chaude" }
    - id: p2
      text: { en: "The physical partition that will be the next to split because of its storage", fr: "La partition physique qui sera la prochaine à se fractionner en raison de son stockage" }
  grid:
    header: [PartitionKeyRangeId, { en: "Normalized RU Consumption (max)", fr: "Normalized RU Consumption (max)" }, { en: "Storage", fr: "Stockage" }]
    rows:
      - [{ text: "0", area: r0 }, { text: "24 %" }, { text: { en: "18 GB", fr: "18 Go" } }]
      - [{ text: "1", area: r1 }, { text: "100 %" }, { text: { en: "12 GB", fr: "12 Go" } }]
      - [{ text: "2", area: r2 }, { text: "31 %" }, { text: { en: "46 GB", fr: "46 Go" } }]
      - [{ text: "3", area: r3 }, { text: "27 %" }, { text: { en: "21 GB", fr: "21 Go" } }]
answer:
  values: { p1: r1, p2: r2 }
explanation:
  correct:
    en: |-
      A hot partition shows a normalized RU consumption much higher than the others, here range 1 at 100 percent while the others stay around 30 percent. A physical partition holds up to 50 GB and is split automatically when it exceeds that size, so range 2, at 46 GB, is the next to split.
    fr: |-
      Une partition chaude présente une consommation de RU normalisée bien supérieure aux autres, ici la plage 1 à 100 % alors que les autres restent autour de 30 %. Une partition physique contient jusqu'à 50 Go et se fractionne automatiquement au-delà : la plage 2, à 46 Go, est la prochaine à se fractionner.
references:
  - title: Diagnose and troubleshoot "Request rate too large" (429) exceptions
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-request-rate-too-large
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
