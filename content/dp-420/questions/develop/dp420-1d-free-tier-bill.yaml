id: dp420-1d-free-tier-bill
objective: "1.3.8"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Litware created an Azure Cosmos DB for NoSQL account with the free tier discount applied. The account has one region and contains the following resources:

    - A container named **orders** with 800 RU/s of dedicated standard (manual) throughput.
    - A container named **sessions** with 400 RU/s of dedicated standard (manual) throughput.

    The two containers store 32 GB of data in total.

    You need to estimate the monthly bill. How much throughput and storage are billed at the regular price? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware a créé un compte Azure Cosmos DB for NoSQL avec la remise du niveau gratuit appliquée. Le compte a une seule région et contient les ressources suivantes :

    - Un conteneur nommé **orders** avec un débit standard (manuel) dédié de 800 RU/s.
    - Un conteneur nommé **sessions** avec un débit standard (manuel) dédié de 400 RU/s.

    Les deux conteneurs stockent 32 Go de données au total.

    Vous devez estimer la facture mensuelle. Quels débit et stockage sont facturés au tarif normal ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Throughput billed at the regular price: [[ru]]

      Storage billed at the regular price: [[gb]]
    fr: |
      Débit facturé au tarif normal : [[ru]]

      Stockage facturé au tarif normal : [[gb]]
  slots:
    - id: ru
      options:
        - { id: ru0, text: "0 RU/s" }
        - { id: ru200, text: "200 RU/s" }
        - { id: ru400, text: "400 RU/s" }
        - { id: ru1200, text: "1,200 RU/s" }
    - id: gb
      options:
        - { id: gb0, text: { en: "0 GB", fr: "0 Go" } }
        - { id: gb7, text: { en: "7 GB", fr: "7 Go" } }
        - { id: gb25, text: { en: "25 GB", fr: "25 Go" } }
        - { id: gb32, text: { en: "32 GB", fr: "32 Go" } }
answer:
  values: { ru: ru200, gb: gb7 }
explanation:
  correct:
    en: |
      The free tier gives the first 1,000 RU/s and 25 GB of storage of the account for free, and anything beyond is billed at the regular price. The account provisions 800 + 400 = 1,200 RU/s, so 200 RU/s are billed, and 32 − 25 = 7 GB of storage are billed.
    fr: |
      Le niveau gratuit offre les 1 000 premières RU/s et les 25 premiers Go de stockage du compte ; tout ce qui dépasse est facturé au tarif normal. Le compte approvisionne 800 + 400 = 1 200 RU/s : 200 RU/s sont facturées, ainsi que 32 − 25 = 7 Go de stockage.
  options:
    ru400: { en: "The free 1,000 RU/s apply to the whole account, not only to the first container.", fr: "Les 1 000 RU/s gratuites s'appliquent à l'ensemble du compte, pas seulement au premier conteneur." }
    ru1200: { en: "The free tier discount covers the first 1,000 RU/s.", fr: "La remise du niveau gratuit couvre les 1 000 premières RU/s." }
    gb25: { en: "25 GB is the free allowance, not the billed amount.", fr: "25 Go correspond à la franchise gratuite, pas à la quantité facturée." }
references:
  - title: Lifetime Free Tier - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/free-tier
