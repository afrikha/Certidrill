id: dp420-1a-sdk-dotnet-options
objective: "1.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is writing a .NET ingestion service that loads millions of catalog items into Azure Cosmos DB for NoSQL every night. The service runs in West Europe. The client must meet the following requirements:

    - the SDK must use the account's regions ordered by proximity to West Europe;
    - concurrent point operations must be grouped to maximize throughput, even if latency increases;
    - create and upsert responses must not return the item body, to reduce network and CPU usage.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders écrit un service d'ingestion .NET qui charge chaque nuit des millions d'éléments de catalogue dans Azure Cosmos DB for NoSQL. Le service s'exécute dans West Europe. Le client doit respecter les exigences suivantes :

    - le SDK doit utiliser les régions du compte classées par proximité avec West Europe ;
    - les opérations ponctuelles simultanées doivent être regroupées pour maximiser le débit, même si la latence augmente ;
    - les réponses de création et d'upsert ne doivent pas renvoyer le corps de l'élément, afin de réduire l'utilisation du réseau et du processeur.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    CosmosClient client = new CosmosClient(
        accountEndpoint: endpoint,
        tokenCredential: new DefaultAzureCredential(),
        clientOptions: new CosmosClientOptions
        {
            [[region]] = Regions.WestEurope,
            [[bulk]] = true,
            [[content]] = false
        });
  slots:
    - id: region
      options:
        - { id: preferred, text: ApplicationPreferredRegions }
        - { id: appregion, text: ApplicationRegion }
        - { id: appname, text: ApplicationName }
    - id: bulk
      options:
        - { id: allowbulk, text: AllowBulkExecution }
        - { id: limit, text: LimitToEndpoint }
        - { id: rediscovery, text: EnableTcpConnectionEndpointRediscovery }
    - id: content
      options:
        - { id: limit2, text: LimitToEndpoint }
        - { id: sessionretry, text: EnableRemoteRegionPreferredForSessionRetry }
        - { id: contentwrite, text: EnableContentResponseOnWrite }
answer:
  values: { region: appregion, bulk: allowbulk, content: contentwrite }
explanation:
  correct:
    en: |
      `ApplicationRegion` makes the SDK build its preferred list from the account's regions ordered by proximity to the given region. `AllowBulkExecution` enables optimistic batching of concurrent operations for throughput-oriented workloads. Setting `EnableContentResponseOnWrite` to false returns only headers and status for writes, while `RequestCharge` stays available.
    fr: |
      `ApplicationRegion` fait construire au SDK sa liste préférée à partir des régions du compte classées par proximité avec la région indiquée. `AllowBulkExecution` active le regroupement optimiste des opérations simultanées pour les charges de travail orientées débit. Définir `EnableContentResponseOnWrite` sur false renvoie uniquement les en-têtes et le statut des écritures, tandis que `RequestCharge` reste disponible.
  options:
    appname: { en: "ApplicationName only adds a suffix to the user agent.", fr: "ApplicationName ajoute seulement un suffixe à l'agent utilisateur." }
    preferred: { en: "ApplicationPreferredRegions takes an explicit list of regions, not a single region ordered by proximity.", fr: "ApplicationPreferredRegions prend une liste explicite de régions, pas une seule région classée par proximité." }
    limit: { en: "LimitToEndpoint restricts operations to the endpoint provided; it doesn't group operations.", fr: "LimitToEndpoint limite les opérations au point de terminaison fourni ; il ne regroupe pas les opérations." }
references:
  - title: CosmosClientOptions Class (Microsoft.Azure.Cosmos)
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclientoptions
  - title: Performance tips for Azure Cosmos DB and .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
