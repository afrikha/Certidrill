id: dp420-1a-thr-priority-ingestion
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has an Azure Cosmos DB for NoSQL container with 10,000 RU/s of dedicated manual throughput in an account that uses Session consistency. A customer-facing .NET API reads and writes the container. Each night, a .NET import job writes millions of items to the same container, and the API then receives HTTP 429 responses.

    When the container reaches its throughput, the import requests must be throttled before the API requests. You must not change the code of the API or increase the throughput.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un conteneur Azure Cosmos DB for NoSQL avec un débit manuel dédié de 10 000 RU/s, dans un compte qui utilise la cohérence Session. Une API .NET destinée aux clients lit et écrit dans le conteneur. Chaque nuit, un travail d'importation .NET écrit des millions d'éléments dans le même conteneur, et l'API reçoit alors des réponses HTTP 429.

    Lorsque le conteneur atteint son débit, les requêtes d'importation doivent être limitées avant celles de l'API. Vous ne devez ni modifier le code de l'API ni augmenter le débit.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set PriorityLevel to PriorityLevel.Low in the request options of the import job.", fr: "Définir PriorityLevel sur PriorityLevel.Low dans les options de requête du travail d'importation." } }
    - { id: b, text: { en: "Set PriorityLevel to PriorityLevel.High in the request options of the import job.", fr: "Définir PriorityLevel sur PriorityLevel.High dans les options de requête du travail d'importation." } }
    - { id: c, text: { en: "Enable burst capacity on the Features page of the account.", fr: "Activer la capacité en rafale dans la page Features du compte." } }
    - { id: d, text: { en: "Move the container to a database with shared throughput.", fr: "Déplacer le conteneur vers une base de données à débit partagé." } }
    - { id: e, text: { en: "Enable priority-based execution on the Features page of the account.", fr: "Activer l'exécution basée sur la priorité dans la page Features du compte." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Priority-based execution is enabled at the account level. When the RU/s are exhausted, Low priority requests are throttled before High priority requests. A request that doesn't specify a priority runs as High by default, so marking only the import requests as Low protects the API without changing its code.
    fr: |
      L'exécution basée sur la priorité s'active au niveau du compte. Lorsque les RU/s sont épuisées, les requêtes de priorité Low sont limitées avant celles de priorité High. Une requête qui ne précise pas de priorité s'exécute en High par défaut : marquer uniquement les requêtes d'importation en Low protège l'API sans modifier son code.
  options:
    b: { en: "High is already the default for the API requests; marking the import as High gives both workloads the same priority.", fr: "High est déjà la valeur par défaut des requêtes de l'API ; marquer l'importation en High donne la même priorité aux deux charges de travail." }
    c: { en: "Burst capacity only applies to partitions below 3,000 RU/s and absorbs short spikes; it doesn't decide which requests are throttled first.", fr: "La capacité en rafale ne s'applique qu'aux partitions de moins de 3 000 RU/s et absorbe des pics brefs ; elle ne décide pas quelles requêtes sont limitées en premier." }
    d: { en: "Shared throughput gives no per-container guarantee, and priority-based execution behaves non-deterministically there.", fr: "Le débit partagé ne donne aucune garantie par conteneur, et l'exécution basée sur la priorité y a un comportement non déterministe." }
references:
  - title: Priority-based execution in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/priority-based-execution
