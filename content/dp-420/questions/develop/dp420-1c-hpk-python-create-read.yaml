id: dp420-1c-hpk-python-create-read
objective: "1.3.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are writing a Python application that uses the azure-cosmos SDK. You need to create a container named **events** whose partition key has two levels, `/tenantId` then `/deviceId`, and then read the item **evt-1001** of tenant **fabrikam** and device **dev-17** with a point read.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui utilise le SDK azure-cosmos. Vous devez créer un conteneur nommé **events** dont la clé de partition comporte deux niveaux, `/tenantId` puis `/deviceId`, puis lire l'élément **evt-1001** du locataire **fabrikam** et de l'appareil **dev-17** par une lecture ponctuelle.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    container = database.create_container_if_not_exists(
        id="events",
        partition_key=PartitionKey(path=[[path]], kind=[[kind]]),
        offer_throughput=4000,
    )

    item = container.read_item(item="evt-1001", partition_key=[[value]])
  slots:
    - id: path
      options:
        - { id: plist, text: '["/tenantId", "/deviceId"]' }
        - { id: pnested, text: '"/tenantId/deviceId"' }
        - { id: pcomma, text: '"/tenantId,/deviceId"' }
    - id: kind
      options:
        - { id: kmulti, text: '"MultiHash"' }
        - { id: khash, text: '"Hash"' }
        - { id: krange, text: '"Range"' }
    - id: value
      options:
        - { id: vlist, text: '["fabrikam", "dev-17"]' }
        - { id: vprefix, text: '"fabrikam"' }
        - { id: vconcat, text: '"fabrikam/dev-17"' }
answer:
  values: { path: plist, kind: kmulti, value: vlist }
explanation:
  correct:
    en: |-
      In the Python SDK, a hierarchical partition key is a PartitionKey whose path is a list of paths and whose kind is MultiHash. A point read on such a container supplies the full key value as a list with one value per level, in the same order.
    fr: |-
      Dans le SDK Python, une clé de partition hiérarchique est un PartitionKey dont le chemin est une liste de chemins et dont le type (kind) est MultiHash. Une lecture ponctuelle sur ce conteneur fournit la valeur de clé complète sous forme de liste, avec une valeur par niveau, dans le même ordre.
  options:
    pnested: { en: "A single string with slashes is a path to a nested property, not two levels.", fr: "Une chaîne unique avec des barres obliques est le chemin d'une propriété imbriquée, pas deux niveaux." }
    pcomma: { en: "Levels are given as list elements, not as a comma-separated string.", fr: "Les niveaux se donnent comme éléments de liste, pas comme une chaîne séparée par des virgules." }
    khash: { en: "Hash is the kind of a single-level partition key.", fr: "Hash est le type d'une clé de partition à un seul niveau." }
    krange: { en: "Range is not the kind used for hierarchical partition keys.", fr: "Range n'est pas le type utilisé pour les clés de partition hiérarchiques." }
    vprefix: { en: "A point read needs the complete key; a prefix identifies several logical partitions.", fr: "Une lecture ponctuelle exige la clé complète ; un préfixe désigne plusieurs partitions logiques." }
    vconcat: { en: "The values are not concatenated: each level is a separate list element.", fr: "Les valeurs ne sont pas concaténées : chaque niveau est un élément distinct de la liste." }
references:
  - title: azure.cosmos.PartitionKey class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.partitionkey
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
