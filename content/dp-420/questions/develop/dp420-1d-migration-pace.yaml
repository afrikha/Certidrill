id: dp420-1d-migration-pace
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip must copy all the existing items of an Azure Cosmos DB for NoSQL container to a new container by using a .NET console application. To protect the production workload, the copy must run only at night, stop in the morning and resume the next night from where it stopped.

    The security team does not allow any additional container to be created in the source account.

    Which approach should you use?
  fr: |
    Wingtip doit copier tous les éléments existants d'un conteneur Azure Cosmos DB for NoSQL vers un nouveau conteneur à l'aide d'une application console .NET. Pour protéger la charge de production, la copie ne doit s'exécuter que la nuit, s'arrêter le matin et reprendre la nuit suivante là où elle s'est arrêtée.

    L'équipe de sécurité n'autorise la création d'aucun conteneur supplémentaire dans le compte source.

    Quelle approche devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The change feed processor started with WithStartTime(DateTime.MinValue.ToUniversalTime())", fr: "Le processeur de flux de modification démarré avec WithStartTime(DateTime.MinValue.ToUniversalTime())" } }
    - { id: b, text: { en: "The change feed pull model started from Beginning(), with the continuation token saved to a file", fr: "Le modèle de tirage du flux de modification démarré avec Beginning(), avec le jeton de continuation enregistré dans un fichier" } }
    - { id: c, text: { en: "The change feed pull model in all versions and deletes mode started from Beginning()", fr: "Le modèle de tirage du flux de modification en mode toutes les versions et suppressions démarré avec Beginning()" } }
    - { id: d, text: { en: "The change feed processor with a poll interval of 12 hours", fr: "Le processeur de flux de modification avec un intervalle d'interrogation de 12 heures" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The pull model suits one-time reads such as migrations and lets the application control the pace of consumption. The continuation token is a string that the application can persist anywhere and use the next night to resume; in latest version mode, it never expires while the container exists. No lease container is needed.
    fr: |
      Le modèle de tirage convient aux lectures ponctuelles comme les migrations et laisse l'application contrôler le rythme de consommation. Le jeton de continuation est une chaîne que l'application peut conserver n'importe où et réutiliser la nuit suivante pour reprendre ; en mode dernière version, il n'expire jamais tant que le conteneur existe. Aucun conteneur de bail n'est nécessaire.
  options:
    a: { en: "The processor stores its state in a lease container, which the security team does not allow.", fr: "Le processeur stocke son état dans un conteneur de bail, ce que l'équipe de sécurité n'autorise pas." }
    c: { en: "All versions and deletes mode cannot start from the beginning of the container.", fr: "Le mode toutes les versions et suppressions ne peut pas démarrer au début du conteneur." }
    d: { en: "The poll interval applies only when there are no changes, and the processor still needs a lease container.", fr: "L'intervalle d'interrogation ne s'applique qu'en l'absence de modifications, et le processeur nécessite toujours un conteneur de bail." }
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
