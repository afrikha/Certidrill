id: dp420-1b-ttl-expired-query
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware's telemetry container in Azure Cosmos DB for NoSQL uses provisioned throughput and a `DefaultTimeToLive` of 3600. During a two-hour traffic peak, user requests consume almost all the provisioned RU/s. The storage used by the container does not decrease, although many items expired more than an hour ago.

    During the peak, what happens to the expired items?
  fr: |
    Le conteneur de télémétrie de Litware dans Azure Cosmos DB for NoSQL utilise un débit approvisionné et une propriété `DefaultTimeToLive` de 3600. Pendant un pic de trafic de deux heures, les requêtes des utilisateurs consomment presque toutes les RU/s approvisionnées. Le stockage utilisé par le conteneur ne diminue pas, bien que de nombreux éléments aient expiré depuis plus d'une heure.

    Pendant le pic, qu'advient-il des éléments expirés ?
body:
  options:
    - { id: a, text: { en: "Queries no longer return them, and their deletion waits until enough leftover RUs are available.", fr: "Les requêtes ne les renvoient plus, et leur suppression attend que suffisamment de RU inutilisées soient disponibles." } }
    - { id: b, text: { en: "Queries keep returning them until the background task physically deletes them.", fr: "Les requêtes continuent de les renvoyer jusqu'à ce que la tâche en arrière-plan les supprime physiquement." } }
    - { id: c, text: { en: "Their deletion takes priority over user requests, which receive 429 responses until the backlog is cleared.", fr: "Leur suppression est prioritaire sur les requêtes utilisateur, qui reçoivent des réponses 429 jusqu'à la résorption du retard." } }
    - { id: d, text: { en: "They are kept until the application deletes them, because TTL deletion is skipped when throughput is saturated.", fr: "Ils sont conservés jusqu'à ce que l'application les supprime, car la suppression par TTL est ignorée quand le débit est saturé." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An expired item stops appearing in query responses immediately, even before it is permanently deleted. On provisioned throughput, the background deletion uses only RUs left over by user requests, so it is delayed when the container is busy and resumes when RUs become available."
    fr: "Un élément expiré disparaît immédiatement des réponses aux requêtes, avant même sa suppression définitive. En débit approvisionné, la suppression en arrière-plan n'utilise que les RU laissées libres par les requêtes utilisateur : elle est retardée quand le conteneur est occupé et reprend quand des RU se libèrent."
  options:
    b: { en: "Expired items are hidden from queries as soon as they expire.", fr: "Les éléments expirés sont masqués des requêtes dès leur expiration." }
    c: { en: "TTL deletion uses leftover RUs and does not compete with user requests.", fr: "La suppression par TTL utilise les RU inutilisées et n'entre pas en concurrence avec les requêtes utilisateur." }
    d: { en: "Deletion is delayed, not skipped: it resumes when enough RUs are available.", fr: "La suppression est retardée, pas ignorée : elle reprend quand suffisamment de RU sont disponibles." }
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
