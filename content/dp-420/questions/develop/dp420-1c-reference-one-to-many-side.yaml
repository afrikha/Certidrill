id: dp420-1c-reference-one-to-many-side
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware stores publishers and books as separate items in Azure Cosmos DB for NoSQL. A large publisher adds thousands of books every year, and its catalog has no upper limit. The book page shows the book with the name of its publisher.

    You need to store the relationship between publishers and books. The solution must avoid items that grow without bound.

    What should you do?
  fr: |
    Proseware stocke des éditeurs et des livres comme éléments distincts dans Azure Cosmos DB for NoSQL. Un grand éditeur ajoute des milliers de livres chaque année, et son catalogue n'a pas de limite supérieure. La page d'un livre affiche le livre avec le nom de son éditeur.

    Vous devez stocker la relation entre éditeurs et livres. La solution doit éviter les éléments qui grossissent sans limite.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Store an array of book IDs in each publisher item", fr: "Stocker un tableau d'ID de livres dans chaque élément éditeur" } }
    - { id: b, text: { en: "Store the publisher ID and publisher name in each book item", fr: "Stocker l'ID et le nom de l'éditeur dans chaque élément livre" } }
    - { id: c, text: { en: "Embed every book of the publisher in the publisher item", fr: "Incorporer chaque livre de l'éditeur dans l'élément éditeur" } }
    - { id: d, text: { en: "Create one link item per publisher and book pair in a separate container", fr: "Créer un élément de liaison par paire éditeur-livre dans un conteneur distinct" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      When the "many" side of a one-to-many relationship is unbounded, the reference goes on the child items. Each book stores its publisher ID (and a copy of the rarely changing publisher name for display), so no item grows over time and the book page needs a single read.
    fr: |-
      Lorsque le côté « plusieurs » d'une relation un-à-plusieurs n'est pas borné, la référence se place sur les éléments enfants. Chaque livre stocke l'ID de son éditeur (et une copie du nom de l'éditeur, qui change rarement, pour l'affichage) : aucun élément ne grossit avec le temps et la page d'un livre ne nécessite qu'une lecture.
  options:
    a: { en: "An array of book IDs is a mutable, growing array: the publisher item grows without bound.", fr: "Un tableau d'ID de livres est un tableau modifiable et croissant : l'élément éditeur grossit sans limite." }
    c: { en: "Embedding an unbounded catalog quickly reaches the 2 MB item size limit.", fr: "Incorporer un catalogue non borné atteint rapidement la limite de 2 Mo par élément." }
    d: { en: "Join items reproduce a relational junction table and add extra queries for every read.", fr: "Des éléments de liaison reproduisent une table de jointure relationnelle et ajoutent des requêtes à chaque lecture." }
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
