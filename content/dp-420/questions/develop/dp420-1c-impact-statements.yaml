id: dp420-1c-impact-statements
objective: "1.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL container partitioned by `/storeId` with 20,000 RU/s of manual throughput. Burst capacity is not enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un conteneur Azure Cosmos DB for NoSQL partitionné par `/storeId` avec 20 000 RU/s de débit manuel. La capacité de rafale n'est pas activée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The provisioned throughput is divided evenly across the physical partitions of the container.
        fr: |-
          Le débit approvisionné est réparti uniformément entre les partitions physiques du conteneur.
    - id: s2
      text:
        en: |-
          If you raise the container to 60,000 RU/s, the requests for a single storeId value can consume 20,000 RU/s.
        fr: |-
          Si vous augmentez le conteneur à 60 000 RU/s, les requêtes d'une même valeur de storeId peuvent consommer 20 000 RU/s.
    - id: s3
      text:
        en: |-
          A query with the filter WHERE c.storeId = 'S042' is sent only to the physical partition that holds S042.
        fr: |-
          Une requête avec le filtre WHERE c.storeId = 'S042' n'est envoyée qu'à la partition physique qui contient S042.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Throughput is spread evenly over the physical partitions. A single partition key value is one logical partition, capped at 10,000 RU/s however much throughput the container has; only a hierarchical key prefix can exceed that limit. An equality filter on the partition key makes the query an in-partition query, routed to one physical partition.
    fr: |-
      Le débit est réparti uniformément entre les partitions physiques. Une valeur de clé de partition est une partition logique, plafonnée à 10 000 RU/s quel que soit le débit du conteneur ; seul un préfixe de clé hiérarchique peut dépasser cette limite. Un filtre d'égalité sur la clé de partition fait de la requête une requête dans une partition, routée vers une seule partition physique.
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
