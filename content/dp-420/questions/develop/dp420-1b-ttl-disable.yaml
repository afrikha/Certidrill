id: dp420-1b-ttl-disable
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank stores case files in an Azure Cosmos DB for NoSQL container whose `DefaultTimeToLive` is -1. Many case files have their own `ttl` value and are scheduled to expire.

    Because of a legal hold, automatic expiration must stop immediately for every item in the container. You must not modify the items.

    What should you do?
  fr: |
    Woodgrove Bank stocke des dossiers dans un conteneur Azure Cosmos DB for NoSQL dont la propriété `DefaultTimeToLive` vaut -1. De nombreux dossiers ont leur propre valeur `ttl` et doivent expirer.

    En raison d'une conservation légale, l'expiration automatique doit cesser immédiatement pour tous les éléments du conteneur. Vous ne devez pas modifier les éléments.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the container's DefaultTimeToLive to 2147483647.", fr: "Définir la propriété DefaultTimeToLive du conteneur sur 2147483647." } }
    - { id: b, text: { en: "Keep the container's DefaultTimeToLive at -1, which already prevents expiration.", fr: "Conserver la valeur -1 de la propriété DefaultTimeToLive du conteneur, qui empêche déjà l'expiration." } }
    - { id: c, text: { en: "Set the container's DefaultTimeToLive to 0.", fr: "Définir la propriété DefaultTimeToLive du conteneur sur 0." } }
    - { id: d, text: { en: "Set the container's DefaultTimeToLive to null.", fr: "Définir la propriété DefaultTimeToLive du conteneur sur null." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Removing DefaultTimeToLive (null, shown as Off in the portal) stops the background expiration process. Items then never expire, even those that set their own ttl, until TTL is enabled again."
    fr: "Supprimer DefaultTimeToLive (null, affiché Off dans le portail) arrête le processus d'expiration en arrière-plan. Les éléments n'expirent alors plus, même ceux qui définissent leur propre ttl, jusqu'à ce que la TTL soit réactivée."
  options:
    a: { en: "With TTL enabled, each item's own ttl still overrides the container value, so those items keep expiring.", fr: "Avec la TTL activée, le ttl propre à chaque élément remplace toujours la valeur du conteneur : ces éléments continuent d'expirer." }
    b: { en: "-1 only means no expiry by default; items with their own ttl still expire.", fr: "-1 signifie seulement aucune expiration par défaut ; les éléments qui ont leur propre ttl expirent toujours." }
    c: { en: "TTL values must be -1 or a nonzero positive number; 0 is not a way to turn TTL off.", fr: "Les valeurs de TTL doivent être -1 ou un nombre positif non nul ; 0 ne permet pas de désactiver la TTL." }
references:
  - title: Configure and Manage Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-time-to-live
