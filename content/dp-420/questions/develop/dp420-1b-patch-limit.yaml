id: dp420-1b-patch-limit
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum's profile service uses the Azure Cosmos DB .NET SDK version 3.46. When a user saves the settings page, the service calls `PatchItemAsync` once with a list of 14 `PatchOperation.Set` operations, one for each top-level setting that changed.

    The item exists and the partition key is correct, but the service rejects the request.

    What is the cause?
  fr: |
    Le service de profils d'Adatum utilise le SDK .NET d'Azure Cosmos DB en version 3.46. Quand un utilisateur enregistre la page de paramètres, le service appelle une fois `PatchItemAsync` avec une liste de 14 opérations `PatchOperation.Set`, une pour chaque paramètre de premier niveau modifié.

    L'élément existe et la clé de partition est correcte, mais le service rejette la requête.

    Quelle est la cause ?
body:
  options:
    - { id: a, text: { en: "A single patch request can contain at most 10 operations.", fr: "Une requête de patch unique peut contenir au plus 10 opérations." } }
    - { id: b, text: { en: "A patch request must include the item's _etag in the request options.", fr: "Une requête de patch doit inclure l'_etag de l'élément dans les options de requête." } }
    - { id: c, text: { en: "Set operations are allowed only on properties that are nested in an object.", fr: "Les opérations Set ne sont autorisées que sur des propriétés imbriquées dans un objet." } }
    - { id: d, text: { en: "PatchItemAsync accepts one operation per call; several operations require a transactional batch.", fr: "PatchItemAsync accepte une opération par appel ; plusieurs opérations exigent un lot transactionnel." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A single-document patch can contain up to 10 operations. To change 14 properties, the service must split the changes or replace the whole item."
    fr: "Un patch sur un seul document peut contenir jusqu'à 10 opérations. Pour modifier 14 propriétés, le service doit répartir les modifications ou remplacer l'élément entier."
  options:
    b: { en: "An ETag condition is optional; patch works without it.", fr: "Une condition ETag est facultative ; le patch fonctionne sans elle." }
    c: { en: "Set can target top-level properties as well as nested paths.", fr: "Set peut cibler des propriétés de premier niveau comme des chemins imbriqués." }
    d: { en: "A single patch can combine several operations, up to the limit of 10.", fr: "Un patch unique peut combiner plusieurs opérations, jusqu'à la limite de 10." }
references:
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
