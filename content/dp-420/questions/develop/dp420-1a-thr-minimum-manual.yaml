id: dp420-1a-thr-minimum-manual
objective: "1.1.3"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL container with dedicated manual throughput. During a data migration last year, the container was scaled to 100,000 RU/s, which is the highest value ever provisioned on it. The container now stores 600 GB of data and runs at 20,000 RU/s.

    After the migration, the workload is light. You need to lower the throughput of the container to the minimum value that the service allows.

    What is the lowest throughput that you can set?
  fr: |
    Adatum dispose d'un conteneur Azure Cosmos DB for NoSQL avec un débit manuel dédié. Lors d'une migration de données l'année dernière, le conteneur a été porté à 100 000 RU/s, la valeur la plus élevée jamais approvisionnée sur celui-ci. Le conteneur stocke aujourd'hui 600 Go de données et fonctionne à 20 000 RU/s.

    Après la migration, la charge de travail est légère. Vous devez abaisser le débit du conteneur jusqu'à la valeur minimale autorisée par le service.

    Quel est le débit le plus bas que vous pouvez définir ?
body:
  options:
    - { id: a, text: "400 RU/s" }
    - { id: b, text: "600 RU/s" }
    - { id: c, text: "1,000 RU/s" }
    - { id: d, text: "2,000 RU/s" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The minimum manual throughput of a container is the largest of three values: 400 RU/s, 1 RU/s per GB of current storage (600 RU/s), and the highest RU/s ever provisioned divided by 100 (100,000 / 100 = 1,000 RU/s). The minimum is therefore 1,000 RU/s.
    fr: |
      Le débit manuel minimal d'un conteneur est la plus grande de trois valeurs : 400 RU/s, 1 RU/s par Go de stockage actuel (600 RU/s) et le plus grand nombre de RU/s jamais approvisionné divisé par 100 (100 000 / 100 = 1 000 RU/s). Le minimum est donc de 1 000 RU/s.
  options:
    a: { en: "400 RU/s is the absolute floor, but the storage and the historical maximum raise the minimum above it.", fr: "400 RU/s est le plancher absolu, mais le stockage et le maximum historique relèvent le minimum au-dessus." }
    b: { en: "600 RU/s accounts for the storage only; the highest RU/s ever provisioned divided by 100 is higher.", fr: "600 RU/s ne tient compte que du stockage ; le plus grand nombre de RU/s jamais approvisionné divisé par 100 est plus élevé." }
    d: { en: "2,000 RU/s would be 10 percent of the current throughput, which isn't part of the minimum calculation for manual throughput.", fr: "2 000 RU/s correspondrait à 10 % du débit actuel, ce qui n'entre pas dans le calcul du minimum en débit manuel." }
references:
  - title: Service Quotas and Default Limits - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/concepts-limits
