id: dp420-1e-kit-verify
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At Litware, you install the Azure Cosmos DB Agent Kit at the user level for your AI coding assistant by using the skills CLI. You then open a project that contains Azure Cosmos DB for NoSQL code and ask the assistant to review it. The answer mentions Azure Cosmos DB but no specific best practice.

    You need to confirm whether the assistant actually discovered the Agent Kit skill.

    What should you do first?
  fr: |
    Chez Litware, vous installez Azure Cosmos DB Agent Kit au niveau utilisateur pour votre assistant de codage IA à l'aide du CLI skills. Vous ouvrez ensuite un projet qui contient du code Azure Cosmos DB for NoSQL et demandez à l'assistant de le réviser. La réponse mentionne Azure Cosmos DB, mais aucune bonne pratique précise.

    Vous devez vérifier si l'assistant a réellement découvert la compétence Agent Kit.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Reload the assistant, and then look for cosmosdb-best-practices in its installed skills view.", fr: "Recharger l'assistant, puis rechercher cosmosdb-best-practices dans sa vue des compétences installées." }
    - id: b
      text: { en: "Assign the Cosmos DB Built-in Data Reader role to your account so that the assistant can read the data.", fr: "Attribuer le rôle Cosmos DB Built-in Data Reader à votre compte pour que l'assistant puisse lire les données." }
    - id: c
      text: { en: "Install the kit again through the assistant's plugin marketplace so that two copies are available.", fr: "Réinstaller le kit par la place de marché de plug-ins de l'assistant pour disposer de deux copies." }
    - id: d
      text: { en: "Connect the assistant to the Microsoft Learn MCP server so that it can load the kit's rules.", fr: "Connecter l'assistant au serveur MCP Microsoft Learn pour qu'il puisse charger les règles du kit." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A response that mentions Azure Cosmos DB does not prove that the skill loaded. You reload the host or start a new session if it requires it, confirm that it discovers skills in the user scope, and check its installed skills or plugins view (or its skill-loading indicators) for cosmosdb-best-practices.
    fr: |
      Une réponse qui mentionne Azure Cosmos DB ne prouve pas que la compétence a été chargée. Vous rechargez l'hôte ou démarrez une nouvelle session s'il l'exige, vérifiez qu'il découvre les compétences de l'étendue utilisateur, puis recherchez cosmosdb-best-practices dans sa vue des compétences ou plug-ins installés (ou dans ses indicateurs de chargement de compétences).
  options:
    b:
      en: |
        Skills provide guidance only; database permissions have nothing to do with skill discovery.
      fr: |
        Les compétences ne fournissent que des recommandations ; les autorisations sur la base de données n'ont aucun rapport avec la découverte des compétences.
    c:
      en: |
        The setup guidance says not to install the same skill through several methods in the same host.
      fr: |
        Les instructions d'installation recommandent de ne pas installer la même compétence par plusieurs méthodes dans le même hôte.
    d:
      en: |
        The Microsoft Learn MCP server retrieves documentation; it is a separate capability that does not load installed skills.
      fr: |
        Le serveur MCP Microsoft Learn récupère la documentation ; c'est une fonctionnalité distincte qui ne charge pas les compétences installées.
references:
  - title: Set up the Azure Cosmos DB Agent Kit - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/setup
