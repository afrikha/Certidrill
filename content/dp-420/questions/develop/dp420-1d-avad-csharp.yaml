id: dp420-1d-avad-csharp
objective: "1.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The all versions and deletes change feed mode is enabled on an Azure Cosmos DB for NoSQL account. You are writing a .NET pull model consumer that writes an audit entry for each delete in a container named **orders**. The consumer runs for the first time today and has no saved continuation token.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le mode toutes les versions et suppressions du flux de modification est activé sur un compte Azure Cosmos DB for NoSQL. Vous écrivez un consommateur .NET en modèle de tirage qui écrit une entrée d'audit pour chaque suppression dans un conteneur nommé **orders**. Le consommateur s'exécute aujourd'hui pour la première fois et n'a aucun jeton de continuation enregistré.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    FeedIterator<ChangeFeedItem<Order>> iterator = container.GetChangeFeedIterator<ChangeFeedItem<Order>>(
        ChangeFeedStartFrom.[[start]],
        ChangeFeedMode.[[mode]]);

    while (iterator.HasMoreResults)
    {
        FeedResponse<ChangeFeedItem<Order>> response = await iterator.ReadNextAsync();
        foreach (ChangeFeedItem<Order> change in response)
        {
            if (change.Metadata.OperationType == ChangeFeedOperationType.[[op]])
            {
                await auditLog.WriteAsync(change.Metadata);
            }
        }
    }
  slots:
    - id: start
      options:
        - { id: snow, text: Now() }
        - { id: sbeg, text: Beginning() }
        - { id: stime, text: Time(DateTime.UtcNow.AddDays(-7)) }
    - id: mode
      options:
        - { id: mavd, text: AllVersionsAndDeletes }
        - { id: mlat, text: LatestVersion }
        - { id: minc, text: Incremental }
    - id: op
      options:
        - { id: odel, text: Delete }
        - { id: orep, text: Replace }
        - { id: ocre, text: Create }
answer:
  values: { start: snow, mode: mavd, op: odel }
explanation:
  correct:
    en: |
      In all versions and deletes mode, the iterator returns ChangeFeedItem objects whose Metadata exposes the operation type. Without a continuation token, this mode must start from Now(); it cannot read from the beginning of the container or from a past point in time.
    fr: |
      En mode toutes les versions et suppressions, l'itérateur renvoie des objets ChangeFeedItem dont la propriété Metadata expose le type d'opération. Sans jeton de continuation, ce mode doit démarrer avec Now() ; il ne peut pas lire depuis le début du conteneur ni depuis un instant passé.
  options:
    sbeg: { en: "Reading from the beginning of the container is not supported in all versions and deletes mode.", fr: "La lecture depuis le début du conteneur n'est pas prise en charge en mode toutes les versions et suppressions." }
    stime: { en: "A start time in the past is not supported in all versions and deletes mode.", fr: "Une heure de début passée n'est pas prise en charge en mode toutes les versions et suppressions." }
    minc: { en: "Incremental is the former name of latest version mode, which does not capture deletes.", fr: "Incremental est l'ancien nom du mode dernière version, qui ne capture pas les suppressions." }
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
