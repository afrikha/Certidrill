id: dp420-1c-pk-workloads-dragdrop
objective: "1.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is creating three Azure Cosmos DB for NoSQL containers. Each item of every container has a GUID `id`.

    You need to select a partition key for each container. The solution must distribute writes evenly and minimize the RU cost of the access pattern described.

    Which partition key should you use for each container? To answer, drag the appropriate partition keys to the correct containers. Each partition key may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée trois conteneurs Azure Cosmos DB for NoSQL. Chaque élément de chaque conteneur a un `id` de type GUID.

    Vous devez sélectionner une clé de partition pour chaque conteneur. La solution doit répartir uniformément les écritures et réduire au minimum le coût en RU du modèle d'accès décrit.

    Quelle clé de partition devez-vous utiliser pour chaque conteneur ? Pour répondre, faites glisser les clés de partition appropriées vers les conteneurs correspondants. Chaque clé de partition peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: user, text: /userId }
    - { id: id, text: /id }
    - { id: tenant, text: /tenantId }
    - { id: date, text: /eventDate }
    - { id: country, text: /country }
  targets:
    - id: carts
      text: { en: "carts: one active cart per user, always read and updated by the user's ID; carts of different users are never read together", fr: "carts : un panier actif par utilisateur, toujours lu et mis à jour par l'ID de l'utilisateur ; les paniers de différents utilisateurs ne sont jamais lus ensemble" }
    - id: clicks
      text: { en: "clicks: 50,000 events written per second; an event is read back only by its id", fr: "clicks : 50 000 événements écrits par seconde ; un événement n'est relu que par son id" }
    - id: invoices
      text: { en: "invoices: 300 business tenants of under 2 GB each; every query filters on one tenant", fr: "invoices : 300 locataires professionnels de moins de 2 Go chacun ; chaque requête filtre sur un locataire" }
answer:
  mapping: { carts: user, clicks: id, invoices: tenant }
explanation:
  correct:
    en: |-
      Carts are always accessed by user, so /userId makes every request a single-partition operation. Write-heavy events read only by id are best partitioned by /id, which gives the highest cardinality and point reads. Every invoice query filters on the tenant and no tenant approaches 20 GB, so /tenantId keeps the queries in one logical partition.
    fr: |-
      Les paniers sont toujours lus par utilisateur : /userId fait de chaque requête une opération sur une seule partition. Les événements écrits en masse et relus uniquement par id sont mieux partitionnés par /id, qui offre la cardinalité maximale et des lectures ponctuelles. Chaque requête de factures filtre sur le locataire et aucun locataire n'approche 20 Go : /tenantId maintient les requêtes dans une seule partition logique.
  options:
    date: { en: "A date concentrates all the writes of the day on one logical partition.", fr: "Une date concentre toutes les écritures de la journée sur une seule partition logique." }
    country: { en: "Countries have low cardinality and match none of the access patterns.", fr: "Les pays ont une cardinalité faible et ne correspondent à aucun des modèles d'accès." }
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
