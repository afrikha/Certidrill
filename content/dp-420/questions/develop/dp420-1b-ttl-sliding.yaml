id: dp420-1b-ttl-sliding
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys stores web sessions in an Azure Cosmos DB for NoSQL container. A session must be deleted automatically 30 minutes after the last user activity, and each request from the user counts as activity. The solution must not require a cleanup job.

    What should you do?
  fr: |
    Wingtip Toys stocke des sessions web dans un conteneur Azure Cosmos DB for NoSQL. Une session doit être supprimée automatiquement 30 minutes après la dernière activité de l'utilisateur, et chaque requête de l'utilisateur compte comme une activité. La solution ne doit pas nécessiter de traitement de nettoyage.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set DefaultTimeToLive to -1 on the container, and set ttl to 1800 when the session item is created.", fr: "Définir DefaultTimeToLive sur -1 sur le conteneur, et définir ttl sur 1800 lors de la création de l'élément de session." } }
    - { id: b, text: { en: "Set DefaultTimeToLive to 1800 on the container, and query the session item by its id on each request.", fr: "Définir DefaultTimeToLive sur 1800 sur le conteneur, et interroger l'élément de session par son id à chaque requête." } }
    - { id: c, text: { en: "Set DefaultTimeToLive to 1800 on the container, and write to the session item, for example by patching lastSeen, on each request.", fr: "Définir DefaultTimeToLive sur 1800 sur le conteneur, et écrire dans l'élément de session, par exemple en modifiant lastSeen par patch, à chaque requête." } }
    - { id: d, text: { en: "Set DefaultTimeToLive to 1800 on the container, and read the session item with a point read on each request.", fr: "Définir DefaultTimeToLive sur 1800 sur le conteneur, et lire l'élément de session par une lecture ponctuelle à chaque requête." } }
answer: { optionId: c }
explanation:
  correct:
    en: "TTL counts from the item's last modification time (_ts). Any write updates _ts, so the expiry restarts at each request, which gives a sliding 30-minute expiration with no cleanup code."
    fr: "La TTL est calculée à partir de l'heure de dernière modification de l'élément (_ts). Toute écriture met à jour _ts : l'expiration redémarre à chaque requête, ce qui donne une expiration glissante de 30 minutes sans code de nettoyage."
  options:
    d: { en: "Reads do not change _ts, so the session expires 30 minutes after its last write, not its last activity.", fr: "Les lectures ne modifient pas _ts : la session expire 30 minutes après sa dernière écriture, pas après sa dernière activité." }
    a: { en: "Without later writes, the session expires 30 minutes after it was created, even if the user is active.", fr: "Sans écriture ultérieure, la session expire 30 minutes après sa création, même si l'utilisateur est actif." }
    b: { en: "Queries do not change _ts either, and they cost more than a point read.", fr: "Les requêtes ne modifient pas non plus _ts, et elles coûtent plus cher qu'une lecture ponctuelle." }
references:
  - title: Configure and Manage Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-time-to-live
