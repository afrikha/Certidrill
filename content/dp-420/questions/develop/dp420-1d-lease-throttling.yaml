id: dp420-1d-lease-throttling
objective: "1.4.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs 40 change feed processor instances that belong to several deployment units. All the units share one lease container that has 400 RU/s of manual throughput. The units use the default lease settings.

    Changes reach the delegates with long delays. Metrics show that the lease container returns many HTTP 429 responses, while the monitored container is not rate limited.

    Which two actions reduce the delays caused by the lease container?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute 40 instances de processeur de flux de modification réparties dans plusieurs unités de déploiement. Toutes les unités partagent un conteneur de bail doté d'un débit manuel de 400 RU/s. Les unités utilisent les paramètres de bail par défaut.

    Les modifications parviennent aux délégués avec de longs délais. Les métriques montrent que le conteneur de bail renvoie de nombreuses réponses HTTP 429, alors que le conteneur surveillé n'est pas limité en débit.

    Quelles sont les deux actions qui réduisent les délais dus au conteneur de bail ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the provisioned throughput of the monitored container.", fr: "Augmenter le débit approvisionné du conteneur surveillé." } }
    - { id: b, text: { en: "Increase the provisioned throughput of the lease container.", fr: "Augmenter le débit approvisionné du conteneur de bail." } }
    - { id: c, text: { en: "Give some deployment units their own lease container.", fr: "Attribuer à certaines unités de déploiement leur propre conteneur de bail." } }
    - { id: d, text: { en: "Lower the lease acquire interval below its 17-second default.", fr: "Abaisser l'intervalle d'acquisition des baux sous sa valeur par défaut de 17 secondes." } }
    - { id: e, text: { en: "Lower the lease renewal interval below its 13-second default.", fr: "Abaisser l'intervalle de renouvellement des baux sous sa valeur par défaut de 13 secondes." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Lease operations consume RUs on the lease container, and the more instances share it, the higher the consumption; throttling there delays or even stops processing. Adding RU/s to the lease container, or spreading the units across several lease containers, gives the lease operations the throughput they need.
    fr: |
      Les opérations sur les baux consomment des RU sur le conteneur de bail, et plus les instances qui le partagent sont nombreuses, plus la consommation augmente ; une limitation du débit à ce niveau retarde, voire arrête, le traitement. Ajouter des RU/s au conteneur de bail, ou répartir les unités sur plusieurs conteneurs de bail, donne aux opérations sur les baux le débit dont elles ont besoin.
  options:
    a: { en: "The monitored container is not throttled; the bottleneck is the lease container.", fr: "Le conteneur surveillé n'est pas limité ; le goulot d'étranglement est le conteneur de bail." }
    d: { en: "A shorter acquire interval runs the acquisition query more often and increases RU consumption on the lease container.", fr: "Un intervalle d'acquisition plus court exécute plus souvent la requête d'acquisition et augmente la consommation de RU sur le conteneur de bail." }
    e: { en: "A shorter renewal interval replaces leases more often and increases RU consumption on the lease container.", fr: "Un intervalle de renouvellement plus court remplace plus souvent les baux et augmente la consommation de RU sur le conteneur de bail." }
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
