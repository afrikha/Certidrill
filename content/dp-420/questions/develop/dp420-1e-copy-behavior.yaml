id: dp420-1e-copy-behavior
objective: "1.4.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Azure Cosmos DB for NoSQL account with a single write region. A container named **sessions** has a default time to live (TTL) of 86,400 seconds, and some items override it with their own `ttl` value.

    You run an online container copy job from **sessions** to a new container named **sessions-v2**, created with the default settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un compte Azure Cosmos DB for NoSQL avec une seule région d'écriture. Un conteneur nommé **sessions** a une durée de vie (TTL) par défaut de 86 400 secondes, et certains éléments la remplacent par leur propre valeur `ttl`.

    Vous exécutez une tâche de copie de conteneur en ligne de **sessions** vers un nouveau conteneur nommé **sessions-v2**, créé avec les paramètres par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An item copied with its own ttl value keeps the time remaining before its expiration.
        fr: |
          Un élément copié avec sa propre valeur ttl conserve le temps restant avant son expiration.
    - id: s2
      text:
        en: |
          sessions-v2 inherits the default TTL of 86,400 seconds from sessions.
        fr: |
          sessions-v2 hérite de la durée de vie par défaut de 86 400 secondes de sessions.
    - id: s3
      text:
        en: |
          If a failover changes the write region before the job is complete, the job continues in the new write region.
        fr: |
          Si un basculement change la région d'écriture avant la fin de la tâche, la tâche se poursuit dans la nouvelle région d'écriture.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Item-level TTL values are copied and recalculated so that the remaining time to expiration is preserved. Container-level TTL settings are not copied, so you configure the default TTL on the destination container yourself. The job runs in the write region; if the write region changes, an incomplete job fails and you must create it again, and it then runs in the new write region.
    fr: |
      Les valeurs TTL au niveau des éléments sont copiées et recalculées pour conserver le temps restant avant expiration. Les paramètres TTL au niveau du conteneur ne sont pas copiés : vous configurez vous-même la durée de vie par défaut du conteneur de destination. La tâche s'exécute dans la région d'écriture ; si celle-ci change, une tâche inachevée échoue et vous devez la recréer, et elle s'exécute alors dans la nouvelle région d'écriture.
references:
  - title: Container Copy Jobs - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/container-copy
