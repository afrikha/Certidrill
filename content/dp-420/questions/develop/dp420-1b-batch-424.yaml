id: dp420-1b-batch-424
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A .NET service executes a `TransactionalBatch` of four operations on an Azure Cosmos DB for NoSQL container: two `UpsertItem` operations, then a `CreateItem` operation, then a `DeleteItem` operation. All the operations target the same partition key.

    The `CreateItem` operation uses an `id` that already exists in the logical partition.

    What is the result of the batch?
  fr: |
    Un service .NET exécute un `TransactionalBatch` de quatre opérations sur un conteneur Azure Cosmos DB for NoSQL : deux opérations `UpsertItem`, puis une opération `CreateItem`, puis une opération `DeleteItem`. Toutes les opérations ciblent la même clé de partition.

    L'opération `CreateItem` utilise un `id` qui existe déjà dans la partition logique.

    Quel est le résultat du lot ?
body:
  options:
    - { id: a, text: { en: "Nothing is committed; the CreateItem result is 409 and the three other results are 424.", fr: "Rien n'est validé ; le résultat de CreateItem est 409 et les trois autres résultats sont 424." } }
    - { id: b, text: { en: "The two upserts are committed; the CreateItem result is 409 and the DeleteItem result is 424.", fr: "Les deux upserts sont validés ; le résultat de CreateItem est 409 et celui de DeleteItem est 424." } }
    - { id: c, text: { en: "Nothing is committed; the four results are 409.", fr: "Rien n'est validé ; les quatre résultats sont 409." } }
    - { id: d, text: { en: "Nothing is committed; ExecuteAsync throws a CosmosException with status 409 and returns no per-operation results.", fr: "Rien n'est validé ; ExecuteAsync lève une CosmosException avec le code 409 et ne renvoie aucun résultat par opération." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A transactional batch commits only if every operation succeeds; otherwise the whole transaction is rolled back. The failing operation returns its own status code (409 Conflict for an existing id), and every other operation returns 424 (Failed Dependency). ExecuteAsync returns the response instead of throwing, so you check IsSuccessStatusCode."
    fr: "Un lot transactionnel n'est validé que si toutes les opérations réussissent ; sinon, toute la transaction est annulée. L'opération en échec renvoie son propre code d'état (409 Conflict pour un id existant), et chacune des autres opérations renvoie 424 (Failed Dependency). ExecuteAsync renvoie la réponse au lieu de lever une exception : vous vérifiez IsSuccessStatusCode."
  options:
    b: { en: "A batch is atomic: the operations that ran before the failure are rolled back too.", fr: "Un lot est atomique : les opérations exécutées avant l'échec sont elles aussi annulées." }
    c: { en: "Only the operation that failed returns 409; the others return 424.", fr: "Seule l'opération en échec renvoie 409 ; les autres renvoient 424." }
    d: { en: "A failed batch does not throw; the response reports a result for each operation.", fr: "Un lot en échec ne lève pas d'exception ; la réponse fournit un résultat pour chaque opération." }
references:
  - title: Transactional batch operations in Azure Cosmos DB using the .NET or Java SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/transactional-batch
