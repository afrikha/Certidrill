id: dp420-1c-embed-order-model-csharp
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing a .NET application that stores orders in Azure Cosmos DB for NoSQL. Customer profiles are stored as separate items. You have the following requirements:

    - An order has at most 40 order lines. Lines never change after the order is placed and are always displayed with the order.
    - The order page must be served by one point read.
    - A customer profile (addresses, loyalty points) is updated several times per day; updating it must not modify any order item.

    How should you complete the Order type? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application .NET qui stocke des commandes dans Azure Cosmos DB for NoSQL. Les profils clients sont stockés comme éléments distincts. Vous avez les exigences suivantes :

    - Une commande a au plus 40 lignes. Les lignes ne changent jamais après la passation de la commande et sont toujours affichées avec elle.
    - La page d'une commande doit être servie par une seule lecture ponctuelle.
    - Un profil client (adresses, points de fidélité) est mis à jour plusieurs fois par jour ; sa mise à jour ne doit modifier aucun élément de commande.

    Comment devez-vous compléter le type Order ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    public record OrderLine(string sku, int quantity, decimal unitPrice);

    public record Order(
        string id,
        [[customer]],
        DateTime orderDate,
        [[lines]]);
  slots:
    - id: customer
      options:
        - { id: cid, text: "string customerId" }
        - { id: cobj, text: "Customer customer" }
        - { id: clist, text: "List<Customer> customerHistory" }
    - id: lines
      options:
        - { id: lobj, text: "List<OrderLine> lines" }
        - { id: lids, text: "List<string> lineIds" }
        - { id: lcount, text: "int lineCount" }
answer:
  values: { customer: cid, lines: lobj }
explanation:
  correct:
    en: |-
      The order lines are bounded, immutable and always read with the order, so they are embedded as a list of OrderLine objects, and one point read returns the whole order. The customer profile changes often and is used on its own, so the order only references it with its ID; profile updates never touch orders.
    fr: |-
      Les lignes de commande sont bornées, immuables et toujours lues avec la commande : elles sont incorporées sous forme de liste d'objets OrderLine, et une seule lecture ponctuelle renvoie la commande complète. Le profil client change souvent et est utilisé seul : la commande ne le référence que par son ID, et les mises à jour du profil ne touchent jamais les commandes.
  options:
    cobj: { en: "Embedding the profile would require updating every order of the customer at each profile change.", fr: "Incorporer le profil imposerait de mettre à jour chaque commande du client à chaque changement de profil." }
    clist: { en: "Embedding copies of the profile duplicates frequently changing data in every order.", fr: "Incorporer des copies du profil duplique des données qui changent souvent dans chaque commande." }
    lids: { en: "Referencing the lines means extra reads, so the order page is no longer a single point read.", fr: "Référencer les lignes impose des lectures supplémentaires : la page de la commande n'est plus une seule lecture ponctuelle." }
    lcount: { en: "A count alone loses the line details that the order page displays.", fr: "Un simple compteur perd le détail des lignes affiché par la page de la commande." }
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
