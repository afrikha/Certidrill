id: dp420-1a-cfg-multiregion-writes
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Cosmos DB for NoSQL account with a write region in East US and a read region in West Europe. Players in Europe complain about slow saves, because every write is sent to East US.

    You need writes from European players to be accepted by the West Europe region with low latency.

    Which account setting should you enable?
  fr: |
    Tailspin Toys dispose d'un compte Azure Cosmos DB for NoSQL avec une région d'écriture dans East US et une région de lecture dans West Europe. Les joueurs européens se plaignent de sauvegardes lentes, car chaque écriture est envoyée à East US.

    Les écritures des joueurs européens doivent être acceptées par la région West Europe avec une faible latence.

    Quel paramètre du compte devez-vous activer ?
body:
  options:
    - { id: a, text: { en: "Multi-region writes", fr: "Les écritures multirégions" } }
    - { id: b, text: { en: "Service-managed failover", fr: "Le basculement géré par le service" } }
    - { id: c, text: { en: "Availability zones in West Europe", fr: "Les zones de disponibilité dans West Europe" } }
    - { id: d, text: { en: "Strong as the default consistency level", fr: "Strong comme niveau de cohérence par défaut" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With multi-region writes, every region of the account accepts writes, so the clients in Europe can write to West Europe locally. Concurrent updates of the same item in different regions are then handled by the conflict resolution policy of each container.
    fr: |
      Avec les écritures multirégions, chaque région du compte accepte les écritures : les clients européens peuvent écrire localement dans West Europe. Les mises à jour simultanées d'un même élément dans des régions différentes sont alors traitées par la stratégie de résolution des conflits de chaque conteneur.
  options:
    b: { en: "Service-managed failover promotes a read region only when the write region has an outage; there is still a single write region.", fr: "Le basculement géré par le service ne promeut une région de lecture qu'en cas de panne de la région d'écriture ; il reste une seule région d'écriture." }
    c: { en: "Availability zones improve resiliency inside a region; they don't make West Europe accept writes.", fr: "Les zones de disponibilité améliorent la résilience dans une région ; elles ne permettent pas à West Europe d'accepter les écritures." }
    d: { en: "Strong consistency increases write latency and doesn't add write regions.", fr: "La cohérence Strong augmente la latence d'écriture et n'ajoute pas de région d'écriture." }
references:
  - title: Manage Azure Cosmos DB for NoSQL resources using Azure CLI
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/manage-with-cli
  - title: Conflict Resolution Types and Resolution Policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/conflict-resolution-policies
