id: dp420-1d-capacity-mode-map
objective: "1.3.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans three Azure Cosmos DB for NoSQL workloads. Each workload must be placed on the capacity option that minimizes its cost while meeting its requirements.

    Which capacity option should you use for each workload? To answer, drag the appropriate options to the correct workloads. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit trois charges de travail Azure Cosmos DB for NoSQL. Chaque charge de travail doit utiliser l'option de capacité qui réduit au minimum son coût tout en respectant ses exigences.

    Quelle option de capacité devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les options appropriées vers les charges de travail correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: srv, text: { en: "Serverless account", fr: "Compte serverless" } }
    - { id: man, text: { en: "Standard (manual) provisioned throughput", fr: "Débit approvisionné standard (manuel)" } }
    - { id: aut, text: { en: "Autoscale provisioned throughput", fr: "Débit approvisionné avec mise à l'échelle automatique" } }
    - { id: shd, text: { en: "Shared database throughput for all the containers of the account", fr: "Débit de base de données partagé par tous les conteneurs du compte" } }
  targets:
    - id: poc
      text: { en: "Prototype used a few hours per week by testers in one region; average traffic is under 10% of the peak", fr: "Prototype utilisé quelques heures par semaine par des testeurs dans une région ; le trafic moyen est inférieur à 10 % du pic" }
    - id: steady
      text: { en: "Payment API that uses 80% to 95% of 30,000 RU/s around the clock", fr: "API de paiement qui utilise de 80 % à 95 % de 30 000 RU/s en permanence" }
    - id: spiky
      text: { en: "Ticketing site in two regions with unpredictable flash sales that must not be rate limited", fr: "Site de billetterie dans deux régions avec des ventes flash imprévisibles qui ne doivent pas être limitées en débit" }
answer:
  mapping: { poc: srv, steady: man, spiky: aut }
explanation:
  correct:
    en: |
      Serverless bills only consumed RUs and fits intermittent traffic with a low average-to-peak ratio in a single region. A workload that uses its full throughput most of the time is cheaper with standard throughput, since autoscale costs 1.5 times more per RU/s. Unpredictable spikes across two regions call for autoscale, because serverless accounts run in one region only and autoscale scales instantly up to its maximum.
    fr: |
      Le mode serverless ne facture que les RU consommées et convient à un trafic intermittent au faible rapport moyenne/pic dans une seule région. Une charge de travail qui utilise presque en permanence tout son débit coûte moins cher en débit standard, puisque la mise à l'échelle automatique coûte 1,5 fois plus par RU/s. Des pics imprévisibles sur deux régions demandent la mise à l'échelle automatique, car les comptes serverless ne fonctionnent que dans une seule région et la mise à l'échelle automatique monte instantanément jusqu'à son maximum.
  options:
    shd: { en: "Shared database throughput lets one container's burst consume capacity other containers need; it is not recommended for most workloads.", fr: "Le débit de base de données partagé laisse le pic d'un conteneur consommer la capacité dont les autres ont besoin ; il est déconseillé pour la plupart des charges de travail." }
references:
  - title: Compare Provisioned Throughput and Serverless - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/throughput-serverless
  - title: How to Choose Between Manual and Autoscale - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-choose-offer
