id: dp420-1b-query-web-continuation
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin hosts a product catalog API on several instances of Azure App Service. The API reads an Azure Cosmos DB for NoSQL container by using the .NET SDK. Consecutive HTTP requests from the same user can reach different instances, and the API keeps no session state.

    A mobile app displays 25 products at a time and has a **Load more** button. Each click must return the next 25 products of the same query, with the lowest RU consumption.

    What should you do?
  fr: |
    Tailspin héberge une API de catalogue de produits sur plusieurs instances d'Azure App Service. L'API lit un conteneur Azure Cosmos DB for NoSQL avec le SDK .NET. Des requêtes HTTP consécutives d'un même utilisateur peuvent atteindre des instances différentes, et l'API ne conserve aucun état de session.

    Une application mobile affiche 25 produits à la fois et propose un bouton **Charger plus**. Chaque clic doit renvoyer les 25 produits suivants de la même requête, avec la consommation de RU la plus faible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set MaxItemCount to -1, read every result on the first call, and return 25 products at a time from the instance's memory cache.", fr: "Définir MaxItemCount sur -1, lire tous les résultats au premier appel et renvoyer 25 produits à la fois depuis le cache mémoire de l'instance." } }
    - { id: b, text: { en: "Set MaxItemCount to 25, return the page's ContinuationToken to the app, and pass it back to GetItemQueryIterator on the next call.", fr: "Définir MaxItemCount sur 25, renvoyer le ContinuationToken de la page à l'application et le repasser à GetItemQueryIterator à l'appel suivant." } }
    - { id: c, text: { en: "Set MaxItemCount to 25 and keep the FeedIterator in a static dictionary keyed by user, then call ReadNextAsync on the next call.", fr: "Définir MaxItemCount sur 25 et conserver le FeedIterator dans un dictionnaire statique indexé par utilisateur, puis appeler ReadNextAsync à l'appel suivant." } }
    - { id: d, text: { en: "Set MaxItemCount to 25, create a new iterator on each call, and call ReadNextAsync once per page already displayed before reading the next one.", fr: "Définir MaxItemCount sur 25, créer un nouvel itérateur à chaque appel et appeler ReadNextAsync une fois par page déjà affichée avant de lire la suivante." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Queries are stateless on the server, so a continuation token is a bookmark that any instance can use to resume the query exactly where the previous page ended. Passing the token back to GetItemQueryIterator reads only the next page, so no result is read twice."
    fr: "Les requêtes sont sans état côté serveur : un jeton de continuation est un signet que n'importe quelle instance peut utiliser pour reprendre la requête exactement là où la page précédente s'est arrêtée. Repasser le jeton à GetItemQueryIterator ne lit que la page suivante : aucun résultat n'est lu deux fois."
  options:
    c: { en: "The iterator lives in one instance's memory; the next request can reach another instance that does not have it.", fr: "L'itérateur réside dans la mémoire d'une instance ; la requête suivante peut atteindre une autre instance qui ne l'a pas." }
    d: { en: "Rereading every earlier page on each click consumes RUs that grow with the page number.", fr: "Relire toutes les pages précédentes à chaque clic consomme des RU qui augmentent avec le numéro de page." }
    a: { en: "Reading all the results up front costs RUs for products that may never be displayed, and the cache is local to one instance.", fr: "Lire tous les résultats d'emblée consomme des RU pour des produits peut-être jamais affichés, et le cache est local à une instance." }
references:
  - title: Pagination - Query language in Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/query/pagination
