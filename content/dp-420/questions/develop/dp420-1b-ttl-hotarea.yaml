id: dp420-1b-ttl-hotarea
objective: "1.2.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    An Azure Cosmos DB for NoSQL container named **sessions** has its `DefaultTimeToLive` set to 86400. The following table shows five items, their `ttl` property and the time elapsed since each item was last modified. No item will be modified again.

    Answer each prompt by selecting the appropriate item.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un conteneur Azure Cosmos DB for NoSQL nommé **sessions** a sa propriété `DefaultTimeToLive` définie sur 86400. Le tableau suivant présente cinq éléments, leur propriété `ttl` et le temps écoulé depuis la dernière modification de chaque élément. Aucun élément ne sera plus modifié.

    Répondez à chaque consigne en sélectionnant l'élément approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "The item that is never deleted automatically", fr: "L'élément qui n'est jamais supprimé automatiquement" } }
    - { id: p2, text: { en: "The item that expires first", fr: "L'élément qui expire en premier" } }
  grid:
    header: [id, ttl, { en: "Last modified", fr: "Dernière modification" }]
    rows:
      - [{ text: s-01, area: i1 }, { text: { en: "(not set)", fr: "(absente)" } }, { text: { en: "10 hours ago", fr: "il y a 10 heures" } }]
      - [{ text: s-02, area: i2 }, { text: "-1" }, { text: { en: "30 days ago", fr: "il y a 30 jours" } }]
      - [{ text: s-03, area: i3 }, { text: "3600" }, { text: { en: "20 minutes ago", fr: "il y a 20 minutes" } }]
      - [{ text: s-04, area: i4 }, { text: "172800" }, { text: { en: "1 day ago", fr: "il y a 1 jour" } }]
      - [{ text: s-05, area: i5 }, { text: "600" }, { text: { en: "8 minutes ago", fr: "il y a 8 minutes" } }]
answer:
  values: { p1: i2, p2: i5 }
explanation:
  correct:
    en: "An item's ttl overrides the container default, and expiry is counted from the last modification. s-02 has ttl -1 and never expires. Remaining lifetimes are about 14 hours for s-01 (default 86400 s), 40 minutes for s-03, 1 day for s-04 and 2 minutes for s-05, so s-05 expires first."
    fr: "Le ttl d'un élément remplace la valeur par défaut du conteneur, et l'expiration est calculée à partir de la dernière modification. s-02 a un ttl de -1 et n'expire jamais. Les durées restantes sont d'environ 14 heures pour s-01 (valeur par défaut de 86400 s), 40 minutes pour s-03, 1 jour pour s-04 et 2 minutes pour s-05 : s-05 expire donc en premier."
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
