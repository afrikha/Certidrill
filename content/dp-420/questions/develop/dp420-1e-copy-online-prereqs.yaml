id: dp420-1e-copy-online-prereqs
objective: "1.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL account named **cosmos-fab** that uses periodic backup. The account has no capabilities enabled. The write region is North Europe.

    You plan to move a container named **telemetry** to a new container that uses a hierarchical partition key. The devices must keep writing to **telemetry** during the copy, so you will use an online container copy job.

    Which three actions should you perform on **cosmos-fab** before you create the job? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-fab** qui utilise la sauvegarde périodique. Aucune capacité n'est activée sur le compte. La région d'écriture est North Europe.

    Vous prévoyez de déplacer un conteneur nommé **telemetry** vers un nouveau conteneur qui utilise une clé de partition hiérarchique. Les appareils doivent continuer d'écrire dans **telemetry** pendant la copie : vous utiliserez donc une tâche de copie de conteneur en ligne.

    Quelles sont les trois actions à effectuer sur **cosmos-fab** avant de créer la tâche ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Switch the account to continuous backup.", fr: "Passer le compte en sauvegarde continue." } }
    - { id: b, text: { en: "Enable the all versions and deletes change feed mode.", fr: "Activer le mode de flux de modification toutes les versions et suppressions." } }
    - { id: c, text: { en: "Add the EnableOnlineContainerCopy capability.", fr: "Ajouter la capacité EnableOnlineContainerCopy." } }
    - { id: d, text: { en: "Enable the Merge partition capability.", fr: "Activer la capacité Merge partition." } }
    - { id: e, text: { en: "Configure the account for multi-region writes.", fr: "Configurer le compte pour les écritures multirégions." } }
    - { id: f, text: { en: "Enable the analytical store on the account.", fr: "Activer le magasin analytique sur le compte." } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      An online copy job reads the source through the all versions and deletes change feed, which requires continuous backup on the source account. The account also needs the EnableOnlineContainerCopy capability; wait at least 30 minutes after adding it before you create the job.
    fr: |
      Une tâche de copie en ligne lit la source au moyen du flux de modification en mode toutes les versions et suppressions, qui exige la sauvegarde continue sur le compte source. Le compte doit aussi disposer de la capacité EnableOnlineContainerCopy ; attendez au moins 30 minutes après l'avoir ajoutée avant de créer la tâche.
  options:
    d:
      en: |
        Copy jobs do not work on accounts with the Merge partition capability; it must be disabled, not enabled.
      fr: |
        Les tâches de copie ne fonctionnent pas sur les comptes dotés de la capacité Merge partition ; elle doit être désactivée, et non activée.
    e:
      en: |
        Multi-region writes are not a prerequisite; the job simply runs in a write region of the account.
      fr: |
        Les écritures multirégions ne sont pas un prérequis ; la tâche s'exécute simplement dans une région d'écriture du compte.
    f:
      en: |
        The analytical store plays no part in copy jobs, which use the change feed of the transactional store.
      fr: |
        Le magasin analytique ne joue aucun rôle dans les tâches de copie, qui utilisent le flux de modification du magasin transactionnel.
references:
  - title: Container Copy Jobs - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/container-copy
