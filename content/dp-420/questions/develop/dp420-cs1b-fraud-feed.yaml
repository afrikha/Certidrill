id: dp420-cs1b-fraud-feed
objective: "1.4.2"
type: single
caseStudy: dp420-cs1b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to implement the change processing of svc-fraud to meet the requirements. What should you do?
  fr: |
    Vous devez implémenter le traitement des modifications de svc-fraud pour satisfaire les exigences. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Use the change feed processor of the azure-cosmos library with a lease container.", fr: "Utiliser le processeur de flux de modification de la bibliothèque azure-cosmos avec un conteneur de bail." } }
    - { id: b, text: { en: "Use the change feed pull model and save the continuation token after each processed batch.", fr: "Utiliser le modèle de tirage du flux de modification et enregistrer le jeton de continuation après chaque lot traité." } }
    - { id: c, text: { en: "Use the change feed pull model and start each run from the beginning of the container.", fr: "Utiliser le modèle de tirage du flux de modification et démarrer chaque exécution au début du conteneur." } }
    - { id: d, text: { en: "Deploy an Azure Functions app that uses an Azure Cosmos DB trigger on the container.", fr: "Déployer une application Azure Functions qui utilise un déclencheur Azure Cosmos DB sur le conteneur." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The change feed processor is part of the .NET and Java SDKs only; a Python application reads the change feed with the pull model. The continuation token records the position reached in the feed, so saving it after each processed batch lets svc-fraud resume from the last processed change after a restart, inside AKS.
    fr: |
      Le processeur de flux de modification n'existe que dans les SDK .NET et Java ; une application Python lit le flux de modification avec le modèle de tirage. Le jeton de continuation enregistre la position atteinte dans le flux : l'enregistrer après chaque lot traité permet à svc-fraud de reprendre à partir de la dernière modification traitée après un redémarrage, dans AKS.
  options:
    a: { en: "The change feed processor is not available in the Python SDK.", fr: "Le processeur de flux de modification n'est pas disponible dans le SDK Python." }
    c: { en: "Starting from the beginning reprocesses every claim after each restart instead of resuming from the last processed change.", fr: "Démarrer au début retraite tous les sinistres après chaque redémarrage au lieu de reprendre à la dernière modification traitée." }
    d: { en: "Azure Functions is an additional compute service, which the requirements exclude.", fr: "Azure Functions est un service de calcul supplémentaire, ce que les exigences excluent." }
references:
  - title: Change feed processor in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/change-feed-processor
