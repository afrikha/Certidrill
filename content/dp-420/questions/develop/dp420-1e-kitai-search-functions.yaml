id: dp420-1e-kitai-search-functions
objective: "1.5.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind builds a recipe assistant on Azure Cosmos DB for NoSQL. The **recipes** container has a vector policy and index on `/embedding`, and a full-text policy and index on `/instructions`. Your AI coding assistant, which has the Azure Cosmos DB Agent Kit installed, writes the queries of the assistant.

    Which system function should each query use? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind crée un assistant de recettes sur Azure Cosmos DB for NoSQL. Le conteneur **recipes** possède une stratégie et un index vectoriels sur `/embedding`, ainsi qu'une stratégie et un index de texte intégral sur `/instructions`. Votre assistant de codage IA, sur lequel Azure Cosmos DB Agent Kit est installé, écrit les requêtes de l'assistant.

    Quelle fonction système chaque requête doit-elle utiliser ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vd, text: VectorDistance }
    - { id: fts, text: FullTextScore }
    - { id: rrf, text: RRF }
    - { id: ftc, text: FullTextContains }
    - { id: geo, text: ST_DISTANCE }
    - { id: arr, text: ARRAY_CONTAINS }
  targets:
    - id: semantic
      text: { en: "Order recipes by semantic similarity to the embedding of the user's request", fr: "Trier les recettes par similarité sémantique avec l'incorporation de la demande de l'utilisateur" }
    - id: keyword
      text: { en: "Order recipes by BM25 relevance of the terms \"sourdough\" and \"rye\"", fr: "Trier les recettes par pertinence BM25 des termes « sourdough » et « rye »" }
    - id: fuse
      text: { en: "Merge the semantic ranking and the BM25 ranking into one ranking", fr: "Fusionner le classement sémantique et le classement BM25 en un seul classement" }
    - id: filter
      text: { en: "Keep only recipes whose instructions contain the phrase \"cold proof\"", fr: "Ne conserver que les recettes dont les instructions contiennent l'expression « cold proof »" }
answer:
  mapping: { semantic: vd, keyword: fts, fuse: rrf, filter: ftc }
explanation:
  correct:
    en: |
      VectorDistance computes the similarity between the stored vectors and a query vector. FullTextScore ranks items by BM25 relevance in an ORDER BY RANK clause, and RRF merges several rankings, such as a vector score and a full-text score, by Reciprocal Rank Fusion. FullTextContains is a Boolean filter that returns true when the phrase is in the property.
    fr: |
      VectorDistance calcule la similarité entre les vecteurs stockés et un vecteur de requête. FullTextScore classe les éléments par pertinence BM25 dans une clause ORDER BY RANK, et RRF fusionne plusieurs classements, comme un score vectoriel et un score de texte intégral, par Reciprocal Rank Fusion. FullTextContains est un filtre booléen qui renvoie true quand l'expression figure dans la propriété.
  options:
    geo:
      en: |
        ST_DISTANCE measures the distance between GeoJSON geometries, not text or vector similarity.
      fr: |
        ST_DISTANCE mesure la distance entre des géométries GeoJSON, pas une similarité de texte ou de vecteurs.
    arr:
      en: |
        ARRAY_CONTAINS tests whether an array contains a value; it does not search a text property.
      fr: |
        ARRAY_CONTAINS vérifie si un tableau contient une valeur ; il ne recherche pas dans une propriété de texte.
references:
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
  - title: Use Hybrid Search - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search
