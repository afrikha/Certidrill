id: dp420-1b-ttl-item-only
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores user documents and temporary upload tokens in the same Azure Cosmos DB for NoSQL container. Time to live (TTL) is not configured on the container. The developers add `"ttl": 3600` to each upload token, but the tokens never expire.

    Upload tokens must expire one hour after they are written. User documents, which have no `ttl` property, must never expire.

    What should you do?
  fr: |
    Contoso stocke des documents utilisateur et des jetons de chargement temporaires dans le même conteneur Azure Cosmos DB for NoSQL. La durée de vie (TTL) n'est pas configurée sur le conteneur. Les développeurs ajoutent `"ttl": 3600` à chaque jeton de chargement, mais les jetons n'expirent jamais.

    Les jetons de chargement doivent expirer une heure après leur écriture. Les documents utilisateur, qui n'ont pas de propriété `ttl`, ne doivent jamais expirer.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `\"ttl\": -1` to every user document and keep the container setting unchanged.", fr: "Ajouter `\"ttl\": -1` à chaque document utilisateur et conserver le paramètre du conteneur." } }
    - { id: b, text: { en: "Set the container's DefaultTimeToLive to -1.", fr: "Définir la propriété DefaultTimeToLive du conteneur sur -1." } }
    - { id: c, text: { en: "Set the container's DefaultTimeToLive to 3600.", fr: "Définir la propriété DefaultTimeToLive du conteneur sur 3600." } }
    - { id: d, text: { en: "Set the container's DefaultTimeToLive to 0.", fr: "Définir la propriété DefaultTimeToLive du conteneur sur 0." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An item's ttl is honored only when the container's DefaultTimeToLive is present and not null. The value -1 (On, no default) enables TTL without expiring items by default, so items with ttl 3600 expire after one hour and items without ttl never expire."
    fr: "Le ttl d'un élément n'est pris en compte que si la propriété DefaultTimeToLive du conteneur est présente et non null. La valeur -1 (On, sans valeur par défaut) active la TTL sans faire expirer les éléments par défaut : les éléments avec un ttl de 3600 expirent au bout d'une heure et ceux sans ttl n'expirent jamais."
  options:
    c: { en: "A default of 3600 also makes every user document without ttl expire after one hour.", fr: "Une valeur par défaut de 3600 fait aussi expirer au bout d'une heure chaque document utilisateur sans ttl." }
    d: { en: "TTL values must be nonzero: -1 or a positive number of seconds.", fr: "Les valeurs de TTL doivent être non nulles : -1 ou un nombre positif de secondes." }
    a: { en: "While TTL is off on the container, every item ttl is ignored, so the tokens still never expire.", fr: "Tant que la TTL est désactivée sur le conteneur, tous les ttl d'éléments sont ignorés : les jetons n'expirent toujours pas." }
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
