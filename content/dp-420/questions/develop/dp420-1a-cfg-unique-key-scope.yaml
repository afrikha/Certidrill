id: dp420-1a-cfg-unique-key-scope
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL container named **users** that is partitioned on `/tenantId`. The container was created with a unique key policy on `/email`. The container already holds these items for the tenant **contoso**: one item with `"email": "ana@contoso.com"` and one item that has no `email` property.

    The tenant **fabrikam** also has an item with `"email": "ana@contoso.com"`.

    Which insert operation fails?
  fr: |
    Contoso dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **users**, partitionné sur `/tenantId`. Le conteneur a été créé avec une stratégie de clé unique sur `/email`. Le conteneur contient déjà ces éléments pour le locataire **contoso** : un élément avec `"email": "ana@contoso.com"` et un élément qui n'a pas de propriété `email`.

    Le locataire **fabrikam** possède lui aussi un élément avec `"email": "ana@contoso.com"`.

    Quelle opération d'insertion échoue ?
body:
  options:
    - { id: a, text: { en: "A new contoso item that has no email property", fr: "Un nouvel élément contoso sans propriété email" } }
    - { id: b, text: { en: "A new contoso item with the email Ana@Contoso.com", fr: "Un nouvel élément contoso avec l'adresse Ana@Contoso.com" } }
    - { id: c, text: { en: "A new litware item with the email ana@contoso.com", fr: "Un nouvel élément litware avec l'adresse ana@contoso.com" } }
    - { id: d, text: { en: "A new fabrikam item with the email bob@contoso.com", fr: "Un nouvel élément fabrikam avec l'adresse bob@contoso.com" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Sparse unique keys aren't supported: a missing unique key path is treated as null, and null takes part in the constraint. The contoso partition already holds an item without an email, so a second one violates the unique key.
    fr: |
      Les clés uniques éparses ne sont pas prises en charge : un chemin de clé unique absent est traité comme null, et null participe à la contrainte. La partition contoso contient déjà un élément sans adresse e-mail : un second élément de ce type viole la clé unique.
  options:
    b: { en: "Unique key values are case sensitive, so Ana@Contoso.com differs from ana@contoso.com.", fr: "Les valeurs de clé unique respectent la casse : Ana@Contoso.com est différent de ana@contoso.com." }
    c: { en: "A unique key is scoped to a logical partition; the same email can exist in other tenants.", fr: "Une clé unique est limitée à une partition logique ; la même adresse peut exister dans d'autres locataires." }
    d: { en: "No item of the fabrikam partition uses this email, so the insert succeeds.", fr: "Aucun élément de la partition fabrikam n'utilise cette adresse : l'insertion réussit." }
references:
  - title: Unique key constraints in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/unique-keys
