id: dp420-1a-mgmt-python-create
objective: "1.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware is writing a Python script that provisions an Azure Cosmos DB for NoSQL container for IoT readings. The container must meet the following requirements:

    - readings are partitioned by device, stored in the `deviceId` property;
    - each reading is deleted automatically seven days after its last write;
    - throughput scales automatically between 400 and 4,000 RU/s.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware écrit un script Python qui approvisionne un conteneur Azure Cosmos DB for NoSQL pour des mesures IoT. Le conteneur doit respecter les exigences suivantes :

    - les mesures sont partitionnées par appareil, stocké dans la propriété `deviceId` ;
    - chaque mesure est supprimée automatiquement sept jours après sa dernière écriture ;
    - le débit s'ajuste automatiquement entre 400 et 4 000 RU/s.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.cosmos import PartitionKey, ThroughputProperties

    database = client.create_database_if_not_exists(id="iot")
    container = database.create_container_if_not_exists(
        id="readings",
        partition_key=[[pk]],
        default_ttl=[[ttl]],
        offer_throughput=[[tp]],
    )
  slots:
    - id: pk
      options:
        - { id: pkid, text: "PartitionKey(path=\"/id\")" }
        - { id: pkdevice, text: "PartitionKey(path=\"/deviceId\")" }
        - { id: pknoslash, text: "PartitionKey(path=\"deviceId\")" }
    - id: ttl
      options:
        - { id: s604800, text: "604800" }
        - { id: s7, text: "7" }
        - { id: m10080, text: "10080" }
        - { id: minus1, text: "-1" }
    - id: tp
      options:
        - { id: offer4000, text: "ThroughputProperties(offer_throughput=4000)" }
        - { id: int4000, text: "4000" }
        - { id: auto400, text: "ThroughputProperties(auto_scale_max_throughput=400)" }
        - { id: auto4000, text: "ThroughputProperties(auto_scale_max_throughput=4000)" }
answer:
  values: { pk: pkdevice, ttl: s604800, tp: auto4000 }
explanation:
  correct:
    en: |
      A partition key path starts with a slash and names the property, here `/deviceId`. `default_ttl` is expressed in seconds: seven days is 604,800 seconds. Autoscale is set with `auto_scale_max_throughput`, and a maximum of 4,000 RU/s scales between 400 and 4,000 RU/s.
    fr: |
      Un chemin de clé de partition commence par une barre oblique et nomme la propriété, ici `/deviceId`. `default_ttl` s'exprime en secondes : sept jours correspondent à 604 800 secondes. La mise à l'échelle automatique se définit avec `auto_scale_max_throughput`, et un maximum de 4 000 RU/s varie entre 400 et 4 000 RU/s.
  options:
    pknoslash: { en: "Partition key paths must start with a forward slash.", fr: "Les chemins de clé de partition doivent commencer par une barre oblique." }
    pkid: { en: "Partitioning on /id doesn't group the readings of a device.", fr: "Partitionner sur /id ne regroupe pas les mesures d'un appareil." }
    m10080: { en: "10,080 is seven days in minutes; TTL is expressed in seconds.", fr: "10 080 correspond à sept jours en minutes ; la durée de vie s'exprime en secondes." }
    minus1: { en: "-1 enables TTL but items never expire unless they set their own ttl.", fr: "-1 active la durée de vie, mais les éléments n'expirent jamais sauf s'ils définissent leur propre ttl." }
    offer4000: { en: "offer_throughput sets fixed manual throughput.", fr: "offer_throughput définit un débit manuel fixe." }
    auto400: { en: "A maximum of 400 RU/s is below the autoscale minimum of 1,000 RU/s and wouldn't reach 4,000 RU/s.", fr: "Un maximum de 400 RU/s est inférieur au minimum de 1 000 RU/s de la mise à l'échelle automatique et n'atteindrait pas 4 000 RU/s." }
references:
  - title: azure.cosmos.database.DatabaseProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.database.databaseproxy
  - title: azure.cosmos.offer.ThroughputProperties class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.offer.throughputproperties
