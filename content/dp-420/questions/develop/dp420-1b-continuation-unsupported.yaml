id: dp420-1b-continuation-unsupported
objective: "1.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware exposes reports from an Azure Cosmos DB for NoSQL container through a stateless .NET API. Each report is a query whose results the API returns page by page, by giving a continuation token to the caller.

    Which two queries return results that the API cannot resume by using a continuation token?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware expose des rapports issus d'un conteneur Azure Cosmos DB for NoSQL au moyen d'une API .NET sans état. Chaque rapport est une requête dont l'API renvoie les résultats page par page, en transmettant un jeton de continuation à l'appelant.

    Quelles sont les deux requêtes dont l'API ne peut pas reprendre les résultats avec un jeton de continuation ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "SELECT * FROM c WHERE c.status = 'open'" }
    - { id: b, text: "SELECT c.id, c.total FROM c WHERE c.total > 100" }
    - { id: c, text: "SELECT c.category, COUNT(1) AS total FROM c GROUP BY c.category" }
    - { id: d, text: "SELECT DISTINCT VALUE c.city FROM c" }
    - { id: e, text: "SELECT DISTINCT VALUE c.city FROM c ORDER BY c.city" }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: "Continuation tokens are not supported for GROUP BY or DISTINCT queries, because resuming them would require storing a large amount of state. A DISTINCT query becomes resumable when you add an ORDER BY clause."
    fr: "Les jetons de continuation ne sont pas pris en charge pour les requêtes GROUP BY ou DISTINCT, car leur reprise nécessiterait de stocker un état volumineux. Une requête DISTINCT devient reprenable quand vous lui ajoutez une clause ORDER BY."
  options:
    e: { en: "DISTINCT combined with ORDER BY is the documented exception that supports continuation tokens.", fr: "DISTINCT combiné à ORDER BY est l'exception documentée qui prend en charge les jetons de continuation." }
    a: { en: "A simple filter query is streamable and supports continuation tokens.", fr: "Une requête de filtrage simple est diffusable en continu et prend en charge les jetons de continuation." }
    b: { en: "A projection with a filter is streamable and supports continuation tokens.", fr: "Une projection avec filtre est diffusable en continu et prend en charge les jetons de continuation." }
references:
  - title: Pagination - Query language in Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/query/pagination
