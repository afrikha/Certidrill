id: dp420-1c-embed-contact-details
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind stores customer profiles in Azure Cosmos DB for NoSQL. Each customer has at most three postal addresses and two phone numbers. The application always displays and updates the addresses and phone numbers together with the profile, and they rarely change.

    You need to model the addresses and phone numbers so that displaying a profile costs as few RUs as possible.

    What should you do?
  fr: |
    Northwind stocke des profils clients dans Azure Cosmos DB for NoSQL. Chaque client a au plus trois adresses postales et deux numéros de téléphone. L'application affiche et met à jour les adresses et les numéros de téléphone toujours avec le profil, et ils changent rarement.

    Vous devez modéliser les adresses et les numéros de téléphone pour que l'affichage d'un profil coûte le moins de RU possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Embed the addresses and phone numbers as arrays in the customer item", fr: "Incorporer les adresses et les numéros de téléphone sous forme de tableaux dans l'élément client" } }
    - { id: b, text: { en: "Store each address and phone number as a separate item in the customer's partition", fr: "Stocker chaque adresse et chaque numéro de téléphone comme un élément distinct dans la partition du client" } }
    - { id: c, text: { en: "Store the addresses and phone numbers in a second container partitioned by /customerId", fr: "Stocker les adresses et les numéros de téléphone dans un second conteneur partitionné par /customerId" } }
    - { id: d, text: { en: "Store the IDs of separate address and phone items in arrays in the customer item", fr: "Stocker dans des tableaux de l'élément client les ID d'éléments d'adresse et de téléphone distincts" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The relationship is contained, one-to-few, bounded, rarely changing and always read together, which are the conditions for embedding. The whole profile is then returned by a single point read and updated by a single write.
    fr: |-
      La relation est contenue, de type un-à-quelques, bornée, rarement modifiée et toujours lue ensemble : ce sont les conditions de l'incorporation. Le profil complet est alors renvoyé par une seule lecture ponctuelle et mis à jour par une seule écriture.
  options:
    b: { en: "Separate items require a query instead of a point read and add writes for a profile update.", fr: "Des éléments distincts exigent une requête au lieu d'une lecture ponctuelle et ajoutent des écritures lors d'une mise à jour du profil." }
    c: { en: "A second container adds at least one request per profile display.", fr: "Un second conteneur ajoute au moins une requête à chaque affichage de profil." }
    d: { en: "Storing references still requires extra reads to load each address and phone number.", fr: "Stocker des références impose toujours des lectures supplémentaires pour charger chaque adresse et chaque numéro." }
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
