id: dp420-1a-thr-model-match
objective: "1.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is planning three Azure Cosmos DB for NoSQL workloads. Each workload has its own requirements for cost, scale and regions.

    Which throughput option should you choose for each workload? To answer, drag the appropriate options to the correct workloads. Each option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit trois charges de travail Azure Cosmos DB for NoSQL. Chaque charge de travail a ses propres exigences de coût, d'échelle et de régions.

    Quelle option de débit devez-vous choisir pour chaque charge de travail ? Pour répondre, faites glisser les options appropriées vers les charges de travail correspondantes. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: manual, text: { en: "Manual throughput on the container", fr: "Débit manuel sur le conteneur" } }
    - { id: autoscale, text: { en: "Autoscale throughput on the container", fr: "Débit à mise à l'échelle automatique sur le conteneur" } }
    - { id: serverless, text: { en: "Serverless account", fr: "Compte serverless" } }
    - { id: burst, text: { en: "Burst capacity", fr: "Capacité en rafale" } }
  targets:
    - id: t1
      text: { en: "Payment ledger: steady load of about 8,000 RU/s around the clock, with a throughput SLA", fr: "Grand livre des paiements : charge stable d'environ 8 000 RU/s jour et nuit, avec un SLA de débit" }
    - id: t2
      text: { en: "Mobile banking: unpredictable peaks up to 50,000 RU/s, quiet nights, three regions", fr: "Banque mobile : pics imprévisibles jusqu'à 50 000 RU/s, nuits calmes, trois régions" }
    - id: t3
      text: { en: "Internal proof of concept: used a few hours per month in one region", fr: "Preuve de concept interne : utilisée quelques heures par mois dans une seule région" }
answer:
  mapping: { t1: manual, t2: autoscale, t3: serverless }
explanation:
  correct:
    en: |
      Manual throughput is the most economical choice for predictable, sustained traffic. Autoscale scales instantly between 10 percent and 100 percent of its maximum, which suits variable traffic, and it supports multiple regions. Serverless bills only consumed RUs and suits rare use, but it is limited to a single region.
    fr: |
      Le débit manuel est le choix le plus économique pour un trafic soutenu et prévisible. La mise à l'échelle automatique varie instantanément entre 10 % et 100 % de son maximum, ce qui convient à un trafic variable, et elle prend en charge plusieurs régions. Le mode serverless ne facture que les RU consommées et convient à une utilisation rare, mais il est limité à une seule région.
  options:
    burst: { en: "Burst capacity isn't a throughput model: it only absorbs short spikes on partitions below 3,000 RU/s, with no guarantee.", fr: "La capacité en rafale n'est pas un modèle de débit : elle absorbe seulement de brefs pics sur les partitions de moins de 3 000 RU/s, sans garantie." }
references:
  - title: Create Azure Cosmos DB containers and databases with autoscale throughput
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale
  - title: How to choose between provisioned throughput and serverless
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/throughput-serverless
