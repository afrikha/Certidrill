id: dp420-1c-synth-concatenate
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware stores machine telemetry in an Azure Cosmos DB for NoSQL container. Each item has `deviceId` (150 devices) and `readingYear` properties. A device produces about 8 GB of data per year, and data is kept for five years. Every query specifies both `deviceId` and `readingYear`.

    You need a partition key that keeps each query in one logical partition and keeps every logical partition below the storage limit.

    What should you use as the partition key?
  fr: |
    Litware stocke la télémétrie de machines dans un conteneur Azure Cosmos DB for NoSQL. Chaque élément a les propriétés `deviceId` (150 appareils) et `readingYear`. Un appareil produit environ 8 Go de données par an, et les données sont conservées cinq ans. Chaque requête précise à la fois `deviceId` et `readingYear`.

    Vous avez besoin d'une clé de partition qui maintient chaque requête dans une seule partition logique et chaque partition logique en dessous de la limite de stockage.

    Que devez-vous utiliser comme clé de partition ?
body:
  options:
    - { id: a, text: { en: "/deviceId", fr: "/deviceId" } }
    - { id: b, text: { en: "/readingYear", fr: "/readingYear" } }
    - { id: c, text: { en: "A partitionKey property that concatenates deviceId and readingYear, such as dev-042-2026", fr: "Une propriété partitionKey qui concatène deviceId et readingYear, par exemple dev-042-2026" } }
    - { id: d, text: { en: "A partitionKey property that appends a random number from 1 to 50 to deviceId, such as dev-042.17", fr: "Une propriété partitionKey qui ajoute un nombre aléatoire de 1 à 50 à deviceId, par exemple dev-042.17" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A synthetic key made by concatenating deviceId and readingYear has 750 values of about 8 GB each, below the 20 GB limit. Because every query supplies both values, the application can compute the key and target a single logical partition.
    fr: |-
      Une clé synthétique formée en concaténant deviceId et readingYear a 750 valeurs d'environ 8 Go chacune, sous la limite de 20 Go. Comme chaque requête fournit les deux valeurs, l'application peut calculer la clé et cibler une seule partition logique.
  options:
    a: { en: "Five years of data per device is about 40 GB, above the 20 GB logical partition limit.", fr: "Cinq ans de données par appareil représentent environ 40 Go, au-delà de la limite de 20 Go par partition logique." }
    b: { en: "Five values only: each year holds about 1.2 TB and all current writes hit one value.", fr: "Cinq valeurs seulement : chaque année contient environ 1,2 To et toutes les écritures courantes visent une seule valeur." }
    d: { en: "A random suffix cannot be recomputed by the queries, so they would have to read every suffix.", fr: "Un suffixe aléatoire ne peut pas être recalculé par les requêtes, qui devraient donc lire tous les suffixes." }
references:
  - title: Create a synthetic partition key
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/synthetic-partition-keys
