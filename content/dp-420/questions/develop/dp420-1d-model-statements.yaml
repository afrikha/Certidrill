id: dp420-1d-model-statements
objective: "1.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs a change feed processor in a .NET application and is evaluating the pull model for a new component that reads the same Azure Cosmos DB for NoSQL container.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exécute un processeur de flux de modification dans une application .NET et évalue le modèle de tirage pour un nouveau composant qui lit le même conteneur Azure Cosmos DB for NoSQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The new component can convert the processor's lease state into a continuation token to resume from the same point.
        fr: Le nouveau composant peut convertir l'état des baux du processeur en jeton de continuation pour reprendre au même point.
    - id: s2
      text:
        en: If the processor's delegate throws an unhandled exception, the processor sends the same batch of changes to the delegate again.
        fr: Si le délégué du processeur lève une exception non gérée, le processeur renvoie le même lot de modifications au délégué.
    - id: s3
      text:
        en: When no new change is available, the processor waits for its poll interval, whereas pull model code must detect this case and poll again itself.
        fr: Lorsqu'aucune nouvelle modification n'est disponible, le processeur attend son intervalle d'interrogation, alors que le code du modèle de tirage doit détecter ce cas et interroger de nouveau lui-même.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Leases and continuation tokens both bookmark the processed position, but you cannot convert one into the other. An unhandled exception in the delegate stops the thread, and a new thread restarts from the last saved lease state, which resends the batch and gives at-least-once delivery. The processor polls automatically based on WithPollInterval; the pull model returns NotModified and leaves the waiting and rechecking to your code.
    fr: |
      Les baux et les jetons de continuation marquent tous deux la position traitée, mais vous ne pouvez pas convertir l'un en l'autre. Une exception non gérée dans le délégué arrête le thread, et un nouveau thread redémarre depuis le dernier état de bail enregistré, ce qui renvoie le lot et assure une livraison au moins une fois. Le processeur interroge automatiquement selon WithPollInterval ; le modèle de tirage renvoie NotModified et laisse à votre code l'attente et la nouvelle vérification.
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
