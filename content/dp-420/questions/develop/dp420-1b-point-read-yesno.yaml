id: dp420-1b-point-read-yesno
objective: "1.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin stores flight bookings in an Azure Cosmos DB for NoSQL container partitioned by `/passengerId`. Developers use the .NET SDK and want to minimize the RU cost of reads.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin stocke des réservations de vols dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/passengerId`. Les développeurs utilisent le SDK .NET et veulent réduire au minimum le coût en RU des lectures.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A query whose WHERE clause filters on both the booking id and the passengerId is executed as a point read."
        fr: "Une requête dont la clause WHERE filtre à la fois sur l'id de la réservation et sur passengerId est exécutée comme une lecture ponctuelle."
    - id: s2
      text:
        en: "A point read of a booking requires both its id and its passengerId value."
        fr: "Une lecture ponctuelle d'une réservation exige à la fois son id et sa valeur passengerId."
    - id: s3
      text:
        en: "ReadItemStreamAsync returns the booking content as a stream without deserializing it."
        fr: "ReadItemStreamAsync renvoie le contenu de la réservation sous forme de flux, sans le désérialiser."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "A query that filters on an item's id and partition key is still a query and costs more than a point read; point reads are the ReadItem methods of the SDKs. A point read needs the id and the partition key value. ReadItemStreamAsync returns a ResponseMessage whose Content is the raw stream, which avoids deserialization."
    fr: "Une requête qui filtre sur l'id et la clé de partition d'un élément reste une requête et coûte plus cher qu'une lecture ponctuelle ; les lectures ponctuelles sont les méthodes ReadItem des SDK. Une lecture ponctuelle exige l'id et la valeur de clé de partition. ReadItemStreamAsync renvoie un ResponseMessage dont Content est le flux brut, ce qui évite la désérialisation."
references:
  - title: Read an Item Using .NET - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-read-item
  - title: Optimize Request Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
