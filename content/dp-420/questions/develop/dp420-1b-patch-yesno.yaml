id: dp420-1b-patch-yesno
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses partial document update (patch) on items of an Azure Cosmos DB for NoSQL container. An item contains the array `"steps": ["draft", "review", "publish"]` and has no `viewCount` property.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise la mise à jour partielle de document (patch) sur les éléments d'un conteneur Azure Cosmos DB for NoSQL. Un élément contient le tableau `"steps": ["draft", "review", "publish"]` et n'a pas de propriété `viewCount`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A Set operation on the path /steps/1 with the value \"approve\" leaves the array with three elements."
        fr: "Une opération Set sur le chemin /steps/1 avec la valeur \"approve\" laisse le tableau avec trois éléments."
    - id: s2
      text:
        en: "An Increment operation of 1 on the path /viewCount fails because the property does not exist."
        fr: "Une opération Increment de 1 sur le chemin /viewCount échoue car la propriété n'existe pas."
    - id: s3
      text:
        en: "A patch operation can set the _ts system property to a custom value."
        fr: "Une opération de patch peut définir la propriété système _ts sur une valeur personnalisée."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Set on a valid array index updates the existing element instead of inserting one, so the array keeps three elements (Add would insert and shift). Increment creates the field with the given value when it does not exist. System properties such as _id, _ts, _etag and _rid cannot be modified with patch."
    fr: "Set sur un index de tableau valide met à jour l'élément existant au lieu d'en insérer un : le tableau conserve trois éléments (Add insérerait et décalerait). Increment crée le champ avec la valeur donnée s'il n'existe pas. Les propriétés système comme _id, _ts, _etag et _rid ne peuvent pas être modifiées par un patch."
references:
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
  - title: Get Started with Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update-getting-started
