id: dp420-sr2-ttl-sessions-1
objective: "1.2.5"
type: series_yesno
series: dp420-sr2-ttl-sessions
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You set a container default TTL of 86,400 and write auditPin items with a ttl of -1.
  fr: |
    Vous définissez une durée de vie par défaut de 86 400 sur le conteneur et écrivez les éléments auditPin avec un ttl de -1.
body:
  solution:
    en: |
      You set `DefaultTimeToLive` of the `sessions` container to **86400**. The application keeps writing session items without a `ttl` property and writes every auditPin item with the following property.

      ```json
      { "ttl": -1 }
      ```
    fr: |
      Vous définissez la propriété `DefaultTimeToLive` du conteneur `sessions` sur **86400**. L'application continue d'écrire les éléments session sans propriété `ttl` et écrit chaque élément auditPin avec la propriété suivante.

      ```json
      { "ttl": -1 }
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      With a container default of 86,400 seconds, every item without its own `ttl` expires 86,400 seconds after its last modification, and expired items are removed by a background task that uses leftover RUs. An item-level `ttl` of -1 overrides the container default, so auditPin items never expire.
    fr: |
      Avec une valeur par défaut de 86 400 secondes sur le conteneur, chaque élément sans `ttl` propre expire 86 400 secondes après sa dernière modification, et les éléments expirés sont supprimés par une tâche d'arrière-plan qui utilise les RU restantes. Un `ttl` de -1 au niveau de l'élément remplace la valeur par défaut du conteneur : les éléments auditPin n'expirent jamais.
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
