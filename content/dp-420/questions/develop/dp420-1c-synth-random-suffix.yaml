id: dp420-1c-synth-random-suffix
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso ingests clickstream events into an Azure Cosmos DB for NoSQL container at 30,000 writes per second. Every event of the day has the same `eventDate` value. Events are never read individually: a nightly job reads all the events of the previous day.

    The container uses a synthetic `partitionKey` property. You need the value of that property to spread the writes of a day as evenly as possible across partitions.

    Which value should the application write in `partitionKey`?
  fr: |
    Contoso ingère des événements de parcours de navigation dans un conteneur Azure Cosmos DB for NoSQL à raison de 30 000 écritures par seconde. Tous les événements du jour ont la même valeur `eventDate`. Les événements ne sont jamais lus individuellement : un traitement nocturne lit tous les événements de la veille.

    Le conteneur utilise une propriété synthétique `partitionKey`. Vous avez besoin que la valeur de cette propriété répartisse les écritures d'une journée aussi uniformément que possible entre les partitions.

    Quelle valeur l'application doit-elle écrire dans `partitionKey` ?
body:
  options:
    - { id: a, text: { en: "The eventDate value, such as 2026-11-17", fr: "La valeur eventDate, par exemple 2026-11-17" } }
    - { id: b, text: { en: "The eventDate followed by the hour of the event, such as 2026-11-17.14", fr: "La valeur eventDate suivie de l'heure de l'événement, par exemple 2026-11-17.14" } }
    - { id: c, text: { en: "The eventDate followed by a random number from 1 to 200, such as 2026-11-17.87", fr: "La valeur eventDate suivie d'un nombre aléatoire de 1 à 200, par exemple 2026-11-17.87" } }
    - { id: d, text: { en: "The event type followed by the eventDate, such as click.2026-11-17", fr: "Le type d'événement suivi de la valeur eventDate, par exemple click.2026-11-17" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Appending a random suffix spreads the writes of the same day across up to 200 partition key values at any moment, which gives better parallelism and higher throughput. The usual drawback, not knowing the suffix of a given item, does not matter here because items are never read individually; the nightly job reads every suffix of the day.
    fr: |-
      Ajouter un suffixe aléatoire répartit à tout moment les écritures d'une même journée sur jusqu'à 200 valeurs de clé de partition, ce qui offre un meilleur parallélisme et un débit plus élevé. L'inconvénient habituel, ne pas connaître le suffixe d'un élément donné, ne compte pas ici, car les éléments ne sont jamais lus individuellement ; le traitement nocturne lit tous les suffixes de la journée.
  options:
    a: { en: "All the day's writes would go to a single partition key value, a hot partition.", fr: "Toutes les écritures du jour iraient vers une seule valeur de clé de partition : une partition chaude." }
    b: { en: "Within a given hour, all the writes still target the same value.", fr: "Au cours d'une heure donnée, toutes les écritures visent toujours la même valeur." }
    d: { en: "A handful of event types only multiplies the number of values by a small factor, and the busiest type stays hot.", fr: "Quelques types d'événements ne multiplient le nombre de valeurs que par un petit facteur, et le type le plus actif reste chaud." }
references:
  - title: Create a synthetic partition key
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/synthetic-partition-keys
