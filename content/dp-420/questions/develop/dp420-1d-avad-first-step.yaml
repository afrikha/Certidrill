id: dp420-1d-avad-first-step
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has an existing Azure Cosmos DB for NoSQL account that uses periodic backup. The account has never merged a partition. A new .NET consumer must read the change feed of a container in all versions and deletes mode.

    What should you do first?
  fr: |
    Tailspin dispose d'un compte Azure Cosmos DB for NoSQL existant qui utilise la sauvegarde périodique. Le compte n'a jamais fusionné de partition. Un nouveau consommateur .NET doit lire le flux de modification d'un conteneur en mode toutes les versions et suppressions.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable the All versions and deletes change feed mode feature on the Features page of the account.", fr: "Activer la fonctionnalité All versions and deletes change feed mode dans la page Features du compte." } }
    - { id: b, text: { en: "Configure continuous backup on the account.", fr: "Configurer la sauvegarde continue sur le compte." } }
    - { id: c, text: { en: "Set a default time to live on the container.", fr: "Définir une durée de vie par défaut sur le conteneur." } }
    - { id: d, text: { en: "Recreate the account with the enableAllVersionsAndDeletesChangeFeed property set to true.", fr: "Recréer le compte avec la propriété enableAllVersionsAndDeletesChangeFeed définie à true." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      All versions and deletes mode requires continuous backup, and the feature can only be enabled after continuous backup is configured. You then enable the All versions and deletes change feed mode feature on the Features page; the enablement can take up to 30 minutes.
    fr: |
      Le mode toutes les versions et suppressions nécessite la sauvegarde continue, et la fonctionnalité ne peut être activée qu'une fois la sauvegarde continue configurée. Vous activez ensuite la fonctionnalité All versions and deletes change feed mode dans la page Features ; l'activation peut prendre jusqu'à 30 minutes.
  options:
    a: { en: "The feature requires continuous backup to be configured before it is enabled.", fr: "La fonctionnalité exige que la sauvegarde continue soit configurée avant son activation." }
    c: { en: "TTL is not a prerequisite of the mode.", fr: "La durée de vie n'est pas un prérequis du mode." }
    d: { en: "Enabling the feature during account creation is not supported; it is enabled on an existing account.", fr: "L'activation de la fonctionnalité lors de la création du compte n'est pas prise en charge ; elle s'active sur un compte existant." }
references:
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
