id: dp420-1d-instances-vs-leases
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a change feed processor as eight pods in Azure Kubernetes Service. All the pods use the same processorName, the same lease container and a unique instance name. The monitored Azure Cosmos DB for NoSQL container has five physical partitions, and the lease container holds five leases.

    Monitoring shows that three pods never process any change.

    You need to minimize compute cost without reducing the processing parallelism.

    What should you do?
  fr: |
    Litware exécute un processeur de flux de modification sous forme de huit pods dans Azure Kubernetes Service. Tous les pods utilisent le même processorName, le même conteneur de bail et un nom d'instance unique. Le conteneur Azure Cosmos DB for NoSQL surveillé compte cinq partitions physiques, et le conteneur de bail contient cinq baux.

    La supervision montre que trois pods ne traitent jamais aucune modification.

    Vous devez réduire au minimum le coût de calcul sans réduire le parallélisme du traitement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Scale the deployment to five pods.", fr: "Réduire le déploiement à cinq pods." } }
    - { id: b, text: { en: "Give each pod a different processorName.", fr: "Attribuer à chaque pod un processorName différent." } }
    - { id: c, text: { en: "Increase the provisioned throughput of the lease container.", fr: "Augmenter le débit approvisionné du conteneur de bail." } }
    - { id: d, text: { en: "Reduce the lease expiration interval to 10 seconds.", fr: "Réduire l'intervalle d'expiration des baux à 10 secondes." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A lease is owned by only one instance at a time, so a deployment unit should not run more instances than there are leases. With five leases, five pods give the maximum parallelism; the processor creates more leases and rebalances them automatically if the container grows.
    fr: |
      Un bail n'appartient qu'à une seule instance à la fois ; une unité de déploiement ne doit donc pas exécuter plus d'instances qu'il n'y a de baux. Avec cinq baux, cinq pods offrent le parallélisme maximal ; si le conteneur grandit, le processeur crée de nouveaux baux et les rééquilibre automatiquement.
  options:
    b: { en: "Each pod would become its own deployment unit and process every change, which multiplies the work.", fr: "Chaque pod deviendrait sa propre unité de déploiement et traiterait chaque modification, ce qui multiplie le travail." }
    c: { en: "The idle pods are not caused by throttling: there are simply fewer leases than pods.", fr: "Les pods inactifs ne sont pas dus à une limitation du débit : il y a simplement moins de baux que de pods." }
    d: { en: "The expiration interval affects recovery after a crash, and it must never be lower than the renewal interval (13 seconds by default).", fr: "L'intervalle d'expiration influe sur la reprise après un plantage, et il ne doit jamais être inférieur à l'intervalle de renouvellement (13 secondes par défaut)." }
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
