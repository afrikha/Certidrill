id: dp420-1b-hpk-point-read
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores session events in an Azure Cosmos DB for NoSQL container that uses a hierarchical partition key with the paths `/tenantId`, `/userId` and `/sessionId`, in this order.

    A .NET method receives `eventId` (the item's `id`), `tenantId`, `userId` and `sessionId`. It must read the event with the lowest RU charge.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso stocke des événements de session dans un conteneur Azure Cosmos DB for NoSQL qui utilise une clé de partition hiérarchique avec les chemins `/tenantId`, `/userId` et `/sessionId`, dans cet ordre.

    Une méthode .NET reçoit `eventId` (l'`id` de l'élément), `tenantId`, `userId` et `sessionId`. Elle doit lire l'événement avec la charge de RU la plus faible.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    PartitionKey partitionKey = new PartitionKeyBuilder()
        [[k1]]
        [[k2]]
        [[k3]]
        .Build();

    ItemResponse<SessionEvent> response = await container.[[method]]<SessionEvent>(
        eventId,
        partitionKey);
  slots:
    - id: k1
      options:
        - { id: tenant, text: .Add(tenantId) }
        - { id: user, text: .Add(userId) }
        - { id: session, text: .Add(sessionId) }
        - { id: event, text: .Add(eventId) }
    - id: k2
      options:
        - { id: tenant, text: .Add(tenantId) }
        - { id: user, text: .Add(userId) }
        - { id: session, text: .Add(sessionId) }
        - { id: event, text: .Add(eventId) }
    - id: k3
      options:
        - { id: tenant, text: .Add(tenantId) }
        - { id: user, text: .Add(userId) }
        - { id: session, text: .Add(sessionId) }
        - { id: event, text: .Add(eventId) }
    - id: method
      options:
        - { id: read, text: ReadItemAsync }
        - { id: patch, text: PatchItemAsync }
        - { id: many, text: ReadManyItemsAsync }
answer:
  values: { k1: tenant, k2: user, k3: session, method: read }
explanation:
  correct:
    en: "A point read on a container with a hierarchical partition key needs the id and the full partition key, built with `PartitionKeyBuilder` by adding every level in the order of the key paths: tenantId, then userId, then sessionId. `ReadItemAsync` then performs the point read."
    fr: "Une lecture ponctuelle sur un conteneur à clé de partition hiérarchique exige l'id et la clé de partition complète, construite avec `PartitionKeyBuilder` en ajoutant chaque niveau dans l'ordre des chemins de la clé : tenantId, puis userId, puis sessionId. `ReadItemAsync` effectue ensuite la lecture ponctuelle."
  options:
    event: { en: "The item id is passed separately; it is not a level of the partition key.", fr: "L'id de l'élément est passé séparément ; ce n'est pas un niveau de la clé de partition." }
    patch: { en: "PatchItemAsync updates an item; it also requires patch operations.", fr: "PatchItemAsync met à jour un élément ; il exige aussi des opérations de patch." }
    many: { en: "ReadManyItemsAsync takes a list of (id, PartitionKey) pairs, not an id and a key.", fr: "ReadManyItemsAsync prend une liste de paires (id, PartitionKey), pas un id et une clé." }
references:
  - title: Hierarchical Partition Keys - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
