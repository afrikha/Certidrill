id: dp420-1a-thr-serverless-prototype
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is building a prototype of an internal app on Azure Cosmos DB for NoSQL. Testers use the app a few hours per week, with unpredictable bursts, and the average traffic is below 5 percent of the peak. The app runs in a single Azure region and doesn't need a performance SLA.

    You need to choose a throughput option that minimizes cost and requires no capacity planning.

    What should you use?
  fr: |
    Proseware développe le prototype d'une application interne sur Azure Cosmos DB for NoSQL. Des testeurs utilisent l'application quelques heures par semaine, avec des pics imprévisibles, et le trafic moyen est inférieur à 5 % du pic. L'application s'exécute dans une seule région Azure et n'a pas besoin d'un contrat SLA de performances.

    Vous devez choisir une option de débit qui réduit le coût au minimum et ne nécessite aucune planification de capacité.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A serverless account", fr: "Un compte serverless" } }
    - { id: b, text: { en: "A container with 400 RU/s of manual throughput", fr: "Un conteneur avec un débit manuel de 400 RU/s" } }
    - { id: c, text: { en: "A container with autoscale throughput and a maximum of 1,000 RU/s", fr: "Un conteneur avec un débit à mise à l'échelle automatique et un maximum de 1 000 RU/s" } }
    - { id: d, text: { en: "A database with 400 RU/s of shared throughput", fr: "Une base de données avec un débit partagé de 400 RU/s" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Serverless bills only the RUs that operations consume, with no minimum charge and no throughput to configure. It suits intermittent, hard-to-forecast traffic with an average-to-peak ratio under 10 percent, and its single-region limit isn't a problem here.
    fr: |
      Le mode serverless facture uniquement les RU consommées par les opérations, sans frais minimaux ni débit à configurer. Il convient à un trafic intermittent et difficile à prévoir dont le rapport moyenne/pic est inférieur à 10 %, et sa limite à une seule région ne pose pas de problème ici.
  options:
    b: { en: "Manual throughput is billed every hour for the provisioned RU/s, even when the app is idle, and can throttle bursts.", fr: "Le débit manuel est facturé chaque heure pour les RU/s approvisionnées, même quand l'application est inactive, et peut limiter les pics." }
    c: { en: "Autoscale never scales below 10 percent of its maximum, so idle hours are still billed.", fr: "La mise à l'échelle automatique ne descend jamais sous 10 % de son maximum : les heures d'inactivité restent facturées." }
    d: { en: "Shared throughput is still provisioned and billed hourly, and it isn't recommended for most workloads.", fr: "Le débit partagé reste approvisionné et facturé à l'heure, et il n'est pas recommandé pour la plupart des charges de travail." }
references:
  - title: Azure Cosmos DB serverless account type
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/serverless
  - title: How to choose between provisioned throughput and serverless
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/throughput-serverless
