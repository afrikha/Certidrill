id: dp420-1d-audit-deletes-mode
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank stores customer consent records in an Azure Cosmos DB for NoSQL container. Some records are deleted by the application, and others expire through time to live (TTL). Continuous backup is configured on the account.

    A compliance service must record every delete, including the TTL expirations, without changing how the application deletes items.

    What should the compliance service use?
  fr: |
    Woodgrove Bank stocke les enregistrements de consentement de ses clients dans un conteneur Azure Cosmos DB for NoSQL. Certains enregistrements sont supprimés par l'application, et d'autres expirent par durée de vie (TTL). La sauvegarde continue est configurée sur le compte.

    Un service de conformité doit enregistrer chaque suppression, y compris les expirations TTL, sans modifier la façon dont l'application supprime les éléments.

    Que doit utiliser le service de conformité ?
body:
  options:
    - { id: a, text: { en: "The change feed in latest version mode, started from the beginning of the container", fr: "Le flux de modification en mode dernière version, démarré au début du conteneur" } }
    - { id: b, text: { en: "The change feed in all versions and deletes mode", fr: "Le flux de modification en mode toutes les versions et suppressions" } }
    - { id: c, text: { en: "The change feed in latest version mode, with a soft-delete flag added by the application", fr: "Le flux de modification en mode dernière version, avec un indicateur de suppression logique ajouté par l'application" } }
    - { id: d, text: { en: "The change feed estimator, which reports the deleted items per lease", fr: "L'estimateur de flux de modification, qui signale les éléments supprimés par bail" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      All versions and deletes mode records creates, updates and deletes, including deletes caused by TTL expirations, and its metadata indicates whether a delete came from a TTL expiration. It requires continuous backup, which the account already has.
    fr: |
      Le mode toutes les versions et suppressions enregistre les créations, les mises à jour et les suppressions, y compris celles dues aux expirations TTL, et ses métadonnées indiquent si une suppression provient d'une expiration TTL. Il nécessite la sauvegarde continue, dont le compte dispose déjà.
  options:
    a: { en: "Latest version mode never records deletes, whatever the starting point.", fr: "Le mode dernière version n'enregistre jamais les suppressions, quel que soit le point de départ." }
    c: { en: "A soft-delete flag requires changing how the application deletes items.", fr: "Un indicateur de suppression logique impose de modifier la façon dont l'application supprime les éléments." }
    d: { en: "The estimator only estimates the number of pending changes.", fr: "L'estimateur ne fait qu'estimer le nombre de modifications en attente." }
references:
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
