id: dp420-1c-synth-precalculated-suffix
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores a daily summary item per vehicle in an Azure Cosmos DB for NoSQL container. There are 100,000 vehicles, each identified by a vehicle identification number (VIN), and all of the day's writes concern the current date. The support application must read the summary of one vehicle for a given date with a point read.

    The container is partitioned by a synthetic `partitionKey` property. You need to distribute the writes of a day evenly and still support the point reads.

    Which value should the application write in `partitionKey`?
  fr: |
    Fabrikam stocke un élément de synthèse quotidienne par véhicule dans un conteneur Azure Cosmos DB for NoSQL. Il y a 100 000 véhicules, chacun identifié par un numéro d'identification de véhicule (VIN), et toutes les écritures du jour concernent la date du jour. L'application du support doit lire la synthèse d'un véhicule pour une date donnée par une lecture ponctuelle.

    Le conteneur est partitionné par une propriété synthétique `partitionKey`. Vous devez répartir uniformément les écritures d'une journée tout en permettant les lectures ponctuelles.

    Quelle valeur l'application doit-elle écrire dans `partitionKey` ?
body:
  options:
    - { id: a, text: { en: "The date followed by a random number from 1 to 400", fr: "La date suivie d'un nombre aléatoire de 1 à 400" } }
    - { id: b, text: { en: "The date followed by a number from 1 to 400 computed from a hash of the VIN", fr: "La date suivie d'un nombre de 1 à 400 calculé à partir d'un hachage du VIN" } }
    - { id: c, text: { en: "The date of the summary, such as 2026-11-17", fr: "La date de la synthèse, par exemple 2026-11-17" } }
    - { id: d, text: { en: "The vehicle model followed by the date, such as sedan-2026-11-17", fr: "Le modèle du véhicule suivi de la date, par exemple sedan-2026-11-17" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A precalculated suffix derived from a hash of the VIN spreads the writes of a day across 400 evenly loaded values. Because the suffix is deterministic, the support application recomputes the partition key from the VIN and the date, so it can perform a point read.
    fr: |-
      Un suffixe précalculé dérivé d'un hachage du VIN répartit les écritures d'une journée sur 400 valeurs chargées uniformément. Comme le suffixe est déterministe, l'application du support recalcule la clé de partition à partir du VIN et de la date et peut donc effectuer une lecture ponctuelle.
  options:
    a: { en: "Writes are spread, but the reader cannot know which random suffix was used, so no point read is possible.", fr: "Les écritures sont réparties, mais le lecteur ne peut pas savoir quel suffixe aléatoire a été utilisé : aucune lecture ponctuelle n'est possible." }
    c: { en: "All the writes of the day target a single value, which creates a hot partition.", fr: "Toutes les écritures du jour visent une seule valeur, ce qui crée une partition chaude." }
    d: { en: "Models have few values with uneven popularity, so the writes are not spread evenly.", fr: "Les modèles ont peu de valeurs avec une popularité inégale : les écritures ne sont pas réparties uniformément." }
references:
  - title: Create a synthetic partition key
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/synthetic-partition-keys
