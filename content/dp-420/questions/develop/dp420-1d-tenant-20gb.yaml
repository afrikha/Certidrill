id: dp420-1d-tenant-20gb
objective: "1.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a multitenant SaaS application on Azure Cosmos DB for NoSQL. A container named **events** uses the partition key `/tenantId` and stores events for 6,000 tenants. Most queries filter on `tenantId`, and some also filter on `userId`.

    The logical partition of the largest tenant is approaching 20 GB and keeps growing. The other tenants are small.

    You need to recommend a change that lets every tenant grow beyond 20 GB while keeping tenant-scoped queries routed only to the partitions that hold the tenant's data.

    What should you recommend?
  fr: |
    Fabrikam exécute une application SaaS multilocataire sur Azure Cosmos DB for NoSQL. Un conteneur nommé **events** utilise la clé de partition `/tenantId` et stocke les événements de 6 000 locataires. La plupart des requêtes filtrent sur `tenantId`, et certaines filtrent aussi sur `userId`.

    La partition logique du plus gros locataire approche 20 Go et continue de croître. Les autres locataires sont petits.

    Vous devez recommander une modification qui permette à chaque locataire de dépasser 20 Go tout en n'acheminant les requêtes d'un locataire que vers les partitions qui contiennent ses données.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Increase the provisioned throughput of the events container.", fr: "Augmenter le débit approvisionné du conteneur events." } }
    - { id: b, text: { en: "Add /userId as a second partition key level to the events container.", fr: "Ajouter /userId comme second niveau de clé de partition au conteneur events." } }
    - { id: c, text: { en: "Create a new container with the hierarchical partition key /tenantId, /userId, /id and migrate the data.", fr: "Créer un conteneur avec la clé de partition hiérarchique /tenantId, /userId, /id et y migrer les données." } }
    - { id: d, text: { en: "Create a new container with a synthetic key that appends a random suffix from 1 to 100 to tenantId and migrate the data.", fr: "Créer un conteneur avec une clé synthétique qui ajoute un suffixe aléatoire de 1 à 100 à tenantId et y migrer les données." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With hierarchical partition keys, a prefix such as a single `tenantId` value can exceed 20 GB and span several physical partitions, and queries that filter on the prefix are routed only to those partitions. Adding the item ID as the last level guarantees that each full key stays small. Partition key paths are set at container creation, so the data must be moved to a new container.
    fr: |
      Avec des clés de partition hiérarchiques, un préfixe tel qu'une valeur de `tenantId` peut dépasser 20 Go et s'étendre sur plusieurs partitions physiques, et les requêtes qui filtrent sur ce préfixe ne sont acheminées que vers ces partitions. Ajouter l'ID de l'élément comme dernier niveau garantit que chaque clé complète reste petite. Les chemins de clé de partition sont définis à la création du conteneur : les données doivent être déplacées vers un nouveau conteneur.
  options:
    a: { en: "The 20 GB limit applies to each logical partition whatever the throughput.", fr: "La limite de 20 Go s'applique à chaque partition logique quel que soit le débit." }
    b: { en: "Hierarchical partition keys can only be defined when a container is created; an existing container's partition key cannot be changed.", fr: "Les clés de partition hiérarchiques ne peuvent être définies qu'à la création d'un conteneur ; la clé de partition d'un conteneur existant ne peut pas être modifiée." }
    d: { en: "A random suffix spreads the data, but a tenant query must then cover every suffix value unless all of them are listed, so it is no longer routed efficiently.", fr: "Un suffixe aléatoire répartit les données, mais une requête sur un locataire doit alors couvrir toutes les valeurs de suffixe, sauf à les énumérer toutes : elle n'est plus acheminée efficacement." }
references:
  - title: Hierarchical Partition Keys - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
