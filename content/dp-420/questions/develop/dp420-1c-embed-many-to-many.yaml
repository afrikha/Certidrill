id: dp420-1c-embed-many-to-many
objective: "1.3.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam stores books and authors as separate items in one Azure Cosmos DB for NoSQL container. A book has at most 5 authors, and an author has at most 30 books. You have the following requirements:

    - The book list page shows each book with the names of its authors, from a query on book items only.
    - The author page shows the author's biography and links to the author's books; the link only needs the book ID.
    - Biographies are edited often. Author names and book titles almost never change.
    - Duplicated data must be kept to the minimum needed by the pages.

    How should you complete the two items? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke des livres et des auteurs comme éléments distincts dans un même conteneur Azure Cosmos DB for NoSQL. Un livre a au plus 5 auteurs, et un auteur a au plus 30 livres. Vous avez les exigences suivantes :

    - La page de liste des livres affiche chaque livre avec le nom de ses auteurs, à partir d'une requête sur les seuls éléments livre.
    - La page d'un auteur affiche sa biographie et des liens vers ses livres ; le lien n'a besoin que de l'ID du livre.
    - Les biographies sont modifiées souvent. Les noms d'auteurs et les titres de livres ne changent presque jamais.
    - Les données dupliquées doivent être limitées au strict nécessaire pour les pages.

    Comment devez-vous compléter les deux éléments ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    [
      {
        "id": "b1",
        "type": "book",
        "title": "Designing Data Models",
        "authors": [[bookAuthors]]
      },
      {
        "id": "a1",
        "type": "author",
        "name": "Ana Silva",
        "biography": "Ana writes about distributed databases...",
        "books": [[authorBooks]]
      }
    ]
  slots:
    - id: bookAuthors
      options:
        - { id: bnames, text: '[ { "id": "a1", "name": "Ana Silva" }, { "id": "a2", "name": "Tom Berg" } ]' }
        - { id: bids, text: '[ "a1", "a2" ]' }
        - { id: bfull, text: '[ { "id": "a1", "name": "Ana Silva", "biography": "..." }, { "id": "a2", "name": "Tom Berg", "biography": "..." } ]' }
    - id: authorBooks
      options:
        - { id: aids, text: '[ "b1", "b4" ]' }
        - { id: afull, text: '[ { "id": "b1", "title": "Designing Data Models", "authors": [ "a1", "a2" ] }, { "id": "b4", "title": "Query Tuning", "authors": [ "a1" ] } ]' }
        - { id: alinks, text: '[ { "linkId": "l1", "authorId": "a1", "bookId": "b1" }, { "linkId": "l2", "authorId": "a1", "bookId": "b4" } ]' }
answer:
  values: { bookAuthors: bnames, authorBooks: aids }
explanation:
  correct:
    en: "This is a hybrid model for a many-to-many relationship: both sides store bounded reference arrays instead of join items. The book embeds each author's id and rarely changing name, so the list page needs no extra request; the author item only needs the book IDs for its links. The often-edited biography is not duplicated, so editing it changes a single item."
    fr: "Il s'agit d'un modèle hybride pour une relation plusieurs-à-plusieurs : les deux côtés stockent des tableaux de références bornés au lieu d'éléments de jointure. Le livre incorpore l'id et le nom (qui change rarement) de chaque auteur, de sorte que la page de liste ne nécessite aucune requête supplémentaire ; l'élément auteur n'a besoin que des ID des livres pour ses liens. La biographie, souvent modifiée, n'est pas dupliquée : la modifier ne change qu'un élément."
  options:
    bids: { en: "With IDs only, the list page needs extra reads to get the author names.", fr: "Avec les seuls ID, la page de liste a besoin de lectures supplémentaires pour obtenir les noms des auteurs." }
    bfull: { en: "Copying the biography means updating every book of the author at each edit.", fr: "Copier la biographie impose de mettre à jour chaque livre de l'auteur à chaque modification." }
    afull: { en: "The author page only needs the IDs; copying whole books duplicates more data than required.", fr: "La page de l'auteur n'a besoin que des ID ; copier des livres entiers duplique plus de données que nécessaire." }
    alinks: { en: "Separate join items reproduce a relational junction table and require extra queries.", fr: "Des éléments de jointure distincts reproduisent une table de jonction relationnelle et exigent des requêtes supplémentaires." }
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
