id: dp420-sr1-tenant-activity-2
objective: "1.3.5"
type: series_yesno
series: dp420-sr1-tenant-activity
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You use a synthetic partition key that concatenates tenantId and userId.
  fr: Vous utilisez une clé de partition synthétique qui concatène tenantId et userId.
body:
  solution:
    en: |
      The application adds a `partitionKey` property to every item, set to `$"{tenantId}-{userId}"`, and you create the container by using the following code:

      ```csharp
      ContainerProperties properties = new ContainerProperties(
          id: "activity",
          partitionKeyPath: "/partitionKey");

      Container container = await database.CreateContainerIfNotExistsAsync(
          properties,
          ThroughputProperties.CreateAutoscaleThroughput(50000));
      ```
    fr: |
      L'application ajoute à chaque élément une propriété `partitionKey` définie sur `$"{tenantId}-{userId}"`, et vous créez le conteneur à l'aide du code suivant :

      ```csharp
      ContainerProperties properties = new ContainerProperties(
          id: "activity",
          partitionKeyPath: "/partitionKey");

      Container container = await database.CreateContainerIfNotExistsAsync(
          properties,
          ThroughputProperties.CreateAutoscaleThroughput(50000));
      ```
answer: { value: false }
explanation:
  correct:
    en: The synthetic key spreads a tenant over one logical partition per user, so a tenant is no longer limited to 20 GB. However, a query that filters on `tenantId` only does not contain a value of `/partitionKey`, and because the users are not known in advance, it becomes a fan-out query sent to every physical partition.
    fr: "La clé synthétique répartit un locataire sur une partition logique par utilisateur : un locataire n'est donc plus limité à 20 Go. En revanche, une requête qui filtre uniquement sur `tenantId` ne contient aucune valeur de `/partitionKey` et, comme les utilisateurs ne sont pas connus à l'avance, elle devient une requête de distribution ramifiée envoyée à toutes les partitions physiques."
references:
  - title: Hierarchical Partition Keys - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
