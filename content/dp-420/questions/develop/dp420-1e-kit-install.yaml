id: dp420-1e-kit-install
objective: "1.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are a developer at Wingtip. You build a .NET API that stores orders in Azure Cosmos DB for NoSQL, and you write the code with GitHub Copilot in Visual Studio Code, which supports Agent Skills. Node.js with npm and npx is installed on your computer.

    You need Copilot to apply the Azure Cosmos DB best practices for data modeling, partition keys, queries and SDK usage when it generates or reviews your code.

    Which command should you run in the project folder?
  fr: |
    Vous êtes développeur chez Wingtip. Vous créez une API .NET qui stocke des commandes dans Azure Cosmos DB for NoSQL, et vous écrivez le code avec GitHub Copilot dans Visual Studio Code, qui prend en charge Agent Skills. Node.js avec npm et npx est installé sur votre ordinateur.

    Copilot doit appliquer les bonnes pratiques Azure Cosmos DB en matière de modélisation des données, de clés de partition, de requêtes et d'utilisation du SDK quand il génère ou révise votre code.

    Quelle commande devez-vous exécuter dans le dossier du projet ?
body:
  options:
    - { id: a, text: "dotnet add package Microsoft.Azure.Cosmos" }
    - { id: b, text: "az extension add --name cosmosdb-preview" }
    - { id: c, text: "npx skills add AzureCosmosDB/cosmosdb-agent-kit" }
    - { id: d, text: "npm install @azure/cosmos" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Azure Cosmos DB Agent Kit is a collection of Agent Skills for AI coding assistants. The skills CLI command npx skills add AzureCosmosDB/cosmosdb-agent-kit installs it interactively for the assistant and scope you select, after which the assistant loads the relevant guidance on demand.
    fr: |
      Azure Cosmos DB Agent Kit est un ensemble de compétences Agent Skills destinées aux assistants de codage IA. La commande npx skills add AzureCosmosDB/cosmosdb-agent-kit du CLI skills l'installe de manière interactive pour l'assistant et l'étendue que vous choisissez ; l'assistant charge ensuite à la demande les recommandations pertinentes.
  options:
    a:
      en: |
        This command adds the .NET SDK to the project; it gives the assistant no Azure Cosmos DB guidance.
      fr: |
        Cette commande ajoute le SDK .NET au projet ; elle ne fournit aucune recommandation Azure Cosmos DB à l'assistant.
    b:
      en: |
        This command installs preview Azure CLI commands for Azure Cosmos DB management, not skills for a coding assistant.
      fr: |
        Cette commande installe des commandes Azure CLI en préversion pour la gestion d'Azure Cosmos DB, pas des compétences pour un assistant de codage.
    d:
      en: |
        This command installs the JavaScript SDK package, not the Agent Kit.
      fr: |
        Cette commande installe le package du SDK JavaScript, pas Agent Kit.
references:
  - title: Set up the Azure Cosmos DB Agent Kit - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/setup
