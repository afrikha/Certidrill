id: dp420-1c-model-product-page-ru
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind stores products and customer reviews in Azure Cosmos DB for NoSQL. Products are in a container partitioned by `/id`. Reviews are in a container partitioned by `/productId`; popular products have more than 100,000 reviews.

    The product page shows the product, its average rating and its three most recent reviews. It is requested 5,000 times per second, while 20 reviews are written per second.

    You need to minimize the RU cost of the product page.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind stocke des produits et des avis clients dans Azure Cosmos DB for NoSQL. Les produits se trouvent dans un conteneur partitionné par `/id`. Les avis se trouvent dans un conteneur partitionné par `/productId` ; les produits populaires ont plus de 100 000 avis.

    La page produit affiche le produit, sa note moyenne et ses trois avis les plus récents. Elle est demandée 5 000 fois par seconde, alors que 20 avis sont écrits par seconde.

    Vous devez réduire au minimum le coût en RU de la page produit.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the average rating and the three latest reviews in the product item, and update them when a review is written.", fr: "Stocker la note moyenne et les trois derniers avis dans l'élément produit, et les mettre à jour à l'écriture d'un avis." } }
    - { id: b, text: { en: "Retrieve the product by calling a point read with its id and partition key value.", fr: "Récupérer le produit par une lecture ponctuelle avec son id et sa valeur de clé de partition." } }
    - { id: c, text: { en: "Embed every review of the product in an array inside the product item.", fr: "Incorporer tous les avis du produit dans un tableau à l'intérieur de l'élément produit." } }
    - { id: d, text: { en: "Compute the average rating with an AVG query on the reviews container at each page load.", fr: "Calculer la note moyenne avec une requête AVG sur le conteneur des avis à chaque chargement de page." } }
    - { id: e, text: { en: "Set the default consistency level of the account to Strong.", fr: "Définir le niveau de cohérence par défaut du compte sur Strong." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      Reads vastly outnumber writes, so precalculating the aggregate and keeping a bounded copy of the latest reviews in the product item moves the cost to the rare writes. The page then needs only one point read by `id` and partition key, the cheapest operation (about 1 RU for a 1 KB item).
    fr: |-
      Les lectures sont bien plus nombreuses que les écritures : précalculer l'agrégat et conserver une copie bornée des derniers avis dans l'élément produit reporte le coût sur les écritures, plus rares. La page n'a alors besoin que d'une lecture ponctuelle par `id` et clé de partition, l'opération la moins coûteuse (environ 1 RU pour un élément de 1 Ko).
  options:
    c:
      en: |-
        The reviews are unbounded; the item would exceed the 2 MB item size limit and every review would rewrite a huge item.
      fr: |-
        Les avis ne sont pas bornés ; l'élément dépasserait la taille maximale de 2 Mo et chaque avis réécrirait un énorme élément.
    d:
      en: |-
        An aggregate query over up to 100,000 reviews on every page view costs far more than reading a precalculated value.
      fr: |-
        Une requête d'agrégat sur jusqu'à 100 000 avis à chaque affichage coûte bien plus que la lecture d'une valeur précalculée.
    e:
      en: |-
        Strong consistency roughly doubles the RU cost of reads compared with relaxed levels.
      fr: |-
        La cohérence Strong double environ le coût en RU des lectures par rapport aux niveaux plus souples.
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
  - title: Request Units in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/request-units
