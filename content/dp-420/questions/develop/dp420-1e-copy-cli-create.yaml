id: dp420-1e-copy-cli-create
objective: "1.4.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Cosmos DB for NoSQL account named **cosmos-tailspin** that meets all the prerequisites for online container copy. The database **travel** contains a container named **bookings** and an empty container named **bookings-v2** that uses a new partition key.

    You need to start a job that copies **bookings** to **bookings-v2** while the application keeps writing to **bookings**. You run the commands in Azure Cloud Shell (Bash), where no Azure CLI extension is installed yet.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-tailspin** qui remplit tous les prérequis de la copie de conteneur en ligne. La base de données **travel** contient un conteneur nommé **bookings** et un conteneur vide nommé **bookings-v2** qui utilise une nouvelle clé de partition.

    Vous devez démarrer une tâche qui copie **bookings** vers **bookings-v2** pendant que l'application continue d'écrire dans **bookings**. Vous exécutez les commandes dans Azure Cloud Shell (Bash), où aucune extension Azure CLI n'est encore installée.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az extension add --name [[ext]]

    az cosmosdb [[cmd]] \
      --resource-group rg-tailspin \
      --job-name rekey-bookings \
      --src-account cosmos-tailspin \
      --dest-account cosmos-tailspin \
      [[src]] database=travel container=bookings \
      --dest-nosql database=travel container=bookings-v2 \
      --mode Online
  slots:
    - id: ext
      options:
        - { id: preview, text: cosmosdb-preview }
        - { id: dms, text: datamigration }
        - { id: storage, text: storage-preview }
    - id: cmd
      options:
        - { id: restore, text: restore }
        - { id: copy, text: copy create }
        - { id: sqlcreate, text: sql container create }
        - { id: redistribute, text: sql container redistribute-partition-throughput }
    - id: src
      options:
        - { id: mongo, text: --src-mongo }
        - { id: cassandra, text: --src-cassandra }
        - { id: nosql, text: --src-nosql }
answer:
  values: { ext: preview, cmd: copy, src: nosql }
explanation:
  correct:
    en: |
      The container copy commands are in the cosmosdb-preview extension of the Azure CLI. az cosmosdb copy create starts the job; for the NoSQL API, the source and destination are given with --src-nosql and --dest-nosql (database and container), and --mode Online keeps replicating changes until you complete the job.
    fr: |
      Les commandes de copie de conteneur se trouvent dans l'extension cosmosdb-preview d'Azure CLI. az cosmosdb copy create démarre la tâche ; pour l'API NoSQL, la source et la destination sont indiquées avec --src-nosql et --dest-nosql (base de données et conteneur), et --mode Online continue de répliquer les modifications jusqu'à ce que vous terminiez la tâche.
  options:
    dms: { en: "The datamigration extension manages Azure Database Migration Service, not container copy jobs.", fr: "L'extension datamigration gère Azure Database Migration Service, pas les tâches de copie de conteneur." }
    storage: { en: "storage-preview contains preview commands for Azure Storage.", fr: "storage-preview contient des commandes en préversion pour le Stockage Azure." }
    restore: { en: "az cosmosdb restore restores an account from continuous backup; it does not copy into an existing container.", fr: "az cosmosdb restore restaure un compte à partir de la sauvegarde continue ; il ne copie pas vers un conteneur existant." }
    sqlcreate: { en: "This command creates a container; the target already exists and no data would be copied.", fr: "Cette commande crée un conteneur ; la cible existe déjà et aucune donnée ne serait copiée." }
    redistribute: { en: "This command redistributes throughput across physical partitions; it does not move items.", fr: "Cette commande redistribue le débit entre les partitions physiques ; elle ne déplace pas d'éléments." }
    mongo: { en: "--src-mongo is for collections of Azure Cosmos DB for MongoDB accounts.", fr: "--src-mongo concerne les collections des comptes Azure Cosmos DB for MongoDB." }
    cassandra: { en: "--src-cassandra is for tables of Azure Cosmos DB for Apache Cassandra accounts.", fr: "--src-cassandra concerne les tables des comptes Azure Cosmos DB for Apache Cassandra." }
references:
  - title: Create and Manage Intra-account Container Copy Jobs - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-container-copy
