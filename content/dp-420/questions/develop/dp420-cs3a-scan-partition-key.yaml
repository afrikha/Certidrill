id: dp420-cs3a-scan-partition-key
objective: "1.3.2"
type: single
caseStudy: dp420-cs3a-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |
    You need to choose the partition key of the scans container. The solution must meet the scan requirements.

    Which partition key should you use?
  fr: |
    Vous devez choisir la clé de partition du conteneur scans. La solution doit satisfaire les exigences relatives aux passages.

    Quelle clé de partition devez-vous utiliser ?
body:
  options:
    - { id: a, text: "/resortId" }
    - { id: b, text: "/gateId" }
    - { id: c, text: "/passId" }
    - { id: d, text: "/scannedAt" }
answer: { optionId: c }
explanation:
  correct:
    en: "`/passId` has about 900,000 distinct values during the rush, so the 25,000 writes per second are spread over many logical partitions and therefore over all physical partitions. All the scans of a pass share the same key value, so the customer service query that filters on `passId` targets a single partition. The volume of one pass for a season is tiny compared with the 20 GB limit of a logical partition."
    fr: "`/passId` compte environ 900 000 valeurs distinctes pendant l'affluence : les 25 000 écritures par seconde sont donc réparties sur de nombreuses partitions logiques, et par conséquent sur toutes les partitions physiques. Tous les passages d'un forfait partagent la même valeur de clé, si bien que la requête du service client qui filtre sur `passId` cible une seule partition. Le volume d'un forfait pour une saison est minime au regard de la limite de 20 Go d'une partition logique."
  options:
    a:
      en: "There are only 14 resorts. A few logical partitions would receive all the morning writes and become hot, and the per-pass query would still have to scan a whole resort."
      fr: "Il n'y a que 14 stations. Quelques partitions logiques recevraient toutes les écritures du matin et deviendraient chaudes, et la requête par forfait devrait quand même parcourir toute une station."
    b:
      en: "With 320 gates, the busiest gates of the morning concentrate the writes on a few key values, and the scans of one pass are spread over many gates, so the per-pass query fans out across partitions."
      fr: "Avec 320 portiques, les plus fréquentés le matin concentrent les écritures sur quelques valeurs de clé, et les passages d'un forfait sont répartis sur de nombreux portiques : la requête par forfait s'étend donc à plusieurs partitions."
    d:
      en: "A timestamp spreads writes, but the scans of one pass end up under many different key values, so the per-pass query becomes a cross-partition query."
      fr: "Un horodatage répartit les écritures, mais les passages d'un forfait se retrouvent sous de nombreuses valeurs de clé différentes : la requête par forfait devient une requête entre partitions."
references:
  - title: Partitioning and horizontal scaling - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
