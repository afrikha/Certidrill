id: dp420-1a-cons-ordered-feed
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys runs a live tournament app on an Azure Cosmos DB for NoSQL account. Score updates for a match are written as a transactional batch that changes several items at once. Spectator clients only read the data and never write.

    Spectators can see scores a few seconds late, but they must never see a partial batch or updates in the wrong order. You need to choose the weakest consistency level that meets the requirement.

    Which consistency level should you use?
  fr: |
    Tailspin Toys exécute une application de tournoi en direct sur un compte Azure Cosmos DB for NoSQL. Les mises à jour de score d'un match sont écrites sous forme de lot transactionnel qui modifie plusieurs éléments à la fois. Les clients spectateurs lisent uniquement les données et n'écrivent jamais.

    Les spectateurs peuvent voir les scores avec quelques secondes de retard, mais ils ne doivent jamais voir un lot partiel ni des mises à jour dans le désordre. Vous devez choisir le niveau de cohérence le plus faible qui répond à l'exigence.

    Quel niveau de cohérence devez-vous utiliser ?
body:
  options:
    - { id: a, text: Eventual }
    - { id: b, text: Consistent prefix }
    - { id: c, text: Session }
    - { id: d, text: Bounded staleness }
answer: { optionId: b }
explanation:
  correct:
    en: Consistent prefix guarantees that reads never see writes out of order, and the writes of a transactional batch become visible together. It allows reads to lag, which the spectators tolerate, and it is weaker than Session, Bounded staleness and Strong.
    fr: Consistent prefix garantit que les lectures ne voient jamais les écritures dans le désordre, et les écritures d'un lot transactionnel deviennent visibles ensemble. Il autorise un retard des lectures, que les spectateurs acceptent, et il est plus faible que Session, Bounded staleness et Strong.
  options:
    a: { en: "Eventual gives no ordering guarantee: a reader can see a newer value of one item and an older value of another.", fr: "Eventual ne donne aucune garantie d'ordre : un lecteur peut voir une valeur récente d'un élément et une valeur ancienne d'un autre." }
    c: { en: "Session adds read-your-writes guarantees for a writer's own session, which read-only spectators do not need; it is stronger than required.", fr: "Session ajoute des garanties de lecture de ses propres écritures dans la session d'un rédacteur, inutiles pour des spectateurs en lecture seule ; il est plus fort que nécessaire." }
    d: { en: "Bounded staleness also preserves order but adds a bound on the lag and doubles the RU cost of reads; it is stronger than required.", fr: "Bounded staleness préserve aussi l'ordre, mais ajoute une limite au retard et double le coût en RU des lectures ; il est plus fort que nécessaire." }
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
