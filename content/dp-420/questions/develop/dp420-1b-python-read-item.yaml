id: dp420-1b-python-read-item
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys stores orders in an Azure Cosmos DB for NoSQL container partitioned by `/customerId`. A Python function receives `order_id` (the item's `id`) and `customer_id`.

    The function must read the order with a point read. If the order does not exist, the function must return `None`; any other error must propagate to the caller.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys stocke des commandes dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/customerId`. Une fonction Python reçoit `order_id` (l'`id` de l'élément) et `customer_id`.

    La fonction doit lire la commande par une lecture ponctuelle. Si la commande n'existe pas, la fonction doit renvoyer `None` ; toute autre erreur doit être propagée à l'appelant.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.cosmos import exceptions

    def get_order(order_id: str, customer_id: str):
        try:
            return container.[[method]](item=order_id, partition_key=[[pk]])
        except exceptions.[[ex]]:
            return None
  slots:
    - id: method
      options:
        - { id: read, text: read_item }
        - { id: many, text: read_items }
        - { id: query, text: query_items }
    - id: pk
      options:
        - { id: cust, text: customer_id }
        - { id: order, text: order_id }
        - { id: both, text: "[order_id, customer_id]" }
    - id: ex
      options:
        - { id: notfound, text: CosmosResourceNotFoundError }
        - { id: exists, text: CosmosResourceExistsError }
        - { id: http, text: CosmosHttpResponseError }
answer:
  values: { method: read, pk: cust, ex: notfound }
explanation:
  correct:
    en: "`read_item(item=..., partition_key=...)` performs a point read from the id and the partition key value, here the customer ID. `CosmosResourceNotFoundError` corresponds to HTTP 404, so catching it handles only a missing order and lets other errors propagate."
    fr: "`read_item(item=..., partition_key=...)` effectue une lecture ponctuelle à partir de l'id et de la valeur de clé de partition, ici l'ID client. `CosmosResourceNotFoundError` correspond au code HTTP 404 : l'intercepter ne traite que l'absence de la commande et laisse les autres erreurs se propager."
  options:
    many: { en: "read_items takes a list of (id, partition key) tuples and has no item parameter.", fr: "read_items prend une liste de tuples (id, clé de partition) et n'a pas de paramètre item." }
    query: { en: "query_items runs a query; it is not a point read.", fr: "query_items exécute une requête ; ce n'est pas une lecture ponctuelle." }
    order: { en: "The partition key value is the customer ID, not the order ID.", fr: "La valeur de clé de partition est l'ID client, pas l'ID de commande." }
    both: { en: "A list of values is used for hierarchical partition keys; this container has a single-level key.", fr: "Une liste de valeurs sert aux clés de partition hiérarchiques ; ce conteneur a une clé à un seul niveau." }
    exists: { en: "CosmosResourceExistsError corresponds to HTTP 409 (conflict), not to a missing item.", fr: "CosmosResourceExistsError correspond au code HTTP 409 (conflit), pas à un élément absent." }
    http: { en: "CosmosHttpResponseError is the base class of every HTTP error, so it would also hide throttling and other failures.", fr: "CosmosHttpResponseError est la classe de base de toutes les erreurs HTTP : elle masquerait aussi la limitation du débit et les autres échecs." }
references:
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy
  - title: azure.cosmos.exceptions module
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.exceptions
