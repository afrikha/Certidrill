id: dp420-cs2b-shipments-review
objective: "1.3.7"
type: yesno_statements
caseStudy: dp420-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the partitioning of the shipments container for the partitioning review requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le partitionnement du conteneur shipments pour l'exigence de revue du partitionnement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The writes of shipments concentrate on the physical partitions that hold the three busiest origin countries, which can explain throttling while most of the throughput is unused.", fr: "Les écritures de shipments se concentrent sur les partitions physiques qui contiennent les trois pays d'origine les plus actifs, ce qui peut expliquer la limitation des requêtes alors que la majeure partie du débit est inutilisée." } }
    - { id: s2, text: { en: "A query that filters on shipmentId only is routed to the physical partitions of a single origin country.", fr: "Une requête qui filtre uniquement sur shipmentId est dirigée vers les partitions physiques d'un seul pays d'origine." } }
    - { id: s3, text: { en: "A query that filters on originCountry only is routed to the subset of physical partitions that hold the data of that country.", fr: "Une requête qui filtre uniquement sur originCountry est dirigée vers le sous-ensemble de partitions physiques qui contiennent les données de ce pays." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The first level of a hierarchical key should have high cardinality: with only 60 skewed values, most writes target the partitions of three countries, which are throttled while the others stay idle. A filter on the full key or on a leading prefix such as `originCountry` is routed to the matching subset of physical partitions, but a filter on a trailing level alone, such as `shipmentId`, fans out to all the physical partitions.
    fr: |
      Le premier niveau d'une clé hiérarchique doit avoir une forte cardinalité : avec seulement 60 valeurs mal réparties, la plupart des écritures ciblent les partitions de trois pays, qui sont limitées pendant que les autres restent inactives. Un filtre sur la clé complète ou sur un préfixe de tête comme `originCountry` est dirigé vers le sous-ensemble de partitions physiques correspondant, mais un filtre sur un niveau de fin seul, comme `shipmentId`, est distribué à toutes les partitions physiques.
  options:
    s2: { en: "shipmentId is the second level; without the first level in the filter, the query fans out to all the physical partitions.", fr: "shipmentId est le deuxième niveau ; sans le premier niveau dans le filtre, la requête est distribuée à toutes les partitions physiques." }
references:
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
