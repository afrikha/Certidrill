id: dp420-cs2c-devices-hpk
objective: "1.3.5"
type: dropdown
caseStudy: dp420-cs2c-vanarsdel
difficulty: 1
status: draft
stem:
  en: |
    You are writing the code that creates the new devices container and the code that the dashboard uses to load the state of a device.

    You need to complete the code to meet the first requirement.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le code qui crée le nouveau conteneur devices et le code que le tableau de bord utilise pour charger l'état d'un appareil.

    Vous devez compléter le code pour respecter la première exigence.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    List<string> keyPaths = new List<string> { "/tenantId", "/buildingId", "/deviceId" };

    ContainerProperties properties = new ContainerProperties(
        id: "devices",
        [[param]]: keyPaths);
    Container devices = await database.CreateContainerIfNotExistsAsync(properties);

    PartitionKey key = new [[builder]]()
        .Add("t-0412")
        .Add("b-17")
        .Add("d-8890")
        .Build();

    ItemResponse<DeviceState> state = await devices.[[read]]<DeviceState>("d-8890", key);
  slots:
    - id: param
      options:
        - { id: path, text: partitionKeyPath }
        - { id: paths, text: partitionKeyPaths }
        - { id: def, text: partitionKeyDefinition }
    - id: builder
      options:
        - { id: pk, text: PartitionKey }
        - { id: pkdef, text: PartitionKeyDefinition }
        - { id: builder, text: PartitionKeyBuilder }
    - id: read
      options:
        - { id: readitem, text: ReadItemAsync }
        - { id: readmany, text: ReadManyItemsAsync }
        - { id: query, text: GetItemQueryIterator }
answer:
  values: { param: paths, builder: builder, read: readitem }
explanation:
  correct:
    en: "A container with hierarchical partition keys is created by passing the list of up to three key paths in the `partitionKeyPaths` parameter of `ContainerProperties`. The full key value of an item is built with `PartitionKeyBuilder`, one `Add` call per level, then `Build`. With the `id` and the full key, `ReadItemAsync` performs a point read, the cheapest way to load one item."
    fr: "Un conteneur avec des clés de partition hiérarchiques se crée en passant la liste de trois chemins de clé au maximum dans le paramètre `partitionKeyPaths` de `ContainerProperties`. La valeur complète de la clé d'un élément se construit avec `PartitionKeyBuilder`, un appel `Add` par niveau, puis `Build`. Avec l'`id` et la clé complète, `ReadItemAsync` effectue une lecture ponctuelle, le moyen le moins coûteux de charger un élément."
  options:
    path: { en: "partitionKeyPath takes a single path string and creates a single-level key.", fr: "partitionKeyPath accepte une seule chaîne de chemin et crée une clé à un seul niveau." }
    def: { en: "The ContainerProperties constructor takes the key paths in partitionKeyPath or partitionKeyPaths, not in a partitionKeyDefinition parameter.", fr: "Le constructeur de ContainerProperties reçoit les chemins de clé dans partitionKeyPath ou partitionKeyPaths, pas dans un paramètre partitionKeyDefinition." }
    pkdef: { en: "PartitionKeyDefinition describes the key paths of a container; it does not build the key value of an item.", fr: "PartitionKeyDefinition décrit les chemins de clé d'un conteneur ; elle ne construit pas la valeur de clé d'un élément." }
    pk: { en: "PartitionKey has no Add method; a multi-level value is built with PartitionKeyBuilder.", fr: "PartitionKey n'a pas de méthode Add ; une valeur à plusieurs niveaux se construit avec PartitionKeyBuilder." }
    readmany: { en: "ReadManyItemsAsync reads a list of (id, partition key) pairs; it does not take this signature.", fr: "ReadManyItemsAsync lit une liste de paires (id, clé de partition) ; il n'accepte pas cette signature." }
    query: { en: "A query costs more RUs than a point read of the same item.", fr: "Une requête coûte plus de RU qu'une lecture ponctuelle du même élément." }
references:
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
