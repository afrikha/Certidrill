id: dp420-cs3b-thread-partitioning
objective: "1.3.5"
type: single
caseStudy: dp420-cs3b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    Each message item in threads contains `id`, `tenantId`, `userId`, `threadId`, `role`, `content` and `createdAt`.

    You need to choose the partition key of the threads container to meet the conversation requirements.

    Which partition key should you use?
  fr: |
    Chaque élément de message de threads contient `id`, `tenantId`, `userId`, `threadId`, `role`, `content` et `createdAt`.

    Vous devez choisir la clé de partition du conteneur threads pour satisfaire les exigences relatives aux conversations.

    Quelle clé de partition devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "`/threadId`", fr: "`/threadId`" } }
    - { id: b, text: { en: "`/tenantId`", fr: "`/tenantId`" } }
    - { id: c, text: { en: "A synthetic key `/tenantUser` that concatenates `tenantId` and `userId`", fr: "Une clé synthétique `/tenantUser` qui concatène `tenantId` et `userId`" } }
    - { id: d, text: { en: "A hierarchical partition key `/tenantId`, `/userId`, `/threadId`", fr: "Une clé de partition hiérarchique `/tenantId`, `/userId`, `/threadId`" } }
answer: { optionId: d }
explanation:
  correct:
    en: "With the hierarchical key `/tenantId` > `/userId` > `/threadId`, a query on one thread targets a single logical partition, a query on one user and a query on one university are targeted cross-partition queries that reach only the partitions that hold that prefix. Hierarchical keys also let a university's data go beyond the 20 GB limit of a logical partition, because the limit applies to each full key value (one thread), not to the tenant prefix."
    fr: "Avec la clé hiérarchique `/tenantId` > `/userId` > `/threadId`, une requête sur une conversation cible une seule partition logique, et une requête sur un utilisateur ou sur une université est une requête ciblée entre partitions qui n'atteint que les partitions contenant ce préfixe. Les clés hiérarchiques permettent aussi aux données d'une université de dépasser la limite de 20 Go d'une partition logique, car la limite s'applique à chaque valeur complète de la clé (une conversation), et non au préfixe du locataire."
  options:
    a:
      en: "Reading one thread is efficient, but listing the threads of a user or of a university filters on properties that are not in the key, so those queries fan out to all physical partitions."
      fr: "La lecture d'une conversation est efficace, mais lister les conversations d'un utilisateur ou d'une université filtre sur des propriétés absentes de la clé : ces requêtes s'étendent à toutes les partitions physiques."
    b:
      en: "All the messages of a university would be in one logical partition, which is limited to 20 GB, and some universities will store more."
      fr: "Tous les messages d'une université se trouveraient dans une seule partition logique, limitée à 20 Go, alors que certaines universités en stockeront davantage."
    c:
      en: "Thread and user queries stay in one partition, but a query for all the threads of a university cannot use a concatenated value as a prefix, so it fans out to all physical partitions."
      fr: "Les requêtes par conversation et par utilisateur restent dans une partition, mais une requête sur toutes les conversations d'une université ne peut pas utiliser une valeur concaténée comme préfixe : elle s'étend à toutes les partitions physiques."
references:
  - title: Hierarchical Partition Keys - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
