id: dp420-1b-query-empty-page
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a nightly .NET job that exports invoices from an Azure Cosmos DB for NoSQL container. The job runs a cross-partition query with `MaxItemCount = 100` and processes the results page by page with `ReadNextAsync`.

    The loop stops as soon as a page contains no items. Some nights the export is incomplete, although no exception is raised. The logs show that `HasMoreResults` was still `true` when the loop stopped.

    What should you do to make the export complete?
  fr: |
    Fabrikam exécute chaque nuit un traitement .NET qui exporte des factures depuis un conteneur Azure Cosmos DB for NoSQL. Le traitement exécute une requête entre partitions avec `MaxItemCount = 100` et traite les résultats page par page avec `ReadNextAsync`.

    La boucle s'arrête dès qu'une page ne contient aucun élément. Certaines nuits, l'export est incomplet, alors qu'aucune exception n'est levée. Les journaux montrent que `HasMoreResults` valait encore `true` quand la boucle s'est arrêtée.

    Que devez-vous faire pour que l'export soit complet ?
body:
  options:
    - { id: a, text: { en: "Keep calling ReadNextAsync while HasMoreResults is true, whatever the number of items in each page.", fr: "Continuer d'appeler ReadNextAsync tant que HasMoreResults est vrai, quel que soit le nombre d'éléments de chaque page." } }
    - { id: b, text: { en: "Set MaxItemCount to 1000 so that each page contains enough items to never be empty.", fr: "Définir MaxItemCount sur 1000 pour que chaque page contienne assez d'éléments pour ne jamais être vide." } }
    - { id: c, text: { en: "Set MaxItemCount to -1 so that the query returns all the results in a single page.", fr: "Définir MaxItemCount sur -1 pour que la requête renvoie tous les résultats dans une seule page." } }
    - { id: d, text: { en: "Add an ORDER BY clause so that the query engine fills every page up to MaxItemCount.", fr: "Ajouter une clause ORDER BY pour que le moteur de requête remplisse chaque page jusqu'à MaxItemCount." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Each page comes from a separate query execution, and an execution can stop early because of throttling, response size or execution time. A page can therefore be empty even though more results exist. The only reliable end condition is HasMoreResults (or the absence of a continuation token)."
    fr: "Chaque page provient d'une exécution distincte de la requête, et une exécution peut s'arrêter tôt à cause de la limitation du débit, de la taille de la réponse ou de la durée d'exécution. Une page peut donc être vide alors qu'il reste des résultats. La seule condition de fin fiable est HasMoreResults (ou l'absence de jeton de continuation)."
  options:
    b: { en: "MaxItemCount is only an upper bound; a larger value does not prevent short or empty pages.", fr: "MaxItemCount n'est qu'une borne supérieure ; une valeur plus grande n'empêche pas les pages courtes ou vides." }
    c: { en: "-1 removes the item limit per execution, but other limits still split the results into several pages.", fr: "-1 supprime la limite d'éléments par exécution, mais d'autres limites découpent toujours les résultats en plusieurs pages." }
    d: { en: "Sorting does not change the reasons an execution stops early; pages can still be short or empty.", fr: "Le tri ne change pas les raisons pour lesquelles une exécution s'arrête tôt ; les pages peuvent toujours être courtes ou vides." }
references:
  - title: Pagination - Query language in Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/query/pagination
