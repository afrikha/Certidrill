id: dp420-1b-occ-lost-update
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In Contoso's help desk app, two agents can open the same ticket at the same time. The .NET backend reads the ticket from Azure Cosmos DB for NoSQL and saves the agent's changes with `ReplaceItemAsync`. Today, the second agent to save silently overwrites the first agent's changes.

    The backend must reject a save when the ticket changed after the agent opened it.

    What should you do?
  fr: |
    Dans l'application de support de Contoso, deux agents peuvent ouvrir le même ticket en même temps. Le back-end .NET lit le ticket dans Azure Cosmos DB for NoSQL et enregistre les modifications de l'agent avec `ReplaceItemAsync`. Aujourd'hui, le second agent qui enregistre écrase sans avertissement les modifications du premier.

    Le back-end doit rejeter un enregistrement quand le ticket a changé après son ouverture par l'agent.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the _etag read with the ticket and pass it in ItemRequestOptions.IfMatchEtag when calling ReplaceItemAsync.", fr: "Conserver l'_etag lu avec le ticket et le passer dans ItemRequestOptions.IfMatchEtag lors de l'appel à ReplaceItemAsync." } }
    - { id: b, text: { en: "Keep the _etag read with the ticket and pass it in ItemRequestOptions.IfNoneMatchEtag when calling ReplaceItemAsync.", fr: "Conserver l'_etag lu avec le ticket et le passer dans ItemRequestOptions.IfNoneMatchEtag lors de l'appel à ReplaceItemAsync." } }
    - { id: c, text: { en: "Change the account's default consistency level to Strong so that every agent reads the latest version of the ticket.", fr: "Passer le niveau de cohérence par défaut du compte à Strong pour que chaque agent lise la dernière version du ticket." } }
    - { id: d, text: { en: "Call UpsertItemAsync instead of ReplaceItemAsync so that the service merges both versions of the ticket.", fr: "Appeler UpsertItemAsync au lieu de ReplaceItemAsync pour que le service fusionne les deux versions du ticket." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Optimistic concurrency control uses the system _etag, which changes on every update. When the If-Match ETag sent with the replace no longer matches the item's current _etag, the service rejects the write with HTTP 412, so the second agent's stale save is detected instead of overwriting the first."
    fr: "Le contrôle d'accès concurrentiel optimiste utilise l'_etag système, qui change à chaque mise à jour. Quand l'ETag If-Match envoyé avec le remplacement ne correspond plus à l'_etag actuel de l'élément, le service rejette l'écriture avec le code HTTP 412 : l'enregistrement obsolète du second agent est détecté au lieu d'écraser le premier."
  options:
    b: { en: "If-None-Match is used to decide whether a resource must be fetched again, not to protect a write against concurrent changes.", fr: "If-None-Match sert à déterminer s'il faut récupérer de nouveau une ressource, pas à protéger une écriture contre des modifications simultanées." }
    c: { en: "Strong consistency guarantees fresh reads, but two agents who read the same version still overwrite each other.", fr: "La cohérence Strong garantit des lectures à jour, mais deux agents qui lisent la même version s'écrasent toujours mutuellement." }
    d: { en: "Upsert replaces the whole item; it does not merge versions or detect conflicts.", fr: "Upsert remplace l'élément entier ; il ne fusionne pas les versions et ne détecte pas les conflits." }
references:
  - title: Database Transactions and Optimistic Concurrency Control - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/database-transactions-optimistic-concurrency
