id: dp420-cs4b-partition-design
objective: "1.3.5"
type: single
caseStudy: dp420-cs4b-relecloud-tickets
difficulty: 3
status: draft
stem:
  en: You need to choose the partition key of the inventory container to meet the inventory requirements. What should you use?
  fr: Vous devez choisir la clé de partition du conteneur inventory pour satisfaire les exigences d'inventaire. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The /venueId partition key, with a higher autoscale maximum throughput", fr: "La clé de partition /venueId, avec un débit maximal en mise à l'échelle automatique plus élevé" } }
    - { id: b, text: { en: "A synthetic /venueEvent partition key that concatenates venueId and eventId", fr: "Une clé de partition synthétique /venueEvent qui concatène venueId et eventId" } }
    - { id: c, text: { en: "A hierarchical partition key with /venueId as the first level and /eventId as the second level", fr: "Une clé de partition hiérarchique avec /venueId au premier niveau et /eventId au second niveau" } }
    - { id: d, text: { en: "The /id partition key, so that each seat, hold and order item has its own logical partition", fr: "La clé de partition /id, pour que chaque élément de place, de réservation temporaire et de commande ait sa propre partition logique" } }
answer: { optionId: c }
explanation:
  correct:
    en: With venueId > eventId, the items of one event share a full logical partition key, so a transactional batch can update its seats and create the order atomically. Each venueId + eventId combination is limited to 20 GB, but a venue prefix can exceed 20 GB and span several physical partitions, and a query that filters on venueId is routed only to the physical partitions that hold that venue. With 2,500 venues, the first level has enough cardinality.
    fr: Avec venueId > eventId, les éléments d'un événement partagent une clé de partition logique complète, si bien qu'un lot transactionnel peut mettre à jour ses places et créer la commande de façon atomique. Chaque combinaison venueId + eventId est limitée à 20 Go, mais un préfixe de salle peut dépasser 20 Go et s'étendre sur plusieurs partitions physiques, et une requête qui filtre sur venueId n'est envoyée qu'aux partitions physiques qui contiennent cette salle. Avec 2 500 salles, le premier niveau a une cardinalité suffisante.
  options:
    a: { en: "A logical partition is limited to 20 GB whatever the throughput, so the largest venues would stop accepting writes.", fr: "Une partition logique est limitée à 20 Go quel que soit le débit : les plus grandes salles ne pourraient plus accepter d'écritures." }
    b: { en: "Batches work per event, but a query that filters only on venueId cannot be routed by the synthetic value and is sent to every physical partition.", fr: "Les lots fonctionnent par événement, mais une requête qui filtre uniquement sur venueId ne peut pas être routée par la valeur synthétique et est envoyée à toutes les partitions physiques." }
    d: { en: "A transactional batch requires the same logical partition key, so seats and the order could not be updated atomically, and the venue query would fan out.", fr: "Un lot transactionnel exige la même clé de partition logique : les places et la commande ne pourraient pas être mises à jour de façon atomique, et la requête par salle s'exécuterait sur toutes les partitions." }
references:
  - title: Hierarchical Partition Keys - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
  - title: Transactional Batch Operations - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/transactional-batch
