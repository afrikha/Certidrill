id: dp420-1c-impact-hot-tenant-fix
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware hosts a multi-tenant application on Azure Cosmos DB for NoSQL. The **documents** container is partitioned by `/tenantId` and has 30,000 RU/s of manual throughput. Each document has a `userId` property, and every tenant has hundreds of users.

    In Azure Monitor, the **Normalized RU Consumption (%) By PartitionKeyRangeID** chart shows one partition key range at 100 percent while the others stay below 25 percent. The CDBPartitionKeyRUConsumption logs show that the tenant **contoso** consumes most of the RUs, and its data already reaches 17 GB. Requests for contoso receive frequent 429 responses.

    You need a long-term solution that removes the bottleneck at the lowest cost.

    What should you do?
  fr: |
    Litware héberge une application multilocataire sur Azure Cosmos DB for NoSQL. Le conteneur **documents** est partitionné par `/tenantId` et dispose de 30 000 RU/s de débit manuel. Chaque document a une propriété `userId`, et chaque locataire compte des centaines d'utilisateurs.

    Dans Azure Monitor, le graphique **Normalized RU Consumption (%) By PartitionKeyRangeID** montre une plage de clés de partition à 100 % tandis que les autres restent sous 25 %. Les journaux CDBPartitionKeyRUConsumption montrent que le locataire **contoso** consomme la plupart des RU, et ses données atteignent déjà 17 Go. Les requêtes de contoso reçoivent fréquemment des réponses 429.

    Vous avez besoin d'une solution à long terme qui supprime le goulot d'étranglement au coût le plus faible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Raise the container throughput to 90,000 RU/s", fr: "Augmenter le débit du conteneur à 90 000 RU/s" } }
    - { id: b, text: { en: "Switch the container to autoscale with a maximum of 30,000 RU/s", fr: "Passer le conteneur en mise à l'échelle automatique avec un maximum de 30 000 RU/s" } }
    - { id: c, text: { en: "Migrate the data to a new container partitioned by /tenantId and /userId", fr: "Migrer les données vers un nouveau conteneur partitionné par /tenantId et /userId" } }
    - { id: d, text: { en: "Change the default consistency level of the account to Eventual", fr: "Changer le niveau de cohérence par défaut du compte en Eventual" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      All of contoso's data is one logical partition, limited to 10,000 RU/s and 20 GB, so it saturates one physical partition. The partition key cannot be changed in place; migrating to a new container with a hierarchical partition key lets contoso's data span several physical partitions, and queries that filter on the tenant still target only those partitions.
    fr: |-
      Toutes les données de contoso forment une partition logique, limitée à 10 000 RU/s et 20 Go : elle sature une partition physique. La clé de partition ne peut pas être modifiée sur place ; migrer vers un nouveau conteneur doté d'une clé de partition hiérarchique permet aux données de contoso de s'étendre sur plusieurs partitions physiques, et les requêtes qui filtrent sur le locataire ne ciblent toujours que ces partitions.
  options:
    a: { en: "More throughput is only a short-term, costly workaround: contoso stays capped at 10,000 RU/s and still reaches 20 GB.", fr: "Plus de débit n'est qu'un palliatif coûteux à court terme : contoso reste plafonné à 10 000 RU/s et atteint quand même 20 Go." }
    b: { en: "Autoscale with the same maximum gives no more throughput to the hot partition.", fr: "La mise à l'échelle automatique avec le même maximum ne donne pas plus de débit à la partition chaude." }
    d: { en: "Eventual consistency lowers the read cost slightly but does not spread the tenant's load or storage.", fr: "La cohérence Eventual réduit légèrement le coût des lectures, mais ne répartit ni la charge ni le stockage du locataire." }
references:
