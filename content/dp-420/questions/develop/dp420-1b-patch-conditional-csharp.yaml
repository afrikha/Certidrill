id: dp420-1b-patch-conditional-csharp
objective: "1.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys sells limited editions. Each product item in an Azure Cosmos DB for NoSQL container has a numeric `stock` property, and the container is partitioned by `/categoryId`.

    When a customer buys a product, a .NET service must decrease `stock` by 1 in a single request, without reading the item first. The update must not be applied if `stock` is already 0.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys vend des éditions limitées. Chaque élément produit d'un conteneur Azure Cosmos DB for NoSQL possède une propriété numérique `stock`, et le conteneur est partitionné par `/categoryId`.

    Quand un client achète un produit, un service .NET doit diminuer `stock` de 1 en une seule requête, sans lire l'élément au préalable. La mise à jour ne doit pas être appliquée si `stock` vaut déjà 0.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    var options = new [[opts]]
    {
        FilterPredicate = [[pred]]
    };

    ItemResponse<Product> response = await container.PatchItemAsync<Product>(
        id: productId,
        partitionKey: new PartitionKey(categoryId),
        patchOperations: new[] { [[op]] },
        requestOptions: options);
  slots:
    - id: opts
      options:
        - { id: patch, text: PatchItemRequestOptions }
        - { id: item, text: ItemRequestOptions }
        - { id: query, text: QueryRequestOptions }
    - id: pred
      options:
        - { id: from, text: '"FROM products p WHERE p.stock > 0"' }
        - { id: bare, text: '"p.stock > 0"' }
        - { id: path, text: '"/stock > 0"' }
    - id: op
      options:
        - { id: incr, text: 'PatchOperation.Increment("/stock", -1)' }
        - { id: set, text: 'PatchOperation.Set("/stock", -1)' }
        - { id: replace, text: 'PatchOperation.Replace("/stock", "stock - 1")' }
answer:
  values: { opts: patch, pred: from, op: incr }
explanation:
  correct:
    en: "A conditional patch uses `PatchItemRequestOptions.FilterPredicate`, a SQL-like predicate written as `FROM <alias> WHERE <condition>`; the patch fails if the item does not satisfy it. `PatchOperation.Increment` with a negative value decreases the number on the server, so no read is needed."
    fr: "Un patch conditionnel utilise `PatchItemRequestOptions.FilterPredicate`, un prédicat de type SQL écrit sous la forme `FROM <alias> WHERE <condition>` ; le patch échoue si l'élément ne le satisfait pas. `PatchOperation.Increment` avec une valeur négative diminue le nombre côté serveur : aucune lecture n'est nécessaire."
  options:
    item: { en: "ItemRequestOptions has no FilterPredicate property; the predicate belongs to PatchItemRequestOptions.", fr: "ItemRequestOptions n'a pas de propriété FilterPredicate ; le prédicat appartient à PatchItemRequestOptions." }
    query: { en: "QueryRequestOptions configures queries, not patch operations.", fr: "QueryRequestOptions configure les requêtes, pas les opérations de patch." }
    bare: { en: "The predicate must include the FROM clause with an alias, as in FROM products p WHERE ....", fr: "Le prédicat doit inclure la clause FROM avec un alias, comme FROM products p WHERE ...." }
    path: { en: "A JSON path is not a valid filter predicate.", fr: "Un chemin JSON n'est pas un prédicat de filtre valide." }
    set: { en: "Set writes the value -1 instead of decreasing the stock.", fr: "Set écrit la valeur -1 au lieu de diminuer le stock." }
    replace: { en: "Replace writes the literal string \"stock - 1\"; patch values are not expressions.", fr: "Replace écrit la chaîne littérale \"stock - 1\" ; les valeurs de patch ne sont pas des expressions." }
references:
  - title: Get Started with Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update-getting-started
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
