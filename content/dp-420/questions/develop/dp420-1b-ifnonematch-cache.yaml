id: dp420-1b-ifnonematch-cache
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind's .NET API caches large product items read from Azure Cosmos DB for NoSQL, together with their ETag. Every five minutes, the API checks each cached product. Products rarely change.

    You need to refresh a cached product only when it changed, and minimize the data transferred when it did not change.

    What should you do?
  fr: |
    L'API .NET de Northwind met en cache des éléments produits volumineux lus dans Azure Cosmos DB for NoSQL, avec leur ETag. Toutes les cinq minutes, l'API vérifie chaque produit mis en cache. Les produits changent rarement.

    Vous devez actualiser un produit mis en cache uniquement s'il a changé, et réduire au minimum les données transférées quand il n'a pas changé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Call ReadItemStreamAsync and compare the _etag of the returned item with the cached ETag.", fr: "Appeler ReadItemStreamAsync et comparer l'_etag de l'élément renvoyé à l'ETag mis en cache." } }
    - { id: b, text: { en: "Call ReadItemAsync with ItemRequestOptions.ConsistencyLevel set to Eventual.", fr: "Appeler ReadItemAsync avec ItemRequestOptions.ConsistencyLevel défini sur Eventual." } }
    - { id: c, text: { en: "Call ReadItemAsync with ItemRequestOptions.IfNoneMatchEtag set to the cached ETag.", fr: "Appeler ReadItemAsync avec ItemRequestOptions.IfNoneMatchEtag défini sur l'ETag mis en cache." } }
    - { id: d, text: { en: "Call ReadItemAsync with ItemRequestOptions.IfMatchEtag set to the cached ETag.", fr: "Appeler ReadItemAsync avec ItemRequestOptions.IfMatchEtag défini sur l'ETag mis en cache." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The If-None-Match header uses the _etag to determine whether a resource needs to be fetched again. When the cached ETag still matches, the service returns no item body (HTTP 304 Not Modified), so unchanged products cost almost no transfer; when it differs, the new version is returned."
    fr: "L'en-tête If-None-Match utilise l'_etag pour déterminer s'il faut récupérer de nouveau une ressource. Quand l'ETag mis en cache correspond toujours, le service ne renvoie pas le corps de l'élément (HTTP 304 Not Modified) : les produits inchangés ne coûtent presque aucun transfert ; quand il diffère, la nouvelle version est renvoyée."
  options:
    d: { en: "If-Match is a precondition for writes; it does not avoid downloading an unchanged item.", fr: "If-Match est une condition préalable pour les écritures ; il n'évite pas le téléchargement d'un élément inchangé." }
    a: { en: "Comparing on the client still downloads the full item every time.", fr: "Comparer côté client télécharge quand même l'élément complet à chaque fois." }
    b: { en: "A weaker consistency level does not reduce the size of the response.", fr: "Un niveau de cohérence plus faible ne réduit pas la taille de la réponse." }
references:
  - title: Database Transactions and Optimistic Concurrency Control - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/database-transactions-optimistic-concurrency
  - title: Get a Document - Azure Cosmos DB REST API
    url: https://learn.microsoft.com/en-us/rest/api/cosmos-db/get-a-document
