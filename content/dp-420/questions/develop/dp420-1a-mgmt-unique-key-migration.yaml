id: dp420-1a-mgmt-unique-key-migration
objective: "1.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has an Azure Cosmos DB for NoSQL container named **members** partitioned on `/clubId`. You have verified that no club currently has two members with the same email address. A new requirement states that the service must reject any duplicate email within a club.

    The original container must be kept as a fallback until the new configuration is validated.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **members**, partitionné sur `/clubId`. Vous avez vérifié qu'aucun club n'a actuellement deux membres avec la même adresse e-mail. Une nouvelle exigence impose que le service rejette toute adresse en double au sein d'un club.

    Le conteneur d'origine doit être conservé comme solution de repli jusqu'à la validation de la nouvelle configuration.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a container partitioned on /clubId with a unique key policy on /email.", fr: "Créer un conteneur partitionné sur /clubId avec une stratégie de clé unique sur /email." } }
    - { id: copy, text: { en: "Copy the items from members to the new container by using a container copy job.", fr: "Copier les éléments de members vers le nouveau conteneur au moyen d'une tâche de copie de conteneur." } }
    - { id: switch, text: { en: "Update the application to use the new container.", fr: "Mettre à jour l'application pour qu'elle utilise le nouveau conteneur." } }
    - { id: inplace, text: { en: "Add a unique key policy on /email to the members container.", fr: "Ajouter une stratégie de clé unique sur /email au conteneur members." } }
    - { id: delete, text: { en: "Delete the members container.", fr: "Supprimer le conteneur members." } }
    - { id: index, text: { en: "Add /email/? to the included paths of the indexing policy of members.", fr: "Ajouter /email/? aux chemins inclus de la stratégie d'indexation de members." } }
answer:
  sequence: [ create, copy, switch ]
explanation:
  correct:
    en: |
      A unique key policy can be defined only when a container is created and can't be changed afterward. You create a new container with the same partition key and the unique key policy, copy the data with a container copy job, and then move the application to the new container. The original container stays available as a fallback.
    fr: |
      Une stratégie de clé unique ne peut être définie qu'à la création d'un conteneur et ne peut plus être modifiée ensuite. Vous créez un nouveau conteneur avec la même clé de partition et la stratégie de clé unique, vous copiez les données avec une tâche de copie de conteneur, puis vous faites passer l'application au nouveau conteneur. Le conteneur d'origine reste disponible comme solution de repli.
  options:
    inplace: { en: "The unique key policy of an existing container can't be changed.", fr: "La stratégie de clé unique d'un conteneur existant ne peut pas être modifiée." }
    delete: { en: "The original container must be kept as a fallback.", fr: "Le conteneur d'origine doit être conservé comme solution de repli." }
    index: { en: "Indexing a path speeds up queries on it but doesn't enforce uniqueness.", fr: "Indexer un chemin accélère les requêtes sur celui-ci, mais n'impose pas l'unicité." }
references:
  - title: Unique key constraints in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/unique-keys
