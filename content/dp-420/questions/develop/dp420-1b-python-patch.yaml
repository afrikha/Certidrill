id: dp420-1b-python-patch
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware's publishing platform stores articles in an Azure Cosmos DB for NoSQL container partitioned by `/authorId`. A Python worker uses the `azure-cosmos` SDK.

    When an article becomes popular, the worker must, in a single patch request:

    - increase `viewCount` by 1;
    - append `"trending"` at the end of the `tags` array;
    - delete the `draft` property.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    La plateforme de publication de Litware stocke des articles dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/authorId`. Un processus de travail Python utilise le SDK `azure-cosmos`.

    Quand un article devient populaire, le processus doit, en une seule requête de patch :

    - augmenter `viewCount` de 1 ;
    - ajouter `"trending"` à la fin du tableau `tags` ;
    - supprimer la propriété `draft`.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    operations = [
        {"op": [[op1]], "path": "/viewCount", "value": 1},
        {"op": "add", "path": [[path]], "value": "trending"},
        {"op": [[op3]], "path": "/draft"},
    ]

    container.patch_item(
        item=article_id,
        partition_key=author_id,
        patch_operations=operations,
    )
  slots:
    - id: op1
      options:
        - { id: incr, text: '"incr"' }
        - { id: set, text: '"set"' }
        - { id: add, text: '"add"' }
    - id: path
      options:
        - { id: end, text: '"/tags/-"' }
        - { id: whole, text: '"/tags"' }
        - { id: first, text: '"/tags/0"' }
    - id: op3
      options:
        - { id: remove, text: '"remove"' }
        - { id: replace, text: '"replace"' }
        - { id: move, text: '"move"' }
answer:
  values: { op1: incr, path: end, op3: remove }
explanation:
  correct:
    en: "The `incr` operation adds the given value to a number on the server. For `add`, the `-` index (or an index equal to the array length) appends the value to the end of the array. The `remove` operation deletes the path and needs no value."
    fr: "L'opération `incr` ajoute la valeur donnée à un nombre côté serveur. Pour `add`, l'index `-` (ou un index égal à la longueur du tableau) ajoute la valeur à la fin du tableau. L'opération `remove` supprime le chemin et ne nécessite aucune valeur."
  options:
    set: { en: "set writes the value 1 instead of increasing the counter.", fr: "set écrit la valeur 1 au lieu d'augmenter le compteur." }
    add: { en: "add on an existing number replaces its value with 1.", fr: "add sur un nombre existant remplace sa valeur par 1." }
    whole: { en: "Adding at /tags replaces the whole array with a string.", fr: "Un add sur /tags remplace tout le tableau par une chaîne." }
    first: { en: "Index 0 inserts the value at the beginning of the array, not at the end.", fr: "L'index 0 insère la valeur au début du tableau, pas à la fin." }
    replace: { en: "replace updates an existing value; it does not delete the property.", fr: "replace met à jour une valeur existante ; il ne supprime pas la propriété." }
    move: { en: "move needs a from path and relocates a value instead of deleting it.", fr: "move exige un chemin from et déplace une valeur au lieu de la supprimer." }
references:
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy
