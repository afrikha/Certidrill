id: dp420-1a-mgmt-shared-autoscale-db
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is creating a database named **catalog** in an Azure Cosmos DB for NoSQL account with provisioned throughput. Ten small containers will be created in the database later. The containers must share autoscale throughput that scales between 100 and 1,000 RU/s.

    Which two code snippets can you use to create the database? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys crée une base de données nommée **catalog** dans un compte Azure Cosmos DB for NoSQL à débit approvisionné. Dix petits conteneurs seront créés ultérieurement dans la base de données. Les conteneurs doivent partager un débit à mise à l'échelle automatique qui varie entre 100 et 1 000 RU/s.

    Quels sont les deux extraits de code que vous pouvez utiliser pour créer la base de données ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Python: client.create_database_if_not_exists(id=\"catalog\", offer_throughput=ThroughputProperties(auto_scale_max_throughput=1000))" }
    - { id: b, text: "C#: await client.CreateDatabaseIfNotExistsAsync(\"catalog\", ThroughputProperties.CreateAutoscaleThroughput(1000));" }
    - { id: c, text: "Python: client.create_database_if_not_exists(id=\"catalog\", offer_throughput=1000)" }
    - { id: d, text: "C#: await client.CreateDatabaseIfNotExistsAsync(\"catalog\", 1000);" }
    - { id: e, text: "C#: await client.CreateDatabaseIfNotExistsAsync(\"catalog\", ThroughputProperties.CreateManualThroughput(1000));" }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Autoscale throughput scales between 10 percent of its maximum and the maximum, so a maximum of 1,000 RU/s gives the 100 to 1,000 RU/s range. In Python, you pass a `ThroughputProperties` object with `auto_scale_max_throughput`; in .NET, you pass `ThroughputProperties.CreateAutoscaleThroughput(1000)`. Throughput set on the database is shared by its containers.
    fr: |
      Le débit à mise à l'échelle automatique varie entre 10 % de son maximum et ce maximum : un maximum de 1 000 RU/s donne la plage de 100 à 1 000 RU/s. En Python, vous transmettez un objet `ThroughputProperties` avec `auto_scale_max_throughput` ; en .NET, vous transmettez `ThroughputProperties.CreateAutoscaleThroughput(1000)`. Le débit défini sur la base de données est partagé par ses conteneurs.
  options:
    c: { en: "An integer offer_throughput provisions 1,000 RU/s of manual throughput, which doesn't scale.", fr: "Une valeur entière offer_throughput approvisionne 1 000 RU/s de débit manuel, qui ne s'ajuste pas." }
    d: { en: "The int? overload provisions manual throughput.", fr: "La surcharge int? approvisionne un débit manuel." }
    e: { en: "CreateManualThroughput provisions a fixed 1,000 RU/s.", fr: "CreateManualThroughput approvisionne un débit fixe de 1 000 RU/s." }
references:
  - title: azure.cosmos.offer.ThroughputProperties class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.offer.throughputproperties
  - title: CosmosClient Class (Microsoft.Azure.Cosmos)
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclient
