id: dp420-1d-point-read-ru
objective: "1.3.8"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You are estimating the RU consumption of the read operations of an Azure Cosmos DB for NoSQL application. All the reads are point reads by item id and partition key.

    What RU charge should you use for each read? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous estimez la consommation en RU des opérations de lecture d'une application Azure Cosmos DB for NoSQL. Toutes les lectures sont des lectures ponctuelles par id d'élément et clé de partition.

    Quelle charge en RU devez-vous utiliser pour chaque lecture ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Point read of a 1 KB item with Session consistency: [[s1]]

      Point read of a 1 KB item with Strong consistency: [[s2]]

      Point read of a 100 KB item with Session consistency: [[s3]]
    fr: |
      Lecture ponctuelle d'un élément de 1 Ko en cohérence Session : [[s1]]

      Lecture ponctuelle d'un élément de 1 Ko en cohérence Strong : [[s2]]

      Lecture ponctuelle d'un élément de 100 Ko en cohérence Session : [[s3]]
  slots:
    - id: s1
      options:
        - { id: a1, text: "1 RU" }
        - { id: a2, text: "2 RUs" }
        - { id: a5, text: "5 RUs" }
        - { id: a10, text: "10 RUs" }
    - id: s2
      options:
        - { id: b1, text: "1 RU" }
        - { id: b2, text: "2 RUs" }
        - { id: b5, text: "5 RUs" }
        - { id: b10, text: "10 RUs" }
    - id: s3
      options:
        - { id: c1, text: "1 RU" }
        - { id: c5, text: "5 RUs" }
        - { id: c10, text: "10 RUs" }
        - { id: c100, text: "100 RUs" }
answer:
  values: { s1: a1, s2: b2, s3: c10 }
explanation:
  correct:
    en: |
      A point read of a 1 KB item costs 1 RU, and a point read of a 100 KB item costs 10 RUs; the item size is the only factor besides consistency. With Strong or Bounded staleness consistency, the RU cost of every read, including point reads, is doubled.
    fr: |
      Une lecture ponctuelle d'un élément de 1 Ko coûte 1 RU, et celle d'un élément de 100 Ko coûte 10 RU ; la taille de l'élément est le seul facteur en dehors de la cohérence. Avec la cohérence Strong ou Bounded staleness, le coût en RU de toute lecture, y compris les lectures ponctuelles, est doublé.
  options:
    a5: { en: "About 5 RUs is the cost of inserting a 1 KB item, not of reading it.", fr: "Environ 5 RU correspond au coût d'insertion d'un élément de 1 Ko, pas de sa lecture." }
    b1: { en: "Strong consistency doubles the RU cost of reads.", fr: "La cohérence Strong double le coût en RU des lectures." }
    c100: { en: "The point read cost does not grow linearly with the item size: 100 KB costs 10 RUs.", fr: "Le coût d'une lecture ponctuelle n'augmente pas linéairement avec la taille : 100 Ko coûtent 10 RU." }
references:
  - title: Optimize Request Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
