id: dp420-1b-read-many
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's recommendation engine returns a list of 40 products, each identified by its `id` and its partition key value. The products belong to many different logical partitions of an Azure Cosmos DB for NoSQL container.

    A .NET API must fetch these 40 products in a single SDK call with the lowest latency.

    What should you use?
  fr: |
    Le moteur de recommandation de Fabrikam renvoie une liste de 40 produits, chacun identifié par son `id` et sa valeur de clé de partition. Les produits appartiennent à de nombreuses partitions logiques différentes d'un conteneur Azure Cosmos DB for NoSQL.

    Une API .NET doit récupérer ces 40 produits en un seul appel au SDK, avec la latence la plus faible.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A TransactionalBatch, with one ReadItem operation per product", fr: "Un TransactionalBatch, avec une opération ReadItem par produit" } }
    - { id: b, text: { en: "ReadItemStreamAsync, with the list of id values and no partition key", fr: "ReadItemStreamAsync, avec la liste des valeurs d'id et sans clé de partition" } }
    - { id: c, text: { en: "ReadManyItemsAsync, with the list of (id, PartitionKey) pairs", fr: "ReadManyItemsAsync, avec la liste des paires (id, PartitionKey)" } }
    - { id: d, text: { en: "GetItemQueryIterator, with a query that uses IN on the 40 id values", fr: "GetItemQueryIterator, avec une requête qui utilise IN sur les 40 valeurs d'id" } }
answer: { optionId: c }
explanation:
  correct:
    en: "ReadManyItemsAsync takes a list of id and partition key pairs and returns the matching items. It is designed to perform better latency-wise than a query with an IN clause when you fetch many independent items."
    fr: "ReadManyItemsAsync prend une liste de paires id et clé de partition et renvoie les éléments correspondants. Cette méthode est conçue pour offrir une meilleure latence qu'une requête avec une clause IN quand vous récupérez de nombreux éléments indépendants."
  options:
    d: { en: "An IN query across many partitions works but has higher latency than ReadManyItemsAsync.", fr: "Une requête IN sur de nombreuses partitions fonctionne mais présente une latence supérieure à ReadManyItemsAsync." }
    a: { en: "A transactional batch is scoped to a single partition key value, so it cannot read items from different partitions.", fr: "Un lot transactionnel est limité à une seule valeur de clé de partition : il ne peut pas lire des éléments de partitions différentes." }
    b: { en: "ReadItemStreamAsync reads one item and requires its id and partition key.", fr: "ReadItemStreamAsync lit un seul élément et exige son id et sa clé de partition." }
references:
  - title: Read an Item Using .NET - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-read-item
