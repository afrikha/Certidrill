id: dp420-1a-thr-burst-facts
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL container with 2,000 RU/s of manual throughput spread over two physical partitions. A few times per hour, the workload spikes for several seconds and receives HTTP 429 responses. The team is evaluating burst capacity before it raises the provisioned throughput.

    Which two statements about burst capacity are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un conteneur Azure Cosmos DB for NoSQL avec un débit manuel de 2 000 RU/s réparti sur deux partitions physiques. Plusieurs fois par heure, la charge de travail connaît un pic de quelques secondes et reçoit des réponses HTTP 429. L'équipe évalue la capacité en rafale avant d'augmenter le débit approvisionné.

    Quelles sont les deux affirmations vraies sur la capacité en rafale ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A partition consumes its accumulated capacity at a rate of up to 3,000 RU/s.", fr: "Une partition consomme sa capacité accumulée à un débit pouvant atteindre 3 000 RU/s." } }
    - { id: b, text: { en: "Burst capacity also applies to containers in serverless accounts.", fr: "La capacité en rafale s'applique aussi aux conteneurs des comptes serverless." } }
    - { id: c, text: { en: "Physical partitions with 10,000 RU/s benefit the most from burst capacity.", fr: "Les partitions physiques de 10 000 RU/s sont celles qui profitent le plus de la capacité en rafale." } }
    - { id: d, text: { en: "You enable burst capacity on each container in the Scale & Settings pane of Data Explorer.", fr: "Vous activez la capacité en rafale sur chaque conteneur dans le volet Scale & Settings de l'Explorateur de données." } }
    - { id: e, text: { en: "Each physical partition can accumulate up to five minutes of its unused throughput.", fr: "Chaque partition physique peut accumuler jusqu'à cinq minutes de son débit inutilisé." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      With burst capacity, each physical partition accumulates up to 5 minutes of idle capacity and can consume it at up to 3,000 RU/s. Here each partition has 1,000 RU/s, so each partition can accumulate up to 300,000 RUs to absorb short spikes; this extra capacity isn't guaranteed.
    fr: |
      Avec la capacité en rafale, chaque partition physique accumule jusqu'à 5 minutes de capacité inutilisée et peut la consommer jusqu'à 3 000 RU/s. Ici, chaque partition dispose de 1 000 RU/s : chaque partition peut accumuler jusqu'à 300 000 RU pour absorber les pics brefs ; cette capacité supplémentaire n'est pas garantie.
  options:
    b: { en: "Burst capacity applies to provisioned throughput (manual and autoscale), not to serverless containers.", fr: "La capacité en rafale s'applique au débit approvisionné (manuel et mise à l'échelle automatique), pas aux conteneurs serverless." }
    c: { en: "Only physical partitions with less than 3,000 RU/s can use burst capacity.", fr: "Seules les partitions physiques de moins de 3 000 RU/s peuvent utiliser la capacité en rafale." }
    d: { en: "Burst capacity is enabled at the account level, on the Features page, and applies to all eligible resources.", fr: "La capacité en rafale s'active au niveau du compte, dans la page Features, et s'applique à toutes les ressources éligibles." }
references:
  - title: Burst capacity in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/burst-capacity
