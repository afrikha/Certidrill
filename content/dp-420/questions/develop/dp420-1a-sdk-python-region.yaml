id: dp420-1a-sdk-python-region
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account with a write region in East US and a read region in West Europe. A Python service hosted in West Europe creates its client with `CosmosClient(ENDPOINT, credential)` and performs only reads. The read latency is about 90 ms.

    You need to reduce the read latency of the service.

    What should you do?
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL avec une région d'écriture dans East US et une région de lecture dans West Europe. Un service Python hébergé dans West Europe crée son client avec `CosmosClient(ENDPOINT, credential)` et effectue uniquement des lectures. La latence de lecture est d'environ 90 ms.

    Vous devez réduire la latence de lecture du service.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Pass enable_endpoint_discovery=False to the CosmosClient constructor.", fr: "Transmettre enable_endpoint_discovery=False au constructeur de CosmosClient." } }
    - { id: b, text: { en: "Pass consistency_level=\"Strong\" to the CosmosClient constructor.", fr: "Transmettre consistency_level=\"Strong\" au constructeur de CosmosClient." } }
    - { id: c, text: { en: "Pass preferred_locations=[\"West Europe\"] to the CosmosClient constructor.", fr: "Transmettre preferred_locations=[\"West Europe\"] au constructeur de CosmosClient." } }
    - { id: d, text: { en: "Pass connection_mode=\"Direct\" to the CosmosClient constructor.", fr: "Transmettre connection_mode=\"Direct\" au constructeur de CosmosClient." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Without preferred locations, the client sends its requests to the write region. Setting `preferred_locations` to the region where the service runs routes reads to the local West Europe replica, which removes the transatlantic round trip.
    fr: |
      Sans emplacements préférés, le client envoie ses requêtes à la région d'écriture. Définir `preferred_locations` sur la région où s'exécute le service dirige les lectures vers le réplica local de West Europe, ce qui supprime l'aller-retour transatlantique.
  options:
    d: { en: "The Python SDK currently supports only the Gateway connection mode.", fr: "Le SDK Python prend actuellement en charge uniquement le mode de connexion Gateway." }
    a: { en: "Disabling endpoint discovery stops the client from using the other regions of the account; it doesn't route reads to West Europe.", fr: "Désactiver la découverte des points de terminaison empêche le client d'utiliser les autres régions du compte ; cela ne dirige pas les lectures vers West Europe." }
    b: { en: "A client can only relax the account consistency, and stronger reads wouldn't reduce latency.", fr: "Un client peut seulement assouplir la cohérence du compte, et des lectures plus fortes ne réduiraient pas la latence." }
references:
  - title: azure.cosmos.cosmos_client.CosmosClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.cosmos_client.cosmosclient
