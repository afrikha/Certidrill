id: dp420-1a-thr-dotnet-autoscale
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is writing a .NET deployment tool for Azure Cosmos DB for NoSQL. The tool must:

    - create a **telemetry** container whose throughput scales automatically between 1,000 and 10,000 RU/s;
    - later raise the maximum of the same container to 20,000 RU/s;
    - report whether the requested change is still being applied in the background.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys écrit un outil de déploiement .NET pour Azure Cosmos DB for NoSQL. L'outil doit :

    - créer un conteneur **telemetry** dont le débit s'ajuste automatiquement entre 1 000 et 10 000 RU/s ;
    - porter ensuite le maximum de ce même conteneur à 20 000 RU/s ;
    - indiquer si la modification demandée est encore en cours d'application en arrière-plan.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    ContainerProperties properties = new ContainerProperties("telemetry", "/deviceId");
    Container container = await database.CreateContainerIfNotExistsAsync(
        properties, ThroughputProperties.[[create]]);

    ThroughputResponse response = await container.[[replace]](
        ThroughputProperties.CreateAutoscaleThroughput(20000));
    Console.WriteLine($"Pending: {response.[[pending]]}");
  slots:
    - id: create
      options:
        - { id: auto1k, text: CreateAutoscaleThroughput(1000) }
        - { id: manual10k, text: CreateManualThroughput(10000) }
        - { id: manual1k, text: CreateManualThroughput(1000) }
        - { id: auto10k, text: CreateAutoscaleThroughput(10000) }
    - id: replace
      options:
        - { id: replacecont, text: ReplaceContainerAsync }
        - { id: replacetp, text: ReplaceThroughputAsync }
        - { id: readtp, text: ReadThroughputAsync }
    - id: pending
      options:
        - { id: ispending, text: IsReplacePending }
        - { id: minthroughput, text: MinThroughput }
        - { id: statuscode, text: StatusCode }
answer:
  values: { create: auto10k, replace: replacetp, pending: ispending }
explanation:
  correct:
    en: |
      Autoscale is configured with the maximum throughput Tmax and scales between 0.1 x Tmax and Tmax, so a maximum of 10,000 RU/s gives the 1,000 to 10,000 RU/s range. `ReplaceThroughputAsync` changes the throughput, and `ThroughputResponse.IsReplacePending` shows whether the scale operation is still running asynchronously.
    fr: |
      La mise à l'échelle automatique se configure avec le débit maximal Tmax et varie entre 0,1 x Tmax et Tmax : un maximum de 10 000 RU/s donne la plage de 1 000 à 10 000 RU/s. `ReplaceThroughputAsync` modifie le débit, et `ThroughputResponse.IsReplacePending` indique si l'opération de mise à l'échelle est toujours en cours de manière asynchrone.
  options:
    auto1k: { en: "A maximum of 1,000 RU/s scales between 100 and 1,000 RU/s.", fr: "Un maximum de 1 000 RU/s varie entre 100 et 1 000 RU/s." }
    manual10k: { en: "Manual throughput stays fixed at the provisioned value; it doesn't scale.", fr: "Le débit manuel reste fixe à la valeur approvisionnée ; il ne s'ajuste pas." }
    replacecont: { en: "ReplaceContainerAsync updates container properties such as the indexing policy, not the throughput.", fr: "ReplaceContainerAsync met à jour des propriétés du conteneur comme la stratégie d'indexation, pas le débit." }
    minthroughput: { en: "MinThroughput returns the lowest throughput you can set, not the progress of the change.", fr: "MinThroughput renvoie le débit le plus bas que vous pouvez définir, pas l'avancement de la modification." }
references:
  - title: Introduction to provisioned throughput in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/set-throughput
  - title: Create Azure Cosmos DB containers and databases with autoscale throughput
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale
