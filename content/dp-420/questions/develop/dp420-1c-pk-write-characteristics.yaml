id: dp420-1c-pk-write-characteristics
objective: "1.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are choosing the partition key of a write-heavy Azure Cosmos DB for NoSQL container that will grow to several terabytes.

    Which two characteristics should the partition key property have?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous choisissez la clé de partition d'un conteneur Azure Cosmos DB for NoSQL à dominante écriture qui atteindra plusieurs téraoctets.

    Quelles sont les deux caractéristiques que doit avoir la propriété de clé de partition ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A value that changes each time the item is updated", fr: "Une valeur qui change à chaque mise à jour de l'élément" } }
    - { id: b, text: { en: "A wide range of distinct values", fr: "Un large éventail de valeurs distinctes" } }
    - { id: c, text: { en: "Values that steadily increase over time, such as the current date", fr: "Des valeurs qui augmentent régulièrement dans le temps, comme la date du jour" } }
    - { id: d, text: { en: "Writes and storage spread evenly across its values", fr: "Des écritures et un stockage répartis uniformément entre ses valeurs" } }
    - { id: e, text: { en: "A few distinct values so that related items stay together", fr: "Quelques valeurs distinctes pour que les éléments associés restent groupés" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A good partition key has high cardinality and distributes RU consumption and storage evenly across its values, so that the work spreads over all the physical partitions as the container grows.
    fr: |-
      Une bonne clé de partition a une cardinalité élevée et répartit uniformément la consommation de RU et le stockage entre ses valeurs, afin que le travail se répartisse sur toutes les partitions physiques à mesure que le conteneur grandit.
  options:
    a: { en: "Partition key values are immutable; an item cannot change logical partition in place.", fr: "Les valeurs de clé de partition sont immuables ; un élément ne peut pas changer de partition logique sur place." }
    c: { en: "A steadily increasing value sends all current writes to the same partition key value: a hot partition.", fr: "Une valeur qui augmente régulièrement envoie toutes les écritures courantes vers la même valeur de clé de partition : une partition chaude." }
    e: { en: "Few values create large logical partitions that become hot and reach the 20 GB limit.", fr: "Peu de valeurs créent de grandes partitions logiques qui deviennent chaudes et atteignent la limite de 20 Go." }
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
