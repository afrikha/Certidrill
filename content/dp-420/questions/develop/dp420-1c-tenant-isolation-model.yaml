id: dp420-1c-tenant-isolation-model
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove sells a B2B application built on Azure Cosmos DB for NoSQL to 40 enterprise customers. Each customer requires that:

    - its data is encrypted with its own customer-managed key;
    - its data is replicated only to the Azure regions it chooses;
    - its data can be restored without affecting other customers.

    Which tenant isolation model should you use?
  fr: |
    Woodgrove vend à 40 entreprises clientes une application B2B basée sur Azure Cosmos DB for NoSQL. Chaque client exige que :

    - ses données soient chiffrées avec sa propre clé gérée par le client ;
    - ses données ne soient répliquées que dans les régions Azure qu'il choisit ;
    - ses données puissent être restaurées sans affecter les autres clients.

    Quel modèle d'isolation des locataires devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "One shared container with a hierarchical partition key that starts with /tenantId", fr: "Un conteneur partagé avec une clé de partition hiérarchique qui commence par /tenantId" } }
    - { id: b, text: { en: "One container per tenant with dedicated throughput in a shared account", fr: "Un conteneur par locataire avec un débit dédié dans un compte partagé" } }
    - { id: c, text: { en: "One database per tenant with shared database throughput in a shared account", fr: "Une base de données par locataire avec un débit de base de données partagé dans un compte partagé" } }
    - { id: d, text: { en: "One Azure Cosmos DB account per tenant", fr: "Un compte Azure Cosmos DB par locataire" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Customer-managed keys, the list of replicated regions and the restore boundary are all account-level settings. Only a database account per tenant gives each customer its own key, its own regions and an independent restore.
    fr: |-
      Les clés gérées par le client, la liste des régions répliquées et le périmètre de restauration sont tous des paramètres de niveau compte. Seul un compte de base de données par locataire donne à chaque client sa propre clé, ses propres régions et une restauration indépendante.
  options:
    a: { en: "A shared container uses the same key and regions for all tenants; isolation is only logical.", fr: "Un conteneur partagé utilise la même clé et les mêmes régions pour tous les locataires ; l'isolation n'est que logique." }
    b: { en: "Dedicated container throughput isolates performance, but keys and regions remain set on the shared account.", fr: "Le débit dédié par conteneur isole les performances, mais les clés et les régions restent définies sur le compte partagé." }
    c: { en: "Databases in a shared account share its key and regions, and shared throughput gives no performance guarantee.", fr: "Les bases de données d'un compte partagé partagent sa clé et ses régions, et le débit partagé ne garantit pas les performances." }
references:
  - title: Multitenancy and Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/multitenant/service/cosmos-db
