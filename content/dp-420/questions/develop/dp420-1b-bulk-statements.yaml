id: dp420-1b-bulk-statements
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's .NET ingestion service writes about 500,000 transactions per hour to an Azure Cosmos DB for NoSQL container. The developers plan to enable bulk support by setting `AllowBulkExecution` in `CosmosClientOptions`.

    Which two statements about bulk support are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service d'ingestion .NET de Woodgrove Bank écrit environ 500 000 transactions par heure dans un conteneur Azure Cosmos DB for NoSQL. Les développeurs prévoient d'activer la prise en charge du mode bloc en définissant `AllowBulkExecution` dans `CosmosClientOptions`.

    Quelles sont les deux affirmations vraies sur la prise en charge du mode bloc ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Changing AllowBulkExecution after the CosmosClient is created has no effect on that client.", fr: "Modifier AllowBulkExecution après la création du CosmosClient n'a aucun effet sur ce client." } }
    - { id: b, text: { en: "If one operation fails, the client rolls back the other operations sent in the same service call.", fr: "Si une opération échoue, le client annule les autres opérations envoyées dans le même appel au service." } }
    - { id: c, text: { en: "The service submits all the items through a single SDK method that accepts a list of items.", fr: "Le service soumet tous les éléments au moyen d'une seule méthode du SDK qui accepte une liste d'éléments." } }
    - { id: d, text: { en: "All the operations must target the same partition key value.", fr: "Toutes les opérations doivent cibler la même valeur de clé de partition." } }
    - { id: e, text: { en: "The client groups concurrent point operations into fewer service calls distributed across partitions.", fr: "Le client regroupe les opérations ponctuelles simultanées en un nombre réduit d'appels au service répartis entre les partitions." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "With bulk execution, the CosmosClient internally groups concurrent operations into single service calls, distributes them across partitions and assigns each result to its caller. Bulk options are effectively immutable for the lifetime of the client, so you enable bulk when you create the client."
    fr: "Avec l'exécution en bloc, le CosmosClient regroupe en interne les opérations simultanées dans des appels uniques au service, les répartit entre les partitions et attribue chaque résultat à son appelant. Les options du mode bloc sont de fait immuables pendant la durée de vie du client : vous activez le mode bloc à la création du client."
  options:
    b: { en: "Bulk operations are independent: each one succeeds or fails on its own, with its own result.", fr: "Les opérations en bloc sont indépendantes : chacune réussit ou échoue seule, avec son propre résultat." }
    c: { en: "There is no list-based bulk method; you create one task per operation and wait for them, for example with Task.WhenAll.", fr: "Il n'existe pas de méthode de bloc fondée sur une liste ; vous créez une tâche par opération et les attendez, par exemple avec Task.WhenAll." }
    d: { en: "Bulk operations can target any partition key; the single-partition-key rule applies to transactional batches.", fr: "Les opérations en bloc peuvent cibler n'importe quelle clé de partition ; la règle d'une seule clé de partition s'applique aux lots transactionnels." }
references:
  - title: Bulk Import Data for NoSQL Account by Using the .NET SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/tutorial-dotnet-bulk-import
  - title: Migrate From the Bulk Executor Library to the Bulk Support in .NET V3 SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-migrate-from-bulk-executor-library
