# DP-420 objectives — official study guide, skills measured as of 2026-10-06 (en-us and fr-fr pages, checked on 2026-11-16).
# `code` is the stable key referenced by question files and course sections.
# English: verbatim (including "Evaluating and configuring appropriate throughput"). French: fr-fr page
# with straight apostrophes; obvious machine-translation slips of the fr-fr page are corrected (domain 2
# title, "SDK", "Agent Kit", "(patch)", DiskANN bullet, infinitive forms).
develop:
  - group:
      en: "Evaluate resource models and SDK solutions"
      fr: "Évaluer les modèles de ressources et les solutions SDK"
    objectives:
      - code: "1.1.1"
        en: "Evaluate consistency levels"
        fr: "Évaluer les niveaux de cohérence"
      - code: "1.1.2"
        en: "Evaluate Request Unit (RU) consumption requirements"
        fr: "Évaluer les exigences de consommation d'unités de requête (RU)"
      - code: "1.1.3"
        en: "Evaluating and configuring appropriate throughput"
        fr: "Évaluation et configuration du débit approprié"
      - code: "1.1.4"
        en: "Configure account-level and container-level settings"
        fr: "Configurer les paramètres au niveau du compte et du conteneur"
      - code: "1.1.5"
        en: "Create and manage database and containers"
        fr: "Créer et gérer des conteneurs et des bases de données"
      - code: "1.1.6"
        en: "Initialize SDK clients and connections"
        fr: "Initialiser les clients SDK et les connexions"
  - group:
      en: "Implement database operations"
      fr: "Implémenter des opérations de base de données"
    objectives:
      - code: "1.2.1"
        en: "Implement queries, parameterized queries, paging, and continuation tokens"
        fr: "Implémenter des requêtes, des requêtes paramétrées, une pagination et des jetons de continuation"
      - code: "1.2.2"
        en: "Implement point read operations"
        fr: "Implémenter des opérations de lecture ponctuelle"
      - code: "1.2.3"
        en: "Implement create, replace, update, patch and delete operations"
        fr: "Implémenter des opérations de création, de remplacement, de mise à jour, de correctif (patch) et de suppression"
      - code: "1.2.4"
        en: "Implement bulk, batch, and transactional operations"
        fr: "Implémenter des opérations en bloc, par lot et transactionnelles"
      - code: "1.2.5"
        en: "Configure Time to Live (TTL)"
        fr: "Configurer la durée de vie (TTL)"
      - code: "1.2.6"
        en: "Implement concurrency control mechanisms"
        fr: "Implémenter des mécanismes de contrôle de la concurrence"
  - group:
      en: "Design and implement data models and partitioning strategies"
      fr: "Concevoir et implémenter des modèles de données et des stratégies de partitionnement"
    objectives:
      - code: "1.3.1"
        en: "Design data models for access patterns and operational requirements"
        fr: "Concevoir des modèles de données pour les modèles d'accès et les exigences opérationnelles"
      - code: "1.3.2"
        en: "Design and select partition keys based on cardinality, access patterns, and write distribution requirements"
        fr: "Concevoir et sélectionner des clés de partition en fonction de la cardinalité, des modèles d'accès et des exigences de distribution d'écriture"
      - code: "1.3.3"
        en: "Determine when to embed or reference related data"
        fr: "Déterminer quand incorporer ou référencer des données associées"
      - code: "1.3.4"
        en: "Evaluate the impact of partition key selection on scalability and performance"
        fr: "Évaluer l'impact de la sélection de clé de partition sur l'extensibilité et les performances"
      - code: "1.3.5"
        en: "Implement hierarchical partition keys (HPKs) and multi-tenant partitioning strategies"
        fr: "Implémenter des clés de partition hiérarchiques (HPK) et des stratégies de partitionnement multi-locataire"
      - code: "1.3.6"
        en: "Implement synthetic partition keys"
        fr: "Implémenter des clés de partition synthétiques"
      - code: "1.3.7"
        en: "Identify partitioning anti-patterns and partitioning issues during solution reviews"
        fr: "Identifier les anti-modèles de partitionnement et les problèmes de partitionnement lors des revues de solution"
      - code: "1.3.8"
        en: "Estimate workload cost requirements"
        fr: "Estimer les besoins en coûts de charge de travail"
  - group:
      en: "Implement change feed"
      fr: "Implémenter le flux de modification"
    objectives:
      - code: "1.4.1"
        en: "Implement change feed operations"
        fr: "Implémenter des opérations sur le flux de modification"
      - code: "1.4.2"
        en: "Differentiate between change feed processor and pull mode models"
        fr: "Différencier le processeur de flux de modification et les modèles en mode tirage"
      - code: "1.4.3"
        en: "Configure lease containers"
        fr: "Configurer des conteneurs de bail"
      - code: "1.4.4"
        en: "Implement change feed processing using latest mode or all versions and delete"
        fr: "Implémenter le traitement du flux de modification à l'aide du mode le plus récent ou de toutes les versions et suppressions"
      - code: "1.4.5"
        en: "Implement copy container jobs"
        fr: "Implémenter des tâches de copie de conteneur"
  - group:
      en: "Design and implement Azure Cosmos DB solutions by using AI-assisted tools"
      fr: "Concevoir et implémenter des solutions Azure Cosmos DB à l'aide d'outils assistés par IA"
    objectives:
      - code: "1.5.1"
        en: "Implement Agent Kit to follow Azure Cosmos DB development recommended solutions"
        fr: "Implémenter Agent Kit pour suivre les solutions recommandées pour le développement avec Azure Cosmos DB"
      - code: "1.5.2"
        en: "Implement Agent Kit to accelerate AI application development"
        fr: "Implémenter Agent Kit pour accélérer le développement d'applications IA"
secure-optimize:
  - group:
      en: "Implement database security controls"
      fr: "Implémenter des contrôles de sécurité de base de données"
    objectives:
      - code: "2.1.1"
        en: "Configure authentication mechanisms"
        fr: "Configurer des mécanismes d'authentification"
      - code: "2.1.2"
        en: "Configure authorization controls"
        fr: "Configurer des contrôles d'autorisation"
      - code: "2.1.3"
        en: "Configure network security"
        fr: "Configurer la sécurité réseau"
      - code: "2.1.4"
        en: "Configure dynamic data masking"
        fr: "Configurer le masquage dynamique des données"
  - group:
      en: "Implement availability and recovery solutions"
      fr: "Implémenter des solutions de disponibilité et de récupération"
    objectives:
      - code: "2.2.1"
        en: "Configure backup and restore solutions"
        fr: "Configurer des solutions de sauvegarde et de restauration"
      - code: "2.2.2"
        en: "Implement multi-region read and write configurations"
        fr: "Implémenter des configurations de lecture et d'écriture multirégion"
      - code: "2.2.3"
        en: "Configure partition failover solutions"
        fr: "Configurer des solutions de basculement pour les partitions"
  - group:
      en: "Optimize and remediate database performance"
      fr: "Optimiser et corriger les performances de la base de données"
    objectives:
      - code: "2.3.1"
        en: "Optimize query performance"
        fr: "Optimiser les performances des requêtes"
      - code: "2.3.2"
        en: "Analyze query performance metrics"
        fr: "Analyser les métriques de performances des requêtes"
      - code: "2.3.3"
        en: "Analyze index performance metrics"
        fr: "Analyser les métriques de performances d'index"
      - code: "2.3.4"
        en: "Monitor end-to-end latency against service objectives"
        fr: "Surveiller la latence de bout en bout par rapport aux objectifs de service"
      - code: "2.3.5"
        en: "Configure Azure Monitor alerts"
        fr: "Configurer des alertes Azure Monitor"
      - code: "2.3.6"
        en: "Analyze diagnostic logs in Log Analytics"
        fr: "Analyser les journaux de diagnostic dans Log Analytics"
  - group:
      en: "Implement Fleet management and monitoring across multiple accounts and subscriptions"
      fr: "Implémenter la gestion et la surveillance de la flotte sur plusieurs comptes et abonnements"
    objectives:
      - code: "2.4.1"
        en: "Configure Fleet level throughput management"
        fr: "Configurer la gestion du débit au niveau de la flotte"
      - code: "2.4.2"
        en: "Configure Fleet monitoring with fleet analytics"
        fr: "Configurer la surveillance de la flotte avec l'analytique de la flotte"
ai-analytics:
  - group:
      en: "Design and implement AI retrieval"
      fr: "Concevoir et mettre en œuvre la recherche par IA"
    objectives:
      - code: "3.1.1"
        en: "Design and implement full-text search"
        fr: "Concevoir et implémenter une recherche en texte intégral"
      - code: "3.1.2"
        en: "Design for vector data, including vector data type, vector indexes, and size"
        fr: "Concevoir pour les données vectorielles, y compris le type de données vectorielles, les index vectoriels et la taille"
      - code: "3.1.3"
        en: "Design and implement vector partitioning and sharded DiskANN implementations"
        fr: "Concevoir et implémenter le partitionnement vectoriel et des implémentations DiskANN partitionnées (sharded)"
      - code: "3.1.4"
        en: "Implement vector search"
        fr: "Implémenter la recherche vectorielle"
      - code: "3.1.5"
        en: "Design and implement hybrid search"
        fr: "Concevoir et implémenter la recherche hybride"
      - code: "3.1.6"
        en: "Optimize full-text and vector performance"
        fr: "Optimiser les performances de texte intégral et de vecteur"
      - code: "3.1.7"
        en: "Design and implement Retrieval-Augmented Generation (RAG)"
        fr: "Concevoir et mettre en œuvre la génération augmentée par récupération (RAG)"
  - group:
      en: "Design and implement agent memory stores"
      fr: "Concevoir et mettre en œuvre des stockages de mémoire pour agents"
    objectives:
      - code: "3.2.1"
        en: "Design durable memory stores"
        fr: "Concevoir des espaces de stockage mémoire durables"
      - code: "3.2.2"
        en: "Implement conversation state"
        fr: "Implémenter l'état de conversation"
      - code: "3.2.3"
        en: "Implement semantic memory"
        fr: "Implémenter la mémoire sémantique"
  - group:
      en: "Design and implement operational analytics on Azure Cosmos DB"
      fr: "Concevoir et implémenter des analyses opérationnelles sur Azure Cosmos DB"
    objectives:
      - code: "3.3.1"
        en: "Choose between Azure Cosmos DB and Cosmos DB in Microsoft Fabric"
        fr: "Choisir entre Azure Cosmos DB et Cosmos DB dans Microsoft Fabric"
      - code: "3.3.2"
        en: "Configure and monitor data mirroring into Microsoft Fabric"
        fr: "Configurer et surveiller la mise en miroir de données dans Microsoft Fabric"
      - code: "3.3.3"
        en: "Query Azure Cosmos DB mirrored JSON data in Microsoft Fabric with T-SQL and Spark"
        fr: "Interroger les données JSON en miroir d'Azure Cosmos DB dans Microsoft Fabric avec T-SQL et Spark"
      - code: "3.3.4"
        en: "Read and write data into Azure Cosmos DB from Microsoft Fabric with Cosmos DB Spark connector"
        fr: "Lire et écrire des données dans Azure Cosmos DB à partir de Microsoft Fabric avec le connecteur Spark Cosmos DB"
