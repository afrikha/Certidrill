id: dp420-sr1-catalog-ranking
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys stores its product catalog in a container named **products** in an Azure Cosmos DB for NoSQL account. Each item has `id`, `name`, and `description` properties, where `description` contains English text, and an `embedding` property that contains a 1,536-dimension vector generated from the description.

    The products container already has:

    - A vector embedding policy for `/embedding` (`float32`, `cosine`, 1,536 dimensions).
    - A full-text policy for `/description` (`en-US`).
    - A DiskANN vector index on `/embedding` and a full-text index on `/description`.

    A search API receives the text typed by a user, passes its embedding in the `@queryVector` parameter, and passes the two keywords extracted from the text in the `@term1` and `@term2` parameters.

    You need to write the query of the search API. The query must return the `id` and `name` of the 10 products ranked by Reciprocal Rank Fusion (RRF) of the vector similarity to `@queryVector` and the BM25 relevance of the keywords in `description`.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys stocke son catalogue de produits dans un conteneur nommé **products** d'un compte Azure Cosmos DB for NoSQL. Chaque élément possède les propriétés `id`, `name` et `description`, où `description` contient du texte en anglais, ainsi qu'une propriété `embedding` qui contient un vecteur de 1 536 dimensions généré à partir de la description.

    Le conteneur products dispose déjà des éléments suivants :

    - Une stratégie d'incorporation vectorielle pour `/embedding` (`float32`, `cosine`, 1 536 dimensions).
    - Une stratégie de texte intégral pour `/description` (`en-US`).
    - Un index vectoriel DiskANN sur `/embedding` et un index de texte intégral sur `/description`.

    Une API de recherche reçoit le texte saisi par un utilisateur, transmet son incorporation dans le paramètre `@queryVector` et transmet les deux mots clés extraits du texte dans les paramètres `@term1` et `@term2`.

    Vous devez écrire la requête de l'API de recherche. La requête doit renvoyer l'`id` et le `name` des 10 produits classés par fusion de rangs réciproques (RRF) de la similarité vectorielle avec `@queryVector` et de la pertinence BM25 des mots clés dans `description`.
