id: dp420-sr1-tenant-activity
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. is building a multitenant SaaS application that stores user activity events in a new container named **activity** in an Azure Cosmos DB for NoSQL account. Every item contains `tenantId`, `userId`, and `sessionId` properties. The application uses the Azure Cosmos DB .NET SDK v3.

    Several large tenants are expected to store more than 50 GB of events each and to need more than 10,000 RU/s at peak. Most queries filter on `tenantId` and `userId`. Tenant-level reports filter on `tenantId` only, and the application does not know in advance the list of users of a tenant.

    You need to design the partitioning of the activity container. The data of a tenant must not be limited by the maximum size of a logical partition, and queries that filter on `tenantId` only must be routed to the physical partitions that hold that tenant's data instead of all the physical partitions.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. développe une application SaaS multilocataire qui stocke les événements d'activité des utilisateurs dans un nouveau conteneur nommé **activity** d'un compte Azure Cosmos DB for NoSQL. Chaque élément contient les propriétés `tenantId`, `userId` et `sessionId`. L'application utilise le SDK .NET v3 d'Azure Cosmos DB.

    Plusieurs locataires volumineux devraient stocker chacun plus de 50 Go d'événements et avoir besoin de plus de 10 000 RU/s en période de pointe. La plupart des requêtes filtrent sur `tenantId` et `userId`. Les rapports par locataire filtrent uniquement sur `tenantId`, et l'application ne connaît pas à l'avance la liste des utilisateurs d'un locataire.

    Vous devez concevoir le partitionnement du conteneur activity. Les données d'un locataire ne doivent pas être limitées par la taille maximale d'une partition logique, et les requêtes qui filtrent uniquement sur `tenantId` doivent être acheminées vers les partitions physiques qui contiennent les données de ce locataire plutôt que vers toutes les partitions physiques.
