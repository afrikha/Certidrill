id: dp420-sr1-keyless-orders
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam, Inc. has an Azure Cosmos DB for NoSQL account named **cosmos-fab** in a resource group named **rg-sales**. The account contains a database named **sales** that contains three containers named **orders**, **customers**, and **payments**. Key-based authentication is disabled on the account (`disableLocalAuth` is set to `true`).

    A Python API named **order-api** runs in Azure Container Apps. It authenticates to cosmos-fab by using a user-assigned managed identity and `DefaultAzureCredential`. order-api must create, read, query, replace, and delete items in the orders container. It must not access the other containers.

    You need to grant order-api the required access. The solution must use built-in role definitions only and must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam, Inc. dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-fab** dans un groupe de ressources nommé **rg-sales**. Le compte contient une base de données nommée **sales** qui contient trois conteneurs nommés **orders**, **customers** et **payments**. L'authentification par clé est désactivée sur le compte (`disableLocalAuth` est défini sur `true`).

    Une API Python nommée **order-api** s'exécute dans Azure Container Apps. Elle s'authentifie auprès de cosmos-fab à l'aide d'une identité managée affectée par l'utilisateur et de `DefaultAzureCredential`. order-api doit créer, lire, interroger, remplacer et supprimer des éléments dans le conteneur orders. Elle ne doit pas accéder aux autres conteneurs.

    Vous devez accorder à order-api l'accès requis. La solution doit utiliser uniquement des définitions de rôle intégrées et respecter le principe du moindre privilège.
