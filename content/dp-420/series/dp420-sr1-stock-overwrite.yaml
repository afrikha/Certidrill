id: dp420-sr1-stock-overwrite
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has an Azure Cosmos DB for NoSQL account. A container named **stock** uses `/warehouseId` as the partition key and stores one item per product and warehouse.

    Several instances of a C# worker that uses the Azure Cosmos DB .NET SDK v3 process orders in parallel. Each instance reads a stock item, recalculates its `available` quantity in application code by applying business rules, and then writes the whole item back.

    You need to ensure that a write based on an item that another instance modified after it was read is rejected instead of overwriting that change. When a write is rejected, the worker reads the item again and retries.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un compte Azure Cosmos DB for NoSQL. Un conteneur nommé **stock** utilise `/warehouseId` comme clé de partition et stocke un élément par produit et par entrepôt.

    Plusieurs instances d'un worker C# qui utilise le SDK .NET v3 d'Azure Cosmos DB traitent des commandes en parallèle. Chaque instance lit un élément de stock, recalcule sa quantité `available` dans le code de l'application en appliquant des règles métier, puis réécrit l'élément entier.

    Vous devez faire en sorte qu'une écriture fondée sur un élément qu'une autre instance a modifié après sa lecture soit rejetée au lieu d'écraser cette modification. Lorsqu'une écriture est rejetée, le worker relit l'élément et réessaie.
