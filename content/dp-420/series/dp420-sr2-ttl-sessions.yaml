id: dp420-sr2-ttl-sessions
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has a web application that stores user sessions in an Azure Cosmos DB for NoSQL account. The `sessions` container uses provisioned throughput and holds two item types:

    - **session** items (`"type": "session"`), about 2 million writes per day;
    - **auditPin** items (`"type": "auditPin"`), a few hundred per month, kept for compliance.

    Time to live (TTL) is currently not configured on the container, and the application never sets a `ttl` property.

    You need to ensure that each session item is deleted automatically 24 hours (86,400 seconds) after its last modification and that auditPin items are never deleted automatically. The application must not issue delete operations to remove expired sessions.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'une application web qui stocke les sessions utilisateur dans un compte Azure Cosmos DB for NoSQL. Le conteneur `sessions` utilise un débit provisionné et contient deux types d'éléments :

    - des éléments **session** (`"type": "session"`), environ 2 millions d'écritures par jour ;
    - des éléments **auditPin** (`"type": "auditPin"`), quelques centaines par mois, conservés pour la conformité.

    La durée de vie (TTL) n'est actuellement pas configurée sur le conteneur, et l'application ne définit jamais de propriété `ttl`.

    Vous devez faire en sorte que chaque élément session soit supprimé automatiquement 24 heures (86 400 secondes) après sa dernière modification et que les éléments auditPin ne soient jamais supprimés automatiquement. L'application ne doit pas émettre d'opérations de suppression pour retirer les sessions expirées.
