id: dp420-sr2-cfp-leases
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has an Azure Cosmos DB for NoSQL account that contains a database named `sales`. The database contains a container named `orders` and an existing lease container named `leases`.

    You are developing two .NET services that use the change feed processor of the Azure Cosmos DB .NET SDK v3 in latest version mode:

    - **InvoiceWorker** creates an invoice for each new or updated order;
    - **SearchIndexer** pushes each new or updated order to a search index.

    Each service runs on three compute instances. You need to ensure that each service receives every change made to `orders` and that, within each service, the changes are distributed across its three instances.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un compte Azure Cosmos DB for NoSQL qui contient une base de données nommée `sales`. La base de données contient un conteneur nommé `orders` et un conteneur de bail existant nommé `leases`.

    Vous développez deux services .NET qui utilisent le processeur de flux de modification du SDK .NET v3 d'Azure Cosmos DB en mode dernière version :

    - **InvoiceWorker** crée une facture pour chaque commande nouvelle ou modifiée ;
    - **SearchIndexer** envoie chaque commande nouvelle ou modifiée vers un index de recherche.

    Chaque service s'exécute sur trois instances de calcul. Vous devez faire en sorte que chaque service reçoive toutes les modifications apportées à `orders` et que, au sein de chaque service, les modifications soient réparties entre ses trois instances.
