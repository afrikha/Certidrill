id: dp420-sr1-manual-chunks
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation is building a Retrieval-Augmented Generation (RAG) assistant for its equipment manuals. The manuals will be split into about 3 million text chunks stored in Azure Cosmos DB for NoSQL. Each chunk has an `embedding` property that contains a 3,072-dimension `float32` vector. The **Vector Search for NoSQL API** feature is enabled on the account.

    The account contains a database named **kb** that has no database-level throughput and a database named **shared** that has 10,000 RU/s of shared throughput.

    You need to create a container named **chunks** for the assistant. The container must support cosine similarity queries that use `VectorDistance` over all the chunks, with the lowest latency and RU charge at this volume. Approximate nearest neighbor results are acceptable.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation développe un assistant de génération augmentée par récupération (RAG) pour ses manuels d'équipement. Les manuels seront découpés en environ 3 millions de segments de texte stockés dans Azure Cosmos DB for NoSQL. Chaque segment possède une propriété `embedding` qui contient un vecteur `float32` de 3 072 dimensions. La fonctionnalité **Vector Search for NoSQL API** est activée sur le compte.

    Le compte contient une base de données nommée **kb** qui n'a pas de débit au niveau de la base de données et une base de données nommée **shared** qui dispose d'un débit partagé de 10 000 RU/s.

    Vous devez créer un conteneur nommé **chunks** pour l'assistant. Le conteneur doit prendre en charge les requêtes de similarité cosinus qui utilisent `VectorDistance` sur l'ensemble des segments, avec la latence et la consommation de RU les plus faibles pour ce volume. Des résultats approximatifs du plus proche voisin sont acceptables.
