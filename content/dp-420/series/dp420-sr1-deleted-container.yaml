id: dp420-sr1-deleted-container
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has an Azure Cosmos DB for NoSQL account named **cosmos-wg** in a resource group named **rg-wg**. The account is deployed in a single region and uses periodic backup mode with the default settings.

    Last month, a developer accidentally deleted a container. You receive the following requirements:

    - The development team must be able to restore a deleted or corrupted container by itself, from the Azure portal or the Azure CLI, without opening a support request.
    - A restore must be possible to any point in time within the last seven days.
    - Backup storage costs must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-wg** dans un groupe de ressources nommé **rg-wg**. Le compte est déployé dans une seule région et utilise le mode de sauvegarde périodique avec les paramètres par défaut.

    Le mois dernier, un développeur a supprimé un conteneur par erreur. Vous recevez les exigences suivantes :

    - L'équipe de développement doit pouvoir restaurer elle-même un conteneur supprimé ou endommagé, depuis le portail Azure ou Azure CLI, sans ouvrir de demande de support.
    - Une restauration doit être possible à n'importe quel instant des sept derniers jours.
    - Les coûts de stockage de sauvegarde doivent être réduits au minimum.
