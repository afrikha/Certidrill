id: dp420-sr2-ddm-employees
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation has an Azure Cosmos DB for NoSQL account named **cosmos-adatum**. Dynamic data masking is enabled on the account, and all applications authenticate by using Microsoft Entra managed identities. The account contains a database named `hr` that has a container named `employees`. Each item has the following shape.

    ```json
    {
      "id": "e-1042",
      "department": "Finance",
      "fullName": "Ana Bowman",
      "email": "ana.bowman@adatum.com",
      "salary": 84000
    }
    ```

    You are deploying a support app that has a managed identity named **support-id**. The app runs queries against `employees`. You need to ensure that:

    - for support-id, `email` keeps only the first letter of the user name and the domain ending (for example, `aXXXX@XXXXXXXXX.com`), `salary` is masked, and all the other properties are returned unmasked;
    - support-id cannot create, update or delete items.

    The solution must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-adatum**. Le masquage dynamique des données est activé sur le compte, et toutes les applications s'authentifient à l'aide d'identités managées Microsoft Entra. Le compte contient une base de données nommée `hr` qui comporte un conteneur nommé `employees`. Chaque élément a la forme suivante.

    ```json
    {
      "id": "e-1042",
      "department": "Finance",
      "fullName": "Ana Bowman",
      "email": "ana.bowman@adatum.com",
      "salary": 84000
    }
    ```

    Vous déployez une application de support qui dispose d'une identité managée nommée **support-id**. L'application exécute des requêtes sur `employees`. Vous devez faire en sorte que :

    - pour support-id, `email` ne conserve que la première lettre du nom d'utilisateur et la fin du domaine (par exemple, `aXXXX@XXXXXXXXX.com`), `salary` soit masqué, et toutes les autres propriétés soient retournées sans masquage ;
    - support-id ne puisse pas créer, mettre à jour ni supprimer d'éléments.

    La solution doit respecter le principe du moindre privilège.
