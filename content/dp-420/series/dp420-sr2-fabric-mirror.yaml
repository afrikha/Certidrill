id: dp420-sr2-fabric-mirror
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. has an Azure Cosmos DB for NoSQL account named **cosmos-litware** that has a single write region (East US) and one read region (West US). The account uses **periodic** backup mode, has key-based authentication enabled, and allows public network access. It contains a database named `telemetry` with three containers. Analytical store is not enabled on any container.

    The analytics team wants to query the `telemetry` data from a Microsoft Fabric workspace in near real time. You need to configure mirroring of `telemetry` into Fabric OneLake. The solution must not consume request units (RUs) of the containers for replication and must minimize additional Azure costs.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-litware** qui a une seule région d'écriture (East US) et une région de lecture (West US). Le compte utilise le mode de sauvegarde **périodique**, a l'authentification par clé activée et autorise l'accès au réseau public. Il contient une base de données nommée `telemetry` comportant trois conteneurs. Le magasin analytique n'est activé sur aucun conteneur.

    L'équipe d'analyse souhaite interroger les données de `telemetry` depuis un espace de travail Microsoft Fabric en quasi-temps réel. Vous devez configurer la mise en miroir de `telemetry` dans OneLake de Fabric. La solution ne doit pas consommer d'unités de requête (RU) des conteneurs pour la réplication et doit réduire au minimum les coûts Azure supplémentaires.
