id: dp420-sr2-alert-throttling
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure Cosmos DB for NoSQL account named **cosmos-tail** that contains a database named `shop`. The database contains a container named `orders` that uses 10,000 RU/s of manual throughput. No diagnostic settings are configured on the account.

    During sales events, some requests to `orders` are rate limited (HTTP status code 429). You need to ensure that the operations team receives an email when more than 100 requests to `orders` are rate limited within a 5-minute window.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-tail** qui contient une base de données nommée `shop`. La base de données contient un conteneur nommé `orders` qui utilise 10 000 RU/s de débit manuel. Aucun paramètre de diagnostic n'est configuré sur le compte.

    Pendant les périodes de soldes, certaines requêtes adressées à `orders` font l'objet d'une limitation du débit (code d'état HTTP 429). Vous devez faire en sorte que l'équipe des opérations reçoive un e-mail lorsque plus de 100 requêtes adressées à `orders` sont limitées en débit sur une fenêtre de 5 minutes.
