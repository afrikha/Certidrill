chapter: 14-change-feed
questions:
  # ------------------------------------------------------------------ 1
  - id: dp420-qz-14-01
    objective: "1.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso creates a container named **orders** in an existing Azure Cosmos DB for NoSQL account that uses periodic backup. A developer wants to read the inserts and updates of orders by using the change feed pull model in latest version mode.

        What must be done before the developer can read the change feed of orders?
      fr: |
        Contoso crée un conteneur nommé **orders** dans un compte Azure Cosmos DB for NoSQL existant qui utilise la sauvegarde périodique. Un développeur veut lire les insertions et les mises à jour d'orders avec le modèle de tirage (pull) du flux de modification, en mode Dernière version.

        Que faut-il faire avant que le développeur puisse lire le flux de modification d'orders ?
    body:
      options:
        - { id: a, text: { en: "Enable the change feed in the settings of the orders container", fr: "Activer le flux de modification dans les paramètres du conteneur orders" } }
        - { id: b, text: { en: "Switch the backup mode of the account to continuous backup", fr: "Passer le mode de sauvegarde du compte en sauvegarde continue" } }
        - { id: c, text: { en: "Create a lease container that is partitioned by /id", fr: "Créer un conteneur de bail partitionné par /id" } }
        - { id: d, text: { en: "Nothing: the change feed of orders can already be read", fr: "Rien : le flux de modification d'orders peut déjà être lu" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The change feed is enabled by default for all Azure Cosmos DB accounts and is available in every container, whether or not it's used. Latest version mode needs no configuration, so the pull model can read the inserts and updates of orders right away.
        fr: |
          Le flux de modification est activé par défaut pour tous les comptes Azure Cosmos DB et disponible dans chaque conteneur, qu'il soit utilisé ou non. Le mode Dernière version ne demande aucune configuration : le modèle de tirage peut lire immédiatement les insertions et les mises à jour d'orders.
      options:
        a: { en: "There is no change feed setting to enable on a container: the feed always exists.", fr: "Il n'existe aucun paramètre de flux de modification à activer sur un conteneur : le flux existe toujours." }
        b: { en: "Continuous backup is required only for all versions and deletes mode, not for latest version mode.", fr: "La sauvegarde continue n'est exigée que pour le mode Toutes les versions et suppressions, pas pour le mode Dernière version." }
        c: { en: "A lease container stores the state of the change feed processor; the pull model keeps its position in a continuation token instead.", fr: "Un conteneur de bail stocke l'état du processeur de flux de modification ; le modèle de tirage garde sa position dans un jeton de continuation." }
    references:
      - title: Work with the Change Feed - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed

  # ------------------------------------------------------------------ 2
  - id: dp420-qz-14-02
    objective: "1.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware's data team writes all its services in Python. A new service must react to every insert and update in an Azure Cosmos DB for NoSQL container named **shipments**.

        The team doesn't want to host, scale or monitor any long-running worker process, and it doesn't want to write checkpointing code.

        What should the team use?
      fr: |
        L'équipe données de Litware écrit tous ses services en Python. Un nouveau service doit réagir à chaque insertion et mise à jour dans un conteneur Azure Cosmos DB for NoSQL nommé **shipments**.

        L'équipe ne veut ni héberger, ni mettre à l'échelle, ni superviser de processus worker de longue durée, et elle ne veut pas écrire de code de point de contrôle.

        Que doit utiliser l'équipe ?
    body:
      options:
        - { id: a, text: { en: "The change feed processor of the azure-cosmos Python SDK, hosted on a virtual machine", fr: "Le processeur de flux de modification du SDK Python azure-cosmos, hébergé sur une machine virtuelle" } }
        - { id: b, text: { en: "The pull model with query_items_change_feed and one feed range for each worker", fr: "Le modèle de tirage avec query_items_change_feed et une plage de flux par worker" } }
        - { id: c, text: { en: "An Azure Functions app that uses the Azure Cosmos DB trigger on shipments", fr: "Une application Azure Functions qui utilise le déclencheur Azure Cosmos DB sur shipments" } }
        - { id: d, text: { en: "An online container copy job from shipments to a new container", fr: "Une tâche de copie de conteneur en ligne de shipments vers un nouveau conteneur" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Azure Functions trigger for Azure Cosmos DB supports Python and every other Functions language in latest version mode. It uses the change feed processor's scaling and checkpointing internally, with a lease container, so the team writes only the function's logic and hosts no worker.
        fr: |
          Le déclencheur Azure Functions pour Azure Cosmos DB prend en charge Python et tous les autres langages de Functions en mode Dernière version. Il utilise en interne la mise à l'échelle et les points de contrôle du processeur de flux de modification, avec un conteneur de bail : l'équipe n'écrit que la logique de la fonction et n'héberge aucun worker.
      options:
        a: { en: "The change feed processor exists only in the .NET and Java SDKs, and hosting it on a VM is the worker the team wants to avoid.", fr: "Le processeur de flux de modification n'existe que dans les SDK .NET et Java, et l'héberger sur une VM est précisément le worker que l'équipe veut éviter." }
        b: { en: "The pull model is available in Python, but the team would host the workers and persist the continuation tokens itself.", fr: "Le modèle de tirage existe en Python, mais l'équipe devrait héberger les workers et persister elle-même les jetons de continuation." }
        d: { en: "A container copy job copies data to another container; it doesn't run application logic for each change.", fr: "Une tâche de copie de conteneur copie des données vers un autre conteneur ; elle n'exécute pas de logique applicative pour chaque modification." }
    references:
      - title: Use Change Feed With Azure Functions - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-functions

  # ------------------------------------------------------------------ 3
  - id: dp420-qz-14-03
    objective: "1.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware runs a .NET change feed processor on three instances. The delegate sends each changed item of the **orders** container to a partner API.

        One order contains a malformed value, and the partner API rejects it with HTTP 400 every time, which makes the delegate throw an exception. Since then, the processor keeps delivering the same batch for one lease, and no later change of that lease is processed. The other leases progress normally.

        You need to resume the processing of later changes and keep a record of the failed changes so that they can be replayed after a fix.

        What should you do?
      fr: |
        Proseware exécute un processeur de flux de modification .NET sur trois instances. Le délégué envoie chaque élément modifié du conteneur **orders** à l'API d'un partenaire.

        Une commande contient une valeur mal formée, et l'API du partenaire la rejette à chaque fois avec HTTP 400, ce qui fait lever une exception au délégué. Depuis, le processeur remet sans cesse le même lot pour un bail, et aucune modification ultérieure de ce bail n'est traitée. Les autres baux progressent normalement.

        Vous devez reprendre le traitement des modifications suivantes et garder une trace des modifications en échec pour pouvoir les rejouer après une correction.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add WithStartTime(DateTime.UtcNow) to the processor builder, and restart the three instances", fr: "Ajouter WithStartTime(DateTime.UtcNow) au générateur du processeur, puis redémarrer les trois instances" } }
        - { id: b, text: { en: "In the delegate, catch the failure, write the failed change to an errored-message container, and complete", fr: "Dans le délégué, intercepter l'échec, écrire la modification en échec dans un conteneur de messages en erreur, puis se terminer" } }
        - { id: c, text: { en: "Start a fourth instance so that another instance takes over the blocked lease and processes it", fr: "Démarrer une quatrième instance pour qu'une autre instance reprenne le bail bloqué et le traite" } }
        - { id: d, text: { en: "Lower the lease expiration interval so that the blocked lease is released and acquired again sooner", fr: "Réduire l'intervalle d'expiration des baux pour que le bail bloqué soit libéré et réacquis plus tôt" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The processor checkpoints a lease only when the delegate completes successfully, so an unhandled exception makes it deliver the same batch again and again (at least once delivery). Catching the failure and persisting the change in an errored-message store, such as another container, lets the delegate complete: the lease moves forward and the failed changes remain available for a later replay.
        fr: |
          Le processeur n'enregistre le point de contrôle d'un bail que lorsque le délégué se termine avec succès : une exception non gérée lui fait remettre le même lot encore et encore (remise au moins une fois). Intercepter l'échec et persister la modification dans un magasin de messages en erreur, par exemple un autre conteneur, permet au délégué de se terminer : le bail avance et les modifications en échec restent disponibles pour être rejouées.
      options:
        a: { en: "Start options apply only when no lease exists; with existing leases the processor resumes from the stored checkpoints, on the same batch.", fr: "Les options de démarrage ne s'appliquent que s'il n'existe aucun bail ; avec des baux existants, le processeur reprend aux points de contrôle stockés, sur le même lot." }
        c: { en: "Any instance that takes the lease restarts from the same checkpoint and receives the same failing batch.", fr: "Toute instance qui prend le bail repart du même point de contrôle et reçoit le même lot en échec." }
        d: { en: "Releasing the lease faster doesn't move its checkpoint: the next owner gets the same batch.", fr: "Libérer le bail plus vite ne déplace pas son point de contrôle : le propriétaire suivant reçoit le même lot." }
    references:
      - title: Change Feed Processor - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor

  # ------------------------------------------------------------------ 4
  - id: dp420-qz-14-04
    objective: "1.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has two .NET services that use the change feed processor in the same Azure Cosmos DB for NoSQL database:

        - **OrderSync** monitors the **orders** container.
        - **PaymentSync** monitors the **payments** container.

        Both services were built from the same template. They use the processorName `sync`, a unique instance name for each instance and, to limit costs, the same lease container named **leases**, partitioned by `/id`.

        Which statement describes how this configuration behaves?
      fr: |
        Fabrikam dispose de deux services .NET qui utilisent le processeur de flux de modification dans la même base de données Azure Cosmos DB for NoSQL :

        - **OrderSync** supervise le conteneur **orders**.
        - **PaymentSync** supervise le conteneur **payments**.

        Les deux services ont été créés à partir du même modèle. Ils utilisent le processorName `sync`, un nom d'instance unique pour chaque instance et, pour limiter les coûts, le même conteneur de bail nommé **leases**, partitionné par `/id`.

        Quelle affirmation décrit le comportement de cette configuration ?
    body:
      options:
        - { id: a, text: { en: "Each service receives every change of its own container, and each keeps a separate state in leases", fr: "Chaque service reçoit toutes les modifications de son propre conteneur, et chacun garde un état distinct dans leases" } }
        - { id: b, text: { en: "The two services form one deployment unit and split the changes of both containers between them", fr: "Les deux services forment une seule unité de déploiement et se répartissent les modifications des deux conteneurs" } }
        - { id: c, text: { en: "The second service fails to start, because a lease container can serve only one monitored container", fr: "Le second service ne démarre pas, car un conteneur de bail ne peut servir qu'un seul conteneur supervisé" } }
        - { id: d, text: { en: "Each service receives every change of both containers, because the two services share one lease container", fr: "Chaque service reçoit toutes les modifications des deux conteneurs, car les deux services partagent un conteneur de bail" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A lease container can be shared by several deployment units as long as each unit monitors a different container or uses a different processorName. Here the monitored containers differ, so OrderSync and PaymentSync are two deployment units with independent states, even with the same processorName. The lease container's throughput must then be sized for both.
        fr: |
          Un conteneur de bail peut être partagé par plusieurs unités de déploiement tant que chacune supervise un conteneur différent ou utilise un processorName différent. Ici, les conteneurs supervisés diffèrent : OrderSync et PaymentSync sont deux unités de déploiement aux états indépendants, même avec le même processorName. Le débit du conteneur de bail doit alors être dimensionné pour les deux.
      options:
        b: { en: "A deployment unit is defined by the same processorName and lease configuration on the same monitored container; these two monitor different containers.", fr: "Une unité de déploiement se définit par le même processorName et la même configuration de bail sur le même conteneur supervisé ; ces deux services supervisent des conteneurs différents." }
        c: { en: "Sharing a lease container across deployment units is supported; only its throughput must cover all of them.", fr: "Le partage d'un conteneur de bail entre unités de déploiement est pris en charge ; seul son débit doit suffire pour toutes." }
        d: { en: "A processor only reads the change feed of the container it was built from; the lease container stores state, not changes.", fr: "Un processeur ne lit que le flux de modification du conteneur à partir duquel il a été créé ; le conteneur de bail stocke un état, pas des modifications." }
    references:
      - title: Change Feed Processor - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor

  # ------------------------------------------------------------------ 5
  - id: dp420-qz-14-05
    objective: "1.4.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum's Azure Cosmos DB for NoSQL account uses continuous backup with a 7-day retention, and the all versions and deletes change feed mode is enabled.

        A new .NET pull model consumer must load into a cache the current state of every item of the **catalog** container that was created or modified during the last 30 days. Deleted items don't need to be handled. The consumer must consume as few RUs as possible.

        How should you create the change feed iterator?
      fr: |
        Le compte Azure Cosmos DB for NoSQL d'Adatum utilise la sauvegarde continue avec une rétention de 7 jours, et le mode Toutes les versions et suppressions du flux de modification est activé.

        Un nouveau consommateur .NET en modèle de tirage doit charger dans un cache l'état actuel de chaque élément du conteneur **catalog** créé ou modifié au cours des 30 derniers jours. Les éléments supprimés n'ont pas à être traités. Le consommateur doit consommer le moins de RU possible.

        Comment devez-vous créer l'itérateur du flux de modification ?
    body:
      options:
        - { id: a, text: "ChangeFeedStartFrom.Time(DateTime.UtcNow.AddDays(-30)), ChangeFeedMode.LatestVersion" }
        - { id: b, text: "ChangeFeedStartFrom.Time(DateTime.UtcNow.AddDays(-30)), ChangeFeedMode.AllVersionsAndDeletes" }
        - { id: c, text: "ChangeFeedStartFrom.Now(), ChangeFeedMode.AllVersionsAndDeletes" }
        - { id: d, text: "ChangeFeedStartFrom.Beginning(), ChangeFeedMode.LatestVersion, then skip items whose _ts is older than 30 days" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Latest version mode keeps the latest version of each item for the life of the container and can start from a point in time. Starting 30 days ago returns each item created or modified since then once, in its current state, which is exactly what the cache needs; deletes aren't required, so all versions and deletes mode brings nothing.
        fr: |
          Le mode Dernière version conserve la dernière version de chaque élément pendant toute la vie du conteneur et peut démarrer à un instant donné. Démarrer il y a 30 jours renvoie une fois chaque élément créé ou modifié depuis, dans son état actuel, ce dont le cache a besoin ; les suppressions ne sont pas exigées, le mode Toutes les versions et suppressions n'apporte donc rien.
      options:
        b: { en: "All versions and deletes mode can't start from a point in time, and it only keeps changes within the 7-day retention window.", fr: "Le mode Toutes les versions et suppressions ne peut pas démarrer à un instant donné, et il ne conserve que les modifications de la fenêtre de rétention de 7 jours." }
        c: { en: "Starting from now returns only future changes, so the items modified during the last 30 days would be missing.", fr: "Démarrer maintenant ne renvoie que les modifications futures : les éléments modifiés au cours des 30 derniers jours manqueraient." }
        d: { en: "This returns the right items, but it reads the whole history of the container, which consumes more RUs than starting 30 days ago.", fr: "Cela renvoie les bons éléments, mais lit tout l'historique du conteneur, ce qui consomme plus de RU que de démarrer il y a 30 jours." }
    references:
      - title: Change Feed Modes - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
      - title: ChangeFeedStartFrom Class (Microsoft.Azure.Cosmos) - Azure for .NET Developers
        url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.changefeedstartfrom

  # ------------------------------------------------------------------ 6
  - id: dp420-qz-14-06
    objective: "1.4.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind has an Azure Cosmos DB for NoSQL account in a single region, West Europe. The account meets all the prerequisites for online container copy. The database **retail** contains three containers: **orders** (6,000 RU/s of manual throughput), **carts** and **returns**.

        Each container must move to a new container that uses a different partition key. At 09:00, you create three online container copy jobs: orders to orders-v2, carts to carts-v2 and returns to returns-v2. The application keeps writing to the source containers during the copy.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'un compte Azure Cosmos DB for NoSQL dans une seule région, Europe Ouest. Le compte remplit tous les prérequis de la copie de conteneur en ligne. La base de données **retail** contient trois conteneurs : **orders** (6 000 RU/s de débit manuel), **carts** et **returns**.

        Chaque conteneur doit passer dans un nouveau conteneur qui utilise une autre clé de partition. À 9 h 00, vous créez trois tâches de copie de conteneur en ligne : orders vers orders-v2, carts vers carts-v2 et returns vers returns-v2. L'application continue d'écrire dans les conteneurs source pendant la copie.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The three jobs copy their containers at the same time.", fr: "Les trois tâches copient leurs conteneurs en même temps." } }
        - { id: s2, text: { en: "While the orders job runs, replacing an item in orders consumes more RUs than the same replace did before the job started.", fr: "Pendant l'exécution de la tâche d'orders, remplacer un élément d'orders consomme plus de RU que le même remplacement avant le démarrage de la tâche." } }
        - { id: s3, text: { en: "Provisioning orders-v2 with 12,000 RU/s follows the recommendation for the copy.", fr: "Provisionner orders-v2 avec 12 000 RU/s suit la recommandation pour la copie." } }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Several copy jobs in one account run one after the other, so the three containers are copied in sequence, not in parallel. During an online copy, replace and delete operations on the source cost 50 to 100 percent more RUs, because previous and current versions are kept; creates aren't affected. Microsoft recommends giving the target at least twice the source's throughput, and 12,000 RU/s is twice 6,000 RU/s.
        fr: |
          Plusieurs tâches de copie dans un même compte s'exécutent l'une après l'autre : les trois conteneurs sont copiés successivement, pas en parallèle. Pendant une copie en ligne, les remplacements et les suppressions sur la source coûtent 50 à 100 % de RU en plus, car les versions précédente et actuelle sont conservées ; les créations ne sont pas concernées. Microsoft recommande de donner à la cible au moins deux fois le débit de la source, et 12 000 RU/s font deux fois 6 000 RU/s.
      options:
        s1: { en: "Jobs of one account run consecutively; only the order in which they run is up to the platform.", fr: "Les tâches d'un même compte s'exécutent consécutivement ; seul leur ordre d'exécution dépend de la plateforme." }
    references:
      - title: Container Copy Jobs - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/container-copy

  # ------------------------------------------------------------------ 7
  - id: dp420-qz-14-07
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove's order service writes each new order as one header item and several line items in one transactional batch. All the items of an order share the same `orderId` partition key value, and they are never updated after they are created.

        A .NET change feed processor reads the **orders** container in latest version mode and inserts each change into a relational reporting database, in which a line row requires its header row to exist.

        Occasionally, the insertion of a line fails because its header row doesn't exist yet. When the failed lines are examined a few seconds later, their header rows are present.

        What is the most likely cause?
      fr: |
        Le service de commandes de Woodgrove écrit chaque nouvelle commande sous la forme d'un élément d'en-tête et de plusieurs éléments de ligne, dans un seul lot transactionnel. Tous les éléments d'une commande partagent la même valeur de clé de partition `orderId`, et ils ne sont jamais modifiés après leur création.

        Un processeur de flux de modification .NET lit le conteneur **orders** en mode Dernière version et insère chaque modification dans une base de données relationnelle de reporting, dans laquelle une ligne exige l'existence de son en-tête.

        De temps en temps, l'insertion d'une ligne échoue parce que son en-tête n'existe pas encore. Quand les lignes en échec sont examinées quelques secondes plus tard, leurs en-têtes sont présents.

        Quelle est la cause la plus probable ?
    body:
      options:
        - { id: a, text: { en: "The order is guaranteed across partition key values but not within one partition key value", fr: "L'ordre est garanti entre valeurs de clé de partition mais pas au sein d'une même valeur de clé de partition" } }
        - { id: b, text: { en: "The header and its lines are read through different leases, which separate instances process in parallel", fr: "L'en-tête et ses lignes sont lus par des baux différents, que des instances distinctes traitent en parallèle" } }
        - { id: c, text: { en: "The items of one transactional batch share a modification time and can arrive in any order within it", fr: "Les éléments d'un même lot transactionnel partagent une heure de modification et peuvent arriver dans n'importe quel ordre" } }
        - { id: d, text: { en: "A retry of the delegate delivered the lines again without the header that was in the original batch", fr: "Une nouvelle tentative du délégué a remis les lignes sans l'en-tête qui figurait dans le lot d'origine" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The change feed delivers changes in modification order for each partition key value. Items written in the scope of one transactional batch, stored procedure or bulk request get the same modification time, so within that scope they can be delivered in any order: a line can reach the delegate before its header. The delegate must not depend on the order of items written together, for example by inserting the headers of a batch of changes first.
        fr: |
          Le flux de modification remet les modifications dans l'ordre de modification pour chaque valeur de clé de partition. Les éléments écrits dans le cadre d'un même lot transactionnel, d'une procédure stockée ou d'une requête en bloc reçoivent la même heure de modification : dans ce cadre, ils peuvent être remis dans n'importe quel ordre, et une ligne peut atteindre le délégué avant son en-tête. Le délégué ne doit pas dépendre de l'ordre d'éléments écrits ensemble, par exemple en insérant d'abord les en-têtes d'un lot de modifications.
      options:
        a: { en: "It's the reverse: order is guaranteed per partition key value and not across values.", fr: "C'est l'inverse : l'ordre est garanti par valeur de clé de partition et non entre valeurs." }
        b: { en: "Items with the same partition key value live in one physical partition, so they are read through the same lease.", fr: "Des éléments de même valeur de clé de partition résident dans une même partition physique : ils sont lus par le même bail." }
        d: { en: "A retry restarts from the last checkpoint and delivers the whole batch again, header included.", fr: "Une nouvelle tentative repart du dernier point de contrôle et remet tout le lot, en-tête compris." }
    references:
      - title: Work with the Change Feed - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed

  # ------------------------------------------------------------------ 8
  - id: dp420-qz-14-08
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso runs a .NET change feed processor on four virtual machines. It was built with the following code:

        ```csharp
        Container leaseContainer = client.GetContainer("retail", "leases");
        ChangeFeedProcessor processor = client.GetContainer("retail", "orders")
            .GetChangeFeedProcessorBuilder<Order>("ordersToSearch", HandleChangesAsync)
            .WithInstanceName(Environment.MachineName)
            .WithLeaseContainer(leaseContainer)
            .Build();
        ```

        You are writing a separate monitoring application that runs on its own virtual machine. It must raise an alert for every lease of this processor that no instance currently owns.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exécute un processeur de flux de modification .NET sur quatre machines virtuelles. Il a été créé avec le code suivant :

        ```csharp
        Container leaseContainer = client.GetContainer("retail", "leases");
        ChangeFeedProcessor processor = client.GetContainer("retail", "orders")
            .GetChangeFeedProcessorBuilder<Order>("ordersToSearch", HandleChangesAsync)
            .WithInstanceName(Environment.MachineName)
            .WithLeaseContainer(leaseContainer)
            .Build();
        ```

        Vous écrivez une application de supervision distincte, qui s'exécute sur sa propre machine virtuelle. Elle doit déclencher une alerte pour chaque bail de ce processeur qu'aucune instance ne détient actuellement.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: csharp
      template: |
        Container leaseContainer = client.GetContainer("retail", "leases");
        ChangeFeedEstimator estimator = client.GetContainer("retail", "orders")
            .GetChangeFeedEstimator(
                processorName: [[name]],
                leaseContainer: [[lease]]);

        using FeedIterator<ChangeFeedProcessorState> states = estimator.[[method]]();
        while (states.HasMoreResults)
        {
            foreach (ChangeFeedProcessorState state in await states.ReadNextAsync())
            {
                if ([[condition]])
                {
                    await AlertAsync($"Lease {state.LeaseToken}: lag {state.EstimatedLag}");
                }
            }
        }
      slots:
        - id: name
          options:
            - { id: nproc, text: "\"ordersToSearch\"" }
            - { id: nest, text: "\"ordersToSearch-estimator\"" }
            - { id: nmachine, text: Environment.MachineName }
            - { id: nleases, text: "\"leases\"" }
        - id: lease
          options:
            - { id: lsame, text: leaseContainer }
            - { id: lorders, text: "client.GetContainer(\"retail\", \"orders\")" }
            - { id: lnew, text: "client.GetContainer(\"retail\", \"estimates\")" }
        - id: method
          options:
            - { id: mstate, text: GetCurrentStateIterator }
            - { id: mfeed, text: GetChangeFeedIterator }
            - { id: mranges, text: GetFeedRangesAsync }
        - id: condition
          options:
            - { id: cnull, text: "state.InstanceName == null" }
            - { id: clag0, text: "state.EstimatedLag == 0" }
            - { id: clagpos, text: "state.EstimatedLag > 0" }
            - { id: ctoken, text: "state.LeaseToken == null" }
    answer:
      values: { name: nproc, lease: lsame, method: mstate, condition: cnull }
    explanation:
      correct:
        en: |
          The estimator reads the processor's state from its leases, so it must use the same processor name and the same lease container as the processor; it can run on a separate instance. GetCurrentStateIterator returns one ChangeFeedProcessorState per lease, with its LeaseToken, its EstimatedLag and the InstanceName of the owning instance, which is null when no instance currently owns the lease.
        fr: |
          L'estimateur lit l'état du processeur dans ses baux : il doit donc utiliser le même nom de processeur et le même conteneur de bail que le processeur ; il peut s'exécuter sur une instance distincte. GetCurrentStateIterator renvoie un ChangeFeedProcessorState par bail, avec son LeaseToken, son EstimatedLag et l'InstanceName de l'instance propriétaire, qui vaut null quand aucune instance ne détient actuellement le bail.
      options:
        nest: { en: "A different name points to leases that don't exist: the estimator must use the processor's own name.", fr: "Un nom différent désigne des baux qui n'existent pas : l'estimateur doit utiliser le nom du processeur lui-même." }
        nmachine: { en: "The machine name is the instance name of a processor instance, not the processor name.", fr: "Le nom de la machine est le nom d'instance d'une instance du processeur, pas le nom du processeur." }
        lorders: { en: "orders is the monitored container; the lease state is stored in leases.", fr: "orders est le conteneur supervisé ; l'état des baux est stocké dans leases." }
        mfeed: { en: "GetChangeFeedIterator is a Container method that reads the change feed itself, not the processor's state.", fr: "GetChangeFeedIterator est une méthode de Container qui lit le flux de modification lui-même, pas l'état du processeur." }
        clag0: { en: "A lag of zero means a lease is up to date; it says nothing about its owner.", fr: "Un retard nul signifie qu'un bail est à jour ; cela ne dit rien de son propriétaire." }
    references:
      - title: Use the Change Feed Estimator - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-use-change-feed-estimator

  # ------------------------------------------------------------------ 9
  - id: dp420-qz-14-09
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin keeps a search index synchronized with an Azure Cosmos DB for NoSQL container named **orders** by using a .NET change feed processor on three instances. Orders are created once and never updated. The delegate is the following:

        ```csharp
        static Task HandleChangesAsync(
            ChangeFeedProcessorContext context,
            IReadOnlyCollection<Order> changes,
            CancellationToken cancellationToken)
        {
            foreach (Order order in changes)
            {
                _ = searchClient.IndexAsync(order);
            }
            return Task.CompletedTask;
        }
        ```

        One instance crashed and restarted a few minutes later. Since then, a few orders created just before the crash are missing from the search index. No exception was logged, and the processor has been running for months.

        What is the cause?
      fr: |
        Tailspin maintient un index de recherche synchronisé avec un conteneur Azure Cosmos DB for NoSQL nommé **orders** à l'aide d'un processeur de flux de modification .NET sur trois instances. Les commandes sont créées une fois et jamais modifiées. Le délégué est le suivant :

        ```csharp
        static Task HandleChangesAsync(
            ChangeFeedProcessorContext context,
            IReadOnlyCollection<Order> changes,
            CancellationToken cancellationToken)
        {
            foreach (Order order in changes)
            {
                _ = searchClient.IndexAsync(order);
            }
            return Task.CompletedTask;
        }
        ```

        Une instance s'est arrêtée brutalement et a redémarré quelques minutes plus tard. Depuis, quelques commandes créées juste avant l'incident manquent dans l'index de recherche. Aucune exception n'a été journalisée, et le processeur fonctionne depuis des mois.

        Quelle est la cause ?
    body:
      options:
        - { id: a, text: { en: "The processor delivers each change at most once, so the batch in progress during the crash was dropped", fr: "Le processeur remet chaque modification au plus une fois : le lot en cours pendant l'incident a été perdu" } }
        - { id: b, text: { en: "The restarted instance used the default start time and began reading from the time of its restart", fr: "L'instance redémarrée a utilisé l'heure de début par défaut et a commencé à lire à partir de son redémarrage" } }
        - { id: c, text: { en: "Changes made while the crashed instance's leases were expiring were skipped by the instance that took them over", fr: "Les modifications faites pendant l'expiration des baux de l'instance arrêtée ont été ignorées par l'instance qui les a repris" } }
        - { id: d, text: { en: "The delegate returned before the indexing calls finished, so the leases were checkpointed past unindexed orders", fr: "Le délégué a rendu la main avant la fin des appels d'indexation : les baux ont été validés au-delà de commandes non indexées" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The processor writes the checkpoint of a lease when the delegate completes. This delegate starts the indexing calls without awaiting them and returns at once, so the checkpoint can move past changes whose indexing hasn't finished; when the instance crashed, those calls were lost and the changes are never delivered again. Awaiting each call, or Task.WhenAll on all of them, keeps the checkpoint behind the work actually done.
        fr: |
          Le processeur écrit le point de contrôle d'un bail quand le délégué se termine. Ce délégué lance les appels d'indexation sans les attendre et rend la main aussitôt : le point de contrôle peut donc dépasser des modifications dont l'indexation n'est pas terminée ; quand l'instance s'est arrêtée, ces appels ont été perdus et les modifications ne sont plus jamais remises. Attendre chaque appel, ou Task.WhenAll sur l'ensemble, garde le point de contrôle derrière le travail réellement effectué.
      options:
        a: { en: "The processor guarantees at least once delivery: a batch whose delegate didn't complete is delivered again.", fr: "Le processeur garantit une remise au moins une fois : un lot dont le délégué ne s'est pas terminé est remis à nouveau." }
        b: { en: "Start options apply only when no lease exists; after months of running, the instance resumes from the stored checkpoints.", fr: "Les options de démarrage ne s'appliquent que s'il n'existe aucun bail ; après des mois de fonctionnement, l'instance reprend aux points de contrôle stockés." }
        c: { en: "A lease taken over by another instance resumes from its last checkpoint; no change is skipped.", fr: "Un bail repris par une autre instance redémarre à son dernier point de contrôle ; aucune modification n'est ignorée." }
    references:
      - title: Change Feed Processor - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor

  # ------------------------------------------------------------------ 10
  - id: dp420-qz-14-10
    objective: "1.4.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove's Azure Cosmos DB for NoSQL account uses continuous backup with a 7-day retention, and the all versions and deletes change feed mode is enabled. Two .NET pull model consumers read the container named **accounts**, which was created two years ago:

        - **Auditor** reads in all versions and deletes mode and saves its continuation token after each page. Its host was down for nine days. It now restarts with the token it saved just before the outage.
        - **Rebuilder** reads in latest version mode from the beginning of the container to rebuild a search index of all the current items.

        The team also plans to move Auditor into an Azure Functions app.

        How should you complete the statements? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le compte Azure Cosmos DB for NoSQL de Woodgrove utilise la sauvegarde continue avec une rétention de 7 jours, et le mode Toutes les versions et suppressions du flux de modification est activé. Deux consommateurs .NET en modèle de tirage lisent le conteneur nommé **accounts**, créé il y a deux ans :

        - **Auditor** lit en mode Toutes les versions et suppressions et enregistre son jeton de continuation après chaque page. Son hôte a été arrêté pendant neuf jours. Il redémarre maintenant avec le jeton enregistré juste avant la panne.
        - **Rebuilder** lit en mode Dernière version depuis le début du conteneur pour reconstruire un index de recherche de tous les éléments actuels.

        L'équipe prévoit aussi de déplacer Auditor dans une application Azure Functions.

        Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          When Auditor resumes with its saved token, the request [[resume]].

          For an item that was deleted last month, Rebuilder receives [[deleted]].

          In Azure Functions, the trigger can read in all versions and deletes mode only with [[functions]].
        fr: |
          Quand Auditor reprend avec son jeton enregistré, la requête [[resume]].

          Pour un élément supprimé le mois dernier, Rebuilder reçoit [[deleted]].

          Dans Azure Functions, le déclencheur ne peut lire en mode Toutes les versions et suppressions qu'avec [[functions]].
      slots:
        - id: resume
          options:
            - { id: rall, text: { en: "returns every change made during the nine days", fr: "renvoie toutes les modifications faites pendant les neuf jours" } }
            - { id: r7, text: { en: "returns only the changes of the last seven days", fr: "renvoie uniquement les modifications des sept derniers jours" } }
            - { id: rerr, text: { en: "fails, because the token is outside the retention window", fr: "échoue, car le jeton est en dehors de la fenêtre de rétention" } }
            - { id: rlatest, text: { en: "returns the latest version of each item changed during the nine days", fr: "renvoie la dernière version de chaque élément modifié pendant les neuf jours" } }
        - id: deleted
          options:
            - { id: dlast, text: { en: "the last version of the item before its deletion", fr: "la dernière version de l'élément avant sa suppression" } }
            - { id: ddelete, text: { en: "a change whose operationType is delete", fr: "une modification dont l'operationType est delete" } }
            - { id: dnone, text: { en: "no change at all for that item", fr: "aucune modification pour cet élément" } }
        - id: functions
          options:
            - { id: fany, text: { en: "any language that Azure Functions supports", fr: "n'importe quel langage pris en charge par Azure Functions" } }
            - { id: fiso, text: { en: "the .NET isolated worker model", fr: "le modèle worker isolé .NET" } }
            - { id: finproc, text: { en: "the .NET in-process model", fr: "le modèle in-process .NET" } }
            - { id: fpy, text: { en: "the Python programming model", fr: "le modèle de programmation Python" } }
    answer:
      values: { resume: rerr, deleted: dnone, functions: fiso }
    explanation:
      correct:
        en: |
          In all versions and deletes mode, a continuation token is valid only while its changes are within the continuous backup retention window; reading changes older than the 7-day window returns an error, so Auditor must restart from now. In latest version mode, a deleted item is no longer in the change feed, so Rebuilder gets nothing for it, which is right for an index of current items. The Functions trigger supports all versions and deletes mode only in the .NET isolated worker model.
        fr: |
          En mode Toutes les versions et suppressions, un jeton de continuation n'est valide que tant que ses modifications sont dans la fenêtre de rétention de la sauvegarde continue ; lire des modifications plus anciennes que la fenêtre de 7 jours renvoie une erreur, et Auditor doit repartir de maintenant. En mode Dernière version, un élément supprimé n'est plus dans le flux de modification : Rebuilder ne reçoit rien pour lui, ce qui convient à un index des éléments actuels. Le déclencheur Functions ne prend en charge le mode Toutes les versions et suppressions que dans le modèle worker isolé .NET.
      options:
        rall: { en: "Changes older than the retention window can't be read in all versions and deletes mode.", fr: "Les modifications plus anciennes que la fenêtre de rétention ne peuvent pas être lues en mode Toutes les versions et suppressions." }
        r7: { en: "The feed doesn't skip ahead silently: a request for changes outside the window returns an error.", fr: "Le flux ne saute pas en avant sans prévenir : une demande de modifications hors de la fenêtre renvoie une erreur." }
        ddelete: { en: "Delete changes exist only in all versions and deletes mode; Rebuilder reads in latest version mode.", fr: "Les modifications de suppression n'existent qu'en mode Toutes les versions et suppressions ; Rebuilder lit en mode Dernière version." }
        dlast: { en: "Once an item is deleted, latest version mode no longer returns any version of it.", fr: "Une fois un élément supprimé, le mode Dernière version n'en renvoie plus aucune version." }
        fany: { en: "Other languages and models support only latest version mode with the trigger.", fr: "Les autres langages et modèles ne prennent en charge que le mode Dernière version avec le déclencheur." }
    references:
      - title: Change Feed Modes - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
      - title: Use Change Feed With Azure Functions - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-functions
