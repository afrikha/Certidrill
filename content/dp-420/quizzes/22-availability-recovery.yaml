chapter: 22-availability-recovery
questions:
  # ------------------------------------------------------------------ 1
  - id: dp420-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso creates an Azure Cosmos DB for NoSQL account named **cosmos-ct-notes** for a C# note-taking API and keeps the default periodic backup settings.

        A developer asks how far back the existing backups let Azure support recover the data. What should you answer?
      fr: |
        Contoso crée un compte Azure Cosmos DB for NoSQL nommé **cosmos-ct-notes** pour une API C# de prise de notes et conserve les paramètres de sauvegarde périodique par défaut.

        Un développeur demande jusqu'où dans le passé les sauvegardes existantes permettent au support Azure de récupérer les données. Que devez-vous répondre ?
    shuffle: false
    body:
      options:
        - { id: a, text: { en: "About 8 hours: a backup every 4 hours, the latest two kept", fr: "Environ 8 heures : une sauvegarde toutes les 4 heures, les deux dernières conservées" } }
        - { id: b, text: { en: "About 24 hours: a backup every 8 hours, the latest three kept", fr: "Environ 24 heures : une sauvegarde toutes les 8 heures, les trois dernières conservées" } }
        - { id: c, text: { en: "About 7 days: a backup every 24 hours, the latest seven kept", fr: "Environ 7 jours : une sauvegarde toutes les 24 heures, les sept dernières conservées" } }
        - { id: d, text: { en: "About 30 days: a backup every 24 hours, the latest thirty kept", fr: "Environ 30 jours : une sauvegarde toutes les 24 heures, les trente dernières conservées" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          By default, periodic backup takes a full backup every 4 hours and keeps only the latest two, so the backups cover about the last 8 hours. Those two copies are free; a longer retention or a shorter interval must be configured, and extra copies are charged.
        fr: |
          Par défaut, la sauvegarde périodique prend une sauvegarde complète toutes les 4 heures et ne conserve que les deux dernières : les sauvegardes couvrent donc environ les 8 dernières heures. Ces deux copies sont gratuites ; une rétention plus longue ou un intervalle plus court doivent être configurés, et les copies supplémentaires sont facturées.
      options:
        b: { en: "The default interval is 4 hours, not 8, and only two backups are kept by default.", fr: "L'intervalle par défaut est de 4 heures, pas de 8, et seules deux sauvegardes sont conservées par défaut." }
        c: { en: "Seven days of coverage requires increasing the retention; the default keeps two backups taken 4 hours apart.", fr: "Sept jours de couverture exigent d'augmenter la rétention ; la valeur par défaut conserve deux sauvegardes prises à 4 heures d'intervalle." }
        d: { en: "Thirty days is a tier of continuous backup, not the default of periodic backup, which covers about 8 hours.", fr: "Trente jours correspond à un niveau de la sauvegarde continue, pas à la valeur par défaut de la sauvegarde périodique, qui couvre environ 8 heures." }
    references:
      - title: Periodic backup and restore in Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-restore-introduction

  # ------------------------------------------------------------------ 2
  - id: dp420-qz-22-02
    objective: "2.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam created an Azure Cosmos DB for NoSQL account named **cosmos-fab-carts** in East US with multi-region writes. West Europe was added next, and Japan East last. A C# cart service writes in every region.

        You remove East US from the account. Which region now acts as the hub region that confirms the writes of the other regions?
      fr: |
        Fabrikam a créé un compte Azure Cosmos DB for NoSQL nommé **cosmos-fab-carts** dans East US avec les écritures multirégions. West Europe a été ajoutée ensuite, puis Japan East en dernier. Un service C# de paniers écrit dans toutes les régions.

        Vous supprimez East US du compte. Quelle région joue maintenant le rôle de région hub qui confirme les écritures des autres régions ?
    body:
      options:
        - { id: a, text: { en: "Japan East, because it's the region added most recently", fr: "Japan East, car c'est la région ajoutée le plus récemment" } }
        - { id: b, text: { en: "West Europe, because it's the next region in the order of addition", fr: "West Europe, car c'est la région suivante dans l'ordre d'ajout" } }
        - { id: c, text: { en: "The remaining region that receives the most write requests", fr: "La région restante qui reçoit le plus de requêtes d'écriture" } }
        - { id: d, text: { en: "No region: writes stay tentative until a region is added back", fr: "Aucune région : les écritures restent provisoires jusqu'à l'ajout d'une région" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The hub is the first region of a multi-region write account; the other regions are satellites whose writes are confirmed by the hub. When the hub is removed, the next region in the order in which regions were added becomes the hub automatically, here West Europe.
        fr: |
          La région hub est la première région d'un compte à écritures multirégions ; les autres régions sont des satellites dont les écritures sont confirmées par la région hub. Quand la région hub est supprimée, la région suivante dans l'ordre d'ajout des régions devient automatiquement la région hub, ici West Europe.
      options:
        a: { en: "The order of addition decides, starting from the oldest region: Japan East comes after West Europe.", fr: "C'est l'ordre d'ajout qui décide, en partant de la région la plus ancienne : Japan East vient après West Europe." }
        c: { en: "The hub doesn't depend on traffic; it follows the order in which regions were added.", fr: "La région hub ne dépend pas du trafic ; elle suit l'ordre d'ajout des régions." }
        d: { en: "A new hub is designated automatically, so confirmation of writes continues.", fr: "Une nouvelle région hub est désignée automatiquement : la confirmation des écritures continue." }
    references:
      - title: Multi-region writes in Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/multi-region-writes

  # ------------------------------------------------------------------ 3
  - id: dp420-qz-22-03
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure Cosmos DB for NoSQL account named **cosmos-lw-shop** that uses continuous backup mode with the 30-day tier. A database named **shop** uses shared (database-level) throughput and contains six containers, including **carts**.

        A faulty Python job corrupted items in **carts** at 09:40 UTC today. You need a copy of **carts** as it was at 09:30 UTC, in a new account, to repair the items. The restore must copy as little data as possible.

        What should you restore?
      fr: |
        Litware dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-lw-shop** qui utilise le mode de sauvegarde continue avec le niveau de 30 jours. Une base de données nommée **shop** utilise un débit partagé (au niveau de la base de données) et contient six conteneurs, dont **carts**.

        Un travail Python défectueux a corrompu des éléments de **carts** à 09:40 UTC aujourd'hui. Vous avez besoin d'une copie de **carts** telle qu'elle était à 09:30 UTC, dans un nouveau compte, pour réparer les éléments. La restauration doit copier le moins de données possible.

        Que devez-vous restaurer ?
    body:
      options:
        - { id: a, text: { en: "Only the carts container of shop, into a new account", fr: "Uniquement le conteneur carts de shop, vers un nouveau compte" } }
        - { id: b, text: { en: "The whole shop database, into a new account", fr: "Toute la base de données shop, vers un nouveau compte" } }
        - { id: c, text: { en: "The whole cosmos-lw-shop account, into a new account", fr: "Tout le compte cosmos-lw-shop, vers un nouveau compte" } }
        - { id: d, text: { en: "Only the carts container, into cosmos-lw-shop itself", fr: "Uniquement le conteneur carts, dans cosmos-lw-shop lui-même" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A restore can target any combination of dedicated-throughput containers, shared-throughput databases or the whole account, but not a subset of the containers of a shared-throughput database. The smallest valid scope that includes carts is therefore the whole shop database, restored into a new account.
        fr: |
          Une restauration peut cibler toute combinaison de conteneurs à débit dédié, de bases de données à débit partagé ou le compte entier, mais pas une partie des conteneurs d'une base de données à débit partagé. La plus petite étendue valide qui contient carts est donc toute la base de données shop, restaurée vers un nouveau compte.
      options:
        a: { en: "carts belongs to a shared-throughput database, whose containers can't be restored individually.", fr: "carts appartient à une base de données à débit partagé, dont les conteneurs ne peuvent pas être restaurés individuellement." }
        c: { en: "Restoring the whole account works but copies more data than needed; the shop database is enough.", fr: "Restaurer le compte entier fonctionne, mais copie plus de données que nécessaire ; la base de données shop suffit." }
        d: { en: "A same-account restore only brings back deleted resources; carts is still live.", fr: "Une restauration dans le même compte ne ramène que des ressources supprimées ; carts existe toujours." }
    references:
      - title: Continuous backup with point-in-time restore in Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction

  # ------------------------------------------------------------------ 4
  - id: dp420-qz-22-04
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has an Azure Cosmos DB for NoSQL account named **cosmos-wg-pricing** with a single write region in North Europe and a read region in West Europe. During a regional outage last week, you took North Europe offline, and West Europe became the write region.

        North Europe is now back online and healthy. Company policy requires North Europe to be the write region during normal operations, and moving back must not lose any write.

        What should you do?
      fr: |
        Woodgrove dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-wg-pricing** avec une seule région d'écriture dans North Europe et une région de lecture dans West Europe. Pendant une panne régionale la semaine dernière, vous avez mis North Europe hors connexion, et West Europe est devenue la région d'écriture.

        North Europe est maintenant de nouveau en ligne et saine. La stratégie de l'entreprise exige que North Europe soit la région d'écriture en fonctionnement normal, et le retour ne doit faire perdre aucune écriture.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run the Offline region operation on West Europe", fr: "Exécuter l'opération Offline region sur West Europe" } }
        - { id: b, text: { en: "Run the Change write region operation to North Europe", fr: "Exécuter l'opération Change write region vers North Europe" } }
        - { id: c, text: { en: "Do nothing: North Europe has already become the write region again", fr: "Ne rien faire : North Europe est déjà redevenue la région d'écriture" } }
        - { id: d, text: { en: "Enable service-managed failover with North Europe first in priority", fr: "Activer le basculement géré par le service avec North Europe en première priorité" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          After a forced failover, the former write region comes back online as a read region. Change write region is the planned operation for healthy regions: replication catches up before the new write region is promoted, so no write is lost.
        fr: |
          Après un basculement forcé, l'ancienne région d'écriture revient en ligne comme région de lecture. Change write region est l'opération planifiée pour des régions saines : la réplication rattrape son retard avant la promotion de la nouvelle région d'écriture, donc aucune écriture n'est perdue.
      options:
        a: { en: "Offline region is a forced failover for an outage: it can lose unreplicated writes and takes a healthy region offline.", fr: "Offline region est un basculement forcé pour une panne : il peut perdre les écritures non répliquées et met hors connexion une région saine." }
        c: { en: "A region taken offline returns as a read region; it doesn't become the write region again by itself.", fr: "Une région mise hors connexion revient comme région de lecture ; elle ne redevient pas d'elle-même la région d'écriture." }
        d: { en: "Service-managed failover acts only when Microsoft declares an outage; it doesn't move the write region while every region is healthy.", fr: "Le basculement géré par le service n'agit que lorsque Microsoft déclare une panne ; il ne déplace pas la région d'écriture quand toutes les régions sont saines." }
    references:
      - title: Manage an Azure Cosmos DB account by using the Azure portal
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-database-account
      - title: Reliability in Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability

  # ------------------------------------------------------------------ 5
  - id: dp420-qz-22-05
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Adatum enabled per-partition automatic failover on an Azure Cosmos DB for NoSQL account named **cosmos-adt-claims**. The write region is Central US and the read region is East US 2. A container named **claims** has 60 physical partitions.

        For a disaster recovery drill, you start the partition failure simulation on **claims** in Central US, and you plan when to run the critical C# transactions.

        How should you complete the drill plan? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum a activé le basculement automatique par partition sur un compte Azure Cosmos DB for NoSQL nommé **cosmos-adt-claims**. La région d'écriture est Central US et la région de lecture est East US 2. Un conteneur nommé **claims** compte 60 partitions physiques.

        Pour un exercice de récupération d'urgence, vous démarrez la simulation de défaillance de partition sur **claims** dans Central US, et vous planifiez le moment où exécuter les transactions C# critiques.

        Comment devez-vous compléter le plan de l'exercice ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The simulation affects [[parts]] partitions of claims. Before you run the transactions, allow up to [[delay]] for the fault to take effect.
        fr: |
          La simulation touche [[parts]] partitions de claims. Avant d'exécuter les transactions, prévoyez jusqu'à [[delay]] pour que la panne prenne effet.
      slots:
        - id: parts
          options:
            - { id: p1, text: "1" }
            - { id: p6, text: "6" }
            - { id: p10, text: "10" }
            - { id: p60, text: "60" }
        - id: delay
          options:
            - { id: s100, text: { en: "100 seconds", fr: "100 secondes" } }
            - { id: m3, text: { en: "3 minutes", fr: "3 minutes" } }
            - { id: m15, text: { en: "15 minutes", fr: "15 minutes" } }
            - { id: h1, text: { en: "1 hour", fr: "1 heure" } }
    answer:
      values: { parts: p6, delay: m15 }
    explanation:
      correct:
        en: |
          The partition failure simulation injects the fault into 10 % of the partitions of the target container, with a minimum of 1 and a maximum of 10: 6 of the 60 partitions here. It can take up to 15 minutes to take effect, and as long to stop, so the transactions must wait for it.
        fr: |
          La simulation de défaillance de partition injecte la panne dans 10 % des partitions du conteneur cible, avec un minimum de 1 et un maximum de 10 : ici 6 des 60 partitions. Elle peut mettre jusqu'à 15 minutes à prendre effet, et autant à s'arrêter : les transactions doivent donc l'attendre.
      options:
        p10: { en: "10 is the maximum, reached only with 100 partitions or more.", fr: "10 est le maximum, atteint seulement à partir de 100 partitions." }
        p60: { en: "The simulation never targets every partition of the container.", fr: "La simulation ne cible jamais toutes les partitions du conteneur." }
        m3: { en: "About 3 minutes is the typical time for PPAF to restore writes, not the time the simulation needs to start.", fr: "Environ 3 minutes est le délai typique de rétablissement des écritures par PPAF, pas le délai de démarrage de la simulation." }
    references:
      - title: Configure per-partition automatic failover for Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-per-partition-automatic-failover

  # ------------------------------------------------------------------ 6
  - id: dp420-qz-22-06
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin has an Azure Cosmos DB for NoSQL account named **cosmos-ts-loyalty** with multi-region writes in East US, West Europe and Southeast Asia, and Session consistency. A C# points service that uses the .NET SDK v3 runs in each of the three regions.

        A code review of the last release finds the following:

        - At startup, each instance shuffles the three regions into a random order and assigns them to `ApplicationPreferredRegions` to spread the load.
        - After an instance updates the points of a member, it sends the session token to an instance in another region, which immediately writes a follow-up update to the same item.

        Since the release, the number of conflicts and the write latency have increased. You need to fix both findings by following the recommended practices for multi-region writes.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-ts-loyalty** avec les écritures multirégions dans East US, West Europe et Southeast Asia, et la cohérence Session. Un service C# de points qui utilise le SDK .NET v3 s'exécute dans chacune des trois régions.

        Une revue de code de la dernière version constate ce qui suit :

        - Au démarrage, chaque instance mélange les trois régions dans un ordre aléatoire et les affecte à `ApplicationPreferredRegions` pour répartir la charge.
        - Après avoir mis à jour les points d'un membre, une instance envoie le jeton de session à une instance d'une autre région, qui écrit immédiatement une mise à jour complémentaire du même élément.

        Depuis cette version, le nombre de conflits et la latence d'écriture ont augmenté. Vous devez corriger les deux constats en suivant les pratiques recommandées pour les écritures multirégions.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Set ApplicationRegion to the region where each instance runs, so that its requests stay local.", fr: "Définir ApplicationRegion sur la région où s'exécute chaque instance, pour que ses requêtes restent locales." } }
        - { id: b, text: { en: "Send each points update to the three regions in parallel, and keep the first response.", fr: "Envoyer chaque mise à jour de points aux trois régions en parallèle, et garder la première réponse." } }
        - { id: c, text: { en: "Change the default consistency level of the account to Strong for all three regions.", fr: "Changer le niveau de cohérence par défaut du compte en Strong pour les trois régions." } }
        - { id: d, text: { en: "Write the follow-up update in the first region, and share session tokens only for reads.", fr: "Écrire la mise à jour complémentaire dans la première région, et ne partager les jetons de session que pour les lectures." } }
        - { id: e, text: { en: "Switch the container to a custom conflict resolution policy with a merge procedure.", fr: "Passer le conteneur à une stratégie de résolution de conflit personnalisée avec une procédure de fusion." } }
      choose: 2
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Multi-region writes work best when each instance keeps its traffic in its local region: a random region order per instance sends requests across regions and increases conflicts. A write sent to a region that lags behind the session token's region must wait for it to catch up, so session tokens should be passed between instances for reads only, and the follow-up write belongs in the region of the first update.
        fr: |
          Les écritures multirégions fonctionnent au mieux quand chaque instance garde son trafic dans sa région locale : un ordre de régions aléatoire par instance envoie les requêtes d'une région à l'autre et augmente les conflits. Une écriture envoyée à une région en retard sur la région du jeton de session doit attendre qu'elle rattrape ce retard : les jetons de session ne se transmettent entre instances que pour les lectures, et la mise à jour complémentaire doit se faire dans la région de la première mise à jour.
      options:
        b: { en: "Sending the same write to every region is an antipattern that multiplies conflicts.", fr: "Envoyer la même écriture à toutes les régions est un antimodèle qui multiplie les conflits." }
        c: { en: "Strong consistency isn't supported on an account with multiple write regions.", fr: "La cohérence Strong n'est pas prise en charge sur un compte à plusieurs régions d'écriture." }
        e: { en: "The policy only changes how conflicts are resolved, not how many occur, and a custom policy can be set only when the container is created.", fr: "La stratégie ne change que la façon de résoudre les conflits, pas leur nombre, et une stratégie personnalisée ne peut être définie qu'à la création du conteneur." }
    references:
      - title: Multi-region writes in Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/multi-region-writes

  # ------------------------------------------------------------------ 7
  - id: dp420-qz-22-07
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has an Azure Cosmos DB for NoSQL account named **cosmos-fab-hr** that uses continuous backup mode with the 30-day tier.

        Yesterday at 17:05 UTC, a cleanup script deleted the following resources:

        - The **hr** database, which contained the **employees** and **payroll** containers, each with dedicated (container-level) throughput.
        - The **audit** container of the **ops** database. The **ops** database still exists. **audit** had a default TTL of 90 days.
        - Two containers of the **sales** database, which still exists.

        You plan to bring every deleted resource back into **cosmos-fab-hr**.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-fab-hr** qui utilise le mode de sauvegarde continue avec le niveau de 30 jours.

        Hier à 17:05 UTC, un script de nettoyage a supprimé les ressources suivantes :

        - La base de données **hr**, qui contenait les conteneurs **employees** et **payroll**, chacun avec un débit dédié (au niveau du conteneur).
        - Le conteneur **audit** de la base de données **ops**. La base de données **ops** existe toujours. **audit** avait une durée de vie (TTL) par défaut de 90 jours.
        - Deux conteneurs de la base de données **sales**, qui existe toujours.

        Vous prévoyez de ramener toutes les ressources supprimées dans **cosmos-fab-hr**.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "You can restore payroll into cosmos-fab-hr before you restore the hr database.", fr: "Vous pouvez restaurer payroll dans cosmos-fab-hr avant de restaurer la base de données hr." }
        - id: s2
          text: { en: "If you restore audit without disabling TTL, items whose TTL has elapsed can be deleted soon after the restore.", fr: "Si vous restaurez audit sans désactiver le TTL, les éléments dont le TTL est écoulé peuvent être supprimés peu après la restauration." }
        - id: s3
          text: { en: "You can start the restores of hr, audit and the two sales containers at the same time, as four parallel operations.", fr: "Vous pouvez lancer en même temps les restaurations de hr, d'audit et des deux conteneurs de sales, en quatre opérations parallèles." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A same-account restore of a container requires its parent database to exist, so hr must be restored first. The restored container keeps its TTL configuration unless you pass `--disable-ttl True`, so expired items can be removed right after the restore. At most three restore operations can be active on the same account at once, so the four restores must be staggered.
        fr: |
          Une restauration de conteneur dans le même compte exige que sa base de données parente existe : hr doit donc être restaurée d'abord. Le conteneur restauré garde sa configuration de TTL, sauf si vous passez `--disable-ttl True` : les éléments expirés peuvent donc être supprimés juste après la restauration. Au plus trois opérations de restauration peuvent être actives en même temps sur un même compte : les quatre restaurations doivent donc être échelonnées.
      options:
        s1: { en: "Container restore operations require the original database to be present: restore hr first.", fr: "Les opérations de restauration de conteneur exigent que la base de données d'origine soit présente : restaurez d'abord hr." }
        s3: { en: "No more than three restore operations can be active on the same account at once.", fr: "Au plus trois opérations de restauration peuvent être actives en même temps sur un même compte." }
    references:
      - title: Same-account (in-account) restore for continuous backup
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/restore-in-account-continuous-backup-introduction
      - title: Restore a deleted container or database to the same Azure Cosmos DB account
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-restore-in-account-continuous-backup

  # ------------------------------------------------------------------ 8
  - id: dp420-qz-22-08
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum has an Azure Cosmos DB for NoSQL account named **cosmos-adt-quotes** that uses continuous backup mode with the 30-day tier and Session consistency. The account was created in East US with multi-region writes, and West Europe was added later. Microsoft Entra data-plane role assignments give the C# quoting service access to the account.

        A container named **quotes** uses a custom conflict resolution policy with a merge stored procedure named **spMerge**.

        A defect started corrupting items at 10:00 UTC. You restore the account into a new account named **cosmos-adt-quotes-r** at 09:59:00 UTC.

        Which two statements describe **cosmos-adt-quotes-r**?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-adt-quotes** qui utilise le mode de sauvegarde continue avec le niveau de 30 jours et la cohérence Session. Le compte a été créé dans East US avec les écritures multirégions, et West Europe a été ajoutée ensuite. Des attributions de rôles du plan de données Microsoft Entra donnent au service C# de devis l'accès au compte.

        Un conteneur nommé **quotes** utilise une stratégie de résolution de conflit personnalisée avec une procédure stockée de fusion nommée **spMerge**.

        Un défaut a commencé à corrompre des éléments à 10:00 UTC. Vous restaurez le compte vers un nouveau compte nommé **cosmos-adt-quotes-r** à 09:59:00 UTC.

        Quelles sont les deux affirmations qui décrivent **cosmos-adt-quotes-r** ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "A write accepted in West Europe at 09:58:40 UTC and confirmed by East US at 09:59:20 UTC isn't restored.", fr: "Une écriture acceptée dans West Europe à 09:58:40 UTC et confirmée par East US à 09:59:20 UTC n'est pas restaurée." } }
        - { id: b, text: { en: "quotes keeps its custom conflict resolution policy, and spMerge is restored with the container.", fr: "quotes garde sa stratégie de résolution de conflit personnalisée, et spMerge est restaurée avec le conteneur." } }
        - { id: c, text: { en: "The account is restored with both East US and West Europe, with multi-region writes enabled.", fr: "Le compte est restauré avec East US et West Europe, et les écritures multirégions activées." } }
        - { id: d, text: { en: "quotes uses the last writer wins conflict resolution policy, based on the timestamp.", fr: "quotes utilise la stratégie de résolution de conflit « le dernier écrivain gagne », fondée sur l'horodatage." } }
        - { id: e, text: { en: "The quoting service can connect at once, because data-plane role assignments are restored.", fr: "Le service de devis peut se connecter immédiatement, car les attributions de rôles du plan de données sont restaurées." } }
      choose: 2
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          In a multi-region write account, a satellite write is backed up only once the hub has confirmed it, so a restore includes only the mutations confirmed by the restore timestamp: the West Europe write confirmed at 09:59:20 is left out. Containers that used a custom conflict resolution policy come back with last writer wins based on the timestamp.
        fr: |
          Dans un compte à écritures multirégions, une écriture d'une région satellite n'est sauvegardée qu'une fois confirmée par la région hub : une restauration ne contient donc que les mutations confirmées à l'horodatage de restauration, et l'écriture de West Europe confirmée à 09:59:20 en est exclue. Les conteneurs qui utilisaient une stratégie de résolution de conflit personnalisée reviennent en « le dernier écrivain gagne » fondé sur l'horodatage.
      options:
        b: { en: "The custom policy is reset to last writer wins, and stored procedures aren't restored.", fr: "La stratégie personnalisée est réinitialisée en « le dernier écrivain gagne », et les procédures stockées ne sont pas restaurées." }
        c: { en: "A restore doesn't recreate all the regions of the source account; you add the regions you need afterward.", fr: "Une restauration ne recrée pas toutes les régions du compte source ; vous ajoutez ensuite les régions nécessaires." }
        e: { en: "Data-plane RBAC settings and role assignments aren't restored; they must be configured again.", fr: "Les paramètres RBAC du plan de données et les attributions de rôles ne sont pas restaurés ; ils doivent être reconfigurés." }
    references:
      - title: Continuous backup with point-in-time restore in Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction

  # ------------------------------------------------------------------ 9
  - id: dp420-qz-22-09
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind is designing an Azure Cosmos DB for NoSQL account named **cosmos-nw-ledger** for a C# payment service that uses .NET SDK 3.62.0 or later. For data residency reasons, the account must use exactly two regions: West Europe and North Europe.

        The design must meet the following requirements:

        - No committed write can be lost if a region fails.
        - If either of the two regions fails, write availability must recover automatically within minutes, without any operation by the team.

        Which configuration should you use?
      fr: |
        Northwind conçoit un compte Azure Cosmos DB for NoSQL nommé **cosmos-nw-ledger** pour un service C# de paiement qui utilise le SDK .NET 3.62.0 ou ultérieur. Pour des raisons de résidence des données, le compte doit utiliser exactement deux régions : West Europe et North Europe.

        La conception doit répondre aux exigences suivantes :

        - Aucune écriture validée ne doit être perdue si une région tombe en panne.
        - Si l'une des deux régions tombe en panne, la disponibilité en écriture doit se rétablir automatiquement en quelques minutes, sans aucune opération de l'équipe.

        Quelle configuration devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Multi-region writes in both regions, with Strong consistency", fr: "Écritures multirégions dans les deux régions, avec la cohérence Strong" } }
        - { id: b, text: { en: "A single write region, Bounded staleness consistency and per-partition automatic failover", fr: "Une seule région d'écriture, la cohérence Bounded staleness et le basculement automatique par partition" } }
        - { id: c, text: { en: "A single write region, Strong consistency and per-partition automatic failover", fr: "Une seule région d'écriture, la cohérence Strong et le basculement automatique par partition" } }
        - { id: d, text: { en: "A single write region, Strong consistency and service-managed failover", fr: "Une seule région d'écriture, la cohérence Strong et le basculement géré par le service" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Strong consistency is the only level with an RPO of zero, and it requires a single write region. With only two regions, Strong loses its dynamic quorum when either region fails, so writes stop even if only the read region is down. Per-partition automatic failover moves the affected partitions automatically, usually in about 3 minutes, and also covers this read region case for a two-region Strong account.
        fr: |
          La cohérence Strong est le seul niveau dont le RPO est nul, et elle exige une seule région d'écriture. Avec seulement deux régions, Strong perd son quorum dynamique quand l'une ou l'autre région tombe en panne : les écritures s'arrêtent même si seule la région de lecture est en panne. Le basculement automatique par partition déplace automatiquement les partitions touchées, généralement en 3 minutes environ, et couvre aussi ce cas de la région de lecture pour un compte Strong à deux régions.
      options:
        a: { en: "Strong consistency isn't supported on an account with multiple write regions.", fr: "La cohérence Strong n'est pas prise en charge sur un compte à plusieurs régions d'écriture." }
        b: { en: "Bounded staleness can lose up to its staleness window of writes, and per-partition automatic failover doesn't support it yet.", fr: "Bounded staleness peut perdre jusqu'à sa fenêtre d'obsolescence en écritures, et le basculement automatique par partition ne la prend pas encore en charge." }
        d: { en: "Service-managed failover is decided by Microsoft and can take an hour or more, and a read region outage would still stop writes until a forced failover.", fr: "Le basculement géré par le service est décidé par Microsoft et peut prendre une heure ou plus, et une panne de la région de lecture arrêterait quand même les écritures jusqu'à un basculement forcé." }
    references:
      - title: Reliability in Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability
      - title: Configure per-partition automatic failover for Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-per-partition-automatic-failover

  # ------------------------------------------------------------------ 10
  - id: dp420-qz-22-10
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Litware has an Azure Cosmos DB for NoSQL account named **cosmos-lw-legal** that uses continuous backup mode with the 30-day tier. A container named **contracts** in the **legal** database has dedicated throughput and a default TTL of 180 days.

        A deployment at 14:20 UTC yesterday overwrote the `status` property of 20,000 items in **contracts**. The application has kept writing valid new items since then. A repair job that runs in a virtual network and authenticates with Microsoft Entra ID will copy the correct `status` values back into **contracts**.

        You must meet the following requirements:

        - Keep every valid write made since the deployment.
        - The restored data must never be reachable from public networks.
        - No restored item can expire before the repair finishes.
        - Minimize costs once the repair is done.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Litware dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-lw-legal** qui utilise le mode de sauvegarde continue avec le niveau de 30 jours. Un conteneur nommé **contracts** de la base de données **legal** a un débit dédié et une durée de vie (TTL) par défaut de 180 jours.

        Un déploiement à 14:20 UTC hier a écrasé la propriété `status` de 20 000 éléments de **contracts**. L'application a continué depuis d'écrire de nouveaux éléments valides. Un travail de réparation qui s'exécute dans un réseau virtuel et s'authentifie avec Microsoft Entra ID recopiera les valeurs `status` correctes dans **contracts**.

        Vous devez répondre aux exigences suivantes :

        - Conserver toutes les écritures valides effectuées depuis le déploiement.
        - Les données restaurées ne doivent jamais être accessibles depuis les réseaux publics.
        - Aucun élément restauré ne doit expirer avant la fin de la réparation.
        - Réduire les coûts une fois la réparation terminée.

        Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans le bon ordre.
    body:
      actions:
        - { id: restore, text: { en: "Restore contracts into a new account at 14:19 UTC yesterday, with public network access and TTL disabled.", fr: "Restaurer contracts vers un nouveau compte à 14:19 UTC hier, avec l'accès réseau public et le TTL désactivés." } }
        - { id: access, text: { en: "Create a private endpoint and a data-plane role assignment for the repair job on the restored account.", fr: "Créer un point de terminaison privé et une attribution de rôle du plan de données pour le travail de réparation sur le compte restauré." } }
        - { id: repair, text: { en: "Run the repair job to copy the correct status values from the restored account into contracts.", fr: "Exécuter le travail de réparation pour recopier les valeurs status correctes du compte restauré dans contracts." } }
        - { id: cleanup, text: { en: "Delete the restored account.", fr: "Supprimer le compte restauré." } }
        - { id: inacc, text: { en: "Run a same-account restore of contracts to 14:19 UTC yesterday.", fr: "Exécuter une restauration de contracts dans le même compte à 14:19 UTC hier." } }
        - { id: delrest, text: { en: "Delete contracts, and then restore it into the same account at 14:19 UTC yesterday.", fr: "Supprimer contracts, puis le restaurer dans le même compte à 14:19 UTC hier." } }
        - { id: support, text: { en: "Increase the backup retention to seven days, and then open a support request.", fr: "Augmenter la rétention des sauvegardes à sept jours, puis ouvrir une demande de support." } }
      count: 4
    answer:
      sequence: [restore, access, repair, cleanup]
    explanation:
      correct:
        en: |
          A live container whose items were overwritten is recovered by a point-in-time restore into a new account, followed by a copy of the correct values. Passing `--public-network-access Disabled` and `--disable-ttl True` keeps the restored data private and prevents expired items from being deleted. Private endpoints and data-plane role assignments aren't restored, so the job needs them on the new account before it runs; deleting the restored account afterward stops its charges.
        fr: |
          Un conteneur actif dont des éléments ont été écrasés se récupère par une restauration à un instant dans le passé vers un nouveau compte, suivie d'une copie des valeurs correctes. Passer `--public-network-access Disabled` et `--disable-ttl True` garde les données restaurées privées et empêche la suppression des éléments expirés. Les points de terminaison privés et les attributions de rôles du plan de données ne sont pas restaurés : le travail en a besoin sur le nouveau compte avant de s'exécuter ; supprimer ensuite le compte restauré arrête sa facturation.
      options:
        inacc: { en: "A same-account restore only brings back deleted databases and containers; contracts is still live.", fr: "Une restauration dans le même compte ne ramène que des bases de données et des conteneurs supprimés ; contracts existe toujours." }
        delrest: { en: "Restoring the whole container to 14:19 UTC would lose every valid write made since the deployment.", fr: "Restaurer tout le conteneur à 14:19 UTC ferait perdre toutes les écritures valides effectuées depuis le déploiement." }
        support: { en: "This is the procedure for periodic backup mode; the account uses continuous backup and self-service restores.", fr: "C'est la procédure du mode de sauvegarde périodique ; le compte utilise la sauvegarde continue et des restaurations en libre-service." }
    references:
      - title: Continuous backup with point-in-time restore in Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
      - title: Restore an Azure Cosmos DB account that uses continuous backup mode
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/restore-account-continuous-backup
