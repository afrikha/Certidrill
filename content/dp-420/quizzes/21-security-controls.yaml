chapter: 21-security-controls
questions:
  # ------------------------------------------------------------------ 1
  - id: dp420-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A mobile app of Fabrikam stores each user's wish list in an Azure Cosmos DB for NoSQL container named **wishlists**. The app must never receive an account key. A trusted mid-tier service will hand the app a resource token for each signed-in user.

        What must the mid-tier service create so that Azure Cosmos DB issues these resource tokens?
      fr: |
        Une application mobile de Fabrikam stocke la liste de souhaits de chaque utilisateur dans un conteneur Azure Cosmos DB for NoSQL nommé **wishlists**. L'application ne doit jamais recevoir de clé de compte. Un service intermédiaire de confiance remettra à l'application un jeton de ressource pour chaque utilisateur connecté.

        Que doit créer le service intermédiaire pour qu'Azure Cosmos DB émette ces jetons de ressource ?
    body:
      options:
        - { id: a, text: { en: "A data plane role assignment of Cosmos DB Built-in Data Contributor at the scope of wishlists", fr: "Une attribution de rôle du plan de données Cosmos DB Built-in Data Contributor à l'étendue de wishlists" } }
        - { id: b, text: { en: "A database user for each app user, with a permission on wishlists attached to that user", fr: "Un utilisateur de base de données pour chaque utilisateur de l'application, avec une autorisation sur wishlists rattachée à cet utilisateur" } }
        - { id: c, text: { en: "A Microsoft Entra app registration with a client secret for each app user", fr: "Une inscription d'application Microsoft Entra avec une clé secrète client pour chaque utilisateur de l'application" } }
        - { id: d, text: { en: "A pair of read-only account keys that are regenerated at the start of each session", fr: "Une paire de clés de compte en lecture seule régénérées au début de chaque session" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A resource token comes from a permission resource: the permission belongs to a user of the database, has a mode (`All` or `Read`) and targets one resource such as the wishlists container. Each read or write of the permission returns a new token, valid one hour by default, that the mid-tier passes to the app.
        fr: |
          Un jeton de ressource provient d'une ressource d'autorisation (permission) : l'autorisation appartient à un utilisateur de la base de données, possède un mode (`All` ou `Read`) et cible une ressource, comme le conteneur wishlists. Chaque lecture ou écriture de l'autorisation renvoie un nouveau jeton, valide une heure par défaut, que le service intermédiaire transmet à l'application.
      options:
        a: { en: "Data plane role assignments authorize Microsoft Entra identities; they don't produce resource tokens.", fr: "Les attributions de rôles du plan de données autorisent des identités Microsoft Entra ; elles ne produisent pas de jetons de ressource." }
        c: { en: "App registrations and client secrets relate to Microsoft Entra authentication, and a secret per user would end up in the app; resource tokens don't use them.", fr: "Les inscriptions d'application et les clés secrètes client relèvent de l'authentification Microsoft Entra, et un secret par utilisateur finirait dans l'application ; les jetons de ressource ne les utilisent pas." }
        d: { en: "Account keys are account-wide secrets; handing them out is what resource tokens avoid, and regenerating them per session would break every other client.", fr: "Les clés de compte sont des secrets valables pour tout le compte ; les distribuer est précisément ce qu'évitent les jetons de ressource, et les régénérer à chaque session casserait tous les autres clients." }
    references:
      - title: Permissions - Azure Cosmos DB REST API
        url: https://learn.microsoft.com/en-us/rest/api/cosmos-db/permissions

  # ------------------------------------------------------------------ 2
  - id: dp420-qz-21-02
    objective: "2.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum's on-premises application servers use addresses in the range 10.40.0.0/16 and reach Azure over ExpressRoute private peering. An administrator tries to add 10.40.0.0/16 to the IP firewall of an Azure Cosmos DB for NoSQL account named **adatum-erp**, and the update of the account fails.

        What is the cause of the failure?
      fr: |
        Les serveurs d'applications locaux d'Adatum utilisent des adresses de la plage 10.40.0.0/16 et accèdent à Azure par le peering privé ExpressRoute. Un administrateur essaie d'ajouter 10.40.0.0/16 au pare-feu IP d'un compte Azure Cosmos DB for NoSQL nommé **adatum-erp**, et la mise à jour du compte échoue.

        Quelle est la cause de l'échec ?
    body:
      options:
        - { id: a, text: { en: "The IP firewall accepts single addresses only, not CIDR ranges.", fr: "Le pare-feu IP n'accepte que des adresses uniques, pas des plages CIDR." } }
        - { id: b, text: { en: "Accept connections from within Azure datacenters must be enabled first.", fr: "L'option Accept connections from within Azure datacenters doit d'abord être activée." } }
        - { id: c, text: { en: "The IP firewall accepts only public IP addresses and public ranges.", fr: "Le pare-feu IP n'accepte que des adresses IP publiques et des plages publiques." } }
        - { id: d, text: { en: "Public network access must be set to Disabled before rules are added.", fr: "L'accès réseau public doit être défini sur Disabled avant l'ajout de règles." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Creating or updating an account with private IP addresses in its allowed list fails: the IP firewall filters public addresses and CIDR ranges only. For clients that reach Azure over private connectivity, such as ExpressRoute private peering, a private endpoint is the network control that fits.
        fr: |
          La création ou la mise à jour d'un compte dont la liste d'autorisation contient des adresses IP privées échoue : le pare-feu IP ne filtre que des adresses et des plages CIDR publiques. Pour des clients qui accèdent à Azure par une connectivité privée, comme le peering privé ExpressRoute, le point de terminaison privé est le contrôle réseau adapté.
      options:
        a: { en: "The IP firewall accepts both single addresses and CIDR ranges in ipRules.", fr: "Le pare-feu IP accepte aussi bien des adresses uniques que des plages CIDR dans ipRules." }
        b: { en: "That option adds 0.0.0.0 to allow Azure datacenter addresses; it isn't a prerequisite for other rules and doesn't make private addresses valid.", fr: "Cette option ajoute 0.0.0.0 pour autoriser les adresses des centres de données Azure ; ce n'est pas un prérequis aux autres règles et elle ne rend pas les adresses privées valides." }
        d: { en: "Disabling public network access blocks all public traffic and overrides every IP rule; IP rules apply when public access is enabled.", fr: "Désactiver l'accès réseau public bloque tout le trafic public et l'emporte sur toutes les règles IP ; les règles IP s'appliquent quand l'accès public est activé." }
    references:
      - title: Configure IP Firewall - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-firewall

  # ------------------------------------------------------------------ 3
  - id: dp420-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An order service of Northwind uses Microsoft Entra authentication with an Azure Cosmos DB for NoSQL account. The service must create, read, replace, upsert and query items in a container named **orders**, but it must never delete items.

        A developer drafts a custom data plane role whose `DataActions` contain `readMetadata` and `sqlDatabases/containers/items/*`, and whose `NotDataActions` contain `sqlDatabases/containers/items/delete`.

        You need a role that meets the requirement. What should you do?
      fr: |
        Un service de commandes de Northwind utilise l'authentification Microsoft Entra avec un compte Azure Cosmos DB for NoSQL. Le service doit créer, lire, remplacer, insérer ou mettre à jour (upsert) et interroger des éléments dans un conteneur nommé **orders**, mais il ne doit jamais supprimer d'éléments.

        Un développeur rédige un rôle personnalisé du plan de données dont les `DataActions` contiennent `readMetadata` et `sqlDatabases/containers/items/*`, et dont les `NotDataActions` contiennent `sqlDatabases/containers/items/delete`.

        Vous avez besoin d'un rôle qui répond à l'exigence. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the draft, because NotDataActions removes items/delete from the items/* wildcard.", fr: "Conserver le brouillon, car NotDataActions retire items/delete du caractère générique items/*." } }
        - { id: b, text: { en: "Assign Cosmos DB Built-in Data Contributor, and add a CanNotDelete lock on the account.", fr: "Attribuer Cosmos DB Built-in Data Contributor, puis ajouter un verrou CanNotDelete sur le compte." } }
        - { id: c, text: { en: "Assign Cosmos DB Built-in Data Contributor at the scope of the orders container only.", fr: "Attribuer Cosmos DB Built-in Data Contributor à l'étendue du seul conteneur orders." } }
        - { id: d, text: { en: "List each allowed data action in DataActions, without items/* and without NotDataActions.", fr: "Lister chaque action de données autorisée dans DataActions, sans items/* et sans NotDataActions." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Native data plane role definitions don't support `notDataActions`: an action is allowed only if `DataActions` lists it. The role must therefore list `readMetadata`, `items/create`, `items/read`, `items/replace`, `items/upsert`, `executeQuery` and `readChangeFeed` (queries need both), and leave out `items/delete`.
        fr: |
          Les définitions de rôles natives du plan de données ne prennent pas en charge `notDataActions` : une action n'est autorisée que si `DataActions` la liste. Le rôle doit donc lister `readMetadata`, `items/create`, `items/read`, `items/replace`, `items/upsert`, `executeQuery` et `readChangeFeed` (les requêtes exigent les deux), et omettre `items/delete`.
      options:
        a: { en: "notDataActions isn't supported in data plane roles, so the exclusion can't subtract delete from items/*.", fr: "notDataActions n'est pas pris en charge dans les rôles du plan de données : l'exclusion ne peut pas soustraire delete de items/*." }
        b: { en: "Resource locks protect control plane operations; deleting an item is a data plane operation that a lock doesn't block.", fr: "Les verrous de ressource protègent les opérations du plan de contrôle ; la suppression d'un élément est une opération du plan de données qu'un verrou ne bloque pas." }
        c: { en: "Narrowing the scope limits where the role applies, not what it allows: Built-in Data Contributor still includes item deletes.", fr: "Restreindre l'étendue limite l'endroit où le rôle s'applique, pas ce qu'il autorise : Built-in Data Contributor inclut toujours la suppression d'éléments." }
    references:
      - title: Data plane security reference - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
      - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control

  # ------------------------------------------------------------------ 4
  - id: dp420-qz-21-04
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware enabled dynamic data masking on an Azure Cosmos DB for NoSQL account named **litware-crm**, which accepts traffic from all networks. The container **customers** is partitioned by `/customerId`. Its masking policy includes the path `/` and excludes only `/id`.

        Support engineers, who have the Cosmos DB Built-in Data Reader role, report that the document view of Data Explorer is no longer available for customers. They must keep seeing masked contact details, and customer IDs aren't sensitive.

        What should you do to restore the document view?
      fr: |
        Litware a activé le masquage dynamique des données sur un compte Azure Cosmos DB for NoSQL nommé **litware-crm**, qui accepte le trafic de tous les réseaux. Le conteneur **customers** est partitionné par `/customerId`. Sa stratégie de masquage inclut le chemin `/` et n'exclut que `/id`.

        Les ingénieurs du support, qui ont le rôle Cosmos DB Built-in Data Reader, signalent que la vue des documents de l'Explorateur de données n'est plus disponible pour customers. Ils doivent continuer à voir les coordonnées masquées, et les ID client ne sont pas sensibles.

        Que devez-vous faire pour rétablir la vue des documents ?
    body:
      options:
        - { id: a, text: { en: "Add /customerId to the excludedPaths of the masking policy.", fr: "Ajouter /customerId aux excludedPaths de la stratégie de masquage." } }
        - { id: b, text: { en: "Give the support engineers a custom role that adds items/unmask.", fr: "Donner aux ingénieurs du support un rôle personnalisé qui ajoute items/unmask." } }
        - { id: c, text: { en: "Select Add Azure Portal Middleware IPs in the account's networking settings.", fr: "Sélectionner Add Azure Portal Middleware IPs dans les paramètres réseau du compte." } }
        - { id: d, text: { en: "Include /customerId with the MaskSubstring strategy so that part of it stays visible.", fr: "Inclure /customerId avec la stratégie MaskSubstring pour qu'une partie reste visible." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The document view of Data Explorer isn't available when the `id` or the partition key is masked. Including `/` masks every property, so `/customerId` is masked too; excluding it, as is already done for `/id`, restores the view while the other properties stay masked for users without `items/unmask`.
        fr: |
          La vue des documents de l'Explorateur de données n'est pas disponible quand l'`id` ou la clé de partition est masqué. Inclure `/` masque toutes les propriétés, donc aussi `/customerId` ; l'exclure, comme c'est déjà le cas pour `/id`, rétablit la vue tandis que les autres propriétés restent masquées pour les utilisateurs sans `items/unmask`.
      options:
        b: { en: "With items/unmask, the engineers would see every value in clear, including the contact details that must stay masked.", fr: "Avec items/unmask, les ingénieurs verraient toutes les valeurs en clair, y compris les coordonnées qui doivent rester masquées." }
        c: { en: "The account accepts traffic from all networks, so no firewall rule blocks the portal; the problem comes from the masked partition key.", fr: "Le compte accepte le trafic de tous les réseaux : aucune règle de pare-feu ne bloque le portail ; le problème vient de la clé de partition masquée." }
        d: { en: "A partially masked partition key is still masked, so the document view stays unavailable.", fr: "Une clé de partition partiellement masquée reste masquée : la vue des documents reste indisponible." }
    references:
      - title: Dynamic Data Masking (DDM) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/dynamic-data-masking

  # ------------------------------------------------------------------ 5
  - id: dp420-qz-21-05
    objective: "2.1.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        An application named **OrdersSync** connects to an Azure Cosmos DB for NoSQL account named **northwind-sales** with the primary read-write key. Key-based authentication is enabled, and no other application uses the account keys. The security team plans a key rotation now and the move to Microsoft Entra ID next year.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Une application nommée **OrdersSync** se connecte à un compte Azure Cosmos DB for NoSQL nommé **northwind-sales** avec la clé primaire en lecture-écriture. L'authentification par clé est activée, et aucune autre application n'utilise les clés du compte. L'équipe de sécurité prévoit une rotation des clés maintenant et le passage à Microsoft Entra ID l'année prochaine.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "Regenerating the secondary key doesn't interrupt OrdersSync."
            fr: "La régénération de la clé secondaire n'interrompt pas OrdersSync."
        - id: s2
          text:
            en: "A key regeneration completes in less than one minute, whatever the size of the account."
            fr: "Une régénération de clé se termine en moins d'une minute, quelle que soit la taille du compte."
        - id: s3
          text:
            en: "To set disableLocalAuth to true next year, you need an Azure role that includes Microsoft.DocumentDb/databaseAccounts/*/write."
            fr: "Pour définir disableLocalAuth sur true l'année prochaine, vous avez besoin d'un rôle Azure qui inclut Microsoft.DocumentDb/databaseAccounts/*/write."
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          Primary and secondary keys are independent, which is why the rotation procedure for an application on the primary key starts by regenerating the secondary key. Regeneration can take from about one minute to several hours depending on the size of the account. `disableLocalAuth` is an account property, and changing the account requires `Microsoft.DocumentDb/databaseAccounts/*/write`.
        fr: |
          Les clés primaire et secondaire sont indépendantes : c'est pourquoi la procédure de rotation pour une application qui utilise la clé primaire commence par la régénération de la clé secondaire. La régénération peut prendre d'environ une minute à plusieurs heures selon la taille du compte. `disableLocalAuth` est une propriété du compte, et modifier le compte exige `Microsoft.DocumentDb/databaseAccounts/*/write`.
      options:
        s2: { en: "Learn states that regeneration can take from one minute to multiple hours on large accounts, so validate the new key before you switch the application.", fr: "Learn indique que la régénération peut prendre d'une minute à plusieurs heures sur les grands comptes : validez la nouvelle clé avant de basculer l'application." }
    references:
      - title: Rotate keys - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-rotate-keys
      - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control

  # ------------------------------------------------------------------ 6
  - id: dp420-qz-21-06
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure Cosmos DB for NoSQL account named **contoso-erp** that contains the databases **finance** and **hr**. Several legacy applications still use the account keys, so key-based authentication must stay enabled.

        A new reporting job runs in Azure Container Apps with a system-assigned managed identity. It must run point reads and queries against the **invoices** container of the finance database and must not read any other container. Security policy forbids storing any secret for the job, including in Azure Key Vault.

        What should you do?
      fr: |
        Contoso dispose d'un compte Azure Cosmos DB for NoSQL nommé **contoso-erp** qui contient les bases de données **finance** et **hr**. Plusieurs applications héritées utilisent encore les clés du compte : l'authentification par clé doit donc rester activée.

        Un nouveau travail de reporting s'exécute dans Azure Container Apps avec une identité managée affectée par le système. Il doit exécuter des lectures ponctuelles et des requêtes sur le conteneur **invoices** de la base de données finance et ne doit lire aucun autre conteneur. La stratégie de sécurité interdit de stocker un secret pour ce travail, y compris dans Azure Key Vault.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Store the secondary read-only key in Key Vault, and have the job read it with its managed identity at startup.", fr: "Stocker la clé secondaire en lecture seule dans Key Vault, et laisser le travail la lire avec son identité managée au démarrage." } }
        - { id: b, text: { en: "Assign the Cosmos DB Account Reader Role on contoso-erp to the managed identity, and use DefaultAzureCredential.", fr: "Attribuer le rôle Cosmos DB Account Reader Role sur contoso-erp à l'identité managée, et utiliser DefaultAzureCredential." } }
        - { id: c, text: { en: "Assign Cosmos DB Built-in Data Reader at the scope / to the managed identity, and use DefaultAzureCredential.", fr: "Attribuer Cosmos DB Built-in Data Reader à l'étendue / à l'identité managée, et utiliser DefaultAzureCredential." } }
        - { id: d, text: { en: "Assign Cosmos DB Built-in Data Reader at the scope /dbs/finance/colls/invoices to the managed identity, and use DefaultAzureCredential.", fr: "Attribuer Cosmos DB Built-in Data Reader à l'étendue /dbs/finance/colls/invoices à l'identité managée, et utiliser DefaultAzureCredential." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A managed identity with `DefaultAzureCredential` gives keyless Microsoft Entra authentication, with nothing to store. Built-in Data Reader contains `readMetadata`, `items/read`, `executeQuery` and `readChangeFeed`, which covers point reads and queries, and the container scope `/dbs/finance/colls/invoices` keeps the job out of every other container. This works even though key-based authentication stays enabled for the legacy applications.
        fr: |
          Une identité managée avec `DefaultAzureCredential` fournit une authentification Microsoft Entra sans clé, sans rien à stocker. Built-in Data Reader contient `readMetadata`, `items/read`, `executeQuery` et `readChangeFeed`, ce qui couvre les lectures ponctuelles et les requêtes, et l'étendue de conteneur `/dbs/finance/colls/invoices` tient le travail à l'écart de tous les autres conteneurs. Cela fonctionne même si l'authentification par clé reste activée pour les applications héritées.
      options:
        a: { en: "A read-only key is a secret, which the policy forbids even in Key Vault, and it isn't scoped to a container: it reads every container, including hr.", fr: "Une clé en lecture seule est un secret, interdit par la stratégie même dans Key Vault, et elle n'est pas limitée à un conteneur : elle lit tous les conteneurs, y compris ceux de hr." }
        b: { en: "Cosmos DB Account Reader Role is a control plane role: it gives no Microsoft Entra data access, only account metadata and the read-only keys.", fr: "Cosmos DB Account Reader Role est un rôle du plan de contrôle : il ne donne aucun accès aux données par Microsoft Entra, seulement les métadonnées du compte et les clés en lecture seule." }
        c: { en: "The scope / covers every database and container of the account, so the job could read hr.", fr: "L'étendue / couvre toutes les bases de données et tous les conteneurs du compte : le travail pourrait lire hr." }
    references:
      - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
      - title: Data plane security reference - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security

  # ------------------------------------------------------------------ 7
  - id: dp420-qz-21-07
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        At Woodgrove Bank, a platform engineer must create and remove native data plane role assignments on an Azure Cosmos DB for NoSQL account named **woodgrove-ledger**, so that application identities get access to their containers. The engineer must not be able to list the account keys or the connection strings, and must not change the account settings.

        The solution must follow the principle of least privilege. Which role should you assign to the engineer?
      fr: |
        Chez Woodgrove Bank, un ingénieur de plateforme doit créer et supprimer des attributions de rôles natives du plan de données sur un compte Azure Cosmos DB for NoSQL nommé **woodgrove-ledger**, pour que des identités d'application obtiennent l'accès à leurs conteneurs. L'ingénieur ne doit pas pouvoir lister les clés du compte ni les chaînes de connexion, et ne doit pas modifier les paramètres du compte.

        La solution doit respecter le principe du moindre privilège. Quel rôle devez-vous attribuer à l'ingénieur ?
    body:
      options:
        - { id: a, text: { en: "The Cosmos DB Operator built-in role, assigned on the account", fr: "Le rôle intégré Cosmos DB Operator, attribué sur le compte" } }
        - { id: b, text: { en: "The User Access Administrator built-in role, assigned on the account", fr: "Le rôle intégré User Access Administrator, attribué sur le compte" } }
        - { id: c, text: { en: "A custom Azure role with sqlRoleDefinitions/read and sqlRoleAssignments/*, assigned on the account", fr: "Un rôle Azure personnalisé avec sqlRoleDefinitions/read et sqlRoleAssignments/*, attribué sur le compte" } }
        - { id: d, text: { en: "The DocumentDB Account Contributor built-in role, assigned on the account", fr: "Le rôle intégré DocumentDB Account Contributor, attribué sur le compte" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Data plane role definitions and assignments are resources of the account, managed through the control plane. Creating an assignment needs `sqlRoleDefinitions/read`, `sqlRoleAssignments/read` and `sqlRoleAssignments/write` (and removing one needs `sqlRoleAssignments/delete`). A custom Azure role limited to these actions under `Microsoft.DocumentDB/databaseAccounts/` grants nothing else: no keys, no connection strings, no account changes.
        fr: |
          Les définitions et attributions de rôles du plan de données sont des ressources du compte, gérées par le plan de contrôle. Créer une attribution exige `sqlRoleDefinitions/read`, `sqlRoleAssignments/read` et `sqlRoleAssignments/write` (et en supprimer une exige `sqlRoleAssignments/delete`). Un rôle Azure personnalisé limité à ces actions sous `Microsoft.DocumentDB/databaseAccounts/` n'accorde rien d'autre : ni clés, ni chaînes de connexion, ni modification du compte.
      options:
        a: { en: "Cosmos DB Operator excludes writing and deleting data plane role assignments in its NotActions, and it can change account settings.", fr: "Cosmos DB Operator exclut l'écriture et la suppression des attributions de rôles du plan de données dans ses NotActions, et il peut modifier les paramètres du compte." }
        b: { en: "User Access Administrator manages Azure RBAC assignments (Microsoft.Authorization), not the native sqlRoleAssignments of Azure Cosmos DB.", fr: "User Access Administrator gère les attributions Azure RBAC (Microsoft.Authorization), pas les sqlRoleAssignments natives d'Azure Cosmos DB." }
        d: { en: "DocumentDB Account Contributor has databaseAccounts/* with no NotActions: it can list keys and change the account, which breaks the requirements.", fr: "DocumentDB Account Contributor a databaseAccounts/* sans NotActions : il peut lister les clés et modifier le compte, ce qui enfreint les exigences." }
    references:
      - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
      - title: Azure built-in roles for Databases - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/databases

  # ------------------------------------------------------------------ 8
  - id: dp420-qz-21-08
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin has an Azure Cosmos DB for NoSQL account named **tailspin-pay** in West Europe. Public network access is set to **Disabled**, and applications in a virtual network named **vnet-hub** reach the account through a private endpoint. Tailspin uses its own DNS servers: the private endpoint has no private DNS zone group, and the administrators created the DNS records manually.

        You add North Europe as a read region of tailspin-pay. Applications in vnet-hub that prefer North Europe must reach that region through the private endpoint.

        What should you do?
      fr: |
        Tailspin dispose d'un compte Azure Cosmos DB for NoSQL nommé **tailspin-pay** en Europe Ouest. L'accès réseau public est défini sur **Disabled**, et les applications d'un réseau virtuel nommé **vnet-hub** accèdent au compte par un point de terminaison privé. Tailspin utilise ses propres serveurs DNS : le point de terminaison privé n'a pas de groupe de zones DNS privées, et les administrateurs ont créé les enregistrements DNS manuellement.

        Vous ajoutez Europe Nord comme région de lecture de tailspin-pay. Les applications de vnet-hub qui privilégient Europe Nord doivent joindre cette région par le point de terminaison privé.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable the Microsoft.AzureCosmosDB service endpoint on the subnet of the private endpoint.", fr: "Activer le point de terminaison de service Microsoft.AzureCosmosDB sur le sous-réseau du point de terminaison privé." } }
        - { id: b, text: { en: "Create a second private endpoint with the Sql subresource for the North Europe region.", fr: "Créer un second point de terminaison privé avec la sous-ressource Sql pour la région Europe Nord." } }
        - { id: c, text: { en: "Nothing: Azure Cosmos DB adds the record for the new region to your DNS servers.", fr: "Rien : Azure Cosmos DB ajoute l'enregistrement de la nouvelle région à vos serveurs DNS." } }
        - { id: d, text: { en: "Add a DNS record that resolves the account's North Europe endpoint to its new private IP.", fr: "Ajouter un enregistrement DNS qui résout le point de terminaison Europe Nord du compte vers sa nouvelle adresse IP privée." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A private endpoint reserves one private IP for the global endpoint and one for each region of the account. With a private DNS zone group, the zone follows region changes automatically; with custom DNS, you must create a record for every reserved IP yourself, including the one for a newly added region. DNS resolution decides whether traffic uses the private endpoint.
        fr: |
          Un point de terminaison privé réserve une adresse IP privée pour le point de terminaison global et une pour chaque région du compte. Avec un groupe de zones DNS privées, la zone suit automatiquement les changements de régions ; avec un DNS personnalisé, vous devez créer vous-même un enregistrement pour chaque adresse IP réservée, y compris celle d'une région nouvellement ajoutée. C'est la résolution DNS qui décide si le trafic passe par le point de terminaison privé.
      options:
        a: { en: "A service endpoint sends traffic to the public endpoint, which public network access set to Disabled blocks; it does nothing for private endpoint resolution.", fr: "Un point de terminaison de service envoie le trafic vers le point de terminaison public, que l'accès réseau public défini sur Disabled bloque ; il ne joue aucun rôle dans la résolution du point de terminaison privé." }
        b: { en: "The Sql subresource already covers every region of the account through the existing endpoint; the missing piece is the DNS record, which a second endpoint would need as well.", fr: "La sous-ressource Sql couvre déjà toutes les régions du compte par le point de terminaison existant ; ce qui manque est l'enregistrement DNS, dont un second point de terminaison aurait aussi besoin." }
        c: { en: "Automatic updates apply only to a private DNS zone linked through a zone group; with custom DNS, you add and remove the records yourself.", fr: "Les mises à jour automatiques ne concernent qu'une zone DNS privée liée par un groupe de zones ; avec un DNS personnalisé, vous ajoutez et supprimez vous-même les enregistrements." }
    references:
      - title: Configure Azure Private Link - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints

  # ------------------------------------------------------------------ 9
  - id: dp420-qz-21-09
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam enabled dynamic data masking on an Azure Cosmos DB for NoSQL account named **fabrikam-claims** and applied a masking policy to the **claims** container. The applications authenticate with Microsoft Entra ID, and analysts don't have the `items/unmask` data action. The team now reviews its plans for the account.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a activé le masquage dynamique des données sur un compte Azure Cosmos DB for NoSQL nommé **fabrikam-claims** et a appliqué une stratégie de masquage au conteneur **claims**. Les applications s'authentifient avec Microsoft Entra ID, et les analystes n'ont pas l'action de données `items/unmask`. L'équipe passe maintenant en revue ses projets pour le compte.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Enabling the feature rewrote the stored values of the masked paths, so the backups now contain masked data.", fr: "L'activation de la fonctionnalité a réécrit les valeurs stockées des chemins masqués : les sauvegardes contiennent donc désormais des données masquées." } }
        - { id: b, text: { en: "Mirroring fabrikam-claims to Microsoft Fabric isn't supported by default now that the feature is enabled.", fr: "La mise en miroir de fabrikam-claims dans Microsoft Fabric n'est pas prise en charge par défaut maintenant que la fonctionnalité est activée." } }
        - { id: c, text: { en: "A MaskSubstring entry with a startPosition of -4 masks the last four characters of each value.", fr: "Une entrée MaskSubstring avec un startPosition de -4 masque les quatre derniers caractères de chaque valeur." } }
        - { id: d, text: { en: "Removing every path from the masking policy stops the masking, although the feature stays enabled on the account.", fr: "Retirer tous les chemins de la stratégie de masquage arrête le masquage, bien que la fonctionnalité reste activée sur le compte." } }
        - { id: e, text: { en: "Analysts can't infer masked values with complex queries, because filters on masked paths compare the masked values.", fr: "Les analystes ne peuvent pas déduire de valeurs masquées par des requêtes complexes, car les filtres sur les chemins masqués comparent les valeurs masquées." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Fabric mirroring and the analytical store aren't supported by default on an account with dynamic data masking; Microsoft Support must enable them. The feature itself can't be turned off once enabled, but removing all paths from a container's masking policy stops masking for that container.
        fr: |
          La mise en miroir Fabric et le magasin analytique ne sont pas pris en charge par défaut sur un compte avec masquage dynamique des données ; le support Microsoft doit les activer. La fonctionnalité elle-même ne peut plus être désactivée une fois activée, mais retirer tous les chemins de la stratégie de masquage d'un conteneur arrête le masquage pour ce conteneur.
      options:
        a: { en: "Masking happens at query time: the stored data is unchanged, and backups (periodic or continuous) contain the original values.", fr: "Le masquage a lieu au moment de la requête : les données stockées sont inchangées, et les sauvegardes (périodiques ou continues) contiennent les valeurs d'origine." }
        c: { en: "MaskSubstring supports only positive start positions; there is no negative offset from the end of the value.", fr: "MaskSubstring ne prend en charge que des positions de départ positives ; il n'existe pas de décalage négatif depuis la fin de la valeur." }
        e: { en: "Learn warns the opposite: complex queries can expose or let users infer sensitive values, so DDM doesn't replace access restrictions.", fr: "Learn avertit du contraire : des requêtes complexes peuvent exposer des valeurs sensibles ou permettre de les déduire ; DDM ne remplace donc pas les restrictions d'accès." }
    references:
      - title: Dynamic Data Masking (DDM) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/dynamic-data-masking

  # ------------------------------------------------------------------ 10
  - id: dp420-qz-21-10
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso enabled dynamic data masking on an Azure Cosmos DB for NoSQL account named **contoso-claims**. The masking policy of the **claims** container in the database **claimsdb** masks the policyholder details.

        A fraud-scoring service will use the change feed processor of the .NET SDK with Microsoft Entra authentication. It reads the change feed of claims and stores its leases in the **leases** container of the same database, which has no masking policy. The service is allowed to see original values, but it must not create, change or delete items in claims, and it must not access any other container.

        You created a custom data plane role whose ID is stored in `$readUnmaskRoleId`. Its data actions are `readMetadata`, `items/read`, `executeQuery`, `readChangeFeed` and `items/unmask`.

        You need to grant the access to the managed identity of the service by following the principle of least privilege. How should you complete the commands? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso a activé le masquage dynamique des données sur un compte Azure Cosmos DB for NoSQL nommé **contoso-claims**. La stratégie de masquage du conteneur **claims** de la base de données **claimsdb** masque les informations des assurés.

        Un service d'évaluation des fraudes utilisera le processeur de flux de modification du SDK .NET avec l'authentification Microsoft Entra. Il lit le flux de modification de claims et stocke ses baux dans le conteneur **leases** de la même base de données, qui n'a pas de stratégie de masquage. Le service est autorisé à voir les valeurs d'origine, mais il ne doit pas créer, modifier ni supprimer d'éléments dans claims, et il ne doit accéder à aucun autre conteneur.

        Vous avez créé un rôle personnalisé du plan de données dont l'ID est stocké dans `$readUnmaskRoleId`. Ses actions de données sont `readMetadata`, `items/read`, `executeQuery`, `readChangeFeed` et `items/unmask`.

        Vous devez accorder l'accès à l'identité managée du service en respectant le principe du moindre privilège. Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        # Monitored container
        az cosmosdb sql role assignment create \
          --account-name contoso-claims --resource-group rg-claims \
          --principal-id $principalId \
          --role-definition-id [[monRole]] \
          --scope [[monScope]]

        # Lease container
        az cosmosdb sql role assignment create \
          --account-name contoso-claims --resource-group rg-claims \
          --principal-id $principalId \
          --role-definition-id [[leaseRole]] \
          --scope "/dbs/claimsdb/colls/leases"
      slots:
        - id: monRole
          options:
            - { id: reader, text: "00000000-0000-0000-0000-000000000001" }
            - { id: contrib, text: "00000000-0000-0000-0000-000000000002" }
            - { id: custom, text: "$readUnmaskRoleId" }
        - id: monScope
          options:
            - { id: acct, text: "\"/\"" }
            - { id: db, text: "\"/dbs/claimsdb\"" }
            - { id: coll, text: "\"/dbs/claimsdb/colls/claims\"" }
        - id: leaseRole
          options:
            - { id: reader, text: "00000000-0000-0000-0000-000000000001" }
            - { id: contrib, text: "00000000-0000-0000-0000-000000000002" }
            - { id: custom, text: "$readUnmaskRoleId" }
    answer: { values: { monRole: custom, monScope: coll, leaseRole: contrib } }
    explanation:
      correct:
        en: |
          With dynamic data masking, the change feed (in either mode) isn't available to an identity without `items/unmask`, so Built-in Data Reader (`...001`) can't feed the processor; the custom role adds `items/unmask` without any write action, unlike Built-in Data Contributor (`...002`). Its scope is the claims container only. The processor creates, updates and deletes lease items, which requires write access to the leases container: Built-in Data Contributor at that container's scope.
        fr: |
          Avec le masquage dynamique des données, le flux de modification (dans l'un ou l'autre mode) n'est pas disponible pour une identité sans `items/unmask` : Built-in Data Reader (`...001`) ne peut donc pas alimenter le processeur ; le rôle personnalisé ajoute `items/unmask` sans aucune action d'écriture, contrairement à Built-in Data Contributor (`...002`). Son étendue est le seul conteneur claims. Le processeur crée, met à jour et supprime des éléments de bail, ce qui exige un accès en écriture au conteneur leases : Built-in Data Contributor à l'étendue de ce conteneur.
      options:
        monRole: { en: "Built-in Data Reader lacks items/unmask, so the change feed of the masked container is unavailable; Built-in Data Contributor would allow writes and deletes in claims.", fr: "Built-in Data Reader n'a pas items/unmask : le flux de modification du conteneur masqué est indisponible ; Built-in Data Contributor permettrait des écritures et des suppressions dans claims." }
        monScope: { en: "The scopes / and /dbs/claimsdb would extend unmasked read access to the other containers.", fr: "Les étendues / et /dbs/claimsdb étendraient l'accès en lecture non masqué aux autres conteneurs." }
        leaseRole: { en: "The lease container needs writes; neither Built-in Data Reader nor the custom role includes items/create, items/replace or items/delete.", fr: "Le conteneur de baux exige des écritures ; ni Built-in Data Reader ni le rôle personnalisé n'incluent items/create, items/replace ou items/delete." }
    references:
      - title: Dynamic Data Masking (DDM) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/dynamic-data-masking
      - title: Data plane security reference - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
