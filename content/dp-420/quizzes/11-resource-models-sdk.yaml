chapter: 11-resource-models-sdk
questions:
  # ------------------------------------------------------------------ 1
  - id: dp420-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum creates an Azure Cosmos DB for NoSQL account and keeps every default setting.

        Which consistency level applies to the reads of all the databases and containers of the account?
      fr: |
        Adatum crée un compte Azure Cosmos DB for NoSQL et conserve tous les paramètres par défaut.

        Quel niveau de cohérence s'applique aux lectures de toutes les bases de données et de tous les conteneurs du compte ?
    body:
      options:
        - { id: a, text: Strong }
        - { id: b, text: Bounded staleness }
        - { id: c, text: Session }
        - { id: d, text: Eventual }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Session is the default consistency level of an account. It's set at the account level and applies to every database and container: within a session, a client reads its own writes, at the cost of a single-replica read.
        fr: |
          Session est le niveau de cohérence par défaut d'un compte. Il est défini au niveau du compte et s'applique à toutes les bases de données et à tous les conteneurs : dans une session, un client lit ses propres écritures, au coût d'une lecture sur un seul réplica.
      options:
        a: { en: "Strong is the strongest level, but you must choose it explicitly; it isn't the default.", fr: "Strong est le niveau le plus fort, mais il faut le choisir explicitement ; ce n'est pas le niveau par défaut." }
        b: { en: "Bounded staleness must be selected explicitly, with its K versions and T seconds bounds.", fr: "Bounded staleness doit être sélectionné explicitement, avec ses limites de K versions et T secondes." }
        d: { en: "Eventual is the weakest level and must be selected explicitly; the default is stronger.", fr: "Eventual est le niveau le plus faible et doit être sélectionné explicitement ; le niveau par défaut est plus fort." }
    references:
      - title: Manage Consistency - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-consistency
      - title: Consistency level choices - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels

  # ------------------------------------------------------------------ 2
  - id: dp420-qz-11-02
    objective: "1.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam uses the .NET SDK to create a database named **retail** and a container named **orders**. The orders must be distributed across partitions by their `customerId` property.

        Where do you define the partition key path `/customerId`?
      fr: |
        Fabrikam utilise le SDK .NET pour créer une base de données nommée **retail** et un conteneur nommé **orders**. Les commandes doivent être réparties entre les partitions selon leur propriété `customerId`.

        Où définissez-vous le chemin de clé de partition `/customerId` ?
    body:
      options:
        - { id: a, text: { en: "In the ContainerProperties passed when the orders container is created", fr: "Dans les ContainerProperties passées à la création du conteneur orders" } }
        - { id: b, text: { en: "In the ThroughputProperties passed when the retail database is created", fr: "Dans les ThroughputProperties passées à la création de la base de données retail" } }
        - { id: c, text: { en: "In the CosmosClientOptions of the client that connects to the account", fr: "Dans les CosmosClientOptions du client qui se connecte au compte" } }
        - { id: d, text: { en: "In the PartitionKey argument of each CreateItemAsync call on orders", fr: "Dans l'argument PartitionKey de chaque appel CreateItemAsync sur orders" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The partition key path is a property of the container, defined when the container is created (for example `new ContainerProperties("orders", "/customerId")`). It can't be changed afterwards: a different path means a new container and a data move.
        fr: |
          Le chemin de clé de partition est une propriété du conteneur, définie à sa création (par exemple `new ContainerProperties("orders", "/customerId")`). Il ne peut plus changer ensuite : un autre chemin impose un nouveau conteneur et un déplacement des données.
      options:
        b: { en: "A database holds containers and can carry shared throughput, but it has no partition key: each container defines its own.", fr: "Une base de données contient des conteneurs et peut porter un débit partagé, mais elle n'a pas de clé de partition : chaque conteneur définit la sienne." }
        c: { en: "Client options control connectivity, regions and retries; they don't define how a container's data is partitioned.", fr: "Les options du client règlent la connectivité, les régions et les nouvelles tentatives ; elles ne définissent pas le partitionnement des données d'un conteneur." }
        d: { en: "The PartitionKey argument carries the partition key value of one item; the path that produces this value is defined on the container.", fr: "L'argument PartitionKey transmet la valeur de clé de partition d'un élément ; le chemin qui produit cette valeur est défini sur le conteneur." }
    references:
      - title: Partitioning and horizontal scaling - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview

  # ------------------------------------------------------------------ 3
  - id: dp420-qz-11-03
    objective: "1.1.3"
    difficulty: 2
    status: draft
    shuffle: false
    type: single
    stem:
      en: |
        Wingtip Toys has an Azure Cosmos DB for NoSQL container in a single-region account. The container uses autoscale throughput with a maximum (`Tmax`) of 10,000 RU/s.

        Between 02:00 and 03:00, the container receives no request at all. What throughput is billed for that hour?
      fr: |
        Wingtip Toys dispose d'un conteneur Azure Cosmos DB for NoSQL dans un compte monorégion. Le conteneur utilise un débit autoscale avec un maximum (`Tmax`) de 10 000 RU/s.

        Entre 02:00 et 03:00, le conteneur ne reçoit aucune requête. Quel débit est facturé pour cette heure ?
    body:
      options:
        - { id: a, text: "0 RU/s" }
        - { id: b, text: "100 RU/s" }
        - { id: c, text: { en: "1,000 RU/s", fr: "1 000 RU/s" } }
        - { id: d, text: { en: "10,000 RU/s", fr: "10 000 RU/s" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Autoscale scales between 0.1 × `Tmax` and `Tmax`, and each hour is billed at the highest throughput reached in that hour. When the container is idle, it stays at its floor of 10 % of `Tmax`: 1,000 RU/s for a maximum of 10,000 RU/s. Only serverless costs nothing when idle.
        fr: |
          L'autoscale varie entre 0,1 × `Tmax` et `Tmax`, et chaque heure est facturée au débit le plus élevé atteint pendant l'heure. Quand le conteneur est inactif, il reste à son plancher de 10 % de `Tmax` : 1 000 RU/s pour un maximum de 10 000 RU/s. Seul le serverless ne coûte rien au repos.
      options:
        a: { en: "Provisioned throughput, autoscale included, is never billed at zero; only a serverless account bills nothing when there's no request.", fr: "Le débit provisionné, autoscale compris, n'est jamais facturé à zéro ; seul un compte serverless ne facture rien en l'absence de requêtes." }
        b: { en: "100 RU/s is the floor of the smallest autoscale setting (Tmax 1,000 RU/s), not of a 10,000 RU/s maximum.", fr: "100 RU/s est le plancher du plus petit réglage autoscale (Tmax de 1 000 RU/s), pas celui d'un maximum de 10 000 RU/s." }
        d: { en: "Autoscale bills the highest RU/s reached in the hour, not Tmax: an idle container scales down to 10 % of Tmax.", fr: "L'autoscale facture le débit le plus élevé atteint dans l'heure, pas Tmax : un conteneur inactif redescend à 10 % de Tmax." }
    references:
      - title: How to Choose Between Manual and Autoscale - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-choose-offer
      - title: Create Containers and Databases with Autoscale Throughput - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale

  # ------------------------------------------------------------------ 4
  - id: dp420-qz-11-04
    objective: "1.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso runs a .NET worker that uses the Azure Cosmos DB .NET SDK v3 in Direct mode. The worker already keeps a single `CosmosClient` instance for its whole lifetime. It sends only a few requests per minute, and the host reports ephemeral port exhaustion, with more connections open than Gateway mode would use.

        You must keep Direct mode. What should you do?
      fr: |
        Contoso exécute un worker .NET qui utilise le SDK .NET v3 d'Azure Cosmos DB en mode direct. Le worker conserve déjà une seule instance de `CosmosClient` pendant toute sa durée de vie. Il n'envoie que quelques requêtes par minute, et l'hôte signale un épuisement des ports éphémères, avec plus de connexions ouvertes qu'en mode passerelle.

        Vous devez conserver le mode direct. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set PortReuseMode to PrivatePortPool and IdleTcpConnectionTimeout to one hour.", fr: "Définir PortReuseMode sur PrivatePortPool et IdleTcpConnectionTimeout sur une heure." } }
        - { id: b, text: { en: "Create a CosmosClient for each request and dispose of it after the response.", fr: "Créer un CosmosClient pour chaque requête et le libérer après la réponse." } }
        - { id: c, text: { en: "Set MaxRetryAttemptsOnRateLimitedRequests to 0 in the client options.", fr: "Définir MaxRetryAttemptsOnRateLimitedRequests sur 0 dans les options du client." } }
        - { id: d, text: { en: "Set AllowBulkExecution to true so that the SDK groups the requests.", fr: "Définir AllowBulkExecution sur true pour que le SDK regroupe les requêtes." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          For sparse traffic in Direct mode, the .NET performance guidance is to set `PortReuseMode` to `PrivatePortPool`, so that the SDK uses a small pool of ephemeral ports, and to set `IdleTcpConnectionTimeout` within the recommended range of 20 minutes to 24 hours. The singleton client is already in place, which is the first thing to check.
        fr: |
          Pour un trafic clairsemé en mode direct, les recommandations de performance .NET sont de définir `PortReuseMode` sur `PrivatePortPool`, pour que le SDK utilise un petit pool de ports éphémères, et de régler `IdleTcpConnectionTimeout` dans la plage recommandée de 20 minutes à 24 heures. Le client singleton est déjà en place, ce qui est la première vérification à faire.
      options:
        b: { en: "A client per request opens new connections every time: it makes port exhaustion and latency worse.", fr: "Un client par requête ouvre de nouvelles connexions à chaque fois : il aggrave l'épuisement des ports et la latence." }
        c: { en: "Retry settings only control how 429 responses are retried; they don't change how ports and TCP connections are used.", fr: "Les paramètres de nouvelles tentatives ne règlent que la reprise des réponses 429 ; ils ne changent pas l'usage des ports et des connexions TCP." }
        d: { en: "Bulk execution groups many concurrent operations for throughput; a worker sending a few requests per minute gains nothing and keeps its ports.", fr: "L'exécution en bloc regroupe de nombreuses opérations concurrentes pour le débit ; un worker qui envoie quelques requêtes par minute n'y gagne rien et garde ses ports." }
    references:
      - title: Performance Tips for .NET SDK V3 - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/performance-tips-dotnet-sdk-v3

  # ------------------------------------------------------------------ 5
  - id: dp420-qz-11-05
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware has an Azure Cosmos DB for NoSQL account with provisioned throughput. The account was created in 2023 without the free tier, and its containers use autoscale throughput. The team is reviewing the settings it can change on the account.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un compte Azure Cosmos DB for NoSQL avec débit provisionné. Le compte a été créé en 2023 sans le niveau gratuit, et ses conteneurs utilisent un débit autoscale. L'équipe passe en revue les paramètres qu'elle peut modifier sur le compte.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "To let each physical partition and each region scale independently, you enable dynamic scaling on the Features page of the account.", fr: "Pour que chaque partition physique et chaque région varient indépendamment, vous activez la mise à l'échelle dynamique dans la page Features du compte." }
        - id: s2
          text: { en: "You can turn on the free tier for this account so that its first 1,000 RU/s and 25 GB become free.", fr: "Vous pouvez activer le niveau gratuit sur ce compte pour que ses 1 000 premières RU/s et ses 25 premiers Go deviennent gratuits." }
        - id: s3
          text: { en: "After you enable priority-based execution, requests that don't specify a priority level run at High priority.", fr: "Après l'activation de l'exécution basée sur la priorité, les requêtes qui n'indiquent pas de niveau de priorité s'exécutent en priorité High." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Dynamic scaling is on by default only for accounts created after September 25, 2024; older accounts enable it on their Features page, and it applies to autoscale resources. The free tier can only be chosen when the account is created. Priority-based execution is also enabled on the Features page, and a request without a priority runs as High.
        fr: |
          La mise à l'échelle dynamique n'est activée par défaut que pour les comptes créés après le 25 septembre 2024 ; les comptes plus anciens l'activent dans leur page Features, et elle s'applique aux ressources autoscale. Le niveau gratuit ne peut être choisi qu'à la création du compte. L'exécution basée sur la priorité s'active aussi dans la page Features, et une requête sans priorité s'exécute en High.
      options:
        s2: { en: "Free tier can't be set after the account is created: Proseware would need a new account created with the free tier.", fr: "Le niveau gratuit ne peut pas être défini après la création du compte : Proseware devrait créer un nouveau compte avec le niveau gratuit." }
    references:
      - title: Create Containers and Databases with Autoscale Throughput - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale
      - title: Lifetime Free Tier - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/free-tier

  # ------------------------------------------------------------------ 6
  - id: dp420-qz-11-06
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders runs an order API on a container with 20,000 RU/s of manual throughput in Azure Cosmos DB for NoSQL. The API uses the .NET SDK v3 with the default client options. A nightly job also upserts about 2 million items into the same container.

        Azure Monitor shows that Normalized RU Consumption reaches 100 % for a few seconds several times per hour, and that about 3 % of the requests receive HTTP 429. The end-to-end latency of the API stays within its target, and the API logs no exception.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders exécute une API de commandes sur un conteneur Azure Cosmos DB for NoSQL doté de 20 000 RU/s de débit manuel. L'API utilise le SDK .NET v3 avec les options de client par défaut. Un traitement nocturne effectue aussi environ 2 millions d'upserts dans le même conteneur.

        Azure Monitor montre que Normalized RU Consumption atteint 100 % pendant quelques secondes plusieurs fois par heure, et qu'environ 3 % des requêtes reçoivent une réponse HTTP 429. La latence de bout en bout de l'API reste dans son objectif, et l'API ne journalise aucune exception.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "You should increase the throughput of the container, because Normalized RU Consumption reaches 100 %.", fr: "Vous devez augmenter le débit du conteneur, car Normalized RU Consumption atteint 100 %." }
        - id: s2
          text: { en: "The SDK retries the throttled requests before the API code receives a response.", fr: "Le SDK relance les requêtes limitées avant que le code de l'API reçoive une réponse." }
        - id: s3
          text: { en: "Setting EnableContentResponseOnWrite to false for the nightly upserts lowers the RU charge of each upsert.", fr: "Définir EnableContentResponseOnWrite sur false pour les upserts nocturnes réduit le coût en RU de chaque upsert." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Normalized RU Consumption is the highest utilization of any partition key range in the interval: 100 % only means that one range used all its RU/s during one second. With 1 to 5 % of 429 responses and acceptable latency, the RU/s are fully used, and no action is needed. The .NET SDK retries 429 responses automatically (9 attempts, up to 30 seconds of cumulative wait by default), which is why the API sees no exception. Turning off the content response saves network and client resources, not request units: the write itself costs the same.
        fr: |
          Normalized RU Consumption est l'utilisation la plus élevée d'une plage de clés de partition dans l'intervalle : 100 % signifie seulement qu'une plage a utilisé toutes ses RU/s pendant une seconde. Avec 1 à 5 % de réponses 429 et une latence acceptable, les RU/s sont pleinement utilisées et aucune action n'est nécessaire. Le SDK .NET relance automatiquement les réponses 429 (9 tentatives, jusqu'à 30 secondes d'attente cumulée par défaut), c'est pourquoi l'API ne voit aucune exception. Désactiver le contenu de la réponse économise le réseau et les ressources du client, pas les unités de requête : l'écriture elle-même coûte autant.
      options:
        s1: { en: "Learn calls a steady 1 to 5 % of 429 with acceptable latency a healthy sign of full utilization; raise RU/s when the 429 rate is above 5 % on several partition key ranges.", fr: "Learn considère qu'un taux stable de 1 à 5 % de 429 avec une latence acceptable est le signe sain d'une pleine utilisation ; augmentez les RU/s quand le taux de 429 dépasse 5 % sur plusieurs plages de clés de partition." }
        s3: { en: "To lower the write charge, index fewer paths or write smaller items; skipping the response body doesn't change the RU charge.", fr: "Pour réduire le coût des écritures, indexez moins de chemins ou écrivez des éléments plus petits ; ne pas renvoyer le corps de la réponse ne change pas le coût en RU." }
    references:
      - title: Monitor Normalized Request Units - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-normalized-request-units
      - title: Performance Tips for .NET SDK V3 - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/performance-tips-dotnet-sdk-v3

  # ------------------------------------------------------------------ 7
  - id: dp420-qz-11-07
    objective: "1.1.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware runs a latency-sensitive .NET 8 API on Azure Kubernetes Service (AKS). The API uses the Azure Cosmos DB .NET SDK v3 with the default `CosmosClientOptions` and connects to the public endpoint of an Azure Cosmos DB for NoSQL account; the account has no private endpoint. Outbound traffic from the cluster goes through Azure Firewall, which allows only TCP 443 to the account. Every data request of the API fails with HTTP 503 Service Unavailable.

        You need to fix the problem and keep the lowest request latency. The network team can add firewall rules but must open as few ports as possible.

        What should you do?
      fr: |
        Litware exécute une API .NET 8 sensible à la latence sur Azure Kubernetes Service (AKS). L'API utilise le SDK .NET v3 d'Azure Cosmos DB avec les `CosmosClientOptions` par défaut et se connecte au point de terminaison public d'un compte Azure Cosmos DB for NoSQL ; le compte n'a pas de point de terminaison privé. Le trafic sortant du cluster passe par Pare-feu Azure, qui n'autorise que TCP 443 vers le compte. Toutes les requêtes de données de l'API échouent avec HTTP 503 Service Unavailable.

        Vous devez corriger le problème en conservant la latence de requête la plus faible. L'équipe réseau peut ajouter des règles de pare-feu, mais doit ouvrir le moins de ports possible.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set ConnectionMode to Gateway in the client options, and keep the firewall rules unchanged.", fr: "Définir ConnectionMode sur Gateway dans les options du client, et conserver les règles de pare-feu." } }
        - { id: b, text: { en: "Allow outbound TCP 10000–20000 to the account, and keep the default connection mode.", fr: "Autoriser TCP 10000–20000 en sortie vers le compte, et conserver le mode de connexion par défaut." } }
        - { id: c, text: { en: "Allow outbound TCP 0–65535 to the account, and keep the default connection mode.", fr: "Autoriser TCP 0–65535 en sortie vers le compte, et conserver le mode de connexion par défaut." } }
        - { id: d, text: { en: "Set LimitToEndpoint to true in the client options, and keep the firewall rules unchanged.", fr: "Définir LimitToEndpoint sur true dans les options du client, et conserver les règles de pare-feu." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The .NET SDK v3 uses Direct mode (TCP) by default, which gives the lowest latency. Against a public endpoint, Direct mode needs the TCP ports 10000 to 20000 in addition to the gateway port; when they're blocked, requests fail with 503 Service Unavailable. Opening this range keeps Direct mode with the fewest extra ports.
        fr: |
          Le SDK .NET v3 utilise par défaut le mode direct (TCP), qui donne la latence la plus faible. Vers un point de terminaison public, le mode direct a besoin des ports TCP 10000 à 20000 en plus du port de la passerelle ; s'ils sont bloqués, les requêtes échouent avec 503 Service Unavailable. Ouvrir cette plage conserve le mode direct avec le moins de ports supplémentaires.
      options:
        a: { en: "Gateway mode works over HTTPS 443, but it adds a hop through the gateway: it doesn't meet the lowest latency requirement when the ports can be opened.", fr: "Le mode passerelle fonctionne en HTTPS 443, mais il ajoute un saut par la passerelle : il ne respecte pas l'exigence de latence la plus faible quand les ports peuvent être ouverts." }
        c: { en: "The full range 0–65535 is what Direct mode needs with private endpoints; with the public endpoint it opens far more ports than needed.", fr: "La plage complète 0–65535 est celle qu'exige le mode direct avec des points de terminaison privés ; avec le point de terminaison public, elle ouvre bien plus de ports que nécessaire." }
        d: { en: "LimitToEndpoint only stops the SDK from discovering the other regions of the account; Direct mode still needs its TCP ports.", fr: "LimitToEndpoint empêche seulement le SDK de découvrir les autres régions du compte ; le mode direct a toujours besoin de ses ports TCP." }
    references:
      - title: SQL SDK Connectivity Modes - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/sdk-connection-modes

  # ------------------------------------------------------------------ 8
  - id: dp420-qz-11-08
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys deploys a new environment of a .NET API. A Bicep template creates the Azure Cosmos DB for NoSQL account with `disableLocalAuth` set to `true`, and the API's managed identity is assigned the Cosmos DB Built-in Data Contributor role at the account scope (`/`). At startup, the API calls `CreateDatabaseIfNotExistsAsync` and `CreateContainerIfNotExistsAsync`. In the new environment, both calls are rejected.

        The API must keep authenticating with Microsoft Entra ID only, and its identity must not receive any control plane permission.

        What should you do?
      fr: |
        Tailspin Toys déploie un nouvel environnement d'une API .NET. Un modèle Bicep crée le compte Azure Cosmos DB for NoSQL avec `disableLocalAuth` défini sur `true`, et l'identité managée de l'API reçoit le rôle Cosmos DB Built-in Data Contributor à l'étendue du compte (`/`). Au démarrage, l'API appelle `CreateDatabaseIfNotExistsAsync` et `CreateContainerIfNotExistsAsync`. Dans le nouvel environnement, les deux appels sont rejetés.

        L'API doit continuer à s'authentifier uniquement avec Microsoft Entra ID, et son identité ne doit recevoir aucune autorisation du plan de contrôle.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the Cosmos DB Operator role to the API's identity on the account, and keep the startup code.", fr: "Attribuer le rôle Cosmos DB Operator à l'identité de l'API sur le compte, et conserver le code de démarrage." } }
        - { id: b, text: { en: "Create the database and container in the Bicep template, and call GetDatabase and GetContainer at startup.", fr: "Créer la base de données et le conteneur dans le modèle Bicep, et appeler GetDatabase et GetContainer au démarrage." } }
        - { id: c, text: { en: "Assign the Data Contributor role again at the database scope (/dbs/<name>), and keep the startup code.", fr: "Attribuer de nouveau le rôle Data Contributor à l'étendue de la base de données (/dbs/<name>), et conserver le code de démarrage." } }
        - { id: d, text: { en: "Turn key-based authentication back on, and use the account key only in the code that creates resources.", fr: "Réactiver l'authentification par clé, et n'utiliser la clé du compte que dans le code qui crée les ressources." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Creating databases and containers is a control plane operation: the data plane roles, Built-in Data Contributor included, cover metadata reads, items, queries and the change feed, not resource creation. Pre-provisioning the database and container through Azure Resource Manager (Bicep) keeps the API's identity on the data plane, and `GetDatabase` and `GetContainer` only build references, with no call to the service.
        fr: |
          Créer des bases de données et des conteneurs est une opération du plan de contrôle : les rôles du plan de données, Built-in Data Contributor compris, couvrent la lecture des métadonnées, les éléments, les requêtes et le flux de modification, pas la création de ressources. Provisionner à l'avance la base de données et le conteneur par Azure Resource Manager (Bicep) laisse l'identité de l'API sur le plan de données, et `GetDatabase` et `GetContainer` ne construisent que des références, sans appel au service.
      options:
        a: { en: "Cosmos DB Operator would let the identity create the resources, but it's a control plane role, which the requirements forbid.", fr: "Cosmos DB Operator permettrait à l'identité de créer les ressources, mais c'est un rôle du plan de contrôle, que les exigences interdisent." }
        c: { en: "A narrower scope of the same data role still grants no right to create databases or containers.", fr: "Une étendue plus étroite du même rôle de données n'accorde toujours aucun droit de créer des bases de données ou des conteneurs." }
        d: { en: "Turning keys back on breaks the requirement to authenticate with Microsoft Entra ID only.", fr: "Réactiver les clés enfreint l'exigence d'une authentification uniquement par Microsoft Entra ID." }
    references:
      - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/security/how-to-grant-data-plane-role-based-access

  # ------------------------------------------------------------------ 9
  - id: dp420-qz-11-09
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has an Azure Cosmos DB for NoSQL account with multi-region writes enabled in West Europe, North Europe and East US. A container named **payments** has 40,000 RU/s of manual throughput.

        Over the last month, the average of the highest normalized RU utilization of each hour was 80 %, and the busiest hours used the full 40,000 RU/s.

        You need to minimize the throughput cost of **payments** without lowering the capacity available at peak. What should you do?
      fr: |
        Woodgrove Bank dispose d'un compte Azure Cosmos DB for NoSQL avec les écritures multirégions activées en West Europe, North Europe et East US. Un conteneur nommé **payments** dispose de 40 000 RU/s de débit manuel.

        Le mois dernier, la moyenne de l'utilisation normalisée de RU la plus élevée de chaque heure était de 80 %, et les heures les plus chargées ont utilisé la totalité des 40 000 RU/s.

        Vous devez réduire au minimum le coût du débit de **payments** sans diminuer la capacité disponible en pointe. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep 40,000 RU/s of manual throughput, because the average utilization is above 66 %.", fr: "Conserver 40 000 RU/s de débit manuel, car l'utilisation moyenne dépasse 66 %." } }
        - { id: b, text: { en: "Switch the container to autoscale throughput with a maximum of 40,000 RU/s.", fr: "Passer le conteneur en débit autoscale avec un maximum de 40 000 RU/s." } }
        - { id: c, text: { en: "Lower the manual throughput to 32,000 RU/s, which matches the average utilization.", fr: "Réduire le débit manuel à 32 000 RU/s, ce qui correspond à l'utilisation moyenne." } }
        - { id: d, text: { en: "Move the container to a new serverless account that has the same three regions.", fr: "Déplacer le conteneur vers un nouveau compte serverless doté des trois mêmes régions." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The 66 % rule comes from the 1.5× autoscale rate of single-write-region accounts. With multi-region writes, the autoscale rate per 100 RU/s is the same as the manual rate, so autoscale never costs more: each hour is billed at the RU/s actually reached, between 4,000 and 40,000 RU/s. Learn recommends autoscale for multi-region write accounts with more than one region, and a maximum of 40,000 RU/s keeps the peak capacity.
        fr: |
          La règle des 66 % vient du tarif autoscale de 1,5 fois le tarif manuel des comptes à une seule région d'écriture. Avec des écritures multirégions, le tarif autoscale pour 100 RU/s est le même que le tarif manuel : l'autoscale ne coûte donc jamais plus cher, et chaque heure est facturée aux RU/s réellement atteintes, entre 4 000 et 40 000 RU/s. Learn recommande l'autoscale pour les comptes à écritures multirégions comptant plus d'une région, et un maximum de 40 000 RU/s conserve la capacité de pointe.
      options:
        a: { en: "The 66 % threshold applies to single-write-region accounts; with multi-region writes at the same rate, manual throughput pays for unused RU/s every hour.", fr: "Le seuil de 66 % s'applique aux comptes à une seule région d'écriture ; avec des écritures multirégions au même tarif, le débit manuel paie chaque heure des RU/s inutilisées." }
        c: { en: "32,000 RU/s lowers the cost but also the peak capacity: the busiest hours need 40,000 RU/s and would be throttled.", fr: "32 000 RU/s réduit le coût, mais aussi la capacité de pointe : les heures les plus chargées ont besoin de 40 000 RU/s et seraient limitées." }
        d: { en: "A serverless account runs in a single region and can't add regions, so it can't keep the three write regions.", fr: "Un compte serverless fonctionne dans une seule région et ne peut pas en ajouter : il ne peut pas conserver les trois régions d'écriture." }
    references:
      - title: How to Choose Between Manual and Autoscale - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-choose-offer
      - title: Create Containers and Databases with Autoscale Throughput - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale

  # ------------------------------------------------------------------ 10
  - id: dp420-qz-11-10
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has an Azure Cosmos DB for NoSQL account with one write region, West Europe, and two read regions, North Europe and East US. Three .NET services, each with its own `CosmosClient`, read the same containers:

        - **Settlement**, in East US: its reads must never be more than 5 minutes behind the write region.
        - **Checkout**, in West Europe: a user must always read their own cart changes. Session affinity sends all the requests of a user to the same instance.
        - **Trends dashboard**: stale and out-of-order data is acceptable.

        Each service must use the weakest consistency level that meets its requirement, to minimize the read RU charge. The services can only set `ConsistencyLevel` in their `CosmosClientOptions`, and the account must keep its regions and single write region.

        How should you configure the consistency levels? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL avec une région d'écriture, West Europe, et deux régions de lecture, North Europe et East US. Trois services .NET, chacun avec son propre `CosmosClient`, lisent les mêmes conteneurs :

        - **Settlement**, en East US : ses lectures ne doivent jamais avoir plus de 5 minutes de retard sur la région d'écriture.
        - **Checkout**, en West Europe : un utilisateur doit toujours lire ses propres modifications de panier. L'affinité de session envoie toutes les requêtes d'un utilisateur à la même instance.
        - **Trends dashboard** : des données obsolètes et dans le désordre sont acceptables.

        Chaque service doit utiliser le niveau de cohérence le plus faible qui satisfait son exigence, afin de réduire au minimum le coût en RU des lectures. Les services ne peuvent définir que `ConsistencyLevel` dans leurs `CosmosClientOptions`, et le compte doit conserver ses régions et sa seule région d'écriture.

        Comment devez-vous configurer les niveaux de cohérence ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Default consistency level of the account: [[def]]
          ConsistencyLevel of the Checkout client: [[chk]]
          ConsistencyLevel of the Trends dashboard client: [[dash]]
        fr: |
          Niveau de cohérence par défaut du compte : [[def]]
          ConsistencyLevel du client de Checkout : [[chk]]
          ConsistencyLevel du client de Trends dashboard : [[dash]]
      slots:
        - id: def
          options:
            - { id: strong, text: Strong }
            - { id: bounded, text: BoundedStaleness }
            - { id: session, text: Session }
            - { id: prefix, text: ConsistentPrefix }
        - id: chk
          options:
            - { id: notset, text: { en: "Not set (account default)", fr: "Non défini (valeur du compte)" } }
            - { id: session, text: Session }
            - { id: prefix, text: ConsistentPrefix }
            - { id: eventual, text: Eventual }
        - id: dash
          options:
            - { id: notset, text: { en: "Not set (account default)", fr: "Non défini (valeur du compte)" } }
            - { id: session, text: Session }
            - { id: prefix, text: ConsistentPrefix }
            - { id: eventual, text: Eventual }
    answer:
      values: { def: bounded, chk: session, dash: eventual }
    explanation:
      correct:
        en: |
          `ConsistencyLevel` in the client options can only relax the account default, never strengthen it, so the default must be the strongest level that a service needs. Settlement needs a bound on staleness: Bounded staleness, whose minimum for a multi-region account is 100,000 writes or 300 seconds, meets the 5-minute limit and is weaker than Strong. Checkout relaxes to Session, which gives read-your-writes within the same client at single-replica cost; the dashboard relaxes to Eventual, the weakest level.
        fr: |
          `ConsistencyLevel` dans les options du client ne peut qu'assouplir le niveau par défaut du compte, jamais le renforcer : le niveau par défaut doit donc être le plus fort dont un service a besoin. Settlement a besoin d'une limite de retard : Bounded staleness, dont le minimum pour un compte multirégion est de 100 000 écritures ou 300 secondes, respecte la limite de 5 minutes et est plus faible que Strong. Checkout passe à Session, qui garantit la lecture de ses propres écritures avec le même client au coût d'un seul réplica ; le tableau de bord passe à Eventual, le niveau le plus faible.
      options:
        def: { en: "Strong also meets Settlement but is stronger than needed. Session or ConsistentPrefix can't be strengthened by Settlement's client to bound the lag.", fr: "Strong satisfait aussi Settlement, mais il est plus fort que nécessaire. Session ou ConsistentPrefix ne peuvent pas être renforcés par le client de Settlement pour limiter le retard." }
        chk: { en: "Without an override, Checkout reads at Bounded staleness and pays twice the read RU. ConsistentPrefix and Eventual don't guarantee that users read their own writes.", fr: "Sans valeur explicite, Checkout lit en Bounded staleness et paie deux fois les RU de lecture. ConsistentPrefix et Eventual ne garantissent pas qu'un utilisateur lise ses propres écritures." }
        dash: { en: "The dashboard has no ordering need: Eventual is weaker than ConsistentPrefix and Session, and the account default would double its read RU.", fr: "Le tableau de bord n'a aucun besoin d'ordre : Eventual est plus faible que ConsistentPrefix et Session, et le niveau du compte doublerait ses RU de lecture." }
    references:
      - title: Manage Consistency - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-consistency
      - title: Consistency level choices - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
