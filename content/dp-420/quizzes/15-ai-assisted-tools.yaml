        learn: { en: "The Learn MCP server returns documentation only: it has no access to the account, so it can't search the support articles.", fr: "Le serveur MCP Learn ne renvoie que de la documentation : il n'a aucun accès au compte et ne peut donc pas rechercher les articles de support." }
