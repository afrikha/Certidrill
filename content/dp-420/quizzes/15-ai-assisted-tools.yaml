  # ------------------------------------------------------------------ 9
  - id: dp420-qz-15-09
    objective: "1.5.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum deploys the Azure Cosmos DB MCP Toolkit to Azure Container Apps with the deployment script of the repository, so that a support agent in Microsoft Foundry can search knowledge articles stored in an Azure Cosmos DB for NoSQL account named **adatum-kb**. The toolkit is added to the Foundry project as a custom tool with Microsoft Entra ID authentication.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum déploie Azure Cosmos DB MCP Toolkit dans Azure Container Apps avec le script de déploiement du dépôt, pour qu'un agent de support dans Microsoft Foundry puisse rechercher des articles de connaissances stockés dans un compte Azure Cosmos DB for NoSQL nommé **adatum-kb**. Le toolkit est ajouté au projet Foundry comme outil personnalisé avec l'authentification Microsoft Entra ID.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The toolkit accepts a call only if its token was issued for the toolkit's Microsoft Entra app and the caller holds the Mcp.Tool.Executor role."
            fr: "Le toolkit n'accepte un appel que si son jeton a été émis pour l'application Microsoft Entra du toolkit et que l'appelant détient le rôle Mcp.Tool.Executor."
        - id: s2
          text:
            en: "The Container App authenticates to adatum-kb with an account key that the deployment stores as a Container Apps secret."
            fr: "L'application Container App s'authentifie auprès d'adatum-kb avec une clé de compte que le déploiement stocke comme secret Container Apps."
        - id: s3
          text:
            en: "A developer can also call the toolkit from GitHub Copilot in Visual Studio Code by configuring its MCP endpoint with a bearer token."
            fr: "Un développeur peut aussi appeler le toolkit depuis GitHub Copilot dans Visual Studio Code en configurant son point de terminaison MCP avec un jeton du porteur."
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          The toolkit exposes JWT-authenticated MCP endpoints: it validates that the token was issued for its Microsoft Entra app (audience) and that the caller has the `Mcp.Tool.Executor` role. To reach Azure Cosmos DB, the Container App uses its managed identity, which the deployment grants a data reader role, so no credential is stored. Besides Foundry, the toolkit can be added to Visual Studio Code as an MCP server whose URL is called with an `Authorization: Bearer` header.
        fr: |
          Le toolkit expose des points de terminaison MCP authentifiés par JWT : il vérifie que le jeton a été émis pour son application Microsoft Entra (audience) et que l'appelant a le rôle `Mcp.Tool.Executor`. Pour joindre Azure Cosmos DB, l'application Container App utilise son identité managée, à laquelle le déploiement attribue un rôle de lecteur de données : aucune information d'identification n'est stockée. En plus de Foundry, le toolkit peut être ajouté à Visual Studio Code comme serveur MCP dont l'URL est appelée avec un en-tête `Authorization: Bearer`.
      options:
        s2: { en: "The toolkit uses the Container App's managed identity with a data reader role on the account; no key or connection string is stored.", fr: "Le toolkit utilise l'identité managée de l'application Container App avec un rôle de lecteur de données sur le compte ; aucune clé ni chaîne de connexion n'est stockée." }
    references:
      - title: Model Context Protocol (MCP) Toolkit - Azure Cosmos DB for NoSQL
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/model-context-protocol-toolkit

  # ------------------------------------------------------------------ 10
  - id: dp420-qz-15-10
    objective: "1.5.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip deployed the Azure Cosmos DB MCP Toolkit to Azure Container Apps for an agent in Microsoft Foundry. The agent uses the toolkit against a container named **manuals** in an Azure Cosmos DB for NoSQL account. Each item of manuals stores a text chunk and its embedding in an `embedding` property, and the container has a vector embedding policy and a vector index on that path.

        The agent calls `list_collections`, `find_document_by_id` and `text_search` successfully. However, every `vector_search` call fails.

        What is the most likely cause?
      fr: |
        Wingtip a déployé Azure Cosmos DB MCP Toolkit dans Azure Container Apps pour un agent de Microsoft Foundry. L'agent utilise le toolkit sur un conteneur nommé **manuals** d'un compte Azure Cosmos DB for NoSQL. Chaque élément de manuals stocke un segment de texte et son incorporation dans une propriété `embedding`, et le conteneur a une stratégie d'incorporation vectorielle et un index vectoriel sur ce chemin.

        L'agent appelle `list_collections`, `find_document_by_id` et `text_search` avec succès. En revanche, chaque appel à `vector_search` échoue.

        Quelle est la cause la plus probable ?
    body:
      options:
        - { id: a, text: { en: "The managed identity of the Container App has no data plane role assignment on the account.", fr: "L'identité managée de l'application Container App n'a aucune attribution de rôle du plan de données sur le compte." } }
        - { id: b, text: { en: "The token that the Foundry agent sends doesn't include the Mcp.Tool.Executor role.", fr: "Le jeton envoyé par l'agent Foundry n'inclut pas le rôle Mcp.Tool.Executor." } }
        - { id: c, text: { en: "The toolkit has no Azure OpenAI embedding deployment, which its vector search requires.", fr: "Le toolkit n'a aucun déploiement d'incorporation Azure OpenAI, ce qu'exige sa recherche vectorielle." } }
        - { id: d, text: { en: "The Agent Kit isn't installed in the Foundry project, so the agent can't build vector queries.", fr: "Agent Kit n'est pas installé dans le projet Foundry : l'agent ne peut donc pas construire de requêtes vectorielles." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The toolkit's vector search has three prerequisites: embeddings stored in the documents, a vector indexing policy on the container, and an Azure OpenAI service with an embedding deployment. The first two are in place, and the tools that don't need embeddings work, so the missing Azure OpenAI embedding deployment is the only cause that affects `vector_search` alone.
        fr: |
          La recherche vectorielle du toolkit a trois prérequis : des incorporations stockées dans les documents, une stratégie d'indexation vectorielle sur le conteneur et un service Azure OpenAI avec un déploiement d'incorporation. Les deux premiers sont en place et les outils qui n'ont pas besoin d'incorporations fonctionnent : l'absence de déploiement d'incorporation Azure OpenAI est la seule cause qui touche uniquement `vector_search`.
      options:
        a: { en: "Without a data plane role, `find_document_by_id` and `text_search` would fail too, because every tool reads the account through that identity.", fr: "Sans rôle du plan de données, `find_document_by_id` et `text_search` échoueraient aussi, car chaque outil lit le compte au moyen de cette identité." }
        b: { en: "The role is checked for every call to the toolkit, so the other tools would be rejected as well.", fr: "Le rôle est vérifié à chaque appel au toolkit : les autres outils seraient donc également rejetés." }
        d: { en: "The Agent Kit gives guidance to coding assistants; the toolkit's tools don't depend on it, and it isn't installed in Foundry projects.", fr: "Agent Kit donne des recommandations aux assistants de codage ; les outils du toolkit n'en dépendent pas, et il ne s'installe pas dans les projets Foundry." }
    references:
      - title: Model Context Protocol (MCP) Toolkit - Azure Cosmos DB for NoSQL
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/model-context-protocol-toolkit
