chapter: 15-ai-assisted-tools
questions:
  # ------------------------------------------------------------------ 1
  - id: dp420-qz-15-01
    objective: "1.5.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The developers of Proseware want their AI coding assistants to follow Microsoft's recommendations when they write code for Azure Cosmos DB for NoSQL. A team lead suggests the Azure Cosmos DB Agent Kit.

        What does the Agent Kit provide?
      fr: |
        Les développeurs de Proseware veulent que leurs assistants de codage IA suivent les recommandations de Microsoft quand ils écrivent du code pour Azure Cosmos DB for NoSQL. Un responsable d'équipe propose Azure Cosmos DB Agent Kit.

        Que fournit Agent Kit ?
    body:
      options:
        - { id: a, text: { en: "An MCP server that runs read-only queries against Azure Cosmos DB containers for agents", fr: "Un serveur MCP qui exécute des requêtes en lecture seule sur des conteneurs Azure Cosmos DB pour des agents" } }
        - { id: b, text: { en: "Recommendations from Azure Advisor that analyze the configuration of the deployed account", fr: "Des recommandations d'Azure Advisor qui analysent la configuration du compte déployé" } }
        - { id: c, text: { en: "A collection of Agent Skills that compatible assistants load when a task needs them", fr: "Une collection de compétences d'agent (Agent Skills) que les assistants compatibles chargent quand une tâche en a besoin" } }
        - { id: d, text: { en: "An MCP server that lets assistants search and fetch the official Microsoft documentation", fr: "Un serveur MCP qui permet aux assistants de rechercher et de récupérer la documentation officielle de Microsoft" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Agent Kit is a collection of skills in the Agent Skills format, published in the `AzureCosmosDB/cosmosdb-agent-kit` repository. Its main skill, `cosmosdb-best-practices`, gives the assistant guidance on data modeling, partition keys, queries, SDK usage and other decisions, and a compatible host loads the relevant guidance on demand.
        fr: |
          Agent Kit est une collection de compétences au format Agent Skills, publiée dans le dépôt `AzureCosmosDB/cosmosdb-agent-kit`. Sa compétence principale, `cosmosdb-best-practices`, donne à l'assistant des recommandations sur la modélisation des données, les clés de partition, les requêtes, l'utilisation du SDK et d'autres décisions, et un hôte compatible charge les recommandations utiles à la demande.
      options:
        a: { en: "This describes the Azure Cosmos DB MCP Toolkit, a separate tool that gives agents data access; the Agent Kit never queries a database.", fr: "Cela décrit Azure Cosmos DB MCP Toolkit, un outil distinct qui donne un accès aux données à des agents ; Agent Kit n'interroge jamais de base de données." }
        b: { en: "Azure Advisor analyzes deployed resources; the Agent Kit works inside the coding assistant, from the code and documents you give it, without access to the account.", fr: "Azure Advisor analyse des ressources déployées ; Agent Kit travaille dans l'assistant de codage, à partir du code et des documents que vous lui donnez, sans accès au compte." }
        d: { en: "This describes the Microsoft Learn MCP server, which you can connect next to the kit; the kit itself is a set of skills, not a documentation server.", fr: "Cela décrit le serveur MCP Microsoft Learn, que vous pouvez connecter à côté du kit ; le kit lui-même est un ensemble de compétences, pas un serveur de documentation." }
    references:
      - title: Azure Cosmos DB Agent Kit overview - Azure Cosmos DB for NoSQL
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/overview

  # ------------------------------------------------------------------ 2
  - id: dp420-qz-15-02
    objective: "1.5.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You use GitHub Copilot CLI. In a Copilot CLI session, you ran `/plugin marketplace add AzureCosmosDB/cosmosdb-agent-kit`.

        Which command should you run next in the session to install the Azure Cosmos DB Agent Kit?
      fr: |
        Vous utilisez GitHub Copilot CLI. Dans une session Copilot CLI, vous avez exécuté `/plugin marketplace add AzureCosmosDB/cosmosdb-agent-kit`.

        Quelle commande devez-vous exécuter ensuite dans la session pour installer Azure Cosmos DB Agent Kit ?
    body:
      options:
        - { id: a, text: "`/plugin install cosmosdb@claude-plugins-official`" }
        - { id: b, text: "`/plugin install cosmosdb@cosmosdb-agent-kit`" }
        - { id: c, text: "`gemini extensions install https://github.com/AzureCosmosDB/cosmosdb-agent-kit`" }
        - { id: d, text: "`codex plugin marketplace add AzureCosmosDB/cosmosdb-agent-kit`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          GitHub Copilot CLI installs the kit through its plugin marketplace in two steps: `/plugin marketplace add AzureCosmosDB/cosmosdb-agent-kit`, then `/plugin install cosmosdb@cosmosdb-agent-kit`. The part after `@` names the marketplace you just added.
        fr: |
          GitHub Copilot CLI installe le kit par sa place de marché de plug-ins en deux étapes : `/plugin marketplace add AzureCosmosDB/cosmosdb-agent-kit`, puis `/plugin install cosmosdb@cosmosdb-agent-kit`. La partie après `@` désigne la place de marché que vous venez d'ajouter.
      options:
        a: { en: "This is the Claude Code command, which installs from Claude's official plugin marketplace, not from the marketplace you added in Copilot CLI.", fr: "C'est la commande de Claude Code, qui installe depuis la place de marché officielle de plug-ins de Claude, pas depuis la place de marché ajoutée dans Copilot CLI." }
        c: { en: "This command installs the kit as a Gemini CLI extension; it isn't a Copilot CLI command.", fr: "Cette commande installe le kit comme extension de Gemini CLI ; ce n'est pas une commande de Copilot CLI." }
        d: { en: "This is the first step for OpenAI Codex, run with the Codex CLI; it doesn't install anything in Copilot CLI.", fr: "C'est la première étape pour OpenAI Codex, exécutée avec Codex CLI ; elle n'installe rien dans Copilot CLI." }
    references:
      - title: Set up the Azure Cosmos DB Agent Kit - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/setup

  # ------------------------------------------------------------------ 3
  - id: dp420-qz-15-03
    objective: "1.5.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A developer at Northwind receives a new workstation and wants to add the Azure Cosmos DB Agent Kit to Cursor. She opens a terminal and runs `npx skills add AzureCosmosDB/cosmosdb-agent-kit`. The terminal returns `npx: command not found`.

        What should she do?
      fr: |
        Une développeuse de Northwind reçoit un nouveau poste de travail et veut ajouter Azure Cosmos DB Agent Kit à Cursor. Elle ouvre un terminal et exécute `npx skills add AzureCosmosDB/cosmosdb-agent-kit`. Le terminal renvoie `npx: command not found`.

        Que doit-elle faire ?
    body:
      options:
        - { id: a, text: { en: "Install the Azure CLI and sign in with az login, then run the same command again.", fr: "Installer Azure CLI et se connecter avec az login, puis exécuter de nouveau la même commande." } }
        - { id: b, text: { en: "Run /plugin install cosmosdb@claude-plugins-official in Cursor instead of the skills CLI.", fr: "Exécuter /plugin install cosmosdb@claude-plugins-official dans Cursor au lieu de la CLI des compétences." } }
        - { id: c, text: { en: "Install the .NET SDK so that the command can add the Azure Cosmos DB client package.", fr: "Installer le SDK .NET pour que la commande puisse ajouter le package client Azure Cosmos DB." } }
        - { id: d, text: { en: "Install Node.js with npm, open a new terminal, then run the same command again.", fr: "Installer Node.js avec npm, ouvrir un nouveau terminal, puis exécuter de nouveau la même commande." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The skills CLI runs through `npx`, which comes with Node.js and npm. The setup guide's fix for this symptom is to install Node.js with npm, then reopen the terminal so that it picks up the updated PATH.
        fr: |
          La CLI des compétences s'exécute avec `npx`, fourni avec Node.js et npm. Pour ce symptôme, le guide d'installation indique d'installer Node.js avec npm, puis de rouvrir le terminal pour qu'il prenne en compte le PATH mis à jour.
      options:
        a: { en: "No Azure subscription or sign-in is needed to install the skills; the Azure CLI doesn't provide npx.", fr: "Aucun abonnement Azure ni aucune connexion n'est nécessaire pour installer les compétences ; Azure CLI ne fournit pas npx." }
        b: { en: "That command is Claude Code's plugin method; Cursor uses the skills CLI or its own plugin instructions.", fr: "Cette commande est la méthode par plug-in de Claude Code ; Cursor utilise la CLI des compétences ou ses propres instructions de plug-in." }
        c: { en: "The command installs Agent Skills, not an SDK package, and the .NET SDK doesn't provide npx.", fr: "La commande installe des Agent Skills, pas un package SDK, et le SDK .NET ne fournit pas npx." }
    references:
      - title: Set up the Azure Cosmos DB Agent Kit - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/setup

  # ------------------------------------------------------------------ 4
  - id: dp420-qz-15-04
    objective: "1.5.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso is designing a multitenant SaaS application on Azure Cosmos DB for NoSQL. Some tenants are a hundred times larger than others. You plan to ask your AI coding assistant, which has the Azure Cosmos DB Agent Kit installed, to review the proposed partition key `/tenantId` before the first deployment.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso conçoit une application SaaS multilocataire sur Azure Cosmos DB for NoSQL. Certains locataires sont cent fois plus volumineux que d'autres. Vous prévoyez de demander à votre assistant de codage IA, où Azure Cosmos DB Agent Kit est installé, de revoir la clé de partition proposée `/tenantId` avant le premier déploiement.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "You should give the assistant the expected write rates and data growth of the tenants, including the size differences between them."
            fr: "Vous devez fournir à l'assistant les débits d'écriture et la croissance des données prévus pour les locataires, y compris les écarts de taille entre eux."
        - id: s2
          text:
            en: "For this review, the assistant needs the indexing policy and the query diagnostics rather than the common query filters."
            fr: "Pour cette revue, l'assistant a besoin de la stratégie d'indexation et des diagnostics de requête plutôt que des filtres de requête courants."
        - id: s3
          text:
            en: "You can include sample documents if you replace their sensitive values and keep their structure."
            fr: "Vous pouvez inclure des exemples de documents si vous remplacez leurs valeurs sensibles et conservez leur structure."
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          The partition key recipe asks for the proposed key, representative document shapes, common query filters, write rates, expected data growth and tenant-size differences, so that the assistant can evaluate cardinality, write distribution and hot-partition risks. Sample documents are welcome once credentials and sensitive values are replaced, as long as the structure needed for the review stays intact.
        fr: |
          La recette de revue de clé de partition demande la clé proposée, des formes de documents représentatives, les filtres de requête courants, les débits d'écriture, la croissance prévue des données et les écarts de taille entre locataires, pour que l'assistant évalue la cardinalité, la distribution des écritures et les risques de partition chaude. Les exemples de documents sont utiles une fois les informations d'identification et les valeurs sensibles remplacées, tant que la structure nécessaire à la revue est conservée.
      options:
        s2: { en: "The indexing policy and query diagnostics are the context of the query optimization recipe. A partition key review depends on the query filters, because they decide whether queries stay in one partition.", fr: "La stratégie d'indexation et les diagnostics de requête sont le contexte de la recette d'optimisation de requête. Une revue de clé de partition dépend des filtres de requête, car ils décident si les requêtes restent dans une seule partition." }
    references:
      - title: Use the Azure Cosmos DB Agent Kit - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/usage

  # ------------------------------------------------------------------ 5
  - id: dp420-qz-15-05
    objective: "1.5.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin stores its product catalog in an Azure Cosmos DB for NoSQL container named **products**. A second container, **productVectors**, stores an embedding of each product description for a shopping agent.

        Your AI coding assistant, which has the Azure Cosmos DB Agent Kit installed, proposes a design pattern so that an embedding is regenerated each time a product is created or updated. The applications that write to products must not change.

        Which Azure Cosmos DB feature should the design rely on?
      fr: |
        Tailspin stocke son catalogue de produits dans un conteneur Azure Cosmos DB for NoSQL nommé **products**. Un second conteneur, **productVectors**, stocke une incorporation de la description de chaque produit pour un agent d'achat.

        Votre assistant de codage IA, où Azure Cosmos DB Agent Kit est installé, propose un modèle de conception pour qu'une incorporation soit régénérée chaque fois qu'un produit est créé ou mis à jour. Les applications qui écrivent dans products ne doivent pas changer.

        Sur quelle fonctionnalité d'Azure Cosmos DB la conception doit-elle s'appuyer ?
    body:
      options:
        - { id: a, text: { en: "A transactional batch that writes the product and its embedding together", fr: "Un lot transactionnel qui écrit le produit et son incorporation ensemble" } }
        - { id: b, text: { en: "The change feed of products, read by a change feed processor", fr: "Le flux de modification de products, lu par un processeur de flux de modification" } }
        - { id: c, text: { en: "A time to live (TTL) setting on the productVectors container", fr: "Un paramètre de durée de vie (TTL) sur le conteneur productVectors" } }
        - { id: d, text: { en: "Continuous backup with point-in-time restore of the products container", fr: "La sauvegarde continue avec restauration à un instant dans le passé du conteneur products" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The change feed records every insert and update of a container, so a change feed processor can call the embedding model and update productVectors without any change to the writers. This is the data movement pattern of the change feed (keeping a derived container or index in sync), one of the design patterns the kit's guidance covers.
        fr: |
          Le flux de modification enregistre chaque insertion et chaque mise à jour d'un conteneur : un processeur de flux de modification peut donc appeler le modèle d'incorporation et mettre à jour productVectors sans aucune modification des applications qui écrivent. C'est le modèle de déplacement de données du flux de modification (garder synchronisé un conteneur ou un index dérivé), l'un des modèles de conception couverts par les recommandations du kit.
      options:
        a: { en: "A transactional batch works only within one logical partition of one container, and the writers would have to change to send it.", fr: "Un lot transactionnel ne fonctionne que dans une partition logique d'un seul conteneur, et les applications qui écrivent devraient changer pour l'envoyer." }
        c: { en: "TTL deletes items after a period; it never generates or refreshes embeddings.", fr: "La durée de vie (TTL) supprime des éléments après un délai ; elle ne génère ni ne met à jour jamais d'incorporations." }
        d: { en: "Point-in-time restore recovers data after an incident; it doesn't react to each write.", fr: "La restauration à un instant dans le passé récupère des données après un incident ; elle ne réagit pas à chaque écriture." }
    references:
      - title: Change Feed Design Patterns - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-design-patterns

  # ------------------------------------------------------------------ 6
  - id: dp420-qz-15-06
    objective: "1.5.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A developer at Fabrikam works on two repositories, **orders-api** and **billing-api**, that both use Azure Cosmos DB for NoSQL. She writes code with GitHub Copilot in Visual Studio Code, which supports Agent Skills.

        Last week, she ran `npx skills add AzureCosmosDB/cosmosdb-agent-kit` in orders-api and selected the project scope. When orders-api is open, Copilot's installed skills view lists `cosmosdb-best-practices`. When billing-api is open, the skill isn't listed, even after she reloads Visual Studio Code.

        The skill must be available in every repository that she opens, now and in the future, and the assistant's context must stay focused on the current task. What should she do?
      fr: |
        Une développeuse de Fabrikam travaille sur deux dépôts, **orders-api** et **billing-api**, qui utilisent tous deux Azure Cosmos DB for NoSQL. Elle écrit son code avec GitHub Copilot dans Visual Studio Code, qui prend en charge les Agent Skills.

        La semaine dernière, elle a exécuté `npx skills add AzureCosmosDB/cosmosdb-agent-kit` dans orders-api et a sélectionné l'étendue projet. Quand orders-api est ouvert, la vue des compétences installées de Copilot liste `cosmosdb-best-practices`. Quand billing-api est ouvert, la compétence n'est pas listée, même après le rechargement de Visual Studio Code.

        La compétence doit être disponible dans chaque dépôt qu'elle ouvre, maintenant et à l'avenir, et le contexte de l'assistant doit rester centré sur la tâche en cours. Que doit-elle faire ?
    body:
      options:
        - { id: a, text: { en: "Install the kit in billing-api through a plugin marketplace, so that the skills CLI and the plugin both provide the skill.", fr: "Installer le kit dans billing-api par une place de marché de plug-ins, pour que la CLI des compétences et le plug-in fournissent tous deux la compétence." } }
        - { id: b, text: { en: "Connect Copilot to the Microsoft Learn MCP server, so that it retrieves the rules of the kit from the documentation.", fr: "Connecter Copilot au serveur MCP Microsoft Learn, pour qu'il récupère les règles du kit dans la documentation." } }
        - { id: c, text: { en: "Run the skills CLI again with the user scope selected, then confirm that Copilot discovers the skill in that scope.", fr: "Exécuter de nouveau la CLI des compétences en sélectionnant l'étendue utilisateur, puis vérifier que Copilot détecte la compétence dans cette étendue." } }
        - { id: d, text: { en: "Compile all the rules of the kit into an AGENTS.md file at the root of billing-api, so that every prompt includes them.", fr: "Compiler toutes les règles du kit dans un fichier AGENTS.md à la racine de billing-api, pour que chaque prompt les inclue." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A project-level installation is discovered only in that project, which is why billing-api doesn't see the skill. Installing at the user scope makes the skill available in every workspace the developer opens, and the setup guidance says to confirm that the host discovers skills in that scope. Agent Skills stay loaded on demand, so the context stays focused.
        fr: |
          Une installation au niveau projet n'est détectée que dans ce projet, d'où l'absence de la compétence dans billing-api. L'installation dans l'étendue utilisateur rend la compétence disponible dans chaque espace de travail ouvert par la développeuse, et le guide d'installation demande de vérifier que l'hôte détecte les compétences dans cette étendue. Les Agent Skills restent chargées à la demande : le contexte reste centré.
      options:
        a: { en: "The guidance says not to install the same skill through several methods in the same host, and a project-level plugin in billing-api still wouldn't cover future repositories.", fr: "Les recommandations demandent de ne pas installer la même compétence par plusieurs méthodes dans le même hôte, et un plug-in au niveau de billing-api ne couvrirait toujours pas les futurs dépôts." }
        b: { en: "The Microsoft Learn MCP server returns documentation; it doesn't install or load Agent Kit skills, so the skill would still be missing.", fr: "Le serveur MCP Microsoft Learn renvoie de la documentation ; il n'installe ni ne charge les compétences d'Agent Kit : la compétence serait toujours absente." }
        d: { en: "Inserting every rule into every prompt crowds out the task context, and a file in billing-api doesn't cover the other repositories.", fr: "Insérer toutes les règles dans chaque prompt évince le contexte de la tâche, et un fichier dans billing-api ne couvre pas les autres dépôts." }
    references:
      - title: Set up the Azure Cosmos DB Agent Kit - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/setup
      - title: Supported AI coding assistants for Azure Cosmos DB Agent Kit - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/compatibility

  # ------------------------------------------------------------------ 7
  - id: dp420-qz-15-07
    objective: "1.5.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove runs a .NET 8 worker that processes payments stored in an Azure Cosmos DB for NoSQL account. Key-based authentication is still enabled on the account, and the security team plans to disable it next quarter. The worker runs in Azure with a managed identity.

        You ask your AI coding assistant, which has the Azure Cosmos DB Agent Kit installed, to review the worker. The assistant returns the suggestions listed below. You need to reject the suggestions that contradict the Agent Kit SDK guidance.

        Which two suggestions should you reject?

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove exécute un worker .NET 8 qui traite des paiements stockés dans un compte Azure Cosmos DB for NoSQL. L'authentification par clé est encore activée sur le compte, et l'équipe de sécurité prévoit de la désactiver au prochain trimestre. Le worker s'exécute dans Azure avec une identité managée.

        Vous demandez à votre assistant de codage IA, où Azure Cosmos DB Agent Kit est installé, de revoir le worker. L'assistant renvoie les suggestions ci-dessous. Vous devez rejeter les suggestions qui contredisent les recommandations SDK d'Agent Kit.

        Quelles sont les deux suggestions que vous devez rejeter ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Wrap every SDK call in a loop that retries at once, up to ten times, when it receives a 429 status code.", fr: "Envelopper chaque appel SDK dans une boucle qui réessaie aussitôt, jusqu'à dix fois, quand il reçoit un code d'état 429." } }
        - { id: b, text: { en: "Register one CosmosClient for the lifetime of the worker and reuse it for every operation.", fr: "Inscrire un seul CosmosClient pour toute la durée de vie du worker et le réutiliser pour chaque opération." } }
        - { id: c, text: { en: "Read the primary key from an environment variable so that the code behaves the same in every environment.", fr: "Lire la clé primaire dans une variable d'environnement pour que le code se comporte de la même façon dans chaque environnement." } }
        - { id: d, text: { en: "Log the request diagnostics when an operation is slow or fails.", fr: "Journaliser les diagnostics des requêtes quand une opération est lente ou échoue." } }
        - { id: e, text: { en: "Pass the customer ID as a query parameter instead of concatenating it into the SQL text.", fr: "Passer l'ID client comme paramètre de requête au lieu de le concaténer dans le texte SQL." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The SDK review recipe asks the assistant to respect the SDK's existing retry behavior: the SDK already retries throttled (429) requests, and a custom immediate loop on top of it multiplies the load during throttling. It also says to prefer Microsoft Entra ID authentication where the deployment supports it, which is the case for a worker with a managed identity on an account whose keys will be disabled; reading the primary key moves the code the wrong way.
        fr: |
          La recette de revue du code SDK demande à l'assistant de respecter les nouvelles tentatives existantes du SDK : le SDK réessaie déjà les requêtes limitées (429), et une boucle personnalisée immédiate par-dessus multiplie la charge pendant la limitation. Elle demande aussi de préférer l'authentification Microsoft Entra ID quand le déploiement le permet, ce qui est le cas d'un worker doté d'une identité managée sur un compte dont les clés vont être désactivées ; lire la clé primaire fait évoluer le code dans le mauvais sens.
      options:
        b: { en: "Client reuse is one of the checks of the SDK review: one client per application keeps connections and caches warm. Keep this suggestion.", fr: "La réutilisation du client fait partie des contrôles de la revue SDK : un seul client par application garde les connexions et les caches. Cette suggestion est à conserver." }
        d: { en: "Diagnostic logging for slow or failed requests is part of the recommended SDK practices. Keep this suggestion.", fr: "La journalisation des diagnostics des requêtes lentes ou en échec fait partie des pratiques SDK recommandées. Cette suggestion est à conserver." }
        e: { en: "Parameterized queries are one of the explicit checks of the SDK review and prevent injection. Keep this suggestion.", fr: "Les requêtes paramétrées sont l'un des contrôles explicites de la revue SDK et empêchent l'injection. Cette suggestion est à conserver." }
    references:
      - title: Use the Azure Cosmos DB Agent Kit - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/usage

  # ------------------------------------------------------------------ 8
  - id: dp420-qz-15-08
    objective: "1.5.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware is building a support solution on Azure Cosmos DB for NoSQL. Developers write the code with an AI coding assistant, and a support agent built in Microsoft Foundry answers customers at run time. The needs are listed in the answer area. The solution must use no account keys.

        Which tool should meet each need? To answer, drag the appropriate tools to the correct needs. Each tool may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware crée une solution de support sur Azure Cosmos DB for NoSQL. Les développeurs écrivent le code avec un assistant de codage IA, et un agent de support créé dans Microsoft Foundry répond aux clients à l'exécution. Les besoins sont listés dans la zone de réponse. La solution ne doit utiliser aucune clé de compte.

        Quel outil doit répondre à chaque besoin ? Pour répondre, faites glisser les outils appropriés vers les besoins correspondants. Chaque outil peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: kit, text: "Azure Cosmos DB Agent Kit" }
        - { id: learn, text: { en: "Microsoft Learn MCP server", fr: "Serveur MCP Microsoft Learn" } }
        - { id: toolkit, text: "Azure Cosmos DB MCP Toolkit" }
        - { id: explorer, text: { en: "Data Explorer in the Azure portal", fr: "Explorateur de données dans le portail Azure" } }
        - { id: aoai, text: { en: "Azure OpenAI embedding deployment", fr: "Déploiement d'incorporation Azure OpenAI" } }
      targets:
        - { id: hot, text: { en: "While it drafts the container definition, the coding assistant flags a hot partition risk in the proposed partition key.", fr: "Pendant qu'il rédige la définition du conteneur, l'assistant de codage signale un risque de partition chaude dans la clé de partition proposée." } }
        - { id: docs, text: { en: "Before it writes the vector policy, the coding assistant checks the current documentation on vector index types.", fr: "Avant d'écrire la stratégie vectorielle, l'assistant de codage consulte la documentation actuelle sur les types d'index vectoriels." } }
        - { id: runtime, text: { en: "At run time, the Foundry agent searches the support articles by keyword through an endpoint that requires Microsoft Entra ID tokens.", fr: "À l'exécution, l'agent Foundry recherche les articles de support par mot clé via un point de terminaison qui exige des jetons Microsoft Entra ID." } }
        - { id: browse, text: { en: "A developer browses a few test items interactively during development.", fr: "Un développeur parcourt quelques éléments de test de façon interactive pendant le développement." } }
    answer: { mapping: { hot: kit, docs: learn, runtime: toolkit, browse: explorer } }
    explanation:
      correct:
        en: |
          The Agent Kit gives the coding assistant Azure Cosmos DB guidance, such as hot partition prevention, while it writes code. The Microsoft Learn MCP server provides current official documentation. The MCP Toolkit is an MCP server in Azure Container Apps that agents, for example in Foundry, call with Microsoft Entra tokens to list, read and search items, including with `text_search`. Data Explorer is the portal tool for browsing items interactively.
