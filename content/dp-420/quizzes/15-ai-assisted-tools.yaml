          Agent Kit donne à l'assistant de codage des recommandations Azure Cosmos DB, comme la prévention des partitions chaudes, pendant qu'il écrit le code. Le serveur MCP Microsoft Learn fournit la documentation officielle actuelle. MCP Toolkit est un serveur MCP dans Azure Container Apps que des agents, par exemple dans Foundry, appellent avec des jetons Microsoft Entra pour lister, lire et rechercher des éléments, notamment avec `text_search`. L'Explorateur de données est l'outil du portail pour parcourir des éléments de façon interactive.
