chapter: 33-operational-analytics
questions:
  # ------------------------------------------------------------------ 1
  - id: dp420-qz-33-01
    objective: "3.3.2"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Adatum plans to mirror an Azure Cosmos DB for NoSQL database into a Microsoft Fabric workspace named **WS-Analytics**. The account already meets the mirroring prerequisites.

        Which workspace role is the least-privileged role that allows a user to create the mirrored database in WS-Analytics?
      fr: |
        Adatum prévoit de mettre en miroir une base de données Azure Cosmos DB for NoSQL dans un espace de travail Microsoft Fabric nommé **WS-Analytics**. Le compte remplit déjà les prérequis de la mise en miroir.

        Quel est le rôle d'espace de travail le moins privilégié qui permet à un utilisateur de créer la base de données mise en miroir dans WS-Analytics ?
    body:
      options:
        - { id: a, text: Viewer }
        - { id: b, text: Contributor }
        - { id: c, text: Member }
        - { id: d, text: Admin }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Enabling mirroring for an Azure Cosmos DB account in a workspace requires the Admin or Member role. Of the two, Member grants fewer permissions, so it is the least-privileged role that meets the requirement.
        fr: |
          Activer la mise en miroir d'un compte Azure Cosmos DB dans un espace de travail exige le rôle Admin ou Member. Des deux, Member accorde le moins d'autorisations : c'est donc le rôle le moins privilégié qui répond à l'exigence.
      options:
        a: { en: "A Viewer can't create items, and can't even query the SQL analytics endpoint of a mirrored database.", fr: "Un Viewer ne peut pas créer d'éléments, et ne peut même pas interroger le point de terminaison d'analytique SQL d'une base de données en miroir." }
        b: { en: "Contributor isn't one of the roles that the mirroring of Azure Cosmos DB accepts: Admin or Member is required.", fr: "Contributor ne fait pas partie des rôles acceptés pour la mise en miroir d'Azure Cosmos DB : Admin ou Member est requis." }
        d: { en: "Admin works, but it grants more than needed: Member is enough.", fr: "Admin fonctionne, mais accorde plus que nécessaire : Member suffit." }
    references:
      - title: Limitations in Microsoft Fabric mirrored databases from Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-limitations

  # ------------------------------------------------------------------ 2
  - id: dp420-qz-33-02
    objective: "3.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso mirrors a container named **customers** into Microsoft Fabric. Each item has top-level `id`, `name` and `country` properties and a nested `address` object with `street`, `city` and `postalCode` properties.

        How does `address` appear in the `customers` table of the SQL analytics endpoint?
      fr: |
        Contoso met en miroir un conteneur nommé **customers** dans Microsoft Fabric. Chaque élément a des propriétés de premier niveau `id`, `name` et `country` et un objet imbriqué `address` avec des propriétés `street`, `city` et `postalCode`.

        Comment `address` apparaît-il dans la table `customers` du point de terminaison d'analytique SQL ?
    body:
      options:
        - { id: a, text: { en: "As three columns named address_street, address_city and address_postalCode", fr: "Sous forme de trois colonnes nommées address_street, address_city et address_postalCode" } }
        - { id: b, text: { en: "As a separate table named customers_address, joined to customers on id", fr: "Sous forme d'une table distincte nommée customers_address, jointe à customers sur id" } }
        - { id: c, text: { en: "As one column that holds the whole object as a JSON string", fr: "Sous forme d'une seule colonne qui contient tout l'objet en chaîne JSON" } }
        - { id: d, text: { en: "It doesn't appear, because only top-level scalar properties are mirrored", fr: "Il n'apparaît pas, car seules les propriétés scalaires de premier niveau sont mises en miroir" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Top-level properties become columns, and nested objects and arrays are represented as JSON strings. To read `city` or `postalCode` separately, the query expands the column with `OPENJSON`, with `CROSS APPLY` or `OUTER APPLY`.
        fr: |
          Les propriétés de premier niveau deviennent des colonnes, et les objets et tableaux imbriqués sont représentés sous forme de chaînes JSON. Pour lire `city` ou `postalCode` séparément, la requête développe la colonne avec `OPENJSON`, avec `CROSS APPLY` ou `OUTER APPLY`.
      options:
        a: { en: "Mirroring doesn't flatten nested objects into prefixed columns; the query extracts the properties itself.", fr: "La mise en miroir n'aplatit pas les objets imbriqués en colonnes préfixées ; c'est la requête qui extrait les propriétés." }
        b: { en: "Each container is one table; nested data stays inside it rather than in a child table.", fr: "Chaque conteneur est une table ; les données imbriquées y restent plutôt que dans une table enfant." }
        d: { en: "Nested objects are replicated, whatever their nesting level, as JSON strings.", fr: "Les objets imbriqués sont répliqués, quel que soit leur niveau d'imbrication, sous forme de chaînes JSON." }
    references:
      - title: Limitations in Microsoft Fabric mirrored databases from Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-limitations
      - title: "How to: Query nested data in Microsoft Fabric mirrored databases from Azure Cosmos DB"
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-how-to-query-nested

  # ------------------------------------------------------------------ 3
  - id: dp420-qz-33-03
    objective: "3.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's data team has a Microsoft Fabric workspace named **WS-Apps** that contains two Cosmos DB databases: **catalog-db** and **payroll-db**. An external contractor must read the data of catalog-db and must have no access to payroll-db. Both databases must stay in Cosmos DB in Microsoft Fabric.

        What should you do?
      fr: |
        L'équipe de données de Fabrikam dispose d'un espace de travail Microsoft Fabric nommé **WS-Apps** qui contient deux bases de données Cosmos DB : **catalog-db** et **payroll-db**. Un prestataire externe doit lire les données de catalog-db et ne doit avoir aucun accès à payroll-db. Les deux bases de données doivent rester dans Cosmos DB dans Microsoft Fabric.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Share the catalog-db item with the contractor and grant only the Read permission on that item.", fr: "Partager l'élément catalog-db avec le prestataire et n'accorder que l'autorisation Read sur cet élément." } }
        - { id: b, text: { en: "Generate a read-only key for catalog-db and give the key to the contractor for the SDK.", fr: "Générer une clé en lecture seule pour catalog-db et donner cette clé au prestataire pour le SDK." } }
        - { id: c, text: { en: "Assign the contractor the Viewer role on WS-Apps so that the access stays read-only.", fr: "Attribuer au prestataire le rôle Viewer sur WS-Apps pour que l'accès reste en lecture seule." } }
        - { id: d, text: { en: "Move the payroll data to a Cosmos DB database in another workspace, then grant the contractor access to WS-Apps.", fr: "Déplacer les données de paie vers une base de données Cosmos DB d'un autre espace de travail, puis accorder au prestataire l'accès à WS-Apps." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Cosmos DB in Fabric inherits Fabric workspace permissions, and item permissions, although they can be set, apply to all the Cosmos DB items of the workspace. The workspace is therefore the security boundary: payroll-db must live in a separate workspace (moving it is a data migration) before the contractor gets access to WS-Apps.
        fr: |
          Cosmos DB dans Fabric hérite des autorisations de l'espace de travail Fabric, et les autorisations d'élément, bien qu'on puisse les définir, s'appliquent à tous les éléments Cosmos DB de l'espace de travail. L'espace de travail est donc la limite de sécurité : payroll-db doit se trouver dans un espace de travail distinct (son déplacement est une migration de données) avant que le prestataire reçoive l'accès à WS-Apps.
      options:
        a: { en: "Item permissions on a Cosmos DB database in Fabric are applied to all the Cosmos DB items of the workspace, so payroll-db would be readable too.", fr: "Les autorisations d'élément d'une base de données Cosmos DB dans Fabric s'appliquent à tous les éléments Cosmos DB de l'espace de travail : payroll-db serait aussi lisible." }
        b: { en: "Cosmos DB in Fabric has no primary, secondary or read-only keys: it accepts only Microsoft Entra authentication.", fr: "Cosmos DB dans Fabric n'a ni clé primaire, ni clé secondaire, ni clé en lecture seule : il n'accepte que l'authentification Microsoft Entra." }
        c: { en: "A workspace role covers every item of WS-Apps, payroll-db included.", fr: "Un rôle d'espace de travail couvre tous les éléments de WS-Apps, payroll-db compris." }
    references:
      - title: Limitations in Cosmos DB in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/limitations
      - title: Frequently asked questions for Cosmos DB in Fabric
        url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/faq

  # ------------------------------------------------------------------ 4
  - id: dp420-qz-33-04
    objective: "3.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware's data engineer creates a PySpark notebook in a Microsoft Fabric workspace that uses Runtime 1.3 (Spark 3.5). The notebook must write recommendations to an Azure Cosmos DB for NoSQL container by using `format("cosmos.oltp")`. The first run fails because Spark can't find the `cosmos.oltp` data source.

        What should the data engineer do?
      fr: |
        L'ingénieur données de Litware crée un notebook PySpark dans un espace de travail Microsoft Fabric qui utilise Runtime 1.3 (Spark 3.5). Le notebook doit écrire des recommandations dans un conteneur Azure Cosmos DB for NoSQL avec `format("cosmos.oltp")`. La première exécution échoue, car Spark ne trouve pas la source de données `cosmos.oltp`.

        Que doit faire l'ingénieur données ?
    body:
      options:
        - { id: a, text: { en: "Upload the azure-cosmos-spark_3-5_2-12 library to an environment on Runtime 1.3, publish it, and attach it to the notebook.", fr: "Charger la bibliothèque azure-cosmos-spark_3-5_2-12 dans un environnement sur Runtime 1.3, le publier et l'attacher au notebook." } }
        - { id: b, text: { en: "Upload the azure-cosmos-spark_3-4_2-12 library to an environment on Runtime 1.3, publish it, and attach it to the notebook.", fr: "Charger la bibliothèque azure-cosmos-spark_3-4_2-12 dans un environnement sur Runtime 1.3, le publier et l'attacher au notebook." } }
        - { id: c, text: { en: "Run %pip install azure-cosmos in the first cell of the notebook, and then run the notebook again.", fr: "Exécuter %pip install azure-cosmos dans la première cellule du notebook, puis exécuter de nouveau le notebook." } }
        - { id: d, text: { en: "Mirror the database into Fabric, and add a OneLake shortcut to it in the lakehouse attached to the notebook.", fr: "Mettre la base de données en miroir dans Fabric, et y ajouter un raccourci OneLake dans le lakehouse attaché au notebook." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The `cosmos.oltp` data source is provided by the Azure Cosmos DB Spark connector, which isn't preinstalled. Create an environment on Runtime 1.3, upload the connector built for Spark 3.5 (`azure-cosmos-spark_3-5_2-12`) as a custom library, publish the environment, and select it in the notebook.
        fr: |
          La source de données `cosmos.oltp` est fournie par le connecteur Spark Azure Cosmos DB, qui n'est pas préinstallé. Créez un environnement sur Runtime 1.3, chargez le connecteur compilé pour Spark 3.5 (`azure-cosmos-spark_3-5_2-12`) comme bibliothèque personnalisée, publiez l'environnement et sélectionnez-le dans le notebook.
      options:
        b: { en: "The connector artifact must match the Spark version of the runtime: Runtime 1.3 runs Spark 3.5, so the 3-5 artifact is required.", fr: "L'artefact du connecteur doit correspondre à la version Spark du runtime : Runtime 1.3 exécute Spark 3.5, donc l'artefact 3-5 est requis." }
        c: { en: "azure-cosmos is the Python SDK; it doesn't register a Spark data source and doesn't provide cosmos.oltp.", fr: "azure-cosmos est le SDK Python ; il n'enregistre pas de source de données Spark et ne fournit pas cosmos.oltp." }
        d: { en: "A shortcut gives read access to the mirrored Delta tables; it can't write to the operational container.", fr: "Un raccourci donne un accès en lecture aux tables Delta en miroir ; il ne peut pas écrire dans le conteneur opérationnel." }
    references:
      - title: Work with Cosmos DB in Microsoft Fabric using the Cosmos DB Spark Connector
        url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/how-to-use-spark-notebooks

  # ------------------------------------------------------------------ 5
  - id: dp420-qz-33-05
    objective: "3.3.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders mirrors its entire **sales** database, from an Azure Cosmos DB for NoSQL account, into a Microsoft Fabric workspace. No container was excluded when the mirrored database was created, and replication is in the Running status.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders met en miroir toute sa base de données **sales**, issue d'un compte Azure Cosmos DB for NoSQL, dans un espace de travail Microsoft Fabric. Aucun conteneur n'a été exclu lors de la création de la base de données mise en miroir, et la réplication a le statut Running.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A container that a developer creates in the sales database next week is replicated to Fabric without any change to the mirrored database.", fr: "Un conteneur qu'un développeur créera la semaine prochaine dans la base de données sales sera répliqué dans Fabric sans aucune modification de la base de données mise en miroir." }
        - id: s2
          text: { en: "If the returns container is deleted and then recreated with the same name, the returns table keeps its old rows and adds the rows of the new container.", fr: "Si le conteneur returns est supprimé puis recréé avec le même nom, la table returns conserve ses anciennes lignes et ajoute celles du nouveau conteneur." }
        - id: s3
          text: { en: "If the sales database is deleted in Azure, its mirrored tables are deleted from OneLake automatically.", fr: "Si la base de données sales est supprimée dans Azure, ses tables en miroir sont automatiquement supprimées de OneLake." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Mirroring picks up containers added to the source database later, without reconfiguration. Deleting a container and adding a similar one replaces the table's data with only the new container's data. If the source database is deleted, replication fails, but the data already in OneLake stays until you delete the mirrored database.
        fr: |
          La mise en miroir prend en compte les conteneurs ajoutés plus tard à la base de données source, sans reconfiguration. Supprimer un conteneur et en ajouter un semblable remplace les données de la table par celles du seul nouveau conteneur. Si la base de données source est supprimée, la réplication échoue, mais les données déjà dans OneLake restent jusqu'à ce que vous supprimiez la base de données mise en miroir.
      options:
        s2: { en: "The recreated container is a new source: the table then holds only the new container's data.", fr: "Le conteneur recréé est une nouvelle source : la table ne contient alors que les données du nouveau conteneur." }
        s3: { en: "Replication fails and the Data Explorer view stops working, but OneLake keeps the replicated data as it is.", fr: "La réplication échoue et la vue Data Explorer cesse de fonctionner, mais OneLake conserve les données répliquées telles quelles." }
    references:
      - title: Mirroring Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
      - title: Frequently asked questions for Microsoft Fabric mirrored databases from Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-faq

  # ------------------------------------------------------------------ 6
  - id: dp420-qz-33-06
    objective: "3.3.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank plans a new budgeting app on Cosmos DB in Microsoft Fabric. The app's database will need 30 containers. The largest container, **transactions**, will be created by the app's .NET code with autoscale throughput and must be able to scale up to 40,000 RU/s.

        During one hour of a typical day, the throughput of transactions varies between 4,000 and 12,000 RU/s.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank prévoit une nouvelle application de budget sur Cosmos DB dans Microsoft Fabric. La base de données de l'application aura besoin de 30 conteneurs. Le plus grand conteneur, **transactions**, sera créé par le code .NET de l'application avec un débit autoscale et doit pouvoir monter jusqu'à 40 000 RU/s.

        Pendant une heure d'une journée typique, le débit de transactions varie entre 4 000 et 12 000 RU/s.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The .NET code can create transactions with a maximum autoscale throughput of 40,000 RU/s without a support ticket.", fr: "Le code .NET peut créer transactions avec un débit autoscale maximal de 40 000 RU/s sans ticket de support." }
        - id: s2
          text: { en: "The database can hold the 30 containers without a support ticket.", fr: "La base de données peut contenir les 30 conteneurs sans ticket de support." }
        - id: s3
          text: { en: "For that hour, transactions consumes about 8.04 capacity units (CUs) of the Fabric capacity.", fr: "Pour cette heure, transactions consomme environ 8,04 unités de capacité (CU) de la capacité Fabric." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Containers created through an SDK accept an autoscale maximum from 1,000 RU/s up to 50,000 RU/s; only more requires a support ticket. A database supports at most 25 containers by default, so the 30 containers need a support ticket. Cosmos DB in Fabric bills the highest autoscale throughput of each hour, at 0.067 CU per 100 RU/s: 12,000 RU/s gives 120 × 0.067 = 8.04 CUs.
        fr: |
          Les conteneurs créés par un SDK acceptent un maximum autoscale de 1 000 à 50 000 RU/s ; seul un débit supérieur exige un ticket de support. Une base de données accepte au plus 25 conteneurs par défaut : les 30 conteneurs exigent donc un ticket de support. Cosmos DB dans Fabric facture le débit autoscale le plus élevé de chaque heure, à 0,067 CU par tranche de 100 RU/s : 12 000 RU/s donnent 120 × 0,067 = 8,04 CU.
      options:
        s2: { en: "The default limit is 25 containers per database; more containers can be granted through a support ticket.", fr: "La limite par défaut est de 25 conteneurs par base de données ; davantage peut être accordé par un ticket de support." }
    references:
      - title: Limitations in Cosmos DB in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/limitations
      - title: Billing and utilization data for Cosmos DB in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/billing-usage

  # ------------------------------------------------------------------ 7
  - id: dp420-qz-33-07
    objective: "3.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso mirrors an Azure Cosmos DB for NoSQL database named **sales** into a Microsoft Fabric workspace named **WS-Data**. WS-Data also contains the lakehouses and notebooks of the data engineering team. The members of a Microsoft Entra group named **Analysts** must run T-SQL queries on the mirrored tables from SQL Server Management Studio.

        The analysts must not be able to browse the live source containers, which would consume request units (RUs), and must not get access to the other items of WS-Data. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Contoso met en miroir une base de données Azure Cosmos DB for NoSQL nommée **sales** dans un espace de travail Microsoft Fabric nommé **WS-Data**. WS-Data contient aussi les lakehouses et les notebooks de l'équipe d'ingénierie des données. Les membres d'un groupe Microsoft Entra nommé **Analysts** doivent exécuter des requêtes T-SQL sur les tables en miroir depuis SQL Server Management Studio.

        Les analystes ne doivent pas pouvoir parcourir les conteneurs sources en direct, ce qui consommerait des unités de requête (RU), et ne doivent pas obtenir l'accès aux autres éléments de WS-Data. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add the Analysts group to WS-Data with the Viewer role.", fr: "Ajouter le groupe Analysts à WS-Data avec le rôle Viewer." } }
        - { id: b, text: { en: "Add the Analysts group to WS-Data with the Contributor role.", fr: "Ajouter le groupe Analysts à WS-Data avec le rôle Contributor." } }
        - { id: c, text: { en: "Share the mirrored database item with the Analysts group.", fr: "Partager l'élément de base de données en miroir avec le groupe Analysts." } }
        - { id: d, text: { en: "Share the SQL analytics endpoint of the mirrored database with the Analysts group.", fr: "Partager le point de terminaison d'analytique SQL de la base de données en miroir avec le groupe Analysts." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Sharing only the SQL analytics endpoint gives the analysts the mirrored tables for T-SQL queries, which run on Fabric capacity and consume no RUs. It doesn't share the source database view, whose data explorer queries the live account, and it doesn't open the rest of the workspace.
        fr: |
          Partager uniquement le point de terminaison d'analytique SQL donne aux analystes les tables en miroir pour leurs requêtes T-SQL, qui s'exécutent sur la capacité Fabric et ne consomment aucune RU. Cela ne partage pas la vue de la base de données source, dont l'explorateur de données interroge le compte en direct, et n'ouvre pas le reste de l'espace de travail.
      options:
        a: { en: "Users who have only Viewer permissions can't preview or query data in the SQL analytics endpoint, and the role covers every item of WS-Data.", fr: "Les utilisateurs qui n'ont que des autorisations Viewer ne peuvent ni afficher ni interroger les données du point de terminaison d'analytique SQL, et le rôle couvre tous les éléments de WS-Data." }
        b: { en: "Workspace users inherit access to the mirrored database, source view included, and Contributor also opens the lakehouses and notebooks.", fr: "Les utilisateurs de l'espace de travail héritent de l'accès à la base de données en miroir, vue source comprise, et Contributor ouvre aussi les lakehouses et les notebooks." }
        c: { en: "Sharing the mirrored database also shares the source database view, through which the analysts could query the live containers and consume RUs.", fr: "Partager la base de données en miroir partage aussi la vue de la base de données source, par laquelle les analystes pourraient interroger les conteneurs en direct et consommer des RU." }
    references:
      - title: Limitations in Microsoft Fabric mirrored databases from Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-limitations

  # ------------------------------------------------------------------ 8
  - id: dp420-qz-33-08
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys has an Azure Cosmos DB for NoSQL account named **cosmos-tailspin** in the West Europe region. The account has a single region, uses the periodic backup mode and uses provisioned throughput. Tailspin Toys has two Microsoft Fabric capacities, each large enough for the analytics workload: an F64 capacity in North Europe and an F32 capacity in West Europe.

        You need to mirror the **games** database of cosmos-tailspin into Fabric. The solution must minimize costs.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-tailspin** dans la région Europe Ouest. Le compte a une seule région, utilise le mode de sauvegarde périodique et un débit provisionné. Tailspin Toys dispose de deux capacités Microsoft Fabric, chacune suffisante pour la charge de travail analytique : une capacité F64 en Europe Nord et une capacité F32 en Europe Ouest.

        Vous devez mettre en miroir la base de données **games** de cosmos-tailspin dans Fabric. La solution doit réduire les coûts au minimum.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Migrate cosmos-tailspin to continuous backup with the 30-day retention tier.", fr: "Migrer cosmos-tailspin vers la sauvegarde continue avec le niveau de rétention de 30 jours." } }
        - { id: b, text: { en: "Migrate cosmos-tailspin to continuous backup with the 7-day retention tier.", fr: "Migrer cosmos-tailspin vers la sauvegarde continue avec le niveau de rétention de 7 jours." } }
        - { id: c, text: { en: "Create the mirrored database in a workspace that uses the North Europe capacity.", fr: "Créer la base de données mise en miroir dans un espace de travail qui utilise la capacité Europe Nord." } }
        - { id: d, text: { en: "Create the mirrored database in a workspace that uses the West Europe capacity.", fr: "Créer la base de données mise en miroir dans un espace de travail qui utilise la capacité Europe Ouest." } }
        - { id: e, text: { en: "Increase the provisioned throughput of the games containers to absorb the replication load.", fr: "Augmenter le débit provisionné des conteneurs de games pour absorber la charge de réplication." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Mirroring requires continuous backup, and the 7-day tier is free when enabled for mirroring and is enough for it. Egress fees are charged only when the Azure Cosmos DB account and the Fabric capacity are in different regions, so the mirror belongs in a workspace on the West Europe capacity. Replication compute is free and consumes no RUs of the containers.
        fr: |
          La mise en miroir exige la sauvegarde continue, et le niveau de 7 jours est gratuit quand il est activé pour la mise en miroir et lui suffit. Des frais de sortie ne s'appliquent que si le compte Azure Cosmos DB et la capacité Fabric sont dans des régions différentes : le miroir doit donc se trouver dans un espace de travail sur la capacité Europe Ouest. Le calcul de réplication est gratuit et ne consomme aucune RU des conteneurs.
      options:
        a: { en: "The 30-day tier is billed, while the free 7-day tier meets the mirroring prerequisite.", fr: "Le niveau de 30 jours est facturé, alors que le niveau gratuit de 7 jours remplit le prérequis de la mise en miroir." }
        c: { en: "A capacity in another region than the account adds egress fees, and more latency, to the replication.", fr: "Une capacité dans une autre région que le compte ajoute des frais de sortie, et de la latence, à la réplication." }
        e: { en: "Mirroring doesn't affect the performance or cost of the source: replication uses none of the provisioned RUs.", fr: "La mise en miroir n'affecte ni les performances ni le coût de la source : la réplication n'utilise aucune des RU provisionnées." }
    references:
      - title: Frequently asked questions for Microsoft Fabric mirrored databases from Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-faq
      - title: Mirroring Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db

  # ------------------------------------------------------------------ 9
  - id: dp420-qz-33-09
    objective: "3.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has a Cosmos DB database named **retail** in Microsoft Fabric. A PySpark notebook in the same workspace, whose environment includes the Azure Cosmos DB Spark connector and the Fabric authentication library, computes a DataFrame named `best_sellers` with the columns `productId` (unique), `category` and `rank`. The `config` dictionary holds the Fabric endpoint and authentication settings, and the catalog `cosmosCatalog` is registered with the same settings.

        The notebook runs the following code:

        ```python
        spark.sql("CREATE TABLE IF NOT EXISTS cosmosCatalog.retail.bestSellers USING cosmos.oltp "
                  "TBLPROPERTIES(partitionKeyPath = '/category', manualThroughput = '400')")

        write_cfg = dict(config)
        write_cfg["spark.cosmos.container"] = "bestSellers"
        best_sellers.write.format("cosmos.oltp").options(**write_cfg).mode("APPEND").save()
        ```

        You need the notebook to create the container and write the rows.

        Which two changes should you make? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'une base de données Cosmos DB nommée **retail** dans Microsoft Fabric. Un notebook PySpark du même espace de travail, dont l'environnement comprend le connecteur Spark Azure Cosmos DB et la bibliothèque d'authentification Fabric, calcule un DataFrame nommé `best_sellers` avec les colonnes `productId` (unique), `category` et `rank`. Le dictionnaire `config` contient le point de terminaison Fabric et les paramètres d'authentification, et le catalogue `cosmosCatalog` est enregistré avec les mêmes paramètres.

        Le notebook exécute le code suivant :

        ```python
        spark.sql("CREATE TABLE IF NOT EXISTS cosmosCatalog.retail.bestSellers USING cosmos.oltp "
                  "TBLPROPERTIES(partitionKeyPath = '/category', manualThroughput = '400')")

        write_cfg = dict(config)
        write_cfg["spark.cosmos.container"] = "bestSellers"
        best_sellers.write.format("cosmos.oltp").options(**write_cfg).mode("APPEND").save()
        ```

        Vous devez faire en sorte que le notebook crée le conteneur et écrive les lignes.

        Quelles sont les deux modifications à apporter ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Replace `manualThroughput = '400'` with `autoScaleMaxThroughput = '400'`.", fr: "Remplacer `manualThroughput = '400'` par `autoScaleMaxThroughput = '400'`." } }
        - { id: b, text: { en: "Add an `id` column to `best_sellers`, for example with `withColumn(\"id\", col(\"productId\"))`.", fr: "Ajouter une colonne `id` à `best_sellers`, par exemple avec `withColumn(\"id\", col(\"productId\"))`." } }
        - { id: c, text: { en: "Replace `manualThroughput = '400'` with `autoScaleMaxThroughput = '1000'`.", fr: "Remplacer `manualThroughput = '400'` par `autoScaleMaxThroughput = '1000'`." } }
        - { id: d, text: { en: "Set `spark.cosmos.useGatewayMode` to `\"false\"` in `write_cfg`.", fr: "Définir `spark.cosmos.useGatewayMode` sur `\"false\"` dans `write_cfg`." } }
        - { id: e, text: { en: "Set `spark.cosmos.write.strategy` to `ItemPatch` in `write_cfg`.", fr: "Définir `spark.cosmos.write.strategy` sur `ItemPatch` dans `write_cfg`." } }
    answer: { optionIds: [b, c] }
    explanation:
      correct:
        en: |
          Containers in Cosmos DB in Fabric must be created with autoscale throughput, and a container created through an SDK, which the connector uses, needs an autoscale maximum of at least 1,000 RU/s. Every item needs an `id`, so the DataFrame must contain an `id` column and the partition key property (`category` is already there); using the unique `productId` as `id` keeps one item per product.
        fr: |
          Les conteneurs de Cosmos DB dans Fabric doivent être créés avec un débit autoscale, et un conteneur créé par un SDK, ce qu'utilise le connecteur, exige un maximum autoscale d'au moins 1 000 RU/s. Chaque élément exige un `id` : le DataFrame doit donc contenir une colonne `id` et la propriété de clé de partition (`category` est déjà présente) ; utiliser le `productId` unique comme `id` garde un élément par produit.
      options:
        a: { en: "The throughput type is right, but 400 RU/s is below the 1,000 RU/s minimum autoscale maximum for containers created through an SDK.", fr: "Le type de débit est correct, mais 400 RU/s est inférieur au minimum de 1 000 RU/s pour le maximum autoscale des conteneurs créés par un SDK." }
        d: { en: "Cosmos DB in Fabric supports only gateway mode, so the Fabric configuration sets useGatewayMode to true.", fr: "Cosmos DB dans Fabric ne prend en charge que le mode passerelle : la configuration Fabric définit useGatewayMode sur true." }
        e: { en: "ItemPatch updates existing items and fails on missing ones; the container is new, and the rows still have no id.", fr: "ItemPatch met à jour des éléments existants et échoue sur les éléments absents ; le conteneur est nouveau, et les lignes n'ont toujours pas d'id." }
    references:
      - title: Work with Cosmos DB in Microsoft Fabric using the Cosmos DB Spark Connector
        url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/how-to-use-spark-notebooks
      - title: Limitations in Cosmos DB in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/limitations

  # ------------------------------------------------------------------ 10
  - id: dp420-qz-33-10
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has an Azure Cosmos DB for NoSQL account named **cosmos-litware** with 7-day continuous backup and a single write region. Public network access is disabled: the account is reachable only through a private endpoint in a virtual network. Local authentication with account keys is disabled. A Microsoft Fabric workspace named **WS-Ops**, on a capacity in the same region as the account, will hold the mirror. You are an owner of the Azure subscription and an Admin of WS-Ops.

        You need to mirror the **ops** database of cosmos-litware into WS-Ops. Public network access must stay disabled at all times.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-litware** avec une sauvegarde continue de 7 jours et une seule région d'écriture. L'accès réseau public est désactivé : le compte n'est joignable que par un point de terminaison privé dans un réseau virtuel. L'authentification locale avec les clés de compte est désactivée. Un espace de travail Microsoft Fabric nommé **WS-Ops**, sur une capacité de la même région que le compte, accueillera le miroir. Vous êtes propriétaire de l'abonnement Azure et Admin de WS-Ops.

        Vous devez mettre en miroir la base de données **ops** de cosmos-litware dans WS-Ops. L'accès réseau public doit rester désactivé en permanence.

        Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Add the EnableFabricNetworkAclBypass capability to cosmos-litware, and authorize the WS-Ops workspace ID as a network ACL bypass resource.", fr: "Ajouter la fonctionnalité EnableFabricNetworkAclBypass à cosmos-litware, et autoriser l'ID de l'espace de travail WS-Ops comme ressource de contournement de l'ACL réseau." } }
        - { id: b, text: { en: "Create a managed private endpoint from WS-Ops to cosmos-litware so that the ongoing replication uses the private endpoint.", fr: "Créer un point de terminaison privé managé de WS-Ops vers cosmos-litware pour que la réplication continue utilise le point de terminaison privé." } }
        - { id: c, text: { en: "Create a virtual network data gateway, and an Azure Cosmos DB v2 connection that uses it with OAuth 2.0 authentication.", fr: "Créer une passerelle de données de réseau virtuel, et une connexion Azure Cosmos DB v2 qui l'utilise avec l'authentification OAuth 2.0." } }
        - { id: d, text: { en: "Create the Mirrored Azure Cosmos DB item in the Fabric portal, with a connection that uses the Account key authentication kind.", fr: "Créer l'élément Mirrored Azure Cosmos DB dans le portail Fabric, avec une connexion qui utilise le type d'authentification Account key." } }
        - { id: e, text: { en: "Create the mirrored database and start mirroring by calling the Fabric REST API with the gateway connection.", fr: "Créer la base de données mise en miroir et démarrer la mise en miroir en appelant l'API REST Fabric avec la connexion de passerelle." } }
        - { id: f, text: { en: "Enable public network access from selected networks until the initial snapshot completes, and then disable it again.", fr: "Activer l'accès réseau public depuis des réseaux sélectionnés jusqu'à la fin de l'instantané initial, puis le désactiver de nouveau." } }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          For an account behind a private endpoint, the documented setup keeps public access disabled: the EnableFabricNetworkAclBypass capability plus the workspace ID as a trusted resource let Fabric through the network ACLs. A virtual network data gateway and an Azure Cosmos DB v2 connection over it, which supports OAuth 2.0 only, reach the account. Because the mirroring interface can't use a virtual network gateway connection, the mirrored database is created and started with the Fabric REST API.
        fr: |
          Pour un compte derrière un point de terminaison privé, la configuration documentée garde l'accès public désactivé : la fonctionnalité EnableFabricNetworkAclBypass et l'ID de l'espace de travail déclaré comme ressource approuvée laissent passer Fabric à travers les ACL réseau. Une passerelle de données de réseau virtuel et une connexion Azure Cosmos DB v2 qui l'utilise, qui n'accepte que OAuth 2.0, atteignent le compte. Comme l'interface de mise en miroir ne peut pas utiliser une connexion par passerelle de réseau virtuel, la base de données mise en miroir est créée et démarrée avec l'API REST Fabric.
      options:
        b: { en: "Ongoing mirroring travels over the internal Microsoft network and doesn't go through the account's private endpoint; the documented setup uses the gateway and the ACL bypass instead.", fr: "La mise en miroir continue transite par le réseau interne de Microsoft et ne passe pas par le point de terminaison privé du compte ; la configuration documentée utilise plutôt la passerelle et le contournement de l'ACL." }
        d: { en: "Account keys are disabled on cosmos-litware, and the portal's mirroring interface can't use a virtual network gateway connection.", fr: "Les clés de compte sont désactivées sur cosmos-litware, et l'interface de mise en miroir du portail ne peut pas utiliser une connexion par passerelle de réseau virtuel." }
        f: { en: "Public access must stay disabled, and the documented setup never needs it, not even for the initial snapshot.", fr: "L'accès public doit rester désactivé, et la configuration documentée n'en a jamais besoin, pas même pour l'instantané initial." }
    references:
      - title: Configure mirroring for Azure Cosmos DB accounts with network restrictions
        url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-private-network
