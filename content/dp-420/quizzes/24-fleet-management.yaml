chapter: 24-fleet-management
questions:
  # ------------------------------------------------------------------ 1
  - id: dp420-qz-24-01
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You manage an Azure Cosmos DB fleet for a multitenant application. Each tenant has its own Azure Cosmos DB for NoSQL account.

        You need a group of tenant accounts to share a common budget of RU/s.

        At which level of the fleet hierarchy do you configure the throughput pool?
      fr: |
        Vous gérez une flotte Azure Cosmos DB pour une application multilocataire. Chaque locataire dispose de son propre compte Azure Cosmos DB for NoSQL.

        Vous devez faire partager un budget commun de RU/s à un groupe de comptes de locataires.

        À quel niveau de la hiérarchie de la flotte configurez-vous le pool de débit ?
    body:
      options:
        - { id: a, text: { en: "The fleet", fr: "La flotte" } }
        - { id: b, text: { en: "The fleetspace", fr: "Le fleetspace" } }
        - { id: c, text: { en: "The fleetspace account", fr: "Le compte de fleetspace" } }
        - { id: d, text: { en: "The database account", fr: "Le compte de base de données" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Pooling is an optional setting of the fleetspace, the logical group of accounts inside a fleet. Its pool RU/s are available to every database and container of the accounts in that fleetspace, whatever their subscription or resource group.
        fr: |
          Le pool est un paramètre facultatif du fleetspace, le groupe logique de comptes au sein d'une flotte. Ses RU/s sont disponibles pour toutes les bases de données et tous les conteneurs des comptes de ce fleetspace, quel que soit leur abonnement ou leur groupe de ressources.
      options:
        a: { en: "The fleet is the top-level entity that represents the application; it holds fleetspaces but no throughput pool of its own.", fr: "La flotte est l'entité de premier niveau qui représente l'application ; elle contient des fleetspaces mais pas de pool de débit propre." }
        c: { en: "A fleetspace account only links one existing account (one tenant) to a fleetspace; it consumes pool RU/s but doesn't define them.", fr: "Un compte de fleetspace ne fait que lier un compte existant (un locataire) à un fleetspace ; il consomme les RU/s du pool mais ne les définit pas." }
        d: { en: "The database account keeps its dedicated RU/s on its databases and containers; shared RU/s across accounts come from the fleetspace.", fr: "Le compte de base de données conserve ses RU/s dédiées sur ses bases de données et conteneurs ; les RU/s partagées entre comptes viennent du fleetspace." }
    references:
      - title: Fleets Overview - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet

  # ------------------------------------------------------------------ 2
  - id: dp420-qz-24-02
    objective: "2.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum has an Azure Cosmos DB fleet. Adatum plans to enable fleet analytics on the fleet.

        Which accounts does fleet analytics report on?
      fr: |
        Adatum dispose d'une flotte Azure Cosmos DB. Adatum prévoit d'activer l'analytique de la flotte sur cette flotte.

        Sur quels comptes l'analytique de la flotte fournit-elle des données ?
    body:
      options:
        - { id: a, text: { en: "Every Azure Cosmos DB account, of any API, in the subscription of the fleet", fr: "Tous les comptes Azure Cosmos DB, quelle que soit l'API, de l'abonnement de la flotte" } }
        - { id: b, text: { en: "The Azure Cosmos DB accounts, of any API, that are in a fleetspace of the fleet", fr: "Les comptes Azure Cosmos DB, quelle que soit l'API, qui sont dans un fleetspace de la flotte" } }
        - { id: c, text: { en: "The Azure Cosmos DB for NoSQL accounts that are in a fleetspace of the fleet", fr: "Les comptes Azure Cosmos DB for NoSQL qui sont dans un fleetspace de la flotte" } }
        - { id: d, text: { en: "The Azure Cosmos DB for NoSQL accounts that send diagnostic logs to the destination", fr: "Les comptes Azure Cosmos DB for NoSQL qui envoient des journaux de diagnostic vers la destination" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Fleet analytics covers the accounts configured in the fleet, and only Azure Cosmos DB for NoSQL accounts are supported. Every account of a fleet belongs to a fleetspace, and the accounts can come from any subscription or resource group.
        fr: |
          L'analytique de la flotte couvre les comptes configurés dans la flotte, et seuls les comptes Azure Cosmos DB for NoSQL sont pris en charge. Chaque compte d'une flotte appartient à un fleetspace, et les comptes peuvent provenir de n'importe quel abonnement ou groupe de ressources.
      options:
        a: { en: "Fleet analytics isn't scoped to a subscription: it covers the accounts of the fleet, which can come from several subscriptions, and only NoSQL accounts.", fr: "L'analytique de la flotte n'est pas limitée à un abonnement : elle couvre les comptes de la flotte, qui peuvent venir de plusieurs abonnements, et seulement les comptes NoSQL." }
        b: { en: "Fleets and fleet analytics support only Azure Cosmos DB for NoSQL accounts, not the other APIs.", fr: "Les flottes et l'analytique de la flotte ne prennent en charge que les comptes Azure Cosmos DB for NoSQL, pas les autres API." }
        d: { en: "Fleet analytics doesn't rely on diagnostic settings: the service writes its own hourly tables for the accounts of the fleet.", fr: "L'analytique de la flotte ne repose pas sur les paramètres de diagnostic : le service écrit ses propres tables horaires pour les comptes de la flotte." }
    references:
      - title: Enable Fleet Analytics (Preview) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-enable-fleet-analytics
      - title: Fleet Analytics (Preview) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics

  # ------------------------------------------------------------------ 3
  - id: dp420-qz-24-03
    objective: "2.4.1"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Contoso's tenant account **cosmos-t08** belongs to a fleetspace that has throughput pooling with ample free capacity. Its container **orders** has autoscale throughput of 400 to 4,000 RU/s and a single physical partition. During a sales event, the consumption of orders rises gradually from 2,500 RU/s to 7,000 RU/s.

        Above which consumption does orders start to draw RU/s from the pool?
      fr: |
        Le compte de locataire **cosmos-t08** de Contoso appartient à un fleetspace doté d'un pool de débit avec une large capacité libre. Son conteneur **orders** a un débit avec mise à l'échelle automatique de 400 à 4 000 RU/s et une seule partition physique. Pendant une opération commerciale, la consommation d'orders monte progressivement de 2 500 RU/s à 7 000 RU/s.

        Au-delà de quelle consommation orders commence-t-il à puiser des RU/s dans le pool ?
    body:
      options:
        - { id: a, text: "400 RU/s" }
        - { id: b, text: "2,500 RU/s" }
        - { id: c, text: "4,000 RU/s" }
        - { id: d, text: "9,000 RU/s" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Dedicated RU/s are always consumed first, and with autoscale the dedicated RU/s of a resource equal its autoscale maximum. orders therefore scales on its own up to 4,000 RU/s and draws from the pool only for the consumption above 4,000 RU/s.
        fr: |
          Les RU/s dédiées sont toujours consommées en premier et, avec la mise à l'échelle automatique, les RU/s dédiées d'une ressource sont égales à son maximum de mise à l'échelle automatique. orders monte donc seul jusqu'à 4 000 RU/s et ne puise dans le pool que pour la consommation au-delà de 4 000 RU/s.
      options:
        a: { en: "400 RU/s is the autoscale minimum; autoscale scales the container between 400 and 4,000 RU/s before the pool is used.", fr: "400 RU/s est le minimum de mise à l'échelle automatique ; celle-ci fait varier le conteneur entre 400 et 4 000 RU/s avant que le pool soit utilisé." }
        b: { en: "2,500 RU/s is only the current consumption; the dedicated RU/s of an autoscale container are its maximum, not the level it currently runs at.", fr: "2 500 RU/s n'est que la consommation actuelle ; les RU/s dédiées d'un conteneur avec mise à l'échelle automatique sont son maximum, pas le niveau auquel il tourne." }
        d: { en: "9,000 RU/s (4,000 dedicated plus 5,000 from the pool) is the ceiling of the physical partition, not the point where pooling starts.", fr: "9 000 RU/s (4 000 dédiées plus 5 000 du pool) est le plafond de la partition physique, pas le seuil où le pool commence à servir." }
    references:
      - title: Fleet Pools - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools

  # ------------------------------------------------------------------ 4
  - id: dp420-qz-24-04
    objective: "2.4.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Litware has an Azure Cosmos DB fleet named **fleet-litware** in a resource group named **rg-saas**. The tenant account **cosmos-t31** is the fleetspace account **t31** of a fleetspace named **fs-trial**, which has no throughput pooling. The tenant has signed a production contract, and its account must now draw RU/s from the pool of the fleetspace **fs-prod** of the same fleet, whose regions and service tier match the account. The account and its data must be kept.

        You need to run the first command of the move by using the Azure CLI. The second command adds the account to fs-prod.

        How should you complete the first command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'une flotte Azure Cosmos DB nommée **fleet-litware** dans un groupe de ressources nommé **rg-saas**. Le compte de locataire **cosmos-t31** est le compte de fleetspace **t31** d'un fleetspace nommé **fs-trial**, qui n'a pas de pool de débit. Le locataire a signé un contrat de production, et son compte doit désormais puiser des RU/s dans le pool du fleetspace **fs-prod** de la même flotte, dont les régions et le niveau de service correspondent au compte. Le compte et ses données doivent être conservés.

        Vous devez exécuter la première commande du déplacement avec Azure CLI. La seconde commande ajoute le compte à fs-prod.

        Comment devez-vous compléter la première commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az resource [[verb]] --resource-group rg-saas \
          --name "fleet-litware/fleetspaces/fs-trial/fleetspaceAccounts/t31" \
          --resource-type "[[rtype]]" \
          --latest-include-preview
      slots:
        - id: verb
          options:
            - { id: vdel, text: delete }
            - { id: vmove, text: move }
            - { id: vupd, text: update }
        - id: rtype
          options:
            - { id: tfsa, text: Microsoft.DocumentDB/fleets/fleetspaces/fleetspaceAccounts }
            - { id: tfs, text: Microsoft.DocumentDB/fleets/fleetspaces }
            - { id: tdba, text: Microsoft.DocumentDB/databaseAccounts }
    answer:
      values: { verb: vdel, rtype: tfsa }
    explanation:
      correct:
        en: |
          An account that already belongs to a fleetspace can't be added to another one, so you first remove it from fs-trial. Removing the account from a fleetspace means deleting its fleetspace account resource, `Microsoft.DocumentDB/fleets/fleetspaces/fleetspaceAccounts`, with `az resource delete`. Only the link is deleted: the database account and its data stay, and the second command links it to fs-prod.
        fr: |
          Un compte qui appartient déjà à un fleetspace ne peut pas être ajouté à un autre : vous le retirez donc d'abord de fs-trial. Retirer le compte d'un fleetspace consiste à supprimer sa ressource de compte de fleetspace, `Microsoft.DocumentDB/fleets/fleetspaces/fleetspaceAccounts`, avec `az resource delete`. Seul le lien est supprimé : le compte de base de données et ses données restent, et la seconde commande le lie à fs-prod.
      options:
        vmove: { en: "`az resource move` moves resources to another resource group or subscription; it doesn't change the fleetspace of an account.", fr: "`az resource move` déplace des ressources vers un autre groupe de ressources ou abonnement ; il ne change pas le fleetspace d'un compte." }
        vupd: { en: "Updating the fleetspace account in place doesn't release the account: it must leave fs-trial before it can join fs-prod.", fr: "Mettre à jour le compte de fleetspace sur place ne libère pas le compte : il doit quitter fs-trial avant de pouvoir rejoindre fs-prod." }
        tfs: { en: "The fleetspaces type would target fs-trial itself and would remove the whole fleetspace, not one account from it.", fr: "Le type fleetspaces viserait fs-trial lui-même et supprimerait tout le fleetspace, pas un seul de ses comptes." }
        tdba: { en: "Deleting the databaseAccounts resource would delete the tenant's account and its data, which must be kept.", fr: "Supprimer la ressource databaseAccounts supprimerait le compte du locataire et ses données, qui doivent être conservés." }
    references:
      - title: Create a Fleet (Preview) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-create-fleet

  # ------------------------------------------------------------------ 5
  - id: dp420-qz-24-05
    objective: "2.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip wants to send the fleet analytics of its Azure Cosmos DB fleet to Microsoft Fabric. Its Fabric tenant has the following workspaces, all of which use OneLake as their default storage where a Fabric capacity backs them:

        - **ws-reports**: Power BI Pro workspace on shared capacity, with semantic models and reports
        - **ws-sandbox**: backed by a Fabric trial capacity, with a lakehouse named **lh-sandbox**
        - **ws-dw**: backed by an F64 capacity, with a warehouse named **wh-sales** and no lakehouse
        - **ws-rti**: backed by an F32 capacity, with an eventhouse named **eh-iot** and no lakehouse

        In which workspace can you add the fleet analytics destination?
      fr: |
        Wingtip souhaite envoyer l'analytique de la flotte de sa flotte Azure Cosmos DB vers Microsoft Fabric. Son locataire Fabric comprend les espaces de travail suivants, qui utilisent tous OneLake comme stockage par défaut lorsqu'une capacité Fabric les prend en charge :

        - **ws-reports** : espace de travail Power BI Pro sur une capacité partagée, avec des modèles sémantiques et des rapports
        - **ws-sandbox** : pris en charge par une capacité d'évaluation Fabric, avec un lakehouse nommé **lh-sandbox**
        - **ws-dw** : pris en charge par une capacité F64, avec un entrepôt nommé **wh-sales** et aucun lakehouse
        - **ws-rti** : pris en charge par une capacité F32, avec un eventhouse nommé **eh-iot** et aucun lakehouse

        Dans quel espace de travail pouvez-vous ajouter la destination de l'analytique de la flotte ?
    body:
      options:
        - { id: a, text: ws-reports }
        - { id: b, text: ws-sandbox }
        - { id: c, text: ws-dw }
        - { id: d, text: ws-rti }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The destination needs a Fabric workspace that uses OneLake as its default storage and is backed by a licensed or trial Fabric capacity, and you select an existing lakehouse when you add it. ws-sandbox meets all three conditions: a trial capacity is enough.
        fr: |
          La destination exige un espace de travail Fabric qui utilise OneLake comme stockage par défaut et qui est pris en charge par une capacité Fabric sous licence ou d'évaluation, et vous sélectionnez un lakehouse existant en l'ajoutant. ws-sandbox remplit les trois conditions : une capacité d'évaluation suffit.
      options:
        a: { en: "A Power BI Pro workspace on shared capacity has no Fabric capacity and contains no lakehouse.", fr: "Un espace de travail Power BI Pro sur une capacité partagée n'a pas de capacité Fabric et ne contient aucun lakehouse." }
        c: { en: "ws-dw has a Fabric capacity, but fleet analytics writes its tables to an existing lakehouse, not to a warehouse.", fr: "ws-dw a une capacité Fabric, mais l'analytique de la flotte écrit ses tables dans un lakehouse existant, pas dans un entrepôt." }
        d: { en: "ws-rti has a Fabric capacity, but the destination requires an existing lakehouse; an eventhouse isn't one.", fr: "ws-rti a une capacité Fabric, mais la destination exige un lakehouse existant ; un eventhouse n'en est pas un." }
    references:
      - title: Enable Fleet Analytics (Preview) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-enable-fleet-analytics

  # ------------------------------------------------------------------ 6
  - id: dp420-qz-24-06
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Northwind gives each tenant its own Azure Cosmos DB for NoSQL account. The accounts belong to a fleetspace whose pool rarely exceeds 20 percent of its maximum. The default pool limits apply.

        The account of one tenant has a container named **readings**, partitioned by `/deviceId`, with autoscale throughput of 100 to 1,000 RU/s and a single physical partition that stores 12 GB. Every day, the tenant's 3,000 devices upload their readings at the same time, evenly across devices, which requires 9,000 RU/s for 20 minutes. The uploads receive 429 responses.

        You need to eliminate the throttling. The solution must keep the container on its pooled fleetspace and minimize the dedicated throughput of readings.

        To which autoscale maximum should you set readings?
      fr: |
        Northwind donne à chaque locataire son propre compte Azure Cosmos DB for NoSQL. Les comptes appartiennent à un fleetspace dont le pool dépasse rarement 20 % de son maximum. Les limites par défaut des pools s'appliquent.

        Le compte d'un locataire contient un conteneur nommé **readings**, partitionné par `/deviceId`, avec un débit avec mise à l'échelle automatique de 100 à 1 000 RU/s et une seule partition physique qui stocke 12 Go. Chaque jour, les 3 000 appareils du locataire envoient leurs relevés en même temps, de façon homogène entre appareils, ce qui exige 9 000 RU/s pendant 20 minutes. Les envois reçoivent des réponses 429.

        Vous devez éliminer la limitation. La solution doit conserver le conteneur dans son fleetspace avec pool et réduire au minimum le débit dédié de readings.

        À quel maximum de mise à l'échelle automatique devez-vous régler readings ?
    body:
      options:
        - { id: a, text: "3,000 RU/s" }
        - { id: b, text: "4,000 RU/s" }
        - { id: c, text: "5,000 RU/s" }
        - { id: d, text: "9,000 RU/s" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A physical partition can consume at most min(5,000 + its dedicated RU/s, 10,000). With 1,000 dedicated RU/s, readings is capped at 6,000 RU/s whatever the free capacity of the pool. An autoscale maximum of 4,000 RU/s (still one physical partition) raises the ceiling to exactly 9,000 RU/s, and the traffic is spread over many logical partitions, so no single key is limited.
        fr: |
          Une partition physique peut consommer au plus min(5 000 + ses RU/s dédiées, 10 000). Avec 1 000 RU/s dédiées, readings plafonne à 6 000 RU/s, quelle que soit la capacité libre du pool. Un maximum de mise à l'échelle automatique de 4 000 RU/s (toujours une seule partition physique) relève le plafond à exactement 9 000 RU/s, et le trafic est réparti sur de nombreuses partitions logiques : aucune clé n'est limitée isolément.
      options:
        a: { en: "With 3,000 dedicated RU/s, the partition can reach only 8,000 RU/s (3,000 + 5,000 from the pool), below the 9,000 RU/s needed.", fr: "Avec 3 000 RU/s dédiées, la partition n'atteint que 8 000 RU/s (3 000 + 5 000 du pool), moins que les 9 000 RU/s nécessaires." }
        c: { en: "5,000 RU/s also removes the throttling, but it provisions 1,000 more dedicated RU/s than necessary.", fr: "5 000 RU/s élimine aussi la limitation, mais provisionne 1 000 RU/s dédiées de plus que nécessaire." }
        d: { en: "9,000 RU/s covers the peak without the pool at all: it removes the throttling at the highest dedicated throughput of the options.", fr: "9 000 RU/s couvre le pic sans le pool : il élimine la limitation avec le débit dédié le plus élevé des options." }
    references:
      - title: Fleet Pools - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools

  # ------------------------------------------------------------------ 7
  - id: dp420-qz-24-07
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware has 1,400 Azure Cosmos DB for NoSQL accounts, one per tenant, in a fleet. Fleet analytics has written to a Microsoft Fabric lakehouse for the past two years. Diagnostic settings have sent the resource logs of every account to a Log Analytics workspace for the past 30 days. No other monitoring data is exported.

        You need to choose the data source for each requirement. The solution must minimize additional costs and development effort.

        Which data source should you use for each requirement? To answer, drag the appropriate data sources to the correct requirements. Each data source may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose de 1 400 comptes Azure Cosmos DB for NoSQL, un par locataire, dans une flotte. L'analytique de la flotte écrit dans un lakehouse Microsoft Fabric depuis deux ans. Des paramètres de diagnostic envoient les journaux de ressources de tous les comptes vers un espace de travail Log Analytics depuis 30 jours. Aucune autre donnée de surveillance n'est exportée.

        Vous devez choisir la source de données de chaque exigence. La solution doit réduire au minimum les coûts supplémentaires et l'effort de développement.

        Quelle source de données devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les sources de données appropriées vers les exigences correspondantes. Chaque source de données peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: met, text: { en: "Azure Monitor metrics", fr: "Métriques Azure Monitor" } }
        - { id: log, text: { en: "Resource logs in Log Analytics", fr: "Journaux de ressources dans Log Analytics" } }
        - { id: fa, text: { en: "Fleet analytics", fr: "Analytique de la flotte" } }
      targets:
        - { id: t1, text: { en: "Chart the minute-by-minute normalized RU consumption of one tenant account on a day 60 days ago", fr: "Représenter minute par minute la consommation normalisée de RU d'un compte de locataire un jour d'il y a 60 jours" } }
        - { id: t2, text: { en: "Compare the monthly request count of every tenant account over the past 18 months", fr: "Comparer le nombre mensuel de requêtes de chaque compte de locataire sur les 18 derniers mois" } }
        - { id: t3, text: { en: "List each request of one tenant account that returned status code 403 yesterday, with its operation", fr: "Lister chaque requête d'un compte de locataire qui a renvoyé le code d'état 403 hier, avec son opération" } }
        - { id: t4, text: { en: "Find the tenant accounts whose default consistency level changed during the past six months", fr: "Trouver les comptes de locataires dont le niveau de cohérence par défaut a changé au cours des six derniers mois" } }
    answer:
      mapping: { t1: met, t2: fa, t3: log, t4: fa }
    explanation:
      correct:
        en: |
          Azure Monitor metrics are free, preaggregated per minute and stored 93 days, so a day 60 days ago is still available at one-minute resolution; fleet analytics only has an hourly grain. Fleet-wide trends over 18 months and hourly snapshots of account settings such as the default consistency level are the role of fleet analytics, whose retention you decide. Individual requests with their status code and operation are only in the resource logs, which cover the past 30 days.
        fr: |
          Les métriques Azure Monitor sont gratuites, préagrégées à la minute et stockées 93 jours : un jour d'il y a 60 jours reste disponible avec une résolution d'une minute, alors que l'analytique de la flotte n'a qu'une granularité horaire. Les tendances à l'échelle de la flotte sur 18 mois et les instantanés horaires des paramètres des comptes, comme le niveau de cohérence par défaut, relèvent de l'analytique de la flotte, dont vous décidez la rétention. Les requêtes individuelles, avec leur code d'état et leur opération, ne figurent que dans les journaux de ressources, qui couvrent les 30 derniers jours.
      options:
        fa: { en: "Fleet analytics can't serve the per-minute chart or the individual requests: it stores hourly aggregates.", fr: "L'analytique de la flotte ne peut servir ni le graphique à la minute ni les requêtes individuelles : elle stocke des agrégats horaires." }
        met: { en: "Metrics are stored 93 days and are scoped to one account: they can't cover 18 months or the whole fleet's settings.", fr: "Les métriques sont stockées 93 jours et limitées à un compte : elles ne couvrent ni 18 mois ni les paramètres de toute la flotte." }
        log: { en: "The resource logs only go back 30 days, so they can't serve the day 60 days ago, the 18-month comparison or the six-month audit.", fr: "Les journaux de ressources ne remontent qu'à 30 jours : ils ne peuvent servir ni le jour d'il y a 60 jours, ni la comparaison sur 18 mois, ni l'audit sur six mois." }
    references:
      - title: Fleet Analytics (Preview) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics
      - title: Fleet Analytics Schema Reference (Preview) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics-schema-reference

  # ------------------------------------------------------------------ 8
  - id: dp420-qz-24-08
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Woodgrove has an Azure Cosmos DB fleetspace named **fs-eu** with throughput pooling. The pool scales between a minimum of 100,000 RU/s and a maximum of 600,000 RU/s, and its data regions are West Europe and North Europe.

        Between 09:00 and 10:00, the pool in West Europe scaled to 180,000 RU/s for 20 minutes and to 320,000 RU/s for 5 minutes, and stayed at its minimum for the rest of the hour. No account drew RU/s from the pool in North Europe during that hour.

        For how many pool RU/s in total, across both regions, is Woodgrove billed for that hour?
      fr: |
        Woodgrove dispose d'un fleetspace Azure Cosmos DB nommé **fs-eu** doté d'un pool de débit. Le pool varie entre un minimum de 100 000 RU/s et un maximum de 600 000 RU/s, et ses régions de données sont West Europe et North Europe.

        Entre 9 h et 10 h, le pool de West Europe est monté à 180 000 RU/s pendant 20 minutes et à 320 000 RU/s pendant 5 minutes, et il est resté à son minimum le reste de l'heure. Aucun compte n'a puisé de RU/s dans le pool de North Europe pendant cette heure.

        Pour combien de RU/s de pool au total, sur les deux régions, Woodgrove est-il facturé pour cette heure ?
    body:
      options:
        - { id: a, text: "145,000 RU/s" }
        - { id: b, text: "245,000 RU/s" }
        - { id: c, text: "320,000 RU/s" }
        - { id: d, text: "420,000 RU/s" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Each hour, the pool is billed in each of its regions at the highest RU/s it scaled to during that hour, and an idle pool is billed at its minimum. West Europe is billed 320,000 RU/s, its peak, and North Europe 100,000 RU/s, its minimum: 420,000 RU/s in total.
        fr: |
          Chaque heure, le pool est facturé dans chacune de ses régions au plus haut niveau de RU/s atteint pendant cette heure, et un pool inactif est facturé à son minimum. West Europe est facturée 320 000 RU/s, son pic, et North Europe 100 000 RU/s, son minimum : 420 000 RU/s au total.
      options:
        a: { en: "About 145,000 RU/s is the time-weighted average in West Europe; the pool is billed at its hourly peak, not at an average, and North Europe is billed too.", fr: "Environ 145 000 RU/s est la moyenne pondérée dans le temps à West Europe ; le pool est facturé à son pic horaire, pas à une moyenne, et North Europe est aussi facturée." }
        b: { en: "245,000 RU/s adds the North Europe minimum to an average of West Europe; West Europe must be billed at its 320,000 RU/s peak.", fr: "245 000 RU/s ajoute le minimum de North Europe à une moyenne de West Europe ; West Europe doit être facturée à son pic de 320 000 RU/s." }
        c: { en: "320,000 RU/s ignores North Europe: an idle pool region is still billed at the minimum RU/s.", fr: "320 000 RU/s ignore North Europe : une région du pool inactive est quand même facturée au minimum de RU/s." }
    references:
      - title: Fleet Pools - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools

  # ------------------------------------------------------------------ 9
  - id: dp420-qz-24-09
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has run fleet analytics on its Azure Cosmos DB fleet of 700 tenant accounts for a year, with lh-fleet, a Fabric lakehouse, as the destination. An auditor asks for the subscription and name of every tenant account whose default consistency level was changed at least once during the past 90 days.

        You plan to answer from the SQL endpoint of lh-fleet.

        How should you complete the statement? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam utilise depuis un an l'analytique de la flotte sur sa flotte Azure Cosmos DB de 700 comptes de locataires, avec lh-fleet, un lakehouse Fabric, comme destination. Un auditeur demande l'abonnement et le nom de chaque compte de locataire dont le niveau de cohérence par défaut a été modifié au moins une fois au cours des 90 derniers jours.

        Vous prévoyez de répondre depuis le point de terminaison SQL de lh-fleet.

        Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        SELECT DR.SubscriptionId, DR.AccountName
        FROM [[tbl]] F
        JOIN DimResource DR ON [[join]]
        WHERE F.Timestamp >= DATEADD(DAY, -90, GETDATE())
        GROUP BY DR.SubscriptionId, DR.AccountName
        HAVING [[cond]];
      slots:
        - id: tbl
          options:
            - { id: tacc, text: FactAccountHourly }
            - { id: treq, text: FactRequestHourly }
            - { id: tmet, text: FactMeterUsageHourly }
        - id: join
          options:
            - { id: jres, text: F.ResourceId = DR.ResourceId }
            - { id: jfleet, text: F.FleetId = DR.FleetId }
            - { id: jsub, text: F.ResourceId = DR.SubscriptionId }
        - id: cond
          options:
            - { id: cdistinct, text: COUNT(DISTINCT F.DefaultConsistencyLevel) > 1 }
            - { id: ccount, text: COUNT(F.DefaultConsistencyLevel) > 1 }
            - { id: cmax, text: "MAX(F.DefaultConsistencyLevel) <> 'Session'" }
    answer:
      values: { tbl: tacc, join: jres, cond: cdistinct }
    explanation:
      correct:
        en: |
          FactAccountHourly stores the settings of each account, including its default consistency level, once per hour, and references the account only through ResourceId, which joins DimResource for the subscription and account name. Because there is one row per account and per hour, a change shows up as more than one distinct value over the period: COUNT(DISTINCT ...) > 1.
        fr: |
          FactAccountHourly stocke les paramètres de chaque compte, dont son niveau de cohérence par défaut, une fois par heure, et ne référence le compte que par ResourceId, qui se joint à DimResource pour l'abonnement et le nom du compte. Comme il y a une ligne par compte et par heure, une modification apparaît comme plus d'une valeur distincte sur la période : COUNT(DISTINCT ...) > 1.
      options:
        treq: { en: "FactRequestHourly counts requests per resource and hour; it holds no account settings.", fr: "FactRequestHourly compte les requêtes par ressource et par heure ; elle ne contient aucun paramètre de compte." }
        tmet: { en: "FactMeterUsageHourly holds the units consumed per billing meter, not the consistency level.", fr: "FactMeterUsageHourly contient les unités consommées par compteur de facturation, pas le niveau de cohérence." }
        jfleet: { en: "Joining on FleetId matches every account row with every resource of the fleet, so each account would get the names of all accounts.", fr: "Joindre sur FleetId associe chaque ligne de compte à toutes les ressources de la flotte : chaque compte recevrait les noms de tous les comptes." }
        jsub: { en: "A resource ID never equals a subscription ID; the facts reference the account through ResourceId.", fr: "Un ID de ressource n'est jamais égal à un ID d'abonnement ; les faits référencent le compte par ResourceId." }
        ccount: { en: "Every account has one row per hour, so COUNT(...) > 1 returns every account, changed or not.", fr: "Chaque compte a une ligne par heure : COUNT(...) > 1 renvoie tous les comptes, modifiés ou non." }
        cmax: { en: "This returns the accounts whose alphabetically highest level isn't Session, which says nothing about a change.", fr: "Cette condition renvoie les comptes dont le niveau le plus élevé dans l'ordre alphabétique n'est pas Session, ce qui ne dit rien d'une modification." }
    references:
      - title: Fleet Analytics Schema Reference (Preview) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics-schema-reference
      - title: Enable Fleet Analytics (Preview) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-enable-fleet-analytics

  # ------------------------------------------------------------------ 10
  - id: dp420-qz-24-10
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin's fleet was created in East US. Its fleetspace **fs-prod** has throughput pooling with the GeneralPurpose service tier, the data region West Europe and a maximum of 500,000 RU/s; FleetspaceAutoscaledThroughput never exceeds 150,000 RU/s. The tenant accounts of fs-prod come from three subscriptions and have a single write region in West Europe. The default pool limits apply.

        The container **orders** of one tenant account still receives 429 responses during its peaks.

        Which two situations could explain the throttling?

        NOTE: Each correct selection is worth one point.
      fr: |
        La flotte de Tailspin a été créée dans East US. Son fleetspace **fs-prod** a un pool de débit avec le niveau de service GeneralPurpose, la région de données West Europe et un maximum de 500 000 RU/s ; FleetspaceAutoscaledThroughput ne dépasse jamais 150 000 RU/s. Les comptes de locataires de fs-prod proviennent de trois abonnements et ont une seule région d'écriture, West Europe. Les limites par défaut des pools s'appliquent.

        Le conteneur **orders** d'un compte de locataire reçoit encore des réponses 429 pendant ses pics.

        Quelles sont les deux situations qui pourraient expliquer la limitation ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "orders has one physical partition with 6,000 dedicated RU/s, and its peak needs 11,000 RU/s spread over many keys.", fr: "orders a une partition physique avec 6 000 RU/s dédiées, et son pic exige 11 000 RU/s réparties sur de nombreuses clés." } }
        - { id: b, text: { en: "orders has one physical partition with 1,000 dedicated RU/s, and its peak needs 5,500 RU/s spread over many keys.", fr: "orders a une partition physique avec 1 000 RU/s dédiées, et son pic exige 5 500 RU/s réparties sur de nombreuses clés." } }
        - { id: c, text: { en: "orders has two physical partitions with 1,000 dedicated RU/s each, and 7,200 of its 9,000 peak RU/s hit one of them.", fr: "orders a deux partitions physiques avec 1 000 RU/s dédiées chacune, et 7 200 de ses 9 000 RU/s de pic touchent l'une d'elles." } }
        - { id: d, text: { en: "The tenant account is in West Europe, while the fleet resource that contains fs-prod was created in East US.", fr: "Le compte du locataire est dans West Europe, alors que la ressource de flotte qui contient fs-prod a été créée dans East US." } }
        - { id: e, text: { en: "The tenant account is in a different subscription and resource group from the fleet resource that contains fs-prod.", fr: "Le compte du locataire est dans un autre abonnement et un autre groupe de ressources que la ressource de flotte qui contient fs-prod." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Pooling works within physical partition limits: a partition can consume at most min(5,000 + its dedicated RU/s, 10,000). In a, the partition is capped at 10,000 RU/s, below the 11,000 RU/s needed. In c, the container's total ceiling looks sufficient, but the hot partition is capped at 6,000 RU/s while it receives 7,200 RU/s.
        fr: |
          Le pool fonctionne dans les limites des partitions physiques : une partition peut consommer au plus min(5 000 + ses RU/s dédiées, 10 000). Dans a, la partition plafonne à 10 000 RU/s, moins que les 11 000 RU/s nécessaires. Dans c, le plafond total du conteneur semble suffisant, mais la partition chaude plafonne à 6 000 RU/s alors qu'elle reçoit 7 200 RU/s.
      options:
        b: { en: "With 1,000 dedicated RU/s, the partition can reach 6,000 RU/s, more than the 5,500 RU/s needed, and the pool has free capacity.", fr: "Avec 1 000 RU/s dédiées, la partition peut atteindre 6 000 RU/s, plus que les 5 500 RU/s nécessaires, et le pool a de la capacité libre." }
        d: { en: "The region of the fleet resource doesn't determine the regions of its accounts; the pool serves the West Europe data region.", fr: "La région de la ressource de flotte ne détermine pas les régions de ses comptes ; le pool sert la région de données West Europe." }
        e: { en: "Fleets span subscriptions and resource groups, and pools share RU/s across accounts from different subscriptions.", fr: "Les flottes couvrent plusieurs abonnements et groupes de ressources, et les pools partagent des RU/s entre comptes de différents abonnements." }
    references:
      - title: Fleet Pools - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
      - title: Create a Fleet (Preview) - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-create-fleet
