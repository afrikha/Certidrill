chapter: 31-ai-retrieval
questions:
  # ------------------------------------------------------------------ 1
  - id: dp420-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        A product search on an Azure Cosmos DB for NoSQL container uses fuzzy full-text search, with filters such as `FullTextContains(c.name, {"term": @term, "distance": @d})`. The product team wants the search to tolerate as many typos per term as the feature allows.

        What is the highest value that you can pass as the distance?
      fr: |
        Une recherche de produits sur un conteneur Azure Cosmos DB for NoSQL utilise la recherche approximative en texte intégral, avec des filtres tels que `FullTextContains(c.name, {"term": @term, "distance": @d})`. L'équipe produit souhaite que la recherche tolère autant de fautes de frappe par terme que la fonctionnalité le permet.

        Quelle est la valeur la plus élevée que vous pouvez passer comme distance ?
    body:
      options:
        - { id: a, text: "1" }
        - { id: b, text: "2" }
        - { id: c, text: "3" }
        - { id: d, text: "5" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Fuzzy search is the object form of a term, `{"term": ..., "distance": n}`, where the distance is the number of edits tolerated between the stored word and the term. The maximum distance is 2.
        fr: |
          La recherche approximative est la forme objet d'un terme, `{"term": ..., "distance": n}`, où la distance est le nombre de modifications tolérées entre le mot stocké et le terme. La distance maximale est de 2.
      options:
        a: { en: "A distance of 1 is valid, but it isn't the maximum: fuzzy search accepts up to 2 edits.", fr: "Une distance de 1 est valide, mais ce n'est pas le maximum : la recherche approximative accepte jusqu'à 2 modifications." }
        c: { en: "3 exceeds the maximum edit distance of fuzzy search, which is 2.", fr: "3 dépasse la distance d'édition maximale de la recherche approximative, qui est de 2." }
        d: { en: "5 exceeds the maximum edit distance of fuzzy search, which is 2.", fr: "5 dépasse la distance d'édition maximale de la recherche approximative, qui est de 2." }
    references:
      - title: Use Full-Text Search - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search

  # ------------------------------------------------------------------ 2
  - id: dp420-qz-31-02
    objective: "3.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is about to load 4 million document embeddings, generated by its production embedding model, into a new Azure Cosmos DB for NoSQL container that has a diskANN index. Before go-live, you must measure the recall that users will get from the index.

        Which test should you run?
      fr: |
        Fabrikam s'apprête à charger 4 millions d'incorporations de documents, générées par son modèle d'incorporation de production, dans un nouveau conteneur Azure Cosmos DB for NoSQL doté d'un index diskANN. Avant la mise en production, vous devez mesurer le rappel que les utilisateurs obtiendront de l'index.

        Quel test devez-vous effectuer ?
    body:
      options:
        - { id: a, text: { en: "Load 4 million random vectors of the same size, and query them with random vectors.", fr: "Charger 4 millions de vecteurs aléatoires de même taille, et les interroger avec des vecteurs aléatoires." } }
        - { id: b, text: { en: "Load the real document embeddings, and query them with random vectors of the same size.", fr: "Charger les vraies incorporations de documents, et les interroger avec des vecteurs aléatoires de même taille." } }
        - { id: c, text: { en: "Load the embeddings of 500 real documents, and query them with real user questions.", fr: "Charger les incorporations de 500 vrais documents, et les interroger avec de vraies questions d'utilisateurs." } }
        - { id: d, text: { en: "Load the real document embeddings, and query them with embeddings of real user questions.", fr: "Charger les vraies incorporations de documents, et les interroger avec les incorporations de vraies questions d'utilisateurs." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Vector indexes are optimized for embeddings produced by semantic models; random vectors lack the structure that approximate indexes rely on and give misleading recall. Testing real document embeddings against embeddings of real questions, from the same model, measures the recall that users will see.
        fr: |
          Les index vectoriels sont optimisés pour les incorporations produites par des modèles sémantiques ; les vecteurs aléatoires n'ont pas la structure sur laquelle reposent les index approximatifs et donnent un rappel trompeur. Tester de vraies incorporations de documents avec les incorporations de vraies questions, issues du même modèle, mesure le rappel que verront les utilisateurs.
      options:
        a: { en: "Random vectors don't have the geometry of real embeddings, so the recall measured on them doesn't predict production recall.", fr: "Les vecteurs aléatoires n'ont pas la géométrie des vraies incorporations : le rappel mesuré sur eux ne prédit pas le rappel en production." }
        b: { en: "Random query vectors don't resemble real questions, so the measured recall is misleading even with real documents.", fr: "Des vecteurs de requête aléatoires ne ressemblent pas à de vraies questions : le rappel mesuré est trompeur, même avec de vrais documents." }
        c: { en: "Below 1,000 vectors, a diskANN index isn't used and the query runs a full scan, so the test wouldn't measure the index at all.", fr: "En dessous de 1 000 vecteurs, l'index diskANN n'est pas utilisé et la requête effectue une analyse complète : le test ne mesurerait pas du tout l'index." }
    references:
      - title: Integrated Vector Store - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search

  # ------------------------------------------------------------------ 3
  - id: dp420-qz-31-03
    objective: "3.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip's catalog container in Azure Cosmos DB for NoSQL declares two vector paths: `/textVector` (1,536 dimensions, `cosine`, diskANN index) for descriptions, and `/imageVector` (512 dimensions, `euclidean`, diskANN index) for photos. The photo embeddings were generated with an image model that is designed for Euclidean distance.

        A shopper uploads a photo, which the app embeds with the same image model into `@img`. You need to return the 10 products whose photos are the most similar, at the lowest RU cost.

        Which ORDER BY clause should you use?
      fr: |
        Le conteneur de catalogue de Wingtip dans Azure Cosmos DB for NoSQL déclare deux chemins vectoriels : `/textVector` (1 536 dimensions, `cosine`, index diskANN) pour les descriptions et `/imageVector` (512 dimensions, `euclidean`, index diskANN) pour les photos. Les incorporations des photos ont été générées avec un modèle d'image conçu pour la distance euclidienne.

        Un client charge une photo, que l'application incorpore avec le même modèle d'image dans `@img`. Vous devez renvoyer les 10 produits dont les photos sont les plus similaires, au coût en RU le plus faible.

        Quelle clause ORDER BY devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "ORDER BY VectorDistance(c.textVector, @img)" }
        - { id: b, text: "ORDER BY VectorDistance(c.imageVector, @img)" }
        - { id: c, text: "ORDER BY VectorDistance(c.imageVector, @img, true)" }
        - { id: d, text: "ORDER BY VectorDistance(c.imageVector, @img, false, {\"distanceFunction\": \"cosine\"})" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The query vector must be compared with the path that holds vectors from the same model and with the same dimensions: `/imageVector`. Without other arguments, VectorDistance uses the distance function of the policy (Euclidean) and the diskANN index, and ORDER BY returns the most similar photos first; combined with `TOP 10`, this is the cheapest correct search.
        fr: |
          Le vecteur de requête doit être comparé au chemin qui contient des vecteurs du même modèle et de mêmes dimensions : `/imageVector`. Sans autre argument, VectorDistance utilise la fonction de distance de la stratégie (euclidienne) et l'index diskANN, et ORDER BY renvoie d'abord les photos les plus similaires ; avec `TOP 10`, c'est la recherche correcte la moins coûteuse.
      options:
        a: { en: "`/textVector` holds 1,536-dimension text embeddings from another model; a 512-dimension image vector can't be compared with them meaningfully.", fr: "`/textVector` contient des incorporations de texte de 1 536 dimensions issues d'un autre modèle ; un vecteur d'image de 512 dimensions ne peut pas leur être comparé utilement." }
        c: { en: "`true` forces a brute-force search that ignores the diskANN index, which raises the RU cost.", fr: "`true` force une recherche par force brute qui ignore l'index diskANN, ce qui augmente le coût en RU." }
        d: { en: "Overriding the distance with cosine ranks the photos with a function the image model wasn't designed for.", fr: "Remplacer la distance par cosine classe les photos avec une fonction pour laquelle le modèle d'image n'a pas été conçu." }
    references:
      - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
        url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
      - title: Integrated Vector Store - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search

  # ------------------------------------------------------------------ 4
  - id: dp420-qz-31-04
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware is designing a container named **media** in Azure Cosmos DB for NoSQL. Each item has a `title` embedding of 768 dimensions and a `thumbnail` embedding of 512 dimensions, both stored as top-level properties. The container will have dedicated throughput.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware conçoit un conteneur nommé **media** dans Azure Cosmos DB for NoSQL. Chaque élément a une incorporation `title` de 768 dimensions et une incorporation `thumbnail` de 512 dimensions, toutes deux stockées comme propriétés de premier niveau. Le conteneur aura un débit dédié.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The vector embedding policy of media can declare both paths, each with its own dimensions and distance function.", fr: "La stratégie d'incorporation vectorielle de media peut déclarer les deux chemins, chacun avec ses propres dimensions et sa propre fonction de distance." }
        - id: s2
          text: { en: "If both embeddings were moved under an `embeddings` object, the policy could declare the single path `/embeddings/*` to cover them.", fr: "Si les deux incorporations étaient déplacées sous un objet `embeddings`, la stratégie pourrait déclarer le seul chemin `/embeddings/*` pour les couvrir." }
        - id: s3
          text: { en: "After media is created with a vector embedding policy, you can later turn vector search off for the container.", fr: "Une fois media créé avec une stratégie d'incorporation vectorielle, vous pouvez ensuite désactiver la recherche vectorielle pour le conteneur." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A container can have several vector paths, each with one policy entry that sets its own data type, dimensions and distance function. Wildcards such as `*` or `[]` aren't supported in vector paths, so each vector must be declared by its exact path. Once vector search is enabled on a container, it can't be disabled.
        fr: |
          Un conteneur peut avoir plusieurs chemins vectoriels, chacun avec une entrée de stratégie qui fixe son type de données, ses dimensions et sa fonction de distance. Les caractères génériques comme `*` ou `[]` ne sont pas pris en charge dans les chemins vectoriels : chaque vecteur doit être déclaré par son chemin exact. Une fois la recherche vectorielle activée sur un conteneur, elle ne peut pas être désactivée.
      options:
        s2: { en: "Vector paths can't use wildcards; declare `/embeddings/title` and `/embeddings/thumbnail` separately.", fr: "Les chemins vectoriels ne peuvent pas utiliser de caractères génériques ; déclarez séparément `/embeddings/title` et `/embeddings/thumbnail`." }
        s3: { en: "Vector search can't be disabled on a container once it's enabled; plan the policy before you create the container.", fr: "La recherche vectorielle ne peut pas être désactivée sur un conteneur une fois activée ; planifiez la stratégie avant de créer le conteneur." }
    references:
      - title: Integrated Vector Store - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search

  # ------------------------------------------------------------------ 5
  - id: dp420-qz-31-05
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum's RAG service stores document chunks and their embeddings in Azure Cosmos DB for NoSQL for 60 customers. Each customer pays for its own guaranteed throughput, and a burst of vector queries by one customer must not consume the throughput of the others. The customers don't require physical isolation, customer-managed keys or their own regions. Operations must stay in a single account.

        Which design should you use?
      fr: |
        Le service RAG d'Adatum stocke des segments de documents et leurs incorporations dans Azure Cosmos DB for NoSQL pour 60 clients. Chaque client paie son propre débit garanti, et une rafale de requêtes vectorielles d'un client ne doit pas consommer le débit des autres. Les clients n'exigent ni isolation physique, ni clés gérées par le client, ni régions propres. L'exploitation doit rester dans un seul compte.

        Quelle conception devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "One container per customer, each with its own dedicated throughput", fr: "Un conteneur par client, chacun avec son propre débit dédié" } }
        - { id: b, text: { en: "One database per customer, each with shared database throughput", fr: "Une base de données par client, chacune avec un débit de base de données partagé" } }
        - { id: c, text: { en: "One shared container partitioned by the customer ID, with one throughput", fr: "Un conteneur partagé partitionné par l'ID du client, avec un seul débit" } }
        - { id: d, text: { en: "One Azure Cosmos DB account per customer, each with its own throughput", fr: "Un compte Azure Cosmos DB par client, chacun avec son propre débit" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A container per tenant gives performance isolation inside one account: each container has its own throughput, so one customer's burst can't use another's RU/s. Physical isolation isn't required, so a dedicated account isn't needed, and dedicated container throughput is compatible with vector search.
        fr: |
          Un conteneur par locataire offre une isolation des performances au sein d'un seul compte : chaque conteneur a son propre débit, si bien que la rafale d'un client ne peut pas utiliser les RU/s d'un autre. L'isolation physique n'est pas exigée, donc un compte dédié n'est pas nécessaire, et le débit dédié d'un conteneur est compatible avec la recherche vectorielle.
      options:
        b: { en: "Vector search isn't supported with shared throughput provisioned on a database.", fr: "La recherche vectorielle n'est pas prise en charge avec un débit partagé provisionné sur une base de données." }
        c: { en: "A shared container gives only logical isolation: all customers draw from the same RU/s, so one burst can throttle the others.", fr: "Un conteneur partagé n'offre qu'une isolation logique : tous les clients puisent dans les mêmes RU/s, et une rafale peut limiter les autres." }
        d: { en: "An account per tenant gives physical isolation that isn't required and breaks the single-account requirement.", fr: "Un compte par locataire offre une isolation physique qui n'est pas exigée et enfreint l'exigence d'un compte unique." }
    references:
      - title: Multitenancy - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/multi-tenancy-vector-search
      - title: Integrated Vector Store - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search

  # ------------------------------------------------------------------ 6
  - id: dp420-qz-31-06
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin's outdoor store keeps its products in an Azure Cosmos DB for NoSQL container with a full-text policy and a full-text index on `/description` (en-US). The search page receives the shopper's words in `@w1` and `@w2` and shows the products whose description contains at least one of them.

        Next to the results, the page must show two facets computed on the same matching products: the number of products per brand, and the number of products priced from 50 to 99.99.

        How should you complete the two queries? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        La boutique de plein air de Tailspin conserve ses produits dans un conteneur Azure Cosmos DB for NoSQL doté d'une stratégie de texte intégral et d'un index de texte intégral sur `/description` (en-US). La page de recherche reçoit les mots du client dans `@w1` et `@w2` et affiche les produits dont la description contient au moins l'un d'eux.

        À côté des résultats, la page doit afficher deux facettes calculées sur les mêmes produits correspondants : le nombre de produits par marque, et le nombre de produits dont le prix va de 50 à 99,99.

        Comment devez-vous compléter les deux requêtes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        SELECT c.brand AS facetKey, [[agg]] AS facetCount
        FROM c
        WHERE FullTextContainsAny(c.description, @w1, @w2)
        [[clause]] c.brand

        SELECT [[range]](c.price >= 50 AND c.price < 100) AS from50to100
        FROM c
        WHERE FullTextContainsAny(c.description, @w1, @w2)
      slots:
        - id: agg
          options:
            - { id: acount, text: COUNT(1) }
            - { id: ascore, text: "FullTextScore(c.description, @w1, @w2)" }
            - { id: amax, text: MAX(c.brand) }
        - id: range
          options:
            - { id: rcountif, text: COUNTIF }
            - { id: rcount, text: COUNT }
            - { id: rsum, text: SUM }
        - id: clause
          options:
            - { id: cgroup, text: GROUP BY }
            - { id: corder, text: ORDER BY }
            - { id: crank, text: ORDER BY RANK }
    answer:
      values: { agg: acount, clause: cgroup, range: rcountif }
    explanation:
      correct:
        en: |
          Full-text search has no dedicated facet operator: you compute facets on the filtered set. A value facet groups the matching products with `GROUP BY` and counts each group with `COUNT(1)`; a range facet counts the matching products that meet a condition with `COUNTIF`.
        fr: |
          La recherche en texte intégral n'a pas d'opérateur de facette dédié : vous calculez les facettes sur l'ensemble filtré. Une facette de valeurs regroupe les produits correspondants avec `GROUP BY` et compte chaque groupe avec `COUNT(1)` ; une facette de plage compte les produits correspondants qui remplissent une condition avec `COUNTIF`.
      options:
        ascore: { en: "FullTextScore can't be projected in SELECT; it only appears after ORDER BY RANK.", fr: "FullTextScore ne peut pas être projetée dans SELECT ; elle n'apparaît qu'après ORDER BY RANK." }
        amax: { en: "MAX(c.brand) returns a brand name, not the number of products of the brand.", fr: "MAX(c.brand) renvoie un nom de marque, pas le nombre de produits de la marque." }
        rcount: { en: "COUNT counts every item for which the expression is defined; a boolean condition is defined for every product, so it would count them all.", fr: "COUNT compte chaque élément pour lequel l'expression est définie ; une condition booléenne est définie pour chaque produit : il les compterait tous." }
        rsum: { en: "SUM adds numeric values; it doesn't count the items that meet a condition.", fr: "SUM additionne des valeurs numériques ; il ne compte pas les éléments qui remplissent une condition." }
        corder: { en: "ORDER BY sorts the items; it doesn't aggregate them by brand, so COUNT(1) can't produce one count per brand.", fr: "ORDER BY trie les éléments ; il ne les agrège pas par marque, et COUNT(1) ne peut pas produire un total par marque." }
        crank: { en: "ORDER BY RANK only takes a scoring function such as FullTextScore or RRF, not a property.", fr: "ORDER BY RANK n'accepte qu'une fonction de score comme FullTextScore ou RRF, pas une propriété." }
    references:
      - title: Use Full-Text Search - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
      - title: ORDER BY RANK - Query Language for Cosmos DB (in Azure and Fabric)
        url: https://learn.microsoft.com/en-us/cosmos-db/query/order-by-rank

  # ------------------------------------------------------------------ 7
  - id: dp420-qz-31-07
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware's legal library stores 900,000 rulings in an Azure Cosmos DB for NoSQL container. The account is configured for full-text search, and the container has a full-text policy and full-text indexes on `/title` and `/body` (en-US). The container has no vector embedding policy, and the budget doesn't allow generating embeddings this year.

        Users type keywords, passed as `@k1` and `@k2`. You need to return the 20 rulings ranked by one fused ranking in which BM25 relevance on the title and BM25 relevance on the body both count.

        Which ORDER BY clause should you use?
      fr: |
        La bibliothèque juridique de Proseware stocke 900 000 décisions dans un conteneur Azure Cosmos DB for NoSQL. Le compte est configuré pour la recherche en texte intégral, et le conteneur a une stratégie de texte intégral et des index de texte intégral sur `/title` et `/body` (en-US). Le conteneur n'a pas de stratégie d'incorporation vectorielle, et le budget ne permet pas de générer des incorporations cette année.

        Les utilisateurs saisissent des mots-clés, passés dans `@k1` et `@k2`. Vous devez renvoyer les 20 décisions classées selon un classement fusionné dans lequel la pertinence BM25 sur le titre et la pertinence BM25 sur le corps comptent toutes les deux.

        Quelle clause ORDER BY devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "ORDER BY RANK FullTextScore(c.title, @k1, @k2), FullTextScore(c.body, @k1, @k2)" }
        - { id: b, text: "ORDER BY RANK RRF(FullTextScore(c.title, @k1, @k2), FullTextScore(c.body, @k1, @k2))" }
        - { id: c, text: "ORDER BY RANK RRF(FullTextScore(c.title, @k1, @k2), VectorDistance(c.body, @k1))" }
        - { id: d, text: "ORDER BY RANK FullTextScore(c.title, @k1, @k2) with WHERE FullTextContainsAny(c.body, @k1, @k2)" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          RRF fuses two or more scoring functions into one ranking, and these functions can be two FullTextScore functions; RRF requires a full-text index, not a vector index. Fusing the BM25 ranking of the title with that of the body therefore needs no embeddings.
        fr: |
          RRF fusionne deux fonctions de score ou plus en un seul classement, et ces fonctions peuvent être deux fonctions FullTextScore ; RRF exige un index de texte intégral, pas un index vectoriel. Fusionner le classement BM25 du titre avec celui du corps ne nécessite donc aucune incorporation.
      options:
        a: { en: "ORDER BY RANK expects a single scoring function; to combine two rankings, you wrap them in RRF.", fr: "ORDER BY RANK attend une seule fonction de score ; pour combiner deux classements, vous les placez dans RRF." }
        c: { en: "VectorDistance compares vectors; `/body` holds text and the container has no vector policy or embeddings.", fr: "VectorDistance compare des vecteurs ; `/body` contient du texte et le conteneur n'a ni stratégie vectorielle ni incorporations." }
        d: { en: "The body filter only removes rulings; the order still depends on the title relevance alone, not on a fused ranking.", fr: "Le filtre sur le corps ne fait qu'écarter des décisions ; l'ordre ne dépend toujours que de la pertinence du titre, pas d'un classement fusionné." }
    references:
      - title: RRF - Query Language for Cosmos DB (in Azure and Fabric)
        url: https://learn.microsoft.com/en-us/cosmos-db/query/rrf
      - title: Use Hybrid Search - Azure Cosmos DB for NoSQL
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search

  # ------------------------------------------------------------------ 8
  - id: dp420-qz-31-08
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso hosts the engineering documents of 400 tenants in an Azure Cosmos DB for NoSQL container named **docs**, partitioned by `/tenantId`. No tenant stores more than 8 GB, and the container spans 30 physical partitions. Each tenant has several projects. The indexing policy of docs defines the following vector index:

        ```json
        { "path": "/embedding", "type": "diskANN", "vectorIndexShardKey": ["/projectId"] }
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso héberge les documents d'ingénierie de 400 locataires dans un conteneur Azure Cosmos DB for NoSQL nommé **docs**, partitionné par `/tenantId`. Aucun locataire ne stocke plus de 8 Go, et le conteneur s'étend sur 30 partitions physiques. Chaque locataire a plusieurs projets. La stratégie d'indexation de docs définit l'index vectoriel suivant :

        ```json
        { "path": "/embedding", "type": "diskANN", "vectorIndexShardKey": ["/projectId"] }
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A vector query with `WHERE c.tenantId = @t AND c.projectId = @p` searches one physical partition and only the DiskANN index of that project.", fr: "Une requête vectorielle avec `WHERE c.tenantId = @t AND c.projectId = @p` porte sur une seule partition physique et uniquement sur l'index DiskANN de ce projet." }
        - id: s2
          text: { en: "A vector query with `WHERE c.projectId = @p` and no tenant filter is sent to a single physical partition.", fr: "Une requête vectorielle avec `WHERE c.projectId = @p` et sans filtre sur le locataire est envoyée à une seule partition physique." }
        - id: s3
          text: { en: "For `/projectId` to be a valid shard key, docs would have to use `/projectId` as its partition key.", fr: "Pour que `/projectId` soit une clé de shard valide, docs devrait utiliser `/projectId` comme clé de partition." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          The partition key routes a query: with an equality filter on tenantId, the query reaches the single partition of that tenant, and the equality filter on projectId focuses it on the DiskANN index of that project. The shard key doesn't route queries, so a filter on projectId alone still fans out to every physical partition. A shard key can be any property of the items, including but not limited to the partition key.
        fr: |
          La clé de partition achemine la requête : avec un filtre d'égalité sur tenantId, la requête atteint la seule partition de ce locataire, et le filtre d'égalité sur projectId la concentre sur l'index DiskANN de ce projet. La clé de shard n'achemine pas les requêtes : un filtre sur projectId seul est toujours distribué à toutes les partitions physiques. Une clé de shard peut être n'importe quelle propriété des éléments, la clé de partition comprise mais pas seulement.
      options:
        s2: { en: "Without a partition key filter, a vector query fans out to every physical partition and merges the results, even if it targets one shard in each.", fr: "Sans filtre sur la clé de partition, une requête vectorielle est distribuée à toutes les partitions physiques puis fusionne les résultats, même si elle cible un seul shard dans chacune." }
        s3: { en: "vectorIndexShardKey can point to any item property; it doesn't have to be the partition key.", fr: "vectorIndexShardKey peut désigner n'importe quelle propriété des éléments ; ce n'est pas forcément la clé de partition." }
    references:
      - title: Sharded DiskANN Focused Vector Search for Better Performance and Lower Cost - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/sharded-diskann
      - title: Multitenancy - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/multi-tenancy-vector-search

  # ------------------------------------------------------------------ 9
  - id: dp420-qz-31-09
    objective: "3.1.6"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove runs two Azure Cosmos DB for NoSQL containers:

        - **catalog**: 1,536-dimension embeddings with a quantizedFlat index; every query is filtered to one category of at most 20,000 products.
        - **news**: 3,072-dimension embeddings with a diskANN index, a continuous stream of new articles, and an archive search that combines a selective condition on the publication date with the similarity search.

        You need to choose the setting that meets each requirement.

        Which setting should you use for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove exploite deux conteneurs Azure Cosmos DB for NoSQL :

        - **catalog** : incorporations de 1 536 dimensions avec un index quantizedFlat ; chaque requête est limitée à une catégorie d'au plus 20 000 produits.
        - **news** : incorporations de 3 072 dimensions avec un index diskANN, un flux continu de nouveaux articles et une recherche d'archives qui combine une condition sélective sur la date de publication avec la recherche de similarité.

        Vous devez choisir le paramètre qui répond à chaque exigence.

        Quel paramètre devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: qbs, text: quantizationByteSize }
        - { id: isl, text: indexingSearchListSize }
        - { id: fpr, text: filterPriority }
        - { id: slm, text: searchListSizeMultiplier }
        - { id: qvl, text: quantizedVectorListMultiplier }
      targets:
        - { id: t1, text: { en: "In the indexing policy of catalog, make every vector search more accurate; higher RU and latency are acceptable", fr: "Dans la stratégie d'indexation de catalog, rendre chaque recherche vectorielle plus précise ; des RU et une latence plus élevées sont acceptables" } }
        - { id: t2, text: { en: "In the indexing policy of news, shorten index builds and lower the ingestion latency; a small loss of accuracy is acceptable", fr: "Dans la stratégie d'indexation de news, raccourcir la construction de l'index et réduire la latence d'ingestion ; une légère perte de précision est acceptable" } }
        - { id: t3, text: { en: "In the archive query of news, change how strongly the date condition weighs against the DiskANN search", fr: "Dans la requête d'archives de news, modifier le poids de la condition de date par rapport à la recherche DiskANN" } }
    answer:
      mapping: { t1: qbs, t2: isl, t3: fpr }
    explanation:
      correct:
        en: |
          quantizationByteSize is an index setting of quantizedFlat and diskANN: a larger value makes searches more accurate at a higher RU cost and latency. indexingSearchListSize applies to diskANN only and sets how many vectors are searched during index build: a smaller value builds faster and lowers ingestion latency, with a possible loss of accuracy. filterPriority is a VectorDistance option that sets the weight of the WHERE filter against the DiskANN search.
        fr: |
          quantizationByteSize est un paramètre d'index de quantizedFlat et diskANN : une valeur plus grande rend les recherches plus précises, avec un coût en RU et une latence plus élevés. indexingSearchListSize s'applique uniquement à diskANN et fixe le nombre de vecteurs parcourus pendant la construction de l'index : une valeur plus petite construit plus vite et réduit la latence d'ingestion, au prix d'une précision éventuellement moindre. filterPriority est une option de VectorDistance qui fixe le poids du filtre WHERE par rapport à la recherche DiskANN.
      options:
        slm: { en: "searchListSizeMultiplier is a query option that trades RU and latency for recall in a DiskANN search; it isn't set in the indexing policy and doesn't weight the filter.", fr: "searchListSizeMultiplier est une option de requête qui échange des RU et de la latence contre du rappel dans une recherche DiskANN ; elle ne se définit pas dans la stratégie d'indexation et ne pondère pas le filtre." }
        qvl: { en: "quantizedVectorListMultiplier is a query option that rechecks more quantized candidates; it isn't part of the indexing policy.", fr: "quantizedVectorListMultiplier est une option de requête qui revérifie davantage de candidats quantifiés ; elle ne fait pas partie de la stratégie d'indexation." }
    references:
      - title: Indexing policies - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
      - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
        url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance

  # ------------------------------------------------------------------ 10
  - id: dp420-qz-31-10
    objective: "3.1.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind's single-turn support bot answers each question independently, with no conversation history. Before calling the chat model, it embeds the question and runs a vector query on a cache container in Azure Cosmos DB for NoSQL; it returns the cached answer of the closest entry when the similarity score is above 0.70. Otherwise, it runs RAG on the product container and writes the question embedding and the answer to the cache.

        Two problems are reported:

        - "How do I reset my PIN?" sometimes receives the cached answer to "How do I reset my password?".
        - After the monthly price update, cached answers keep quoting old prices. Cached answers must never be served more than 24 hours after they were generated.

        You need to fix both problems while keeping the cache, with the least development effort.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le bot de support à un seul tour de Northwind répond à chaque question indépendamment, sans historique de conversation. Avant d'appeler le modèle de conversation, il incorpore la question et exécute une requête vectorielle sur un conteneur de cache dans Azure Cosmos DB for NoSQL ; il renvoie la réponse en cache de l'entrée la plus proche quand le score de similarité dépasse 0,70. Sinon, il exécute le RAG sur le conteneur des produits et écrit l'incorporation de la question et la réponse dans le cache.

        Deux problèmes sont signalés :

        - « Comment réinitialiser mon code PIN ? » reçoit parfois la réponse en cache à « Comment réinitialiser mon mot de passe ? ».
        - Après la mise à jour mensuelle des prix, les réponses en cache continuent de citer les anciens prix. Les réponses en cache ne doivent jamais être servies plus de 24 heures après leur génération.

        Vous devez corriger les deux problèmes en conservant le cache, avec un minimum d'effort de développement.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Raise the similarity threshold of the cache query, for example to 0.92.", fr: "Relever le seuil de similarité de la requête sur le cache, par exemple à 0,92." } }
        - { id: b, text: { en: "Lower the similarity threshold of the cache query, for example to 0.50.", fr: "Abaisser le seuil de similarité de la requête sur le cache, par exemple à 0,50." } }
        - { id: c, text: { en: "Embed the conversation context with the question and use that vector as the cache key.", fr: "Incorporer le contexte de la conversation avec la question et utiliser ce vecteur comme clé du cache." } }
        - { id: d, text: { en: "Enable time to live on the cache container with a default of 86,400 seconds.", fr: "Activer la durée de vie (TTL) sur le conteneur de cache avec une valeur par défaut de 86 400 secondes." } }
        - { id: e, text: { en: "Return the TOP 5 closest cache entries instead of the closest one.", fr: "Renvoyer les 5 entrées du cache les plus proches (TOP 5) au lieu de la plus proche." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          A similarity threshold that is too low makes the cache return answers that don't match the user's intent; raising it keeps only near-identical questions as hits. A default time to live of 86,400 seconds on the cache container deletes every cached answer 24 hours after it was written, with no code to maintain.
        fr: |
          Un seuil de similarité trop bas fait renvoyer par le cache des réponses qui ne correspondent pas à l'intention de l'utilisateur ; le relever ne conserve comme correspondances que les questions quasi identiques. Une durée de vie par défaut de 86 400 secondes sur le conteneur de cache supprime chaque réponse en cache 24 heures après son écriture, sans code à maintenir.
      options:
        b: { en: "A lower threshold produces more hits, so even more questions with another intent would receive a cached answer.", fr: "Un seuil plus bas produit davantage de correspondances : encore plus de questions d'une autre intention recevraient une réponse en cache." }
        c: { en: "Keying on the context fixes follow-up questions in a conversation; this bot has no conversation history, and the PIN question is a standalone question.", fr: "Utiliser le contexte comme clé corrige les questions de suivi d'une conversation ; ce bot n'a pas d'historique, et la question sur le code PIN est une question autonome." }
        e: { en: "Returning more cache entries doesn't stop a wrong entry from scoring above the threshold, and does nothing about stale prices.", fr: "Renvoyer plus d'entrées du cache n'empêche pas une mauvaise entrée de dépasser le seuil, et ne règle pas les prix obsolètes." }
    references:
      - title: Semantic Cache for Large Language Models - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/semantic-cache
