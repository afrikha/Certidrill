# DP-420 — Building AI Applications with Azure Cosmos DB
# (Microsoft Certified: Azure Cosmos DB AI Developer Associate — renamed and re-leveled from the
# former "Azure Cosmos DB Developer Specialty" on October 6, 2026; the exam content was largely rewritten.)
# Source: official study guide, "Skills measured as of October 6, 2026" (en-us and fr-fr pages,
# checked on 2026-11-16): https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-420
# Real exam: 100 minutes, passing score 700/1000, proctored, "may have interactive components"
# (certification page). Microsoft does not publish the number of questions nor the presence of
# case studies; the structure below follows the factory default for associate exams.
# typeMix: developer exam (C# or Python SDK code, queries, JSON policies) — more `dropdown` with code,
# fewer Yes/No statements and ordering than AZ-104. Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
certification:
  code: dp-420
  title: "Building AI Applications with Azure Cosmos DB"
  vendor: Microsoft
  active: false

blueprint:
  version: "2026-10-06"
  durationMin: 100
  # Microsoft does not publish the number of questions; the simulator draws a total in this range.
  questionCount: { min: 45, max: 58 }
  passScore: 700
  maxScore: 1000

  # Target share of each question type in an exam (0..1). series_yesno is driven by structure.series.
  typeMix:
    single: { min: 0.35, max: 0.45 }
    multi: { min: 0.10, max: 0.15 }
    yesno_statements: { min: 0.05, max: 0.10 }
    dropdown: { min: 0.20, max: 0.30 }
    dragdrop: { min: 0.05, max: 0.10 }
    ordering: { min: 0.00, max: 0.05 }
    hotarea: { min: 0.00, max: 0.05 }

  difficultyMix: { easy: 0.30, medium: 0.50, hard: 0.20 }

  structure:
    caseStudies:
      count: { min: 1, max: 1 }
      questionsEach: { min: 4, max: 6 }
      placement: random
    series:
      count: { min: 1, max: 1 }
      questionsEach: { min: 3, max: 3 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # Readiness and progression rules: same values as AZ-104 (see content/az-104/blueprint.yaml for the comments).
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale: { from: 600, to: 850 }
      weights: { level: 0.5, consistency: 0.2, domains: 0.2, freshness: 0.1 }
      bands: { progressing: 50, almost: 70, ready: 85 }
      freshness: { staleDays: 30, zeroDays: 90, minNewShare: 0.5 }
    progression:
      xp:
        base: 50
        scoreFrom: 400
        perPoint: 0.5
        knownShare: 0.5
        passBonus: 100
        bestBonus: 75
        domainBonus: 50
        domainGain: 50
      levels:
        - { xp: 0, title: { en: "Document intern", fr: "Stagiaire documents" } }
        - { xp: 150, title: { en: "Container novice", fr: "Novice des conteneurs" } }
        - { xp: 400, title: { en: "Point reader", fr: "Lecteur ponctuel" } }
        - { xp: 750, title: { en: "Partition scout", fr: "Éclaireur des partitions" } }
        - { xp: 1200, title: { en: "Junior Cosmos developer", fr: "Développeur Cosmos junior" } }
        - { xp: 1750, title: { en: "RU optimizer", fr: "Optimiseur de RU" } }
        - { xp: 2400, title: { en: "Change feed specialist", fr: "Spécialiste du flux de modification" } }
        - { xp: 3150, title: { en: "Vector search builder", fr: "Bâtisseur de recherche vectorielle" } }
        - { xp: 4000, title: { en: "Cosmos DB architect", fr: "Architecte Cosmos DB" } }
        - { xp: 5000, title: { en: "Cosmos legend", fr: "Légende Cosmos" } }
      mastery: { bronze: 650, silver: 700, gold: 850 }
      badges:
        hatTrick: { count: 3, min: 800 }
        regular: { weeks: 4 }
        comeback: { gain: 150 }

domains:
  - code: develop
    order: 1
    weight: { min: 0.40, max: 0.45 }
    title:
      en: "Design and develop database solutions"
      fr: "Concevoir et développer des solutions de base de données"
  - code: secure-optimize
    order: 2
    weight: { min: 0.30, max: 0.35 }
    title:
      en: "Secure, optimize, and deploy database solutions"
      fr: "Sécuriser, optimiser et déployer des solutions de base de données"
  - code: ai-analytics
    order: 3
    weight: { min: 0.20, max: 0.25 }
    title:
      en: "Implement AI and analytics capabilities in database solutions"
      fr: "Implémenter des fonctionnalités d'IA et d'analytique dans les solutions de base de données"
