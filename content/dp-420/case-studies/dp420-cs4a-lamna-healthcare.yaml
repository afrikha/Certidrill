id: dp420-cs4a-lamna-healthcare
status: draft
title:
  en: Lamna Healthcare
  fr: Lamna Healthcare
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lamna Healthcare operates 40 hospitals in Canada. A team of eight developers builds internal applications.

        Lamna is developing **Lamna Assist**, a clinical knowledge assistant. Clinicians ask questions in natural language, and the assistant answers by using the clinical protocols of their own hospital (Retrieval-Augmented Generation). Lamna Assist is written in Python 3.12, uses the `azure-cosmos` SDK and runs in Azure Container Apps. Embeddings are generated by an embedding model deployed in Microsoft Foundry.
      fr: |
        Lamna Healthcare exploite 40 hôpitaux au Canada. Une équipe de huit développeurs crée les applications internes.

        Lamna développe **Lamna Assist**, un assistant de connaissances cliniques. Les cliniciens posent des questions en langage naturel, et l'assistant répond à l'aide des protocoles cliniques de leur propre hôpital (génération augmentée par récupération, RAG). Lamna Assist est écrit en Python 3.12, utilise le SDK `azure-cosmos` et s'exécute dans Azure Container Apps. Les embeddings sont générés par un modèle d'embedding déployé dans Microsoft Foundry.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Lamna has an Azure Cosmos DB for NoSQL account named **cosmos-lamna**. The account has a single write region (Canada Central) and one read region (Canada East), uses Session consistency and the periodic backup mode. The vector search and full-text search features are enabled on the account. The account contains a database named **assist** whose containers each have their own autoscale throughput.

        | Container | Partition key | Content |
        | --- | --- | --- |
        | chunks | /protocolId | Protocol chunks. Each item contains `hospitalId`, `protocolId`, `chunkText` (English text) and `embedding` (1,536 dimensions, float32, cosine distance). |
        | patients | /patientId | Patient records, including the `ssn`, `email` and `phone` properties. |

        Each hospital has between 120,000 and 400,000 chunks. A protocol is split into 50 to 300 chunks. A protocol is revised by publishing a new version with new chunks; the title of a published version never changes.

        The following identities access the account:

        | Identity | Type | Use |
        | --- | --- | --- |
        | Support-Analysts | Microsoft Entra group | Analysts who troubleshoot patient records by running queries |
        | id-intake | Managed identity | Intake API that creates and updates patient records |
        | id-review | Managed identity | Clinical review app that reads patient records |
      fr: |
        Lamna dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-lamna**. Le compte a une seule région d'écriture (Canada Central) et une région de lecture (Canada East), utilise la cohérence Session et le mode de sauvegarde périodique. Les fonctionnalités de recherche vectorielle et de recherche en texte intégral sont activées sur le compte. Le compte contient une base de données nommée **assist** dont chaque conteneur a son propre débit en mode mise à l'échelle automatique (autoscale).

        | Conteneur | Clé de partition | Contenu |
        | --- | --- | --- |
        | chunks | /protocolId | Segments (chunks) de protocoles. Chaque élément contient `hospitalId`, `protocolId`, `chunkText` (texte en anglais) et `embedding` (1 536 dimensions, float32, distance cosinus). |
        | patients | /patientId | Dossiers des patients, dont les propriétés `ssn`, `email` et `phone`. |

        Chaque hôpital possède entre 120 000 et 400 000 segments. Un protocole est découpé en 50 à 300 segments. Un protocole est révisé en publiant une nouvelle version avec de nouveaux segments ; le titre d'une version publiée ne change jamais.

        Les identités suivantes accèdent au compte :

        | Identité | Type | Usage |
        | --- | --- | --- |
        | Support-Analysts | Groupe Microsoft Entra | Analystes qui diagnostiquent les dossiers des patients en exécutant des requêtes |
        | id-intake | Identité managée | API d'admission qui crée et met à jour les dossiers des patients |
        | id-review | Identité managée | Application de revue clinique qui lit les dossiers des patients |
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Retrieval**

        1. A search must evaluate only the chunks of the clinician's hospital, with the lowest possible RU charge and latency.
        2. Results must be ranked by combining semantic similarity and keyword relevance. Semantic similarity must weigh twice as much as keyword relevance.
        3. Each search result must display the title and version of its protocol without any additional request to Azure Cosmos DB.

        **Conversations**

        4. A new container named **conversations** will store each conversation turn as a separate item. For each request, the assistant reloads the 20 most recent turns of the current session at the lowest possible RU cost.
        5. Turns must be deleted automatically 30 days after their last modification, except the turns of conversations that a clinician pins, which must be kept indefinitely.

        **Security**

        6. Key-based authentication will be disabled on cosmos-lamna.
        7. Members of Support-Analysts must be able to query patient records, but the `ssn` and `email` values must be masked for them. The clinical review app must see unmasked values. Every identity must receive only the permissions it needs.

        **Recovery**

        8. Developers must be able to restore the patients container to any point in time within the last 30 days without contacting Microsoft support. Costs must be minimized.
      fr: |
        **Recherche**

        1. Une recherche ne doit évaluer que les segments de l'hôpital du clinicien, avec la consommation de RU et la latence les plus faibles possible.
        2. Les résultats doivent être classés en combinant la similarité sémantique et la pertinence par mots clés. La similarité sémantique doit peser deux fois plus que la pertinence par mots clés.
        3. Chaque résultat de recherche doit afficher le titre et la version de son protocole sans aucune requête supplémentaire vers Azure Cosmos DB.

        **Conversations**

        4. Un nouveau conteneur nommé **conversations** stockera chaque tour de conversation dans un élément distinct. À chaque demande, l'assistant recharge les 20 tours les plus récents de la session en cours, avec le coût en RU le plus faible possible.
        5. Les tours doivent être supprimés automatiquement 30 jours après leur dernière modification, sauf les tours des conversations qu'un clinicien épingle, qui doivent être conservés indéfiniment.

        **Sécurité**

        6. L'authentification par clé sera désactivée sur cosmos-lamna.
        7. Les membres de Support-Analysts doivent pouvoir interroger les dossiers des patients, mais les valeurs `ssn` et `email` doivent être masquées pour eux. L'application de revue clinique doit voir les valeurs non masquées. Chaque identité ne doit recevoir que les autorisations dont elle a besoin.

        **Récupération**

        8. Les développeurs doivent pouvoir restaurer le conteneur patients à n'importe quel point dans le temps des 30 derniers jours sans contacter le support Microsoft. Les coûts doivent être réduits au minimum.
