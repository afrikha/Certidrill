# SOA-C03 — AWS Certified CloudOps Engineer – Associate (formerly AWS Certified SysOps Administrator – Associate)
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-19):
#   - AWS Certified CloudOps Engineer - Associate (SOA-C03) Exam Guide, HTML pages and Markdown copies under
#     https://docs.aws.amazon.com/aws-certification/latest/sysops-administrator-associate-03/sysops-administrator-associate-03.html
#     (domain pages sysops-administrator-associate-03-domain1..5, soa-03-in-scope-services,
#     soa-03-out-of-scope-services, sysops-administrator-associate-03-comparison, soa-03-revisions).
#     The fr_fr path serves the English text: no French guide exists.
#   - Certification page: https://aws.amazon.com/certification/certified-cloudops-engineer-associate/
#     (current version SOA-C03; 130 minutes, 65 questions, multiple choice or multiple response,
#     150 USD; languages English, Japanese, Korean, Simplified Chinese — Simplified Chinese and
#     Korean versions retire after November 19, 2026; renamed from SysOps Administrator – Associate).
# Guide version: 1.2, published October 29, 2026 (Revisions page: 1.0 September 30, 2025;
# 1.1 June 1, 2026; 1.2 October 29, 2026) → blueprint.version '2026-10-29'. Comparison page:
# SOA-C02 in use until September 29, 2025; SOA-C03 from September 30, 2025.
# Exam facts: 65 questions = 50 scored + 15 unscored (not identified); scaled score 100–1,000,
# pass at 720, compensatory scoring; response types: multiple choice (1 correct of 4) and multiple
# response (2 or more correct of 5 or more). No exam labs (SOA-C02 labs suspended since
# March 28, 2023; the SOA-C03 guide lists only the two response types). The guide does not state
# the duration (130 min from the certification page).
# Unscored questions are not modelled: the mock exam scores all 65 questions.
# Domain weights: share of scored content as published (22 / 22 / 22 / 16 / 18 %).
certification:
  code: soa-c03
  title: AWS Certified CloudOps Engineer – Associate
  vendor: AWS
  # The official exam is not offered in French: the site offers this certification in English only
  # (the French files written earlier stay in the repository, unused).
  languages: [en]
  active: false

blueprint:
  version: '2026-10-29'
  durationMin: 130
  questionCount: { min: 65, max: 65 }
  passScore: 720
  maxScore: 1000
  # AWS gives no partial credit on multiple-response questions (see docs/SPECS-AWS.md §3.3);
  # dragdrop states the AWS rule too, though this exam has no such question.
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing

  # Target share of each question type in an exam (0..1). The real exam has only
  # multiple choice (single) and multiple response (multi).
  typeMix:
    single: { min: 0.78, max: 0.88 }
    multi: { min: 0.12, max: 0.22 }

  difficultyMix: { easy: 0.30, medium: 0.50, hard: 0.20 }

  structure:
    caseStudies:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
      placement: end
    series:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # Readiness index (0–100), the central indicator of the dashboard.
    # index = weighted sum of four criteria, each worth 0–100 points:
    #   level       — weighted average of the last `window` exams, weights 1, 2, …, n
    #                 from the oldest to the latest
    #   consistency — lowest of the last `recent` exams
    #   domains     — weakest domain, averaged over the last `recent` exams
    #   freshness   — share of never-seen questions, and date of the last exam
    # Scores map to points linearly: `scale.from` or less → 0, `scale.to` or more → 100.
    # "Ready" = index at `bands.ready` or more AND five rules (minAttempts,
    # consecutive × minScore, domainFloor, freshness.minNewShare: at least that
    # share of never-seen questions in the `recent` exams, freshness.zeroDays: a
    # last exam at most that old); while a rule fails, the index stays
    # under `bands.ready`.
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale: { from: 600, to: 850 }
      weights: { level: 0.5, consistency: 0.2, domains: 0.2, freshness: 0.1 }
      bands: { progressing: 50, almost: 70, ready: 85 }
      # Recency: full up to staleDays after the last exam, then down to 0 at zeroDays;
      # past zeroDays, no "ready" until a new exam.
      freshness: { staleDays: 30, zeroDays: 90, minNewShare: 0.5 }
    # XP, levels, domain mastery and badges: the "gaming" side. They reward
    # effort and progress; only the readiness index says "ready".
    progression:
      xp:
        base: 50            # any finished exam
        scoreFrom: 400      # score XP = (score - 400) × 0.5: 0 at 400, 300 at 1000
        perPoint: 0.5
        knownShare: 0.5     # only half the score XP on questions already seen
        passBonus: 100      # at 720 or more
        bestBonus: 75       # best score so far
        domainBonus: 50     # per domain at least 50 points above the previous exam
        domainGain: 50
      levels:
        - { xp: 0, title: { en: Ops apprentice, fr: Apprenti des opérations } }
        - { xp: 150, title: { en: Metrics watcher, fr: Veilleur des métriques } }
        - { xp: 400, title: { en: Alarm tuner, fr: Régleur d'alarmes } }
        - { xp: 750, title: { en: Runbook operator, fr: Opérateur de runbooks } }
        - { xp: 1200, title: { en: Junior CloudOps engineer, fr: Ingénieur CloudOps junior } }
        - { xp: 1750, title: { en: Backup guardian, fr: Gardien des sauvegardes } }
        - { xp: 2400, title: { en: Stack automator, fr: Automaticien des piles } }
        - { xp: 3150, title: { en: Network troubleshooter, fr: Dépanneur réseau } }
        - { xp: 4000, title: { en: CloudOps engineer, fr: Ingénieur CloudOps } }
        - { xp: 5000, title: { en: Operations legend, fr: Légende des opérations } }
      mastery: { bronze: 650, silver: 700, gold: 850 }
      badges:
        hatTrick: { count: 3, min: 800 }
        regular: { weeks: 4 }
        comeback: { gain: 150 }


domains:
  - code: monitoring
    order: 1
    weight: { min: 0.22, max: 0.22 }
    title:
      en: Monitoring, Logging, Analysis, Remediation, and Performance Optimization
      fr: Surveillance, journalisation, analyse, correction et optimisation des performances
  - code: reliability
    order: 2
    weight: { min: 0.22, max: 0.22 }
    title:
      en: Reliability and Business Continuity
      fr: Fiabilité et continuité des activités
  - code: deployment
    order: 3
    weight: { min: 0.22, max: 0.22 }
    title:
      en: Deployment, Provisioning, and Automation
      fr: Déploiement, provisionnement et automatisation
  - code: security
    order: 4
    weight: { min: 0.16, max: 0.16 }
    title:
      en: Security and Compliance
      fr: Sécurité et conformité
  - code: networking
    order: 5
    weight: { min: 0.18, max: 0.18 }
    title:
      en: Networking and Content Delivery
      fr: Mise en réseau et diffusion de contenu
