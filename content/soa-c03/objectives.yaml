# SOA-C03 objectives — AWS Certified CloudOps Engineer - Associate (SOA-C03) Exam Guide,
# version 1.2 (published October 29, 2026, Revisions page), English Markdown domain pages
# sysops-administrator-associate-03-domain1..5.md, checked on 2026-11-19 (domain 1 also read on the
# HTML page: identical).
# One group per task statement (title without the "Task n.n:" prefix and final period).
# The SOA-C03 guide has a single "Skill n.n.n" list per task (no "Knowledge of" / "Skills in"
# split): objectives = every skill bullet, in the guide's order, codes <domain>.<task>.<n> = the
# guide's skill numbers. `code` is the stable key referenced by question files and course sections.
# English: verbatim, "Skill n.n.n:" prefix and final periods removed.
# French: NO French guide exists (the fr_fr URLs of the guide serve the English text), so ALL
# French group titles and objectives are our translation, following BRIEF-AWS §6 and AWS fr_fr
# documentation terminology: AWS service and feature names in English (CloudWatch agent → « agent
# CloudWatch », S3 Lifecycle, S3 Event Notifications, StackSets, Multi-AZ, Performance Insights,
# RDS Proxy, Route 53 Resolver, DNS Firewall...); policy = « politique »; health checks =
# « vérifications de l'état »; English term in brackets where the French is not settled
# (serverless, multipart uploads, point-in-time restore, backup and restore, pilot light, warm
# standby, active/active, SCP, conformance packs, findings, egress-only internet gateway, VPC
# peering); runbooks kept in English.
monitoring:
- group:
    en: Implement metrics, alarms, and filters by using AWS monitoring and logging services
    fr: Mettre en œuvre des métriques, des alarmes et des filtres à l'aide des services de surveillance et de journalisation AWS
  objectives:
  - code: 1.1.1
    en: Use AWS services (for example, Amazon CloudWatch, AWS CloudTrail, Amazon Managed Service for Prometheus) to configure monitoring and logging for workloads (for example, serverless, compute, AI)
    fr: Utiliser les services AWS (par exemple, Amazon CloudWatch, AWS CloudTrail, Amazon Managed Service for Prometheus) pour configurer la surveillance et la journalisation des charges de travail (par exemple, sans serveur [serverless], calcul, IA)
  - code: 1.1.2
    en: Configure and manage the CloudWatch agent to collect metrics and logs from EC2 instances, Amazon ECS clusters, or Amazon EKS clusters
    fr: Configurer et gérer l'agent CloudWatch pour collecter des métriques et des journaux à partir d'instances EC2, de clusters Amazon ECS ou de clusters Amazon EKS
  - code: 1.1.3
    en: Configure, identify, and troubleshoot CloudWatch alarms that can invoke AWS services directly or through Amazon EventBridge (for example, by creating composite alarms and identifying their invokable actions)
    fr: Configurer, identifier et dépanner des alarmes CloudWatch qui peuvent invoquer des services AWS directement ou par l'intermédiaire d'Amazon EventBridge (par exemple, en créant des alarmes composites et en identifiant les actions qu'elles peuvent invoquer)
  - code: 1.1.4
    en: Create, implement, and manage customizable and shareable CloudWatch dashboards that display metrics and alarms for AWS resources across multiple accounts and AWS Regions
    fr: Créer, mettre en œuvre et gérer des tableaux de bord CloudWatch personnalisables et partageables qui affichent les métriques et les alarmes des ressources AWS sur plusieurs comptes et Régions AWS
  - code: 1.1.5
    en: Configure AWS services to send notifications to Amazon SNS and to invoke alarms that send notifications to Amazon SNS
    fr: Configurer des services AWS pour qu'ils envoient des notifications à Amazon SNS et qu'ils invoquent des alarmes qui envoient des notifications à Amazon SNS
- group:
    en: Identify and remediate issues by using monitoring and availability metrics
    fr: Identifier et corriger les problèmes à l'aide des métriques de surveillance et de disponibilité
  objectives:
  - code: 1.2.1
    en: Analyze performance metrics and automate remediation strategies by using AWS services and functionality (for example, CloudWatch, Lambda, AWS Systems Manager, CloudTrail, Kiro, AWS DevOps Agent)
    fr: Analyser les métriques de performance et automatiser des stratégies de correction à l'aide des services et fonctionnalités AWS (par exemple, CloudWatch, Lambda, AWS Systems Manager, CloudTrail, Kiro, AWS DevOps Agent)
  - code: 1.2.2
    en: Use EventBridge to route, enrich, and deliver events, and troubleshoot any issues with event bus rules
    fr: Utiliser EventBridge pour acheminer, enrichir et livrer des événements, et dépanner les problèmes liés aux règles des bus d'événements
  - code: 1.2.3
    en: Create or run custom and predefined Systems Manager Automation runbooks (for example, by using AWS SDKs or custom scripts) to automate tasks and streamline processes on AWS
    fr: Créer ou exécuter des runbooks Systems Manager Automation personnalisés et prédéfinis (par exemple, à l'aide des kits SDK AWS ou de scripts personnalisés) pour automatiser des tâches et rationaliser les processus sur AWS
- group:
    en: Implement performance optimization strategies for compute, storage, and database resources
    fr: Mettre en œuvre des stratégies d'optimisation des performances pour les ressources de calcul, de stockage et de base de données
  objectives:
  - code: 1.3.1
    en: Optimize compute resources and remediate performance problems by using performance metrics, resource tags, and AWS tools
    fr: Optimiser les ressources de calcul et corriger les problèmes de performance à l'aide des métriques de performance, des balises de ressources et des outils AWS
  - code: 1.3.2
    en: Analyze Amazon EBS performance metrics, troubleshoot issues, and optimize volume types to improve performance and reduce cost
    fr: Analyser les métriques de performance d'Amazon EBS, dépanner les problèmes et optimiser les types de volumes pour améliorer les performances et réduire les coûts
  - code: 1.3.3
    en: Implement and optimize S3 performance strategies (for example, AWS DataSync, S3 Transfer Acceleration, multipart uploads, S3 Lifecycle policies) to enhance data transfer, storage efficiency, and access patterns
    fr: Mettre en œuvre et optimiser des stratégies de performance S3 (par exemple, AWS DataSync, S3 Transfer Acceleration, chargements partitionnés [multipart uploads], politiques S3 Lifecycle) pour améliorer le transfert de données, l'efficacité du stockage et les modèles d'accès
  - code: 1.3.4
    en: Evaluate and select shared storage solutions (for example, Amazon EFS, Amazon FSx, Amazon S3 Files), and optimize the solutions (for example, EFS lifecycle policies) for specific use cases and requirements
    fr: Évaluer et sélectionner des solutions de stockage partagé (par exemple, Amazon EFS, Amazon FSx, Amazon S3 Files), et optimiser ces solutions (par exemple, politiques de cycle de vie EFS) pour des cas d'utilisation et des exigences spécifiques
  - code: 1.3.5
    en: Monitor Amazon RDS metrics (for example, Amazon RDS Performance Insights, CloudWatch alarms) and modify configurations to increase performance efficiency (for example, Performance Insights proactive recommendations, RDS Proxy)
    fr: Surveiller les métriques Amazon RDS (par exemple, Amazon RDS Performance Insights, alarmes CloudWatch) et modifier les configurations pour améliorer l'efficacité des performances (par exemple, recommandations proactives de Performance Insights, RDS Proxy)
  - code: 1.3.6
    en: Implement, monitor, and optimize EC2 instances and their associated storage and networking capabilities (for example, EC2 placement groups)
    fr: Mettre en œuvre, surveiller et optimiser les instances EC2 et leurs capacités de stockage et de mise en réseau associées (par exemple, groupes de placement EC2)
reliability:
- group:
    en: Implement scalability and elasticity
    fr: Mettre en œuvre la scalabilité et l'élasticité
  objectives:
  - code: 2.1.1
    en: Configure and manage scaling mechanisms in compute environments
    fr: Configurer et gérer les mécanismes de mise à l'échelle dans les environnements de calcul
  - code: 2.1.2
    en: Implement caching by using AWS services to enhance dynamic scalability (for example, Amazon CloudFront, Amazon ElastiCache)
    fr: Mettre en œuvre la mise en cache à l'aide des services AWS pour améliorer la scalabilité dynamique (par exemple, Amazon CloudFront, Amazon ElastiCache)
  - code: 2.1.3
    en: Configure and manage scaling in AWS managed databases (for example, Amazon RDS, DynamoDB)
    fr: Configurer et gérer la mise à l'échelle dans les bases de données gérées par AWS (par exemple, Amazon RDS, DynamoDB)
- group:
    en: Implement highly available and resilient environments
    fr: Mettre en œuvre des environnements hautement disponibles et résilients
  objectives:
  - code: 2.2.1
    en: Configure and troubleshoot Elastic Load Balancing (ELB) and Amazon Route 53 health checks
    fr: Configurer et dépanner les vérifications de l'état d'Elastic Load Balancing (ELB) et d'Amazon Route 53
  - code: 2.2.2
    en: Configure fault-tolerant systems (for example, Multi-AZ deployments)
    fr: Configurer des systèmes tolérants aux pannes (par exemple, déploiements Multi-AZ)
- group:
    en: Implement backup and restore strategies
    fr: Mettre en œuvre des stratégies de sauvegarde et de restauration
  objectives:
  - code: 2.3.1
    en: Automate snapshots and backups for AWS resources (for example, EC2 instances, RDS DB instances, EBS volumes, S3 buckets, DynamoDB tables) by using AWS services (for example, AWS Backup)
    fr: Automatiser les instantanés et les sauvegardes des ressources AWS (par exemple, instances EC2, instances de base de données RDS, volumes EBS, compartiments S3, tables DynamoDB) à l'aide des services AWS (par exemple, AWS Backup)
  - code: 2.3.2
    en: Use various methods to restore databases (for example, point-in-time restore) to meet recovery time objective (RTO), recovery point objective (RPO), and cost requirements
    fr: Utiliser différentes méthodes pour restaurer des bases de données (par exemple, restauration à un instant dans le passé [point-in-time restore]) afin de respecter les exigences d'objectif de temps de reprise (RTO), d'objectif de point de reprise (RPO) et de coût
  - code: 2.3.3
    en: Implement versioning for storage services (for example, Amazon S3, Amazon FSx)
    fr: Mettre en œuvre la gestion des versions pour les services de stockage (par exemple, Amazon S3, Amazon FSx)
  - code: 2.3.4
    en: Follow disaster recovery procedures and best practices (for example, backup and restore, pilot light, warm standby, active/active)
    fr: Suivre les procédures et les bonnes pratiques de reprise après sinistre (par exemple, sauvegarde et restauration [backup and restore], veilleuse [pilot light], secours semi-actif [warm standby], actif/actif [active/active])
deployment:
- group:
    en: Provision and maintain cloud resources
    fr: Provisionner et maintenir des ressources cloud
  objectives:
  - code: 3.1.1
    en: Create and manage AMIs and container images (for example, EC2 Image Builder)
    fr: Créer et gérer des AMI et des images de conteneur (par exemple, EC2 Image Builder)
  - code: 3.1.2
    en: Create and manage AWS resources by using CloudFormation and the AWS CDK
    fr: Créer et gérer des ressources AWS à l'aide de CloudFormation et de l'AWS CDK
  - code: 3.1.3
    en: Identify and remediate deployment issues (for example, subnet sizing issues, CloudFormation errors, permissions issues)
    fr: Identifier et corriger les problèmes de déploiement (par exemple, problèmes de dimensionnement des sous-réseaux, erreurs CloudFormation, problèmes d'autorisations)
  - code: 3.1.4
    en: Provision and share resources across multiple Regions and accounts (for example, AWS Resource Access Manager [AWS RAM], CloudFormation StackSets)
    fr: Provisionner et partager des ressources entre plusieurs Régions et comptes (par exemple, AWS Resource Access Manager [AWS RAM], CloudFormation StackSets)
  - code: 3.1.5
    en: Implement deployment strategies and services
    fr: Mettre en œuvre des stratégies et des services de déploiement
  - code: 3.1.6
    en: Use and manage third-party tools to automate resource deployment (for example, Terraform, Git)
    fr: Utiliser et gérer des outils tiers pour automatiser le déploiement des ressources (par exemple, Terraform, Git)
- group:
    en: Automate the management of existing resources
    fr: Automatiser la gestion des ressources existantes
  objectives:
  - code: 3.2.1
    en: Use AWS services to automate operational processes (for example, Systems Manager)
    fr: Utiliser les services AWS pour automatiser les processus opérationnels (par exemple, Systems Manager)
  - code: 3.2.2
    en: Implement event-driven automation by using AWS services and features (for example, Lambda, S3 Event Notifications, EventBridge, AWS DevOps Agent)
    fr: Mettre en œuvre une automatisation pilotée par les événements à l'aide des services et fonctionnalités AWS (par exemple, Lambda, S3 Event Notifications, EventBridge, AWS DevOps Agent)
security:
- group:
    en: Implement and manage security and compliance tools and policies
    fr: Mettre en œuvre et gérer des outils et des politiques de sécurité et de conformité
  objectives:
  - code: 4.1.1
    en: Implement IAM features (for example, password policies, multi-factor authentication [MFA], roles, federated identity, resource policies, policy conditions)
    fr: Mettre en œuvre les fonctionnalités IAM (par exemple, politiques de mot de passe, authentification multifactorielle [MFA], rôles, fédération d'identités, politiques de ressources, conditions de politique)
  - code: 4.1.2
    en: Troubleshoot and audit access issues by using AWS tools (for example, CloudTrail, IAM Access Analyzer, IAM policy simulator)
    fr: Dépanner et auditer les problèmes d'accès à l'aide des outils AWS (par exemple, CloudTrail, IAM Access Analyzer, simulateur de politiques IAM)
  - code: 4.1.3
    en: Implement multi-account strategies securely (for example, AWS Organizations, service control policies, IAM Identity Center)
    fr: Mettre en œuvre des stratégies multicomptes de manière sécurisée (par exemple, AWS Organizations, politiques de contrôle des services [SCP], IAM Identity Center)
  - code: 4.1.4
    en: Implement remediation based on the results of AWS Trusted Advisor security checks
    fr: Mettre en œuvre des corrections en fonction des résultats des vérifications de sécurité d'AWS Trusted Advisor
  - code: 4.1.5
    en: Enforce compliance requirements and continuous monitoring (for example, Region and service selections, AWS Config conformance packs)
    fr: Appliquer les exigences de conformité et la surveillance continue (par exemple, sélection des Régions et des services, packs de conformité [conformance packs] AWS Config)
- group:
    en: Implement strategies to protect data and infrastructure
    fr: Mettre en œuvre des stratégies de protection des données et de l'infrastructure
  objectives:
  - code: 4.2.1
    en: Implement and enforce a data classification scheme
    fr: Mettre en œuvre et appliquer un schéma de classification des données
  - code: 4.2.2
    en: Implement, configure, and troubleshoot encryption at rest (for example, AWS KMS)
    fr: Mettre en œuvre, configurer et dépanner le chiffrement au repos (par exemple, AWS KMS)
  - code: 4.2.3
    en: Implement, configure, and troubleshoot encryption in transit (for example, AWS Certificate Manager [ACM])
    fr: Mettre en œuvre, configurer et dépanner le chiffrement en transit (par exemple, AWS Certificate Manager [ACM])
  - code: 4.2.4
    en: Securely store secrets by using AWS services
    fr: Stocker des secrets de manière sécurisée à l'aide des services AWS
  - code: 4.2.5
    en: Configure reports and remediate findings from AWS services (for example, AWS Security Hub, Amazon GuardDuty, AWS Config, Amazon Inspector, AWS Security Agent)
    fr: Configurer des rapports et corriger les résultats [findings] des services AWS (par exemple, AWS Security Hub, Amazon GuardDuty, AWS Config, Amazon Inspector, AWS Security Agent)
networking:
- group:
    en: Implement and optimize networking features and connectivity
    fr: Mettre en œuvre et optimiser les fonctionnalités et la connectivité réseau
  objectives:
  - code: 5.1.1
    en: Configure a VPC (for example, subnets, route tables, network ACLs, security groups, NAT gateways, internet gateway, egress-only internet gateway)
    fr: Configurer un VPC (par exemple, sous-réseaux, tables de routage, listes ACL réseau, groupes de sécurité, passerelles NAT, passerelle Internet, passerelle Internet de sortie uniquement [egress-only internet gateway])
  - code: 5.1.2
    en: Configure private networking connectivity (for example, VPC endpoints, AWS PrivateLink, VPC peering)
    fr: Configurer la connectivité réseau privée (par exemple, points de terminaison de VPC, AWS PrivateLink, appairage de VPC [VPC peering])
  - code: 5.1.3
    en: Audit AWS network protection services (for example, Route 53 Resolver DNS Firewall, AWS WAF, AWS Shield, AWS Network Firewall) in a single account
    fr: Auditer les services de protection réseau AWS (par exemple, Route 53 Resolver DNS Firewall, AWS WAF, AWS Shield, AWS Network Firewall) dans un seul compte
  - code: 5.1.4
    en: Optimize the cost of network architectures
    fr: Optimiser le coût des architectures réseau
- group:
    en: Configure domains, DNS services, and content delivery
    fr: Configurer les domaines, les services DNS et la diffusion de contenu
  objectives:
  - code: 5.2.1
    en: Configure DNS (for example, Route 53 Resolver)
    fr: Configurer le DNS (par exemple, Route 53 Resolver)
  - code: 5.2.2
    en: Implement Route 53 routing policies, configurations, and query logging
    fr: Mettre en œuvre les politiques de routage, les configurations et la journalisation des requêtes de Route 53
  - code: 5.2.3
    en: Configure content and service distribution (for example, CloudFront, AWS Global Accelerator)
    fr: Configurer la distribution de contenu et de services (par exemple, CloudFront, AWS Global Accelerator)
- group:
    en: Troubleshoot network connectivity issues
    fr: Dépanner les problèmes de connectivité réseau
  objectives:
  - code: 5.3.1
    en: Troubleshoot VPC configurations (for example, subnets, route tables, network ACLs, security groups, transit gateways, NAT gateways)
    fr: Dépanner les configurations de VPC (par exemple, sous-réseaux, tables de routage, listes ACL réseau, groupes de sécurité, passerelles de transit, passerelles NAT)
  - code: 5.3.2
    en: Collect and interpret networking logs to troubleshoot issues (for example, VPC flow logs, ELB access logs, AWS WAF web ACL logs, CloudFront logs, container logs)
    fr: Collecter et interpréter les journaux réseau pour dépanner les problèmes (par exemple, journaux de flux VPC, journaux d'accès ELB, journaux des listes ACL web AWS WAF, journaux CloudFront, journaux de conteneurs)
  - code: 5.3.3
    en: Identify and remediate CloudFront caching issues
    fr: Identifier et corriger les problèmes de mise en cache CloudFront
  - code: 5.3.4
    en: Identify and troubleshoot hybrid connectivity issues and private connectivity issues
    fr: Identifier et dépanner les problèmes de connectivité hybride et de connectivité privée
  - code: 5.3.5
    en: Configure and analyze CloudWatch network monitoring services
    fr: Configurer et analyser les services de surveillance réseau de CloudWatch
