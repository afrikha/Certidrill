id: soac03-4b-guardduty-isolate-ec2
objective: "4.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Amazon GuardDuty reports that an Amazon EC2 instance is communicating with a known malicious IP address over an established connection. The security team must keep the instance running for forensic analysis. All new traffic to and from the instance must be blocked except from the forensic subnet 10.0.99.0/24, and the existing connection to the malicious IP address must be stopped now.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Amazon GuardDuty signale qu'une instance Amazon EC2 communique avec une adresse IP malveillante connue par une connexion établie. L'équipe de sécurité doit laisser l'instance en fonctionnement pour une analyse forensique. Tout nouveau trafic vers et depuis l'instance doit être bloqué, sauf depuis le sous-réseau forensique 10.0.99.0/24, et la connexion existante vers l'adresse IP malveillante doit être coupée immédiatement.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a rule that denies the malicious IP address to the security group that is attached to the instance.", fr: "Ajouter au groupe de sécurité attaché à l'instance une règle qui refuse l'adresse IP malveillante." } }
    - { id: b, text: { en: "Add inbound and outbound deny rules for the malicious IP address to the network ACL of the instance's subnet.", fr: "Ajouter des règles de refus entrantes et sortantes pour l'adresse IP malveillante à la liste ACL réseau du sous-réseau de l'instance." } }
    - { id: c, text: { en: "Stop and then start the instance so that all its current network connections are closed.", fr: "Arrêter puis démarrer l'instance afin que toutes ses connexions réseau en cours soient fermées." } }
    - { id: d, text: { en: "Create an isolation security group that allows only 10.0.99.0/24, and make it the only security group of the instance.", fr: "Créer un groupe de sécurité d'isolement qui n'autorise que 10.0.99.0/24, et en faire le seul groupe de sécurité de l'instance." } }
    - { id: e, text: { en: "Detach the IAM instance profile from the instance so that it can no longer call AWS APIs.", fr: "Détacher le profil d'instance IAM de l'instance afin qu'elle ne puisse plus appeler les API AWS." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      GuardDuty recommends isolating the instance with a dedicated isolation security group that allows only specific IP addresses and replacing all other security groups. Changing security groups does not terminate tracked connections and blocks only future traffic, so network ACL rules, which are stateless, are used to block the existing connection to the malicious IP address.
    fr: |
      GuardDuty recommande d'isoler l'instance avec un groupe de sécurité d'isolement dédié qui n'autorise que des adresses IP précises, et de retirer tous les autres groupes de sécurité. Changer de groupe de sécurité ne coupe pas les connexions suivies et ne bloque que le trafic futur : des règles de liste ACL réseau, qui sont sans état, servent à bloquer la connexion existante vers l'adresse IP malveillante.
  options:
    a:
      en: |
        Security groups support only allow rules; they cannot deny a specific address.
      fr: |
        Les groupes de sécurité ne prennent en charge que des règles d'autorisation ; ils ne peuvent pas refuser une adresse précise.
    c:
      en: |
        Stopping the instance loses the memory contents needed for forensics, which conflicts with keeping it running.
      fr: |
        Arrêter l'instance fait perdre le contenu de la mémoire nécessaire à l'analyse forensique, ce qui contredit l'exigence de la laisser en fonctionnement.
    e:
      en: |
        Removing the instance profile limits API access but does not block network traffic or the existing connection.
      fr: |
        Retirer le profil d'instance limite l'accès aux API, mais ne bloque ni le trafic réseau ni la connexion existante.
references:
  - title: Remediating a potentially compromised Amazon EC2 instance
    url: https://docs.aws.amazon.com/guardduty/latest/ug/compromised-ec2.html
