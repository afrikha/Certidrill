id: soac03-4a-idc-customer-policy
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CloudOps engineer creates an IAM Identity Center permission set that references a customer managed policy named OpsBaseline. The engineer had created OpsBaseline in a test account, where the assignment works. When the permission set is assigned to the Operations group for three newly created accounts, provisioning fails in those accounts.

    Which action will resolve the issue?
  fr: |
    Un ingénieur CloudOps crée un jeu d'autorisations IAM Identity Center qui référence une politique gérée par le client nommée OpsBaseline. L'ingénieur avait créé OpsBaseline dans un compte de test, où l'affectation fonctionne. Lorsque le jeu d'autorisations est affecté au groupe Operations pour trois comptes nouvellement créés, le provisionnement échoue dans ces comptes.

    Quelle action résout le problème ?
body:
  options:
    - { id: a, text: { en: "Share the OpsBaseline policy from the test account with the three accounts by using AWS RAM, then reassign the permission set.", fr: "Partager la politique OpsBaseline du compte de test avec les trois comptes via AWS RAM, puis réaffecter le jeu d'autorisations." } }
    - { id: b, text: { en: "Create an IAM policy named OpsBaseline, with the same path, in each of the three accounts, then reprovision the permission set.", fr: "Créer une politique IAM nommée OpsBaseline, avec le même chemin, dans chacun des trois comptes, puis reprovisionner le jeu d'autorisations." } }
    - { id: c, text: { en: "Copy the OpsBaseline document into the management account as a customer managed policy, then reassign the permission set.", fr: "Copier le document OpsBaseline dans le compte de gestion sous forme de politique gérée par le client, puis réaffecter le jeu d'autorisations." } }
    - { id: d, text: { en: "Register the three accounts as delegated administrators for IAM Identity Center, then reassign the permission set.", fr: "Enregistrer les trois comptes comme administrateurs délégués d'IAM Identity Center, puis réaffecter le jeu d'autorisations." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A permission set only references a customer managed policy by name and path. The policy must already exist in every account where the permission set is assigned, so the engineer creates it in each account (for example with CloudFormation StackSets) and provisions the permission set again."
    fr: "Un jeu d'autorisations ne fait que référencer une politique gérée par le client par son nom et son chemin. La politique doit déjà exister dans chaque compte où le jeu d'autorisations est affecté : l'ingénieur la crée dans chaque compte (par exemple avec CloudFormation StackSets) et provisionne à nouveau le jeu d'autorisations."
  options:
    a:
      en: "IAM policies are not resources that can be shared through AWS RAM; each account needs its own copy of the policy."
      fr: "Les politiques IAM ne sont pas des ressources partageables via AWS RAM ; chaque compte a besoin de sa propre copie de la politique."
    c:
      en: "A policy in the management account is not visible to the roles that IAM Identity Center creates in the member accounts."
      fr: "Une politique du compte de gestion n'est pas visible des rôles qu'IAM Identity Center crée dans les comptes membres."
    d:
      en: "Delegated administration lets one member account administer IAM Identity Center; it does not create policies in the accounts where permission sets are assigned."
      fr: "L'administration déléguée permet à un compte membre d'administrer IAM Identity Center ; elle ne crée pas de politiques dans les comptes où les jeux d'autorisations sont affectés."
references:
  - title: Custom permissions for AWS managed and customer managed policies
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetcustom.html
