id: soac03-4b-rds-ca-rotation
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Applications connect to an Amazon RDS for PostgreSQL DB instance over TLS and verify the server certificate against a trust store that contains only the certificate of the CA that the instance uses today. The company must move the instance to the rds-ca-rsa2048-g1 certificate authority. The applications must not lose their database connections because of certificate validation errors.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Des applications se connectent en TLS à une instance de base de données Amazon RDS for PostgreSQL et vérifient le certificat du serveur par rapport à un magasin de confiance qui ne contient que le certificat de l'autorité de certification utilisée aujourd'hui par l'instance. L'entreprise doit faire passer l'instance à l'autorité de certification rds-ca-rsa2048-g1. Les applications ne doivent pas perdre leurs connexions à la base à cause d'erreurs de validation de certificat.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Before changing the DB instance, update the trust store of the applications with the current RDS certificate bundle.", fr: "Avant de modifier l'instance, mettre à jour le magasin de confiance des applications avec le paquet de certificats RDS actuel." } }
    - { id: b, text: { en: "Set rds.force_ssl to 0 in the DB parameter group during the transition.", fr: "Définir rds.force_ssl sur 0 dans le groupe de paramètres de base de données pendant la transition." } }
    - { id: c, text: { en: "Import the rds-ca-rsa2048-g1 certificate into AWS Certificate Manager, and associate it with the DB instance.", fr: "Importer le certificat rds-ca-rsa2048-g1 dans AWS Certificate Manager, et l'associer à l'instance." } }
    - { id: d, text: { en: "Create a read replica that uses the new CA, and promote it to replace the instance.", fr: "Créer un réplica en lecture qui utilise la nouvelle autorité, et le promouvoir pour remplacer l'instance." } }
    - { id: e, text: { en: "Modify the DB instance with --ca-certificate-identifier rds-ca-rsa2048-g1.", fr: "Modifier l'instance avec --ca-certificate-identifier rds-ca-rsa2048-g1." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      AWS says to update the clients first: the RDS certificate bundle contains the old and new CA certificates, so clients keep trusting the server during the transition. Then modify-db-instance with --ca-certificate-identifier switches the instance to the new CA, during the next maintenance window by default or immediately with --apply-immediately.
    fr: |
      AWS indique de mettre à jour les clients d'abord : le paquet de certificats RDS contient les certificats de l'ancienne et de la nouvelle autorité, donc les clients continuent d'approuver le serveur pendant la transition. Ensuite, modify-db-instance avec --ca-certificate-identifier fait passer l'instance à la nouvelle autorité, lors de la prochaine fenêtre de maintenance par défaut ou immédiatement avec --apply-immediately.
  options:
    b:
      en: |
        Turning off forced TLS weakens encryption in transit and does not help clients that verify the server certificate.
      fr: |
        Désactiver le TLS obligatoire affaiblit le chiffrement en transit et n'aide pas les clients qui vérifient le certificat du serveur.
    c:
      en: |
        RDS server certificates are managed by RDS and selected with the CA certificate identifier, not through ACM.
      fr: |
        Les certificats serveur RDS sont gérés par RDS et choisis avec l'identifiant de certificat d'autorité, pas par ACM.
    d:
      en: |
        A replica is unnecessary because the CA of the existing instance can be modified, and the clients would still fail without the new CA in their trust store.
      fr: |
        Un réplica est inutile, car l'autorité de l'instance existante peut être modifiée, et les clients échoueraient toujours sans la nouvelle autorité dans leur magasin de confiance.
references:
  - title: Rotating your SSL/TLS certificate
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.SSL-certificate-rotation.html
