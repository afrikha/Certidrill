id: soac03-4b-macie-cmk-objects
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs Amazon Macie sensitive data discovery jobs to classify the data in several Amazon S3 buckets. Objects in buckets that use SSE-S3 are analyzed. One bucket uses SSE-KMS default encryption with a customer managed key in the same account. For that bucket, Macie reports only object metadata, and the job results show that Macie could not decrypt the objects. The administrator who created the job has kms:Decrypt permission on the key.

    What should the company do so that Macie analyzes the objects in that bucket?
  fr: |
    Une entreprise exécute des tâches de découverte de données sensibles Amazon Macie pour classer les données de plusieurs compartiments Amazon S3. Les objets des compartiments qui utilisent SSE-S3 sont analysés. Un compartiment utilise un chiffrement par défaut SSE-KMS avec une clé gérée par le client du même compte. Pour ce compartiment, Macie ne signale que les métadonnées des objets, et les résultats de la tâche indiquent que Macie n'a pas pu déchiffrer les objets. L'administrateur qui a créé la tâche dispose de l'autorisation kms:Decrypt sur la clé.

    Que doit faire l'entreprise pour que Macie analyse les objets de ce compartiment ?
body:
  options:
    - id: a
      text: { en: "Add a statement to the key policy that allows the AWSServiceRoleForAmazonMacie service-linked role to call kms:Decrypt.", fr: "Ajouter à la politique de clé une instruction qui autorise le rôle lié à un service AWSServiceRoleForAmazonMacie à appeler kms:Decrypt." }
    - id: b
      text: { en: "Enable an S3 Bucket Key on the bucket so that Macie no longer needs to call AWS KMS for each object.", fr: "Activer une clé de compartiment S3 (S3 Bucket Key) sur le compartiment afin que Macie n'ait plus besoin d'appeler AWS KMS pour chaque objet." }
    - id: c
      text: { en: "Re-encrypt the objects with SSE-C, and store the customer-provided key in AWS Secrets Manager for Macie.", fr: "Rechiffrer les objets avec SSE-C, et stocker la clé fournie par le client dans AWS Secrets Manager pour Macie." }
    - id: d
      text: { en: "Recreate the job from a role that has kms:Decrypt and kms:GenerateDataKey permissions on the key.", fr: "Recréer la tâche depuis un rôle qui dispose des autorisations kms:Decrypt et kms:GenerateDataKey sur la clé." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Macie analyzes objects with its service-linked role, not with the permissions of the person who created the job. For SSE-KMS or DSSE-KMS objects encrypted with a customer managed key, Macie can decrypt them only if the key policy allows the AWSServiceRoleForAmazonMacie role to use the key; otherwise it can only store and report metadata.
    fr: |
      Macie analyse les objets avec son rôle lié à un service, pas avec les autorisations de la personne qui a créé la tâche. Pour les objets SSE-KMS ou DSSE-KMS chiffrés avec une clé gérée par le client, Macie ne peut les déchiffrer que si la politique de clé autorise le rôle AWSServiceRoleForAmazonMacie à utiliser la clé ; sinon, il ne peut que stocker et signaler les métadonnées.
  options:
    b:
      en: |
        An S3 Bucket Key reduces the number of AWS KMS requests, but Macie still needs permission to use the customer managed key.
      fr: |
        Une clé de compartiment S3 réduit le nombre de requêtes AWS KMS, mais Macie a toujours besoin de l'autorisation d'utiliser la clé gérée par le client.
    c:
      en: |
        Macie cannot decrypt objects encrypted with SSE-C, so the objects would stay unanalyzed.
      fr: |
        Macie ne peut pas déchiffrer les objets chiffrés avec SSE-C : les objets resteraient non analysés.
    d:
      en: |
        The job's analysis does not use the creator's credentials, so the creator's KMS permissions do not change the result.
      fr: |
        L'analyse de la tâche n'utilise pas les informations d'identification de son créateur : ses autorisations KMS ne changent rien au résultat.
references:
  - title: Analyzing encrypted Amazon S3 objects
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-supported-encryption-types.html
