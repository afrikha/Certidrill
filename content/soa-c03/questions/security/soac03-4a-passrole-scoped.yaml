id: soac03-4a-passrole-scoped
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Operators in account 111122223333 can launch Amazon EC2 instances. When they launch an instance with the instance profile of the role app-web-role, the request fails with an error stating that they are not authorized to perform iam:PassRole on the role. The security team wants the operators to be able to pass only roles whose names start with app- and only to Amazon EC2.

    Which statement should the CloudOps engineer add to the operators' policy?
  fr: |
    Les opérateurs du compte 111122223333 peuvent lancer des instances Amazon EC2. Lorsqu'ils lancent une instance avec le profil d'instance du rôle app-web-role, la requête échoue avec une erreur indiquant qu'ils ne sont pas autorisés à effectuer iam:PassRole sur le rôle. L'équipe de sécurité veut que les opérateurs puissent transmettre uniquement les rôles dont le nom commence par app- et uniquement à Amazon EC2.

    Quelle instruction l'ingénieur CloudOps doit-il ajouter à la politique des opérateurs ?
body:
  options:
    - { id: a, text: { en: "Allow sts:AssumeRole on arn:aws:iam::111122223333:role/app-* so that the operators can use the roles.", fr: "Autoriser sts:AssumeRole sur arn:aws:iam::111122223333:role/app-* pour que les opérateurs puissent utiliser les rôles." } }
    - { id: b, text: { en: "Allow iam:PassRole on all resources when iam:PassedToService equals ec2.amazonaws.com.", fr: "Autoriser iam:PassRole sur toutes les ressources lorsque iam:PassedToService est égal à ec2.amazonaws.com." } }
    - { id: c, text: { en: "Allow iam:PassRole on arn:aws:iam::111122223333:role/app-* when iam:PassedToService equals ec2.amazonaws.com.", fr: "Autoriser iam:PassRole sur arn:aws:iam::111122223333:role/app-* lorsque iam:PassedToService est égal à ec2.amazonaws.com." } }
    - { id: d, text: { en: "Allow iam:GetRole and iam:ListInstanceProfiles on arn:aws:iam::111122223333:role/app-*.", fr: "Autoriser iam:GetRole et iam:ListInstanceProfiles sur arn:aws:iam::111122223333:role/app-*." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Launching an instance with an instance profile passes the role to EC2, which requires iam:PassRole on the role. Restricting the resource to role/app-* limits which roles can be passed, and the iam:PassedToService condition limits the service that can receive them."
    fr: "Lancer une instance avec un profil d'instance transmet le rôle à EC2, ce qui exige iam:PassRole sur le rôle. Restreindre la ressource à role/app-* limite les rôles transmissibles, et la condition iam:PassedToService limite le service qui peut les recevoir."
  options:
    a:
      en: "sts:AssumeRole lets the operators use the role themselves; it does not allow them to pass the role to an instance."
      fr: "sts:AssumeRole permet aux opérateurs d'utiliser le rôle eux-mêmes ; cela ne les autorise pas à transmettre le rôle à une instance."
    b:
      en: "The Resource * lets operators pass any role in the account to EC2, including privileged roles, which breaks the name restriction."
      fr: "La ressource * permet aux opérateurs de transmettre n'importe quel rôle du compte à EC2, y compris des rôles privilégiés, ce qui enfreint la restriction sur le nom."
    d:
      en: "Read permissions on roles and instance profiles help with listing them in the console, but the failing permission is iam:PassRole."
      fr: "Les autorisations de lecture sur les rôles et les profils d'instance aident à les lister dans la console, mais l'autorisation manquante est iam:PassRole."
references:
  - title: Grant a user permissions to pass a role to an AWS service
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html
