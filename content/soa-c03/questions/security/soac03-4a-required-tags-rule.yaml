id: soac03-4a-required-tags-rule
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company must continuously identify Amazon EC2 instances and Amazon EBS volumes in an account that do not have both an Owner tag and an Environment tag. The compliance status must appear in the AWS Config console, and the company does not want to write any code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit identifier en continu les instances Amazon EC2 et les volumes Amazon EBS d'un compte qui n'ont pas à la fois une balise Owner et une balise Environment. L'état de conformité doit apparaître dans la console AWS Config, et l'entreprise ne veut écrire aucun code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach a tag policy to the account that defines the Owner and Environment tag keys for EC2 instances and volumes.", fr: "Attacher au compte une politique de balises qui définit les clés de balise Owner et Environment pour les instances et volumes EC2." } }
    - { id: b, text: { en: "Search CloudTrail Event history every day for RunInstances and CreateVolume events without tags.", fr: "Rechercher chaque jour dans l'historique des événements CloudTrail les événements RunInstances et CreateVolume sans balises." } }
    - { id: c, text: { en: "Add the AWS Config managed rule required-tags with tag1Key Owner and tag2Key Environment, scoped to EC2 instances and EBS volumes.", fr: "Ajouter la règle gérée AWS Config required-tags avec tag1Key Owner et tag2Key Environment, limitée aux instances EC2 et aux volumes EBS." } }
    - { id: d, text: { en: "Create an IAM Access Analyzer unused access analyzer and filter its findings on EC2 resources.", fr: "Créer un analyseur d'accès inutilisés IAM Access Analyzer et filtrer ses résultats sur les ressources EC2." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The required-tags managed rule checks whether resources have the tags named in its parameters (tag1Key to tag6Key, with optional values). It is triggered by configuration changes, supports AWS::EC2::Instance and AWS::EC2::Volume, and reports compliance in the AWS Config console without custom code."
    fr: "La règle gérée required-tags vérifie que les ressources ont les balises nommées dans ses paramètres (tag1Key à tag6Key, avec des valeurs facultatives). Elle est déclenchée par les changements de configuration, prend en charge AWS::EC2::Instance et AWS::EC2::Volume, et présente la conformité dans la console AWS Config sans code personnalisé."
  options:
    a:
      en: "Tag policies do not evaluate untagged resources, and their compliance is not shown as AWS Config compliance."
      fr: "Les politiques de balises n'évaluent pas les ressources sans balise, et leur conformité n'apparaît pas comme une conformité AWS Config."
    b:
      en: "Manual searches are not continuous, miss tags removed later and do not appear in the AWS Config console."
      fr: "Des recherches manuelles ne sont pas continues, ne voient pas les balises retirées plus tard et n'apparaissent pas dans la console AWS Config."
    d:
      en: "Unused access analyzers report unused IAM access, not missing tags on resources."
      fr: "Les analyseurs d'accès inutilisés signalent les accès IAM inutilisés, pas les balises manquantes sur les ressources."
references:
  - title: required-tags
    url: https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html
