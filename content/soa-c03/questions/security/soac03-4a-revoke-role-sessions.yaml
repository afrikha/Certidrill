id: soac03-4a-revoke-role-sessions
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer accidentally posted temporary credentials of an assumed IAM role named BuildRole on a public forum. The credentials remain valid for several more hours. Build pipelines assume BuildRole many times each day and must keep working without interruption.

    What should the CloudOps engineer do immediately?
  fr: |
    Un développeur a publié par erreur sur un forum public des informations d'identification temporaires d'un rôle IAM endossé nommé BuildRole. Ces informations restent valides plusieurs heures encore. Les pipelines de build endossent BuildRole de nombreuses fois par jour et doivent continuer à fonctionner sans interruption.

    Que doit faire immédiatement l'ingénieur CloudOps ?
body:
  options:
    - { id: a, text: { en: "Choose Revoke active sessions for BuildRole in the IAM console.", fr: "Choisir Revoke active sessions pour BuildRole dans la console IAM." } }
    - { id: b, text: { en: "Deactivate the access keys of BuildRole on the role's Security credentials tab.", fr: "Désactiver les clés d'accès de BuildRole dans l'onglet Security credentials du rôle." } }
    - { id: c, text: { en: "Remove the developer's IAM principal from the trust policy of BuildRole.", fr: "Retirer le principal IAM du développeur de la politique d'approbation de BuildRole." } }
    - { id: d, text: { en: "Delete BuildRole and create a new role with the same name and policies.", fr: "Supprimer BuildRole et créer un nouveau rôle portant le même nom et les mêmes politiques." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Revoking active sessions attaches the inline policy AWSRevokeOlderSessions to the role. It denies all actions for sessions whose aws:TokenIssueTime is earlier than the revocation time, so the leaked credentials stop working while pipelines that assume the role again get new working credentials."
    fr: "La révocation des sessions actives attache au rôle la politique en ligne AWSRevokeOlderSessions. Elle refuse toutes les actions aux sessions dont aws:TokenIssueTime est antérieur à l'heure de révocation : les informations divulguées cessent de fonctionner, tandis que les pipelines qui endossent à nouveau le rôle obtiennent de nouvelles informations valides."
  options:
    b:
      en: "IAM roles do not have long-term access keys; role sessions use temporary credentials issued by AWS STS."
      fr: "Les rôles IAM n'ont pas de clés d'accès à long terme ; les sessions de rôle utilisent des informations d'identification temporaires émises par AWS STS."
    c:
      en: "The trust policy is evaluated only when the role is assumed; credentials that were already issued remain valid until they expire."
      fr: "La politique d'approbation n'est évaluée qu'au moment de l'endossement du rôle ; les informations déjà émises restent valides jusqu'à leur expiration."
    d:
      en: "Deleting and re-creating the role interrupts the pipelines and requires updating every reference to the role, while revoking sessions achieves the goal without disruption."
      fr: "Supprimer puis recréer le rôle interrompt les pipelines et oblige à mettre à jour toutes les références au rôle, alors que la révocation des sessions atteint l'objectif sans perturbation."
references:
  - title: Revoke IAM role temporary security credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
