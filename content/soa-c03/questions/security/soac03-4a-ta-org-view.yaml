id: soac03-4a-ta-org-view
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 40 AWS accounts in an organization with all features enabled. The management account has AWS Enterprise Support. The security team wants a single downloadable report of the AWS Trusted Advisor security check results for all member accounts, which it can filter by OU before assigning remediation work.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise a 40 comptes AWS dans une organisation avec toutes les fonctionnalités activées. Le compte de gestion dispose d'AWS Enterprise Support. L'équipe de sécurité veut un rapport unique et téléchargeable des résultats des vérifications de sécurité AWS Trusted Advisor de tous les comptes membres, qu'elle peut filtrer par unité d'organisation avant d'attribuer les travaux de correction.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an AWS Config aggregator for the organization and export the compliance data of all accounts.", fr: "Créer un agrégateur AWS Config pour l'organisation et exporter les données de conformité de tous les comptes." } }
    - { id: b, text: { en: "Sign in to each member account, choose Download all checks in Trusted Advisor and merge the files.", fr: "Se connecter à chaque compte membre, choisir Download all checks dans Trusted Advisor et fusionner les fichiers." } }
    - { id: c, text: { en: "Enable organizational view in Trusted Advisor from the management account and create a report for the Security category filtered by OU.", fr: "Activer la vue organisationnelle dans Trusted Advisor depuis le compte de gestion et créer un rapport pour la catégorie Security filtré par unité d'organisation." } }
    - { id: d, text: { en: "Enable AWS Security Hub CSPM in all accounts and export the findings of the AWS Foundational Security Best Practices standard.", fr: "Activer AWS Security Hub CSPM dans tous les comptes et exporter les résultats de la norme AWS Foundational Security Best Practices." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Organizational view aggregates Trusted Advisor check results for all accounts of the organization into reports that are created and downloaded from the management account in JSON or CSV. Reports can be filtered by check category, checks, Region, status and OU; the management account needs Business Support+, Enterprise Support or Unified Operations."
    fr: "La vue organisationnelle agrège les résultats des vérifications Trusted Advisor de tous les comptes de l'organisation dans des rapports créés et téléchargés depuis le compte de gestion, au format JSON ou CSV. Les rapports peuvent être filtrés par catégorie de vérification, vérifications, Région, statut et unité d'organisation ; le compte de gestion doit disposer de Business Support+, Enterprise Support ou Unified Operations."
  options:
    a:
      en: "An AWS Config aggregator shows Config rule compliance and resource configurations, not Trusted Advisor check results."
      fr: "Un agrégateur AWS Config présente la conformité des règles Config et les configurations des ressources, pas les résultats des vérifications Trusted Advisor."
    b:
      en: "Downloading and merging 40 files by hand meets the goal but with much more effort than one organizational report."
      fr: "Télécharger et fusionner 40 fichiers à la main atteint l'objectif, mais avec bien plus d'efforts qu'un seul rapport organisationnel."
    d:
      en: "Security Hub CSPM findings come from its own controls, not from the Trusted Advisor checks the team wants to report on."
      fr: "Les résultats de Security Hub CSPM proviennent de ses propres contrôles, pas des vérifications Trusted Advisor sur lesquelles l'équipe veut un rapport."
references:
  - title: Organizational view for AWS Trusted Advisor
    url: https://docs.aws.amazon.com/awssupport/latest/user/organizational-view.html
