id: soac03-4b-cfn-securestring-unsupported
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An engineer writes an AWS CloudFormation template that must create a new database password, store it encrypted at rest with AWS KMS, and pass it to an Amazon RDS DB instance in the same stack. The first version of the template declares an AWS::SSM::Parameter resource with Type set to SecureString, but the stack does not deploy. The password must never appear in the template or in the stack parameters.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur écrit un modèle AWS CloudFormation qui doit créer un nouveau mot de passe de base de données, le stocker chiffré au repos avec AWS KMS et le transmettre à une instance de base de données Amazon RDS de la même pile. La première version du modèle déclare une ressource AWS::SSM::Parameter avec Type défini sur SecureString, mais la pile ne se déploie pas. Le mot de passe ne doit jamais apparaître dans le modèle ni dans les paramètres de la pile.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the parameter Type to StringList, and reference the parameter from the DB instance with a dynamic reference.", fr: "Changer le Type du paramètre en StringList, et référencer le paramètre depuis l'instance avec une référence dynamique." }
    - id: b
      text: { en: "Declare an AWS::SecretsManager::Secret with GenerateSecretString, and reference it with a secretsmanager dynamic reference.", fr: "Déclarer un AWS::SecretsManager::Secret avec GenerateSecretString, et le référencer avec une référence dynamique secretsmanager." }
    - id: c
      text: { en: "Add a NoEcho template parameter for the password, and store it in an AWS::SSM::Parameter resource of Type String.", fr: "Ajouter un paramètre de modèle NoEcho pour le mot de passe, et le stocker dans une ressource AWS::SSM::Parameter de Type String." }
    - id: d
      text: { en: "Keep the SecureString parameter, and add a DependsOn attribute so that the DB instance is created after the parameter.", fr: "Conserver le paramètre SecureString, et ajouter un attribut DependsOn pour que l'instance soit créée après le paramètre." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The AWS::SSM::Parameter resource supports only the String and StringList types; CloudFormation does not support SecureString parameters. An AWS::SecretsManager::Secret can generate a random password with GenerateSecretString, stores it encrypted with KMS, and the DB instance can read it with a secretsmanager dynamic reference, so the value never appears in the template.
    fr: |
      La ressource AWS::SSM::Parameter ne prend en charge que les types String et StringList ; CloudFormation ne prend pas en charge les paramètres SecureString. Un AWS::SecretsManager::Secret peut générer un mot de passe aléatoire avec GenerateSecretString, le stocke chiffré avec KMS, et l'instance peut le lire avec une référence dynamique secretsmanager : la valeur n'apparaît jamais dans le modèle.
  options:
    a:
      en: |
        StringList values are not encrypted, and the template would still have to contain the password value.
      fr: |
        Les valeurs StringList ne sont pas chiffrées, et le modèle devrait toujours contenir la valeur du mot de passe.
    c:
      en: |
        The password would be passed as a stack parameter and stored unencrypted in a String parameter.
      fr: |
        Le mot de passe serait transmis comme paramètre de pile et stocké non chiffré dans un paramètre String.
    d:
      en: |
        The resource order is not the problem: CloudFormation cannot create a SecureString parameter at all.
      fr: |
        L'ordre des ressources n'est pas en cause : CloudFormation ne peut pas du tout créer de paramètre SecureString.
references:
  - title: AWS::SSM::Parameter
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ssm-parameter.html
