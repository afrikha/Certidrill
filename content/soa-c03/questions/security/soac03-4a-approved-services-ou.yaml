id: soac03-4a-approved-services-ou
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's compliance policy states that accounts in the Sandbox OU may use only Amazon EC2, Amazon S3, Amazon CloudWatch and IAM. Administrators of these accounts have the AdministratorAccess policy. The FullAWSAccess SCP is attached to the root, to the Sandbox OU and to each account.

    Which solutions will enforce this policy? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    La politique de conformité d'une entreprise stipule que les comptes de l'unité d'organisation Sandbox ne peuvent utiliser qu'Amazon EC2, Amazon S3, Amazon CloudWatch et IAM. Les administrateurs de ces comptes disposent de la politique AdministratorAccess. La SCP FullAWSAccess est attachée à la racine, à l'unité d'organisation Sandbox et à chaque compte.

    Quelles solutions appliquent cette politique ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach to the Sandbox OU an SCP that denies all actions with a NotAction list of ec2:*, s3:*, cloudwatch:* and iam:*.", fr: "Attacher à l'unité d'organisation Sandbox une SCP qui refuse toutes les actions avec une liste NotAction de ec2:*, s3:*, cloudwatch:* et iam:*." } }
    - { id: b, text: { en: "Attach to the Sandbox OU an additional SCP that allows ec2:*, s3:*, cloudwatch:* and iam:*, and keep FullAWSAccess attached.", fr: "Attacher à l'unité d'organisation Sandbox une SCP supplémentaire qui autorise ec2:*, s3:*, cloudwatch:* et iam:*, et garder FullAWSAccess attachée." } }
    - { id: c, text: { en: "Replace FullAWSAccess on the Sandbox OU with an SCP that allows only ec2:*, s3:*, cloudwatch:* and iam:*.", fr: "Remplacer FullAWSAccess sur l'unité d'organisation Sandbox par une SCP qui n'autorise que ec2:*, s3:*, cloudwatch:* et iam:*." } }
    - { id: d, text: { en: "Attach a permissions boundary that allows only the four services to every IAM role in the Sandbox accounts.", fr: "Attacher à chaque rôle IAM des comptes Sandbox une limite d'autorisations qui n'autorise que les quatre services." } }
    - { id: e, text: { en: "Deploy an AWS Config rule in the Sandbox accounts that reports resources of other services as noncompliant.", fr: "Déployer dans les comptes Sandbox une règle AWS Config qui signale comme non conformes les ressources des autres services." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A deny-list SCP with NotAction denies every action outside the four services while FullAWSAccess stays in place. An allow-list SCP that replaces FullAWSAccess at the Sandbox OU also works, because an action must be allowed by an SCP at every level, so only the four services remain available in the accounts below the OU."
    fr: "Une SCP de type liste de refus avec NotAction refuse toutes les actions hors des quatre services, tandis que FullAWSAccess reste en place. Une SCP de type liste d'autorisation qui remplace FullAWSAccess sur l'unité d'organisation Sandbox fonctionne aussi, car une action doit être autorisée par une SCP à chaque niveau : seuls les quatre services restent disponibles dans les comptes sous cette unité."
  options:
    b:
      en: "While FullAWSAccess is still attached to the OU, it allows every action at that level, so the extra Allow SCP restricts nothing."
      fr: "Tant que FullAWSAccess reste attachée à l'unité d'organisation, elle autorise toutes les actions à ce niveau : la SCP Allow supplémentaire ne restreint rien."
    d:
      en: "Administrators can create roles without the boundary or remove it, so the restriction is not enforced."
      fr: "Les administrateurs peuvent créer des rôles sans la limite ou la retirer : la restriction n'est pas appliquée."
    e:
      en: "A Config rule only reports resources after they are created; it does not prevent the use of other services."
      fr: "Une règle Config ne fait que signaler les ressources après leur création ; elle n'empêche pas l'utilisation d'autres services."
references:
  - title: SCP evaluation
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_evaluation.html
