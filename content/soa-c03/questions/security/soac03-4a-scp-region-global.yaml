id: soac03-4a-scp-region-global
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    To meet a data residency requirement, a CloudOps engineer attaches the following SCP to the Workloads OU.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "DenyOtherRegions",
          "Effect": "Deny",
          "Action": "*",
          "Resource": "*",
          "Condition": {
            "StringNotEquals": { "aws:RequestedRegion": [ "eu-west-1", "eu-central-1" ] }
          }
        }
      ]
    }
    ```

    Users of the Workloads accounts can still use Amazon EC2 and Amazon RDS in both Regions, but they can no longer create IAM roles or manage Amazon Route 53 hosted zones. No other Region may be opened to regional services.

    What should the engineer change in the SCP?
  fr: |
    Pour répondre à une exigence de résidence des données, un ingénieur CloudOps attache la SCP suivante à l'unité d'organisation Workloads.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "DenyOtherRegions",
          "Effect": "Deny",
          "Action": "*",
          "Resource": "*",
          "Condition": {
            "StringNotEquals": { "aws:RequestedRegion": [ "eu-west-1", "eu-central-1" ] }
          }
        }
      ]
    }
    ```

    Les utilisateurs des comptes Workloads peuvent toujours utiliser Amazon EC2 et Amazon RDS dans les deux Régions, mais ils ne peuvent plus créer de rôles IAM ni gérer de zones hébergées Amazon Route 53. Aucune autre Région ne doit être ouverte aux services régionaux.

    Que doit modifier l'ingénieur dans la SCP ?
body:
  options:
    - { id: a, text: { en: "Add us-east-1 to the list of values for aws:RequestedRegion so that requests to global endpoints are allowed.", fr: "Ajouter us-east-1 à la liste des valeurs de aws:RequestedRegion pour que les requêtes vers les points de terminaison mondiaux soient autorisées." } }
    - { id: b, text: { en: "Replace StringNotEquals with StringNotEqualsIfExists so that the condition ignores global requests.", fr: "Remplacer StringNotEquals par StringNotEqualsIfExists pour que la condition ignore les requêtes mondiales." } }
    - { id: c, text: { en: "Replace \"Action\": \"*\" with a NotAction list that exempts global services such as iam:*, route53:* and sts:*.", fr: "Remplacer \"Action\": \"*\" par une liste NotAction qui exempte les services mondiaux comme iam:*, route53:* et sts:*." } }
    - { id: d, text: { en: "Attach the FullAWSAccess SCP to the Workloads accounts to restore access to IAM and Route 53.", fr: "Attacher la SCP FullAWSAccess aux comptes Workloads pour rétablir l'accès à IAM et à Route 53." } }
answer: { optionId: c }
explanation:
  correct:
    en: "aws:RequestedRegion contains the Region of the endpoint that receives the request, and global services such as IAM use an endpoint in us-east-1. A Deny on all actions therefore also blocks them; a NotAction list that exempts global services keeps the Region restriction for every regional service."
    fr: "aws:RequestedRegion contient la Région du point de terminaison qui reçoit la requête, et les services mondiaux comme IAM utilisent un point de terminaison dans us-east-1. Un Deny sur toutes les actions les bloque donc aussi ; une liste NotAction qui exempte les services mondiaux conserve la restriction de Région pour tous les services régionaux."
  options:
    a:
      en: "Allowing us-east-1 would also open every regional service in that Region, which the requirement forbids."
      fr: "Autoriser us-east-1 ouvrirait aussi tous les services régionaux de cette Région, ce que l'exigence interdit."
    b:
      en: "aws:RequestedRegion is always present in the request, so IfExists changes nothing for IAM and Route 53 calls."
      fr: "aws:RequestedRegion est toujours présent dans la requête : IfExists ne change rien pour les appels IAM et Route 53."
    d:
      en: "An explicit Deny in an SCP overrides any Allow, including FullAWSAccess, which is usually already attached."
      fr: "Un Deny explicite dans une SCP l'emporte sur tout Allow, y compris FullAWSAccess, généralement déjà attachée."
references:
