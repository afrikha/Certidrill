id: soac03-4a-multi-denied-alarm
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants an email notification within minutes whenever principals in an account receive repeated AccessDenied or UnauthorizedOperation errors. The account has a multi-Region CloudTrail trail that delivers log files only to an Amazon S3 bucket.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise veut recevoir une notification par e-mail en quelques minutes chaque fois que des principaux d'un compte reçoivent des erreurs AccessDenied ou UnauthorizedOperation répétées. Le compte dispose d'un journal de suivi (trail) CloudTrail multi-Régions qui livre ses fichiers journaux uniquement dans un compartiment Amazon S3.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an IAM Access Analyzer unused access analyzer and send its findings to an Amazon SNS topic.", fr: "Créer un analyseur d'accès inutilisés IAM Access Analyzer et envoyer ses résultats à une rubrique Amazon SNS." } }
    - { id: b, text: { en: "Configure the trail to also send events to a CloudWatch Logs log group.", fr: "Configurer le journal de suivi pour qu'il envoie aussi les événements à un groupe de journaux CloudWatch Logs." } }
    - { id: c, text: { en: "Deploy an AWS Config managed rule that evaluates IAM policies and notifies an SNS topic of failed requests.", fr: "Déployer une règle gérée AWS Config qui évalue les politiques IAM et notifie une rubrique SNS des requêtes en échec." } }
    - { id: d, text: { en: "Create a metric filter on the log group that matches these errorCode values, and a CloudWatch alarm on the metric that notifies an SNS topic.", fr: "Créer sur le groupe de journaux un filtre de métriques qui correspond à ces valeurs d'errorCode, et une alarme CloudWatch sur la métrique qui notifie une rubrique SNS." } }
    - { id: e, text: { en: "Schedule a CloudTrail Event history search every 5 minutes and email the results to the security team.", fr: "Planifier une recherche dans l'historique des événements CloudTrail toutes les 5 minutes et envoyer les résultats par e-mail à l'équipe de sécurité." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Metric filters work on CloudWatch Logs, so the trail must first deliver events to a log group. A metric filter that matches errorCode values such as AccessDenied* and *UnauthorizedOperation turns the events into a metric, and an alarm with an SNS action sends the email when the count reaches the threshold."
    fr: "Les filtres de métriques fonctionnent sur CloudWatch Logs : le journal de suivi doit d'abord livrer les événements à un groupe de journaux. Un filtre de métriques qui correspond aux valeurs d'errorCode comme AccessDenied* et *UnauthorizedOperation transforme les événements en métrique, et une alarme avec une action SNS envoie l'e-mail quand le nombre atteint le seuil."
  options:
    a:
      en: "Unused access analyzers report unused roles, keys and permissions; they do not detect failed API calls."
      fr: "Les analyseurs d'accès inutilisés signalent les rôles, clés et autorisations inutilisés ; ils ne détectent pas les appels d'API en échec."
    c:
      en: "AWS Config rules evaluate resource configurations; they do not monitor API call errors."
      fr: "Les règles AWS Config évaluent les configurations des ressources ; elles ne surveillent pas les erreurs d'appels d'API."
    e:
      en: "Event history cannot be scheduled or send notifications; it is an interactive search of the last 90 days."
      fr: "L'historique des événements ne peut pas être planifié ni envoyer de notifications ; c'est une recherche interactive sur les 90 derniers jours."
references:
  - title: "Creating CloudWatch alarms for CloudTrail events: examples"
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudwatch-alarms-for-cloudtrail.html
