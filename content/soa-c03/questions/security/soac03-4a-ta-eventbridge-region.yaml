id: soac03-4a-ta-eventbridge-region
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has AWS Enterprise Support and runs all its workloads in the eu-west-1 Region. To automate remediation, a CloudOps engineer created an Amazon EventBridge rule in eu-west-1 that matches AWS Trusted Advisor check refresh events with the ERROR status and invokes an AWS Lambda function. Several security checks have turned red since then, but the function has never been invoked.

    What should the engineer do?
  fr: |
    Une entreprise dispose d'AWS Enterprise Support et exécute toutes ses charges de travail dans la Région eu-west-1. Pour automatiser la correction, un ingénieur CloudOps a créé dans eu-west-1 une règle Amazon EventBridge qui correspond aux événements d'actualisation des vérifications AWS Trusted Advisor avec le statut ERROR et invoque une fonction AWS Lambda. Plusieurs vérifications de sécurité sont passées au rouge depuis, mais la fonction n'a jamais été invoquée.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Change the status in the event pattern from ERROR to WARN.", fr: "Remplacer le statut ERROR par WARN dans le modèle d'événement." } }
    - { id: b, text: { en: "Enable the organizational view of Trusted Advisor so that check results are published as events.", fr: "Activer la vue organisationnelle de Trusted Advisor pour que les résultats des vérifications soient publiés sous forme d'événements." } }
    - { id: c, text: { en: "Create the EventBridge rule in the us-east-1 Region with the same pattern and target.", fr: "Créer la règle EventBridge dans la Région us-east-1 avec le même modèle et la même cible." } }
    - { id: d, text: { en: "Add a resource-based policy to the Lambda function that allows trustedadvisor.amazonaws.com to invoke it.", fr: "Ajouter à la fonction Lambda une politique basée sur les ressources qui autorise trustedadvisor.amazonaws.com à l'invoquer." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Trusted Advisor is a global service and emits all its events to EventBridge in US East (N. Virginia). A rule in eu-west-1 never receives them, so the rule must be created in us-east-1; its target can be a function in us-east-1 or another event bus that forwards the event."
    fr: "Trusted Advisor est un service mondial qui émet tous ses événements vers EventBridge dans la Région USA Est (Virginie du Nord). Une règle dans eu-west-1 ne les reçoit jamais : la règle doit être créée dans us-east-1 ; sa cible peut être une fonction dans us-east-1 ou un autre bus d'événements qui transfère l'événement."
  options:
    a:
      en: "ERROR is the status of red checks (action recommended); WARN is for yellow checks, so this would miss the red findings."
      fr: "ERROR est le statut des vérifications rouges (action recommandée) ; WARN correspond aux vérifications jaunes : on manquerait les résultats rouges."
    b:
      en: "The organizational view creates aggregated reports; it is not required for Trusted Advisor events."
      fr: "La vue organisationnelle crée des rapports agrégés ; elle n'est pas nécessaire aux événements Trusted Advisor."
    d:
      en: "EventBridge, not Trusted Advisor, invokes the target, and no event reaches the rule in eu-west-1 in the first place."
      fr: "C'est EventBridge, et non Trusted Advisor, qui invoque la cible, et aucun événement n'atteint de toute façon la règle dans eu-west-1."
references:
  - title: Monitoring AWS Trusted Advisor check results with Amazon EventBridge
    url: https://docs.aws.amazon.com/awssupport/latest/user/cloudwatch-events-ta.html
