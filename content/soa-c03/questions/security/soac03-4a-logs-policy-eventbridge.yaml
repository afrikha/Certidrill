id: soac03-4a-logs-policy-eventbridge
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CloudOps engineer uses the AWS CLI to create a CloudWatch Logs log group named /aws/events/ec2-state and an Amazon EventBridge rule that sends EC2 instance state-change events to the log group. The rule's metrics show matched events and failed invocations, and no log events appear in the log group.

    Which action will resolve the issue?
  fr: |
    Un ingénieur CloudOps utilise l'AWS CLI pour créer un groupe de journaux CloudWatch Logs nommé /aws/events/ec2-state et une règle Amazon EventBridge qui envoie les événements de changement d'état des instances EC2 vers ce groupe de journaux. Les métriques de la règle indiquent des événements correspondants et des invocations en échec, et aucun événement de journal n'apparaît dans le groupe de journaux.

    Quelle action résout le problème ?
body:
  options:
    - { id: a, text: { en: "Add a RoleArn to the rule target that references an IAM role with logs:CreateLogStream and logs:PutLogEvents permissions.", fr: "Ajouter à la cible de la règle un RoleArn qui référence un rôle IAM doté des autorisations logs:CreateLogStream et logs:PutLogEvents." } }
    - { id: b, text: { en: "Add a CloudWatch Logs resource policy that allows events.amazonaws.com to call logs:CreateLogStream and logs:PutLogEvents on the log group.", fr: "Ajouter une politique de ressource CloudWatch Logs qui autorise events.amazonaws.com à appeler logs:CreateLogStream et logs:PutLogEvents sur le groupe de journaux." } }
    - { id: c, text: { en: "Add logs:CreateLogStream and logs:PutLogEvents to the identity-based policy of the IAM user who created the rule.", fr: "Ajouter logs:CreateLogStream et logs:PutLogEvents à la politique basée sur l'identité de l'utilisateur IAM qui a créé la règle." } }
    - { id: d, text: { en: "Associate an AWS KMS customer managed key with the log group and allow events.amazonaws.com to use the key.", fr: "Associer une clé gérée par le client AWS KMS au groupe de journaux et autoriser events.amazonaws.com à utiliser la clé." } }
answer: { optionId: b }
explanation:
  correct:
    en: "For a CloudWatch Logs target, EventBridge relies only on a resource-based policy of CloudWatch Logs that lets it create log streams and write events. The console creates this policy automatically; with the CLI, the engineer must create it with aws logs put-resource-policy."
    fr: "Pour une cible CloudWatch Logs, EventBridge s'appuie uniquement sur une politique basée sur les ressources de CloudWatch Logs qui lui permet de créer des flux de journaux et d'écrire des événements. La console crée automatiquement cette politique ; avec la CLI, l'ingénieur doit la créer avec aws logs put-resource-policy."
  options:
    a:
      en: "EventBridge uses an execution role for targets such as Lambda, SNS or SQS, but not for CloudWatch Logs targets, for which no RoleArn is specified."
      fr: "EventBridge utilise un rôle d'exécution pour des cibles comme Lambda, SNS ou SQS, mais pas pour les cibles CloudWatch Logs, pour lesquelles aucun RoleArn n'est spécifié."
    c:
      en: "EventBridge does not deliver events with the credentials of the user who created the rule, so the user's permissions do not matter."
      fr: "EventBridge ne livre pas les événements avec les informations d'identification de l'utilisateur qui a créé la règle : les autorisations de cet utilisateur n'ont pas d'importance."
    d:
      en: "Encryption with a customer managed key is optional and adds a requirement; it does not grant EventBridge permission to write to the log group."
      fr: "Le chiffrement avec une clé gérée par le client est facultatif et ajoute une exigence ; il n'accorde pas à EventBridge l'autorisation d'écrire dans le groupe de journaux."
references:
  - title: Using resource-based policies for Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-use-resource-based.html
