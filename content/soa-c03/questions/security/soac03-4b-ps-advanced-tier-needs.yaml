id: soac03-4b-ps-advanced-tier-needs
objective: "4.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An operations team stores application settings and secrets in AWS Systems Manager Parameter Store. To control cost, the team uses standard parameters unless a requirement can be met only with advanced parameters. The team reviews five new requirements.

    Which requirements can be met only with advanced parameters? (Choose two.)
  fr: |
    Une équipe des opérations stocke des paramètres d'application et des secrets dans AWS Systems Manager Parameter Store. Pour maîtriser les coûts, l'équipe utilise des paramètres standard, sauf si une exigence ne peut être satisfaite qu'avec des paramètres avancés. L'équipe examine cinq nouvelles exigences.

    Quelles exigences ne peuvent être satisfaites qu'avec des paramètres avancés ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Encrypt an API key as a SecureString parameter with a customer managed KMS key.", fr: "Chiffrer une clé d'API dans un paramètre SecureString avec une clé KMS gérée par le client." } }
    - { id: b, text: { en: "Store a certificate bundle whose value is 6 KB.", fr: "Stocker un paquet de certificats dont la valeur fait 6 Ko." } }
    - { id: c, text: { en: "Read all parameters under /app/prod/ with one GetParametersByPath call.", fr: "Lire tous les paramètres sous /app/prod/ avec un seul appel GetParametersByPath." } }
    - { id: d, text: { en: "Share a parameter with another AWS account.", fr: "Partager un paramètre avec un autre compte AWS." } }
    - { id: e, text: { en: "Keep the version history of a parameter and attach labels to its versions.", fr: "Conserver l'historique des versions d'un paramètre et attacher des étiquettes à ses versions." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Standard parameters hold values up to 4 KB and cannot be shared with other AWS accounts. Advanced parameters hold values up to 8 KB, can be shared across accounts, and support parameter policies, for an additional charge.
    fr: |
      Les paramètres standard contiennent des valeurs jusqu'à 4 Ko et ne peuvent pas être partagés avec d'autres comptes AWS. Les paramètres avancés contiennent des valeurs jusqu'à 8 Ko, peuvent être partagés entre comptes et prennent en charge les politiques de paramètre, moyennant des frais supplémentaires.
  options:
    a:
      en: |
        SecureString parameters, including with a customer managed key, are available in the standard tier.
      fr: |
        Les paramètres SecureString, y compris avec une clé gérée par le client, sont disponibles au niveau standard.
    c:
      en: |
        Parameter hierarchies and GetParametersByPath work with standard parameters.
      fr: |
        Les hiérarchies de paramètres et GetParametersByPath fonctionnent avec les paramètres standard.
    e:
      en: |
        Version history and labels are available for standard parameters too.
      fr: |
        L'historique des versions et les étiquettes sont aussi disponibles pour les paramètres standard.
references:
  - title: Choosing parameter tiers in Parameter Store
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-advanced-parameters.html
