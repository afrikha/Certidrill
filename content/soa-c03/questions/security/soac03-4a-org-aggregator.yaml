id: soac03-4a-org-aggregator
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 60 AWS accounts in an organization and uses AWS Config in four Regions in every account. The compliance team wants a single view of the compliance status of AWS Config rules and resources across all accounts and Regions, including accounts added later. The team does not want to configure an authorization in each account.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a 60 comptes AWS dans une organisation et utilise AWS Config dans quatre Régions de chaque compte. L'équipe conformité veut une vue unique de l'état de conformité des règles et des ressources AWS Config de tous les comptes et de toutes les Régions, y compris les comptes ajoutés plus tard. L'équipe ne veut pas configurer d'autorisation dans chaque compte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable the AWS Trusted Advisor organizational view and create a report for all check categories.", fr: "Activer la vue organisationnelle d'AWS Trusted Advisor et créer un rapport pour toutes les catégories de vérifications." } }
    - { id: b, text: { en: "Create an AWS Config aggregator that lists the 60 account IDs, and create an aggregator authorization in each account.", fr: "Créer un agrégateur AWS Config qui liste les 60 ID de compte, et créer une autorisation d'agrégateur dans chaque compte." } }
    - { id: c, text: { en: "Deploy an organization conformance pack and open the conformance pack dashboard of the delegated administrator account.", fr: "Déployer un pack de conformité d'organisation et ouvrir le tableau de bord des packs de conformité du compte administrateur délégué." } }
    - { id: d, text: { en: "Create an AWS Config aggregator in the delegated administrator account that uses the organization as its source and includes all four Regions.", fr: "Créer dans le compte administrateur délégué un agrégateur AWS Config qui utilise l'organisation comme source et inclut les quatre Régions." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An aggregator collects AWS Config configuration and compliance data from multiple accounts and Regions into a read-only view. With the organization as its source, it includes every account of the organization, also accounts that join later, and no per-account authorization is required."
    fr: "Un agrégateur collecte les données de configuration et de conformité AWS Config de plusieurs comptes et Régions dans une vue en lecture seule. Avec l'organisation comme source, il inclut chaque compte de l'organisation, y compris ceux qui la rejoignent plus tard, sans autorisation par compte."
  options:
    a:
      en: "Trusted Advisor reports show Trusted Advisor check results, not the compliance of AWS Config rules."
      fr: "Les rapports Trusted Advisor présentent les résultats des vérifications Trusted Advisor, pas la conformité des règles AWS Config."
    b:
      en: "An aggregator with individual accounts requires an authorization in each source account and must be updated for every new account."
      fr: "Un agrégateur avec des comptes individuels exige une autorisation dans chaque compte source et doit être mis à jour pour chaque nouveau compte."
    c:
      en: "An organization conformance pack deploys rules; it does not give a single view of all rules and resources across accounts and Regions."
      fr: "Un pack de conformité d'organisation déploie des règles ; il ne donne pas de vue unique de toutes les règles et ressources des comptes et Régions."
references:
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
