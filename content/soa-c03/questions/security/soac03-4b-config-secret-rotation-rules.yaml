id: soac03-4b-config-secret-rotation-rules
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores database credentials in AWS Secrets Manager. A compliance requirement states that every secret must have rotation enabled with an interval of 30 days or less, and that the compliance team must be able to see when a scheduled rotation did not complete. The company wants to use AWS Config managed rules.

    Which AWS Config managed rules will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise stocke des informations d'identification de base de données dans AWS Secrets Manager. Une exigence de conformité impose que la rotation soit activée sur chaque secret avec un intervalle de 30 jours au plus, et que l'équipe de conformité puisse voir quand une rotation planifiée n'a pas abouti. L'entreprise veut utiliser des règles gérées AWS Config.

    Quelles règles gérées AWS Config répondent à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "secretsmanager-secret-unused with unusedForDays set to 30", fr: "secretsmanager-secret-unused avec unusedForDays défini sur 30" } }
    - { id: b, text: { en: "secretsmanager-scheduled-rotation-success-check", fr: "secretsmanager-scheduled-rotation-success-check" } }
    - { id: c, text: { en: "access-keys-rotated with maxAccessKeyAge set to 30", fr: "access-keys-rotated avec maxAccessKeyAge défini sur 30" } }
    - { id: d, text: { en: "required-tags with tag1Key set to RotationDays", fr: "required-tags avec tag1Key défini sur RotationDays" } }
    - { id: e, text: { en: "secretsmanager-rotation-enabled-check with maximumAllowedRotationFrequency set to 30", fr: "secretsmanager-rotation-enabled-check avec maximumAllowedRotationFrequency défini sur 30" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      secretsmanager-rotation-enabled-check is NON_COMPLIANT when a secret is not scheduled for rotation, or when its rotation frequency exceeds the optional maximumAllowedRotationFrequency parameter (in days). secretsmanager-scheduled-rotation-success-check is NON_COMPLIANT when the calculated rotation date passes and the secret was not rotated.
    fr: |
      secretsmanager-rotation-enabled-check est NON_COMPLIANT lorsqu'un secret n'est pas planifié pour la rotation, ou lorsque sa fréquence de rotation dépasse le paramètre facultatif maximumAllowedRotationFrequency (en jours). secretsmanager-scheduled-rotation-success-check est NON_COMPLIANT lorsque la date de rotation calculée est dépassée sans que le secret ait été renouvelé.
  options:
    a:
      en: |
        This rule reports secrets that have not been accessed for a number of days; it says nothing about rotation.
      fr: |
        Cette règle signale les secrets qui n'ont pas été consultés depuis un certain nombre de jours ; elle n'indique rien sur la rotation.
    c:
      en: |
        This rule checks the age of IAM user access keys, not Secrets Manager secrets.
      fr: |
        Cette règle vérifie l'âge des clés d'accès des utilisateurs IAM, pas les secrets Secrets Manager.
    d:
      en: |
        A tag only documents an intended interval; it does not prove that rotation is enabled or that it succeeded.
      fr: |
        Une balise documente seulement un intervalle voulu ; elle ne prouve pas que la rotation est activée ni qu'elle a réussi.
references:
  - title: secretsmanager-rotation-enabled-check
    url: https://docs.aws.amazon.com/config/latest/developerguide/secretsmanager-rotation-enabled-check.html
  - title: secretsmanager-scheduled-rotation-success-check
    url: https://docs.aws.amazon.com/config/latest/developerguide/secretsmanager-scheduled-rotation-success-check.html
