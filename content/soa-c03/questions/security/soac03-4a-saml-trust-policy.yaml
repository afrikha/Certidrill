id: soac03-4a-saml-trust-policy
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company federates its corporate SAML 2.0 identity provider (IdP) with a single AWS account. A CloudOps engineer has created an IAM SAML identity provider named CorpIdP in account 111122223333. The engineer now creates the IAM role that federated operators will use to sign in to the AWS Management Console.

    Which trust policy should the role have?
  fr: |
    Une entreprise fédère son fournisseur d'identité (IdP) SAML 2.0 d'entreprise avec un seul compte AWS. Un ingénieur CloudOps a créé un fournisseur d'identité SAML IAM nommé CorpIdP dans le compte 111122223333. L'ingénieur crée maintenant le rôle IAM que les opérateurs fédérés utiliseront pour se connecter à l'AWS Management Console.

    Quelle politique d'approbation le rôle doit-il avoir ?
body:
  options:
    - { id: a, text: { en: "Allow the Federated principal arn:aws:iam::111122223333:saml-provider/CorpIdP to call sts:AssumeRoleWithWebIdentity when the token audience matches the IdP.", fr: "Autoriser le principal Federated arn:aws:iam::111122223333:saml-provider/CorpIdP à appeler sts:AssumeRoleWithWebIdentity lorsque l'audience du jeton correspond à l'IdP." } }
    - { id: b, text: { en: "Allow the Federated principal arn:aws:iam::111122223333:saml-provider/CorpIdP to call sts:AssumeRoleWithSAML when SAML:aud equals the AWS sign-in SAML endpoint.", fr: "Autoriser le principal Federated arn:aws:iam::111122223333:saml-provider/CorpIdP à appeler sts:AssumeRoleWithSAML lorsque SAML:aud est égal au point de terminaison SAML de connexion AWS." } }
    - { id: c, text: { en: "Allow the AWS principal arn:aws:iam::111122223333:root to call sts:AssumeRole when aws:MultiFactorAuthPresent is true.", fr: "Autoriser le principal AWS arn:aws:iam::111122223333:root à appeler sts:AssumeRole lorsque aws:MultiFactorAuthPresent est true." } }
    - { id: d, text: { en: "Allow the Service principal sso.amazonaws.com to call sts:AssumeRole when aws:SourceAccount equals 111122223333.", fr: "Autoriser le principal Service sso.amazonaws.com à appeler sts:AssumeRole lorsque aws:SourceAccount est égal à 111122223333." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A role for SAML 2.0 federation trusts the IAM SAML provider as a Federated principal and allows sts:AssumeRoleWithSAML. The SAML:aud condition limits the role to assertions sent to the AWS sign-in SAML endpoint, which is what console federation uses."
    fr: "Un rôle de fédération SAML 2.0 approuve le fournisseur SAML IAM comme principal Federated et autorise sts:AssumeRoleWithSAML. La condition SAML:aud limite le rôle aux assertions envoyées au point de terminaison SAML de connexion AWS, celui qu'utilise la fédération vers la console."
  options:
    a:
      en: "sts:AssumeRoleWithWebIdentity is used with OIDC identity providers, not with SAML assertions."
      fr: "sts:AssumeRoleWithWebIdentity s'utilise avec des fournisseurs d'identité OIDC, pas avec des assertions SAML."
    c:
      en: "Trusting the account root lets IAM principals of the account assume the role; federated users who have no IAM identity cannot use it."
      fr: "Approuver la racine du compte permet aux principaux IAM du compte d'endosser le rôle ; les utilisateurs fédérés, qui n'ont pas d'identité IAM, ne peuvent pas l'utiliser."
    d:
      en: "A Service principal lets an AWS service assume the role. It does not let users who are federated through the corporate IdP assume it."
      fr: "Un principal Service permet à un service AWS d'endosser le rôle. Il ne permet pas aux utilisateurs fédérés via l'IdP d'entreprise de l'endosser."
references:
  - title: Create a role for SAML 2.0 federation (console)
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_saml.html
