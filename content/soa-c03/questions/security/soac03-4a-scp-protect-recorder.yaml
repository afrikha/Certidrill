id: soac03-4a-scp-protect-recorder
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Config in every member account of its organization. A role named SecurityAutomation exists in each member account and is used by the security team to maintain AWS Config. No other principal in the member accounts may stop or delete the AWS Config configuration recorder, including account administrators.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Config dans chaque compte membre de son organisation. Un rôle nommé SecurityAutomation existe dans chaque compte membre et sert à l'équipe de sécurité à maintenir AWS Config. Aucun autre principal des comptes membres ne doit pouvoir arrêter ou supprimer l'enregistreur de configuration AWS Config, y compris les administrateurs de compte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an SCP that allows config:StopConfigurationRecorder and config:DeleteConfigurationRecorder only when aws:PrincipalArn matches the SecurityAutomation role.", fr: "Attacher une SCP qui autorise config:StopConfigurationRecorder et config:DeleteConfigurationRecorder uniquement lorsque aws:PrincipalArn correspond au rôle SecurityAutomation." } }
    - { id: b, text: { en: "Attach a permissions boundary that denies both actions to every IAM role in the member accounts except SecurityAutomation.", fr: "Attacher à chaque rôle IAM des comptes membres, sauf SecurityAutomation, une limite d'autorisations qui refuse ces deux actions." } }
    - { id: c, text: { en: "Attach an SCP that denies both actions unless aws:PrincipalAccount equals the management account ID.", fr: "Attacher une SCP qui refuse ces deux actions sauf si aws:PrincipalAccount est égal à l'ID du compte de gestion." } }
    - { id: d, text: { en: "Attach an SCP that denies both actions with an ArnNotLike condition on aws:PrincipalArn set to arn:aws:iam::*:role/SecurityAutomation.", fr: "Attacher une SCP qui refuse ces deux actions avec une condition ArnNotLike sur aws:PrincipalArn définie sur arn:aws:iam::*:role/SecurityAutomation." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A Deny SCP with an ArnNotLike condition on aws:PrincipalArn blocks the actions for every principal in the member accounts except the named role. Because the SCP keeps the FullAWSAccess allow in place, SecurityAutomation keeps the permissions that its own policies grant."
    fr: "Une SCP Deny avec une condition ArnNotLike sur aws:PrincipalArn bloque les actions pour tous les principaux des comptes membres, sauf le rôle désigné. Comme FullAWSAccess reste en place, SecurityAutomation conserve les autorisations que ses propres politiques lui accordent."
  options:
    a:
      en: "SCPs do not grant permissions, and as long as FullAWSAccess is attached, an additional Allow SCP does not stop other principals from performing the actions."
      fr: "Les SCP n'accordent pas d'autorisations, et tant que FullAWSAccess est attachée, une SCP Allow supplémentaire n'empêche pas les autres principaux d'effectuer les actions."
    b:
      en: "Administrators can create new roles without the boundary or remove it, so the boundary does not protect the recorder."
      fr: "Les administrateurs peuvent créer de nouveaux rôles sans la limite ou la retirer : la limite ne protège pas l'enregistreur."
    c:
      en: "Principals of member accounts never belong to the management account, so this SCP would also block the SecurityAutomation role."
      fr: "Les principaux des comptes membres n'appartiennent jamais au compte de gestion : cette SCP bloquerait aussi le rôle SecurityAutomation."
references:
  - title: Service control policy examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_general.html
