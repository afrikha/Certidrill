id: soac03-4b-sm-rotate-now
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Secrets Manager secret stores the credentials of an Amazon RDS database and has automatic rotation configured every 30 days. Today, the password appeared in plain text in an application log. The company must replace the password in the database and in the secret now, by using the existing rotation configuration.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un secret AWS Secrets Manager stocke les informations d'identification d'une base de données Amazon RDS et dispose d'une rotation automatique configurée tous les 30 jours. Aujourd'hui, le mot de passe est apparu en clair dans un journal d'application. L'entreprise doit remplacer dès maintenant le mot de passe dans la base et dans le secret, en utilisant la configuration de rotation existante.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - id: a
      text: { en: "Change the rotation schedule of the secret to every 4 hours.", fr: "Changer la planification de rotation du secret pour qu'elle ait lieu toutes les 4 heures." }
    - id: b
      text: { en: "Run aws secretsmanager rotate-secret for the secret.", fr: "Exécuter aws secretsmanager rotate-secret pour le secret." }
    - id: c
      text: { en: "Run aws secretsmanager put-secret-value with a new password.", fr: "Exécuter aws secretsmanager put-secret-value avec un nouveau mot de passe." }
    - id: d
      text: { en: "Delete the secret without a recovery window, and create it again.", fr: "Supprimer le secret sans fenêtre de récupération, puis le recréer." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For a secret that has rotation configured, rotate-secret (or Rotate secret immediately in the console) starts a rotation now with the existing rotation function, which changes the password in the database and stores the new version as AWSCURRENT.
    fr: |
      Pour un secret dont la rotation est configurée, rotate-secret (ou Rotate secret immediately dans la console) lance immédiatement une rotation avec la fonction de rotation existante, qui change le mot de passe dans la base et stocke la nouvelle version comme AWSCURRENT.
  options:
    a:
      en: |
        A shorter schedule does not start a rotation now and would keep rotating the password far more often than needed.
      fr: |
        Une planification plus courte ne lance pas de rotation maintenant et ferait tourner le mot de passe bien plus souvent que nécessaire.
    c:
      en: |
        put-secret-value changes only the stored value; the database password stays the same, so the secret no longer matches the database.
      fr: |
        put-secret-value ne change que la valeur stockée ; le mot de passe de la base reste le même, et le secret ne correspond plus à la base.
    d:
      en: |
        Recreating the secret changes its ARN, loses its rotation configuration, and still does not change the database password.
      fr: |
        Recréer le secret change son ARN, fait perdre sa configuration de rotation et ne change toujours pas le mot de passe de la base.
references:
  - title: Rotate an AWS Secrets Manager secret immediately
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotate-secrets_now.html
