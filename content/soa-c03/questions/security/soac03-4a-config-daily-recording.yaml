id: soac03-4a-config-daily-recording
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A development account records all resource types with AWS Config using continuous recording. Frequently changing resources generate thousands of configuration items each day, and AWS Config costs have increased. The compliance team accepts that changes in this account are captured once a day, but all resource types must still be recorded.

    Which solution will meet these requirements?
  fr: |
    Un compte de développement enregistre tous les types de ressources avec AWS Config en enregistrement continu. Des ressources qui changent fréquemment génèrent des milliers d'éléments de configuration chaque jour, et les coûts d'AWS Config ont augmenté. L'équipe conformité accepte que les changements de ce compte soient capturés une fois par jour, mais tous les types de ressources doivent rester enregistrés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the recording strategy of the configuration recorder to record only specific resource types.", fr: "Modifier la stratégie d'enregistrement de l'enregistreur de configuration pour n'enregistrer que des types de ressources spécifiques." } }
    - { id: b, text: { en: "Change all AWS Config rules of the account to periodic evaluation with a 24-hour frequency.", fr: "Passer toutes les règles AWS Config du compte en évaluation périodique avec une fréquence de 24 heures." } }
    - { id: c, text: { en: "Stop the configuration recorder every evening and start it every morning with an Amazon EventBridge Scheduler schedule.", fr: "Arrêter l'enregistreur de configuration chaque soir et le démarrer chaque matin avec une planification Amazon EventBridge Scheduler." } }
    - { id: d, text: { en: "Change the recording frequency of the configuration recorder from continuous to daily.", fr: "Changer la fréquence d'enregistrement de l'enregistreur de configuration de continue à quotidienne." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With daily recording, AWS Config records at most one configuration item per resource every 24 hours, and only if the state differs from the previous item. This reduces the number of recorded changes and the cost while still recording all resource types."
    fr: "Avec l'enregistrement quotidien, AWS Config enregistre au plus un élément de configuration par ressource toutes les 24 heures, et seulement si l'état diffère de l'élément précédent. Le nombre de changements enregistrés et le coût diminuent, tout en continuant à enregistrer tous les types de ressources."
  options:
    a:
      en: "Recording only specific resource types breaks the requirement to record all resource types."
      fr: "N'enregistrer que des types de ressources spécifiques enfreint l'exigence d'enregistrer tous les types de ressources."
    b:
      en: "The rule trigger changes when rules evaluate, but the recorder still creates a configuration item for every change."
      fr: "Le déclencheur des règles change le moment de leur évaluation, mais l'enregistreur crée toujours un élément de configuration pour chaque changement."
    c:
      en: "Stopping the recorder leaves daily gaps in which changes are not recorded and adds a schedule to maintain."
      fr: "Arrêter l'enregistreur laisse chaque jour des périodes pendant lesquelles les changements ne sont pas enregistrés, et ajoute une planification à maintenir."
references:
  - title: Recording AWS Resources with AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/select-resources.html
