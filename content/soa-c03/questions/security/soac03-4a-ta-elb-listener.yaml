id: soac03-4a-ta-elb-listener
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has AWS Business Support+. The AWS Trusted Advisor ELB Listener Security check shows a yellow status for an Application Load Balancer. Its HTTPS listener was created several years ago with the AWS CLI without specifying a security policy. The CloudOps engineer must remediate the finding without changing the certificate or the targets.

    Which action should the engineer take?
  fr: |
    Une entreprise dispose d'AWS Business Support+. La vérification AWS Trusted Advisor ELB Listener Security affiche un statut jaune pour un Application Load Balancer. Son écouteur HTTPS a été créé il y a plusieurs années avec l'AWS CLI sans préciser de politique de sécurité. L'ingénieur CloudOps doit corriger ce résultat sans changer le certificat ni les cibles.

    Quelle action l'ingénieur doit-il effectuer ?
body:
  options:
    - { id: a, text: { en: "Add an HTTP listener on port 80 with a rule that redirects all requests to HTTPS.", fr: "Ajouter un écouteur HTTP sur le port 80 avec une règle qui redirige toutes les requêtes vers HTTPS." } }
    - { id: b, text: { en: "Change the protocol of the target group from HTTP to HTTPS.", fr: "Remplacer le protocole du groupe cible HTTP par HTTPS." } }
    - { id: c, text: { en: "Request a new public certificate in ACM and replace the default certificate of the listener.", fr: "Demander un nouveau certificat public dans ACM et remplacer le certificat par défaut de l'écouteur." } }
    - { id: d, text: { en: "Modify the HTTPS listener to use the ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09 security policy.", fr: "Modifier l'écouteur HTTPS pour qu'il utilise la politique de sécurité ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The check is yellow when an HTTPS listener uses a policy with weak ciphers or not the recommended policy. The CLI default is the older ELBSecurityPolicy-2016-08, so the engineer updates the listener with modify-listener to the recommended ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09 policy, which changes neither the certificate nor the targets."
    fr: "La vérification est jaune quand un écouteur HTTPS utilise une politique avec des chiffrements faibles ou autre que la politique recommandée. Le défaut de la CLI est l'ancienne politique ELBSecurityPolicy-2016-08 : l'ingénieur met à jour l'écouteur avec modify-listener vers la politique recommandée ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09, ce qui ne change ni le certificat ni les cibles."
  options:
    a:
      en: "A redirect helps clients reach HTTPS, but the HTTPS listener still uses the outdated security policy that the check flags."
      fr: "Une redirection aide les clients à atteindre HTTPS, mais l'écouteur HTTPS utilise toujours la politique de sécurité obsolète signalée par la vérification."
    b:
      en: "The target group protocol affects the connection to the targets, not the TLS policy of the front-end listener, and it changes the target configuration."
      fr: "Le protocole du groupe cible concerne la connexion vers les cibles, pas la politique TLS de l'écouteur frontal, et il modifie la configuration des cibles."
    c:
      en: "The certificate does not determine the protocols and ciphers that the listener negotiates, and the requirement forbids changing it."
      fr: "Le certificat ne détermine pas les protocoles et chiffrements négociés par l'écouteur, et l'exigence interdit de le changer."
references:
  - title: Security policies for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
  - title: Security
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
