id: soac03-4b-alb-mtls-verify
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes an API to partner systems through an HTTPS listener of an Application Load Balancer. Each partner system has a client certificate issued by the company's private certificate authority. The load balancer must reject any TLS connection that does not present a valid client certificate from that authority, and the API code on the targets must not have to validate certificates.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose une API aux systèmes de ses partenaires par un écouteur HTTPS d'un Application Load Balancer. Chaque système partenaire dispose d'un certificat client émis par l'autorité de certification privée de l'entreprise. L'équilibreur de charge doit rejeter toute connexion TLS qui ne présente pas de certificat client valide de cette autorité, et le code de l'API sur les cibles ne doit pas avoir à valider les certificats.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable mutual TLS in passthrough mode on the listener, and forward the X-Amzn-Mtls-Clientcert header to the targets.", fr: "Activer le TLS mutuel en mode passthrough sur l'écouteur, et transmettre l'en-tête X-Amzn-Mtls-Clientcert aux cibles." }
    - id: b
      text: { en: "Create a trust store with the CA certificate bundle of the private CA, and enable mutual TLS in verify mode on the listener.", fr: "Créer un magasin de confiance (trust store) avec le paquet de certificats de l'autorité privée, et activer le TLS mutuel en mode verify sur l'écouteur." }
    - id: c
      text: { en: "Import the CA certificate into AWS Certificate Manager, and add it to the certificate list of the listener.", fr: "Importer le certificat de l'autorité dans AWS Certificate Manager, et l'ajouter à la liste de certificats de l'écouteur." }
    - id: d
      text: { en: "Change the target group protocol to HTTPS, and install the CA certificate on the targets.", fr: "Passer le protocole du groupe cible à HTTPS, et installer le certificat de l'autorité sur les cibles." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In verify mode, the Application Load Balancer performs X.509 client certificate authentication during the TLS negotiation against the CA bundle uploaded to a trust store, and it can also check revocation lists. Invalid clients are rejected at the load balancer, and verified certificate details are passed to the targets in X-Amzn-Mtls headers.
    fr: |
      En mode verify, l'Application Load Balancer effectue l'authentification X.509 des certificats clients pendant la négociation TLS, par rapport au paquet de certificats chargé dans un magasin de confiance, et peut aussi vérifier des listes de révocation. Les clients non valides sont rejetés par l'équilibreur de charge, et les détails des certificats vérifiés sont transmis aux cibles dans des en-têtes X-Amzn-Mtls.
  options:
    a:
      en: |
        In passthrough mode, the load balancer sends the client certificate chain to the targets without verifying it, so the targets must validate it.
      fr: |
        En mode passthrough, l'équilibreur de charge envoie la chaîne de certificats client aux cibles sans la vérifier : ce sont les cibles qui doivent la valider.
    c:
      en: |
        The certificate list holds server certificates that the listener presents to clients; it does not authenticate client certificates.
      fr: |
        La liste de certificats contient les certificats serveur que l'écouteur présente aux clients ; elle n'authentifie pas les certificats clients.
    d:
      en: |
        This encrypts traffic between the load balancer and the targets; it does not authenticate the partners' client certificates.
      fr: |
        Cela chiffre le trafic entre l'équilibreur de charge et les cibles ; cela n'authentifie pas les certificats clients des partenaires.
references:
  - title: Mutual authentication with TLS in Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/mutual-authentication.html
