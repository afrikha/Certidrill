id: soac03-4b-sm-rotation-db-sg
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company added automatic rotation to an AWS Secrets Manager secret for an Amazon RDS for MySQL DB instance. The rotation function runs in the database VPC, uses the security group sg-rotation that allows all outbound traffic, and reaches Secrets Manager through an interface VPC endpoint. Rotation fails at the setSecret step with the message "Unable to log into database", after a long wait. The DB instance's security group allows port 3306 only from the application servers' security group.

    Which solution will resolve the issue?
  fr: |
    Une entreprise a ajouté la rotation automatique à un secret AWS Secrets Manager destiné à une instance de base de données Amazon RDS for MySQL. La fonction de rotation s'exécute dans le VPC de la base, utilise le groupe de sécurité sg-rotation qui autorise tout le trafic sortant, et joint Secrets Manager par un point de terminaison d'interface VPC. La rotation échoue à l'étape setSecret avec le message « Unable to log into database », après une longue attente. Le groupe de sécurité de l'instance n'autorise le port 3306 que depuis le groupe de sécurité des serveurs d'application.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add an inbound rule to the DB instance's security group that allows port 3306 from sg-rotation.", fr: "Ajouter au groupe de sécurité de l'instance une règle entrante qui autorise le port 3306 depuis sg-rotation." }
    - id: b
      text: { en: "Remove the AWSPENDING staging label from the secret, and start the rotation again.", fr: "Retirer l'étiquette intermédiaire (staging label) AWSPENDING du secret, et relancer la rotation." }
    - id: c
      text: { en: "Grant the rotation function's execution role kms:Decrypt on the key that encrypts the secret.", fr: "Accorder au rôle d'exécution de la fonction de rotation kms:Decrypt sur la clé qui chiffre le secret." }
    - id: d
      text: { en: "Reset the database password manually, and store the new value in the AWSCURRENT version of the secret.", fr: "Réinitialiser manuellement le mot de passe de la base, et stocker la nouvelle valeur dans la version AWSCURRENT du secret." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The rotation function must be able to connect to the database: its security group must allow outbound traffic to the database, and the database's security group must allow inbound traffic from the function. A long task duration before "Unable to log into database" points to a network problem rather than wrong credentials.
    fr: |
      La fonction de rotation doit pouvoir se connecter à la base : son groupe de sécurité doit autoriser le trafic sortant vers la base, et le groupe de sécurité de la base doit autoriser le trafic entrant depuis la fonction. Une longue durée avant « Unable to log into database » indique un problème réseau plutôt que des informations d'identification erronées.
  options:
    b:
      en: |
        Clearing AWSPENDING helps when rotation keeps failing on a stale pending version; the function would still be unable to reach the database.
      fr: |
        Retirer AWSPENDING aide lorsque la rotation échoue sur une version en attente obsolète ; la fonction ne pourrait toujours pas joindre la base.
    c:
      en: |
        A KMS permission problem fails with an AccessDeniedException about KMS, not with a login failure after a long wait.
      fr: |
        Un problème d'autorisation KMS échoue avec une AccessDeniedException concernant KMS, pas avec un échec de connexion après une longue attente.
    d:
      en: |
        Manual changes do not fix network access, and the next rotation would fail the same way.
      fr: |
        Les modifications manuelles ne corrigent pas l'accès réseau, et la rotation suivante échouerait de la même façon.
references:
  - title: Troubleshoot AWS Secrets Manager rotation
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/troubleshoot_rotation.html
