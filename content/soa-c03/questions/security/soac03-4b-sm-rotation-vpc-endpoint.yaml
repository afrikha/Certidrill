id: soac03-4b-sm-rotation-vpc-endpoint
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Secrets Manager secret for an Amazon RDS database uses a rotation function that runs in the private subnets of the database VPC. The VPC has no NAT gateway and no internet gateway. Rotation fails every time. The function logs show "Found credentials in environment variables" and then nothing until the function times out. The security groups allow the function to reach the database. Traffic must not leave the AWS network.

    Which solution will resolve the issue?
  fr: |
    Un secret AWS Secrets Manager destiné à une base de données Amazon RDS utilise une fonction de rotation qui s'exécute dans les sous-réseaux privés du VPC de la base. Le VPC n'a ni passerelle NAT ni passerelle Internet. La rotation échoue à chaque fois. Les journaux de la fonction affichent « Found credentials in environment variables », puis plus rien jusqu'à l'expiration du délai de la fonction. Les groupes de sécurité permettent à la fonction de joindre la base. Le trafic ne doit pas quitter le réseau AWS.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Increase the timeout of the rotation function, and set the rotation schedule to every 4 hours so that it retries more often.", fr: "Augmenter le délai d'expiration de la fonction de rotation, et planifier la rotation toutes les 4 heures pour qu'elle réessaie plus souvent." }
    - id: b
      text: { en: "Remove the rotation function from the VPC so that it reaches the public Secrets Manager endpoint.", fr: "Retirer la fonction de rotation du VPC afin qu'elle joigne le point de terminaison public de Secrets Manager." }
    - id: c
      text: { en: "Create an interface VPC endpoint for Secrets Manager in the function's subnets, and allow HTTPS from the function to the endpoint.", fr: "Créer un point de terminaison d'interface VPC pour Secrets Manager dans les sous-réseaux de la fonction, et autoriser HTTPS de la fonction vers le point de terminaison." }
    - id: d
      text: { en: "Create a gateway VPC endpoint for Secrets Manager, and add it to the route tables of the function's subnets.", fr: "Créer un point de terminaison de passerelle VPC pour Secrets Manager, et l'ajouter aux tables de routage des sous-réseaux de la fonction." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The rotation function must call a Secrets Manager endpoint. When the logs stop after "Found credentials in environment variables" until the timeout, the function cannot reach that endpoint. In a VPC without internet access, AWS recommends a Secrets Manager interface VPC endpoint, which keeps traffic on the AWS network; its security group must allow HTTPS from the function.
    fr: |
      La fonction de rotation doit appeler un point de terminaison Secrets Manager. Lorsque les journaux s'arrêtent après « Found credentials in environment variables » jusqu'à l'expiration du délai, la fonction ne parvient pas à joindre ce point de terminaison. Dans un VPC sans accès Internet, AWS recommande un point de terminaison d'interface VPC pour Secrets Manager, qui garde le trafic sur le réseau AWS ; son groupe de sécurité doit autoriser HTTPS depuis la fonction.
  options:
    a:
      en: |
        The function waits for an endpoint it can never reach, so a longer timeout or more frequent attempts still fail.
      fr: |
        La fonction attend un point de terminaison qu'elle ne peut jamais joindre : un délai plus long ou des tentatives plus fréquentes échouent toujours.
    b:
      en: |
        Outside the VPC, the function could reach Secrets Manager but no longer the database in the private subnets.
      fr: |
        Hors du VPC, la fonction pourrait joindre Secrets Manager mais plus la base de données des sous-réseaux privés.
    d:
      en: |
        Gateway VPC endpoints exist only for Amazon S3 and DynamoDB; Secrets Manager uses interface endpoints.
      fr: |
        Les points de terminaison de passerelle VPC n'existent que pour Amazon S3 et DynamoDB ; Secrets Manager utilise des points de terminaison d'interface.
references:
  - title: Troubleshoot AWS Secrets Manager rotation
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/troubleshoot_rotation.html
