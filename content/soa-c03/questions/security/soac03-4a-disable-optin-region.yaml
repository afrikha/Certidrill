id: soac03-4a-disable-optin-region
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator of member account 222233334444 enabled the opt-in Region me-central-1, which the company's compliance rules do not allow. All resources in that Region have been deleted. Trusted access for AWS Account Management is enabled in the organization, and the CloudOps engineer works from the management account.

    Which command will disable the Region for the member account?
  fr: |
    Un administrateur du compte membre 222233334444 a activé la Région à adhésion me-central-1, ce que les règles de conformité de l'entreprise n'autorisent pas. Toutes les ressources de cette Région ont été supprimées. L'accès approuvé pour AWS Account Management est activé dans l'organisation, et l'ingénieur CloudOps travaille depuis le compte de gestion.

    Quelle commande désactive la Région pour le compte membre ?
body:
  options:
    - { id: a, text: "aws account get-region-opt-status --account-id 222233334444 --region-name me-central-1" }
    - { id: b, text: "aws organizations disable-aws-service-access --service-principal account.amazonaws.com" }
    - { id: c, text: "aws account disable-region --account-id 222233334444 --region-name me-central-1" }
    - { id: d, text: "aws configservice stop-configuration-recorder --configuration-recorder-name default --region me-central-1" }
answer: { optionId: c }
explanation:
  correct:
    en: "With trusted access for AWS Account Management, the management account or the Account Management delegated administrator can enable or disable opt-in Regions of member accounts with aws account disable-region and the --account-id parameter. The operation is asynchronous, and its progress is checked with get-region-opt-status."
    fr: "Avec l'accès approuvé pour AWS Account Management, le compte de gestion ou l'administrateur délégué d'Account Management peut activer ou désactiver les Régions à adhésion des comptes membres avec aws account disable-region et le paramètre --account-id. L'opération est asynchrone, et sa progression se vérifie avec get-region-opt-status."
  options:
    a:
      en: "get-region-opt-status only reads the status of the Region (for example ENABLED or DISABLING); it does not change it."
      fr: "get-region-opt-status ne fait que lire l'état de la Région (par exemple ENABLED ou DISABLING) ; il ne le modifie pas."
    b:
      en: "This disables trusted access for AWS Account Management, which removes the ability to manage member account Regions centrally."
      fr: "Cette commande désactive l'accès approuvé pour AWS Account Management, ce qui supprime la possibilité de gérer les Régions des comptes membres de façon centralisée."
    d:
      en: "Stopping the configuration recorder stops AWS Config recording in that Region in the current account; the Region stays enabled."
      fr: "Arrêter l'enregistreur de configuration interrompt l'enregistrement AWS Config dans cette Région du compte courant ; la Région reste activée."
references:
  - title: Enable or disable AWS Regions in your account
    url: https://docs.aws.amazon.com/accounts/latest/reference/manage-acct-regions.html
