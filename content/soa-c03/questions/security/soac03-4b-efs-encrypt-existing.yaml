id: soac03-4b-efs-encrypt-existing
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company created an Amazon EFS file system several years ago with the AWS CLI and did not enable encryption at rest. An audit now requires the data of the file system to be encrypted at rest. The data must be preserved.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a créé il y a plusieurs années un système de fichiers Amazon EFS avec l'AWS CLI sans activer le chiffrement au repos. Un audit exige désormais que les données du système de fichiers soient chiffrées au repos. Les données doivent être conservées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Modify the file system to enable encryption at rest with the aws/elasticfilesystem AWS managed key.", fr: "Modifier le système de fichiers pour activer le chiffrement au repos avec la clé gérée par AWS aws/elasticfilesystem." }
    - id: b
      text: { en: "Enable Amazon EBS encryption by default in the Region, and remount the file system on every client.", fr: "Activer le chiffrement Amazon EBS par défaut dans la Région, et remonter le système de fichiers sur chaque client." }
    - id: c
      text: { en: "Replicate the file system to a new encrypted EFS file system, and move the clients to the new file system.", fr: "Répliquer le système de fichiers vers un nouveau système de fichiers EFS chiffré, et basculer les clients vers ce nouveau système de fichiers." }
    - id: d
      text: { en: "Remount the file system on every client with the EFS mount helper and the tls option.", fr: "Remonter le système de fichiers sur chaque client avec l'assistant de montage EFS et l'option tls." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The encryption setting of an EFS file system cannot be changed after creation, so an unencrypted file system cannot be made encrypted. AWS recommends replicating it to a new encrypted file system and then using that file system.
    fr: |
      Le paramètre de chiffrement d'un système de fichiers EFS ne peut pas être modifié après sa création : un système de fichiers non chiffré ne peut pas devenir chiffré. AWS recommande de le répliquer vers un nouveau système de fichiers chiffré, puis d'utiliser ce dernier.
  options:
    a:
      en: |
        Encryption at rest can be chosen only when the file system is created.
      fr: |
        Le chiffrement au repos ne peut être choisi qu'à la création du système de fichiers.
    b:
      en: |
        EBS encryption by default applies to new EBS volumes and snapshots, not to EFS.
      fr: |
        Le chiffrement EBS par défaut s'applique aux nouveaux volumes et instantanés EBS, pas à EFS.
    d:
      en: |
        The tls option encrypts data in transit between the client and EFS; the stored data stays unencrypted.
      fr: |
        L'option tls chiffre les données en transit entre le client et EFS ; les données stockées restent non chiffrées.
references:
  - title: Encrypting data at rest
    url: https://docs.aws.amazon.com/efs/latest/ug/encryption-at-rest.html
