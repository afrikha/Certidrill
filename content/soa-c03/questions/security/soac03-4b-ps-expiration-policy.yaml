id: soac03-4b-ps-expiration-policy
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores a partner API token as a standard SecureString parameter in AWS Systems Manager Parameter Store. The partner issues a new token manually every 90 days through its portal. The operations team must receive a notification 15 days before the token expires, and the parameter must be deleted automatically on the expiration date so that the expired token cannot be used.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke le jeton d'API d'un partenaire dans un paramètre SecureString standard d'AWS Systems Manager Parameter Store. Le partenaire émet manuellement un nouveau jeton tous les 90 jours dans son portail. L'équipe des opérations doit recevoir une notification 15 jours avant l'expiration du jeton, et le paramètre doit être supprimé automatiquement à la date d'expiration afin que le jeton expiré ne puisse pas être utilisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep the standard tier, assign Expiration and ExpirationNotification policies, and send the events to SNS.", fr: "Conserver le niveau standard, attribuer des politiques Expiration et ExpirationNotification, et envoyer les événements vers SNS." }
    - id: b
      text: { en: "Move the token to AWS Secrets Manager, and configure automatic rotation every 75 days.", fr: "Déplacer le jeton dans AWS Secrets Manager, et configurer une rotation automatique tous les 75 jours." }
    - id: c
      text: { en: "Change the parameter to the advanced tier, assign a NoChangeNotification policy of 75 days, and send the events to SNS.", fr: "Passer le paramètre au niveau avancé, attribuer une politique NoChangeNotification de 75 jours, et envoyer les événements vers SNS." }
    - id: d
      text: { en: "Change the parameter to the advanced tier, assign Expiration and ExpirationNotification policies, and send the events to SNS.", fr: "Passer le paramètre au niveau avancé, attribuer des politiques Expiration et ExpirationNotification, et envoyer les événements vers SNS." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Parameter policies are available only for advanced parameters, and a standard parameter can be changed to the advanced tier at any time. An Expiration policy deletes the parameter at the set date and time, and an ExpirationNotification policy emits an Amazon EventBridge event a set number of days before, which an EventBridge rule can send to an SNS topic.
    fr: |
      Les politiques de paramètre ne sont disponibles que pour les paramètres avancés, et un paramètre standard peut passer au niveau avancé à tout moment. Une politique Expiration supprime le paramètre à la date et à l'heure fixées, et une politique ExpirationNotification émet un événement Amazon EventBridge un nombre de jours donné avant, qu'une règle EventBridge peut envoyer vers une rubrique SNS.
  options:
    a:
      en: |
        Standard parameters do not support parameter policies.
      fr: |
        Les paramètres standard ne prennent pas en charge les politiques de paramètre.
    b:
      en: |
        Automatic rotation needs a function that can obtain a new token, but the partner issues tokens manually; rotation does not delete the secret on a date either.
      fr: |
        La rotation automatique nécessite une fonction capable d'obtenir un nouveau jeton, alors que le partenaire émet les jetons manuellement ; la rotation ne supprime pas non plus le secret à une date donnée.
    c:
      en: |
        NoChangeNotification alerts when a parameter has not been modified for a period; it does not delete the parameter on the expiration date.
      fr: |
        NoChangeNotification alerte lorsqu'un paramètre n'a pas été modifié pendant une période ; elle ne supprime pas le paramètre à la date d'expiration.
references:
  - title: Assigning parameter policies in Parameter Store
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-policies.html
