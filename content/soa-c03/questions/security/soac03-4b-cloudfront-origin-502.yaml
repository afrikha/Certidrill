id: soac03-4b-cloudfront-origin-502
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon CloudFront distribution uses a custom origin that runs on Amazon EC2 instances without a load balancer, at origin.example.com. To encrypt traffic to the origin, an engineer set the origin protocol policy to HTTPS Only and installed a self-signed certificate for origin.example.com on the instances. Since then, viewers receive HTTP 502 errors, and the X-Cache header shows Error from cloudfront.

    Which solution will resolve the issue while keeping HTTPS to the origin?
  fr: |
    Une distribution Amazon CloudFront utilise une origine personnalisée qui s'exécute sur des instances Amazon EC2 sans équilibreur de charge, à l'adresse origin.example.com. Pour chiffrer le trafic vers l'origine, un ingénieur a défini la politique de protocole d'origine sur HTTPS Only et installé sur les instances un certificat auto-signé pour origin.example.com. Depuis, les utilisateurs reçoivent des erreurs HTTP 502, et l'en-tête X-Cache indique Error from cloudfront.

    Quelle solution résout le problème tout en conservant HTTPS vers l'origine ?
body:
  options:
    - id: a
      text: { en: "Change the viewer protocol policy of the cache behavior to HTTPS Only for all requests.", fr: "Passer la politique de protocole utilisateur du comportement de cache à HTTPS Only pour toutes les requêtes." }
    - id: b
      text: { en: "Import the self-signed certificate into ACM in us-east-1, and attach it to the distribution.", fr: "Importer le certificat auto-signé dans ACM dans us-east-1, et l'associer à la distribution." }
    - id: c
      text: { en: "Install on the instances a certificate for origin.example.com signed by a trusted third-party CA.", fr: "Installer sur les instances un certificat pour origin.example.com signé par une autorité tierce approuvée." }
    - id: d
      text: { en: "Increase the origin response timeout and the number of connection attempts of the origin.", fr: "Augmenter le délai de réponse de l'origine et le nombre de tentatives de connexion à l'origine." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For origins other than Elastic Load Balancing load balancers, CloudFront requires a certificate signed by a trusted third-party CA that includes the origin domain name. When the origin returns a self-signed, expired or invalid certificate, CloudFront drops the connection and returns HTTP 502 with X-Cache set to Error from cloudfront.
    fr: |
      Pour les origines autres que les équilibreurs de charge Elastic Load Balancing, CloudFront exige un certificat signé par une autorité tierce approuvée et qui contient le nom de domaine de l'origine. Lorsque l'origine renvoie un certificat auto-signé, expiré ou non valide, CloudFront coupe la connexion et renvoie HTTP 502 avec X-Cache égal à Error from cloudfront.
  options:
    a:
      en: |
        The viewer protocol policy governs viewer connections to CloudFront; the failure is on the connection from CloudFront to the origin.
      fr: |
        La politique de protocole utilisateur régit les connexions des utilisateurs vers CloudFront ; l'échec se situe sur la connexion de CloudFront vers l'origine.
    b:
      en: |
        The certificate attached to the distribution is presented to viewers, and CloudFront still cannot trust a self-signed origin certificate.
      fr: |
        Le certificat associé à la distribution est présenté aux utilisateurs, et CloudFront ne peut toujours pas approuver un certificat d'origine auto-signé.
    d:
      en: |
        The connection fails during certificate validation, not because of a timeout, so longer timeouts do not help.
      fr: |
        La connexion échoue lors de la validation du certificat, pas à cause d'un délai d'expiration : allonger les délais n'aide pas.
references:
  - title: Require HTTPS for communication between CloudFront and your custom origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-https-cloudfront-to-custom-origin.html
