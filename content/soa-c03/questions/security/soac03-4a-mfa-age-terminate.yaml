id: soac03-4a-mfa-age-terminate
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Operators assume an IAM role named ProdOps after they sign in with MFA, and their role sessions last up to 8 hours. A new requirement states that ec2:TerminateInstances must be allowed only if the operator authenticated with MFA during the last hour. The other permissions of the role and the session length must not change.

    Which condition should the CloudOps engineer add to the statement that allows ec2:TerminateInstances?
  fr: |
    Les opérateurs endossent un rôle IAM nommé ProdOps après s'être connectés avec la MFA, et leurs sessions de rôle durent jusqu'à 8 heures. Une nouvelle exigence impose que ec2:TerminateInstances ne soit autorisé que si l'opérateur s'est authentifié avec la MFA au cours de la dernière heure. Les autres autorisations du rôle et la durée des sessions ne doivent pas changer.

    Quelle condition l'ingénieur CloudOps doit-il ajouter à l'instruction qui autorise ec2:TerminateInstances ?
body:
  options:
    - { id: a, text: "\"BoolIfExists\": { \"aws:MultiFactorAuthPresent\": \"true\" }" }
    - { id: b, text: "\"Bool\": { \"aws:MultiFactorAuthPresent\": \"true\" }" }
    - { id: c, text: "\"NumericLessThan\": { \"aws:MultiFactorAuthAge\": \"60\" }" }
    - { id: d, text: "\"NumericLessThan\": { \"aws:MultiFactorAuthAge\": \"3600\" }" }
answer: { optionId: d }
explanation:
  correct:
    en: "aws:MultiFactorAuthAge contains the number of seconds since the principal authenticated with MFA, and it is absent when MFA was not used. NumericLessThan 3600 allows the action only during the first hour after MFA authentication, so the statement stops matching later in the 8-hour session while the other statements are unchanged."
    fr: "aws:MultiFactorAuthAge contient le nombre de secondes écoulées depuis l'authentification MFA du principal, et cette clé est absente quand la MFA n'a pas été utilisée. NumericLessThan 3600 n'autorise l'action que pendant la première heure qui suit l'authentification MFA : l'instruction cesse de s'appliquer plus tard dans la session de 8 heures, sans modifier les autres instructions."
  options:
    a:
      en: "BoolIfExists with true checks only whether MFA was used, not when, so the action stays allowed for the whole session."
      fr: "BoolIfExists avec true vérifie seulement si la MFA a été utilisée, pas quand : l'action reste autorisée pendant toute la session."
    b:
      en: "aws:MultiFactorAuthPresent stays true for the whole 8-hour session, so it does not limit the action to the last hour."
      fr: "aws:MultiFactorAuthPresent reste true pendant toute la session de 8 heures : la condition ne limite pas l'action à la dernière heure."
    c:
      en: "The key is expressed in seconds, so 60 limits the action to the first minute after MFA authentication instead of one hour."
      fr: "La clé s'exprime en secondes : 60 limite l'action à la première minute qui suit l'authentification MFA au lieu d'une heure."
references:
  - title: AWS global condition context keys
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
