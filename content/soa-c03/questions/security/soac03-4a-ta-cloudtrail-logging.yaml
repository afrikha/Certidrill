id: soac03-4a-ta-cloudtrail-logging
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The AWS Trusted Advisor AWS CloudTrail Management Event Logging check shows a red status because no trail exists for several Regions. The account has one single-Region trail in us-east-1 that delivers logs to an Amazon S3 bucket without errors. The company wants management events from every Region recorded with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    La vérification AWS Trusted Advisor AWS CloudTrail Management Event Logging affiche un statut rouge car aucun journal de suivi (trail) n'existe pour plusieurs Régions. Le compte dispose d'un journal de suivi à Région unique dans us-east-1 qui livre ses journaux dans un compartiment Amazon S3 sans erreur. L'entreprise veut que les événements de gestion de chaque Région soient enregistrés avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Update the existing trail so that it applies to all Regions.", fr: "Mettre à jour le journal de suivi existant pour qu'il s'applique à toutes les Régions." } }
    - { id: b, text: { en: "Create a single-Region trail in each Region that the check flags.", fr: "Créer un journal de suivi à Région unique dans chaque Région signalée par la vérification." } }
    - { id: c, text: { en: "Rely on CloudTrail Event history, which records management events in every Region.", fr: "S'appuyer sur l'historique des événements CloudTrail, qui enregistre les événements de gestion dans chaque Région." } }
    - { id: d, text: { en: "Enable S3 data events on the existing trail for all buckets.", fr: "Activer les événements de données S3 sur le journal de suivi existant pour tous les compartiments." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The check is red when no trail logs management events for a Region. Converting the existing trail to a multi-Region trail records the management events of all Regions in the same bucket with one trail to manage."
    fr: "La vérification est rouge quand aucun journal de suivi n'enregistre les événements de gestion d'une Région. Transformer le journal de suivi existant en journal multi-Régions enregistre les événements de gestion de toutes les Régions dans le même compartiment, avec un seul journal de suivi à gérer."
  options:
    b:
      en: "Separate trails per Region also work but multiply the trails to configure and maintain."
      fr: "Des journaux de suivi distincts par Région fonctionnent aussi, mais multiplient les journaux à configurer et à maintenir."
    c:
      en: "Event history keeps only 90 days of events and does not count as a trail, so the check stays red."
      fr: "L'historique des événements ne conserve que 90 jours d'événements et ne compte pas comme un journal de suivi : la vérification reste rouge."
    d:
      en: "Data events add object-level activity but do not add Regions to a single-Region trail."
      fr: "Les événements de données ajoutent l'activité au niveau des objets, mais n'ajoutent aucune Région à un journal de suivi à Région unique."
references:
  - title: Security
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
