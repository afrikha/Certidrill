id: soac03-4a-internal-access-table
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores payment records in an Amazon DynamoDB table in a production account that belongs to its organization. The security team must regularly identify which IAM roles and users in any account of the organization can access the table, to confirm that only the payments application role has access.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise stocke des enregistrements de paiement dans une table Amazon DynamoDB d'un compte de production qui appartient à son organisation. L'équipe de sécurité doit identifier régulièrement quels rôles et utilisateurs IAM de n'importe quel compte de l'organisation peuvent accéder à la table, afin de confirmer que seul le rôle de l'application de paiement y a accès.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an IAM Access Analyzer external access analyzer with the organization as the zone of trust.", fr: "Créer un analyseur d'accès externe IAM Access Analyzer dont la zone de confiance est l'organisation." } }
    - { id: b, text: { en: "Create an IAM Access Analyzer internal access analyzer for the organization and select the table as a resource to monitor.", fr: "Créer un analyseur d'accès interne IAM Access Analyzer pour l'organisation et sélectionner la table comme ressource à surveiller." } }
    - { id: c, text: { en: "Run the IAM policy simulator for every role and user of every account with the dynamodb:GetItem action on the table.", fr: "Exécuter le simulateur de politiques IAM pour chaque rôle et utilisateur de chaque compte avec l'action dynamodb:GetItem sur la table." } }
    - { id: d, text: { en: "Create an IAM Access Analyzer unused access analyzer for the organization.", fr: "Créer un analyseur d'accès inutilisés IAM Access Analyzer pour l'organisation." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Internal access analyzers identify which principals inside the organization or account can access selected business-critical resources, such as DynamoDB tables, S3 buckets and RDS snapshots. The findings show whether access is limited to the intended principals without manual analysis."
    fr: "Les analyseurs d'accès interne identifient les principaux de l'organisation ou du compte qui peuvent accéder à des ressources critiques sélectionnées, comme des tables DynamoDB, des compartiments S3 et des instantanés RDS. Les résultats indiquent si l'accès est limité aux principaux prévus, sans analyse manuelle."
  options:
    a:
      en: "An external access analyzer reports only access granted to principals outside the zone of trust, so access from other accounts of the organization is not reported."
      fr: "Un analyseur d'accès externe ne signale que l'accès accordé à des principaux hors de la zone de confiance : l'accès depuis d'autres comptes de l'organisation n'est pas signalé."
    c:
      en: "Simulating every principal in every account is manual, slow and must be repeated after each policy change."
      fr: "Simuler chaque principal de chaque compte est manuel, lent et doit être refait après chaque modification de politique."
    d:
      en: "Unused access analyzers report unused roles, keys, passwords and permissions, not who can access a given resource."
      fr: "Les analyseurs d'accès inutilisés signalent les rôles, clés, mots de passe et autorisations inutilisés, pas qui peut accéder à une ressource donnée."
references:
  - title: Using AWS Identity and Access Management Access Analyzer
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
