id: soac03-4a-org-cpack-region
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security account is the delegated administrator for AWS Config in a company's organization. A CloudOps engineer deployed an organization conformance pack from the security account in the us-east-1 Region. AWS Config recording is turned on in all accounts in us-east-1 and eu-west-1, but resources in eu-west-1 are not evaluated by the conformance pack rules.

    What should the engineer do?
  fr: |
    Le compte de sécurité est l'administrateur délégué d'AWS Config dans l'organisation d'une entreprise. Un ingénieur CloudOps a déployé un pack de conformité (conformance pack) d'organisation depuis le compte de sécurité dans la Région us-east-1. L'enregistrement AWS Config est activé dans tous les comptes dans us-east-1 et eu-west-1, mais les ressources d'eu-west-1 ne sont pas évaluées par les règles du pack de conformité.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Create an organization aggregator in us-east-1 that includes eu-west-1 as a source Region.", fr: "Créer dans us-east-1 un agrégateur d'organisation qui inclut eu-west-1 comme Région source." } }
    - { id: b, text: { en: "Deploy the organization conformance pack from the security account in eu-west-1 as well.", fr: "Déployer aussi le pack de conformité d'organisation depuis le compte de sécurité dans eu-west-1." } }
    - { id: c, text: { en: "Enable trusted access for AWS Config again from the management account.", fr: "Activer à nouveau l'accès approuvé pour AWS Config depuis le compte de gestion." } }
    - { id: d, text: { en: "Add eu-west-1 to the Scope section of each rule in the conformance pack template.", fr: "Ajouter eu-west-1 à la section Scope de chaque règle du modèle de pack de conformité." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The organization conformance pack APIs are Regional: a deployment creates the pack in the member accounts of the Region where the call is made. To evaluate eu-west-1 resources, the engineer deploys the pack again from the delegated administrator account in eu-west-1."
    fr: "Les API des packs de conformité d'organisation sont régionales : un déploiement crée le pack dans les comptes membres de la Région où l'appel est effectué. Pour évaluer les ressources d'eu-west-1, l'ingénieur déploie à nouveau le pack depuis le compte administrateur délégué dans eu-west-1."
  options:
    a:
      en: "Aggregators give a read-only view of data that already exists; they cannot deploy rules to source accounts or Regions."
      fr: "Les agrégateurs offrent une vue en lecture seule de données existantes ; ils ne peuvent pas déployer de règles dans les comptes ou Régions sources."
    c:
      en: "Trusted access already works, because the pack was deployed to the member accounts in us-east-1."
      fr: "L'accès approuvé fonctionne déjà, puisque le pack a été déployé dans les comptes membres dans us-east-1."
    d:
      en: "The Scope of a Config rule selects resource types, tags or resource IDs, not Regions."
      fr: "Le Scope d'une règle Config sélectionne des types de ressources, des balises ou des ID de ressources, pas des Régions."
references:
  - title: Managing Conformance Packs for AWS Config Across all Accounts in Your Organization
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformance-pack-organization-apis.html
