id: soac03-4b-sqs-data-key-reuse
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon SQS queue with SSE-KMS and a customer managed AWS KMS key. Many producers and consumers process millions of messages each day, and the AWS KMS request charges for the queue are high. The data key reuse period of the queue uses its default value. The queue must keep SSE-KMS with the same customer managed key.

    Which solution will reduce the AWS KMS costs MOST?
  fr: |
    Une entreprise utilise une file d'attente Amazon SQS avec SSE-KMS et une clé AWS KMS gérée par le client. De nombreux producteurs et consommateurs traitent des millions de messages chaque jour, et les frais de requêtes AWS KMS de la file sont élevés. La période de réutilisation des clés de données de la file utilise sa valeur par défaut. La file doit conserver SSE-KMS avec la même clé gérée par le client.

    Quelle solution réduit le PLUS les coûts AWS KMS ?
body:
  options:
    - id: a
      text: { en: "Increase the data key reuse period of the queue to 86,400 seconds (24 hours).", fr: "Augmenter la période de réutilisation des clés de données de la file à 86 400 secondes (24 heures)." }
    - id: b
      text: { en: "Change the queue encryption to SSE-SQS with SQS managed encryption keys.", fr: "Changer le chiffrement de la file en SSE-SQS avec des clés de chiffrement gérées par SQS." }
    - id: c
      text: { en: "Decrease the data key reuse period of the queue to 60 seconds.", fr: "Réduire la période de réutilisation des clés de données de la file à 60 secondes." }
    - id: d
      text: { en: "Change the queue key to the AWS managed key for Amazon SQS.", fr: "Changer la clé de la file pour la clé gérée par AWS pour Amazon SQS." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SQS reuses a data key for the data key reuse period, from 60 seconds to 86,400 seconds (default 300). Each principal gets its own data keys, so KMS calls grow with the number of principals and shrink as the period gets longer; the maximum period gives the fewest calls while keeping the same key.
    fr: |
      SQS réutilise une clé de données pendant la période de réutilisation, de 60 à 86 400 secondes (300 par défaut). Chaque principal obtient ses propres clés de données : les appels KMS augmentent avec le nombre de principaux et diminuent quand la période s'allonge ; la période maximale donne le moins d'appels tout en conservant la même clé.
  options:
    b:
      en: |
        SSE-SQS removes the AWS KMS calls, but the queue would no longer use SSE-KMS with the customer managed key.
      fr: |
        SSE-SQS supprime les appels AWS KMS, mais la file n'utiliserait plus SSE-KMS avec la clé gérée par le client.
    c:
      en: |
        A shorter period makes SQS generate data keys more often, which increases the number of KMS requests.
      fr: |
        Une période plus courte oblige SQS à générer des clés de données plus souvent, ce qui augmente le nombre de requêtes KMS.
    d:
      en: |
        The requirement is to keep the same customer managed key, and the AWS managed key still involves KMS requests.
      fr: |
        L'exigence est de conserver la même clé gérée par le client, et la clé gérée par AWS implique toujours des requêtes KMS.
references:
  - title: Encryption at rest in Amazon SQS
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-server-side-encryption.html
  - title: Amazon SQS Key management
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-key-management.html
