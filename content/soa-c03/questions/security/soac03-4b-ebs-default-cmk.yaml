id: soac03-4b-ebs-default-cmk
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company enabled Amazon EBS encryption by default in the eu-west-1 Region. New EBS volumes are now encrypted with the AWS managed key aws/ebs. A new rule requires all new volumes in that Region to be encrypted with the customer managed key alias/ebs-prod, without changing the existing launch templates and scripts.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a activé le chiffrement Amazon EBS par défaut dans la Région eu-west-1. Les nouveaux volumes EBS sont désormais chiffrés avec la clé gérée par AWS aws/ebs. Une nouvelle règle exige que tous les nouveaux volumes de cette Région soient chiffrés avec la clé gérée par le client alias/ebs-prod, sans modifier les modèles de lancement et les scripts existants.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Edit the key policy of aws/ebs so that it uses the key material of alias/ebs-prod.", fr: "Modifier la politique de clé d'aws/ebs pour qu'elle utilise le matériel de clé d'alias/ebs-prod." }
    - id: b
      text: { en: "Run aws ec2 modify-ebs-default-kms-key-id with alias/ebs-prod in eu-west-1.", fr: "Exécuter aws ec2 modify-ebs-default-kms-key-id avec alias/ebs-prod dans eu-west-1." }
    - id: c
      text: { en: "Turn on automatic key rotation for alias/ebs-prod, and disable the aws/ebs key.", fr: "Activer la rotation automatique de la clé alias/ebs-prod, et désactiver la clé aws/ebs." }
    - id: d
      text: { en: "Attach an SCP that denies ec2:CreateVolume when the ec2:Encrypted condition key is false.", fr: "Attacher une SCP qui refuse ec2:CreateVolume lorsque la clé de condition ec2:Encrypted vaut false." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With encryption by default, EBS uses a default KMS key per Region, which is aws/ebs unless you change it. modify-ebs-default-kms-key-id sets a customer managed key as the default, so new volumes are encrypted with it when the request does not specify a key.
    fr: |
      Avec le chiffrement par défaut, EBS utilise une clé KMS par défaut par Région, qui est aws/ebs tant qu'on ne la change pas. modify-ebs-default-kms-key-id définit une clé gérée par le client comme clé par défaut : les nouveaux volumes sont chiffrés avec elle lorsque la requête n'indique pas de clé.
  options:
    a:
      en: |
        The key policy of an AWS managed key cannot be edited, and a key policy does not select key material.
      fr: |
        La politique d'une clé gérée par AWS ne peut pas être modifiée, et une politique de clé ne sélectionne pas de matériel de clé.
    c:
      en: |
        Rotation does not make a key the EBS default, and AWS managed keys cannot be disabled by the customer.
      fr: |
        La rotation ne fait pas d'une clé la clé EBS par défaut, et les clés gérées par AWS ne peuvent pas être désactivées par le client.
    d:
      en: |
        Volumes are already encrypted by default; this condition checks encryption, not which key is used.
      fr: |
        Les volumes sont déjà chiffrés par défaut ; cette condition vérifie le chiffrement, pas la clé utilisée.
references:
  - title: Enable Amazon EBS encryption by default
    url: https://docs.aws.amazon.com/ebs/latest/userguide/encryption-by-default.html
