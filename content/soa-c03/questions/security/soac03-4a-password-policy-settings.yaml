id: soac03-4a-password-policy-settings
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company still uses IAM users for a small operations team that signs in to the AWS Management Console with passwords. A new internal standard lists several password requirements for these users. A CloudOps engineer must implement as many of the requirements as possible by updating the IAM account password policy.

    Which requirements can the account password policy enforce? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise encore des utilisateurs IAM pour une petite équipe d'exploitation qui se connecte à l'AWS Management Console avec des mots de passe. Une nouvelle norme interne liste plusieurs exigences de mot de passe pour ces utilisateurs. Un ingénieur CloudOps doit mettre en œuvre le plus grand nombre possible de ces exigences en mettant à jour la politique de mot de passe du compte IAM.

    Quelles exigences la politique de mot de passe du compte peut-elle appliquer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Prevent users from reusing any of their last 5 passwords.", fr: "Empêcher les utilisateurs de réutiliser l'un de leurs 5 derniers mots de passe." } }
    - { id: b, text: { en: "Lock a user out of the console after 5 consecutive failed sign-in attempts.", fr: "Verrouiller l'accès à la console d'un utilisateur après 5 échecs de connexion consécutifs." } }
    - { id: c, text: { en: "Make passwords expire 90 days after they are set.", fr: "Faire expirer les mots de passe 90 jours après leur définition." } }
    - { id: d, text: { en: "Require an MFA code in addition to the password at every console sign-in.", fr: "Exiger un code MFA en plus du mot de passe à chaque connexion à la console." } }
    - { id: e, text: { en: "Disable the console password of users who have not signed in for 45 days.", fr: "Désactiver le mot de passe de console des utilisateurs qui ne se sont pas connectés depuis 45 jours." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The account password policy sets the minimum length (6 to 128 characters), character types, password expiration (1 to 1,095 days), hard expiry, whether users can change their own password and password reuse prevention (1 to 24 previous passwords). Preventing the reuse of the last 5 passwords and a 90-day expiration are both policy settings."
    fr: "La politique de mot de passe du compte définit la longueur minimale (6 à 128 caractères), les types de caractères, l'expiration des mots de passe (1 à 1 095 jours), l'expiration stricte, la possibilité pour les utilisateurs de changer leur propre mot de passe et la prévention de la réutilisation (1 à 24 mots de passe précédents). Empêcher la réutilisation des 5 derniers mots de passe et une expiration à 90 jours sont deux paramètres de la politique."
  options:
    b:
      en: "IAM does not support a lockout policy after failed sign-in attempts. AWS recommends combining a strong password policy with MFA instead."
      fr: "IAM ne prend pas en charge de politique de verrouillage après des échecs de connexion. AWS recommande plutôt de combiner une politique de mot de passe robuste avec la MFA."
    d:
      en: "MFA is configured with an MFA device on each user and enforced with IAM policies, not with the password policy."
      fr: "La MFA se configure avec un appareil MFA sur chaque utilisateur et s'impose avec des politiques IAM, pas avec la politique de mot de passe."
    e:
      en: "The password policy has no inactivity setting. Unused passwords are found with the credential report or an unused access analyzer and removed separately."
      fr: "La politique de mot de passe n'a pas de paramètre d'inactivité. Les mots de passe inutilisés se repèrent avec le rapport d'informations d'identification ou un analyseur d'accès inutilisés, puis se suppriment séparément."
references:
  - title: Set an account password policy for IAM users
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_account-policy.html
