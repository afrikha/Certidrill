id: soac03-4a-cli-role-no-profile
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A CloudOps engineer creates an IAM role named app-reader with the AWS CLI. The role's trust policy allows the ec2.amazonaws.com service principal, and its permissions policy allows read access to an Amazon S3 bucket. The engineer then runs the following command to give a running instance these permissions, but the command fails because no instance profile named app-reader is found.

    ```bash
    aws ec2 associate-iam-instance-profile \
      --instance-id i-0abc1234def567890 \
      --iam-instance-profile Name=app-reader
    ```

    What should the engineer do to give the instance the permissions of the role?
  fr: |
    Un ingénieur CloudOps crée un rôle IAM nommé app-reader avec l'AWS CLI. La politique d'approbation du rôle autorise le principal de service ec2.amazonaws.com, et sa politique d'autorisations autorise l'accès en lecture à un compartiment (bucket) Amazon S3. L'ingénieur exécute ensuite la commande suivante pour donner ces autorisations à une instance en cours d'exécution, mais la commande échoue car aucun profil d'instance nommé app-reader n'est trouvé.

    ```bash
    aws ec2 associate-iam-instance-profile \
      --instance-id i-0abc1234def567890 \
      --iam-instance-profile Name=app-reader
    ```

    Que doit faire l'ingénieur pour donner à l'instance les autorisations du rôle ?
body:
  options:
    - { id: a, text: { en: "Create an instance profile, add app-reader to it with aws iam add-role-to-instance-profile, then run the command again.", fr: "Créer un profil d'instance, y ajouter app-reader avec aws iam add-role-to-instance-profile, puis exécuter à nouveau la commande." } }
    - { id: b, text: { en: "Add the ARN of the instance as a principal in the role's trust policy, then run the command again with the role ARN.", fr: "Ajouter l'ARN de l'instance comme principal dans la politique d'approbation du rôle, puis exécuter à nouveau la commande avec l'ARN du rôle." } }
    - { id: c, text: { en: "Stop the instance, run the command again while it is stopped, then start the instance.", fr: "Arrêter l'instance, exécuter à nouveau la commande pendant qu'elle est arrêtée, puis démarrer l'instance." } }
    - { id: d, text: { en: "Change the trust policy principal to ssm.amazonaws.com and register the instance as a Systems Manager managed node.", fr: "Remplacer le principal de la politique d'approbation par ssm.amazonaws.com et enregistrer l'instance comme nœud géré Systems Manager." } }
answer: { optionId: a }
explanation:
  correct:
    en: "EC2 attaches an instance profile, a container that holds one IAM role, not the role itself. The console creates an instance profile with the same name when it creates a role for EC2, but the AWS CLI and API do not: the engineer must create the instance profile, add the role to it and then associate it with the instance."
    fr: "EC2 attache un profil d'instance, un conteneur qui contient un rôle IAM, et non le rôle lui-même. La console crée un profil d'instance du même nom lorsqu'elle crée un rôle pour EC2, mais l'AWS CLI et l'API ne le font pas : l'ingénieur doit créer le profil d'instance, y ajouter le rôle, puis l'associer à l'instance."
  options:
    b:
      en: "The trust policy correctly trusts the EC2 service principal. The command expects an instance profile, and an instance ARN is not a valid principal for this purpose."
      fr: "La politique d'approbation approuve correctement le principal de service EC2. La commande attend un profil d'instance, et un ARN d'instance n'est pas un principal valide dans ce cas."
    c:
      en: "An instance profile can be associated with a running instance. Stopping the instance does not create the missing instance profile."
      fr: "Un profil d'instance peut être associé à une instance en cours d'exécution. Arrêter l'instance ne crée pas le profil d'instance manquant."
    d:
      en: "The application credentials come from an instance profile whose role trusts EC2. Changing the principal to Systems Manager would break the role for EC2 and still leave no instance profile."
      fr: "Les informations d'identification de l'application proviennent d'un profil d'instance dont le rôle approuve EC2. Remplacer le principal par Systems Manager rendrait le rôle inutilisable pour EC2 et ne créerait toujours pas de profil d'instance."
references:
  - title: Use instance profiles
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
