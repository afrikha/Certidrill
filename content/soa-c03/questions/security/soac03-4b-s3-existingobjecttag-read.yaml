id: soac03-4b-s3-existingobjecttag-read
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores reports in an Amazon S3 bucket named reports-archive. Each object carries a classification object tag with the value public, internal, or confidential. Some older objects have no tag. An IAM role named AnalystRole must be able to download only the objects whose classification tag is internal. The role has no other S3 permissions.

    Which statement should the company add to the identity-based policy of AnalystRole?
  fr: |
    Une entreprise stocke des rapports dans un compartiment Amazon S3 nommé reports-archive. Chaque objet porte une balise d'objet classification avec la valeur public, internal ou confidential. Certains objets plus anciens n'ont pas de balise. Un rôle IAM nommé AnalystRole doit pouvoir télécharger uniquement les objets dont la balise classification vaut internal. Le rôle n'a aucune autre autorisation S3.

    Quelle instruction l'entreprise doit-elle ajouter à la politique basée sur l'identité d'AnalystRole ?
body:
  options:
    - id: a
      text: { en: "Allow s3:GetObject on arn:aws:s3:::reports-archive/* with a StringEquals condition on s3:RequestObjectTag/classification set to internal.", fr: "Autoriser s3:GetObject sur arn:aws:s3:::reports-archive/* avec une condition StringEquals sur s3:RequestObjectTag/classification égale à internal." }
    - id: b
      text: { en: "Allow s3:GetObject on arn:aws:s3:::reports-archive/* with a ForAnyValue:StringEquals condition on s3:RequestObjectTagKeys set to classification.", fr: "Autoriser s3:GetObject sur arn:aws:s3:::reports-archive/* avec une condition ForAnyValue:StringEquals sur s3:RequestObjectTagKeys égale à classification." }
    - id: c
      text: { en: "Allow s3:GetObject on arn:aws:s3:::reports-archive/* with a StringEquals condition on s3:ExistingObjectTag/classification set to internal.", fr: "Autoriser s3:GetObject sur arn:aws:s3:::reports-archive/* avec une condition StringEquals sur s3:ExistingObjectTag/classification égale à internal." }
    - id: d
      text: { en: "Allow s3:GetObject on arn:aws:s3:::reports-archive/*, and add a Deny for objects whose s3:ExistingObjectTag/classification is confidential.", fr: "Autoriser s3:GetObject sur arn:aws:s3:::reports-archive/*, et ajouter un Deny pour les objets dont s3:ExistingObjectTag/classification vaut confidential." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The s3:ExistingObjectTag/<tag-key> condition key checks a tag that the object already has. Allowing s3:GetObject only when s3:ExistingObjectTag/classification equals internal lets the role read internal objects and nothing else: public, confidential and untagged objects are implicitly denied.
    fr: |
      La clé de condition s3:ExistingObjectTag/<clé> vérifie une balise que l'objet possède déjà. Autoriser s3:GetObject uniquement lorsque s3:ExistingObjectTag/classification vaut internal permet au rôle de lire les objets internal et rien d'autre : les objets public, confidential et sans balise sont implicitement refusés.
  options:
    a:
      en: |
        s3:RequestObjectTag checks tags sent in a request that adds tags, such as PutObject or PutObjectTagging; a GetObject request carries no tags, so the condition never matches.
      fr: |
        s3:RequestObjectTag vérifie les balises envoyées dans une requête qui ajoute des balises, comme PutObject ou PutObjectTagging ; une requête GetObject ne transporte pas de balise, donc la condition ne correspond jamais.
    b:
      en: |
        s3:RequestObjectTagKeys restricts the tag keys of tagging requests; it does not check the tags of the object being read.
      fr: |
        s3:RequestObjectTagKeys restreint les clés de balise des requêtes de balisage ; elle ne vérifie pas les balises de l'objet lu.
    d:
      en: |
        This blocks confidential objects but still allows public and untagged objects, so the role could read more than the internal objects.
      fr: |
        Cela bloque les objets confidential mais autorise encore les objets public et sans balise : le rôle pourrait lire plus que les objets internal.
references:
  - title: Tagging and access control policies
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/tagging-and-policies.html
