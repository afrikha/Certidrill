id: soac03-4b-alb-cfn-default-policy
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deployed an Application Load Balancer with the following AWS CloudFormation resource. A security scan reports that the listener accepts TLS 1.0 and TLS 1.1 connections. The listener must accept only TLS 1.2 and TLS 1.3, and clients that support only TLS 1.2 must keep working.

    ```yaml
    HttpsListener:
      Type: AWS::ElasticLoadBalancingV2::Listener
      Properties:
        LoadBalancerArn: !Ref WebAlb
        Port: 443
        Protocol: HTTPS
        Certificates:
          - CertificateArn: !Ref WebCertificate
        DefaultActions:
          - Type: forward
            TargetGroupArn: !Ref WebTargets
    ```

    Which change to the template will meet these requirements?
  fr: |
    Une entreprise a déployé un Application Load Balancer avec la ressource AWS CloudFormation suivante. Une analyse de sécurité signale que l'écouteur accepte les connexions TLS 1.0 et TLS 1.1. L'écouteur ne doit accepter que TLS 1.2 et TLS 1.3, et les clients qui ne prennent en charge que TLS 1.2 doivent continuer à fonctionner.

    ```yaml
    HttpsListener:
      Type: AWS::ElasticLoadBalancingV2::Listener
      Properties:
        LoadBalancerArn: !Ref WebAlb
        Port: 443
        Protocol: HTTPS
        Certificates:
          - CertificateArn: !Ref WebCertificate
        DefaultActions:
          - Type: forward
            TargetGroupArn: !Ref WebTargets
    ```

    Quelle modification du modèle répond à ces exigences ?
body:
  options:
    - id: a
      text: "SslPolicy: ELBSecurityPolicy-2016-08"
    - id: b
      text: "SslPolicy: ELBSecurityPolicy-TLS13-1-3-2021-06"
    - id: c
      text: "SslPolicy: ELBSecurityPolicy-TLS13-1-0-2021-06"
    - id: d
      text: "SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09"
answer: { optionId: d }
explanation:
  correct:
    en: |
      When an HTTPS listener is created with CloudFormation, the CLI or the CDK without a security policy, it uses ELBSecurityPolicy-2016-08, which still allows TLS 1.0 and 1.1 (the console default is ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09). The TLS13-1-2 policies negotiate TLS 1.3 and TLS 1.2 only, and the Res-PQ policy is the one AWS recommends for backward compatibility with TLS 1.2 clients.
    fr: |
      Lorsqu'un écouteur HTTPS est créé avec CloudFormation, la CLI ou le CDK sans politique de sécurité, il utilise ELBSecurityPolicy-2016-08, qui autorise encore TLS 1.0 et 1.1 (la valeur par défaut de la console est ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09). Les politiques TLS13-1-2 ne négocient que TLS 1.3 et TLS 1.2, et la politique Res-PQ est celle qu'AWS recommande pour rester compatible avec les clients TLS 1.2.
  options:
    a:
      en: |
        ELBSecurityPolicy-2016-08 is the policy that the listener already uses by default, and it allows TLS 1.0 and TLS 1.1.
      fr: |
        ELBSecurityPolicy-2016-08 est la politique que l'écouteur utilise déjà par défaut, et elle autorise TLS 1.0 et TLS 1.1.
    b:
      en: |
        This policy supports only TLS 1.3, so clients limited to TLS 1.2 could no longer connect.
      fr: |
        Cette politique ne prend en charge que TLS 1.3 : les clients limités à TLS 1.2 ne pourraient plus se connecter.
    c:
      en: |
        The TLS13-1-0 policy keeps TLS 1.0 and 1.1 for legacy clients, so the scan finding would remain.
      fr: |
        La politique TLS13-1-0 conserve TLS 1.0 et 1.1 pour les anciens clients : le constat de l'analyse resterait.
references:
  - title: Security policies for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
