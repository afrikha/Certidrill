id: soac03-4b-macie-job-bucket-criteria
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company tags its Amazon S3 buckets with DataClassification=Restricted when they hold regulated data. Teams create new restricted buckets every week. The company uses Amazon Macie and must analyze the restricted buckets for sensitive data once a week. New restricted buckets must be included automatically, without editing or recreating anything, and buckets without the tag must not be analyzed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise balise ses compartiments Amazon S3 avec DataClassification=Restricted lorsqu'ils contiennent des données réglementées. Les équipes créent de nouveaux compartiments restreints chaque semaine. L'entreprise utilise Amazon Macie et doit analyser une fois par semaine les compartiments restreints à la recherche de données sensibles. Les nouveaux compartiments restreints doivent être inclus automatiquement, sans rien modifier ni recréer, et les compartiments sans la balise ne doivent pas être analysés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a weekly job that includes all buckets, with S3 object criteria that include only objects tagged DataClassification=Restricted.", fr: "Créer une tâche hebdomadaire qui inclut tous les compartiments, avec des critères d'objets S3 qui n'incluent que les objets balisés DataClassification=Restricted." }
    - id: b
      text: { en: "Create a weekly job for a fixed list of the restricted buckets, and create a new job each time a restricted bucket is added.", fr: "Créer une tâche hebdomadaire pour une liste fixe de compartiments restreints, et créer une nouvelle tâche chaque fois qu'un compartiment restreint est ajouté." }
    - id: c
      text: { en: "Create a one-time job with bucket criteria on the DataClassification=Restricted tag, and copy the job every week.", fr: "Créer une tâche unique avec des critères de compartiment sur la balise DataClassification=Restricted, et copier la tâche chaque semaine." }
    - id: d
      text: { en: "Create a weekly job whose runtime bucket criteria include buckets that have the tag key DataClassification with the value Restricted.", fr: "Créer une tâche hebdomadaire dont les critères de compartiment d'exécution incluent les compartiments qui ont la clé de balise DataClassification avec la valeur Restricted." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Bucket criteria are evaluated each time a periodic job runs: Macie identifies the buckets that match the conditions, such as a tag key and value, and analyzes their objects. New buckets that get the tag are picked up at the next run, and buckets without the tag are skipped.
    fr: |
      Les critères de compartiment sont évalués à chaque exécution d'une tâche périodique : Macie identifie les compartiments qui correspondent aux conditions, comme une clé et une valeur de balise, puis analyse leurs objets. Les nouveaux compartiments qui reçoivent la balise sont pris en compte à l'exécution suivante, et ceux sans la balise sont ignorés.
  options:
    a:
      en: |
        The tag is on the buckets, not on the objects, so object criteria on that tag would match nothing; the job would also scan the metadata of every bucket.
      fr: |
        La balise est sur les compartiments, pas sur les objets : des critères d'objets sur cette balise ne correspondraient à rien, et la tâche parcourrait aussi les métadonnées de tous les compartiments.
    b:
      en: |
        A fixed bucket list does not change by itself, so a new job is needed for every new bucket, which the requirements forbid.
      fr: |
        Une liste fixe de compartiments ne change pas d'elle-même : une nouvelle tâche est nécessaire pour chaque nouveau compartiment, ce que les exigences interdisent.
    c:
      en: |
        Copying a one-time job every week is a manual task; a periodic job runs on its schedule without intervention.
      fr: |
        Copier une tâche unique chaque semaine est une tâche manuelle ; une tâche périodique s'exécute selon sa planification sans intervention.
references:
  - title: Scope options for sensitive data discovery jobs
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-jobs-scope.html
