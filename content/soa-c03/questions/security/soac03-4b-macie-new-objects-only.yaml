id: soac03-4b-macie-new-objects-only
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Last month, a company ran a one-time Amazon Macie sensitive data discovery job that analyzed every object in a large Amazon S3 bucket. The company now needs a daily analysis of the same bucket that covers only the objects created or changed from now on. Already analyzed objects must not be analyzed again, to control cost.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Le mois dernier, une entreprise a exécuté une tâche unique de découverte de données sensibles Amazon Macie qui a analysé tous les objets d'un grand compartiment Amazon S3. L'entreprise a maintenant besoin d'une analyse quotidienne du même compartiment qui ne couvre que les objets créés ou modifiés à partir de maintenant. Les objets déjà analysés ne doivent pas être analysés de nouveau, pour maîtriser les coûts.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Create a daily job with a sampling depth of 10 percent so that only a small share of the objects is analyzed each day.", fr: "Créer une tâche quotidienne avec une profondeur d'échantillonnage de 10 % afin que seule une petite part des objets soit analysée chaque jour." }
    - id: b
      text: { en: "Enable automated sensitive data discovery for the account, and keep the bucket in its scope.", fr: "Activer la découverte automatisée des données sensibles pour le compte, et laisser le compartiment dans son périmètre." }
    - id: c
      text: { en: "Create a new one-time job every day with a last-modified object criterion set to the previous day.", fr: "Créer chaque jour une nouvelle tâche unique avec un critère d'objet sur la date de dernière modification fixé à la veille." }
    - id: d
      text: { en: "Create a daily periodic job for the bucket, and clear the option to include existing objects.", fr: "Créer une tâche périodique quotidienne pour le compartiment, et décocher l'option d'inclusion des objets existants." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When the option to include existing objects is cleared, the first run of a periodic job analyzes only the objects created or changed after the job was created. Each later run analyzes only the objects created or changed after the preceding run, so nothing is analyzed twice.
    fr: |
      Lorsque l'option d'inclusion des objets existants est décochée, la première exécution d'une tâche périodique n'analyse que les objets créés ou modifiés après la création de la tâche. Chaque exécution suivante n'analyse que les objets créés ou modifiés après l'exécution précédente : rien n'est analysé deux fois.
  options:
    a:
      en: |
        Sampling depth picks a random percentage of the eligible objects, which still includes existing objects and can miss new ones.
      fr: |
        La profondeur d'échantillonnage choisit au hasard un pourcentage des objets éligibles, ce qui inclut encore des objets existants et peut manquer des nouveaux.
    b:
      en: |
        Automated discovery samples objects across the whole bucket over time; it does not restrict the analysis to new or changed objects.
      fr: |
        La découverte automatisée échantillonne au fil du temps des objets de tout le compartiment ; elle ne limite pas l'analyse aux objets nouveaux ou modifiés.
    c:
      en: |
        This can work, but creating a job every day is manual effort that a periodic job already handles.
      fr: |
        Cela peut fonctionner, mais créer une tâche chaque jour représente un effort manuel qu'une tâche périodique prend déjà en charge.
references:
  - title: Scope options for sensitive data discovery jobs
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-jobs-scope.html
