id: soac03-4b-guardduty-revoke-role-sessions
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon GuardDuty reports an UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS finding for the IAM role WebAppRole, which is attached to a fleet of Amazon EC2 instances. The investigation confirms that the activity is not expected: temporary credentials of the role are being used from a host outside AWS. The stolen credentials must stop working immediately, and the role must remain usable for new sessions.

    Which action will meet these requirements?
  fr: |
    Amazon GuardDuty signale un résultat UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS pour le rôle IAM WebAppRole, attaché à une flotte d'instances Amazon EC2. L'enquête confirme que l'activité n'est pas attendue : des informations d'identification temporaires du rôle sont utilisées depuis un hôte situé hors d'AWS. Les informations d'identification volées doivent cesser de fonctionner immédiatement, et le rôle doit rester utilisable pour de nouvelles sessions.

    Quelle action répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deactivate the access keys of WebAppRole in the IAM console, and create new access keys for the role.", fr: "Désactiver les clés d'accès de WebAppRole dans la console IAM, et créer de nouvelles clés d'accès pour le rôle." }
    - id: b
      text: { en: "Revoke the active sessions of WebAppRole so that all credentials issued before the revocation time are denied.", fr: "Révoquer les sessions actives de WebAppRole afin que toutes les informations d'identification émises avant l'heure de révocation soient refusées." }
    - id: c
      text: { en: "Create a suppression rule for the finding type with the external IP address as the API caller criterion.", fr: "Créer une règle de suppression pour ce type de résultat avec l'adresse IP externe comme critère d'appelant de l'API." }
    - id: d
      text: { en: "Reduce the maximum session duration of WebAppRole to 1 hour.", fr: "Réduire la durée maximale de session de WebAppRole à 1 heure." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Revoke active sessions attaches the AWSRevokeOlderSessions inline policy to the role, which uses aws:TokenIssueTime to deny all temporary credentials issued before the revocation time. Sessions created afterward are not affected, so the instances and other users continue after they obtain new credentials.
    fr: |
      La révocation des sessions actives attache au rôle la politique en ligne AWSRevokeOlderSessions, qui utilise aws:TokenIssueTime pour refuser toutes les informations d'identification temporaires émises avant l'heure de révocation. Les sessions créées ensuite ne sont pas affectées : les instances et les autres utilisateurs continuent après avoir obtenu de nouvelles informations d'identification.
  options:
    a:
      en: |
        Roles have no long-term access keys; their temporary credentials (ASIA keys) cannot be viewed or deactivated in the console.
      fr: |
        Les rôles n'ont pas de clés d'accès à long terme ; leurs informations d'identification temporaires (clés ASIA) ne peuvent être ni consultées ni désactivées dans la console.
    c:
      en: |
        Suppression rules are for expected activity; here they would hide an active compromise and leave the credentials valid.
      fr: |
        Les règles de suppression conviennent à une activité attendue ; ici, elles masqueraient une compromission active et laisseraient les informations d'identification valides.
    d:
      en: |
        The maximum session duration applies to sessions requested later; credentials already issued stay valid until they expire.
      fr: |
        La durée maximale de session s'applique aux sessions demandées ensuite ; les informations d'identification déjà émises restent valides jusqu'à leur expiration.
references:
