id: soac03-4b-securityhub-home-region
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company enabled AWS Security Hub CSPM in four AWS Regions. The security team wants to view the findings, control compliance statuses, and security scores of all four Regions from the console of one Region, and to update findings there.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a activé AWS Security Hub CSPM dans quatre Régions AWS. L'équipe de sécurité veut consulter les résultats, les états de conformité des contrôles et les scores de sécurité des quatre Régions depuis la console d'une seule Région, et y mettre à jour les résultats.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure cross-Region aggregation with one Region as the home Region and the other three Regions as linked Regions.", fr: "Configurer l'agrégation entre Régions avec une Région comme Région d'origine et les trois autres comme Régions liées." }
    - id: b
      text: { en: "Create an organization trail in AWS CloudTrail, and query the trail with Amazon Athena from one Region.", fr: "Créer un journal de suivi d'organisation dans AWS CloudTrail, et l'interroger avec Amazon Athena depuis une Région." }
    - id: c
      text: { en: "Disable Security Hub CSPM in three Regions, and keep it enabled only in the Region that the team uses.", fr: "Désactiver Security Hub CSPM dans trois Régions, et ne le laisser activé que dans la Région utilisée par l'équipe." }
    - id: d
      text: { en: "Create a custom insight in each Region, and share the insights with the security team's Region.", fr: "Créer une analyse personnalisée (insight) dans chaque Région, et partager les analyses avec la Région de l'équipe de sécurité." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Cross-Region aggregation replicates findings, finding updates, insights, control compliance statuses and security scores from linked Regions to the home Region (formerly the aggregation Region). Updates made in the home Region are replicated back to the linked Regions.
    fr: |
      L'agrégation entre Régions réplique les résultats, leurs mises à jour, les analyses, les états de conformité des contrôles et les scores de sécurité des Régions liées vers la Région d'origine (anciennement Région d'agrégation). Les mises à jour faites dans la Région d'origine sont répliquées vers les Régions liées.
  options:
    b:
      en: |
        CloudTrail records API activity; it does not contain Security Hub CSPM findings or security scores.
      fr: |
        CloudTrail enregistre l'activité des API ; il ne contient ni les résultats ni les scores de sécurité de Security Hub CSPM.
    c:
      en: |
        Security Hub CSPM receives and processes findings only in the Regions where it is enabled, so the other Regions would no longer be covered.
      fr: |
        Security Hub CSPM ne reçoit et ne traite les résultats que dans les Régions où il est activé : les autres Régions ne seraient plus couvertes.
    d:
      en: |
        Insights summarize findings within a Region; they are not shared between Regions.
      fr: |
        Les analyses résument les résultats au sein d'une Région ; elles ne sont pas partagées entre Régions.
references:
  - title: Understanding cross-Region aggregation in Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/finding-aggregation.html
