id: soac03-4b-macie-results-repository
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses Amazon Macie to classify the data in its Amazon S3 buckets. Auditors require an analysis record for every object that Macie analyzes, including objects in which Macie found no sensitive data, and the records must be kept for 1 year.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise Amazon Macie pour classer les données de ses compartiments Amazon S3. Les auditeurs exigent un enregistrement d'analyse pour chaque objet analysé par Macie, y compris les objets dans lesquels Macie n'a trouvé aucune donnée sensible, et ces enregistrements doivent être conservés 1 an.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure a repository for sensitive data discovery results that uses an S3 bucket and a customer managed AWS KMS key.", fr: "Configurer un référentiel pour les résultats de découverte de données sensibles qui utilise un compartiment S3 et une clé AWS KMS gérée par le client." }
    - id: b
      text: { en: "Create an Amazon EventBridge rule for Macie findings that sends them to an Amazon Data Firehose stream that writes to S3.", fr: "Créer une règle Amazon EventBridge pour les résultats Macie qui les envoie vers un flux Amazon Data Firehose qui écrit dans S3." }
    - id: c
      text: { en: "Enable the Macie integration with AWS Security Hub CSPM, and keep the findings in Security Hub CSPM.", fr: "Activer l'intégration de Macie avec AWS Security Hub CSPM, et conserver les résultats dans Security Hub CSPM." }
    - id: d
      text: { en: "Enable automated sensitive data discovery, and save the sensitivity score of each bucket in a report every quarter.", fr: "Activer la découverte automatisée des données sensibles, et enregistrer chaque trimestre le score de sensibilité de chaque compartiment dans un rapport." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Macie creates a sensitive data discovery result for each object in scope, including objects with no sensitive data and objects it could not analyze. It keeps these results for only 90 days and does not show them in the console, so long-term retention requires a repository: an S3 bucket and a customer managed symmetric KMS key that Macie uses to encrypt the results.
    fr: |
      Macie crée un résultat de découverte de données sensibles pour chaque objet du périmètre, y compris les objets sans donnée sensible et ceux qu'il n'a pas pu analyser. Il ne conserve ces résultats que 90 jours et ne les affiche pas dans la console : une conservation longue exige un référentiel, à savoir un compartiment S3 et une clé KMS symétrique gérée par le client que Macie utilise pour chiffrer les résultats.
  options:
    b:
      en: |
        Findings exist only for objects in which Macie detected sensitive data, so objects without sensitive data would have no record.
      fr: |
        Les résultats (findings) n'existent que pour les objets dans lesquels Macie a détecté des données sensibles : les objets sans donnée sensible n'auraient aucun enregistrement.
    c:
      en: |
        Security Hub CSPM receives findings, not an analysis record for every object, so the objects without sensitive data are still missing.
      fr: |
        Security Hub CSPM reçoit des résultats, pas un enregistrement d'analyse par objet : les objets sans donnée sensible manquent toujours.
    d:
      en: |
        Bucket sensitivity scores summarize each bucket; they are not an analysis record for each object, and saving them is a manual task.
      fr: |
        Les scores de sensibilité résument chaque compartiment ; ce ne sont pas des enregistrements d'analyse par objet, et leur sauvegarde est une tâche manuelle.
references:
  - title: Storing and retaining sensitive data discovery results
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-results-repository-s3.html
