id: soac03-4a-ta-exclude-item
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The AWS Trusted Advisor Security Groups – Unrestricted Access check flags a security group that allows UDP port 1194 from 0.0.0.0/0. The security group protects a VPN appliance that must accept connections from any IP address. The security team has approved this rule and wants the check to stop reporting this security group while it keeps evaluating all other security groups.

    What should the CloudOps engineer do?
  fr: |
    La vérification AWS Trusted Advisor Security Groups – Unrestricted Access signale un groupe de sécurité qui autorise le port UDP 1194 depuis 0.0.0.0/0. Ce groupe de sécurité protège une appliance VPN qui doit accepter des connexions depuis n'importe quelle adresse IP. L'équipe de sécurité a approuvé cette règle et veut que la vérification cesse de signaler ce groupe de sécurité tout en continuant à évaluer tous les autres.

    Que doit faire l'ingénieur CloudOps ?
body:
  options:
    - { id: a, text: { en: "Restrict the rule to the company's office IP ranges and refresh the check.", fr: "Restreindre la règle aux plages IP des bureaux de l'entreprise et actualiser la vérification." } }
    - { id: b, text: { en: "Change the Trusted Advisor notification preferences so that the weekly email does not include the Security category.", fr: "Modifier les préférences de notification de Trusted Advisor pour que l'e-mail hebdomadaire n'inclue pas la catégorie Security." } }
    - { id: c, text: { en: "Add a description that explains the exception to the inbound rule, then refresh the check.", fr: "Ajouter à la règle entrante une description qui explique l'exception, puis actualiser la vérification." } }
    - { id: d, text: { en: "Select the security group in the check results and choose Exclude & Refresh.", fr: "Sélectionner le groupe de sécurité dans les résultats de la vérification et choisir Exclude & Refresh." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Exclude & Refresh removes the selected item from the check results while the check keeps evaluating every other resource. Excluded items stay visible in the Excluded items list and can be included again later with Include & Refresh."
    fr: "Exclude & Refresh retire l'élément sélectionné des résultats de la vérification, qui continue d'évaluer toutes les autres ressources. Les éléments exclus restent visibles dans la liste Excluded items et peuvent être réintégrés plus tard avec Include & Refresh."
  options:
    a:
      en: "Restricting the source breaks the requirement that the VPN appliance accept connections from any IP address."
      fr: "Restreindre la source enfreint l'exigence selon laquelle l'appliance VPN accepte des connexions depuis n'importe quelle adresse IP."
    b:
      en: "Notification preferences control the weekly email; the check would still report the security group, and other security findings would be hidden from the email."
      fr: "Les préférences de notification contrôlent l'e-mail hebdomadaire ; la vérification signalerait toujours le groupe de sécurité, et d'autres résultats de sécurité disparaîtraient de l'e-mail."
    c:
      en: "Rule descriptions are not evaluated by the check, so the security group stays flagged."
      fr: "Les descriptions de règles ne sont pas évaluées par la vérification : le groupe de sécurité reste signalé."
references:
  - title: Get started with Trusted Advisor Recommendations
    url: https://docs.aws.amazon.com/awssupport/latest/user/get-started-with-aws-trusted-advisor.html
