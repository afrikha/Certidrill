id: soac03-4a-ram-org-sharing
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A networking account shares Amazon Route 53 Resolver forwarding rules with AWS RAM. Today the rules are shared with each member account by account ID, and an administrator of every account must accept a resource share invitation. The company wants all current and future accounts of the Workloads OU to receive the rules automatically, without invitations.

    Which solution will meet these requirements?
  fr: |
    Un compte réseau partage des règles de transfert Amazon Route 53 Resolver avec AWS RAM. Actuellement, les règles sont partagées avec chaque compte membre par ID de compte, et un administrateur de chaque compte doit accepter une invitation de partage de ressources. L'entreprise veut que tous les comptes actuels et futurs de l'unité d'organisation Workloads reçoivent automatiquement les règles, sans invitation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "From the management account, run aws organizations enable-aws-service-access for ram.amazonaws.com, then share the rules with the Workloads OU.", fr: "Depuis le compte de gestion, exécuter aws organizations enable-aws-service-access pour ram.amazonaws.com, puis partager les règles avec l'unité d'organisation Workloads." } }
    - { id: b, text: { en: "In the networking account, set allowExternalPrincipals to true on the resource share, then add the Workloads OU to the share.", fr: "Dans le compte réseau, définir allowExternalPrincipals sur true pour le partage de ressources, puis ajouter l'unité d'organisation Workloads au partage." } }
    - { id: c, text: { en: "From the management account, run aws ram enable-sharing-with-aws-organization, then share the rules with the Workloads OU.", fr: "Depuis le compte de gestion, exécuter aws ram enable-sharing-with-aws-organization, puis partager les règles avec l'unité d'organisation Workloads." } }
    - { id: d, text: { en: "Create an EventBridge rule in each account that runs aws ram accept-resource-share-invitation when an invitation arrives.", fr: "Créer dans chaque compte une règle EventBridge qui exécute aws ram accept-resource-share-invitation à l'arrivée d'une invitation." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Running enable-sharing-with-aws-organization from the management account (or using the AWS RAM console) enables sharing within the organization and creates the service-linked role that AWS RAM needs. Principals of the organization then get shared resources without invitations, and a share with an OU covers every account in the OU and its child OUs, including accounts added later."
    fr: "Exécuter enable-sharing-with-aws-organization depuis le compte de gestion (ou utiliser la console AWS RAM) active le partage au sein de l'organisation et crée le rôle lié à un service dont AWS RAM a besoin. Les principaux de l'organisation reçoivent alors les ressources partagées sans invitation, et un partage avec une unité d'organisation couvre chaque compte de cette unité et de ses unités enfants, y compris les comptes ajoutés plus tard."
  options:
    a:
      en: "Enabling trusted access through Organizations does not create the AWS RAM service-linked role, so sharing within the organization cannot be used; AWS RAM must enable it itself."
      fr: "Activer l'accès approuvé via Organizations ne crée pas le rôle lié à un service d'AWS RAM : le partage au sein de l'organisation reste inutilisable ; c'est AWS RAM qui doit l'activer."
    b:
      en: "allowExternalPrincipals controls sharing with accounts outside the organization, which uses invitations; sharing with an OU requires sharing with AWS Organizations to be enabled."
      fr: "allowExternalPrincipals contrôle le partage avec des comptes hors de l'organisation, qui passe par des invitations ; le partage avec une unité d'organisation exige l'activation du partage avec AWS Organizations."
    d:
      en: "Automating acceptance in each account adds work for every new account and still relies on per-account shares and invitations."
      fr: "Automatiser l'acceptation dans chaque compte ajoute du travail pour chaque nouveau compte et repose toujours sur des partages par compte et des invitations."
references:
  - title: Sharing your AWS resources
    url: https://docs.aws.amazon.com/ram/latest/userguide/getting-started-sharing.html
