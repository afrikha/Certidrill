id: soac03-4a-idc-delegated-mgmt
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company registered its security account as the delegated administrator for IAM Identity Center to reduce the use of the management account. A security engineer in the security account successfully updates the permission sets that are assigned to member accounts. When the engineer tries to update ManagementAdmin, a permission set that is provisioned in the management account, the change is refused.

    What should the company do to update ManagementAdmin?
  fr: |
    Une entreprise a enregistré son compte de sécurité comme administrateur délégué d'IAM Identity Center pour réduire l'utilisation du compte de gestion. Un ingénieur sécurité du compte de sécurité met à jour avec succès les jeux d'autorisations affectés aux comptes membres. Lorsque l'ingénieur tente de mettre à jour ManagementAdmin, un jeu d'autorisations provisionné dans le compte de gestion, la modification est refusée.

    Que doit faire l'entreprise pour mettre à jour ManagementAdmin ?
body:
  options:
    - { id: a, text: { en: "Attach an SCP to the security account that allows the sso:UpdatePermissionSet action on ManagementAdmin.", fr: "Attacher au compte de sécurité une SCP qui autorise l'action sso:UpdatePermissionSet sur ManagementAdmin." } }
    - { id: b, text: { en: "Move the IAM Identity Center instance from the management account to the security account.", fr: "Déplacer l'instance IAM Identity Center du compte de gestion vers le compte de sécurité." } }
    - { id: c, text: { en: "Add the AdministratorAccess managed policy to the permission set that the engineer uses in the security account.", fr: "Ajouter la politique gérée AdministratorAccess au jeu d'autorisations que l'ingénieur utilise dans le compte de sécurité." } }
    - { id: d, text: { en: "Have an IAM Identity Center administrator in the management account make the change to ManagementAdmin.", fr: "Faire effectuer la modification de ManagementAdmin par un administrateur IAM Identity Center du compte de gestion." } }
answer: { optionId: d }
explanation:
  correct:
    en: "For security reasons, a permission set that is used for access to the management account can be modified only by an IAM Identity Center administrator in the management account. The delegated administrator can manage permission sets for member accounts but cannot alter those provisioned in the management account."
    fr: "Pour des raisons de sécurité, un jeu d'autorisations utilisé pour accéder au compte de gestion ne peut être modifié que par un administrateur IAM Identity Center du compte de gestion. L'administrateur délégué peut gérer les jeux d'autorisations des comptes membres, mais pas ceux provisionnés dans le compte de gestion."
  options:
    a:
      en: "SCPs never grant permissions, and the restriction is built into the delegated administration model, not caused by a missing permission."
      fr: "Les SCP n'accordent jamais d'autorisations, et la restriction est inhérente au modèle d'administration déléguée ; elle ne vient pas d'une autorisation manquante."
    b:
      en: "The IAM Identity Center organization instance always resides in the management account; only its administration can be delegated."
      fr: "L'instance d'organisation IAM Identity Center réside toujours dans le compte de gestion ; seule son administration peut être déléguée."
    c:
      en: "More permissions in the security account do not lift the rule that only the management account can modify permission sets provisioned there."
      fr: "Plus d'autorisations dans le compte de sécurité ne lèvent pas la règle selon laquelle seul le compte de gestion peut modifier les jeux d'autorisations qui y sont provisionnés."
references:
  - title: Delegated administration
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/delegated-admin.html
