id: soac03-4b-session-manager-kms
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Administrators connect to Amazon EC2 instances with AWS Systems Manager Session Manager. To add a layer of encryption to the session data on top of TLS, an engineer enabled KMS encryption in the Session Manager preferences with a customer managed key. The administrators' IAM policies allow them to use the key. Since the change, sessions to the instances fail to start. The instance profile has a custom policy with the required ssm and ssmmessages permissions.

    Which solution will resolve the issue?
  fr: |
    Des administrateurs se connectent à des instances Amazon EC2 avec AWS Systems Manager Session Manager. Pour ajouter une couche de chiffrement aux données de session en plus de TLS, un ingénieur a activé le chiffrement KMS dans les préférences de Session Manager avec une clé gérée par le client. Les politiques IAM des administrateurs les autorisent à utiliser la clé. Depuis la modification, les sessions vers les instances ne démarrent plus. Le profil d'instance possède une politique personnalisée avec les autorisations ssm et ssmmessages nécessaires.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add an inbound rule for port 443 from the administrators' IP addresses to the instances' security group.", fr: "Ajouter au groupe de sécurité des instances une règle entrante pour le port 443 depuis les adresses IP des administrateurs." }
    - id: b
      text: { en: "Add s3:GetEncryptionConfiguration to the instance profile, and enable S3 logging of the sessions.", fr: "Ajouter s3:GetEncryptionConfiguration au profil d'instance, et activer la journalisation des sessions dans S3." }
    - id: c
      text: { en: "Add kms:Decrypt on the customer managed key to the IAM role of the instance profile.", fr: "Ajouter kms:Decrypt sur la clé gérée par le client au rôle IAM du profil d'instance." }
    - id: d
      text: { en: "Replace the customer managed key with the AWS managed key aws/ssm in the Session Manager preferences.", fr: "Remplacer la clé gérée par le client par la clé gérée par AWS aws/ssm dans les préférences de Session Manager." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When KMS encryption of session data is turned on, both the users who start sessions and the managed nodes they connect to need permission to use the key. The documented instance profile policy adds kms:Decrypt on the key next to the ssmmessages permissions.
    fr: |
      Lorsque le chiffrement KMS des données de session est activé, les utilisateurs qui démarrent les sessions et les nœuds gérés auxquels ils se connectent ont besoin de l'autorisation d'utiliser la clé. La politique de profil d'instance documentée ajoute kms:Decrypt sur la clé à côté des autorisations ssmmessages.
  options:
    a:
      en: |
        Session Manager does not need inbound ports on the instances; the agent opens outbound channels to the service.
      fr: |
        Session Manager n'a pas besoin de ports entrants sur les instances ; l'agent ouvre des canaux sortants vers le service.
    b:
      en: |
        s3:GetEncryptionConfiguration is needed only when S3 log encryption is enforced; it does not let the instances use the KMS key.
      fr: |
        s3:GetEncryptionConfiguration n'est nécessaire que lorsque le chiffrement des journaux S3 est imposé ; il ne permet pas aux instances d'utiliser la clé KMS.
    d:
      en: |
        Session data encryption uses a symmetric KMS key that you create; the instances would still need permission to use whichever key is configured.
      fr: |
        Le chiffrement des données de session utilise une clé KMS symétrique que vous créez ; les instances auraient toujours besoin de l'autorisation d'utiliser la clé configurée.
references:
  - title: Turn on KMS key encryption of session data (console)
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-preferences-enable-encryption.html
  - title: Add Session Manager permissions to an existing IAM role
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/getting-started-add-permissions-to-existing-profile.html
