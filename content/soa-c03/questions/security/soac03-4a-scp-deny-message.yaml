id: soac03-4a-scp-deny-message
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer in a member account assumes a role named DevOps that has the AdministratorAccess managed policy. Creating a VPC in the ap-southeast-2 Region fails with the following message.

    ```text
    User: arn:aws:sts::222233334444:assumed-role/DevOps/maria is not authorized to perform: ec2:CreateVpc on resource: arn:aws:ec2:ap-southeast-2:222233334444:vpc/* with an explicit deny in a service control policy
    ```

    What should the CloudOps engineer do to find the cause of the failure?
  fr: |
    Un ingénieur d'un compte membre endosse un rôle nommé DevOps qui dispose de la politique gérée AdministratorAccess. La création d'un VPC dans la Région ap-southeast-2 échoue avec le message suivant.

    ```text
    User: arn:aws:sts::222233334444:assumed-role/DevOps/maria is not authorized to perform: ec2:CreateVpc on resource: arn:aws:ec2:ap-southeast-2:222233334444:vpc/* with an explicit deny in a service control policy
    ```

    Que doit faire l'ingénieur CloudOps pour trouver la cause de l'échec ?
body:
  options:
    - { id: a, text: { en: "From the management account, review the SCPs on the account's path from the root for a Deny that matches the request.", fr: "Depuis le compte de gestion, examiner les SCP du chemin du compte depuis la racine pour trouver un Deny qui correspond à la requête." } }
    - { id: b, text: { en: "Add an Allow statement for ec2:CreateVpc in ap-southeast-2 to a new inline policy of the DevOps role.", fr: "Ajouter une instruction Allow pour ec2:CreateVpc dans ap-southeast-2 à une nouvelle politique en ligne du rôle DevOps." } }
    - { id: c, text: { en: "Review the permissions boundary of the DevOps role for a Deny statement that matches ec2:CreateVpc.", fr: "Examiner la limite d'autorisations du rôle DevOps pour y trouver une instruction Deny qui correspond à ec2:CreateVpc." } }
    - { id: d, text: { en: "Review the session policy that was passed in the AssumeRole call when maria assumed the DevOps role.", fr: "Examiner la politique de session transmise dans l'appel AssumeRole lorsque maria a endossé le rôle DevOps." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Access denied messages name the policy type that caused the denial. Here an explicit Deny in an SCP matched, so the engineer must check the SCPs on the account's path from the root, typically a Region restriction; SCPs are managed from the management account (or a delegated administrator for policies)."
    fr: "Les messages d'accès refusé indiquent le type de politique à l'origine du refus. Ici, un Deny explicite d'une SCP a correspondu : l'ingénieur doit vérifier les SCP sur le chemin du compte depuis la racine, en général une restriction de Région ; les SCP se gèrent depuis le compte de gestion (ou un administrateur délégué pour les politiques)."
  options:
    b:
      en: "An explicit Deny in an SCP always overrides an Allow in an identity-based policy, and the role already allows the action."
      fr: "Un Deny explicite dans une SCP l'emporte toujours sur un Allow d'une politique basée sur l'identité, et le rôle autorise déjà l'action."
    c:
      en: "A denial from a permissions boundary is reported as an explicit deny in a permissions boundary, not in a service control policy."
      fr: "Un refus dû à une limite d'autorisations est signalé comme un refus explicite dans une limite d'autorisations, pas dans une politique de contrôle des services."
    d:
      en: "A denial from a session policy is reported as coming from a session policy, not from a service control policy."
      fr: "Un refus dû à une politique de session est signalé comme provenant d'une politique de session, pas d'une politique de contrôle des services."
references:
  - title: Troubleshoot access denied error messages
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html
  - title: SCP evaluation
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_evaluation.html
