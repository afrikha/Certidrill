id: soac03-4a-ta-root-mfa-members
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Trusted Advisor organizational view report shows a red status for the MFA on Root Account check in 25 member accounts that were created through AWS Organizations. Nobody uses the root user of the member accounts. The company wants to resolve the finding with the LEAST operational overhead and without managing 25 MFA devices.

    Which solution will meet these requirements?
  fr: |
    Un rapport de la vue organisationnelle de Trusted Advisor affiche un statut rouge pour la vérification MFA on Root Account dans 25 comptes membres créés via AWS Organizations. Personne n'utilise l'utilisateur root des comptes membres. L'entreprise veut corriger ce résultat avec le MOINS de charge opérationnelle et sans gérer 25 appareils MFA.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "From the management account, enable centralized root access for member accounts and delete their root user credentials.", fr: "Depuis le compte de gestion, activer l'accès root centralisé pour les comptes membres et supprimer leurs informations d'identification root." } }
    - { id: b, text: { en: "Recover the root password of each member account, sign in as the root user and register a virtual MFA device.", fr: "Récupérer le mot de passe root de chaque compte membre, se connecter en tant qu'utilisateur root et enregistrer un appareil MFA virtuel." } }
    - { id: c, text: { en: "Attach an SCP to the member accounts that denies all actions for the root user.", fr: "Attacher aux comptes membres une SCP qui refuse toutes les actions à l'utilisateur root." } }
    - { id: d, text: { en: "Require MFA for all users in IAM Identity Center and assign administrator permission sets to the member accounts.", fr: "Exiger la MFA pour tous les utilisateurs d'IAM Identity Center et affecter des jeux d'autorisations d'administrateur aux comptes membres." } }
answer: { optionId: a }
explanation:
  correct:
    en: "For member accounts, Trusted Advisor recommends enabling centralized root access management from the management account and removing the member accounts' root credentials. The check is green when no root credentials exist, and privileged root tasks can still be performed centrally when needed."
    fr: "Pour les comptes membres, Trusted Advisor recommande d'activer la gestion centralisée de l'accès root depuis le compte de gestion et de supprimer les informations d'identification root des comptes membres. La vérification est verte quand aucune information d'identification root n'existe, et les tâches root privilégiées restent réalisables de façon centralisée si nécessaire."
  options:
    b:
      en: "Registering MFA on each root user resolves the finding but requires 25 password recoveries and 25 MFA devices to manage."
      fr: "Enregistrer la MFA sur chaque utilisateur root corrige le résultat, mais exige 25 récupérations de mot de passe et 25 appareils MFA à gérer."
    c:
      en: "The SCP limits what the root user can do, but the root credentials still exist without MFA, so the check stays red."
      fr: "La SCP limite ce que peut faire l'utilisateur root, mais les informations d'identification root existent toujours sans MFA : la vérification reste rouge."
    d:
      en: "MFA in IAM Identity Center protects workforce users, not the root user of each account."
      fr: "La MFA d'IAM Identity Center protège les utilisateurs du personnel, pas l'utilisateur root de chaque compte."
references:
  - title: Security
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
