id: soac03-4b-acm-renewal-eligibility
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team requested a public AWS Certificate Manager (ACM) certificate with DNS validation for a new web application. The validation CNAME record is still in the hosted zone. The certificate has never been exported and is not yet associated with any AWS service. The application will run behind an existing Application Load Balancer, and the team wants ACM to renew the certificate automatically from now on.

    What must the team do so that the certificate is eligible for managed renewal?
  fr: |
    Une équipe a demandé un certificat public AWS Certificate Manager (ACM) avec validation DNS pour une nouvelle application web. L'enregistrement CNAME de validation se trouve toujours dans la zone hébergée. Le certificat n'a jamais été exporté et n'est encore associé à aucun service AWS. L'application s'exécutera derrière un Application Load Balancer existant, et l'équipe veut qu'ACM renouvelle désormais le certificat automatiquement.

    Que doit faire l'équipe pour que le certificat soit éligible au renouvellement géré ?
body:
  options:
    - id: a
      text: { en: "Add a CAA record to the hosted zone that authorizes Amazon to issue certificates for the domain.", fr: "Ajouter à la zone hébergée un enregistrement CAA qui autorise Amazon à émettre des certificats pour le domaine." }
    - id: b
      text: { en: "Associate the certificate with an HTTPS listener of the Application Load Balancer.", fr: "Associer le certificat à un écouteur HTTPS de l'Application Load Balancer." }
    - id: c
      text: { en: "Request a new certificate with email validation, and approve the renewal emails when they arrive.", fr: "Demander un nouveau certificat avec validation par e-mail, et approuver les e-mails de renouvellement à leur arrivée." }
    - id: d
      text: { en: "Reimport the certificate into ACM with its private key so that ACM tracks its expiration.", fr: "Réimporter le certificat dans ACM avec sa clé privée afin qu'ACM suive son expiration." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      ACM renews an Amazon-issued certificate automatically when it is DNS validated and eligible: it must be associated with another AWS service, such as Elastic Load Balancing or CloudFront, or have been exported since it was issued or last renewed. Associating it with the load balancer listener makes it eligible, and the ARN stays the same after each renewal.
    fr: |
      ACM renouvelle automatiquement un certificat émis par Amazon lorsqu'il est validé par DNS et éligible : il doit être associé à un autre service AWS, comme Elastic Load Balancing ou CloudFront, ou avoir été exporté depuis son émission ou son dernier renouvellement. L'associer à l'écouteur de l'équilibreur de charge le rend éligible, et l'ARN reste le même après chaque renouvellement.
  options:
    a:
      en: |
        A CAA record controls which authorities may issue certificates for the domain; it does not make an unused certificate eligible for renewal.
      fr: |
        Un enregistrement CAA détermine quelles autorités peuvent émettre des certificats pour le domaine ; il ne rend pas un certificat inutilisé éligible au renouvellement.
    c:
      en: |
        Email validation requires manual approval, and the new certificate would still need to be in use to be eligible.
      fr: |
        La validation par e-mail exige une approbation manuelle, et le nouveau certificat devrait toujours être utilisé pour être éligible.
    d:
      en: |
        Imported certificates are not eligible for managed renewal, and the private key of an ACM-issued certificate is not available unless it is exported.
      fr: |
        Les certificats importés ne sont pas éligibles au renouvellement géré, et la clé privée d'un certificat émis par ACM n'est disponible que s'il est exporté.
references:
  - title: Managed certificate renewal in AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html
