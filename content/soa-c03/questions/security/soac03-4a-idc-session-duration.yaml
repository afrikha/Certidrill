id: soac03-4a-idc-session-duration
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Engineers access several AWS accounts through IAM Identity Center with a permission set named Operations. Their sessions in the accounts end after 1 hour, so they must reauthenticate during long maintenance windows. The company wants these sessions to last 8 hours.

    What should the CloudOps engineer do?
  fr: |
    Des ingénieurs accèdent à plusieurs comptes AWS via IAM Identity Center avec un jeu d'autorisations nommé Operations. Leurs sessions dans les comptes se terminent au bout d'une heure : ils doivent se réauthentifier pendant les longues fenêtres de maintenance. L'entreprise veut que ces sessions durent 8 heures.

    Que doit faire l'ingénieur CloudOps ?
body:
  options:
    - { id: a, text: { en: "Edit the maximum session duration of the AWSReservedSSO_Operations role in each account and set it to 8 hours.", fr: "Modifier la durée de session maximale du rôle AWSReservedSSO_Operations dans chaque compte et la définir sur 8 heures." } }
    - { id: b, text: { en: "Change the session duration of the AWS access portal to 8 hours in the IAM Identity Center settings.", fr: "Définir sur 8 heures la durée de session du portail d'accès AWS dans les paramètres d'IAM Identity Center." } }
    - { id: c, text: { en: "Set the session duration of the Operations permission set to 8 hours.", fr: "Définir sur 8 heures la durée de session du jeu d'autorisations Operations." } }
    - { id: d, text: { en: "Attach an SCP to the accounts that sets the session duration of the Identity Center roles to 8 hours.", fr: "Attacher aux comptes une SCP qui définit sur 8 heures la durée de session des rôles d'Identity Center." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The session duration of a permission set controls how long a user stays signed in to an AWS account through that permission set. It defaults to 1 hour and can be set from 1 to 12 hours; the roles that IAM Identity Center creates already allow up to 12 hours."
    fr: "La durée de session d'un jeu d'autorisations détermine combien de temps un utilisateur reste connecté à un compte AWS via ce jeu d'autorisations. Elle est de 1 heure par défaut et peut aller de 1 à 12 heures ; les rôles créés par IAM Identity Center autorisent déjà jusqu'à 12 heures."
  options:
    a:
      en: "Roles that IAM Identity Center provisions are managed through the permission set and cannot be edited in IAM; they already allow up to 12 hours."
      fr: "Les rôles provisionnés par IAM Identity Center se gèrent via le jeu d'autorisations et ne peuvent pas être modifiés dans IAM ; ils autorisent déjà jusqu'à 12 heures."
    b:
      en: "The access portal session is a separate setting; it does not change how long a session in an AWS account lasts."
      fr: "La session du portail d'accès est un paramètre distinct ; il ne change pas la durée d'une session dans un compte AWS."
    d:
      en: "SCPs only limit permissions; they cannot set session durations."
      fr: "Les SCP ne font que limiter les autorisations ; elles ne peuvent pas définir de durée de session."
references:
  - title: Set session duration for AWS accounts
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/howtosessionduration.html
