id: soac03-4b-inspector-hybrid-scan
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company activated Amazon Inspector EC2 scanning in the agent-based scan mode. The coverage page shows many Linux instances with the status Unmanaged EC2 instance. These instances were launched from a vendor AMI without the SSM Agent, and the vendor's support terms forbid installing agents on them. The instances are EBS-backed, use ext4 file systems, and have two volumes each. The company needs package vulnerability findings for these instances.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise a activé l'analyse EC2 d'Amazon Inspector dans le mode d'analyse par agent. La page de couverture affiche de nombreuses instances Linux avec l'état Unmanaged EC2 instance. Ces instances ont été lancées à partir d'une AMI d'un éditeur sans l'agent SSM, et les conditions de support de l'éditeur interdisent d'y installer des agents. Les instances reposent sur EBS, utilisent des systèmes de fichiers ext4 et ont chacune deux volumes. L'entreprise a besoin de résultats de vulnérabilités des paquets pour ces instances.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Attach an instance profile with the AmazonSSMManagedInstanceCore policy to the instances.", fr: "Attacher aux instances un profil d'instance avec la politique AmazonSSMManagedInstanceCore." }
    - id: b
      text: { en: "Tag the instances with InspectorEc2Exclusion so that Amazon Inspector stops reporting their coverage status.", fr: "Baliser les instances avec InspectorEc2Exclusion afin qu'Amazon Inspector cesse de signaler leur état de couverture." }
    - id: c
      text: { en: "Change the Amazon Inspector EC2 scan mode to hybrid scanning.", fr: "Passer le mode d'analyse EC2 d'Amazon Inspector en analyse hybride." }
    - id: d
      text: { en: "Activate Amazon Inspector scanning for Amazon ECR, and rebuild the vendor AMI as a container image.", fr: "Activer l'analyse Amazon ECR d'Amazon Inspector, et reconstruire l'AMI de l'éditeur sous forme d'image de conteneur." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In hybrid scanning mode, Amazon Inspector uses agent-based scanning for SSM managed instances and agentless scanning for eligible instances that are not managed. Agentless scanning creates EBS snapshots, reads them through the EBS direct APIs and deletes them; eligible instances are EBS-backed with ext3, ext4 or xfs file systems and fewer than 8 volumes totaling 1,200 GB or less.
    fr: |
      En mode d'analyse hybride, Amazon Inspector utilise l'analyse par agent pour les instances gérées par SSM et l'analyse sans agent pour les instances éligibles qui ne sont pas gérées. L'analyse sans agent crée des instantanés EBS, les lit par les API directes EBS puis les supprime ; les instances éligibles reposent sur EBS avec des systèmes de fichiers ext3, ext4 ou xfs et ont moins de 8 volumes totalisant 1 200 Go au plus.
  options:
    a:
      en: |
        Agent-based scanning also needs the SSM Agent installed and running, which the vendor terms forbid.
      fr: |
        L'analyse par agent exige aussi que l'agent SSM soit installé et en cours d'exécution, ce que les conditions de l'éditeur interdisent.
    b:
      en: |
        The exclusion tag stops Amazon Inspector from creating findings for the instances, which is the opposite of the requirement.
      fr: |
        La balise d'exclusion empêche Amazon Inspector de créer des résultats pour les instances, ce qui est l'inverse de l'exigence.
    d:
      en: |
        ECR scanning covers container images in repositories, not the running EC2 instances, and rebuilding the vendor product is a large effort.
      fr: |
        L'analyse ECR couvre les images de conteneur des référentiels, pas les instances EC2 en cours d'exécution, et reconstruire le produit de l'éditeur demande un gros effort.
references:
  - title: Scanning Amazon EC2 instances with Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-ec2.html
