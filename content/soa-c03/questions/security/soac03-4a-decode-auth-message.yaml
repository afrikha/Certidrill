id: soac03-4a-decode-auth-message
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operator launches an instance from a launch template and receives the following error.

    ```bash
    $ aws ec2 run-instances --launch-template LaunchTemplateName=web-lt
    An error occurred (UnauthorizedOperation) when calling the RunInstances operation: You are not authorized to perform this operation. Encoded authorization failure message: 4GIOHlTkIaWHQD0Q0m4XRA...
    ```

    The operator needs to know which action, resource and condition values caused the denial.

    What should the operator do?
  fr: |
    Un opérateur lance une instance à partir d'un modèle de lancement et reçoit l'erreur suivante.

    ```bash
    $ aws ec2 run-instances --launch-template LaunchTemplateName=web-lt
    An error occurred (UnauthorizedOperation) when calling the RunInstances operation: You are not authorized to perform this operation. Encoded authorization failure message: 4GIOHlTkIaWHQD0Q0m4XRA...
    ```

    L'opérateur doit savoir quelle action, quelle ressource et quelles valeurs de condition ont provoqué le refus.

    Que doit faire l'opérateur ?
body:
  options:
    - { id: a, text: { en: "Run aws sts decode-authorization-message with the encoded message, as a principal that is allowed sts:DecodeAuthorizationMessage.", fr: "Exécuter aws sts decode-authorization-message avec le message encodé, en tant que principal autorisé à effectuer sts:DecodeAuthorizationMessage." } }
    - { id: b, text: { en: "Paste the encoded message into IAM Access Analyzer policy validation to obtain the matching policy statement.", fr: "Coller le message encodé dans la validation de politiques d'IAM Access Analyzer pour obtenir l'instruction de politique correspondante." } }
    - { id: c, text: { en: "Run the command again with the --debug option so that the AWS CLI decodes the message locally.", fr: "Exécuter à nouveau la commande avec l'option --debug pour que l'AWS CLI décode le message localement." } }
    - { id: d, text: { en: "Generate an IAM credential report and look up the operator's permissions for RunInstances.", fr: "Générer un rapport d'informations d'identification IAM et y chercher les autorisations de l'opérateur pour RunInstances." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Some operations, such as RunInstances, return an encoded authorization message because it can contain privileged details. AWS STS DecodeAuthorizationMessage returns a JSON document with the action, the resource, the principal, the condition values of the request and whether an explicit deny matched; the caller needs sts:DecodeAuthorizationMessage."
    fr: "Certaines opérations, comme RunInstances, renvoient un message d'autorisation encodé car il peut contenir des détails privilégiés. DecodeAuthorizationMessage d'AWS STS renvoie un document JSON avec l'action, la ressource, le principal, les valeurs de condition de la requête et l'indication d'un éventuel refus explicite ; l'appelant a besoin de sts:DecodeAuthorizationMessage."
  options:
    b:
      en: "Policy validation checks the grammar and best practices of a policy document; it does not decode authorization messages."
      fr: "La validation de politiques vérifie la grammaire et les bonnes pratiques d'un document de politique ; elle ne décode pas les messages d'autorisation."
    c:
      en: "Debug output shows the HTTP exchange, but the message stays encoded; only AWS STS can decode it."
      fr: "La sortie de débogage montre l'échange HTTP, mais le message reste encodé ; seul AWS STS peut le décoder."
    d:
      en: "The credential report lists the status of passwords, access keys and MFA, not permissions or denial reasons."
      fr: "Le rapport d'informations d'identification liste l'état des mots de passe, des clés d'accès et de la MFA, pas les autorisations ni les causes de refus."
references:
  - title: DecodeAuthorizationMessage
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_DecodeAuthorizationMessage.html
