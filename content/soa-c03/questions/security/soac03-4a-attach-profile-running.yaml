id: soac03-4a-attach-profile-running
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application runs on an Amazon EC2 instance that was launched without an IAM role. The application reads objects from an Amazon S3 bucket by using an access key that is stored in a configuration file on the instance. An instance profile named s3-read already exists and contains a role with the required permissions. The company wants to stop using the long-term access key without stopping or replacing the instance.

    Which solution will meet these requirements?
  fr: |
    Une application s'exécute sur une instance Amazon EC2 lancée sans rôle IAM. L'application lit des objets dans un compartiment (bucket) Amazon S3 à l'aide d'une clé d'accès stockée dans un fichier de configuration sur l'instance. Un profil d'instance nommé s3-read existe déjà et contient un rôle doté des autorisations nécessaires. L'entreprise veut cesser d'utiliser la clé d'accès à long terme sans arrêter ni remplacer l'instance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AMI of the instance, launch a new instance from it with the s3-read instance profile, then terminate the original instance.", fr: "Créer une AMI de l'instance, lancer à partir d'elle une nouvelle instance avec le profil d'instance s3-read, puis résilier l'instance d'origine." } }
    - { id: b, text: { en: "Stop the instance, attach the s3-read instance profile, start the instance, then remove the access key and delete it.", fr: "Arrêter l'instance, attacher le profil d'instance s3-read, démarrer l'instance, puis retirer la clé d'accès et la supprimer." } }
    - { id: c, text: { en: "Store the access key in AWS Systems Manager Parameter Store as a SecureString parameter that the application reads at startup.", fr: "Stocker la clé d'accès dans AWS Systems Manager Parameter Store sous forme de paramètre SecureString que l'application lit au démarrage." } }
    - { id: d, text: { en: "Associate the s3-read instance profile with the running instance, then remove the access key from the configuration file and delete it.", fr: "Associer le profil d'instance s3-read à l'instance en cours d'exécution, puis retirer la clé d'accès du fichier de configuration et la supprimer." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An instance profile can be associated with a running instance with associate-iam-instance-profile or the console. The application then obtains temporary credentials for the role from the instance metadata, so the long-term access key can be removed and deleted."
    fr: "Un profil d'instance peut être associé à une instance en cours d'exécution avec associate-iam-instance-profile ou la console. L'application obtient alors des informations d'identification temporaires du rôle via les métadonnées de l'instance : la clé d'accès à long terme peut être retirée et supprimée."
  options:
    a:
      en: "Launching a new instance and terminating the original one replaces the instance, which the company wants to avoid."
      fr: "Lancer une nouvelle instance et résilier l'instance d'origine revient à remplacer l'instance, ce que l'entreprise veut éviter."
    b:
      en: "Stopping the instance is not required to attach an instance profile and violates the requirement to keep the instance running."
      fr: "Il n'est pas nécessaire d'arrêter l'instance pour attacher un profil d'instance, et cela enfreint l'exigence de garder l'instance en marche."
    c:
      en: "Parameter Store protects the stored key, but the application still uses a long-term access key."
      fr: "Parameter Store protège la clé stockée, mais l'application utilise toujours une clé d'accès à long terme."
references:
  - title: Use instance profiles
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
