id: soac03-4a-ta-ssh-open
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AWS Trusted Advisor shows a red status for the Security Groups – Specific Ports Unrestricted check. A security group attached to Linux instances allows TCP port 22 from 0.0.0.0/0. Administrators need shell access to the instances from wherever they work. The instances run the SSM Agent and have an instance profile with the AmazonSSMManagedInstanceCore policy.

    Which solution will remediate the finding while keeping administrator access?
  fr: |
    AWS Trusted Advisor affiche un statut rouge pour la vérification Security Groups – Specific Ports Unrestricted. Un groupe de sécurité attaché à des instances Linux autorise le port TCP 22 depuis 0.0.0.0/0. Les administrateurs ont besoin d'un accès shell aux instances où qu'ils travaillent. Les instances exécutent l'agent SSM et disposent d'un profil d'instance avec la politique AmazonSSMManagedInstanceCore.

    Quelle solution corrige le résultat tout en conservant l'accès des administrateurs ?
body:
  options:
    - { id: a, text: { en: "Change the SSH daemon to listen on port 2222 and change the inbound rule to allow port 2222 from 0.0.0.0/0.", fr: "Configurer le démon SSH pour écouter sur le port 2222 et modifier la règle entrante pour autoriser le port 2222 depuis 0.0.0.0/0." } }
    - { id: b, text: { en: "Add an inbound deny rule for port 22 to the subnet's network ACL and keep the security group rule.", fr: "Ajouter une règle entrante de refus pour le port 22 à la liste ACL réseau du sous-réseau et conserver la règle du groupe de sécurité." } }
    - { id: c, text: { en: "Remove the inbound rule for port 22 and have administrators connect with AWS Systems Manager Session Manager.", fr: "Supprimer la règle entrante pour le port 22 et faire connecter les administrateurs avec AWS Systems Manager Session Manager." } }
    - { id: d, text: { en: "Replace the source 0.0.0.0/0 of the rule with ::/0 so that only IPv6 clients can connect.", fr: "Remplacer la source 0.0.0.0/0 de la règle par ::/0 pour que seuls les clients IPv6 puissent se connecter." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Trusted Advisor recommends restricting unrestricted rules and using Session Manager instead of opening ports 22 and 3389. Session Manager gives administrators a shell through the SSM Agent from anywhere without any inbound port, so the unrestricted rule can be deleted."
    fr: "Trusted Advisor recommande de restreindre les règles sans restriction et d'utiliser Session Manager au lieu d'ouvrir les ports 22 et 3389. Session Manager donne aux administrateurs un shell via l'agent SSM depuis n'importe où, sans aucun port entrant : la règle sans restriction peut être supprimée."
  options:
    a:
      en: "Unrestricted access on another port is still flagged (yellow), and SSH stays exposed to the whole internet."
      fr: "Un accès sans restriction sur un autre port reste signalé (jaune), et SSH reste exposé à tout Internet."
    b:
      en: "The network ACL deny blocks all SSH, including administrators, and the security group rule that the check evaluates is still unrestricted."
      fr: "Le refus dans la liste ACL réseau bloque tout SSH, administrateurs compris, et la règle du groupe de sécurité évaluée par la vérification reste sans restriction."
    d:
      en: "::/0 is the unrestricted IPv6 range, so port 22 remains open to the internet."
      fr: "::/0 est la plage IPv6 sans restriction : le port 22 reste ouvert sur Internet."
references:
  - title: Security
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
