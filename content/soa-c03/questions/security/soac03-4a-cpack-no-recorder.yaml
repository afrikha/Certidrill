id: soac03-4a-cpack-no-recorder
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys an organization conformance pack from its AWS Config delegated administrator account. The detailed status of the deployment shows CREATE_FAILED for three member accounts that recently joined the organization, and CREATE_SUCCESSFUL for all other accounts. In the three accounts, the AWS Config console shows that recording is off. The conformance pack must evaluate every account.

    What should the CloudOps engineer do?
  fr: |
    Une entreprise déploie un pack de conformité (conformance pack) d'organisation depuis son compte administrateur délégué AWS Config. Le statut détaillé du déploiement indique CREATE_FAILED pour trois comptes membres qui ont récemment rejoint l'organisation, et CREATE_SUCCESSFUL pour tous les autres comptes. Dans les trois comptes, la console AWS Config indique que l'enregistrement est désactivé. Le pack de conformité doit évaluer chaque compte.

    Que doit faire l'ingénieur CloudOps ?
body:
  options:
    - { id: a, text: { en: "Turn on AWS Config recording in the three accounts, then redeploy the organization conformance pack to them.", fr: "Activer l'enregistrement AWS Config dans les trois comptes, puis y redéployer le pack de conformité d'organisation." } }
    - { id: b, text: { en: "Add the three accounts to the excluded accounts of the organization conformance pack.", fr: "Ajouter les trois comptes aux comptes exclus du pack de conformité d'organisation." } }
    - { id: c, text: { en: "Create an aggregator authorization for the delegated administrator account in each of the three accounts.", fr: "Créer, dans chacun des trois comptes, une autorisation d'agrégateur pour le compte administrateur délégué." } }
    - { id: d, text: { en: "Register each of the three accounts as an additional delegated administrator for AWS Config, then redeploy the pack.", fr: "Enregistrer chacun des trois comptes comme administrateur délégué supplémentaire d'AWS Config, puis redéployer le pack." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Conformance packs require AWS Config recording in the account and Region. Organization packs are retried for a limited time after an account joins when no recorder is available, so once recording is turned on in the new accounts, the engineer redeploys the pack to them."
    fr: "Les packs de conformité exigent l'enregistrement AWS Config dans le compte et la Région. Les packs d'organisation ne sont retentés que pendant une durée limitée après l'arrivée d'un compte sans enregistreur : une fois l'enregistrement activé dans les nouveaux comptes, l'ingénieur y redéploie le pack."
  options:
    b:
      en: "Excluding the accounts removes the errors but leaves the accounts unevaluated, which breaks the requirement."
      fr: "Exclure les comptes supprime les erreurs mais laisse ces comptes sans évaluation, ce qui enfreint l'exigence."
    c:
      en: "Aggregator authorizations let an aggregator collect data from individual accounts; they do not affect conformance pack deployment."
      fr: "Les autorisations d'agrégateur permettent à un agrégateur de collecter les données de comptes individuels ; elles n'influent pas sur le déploiement des packs de conformité."
    d:
      en: "Delegated administration controls which account can deploy organization packs; the failure comes from the missing recorder in the target accounts."
      fr: "L'administration déléguée détermine quel compte peut déployer les packs d'organisation ; l'échec vient de l'enregistreur manquant dans les comptes cibles."
references:
  - title: Prerequisite for Conformance Packs for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/cpack-prerequisites.html
  - title: Managing Conformance Packs for AWS Config Across all Accounts in Your Organization
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformance-pack-organization-apis.html
