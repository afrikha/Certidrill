id: soac03-4a-scp-deny-leave
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company manages 25 AWS accounts with AWS Organizations, with all features enabled. Administrators of the member accounts have full IAM permissions in their own accounts. The company must prevent every member account, including accounts added later, from leaving the organization.

    Which solution will meet these requirements?
  fr: |
    Une entreprise gère 25 comptes AWS avec AWS Organizations, avec toutes les fonctionnalités activées. Les administrateurs des comptes membres disposent de toutes les autorisations IAM dans leurs propres comptes. L'entreprise doit empêcher chaque compte membre, y compris les comptes ajoutés plus tard, de quitter l'organisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an IAM policy that denies organizations:LeaveOrganization to every administrator role in the member accounts.", fr: "Attacher une politique IAM qui refuse organizations:LeaveOrganization à chaque rôle d'administrateur des comptes membres." } }
    - { id: b, text: { en: "Attach an SCP that denies organizations:LeaveOrganization to the root of the organization.", fr: "Attacher à la racine de l'organisation une SCP qui refuse organizations:LeaveOrganization." } }
    - { id: c, text: { en: "Enable trusted access for AWS Account Management and register a delegated administrator.", fr: "Activer l'accès approuvé pour AWS Account Management et enregistrer un administrateur délégué." } }
    - { id: d, text: { en: "Attach a tag policy to the root that requires an organization tag on every account.", fr: "Attacher à la racine une politique de balises qui exige une balise d'organisation sur chaque compte." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An SCP attached to the root applies to every member account, including accounts that join later, and it limits all principals in those accounts, even administrators and the root user. A Deny on organizations:LeaveOrganization therefore cannot be bypassed from inside a member account."
    fr: "Une SCP attachée à la racine s'applique à chaque compte membre, y compris les comptes qui rejoignent l'organisation plus tard, et elle limite tous les principaux de ces comptes, même les administrateurs et l'utilisateur root. Un Deny sur organizations:LeaveOrganization ne peut donc pas être contourné depuis un compte membre."
  options:
    a:
      en: "Administrators with full IAM permissions can detach or edit IAM policies in their own accounts, and new accounts would not have the policy."
      fr: "Des administrateurs disposant de toutes les autorisations IAM peuvent détacher ou modifier les politiques IAM de leurs propres comptes, et les nouveaux comptes n'auraient pas la politique."
    c:
      en: "Trusted access for AWS Account Management lets the organization manage account settings such as Regions; it does not prevent accounts from leaving."
      fr: "L'accès approuvé pour AWS Account Management permet à l'organisation de gérer des paramètres de compte comme les Régions ; il n'empêche pas les comptes de partir."
    d:
      en: "Tag policies standardize tags on resources; they do not restrict Organizations API actions."
      fr: "Les politiques de balises normalisent les balises des ressources ; elles ne restreignent pas les actions d'API d'Organizations."
references:
  - title: SCP evaluation
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_evaluation.html
