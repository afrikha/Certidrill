id: soac03-4a-ta-ebs-public
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AWS Trusted Advisor shows a red status for the Amazon EBS Public Snapshots check for three snapshots in the eu-central-1 Region. The snapshots must be shared only with the company's disaster recovery account. The company also wants to prevent any snapshot in this Region from being made public in the future, including by administrators.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AWS Trusted Advisor affiche un statut rouge pour la vérification Amazon EBS Public Snapshots pour trois instantanés de la Région eu-central-1. Les instantanés doivent être partagés uniquement avec le compte de reprise après sinistre de l'entreprise. L'entreprise veut aussi empêcher qu'un instantané de cette Région soit rendu public à l'avenir, y compris par des administrateurs.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "For each snapshot, remove the all group from the createVolumePermission attribute and add the disaster recovery account ID.", fr: "Pour chaque instantané, retirer le groupe all de l'attribut createVolumePermission et ajouter l'ID du compte de reprise après sinistre." } }
    - { id: b, text: { en: "Turn on all S3 Block Public Access settings at the account level.", fr: "Activer tous les paramètres S3 Block Public Access au niveau du compte." } }
    - { id: c, text: { en: "Copy each snapshot with encryption by the AWS managed key for EBS and keep the original snapshots.", fr: "Copier chaque instantané avec un chiffrement par la clé gérée par AWS pour EBS et conserver les instantanés d'origine." } }
    - { id: d, text: { en: "Exclude the three snapshots from the check so that the status returns to green.", fr: "Exclure les trois instantanés de la vérification pour que le statut repasse au vert." } }
    - { id: e, text: { en: "Enable block public access for EBS snapshots in eu-central-1 in the block all sharing mode.", fr: "Activer le blocage de l'accès public aux instantanés EBS dans eu-central-1 en mode de blocage de tout partage." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Removing the all group makes each snapshot private, and adding the disaster recovery account keeps the required private sharing. Block public access for EBS snapshots is a Regional account setting that applies to all users, including administrators; the block all sharing mode prevents any public sharing in that Region."
    fr: "Retirer le groupe all rend chaque instantané privé, et ajouter le compte de reprise après sinistre conserve le partage privé requis. Le blocage de l'accès public aux instantanés EBS est un paramètre de compte régional qui s'applique à tous les utilisateurs, administrateurs compris ; le mode de blocage de tout partage empêche tout partage public dans cette Région."
  options:
    b:
      en: "S3 Block Public Access protects S3 buckets and objects, not EBS snapshots."
      fr: "S3 Block Public Access protège les compartiments et objets S3, pas les instantanés EBS."
    c:
      en: "The original snapshots stay public, and snapshots encrypted with the AWS managed key cannot be shared with another account."
      fr: "Les instantanés d'origine restent publics, et des instantanés chiffrés avec la clé gérée par AWS ne peuvent pas être partagés avec un autre compte."
    d:
      en: "Excluding items hides them from the check results without making the snapshots private."
      fr: "Exclure des éléments les masque des résultats de la vérification sans rendre les instantanés privés."
references:
  - title: Block public access for Amazon EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/block-public-access-snapshots.html
  - title: Security
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
