id: soac03-4b-required-tags-remediation
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses the AWS Config required-tags managed rule to find Amazon S3 buckets that have no DataClassification tag. The company wants AWS Config to add the tag DataClassification=Unreviewed automatically to each noncompliant bucket until the data owner classifies it. An engineer configured automatic remediation for the rule with the AWS-SetRequiredTags runbook, but the noncompliant buckets are never tagged.

    What should the engineer do to meet the requirement?
  fr: |
    Une entreprise utilise la règle gérée AWS Config required-tags pour trouver les compartiments Amazon S3 qui n'ont pas de balise DataClassification. L'entreprise veut qu'AWS Config ajoute automatiquement la balise DataClassification=Unreviewed à chaque compartiment non conforme, jusqu'à ce que le propriétaire des données le classe. Un ingénieur a configuré une correction automatique pour la règle avec le runbook AWS-SetRequiredTags, mais les compartiments non conformes ne sont jamais balisés.

    Que doit faire l'ingénieur pour répondre à l'exigence ?
body:
  options:
    - id: a
      text: { en: "Increase the number of automatic remediation attempts and the retry interval of the remediation action.", fr: "Augmenter le nombre de tentatives de correction automatique et l'intervalle entre les tentatives de l'action de correction." }
    - id: b
      text: { en: "Create a custom Automation runbook that adds the tag, and set it as the automatic remediation action of the rule.", fr: "Créer un runbook Automation personnalisé qui ajoute la balise, et le définir comme action de correction automatique de la règle." }
    - id: c
      text: { en: "Change the trigger type of the required-tags rule from configuration changes to periodic.", fr: "Changer le type de déclencheur de la règle required-tags de modifications de configuration à périodique." }
    - id: d
      text: { en: "Deploy the required-tags rule and the same AWS-SetRequiredTags remediation in a conformance pack.", fr: "Déployer la règle required-tags et la même correction AWS-SetRequiredTags dans un pack de conformité (conformance pack)." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS Config applies remediation by running Systems Manager Automation documents, and the required-tags rule documentation states that the AWS-SetRequiredTags document does not work as a remediation for this rule. A custom Automation runbook that adds the tag, run with an AutomationAssumeRole that has the needed tagging permissions, can be associated as the automatic remediation.
    fr: |
      AWS Config applique les corrections en exécutant des documents Systems Manager Automation, et la documentation de la règle required-tags indique que le document AWS-SetRequiredTags ne fonctionne pas comme correction de cette règle. Un runbook Automation personnalisé qui ajoute la balise, exécuté avec un AutomationAssumeRole disposant des autorisations de balisage nécessaires, peut être associé comme correction automatique.
  options:
    a:
      en: |
        More retries run the same unsuitable document again; they do not make it work with this rule.
      fr: |
        Davantage de tentatives exécutent de nouveau le même document inadapté ; elles ne le font pas fonctionner avec cette règle.
    c:
      en: |
        The trigger type controls when the rule evaluates resources; it does not change what the remediation document does.
      fr: |
        Le type de déclencheur détermine quand la règle évalue les ressources ; il ne change pas ce que fait le document de correction.
    d:
      en: |
        A conformance pack deploys the same rule and remediation, so the remediation still does not work.
      fr: |
        Un pack de conformité déploie la même règle et la même correction : la correction ne fonctionne toujours pas.
references:
  - title: required-tags
    url: https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html
  - title: Remediating Noncompliant Resources with AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/remediation.html
