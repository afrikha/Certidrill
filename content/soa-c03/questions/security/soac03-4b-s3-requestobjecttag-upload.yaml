id: soac03-4b-s3-requestobjecttag-upload
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's ingestion role uploads files to an Amazon S3 bucket. The data classification scheme requires every uploaded object to carry a classification tag set to public, internal, or confidential at upload time. PutObject requests that omit the tag or use another value must be denied. The role's other permissions, including the permission to tag objects, are already in place, and the Allow statement for s3:PutObject is the only statement that grants uploads.

    Which condition should the company add to the Allow statement for s3:PutObject?
  fr: |
    Le rôle d'ingestion d'une entreprise charge des fichiers dans un compartiment Amazon S3. Le schéma de classification des données exige que chaque objet chargé porte, dès le chargement, une balise classification égale à public, internal ou confidential. Les requêtes PutObject qui omettent la balise ou utilisent une autre valeur doivent être refusées. Les autres autorisations du rôle, y compris l'autorisation de baliser les objets, sont déjà en place, et l'instruction Allow pour s3:PutObject est la seule qui autorise les chargements.

    Quelle condition l'entreprise doit-elle ajouter à l'instruction Allow pour s3:PutObject ?
body:
  options:
    - id: a
      text: { en: "StringEquals on s3:ExistingObjectTag/classification with the values public, internal, and confidential", fr: "StringEquals sur s3:ExistingObjectTag/classification avec les valeurs public, internal et confidential" }
    - id: b
      text: { en: "StringEquals on s3:RequestObjectTag/classification with the values public, internal, and confidential", fr: "StringEquals sur s3:RequestObjectTag/classification avec les valeurs public, internal et confidential" }
    - id: c
      text: { en: "ForAnyValue:StringEquals on s3:RequestObjectTagKeys with the value classification", fr: "ForAnyValue:StringEquals sur s3:RequestObjectTagKeys avec la valeur classification" }
    - id: d
      text: { en: "Null on s3:RequestObjectTagKeys with the value false", fr: "Null sur s3:RequestObjectTagKeys avec la valeur false" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      s3:RequestObjectTag/<tag-key> restricts the key and value of tags sent with PutObject, PutObjectTagging and POST requests. With StringEquals on the three allowed values, an upload is allowed only when the classification tag is present with one of them; a request without the tag does not match the condition and is implicitly denied.
    fr: |
      s3:RequestObjectTag/<clé> restreint la clé et la valeur des balises envoyées avec les requêtes PutObject, PutObjectTagging et POST. Avec StringEquals sur les trois valeurs autorisées, un chargement n'est autorisé que si la balise classification est présente avec l'une d'elles ; une requête sans balise ne correspond pas à la condition et est implicitement refusée.
  options:
    a:
      en: |
        S3 does not support s3:ExistingObjectTag for granting or denying PutObject and DeleteObject, and a new object has no existing tags to check.
      fr: |
        S3 ne prend pas en charge s3:ExistingObjectTag pour autoriser ou refuser PutObject et DeleteObject, et un nouvel objet n'a pas de balise existante à vérifier.
    c:
      en: |
        This requires the classification key in the request but accepts any value, so an object tagged classification=secret would be allowed.
      fr: |
        Cette condition exige la clé classification dans la requête mais accepte n'importe quelle valeur : un objet balisé classification=secret serait autorisé.
    d:
      en: |
        This only requires that the request contains at least one tag key, whatever the key and its value.
      fr: |
        Cette condition exige seulement que la requête contienne au moins une clé de balise, quelles que soient la clé et sa valeur.
references:
  - title: Tagging and access control policies
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/tagging-and-policies.html
