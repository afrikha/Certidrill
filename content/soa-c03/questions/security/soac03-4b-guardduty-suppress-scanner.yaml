id: soac03-4b-guardduty-suppress-scanner
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an approved vulnerability scanner on Amazon EC2 instances tagged Role=Scanner. Every day, Amazon GuardDuty generates Recon:EC2/Portscan findings for these instances. The findings are sent to AWS Security Hub CSPM and to an EventBridge rule that pages the on-call team. The company must stop these alerts for the scanner instances only, while port scans by any other instance must still be reported.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute un scanner de vulnérabilités approuvé sur des instances Amazon EC2 balisées Role=Scanner. Chaque jour, Amazon GuardDuty génère des résultats Recon:EC2/Portscan pour ces instances. Les résultats sont envoyés à AWS Security Hub CSPM et à une règle EventBridge qui alerte l'équipe d'astreinte. L'entreprise doit arrêter ces alertes pour les instances du scanner uniquement, tandis que les analyses de ports effectuées par toute autre instance doivent toujours être signalées.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Change the EventBridge rule to exclude all findings of type Recon:EC2/Portscan.", fr: "Modifier la règle EventBridge pour exclure tous les résultats de type Recon:EC2/Portscan." }
    - id: b
      text: { en: "Archive the Recon:EC2/Portscan findings of the scanner instances manually in the GuardDuty console every morning.", fr: "Archiver manuellement chaque matin, dans la console GuardDuty, les résultats Recon:EC2/Portscan des instances du scanner." }
    - id: c
      text: { en: "Suspend GuardDuty in the account that hosts the scanner instances.", fr: "Suspendre GuardDuty dans le compte qui héberge les instances du scanner." }
    - id: d
      text: { en: "Create a suppression rule with the finding type Recon:EC2/Portscan and the instance tag Role=Scanner as criteria.", fr: "Créer une règle de suppression avec comme critères le type de résultat Recon:EC2/Portscan et la balise d'instance Role=Scanner." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A suppression rule automatically archives new findings that match its criteria, and suppressed findings are not sent to Security Hub CSPM, Amazon S3, Amazon Detective or EventBridge. GuardDuty documents this case: combine the finding type with a criterion that identifies the scanner instances, such as a tag or an AMI ID. In a multi-account setup, only the GuardDuty administrator can create suppression rules.
    fr: |
      Une règle de suppression archive automatiquement les nouveaux résultats qui correspondent à ses critères, et les résultats supprimés ne sont envoyés ni à Security Hub CSPM, ni à Amazon S3, ni à Amazon Detective, ni à EventBridge. GuardDuty documente ce cas : combiner le type de résultat avec un critère qui identifie les instances du scanner, comme une balise ou un ID d'AMI. Dans un environnement multicompte, seul l'administrateur GuardDuty peut créer des règles de suppression.
  options:
    a:
      en: |
        This would hide port scans from every instance, and the findings would still reach Security Hub CSPM.
      fr: |
        Cela masquerait les analyses de ports de toutes les instances, et les résultats atteindraient toujours Security Hub CSPM.
    b:
      en: |
        Manual archiving happens after the alerts were sent and is a recurring manual task.
      fr: |
        L'archivage manuel intervient après l'envoi des alertes et constitue une tâche manuelle récurrente.
    c:
      en: |
        Suspending GuardDuty stops all threat detection in the account, not only the scanner findings.
      fr: |
        Suspendre GuardDuty arrête toute détection des menaces dans le compte, pas seulement les résultats du scanner.
references:
  - title: Suppression rules in GuardDuty
    url: https://docs.aws.amazon.com/guardduty/latest/ug/findings_suppression-rule.html
