id: soac03-4a-multi-scp-facts
objective: "4.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A CloudOps engineer is preparing to attach a new Deny SCP to the root of the company's organization. The engineer documents how the SCP will behave so that application teams know what to expect.

    Which statements about the SCP are true? (Choose two.)
  fr: |
    Un ingénieur CloudOps se prépare à attacher une nouvelle SCP Deny à la racine de l'organisation de l'entreprise. L'ingénieur documente le comportement de la SCP pour que les équipes applicatives sachent à quoi s'attendre.

    Quelles affirmations sur la SCP sont vraies ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "It does not restrict IAM users and roles in the management account.", fr: "Elle ne restreint pas les utilisateurs et rôles IAM du compte de gestion." } }
    - { id: b, text: { en: "It does not apply to member accounts that are registered as delegated administrators.", fr: "Elle ne s'applique pas aux comptes membres enregistrés comme administrateurs délégués." } }
    - { id: c, text: { en: "It restricts principals outside the organization who access member account resources through resource-based policies.", fr: "Elle restreint les principaux extérieurs à l'organisation qui accèdent aux ressources des comptes membres via des politiques basées sur les ressources." } }
    - { id: d, text: { en: "It does not restrict service-linked roles in the member accounts.", fr: "Elle ne restreint pas les rôles liés à un service des comptes membres." } }
    - { id: e, text: { en: "Any Allow statement in it grants the listed actions to every principal of the member accounts.", fr: "Toute instruction Allow qu'elle contient accorde les actions listées à chaque principal des comptes membres." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "SCPs do not affect users or roles in the management account, and they do not affect any service-linked role. They apply to all other principals of member accounts, including the root user."
    fr: "Les SCP n'affectent pas les utilisateurs ni les rôles du compte de gestion, et elles n'affectent aucun rôle lié à un service. Elles s'appliquent à tous les autres principaux des comptes membres, y compris l'utilisateur root."
  options:
    b:
      en: "Delegated administrator accounts are member accounts, so SCPs apply to them."
      fr: "Les comptes administrateurs délégués sont des comptes membres : les SCP s'y appliquent."
    c:
      en: "SCPs limit only principals of the member accounts; external principals granted access by a resource-based policy are not restricted by SCPs (resource control policies address that case)."
      fr: "Les SCP ne limitent que les principaux des comptes membres ; les principaux externes autorisés par une politique basée sur les ressources ne sont pas restreints par les SCP (les politiques de contrôle des ressources traitent ce cas)."
    e:
      en: "SCPs never grant permissions; they only set the maximum permissions available in the member accounts."
      fr: "Les SCP n'accordent jamais d'autorisations ; elles fixent seulement les autorisations maximales disponibles dans les comptes membres."
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
