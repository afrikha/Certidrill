id: soac03-4b-ami-share-encrypted
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    In account A, a company owns an AMI whose Amazon EBS snapshots are encrypted with a customer managed AWS KMS key. A team in account B must launch Amazon EC2 instances from this AMI. The IAM policies of the team in account B already allow the required KMS actions on keys in other accounts.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Dans le compte A, une entreprise possède une AMI dont les instantanés Amazon EBS sont chiffrés avec une clé AWS KMS gérée par le client. Une équipe du compte B doit lancer des instances Amazon EC2 à partir de cette AMI. Les politiques IAM de l'équipe du compte B autorisent déjà les actions KMS nécessaires sur les clés d'autres comptes.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Update the key policy of the customer managed key to allow account B to use the key.", fr: "Mettre à jour la politique de la clé gérée par le client pour autoriser le compte B à utiliser la clé." } }
    - { id: b, text: { en: "Copy the AMI and re-encrypt its snapshots with the AWS managed key aws/ebs before sharing it.", fr: "Copier l'AMI et rechiffrer ses instantanés avec la clé gérée par AWS aws/ebs avant de la partager." } }
    - { id: c, text: { en: "Create a grant on the aws/ebs AWS managed key for the root user of account B.", fr: "Créer un octroi (grant) sur la clé gérée par AWS aws/ebs pour l'utilisateur racine du compte B." } }
    - { id: d, text: { en: "Turn off encryption on the EBS snapshots so that account B does not need any KMS permission.", fr: "Désactiver le chiffrement des instantanés EBS pour que le compte B n'ait besoin d'aucune autorisation KMS." } }
    - { id: e, text: { en: "Modify the launch permissions of the AMI to add the account ID of account B.", fr: "Modifier les autorisations de lancement de l'AMI pour ajouter l'ID du compte B." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Sharing an AMI with specific accounts is done with its launch permissions (modify-image-attribute); the referenced snapshots do not need to be shared separately. When the snapshots are encrypted, the target account must also be allowed to use the KMS key, which must be a customer managed key.
    fr: |
      Le partage d'une AMI avec des comptes précis se fait par ses autorisations de lancement (modify-image-attribute) ; les instantanés référencés n'ont pas besoin d'être partagés séparément. Lorsque les instantanés sont chiffrés, le compte cible doit aussi être autorisé à utiliser la clé KMS, qui doit être une clé gérée par le client.
  options:
    b:
      en: |
        AMIs backed by snapshots encrypted with the default AWS managed key cannot be shared.
      fr: |
        Les AMI reposant sur des instantanés chiffrés avec la clé gérée par AWS par défaut ne peuvent pas être partagées.
    c:
      en: |
        The aws/ebs key cannot be used to share encrypted resources with other accounts, and the snapshots are not encrypted with it.
      fr: |
        La clé aws/ebs ne permet pas de partager des ressources chiffrées avec d'autres comptes, et les instantanés ne sont pas chiffrés avec elle.
    d:
      en: |
        An encrypted snapshot cannot be decrypted in place, and removing encryption would break the encryption requirement.
      fr: |
        Un instantané chiffré ne peut pas être déchiffré sur place, et retirer le chiffrement irait à l'encontre de l'exigence de chiffrement.
references:
  - title: Share an AMI with specific AWS accounts
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sharingamis-explicit.html
