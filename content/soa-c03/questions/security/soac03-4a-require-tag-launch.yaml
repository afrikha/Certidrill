id: soac03-4a-require-tag-launch
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Developers launch Amazon EC2 instances in a shared AWS account by assuming an IAM role named DevRole. The finance team requires every new instance to have a CostCenter tag when it is launched. Any request that launches an instance without this tag must fail.

    Which solution will meet these requirements?
  fr: |
    Les développeurs lancent des instances Amazon EC2 dans un compte AWS partagé en endossant un rôle IAM nommé DevRole. L'équipe financière exige que chaque nouvelle instance ait une balise CostCenter dès son lancement. Toute requête qui lance une instance sans cette balise doit échouer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a statement to DevRole that denies ec2:RunInstances on arn:aws:ec2:*:*:instance/* when the Null condition on aws:RequestTag/CostCenter is true.", fr: "Ajouter à DevRole une instruction qui refuse ec2:RunInstances sur arn:aws:ec2:*:*:instance/* lorsque la condition Null sur aws:RequestTag/CostCenter est true." } }
    - { id: b, text: { en: "Add a statement to DevRole that denies ec2:RunInstances on arn:aws:ec2:*:*:instance/* when the Null condition on aws:ResourceTag/CostCenter is true.", fr: "Ajouter à DevRole une instruction qui refuse ec2:RunInstances sur arn:aws:ec2:*:*:instance/* lorsque la condition Null sur aws:ResourceTag/CostCenter est true." } }
    - { id: c, text: { en: "Attach a tag policy that defines the CostCenter tag key and enforces it for the ec2:instance resource type.", fr: "Attacher une politique de balises qui définit la clé de balise CostCenter et l'applique au type de ressource ec2:instance." } }
    - { id: d, text: { en: "Deploy the AWS Config managed rule required-tags with tag1Key set to CostCenter for EC2 instances.", fr: "Déployer la règle gérée AWS Config required-tags avec tag1Key défini sur CostCenter pour les instances EC2." } }
answer: { optionId: a }
explanation:
  correct:
    en: "aws:RequestTag/CostCenter is present only when the request passes a CostCenter tag. A Deny on ec2:RunInstances for the instance resource when this key is null makes every launch without the tag fail, whatever other permissions DevRole has."
    fr: "aws:RequestTag/CostCenter n'est présent que si la requête transmet une balise CostCenter. Un Deny sur ec2:RunInstances pour la ressource instance lorsque cette clé est nulle fait échouer tout lancement sans la balise, quelles que soient les autres autorisations de DevRole."
  options:
    b:
      en: "aws:ResourceTag refers to tags that already exist on a resource. The instance does not exist yet when RunInstances is evaluated, so the tags of the request must be checked with aws:RequestTag."
      fr: "aws:ResourceTag désigne les balises déjà présentes sur une ressource. L'instance n'existe pas encore quand RunInstances est évalué : les balises de la requête se vérifient avec aws:RequestTag."
    c:
      en: "Tag policies standardize tags that are used, and enforcement blocks noncompliant values; untagged resources are not evaluated, so a launch without the tag still succeeds."
      fr: "Les politiques de balises normalisent les balises utilisées, et leur application bloque les valeurs non conformes ; les ressources sans balise ne sont pas évaluées, donc un lancement sans la balise réussit quand même."
    d:
      en: "The required-tags rule reports instances without the tag after they are created; it does not make the launch request fail."
      fr: "La règle required-tags signale les instances sans la balise après leur création ; elle ne fait pas échouer la requête de lancement."
references:
  - title: AWS global condition context keys
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
  - title: Tag policies
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html
