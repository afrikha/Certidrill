id: soac03-4a-breakglass-trust-mfa
objective: "4.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company keeps a break-glass IAM role named EmergencyAdmin in its production account (444455556666). Only IAM users of the security account (111122223333) may assume the role, and only after they authenticate with MFA. The security account already grants sts:AssumeRole on the role to a small group of users.

    Which combination of elements must the trust policy of EmergencyAdmin contain? (Choose two.)
  fr: |
    Une entreprise conserve un rôle IAM d'accès d'urgence nommé EmergencyAdmin dans son compte de production (444455556666). Seuls les utilisateurs IAM du compte de sécurité (111122223333) peuvent endosser ce rôle, et uniquement après s'être authentifiés avec la MFA. Le compte de sécurité accorde déjà sts:AssumeRole sur le rôle à un petit groupe d'utilisateurs.

    Quelle combinaison d'éléments la politique d'approbation d'EmergencyAdmin doit-elle contenir ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "\"Principal\": { \"AWS\": \"arn:aws:iam::111122223333:root\" }" }
    - { id: b, text: "\"Condition\": { \"Bool\": { \"aws:MultiFactorAuthPresent\": \"true\" } }" }
    - { id: c, text: "\"Principal\": { \"Service\": \"sts.amazonaws.com\" }" }
    - { id: d, text: "\"Condition\": { \"StringEquals\": { \"aws:SourceAccount\": \"444455556666\" } }" }
    - { id: e, text: "\"Action\": \"sts:AssumeRoleWithSAML\"" }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Trusting the security account as the AWS principal lets that account delegate sts:AssumeRole to its users, which it already does. The Bool condition on aws:MultiFactorAuthPresent set to true makes AssumeRole succeed only for callers that authenticated with MFA."
    fr: "Approuver le compte de sécurité comme principal AWS permet à ce compte de déléguer sts:AssumeRole à ses utilisateurs, ce qu'il fait déjà. La condition Bool sur aws:MultiFactorAuthPresent définie sur true ne fait réussir AssumeRole que pour les appelants authentifiés avec la MFA."
  options:
    c:
      en: "A Service principal lets an AWS service assume the role; it does not trust the IAM users of the security account."
      fr: "Un principal Service permet à un service AWS d'endosser le rôle ; il n'approuve pas les utilisateurs IAM du compte de sécurité."
    d:
      en: "aws:SourceAccount is used when a service principal acts on behalf of a resource; here it would also name the wrong account."
      fr: "aws:SourceAccount s'utilise lorsqu'un principal de service agit pour le compte d'une ressource ; ici, il désignerait en plus le mauvais compte."
    e:
      en: "sts:AssumeRoleWithSAML is for SAML federation. IAM users assume a role with sts:AssumeRole."
      fr: "sts:AssumeRoleWithSAML sert à la fédération SAML. Les utilisateurs IAM endossent un rôle avec sts:AssumeRole."
references:
  - title: AWS global condition context keys
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
