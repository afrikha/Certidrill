id: soac03-4a-ta-exposed-key
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has AWS Business Support+. AWS Trusted Advisor shows a red status for the Exposed Access Keys check for an IAM user named ci-deploy, whose access key was committed to a public code repository. AWS has attached the AWSCompromisedKeyQuarantineV3 managed policy to the user, and the deployment pipeline that uses the key now fails.

    What should the CloudOps engineer do?
  fr: |
    Une entreprise dispose d'AWS Business Support+. AWS Trusted Advisor affiche un statut rouge pour la vérification Exposed Access Keys pour un utilisateur IAM nommé ci-deploy, dont la clé d'accès a été publiée dans un dépôt de code public. AWS a attaché la politique gérée AWSCompromisedKeyQuarantineV3 à l'utilisateur, et le pipeline de déploiement qui utilise la clé échoue désormais.

    Que doit faire l'ingénieur CloudOps ?
body:
  options:
    - { id: a, text: { en: "Detach AWSCompromisedKeyQuarantineV3 from ci-deploy so that the pipeline works again, and rotate the key in the next maintenance window.", fr: "Détacher AWSCompromisedKeyQuarantineV3 de ci-deploy pour que le pipeline fonctionne à nouveau, et faire la rotation de la clé lors de la prochaine fenêtre de maintenance." } }
    - { id: b, text: { en: "Delete the exposed access key, review CloudTrail and the account for unauthorized activity and resources, then give the pipeline new credentials.", fr: "Supprimer la clé d'accès exposée, rechercher dans CloudTrail et dans le compte toute activité et ressource non autorisées, puis fournir de nouvelles informations d'identification au pipeline." } }
    - { id: c, text: { en: "Make the repository private, then exclude ci-deploy from the Exposed Access Keys check in Trusted Advisor.", fr: "Rendre le dépôt privé, puis exclure ci-deploy de la vérification Exposed Access Keys dans Trusted Advisor." } }
    - { id: d, text: { en: "Create a second access key for ci-deploy and keep both keys active until the pipeline has been updated.", fr: "Créer une deuxième clé d'accès pour ci-deploy et garder les deux clés actives jusqu'à la mise à jour du pipeline." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Trusted Advisor recommends deleting an exposed key immediately and checking the account for unauthorized usage, such as instances, Spot requests, access keys and IAM users. The quarantine policy limits damage and must not be removed; the pipeline should then receive new credentials, preferably temporary credentials from a role."
    fr: "Trusted Advisor recommande de supprimer immédiatement une clé exposée et de rechercher dans le compte toute utilisation non autorisée, comme des instances, des requêtes Spot, des clés d'accès et des utilisateurs IAM. La politique de quarantaine limite les dégâts et ne doit pas être retirée ; le pipeline doit ensuite recevoir de nouvelles informations d'identification, de préférence temporaires via un rôle."
  options:
    a:
      en: "AWS instructs customers not to remove the quarantine policy, and leaving the exposed key active lets anyone who copied it keep using it."
      fr: "AWS demande de ne pas retirer la politique de quarantaine, et laisser la clé exposée active permet à quiconque l'a copiée de continuer à l'utiliser."
    c:
      en: "Making the repository private does not invalidate copies of the key, and excluding the item only hides the finding."
      fr: "Rendre le dépôt privé n'invalide pas les copies de la clé, et exclure l'élément ne fait que masquer le résultat."
    d:
      en: "The exposed key stays active, so the compromise is not contained."
      fr: "La clé exposée reste active : la compromission n'est pas contenue."
references:
  - title: Security
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
  - title: AWSCompromisedKeyQuarantineV3
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSCompromisedKeyQuarantineV3.html
