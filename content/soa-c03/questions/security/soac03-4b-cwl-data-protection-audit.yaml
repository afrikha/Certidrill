id: soac03-4b-cwl-data-protection-audit
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application writes its logs to an Amazon CloudWatch Logs log group. The logs sometimes contain email addresses and US driver's license numbers. The compliance team requires that these data types be detected in the log events and masked for anyone who reads the logs, and that a record of each detection be delivered to an existing Amazon S3 bucket for its reports.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une application écrit ses journaux dans un groupe de journaux Amazon CloudWatch Logs. Les journaux contiennent parfois des adresses e-mail et des numéros de permis de conduire américains. L'équipe de conformité exige que ces types de données soient détectés dans les événements de journal et masqués pour toute personne qui lit les journaux, et qu'un enregistrement de chaque détection soit livré dans un compartiment Amazon S3 existant pour ses rapports.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon Macie sensitive data discovery job that targets the log group, and publish its findings to the S3 bucket.", fr: "Créer une tâche de découverte de données sensibles Amazon Macie qui cible le groupe de journaux, et publier ses résultats dans le compartiment S3." }
    - id: b
      text: { en: "Stream the log group to the S3 bucket with an Amazon Data Firehose subscription filter, and run Amazon Macie on the bucket.", fr: "Diffuser le groupe de journaux vers le compartiment S3 avec un filtre d'abonnement Amazon Data Firehose, et exécuter Amazon Macie sur le compartiment." }
    - id: c
      text: { en: "Assign the log group a data protection policy with an Audit statement that sends findings to the bucket and a Deidentify statement.", fr: "Attribuer au groupe de journaux une politique de protection des données avec une instruction Audit qui envoie les résultats vers le compartiment et une instruction Deidentify." }
    - id: d
      text: { en: "Create metric filters that match the two data patterns, and create CloudWatch alarms that notify the compliance team by email.", fr: "Créer des filtres de métrique qui correspondent aux deux motifs de données, et créer des alarmes CloudWatch qui notifient l'équipe de conformité par e-mail." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A CloudWatch Logs data protection policy uses managed data identifiers such as EmailAddress and DriversLicense-US. Its Audit statement detects the data and can send findings to a log group, a Firehose stream or an S3 bucket, and its Deidentify statement masks the matching data for readers who do not have permission to unmask it.
    fr: |
      Une politique de protection des données CloudWatch Logs utilise des identifiants de données gérés comme EmailAddress et DriversLicense-US. Son instruction Audit détecte les données et peut envoyer les résultats vers un groupe de journaux, un flux Firehose ou un compartiment S3, et son instruction Deidentify masque les données correspondantes pour les lecteurs qui n'ont pas l'autorisation de les démasquer.
  options:
    a:
      en: |
        Macie analyzes objects in Amazon S3; it cannot target a CloudWatch Logs log group.
      fr: |
        Macie analyse des objets dans Amazon S3 ; il ne peut pas cibler un groupe de journaux CloudWatch Logs.
    b:
      en: |
        This copies the sensitive data to another place and adds a pipeline and a Macie job, while the data stays unmasked in CloudWatch Logs.
      fr: |
        Cela copie les données sensibles ailleurs et ajoute un pipeline et une tâche Macie, tandis que les données restent non masquées dans CloudWatch Logs.
    d:
      en: |
        Metric filters count matching events, but they neither mask the data nor deliver a record of each detection to S3.
      fr: |
        Les filtres de métrique comptent les événements correspondants, mais ils ne masquent pas les données et ne livrent pas d'enregistrement de chaque détection dans S3.
references:
  - title: Create a data protection policy for a single log group
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data-start.html
