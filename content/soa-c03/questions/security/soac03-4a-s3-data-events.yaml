id: soac03-4a-s3-data-events
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has a multi-Region CloudTrail trail that was created with the default event settings. After an incident, the security team searches the trail's log files for GetObject calls on a confidential Amazon S3 bucket. The team finds bucket-level events such as PutBucketPolicy but no object-level reads.

    What should the CloudOps engineer do so that future object reads on this bucket are recorded?
  fr: |
    Une entreprise dispose d'un journal de suivi (trail) CloudTrail multi-Régions créé avec les paramètres d'événements par défaut. Après un incident, l'équipe de sécurité recherche dans les fichiers journaux les appels GetObject sur un compartiment Amazon S3 confidentiel. L'équipe trouve des événements au niveau du compartiment comme PutBucketPolicy, mais aucune lecture au niveau des objets.

    Que doit faire l'ingénieur CloudOps pour que les futures lectures d'objets de ce compartiment soient enregistrées ?
body:
  options:
    - { id: a, text: { en: "Enable CloudTrail Insights events on the trail for API call rate and error rate.", fr: "Activer les événements CloudTrail Insights sur le journal de suivi pour le taux d'appels et le taux d'erreurs d'API." } }
    - { id: b, text: { en: "Configure the trail to log read management events in addition to write management events.", fr: "Configurer le journal de suivi pour qu'il enregistre les événements de gestion en lecture en plus des événements de gestion en écriture." } }
    - { id: c, text: { en: "Turn on log file integrity validation for the trail.", fr: "Activer la validation de l'intégrité des fichiers journaux du journal de suivi." } }
    - { id: d, text: { en: "Add an advanced event selector for S3 data events on the trail, limited to the bucket's ARN prefix.", fr: "Ajouter au journal de suivi un sélecteur d'événements avancé pour les événements de données S3, limité au préfixe d'ARN du compartiment." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Object-level operations such as GetObject are data events, which trails do not log by default. An advanced event selector on the S3 object resource type with a resources.ARN prefix for the bucket logs these events for that bucket only, which also limits the additional data event charges."
    fr: "Les opérations au niveau des objets comme GetObject sont des événements de données, que les journaux de suivi n'enregistrent pas par défaut. Un sélecteur d'événements avancé sur le type de ressource objet S3 avec un préfixe resources.ARN pour le compartiment enregistre ces événements pour ce seul compartiment, ce qui limite aussi les frais supplémentaires liés aux événements de données."
  options:
    a:
      en: "Insights events detect unusual API call or error rates on management events; they do not record individual object reads."
      fr: "Les événements Insights détectent des taux inhabituels d'appels ou d'erreurs sur les événements de gestion ; ils n'enregistrent pas les lectures d'objets individuelles."
    b:
      en: "Read management events include calls such as ListBuckets or GetBucketPolicy, but GetObject is a data event."
      fr: "Les événements de gestion en lecture comprennent des appels comme ListBuckets ou GetBucketPolicy, mais GetObject est un événement de données."
    c:
      en: "Integrity validation proves that delivered log files were not changed; it does not add event types to the trail."
      fr: "La validation d'intégrité prouve que les fichiers journaux livrés n'ont pas été modifiés ; elle n'ajoute aucun type d'événement au journal de suivi."
references:
  - title: Logging data events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
