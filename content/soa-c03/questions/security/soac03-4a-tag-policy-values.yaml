id: soac03-4a-tag-policy-values
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 30 AWS accounts in an organization. The values of the CostCenter tag on Amazon EC2 instances are inconsistent across accounts (for example cc-100, CC100 and 100). The finance team requires that only approved CostCenter values can be applied to EC2 instances in every account, and it wants a report of existing noncompliant tags for the whole organization.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise a 30 comptes AWS dans une organisation. Les valeurs de la balise CostCenter sur les instances Amazon EC2 sont incohérentes d'un compte à l'autre (par exemple cc-100, CC100 et 100). L'équipe financière exige que seules des valeurs CostCenter approuvées puissent être appliquées aux instances EC2 de chaque compte, et elle veut un rapport des balises non conformes existantes pour toute l'organisation.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Attach to the root a tag policy that defines the approved CostCenter values, enforced for ec2:instance, and use its compliance report.", fr: "Attacher à la racine une politique de balises qui définit les valeurs CostCenter approuvées, appliquée à ec2:instance, et utiliser son rapport de conformité." } }
    - { id: b, text: { en: "Attach to the root an SCP that denies ec2:CreateTags unless aws:RequestTag/CostCenter matches an approved value.", fr: "Attacher à la racine une SCP qui refuse ec2:CreateTags sauf si aws:RequestTag/CostCenter correspond à une valeur approuvée." } }
    - { id: c, text: { en: "Deploy the AWS Config required-tags rule with the approved CostCenter values in each account and Region.", fr: "Déployer la règle AWS Config required-tags avec les valeurs CostCenter approuvées dans chaque compte et chaque Région." } }
    - { id: d, text: { en: "Use Tag Editor in each account every month to find and correct CostCenter values on EC2 instances.", fr: "Utiliser Tag Editor dans chaque compte chaque mois pour trouver et corriger les valeurs CostCenter des instances EC2." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A tag policy standardizes a tag key and its allowed values across the organization. Enforcement for the ec2:instance resource type prevents noncompliant tagging operations, and the management account can view compliance information for all accounts to find the existing noncompliant tags."
    fr: "Une politique de balises normalise une clé de balise et ses valeurs autorisées dans toute l'organisation. Son application au type de ressource ec2:instance empêche les opérations de balisage non conformes, et le compte de gestion peut consulter les informations de conformité de tous les comptes pour trouver les balises non conformes existantes."
  options:
    b:
      en: "An SCP can block new noncompliant values, but it provides no report of the noncompliant tags that already exist."
      fr: "Une SCP peut bloquer les nouvelles valeurs non conformes, mais elle ne fournit aucun rapport des balises non conformes déjà présentes."
    c:
      en: "The required-tags rule only detects noncompliant resources; it does not prevent noncompliant values, and it must be deployed in every account and Region."
      fr: "La règle required-tags ne fait que détecter les ressources non conformes ; elle n'empêche pas les valeurs non conformes et doit être déployée dans chaque compte et chaque Région."
    d:
      en: "Manual monthly corrections do not prevent noncompliant values and require work in every account."
      fr: "Des corrections manuelles mensuelles n'empêchent pas les valeurs non conformes et demandent du travail dans chaque compte."
references:
  - title: Tag policies
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html
