id: soac03-4b-rds-change-kms-key
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance that is encrypted with the AWS managed key aws/rds. The company must now share snapshots of the database with an auditing account, so the database must be encrypted with a customer managed AWS KMS key instead. A maintenance window of 2 hours is approved, and the application can switch to a new endpoint.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exploite une instance de base de données Amazon RDS for MySQL chiffrée avec la clé gérée par AWS aws/rds. L'entreprise doit désormais partager des instantanés de la base avec un compte d'audit : la base doit donc être chiffrée avec une clé AWS KMS gérée par le client. Une fenêtre de maintenance de 2 heures est approuvée, et l'application peut basculer vers un nouveau point de terminaison.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run modify-db-instance with the --kms-key-id option set to the customer managed key, and apply the change immediately.", fr: "Exécuter modify-db-instance avec l'option --kms-key-id définie sur la clé gérée par le client, et appliquer la modification immédiatement." }
    - id: b
      text: { en: "Create a read replica in the same Region encrypted with the customer managed key, and promote the replica.", fr: "Créer un réplica en lecture dans la même Région chiffré avec la clé gérée par le client, et promouvoir le réplica." }
    - id: c
      text: { en: "Take a snapshot, copy it with the customer managed key, restore a new DB instance from the copy, and switch the application.", fr: "Prendre un instantané, le copier avec la clé gérée par le client, restaurer une nouvelle instance à partir de la copie, et basculer l'application." }
    - id: d
      text: { en: "Turn on automatic rotation for the aws/rds key so that the instance uses new key material.", fr: "Activer la rotation automatique de la clé aws/rds afin que l'instance utilise un nouveau matériel de clé." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The KMS key of an encrypted RDS DB instance cannot be changed. A snapshot copy can use a different KMS key than the source snapshot, so restoring from a copy encrypted with the customer managed key gives a DB instance whose snapshots can be shared; snapshots encrypted with the AWS managed key cannot be shared.
    fr: |
      La clé KMS d'une instance RDS chiffrée ne peut pas être changée. Une copie d'instantané peut utiliser une autre clé KMS que l'instantané source : restaurer à partir d'une copie chiffrée avec la clé gérée par le client donne une instance dont les instantanés peuvent être partagés, alors que les instantanés chiffrés avec la clé gérée par AWS ne peuvent pas l'être.
  options:
    a:
      en: |
        After an encrypted DB instance is created, its KMS key cannot be changed by modifying the instance.
      fr: |
        Une fois une instance chiffrée créée, sa clé KMS ne peut pas être changée en modifiant l'instance.
    b:
      en: |
        In the same Region, an encrypted read replica must use the same KMS key as its source DB instance.
      fr: |
        Dans la même Région, un réplica en lecture chiffré doit utiliser la même clé KMS que son instance source.
    d:
      en: |
        AWS managed keys are rotated by AWS, and rotation keeps the same key; the snapshots would still use aws/rds and could not be shared.
      fr: |
        Les clés gérées par AWS font l'objet d'une rotation par AWS, et la rotation conserve la même clé : les instantanés utiliseraient toujours aws/rds et ne pourraient pas être partagés.
references:
  - title: Encrypting Amazon RDS resources
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html
