id: soac03-4b-s3-min-tls-version
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The bucket policy of an Amazon S3 bucket already denies all requests when aws:SecureTransport is false. A new compliance rule requires the bucket to also reject requests from clients that use a TLS version earlier than TLS 1.2. Applications access the bucket directly through the S3 endpoints.

    Which solution will meet these requirements?
  fr: |
    La politique d'un compartiment Amazon S3 refuse déjà toutes les requêtes lorsque aws:SecureTransport vaut false. Une nouvelle règle de conformité exige que le compartiment rejette aussi les requêtes des clients qui utilisent une version de TLS antérieure à TLS 1.2. Les applications accèdent au compartiment directement par les points de terminaison S3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a Deny statement to the bucket policy with a NumericLessThan condition on s3:TlsVersion set to 1.2.", fr: "Ajouter à la politique de compartiment une instruction Deny avec une condition NumericLessThan sur s3:TlsVersion égale à 1.2." }
    - id: b
      text: { en: "Add a Deny statement to the bucket policy with a StringNotEquals condition on s3:signatureversion set to AWS4-HMAC-SHA256.", fr: "Ajouter à la politique de compartiment une instruction Deny avec une condition StringNotEquals sur s3:signatureversion égale à AWS4-HMAC-SHA256." }
    - id: c
      text: { en: "Put an Amazon CloudFront distribution with the TLSv1.2_2021 security policy in front of the bucket.", fr: "Placer devant le compartiment une distribution Amazon CloudFront avec la politique de sécurité TLSv1.2_2021." }
    - id: d
      text: { en: "Set the default encryption of the bucket to SSE-KMS with a customer managed key.", fr: "Définir le chiffrement par défaut du compartiment sur SSE-KMS avec une clé gérée par le client." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The s3:TlsVersion condition key contains the TLS version used by the client. A Deny statement with NumericLessThan 1.2 in the bucket policy rejects TLS 1.0 and TLS 1.1 requests, and the existing aws:SecureTransport statement keeps rejecting unencrypted HTTP requests.
    fr: |
      La clé de condition s3:TlsVersion contient la version de TLS utilisée par le client. Une instruction Deny avec NumericLessThan 1.2 dans la politique de compartiment rejette les requêtes TLS 1.0 et TLS 1.1, et l'instruction aws:SecureTransport existante continue de rejeter les requêtes HTTP non chiffrées.
  options:
    b:
      en: |
        s3:signatureversion checks the request signing version (SigV4), not the TLS version of the connection.
      fr: |
        s3:signatureversion vérifie la version de signature de la requête (SigV4), pas la version TLS de la connexion.
    c:
      en: |
        The applications call the S3 endpoints directly, so a CloudFront security policy would not apply to their requests.
      fr: |
        Les applications appellent directement les points de terminaison S3 : une politique de sécurité CloudFront ne s'appliquerait pas à leurs requêtes.
    d:
      en: |
        Default encryption protects objects at rest; it does not control the TLS version used in transit.
      fr: |
        Le chiffrement par défaut protège les objets au repos ; il ne contrôle pas la version TLS utilisée en transit.
references:
  - title: Bucket policy examples using condition keys
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazon-s3-policy-keys.html
