id: soac03-4b-cloudtrail-kms-readers
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company configured its AWS CloudTrail trail to encrypt log files with SSE-KMS by using a customer managed key that was created in the CloudTrail console. Since the change, auditors who use an IAM role with s3:GetObject permission on the log bucket receive an AccessDenied error when they download log files.

    Which solution will give the auditors access while following the principle of least privilege?
  fr: |
    Une entreprise a configuré son journal de suivi (trail) AWS CloudTrail pour chiffrer les fichiers journaux avec SSE-KMS au moyen d'une clé gérée par le client créée dans la console CloudTrail. Depuis la modification, les auditeurs qui utilisent un rôle IAM disposant de l'autorisation s3:GetObject sur le compartiment des journaux reçoivent une erreur AccessDenied lorsqu'ils téléchargent les fichiers journaux.

    Quelle solution donne l'accès aux auditeurs en respectant le principe du moindre privilège ?
body:
  options:
    - id: a
      text: { en: "Grant the auditors' role s3:* permissions on the log bucket and its objects.", fr: "Accorder au rôle des auditeurs les autorisations s3:* sur le compartiment des journaux et ses objets." }
    - id: b
      text: { en: "Allow the auditors' role to use kms:Decrypt on the key in the key policy.", fr: "Autoriser le rôle des auditeurs à utiliser kms:Decrypt sur la clé dans la politique de clé." }
    - id: c
      text: { en: "Turn off SSE-KMS encryption on the trail so that the log files use SSE-S3.", fr: "Désactiver le chiffrement SSE-KMS du trail afin que les fichiers journaux utilisent SSE-S3." }
    - id: d
      text: { en: "Allow the auditors' role to use kms:GenerateDataKey on the key in the key policy.", fr: "Autoriser le rôle des auditeurs à utiliser kms:GenerateDataKey sur la clé dans la politique de clé." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With SSE-KMS, reading a log file requires permission to decrypt with the KMS key in addition to S3 read access. CloudTrail documentation says to include decrypt permissions for all users who need to read log files, so the auditors' role needs kms:Decrypt on the key.
    fr: |
      Avec SSE-KMS, la lecture d'un fichier journal exige l'autorisation de déchiffrer avec la clé KMS en plus de l'accès en lecture S3. La documentation CloudTrail indique d'inclure les autorisations de déchiffrement pour tous les utilisateurs qui doivent lire les fichiers journaux : le rôle des auditeurs a donc besoin de kms:Decrypt sur la clé.
  options:
    a:
      en: |
        More S3 permissions do not help because the missing permission is on the KMS key, and s3:* exceeds least privilege.
      fr: |
        Davantage d'autorisations S3 n'aident pas, car l'autorisation manquante porte sur la clé KMS, et s3:* dépasse le moindre privilège.
    c:
      en: |
        Removing SSE-KMS weakens the protection of the logs instead of granting the missing permission.
      fr: |
        Retirer SSE-KMS affaiblit la protection des journaux au lieu d'accorder l'autorisation manquante.
    d:
      en: |
        GenerateDataKey is used to encrypt new data; reading existing log files requires Decrypt.
      fr: |
        GenerateDataKey sert à chiffrer de nouvelles données ; la lecture des fichiers journaux existants exige Decrypt.
references:
  - title: Encrypting CloudTrail log files, digest files, and event data stores with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/encrypting-cloudtrail-log-files-with-aws-kms.html
