id: soac03-4a-ta-rds-public
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AWS Trusted Advisor shows a red status for the Amazon RDS Public Snapshots check for a manual DB snapshot named orders-2026-10. The snapshot is not shared with any specific account and must not be accessible from other accounts.

    Which command should the CloudOps engineer run?
  fr: |
    AWS Trusted Advisor affiche un statut rouge pour la vérification Amazon RDS Public Snapshots pour un instantané de base de données manuel nommé orders-2026-10. L'instantané n'est partagé avec aucun compte particulier et ne doit pas être accessible depuis d'autres comptes.

    Quelle commande l'ingénieur CloudOps doit-il exécuter ?
body:
  options:
    - { id: a, text: "aws rds modify-db-instance --db-instance-identifier orders --no-publicly-accessible" }
    - { id: b, text: "aws ec2 modify-snapshot-attribute --snapshot-id orders-2026-10 --attribute createVolumePermission --operation-type remove --group-names all" }
    - { id: c, text: "aws rds modify-db-snapshot-attribute --db-snapshot-identifier orders-2026-10 --attribute-name restore --values-to-add none" }
    - { id: d, text: "aws rds modify-db-snapshot-attribute --db-snapshot-identifier orders-2026-10 --attribute-name restore --values-to-remove all" }
answer: { optionId: d }
explanation:
  correct:
    en: "The restore attribute of a manual DB snapshot lists the accounts that can copy or restore it, and the value all makes it public. Removing all from the restore attribute makes the snapshot private, because no account ID is listed explicitly."
    fr: "L'attribut restore d'un instantané de base de données manuel liste les comptes qui peuvent le copier ou le restaurer, et la valeur all le rend public. Retirer all de l'attribut restore rend l'instantané privé, car aucun ID de compte n'y figure explicitement."
  options:
    a:
      en: "This setting controls whether the DB instance has a public endpoint; it does not change who can restore the snapshot."
      fr: "Ce paramètre détermine si l'instance de base de données a un point de terminaison public ; il ne change pas qui peut restaurer l'instantané."
    b:
      en: "modify-snapshot-attribute manages EBS snapshots, not RDS DB snapshots."
      fr: "modify-snapshot-attribute gère les instantanés EBS, pas les instantanés de base de données RDS."
    c:
      en: "Adding a value does not remove the public all value, and none is not an account ID."
      fr: "Ajouter une valeur ne retire pas la valeur publique all, et none n'est pas un ID de compte."
references:
  - title: modify-db-snapshot-attribute
    url: https://docs.aws.amazon.com/cli/latest/reference/rds/modify-db-snapshot-attribute.html
