id: soac03-4a-ta-s3-permissions
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AWS Trusted Advisor shows a red status for the Amazon S3 Bucket Permissions check for several buckets in an account. Company policy states that no bucket in this account may ever be public, including buckets created in the future.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AWS Trusted Advisor affiche un statut rouge pour la vérification Amazon S3 Bucket Permissions pour plusieurs compartiments d'un compte. La politique de l'entreprise stipule qu'aucun compartiment de ce compte ne doit jamais être public, y compris les compartiments créés à l'avenir.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Edit the ACL of each flagged bucket to remove the Everyone and Authenticated Users grantees.", fr: "Modifier la liste ACL de chaque compartiment signalé pour retirer les bénéficiaires Everyone et Authenticated Users." } }
    - { id: b, text: { en: "Turn on all four S3 Block Public Access settings at the account level.", fr: "Activer les quatre paramètres S3 Block Public Access au niveau du compte." } }
    - { id: c, text: { en: "Enable default encryption with SSE-KMS on every bucket in the account.", fr: "Activer le chiffrement par défaut avec SSE-KMS sur chaque compartiment du compte." } }
    - { id: d, text: { en: "Create an AWS Config rule that reports public buckets every 24 hours.", fr: "Créer une règle AWS Config qui signale les compartiments publics toutes les 24 heures." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Trusted Advisor recommends restricting access and enabling S3 Block Public Access. At the account level, the four settings override public ACLs and public bucket policies for every existing and future bucket in the account, which turns the check green."
    fr: "Trusted Advisor recommande de restreindre l'accès et d'activer S3 Block Public Access. Au niveau du compte, les quatre paramètres neutralisent les listes ACL publiques et les politiques de compartiment publiques de chaque compartiment existant et futur du compte, ce qui fait passer la vérification au vert."
  options:
    a:
      en: "Fixing ACLs bucket by bucket does not cover public bucket policies or buckets created later."
      fr: "Corriger les listes ACL compartiment par compartiment ne couvre ni les politiques de compartiment publiques ni les compartiments créés plus tard."
    c:
      en: "Encryption at rest does not change who can access the objects."
      fr: "Le chiffrement au repos ne change pas qui peut accéder aux objets."
    d:
      en: "A Config rule only detects public buckets; it does not prevent public access."
      fr: "Une règle Config ne fait que détecter les compartiments publics ; elle n'empêche pas l'accès public."
references:
  - title: Security
    url: https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html
