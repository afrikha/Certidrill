id: soac03-4a-org-access-role-invited
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company invited an existing AWS account to join its organization. Administrators in the management account can switch to the OrganizationAccountAccessRole role in every account that was created through AWS Organizations, but they cannot do this in the invited account. The company wants the same administrative access to the invited account.

    Which combination of steps will meet these requirements? (Choose three.)
  fr: |
    Une entreprise a invité un compte AWS existant à rejoindre son organisation. Les administrateurs du compte de gestion peuvent basculer vers le rôle OrganizationAccountAccessRole dans chaque compte créé via AWS Organizations, mais pas dans le compte invité. L'entreprise veut le même accès administratif au compte invité.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "In the invited account, create an IAM role named OrganizationAccountAccessRole whose trust policy trusts the management account.", fr: "Dans le compte invité, créer un rôle IAM nommé OrganizationAccountAccessRole dont la politique d'approbation approuve le compte de gestion." } }
    - { id: b, text: { en: "Enable trusted access for IAM in the AWS Organizations console of the management account.", fr: "Activer l'accès approuvé pour IAM dans la console AWS Organizations du compte de gestion." } }
    - { id: c, text: { en: "Attach the AdministratorAccess managed policy to the new role in the invited account.", fr: "Attacher la politique gérée AdministratorAccess au nouveau rôle du compte invité." } }
    - { id: d, text: { en: "Attach the FullAWSAccess SCP directly to the invited account.", fr: "Attacher directement la SCP FullAWSAccess au compte invité." } }
    - { id: e, text: { en: "Make sure that the administrators' policy in the management account allows sts:AssumeRole on the new role's ARN.", fr: "S'assurer que la politique des administrateurs du compte de gestion autorise sts:AssumeRole sur l'ARN du nouveau rôle." } }
    - { id: f, text: { en: "Share the new role with the management account through a resource share in AWS RAM.", fr: "Partager le nouveau rôle avec le compte de gestion via un partage de ressources AWS RAM." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "Organizations creates OrganizationAccountAccessRole only in accounts that it creates, not in invited accounts. The company creates a role with the same name in the invited account, trusts the management account, gives it administrator permissions, and lets the management account administrators call sts:AssumeRole on the role's ARN."
    fr: "Organizations ne crée OrganizationAccountAccessRole que dans les comptes qu'il crée, pas dans les comptes invités. L'entreprise crée un rôle du même nom dans le compte invité, approuve le compte de gestion, lui donne des autorisations d'administrateur et permet aux administrateurs du compte de gestion d'appeler sts:AssumeRole sur l'ARN du rôle."
  options:
    b:
      en: "Cross-account role assumption needs no trusted access; trusted access lets an AWS service operate across the organization."
      fr: "L'endossement de rôle intercompte ne nécessite aucun accès approuvé ; l'accès approuvé permet à un service AWS d'agir dans toute l'organisation."
    d:
      en: "FullAWSAccess is attached by default and SCPs never grant permissions, so this does not create any access."
      fr: "FullAWSAccess est attachée par défaut et les SCP n'accordent jamais d'autorisations : cela ne crée aucun accès."
    f:
      en: "IAM roles are not shared through AWS RAM; cross-account access is defined by the role's trust policy."
      fr: "Les rôles IAM ne se partagent pas via AWS RAM ; l'accès intercompte est défini par la politique d'approbation du rôle."
references:
  - title: Accessing a member account that has OrganizationAccountAccessRole with AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_accounts_access-cross-account-role.html
