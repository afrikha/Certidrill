id: soac03-4a-declarative-ec2
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's security baseline requires that EC2 serial console access be disabled and that no EBS snapshot can be publicly shared, in every current and future account of its organization. Account administrators must not be able to change these settings. The settings must also stay enforced for service-linked roles and when Amazon EC2 adds new API actions.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    La base de sécurité d'une entreprise exige que l'accès à la console série EC2 soit désactivé et qu'aucun instantané EBS ne puisse être partagé publiquement, dans chaque compte actuel et futur de son organisation. Les administrateurs de compte ne doivent pas pouvoir modifier ces paramètres. Les paramètres doivent aussi rester appliqués pour les rôles liés à un service et lorsqu'Amazon EC2 ajoute de nouvelles actions d'API.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Attach to the root an SCP that denies ec2:EnableSerialConsoleAccess, ec2:ModifySnapshotAttribute and ec2:DisableSnapshotBlockPublicAccess.", fr: "Attacher à la racine une SCP qui refuse ec2:EnableSerialConsoleAccess, ec2:ModifySnapshotAttribute et ec2:DisableSnapshotBlockPublicAccess." } }
    - { id: b, text: { en: "Attach to the root a declarative policy for EC2 that disables serial console access and sets snapshot block public access to block all sharing.", fr: "Attacher à la racine une politique déclarative pour EC2 qui désactive l'accès à la console série et définit le blocage de l'accès public aux instantanés sur le blocage de tout partage." } }
    - { id: c, text: { en: "In each account and Region, disable serial console access and enable snapshot block public access with the AWS CLI.", fr: "Dans chaque compte et chaque Région, désactiver l'accès à la console série et activer le blocage de l'accès public aux instantanés avec l'AWS CLI." } }
    - { id: d, text: { en: "Deploy AWS Config rules with automatic remediation that turn the settings back on when they are changed in an account.", fr: "Déployer des règles AWS Config avec correction automatique qui rétablissent les paramètres lorsqu'ils sont modifiés dans un compte." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Declarative policies enforce a baseline configuration of AWS services in the service's control plane, for every account under the target, including new accounts, principals and resources. EC2 declarative policies support serial console access and snapshot block public access, account administrators cannot change the values, and unlike SCPs they also govern service-linked roles and persist as new APIs are added."
    fr: "Les politiques déclaratives appliquent une configuration de base des services AWS dans le plan de contrôle du service, pour chaque compte sous la cible, y compris les nouveaux comptes, principaux et ressources. Les politiques déclaratives EC2 prennent en charge l'accès à la console série et le blocage de l'accès public aux instantanés, les administrateurs de compte ne peuvent pas modifier les valeurs et, contrairement aux SCP, elles s'appliquent aussi aux rôles liés à un service et persistent quand de nouvelles API sont ajoutées."
  options:
    a:
      en: "SCPs work at the API level: they do not govern service-linked roles and must be updated when new API actions can change the same configuration."
      fr: "Les SCP agissent au niveau des API : elles ne régissent pas les rôles liés à un service et doivent être mises à jour quand de nouvelles actions d'API peuvent modifier la même configuration."
    c:
      en: "Per-account settings must be repeated for every new account and Region, and account administrators can change them."
      fr: "Les paramètres par compte doivent être répétés pour chaque nouveau compte et chaque Région, et les administrateurs de compte peuvent les modifier."
    d:
      en: "Remediation reacts after a change, so the settings can be changed for a while, and the rules must be maintained in every account."
      fr: "La correction réagit après une modification : les paramètres peuvent être modifiés pendant un temps, et les règles doivent être maintenues dans chaque compte."
references:
  - title: Declarative policies in AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_declarative.html
