id: soac03-4b-elasticache-transit-mode
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon ElastiCache for Valkey replication group runs without encryption in transit. About 50 client applications use it, and their teams will move them to TLS gradually over several weeks. The company must end up with a cache that accepts only encrypted connections, without creating a new cache and without disconnecting the applications that have not moved yet.

    Which solution will meet these requirements?
  fr: |
    Un groupe de réplication Amazon ElastiCache for Valkey s'exécute sans chiffrement en transit. Environ 50 applications clientes l'utilisent, et leurs équipes les feront passer à TLS progressivement sur plusieurs semaines. L'entreprise doit aboutir à un cache qui n'accepte que des connexions chiffrées, sans créer de nouveau cache et sans déconnecter les applications qui n'ont pas encore migré.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable encryption in transit with the transit encryption mode set to required, and ask the teams to update their clients afterward.", fr: "Activer le chiffrement en transit avec le mode de chiffrement en transit required, puis demander aux équipes de mettre à jour leurs clients." }
    - id: b
      text: { en: "Enable encryption in transit with the mode set to preferred, migrate the clients to TLS, and then change the mode to required.", fr: "Activer le chiffrement en transit avec le mode preferred, faire migrer les clients vers TLS, puis passer le mode à required." }
    - id: c
      text: { en: "Create a new replication group with encryption in transit, migrate the clients to it, and delete the old group.", fr: "Créer un nouveau groupe de réplication avec chiffrement en transit, y faire migrer les clients, puis supprimer l'ancien groupe." }
    - id: d
      text: { en: "Enable encryption at rest on the replication group, and restrict its security group to the client subnets.", fr: "Activer le chiffrement au repos sur le groupe de réplication, et restreindre son groupe de sécurité aux sous-réseaux des clients." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Enabling encryption in transit on an existing Valkey or Redis OSS cache is a two-step process. The preferred mode accepts both encrypted and unencrypted connections while clients move to TLS; the required mode, set after all clients have moved, drops unencrypted connections and allows only encrypted ones.
    fr: |
      L'activation du chiffrement en transit sur un cache Valkey ou Redis OSS existant se fait en deux étapes. Le mode preferred accepte les connexions chiffrées et non chiffrées pendant que les clients passent à TLS ; le mode required, défini une fois tous les clients migrés, coupe les connexions non chiffrées et n'autorise que les connexions chiffrées.
  options:
    a:
      en: |
        The required mode drops all unencrypted connections at once, so the applications that have not moved would be disconnected.
      fr: |
        Le mode required coupe d'un coup toutes les connexions non chiffrées : les applications qui n'ont pas migré seraient déconnectées.
    c:
      en: |
        The requirements forbid creating a new cache, and an existing cache can be moved to TLS in place.
      fr: |
        Les exigences interdisent de créer un nouveau cache, et un cache existant peut passer à TLS sur place.
    d:
      en: |
        Encryption at rest and network restrictions do not encrypt the traffic between the clients and the cache.
      fr: |
        Le chiffrement au repos et les restrictions réseau ne chiffrent pas le trafic entre les clients et le cache.
references:
  - title: Enabling in-transit encryption
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/in-transit-encryption-enable.html
