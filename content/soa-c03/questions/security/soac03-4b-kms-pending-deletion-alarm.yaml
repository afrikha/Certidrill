id: soac03-4b-kms-pending-deletion-alarm
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team scheduled the deletion of 15 customer managed AWS KMS keys that it believes are unused, with a 30-day waiting period. The team must receive an email if any person or application tries to use one of these keys during the waiting period. An AWS CloudTrail trail already delivers the account's events to an Amazon CloudWatch Logs log group.

    Which solution will meet these requirements?
  fr: |
    Une équipe de sécurité a planifié la suppression de 15 clés AWS KMS gérées par le client qu'elle pense inutilisées, avec une période d'attente de 30 jours. L'équipe doit recevoir un e-mail si une personne ou une application tente d'utiliser l'une de ces clés pendant la période d'attente. Un journal de suivi (trail) AWS CloudTrail livre déjà les événements du compte dans un groupe de journaux Amazon CloudWatch Logs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a metric filter on the trail's log group that matches the KMS pending deletion error message, and an alarm with an SNS action.", fr: "Créer sur le groupe de journaux du trail un filtre de métrique qui correspond au message d'erreur KMS de suppression en attente, et une alarme avec une action SNS." }
    - id: b
      text: { en: "Create an Amazon EventBridge rule that matches the KMS key deletion event and sends it to an SNS topic with an email subscription.", fr: "Créer une règle Amazon EventBridge qui correspond à l'événement de suppression de clé KMS et l'envoie vers une rubrique SNS avec un abonnement e-mail." }
    - id: c
      text: { en: "Deploy the AWS Config managed rule that flags KMS keys scheduled for deletion, and send its compliance changes to SNS.", fr: "Déployer la règle gérée AWS Config qui signale les clés KMS dont la suppression est planifiée, et envoyer ses changements de conformité vers SNS." }
    - id: d
      text: { en: "Create a CloudWatch alarm on the SecondsUntilKeyMaterialExpiration metric of each key, with an SNS action.", fr: "Créer une alarme CloudWatch sur la métrique SecondsUntilKeyMaterialExpiration de chaque clé, avec une action SNS." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When someone tries to use a key pending deletion in a cryptographic operation, the request fails and CloudTrail records an error message saying the key is pending deletion. AWS KMS documents a metric filter on that error message in the CloudTrail log group, with an alarm that triggers at 1 or more occurrences.
    fr: |
      Lorsqu'une personne tente d'utiliser une clé en attente de suppression dans une opération de chiffrement, la requête échoue et CloudTrail enregistre un message d'erreur indiquant que la clé est en attente de suppression. AWS KMS documente un filtre de métrique sur ce message d'erreur dans le groupe de journaux CloudTrail, avec une alarme qui se déclenche à partir de 1 occurrence.
  options:
    b:
      en: |
        The deletion event occurs when the waiting period ends; it does not signal attempts to use the key during the waiting period.
      fr: |
        L'événement de suppression survient à la fin de la période d'attente ; il ne signale pas les tentatives d'utilisation de la clé pendant cette période.
    c:
      en: |
        Such a rule reports that the keys are scheduled for deletion, which the team already knows; it does not detect attempts to use them.
      fr: |
        Une telle règle signale que la suppression des clés est planifiée, ce que l'équipe sait déjà ; elle ne détecte pas les tentatives d'utilisation.
    d:
      en: |
        This metric tracks the expiration of imported key material; it says nothing about attempted use of a key.
      fr: |
        Cette métrique suit l'expiration du matériel de clé importé ; elle n'indique rien sur les tentatives d'utilisation d'une clé.
references:
  - title: Create an alarm that detects use of a KMS key pending deletion
    url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys-creating-cloudwatch-alarm.html
