id: soac03-4b-rds-proxy-secret-mismatch
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application connects to an Amazon RDS for PostgreSQL DB instance through RDS Proxy. The proxy uses one AWS Secrets Manager secret for each database user. A database administrator changed the password of the app_user database user directly in the database. Since then, connections through the proxy as app_user fail, while connections as other users still work.

    Which solution will resolve the issue?
  fr: |
    Une application se connecte à une instance de base de données Amazon RDS for PostgreSQL par RDS Proxy. Le proxy utilise un secret AWS Secrets Manager par utilisateur de base de données. Un administrateur de base de données a changé le mot de passe de l'utilisateur app_user directement dans la base. Depuis, les connexions par le proxy en tant qu'app_user échouent, alors que les connexions des autres utilisateurs fonctionnent toujours.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Update the app_user secret in Secrets Manager with the new password.", fr: "Mettre à jour le secret d'app_user dans Secrets Manager avec le nouveau mot de passe." }
    - id: b
      text: { en: "Reboot the DB instance so that the proxy reloads the credentials of all users.", fr: "Redémarrer l'instance de base de données afin que le proxy recharge les informations d'identification de tous les utilisateurs." }
    - id: c
      text: { en: "Add secretsmanager:GetSecretValue on the app_user secret to the application's IAM role.", fr: "Ajouter secretsmanager:GetSecretValue sur le secret d'app_user au rôle IAM de l'application." }
    - id: d
      text: { en: "Increase the MaxConnectionsPercent setting of the proxy's target group.", fr: "Augmenter le paramètre MaxConnectionsPercent du groupe cible du proxy." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      RDS Proxy connects to the database with the credentials stored in the Secrets Manager secret of each user, and those credentials must match a database user. When the password changes only in the database, connections that use that secret fail until the secret is updated, while the other secrets keep working.
    fr: |
      RDS Proxy se connecte à la base avec les informations d'identification stockées dans le secret Secrets Manager de chaque utilisateur, et elles doivent correspondre à un utilisateur de la base. Lorsque le mot de passe change seulement dans la base, les connexions qui utilisent ce secret échouent jusqu'à la mise à jour du secret, tandis que les autres secrets continuent de fonctionner.
  options:
    b:
      en: |
        A reboot does not change the outdated password stored in the secret.
      fr: |
        Un redémarrage ne change pas le mot de passe obsolète stocké dans le secret.
    c:
      en: |
        The proxy reads the secret, not the application, and the other users work, so access to Secrets Manager is not the problem.
      fr: |
        C'est le proxy qui lit le secret, pas l'application, et les autres utilisateurs fonctionnent : l'accès à Secrets Manager n'est pas en cause.
    d:
      en: |
        The failure is an authentication failure for one user, not a connection limit, since the other users still connect.
      fr: |
        L'échec est un échec d'authentification pour un seul utilisateur, pas une limite de connexions, puisque les autres utilisateurs se connectent toujours.
references:
  - title: Setting up database credentials for RDS Proxy
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy-secrets-arns.html
