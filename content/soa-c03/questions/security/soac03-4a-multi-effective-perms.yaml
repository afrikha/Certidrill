id: soac03-4a-multi-effective-perms
objective: "4.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An IAM role in a member account has the identity-based policy and the permissions boundary shown below. The FullAWSAccess SCP is attached at every level of the organization, and an additional SCP attached to the account's OU denies ec2:StopInstances.

    Identity-based policy:

    ```json
    { "Version": "2012-10-17",
      "Statement": [ { "Effect": "Allow", "Action": "ec2:*", "Resource": "*" } ] }
    ```

    Permissions boundary:

    ```json
    { "Version": "2012-10-17",
      "Statement": [ { "Effect": "Allow",
        "Action": [ "ec2:Describe*", "ec2:StartInstances", "ec2:StopInstances" ],
        "Resource": "*" } ] }
    ```

    Which API calls made by the role will succeed? (Choose two.)
  fr: |
    Un rôle IAM d'un compte membre dispose de la politique basée sur l'identité et de la limite d'autorisations présentées ci-dessous. La SCP FullAWSAccess est attachée à chaque niveau de l'organisation, et une SCP supplémentaire attachée à l'unité d'organisation du compte refuse ec2:StopInstances.

    Politique basée sur l'identité :

    ```json
    { "Version": "2012-10-17",
      "Statement": [ { "Effect": "Allow", "Action": "ec2:*", "Resource": "*" } ] }
    ```

    Limite d'autorisations :

    ```json
    { "Version": "2012-10-17",
      "Statement": [ { "Effect": "Allow",
        "Action": [ "ec2:Describe*", "ec2:StartInstances", "ec2:StopInstances" ],
        "Resource": "*" } ] }
    ```

    Quels appels d'API effectués par le rôle réussiront ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "ec2:DescribeInstances" }
    - { id: b, text: "ec2:StopInstances" }
    - { id: c, text: "ec2:TerminateInstances" }
    - { id: d, text: "ec2:StartInstances" }
    - { id: e, text: "ec2:RunInstances" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A request succeeds only if every applicable policy type allows it and no policy denies it. DescribeInstances and StartInstances are allowed by the identity-based policy, the permissions boundary and FullAWSAccess, and no SCP denies them."
    fr: "Une requête ne réussit que si chaque type de politique applicable l'autorise et qu'aucune politique ne la refuse. DescribeInstances et StartInstances sont autorisés par la politique basée sur l'identité, la limite d'autorisations et FullAWSAccess, et aucune SCP ne les refuse."
  options:
    b:
      en: "StopInstances is allowed by the identity-based policy and the boundary, but the explicit Deny in the OU's SCP overrides these allows."
      fr: "StopInstances est autorisé par la politique basée sur l'identité et par la limite, mais le Deny explicite de la SCP de l'unité d'organisation l'emporte sur ces autorisations."
    c:
      en: "TerminateInstances is not in the permissions boundary, so it is implicitly denied even though the identity-based policy allows ec2:*."
      fr: "TerminateInstances ne figure pas dans la limite d'autorisations : l'action est implicitement refusée même si la politique basée sur l'identité autorise ec2:*."
    e:
      en: "RunInstances is not in the permissions boundary, so the boundary denies it implicitly."
      fr: "RunInstances ne figure pas dans la limite d'autorisations : la limite le refuse implicitement."
references:
  - title: Troubleshoot access denied error messages
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html
  - title: SCP evaluation
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_evaluation.html
