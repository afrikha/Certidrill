id: soac03-4b-securityhub-automation-rule
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Security Hub CSPM with a delegated administrator account in us-east-1 and eu-west-1. Cross-Region aggregation is configured with us-east-1 as the home Region. As findings are ingested in both Regions, findings from the sandbox account 444455556666 that have the INFORMATIONAL severity label must automatically get the SUPPRESSED workflow status. Findings from the other accounts must not change.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Security Hub CSPM avec un compte administrateur délégué dans us-east-1 et eu-west-1. L'agrégation entre Régions est configurée avec us-east-1 comme Région d'origine. À mesure que les résultats sont ingérés dans les deux Régions, les résultats du compte sandbox 444455556666 qui ont l'étiquette de gravité INFORMATIONAL doivent recevoir automatiquement l'état de flux de travail SUPPRESSED. Les résultats des autres comptes ne doivent pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create the same automation rule in the sandbox account, in us-east-1 and in eu-west-1.", fr: "Créer la même règle d'automatisation dans le compte sandbox, dans us-east-1 et dans eu-west-1." }
    - id: b
      text: { en: "Create one automation rule in the administrator account in us-east-1, because it is the home Region of the aggregation.", fr: "Créer une seule règle d'automatisation dans le compte administrateur dans us-east-1, parce que c'est la Région d'origine." }
    - id: c
      text: { en: "Disable the Security Hub CSPM controls that generate INFORMATIONAL findings in both Regions.", fr: "Désactiver les contrôles Security Hub CSPM qui génèrent des résultats INFORMATIONAL dans les deux Régions." }
    - id: d
      text: { en: "In the administrator account, create an automation rule in each Region that suppresses the matching sandbox findings.", fr: "Dans le compte administrateur, créer dans chaque Région une règle d'automatisation qui supprime les résultats sandbox correspondants." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Automation rules update findings as Security Hub CSPM ingests them, for example by changing the severity or setting the workflow status to SUPPRESSED. They can be created only from the administrator account, can target member accounts by account ID, and apply only in the Region where they are created, so a rule is needed in each Region.
    fr: |
      Les règles d'automatisation mettent à jour les résultats au moment où Security Hub CSPM les ingère, par exemple en changeant la gravité ou en définissant l'état de flux de travail sur SUPPRESSED. Elles ne peuvent être créées que depuis le compte administrateur, peuvent cibler des comptes membres par leur ID, et ne s'appliquent que dans la Région où elles sont créées : une règle est donc nécessaire dans chaque Région.
  options:
    a:
      en: |
        Automation rules can be created and managed only from a Security Hub CSPM administrator account.
      fr: |
        Les règles d'automatisation ne peuvent être créées et gérées que depuis un compte administrateur Security Hub CSPM.
    b:
      en: |
        An automation rule applies only in the Region where it is created, even with cross-Region aggregation, so eu-west-1 findings would not be suppressed when they are ingested.
      fr: |
        Une règle d'automatisation ne s'applique que dans la Région où elle est créée, même avec l'agrégation entre Régions : les résultats d'eu-west-1 ne seraient pas supprimés lors de leur ingestion.
    c:
      en: |
        Disabling controls stops their checks for every account, not only the sandbox account.
      fr: |
        Désactiver des contrôles arrête leurs vérifications pour tous les comptes, pas seulement pour le compte sandbox.
references:
  - title: Understanding automation rules in Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/automation-rules.html
