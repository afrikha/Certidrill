id: soac03-4b-dynamodb-switch-key
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon DynamoDB table uses the default encryption at rest with an AWS owned key. A new security requirement states that the company must control the key policy of the key that protects the table and must see each use of the key in AWS CloudTrail. The table must stay available, and the data must not be migrated.

    Which solution will meet these requirements?
  fr: |
    Une table Amazon DynamoDB utilise le chiffrement au repos par défaut avec une clé détenue par AWS. Une nouvelle exigence de sécurité impose que l'entreprise contrôle la politique de la clé qui protège la table et voie chaque utilisation de la clé dans AWS CloudTrail. La table doit rester disponible, et les données ne doivent pas être migrées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Switch the table's encryption to the AWS managed key for DynamoDB.", fr: "Basculer le chiffrement de la table vers la clé gérée par AWS pour DynamoDB." }
    - id: b
      text: { en: "Create a new table encrypted with a customer managed key, and copy the items with an export and an import.", fr: "Créer une nouvelle table chiffrée avec une clé gérée par le client, et copier les éléments par une exportation puis une importation." }
    - id: c
      text: { en: "Encrypt the items on the client side with the AWS Database Encryption SDK before writing them to the table.", fr: "Chiffrer les éléments côté client avec l'AWS Database Encryption SDK avant de les écrire dans la table." }
    - id: d
      text: { en: "Switch the table's encryption to a customer managed AWS KMS key in the console or with the update-table command.", fr: "Basculer le chiffrement de la table vers une clé AWS KMS gérée par le client dans la console ou avec la commande update-table." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      DynamoDB lets you switch an existing table between an AWS owned key, an AWS managed key and a customer managed key at any time, without recreating the table. A customer managed key is created, owned and managed by the company, which controls its key policy, and its use appears in CloudTrail.
    fr: |
      DynamoDB permet de basculer à tout moment une table existante entre une clé détenue par AWS, une clé gérée par AWS et une clé gérée par le client, sans recréer la table. Une clé gérée par le client est créée, détenue et gérée par l'entreprise, qui contrôle sa politique de clé, et son utilisation apparaît dans CloudTrail.
  options:
    a:
      en: |
        An AWS managed key is in the account, but its key policy is managed by AWS and cannot be edited by the company.
      fr: |
        Une clé gérée par AWS se trouve dans le compte, mais sa politique de clé est gérée par AWS et ne peut pas être modifiée par l'entreprise.
    b:
      en: |
        A new table and a data copy are unnecessary because the key of the existing table can be changed, and the requirements forbid migrating the data.
      fr: |
        Une nouvelle table et une copie des données sont inutiles, car la clé de la table existante peut être changée, et les exigences interdisent la migration des données.
    c:
      en: |
        Client-side encryption requires code changes and does not change the key that protects the table at rest.
      fr: |
        Le chiffrement côté client exige des modifications du code et ne change pas la clé qui protège la table au repos.
references:
  - title: DynamoDB encryption at rest
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/EncryptionAtRest.html
