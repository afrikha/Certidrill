id: soac03-4b-dax-transit-encryption
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application uses an Amazon DynamoDB Accelerator (DAX) cluster that was created without encryption in transit. A new security requirement states that all requests and responses between the application and the cache must be encrypted with TLS.

    Which solution will meet this requirement?
  fr: |
    Une application utilise un cluster Amazon DynamoDB Accelerator (DAX) créé sans chiffrement en transit. Une nouvelle exigence de sécurité impose que toutes les requêtes et réponses entre l'application et le cache soient chiffrées avec TLS.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Modify the existing DAX cluster to enable encryption in transit, and then reboot its nodes one at a time.", fr: "Modifier le cluster DAX existant pour activer le chiffrement en transit, et redémarrer ses nœuds un par un." }
    - id: b
      text: { en: "Create an interface VPC endpoint for DynamoDB so that the DAX traffic stays inside the company's VPC.", fr: "Créer un point de terminaison d'interface VPC pour DynamoDB afin que le trafic DAX reste dans le VPC." }
    - id: c
      text: { en: "Enable server-side encryption on the DAX cluster with an AWS KMS key.", fr: "Activer le chiffrement côté serveur sur le cluster DAX avec une clé AWS KMS." }
    - id: d
      text: { en: "Create a new DAX cluster with encryption in transit enabled, move the application to it, and delete the old cluster.", fr: "Créer un nouveau cluster DAX avec le chiffrement en transit activé, y faire passer l'application, puis supprimer l'ancien cluster." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Encryption in transit can be enabled only when a DAX cluster is created. AWS recommends creating a new cluster with encryption in transit, shifting the application traffic to it with a recent DAX client, and then deleting the old cluster.
    fr: |
      Le chiffrement en transit ne peut être activé qu'à la création d'un cluster DAX. AWS recommande de créer un nouveau cluster avec chiffrement en transit, d'y faire passer le trafic de l'application avec un client DAX récent, puis de supprimer l'ancien cluster.
  options:
    a:
      en: |
        Encryption in transit cannot be enabled on an existing DAX cluster.
      fr: |
        Le chiffrement en transit ne peut pas être activé sur un cluster DAX existant.
    b:
      en: |
        DAX traffic already stays in the VPC; staying private is not the same as being encrypted with TLS.
      fr: |
        Le trafic DAX reste déjà dans le VPC ; rester privé n'équivaut pas à être chiffré avec TLS.
    c:
      en: |
        Server-side encryption protects data at rest on the cluster, not the traffic between the application and the cluster.
      fr: |
        Le chiffrement côté serveur protège les données au repos sur le cluster, pas le trafic entre l'application et le cluster.
references:
  - title: DAX encryption in transit
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAXEncryptionInTransit.html
