id: soac03-4a-athena-access-denied
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's multi-Region CloudTrail trail has delivered management events to an Amazon S3 bucket for two years. The trail does not send events to CloudWatch Logs. An auditor needs a list of every AccessDenied error returned to one IAM role during the last 6 months, with the event names and source IP addresses.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Le journal de suivi (trail) CloudTrail multi-Régions d'une entreprise livre des événements de gestion dans un compartiment Amazon S3 depuis deux ans. Le journal de suivi n'envoie pas d'événements à CloudWatch Logs. Un auditeur a besoin de la liste de toutes les erreurs AccessDenied renvoyées à un rôle IAM au cours des 6 derniers mois, avec les noms d'événements et les adresses IP sources.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Athena table over the trail's S3 location and run a SQL query that filters on the error code and the role ARN.", fr: "Créer une table Amazon Athena sur l'emplacement S3 du journal de suivi et exécuter une requête SQL qui filtre sur le code d'erreur et l'ARN du rôle." } }
    - { id: b, text: { en: "Search CloudTrail Event history in each Region with a filter on the role name, and export the results.", fr: "Rechercher dans l'historique des événements CloudTrail de chaque Région avec un filtre sur le nom du rôle, puis exporter les résultats." } }
    - { id: c, text: { en: "Run a CloudWatch Logs Insights query on the trail's log group with a filter on the errorCode field.", fr: "Exécuter une requête CloudWatch Logs Insights sur le groupe de journaux du journal de suivi avec un filtre sur le champ errorCode." } }
    - { id: d, text: { en: "Open the Last Accessed tab of the role in the IAM console to list the services that returned errors.", fr: "Ouvrir l'onglet Last Accessed du rôle dans la console IAM pour lister les services qui ont renvoyé des erreurs." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Athena queries the CloudTrail log files where they are stored in S3. A table (created from the CloudTrail console or with partition projection) lets one SQL query filter six months of events on errorcode and the role ARN and return the event names and source IP addresses."
    fr: "Athena interroge les fichiers journaux CloudTrail là où ils sont stockés dans S3. Une table (créée depuis la console CloudTrail ou avec la projection de partitions) permet à une seule requête SQL de filtrer six mois d'événements sur errorcode et l'ARN du rôle, et de renvoyer les noms d'événements et les adresses IP sources."
  options:
    b:
      en: "Event history keeps only 90 days of events, accepts one attribute filter at a time and must be searched Region by Region."
      fr: "L'historique des événements ne conserve que 90 jours d'événements, n'accepte qu'un filtre d'attribut à la fois et se consulte Région par Région."
    c:
      en: "The trail does not deliver events to CloudWatch Logs, and enabling it now would include only future events."
      fr: "Le journal de suivi ne livre pas d'événements à CloudWatch Logs, et l'activer maintenant n'inclurait que les événements futurs."
    d:
      en: "Last accessed information shows when services were last used, not the failed requests or their source IP addresses."
      fr: "Les informations de dernier accès indiquent quand les services ont été utilisés pour la dernière fois, pas les requêtes en échec ni leurs adresses IP sources."
references:
  - title: Query AWS CloudTrail logs
    url: https://docs.aws.amazon.com/athena/latest/ug/cloudtrail-logs.html
