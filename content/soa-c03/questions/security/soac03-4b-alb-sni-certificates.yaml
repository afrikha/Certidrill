id: soac03-4b-alb-sni-certificates
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Application Load Balancer has an HTTPS listener on port 443 that serves shop.example.com with an AWS Certificate Manager (ACM) certificate as its default certificate. The company now wants the same listener to also serve api.example.net over HTTPS with a separate ACM certificate for that domain. The company does not want another load balancer, and shop.example.com must keep working.

    Which solution will meet these requirements?
  fr: |
    Un Application Load Balancer possède un écouteur HTTPS sur le port 443 qui sert shop.example.com avec un certificat AWS Certificate Manager (ACM) comme certificat par défaut. L'entreprise veut maintenant que le même écouteur serve aussi api.example.net en HTTPS avec un certificat ACM distinct pour ce domaine. L'entreprise ne veut pas d'autre équilibreur de charge, et shop.example.com doit continuer à fonctionner.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the api.example.net certificate to the certificate list of the listener so that the load balancer selects it with SNI.", fr: "Ajouter le certificat d'api.example.net à la liste de certificats de l'écouteur afin que l'équilibreur de charge le sélectionne avec SNI." }
    - id: b
      text: { en: "Create a second HTTPS listener on port 443 that uses the api.example.net certificate as its default certificate.", fr: "Créer un second écouteur HTTPS sur le port 443 qui utilise le certificat d'api.example.net comme certificat par défaut." }
    - id: c
      text: { en: "Replace the default certificate of the listener with the api.example.net certificate.", fr: "Remplacer le certificat par défaut de l'écouteur par le certificat d'api.example.net." }
    - id: d
      text: { en: "Add a Network Load Balancer with a TCP listener on port 443 in front of the Application Load Balancer for api.example.net.", fr: "Ajouter devant l'Application Load Balancer un Network Load Balancer avec un écouteur TCP sur le port 443 pour api.example.net." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An HTTPS listener has one default certificate and an optional certificate list. With a certificate list, the load balancer supports several domains on the same port and uses SNI to select the certificate that matches the host name requested by the client; the default certificate is used when no certificate matches or the client does not send SNI.
    fr: |
      Un écouteur HTTPS a un certificat par défaut et une liste de certificats facultative. Avec une liste de certificats, l'équilibreur de charge prend en charge plusieurs domaines sur le même port et utilise SNI pour choisir le certificat qui correspond au nom d'hôte demandé par le client ; le certificat par défaut sert lorsqu'aucun certificat ne correspond ou que le client n'envoie pas SNI.
  options:
    b:
      en: |
        A load balancer cannot have two listeners on the same port; a single listener uses a certificate list for several domains.
      fr: |
        Un équilibreur de charge ne peut pas avoir deux écouteurs sur le même port ; un seul écouteur utilise une liste de certificats pour plusieurs domaines.
    c:
      en: |
        Clients of shop.example.com would then receive a certificate for another domain and their connections would fail validation.
      fr: |
        Les clients de shop.example.com recevraient alors un certificat pour un autre domaine, et la validation de leurs connexions échouerait.
    d:
      en: |
        This adds a second load balancer, which the company does not want, and is not needed to serve a second certificate.
      fr: |
        Cela ajoute un second équilibreur de charge, ce que l'entreprise ne veut pas, et ce n'est pas nécessaire pour servir un second certificat.
references:
  - title: SSL certificates for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/https-listener-certificates.html
