id: soac03-4a-guard-custom-rule
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A compliance team needs one AWS Config rule that checks a company-specific condition: every Amazon DynamoDB table tagged DataClass=restricted must have point-in-time recovery enabled and deletion protection turned on. No managed rule combines these conditions. The team does not want to write or maintain AWS Lambda functions, and the rule must evaluate a table whenever its configuration changes.

    Which solution will meet these requirements?
  fr: |
    Une équipe conformité a besoin d'une règle AWS Config unique qui vérifie une condition propre à l'entreprise : chaque table Amazon DynamoDB balisée DataClass=restricted doit avoir la restauration à un instant dans le passé activée et la protection contre la suppression activée. Aucune règle gérée ne combine ces conditions. L'équipe ne veut pas écrire ni maintenir de fonctions AWS Lambda, et la règle doit évaluer une table chaque fois que sa configuration change.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS Config custom Lambda rule with a periodic trigger that runs every hour.", fr: "Créer une règle AWS Config personnalisée Lambda avec un déclencheur périodique toutes les heures." } }
    - { id: b, text: { en: "Create an AWS Config custom policy rule written in AWS CloudFormation Guard, triggered by configuration changes to AWS::DynamoDB::Table resources.", fr: "Créer une règle de politique personnalisée AWS Config écrite en AWS CloudFormation Guard, déclenchée par les changements de configuration des ressources AWS::DynamoDB::Table." } }
    - { id: c, text: { en: "Deploy an AWS managed conformance pack of operational best practices that includes DynamoDB rules.", fr: "Déployer un pack de conformité géré par AWS de bonnes pratiques opérationnelles qui inclut des règles DynamoDB." } }
    - { id: d, text: { en: "Create an Amazon EventBridge rule for DynamoDB API calls that starts an AWS Step Functions workflow to check the table.", fr: "Créer une règle Amazon EventBridge pour les appels d'API DynamoDB qui démarre un flux de travail AWS Step Functions chargé de vérifier la table." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Config custom policy rules contain their logic as Guard policy text, so no Lambda function is needed. In detective mode they are triggered by configuration changes of the resources in scope, and the result appears as AWS Config compliance like any other rule."
    fr: "Les règles de politique personnalisées AWS Config contiennent leur logique sous forme de texte de politique Guard : aucune fonction Lambda n'est nécessaire. En mode détectif, elles sont déclenchées par les changements de configuration des ressources de leur portée, et le résultat apparaît comme une conformité AWS Config, comme pour toute autre règle."
  options:
    a:
      en: "A custom Lambda rule requires writing and maintaining a function, and a periodic trigger does not evaluate each change when it happens."
      fr: "Une règle personnalisée Lambda exige d'écrire et de maintenir une fonction, et un déclencheur périodique n'évalue pas chaque changement au moment où il se produit."
    c:
      en: "Managed conformance packs contain predefined rules and do not implement the company-specific combined condition."
      fr: "Les packs de conformité gérés contiennent des règles prédéfinies et ne mettent pas en œuvre la condition combinée propre à l'entreprise."
    d:
      en: "A workflow outside AWS Config adds code and orchestration to maintain and does not produce AWS Config compliance results."
      fr: "Un flux de travail hors d'AWS Config ajoute du code et une orchestration à maintenir, et ne produit pas de résultats de conformité AWS Config."
references:
  - title: Creating AWS Config Custom Policy Rules
    url: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config_develop-rules_cfn-guard.html
