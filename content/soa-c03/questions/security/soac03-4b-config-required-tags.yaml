id: soac03-4b-config-required-tags
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company classifies its data by applying a DataClassification tag to Amazon S3 buckets and Amazon RDS DB instances. The allowed values are Public, Internal, and Confidential. The compliance team needs a continuously updated list of the buckets and DB instances in the account that are missing the tag or that use another value. Existing resources must not be blocked or modified.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise classe ses données en appliquant une balise DataClassification aux compartiments Amazon S3 et aux instances de base de données Amazon RDS. Les valeurs autorisées sont Public, Internal et Confidential. L'équipe de conformité a besoin d'une liste mise à jour en continu des compartiments et des instances du compte qui n'ont pas la balise ou qui utilisent une autre valeur. Les ressources existantes ne doivent être ni bloquées ni modifiées.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Run a weekly Amazon Macie sensitive data discovery job that reports the buckets that do not have the DataClassification tag.", fr: "Exécuter chaque semaine une tâche de découverte de données sensibles Amazon Macie qui signale les compartiments sans balise DataClassification." }
    - id: b
      text: { en: "Deploy the AWS Config required-tags managed rule with tag1Key set to DataClassification and tag1Value set to Public,Internal,Confidential.", fr: "Déployer la règle gérée AWS Config required-tags avec tag1Key défini sur DataClassification et tag1Value défini sur Public,Internal,Confidential." }
    - id: c
      text: { en: "Attach an SCP that denies tagging requests whose DataClassification value is not one of the three allowed values.", fr: "Attacher une SCP qui refuse les requêtes de balisage dont la valeur DataClassification ne fait pas partie des trois valeurs autorisées." }
    - id: d
      text: { en: "Create an Amazon EventBridge rule for CreateBucket and CreateDBInstance events that invokes an AWS Lambda function to check the tags.", fr: "Créer une règle Amazon EventBridge pour les événements CreateBucket et CreateDBInstance qui appelle une fonction AWS Lambda chargée de vérifier les balises." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The required-tags managed rule checks whether resources have the specified tag keys and, optionally, one of the listed values (comma-separated). It supports AWS::S3::Bucket and AWS::RDS::DBInstance, is triggered by configuration changes, and only reports compliance without changing resources.
    fr: |
      La règle gérée required-tags vérifie que les ressources portent les clés de balise indiquées et, en option, l'une des valeurs listées (séparées par des virgules). Elle prend en charge AWS::S3::Bucket et AWS::RDS::DBInstance, se déclenche sur les modifications de configuration et se contente de signaler la conformité sans modifier les ressources.
  options:
    a:
      en: |
        Macie analyzes the content of S3 objects for sensitive data; it does not evaluate resource tags, and it does not cover RDS DB instances.
      fr: |
        Macie analyse le contenu des objets S3 à la recherche de données sensibles ; il n'évalue pas les balises des ressources et ne couvre pas les instances RDS.
    c:
      en: |
        An SCP blocks future requests; it does not list the existing noncompliant resources, and blocking is not wanted.
      fr: |
        Une SCP bloque les requêtes futures ; elle ne liste pas les ressources non conformes existantes, et le blocage n'est pas souhaité.
    d:
      en: |
        A custom function only sees new resources and tag changes made outside these events are missed, and the code must be written and maintained.
      fr: |
        Une fonction personnalisée ne voit que les nouvelles ressources, manque les modifications de balises faites hors de ces événements, et son code doit être écrit et maintenu.
references:
  - title: required-tags
    url: https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html
