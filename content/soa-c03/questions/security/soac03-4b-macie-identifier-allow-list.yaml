id: soac03-4b-macie-identifier-allow-list
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon Macie sensitive data discovery jobs to classify HR documents in Amazon S3. The documents contain internal badge numbers in the format BDG- followed by eight digits, which Macie does not report today. Every document footer also contains the company's published headquarters phone number, which creates thousands of findings. Macie must report the badge numbers and must stop reporting the headquarters number, while still reporting all other phone numbers.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise des tâches de découverte de données sensibles Amazon Macie pour classer des documents RH dans Amazon S3. Les documents contiennent des numéros de badge internes au format BDG- suivi de huit chiffres, que Macie ne signale pas aujourd'hui. Le pied de page de chaque document contient aussi le numéro de téléphone public du siège de l'entreprise, ce qui crée des milliers de résultats. Macie doit signaler les numéros de badge et ne plus signaler le numéro du siège, tout en continuant à signaler tous les autres numéros de téléphone.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Exclude the managed data identifier for phone numbers from the jobs that analyze the HR buckets.", fr: "Exclure l'identifiant de données géré pour les numéros de téléphone des tâches qui analysent les compartiments RH." } }
    - { id: b, text: { en: "Create an allow list of predefined text that contains the headquarters phone number, and use it in the jobs.", fr: "Créer une liste d'autorisation de texte prédéfini qui contient le numéro du siège, et l'utiliser dans les tâches." } }
    - { id: c, text: { en: "Create a findings filter that archives all SensitiveData:S3Object/Personal findings automatically.", fr: "Créer un filtre de résultats qui archive automatiquement tous les résultats SensitiveData:S3Object/Personal." } }
    - { id: d, text: { en: "Create a custom data identifier with a regular expression that matches BDG- followed by eight digits, and use it in the jobs.", fr: "Créer un identifiant de données personnalisé avec une expression régulière qui correspond à BDG- suivi de huit chiffres, et l'utiliser dans les tâches." } }
    - { id: e, text: { en: "Add an S3 object criterion to the jobs that excludes the files whose names contain the word footer.", fr: "Ajouter aux tâches un critère d'objet S3 qui exclut les fichiers dont le nom contient le mot footer." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A custom data identifier defines a regular expression for a proprietary pattern that the managed data identifiers do not detect. An allow list tells Macie to ignore specific text, even when it matches a managed or custom identifier; a predefined text list fits a fixed value such as one phone number, and other phone numbers are still reported.
    fr: |
      Un identifiant de données personnalisé définit une expression régulière pour un motif propriétaire que les identifiants de données gérés ne détectent pas. Une liste d'autorisation indique à Macie d'ignorer un texte précis, même s'il correspond à un identifiant géré ou personnalisé ; une liste de texte prédéfini convient à une valeur fixe comme un numéro de téléphone, et les autres numéros restent signalés.
  options:
    a:
      en: |
        Excluding the phone number identifier stops the reporting of all phone numbers, not only the headquarters number.
      fr: |
        Exclure l'identifiant des numéros de téléphone arrête le signalement de tous les numéros, pas seulement celui du siège.
    c:
      en: |
        This would archive every finding about personal data, including real phone numbers and other PII that must stay visible.
      fr: |
        Cela archiverait tous les résultats sur les données personnelles, y compris les vrais numéros et les autres données personnelles qui doivent rester visibles.
    e:
      en: |
        The phone number is inside every document, not in separate files, so an object criterion cannot remove it without skipping the documents.
      fr: |
        Le numéro se trouve dans chaque document, pas dans des fichiers séparés : un critère d'objet ne peut pas l'écarter sans ignorer les documents.
references:
  - title: Defining sensitive data exceptions with allow lists
    url: https://docs.aws.amazon.com/macie/latest/user/allow-lists.html
