id: soac03-4b-kms-cancel-deletion
objective: "4.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Two days ago, an administrator scheduled the deletion of a customer managed AWS KMS key with a 30-day waiting period by mistake. Applications that decrypt data with this key now fail. The company must make the key usable again for the existing encrypted data.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Il y a deux jours, un administrateur a planifié par erreur la suppression d'une clé AWS KMS gérée par le client avec une période d'attente de 30 jours. Les applications qui déchiffrent des données avec cette clé échouent désormais. L'entreprise doit rendre la clé de nouveau utilisable pour les données chiffrées existantes.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "aws kms enable-key-rotation --key-id <key-id>" }
    - { id: b, text: "aws kms cancel-key-deletion --key-id <key-id>" }
    - { id: c, text: { en: "Run aws kms create-key, then aws kms update-alias to point the alias to the new key.", fr: "Exécuter aws kms create-key, puis aws kms update-alias pour faire pointer l'alias vers la nouvelle clé." } }
    - { id: d, text: "aws kms enable-key --key-id <key-id>" }
    - { id: e, text: "aws kms import-key-material --key-id <key-id>" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A key pending deletion cannot be used in any cryptographic operation, and the deletion can be canceled until the waiting period ends. CancelKeyDeletion leaves the key in the Disabled state, so EnableKey is then needed before applications can use it again.
    fr: |
      Une clé en attente de suppression ne peut être utilisée dans aucune opération de chiffrement, et la suppression peut être annulée jusqu'à la fin de la période d'attente. CancelKeyDeletion laisse la clé à l'état Disabled : EnableKey est ensuite nécessaire pour que les applications puissent de nouveau l'utiliser.
  options:
    a:
      en: |
        Rotation changes the key material for future encryption; it does not cancel the deletion or enable the key.
      fr: |
        La rotation change le matériel de clé pour les chiffrements futurs ; elle n'annule pas la suppression et n'active pas la clé.
    c:
      en: |
        A new key cannot decrypt data that was encrypted under the original key.
      fr: |
        Une nouvelle clé ne peut pas déchiffrer les données chiffrées avec la clé d'origine.
    e:
      en: |
        Importing key material applies only to keys created with external key material, and it does not cancel a scheduled deletion.
      fr: |
        L'importation de matériel de clé ne concerne que les clés créées avec du matériel externe, et elle n'annule pas une suppression planifiée.
references:
  - title: Delete an AWS KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
  - title: CancelKeyDeletion
    url: https://docs.aws.amazon.com/kms/latest/APIReference/API_CancelKeyDeletion.html
