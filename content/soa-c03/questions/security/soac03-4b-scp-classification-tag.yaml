id: soac03-4b-scp-classification-tag
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations with all features enabled. Its data classification scheme requires every new Amazon RDS DB instance in the workload accounts to receive a DataClassification tag when it is created. The tag value must be Public, Internal, or Confidential, with exactly that capitalization. Any request that does not follow these rules must fail.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise AWS Organizations avec toutes les fonctionnalités activées. Son schéma de classification des données exige que chaque nouvelle instance de base de données Amazon RDS des comptes de charge de travail reçoive une balise DataClassification lors de sa création. La valeur de la balise doit être Public, Internal ou Confidential, avec exactement cette casse. Toute requête qui ne respecte pas ces règles doit échouer.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy the AWS Config required-tags managed rule with tag1Key set to DataClassification in every workload account.", fr: "Déployer la règle gérée AWS Config required-tags avec tag1Key défini sur DataClassification dans chaque compte de charge de travail." } }
    - { id: b, text: { en: "Attach an SCP that denies rds:CreateDBInstance when the aws:RequestTag/DataClassification condition key is null.", fr: "Attacher une SCP qui refuse rds:CreateDBInstance lorsque la clé de condition aws:RequestTag/DataClassification est nulle." } }
    - { id: c, text: { en: "Configure automatic remediation for the required-tags rule that runs the AWS-SetRequiredTags runbook.", fr: "Configurer une correction automatique pour la règle required-tags qui exécute le runbook AWS-SetRequiredTags." } }
    - { id: d, text: { en: "Use Tag Editor in AWS Resource Groups to add the tag to each DB instance after it is created.", fr: "Utiliser Tag Editor dans AWS Resource Groups pour ajouter la balise à chaque instance de base de données après sa création." } }
    - { id: e, text: { en: "Attach a tag policy that defines the DataClassification key and its allowed values, and enforce it for RDS DB instances.", fr: "Attacher une politique de balises qui définit la clé DataClassification et ses valeurs autorisées, et l'appliquer (enforce) aux instances de base de données RDS." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Tag policies standardize tag keys, their capitalization and their allowed values, and enforcement blocks noncompliant tagging requests on the specified resource types. A tag policy does not evaluate untagged resources, so an SCP with a Null condition on aws:RequestTag/DataClassification is needed to deny DB instance creation without the tag. Together they reject both a missing tag and a wrong value.
    fr: |
      Les politiques de balises normalisent les clés de balise, leur casse et leurs valeurs autorisées, et leur application (enforcement) bloque les requêtes de balisage non conformes sur les types de ressources indiqués. Une politique de balises n'évalue pas les ressources sans balise : une SCP avec une condition Null sur aws:RequestTag/DataClassification est donc nécessaire pour refuser la création d'une instance sans la balise. Ensemble, elles rejettent une balise absente comme une valeur incorrecte.
  options:
    a:
      en: |
        The required-tags rule only reports noncompliant resources after they exist; it does not make the creation request fail.
      fr: |
        La règle required-tags signale seulement les ressources non conformes une fois créées ; elle ne fait pas échouer la requête de création.
    c:
      en: |
        Remediation acts after creation instead of rejecting the request, and the AWS Config documentation states that AWS-SetRequiredTags does not work as a remediation for the required-tags rule.
      fr: |
        La correction intervient après la création au lieu de rejeter la requête, et la documentation AWS Config indique qu'AWS-SetRequiredTags ne fonctionne pas comme correction de la règle required-tags.
    d:
      en: |
        Tag Editor is a manual tool used after creation; it cannot make noncompliant requests fail.
      fr: |
        Tag Editor est un outil manuel utilisé après la création ; il ne peut pas faire échouer les requêtes non conformes.
references:
  - title: Tag policies
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html
  - title: required-tags
    url: https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html
