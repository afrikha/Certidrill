id: soac03-4b-ps-reference-secret
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Legacy shell scripts on Amazon EC2 instances read their configuration only with the aws ssm get-parameter command. The database credentials that the scripts need are now stored in an AWS Secrets Manager secret named prod/db with automatic rotation. The scripts must always get the current credentials, and the credentials must not be copied into Parameter Store.

    Which solution will meet these requirements?
  fr: |
    D'anciens scripts shell sur des instances Amazon EC2 ne lisent leur configuration qu'avec la commande aws ssm get-parameter. Les informations d'identification de base de données dont les scripts ont besoin sont désormais stockées dans un secret AWS Secrets Manager nommé prod/db avec rotation automatique. Les scripts doivent toujours obtenir les informations d'identification actuelles, et celles-ci ne doivent pas être copiées dans Parameter Store.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a SecureString parameter with the secret value, and update it from a Lambda function after each rotation.", fr: "Créer un paramètre SecureString avec la valeur du secret, et le mettre à jour depuis une fonction Lambda après chaque rotation." }
    - id: b
      text: { en: "Call aws ssm get-parameters-by-path with the path /aws/reference/secretsmanager/ and the --recursive option.", fr: "Appeler aws ssm get-parameters-by-path avec le chemin /aws/reference/secretsmanager/ et l'option --recursive." }
    - id: c
      text: { en: "Call aws ssm get-parameter with the name /aws/reference/secretsmanager/prod/db and the --with-decryption option.", fr: "Appeler aws ssm get-parameter avec le nom /aws/reference/secretsmanager/prod/db et l'option --with-decryption." }
    - id: d
      text: { en: "Share the secret with Parameter Store through AWS Resource Access Manager (AWS RAM).", fr: "Partager le secret avec Parameter Store par AWS Resource Access Manager (AWS RAM)." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Parameter Store can pass a request through to Secrets Manager when the parameter name starts with the reserved path /aws/reference/secretsmanager/. The scripts keep using get-parameter, as in the documented examples with --with-decryption, and receive the current secret value without any copy in Parameter Store.
    fr: |
      Parameter Store peut relayer une requête vers Secrets Manager lorsque le nom du paramètre commence par le chemin réservé /aws/reference/secretsmanager/. Les scripts continuent d'utiliser get-parameter, avec --with-decryption comme dans les exemples documentés, et reçoivent la valeur actuelle du secret sans aucune copie dans Parameter Store.
  options:
    a:
      en: |
        This copies the credentials into Parameter Store, which is forbidden, and adds code to maintain.
      fr: |
        Cela copie les informations d'identification dans Parameter Store, ce qui est interdit, et ajoute du code à maintenir.
    b:
      en: |
        References to Secrets Manager secrets work only with GetParameter and GetParameters; GetParametersByPath is not supported.
      fr: |
        Les références aux secrets Secrets Manager ne fonctionnent qu'avec GetParameter et GetParameters ; GetParametersByPath n'est pas pris en charge.
    d:
      en: |
        Parameter Store is not a principal that resources can be shared with; the reserved path is the documented integration.
      fr: |
        Parameter Store n'est pas un principal avec lequel partager des ressources ; le chemin réservé est l'intégration documentée.
references:
  - title: Referencing AWS Secrets Manager secrets from Parameter Store parameters
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/integration-ps-secretsmanager.html
