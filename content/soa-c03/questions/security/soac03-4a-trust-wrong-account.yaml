id: soac03-4a-trust-wrong-account
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CloudOps engineer uses an IAM user in account 111122223333. The user's identity-based policy allows sts:AssumeRole on arn:aws:iam::444455556666:role/AuditRead. Every attempt to assume the role fails with an AccessDenied error. The role has the following trust policy.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam::444455556666:root" },
          "Action": "sts:AssumeRole"
        }
      ]
    }
    ```

    What should the engineer change so that the user can assume the role?
  fr: |
    Un ingénieur CloudOps utilise un utilisateur IAM du compte 111122223333. La politique basée sur l'identité de l'utilisateur autorise sts:AssumeRole sur arn:aws:iam::444455556666:role/AuditRead. Chaque tentative d'endosser le rôle échoue avec une erreur AccessDenied. Le rôle a la politique d'approbation suivante.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam::444455556666:root" },
          "Action": "sts:AssumeRole"
        }
      ]
    }
    ```

    Que doit modifier l'ingénieur pour que l'utilisateur puisse endosser le rôle ?
body:
  options:
    - { id: a, text: { en: "Attach a permissions policy to AuditRead that allows sts:AssumeRole for principals of account 111122223333.", fr: "Attacher à AuditRead une politique d'autorisations qui autorise sts:AssumeRole pour les principaux du compte 111122223333." } }
    - { id: b, text: { en: "Add an SCP to account 111122223333 that allows sts:AssumeRole on the AuditRead role.", fr: "Ajouter au compte 111122223333 une SCP qui autorise sts:AssumeRole sur le rôle AuditRead." } }
    - { id: c, text: { en: "Change the Principal of the trust policy to the account 111122223333 or to the ARN of the engineer's IAM user.", fr: "Remplacer le Principal de la politique d'approbation par le compte 111122223333 ou par l'ARN de l'utilisateur IAM de l'ingénieur." } }
    - { id: d, text: { en: "Change the user's identity-based policy to allow sts:AssumeRole on all resources.", fr: "Modifier la politique basée sur l'identité de l'utilisateur pour autoriser sts:AssumeRole sur toutes les ressources." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A cross-account role assumption must be allowed on both sides: by the caller's identity-based policy and by the role's trust policy. The trust policy trusts only account 444455556666, so the user of account 111122223333 is denied until that account or the user is named as a principal."
    fr: "Un endossement de rôle intercompte doit être autorisé des deux côtés : par la politique basée sur l'identité de l'appelant et par la politique d'approbation du rôle. La politique d'approbation n'approuve que le compte 444455556666 : l'utilisateur du compte 111122223333 est refusé tant que ce compte ou l'utilisateur n'est pas désigné comme principal."
  options:
    a:
      en: "Permissions policies of the role define what the role can do after it is assumed; who can assume it is defined only in the trust policy."
      fr: "Les politiques d'autorisations du rôle définissent ce que le rôle peut faire une fois endossé ; qui peut l'endosser se définit uniquement dans la politique d'approbation."
    b:
      en: "SCPs never grant permissions, and the user's own policy already allows the action."
      fr: "Les SCP n'accordent jamais d'autorisations, et la politique de l'utilisateur autorise déjà l'action."
    d:
      en: "The user's side already allows the call on this role; widening the resource does not change the trust policy that denies it."
      fr: "Du côté de l'utilisateur, l'appel est déjà autorisé sur ce rôle ; élargir la ressource ne change pas la politique d'approbation qui le refuse."
references:
  - title: Troubleshoot access denied error messages
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html
