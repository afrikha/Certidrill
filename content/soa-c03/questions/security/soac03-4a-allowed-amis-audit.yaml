id: soac03-4a-allowed-amis-audit
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants users in an account to discover and launch Amazon EC2 instances only from AMIs that are published by its image-build account (777788889999) or by Amazon. Before any launch is blocked, the CloudOps team must see which of the AMIs that teams currently use would not be allowed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise veut que les utilisateurs d'un compte ne puissent découvrir et lancer des instances Amazon EC2 qu'à partir d'AMI publiées par son compte de création d'images (777788889999) ou par Amazon. Avant de bloquer le moindre lancement, l'équipe CloudOps doit voir lesquelles des AMI actuellement utilisées par les équipes ne seraient pas autorisées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable Allowed AMIs in the enabled state with image providers 777788889999 and amazon, and review which launches fail.", fr: "Activer Allowed AMIs à l'état activé avec les fournisseurs d'images 777788889999 et amazon, puis examiner quels lancements échouent." } }
    - { id: b, text: { en: "Enable block public access for AMIs in the account and review the AMIs that are still shared.", fr: "Activer le blocage de l'accès public aux AMI dans le compte et examiner les AMI encore partagées." } }
    - { id: c, text: { en: "Enable Allowed AMIs in audit mode with image providers 777788889999 and amazon, and review the AMIs that are reported as not allowed.", fr: "Activer Allowed AMIs en mode audit avec les fournisseurs d'images 777788889999 et amazon, puis examiner les AMI signalées comme non autorisées." } }
    - { id: d, text: { en: "Attach an SCP that denies ec2:RunInstances unless the ec2:Owner condition key matches 777788889999 or amazon.", fr: "Attacher une SCP qui refuse ec2:RunInstances sauf si la clé de condition ec2:Owner correspond à 777788889999 ou amazon." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In audit mode, Allowed AMIs evaluates the image criteria without restricting anything: the console and describe-images show whether each AMI is allowed. After reviewing the results (and the ec2-instance-launched-with-allowed-ami Config rule for existing instances), the team can switch the setting to enabled."
    fr: "En mode audit, Allowed AMIs évalue les critères d'images sans rien restreindre : la console et describe-images indiquent si chaque AMI est autorisée. Après examen des résultats (et de la règle Config ec2-instance-launched-with-allowed-ami pour les instances existantes), l'équipe peut passer le paramètre à l'état activé."
  options:
    a:
      en: "The enabled state immediately blocks discovery and launches from AMIs that do not match, which the team wants to avoid before the review."
      fr: "L'état activé bloque immédiatement la découverte et les lancements à partir d'AMI non conformes, ce que l'équipe veut éviter avant l'examen."
    b:
      en: "Block public access for AMIs prevents the account's own AMIs from being shared publicly; it does not limit which AMIs can be launched."
      fr: "Le blocage de l'accès public aux AMI empêche le partage public des AMI du compte ; il ne limite pas les AMI qui peuvent être lancées."
    d:
      en: "The SCP blocks launches immediately and gives no report of the AMIs that would be affected."
      fr: "La SCP bloque immédiatement les lancements et ne fournit aucun rapport des AMI concernées."
references:
  - title: Control the discovery and use of AMIs in Amazon EC2 with Allowed AMIs
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-allowed-amis.html
