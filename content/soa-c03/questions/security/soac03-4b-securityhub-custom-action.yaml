id: soac03-4b-securityhub-custom-action
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Security analysts review findings in the AWS Security Hub CSPM console. An existing AWS Lambda function turns on S3 Block Public Access for a bucket. The analysts want to select specific findings about public S3 buckets in the console and run the function for those findings only, after they confirm that each bucket must not be public.

    Which solution will meet these requirements?
  fr: |
    Des analystes de sécurité examinent les résultats dans la console AWS Security Hub CSPM. Une fonction AWS Lambda existante active S3 Block Public Access pour un compartiment. Les analystes veulent sélectionner dans la console certains résultats sur des compartiments S3 publics et exécuter la fonction pour ces résultats uniquement, après avoir confirmé que chaque compartiment ne doit pas être public.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an EventBridge rule for Security Hub Findings - Imported events about public buckets, with the function as the target.", fr: "Créer une règle EventBridge pour les événements Security Hub Findings - Imported sur les compartiments publics, avec la fonction comme cible." }
    - id: b
      text: { en: "Create a custom action, and an EventBridge rule for Security Hub Findings - Custom Action events with that action's ARN, with the function as the target.", fr: "Créer une action personnalisée, et une règle EventBridge pour les événements Security Hub Findings - Custom Action avec l'ARN de cette action, avec la fonction comme cible." }
    - id: c
      text: { en: "Create an automation rule that matches findings about public buckets, with an action that invokes the function.", fr: "Créer une règle d'automatisation qui correspond aux résultats sur les compartiments publics, avec une action qui appelle la fonction." }
    - id: d
      text: { en: "Configure automatic remediation for the AWS Config rule s3-bucket-public-read-prohibited with the AWS-DisableS3BucketPublicReadWrite runbook.", fr: "Configurer une correction automatique pour la règle AWS Config s3-bucket-public-read-prohibited avec le runbook AWS-DisableS3BucketPublicReadWrite." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A custom action lets analysts send selected findings to Amazon EventBridge on demand. Security Hub CSPM emits a Security Hub Findings - Custom Action event, and an EventBridge rule that matches the custom action's ARN invokes the function, for example to run an automated remediation.
    fr: |
      Une action personnalisée permet aux analystes d'envoyer à la demande des résultats sélectionnés vers Amazon EventBridge. Security Hub CSPM émet un événement Security Hub Findings - Custom Action, et une règle EventBridge qui correspond à l'ARN de l'action personnalisée appelle la fonction, par exemple pour exécuter une correction automatisée.
  options:
    a:
      en: |
        Security Hub CSPM sends every new and updated finding as an Imported event automatically, so the function would run without the analysts' review.
      fr: |
        Security Hub CSPM envoie automatiquement chaque résultat nouveau ou mis à jour sous forme d'événement Imported : la fonction s'exécuterait sans l'examen des analystes.
    c:
      en: |
        Automation rule actions only update finding fields such as severity, workflow status or notes; they do not invoke functions.
      fr: |
        Les actions des règles d'automatisation ne font que mettre à jour des champs de résultat comme la gravité, l'état de flux de travail ou les notes ; elles n'appellent pas de fonctions.
    d:
      en: |
        Automatic remediation runs for every noncompliant bucket without the analysts' review, and it does not start from the findings that they select.
      fr: |
        La correction automatique s'exécute pour chaque compartiment non conforme sans l'examen des analystes, et elle ne part pas des résultats qu'ils sélectionnent.
references:
  - title: Using custom actions to send findings and insight results to EventBridge
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cwe-custom-actions.html
  - title: EventBridge event formats for Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-cwe-event-formats.html
