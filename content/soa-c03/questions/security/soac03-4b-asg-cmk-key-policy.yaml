id: soac03-4b-asg-cmk-key-policy
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company updated the launch template of an Auto Scaling group so that the instances' Amazon EBS volumes are encrypted with a new customer managed AWS KMS key in the same account. The key was created with a key policy that grants access only to the key administrators and to IAM policies in the account. Since the change, the Auto Scaling group cannot launch any instance, although an administrator can launch an instance manually from the same launch template.

    Which solution will resolve the issue?
  fr: |
    Une entreprise a mis à jour le modèle de lancement d'un Auto Scaling group afin que les volumes Amazon EBS des instances soient chiffrés avec une nouvelle clé AWS KMS gérée par le client du même compte. La clé a été créée avec une politique de clé qui donne accès uniquement aux administrateurs de la clé et aux politiques IAM du compte. Depuis la modification, l'Auto Scaling group ne parvient à lancer aucune instance, alors qu'un administrateur peut lancer une instance manuellement à partir du même modèle de lancement.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add kms:Decrypt and kms:GenerateDataKey permissions for the key to the IAM role of the instance profile in the launch template.", fr: "Ajouter les autorisations kms:Decrypt et kms:GenerateDataKey pour la clé au rôle IAM du profil d'instance du modèle de lancement." }
    - id: b
      text: { en: "Enable EBS encryption by default in the Region, and set the customer managed key as the default encryption key.", fr: "Activer le chiffrement EBS par défaut dans la Région, et définir la clé gérée par le client comme clé de chiffrement par défaut." }
    - id: c
      text: { en: "Add key policy statements that let the AWSServiceRoleForAutoScaling service-linked role use the key and create grants for AWS resources.", fr: "Ajouter des instructions à la politique de clé qui permettent au rôle lié à un service AWSServiceRoleForAutoScaling d'utiliser la clé et de créer des octrois (grants) pour des ressources AWS." }
    - id: d
      text: { en: "Attach a customer managed IAM policy that allows the KMS actions on the key to the AWSServiceRoleForAutoScaling role.", fr: "Attacher au rôle AWSServiceRoleForAutoScaling une politique IAM gérée par le client qui autorise les actions KMS sur la clé." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Amazon EC2 Auto Scaling launches instances with its service-linked role, whose predefined permissions cover AWS managed keys but not customer managed keys. The key policy must allow the role to use the key (Encrypt, Decrypt, ReEncrypt*, GenerateDataKey*, DescribeKey) and to call kms:CreateGrant with the kms:GrantIsForAWSResource condition.
    fr: |
      Amazon EC2 Auto Scaling lance les instances avec son rôle lié à un service, dont les autorisations prédéfinies couvrent les clés gérées par AWS mais pas les clés gérées par le client. La politique de clé doit autoriser ce rôle à utiliser la clé (Encrypt, Decrypt, ReEncrypt*, GenerateDataKey*, DescribeKey) et à appeler kms:CreateGrant avec la condition kms:GrantIsForAWSResource.
  options:
    a:
      en: |
        The instance profile is used by software on the instance after launch; the volumes are created and attached by Auto Scaling with its service-linked role.
      fr: |
        Le profil d'instance est utilisé par les logiciels de l'instance après le lancement ; les volumes sont créés et attachés par Auto Scaling avec son rôle lié à un service.
    b:
      en: |
        Changing the default key does not give the Auto Scaling service-linked role permission to use the customer managed key.
      fr: |
        Changer la clé par défaut ne donne pas au rôle lié à un service d'Auto Scaling l'autorisation d'utiliser la clé gérée par le client.
    d:
      en: |
        The permissions of a service-linked role are defined by the service and cannot be extended with your own policies; access to the key is granted in the key policy.
      fr: |
        Les autorisations d'un rôle lié à un service sont définies par le service et ne peuvent pas être étendues avec vos propres politiques ; l'accès à la clé s'accorde dans la politique de clé.
references:
  - title: Required AWS KMS key policy for use with encrypted volumes
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/key-policy-requirements-EBS-encryption.html
