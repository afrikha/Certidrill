id: soac03-4a-access-key-rotation
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An on-premises backup job uploads files to Amazon S3 by using the access key of an IAM user. Company policy requires the access key to be rotated every 90 days. The backup job must not fail during the rotation.

    Which sequence of actions should the CloudOps engineer follow?
  fr: |
    Une tâche de sauvegarde sur site charge des fichiers dans Amazon S3 à l'aide de la clé d'accès d'un utilisateur IAM. La politique de l'entreprise exige une rotation de la clé d'accès tous les 90 jours. La tâche de sauvegarde ne doit pas échouer pendant la rotation.

    Quelle séquence d'actions l'ingénieur CloudOps doit-il suivre ?
body:
  options:
    - { id: a, text: { en: "Deactivate the old key, create a new access key, update the job to use the new key, then delete the old key.", fr: "Désactiver l'ancienne clé, créer une nouvelle clé d'accès, mettre à jour la tâche pour qu'elle utilise la nouvelle clé, puis supprimer l'ancienne clé." } }
    - { id: b, text: { en: "Create a second access key, update the job to use it, deactivate the old key, confirm that the job works, then delete the old key.", fr: "Créer une deuxième clé d'accès, mettre à jour la tâche pour qu'elle l'utilise, désactiver l'ancienne clé, vérifier que la tâche fonctionne, puis supprimer l'ancienne clé." } }
    - { id: c, text: { en: "Delete the old key, create a new access key, then update the job to use the new key.", fr: "Supprimer l'ancienne clé, créer une nouvelle clé d'accès, puis mettre à jour la tâche pour qu'elle utilise la nouvelle clé." } }
    - { id: d, text: { en: "Create a second access key, delete the old key, then update the job to use the new key.", fr: "Créer une deuxième clé d'accès, supprimer l'ancienne clé, puis mettre à jour la tâche pour qu'elle utilise la nouvelle clé." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An IAM user can have two access keys, which allows rotation without interruption: create the second key, switch the job to it, deactivate the old key (it can be reactivated if something still uses it), check the job and the key's last-used information, and only then delete the old key."
    fr: "Un utilisateur IAM peut avoir deux clés d'accès, ce qui permet une rotation sans interruption : créer la deuxième clé, basculer la tâche dessus, désactiver l'ancienne clé (elle peut être réactivée si quelque chose l'utilise encore), vérifier la tâche et les informations de dernière utilisation de la clé, puis seulement supprimer l'ancienne clé."
  options:
    a:
      en: "Deactivating the old key before the job uses a new key makes the job fail until it is updated."
      fr: "Désactiver l'ancienne clé avant que la tâche utilise une nouvelle clé fait échouer la tâche jusqu'à sa mise à jour."
    c:
      en: "Deleting the old key first breaks the job immediately, and a deleted key cannot be restored if the update fails."
      fr: "Supprimer d'abord l'ancienne clé casse immédiatement la tâche, et une clé supprimée ne peut pas être restaurée si la mise à jour échoue."
    d:
      en: "The old key is deleted while the job still uses it, so the job fails until it is updated."
      fr: "L'ancienne clé est supprimée alors que la tâche l'utilise encore : la tâche échoue jusqu'à sa mise à jour."
references:
  - title: Update access keys
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id-credentials-access-keys-update.html
