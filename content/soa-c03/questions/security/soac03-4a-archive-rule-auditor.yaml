id: soac03-4a-archive-rule-auditor
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an IAM Access Analyzer external access analyzer with the organization as the zone of trust. An external auditing firm's account (999988887777) is intentionally granted read access to several Amazon S3 buckets and AWS KMS keys, which has created many active findings. The security team wants the current and future findings for this account to stop appearing as active. Findings that grant public access must stay active.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un analyseur d'accès externe IAM Access Analyzer dont la zone de confiance est l'organisation. Le compte d'un cabinet d'audit externe (999988887777) reçoit volontairement un accès en lecture à plusieurs compartiments Amazon S3 et clés AWS KMS, ce qui a créé de nombreux résultats actifs. L'équipe de sécurité veut que les résultats actuels et futurs pour ce compte n'apparaissent plus comme actifs. Les résultats qui accordent un accès public doivent rester actifs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an archive rule with the principal account 999988887777 and Public access set to false as criteria, and choose Create rule.", fr: "Créer une règle d'archivage avec comme critères le compte principal 999988887777 et Public access défini sur false, puis choisir Create rule." } }
    - { id: b, text: { en: "Create an archive rule with the principal account 999988887777 and Public access set to false as criteria, and choose Create and archive active findings.", fr: "Créer une règle d'archivage avec comme critères le compte principal 999988887777 et Public access défini sur false, puis choisir Create and archive active findings." } }
    - { id: c, text: { en: "Add the account 999988887777 to the zone of trust of the existing analyzer.", fr: "Ajouter le compte 999988887777 à la zone de confiance de l'analyseur existant." } }
    - { id: d, text: { en: "Replace the analyzer with one analyzer per member account that uses the account as the zone of trust.", fr: "Remplacer l'analyseur par un analyseur par compte membre qui utilise le compte comme zone de confiance." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Archive rules automatically archive new findings that match their criteria, and Create and archive active findings also archives the existing active findings that match. Adding Public access set to false ensures that findings granting public access are never archived by the rule."
    fr: "Les règles d'archivage archivent automatiquement les nouveaux résultats qui correspondent à leurs critères, et Create and archive active findings archive aussi les résultats actifs existants qui correspondent. Ajouter Public access défini sur false garantit que la règle n'archive jamais les résultats qui accordent un accès public."
  options:
    a:
      en: "Create rule applies only to new findings, so the existing active findings for the auditor's account would remain active."
      fr: "Create rule ne s'applique qu'aux nouveaux résultats : les résultats actifs existants pour le compte de l'auditeur resteraient actifs."
    c:
      en: "The zone of trust is either the organization or the account; an external account cannot be added to it."
      fr: "La zone de confiance est soit l'organisation, soit le compte ; on ne peut pas y ajouter un compte externe."
    d:
      en: "Account-level analyzers still treat the auditor's account as external and also report sharing between the company's own accounts, which adds findings."
      fr: "Des analyseurs au niveau du compte considèrent toujours le compte de l'auditeur comme externe et signalent en plus le partage entre les comptes de l'entreprise, ce qui ajoute des résultats."
references:
  - title: Archive rules
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-archive-rules.html
