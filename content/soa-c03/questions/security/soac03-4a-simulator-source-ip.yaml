id: soac03-4a-simulator-source-ip
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CloudOps engineer has written a new identity-based policy for a reporting role. Before attaching it, the engineer must confirm that the policy allows s3:GetObject on the reports bucket only for requests from the 198.51.100.0/24 address range. No real request may be sent to Amazon S3 during the test.

    Which tool should the engineer use?
  fr: |
    Un ingénieur CloudOps a rédigé une nouvelle politique basée sur l'identité pour un rôle de reporting. Avant de l'attacher, l'ingénieur doit vérifier que la politique n'autorise s3:GetObject sur le compartiment des rapports que pour les requêtes provenant de la plage d'adresses 198.51.100.0/24. Aucune requête réelle ne doit être envoyée à Amazon S3 pendant le test.

    Quel outil l'ingénieur doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "The IAM Access Analyzer External Access check in AWS Trusted Advisor, refreshed after the policy is attached.", fr: "La vérification IAM Access Analyzer External Access d'AWS Trusted Advisor, actualisée après l'attachement de la politique." } }
    - { id: b, text: { en: "IAM Access Analyzer policy generation, based on the CloudTrail events of the reporting role.", fr: "La génération de politiques d'IAM Access Analyzer, à partir des événements CloudTrail du rôle de reporting." } }
    - { id: c, text: { en: "CloudTrail Event history, filtered on the GetObject event name for the reports bucket.", fr: "L'historique des événements CloudTrail, filtré sur le nom d'événement GetObject pour le compartiment des rapports." } }
    - { id: d, text: { en: "The IAM policy simulator, with the policy pasted in custom mode and an aws:SourceIp value for each test.", fr: "Le simulateur de politiques IAM, avec la politique collée en mode personnalisé et une valeur aws:SourceIp pour chaque test." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The policy simulator evaluates policies that are not yet attached and reports whether each action is allowed or denied, without sending requests to the service. The engineer supplies context key values such as the source IP address to test the condition from inside and outside the range."
    fr: "Le simulateur de politiques évalue des politiques non encore attachées et indique si chaque action est autorisée ou refusée, sans envoyer de requêtes au service. L'ingénieur fournit des valeurs de clés de contexte comme l'adresse IP source pour tester la condition depuis l'intérieur et l'extérieur de la plage."
  options:
    a:
      en: "This Trusted Advisor check reports resources shared outside the account; it does not test identity-based policies."
      fr: "Cette vérification Trusted Advisor signale des ressources partagées hors du compte ; elle ne teste pas les politiques basées sur l'identité."
    b:
      en: "Policy generation creates a policy from past activity; it does not test the decision of a policy that was already written."
      fr: "La génération de politiques crée une politique à partir de l'activité passée ; elle ne teste pas la décision d'une politique déjà rédigée."
    c:
      en: "Event history shows past management events; it cannot evaluate a policy that is not attached, and GetObject is a data event."
      fr: "L'historique des événements montre les événements de gestion passés ; il ne peut pas évaluer une politique non attachée, et GetObject est un événement de données."
references:
  - title: IAM policy testing with the IAM policy simulator
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_testing-policies.html
