id: soac03-4b-guardduty-severity-pattern
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's GuardDuty delegated administrator account has an Amazon EventBridge rule that sends findings to an SNS topic for the on-call team. The team must be notified of every finding with high or critical severity from all member accounts. Some findings with severities such as 7.5 and 8.9 never reach the team, although findings with a severity of exactly 8 do. The rule uses the following event pattern:

    ```json
    {
      "source": ["aws.guardduty"],
      "detail-type": ["GuardDuty Finding"],
      "detail": {
        "severity": [7, 8, 9]
      }
    }
    ```

    Which change will meet the requirement?
  fr: |
    Le compte administrateur délégué GuardDuty d'une entreprise possède une règle Amazon EventBridge qui envoie les résultats vers une rubrique SNS pour l'équipe d'astreinte. L'équipe doit être notifiée de chaque résultat de gravité élevée ou critique de tous les comptes membres. Certains résultats de gravité 7.5 ou 8.9, par exemple, ne parviennent jamais à l'équipe, alors que les résultats de gravité exactement égale à 8 arrivent. La règle utilise le modèle d'événement suivant :

    ```json
    {
      "source": ["aws.guardduty"],
      "detail-type": ["GuardDuty Finding"],
      "detail": {
        "severity": [7, 8, 9]
      }
    }
    ```

    Quelle modification répond à l'exigence ?
body:
  options:
    - id: a
      text: { en: "Replace the severity values with a numeric matching condition: [{\"numeric\": [\">=\", 7]}].", fr: "Remplacer les valeurs de gravité par une condition de correspondance numérique : [{\"numeric\": [\">=\", 7]}]." }
    - id: b
      text: { en: "Add aws.securityhub to the source list so that the rule also receives the GuardDuty findings imported into Security Hub CSPM.", fr: "Ajouter aws.securityhub à la liste source afin que la règle reçoive aussi les résultats GuardDuty importés dans Security Hub CSPM." }
    - id: c
      text: { en: "Change the GuardDuty findings export frequency for updated findings to 15 minutes.", fr: "Passer à 15 minutes la fréquence d'exportation des résultats GuardDuty mis à jour." }
    - id: d
      text: { en: "Create the same rule in each member account so that their findings reach the topic directly.", fr: "Créer la même règle dans chaque compte membre afin que leurs résultats atteignent directement la rubrique." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      GuardDuty severity is a number from 1.0 to 10.0; High is 7.0 to 8.9 and Critical is 9.0 to 10.0. A list of values matches only those exact values, so 7.5 or 8.9 never match. An EventBridge numeric matching condition such as >= 7 matches every high and critical finding.
    fr: |
      La gravité GuardDuty est un nombre de 1.0 à 10.0 ; High va de 7.0 à 8.9 et Critical de 9.0 à 10.0. Une liste de valeurs ne correspond qu'à ces valeurs exactes : 7.5 ou 8.9 ne correspondent jamais. Une condition de correspondance numérique EventBridge comme >= 7 correspond à tous les résultats de gravité élevée et critique.
  options:
    b:
      en: |
        Security Hub CSPM events have a different source and format, and the GuardDuty rule would still filter on exact severity values.
      fr: |
        Les événements Security Hub CSPM ont une autre source et un autre format, et la règle GuardDuty filtrerait toujours sur des valeurs de gravité exactes.
    c:
      en: |
        The frequency affects how often subsequent occurrences are aggregated and sent; it does not change which severities the pattern matches.
      fr: |
        La fréquence agit sur l'agrégation et l'envoi des occurrences suivantes ; elle ne change pas les gravités auxquelles le modèle correspond.
    d:
      en: |
        Rules in the administrator account already receive member findings, and copies of the same pattern would miss the same severities.
      fr: |
        Les règles du compte administrateur reçoivent déjà les résultats des membres, et des copies du même modèle manqueraient les mêmes gravités.
references:
  - title: Processing GuardDuty findings with Amazon EventBridge
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
  - title: Severity levels of GuardDuty findings
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings-severity.html
