id: soac03-4a-event-history-terminate
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon EC2 instance in the eu-west-1 Region was terminated yesterday. The company has never created a CloudTrail trail or event data store. The operations manager wants to know which IAM principal terminated the instance.

    Which solution will provide this information?
  fr: |
    Une instance Amazon EC2 de la Région eu-west-1 a été résiliée hier. L'entreprise n'a jamais créé de journal de suivi (trail) CloudTrail ni de magasin de données d'événements. Le responsable des opérations veut savoir quel principal IAM a résilié l'instance.

    Quelle solution fournit cette information ?
body:
  options:
    - { id: a, text: { en: "Review the VPC Flow Logs of the instance's subnet for the last connection before the termination.", fr: "Examiner les journaux de flux VPC du sous-réseau de l'instance pour trouver la dernière connexion avant la résiliation." } }
    - { id: b, text: { en: "Create a CloudTrail trail in eu-west-1 and query its log files in Amazon S3 with Amazon Athena.", fr: "Créer un journal de suivi CloudTrail dans eu-west-1 et interroger ses fichiers journaux dans Amazon S3 avec Amazon Athena." } }
    - { id: c, text: { en: "Generate an IAM credential report and check which access keys were last used yesterday.", fr: "Générer un rapport d'informations d'identification IAM et vérifier quelles clés d'accès ont été utilisées pour la dernière fois hier." } }
    - { id: d, text: { en: "Search CloudTrail Event history in eu-west-1 for the TerminateInstances event of the instance.", fr: "Rechercher dans l'historique des événements CloudTrail d'eu-west-1 l'événement TerminateInstances de l'instance." } }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudTrail Event history is available without any configuration and shows the management events of the last 90 days in the Region where they occurred. The TerminateInstances event shows the identity that made the call."
    fr: "L'historique des événements CloudTrail est disponible sans aucune configuration et présente les événements de gestion des 90 derniers jours dans la Région où ils se sont produits. L'événement TerminateInstances indique l'identité qui a effectué l'appel."
  options:
    a:
      en: "Flow logs record network traffic, not API calls, and they are not enabled by default."
      fr: "Les journaux de flux enregistrent le trafic réseau, pas les appels d'API, et ils ne sont pas activés par défaut."
    b:
      en: "A new trail records only events that occur after it is created, so yesterday's call would not be in its log files."
      fr: "Un nouveau journal de suivi n'enregistre que les événements postérieurs à sa création : l'appel d'hier ne figurerait pas dans ses fichiers journaux."
    c:
      en: "The credential report shows when keys were last used, not which API calls they made, and the caller might have used a role."
      fr: "Le rapport d'informations d'identification indique la dernière utilisation des clés, pas les appels d'API effectués, et l'appelant a pu utiliser un rôle."
references:
  - title: Working with CloudTrail event history
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
