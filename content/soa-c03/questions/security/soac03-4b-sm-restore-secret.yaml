id: soac03-4b-sm-restore-secret
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Three days ago, an engineer deleted an AWS Secrets Manager secret with a 30-day recovery window. An application that still uses the secret now fails to retrieve it. The company must restore access to the same secret, with the same ARN and value, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Il y a trois jours, un ingénieur a supprimé un secret AWS Secrets Manager avec une fenêtre de récupération de 30 jours. Une application qui utilise encore le secret ne parvient plus à le récupérer. L'entreprise doit rétablir l'accès au même secret, avec le même ARN et la même valeur, avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a new secret with the same name and the previous value by running aws secretsmanager create-secret.", fr: "Créer un nouveau secret avec le même nom et l'ancienne valeur en exécutant aws secretsmanager create-secret." }
    - id: b
      text: { en: "Run aws secretsmanager put-secret-value to write the previous value as a new AWSCURRENT version.", fr: "Exécuter aws secretsmanager put-secret-value pour écrire l'ancienne valeur dans une nouvelle version AWSCURRENT." }
    - id: c
      text: { en: "Run aws kms cancel-key-deletion on the KMS key that encrypts the secret.", fr: "Exécuter aws kms cancel-key-deletion sur la clé KMS qui chiffre le secret." }
    - id: d
      text: { en: "Run aws secretsmanager restore-secret for the secret.", fr: "Exécuter aws secretsmanager restore-secret pour le secret." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A deleted secret is scheduled for deletion after a recovery window of 7 to 30 days, and its value cannot be retrieved during that time. RestoreSecret cancels the deletion at any time before the deletion date, and the secret keeps its ARN and versions.
    fr: |
      Un secret supprimé est planifié pour suppression après une fenêtre de récupération de 7 à 30 jours, et sa valeur ne peut pas être récupérée pendant ce temps. RestoreSecret annule la suppression à tout moment avant la date de suppression, et le secret conserve son ARN et ses versions.
  options:
    a:
      en: |
        A new secret would get a different ARN, and the name is still used by the secret that is scheduled for deletion.
      fr: |
        Un nouveau secret aurait un ARN différent, et le nom est toujours utilisé par le secret planifié pour suppression.
    b:
      en: |
        A secret that is scheduled for deletion cannot be modified or read until its deletion is canceled.
      fr: |
        Un secret planifié pour suppression ne peut être ni modifié ni lu tant que sa suppression n'est pas annulée.
    c:
      en: |
        The secret itself is scheduled for deletion; the KMS key is not, so canceling a key deletion does nothing.
      fr: |
        C'est le secret qui est planifié pour suppression, pas la clé KMS : annuler une suppression de clé ne sert à rien.
references:
  - title: Delete an AWS Secrets Manager secret
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/manage_delete-restore-secret.html
  - title: DeleteSecret
    url: https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_DeleteSecret.html
