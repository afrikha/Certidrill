id: soac03-4b-cloudfront-https-both-legs
objective: "4.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company serves a website through an Amazon CloudFront distribution whose origin is an Application Load Balancer. The load balancer has an HTTPS listener with an AWS Certificate Manager (ACM) certificate that matches the origin domain name. The company requires that viewers who use HTTP be redirected to HTTPS, and that CloudFront always use HTTPS to connect to the load balancer.

    Which combination of settings will meet these requirements? (Choose two.)
  fr: |
    Une entreprise diffuse un site web par une distribution Amazon CloudFront dont l'origine est un Application Load Balancer. L'équilibreur de charge possède un écouteur HTTPS avec un certificat AWS Certificate Manager (ACM) qui correspond au nom de domaine de l'origine. L'entreprise exige que les utilisateurs qui utilisent HTTP soient redirigés vers HTTPS, et que CloudFront utilise toujours HTTPS pour se connecter à l'équilibreur de charge.

    Quelle combinaison de paramètres répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the viewer protocol policy to HTTPS Only.", fr: "Définir la politique de protocole utilisateur sur HTTPS Only." } }
    - { id: b, text: { en: "Set the origin protocol policy to HTTP Only.", fr: "Définir la politique de protocole d'origine sur HTTP Only." } }
    - { id: c, text: { en: "Set the origin protocol policy to HTTPS Only.", fr: "Définir la politique de protocole d'origine sur HTTPS Only." } }
    - { id: d, text: { en: "Set the viewer protocol policy to Redirect HTTP to HTTPS.", fr: "Définir la politique de protocole utilisateur sur Redirect HTTP to HTTPS." } }
    - { id: e, text: { en: "Configure the HTTP listener of the load balancer to redirect requests to HTTPS.", fr: "Configurer l'écouteur HTTP de l'équilibreur de charge pour rediriger les requêtes vers HTTPS." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      With Redirect HTTP to HTTPS, CloudFront answers HTTP GET and HEAD requests with a 301 redirect to the HTTPS URL. With the origin protocol policy HTTPS Only, CloudFront uses only HTTPS to reach the origin; an ELB origin can use an ACM certificate.
    fr: |
      Avec Redirect HTTP to HTTPS, CloudFront répond aux requêtes HTTP GET et HEAD par une redirection 301 vers l'URL HTTPS. Avec la politique de protocole d'origine HTTPS Only, CloudFront n'utilise que HTTPS pour joindre l'origine ; une origine ELB peut utiliser un certificat ACM.
  options:
    a:
      en: |
        HTTPS Only rejects HTTP requests with HTTP 403 instead of redirecting them.
      fr: |
        HTTPS Only rejette les requêtes HTTP avec un code HTTP 403 au lieu de les rediriger.
    b:
      en: |
        HTTP Only would send unencrypted traffic from CloudFront to the load balancer.
      fr: |
        HTTP Only enverrait un trafic non chiffré de CloudFront vers l'équilibreur de charge.
    e:
      en: |
        Viewers connect to CloudFront, not to the load balancer, so a redirect on the load balancer does not control the viewer protocol or the origin protocol.
      fr: |
        Les utilisateurs se connectent à CloudFront, pas à l'équilibreur de charge : une redirection sur l'équilibreur ne contrôle ni le protocole utilisateur ni le protocole d'origine.
references:
  - title: Require HTTPS for communication between viewers and CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-https-viewers-to-cloudfront.html
  - title: Require HTTPS for communication between CloudFront and your custom origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-https-cloudfront-to-custom-origin.html
