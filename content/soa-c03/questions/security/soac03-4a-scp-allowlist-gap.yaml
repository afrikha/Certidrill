id: soac03-4a-scp-allowlist-gap
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An organization has the following structure and SCPs. Account 555566667777 is in the Prod OU.

    ```text
    Root               FullAWSAccess
    └─ Workloads OU    AllowCore (allows ec2:*, s3:*, cloudwatch:*); FullAWSAccess detached
       └─ Prod OU      FullAWSAccess
          └─ 555566667777   FullAWSAccess
    ```

    Users in the account who have the AdministratorAccess policy can use Amazon EC2 and Amazon S3, but every Amazon DynamoDB call fails.

    What is the cause?
  fr: |
    Une organisation a la structure et les SCP suivantes. Le compte 555566667777 se trouve dans l'unité d'organisation Prod.

    ```text
    Root               FullAWSAccess
    └─ Workloads OU    AllowCore (allows ec2:*, s3:*, cloudwatch:*); FullAWSAccess detached
       └─ Prod OU      FullAWSAccess
          └─ 555566667777   FullAWSAccess
    ```

    Les utilisateurs du compte qui disposent de la politique AdministratorAccess peuvent utiliser Amazon EC2 et Amazon S3, mais chaque appel à Amazon DynamoDB échoue.

    Quelle est la cause ?
body:
  options:
    - { id: a, text: { en: "FullAWSAccess on the Prod OU replaces the SCPs inherited from Workloads, so the denial must come from an identity-based policy.", fr: "FullAWSAccess sur l'unité d'organisation Prod remplace les SCP héritées de Workloads : le refus doit donc venir d'une politique basée sur l'identité." } }
    - { id: b, text: { en: "SCPs attached to the Workloads OU apply only to accounts placed directly in that OU, so the denial must come from a permissions boundary.", fr: "Les SCP attachées à l'unité d'organisation Workloads ne s'appliquent qu'aux comptes placés directement dans cette unité : le refus doit donc venir d'une limite d'autorisations." } }
    - { id: c, text: { en: "No SCP at the Workloads OU level allows DynamoDB actions, and an action must be allowed by an SCP at every level from the root to the account.", fr: "Aucune SCP au niveau de l'unité d'organisation Workloads n'autorise les actions DynamoDB, or une action doit être autorisée par une SCP à chaque niveau, de la racine jusqu'au compte." } }
    - { id: d, text: { en: "AllowCore contains an implicit Deny for DynamoDB that applies only to the root user and to roles with administrator permissions.", fr: "AllowCore contient un Deny implicite pour DynamoDB qui ne s'applique qu'à l'utilisateur root et aux rôles disposant d'autorisations d'administrateur." } }
answer: { optionId: c }
explanation:
  correct:
    en: "SCP allows are evaluated at every level of the path: for an action to be available in an account, an SCP at the root, at each OU on the path and at the account must allow it. Because FullAWSAccess was detached from Workloads and AllowCore does not include dynamodb:*, DynamoDB is unavailable in every account below Workloads, whatever the lower levels allow."
    fr: "Les autorisations des SCP s'évaluent à chaque niveau du chemin : pour qu'une action soit disponible dans un compte, une SCP de la racine, de chaque unité d'organisation du chemin et du compte doit l'autoriser. FullAWSAccess ayant été détachée de Workloads et AllowCore n'incluant pas dynamodb:*, DynamoDB est indisponible dans tous les comptes sous Workloads, quoi qu'autorisent les niveaux inférieurs."
  options:
    a:
      en: "A lower-level SCP cannot restore permissions that a higher level does not allow; AdministratorAccess also allows DynamoDB."
      fr: "Une SCP de niveau inférieur ne peut pas rétablir des autorisations qu'un niveau supérieur n'autorise pas ; AdministratorAccess autorise d'ailleurs DynamoDB."
    b:
      en: "SCPs attached to an OU affect all accounts in that OU and in its child OUs."
      fr: "Les SCP attachées à une unité d'organisation s'appliquent à tous les comptes de cette unité et de ses unités enfants."
    d:
      en: "The implicit deny of an allow-list SCP applies to every principal of the affected accounts, not only to administrators."
      fr: "Le refus implicite d'une SCP de type liste d'autorisation s'applique à chaque principal des comptes concernés, pas seulement aux administrateurs."
references:
  - title: SCP evaluation
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_evaluation.html
