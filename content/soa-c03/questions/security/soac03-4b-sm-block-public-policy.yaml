id: soac03-4b-sm-block-public-policy
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team uses scripts to attach resource-based policies to AWS Secrets Manager secrets so that roles in partner accounts can read specific secrets. After a mistake, a policy with a wildcard principal was attached to a secret. The team wants each script call to fail if the policy it tries to attach grants broad access to the secret.

    Which solution will meet this requirement?
  fr: |
    Une équipe plateforme utilise des scripts pour attacher des politiques basées sur les ressources à des secrets AWS Secrets Manager, afin que des rôles de comptes partenaires puissent lire certains secrets. Après une erreur, une politique avec un principal générique (wildcard) a été attachée à un secret. L'équipe veut que chaque appel de script échoue si la politique qu'il tente d'attacher accorde un accès large au secret.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Turn on S3 Block Public Access at the account level so that it also applies to the secrets' policies.", fr: "Activer S3 Block Public Access au niveau du compte afin qu'il s'applique aussi aux politiques des secrets." }
    - id: b
      text: { en: "Create an IAM Access Analyzer external access analyzer, and review its findings for the secrets every day.", fr: "Créer un analyseur d'accès externe IAM Access Analyzer, et examiner chaque jour ses résultats pour les secrets." }
    - id: c
      text: { en: "Add the --block-public-policy option to the aws secretsmanager put-resource-policy commands in the scripts.", fr: "Ajouter l'option --block-public-policy aux commandes aws secretsmanager put-resource-policy des scripts." }
    - id: d
      text: { en: "Encrypt the secrets with a customer managed KMS key that only the partner roles can use.", fr: "Chiffrer les secrets avec une clé KMS gérée par le client que seuls les rôles partenaires peuvent utiliser." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The BlockPublicPolicy parameter of PutResourcePolicy blocks resource-based policies that allow broad access to the secret, such as a wildcard principal. When it is set, a policy that does not prevent broad access is rejected with PublicPolicyException, so the call fails. Public policies are not blocked by default.
    fr: |
      Le paramètre BlockPublicPolicy de PutResourcePolicy bloque les politiques basées sur les ressources qui accordent un accès large au secret, comme un principal générique. Lorsqu'il est défini, une politique qui n'empêche pas l'accès large est rejetée avec PublicPolicyException : l'appel échoue. Par défaut, les politiques publiques ne sont pas bloquées.
  options:
    a:
      en: |
        S3 Block Public Access applies to S3 buckets and access points, not to Secrets Manager resource policies.
      fr: |
        S3 Block Public Access s'applique aux compartiments et points d'accès S3, pas aux politiques de ressources de Secrets Manager.
    b:
      en: |
        Access Analyzer reports external access after the policy is attached; it does not make the call fail.
      fr: |
        Access Analyzer signale l'accès externe après l'attachement de la politique ; il ne fait pas échouer l'appel.
    d:
      en: |
        A restrictive key adds a control on decryption but does not stop a broad resource policy from being attached.
      fr: |
        Une clé restrictive ajoute un contrôle sur le déchiffrement, mais n'empêche pas l'attachement d'une politique de ressource trop large.
references:
  - title: PutResourcePolicy
    url: https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_PutResourcePolicy.html
