id: soac03-4a-region-restrict-two
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company governs its organization with an AWS Control Tower landing zone whose home Region is eu-west-1. A new data residency requirement states that workloads in all member accounts may use only the eu-west-1 and eu-central-1 Regions. Global services such as IAM must keep working, and the restriction must be enforced, not only reported.

    Which solutions will meet these requirements? (Choose two.) Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise gouverne son organisation avec une zone d'atterrissage (landing zone) AWS Control Tower dont la Région d'origine est eu-west-1. Une nouvelle exigence de résidence des données impose que les charges de travail de tous les comptes membres n'utilisent que les Régions eu-west-1 et eu-central-1. Les services mondiaux comme IAM doivent continuer à fonctionner, et la restriction doit être appliquée, pas seulement signalée.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run aws account disable-region for every other Region in each member account.", fr: "Exécuter aws account disable-region pour chaque autre Région dans chaque compte membre." } }
    - { id: b, text: { en: "Enable the Region deny control in the landing zone settings, with eu-west-1 and eu-central-1 as the governed Regions.", fr: "Activer le contrôle Region deny dans les paramètres de la zone d'atterrissage, avec eu-west-1 et eu-central-1 comme Régions gouvernées." } }
    - { id: c, text: { en: "Deploy an AWS Config rule in every Region that flags resources created outside the two Regions.", fr: "Déployer dans chaque Région une règle AWS Config qui signale les ressources créées hors des deux Régions." } }
    - { id: d, text: { en: "Attach to the root an SCP that denies all actions except global services when aws:RequestedRegion is not eu-west-1 or eu-central-1.", fr: "Attacher à la racine une SCP qui refuse toutes les actions, sauf celles des services mondiaux, lorsque aws:RequestedRegion n'est ni eu-west-1 ni eu-central-1." } }
    - { id: e, text: { en: "Set eu-west-1 as the default Region in the AWS CLI and console settings of every user.", fr: "Définir eu-west-1 comme Région par défaut dans les paramètres de l'AWS CLI et de la console de chaque utilisateur." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The Control Tower Region deny control is an SCP-based control applied to the landing zone that denies access to services outside the governed Regions, with exemptions for global services such as IAM and Organizations. A custom SCP with a Deny on aws:RequestedRegion and a NotAction list of global services enforces the same restriction directly in AWS Organizations."
    fr: "Le contrôle Region deny de Control Tower est un contrôle fondé sur une SCP, appliqué à la zone d'atterrissage, qui refuse l'accès aux services hors des Régions gouvernées, avec des exemptions pour les services mondiaux comme IAM et Organizations. Une SCP personnalisée avec un Deny sur aws:RequestedRegion et une liste NotAction de services mondiaux applique la même restriction directement dans AWS Organizations."
  options:
    a:
      en: "Regions launched before March 20, 2019, such as us-east-1, are enabled by default and cannot be disabled."
      fr: "Les Régions lancées avant le 20 mars 2019, comme us-east-1, sont activées par défaut et ne peuvent pas être désactivées."
    c:
      en: "A Config rule only reports noncompliant resources after they exist; it does not enforce the restriction."
      fr: "Une règle Config ne fait que signaler les ressources non conformes une fois qu'elles existent ; elle n'applique pas la restriction."
    e:
      en: "A default Region is a convenience setting; users can still send requests to any Region."
      fr: "Une Région par défaut est un simple paramètre de confort ; les utilisateurs peuvent toujours envoyer des requêtes vers n'importe quelle Région."
references:
  - title: Configure the Region deny control
    url: https://docs.aws.amazon.com/controltower/latest/userguide/region-deny.html
  - title: Service control policy examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_general.html
