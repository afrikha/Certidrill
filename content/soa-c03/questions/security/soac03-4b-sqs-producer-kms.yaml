id: soac03-4b-sqs-producer-kms
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function sends messages to an Amazon SQS queue that uses SSE-KMS with a customer managed AWS KMS key. The key policy allows IAM policies in the account to grant access to the key. The function's execution role allows sqs:SendMessage on the queue and kms:GenerateDataKey on the key. SendMessage calls fail with a KMS access denied error.

    Which change will resolve the issue while following the principle of least privilege?
  fr: |
    Une fonction AWS Lambda envoie des messages vers une file d'attente Amazon SQS qui utilise SSE-KMS avec une clé AWS KMS gérée par le client. La politique de clé permet aux politiques IAM du compte d'accorder l'accès à la clé. Le rôle d'exécution de la fonction autorise sqs:SendMessage sur la file et kms:GenerateDataKey sur la clé. Les appels SendMessage échouent avec une erreur d'accès refusé KMS.

    Quelle modification résout le problème en respectant le principe du moindre privilège ?
body:
  options:
    - id: a
      text: { en: "Add a key policy statement that allows the sqs.amazonaws.com service principal to call kms:GenerateDataKey.", fr: "Ajouter à la politique de clé une instruction qui autorise le principal de service sqs.amazonaws.com à appeler kms:GenerateDataKey." }
    - id: b
      text: { en: "Add kms:Encrypt on the key to the execution role.", fr: "Ajouter kms:Encrypt sur la clé au rôle d'exécution." }
    - id: c
      text: { en: "Add sqs:ReceiveMessage on the queue to the execution role.", fr: "Ajouter sqs:ReceiveMessage sur la file au rôle d'exécution." }
    - id: d
      text: { en: "Add kms:Decrypt on the key to the execution role.", fr: "Ajouter kms:Decrypt sur la clé au rôle d'exécution." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a producer needs a new data key, its SendMessage call triggers kms:GenerateDataKey and also kms:Decrypt, which SQS uses to verify the integrity of the new data key. The producer therefore needs both kms:GenerateDataKey and kms:Decrypt on the key.
    fr: |
      Lorsqu'un producteur a besoin d'une nouvelle clé de données, son appel SendMessage déclenche kms:GenerateDataKey et aussi kms:Decrypt, que SQS utilise pour vérifier l'intégrité de la nouvelle clé de données. Le producteur a donc besoin à la fois de kms:GenerateDataKey et de kms:Decrypt sur la clé.
  options:
    a:
      en: |
        Service principal statements are needed when an AWS service such as Amazon SNS or Amazon S3 sends the messages; here the function's role makes the calls.
      fr: |
        Les instructions pour un principal de service sont nécessaires lorsqu'un service AWS comme Amazon SNS ou Amazon S3 envoie les messages ; ici, c'est le rôle de la fonction qui fait les appels.
    b:
      en: |
        SQS encrypts messages with data keys; producers need kms:GenerateDataKey and kms:Decrypt, not kms:Encrypt.
      fr: |
        SQS chiffre les messages avec des clés de données ; les producteurs ont besoin de kms:GenerateDataKey et kms:Decrypt, pas de kms:Encrypt.
    c:
      en: |
        The function only sends messages, so receiving permission is not needed and would exceed least privilege.
      fr: |
        La fonction ne fait qu'envoyer des messages : l'autorisation de réception n'est pas nécessaire et dépasserait le moindre privilège.
references:
  - title: Amazon SQS Key management
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-key-management.html
