id: soac03-1a-ecs-ci-existing-cluster
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator runs this command to turn on Amazon CloudWatch Container Insights with enhanced observability for Amazon ECS:

    ```bash
    aws ecs put-account-setting --name containerInsights --value enhanced
    ```

    The clusters that the administrator creates afterward show Container Insights metrics. The existing production cluster `prod-orders` still shows no Container Insights data.

    Which solution will turn on Container Insights for `prod-orders`?
  fr: |
    Un administrateur exécute cette commande pour activer Amazon CloudWatch Container Insights avec observabilité améliorée (enhanced observability) pour Amazon ECS :

    ```bash
    aws ecs put-account-setting --name containerInsights --value enhanced
    ```

    Les clusters que l'administrateur crée ensuite affichent les métriques Container Insights. Le cluster de production existant `prod-orders` n'affiche toujours aucune donnée Container Insights.

    Quelle solution active Container Insights pour `prod-orders` ?
body:
  options:
    - id: a
      text: { en: "Run `aws ecs update-cluster-settings` on `prod-orders` with `name=containerInsights,value=enhanced`.", fr: "Exécuter `aws ecs update-cluster-settings` sur `prod-orders` avec `name=containerInsights,value=enhanced`." }
    - id: b
      text: { en: "Run the same `put-account-setting` command again with `--principal-arn` set to the root user of the account.", fr: "Exécuter de nouveau la même commande `put-account-setting` avec `--principal-arn` défini sur l'utilisateur racine du compte." }
    - id: c
      text: { en: "Deploy the CloudWatch agent as a daemon service in `prod-orders` with the `CloudWatchAgentServerPolicy` task role.", fr: "Déployer l'agent CloudWatch en tant que service démon dans `prod-orders` avec un rôle de tâche `CloudWatchAgentServerPolicy`." }
    - id: d
      text: { en: "Update every task definition of `prod-orders` to use the `awslogs` log driver, and redeploy the services.", fr: "Mettre à jour chaque définition de tâche de `prod-orders` pour utiliser le pilote de journaux `awslogs`, puis redéployer les services." }
answer: { optionId: a }
explanation:
  correct:
    en: "The `containerInsights` account setting is the default for clusters created after it is set. An existing cluster keeps its own setting, so Container Insights is turned on, or upgraded from standard to enhanced, with `update-cluster-settings` on that cluster."
    fr: "Le paramètre de compte `containerInsights` est la valeur par défaut des clusters créés après sa définition. Un cluster existant garde son propre paramètre : Container Insights s'active, ou passe de la version standard à la version améliorée, avec `update-cluster-settings` sur ce cluster."
  options:
    b: { en: "The root principal extends the default to every user and role, but it still applies only to clusters created afterward.", fr: "Le principal racine étend la valeur par défaut à tous les utilisateurs et rôles, mais elle ne s'applique toujours qu'aux clusters créés ensuite." }
    c: { en: "The daemon service adds EC2 instance-level metrics; it does not turn on the cluster's Container Insights setting.", fr: "Le service démon ajoute des métriques au niveau des instances EC2 ; il n'active pas le paramètre Container Insights du cluster." }
    d: { en: "The `awslogs` driver sends container logs to CloudWatch Logs; it does not produce Container Insights metrics.", fr: "Le pilote `awslogs` envoie les journaux des conteneurs à CloudWatch Logs ; il ne produit pas de métriques Container Insights." }
references:
  - title: Setting up Container Insights on Amazon ECS
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/deploy-container-insights-ECS-cluster.html
