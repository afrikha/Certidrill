id: soac03-1b-resize-runbook-tags
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AWS Compute Optimizer reports 30 over-provisioned m7i.2xlarge Amazon EC2 instances and recommends m7i.xlarge for all of them. The instances are not in Auto Scaling groups. After approval, the application owners tagged the instances with Rightsize=approved. During the next maintenance window, the operations team must change all these instances to m7i.xlarge.

    Which solution will meet these requirements with the LEAST operational effort?
  fr: |
    AWS Compute Optimizer signale 30 instances Amazon EC2 m7i.2xlarge surprovisionnées et recommande m7i.xlarge pour toutes. Les instances ne font pas partie de groupes Auto Scaling. Après approbation, les propriétaires des applications ont balisé les instances avec Rightsize=approved. Pendant la prochaine fenêtre de maintenance, l'équipe d'exploitation doit faire passer toutes ces instances en m7i.xlarge.

    Quelle solution répond à ces exigences avec le MOINS d'effort opérationnel ?
body:
  options:
    - { id: a, text: { en: "Run the aws ec2 modify-instance-attribute command with the new instance type on each instance while it is running.", fr: "Exécuter la commande aws ec2 modify-instance-attribute avec le nouveau type d'instance sur chaque instance pendant qu'elle s'exécute." } }
    - { id: b, text: { en: "Create a launch template that uses the m7i.xlarge instance type and start an instance refresh for the tagged instances.", fr: "Créer un modèle de lancement qui utilise le type d'instance m7i.xlarge et lancer une actualisation d'instances (instance refresh) pour les instances balisées." } }
    - { id: c, text: { en: "Use Elastic Volumes to modify the root volume of each tagged instance while the instance keeps running.", fr: "Utiliser Elastic Volumes pour modifier le volume racine de chaque instance balisée pendant que l'instance continue de s'exécuter." } }
    - { id: d, text: { en: "Run the AWS-ResizeInstance runbook with InstanceType=m7i.xlarge, targeting the tag Rightsize=approved.", fr: "Exécuter le runbook AWS-ResizeInstance avec InstanceType=m7i.xlarge, en ciblant la balise Rightsize=approved." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AWS-ResizeInstance is an AWS-owned Automation runbook that changes the instance type of an EC2 instance; it takes InstanceId and InstanceType parameters. Targeting the tag with InstanceId as the target parameter runs it on each approved instance in one operation, with rate controls to limit how many instances change at a time.
    fr: |
      AWS-ResizeInstance est un runbook Automation fourni par AWS qui change le type d'une instance EC2 ; il prend les paramètres InstanceId et InstanceType. Cibler la balise avec InstanceId comme paramètre cible l'exécute sur chaque instance approuvée en une seule opération, avec des contrôles de débit pour limiter le nombre d'instances modifiées en même temps.
  options:
    a: { en: "The instance type of an EBS-backed instance can be changed only while it is stopped, and doing this by hand 30 times adds effort.", fr: "Le type d'une instance basée sur EBS ne peut être modifié que lorsqu'elle est arrêtée, et le faire à la main 30 fois ajoute de l'effort." }
    b: { en: "An instance refresh applies to an Auto Scaling group, and these instances are not in one.", fr: "Une actualisation d'instances s'applique à un groupe Auto Scaling, et ces instances n'en font pas partie." }
    c: { en: "Elastic Volumes changes EBS volumes, not the instance type that defines CPU and memory.", fr: "Elastic Volumes modifie des volumes EBS, pas le type d'instance qui définit le processeur et la mémoire." }
references:
  - title: AWS-ResizeInstance
    url: https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-aws-resizeinstance.html
  - title: Run automated operations at scale
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-scale.html
