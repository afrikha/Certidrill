id: soac03-1b-devops-agent-servicenow
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses ServiceNow for incident tickets and runs its workloads in several AWS accounts. The company has set up AWS DevOps Agent with an Agent Space that includes these accounts.

    The operations team wants DevOps Agent to start an investigation automatically every time a new incident ticket is created and to post its key findings, root cause analysis, and mitigation plan into the originating ticket.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    Une entreprise utilise ServiceNow pour ses tickets d'incident et exécute ses charges de travail dans plusieurs comptes AWS. L'entreprise a configuré AWS DevOps Agent avec un Agent Space qui inclut ces comptes.

    L'équipe d'exploitation veut que DevOps Agent lance automatiquement une investigation à chaque création d'un ticket d'incident et publie ses principales constatations, son analyse de la cause racine et son plan d'atténuation dans le ticket d'origine.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Configure ServiceNow to send each new ticket to an Amazon SNS topic, and subscribe an AWS Lambda function that starts an investigation and updates the ticket.", fr: "Configurer ServiceNow pour qu'il envoie chaque nouveau ticket à une rubrique Amazon SNS, et abonner une fonction AWS Lambda qui lance une investigation et met à jour le ticket." } }
    - { id: b, text: { en: "Ask operators to start each investigation manually from the Incident Response tab of the Agent Space web app and copy the results into the ticket.", fr: "Demander aux opérateurs de lancer chaque investigation manuellement depuis l'onglet Incident Response de l'application web de l'Agent Space et de copier les résultats dans le ticket." } }
    - { id: c, text: { en: "Create an EventBridge rule that matches CloudWatch alarm state changes and targets a Systems Manager Automation runbook that opens a ServiceNow ticket.", fr: "Créer une règle EventBridge qui correspond aux changements d'état des alarmes CloudWatch et cible un runbook Systems Manager Automation qui ouvre un ticket ServiceNow." } }
    - { id: d, text: { en: "Connect the Agent Space to ServiceNow by using the built-in ServiceNow integration of AWS DevOps Agent.", fr: "Connecter l'Agent Space à ServiceNow à l'aide de l'intégration ServiceNow intégrée d'AWS DevOps Agent." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An Agent Space can be connected to ticketing systems such as ServiceNow through built-in integrations. Once connected, DevOps Agent starts incident response investigations automatically from support tickets and posts updates with its findings, root cause analyses, and mitigation plans into the originating ticket, with no custom code.
    fr: |
      Un Agent Space peut être connecté à des systèmes de tickets comme ServiceNow par des intégrations intégrées. Une fois la connexion faite, DevOps Agent lance automatiquement des investigations de réponse aux incidents à partir des tickets et publie dans le ticket d'origine ses constatations, ses analyses de cause racine et ses plans d'atténuation, sans code personnalisé.
  options:
    a: { en: "Custom code for both directions is development effort that the built-in integration already provides.", fr: "Du code personnalisé dans les deux sens représente un effort de développement que l'intégration intégrée fournit déjà." }
    b: { en: "Manual investigations do not start automatically, and copying results by hand does not meet the requirement.", fr: "Les investigations manuelles ne démarrent pas automatiquement, et la copie des résultats à la main ne répond pas à l'exigence." }
    c: { en: "This only creates tickets from alarms; it does not start DevOps Agent investigations or return findings to the ticket.", fr: "Cette solution crée seulement des tickets à partir des alarmes ; elle ne lance pas d'investigation DevOps Agent et ne renvoie pas de constatations dans le ticket." }
references:
  - title: About AWS DevOps Agent
    url: https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent.html
  - title: Autonomous incident response
    url: https://docs.aws.amazon.com/devopsagent/latest/userguide/production-operations-autonomous-incident-response.html
