id: soac03-1a-alarm-lambda-permission
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations engineer adds an AWS Lambda function as the ALARM action of a CloudWatch metric alarm named `queue-backlog` in the same account. The function must clean up a stuck message processor. When the alarm goes into the ALARM state, the alarm history shows that the action failed, and the function is never invoked. The function has no resource-based policy.

    Which solution will fix the problem with the least privilege?
  fr: |
    Un ingénieur des opérations ajoute une fonction AWS Lambda comme action ALARM d'une alarme de métrique CloudWatch nommée `queue-backlog`, dans le même compte. La fonction doit nettoyer un processus de traitement de messages bloqué. Quand l'alarme passe à l'état ALARM, l'historique de l'alarme indique que l'action a échoué, et la fonction n'est jamais invoquée. La fonction n'a aucune politique basée sur les ressources.

    Quelle solution permet de résoudre le problème en respectant le principe du moindre privilège ?
body:
  options:
    - id: a
      text: { en: "Add `lambda:InvokeFunction` on the function to the execution role of the function.", fr: "Ajouter `lambda:InvokeFunction` sur la fonction au rôle d'exécution de la fonction." }
    - id: b
      text: { en: "Run `aws lambda add-permission` with the principal `events.amazonaws.com` and the ARN of the alarm as the source ARN.", fr: "Exécuter `aws lambda add-permission` avec le principal `events.amazonaws.com` et l'ARN de l'alarme comme ARN source." }
    - id: c
      text: { en: "Run `aws lambda add-permission` with the principal `lambda.alarms.cloudwatch.amazonaws.com` and the ARN of the alarm as the source ARN.", fr: "Exécuter `aws lambda add-permission` avec le principal `lambda.alarms.cloudwatch.amazonaws.com` et l'ARN de l'alarme comme ARN source." }
    - id: d
      text: { en: "Run `aws lambda add-permission` with the principal `lambda.alarms.cloudwatch.amazonaws.com` and no source account or source ARN.", fr: "Exécuter `aws lambda add-permission` avec le principal `lambda.alarms.cloudwatch.amazonaws.com`, sans compte source ni ARN source." }
answer: { optionId: c }
explanation:
  correct:
    en: "A CloudWatch alarm invokes a Lambda function asynchronously through the service principal `lambda.alarms.cloudwatch.amazonaws.com`, which the function's resource-based policy must allow. Adding the source account and the alarm ARN as conditions limits the permission to this alarm and protects against the confused deputy problem."
    fr: "Une alarme CloudWatch invoque une fonction Lambda de façon asynchrone via le principal de service `lambda.alarms.cloudwatch.amazonaws.com`, que la politique basée sur les ressources de la fonction doit autoriser. Ajouter le compte source et l'ARN de l'alarme comme conditions limite l'autorisation à cette alarme et protège contre le problème du député confus (confused deputy)."
  options:
    a: { en: "The execution role defines what the function can do, not who can invoke it.", fr: "Le rôle d'exécution définit ce que la fonction peut faire, et non qui peut l'invoquer." }
    b: { en: "`events.amazonaws.com` is the EventBridge principal; a direct alarm action uses the CloudWatch alarms principal.", fr: "`events.amazonaws.com` est le principal d'EventBridge ; une action d'alarme directe utilise le principal des alarmes CloudWatch." }
    d: { en: "This works, but any alarm in any account could invoke the function, which is not least privilege and exposes it to the confused deputy problem.", fr: "Cela fonctionne, mais n'importe quelle alarme de n'importe quel compte pourrait invoquer la fonction, ce qui ne respecte pas le moindre privilège et l'expose au problème du député confus." }
references:
  - title: Invoke a Lambda function from an alarm
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-actions-Lambda.html
