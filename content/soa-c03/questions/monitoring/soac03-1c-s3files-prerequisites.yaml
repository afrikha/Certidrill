id: soac03-1c-s3files-prerequisites
objective: "1.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A CloudOps engineer plans to give Amazon EC2 instances file access to an existing Amazon S3 general purpose bucket by using Amazon S3 Files. The bucket uses default encryption with SSE-S3, and versioning has never been enabled. The engineer has installed amazon-efs-utils 3.0 on the instances and attached an instance profile with the AmazonS3FilesClientFullAccess policy and read access to the bucket's objects. The instances use a security group named app-sg that allows all outbound traffic, and the mount targets will use a security group named files-sg. The engineer will create the file system in the console, which creates the IAM role that S3 Files uses to access the bucket.

    Which combination of actions must the engineer also take? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un ingénieur CloudOps prévoit de donner à des instances Amazon EC2 un accès fichier à un compartiment Amazon S3 à usage général existant à l'aide d'Amazon S3 Files. Le compartiment utilise le chiffrement par défaut SSE-S3, et la gestion des versions n'a jamais été activée. L'ingénieur a installé amazon-efs-utils 3.0 sur les instances et attaché un profil d'instance avec la politique AmazonS3FilesClientFullAccess et un accès en lecture aux objets du compartiment. Les instances utilisent un groupe de sécurité nommé app-sg qui autorise tout le trafic sortant, et les cibles de montage utiliseront un groupe de sécurité nommé files-sg. L'ingénieur créera le système de fichiers dans la console, qui crée le rôle IAM utilisé par S3 Files pour accéder au compartiment.

    Quelle combinaison d'actions l'ingénieur doit-il aussi effectuer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable S3 Transfer Acceleration on the bucket.", fr: "Activer S3 Transfer Acceleration sur le compartiment." } }
    - { id: b, text: { en: "Enable S3 Versioning on the bucket.", fr: "Activer la gestion des versions S3 sur le compartiment." } }
    - { id: c, text: { en: "Change the default encryption of the bucket to SSE-C.", fr: "Changer le chiffrement par défaut du compartiment en SSE-C." } }
    - { id: d, text: { en: "Add an inbound rule for TCP port 2049 from app-sg to files-sg.", fr: "Ajouter à files-sg une règle entrante pour le port TCP 2049 depuis app-sg." } }
    - { id: e, text: { en: "Enable S3 Object Lock on the bucket.", fr: "Activer S3 Object Lock sur le compartiment." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "S3 Files requires S3 Versioning on the bucket because it uses version-specific operations to synchronize changes between the file system and the bucket. The mount target security group must also allow inbound NFS traffic on TCP 2049 from the instances' security group, and the instances must be allowed outbound TCP 2049 to the mount targets, which app-sg already allows."
    fr: "S3 Files exige la gestion des versions S3 sur le compartiment, car il utilise des opérations propres aux versions pour synchroniser les modifications entre le système de fichiers et le compartiment. Le groupe de sécurité des cibles de montage doit aussi autoriser le trafic NFS entrant sur TCP 2049 depuis le groupe de sécurité des instances, et les instances doivent pouvoir sortir sur TCP 2049 vers les cibles de montage, ce que app-sg autorise déjà."
  options:
    a:
      en: "Transfer Acceleration speeds up long-distance transfers to the bucket and is not a prerequisite of S3 Files."
      fr: "Transfer Acceleration accélère les transferts longue distance vers le compartiment et n'est pas un prérequis de S3 Files."
    c:
      en: "S3 Files supports buckets encrypted with SSE-S3 or SSE-KMS, so the current SSE-S3 configuration already meets the requirement."
      fr: "S3 Files prend en charge les compartiments chiffrés avec SSE-S3 ou SSE-KMS : la configuration SSE-S3 actuelle répond déjà à l'exigence."
    e:
      en: "Object Lock protects object versions from deletion and is not required by S3 Files."
      fr: "Object Lock protège les versions d'objets contre la suppression et n'est pas exigé par S3 Files."
references:
  - title: Prerequisites for S3 Files
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files-prereq-policies.html
