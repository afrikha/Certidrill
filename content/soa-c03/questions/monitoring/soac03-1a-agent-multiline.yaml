id: soac03-1a-agent-multiline
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Java application on Amazon EC2 writes logs that the CloudWatch agent sends to Amazon CloudWatch Logs. Every log entry starts with a timestamp such as `2026-11-03 14:02:11`, but stack traces span many lines. In CloudWatch Logs, each line of a stack trace appears as a separate log event, which makes errors hard to read and to count.

    Which change to the agent configuration will fix the problem?
  fr: |
    Une application Java sur Amazon EC2 écrit des journaux que l'agent CloudWatch envoie à Amazon CloudWatch Logs. Chaque entrée de journal commence par un horodatage tel que `2026-11-03 14:02:11`, mais les traces de pile s'étendent sur de nombreuses lignes. Dans CloudWatch Logs, chaque ligne d'une trace de pile apparaît comme un événement de journal distinct, ce qui rend les erreurs difficiles à lire et à compter.

    Quelle modification de la configuration de l'agent permet de résoudre le problème ?
body:
  options:
    - id: a
      text: { en: "Add an `include` filter with the expression `Exception` to the file entry.", fr: "Ajouter à l'entrée du fichier un filtre `include` avec l'expression `Exception`." }
    - id: b
      text: { en: "Increase the `force_flush_interval` of the `logs` section to 60 seconds.", fr: "Porter à 60 secondes le `force_flush_interval` de la section `logs`." }
    - id: c
      text: { en: "Set `trim_timestamp` to true so that the agent removes the timestamp from each line.", fr: "Définir `trim_timestamp` à true pour que l'agent retire l'horodatage de chaque ligne." }
    - id: d
      text: { en: "Add a `multi_line_start_pattern` that matches the timestamp at the start of each entry.", fr: "Ajouter un `multi_line_start_pattern` qui correspond à l'horodatage en début de chaque entrée." }
answer: { optionId: d }
explanation:
  correct:
    en: "`multi_line_start_pattern` takes a regular expression, or `{timestamp_format}`, that marks the first line of a log event. Lines that do not match, such as the lines of a stack trace, are appended to the current event, so each entry becomes one log event."
    fr: "`multi_line_start_pattern` accepte une expression régulière, ou `{timestamp_format}`, qui marque la première ligne d'un événement de journal. Les lignes qui ne correspondent pas, comme celles d'une trace de pile, sont ajoutées à l'événement en cours : chaque entrée devient un seul événement de journal."
  options:
    a: { en: "An include filter only drops lines that do not match; it does not join lines into one event.", fr: "Un filtre include ne fait qu'écarter les lignes qui ne correspondent pas ; il ne regroupe pas des lignes en un seul événement." }
    b: { en: "The flush interval changes how often batches are sent, not how lines are grouped into events.", fr: "L'intervalle de vidage change la fréquence d'envoi des lots, et non la façon dont les lignes sont regroupées en événements." }
    c: { en: "`trim_timestamp` removes a matched timestamp from the message; it does not group lines.", fr: "`trim_timestamp` retire du message l'horodatage reconnu ; il ne regroupe pas de lignes." }
references:
  - title: Manually create or edit the CloudWatch agent configuration file
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
