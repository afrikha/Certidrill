id: soac03-1a-bedrock-invocation-logging
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's application calls Amazon Bedrock models through the Converse API. For troubleshooting, the operations team must keep the full prompts and model responses of every call in an Amazon CloudWatch Logs log group in the same account and Region. Some responses are larger than 100 KB.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    L'application d'une entreprise appelle des modèles Amazon Bedrock via l'API Converse. Pour le dépannage, l'équipe des opérations doit conserver les invites (prompts) complètes et les réponses des modèles de chaque appel dans un groupe de journaux Amazon CloudWatch Logs du même compte et de la même Région. Certaines réponses dépassent 100 Ko.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure the AWS CloudTrail trail to log data events for the `AWS::Bedrock::Model` resource type.", fr: "Configurer le journal de suivi AWS CloudTrail pour journaliser les événements de données du type de ressource `AWS::Bedrock::Model`." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the `InvocationLatency` metric in the `AWS/Bedrock` namespace.", fr: "Créer une alarme CloudWatch sur la métrique `InvocationLatency` de l'espace de noms `AWS/Bedrock`." } }
    - { id: c, text: { en: "Create an IAM role that `bedrock.amazonaws.com` can assume and that allows `logs:CreateLogStream` and `logs:PutLogEvents` on the log group.", fr: "Créer un rôle IAM que `bedrock.amazonaws.com` peut assumer et qui autorise `logs:CreateLogStream` et `logs:PutLogEvents` sur le groupe de journaux." } }
    - { id: d, text: { en: "Install the CloudWatch agent with its default configuration on the EC2 instances that run the application.", fr: "Installer l'agent CloudWatch avec sa configuration par défaut sur les instances EC2 qui exécutent l'application." } }
    - { id: e, text: { en: "Turn on model invocation logging with the log group as destination and an S3 bucket for large data delivery.", fr: "Activer la journalisation des appels de modèles avec le groupe de journaux comme destination et un compartiment S3 pour la livraison des données volumineuses." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Model invocation logging is disabled by default; once turned on, it records the request data, response data and metadata of Converse and InvokeModel calls for the account and Region. Delivery to CloudWatch Logs uses an IAM role that Amazon Bedrock assumes, with permission to create log streams and put log events. Bodies over 100 KB and binary data are written to the S3 location for large data, which the log entries reference."
    fr: "La journalisation des appels de modèles est désactivée par défaut ; une fois activée, elle enregistre les données de requête, les données de réponse et les métadonnées des appels Converse et InvokeModel pour le compte et la Région. La livraison à CloudWatch Logs utilise un rôle IAM qu'Amazon Bedrock assume, autorisé à créer des flux de journaux et à y écrire des événements. Les corps de plus de 100 Ko et les données binaires sont écrits dans l'emplacement S3 des données volumineuses, auquel les entrées de journal font référence."
  options:
    a: { en: "CloudTrail records who called which API and when; it does not capture the prompts and responses of the calls.", fr: "CloudTrail enregistre qui a appelé quelle API et quand ; il ne capture pas les invites ni les réponses des appels." }
    b: { en: "A latency alarm watches a metric; it does not store any prompt or response.", fr: "Une alarme de latence surveille une métrique ; elle ne stocke aucune invite ni réponse." }
    d: { en: "The agent only collects files and metrics that already exist on the instance; the application does not write the prompts and responses to a file.", fr: "L'agent ne collecte que les fichiers et métriques qui existent déjà sur l'instance ; l'application n'écrit pas les invites et les réponses dans un fichier." }
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
