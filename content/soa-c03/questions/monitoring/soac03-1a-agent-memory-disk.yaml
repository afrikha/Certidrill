id: soac03-1a-agent-memory-disk
objective: "1.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company runs a fleet of Amazon EC2 Linux instances with detailed monitoring turned on. The operations team wants CloudWatch alarms on several metrics and must decide where the CloudWatch agent is needed.

    Which two metrics are NOT published by Amazon EC2 and require the CloudWatch agent? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exploite un parc d'instances Amazon EC2 Linux sur lesquelles la surveillance détaillée est activée. L'équipe des opérations veut des alarmes CloudWatch sur plusieurs métriques et doit déterminer où l'agent CloudWatch est nécessaire.

    Quelles sont les deux métriques qui ne sont PAS publiées par Amazon EC2 et qui nécessitent l'agent CloudWatch ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Percentage of memory used by the operating system", fr: "Pourcentage de mémoire utilisée par le système d'exploitation" } }
    - { id: b, text: { en: "Percentage of CPU used by the instance", fr: "Pourcentage de processeur utilisé par l'instance" } }
    - { id: c, text: { en: "Bytes received on all network interfaces", fr: "Octets reçus sur toutes les interfaces réseau" } }
    - { id: d, text: { en: "Percentage of space used on the root file system", fr: "Pourcentage d'espace utilisé sur le système de fichiers racine" } }
    - { id: e, text: { en: "Result of the instance status check", fr: "Résultat de la vérification de l'état de l'instance" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Amazon EC2 measures an instance from the hypervisor, so it publishes CPU, network, disk I/O and status check metrics but cannot see inside the operating system. Memory use and file system space are guest OS metrics: the CloudWatch agent collects them with its `mem` and `disk` collectors (for example `mem_used_percent` and `disk_used_percent`) in the `CWAgent` namespace by default."
    fr: "Amazon EC2 mesure une instance depuis l'hyperviseur : il publie les métriques de processeur, de réseau, d'E/S disque et de vérification de l'état, mais ne voit pas l'intérieur du système d'exploitation. L'utilisation de la mémoire et l'espace des systèmes de fichiers sont des métriques du système invité : l'agent CloudWatch les collecte avec ses collecteurs `mem` et `disk` (par exemple `mem_used_percent` et `disk_used_percent`), par défaut dans l'espace de noms `CWAgent`."
  options:
    b: { en: "`CPUUtilization` is a default EC2 metric.", fr: "`CPUUtilization` est une métrique EC2 par défaut." }
    c: { en: "`NetworkIn` is a default EC2 metric.", fr: "`NetworkIn` est une métrique EC2 par défaut." }
    e: { en: "`StatusCheckFailed_Instance` is a default EC2 metric, published every minute even with basic monitoring.", fr: "`StatusCheckFailed_Instance` est une métrique EC2 par défaut, publiée chaque minute même avec la surveillance de base." }
references:
  - title: Manually create or edit the CloudWatch agent configuration file
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
