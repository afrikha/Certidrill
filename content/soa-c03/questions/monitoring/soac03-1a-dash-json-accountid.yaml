id: soac03-1a-dash-json-accountid
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses CloudWatch cross-account observability. Account 111122223333 is a source account linked to the monitoring account in eu-west-1. An engineer adds this widget to a dashboard in the monitoring account with the `PutDashboard` API. The instance `i-0abc12345def67890` runs in the source account.

    ```json
    {
      "type": "metric",
      "properties": {
        "metrics": [["AWS/EC2", "CPUUtilization", "InstanceId", "i-0abc12345def67890"]],
        "region": "eu-west-1",
        "stat": "Average",
        "period": 300,
        "title": "Orders CPU"
      }
    }
    ```

    The widget shows no data.

    Which change will make the widget show the metric?
  fr: |
    Une entreprise utilise l'observabilité multicompte CloudWatch. Le compte 111122223333 est un compte source lié au compte de surveillance dans eu-west-1. Un ingénieur ajoute ce widget à un tableau de bord du compte de surveillance avec l'API `PutDashboard`. L'instance `i-0abc12345def67890` s'exécute dans le compte source.

    ```json
    {
      "type": "metric",
      "properties": {
        "metrics": [["AWS/EC2", "CPUUtilization", "InstanceId", "i-0abc12345def67890"]],
        "region": "eu-west-1",
        "stat": "Average",
        "period": 300,
        "title": "Orders CPU"
      }
    }
    ```

    Le widget n'affiche aucune donnée.

    Quelle modification permet au widget d'afficher la métrique ?
body:
  options:
    - id: a
      text: { en: "Add `\"liveData\": true` to the properties of the widget.", fr: "Ajouter `\"liveData\": true` aux propriétés du widget." }
    - id: b
      text: { en: "Add `\"accountId\": \"111122223333\"` to the properties of the widget.", fr: "Ajouter `\"accountId\": \"111122223333\"` aux propriétés du widget." }
    - id: c
      text: { en: "Change `\"region\"` to `\"us-east-1\"`, where dashboards are stored.", fr: "Remplacer `\"region\"` par `\"us-east-1\"`, où sont stockés les tableaux de bord." }
    - id: d
      text: { en: "Change `\"period\"` to 60 to match the detailed monitoring period.", fr: "Passer `\"period\"` à 60 pour correspondre à la période de la surveillance détaillée." }
answer: { optionId: b }
explanation:
  correct:
    en: "In a cross-account dashboard, the `accountId` property tells CloudWatch which account holds the metric, for a whole widget or for each metric. When it is omitted, the widget uses the account that is signed in, here the monitoring account, which has no metric for this instance."
    fr: "Dans un tableau de bord multicompte, la propriété `accountId` indique à CloudWatch le compte qui détient la métrique, pour tout un widget ou pour chaque métrique. Si elle est omise, le widget utilise le compte connecté, ici le compte de surveillance, qui n'a aucune métrique pour cette instance."
  options:
    a: { en: "`liveData` only adds recent data points that are not fully aggregated; it does not change the account queried.", fr: "`liveData` ajoute seulement des points de données récents pas encore entièrement agrégés ; il ne change pas le compte interrogé." }
    c: { en: "The `region` property must name the Region of the metric, which is eu-west-1.", fr: "La propriété `region` doit indiquer la Région de la métrique, c'est-à-dire eu-west-1." }
    d: { en: "A 300-second period works with any EC2 metric; the period does not explain the missing data.", fr: "Une période de 300 secondes fonctionne avec toute métrique EC2 ; la période n'explique pas l'absence de données." }
references:
  - title: Using Amazon CloudWatch dashboards
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Dashboards.html
