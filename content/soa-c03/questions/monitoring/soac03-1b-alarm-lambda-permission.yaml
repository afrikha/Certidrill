id: soac03-1b-alarm-lambda-permission
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An administrator writes an AWS Lambda function that clears a cache when an Amazon CloudWatch alarm on application latency enters the ALARM state. The administrator configures the function directly as the alarm action by using the AWS CLI.

    The alarm history shows that the alarm entered the ALARM state several times, but the function's Invocations metric stays at zero. The function runs correctly when the administrator invokes it manually.

    What should the administrator do to fix the issue?
  fr: |
    Un administrateur écrit une fonction AWS Lambda qui vide un cache lorsqu'une alarme Amazon CloudWatch sur la latence de l'application passe à l'état ALARM. L'administrateur configure la fonction directement comme action de l'alarme à l'aide de l'AWS CLI.

    L'historique de l'alarme montre qu'elle est passée plusieurs fois à l'état ALARM, mais la métrique Invocations de la fonction reste à zéro. La fonction s'exécute correctement lorsque l'administrateur l'invoque manuellement.

    Que doit faire l'administrateur pour résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Add a statement to the function's execution role that allows the cloudwatch:PutMetricAlarm action.", fr: "Ajouter au rôle d'exécution de la fonction une instruction qui autorise l'action cloudwatch:PutMetricAlarm." } }
    - { id: b, text: { en: "Add a resource-based policy statement to the function that allows events.amazonaws.com to invoke it.", fr: "Ajouter à la fonction une instruction de politique basée sur les ressources qui autorise events.amazonaws.com à l'invoquer." } }
    - { id: c, text: { en: "Add a resource-based policy statement to the function that allows lambda.alarms.cloudwatch.amazonaws.com to invoke it.", fr: "Ajouter à la fonction une instruction de politique basée sur les ressources qui autorise lambda.alarms.cloudwatch.amazonaws.com à l'invoquer." } }
    - { id: d, text: { en: "Configure reserved concurrency on the function so that the alarm invocations are not throttled.", fr: "Configurer une simultanéité réservée sur la fonction pour que les invocations de l'alarme ne soient pas limitées." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a Lambda function is an alarm action, the function needs a resource-based policy that allows the CloudWatch alarms service principal, lambda.alarms.cloudwatch.amazonaws.com, to call lambda:InvokeFunction. AWS recommends limiting the statement with the source account and, if needed, the alarm ARN to avoid confused deputy issues.
    fr: |
      Lorsqu'une fonction Lambda est une action d'alarme, la fonction a besoin d'une politique basée sur les ressources qui autorise le principal de service des alarmes CloudWatch, lambda.alarms.cloudwatch.amazonaws.com, à appeler lambda:InvokeFunction. AWS recommande de restreindre l'instruction au compte source et, si nécessaire, à l'ARN de l'alarme pour éviter les problèmes de « confused deputy ».
  options:
    a: { en: "The execution role defines what the function can do once it runs. It does not let CloudWatch invoke the function.", fr: "Le rôle d'exécution définit ce que la fonction peut faire une fois lancée. Il ne permet pas à CloudWatch d'invoquer la fonction." }
    b: { en: "events.amazonaws.com is the principal for EventBridge rule targets, not for CloudWatch alarm actions.", fr: "events.amazonaws.com est le principal des cibles de règles EventBridge, pas des actions d'alarme CloudWatch." }
    d: { en: "Throttled invocations would appear in the Throttles metric. Here CloudWatch is never allowed to call the function.", fr: "Des invocations limitées apparaîtraient dans la métrique Throttles. Ici, CloudWatch n'est jamais autorisé à appeler la fonction." }
references:
  - title: Invoke a Lambda function from an alarm
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-actions-Lambda.html
