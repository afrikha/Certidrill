id: soac03-1a-trail-sns-data-events
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company must record every `Publish` call that is made to one Amazon SNS topic named `payments-alerts`, including the identity of the caller. The account has an AWS CloudTrail trail that logs management events and uses basic event selectors. To control cost, the company wants to log only the publish activity of this topic and no other data events.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit enregistrer chaque appel `Publish` effectué sur une rubrique Amazon SNS nommée `payments-alerts`, y compris l'identité de l'appelant. Le compte possède un journal de suivi (trail) AWS CloudTrail qui journalise les événements de gestion et utilise des sélecteurs d'événements de base. Pour maîtriser les coûts, l'entreprise veut journaliser uniquement l'activité de publication de cette rubrique, et aucun autre événement de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a basic event selector with a data resource of type `AWS::SNS::Topic` that lists the ARN of the topic.", fr: "Ajouter un sélecteur d'événements de base avec une ressource de données de type `AWS::SNS::Topic` qui indique l'ARN de la rubrique." }
    - id: b
      text: { en: "Turn on CloudTrail Insights for the API call rate on the trail and filter the Insights events on the topic ARN.", fr: "Activer CloudTrail Insights pour le taux d'appels d'API sur le journal de suivi et filtrer les événements Insights sur l'ARN de la rubrique." }
    - id: c
      text: { en: "Turn on delivery status logging for the topic and send the delivery logs to a CloudWatch Logs log group.", fr: "Activer la journalisation de l'état de livraison de la rubrique et envoyer ces journaux à un groupe de journaux CloudWatch Logs." }
    - id: d
      text: { en: "Switch the trail to advanced event selectors that select data events of type `AWS::SNS::Topic` whose ARN equals the topic ARN.", fr: "Passer le journal de suivi aux sélecteurs d'événements avancés et sélectionner les événements de données de type `AWS::SNS::Topic` dont l'ARN est égal à celui de la rubrique." }
answer: { optionId: d }
explanation:
  correct:
    en: "SNS `Publish` calls on a topic are data events, which trails do not log by default. Basic event selectors support only S3 objects, Lambda functions and DynamoDB tables; other resource types such as `AWS::SNS::Topic` require advanced event selectors. A `resources.ARN` condition limits the logging, and its cost, to the single topic."
    fr: "Les appels `Publish` sur une rubrique SNS sont des événements de données, que les journaux de suivi ne journalisent pas par défaut. Les sélecteurs d'événements de base ne prennent en charge que les objets S3, les fonctions Lambda et les tables DynamoDB ; les autres types de ressources, comme `AWS::SNS::Topic`, exigent des sélecteurs d'événements avancés. Une condition `resources.ARN` limite la journalisation, et son coût, à cette seule rubrique."
  options:
    a: { en: "Basic event selectors cannot select SNS topics; they support only S3 objects, Lambda functions and DynamoDB tables.", fr: "Les sélecteurs d'événements de base ne peuvent pas sélectionner de rubriques SNS : ils ne prennent en charge que les objets S3, les fonctions Lambda et les tables DynamoDB." }
    b: { en: "Insights events report unusual call or error rates; they do not record each `Publish` call with its caller.", fr: "Les événements Insights signalent des taux d'appels ou d'erreurs inhabituels ; ils n'enregistrent pas chaque appel `Publish` avec son appelant." }
    c: { en: "Delivery status logs describe deliveries to subscription endpoints, not who called `Publish` on the topic.", fr: "Les journaux d'état de livraison décrivent les livraisons vers les points de terminaison des abonnements, et non qui a appelé `Publish` sur la rubrique." }
references:
  - title: Logging data events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
