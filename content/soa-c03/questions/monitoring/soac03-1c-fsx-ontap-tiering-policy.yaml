id: soac03-1c-fsx-ontap-tiering-policy
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Amazon FSx for NetApp ONTAP. All its volumes were created with the AWS CLI and default settings. The SSD tier is now 85% used, mostly by user files that have not been accessed for months, while the capacity pool holds only snapshot data. The company wants to free SSD capacity at the lowest cost while keeping actively used files on SSD.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise Amazon FSx for NetApp ONTAP. Tous ses volumes ont été créés avec l'AWS CLI et les paramètres par défaut. Le niveau SSD est maintenant utilisé à 85 %, surtout par des fichiers utilisateur auxquels personne n'a accédé depuis des mois, tandis que le pool de capacité ne contient que des données d'instantanés. L'entreprise veut libérer de la capacité SSD au moindre coût tout en gardant sur SSD les fichiers activement utilisés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the tiering policy of the volumes to All.", fr: "Définir la politique de hiérarchisation des volumes sur All." } }
    - { id: b, text: { en: "Increase the SSD storage capacity of the file system.", fr: "Augmenter la capacité de stockage SSD du système de fichiers." } }
    - { id: c, text: { en: "Set the tiering policy of the volumes to None.", fr: "Définir la politique de hiérarchisation des volumes sur None." } }
    - { id: d, text: { en: "Set the tiering policy of the volumes to Auto.", fr: "Définir la politique de hiérarchisation des volumes sur Auto." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Volumes created with the AWS CLI or the FSx API default to the Snapshot Only tiering policy, which moves only cold snapshot blocks to the capacity pool, so cold user data stays on SSD. The Auto policy also tiers user data that has not been accessed for the cooling period, and randomly read blocks return to SSD, so active files stay on the SSD tier."
    fr: "Les volumes créés avec l'AWS CLI ou l'API FSx utilisent par défaut la politique de hiérarchisation Snapshot Only, qui ne déplace vers le pool de capacité que les blocs d'instantanés froids : les données utilisateur froides restent sur SSD. La politique Auto hiérarchise aussi les données utilisateur non consultées pendant la période de refroidissement, et les blocs lus de manière aléatoire reviennent sur SSD : les fichiers actifs restent sur le niveau SSD."
  options:
    a:
      en: "All moves all user data and snapshots to the capacity pool, including active files, and reads do not bring data back to SSD."
      fr: "All déplace toutes les données utilisateur et les instantanés vers le pool de capacité, y compris les fichiers actifs, et les lectures ne ramènent pas les données sur SSD."
    b:
      en: "Adding SSD capacity keeps paying SSD prices for cold data instead of moving it to the cheaper capacity pool."
      fr: "Ajouter de la capacité SSD continue de payer le prix du SSD pour des données froides au lieu de les déplacer vers le pool de capacité, moins cher."
    c:
      en: "None prevents any tiering, so it would keep even the snapshot data on SSD."
      fr: "None empêche toute hiérarchisation : même les données d'instantanés resteraient sur SSD."
references:
  - title: Volume storage capacity
    url: https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/volume-storage-capacity.html
