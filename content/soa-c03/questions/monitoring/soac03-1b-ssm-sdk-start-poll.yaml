id: soac03-1b-ssm-sdk-start-poll
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A deployment script written with the AWS SDK for Python (Boto3) must run the AWS-owned AWS-CreateImage runbook to create an AMI of an Amazon EC2 instance. The script must wait until the automation finishes and then continue only if the automation succeeded.

    Which combination of Systems Manager API operations should the script use?
  fr: |
    Un script de déploiement écrit avec l'AWS SDK for Python (Boto3) doit exécuter le runbook AWS-CreateImage fourni par AWS pour créer une AMI d'une instance Amazon EC2. Le script doit attendre la fin de l'automatisation, puis continuer uniquement si l'automatisation a réussi.

    Quelle combinaison d'opérations d'API Systems Manager le script doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Call SendCommand, then call GetCommandInvocation until the status is Success.", fr: "Appeler SendCommand, puis appeler GetCommandInvocation jusqu'à ce que le statut soit Success." } }
    - { id: b, text: { en: "Call StartAutomationExecution, then call GetAutomationExecution until AutomationExecutionStatus is Success or a failure status.", fr: "Appeler StartAutomationExecution, puis appeler GetAutomationExecution jusqu'à ce que AutomationExecutionStatus soit Success ou un statut d'échec." } }
    - { id: c, text: { en: "Call CreateAssociation, then call DescribeInstanceInformation until the instance PingStatus is Online.", fr: "Appeler CreateAssociation, puis appeler DescribeInstanceInformation jusqu'à ce que le PingStatus de l'instance soit Online." } }
    - { id: d, text: { en: "Call StartAutomationExecution, then call ListCommandInvocations until no invocation is still in progress.", fr: "Appeler StartAutomationExecution, puis appeler ListCommandInvocations jusqu'à ce qu'aucune invocation ne soit en cours." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      StartAutomationExecution starts a runbook and returns an AutomationExecutionId. GetAutomationExecution returns the details of that execution, including its overall status, so the script can poll it until the automation reaches Success or a failure status such as Failed or Cancelled.
    fr: |
      StartAutomationExecution lance un runbook et renvoie un AutomationExecutionId. GetAutomationExecution renvoie le détail de cette exécution, dont son statut global : le script peut l'interroger jusqu'à ce que l'automatisation atteigne Success ou un statut d'échec comme Failed ou Cancelled.
  options:
    a: { en: "SendCommand and GetCommandInvocation belong to Run Command, which runs Command documents, not Automation runbooks.", fr: "SendCommand et GetCommandInvocation appartiennent à Run Command, qui exécute des documents de type Command, pas des runbooks Automation." }
    c: { en: "An association applies a document on a schedule, and instance information shows SSM Agent status, not the result of the runbook.", fr: "Une association applique un document selon une planification, et les informations d'instance montrent l'état de SSM Agent, pas le résultat du runbook." }
    d: { en: "Command invocations track Run Command, so they do not report the status of an automation.", fr: "Les invocations de commandes suivent Run Command : elles n'indiquent pas le statut d'une automatisation." }
references:
  - title: GetAutomationExecution
    url: https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_GetAutomationExecution.html
  - title: AWS-CreateImage
    url: https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-aws-createimage.html
