id: soac03-1a-agent-procstat
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs NGINX on Amazon EC2 Linux instances that already have the CloudWatch agent. Twice this month, the `nginx` process stopped while the instance stayed healthy, and no alarm fired. The operations team wants an alarm when no `nginx` process is running on an instance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute NGINX sur des instances Amazon EC2 Linux sur lesquelles l'agent CloudWatch est déjà installé. Deux fois ce mois-ci, le processus `nginx` s'est arrêté alors que l'instance restait saine, et aucune alarme ne s'est déclenchée. L'équipe des opérations veut une alarme quand aucun processus `nginx` ne s'exécute sur une instance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an alarm on `StatusCheckFailed_Instance` for each instance, with an EC2 reboot action.", fr: "Créer une alarme sur `StatusCheckFailed_Instance` pour chaque instance, avec une action EC2 de redémarrage." }
    - id: b
      text: { en: "Add the `processes` collector with the `running` measurement and alarm when the value falls below its usual level.", fr: "Ajouter le collecteur `processes` avec la mesure `running` et créer une alarme quand la valeur passe sous son niveau habituel." }
    - id: c
      text: { en: "Add a `procstat` entry with `\"exe\": \"nginx\"` and the `pid_count` measurement, then alarm when `procstat_lookup_pid_count` is below 1.", fr: "Ajouter une entrée `procstat` avec `\"exe\": \"nginx\"` et la mesure `pid_count`, puis créer une alarme quand `procstat_lookup_pid_count` est inférieur à 1." }
    - id: d
      text: { en: "Turn on detailed monitoring and alarm when `CPUUtilization` stays at 0 percent for 5 minutes.", fr: "Activer la surveillance détaillée et créer une alarme quand `CPUUtilization` reste à 0 % pendant 5 minutes." }
answer: { optionId: c }
explanation:
  correct:
    en: "The procstat plugin of the CloudWatch agent selects processes by name with `exe` (a regular expression) and reports `pid_count`, the number of matching process IDs, as `procstat_lookup_pid_count` on Linux. An alarm on this metric below 1 detects that NGINX is not running even though the instance itself is healthy."
    fr: "Le plug-in procstat de l'agent CloudWatch sélectionne les processus par nom avec `exe` (une expression régulière) et indique `pid_count`, le nombre d'ID de processus correspondants, sous le nom `procstat_lookup_pid_count` sur Linux. Une alarme sur cette métrique inférieure à 1 détecte que NGINX ne s'exécute pas, même si l'instance elle-même est saine."
  options:
    a: { en: "The instance status check tests the operating system and network of the instance, not whether one process is running.", fr: "La vérification de l'état de l'instance teste le système d'exploitation et le réseau de l'instance, et non l'exécution d'un processus donné." }
    b: { en: "The `processes` collector counts all processes by state; it cannot tell whether `nginx` is among them.", fr: "Le collecteur `processes` compte tous les processus par état ; il ne peut pas indiquer si `nginx` en fait partie." }
    d: { en: "CPU use does not drop to 0 when one process stops, because the operating system and other processes keep running.", fr: "L'utilisation du processeur ne tombe pas à 0 quand un processus s'arrête, car le système d'exploitation et les autres processus continuent de s'exécuter." }
references:
  - title: Collect process metrics with the procstat plugin
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-procstat-process-metrics.html
