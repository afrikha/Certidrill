id: soac03-1c-rds-io-bottleneck-metrics
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Users report slow queries on an Amazon RDS for PostgreSQL DB instance. A CloudOps engineer suspects that the storage, not the CPU or the memory, limits performance.

    Which two CloudWatch metrics will best confirm a storage I/O bottleneck? (Choose two.)
  fr: |
    Des utilisateurs signalent des requêtes lentes sur une instance de base de données Amazon RDS for PostgreSQL. Un ingénieur CloudOps soupçonne que c'est le stockage, et non le processeur ou la mémoire, qui limite les performances.

    Quelles sont les deux métriques CloudWatch qui confirmeront le mieux un goulot d'étranglement des E/S de stockage ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "FreeableMemory", fr: "FreeableMemory" } }
    - { id: b, text: { en: "DiskQueueDepth", fr: "DiskQueueDepth" } }
    - { id: c, text: { en: "DatabaseConnections", fr: "DatabaseConnections" } }
    - { id: d, text: { en: "ReadLatency", fr: "ReadLatency" } }
    - { id: e, text: { en: "CPUCreditBalance", fr: "CPUCreditBalance" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "DiskQueueDepth counts the I/O requests waiting to access the disk, and ReadLatency is the average time taken per disk read operation. A growing queue together with rising read latency shows that the storage cannot keep up with the I/O requests, which points to a storage bottleneck rather than a CPU or memory problem."
    fr: "DiskQueueDepth compte les requêtes d'E/S en attente d'accès au disque, et ReadLatency est le temps moyen de chaque opération de lecture disque. Une file qui s'allonge et une latence de lecture qui augmente montrent que le stockage ne suit pas les requêtes d'E/S, ce qui désigne un goulot d'étranglement du stockage plutôt qu'un problème de processeur ou de mémoire."
  options:
    a:
      en: "FreeableMemory shows the available RAM; it points to memory pressure, not directly to a storage limit."
      fr: "FreeableMemory indique la mémoire vive disponible ; elle révèle une pression sur la mémoire, pas directement une limite du stockage."
    c:
      en: "DatabaseConnections counts client connections and does not measure disk performance."
      fr: "DatabaseConnections compte les connexions clientes et ne mesure pas les performances du disque."
    e:
      en: "CPUCreditBalance applies only to burstable instance classes and concerns CPU, not storage."
      fr: "CPUCreditBalance ne s'applique qu'aux classes d'instance à capacité extensible et concerne le processeur, pas le stockage."
references:
  - title: Amazon CloudWatch metrics for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-metrics.html
