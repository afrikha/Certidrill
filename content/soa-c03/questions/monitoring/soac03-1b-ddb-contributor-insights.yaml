id: soac03-1b-ddb-contributor-insights
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company stores player sessions in an Amazon DynamoDB table. During peak hours, the table's throttled request metrics increase, even though the table's total consumed capacity is far below its limits. The team suspects that a few partition keys receive most of the traffic.

    An administrator must identify the partition keys that are accessed the most and throttled the most, without changing the application code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo stocke les sessions des joueurs dans une table Amazon DynamoDB. Aux heures de pointe, les métriques de requêtes limitées de la table augmentent, alors que la capacité totale consommée reste très inférieure aux limites de la table. L'équipe soupçonne que quelques clés de partition reçoivent la majeure partie du trafic.

    Un administrateur doit identifier les clés de partition les plus sollicitées et les plus limitées, sans modifier le code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable CloudWatch Contributor Insights for DynamoDB on the table in accessed and throttled keys mode.", fr: "Activer CloudWatch Contributor Insights pour DynamoDB sur la table en mode des clés sollicitées et limitées (accessed and throttled keys)." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the ConsumedReadCapacityUnits metric with the Maximum statistic and a 1-minute period.", fr: "Créer une alarme CloudWatch sur la métrique ConsumedReadCapacityUnits avec la statistique Maximum et une période de 1 minute." } }
    - { id: c, text: { en: "Create a CloudTrail trail that logs DynamoDB management events and query the trail with CloudWatch Logs Insights.", fr: "Créer un journal de suivi CloudTrail qui enregistre les événements de gestion DynamoDB et l'interroger avec CloudWatch Logs Insights." } }
    - { id: d, text: { en: "Add a DynamoDB Accelerator (DAX) cluster in front of the table and monitor its cache hit metrics.", fr: "Ajouter un cluster DynamoDB Accelerator (DAX) devant la table et surveiller ses métriques de succès de cache." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Contributor Insights for DynamoDB reports the most accessed and the most throttled items of a table or global secondary index. In accessed and throttled keys mode, DynamoDB creates the Contributor Insights rules for you, including rules for the most accessed and the most throttled partition keys. It needs no code change and has no performance impact on the table.
    fr: |
      Contributor Insights pour DynamoDB indique les éléments les plus sollicités et les plus limités d'une table ou d'un index secondaire global. En mode des clés sollicitées et limitées, DynamoDB crée pour vous les règles Contributor Insights, dont celles des clés de partition les plus sollicitées et les plus limitées. Aucune modification du code n'est nécessaire et la table ne subit aucun impact sur ses performances.
  options:
    b: { en: "Table-level capacity metrics show totals; they cannot show which partition keys receive the traffic.", fr: "Les métriques de capacité au niveau de la table montrent des totaux ; elles ne peuvent pas montrer quelles clés de partition reçoivent le trafic." }
    c: { en: "Management events record control plane calls such as CreateTable, not item reads and writes with their keys.", fr: "Les événements de gestion enregistrent les appels du plan de contrôle comme CreateTable, pas les lectures et écritures d'éléments avec leurs clés." }
    d: { en: "DAX can reduce read load, but it requires application changes and does not identify the hot keys.", fr: "DAX peut réduire la charge de lecture, mais il exige des modifications de l'application et n'identifie pas les clés sollicitées." }
references:
  - title: "CloudWatch contributor insights for DynamoDB: How it works"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/contributorinsights_HowItWorks.html
