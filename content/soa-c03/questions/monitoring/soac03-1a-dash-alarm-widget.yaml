id: soac03-1a-dash-alarm-widget
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The payments team owns 50 CloudWatch alarms. The team wants one area of its CloudWatch dashboard to list only the alarms that are currently in the ALARM or INSUFFICIENT_DATA state, with the most recent state change first.

    Which solution will meet these requirements?
  fr: |
    L'équipe des paiements possède 50 alarmes CloudWatch. L'équipe veut qu'une zone de son tableau de bord CloudWatch liste uniquement les alarmes actuellement à l'état ALARM ou INSUFFICIENT_DATA, avec le changement d'état le plus récent en premier.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an alarm widget with the 50 alarms, `states` set to ALARM and INSUFFICIENT_DATA, and `sortBy` set to `timestamp`.", fr: "Ajouter un widget d'état d'alarmes avec les 50 alarmes, un filtre `states` sur ALARM et INSUFFICIENT_DATA, et `sortBy` défini à `timestamp`." }
    - id: b
      text: { en: "Add a metric widget with the 50 alarms as annotations, set its view to `table`, and sort the rows by time.", fr: "Ajouter un widget de métrique avec les 50 alarmes comme annotations, définir sa vue à `table` et trier les lignes par heure." }
    - id: c
      text: { en: "Add a Logs Insights widget that queries the alarm history and sorts the results by state change time.", fr: "Ajouter un widget Logs Insights qui interroge l'historique des alarmes et trie les résultats par heure de changement d'état." }
    - id: d
      text: { en: "Add a text widget with the names of the 50 alarms and a link to the alarm list of the console, filtered on ALARM.", fr: "Ajouter un widget de texte avec les noms des 50 alarmes et un lien vers la liste des alarmes de la console, filtrée sur ALARM." }
answer: { optionId: a }
explanation:
  correct:
    en: "An alarm widget (`type: alarm`) lists from 1 to 100 alarms by ARN. Its `states` property filters the alarms shown, and `sortBy` set to `timestamp` puts the most recent state change first, whatever the state."
    fr: "Un widget d'alarmes (`type: alarm`) liste de 1 à 100 alarmes par ARN. Sa propriété `states` filtre les alarmes affichées, et `sortBy` défini à `timestamp` place le changement d'état le plus récent en premier, quel que soit l'état."
  options:
    b: { en: "A metric widget can have only one alarm annotation, and it graphs the alarm's metric instead of listing alarm states.", fr: "Un widget de métrique ne peut avoir qu'une seule annotation d'alarme, et il trace la métrique de l'alarme au lieu de lister les états." }
    c: { en: "Alarm history is not stored in a CloudWatch Logs log group, so a Logs Insights widget cannot query it.", fr: "L'historique des alarmes n'est pas stocké dans un groupe de journaux CloudWatch Logs : un widget Logs Insights ne peut pas l'interroger." }
    d: { en: "A text widget shows static Markdown and cannot filter alarms by their current state.", fr: "Un widget de texte affiche du Markdown statique et ne peut pas filtrer les alarmes selon leur état actuel." }
references:
  - title: Dashboard Body Structure and Syntax
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/CloudWatch-Dashboard-Body-Structure.html
