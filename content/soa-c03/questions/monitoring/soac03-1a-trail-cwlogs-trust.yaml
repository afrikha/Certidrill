id: soac03-1a-trail-cwlogs-trust
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company updates an existing AWS CloudTrail trail so that it also delivers events to a new Amazon CloudWatch Logs log group. The operations team plans to create metric filters on the log group. The trail still delivers log files to its Amazon S3 bucket, but no log stream ever appears in the log group.

    The IAM role that the trail uses for CloudWatch Logs delivery allows `logs:CreateLogStream` and `logs:PutLogEvents` on the log group. The role has this trust policy:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "Service": "logs.amazonaws.com" },
          "Action": "sts:AssumeRole"
        }
      ]
    }
    ```

    Which solution will fix the problem?
  fr: |
    Une entreprise modifie un journal de suivi (trail) AWS CloudTrail existant pour qu'il livre aussi les événements à un nouveau groupe de journaux Amazon CloudWatch Logs. L'équipe des opérations prévoit de créer des filtres de métrique sur ce groupe de journaux. Le journal de suivi livre toujours ses fichiers journaux dans son compartiment Amazon S3, mais aucun flux de journaux n'apparaît jamais dans le groupe de journaux.

    Le rôle IAM que le journal de suivi utilise pour la livraison à CloudWatch Logs autorise `logs:CreateLogStream` et `logs:PutLogEvents` sur le groupe de journaux. Le rôle possède cette politique d'approbation :

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "Service": "logs.amazonaws.com" },
          "Action": "sts:AssumeRole"
        }
      ]
    }
    ```

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - id: a
      text: { en: "Attach the CloudWatchLogsFullAccess managed policy to the role so that it can write to any log group.", fr: "Attacher la politique gérée CloudWatchLogsFullAccess au rôle pour qu'il puisse écrire dans n'importe quel groupe de journaux." }
    - id: b
      text: { en: "Change the principal of the trust policy to the `cloudtrail.amazonaws.com` service principal.", fr: "Remplacer le principal de la politique d'approbation par le principal de service `cloudtrail.amazonaws.com`." }
    - id: c
      text: { en: "Add a resource-based policy to the log group for `cloudtrail.amazonaws.com` and remove the role from the trail.", fr: "Ajouter au groupe de journaux une politique basée sur les ressources pour `cloudtrail.amazonaws.com` et retirer le rôle du journal de suivi." }
    - id: d
      text: { en: "Turn on log file integrity validation for the trail so that CloudTrail retries the delivery.", fr: "Activer la validation de l'intégrité des fichiers journaux du journal de suivi pour que CloudTrail relance la livraison." }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudTrail delivers events to CloudWatch Logs by assuming the IAM role that is set on the trail. The role's trust policy must therefore allow the `cloudtrail.amazonaws.com` service principal to call `sts:AssumeRole`. The permissions policy is already correct, so only the trust policy blocks the delivery."
    fr: "CloudTrail livre les événements à CloudWatch Logs en assumant le rôle IAM défini sur le journal de suivi. La politique d'approbation du rôle doit donc autoriser le principal de service `cloudtrail.amazonaws.com` à appeler `sts:AssumeRole`. La politique d'autorisations est déjà correcte : seule la politique d'approbation bloque la livraison."
  options:
    a: { en: "More permissions do not help: CloudTrail still cannot assume a role that trusts only the CloudWatch Logs service.", fr: "Davantage d'autorisations n'aident pas : CloudTrail ne peut toujours pas assumer un rôle qui n'approuve que le service CloudWatch Logs." }
    c: { en: "CloudTrail delivery to CloudWatch Logs is configured with an IAM role on the trail, not with a resource-based policy on the log group.", fr: "La livraison de CloudTrail à CloudWatch Logs se configure avec un rôle IAM sur le journal de suivi, et non avec une politique basée sur les ressources sur le groupe de journaux." }
    d: { en: "Log file validation produces digest files in Amazon S3; it has no effect on delivery to CloudWatch Logs.", fr: "La validation des fichiers journaux produit des fichiers de synthèse dans Amazon S3 ; elle n'a aucun effet sur la livraison à CloudWatch Logs." }
references:
  - title: Sending events to CloudWatch Logs
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html
