id: soac03-1b-ebs-volume-iops-exceeded
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A database runs on a Nitro-based Amazon EC2 instance and stores its data on a 500 GiB gp3 volume with 3,000 IOPS and 125 MiB/s. During the daily peak, query latency rises. CloudWatch shows that the volume's VolumeIOPSExceededCheck metric is 1 for most minutes of the peak, its VolumeThroughputExceededCheck metric stays at 0, and the instance's InstanceEBSIOPSExceededCheck metric stays at 0.

    Which solution will remove the bottleneck without downtime in the MOST cost-effective way?
  fr: |
    Une base de données s'exécute sur une instance Amazon EC2 basée sur Nitro et stocke ses données sur un volume gp3 de 500 Gio avec 3 000 IOPS et 125 Mio/s. Pendant le pic quotidien, la latence des requêtes augmente. CloudWatch montre que la métrique VolumeIOPSExceededCheck du volume vaut 1 pendant la plupart des minutes du pic, que sa métrique VolumeThroughputExceededCheck reste à 0, et que la métrique InstanceEBSIOPSExceededCheck de l'instance reste à 0.

    Quelle solution supprime le goulot d'étranglement sans interruption de service, de la façon la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Increase the provisioned IOPS of the gp3 volume with Elastic Volumes, keeping the same size and throughput.", fr: "Augmenter les IOPS provisionnées du volume gp3 avec Elastic Volumes, en conservant la même taille et le même débit." } }
    - { id: b, text: { en: "Change the instance to a larger instance type that has a higher EBS IOPS limit than the current type.", fr: "Passer l'instance à un type d'instance plus grand dont la limite d'IOPS EBS est supérieure à celle du type actuel." } }
    - { id: c, text: { en: "Increase the size of the gp3 volume to 1,000 GiB so that its baseline IOPS doubles.", fr: "Porter la taille du volume gp3 à 1 000 Gio pour que ses IOPS de base doublent." } }
    - { id: d, text: { en: "Increase the provisioned throughput of the gp3 volume to 500 MiB/s with Elastic Volumes.", fr: "Augmenter le débit provisionné du volume gp3 à 500 Mio/s avec Elastic Volumes." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      VolumeIOPSExceededCheck = 1 means that the application consistently tried to drive more IOPS than the volume provides, while the throughput check and the instance-level check show no other limit. gp3 IOPS are provisioned independently of size (3,000 included, up to 500 IOPS per GiB), and Elastic Volumes changes them while the volume stays attached and in use.
    fr: |
      VolumeIOPSExceededCheck = 1 signifie que l'application a constamment tenté d'obtenir plus d'IOPS que le volume n'en fournit, alors que la vérification du débit et celle de l'instance n'indiquent aucune autre limite. Les IOPS gp3 sont provisionnées indépendamment de la taille (3 000 incluses, jusqu'à 500 IOPS par Gio), et Elastic Volumes les modifie pendant que le volume reste attaché et utilisé.
  options:
    b: { en: "InstanceEBSIOPSExceededCheck stays at 0, so the instance's EBS limit is not the bottleneck, and changing the instance type needs a stop.", fr: "InstanceEBSIOPSExceededCheck reste à 0 : la limite EBS de l'instance n'est pas le goulot d'étranglement, et changer de type d'instance exige un arrêt." }
    c: { en: "gp3 baseline IOPS do not grow with size; a larger volume would still have 3,000 IOPS and would cost more.", fr: "Les IOPS de base gp3 n'augmentent pas avec la taille : un volume plus grand aurait toujours 3 000 IOPS et coûterait plus cher." }
    d: { en: "The throughput check is 0, so more throughput does not address the IOPS limit.", fr: "La vérification du débit vaut 0 : plus de débit ne résout pas la limite d'IOPS." }
references:
  - title: Amazon CloudWatch metrics for Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/using_cloudwatch_ebs.html
  - title: Amazon EBS General Purpose SSD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
