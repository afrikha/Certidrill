id: soac03-1c-s3files-import-rules
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company mounts an Amazon S3 Files file system on Amazon EC2 instances for a training job. Each run lists a directory and then reads thousands of files of 200 KiB to 800 KiB several times over a few hours. The file system uses the default synchronization configuration, and the reads are slower than the team wants. After a run, the data is not read again for weeks, and the company does not want to keep paying to store it on the file system.

    Which synchronization configuration will meet these requirements?
  fr: |
    Une entreprise monte un système de fichiers Amazon S3 Files sur des instances Amazon EC2 pour une tâche d'entraînement. Chaque exécution liste un répertoire, puis lit des milliers de fichiers de 200 Kio à 800 Kio plusieurs fois en quelques heures. Le système de fichiers utilise la configuration de synchronisation par défaut, et les lectures sont plus lentes que ce que l'équipe souhaite. Après une exécution, les données ne sont plus lues pendant des semaines, et l'entreprise ne veut pas continuer à payer leur stockage sur le système de fichiers.

    Quelle configuration de synchronisation répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An import rule with sizeLessThan set to 0 and trigger ON_FILE_ACCESS, and an expiration rule with daysAfterLastAccess set to 3", fr: "Une règle d'importation avec sizeLessThan à 0 et le déclencheur ON_FILE_ACCESS, et une règle d'expiration avec daysAfterLastAccess à 3" } }
    - { id: b, text: { en: "An import rule with sizeLessThan set to 1 MiB and trigger ON_DIRECTORY_FIRST_ACCESS, and an expiration rule with daysAfterLastAccess set to 3", fr: "Une règle d'importation avec sizeLessThan à 1 Mio et le déclencheur ON_DIRECTORY_FIRST_ACCESS, et une règle d'expiration avec daysAfterLastAccess à 3" } }
    - { id: c, text: { en: "The default import rule, and an expiration rule with daysAfterLastAccess set to 365", fr: "La règle d'importation par défaut, et une règle d'expiration avec daysAfterLastAccess à 365" } }
    - { id: d, text: { en: "An import rule with sizeLessThan set to 1 MiB and trigger ON_FILE_ACCESS, and an expiration rule with daysAfterLastAccess set to 90", fr: "Une règle d'importation avec sizeLessThan à 1 Mio et le déclencheur ON_FILE_ACCESS, et une règle d'expiration avec daysAfterLastAccess à 90" } }
answer: { optionId: b }
explanation:
  correct:
    en: "By default, S3 Files imports data only for files smaller than 128 KiB, so these files are always read from S3. Raising sizeLessThan above the file sizes with the ON_DIRECTORY_FIRST_ACCESS trigger preloads the files onto the low-latency high-performance storage when the job lists the directory. A short expiration removes the data a few days after the last read, which keeps storage charges low."
    fr: "Par défaut, S3 Files n'importe les données que pour les fichiers de moins de 128 Kio : ces fichiers sont donc toujours lus depuis S3. Relever sizeLessThan au-dessus de la taille des fichiers avec le déclencheur ON_DIRECTORY_FIRST_ACCESS précharge les fichiers sur le stockage hautes performances à faible latence lorsque la tâche liste le répertoire. Une expiration courte retire les données quelques jours après la dernière lecture, ce qui limite les frais de stockage."
  options:
    a:
      en: "A threshold of 0 imports no file data at all, so every read is served from S3 with higher latency; it suits workloads that rarely reread files."
      fr: "Un seuil de 0 n'importe aucune donnée de fichier : chaque lecture est servie depuis S3 avec une latence plus élevée ; ce réglage convient aux charges qui relisent rarement les fichiers."
    c:
      en: "The default threshold of 128 KiB still excludes these files, and a 365-day expiration keeps paying for data that is not read for weeks."
      fr: "Le seuil par défaut de 128 Kio exclut toujours ces fichiers, et une expiration de 365 jours fait payer le stockage de données non lues pendant des semaines."
    d:
      en: "ON_FILE_ACCESS imports a file only at its first read, so first reads stay slow, and a 90-day expiration keeps the data on the file system long after the run."
      fr: "ON_FILE_ACCESS n'importe un fichier qu'à sa première lecture : les premières lectures restent lentes, et une expiration de 90 jours garde les données sur le système de fichiers longtemps après l'exécution."
references:
  - title: Customizing synchronization for S3 Files
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files-synchronization-customizing.html
