id: soac03-1b-error-rate-metric-math
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company has a CloudWatch alarm on the HTTPCode_Target_5XX_Count metric of its Application Load Balancer with a threshold of 100 errors in 5 minutes. The alarm goes to ALARM every evening during peak traffic, even when only a small share of requests fail, and it misses real incidents at night when traffic is low.

    The company wants the alarm to go to ALARM when more than 2 % of the requests that targets process return a 5XX code, regardless of traffic volume.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce électronique a une alarme CloudWatch sur la métrique HTTPCode_Target_5XX_Count de son Application Load Balancer, avec un seuil de 100 erreurs en 5 minutes. L'alarme passe à l'état ALARM chaque soir aux heures de pointe, même quand seule une petite part des requêtes échoue, et elle manque de vrais incidents la nuit, quand le trafic est faible.

    L'entreprise veut que l'alarme passe à l'état ALARM lorsque plus de 2 % des requêtes traitées par les cibles renvoient un code 5XX, quel que soit le volume de trafic.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the alarm statistic of HTTPCode_Target_5XX_Count from Sum to Average and set the threshold to 0.02.", fr: "Remplacer la statistique Sum de l'alarme sur HTTPCode_Target_5XX_Count par Average et fixer le seuil à 0,02." } }
    - { id: b, text: { en: "Create a composite alarm that goes to ALARM only when the 5XX alarm and a new alarm on RequestCount are both in ALARM.", fr: "Créer une alarme composite qui passe à l'état ALARM uniquement lorsque l'alarme 5XX et une nouvelle alarme sur RequestCount sont toutes deux à l'état ALARM." } }
    - { id: c, text: { en: "Create an alarm on a metric math expression 100*(m1/m2), where m1 is the Sum of HTTPCode_Target_5XX_Count and m2 is the Sum of RequestCount, with a threshold of 2.", fr: "Créer une alarme sur une expression mathématique de métriques 100*(m1/m2), où m1 est la somme (Sum) de HTTPCode_Target_5XX_Count et m2 la somme (Sum) de RequestCount, avec un seuil de 2." } }
    - { id: d, text: { en: "Create a CloudWatch Logs metric filter on the access logs that counts lines with a 5XX code, and set its threshold to 2.", fr: "Créer un filtre de métrique CloudWatch Logs sur les journaux d'accès qui compte les lignes avec un code 5XX, et fixer son seuil à 2." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Metric math combines metrics into a new time series, and an alarm can watch the result of an expression. Dividing the Sum of target 5XX responses by the Sum of RequestCount and multiplying by 100 gives an error percentage that does not depend on traffic volume, so a threshold of 2 matches the requirement.
    fr: |
      Les expressions mathématiques de métriques combinent des métriques en une nouvelle série temporelle, et une alarme peut surveiller le résultat d'une expression. Diviser la somme des réponses 5XX des cibles par la somme de RequestCount, puis multiplier par 100, donne un pourcentage d'erreurs indépendant du volume de trafic : un seuil de 2 correspond à l'exigence.
  options:
    a: { en: "For the HTTP code count metrics, Average always returns 1, so it does not express a share of the requests.", fr: "Pour les métriques de nombre de codes HTTP, Average renvoie toujours 1 : elle n'exprime pas une part des requêtes." }
    b: { en: "Both child alarms still use fixed counts, so the composite alarm cannot express a percentage of requests.", fr: "Les deux alarmes enfants utilisent toujours des nombres fixes : l'alarme composite ne peut pas exprimer un pourcentage de requêtes." }
    d: { en: "A metric filter still produces a count of errors, not a share of the requests, so a threshold of 2 means two errors.", fr: "Un filtre de métrique produit toujours un nombre d'erreurs, pas une part des requêtes : un seuil de 2 signifie deux erreurs." }
references:
  - title: Math expressions with metrics
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/using-metric-math.html
  - title: CloudWatch metrics for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-cloudwatch-metrics.html
