id: soac03-1c-rds-gp3-iops-threshold
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon RDS for MySQL DB instance uses 300 GiB of gp3 storage with the baseline performance. During a nightly batch, ReadIOPS plus WriteIOPS stays flat at about 3,000 and DiskQueueDepth climbs. The workload needs about 10,000 IOPS. A CloudOps engineer tries to set the provisioned IOPS of the gp3 storage to 10,000, but RDS does not allow it.

    Which solution will meet the requirement MOST cost-effectively?
  fr: |
    Une instance de base de données Amazon RDS for MySQL utilise 300 Gio de stockage gp3 avec les performances de référence. Pendant un traitement par lots nocturne, la somme de ReadIOPS et WriteIOPS reste plate autour de 3 000 et DiskQueueDepth augmente. La charge de travail a besoin d'environ 10 000 IOPS. Un ingénieur CloudOps essaie de définir les IOPS provisionnées du stockage gp3 à 10 000, mais RDS ne le permet pas.

    Quelle solution répond à l'exigence de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Change the storage type to gp2 so that the volume can burst above its baseline.", fr: "Changer le type de stockage en gp2 pour que le volume puisse dépasser son niveau de référence en rafale." } }
    - { id: b, text: { en: "Change the storage type to io2 Block Express with 10,000 provisioned IOPS.", fr: "Changer le type de stockage en io2 Block Express avec 10 000 IOPS provisionnées." } }
    - { id: c, text: { en: "Enable storage autoscaling with a maximum storage threshold of 1,000 GiB.", fr: "Activer la mise à l'échelle automatique du stockage avec un seuil de stockage maximal de 1 000 Gio." } }
    - { id: d, text: { en: "Increase the allocated gp3 storage to 400 GiB, which raises the baseline to 12,000 IOPS.", fr: "Augmenter le stockage gp3 alloué à 400 Gio, ce qui porte le niveau de référence à 12 000 IOPS." } }
answer: { optionId: d }
explanation:
  correct:
    en: "For RDS for MySQL, MariaDB, PostgreSQL and Db2, gp3 storage below 400 GiB has a fixed baseline of 3,000 IOPS and 125 MiB/s, and extra IOPS can be provisioned only at or above 400 GiB. At 400 GiB, RDS stripes the storage across four volumes and the baseline becomes 12,000 IOPS and 500 MiB/s, so adding 100 GiB of gp3 meets the need for far less than provisioned IOPS storage."
    fr: "Pour RDS for MySQL, MariaDB, PostgreSQL et Db2, le stockage gp3 de moins de 400 Gio a un niveau de référence fixe de 3 000 IOPS et 125 Mio/s, et des IOPS supplémentaires ne peuvent être provisionnées qu'à partir de 400 Gio. À 400 Gio, RDS répartit le stockage sur quatre volumes et le niveau de référence passe à 12 000 IOPS et 500 Mio/s : ajouter 100 Gio de gp3 répond au besoin pour bien moins cher qu'un stockage à IOPS provisionnées."
  options:
    a:
      en: "A 300 GiB gp2 volume has a baseline of 900 IOPS and bursts only up to 3,000 IOPS while credits last, so it cannot sustain 10,000 IOPS."
      fr: "Un volume gp2 de 300 Gio a un niveau de référence de 900 IOPS et ne monte en rafale qu'à 3 000 IOPS tant qu'il reste des crédits : il ne peut pas soutenir 10 000 IOPS."
    b:
      en: "io2 Block Express delivers the IOPS, but paying for 10,000 provisioned IOPS costs much more than 100 GiB of additional gp3 storage."
      fr: "io2 Block Express fournit les IOPS, mais payer 10 000 IOPS provisionnées coûte beaucoup plus cher que 100 Gio de stockage gp3 supplémentaire."
    c:
      en: "Storage autoscaling grows storage only when free space runs low, so it does not respond to an IOPS limit."
      fr: "La mise à l'échelle automatique du stockage n'augmente le stockage que lorsque l'espace libre devient faible : elle ne réagit pas à une limite d'IOPS."
references:
  - title: Amazon RDS DB instance storage
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html
