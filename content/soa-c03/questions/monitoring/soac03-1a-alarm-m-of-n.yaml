id: soac03-1a-alarm-m-of-n
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CloudWatch alarm watches the `CPUUtilization` metric of an Amazon EC2 instance that has detailed monitoring. The alarm uses a period of 60 seconds, a threshold of 80 percent, and 1 evaluation period. It sends many notifications for one-minute CPU spikes. The operations team wants the alarm to go into the ALARM state only when at least 3 of the last 5 one-minute data points exceed the threshold.

    Which configuration will meet these requirements?
  fr: |
    Une alarme CloudWatch surveille la métrique `CPUUtilization` d'une instance Amazon EC2 dotée de la surveillance détaillée. L'alarme utilise une période de 60 secondes, un seuil de 80 % et 1 période d'évaluation. Elle envoie de nombreuses notifications pour des pics de processeur d'une minute. L'équipe des opérations veut que l'alarme passe à l'état ALARM uniquement quand au moins 3 des 5 derniers points de données d'une minute dépassent le seuil.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Evaluation periods 3 and datapoints to alarm 3, with a period of 60 seconds", fr: "Périodes d'évaluation 3 et points de données pour l'alarme 3, avec une période de 60 secondes" }
    - id: b
      text: { en: "Evaluation periods 1 and datapoints to alarm 1, with a period of 300 seconds", fr: "Périodes d'évaluation 1 et points de données pour l'alarme 1, avec une période de 300 secondes" }
    - id: c
      text: { en: "Evaluation periods 3 and datapoints to alarm 5, with a period of 60 seconds", fr: "Périodes d'évaluation 3 et points de données pour l'alarme 5, avec une période de 60 secondes" }
    - id: d
      text: { en: "Evaluation periods 5 and datapoints to alarm 3, with a period of 60 seconds", fr: "Périodes d'évaluation 5 et points de données pour l'alarme 3, avec une période de 60 secondes" }
answer: { optionId: d }
explanation:
  correct:
    en: "This is an M out of N alarm: Evaluation Periods (N = 5) sets how many recent data points are evaluated, and Datapoints to Alarm (M = 3) sets how many of them must breach. The breaching points do not have to be consecutive, and the evaluation window is 5 × 60 seconds."
    fr: "Il s'agit d'une alarme M sur N : les périodes d'évaluation (N = 5) fixent le nombre de points de données récents évalués, et les points de données pour l'alarme (M = 3) fixent combien d'entre eux doivent dépasser le seuil. Les points en dépassement n'ont pas besoin d'être consécutifs, et la fenêtre d'évaluation est de 5 × 60 secondes."
  options:
    a: { en: "3 out of 3 requires three consecutive breaching minutes, which is stricter than any 3 of the last 5.", fr: "3 sur 3 exige trois minutes consécutives en dépassement, ce qui est plus strict que 3 quelconques sur les 5 dernières." }
    b: { en: "A 5-minute average can stay below 80 percent even when 3 of its 5 minutes are above the threshold.", fr: "Une moyenne sur 5 minutes peut rester sous 80 % même quand 3 de ses 5 minutes dépassent le seuil." }
    c: { en: "Datapoints to alarm cannot be larger than the number of evaluation periods.", fr: "Le nombre de points de données pour l'alarme ne peut pas dépasser le nombre de périodes d'évaluation." }
references:
  - title: Alarm evaluation
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-evaluation.html
