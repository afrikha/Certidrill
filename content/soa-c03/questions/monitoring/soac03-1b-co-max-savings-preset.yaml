id: soac03-1b-co-max-savings-preset
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs development and test workloads on Amazon EC2 instances in a dedicated AWS account. Developers accept that rare, short CPU peaks can be slower. The company wants AWS Compute Optimizer to produce the most aggressive downsizing recommendations for this account, which ignore the highest 10 % of CPU data points and add no extra CPU capacity for growth.

    Which rightsizing recommendation preferences should the operations team set for the account?
  fr: |
    Une entreprise exécute des charges de travail de développement et de test sur des instances Amazon EC2 dans un compte AWS dédié. Les développeurs acceptent que de rares pics de processeur de courte durée soient plus lents. L'entreprise veut qu'AWS Compute Optimizer produise pour ce compte les recommandations de réduction de taille les plus agressives, qui ignorent les 10 % de points de données de processeur les plus élevés et n'ajoutent aucune capacité de processeur pour la croissance.

    Quelles préférences de recommandations de dimensionnement l'équipe d'exploitation doit-elle définir pour le compte ?
body:
  options:
    - { id: a, text: { en: "CPU utilization threshold P99.5 and CPU headroom 30 %", fr: "Seuil d'utilisation du processeur P99.5 et marge de processeur de 30 %" } }
    - { id: b, text: { en: "CPU utilization threshold P90 and CPU headroom 0 %", fr: "Seuil d'utilisation du processeur P90 et marge de processeur de 0 %" } }
    - { id: c, text: { en: "CPU utilization threshold P95 and CPU headroom 30 %", fr: "Seuil d'utilisation du processeur P95 et marge de processeur de 30 %" } }
    - { id: d, text: { en: "CPU utilization threshold P99.5 and CPU headroom 20 %", fr: "Seuil d'utilisation du processeur P99.5 et marge de processeur de 20 %" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The CPU utilization threshold removes the top 10 %, 5 %, or 0.5 % of data points for P90, P95, and P99.5. CPU headroom adds 30 %, 20 %, or 0 % of capacity for future growth. P90 with 0 % headroom is the maximum savings combination, which matches the requirement.
    fr: |
      Le seuil d'utilisation du processeur retire les 10 %, 5 % ou 0,5 % de points de données les plus élevés pour P90, P95 et P99.5. La marge de processeur ajoute 30 %, 20 % ou 0 % de capacité pour la croissance. P90 avec une marge de 0 % est la combinaison d'économies maximales, qui correspond à l'exigence.
  options:
    a: { en: "This is the maximum performance combination: it keeps almost all peaks and adds the largest headroom.", fr: "C'est la combinaison de performances maximales : elle conserve presque tous les pics et ajoute la plus grande marge." }
    c: { en: "P95 ignores only the top 5 % of data points, and 30 % headroom adds capacity for growth.", fr: "P95 n'ignore que les 5 % de points de données les plus élevés, et une marge de 30 % ajoute de la capacité pour la croissance." }
    d: { en: "These are the default values, which keep almost all peaks and add 20 % headroom.", fr: "Ce sont les valeurs par défaut, qui conservent presque tous les pics et ajoutent une marge de 20 %." }
references:
  - title: Rightsizing recommendation preferences
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/rightsizing-preferences.html
