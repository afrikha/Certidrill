id: soac03-1b-t3-credits-unlimited
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an internal reporting application on a t3.large Amazon EC2 instance that uses the standard credit specification. Every month-end, the application becomes slow for several hours. CloudWatch shows that CPUCreditBalance falls steadily to 0 during the month-end jobs and that, from that moment, CPUUtilization stays flat at a lower level than before.

    The company wants to remove the slowdown immediately, without stopping or restarting the instance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application interne de reporting sur une instance Amazon EC2 t3.large qui utilise la spécification de crédits standard. À chaque fin de mois, l'application devient lente pendant plusieurs heures. CloudWatch montre que CPUCreditBalance descend régulièrement jusqu'à 0 pendant les traitements de fin de mois et qu'à partir de ce moment, CPUUtilization reste plate à un niveau inférieur à celui d'avant.

    L'entreprise veut supprimer le ralentissement immédiatement, sans arrêter ni redémarrer l'instance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the instance type to m7i.large, which is not a burstable performance instance.", fr: "Remplacer le type d'instance par m7i.large, qui n'est pas une instance à performances extensibles." } }
    - { id: b, text: { en: "Enable detailed monitoring on the instance so that CPU credits are reported every minute.", fr: "Activer la surveillance détaillée de l'instance pour que les crédits de processeur soient indiqués chaque minute." } }
    - { id: c, text: { en: "Change the root EBS volume from gp2 to gp3 so that the volume no longer depends on burst credits.", fr: "Faire passer le volume racine EBS de gp2 à gp3 pour qu'il ne dépende plus de crédits de rafale." } }
    - { id: d, text: { en: "Change the credit specification of the instance to unlimited with the modify-instance-credit-specification command.", fr: "Passer la spécification de crédits de l'instance à unlimited avec la commande modify-instance-credit-specification." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In standard mode, when the accrued credit balance runs out, CPU utilization is gradually lowered to the baseline, which matches the flat CPUUtilization line after CPUCreditBalance reaches 0. The credit specification of a running T instance can be switched to unlimited at any time, so the instance can burst above baseline at once. Surplus credits in unlimited mode can incur an additional charge.
    fr: |
      En mode standard, lorsque le solde de crédits accumulés est épuisé, l'utilisation du processeur est progressivement ramenée au niveau de référence (baseline), ce qui correspond à la ligne plate de CPUUtilization après que CPUCreditBalance atteint 0. La spécification de crédits d'une instance T en cours d'exécution peut passer à unlimited à tout moment : l'instance peut aussitôt dépasser son niveau de référence. En mode unlimited, les crédits excédentaires peuvent entraîner des frais supplémentaires.
  options:
    a: { en: "A fixed-performance instance type would remove the limit, but changing the instance type requires stopping the instance.", fr: "Un type d'instance à performances fixes supprimerait la limite, mais changer de type d'instance exige d'arrêter l'instance." }
    b: { en: "Detailed monitoring changes how often metrics are published; it does not add CPU capacity. CPU credit metrics are available only at a five-minute frequency.", fr: "La surveillance détaillée change la fréquence de publication des métriques ; elle n'ajoute pas de capacité de processeur. Les métriques de crédits de processeur ne sont disponibles qu'à une fréquence de cinq minutes." }
    c: { en: "The metrics point to CPU credits, not to EBS I/O credits, so the volume type is not the bottleneck.", fr: "Les métriques désignent les crédits de processeur, pas les crédits d'E/S EBS : le type de volume n'est pas le goulot d'étranglement." }
references:
  - title: Standard mode for burstable performance instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/burstable-performance-instances-standard-mode.html
  - title: Configure burstable performance instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/burstable-performance-instances-how-to.html
