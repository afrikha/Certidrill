id: soac03-1c-s3-request-metrics-alarm
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company serves product images to its web application from an Amazon S3 bucket. The images are stored under the `img/` prefix, and other prefixes hold internal data. The operations team must be alerted within minutes when the rate of server-side errors for requests to the `img/` prefix rises. Today, only the bucket's daily storage metrics appear in Amazon CloudWatch.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise fournit les images de ses produits à son application web à partir d'un compartiment Amazon S3. Les images sont stockées sous le préfixe `img/`, et d'autres préfixes contiennent des données internes. L'équipe d'exploitation doit être alertée en quelques minutes lorsque le taux d'erreurs côté serveur des requêtes adressées au préfixe `img/` augmente. Aujourd'hui, seules les métriques de stockage quotidiennes du compartiment apparaissent dans Amazon CloudWatch.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an S3 request metrics configuration for the bucket with a filter on the img/ prefix.", fr: "Créer une configuration de métriques de requêtes S3 pour le compartiment avec un filtre sur le préfixe img/." } }
    - { id: b, text: { en: "Enable S3 server access logging and create a CloudWatch Logs metric filter on the 5xx status codes.", fr: "Activer la journalisation des accès au serveur S3 et créer un filtre de métriques CloudWatch Logs sur les codes d'état 5xx." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the NumberOfObjects storage metric with the StorageType dimension of the prefix.", fr: "Créer une alarme CloudWatch sur la métrique de stockage NumberOfObjects avec la dimension StorageType du préfixe." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the 5xxErrors metric for the FilterId of that configuration, using the Average statistic.", fr: "Créer une alarme CloudWatch sur la métrique 5xxErrors pour le FilterId de cette configuration, avec la statistique Average." } }
    - { id: e, text: { en: "Turn on AWS CloudTrail management events for the bucket and create an EventBridge rule for failed GetObject calls.", fr: "Activer les événements de gestion AWS CloudTrail pour le compartiment et créer une règle EventBridge pour les appels GetObject en échec." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Request metrics are reported to CloudWatch every minute only after you create a metrics configuration, which can be filtered by prefix, object tag or access point. The configuration's FilterId becomes a dimension of metrics such as 5xxErrors, whose Average statistic gives the error rate, so an alarm on it alerts the team within minutes."
    fr: "Les métriques de requêtes ne sont envoyées à CloudWatch chaque minute qu'après la création d'une configuration de métriques, que l'on peut filtrer par préfixe, balise d'objet ou point d'accès. Le FilterId de la configuration devient une dimension de métriques comme 5xxErrors, dont la statistique Average donne le taux d'erreur : une alarme sur cette métrique alerte l'équipe en quelques minutes."
  options:
    b:
      en: "Server access logs are delivered as files to an S3 bucket on a best-effort basis, not to CloudWatch Logs, so no metric filter can read them."
      fr: "Les journaux d'accès au serveur sont livrés sous forme de fichiers dans un compartiment S3, au mieux, et non dans CloudWatch Logs : aucun filtre de métriques ne peut les lire."
    c:
      en: "NumberOfObjects is a daily storage metric that does not support prefix filters and says nothing about errors."
      fr: "NumberOfObjects est une métrique de stockage quotidienne qui ne prend pas en charge les filtres de préfixe et n'indique rien sur les erreurs."
    e:
      en: "GetObject is a data event, not a management event, and CloudTrail events do not give a per-minute error rate."
      fr: "GetObject est un événement de données, pas un événement de gestion, et les événements CloudTrail ne donnent pas de taux d'erreur par minute."
references:
  - title: CloudWatch metrics configurations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/metrics-configurations.html
  - title: Metrics and dimensions
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/metrics-dimensions.html
