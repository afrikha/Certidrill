id: soac03-1b-opscenter-runbook
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's CloudWatch alarms create OpsItems in AWS Systems Manager OpsCenter when Amazon EC2 instances run out of disk space. Operators currently sign in to each instance to fix the problem by hand.

    The company wants operators to start a remediation from the OpsItem itself, by using an existing Systems Manager Automation runbook, and to keep a record of the remediation runs with the OpsItem.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Les alarmes CloudWatch d'une entreprise créent des OpsItems dans AWS Systems Manager OpsCenter lorsque des instances Amazon EC2 manquent d'espace disque. Les opérateurs se connectent aujourd'hui à chaque instance pour corriger le problème à la main.

    L'entreprise veut que les opérateurs lancent une correction depuis l'OpsItem lui-même, à l'aide d'un runbook Systems Manager Automation existant, et qu'un historique des exécutions de correction soit conservé avec l'OpsItem.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Open the OpsItem, choose the runbook in its Runbooks section, and run it. OpsCenter associates the runbook with the OpsItem.", fr: "Ouvrir l'OpsItem, choisir le runbook dans sa section Runbooks et l'exécuter. OpsCenter associe le runbook à l'OpsItem." } }
    - { id: b, text: { en: "Add a second alarm action that sends the alarm to an Amazon SNS topic, and subscribe a Lambda function that runs the runbook.", fr: "Ajouter une deuxième action d'alarme qui envoie l'alarme à une rubrique Amazon SNS, et abonner une fonction Lambda qui exécute le runbook." } }
    - { id: c, text: { en: "Use Session Manager from the OpsItem to open a shell on the instance and delete the files by hand.", fr: "Utiliser Session Manager depuis l'OpsItem pour ouvrir un shell sur l'instance et supprimer les fichiers à la main." } }
    - { id: d, text: { en: "Create a State Manager association that runs the runbook every hour on all instances.", fr: "Créer une association State Manager qui exécute le runbook toutes les heures sur toutes les instances." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each OpsItem has a Runbooks section from which an operator can run a Systems Manager Automation runbook against the affected resource. OpsCenter keeps a 30-day record of runbook executions for the OpsItem and associates the runbook with it, so the runbook ranks higher the next time.
    fr: |
      Chaque OpsItem possède une section Runbooks depuis laquelle un opérateur peut exécuter un runbook Systems Manager Automation sur la ressource concernée. OpsCenter conserve un historique de 30 jours des exécutions de runbooks de l'OpsItem et lui associe le runbook, qui apparaît plus haut la fois suivante.
  options:
    b: { en: "The function and topic are extra components to build and maintain, and the runs would not be recorded with the OpsItem.", fr: "La fonction et la rubrique sont des composants supplémentaires à créer et à maintenir, et les exécutions ne seraient pas enregistrées avec l'OpsItem." }
    c: { en: "A manual shell session is the current manual process; it does not use the runbook.", fr: "Une session shell manuelle reproduit le processus manuel actuel ; elle n'utilise pas le runbook." }
    d: { en: "A scheduled association runs on every instance whether or not there is a problem, and operators do not start it from the OpsItem.", fr: "Une association planifiée s'exécute sur toutes les instances, qu'il y ait un problème ou non, et les opérateurs ne la lancent pas depuis l'OpsItem." }
references:
  - title: Remediate OpsItem issues
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-remediating.html
