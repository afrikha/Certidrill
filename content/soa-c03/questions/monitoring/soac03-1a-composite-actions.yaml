id: soac03-1a-composite-actions
objective: "1.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An operations team is designing the actions of a new CloudWatch composite alarm that combines several metric alarms of an application.

    Which three actions can the composite alarm perform directly when it goes into the ALARM state? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe des opérations conçoit les actions d'une nouvelle alarme composite CloudWatch qui combine plusieurs alarmes de métrique d'une application.

    Quelles sont les trois actions que l'alarme composite peut exécuter directement quand elle passe à l'état ALARM ? (Choisissez-en trois.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Run a step scaling policy of an Auto Scaling group", fr: "Exécuter une politique de mise à l'échelle par étapes d'un groupe Auto Scaling" } }
    - { id: b, text: { en: "Publish a notification to an Amazon SNS topic", fr: "Publier une notification dans une rubrique Amazon SNS" } }
    - { id: c, text: { en: "Stop an Amazon EC2 instance", fr: "Arrêter une instance Amazon EC2" } }
    - { id: d, text: { en: "Invoke an AWS Lambda function", fr: "Invoquer une fonction AWS Lambda" } }
    - { id: e, text: { en: "Create an OpsItem in Systems Manager OpsCenter", fr: "Créer un OpsItem dans Systems Manager OpsCenter" } }
    - { id: f, text: { en: "Start a Systems Manager Automation runbook", fr: "Démarrer un runbook Systems Manager Automation" } }
answer: { optionIds: [ b, d, e ] }
explanation:
  correct:
    en: "Composite alarm actions accept the ARNs of SNS topics, Lambda functions (latest version, version or alias) and Systems Manager OpsItems, and they can also create Incident Manager incidents and start CloudWatch investigations. Auto Scaling and EC2 actions are not available on composite alarms."
    fr: "Les actions d'une alarme composite acceptent les ARN de rubriques SNS, de fonctions Lambda (dernière version, version ou alias) et d'OpsItems Systems Manager ; elles peuvent aussi créer des incidents Incident Manager et démarrer des investigations CloudWatch. Les actions Auto Scaling et EC2 ne sont pas disponibles sur les alarmes composites."
  options:
    a: { en: "Composite alarms cannot trigger Auto Scaling actions; only metric alarms can.", fr: "Les alarmes composites ne peuvent pas déclencher d'actions Auto Scaling ; seules les alarmes de métrique le peuvent." }
    c: { en: "EC2 stop, terminate, reboot and recover actions apply to metric alarms on per-instance EC2 metrics, not to composite alarms.", fr: "Les actions EC2 d'arrêt, de résiliation, de redémarrage et de récupération s'appliquent aux alarmes de métrique sur des métriques EC2 par instance, et non aux alarmes composites." }
    f: { en: "An Automation runbook is not an alarm action; it is started by an EventBridge rule that matches the alarm state change event, or by a Lambda function.", fr: "Un runbook Automation n'est pas une action d'alarme ; il est démarré par une règle EventBridge qui correspond à l'événement de changement d'état de l'alarme, ou par une fonction Lambda." }
references:
  - title: PutCompositeAlarm
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutCompositeAlarm.html
  - title: Alarm actions
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-actions.html
