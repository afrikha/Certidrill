id: soac03-1b-anomaly-band-alarm
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company monitors the RequestCount metric of its Application Load Balancer. Traffic follows a strong daily and weekly pattern: it is high during the evening and on weekends and low at night. A static threshold alarm on RequestCount either misses drops in traffic during the evening or raises false alarms every night.

    The operations team wants to be alerted when traffic falls well below its usual level for the time of day, with the LEAST ongoing maintenance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias surveille la métrique RequestCount de son Application Load Balancer. Le trafic suit un fort cycle quotidien et hebdomadaire : il est élevé le soir et le week-end, et faible la nuit. Une alarme à seuil statique sur RequestCount manque les baisses de trafic du soir ou déclenche de fausses alertes chaque nuit.

    L'équipe d'exploitation veut être alertée lorsque le trafic tombe nettement sous son niveau habituel pour l'heure de la journée, avec le MOINS de maintenance continue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create two static threshold alarms, one for daytime and one for nighttime, and enable or disable them on a schedule with EventBridge Scheduler.", fr: "Créer deux alarmes à seuil statique, une pour le jour et une pour la nuit, et les activer ou les désactiver selon une planification avec EventBridge Scheduler." } }
    - { id: b, text: { en: "Create a composite alarm that combines the static threshold alarm with an alarm on the HealthyHostCount metric.", fr: "Créer une alarme composite qui combine l'alarme à seuil statique avec une alarme sur la métrique HealthyHostCount." } }
    - { id: c, text: { en: "Create an anomaly detection alarm on RequestCount that goes to ALARM when the metric is lower than the band of expected values.", fr: "Créer une alarme de détection d'anomalies sur RequestCount qui passe à l'état ALARM lorsque la métrique est inférieure à la bande de valeurs attendues." } }
    - { id: d, text: { en: "Create a metric filter on the load balancer access logs and alarm when the number of log lines is lower than a fixed value.", fr: "Créer un filtre de métrique sur les journaux d'accès de l'équilibreur de charge et déclencher une alarme lorsque le nombre de lignes de journal est inférieur à une valeur fixe." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CloudWatch anomaly detection trains a model on up to two weeks of metric data and takes trends and hourly, daily, and weekly patterns into account. An anomaly detection alarm has no static threshold: it compares the metric with the expected band, and it can alarm only when the value is below the band. The model adapts to the traffic pattern without manual threshold changes.
    fr: |
      La détection d'anomalies CloudWatch entraîne un modèle sur jusqu'à deux semaines de données de la métrique et tient compte des tendances et des cycles horaires, quotidiens et hebdomadaires. Une alarme de détection d'anomalies n'a pas de seuil statique : elle compare la métrique à la bande attendue et peut se déclencher uniquement lorsque la valeur est sous la bande. Le modèle s'adapte au cycle du trafic sans modification manuelle de seuil.
  options:
    a: { en: "Two fixed thresholds still ignore weekly patterns and need updates whenever traffic changes, which adds maintenance.", fr: "Deux seuils fixes ignorent toujours les cycles hebdomadaires et doivent être mis à jour à chaque évolution du trafic, ce qui ajoute de la maintenance." }
    b: { en: "A composite alarm only combines the states of other alarms; the static threshold problem remains.", fr: "Une alarme composite ne fait que combiner les états d'autres alarmes ; le problème du seuil statique demeure." }
    d: { en: "A metric filter with a fixed value has the same weakness as the static threshold, and it adds log processing.", fr: "Un filtre de métrique avec une valeur fixe a la même faiblesse que le seuil statique, et il ajoute un traitement des journaux." }
references:
  - title: Using CloudWatch anomaly detection
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
