id: soac03-1b-ebs-iops-from-ops
objective: "1.3.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    An application on an Amazon EC2 instance only writes to a gp3 volume provisioned with 4,000 IOPS. To decide whether the provisioned IOPS can be lowered, an administrator runs the following command for the busiest 5 minutes of the day:

    ```bash
    aws cloudwatch get-metric-statistics --namespace AWS/EBS \
      --metric-name VolumeWriteOps \
      --dimensions Name=VolumeId,Value=vol-0abc1234def567890 \
      --statistics Sum --period 300 \
      --start-time 2026-11-18T14:00:00Z --end-time 2026-11-18T14:05:00Z
    ```

    ```json
    {
      "Label": "VolumeWriteOps",
      "Datapoints": [
        { "Timestamp": "2026-11-18T14:00:00Z", "Sum": 1080000.0, "Unit": "Count" }
      ]
    }
    ```

    What was the average write IOPS of the volume during this period?
  fr: |
    Une application d'une instance Amazon EC2 ne fait qu'écrire sur un volume gp3 provisionné avec 4 000 IOPS. Pour décider si les IOPS provisionnées peuvent être réduites, un administrateur exécute la commande suivante pour les 5 minutes les plus chargées de la journée :

    ```bash
    aws cloudwatch get-metric-statistics --namespace AWS/EBS \
      --metric-name VolumeWriteOps \
      --dimensions Name=VolumeId,Value=vol-0abc1234def567890 \
      --statistics Sum --period 300 \
      --start-time 2026-11-18T14:00:00Z --end-time 2026-11-18T14:05:00Z
    ```

    ```json
    {
      "Label": "VolumeWriteOps",
      "Datapoints": [
        { "Timestamp": "2026-11-18T14:00:00Z", "Sum": 1080000.0, "Unit": "Count" }
      ]
    }
    ```

    Quelle a été la moyenne des IOPS d'écriture du volume pendant cette période ?
body:
  options:
    - { id: a, text: "60" }
    - { id: b, text: { en: "3,600", fr: "3 600" } }
    - { id: c, text: { en: "18,000", fr: "18 000" } }
    - { id: d, text: { en: "1,080,000", fr: "1 080 000" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      VolumeWriteOps is the total number of write operations completed in the period, not a rate. To get IOPS, divide the Sum by the period length in seconds: 1,080,000 / 300 = 3,600 write IOPS. The peak is close to the 4,000 provisioned IOPS, so lowering the provisioned value to the 3,000 included IOPS would throttle the peak.
    fr: |
      VolumeWriteOps est le nombre total d'opérations d'écriture terminées pendant la période, pas un taux. Pour obtenir les IOPS, divisez la somme (Sum) par la durée de la période en secondes : 1 080 000 / 300 = 3 600 IOPS d'écriture. Le pic est proche des 4 000 IOPS provisionnées : ramener la valeur aux 3 000 IOPS incluses limiterait le pic.
  options:
    a: { en: "This divides the correct result by 60 a second time, which mixes per-second and per-minute values.", fr: "Ce calcul divise une seconde fois le bon résultat par 60, ce qui mélange des valeurs par seconde et par minute." }
    c: { en: "This divides by 60 seconds, but the period is 300 seconds.", fr: "Ce calcul divise par 60 secondes, mais la période est de 300 secondes." }
    d: { en: "This is the total count of operations in 5 minutes, not a per-second rate.", fr: "C'est le nombre total d'opérations en 5 minutes, pas un débit par seconde." }
references:
  - title: Amazon CloudWatch metrics for Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/using_cloudwatch_ebs.html
