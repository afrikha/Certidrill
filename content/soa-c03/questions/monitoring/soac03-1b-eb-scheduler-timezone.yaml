id: soac03-1b-eb-scheduler-timezone
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company in Paris uses an Amazon EventBridge scheduled rule with the expression cron(0 7 * * ? *) to start an AWS Lambda function that prepares daily reports. The reports must be ready at 08:00 local time. Since the change to daylight saving time, the function runs one hour late in local time.

    The company wants the function to run at 08:00 Paris time all year without editing the schedule twice a year.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise parisienne utilise une règle planifiée Amazon EventBridge avec l'expression cron(0 7 * * ? *) pour lancer une fonction AWS Lambda qui prépare des rapports quotidiens. Les rapports doivent être prêts à 08:00 heure locale. Depuis le passage à l'heure d'été, la fonction s'exécute une heure trop tard en heure locale.

    L'entreprise veut que la fonction s'exécute à 08:00 heure de Paris toute l'année, sans modifier la planification deux fois par an.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Replace the rule with an EventBridge Scheduler schedule cron(0 8 * * ? *) in the Europe/Paris time zone.", fr: "Remplacer la règle par une planification EventBridge Scheduler cron(0 8 * * ? *) dans le fuseau horaire Europe/Paris." } }
    - { id: b, text: { en: "Change the scheduled rule to rate(1 day) and create it at 08:00 Paris time.", fr: "Remplacer l'expression de la règle planifiée par rate(1 day) et la créer à 08:00 heure de Paris." } }
    - { id: c, text: { en: "Create a second scheduled rule with cron(0 6 * * ? *), and have the function exit if the local time is not 08:00.", fr: "Créer une seconde règle planifiée avec cron(0 6 * * ? *), et faire en sorte que la fonction s'arrête si l'heure locale n'est pas 08:00." } }
    - { id: d, text: { en: "Add an input transformer to the rule target that converts the event time to the Europe/Paris time zone.", fr: "Ajouter un transformateur d'entrée à la cible de la règle qui convertit l'heure de l'événement dans le fuseau horaire Europe/Paris." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Scheduled rules on an event bus are evaluated in UTC+0, so a fixed UTC hour drifts by one hour in local time when daylight saving time starts or ends. EventBridge Scheduler evaluates cron and one-time schedules in any IANA time zone set with the schedule time zone, and it adjusts for daylight saving time automatically.
    fr: |
      Les règles planifiées d'un bus d'événements sont évaluées en UTC+0 : une heure UTC fixe se décale d'une heure en heure locale au changement d'heure. EventBridge Scheduler évalue les planifications cron et ponctuelles dans n'importe quel fuseau horaire IANA défini pour la planification, et il s'adapte automatiquement à l'heure d'été.
  options:
    b: { en: "A rate expression is a fixed duration in UTC; it does not follow local time changes.", fr: "Une expression rate est une durée fixe en UTC ; elle ne suit pas les changements d'heure locale." }
    c: { en: "This adds a rule and code to maintain, and it is a workaround instead of a time-zone-aware schedule.", fr: "Cette solution ajoute une règle et du code à maintenir, et c'est un contournement au lieu d'une planification qui tient compte du fuseau horaire." }
    d: { en: "An input transformer changes the payload sent to the target; it does not change when the rule runs.", fr: "Un transformateur d'entrée modifie la charge utile envoyée à la cible ; il ne change pas le moment où la règle s'exécute." }
references:
  - title: Schedule types in EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html
  - title: Troubleshooting Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-troubleshooting.html
