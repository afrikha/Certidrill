id: soac03-1b-ssm-branch-isend
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An administrator writes the following steps at the end of the mainSteps section of a custom Automation runbook. An earlier step, getPlatform, returns the platform of the target instance.

    ```yaml
    # last steps of mainSteps
    - name: choosePlatform
      action: aws:branch
      inputs:
        Choices:
        - NextStep: runLinuxCleanup
          Variable: "{{getPlatform.platform}}"
          StringEquals: Linux
        - NextStep: runWindowsCleanup
          Variable: "{{getPlatform.platform}}"
          StringEquals: Windows
    - name: runLinuxCleanup
      action: aws:runCommand
      inputs:
        DocumentName: AWS-RunShellScript
        InstanceIds:
        - "{{InstanceId}}"
        Parameters:
          commands:
          - rm -rf /tmp/app/*
    - name: runWindowsCleanup
      action: aws:runCommand
      inputs:
        DocumentName: AWS-RunPowerShellScript
        InstanceIds:
        - "{{InstanceId}}"
        Parameters:
          commands:
          - Remove-Item C:\Temp\App\* -Recurse
    ```

    When the runbook runs on a Linux instance, runLinuxCleanup succeeds, and then runWindowsCleanup runs and fails. The automation must run only the step that matches the platform.

    What should the administrator do?
  fr: |
    Un administrateur écrit les étapes suivantes à la fin de la section mainSteps d'un runbook Automation personnalisé. Une étape précédente, getPlatform, renvoie la plateforme de l'instance cible.

    ```yaml
    # last steps of mainSteps
    - name: choosePlatform
      action: aws:branch
      inputs:
        Choices:
        - NextStep: runLinuxCleanup
          Variable: "{{getPlatform.platform}}"
          StringEquals: Linux
        - NextStep: runWindowsCleanup
          Variable: "{{getPlatform.platform}}"
          StringEquals: Windows
    - name: runLinuxCleanup
      action: aws:runCommand
      inputs:
        DocumentName: AWS-RunShellScript
        InstanceIds:
        - "{{InstanceId}}"
        Parameters:
          commands:
          - rm -rf /tmp/app/*
    - name: runWindowsCleanup
      action: aws:runCommand
      inputs:
        DocumentName: AWS-RunPowerShellScript
        InstanceIds:
        - "{{InstanceId}}"
        Parameters:
          commands:
          - Remove-Item C:\Temp\App\* -Recurse
    ```

    Lorsque le runbook s'exécute sur une instance Linux, runLinuxCleanup réussit, puis runWindowsCleanup s'exécute et échoue. L'automatisation ne doit exécuter que l'étape qui correspond à la plateforme.

    Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Add a Default entry to the choosePlatform step that points to runLinuxCleanup.", fr: "Ajouter à l'étape choosePlatform une entrée Default qui pointe vers runLinuxCleanup." } }
    - { id: b, text: { en: "Add `onFailure: Continue` to the runWindowsCleanup step.", fr: "Ajouter `onFailure: Continue` à l'étape runWindowsCleanup." } }
    - { id: c, text: { en: "Replace StringEquals with EqualsIgnoreCase in both choices.", fr: "Remplacer StringEquals par EqualsIgnoreCase dans les deux choix." } }
    - { id: d, text: { en: "Add `isEnd: true` to the runLinuxCleanup step.", fr: "Ajouter `isEnd: true` à l'étape runLinuxCleanup." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      aws:branch only chooses where the automation goes next. After the chosen step finishes, the steps in mainSteps continue in sequential order, so runWindowsCleanup runs after runLinuxCleanup. Setting `isEnd: true` on runLinuxCleanup stops the automation at the end of that step; runWindowsCleanup is already the last step.
    fr: |
      aws:branch choisit seulement l'étape suivante de l'automatisation. Une fois l'étape choisie terminée, les étapes de mainSteps continuent dans l'ordre séquentiel : runWindowsCleanup s'exécute après runLinuxCleanup. Définir `isEnd: true` sur runLinuxCleanup arrête l'automatisation à la fin de cette étape ; runWindowsCleanup est déjà la dernière étape.
  options:
    a: { en: "Default applies only when no choice is true; here the Linux choice is already true.", fr: "Default ne s'applique que lorsqu'aucun choix n'est vrai ; ici, le choix Linux est déjà vrai." }
    b: { en: "The Windows commands would still run on the Linux instance; the failure would only be ignored.", fr: "Les commandes Windows s'exécuteraient toujours sur l'instance Linux ; l'échec serait seulement ignoré." }
    c: { en: "The branch already selects the right step; case sensitivity does not explain why the next step also runs.", fr: "La branche sélectionne déjà la bonne étape ; la sensibilité à la casse n'explique pas pourquoi l'étape suivante s'exécute aussi." }
references:
  - title: Using conditional statements in runbooks
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-branch-condition.html
  - title: aws:branch – Run conditional automation steps
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-branch.html
