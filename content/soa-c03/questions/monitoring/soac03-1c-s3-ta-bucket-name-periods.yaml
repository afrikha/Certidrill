id: soac03-1c-s3-ta-bucket-name-periods
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company receives uploads from partners on several continents into an Amazon S3 bucket named `uploads.media.example` in the eu-west-1 Region. To speed up the long-distance uploads, an administrator who has full Amazon S3 permissions tries to enable S3 Transfer Acceleration, but the console shows that the feature cannot be enabled for this bucket.

    What should the administrator do to use Transfer Acceleration for the uploads?
  fr: |
    Une entreprise de médias reçoit des chargements de partenaires situés sur plusieurs continents dans un compartiment Amazon S3 nommé `uploads.media.example`, dans la Région eu-west-1. Pour accélérer ces chargements longue distance, un administrateur qui dispose de toutes les autorisations Amazon S3 essaie d'activer S3 Transfer Acceleration, mais la console indique que la fonctionnalité ne peut pas être activée pour ce compartiment.

    Que doit faire l'administrateur pour utiliser Transfer Acceleration pour les chargements ?
body:
  options:
    - { id: a, text: { en: "Enable S3 Versioning on the bucket, and then enable Transfer Acceleration again.", fr: "Activer la gestion des versions S3 sur le compartiment, puis réactiver Transfer Acceleration." } }
    - { id: b, text: { en: "Create a bucket whose name has no periods, enable Transfer Acceleration on it, and send uploads to its accelerate endpoint.", fr: "Créer un compartiment dont le nom ne contient pas de points, y activer Transfer Acceleration et envoyer les chargements à son point de terminaison accéléré." } }
    - { id: c, text: { en: "Move the bucket to the us-east-1 Region, where Transfer Acceleration accepts every bucket name.", fr: "Déplacer le compartiment vers la Région us-east-1, où Transfer Acceleration accepte tous les noms de compartiment." } }
    - { id: d, text: { en: "Have the partners send path-style requests to s3-accelerate.amazonaws.com/uploads.media.example.", fr: "Faire envoyer par les partenaires des requêtes de type chemin vers s3-accelerate.amazonaws.com/uploads.media.example." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Transfer Acceleration requires a DNS-compliant bucket name without periods, because the bucket is reached at bucketname.s3-accelerate.amazonaws.com. The company needs a new bucket with a compliant name in a supported Region such as eu-west-1, with acceleration enabled, and the partners must use its accelerate endpoint."
    fr: "Transfer Acceleration exige un nom de compartiment conforme au DNS et sans points, car le compartiment est joint à l'adresse nomcompartiment.s3-accelerate.amazonaws.com. L'entreprise a besoin d'un nouveau compartiment au nom conforme dans une Région prise en charge comme eu-west-1, avec l'accélération activée, et les partenaires doivent utiliser son point de terminaison accéléré."
  options:
    a:
      en: "Versioning is not a prerequisite of Transfer Acceleration and does not change the bucket name that blocks it."
      fr: "La gestion des versions n'est pas un prérequis de Transfer Acceleration et ne change pas le nom de compartiment qui la bloque."
    c:
      en: "A bucket cannot be moved to another Region, and the naming rule applies in every supported Region."
      fr: "Un compartiment ne peut pas être déplacé vers une autre Région, et la règle de nommage s'applique dans toutes les Régions prises en charge."
    d:
      en: "Transfer Acceleration supports only virtual-hosted-style requests, so path-style requests cannot work around the naming rule."
      fr: "Transfer Acceleration ne prend en charge que les requêtes de type hôte virtuel : des requêtes de type chemin ne permettent pas de contourner la règle de nommage."
references:
  - title: Configuring fast, secure file transfers using Amazon S3 Transfer Acceleration
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html
