id: soac03-1c-ec2-cwagent-ethtool
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CloudOps engineer must create CloudWatch alarms on the ENA counters bw_out_allowance_exceeded and pps_allowance_exceeded for a fleet of Amazon Linux instances. The CloudWatch agent is already installed on the instances and sends memory and disk metrics.

    What should the engineer add to the CloudWatch agent configuration?
  fr: |
    Un ingénieur CloudOps doit créer des alarmes CloudWatch sur les compteurs ENA bw_out_allowance_exceeded et pps_allowance_exceeded pour une flotte d'instances Amazon Linux. L'agent CloudWatch est déjà installé sur les instances et envoie des métriques de mémoire et de disque.

    Qu'est-ce que l'ingénieur doit ajouter à la configuration de l'agent CloudWatch ?
body:
  options:
    - { id: a, text: { en: "A net section under metrics_collected that lists the two counters in its measurement list", fr: "Une section net sous metrics_collected qui liste les deux compteurs dans sa liste measurement" } }
    - { id: b, text: { en: "A procstat section under metrics_collected that monitors the ena process", fr: "Une section procstat sous metrics_collected qui surveille le processus ena" } }
    - { id: c, text: { en: "An ethtool section under metrics_collected that lists the two counters in metrics_include", fr: "Une section ethtool sous metrics_collected qui liste les deux compteurs dans metrics_include" } }
    - { id: d, text: { en: "A logs section that sends /var/log/messages to CloudWatch Logs, with a metric filter on allowance_exceeded", fr: "Une section logs qui envoie /var/log/messages à CloudWatch Logs, avec un filtre de métriques sur allowance_exceeded" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The CloudWatch agent imports ENA network performance metrics through its ethtool plugin, configured under metrics_collected. The ENA counters are collected only when they are listed in metrics_include, and they appear in CloudWatch with an ethtool_ prefix, such as ethtool_pps_allowance_exceeded, on which the engineer can create alarms."
    fr: "L'agent CloudWatch importe les métriques de performance réseau ENA par son plug-in ethtool, configuré sous metrics_collected. Les compteurs ENA ne sont collectés que s'ils sont listés dans metrics_include, et ils apparaissent dans CloudWatch avec le préfixe ethtool_, par exemple ethtool_pps_allowance_exceeded, sur lequel l'ingénieur peut créer des alarmes."
  options:
    a:
      en: "The net plugin collects generic interface statistics such as bytes and packets, not the ENA allowance counters."
      fr: "Le plug-in net collecte des statistiques génériques d'interface comme les octets et les paquets, pas les compteurs d'allocation ENA."
    b:
      en: "procstat monitors user processes; the ENA driver is a kernel module whose counters are read with ethtool."
      fr: "procstat surveille des processus utilisateur ; le pilote ENA est un module du noyau dont les compteurs se lisent avec ethtool."
    d:
      en: "The ENA counters are exposed through the driver statistics, not written to the system log."
      fr: "Les compteurs ENA sont exposés par les statistiques du pilote, pas écrits dans le journal système."
references:
  - title: Collect network performance metrics
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-network-performance.html
