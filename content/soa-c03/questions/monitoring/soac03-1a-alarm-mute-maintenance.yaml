id: soac03-1a-alarm-mute-maintenance
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every Sunday from 02:00 to 06:00, a company patches and restarts the servers of an application. During this window, about 40 CloudWatch alarms of the application send notifications through Amazon SNS. The operations team wants no alarm action during the window, while the alarms keep evaluating and recording their state changes. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Chaque dimanche de 02 h 00 à 06 h 00, une entreprise applique des correctifs aux serveurs d'une application et les redémarre. Pendant ce créneau, une quarantaine d'alarmes CloudWatch de l'application envoient des notifications via Amazon SNS. L'équipe des opérations ne veut aucune action d'alarme pendant le créneau, tandis que les alarmes continuent d'être évaluées et d'enregistrer leurs changements d'état. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an alarm mute rule with a weekly cron expression for Sunday 02:00, a duration of 4 hours, and the alarms as targets.", fr: "Créer une règle de mise en sourdine des alarmes avec une expression cron hebdomadaire pour le dimanche à 02 h 00, une durée de 4 heures et les alarmes comme cibles." }
    - id: b
      text: { en: "Create two EventBridge Scheduler schedules that run a Lambda function to call `DisableAlarmActions` and `EnableAlarmActions` for the alarms.", fr: "Créer deux planifications EventBridge Scheduler qui exécutent une fonction Lambda appelant `DisableAlarmActions` et `EnableAlarmActions` pour les alarmes." }
    - id: c
      text: { en: "Change the treatment of missing data of every alarm to `ignore` so that the alarms keep their state during the restarts.", fr: "Passer le traitement des données manquantes de chaque alarme à `ignore` pour que les alarmes gardent leur état pendant les redémarrages." }
    - id: d
      text: { en: "Unsubscribe the on-call team from the SNS topic every Sunday at 02:00, and subscribe the team again at 06:00.", fr: "Désabonner l'équipe d'astreinte de la rubrique SNS chaque dimanche à 02 h 00, puis l'abonner de nouveau à 06 h 00." }
answer: { optionId: a }
explanation:
  correct:
    en: "An alarm mute rule suppresses all the actions of up to 100 target alarms during a window defined by a cron or one-time expression and a duration. The alarms still evaluate and their state changes stay visible. At the end of the window, CloudWatch runs the actions only for alarms whose state differs from their state at the start."
    fr: "Une règle de mise en sourdine supprime toutes les actions de 100 alarmes cibles au plus pendant un créneau défini par une expression cron ou ponctuelle et une durée. Les alarmes continuent d'être évaluées et leurs changements d'état restent visibles. À la fin du créneau, CloudWatch exécute les actions uniquement pour les alarmes dont l'état diffère de celui du début."
  options:
    b: { en: "This works, but the team must write, deploy and maintain a function and two schedules, which is more overhead than a built-in mute rule.", fr: "Cela fonctionne, mais l'équipe doit écrire, déployer et maintenir une fonction et deux planifications, ce qui représente plus de charge qu'une règle de mise en sourdine intégrée." }
    c: { en: "The servers still publish data during the restarts, so alarms still breach and notify; missing data treatment does not mute actions.", fr: "Les serveurs publient encore des données pendant les redémarrages : les alarmes sont toujours en dépassement et notifient. Le traitement des données manquantes ne met pas les actions en sourdine." }
    d: { en: "Removing and re-adding subscriptions is manual and each new email subscription must be confirmed again.", fr: "Retirer puis rajouter des abonnements est manuel, et chaque nouvel abonnement e-mail doit être confirmé de nouveau." }
references:
  - title: Alarm Mute Rules
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-mute-rules.html
