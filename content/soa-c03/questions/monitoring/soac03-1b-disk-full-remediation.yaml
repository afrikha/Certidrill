id: soac03-1b-disk-full-remediation
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a fleet of Amazon EC2 Linux instances that are managed by AWS Systems Manager. The CloudWatch agent on each instance already publishes the disk_used_percent metric. An application sometimes fills the /var/log/app directory, and the instances stop responding.

    The company wants old files in /var/log/app to be deleted automatically on an instance as soon as its disk usage goes above 90 %, without operator action.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute une flotte d'instances Amazon EC2 Linux gérées par AWS Systems Manager. L'agent CloudWatch de chaque instance publie déjà la métrique disk_used_percent. Une application remplit parfois le répertoire /var/log/app, et les instances cessent de répondre.

    L'entreprise veut que les anciens fichiers de /var/log/app soient supprimés automatiquement sur une instance dès que l'utilisation de son disque dépasse 90 %, sans action d'un opérateur.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a CloudWatch alarm for each instance on disk_used_percent with a threshold of 90.", fr: "Créer pour chaque instance une alarme CloudWatch sur disk_used_percent avec un seuil de 90." } }
    - { id: b, text: { en: "Add the EC2 reboot action to each alarm so that the instance restarts when the disk is full.", fr: "Ajouter l'action EC2 de redémarrage (reboot) à chaque alarme pour que l'instance redémarre lorsque le disque est plein." } }
    - { id: c, text: { en: "Create an EventBridge rule that matches the CloudWatch Alarm State Change events of these alarms for the ALARM state, with a Systems Manager Run Command target that runs a cleanup script on the instance.", fr: "Créer une règle EventBridge qui correspond aux événements CloudWatch Alarm State Change de ces alarmes pour l'état ALARM, avec une cible Systems Manager Run Command qui exécute un script de nettoyage sur l'instance." } }
    - { id: d, text: { en: "Create an AWS Config rule that checks the disk usage of each instance and marks full instances as noncompliant.", fr: "Créer une règle AWS Config qui vérifie l'utilisation du disque de chaque instance et marque les instances pleines comme non conformes." } }
    - { id: e, text: { en: "Create an EBS snapshot lifecycle policy in Amazon Data Lifecycle Manager that deletes old snapshots of the volumes.", fr: "Créer une politique de cycle de vie des instantanés EBS dans Amazon Data Lifecycle Manager qui supprime les anciens instantanés des volumes." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The alarm detects the condition from the metric that the agent already publishes. When it changes to ALARM, CloudWatch sends a CloudWatch Alarm State Change event (source aws.cloudwatch) to EventBridge. A rule that matches the alarm and the ALARM state can target Systems Manager Run Command, which runs the cleanup script on the managed instance.
    fr: |
      L'alarme détecte la condition à partir de la métrique que l'agent publie déjà. Lorsqu'elle passe à l'état ALARM, CloudWatch envoie à EventBridge un événement CloudWatch Alarm State Change (source aws.cloudwatch). Une règle qui correspond à l'alarme et à l'état ALARM peut cibler Systems Manager Run Command, qui exécute le script de nettoyage sur l'instance gérée.
  options:
    b: { en: "A reboot does not delete the files, so the disk stays full after the restart.", fr: "Un redémarrage ne supprime pas les fichiers : le disque reste plein après le redémarrage." }
    d: { en: "AWS Config evaluates resource configurations; it does not read disk usage inside the operating system, and the rule alone deletes nothing.", fr: "AWS Config évalue les configurations des ressources ; il ne lit pas l'utilisation du disque dans le système d'exploitation, et la règle seule ne supprime rien." }
    e: { en: "Deleting snapshots frees snapshot storage in Amazon EBS, not space on the instance's file system.", fr: "Supprimer des instantanés libère du stockage d'instantanés dans Amazon EBS, pas de l'espace dans le système de fichiers de l'instance." }
references:
  - title: Alarm events and EventBridge
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-and-eventbridge.html
  - title: Event bus targets in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-targets.html
