id: soac03-1c-ec2-jumbo-frames-cluster
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a data processing cluster on current generation Amazon EC2 instances in a cluster placement group. All the traffic of the cluster stays between the instances inside the VPC. The engineers find that the network interfaces of the instances use an MTU of 1500 bytes. The company wants to maximize network throughput between the instances.

    What should a CloudOps engineer do?
  fr: |
    Une entreprise exécute un cluster de traitement de données sur des instances Amazon EC2 de génération actuelle dans un groupe de placement de cluster. Tout le trafic du cluster reste entre les instances, à l'intérieur du VPC. Les ingénieurs constatent que les interfaces réseau des instances utilisent un MTU de 1 500 octets. L'entreprise veut maximiser le débit réseau entre les instances.

    Que doit faire un ingénieur CloudOps ?
body:
  options:
    - { id: a, text: { en: "Attach an Elastic IP address to each instance of the cluster.", fr: "Associer une adresse IP Elastic à chaque instance du cluster." } }
    - { id: b, text: { en: "Configure the instances to use jumbo frames with an MTU of 9001 bytes.", fr: "Configurer les instances pour utiliser des trames jumbo avec un MTU de 9 001 octets." } }
    - { id: c, text: { en: "Move the instances from the cluster placement group to a spread placement group.", fr: "Déplacer les instances du groupe de placement de cluster vers un groupe de placement réparti." } }
    - { id: d, text: { en: "Lower the MTU of the instances to 576 bytes to avoid packet fragmentation.", fr: "Abaisser le MTU des instances à 576 octets pour éviter la fragmentation des paquets." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Current generation instance types support jumbo frames with an MTU of 9001 bytes, which carry more data per packet and reduce per-packet overhead. AWS recommends jumbo frames for instances in a cluster placement group to reach maximum network throughput; because the traffic stays inside the VPC, it does not cross an internet gateway, which supports only 1500 bytes."
    fr: "Les types d'instance de génération actuelle prennent en charge les trames jumbo avec un MTU de 9 001 octets, qui transportent plus de données par paquet et réduisent la surcharge par paquet. AWS recommande les trames jumbo pour les instances d'un groupe de placement de cluster afin d'atteindre le débit réseau maximal ; comme le trafic reste dans le VPC, il ne passe pas par une passerelle Internet, limitée à 1 500 octets."
  options:
    a:
      en: "Elastic IP addresses are public addresses for internet access; they do not change throughput between instances in the VPC."
      fr: "Les adresses IP Elastic sont des adresses publiques pour l'accès à Internet ; elles ne changent pas le débit entre les instances du VPC."
    c:
      en: "A spread placement group puts instances on distinct hardware for resilience and gives up the low latency and high throughput of a cluster group."
      fr: "Un groupe de placement réparti place les instances sur des matériels distincts pour la résilience et renonce à la faible latence et au débit élevé d'un groupe de cluster."
    d:
      en: "A smaller MTU sends less data per packet and lowers throughput; fragmentation is not an issue inside the VPC."
      fr: "Un MTU plus petit envoie moins de données par paquet et réduit le débit ; la fragmentation n'est pas un problème à l'intérieur du VPC."
references:
  - title: Network maximum transmission unit (MTU) for your EC2 instance
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/network_mtu.html
