id: soac03-1a-composite-suppressor
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A composite alarm named `ServiceDegraded` notifies the on-call team through Amazon SNS. During each deployment, which happens at unpredictable times, a metric alarm named `DeploymentInProgress` is in the ALARM state, and `ServiceDegraded` often sends false notifications. The team wants no notification from `ServiceDegraded` while `DeploymentInProgress` is in ALARM. If the service is still degraded 10 minutes after `DeploymentInProgress` leaves the ALARM state, the team must be notified.

    Which solution will meet these requirements?
  fr: |
    Une alarme composite nommée `ServiceDegraded` notifie l'équipe d'astreinte via Amazon SNS. Pendant chaque déploiement, qui a lieu à des moments imprévisibles, une alarme de métrique nommée `DeploymentInProgress` est à l'état ALARM, et `ServiceDegraded` envoie souvent de fausses notifications. L'équipe ne veut aucune notification de `ServiceDegraded` tant que `DeploymentInProgress` est à ALARM. Si le service est toujours dégradé 10 minutes après la sortie de `DeploymentInProgress` de l'état ALARM, l'équipe doit être notifiée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add `AND NOT ALARM(DeploymentInProgress)` to the rule of `ServiceDegraded`.", fr: "Ajouter `AND NOT ALARM(DeploymentInProgress)` à la règle de `ServiceDegraded`." }
    - id: b
      text: { en: "Create an alarm mute rule for `ServiceDegraded` with a duration of 10 minutes.", fr: "Créer une règle de mise en sourdine pour `ServiceDegraded` avec une durée de 10 minutes." }
    - id: c
      text: { en: "Set `DeploymentInProgress` as the actions suppressor of `ServiceDegraded`, with an extension period of 600 seconds.", fr: "Définir `DeploymentInProgress` comme suppresseur d'actions de `ServiceDegraded`, avec une période d'extension de 600 secondes." }
    - id: d
      text: { en: "Have the deployment pipeline call `DisableAlarmActions` on `ServiceDegraded` when each deployment starts.", fr: "Faire appeler `DisableAlarmActions` sur `ServiceDegraded` par le pipeline de déploiement au début de chaque déploiement." }
answer: { optionId: c }
explanation:
  correct:
    en: "A composite alarm can name another alarm as its `ActionsSuppressor`: its actions are suppressed while the suppressor is in ALARM. `ActionsSuppressorExtensionPeriod` keeps suppressing for up to the given time after the suppressor leaves ALARM; if `ServiceDegraded` is still in ALARM after 600 seconds, it performs its actions. The wait period, required with the suppressor, covers a suppressor that enters ALARM late."
    fr: "Une alarme composite peut désigner une autre alarme comme `ActionsSuppressor` : ses actions sont supprimées tant que le suppresseur est à ALARM. `ActionsSuppressorExtensionPeriod` prolonge la suppression pendant la durée indiquée après la sortie du suppresseur de l'état ALARM ; si `ServiceDegraded` est toujours à ALARM après 600 secondes, elle exécute ses actions. La période d'attente, obligatoire avec le suppresseur, couvre un suppresseur qui passe à ALARM avec retard."
  options:
    a: { en: "With this rule, `ServiceDegraded` goes into ALARM as soon as the deployment alarm returns to OK, so the team would be notified immediately instead of after 10 minutes.", fr: "Avec cette règle, `ServiceDegraded` passe à ALARM dès que l'alarme de déploiement revient à OK : l'équipe serait notifiée immédiatement, et non après 10 minutes." }
    b: { en: "Mute rules follow a cron or one-time schedule, not the state of another alarm, and deployments happen at unpredictable times.", fr: "Les règles de mise en sourdine suivent une planification cron ou ponctuelle, et non l'état d'une autre alarme, or les déploiements ont lieu à des moments imprévisibles." }
    d: { en: "Disabled actions stay disabled until `EnableAlarmActions` is called, so nothing would notify the team after the deployment.", fr: "Les actions désactivées le restent jusqu'à l'appel de `EnableAlarmActions` : rien ne notifierait l'équipe après le déploiement." }
references:
  - title: PutCompositeAlarm
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_PutCompositeAlarm.html
