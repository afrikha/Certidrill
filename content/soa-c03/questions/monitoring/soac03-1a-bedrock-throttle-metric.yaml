id: soac03-1a-bedrock-throttle-metric
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Users of a chatbot report intermittent failures at peak hours. The chatbot sends requests to an Amazon Bedrock model through the `bedrock-runtime` endpoint. The operations team suspects that Amazon Bedrock throttles some requests and wants a CloudWatch alarm that counts only the throttled requests for the model.

    Which metric should the alarm use?
  fr: |
    Les utilisateurs d'un chatbot signalent des échecs intermittents aux heures de pointe. Le chatbot envoie ses requêtes à un modèle Amazon Bedrock via le point de terminaison `bedrock-runtime`. L'équipe des opérations soupçonne qu'Amazon Bedrock limite (throttle) certaines requêtes et veut une alarme CloudWatch qui compte uniquement les requêtes limitées pour ce modèle.

    Quelle métrique l'alarme doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "`InvocationServerErrors` in the `AWS/Bedrock` namespace, with the `ModelId` dimension", fr: "`InvocationServerErrors` de l'espace de noms `AWS/Bedrock`, avec la dimension `ModelId`" }
    - id: b
      text: { en: "`EstimatedTPMQuotaUsage` in the `AWS/Bedrock` namespace, with the `ModelId` dimension", fr: "`EstimatedTPMQuotaUsage` de l'espace de noms `AWS/Bedrock`, avec la dimension `ModelId`" }
    - id: c
      text: { en: "`InvocationThrottles` in the `AWS/Bedrock` namespace, with the `ModelId` dimension", fr: "`InvocationThrottles` de l'espace de noms `AWS/Bedrock`, avec la dimension `ModelId`" }
    - id: d
      text: { en: "`Invocations` in the `AWS/Bedrock` namespace, with the `ModelId` dimension", fr: "`Invocations` de l'espace de noms `AWS/Bedrock`, avec la dimension `ModelId`" }
answer: { optionId: c }
explanation:
  correct:
    en: "`InvocationThrottles` counts the invocations that Amazon Bedrock throttled. Throttled requests are not counted in `Invocations`, `InvocationClientErrors` or `InvocationServerErrors`, so this is the only metric that isolates them."
    fr: "`InvocationThrottles` compte les appels qu'Amazon Bedrock a limités. Les requêtes limitées ne sont comptées ni dans `Invocations`, ni dans `InvocationClientErrors`, ni dans `InvocationServerErrors` : c'est la seule métrique qui les isole."
  options:
    a: { en: "Server errors are failures on the AWS side; throttled requests are not counted in this metric.", fr: "Les erreurs serveur sont des échecs côté AWS ; les requêtes limitées ne sont pas comptées dans cette métrique." }
    b: { en: "This metric approximates the tokens-per-minute quota consumption; it does not count throttled requests.", fr: "Cette métrique estime la consommation du quota de jetons par minute ; elle ne compte pas les requêtes limitées." }
    d: { en: "`Invocations` counts accepted requests and excludes throttled ones.", fr: "`Invocations` compte les requêtes acceptées et exclut les requêtes limitées." }
references:
  - title: Monitor bedrock-runtime inference using CloudWatch metrics
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-cw.html
