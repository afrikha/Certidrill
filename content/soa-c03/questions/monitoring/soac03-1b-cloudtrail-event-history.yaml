id: soac03-1b-cloudtrail-event-history
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The response time of an application that runs on an Amazon EC2 instance doubled 3 days ago. An administrator finds that the instance type was changed from m7i.xlarge to t3.large but does not know who made the change. The account has no CloudTrail trail and no CloudTrail Lake event data store.

    Which solution will identify who changed the instance type with the LEAST effort?
  fr: |
    Le temps de réponse d'une application qui s'exécute sur une instance Amazon EC2 a doublé il y a 3 jours. Un administrateur constate que le type d'instance est passé de m7i.xlarge à t3.large, mais ne sait pas qui a fait la modification. Le compte n'a aucun journal de suivi (trail) CloudTrail ni aucun entrepôt de données d'événements CloudTrail Lake.

    Quelle solution identifie l'auteur de la modification du type d'instance avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Create a CloudTrail trail now and query its log files in Amazon S3 with Amazon Athena.", fr: "Créer maintenant un journal de suivi CloudTrail et interroger ses fichiers journaux dans Amazon S3 avec Amazon Athena." } }
    - { id: b, text: { en: "Search the CloudTrail event history in the instance's Region for the ModifyInstanceAttribute event.", fr: "Rechercher l'événement ModifyInstanceAttribute dans l'historique des événements CloudTrail de la Région de l'instance." } }
    - { id: c, text: { en: "Enable VPC Flow Logs on the instance's subnet and search the records for the source of the change.", fr: "Activer les journaux de flux VPC sur le sous-réseau de l'instance et rechercher la source de la modification dans les enregistrements." } }
    - { id: d, text: { en: "Install the CloudWatch agent on the instance and search the operating system logs for the change.", fr: "Installer l'agent CloudWatch sur l'instance et rechercher la modification dans les journaux du système d'exploitation." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CloudTrail event history is available without any configuration and keeps a searchable record of the past 90 days of management events in each Region, at no charge. Changing an instance type is a management API call (ModifyInstanceAttribute), so the event and the identity that made it can be found there.
    fr: |
      L'historique des événements CloudTrail est disponible sans aucune configuration et conserve, sans frais, un enregistrement consultable des 90 derniers jours d'événements de gestion de chaque Région. La modification d'un type d'instance est un appel d'API de gestion (ModifyInstanceAttribute) : l'événement et l'identité qui l'a effectué s'y trouvent.
  options:
    a: { en: "A new trail records only events that occur after its creation, so it cannot show a change made 3 days ago.", fr: "Un nouveau journal de suivi n'enregistre que les événements postérieurs à sa création : il ne peut pas montrer une modification faite il y a 3 jours." }
    c: { en: "Flow logs record IP traffic in the VPC, not AWS API calls or the identities that made them.", fr: "Les journaux de flux enregistrent le trafic IP du VPC, pas les appels d'API AWS ni les identités qui les ont effectués." }
    d: { en: "The instance type is changed through the EC2 API, outside the operating system, and new logs would not cover the past.", fr: "Le type d'instance est modifié par l'API EC2, hors du système d'exploitation, et de nouveaux journaux ne couvriraient pas le passé." }
references:
  - title: Working with CloudTrail event history
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
