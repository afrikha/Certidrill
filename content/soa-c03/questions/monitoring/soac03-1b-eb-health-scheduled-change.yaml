id: soac03-1b-eb-health-scheduled-change
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs Amazon EC2 instances in the eu-central-1 Region. The operations team wants an email through an Amazon SNS topic whenever AWS schedules maintenance, such as a reboot or a retirement, for any EC2 instance in the account. An administrator creates a rule on the default event bus in eu-central-1.

    Which event pattern should the administrator use?
  fr: |
    Une entreprise exécute des instances Amazon EC2 dans la Région eu-central-1. L'équipe d'exploitation veut recevoir un e-mail par une rubrique Amazon SNS chaque fois qu'AWS planifie une maintenance, comme un redémarrage ou une mise hors service, pour une instance EC2 du compte. Un administrateur crée une règle sur le bus d'événements par défaut de eu-central-1.

    Quel modèle d'événement l'administrateur doit-il utiliser ?
body:
  options:
    - { id: a, text: "`{\"source\": [\"aws.ec2\"], \"detail-type\": [\"EC2 Instance State-change Notification\"], \"detail\": {\"state\": [\"stopping\"]}}`" }
    - { id: b, text: "`{\"source\": [\"aws.health\"], \"detail-type\": [\"AWS Health Event\"], \"detail\": {\"service\": [\"EC2\"], \"eventTypeCategory\": [\"issue\"]}}`" }
    - { id: c, text: "`{\"source\": [\"aws.ec2\"], \"detail-type\": [\"AWS API Call via CloudTrail\"], \"detail\": {\"eventName\": [\"RebootInstances\"]}}`" }
    - { id: d, text: "`{\"source\": [\"aws.health\"], \"detail-type\": [\"AWS Health Event\"], \"detail\": {\"service\": [\"EC2\"], \"eventTypeCategory\": [\"scheduledChange\"]}}`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Planned maintenance is announced by AWS Health, whose events have the source aws.health and the detail-type AWS Health Event. The eventTypeCategory value scheduledChange covers planned events, such as instance reboot maintenance, and the service filter limits the rule to Amazon EC2. Regional Health events are delivered in the Region of the affected resources, so a rule in eu-central-1 receives them.
    fr: |
      La maintenance planifiée est annoncée par AWS Health, dont les événements ont la source aws.health et le detail-type AWS Health Event. La valeur scheduledChange de eventTypeCategory couvre les événements planifiés, comme la maintenance de redémarrage d'instance, et le filtre service limite la règle à Amazon EC2. Les événements Health régionaux sont livrés dans la Région des ressources concernées : une règle de eu-central-1 les reçoit.
  options:
    a: { en: "This pattern fires when an instance is already stopping, not when AWS schedules future maintenance.", fr: "Ce modèle se déclenche lorsqu'une instance est déjà en cours d'arrêt, pas lorsqu'AWS planifie une maintenance future." }
    b: { en: "The issue category is for service problems, not for scheduled changes.", fr: "La catégorie issue concerne les problèmes de service, pas les modifications planifiées." }
    c: { en: "RebootInstances is a call that a user or application makes; AWS scheduled maintenance is not reported this way.", fr: "RebootInstances est un appel qu'un utilisateur ou une application effectue ; la maintenance planifiée par AWS n'est pas signalée ainsi." }
references:
  - title: "Reference: AWS Health events Amazon EventBridge schema"
    url: https://docs.aws.amazon.com/health/latest/ug/aws-health-events-eventbridge-schema.html
  - title: Creating EventBridge rules for AWS Region coverage
    url: https://docs.aws.amazon.com/health/latest/ug/choosing-a-region.html
