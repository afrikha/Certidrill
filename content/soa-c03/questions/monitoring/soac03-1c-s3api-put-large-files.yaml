id: soac03-1c-s3api-put-large-files
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations engineer runs a nightly script on an Amazon EC2 instance that uploads database dump files of 8 GB to 15 GB to an Amazon S3 bucket with the following command. Every night, the upload fails with an EntityTooLarge error.

    ```bash
    aws s3api put-object --bucket example-db-dumps --key nightly/dump.sql.gz --body /backup/dump.sql.gz
    ```

    The engineer wants to fix the script with the LEAST effort. Which solution will meet these requirements?
  fr: |
    Un ingénieur d'exploitation exécute chaque nuit, sur une instance Amazon EC2, un script qui charge des fichiers de vidage de base de données de 8 Go à 15 Go dans un compartiment Amazon S3 avec la commande suivante. Chaque nuit, le chargement échoue avec une erreur EntityTooLarge.

    ```bash
    aws s3api put-object --bucket example-db-dumps --key nightly/dump.sql.gz --body /backup/dump.sql.gz
    ```

    L'ingénieur veut corriger le script avec le MOINS d'effort possible. Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace the command with aws s3 cp, which automatically uses multipart upload for large files.", fr: "Remplacer la commande par aws s3 cp, qui utilise automatiquement le chargement partitionné pour les fichiers volumineux." } }
    - { id: b, text: { en: "Enable S3 Transfer Acceleration on the bucket and add the --endpoint-url option with the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment et ajouter l'option --endpoint-url avec le point de terminaison accéléré." } }
    - { id: c, text: { en: "Request a Service Quotas increase for the maximum size of an object in the bucket.", fr: "Demander une augmentation Service Quotas de la taille maximale d'un objet dans le compartiment." } }
    - { id: d, text: { en: "Set multipart_threshold to 16GB in the AWS CLI s3 configuration of the instance.", fr: "Définir multipart_threshold à 16GB dans la configuration s3 de l'AWS CLI de l'instance." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A single PUT operation can upload an object of up to 5 GB, so put-object fails for larger files. The high-level aws s3 cp command switches to multipart upload above its multipart threshold and uploads the parts in parallel, which also lets a failed part be retried alone."
    fr: "Une seule opération PUT peut charger un objet de 5 Go au maximum : put-object échoue donc pour les fichiers plus gros. La commande de haut niveau aws s3 cp passe au chargement partitionné au-delà de son seuil multipart et charge les parties en parallèle, ce qui permet aussi de relancer seule une partie en échec."
  options:
    b:
      en: "Transfer Acceleration speeds up long-distance transfers but does not change the 5 GB limit of a single PUT."
      fr: "Transfer Acceleration accélère les transferts longue distance mais ne change pas la limite de 5 Go d'une seule requête PUT."
    c:
      en: "Objects of 15 GB are well within the maximum S3 object size; the limit that fails is the size of a single PUT, which is not a quota to raise."
      fr: "Des objets de 15 Go sont bien en deçà de la taille maximale d'un objet S3 ; la limite atteinte est celle d'une seule requête PUT, qui n'est pas un quota à augmenter."
    d:
      en: "The s3 configuration settings apply to the high-level aws s3 commands, not to s3api put-object, and a 16 GB threshold would disable multipart for these files anyway."
      fr: "Les paramètres de configuration s3 s'appliquent aux commandes de haut niveau aws s3, pas à s3api put-object, et un seuil de 16 Go désactiverait de toute façon le chargement partitionné pour ces fichiers."
references:
  - title: Uploading objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/upload-objects.html
  - title: Uploading and copying objects using multipart upload in Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html
