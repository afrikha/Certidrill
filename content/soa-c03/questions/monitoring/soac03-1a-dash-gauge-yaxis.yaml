id: soac03-1a-dash-gauge-yaxis
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer manages a CloudWatch dashboard as JSON in a repository. The engineer changes a widget that shows the memory use of a database host from a line graph to a gauge:

    ```json
    {
      "type": "metric",
      "properties": {
        "metrics": [["CWAgent", "mem_used_percent", "InstanceId", "i-0123456789abcdef0"]],
        "view": "gauge",
        "region": "eu-west-1",
        "stat": "Average",
        "period": 300
      }
    }
    ```

    The `PutDashboard` call now returns a validation error for this widget.

    Which change will fix the error?
  fr: |
    Un ingénieur gère un tableau de bord CloudWatch sous forme de JSON dans un dépôt. Il fait passer un widget qui affiche l'utilisation de la mémoire d'un hôte de base de données d'un graphique linéaire à une jauge :

    ```json
    {
      "type": "metric",
      "properties": {
        "metrics": [["CWAgent", "mem_used_percent", "InstanceId", "i-0123456789abcdef0"]],
        "view": "gauge",
        "region": "eu-west-1",
        "stat": "Average",
        "period": 300
      }
    }
    ```

    L'appel `PutDashboard` renvoie maintenant une erreur de validation pour ce widget.

    Quelle modification permet de corriger l'erreur ?
body:
  options:
    - id: a
      text: { en: "Add a `yAxis` property whose `left` side sets `min` to 0 and `max` to 100.", fr: "Ajouter une propriété `yAxis` dont le côté `left` définit `min` à 0 et `max` à 100." }
    - id: b
      text: { en: "Replace `\"stat\": \"Average\"` with `\"stat\": \"Maximum\"`.", fr: "Remplacer `\"stat\": \"Average\"` par `\"stat\": \"Maximum\"`." }
    - id: c
      text: { en: "Add `\"liveData\": true` so that the gauge shows the latest value.", fr: "Ajouter `\"liveData\": true` pour que la jauge affiche la dernière valeur." }
    - id: d
      text: { en: "Replace the `CWAgent` namespace with `AWS/EC2`.", fr: "Remplacer l'espace de noms `CWAgent` par `AWS/EC2`." }
answer: { optionId: a }
explanation:
  correct:
    en: "In the dashboard body syntax, a metric widget with the `gauge` view requires `min` and `max` on the left side of `yAxis`, because the gauge needs a range to draw the value against. The other properties of the widget are valid."
    fr: "Dans la syntaxe du corps d'un tableau de bord, un widget de métrique avec la vue `gauge` exige `min` et `max` sur le côté gauche de `yAxis`, car la jauge a besoin d'une plage pour situer la valeur. Les autres propriétés du widget sont valides."
  options:
    b: { en: "Any statistic is valid for a gauge; the statistic does not cause the validation error.", fr: "Toute statistique est valide pour une jauge ; la statistique ne cause pas l'erreur de validation." }
    c: { en: "`liveData` is optional and does not provide the range that the gauge requires.", fr: "`liveData` est facultatif et ne fournit pas la plage exigée par la jauge." }
    d: { en: "The CloudWatch agent publishes `mem_used_percent` in `CWAgent` by default; `AWS/EC2` has no memory metric.", fr: "L'agent CloudWatch publie `mem_used_percent` dans `CWAgent` par défaut ; `AWS/EC2` n'a aucune métrique de mémoire." }
references:
  - title: Dashboard Body Structure and Syntax
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/CloudWatch-Dashboard-Body-Structure.html
