id: soac03-1b-ebs-extend-filesystem
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator increases the size of an EBS data volume attached to a Nitro-based Amazon Linux instance from 100 GiB to 200 GiB. The modification is now in the optimizing state. On the instance, the administrator runs the following commands:

    ```bash
    $ lsblk /dev/nvme1n1
    NAME        MAJ:MIN RM  SIZE RO TYPE MOUNTPOINTS
    nvme1n1     259:1    0  200G  0 disk
    └─nvme1n1p1 259:2    0  100G  0 part /data
    $ df -hT /data
    Filesystem     Type  Size  Used Avail Use% Mounted on
    /dev/nvme1n1p1 xfs   100G   96G  4.0G  96% /data
    ```

    Which commands should the administrator run to make the extra space available in /data without downtime?
  fr: |
    Un administrateur fait passer la taille d'un volume de données EBS attaché à une instance Amazon Linux basée sur Nitro de 100 Gio à 200 Gio. La modification est maintenant à l'état optimizing. Sur l'instance, l'administrateur exécute les commandes suivantes :

    ```bash
    $ lsblk /dev/nvme1n1
    NAME        MAJ:MIN RM  SIZE RO TYPE MOUNTPOINTS
    nvme1n1     259:1    0  200G  0 disk
    └─nvme1n1p1 259:2    0  100G  0 part /data
    $ df -hT /data
    Filesystem     Type  Size  Used Avail Use% Mounted on
    /dev/nvme1n1p1 xfs   100G   96G  4.0G  96% /data
    ```

    Quelles commandes l'administrateur doit-il exécuter pour rendre l'espace supplémentaire disponible dans /data sans interruption ?
body:
  options:
    - { id: a, text: "`sudo resize2fs /dev/nvme1n1p1`" }
    - { id: b, text: { en: "`sudo xfs_growfs -d /data`, without extending the partition", fr: "`sudo xfs_growfs -d /data`, sans étendre la partition" } }
    - { id: c, text: { en: "`sudo growpart /dev/nvme1n1 1`, then `sudo xfs_growfs -d /data`", fr: "`sudo growpart /dev/nvme1n1 1`, puis `sudo xfs_growfs -d /data`" } }
    - { id: d, text: { en: "`sudo growpart /dev/nvme1n1 1`, then reboot the instance", fr: "`sudo growpart /dev/nvme1n1 1`, puis redémarrer l'instance" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Increasing the volume does not grow its partition or file system. lsblk shows that the partition is still 100G on a 200G disk, so growpart must extend partition 1 first. The df output shows an XFS file system, which is extended online with xfs_growfs and the mount point.
    fr: |
      Agrandir le volume n'agrandit ni sa partition ni son système de fichiers. lsblk montre que la partition fait toujours 100G sur un disque de 200G : growpart doit d'abord étendre la partition 1. La sortie de df montre un système de fichiers XFS, qui s'étend en ligne avec xfs_growfs et le point de montage.
  options:
    a: { en: "resize2fs is for ext4 file systems; this file system is XFS, and the partition is not extended yet.", fr: "resize2fs est destiné aux systèmes de fichiers ext4 ; celui-ci est XFS, et la partition n'est pas encore étendue." }
    b: { en: "The file system cannot grow beyond its 100G partition, so it reports that the data size is unchanged.", fr: "Le système de fichiers ne peut pas dépasser sa partition de 100G : il indique que la taille des données est inchangée." }
    d: { en: "A reboot does not grow the file system, and it causes downtime that the online xfs_growfs command avoids.", fr: "Un redémarrage n'agrandit pas le système de fichiers et provoque une interruption que la commande xfs_growfs en ligne évite." }
references:
  - title: Extend the file system after resizing an Amazon EBS volume
    url: https://docs.aws.amazon.com/ebs/latest/userguide/recognize-expanded-volume-linux.html
