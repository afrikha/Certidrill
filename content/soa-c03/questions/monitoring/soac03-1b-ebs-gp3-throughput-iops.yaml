id: soac03-1b-ebs-gp3-throughput-iops
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media processing application reads large files sequentially from a 2 TiB gp3 volume that has the default 3,000 IOPS and 125 MiB/s. The application needs 1,000 MiB/s of throughput, and its IOPS needs are low. An administrator runs the following command, and Amazon EBS rejects the request:

    ```bash
    aws ec2 modify-volume --volume-id vol-0abc1234def567890 --throughput 1000
    ```

    Which solution will provide the required throughput at the LOWEST cost?
  fr: |
    Une application de traitement multimédia lit séquentiellement de gros fichiers sur un volume gp3 de 2 Tio qui a les valeurs par défaut de 3 000 IOPS et 125 Mio/s. L'application a besoin d'un débit de 1 000 Mio/s, et ses besoins en IOPS sont faibles. Un administrateur exécute la commande suivante, et Amazon EBS rejette la demande :

    ```bash
    aws ec2 modify-volume --volume-id vol-0abc1234def567890 --throughput 1000
    ```

    Quelle solution fournit le débit requis au coût le PLUS BAS ?
body:
  options:
    - { id: a, text: { en: "Modify the gp3 volume with --iops 4000 and --throughput 1000 in the same request.", fr: "Modifier le volume gp3 avec --iops 4000 et --throughput 1000 dans la même demande." } }
    - { id: b, text: { en: "Change the volume to st1, which is designed for large sequential I/O.", fr: "Faire passer le volume en st1, conçu pour les E/S séquentielles de grande taille." } }
    - { id: c, text: { en: "Change the volume to io2 with 64,000 IOPS, because gp3 cannot exceed 500 MiB/s.", fr: "Faire passer le volume en io2 avec 64 000 IOPS, car gp3 ne peut pas dépasser 500 Mio/s." } }
    - { id: d, text: { en: "Increase the size of the gp3 volume to 4 TiB and retry the same command.", fr: "Porter la taille du volume gp3 à 4 Tio et réessayer la même commande." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      gp3 throughput can be provisioned up to 2,000 MiB/s, but at most 0.25 MiB/s per provisioned IOPS. With 3,000 IOPS, the maximum is 750 MiB/s, so 1,000 MiB/s needs at least 4,000 IOPS. Raising IOPS to 4,000 together with throughput is the smallest change that meets the need.
    fr: |
      Le débit gp3 peut être provisionné jusqu'à 2 000 Mio/s, mais au plus 0,25 Mio/s par IOPS provisionnée. Avec 3 000 IOPS, le maximum est de 750 Mio/s : 1 000 Mio/s exige au moins 4 000 IOPS. Porter les IOPS à 4 000 en même temps que le débit est la plus petite modification qui répond au besoin.
  options:
    b: { en: "st1 throughput is capped at 500 MiB/s per volume, which is below the requirement.", fr: "Le débit st1 est plafonné à 500 Mio/s par volume, ce qui est inférieur à l'exigence." }
    c: { en: "gp3 supports up to 2,000 MiB/s, and an io2 volume with 64,000 IOPS costs far more than the extra gp3 IOPS.", fr: "gp3 prend en charge jusqu'à 2 000 Mio/s, et un volume io2 de 64 000 IOPS coûte bien plus que les IOPS gp3 supplémentaires." }
    d: { en: "gp3 throughput depends on provisioned IOPS, not on size; a larger volume still has 3,000 IOPS and costs more.", fr: "Le débit gp3 dépend des IOPS provisionnées, pas de la taille : un volume plus grand a toujours 3 000 IOPS et coûte plus cher." }
references:
  - title: Amazon EBS General Purpose SSD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
  - title: Amazon EBS Throughput Optimized HDD and Cold HDD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/hdd-vols.html
