id: soac03-1a-logs-firehose-subscription
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores the access logs of a web application in an Amazon CloudWatch Logs log group of the Standard class. Analysts query the logs with Amazon Athena and need every new log event in an Amazon S3 bucket within a few minutes of ingestion. The solution must run continuously with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke les journaux d'accès d'une application web dans un groupe de journaux Amazon CloudWatch Logs de classe Standard. Des analystes interrogent les journaux avec Amazon Athena et ont besoin de chaque nouvel événement de journal dans un compartiment Amazon S3 quelques minutes après son ingestion. La solution doit fonctionner en continu avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Schedule a Lambda function every 5 minutes that runs a CloudWatch Logs export task to the S3 bucket.", fr: "Planifier toutes les 5 minutes une fonction Lambda qui lance une tâche d'exportation CloudWatch Logs vers le compartiment S3." }
    - id: b
      text: { en: "Set the retention of the log group to 1 day so that CloudWatch Logs moves expired log events to the S3 bucket.", fr: "Définir la conservation du groupe de journaux à 1 jour pour que CloudWatch Logs déplace les événements expirés vers le compartiment S3." }
    - id: c
      text: { en: "Create a subscription filter on the log group with an Amazon Data Firehose stream that delivers to the bucket.", fr: "Créer sur le groupe de journaux un filtre d'abonnement vers un flux Amazon Data Firehose qui livre dans le compartiment." }
    - id: d
      text: { en: "Run a CloudWatch Logs Insights query every hour and save the results of each query to the S3 bucket.", fr: "Exécuter toutes les heures une requête CloudWatch Logs Insights et enregistrer les résultats de chaque requête dans le compartiment S3." }
answer: { optionId: c }
explanation:
  correct:
    en: "A subscription filter streams matching log events to a destination soon after ingestion, usually in less than three minutes. Data Firehose is a supported destination and delivers the events to Amazon S3 without any server or schedule to manage. AWS recommends subscriptions, not repeated exports, to copy logs continuously."
    fr: "Un filtre d'abonnement diffuse les événements de journal correspondants vers une destination peu après leur ingestion, généralement en moins de trois minutes. Data Firehose est une destination prise en charge et livre les événements dans Amazon S3 sans serveur ni planification à gérer. AWS recommande les abonnements, et non des exportations répétées, pour copier les journaux en continu."
  options:
    a: { en: "Log data can take up to 12 hours to become available for export, and AWS advises against regular exports for continuous archiving.", fr: "Les données de journal peuvent mettre jusqu'à 12 heures à être disponibles pour l'exportation, et AWS déconseille les exportations régulières pour un archivage continu." }
    b: { en: "Expired log events are deleted, not moved to Amazon S3.", fr: "Les événements de journal expirés sont supprimés, et non déplacés vers Amazon S3." }
    d: { en: "An hourly query misses the requirement of a few minutes and adds query cost and scheduling to manage.", fr: "Une requête horaire ne respecte pas le délai de quelques minutes et ajoute un coût de requête et une planification à gérer." }
references:
  - title: Real-time processing of log data with subscriptions
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Subscriptions.html
  - title: Exporting log data to Amazon S3
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/S3Export.html
