id: soac03-1a-agent-fleet-ssm
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs 200 Amazon EC2 Linux instances that are managed nodes in AWS Systems Manager. Their instance profile has the `CloudWatchAgentServerPolicy` and `AmazonSSMManagedInstanceCore` policies. The CloudWatch agent is not installed. The operations team must install the agent on every instance and apply the same agent configuration everywhere, with the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exploite 200 instances Amazon EC2 Linux qui sont des nœuds gérés dans AWS Systems Manager. Leur profil d'instance possède les politiques `CloudWatchAgentServerPolicy` et `AmazonSSMManagedInstanceCore`. L'agent CloudWatch n'est pas installé. L'équipe des opérations doit installer l'agent sur chaque instance et appliquer partout la même configuration de l'agent, avec le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en trois.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Save the agent configuration in Parameter Store as a parameter named `AmazonCloudWatch-linux`.", fr: "Enregistrer la configuration de l'agent dans Parameter Store sous la forme d'un paramètre nommé `AmazonCloudWatch-linux`." } }
    - { id: b, text: { en: "Use Session Manager to connect to each instance and run the agent configuration wizard.", fr: "Utiliser Session Manager pour se connecter à chaque instance et exécuter l'assistant de configuration de l'agent." } }
    - { id: c, text: { en: "Use Run Command with the `AWS-ConfigureAWSPackage` document to install the `AmazonCloudWatchAgent` package.", fr: "Utiliser Run Command avec le document `AWS-ConfigureAWSPackage` pour installer le package `AmazonCloudWatchAgent`." } }
    - { id: d, text: { en: "Use Run Command with the `AWS-RunPatchBaseline` document to install the agent as a missing update.", fr: "Utiliser Run Command avec le document `AWS-RunPatchBaseline` pour installer l'agent comme une mise à jour manquante." } }
    - { id: e, text: { en: "Use Run Command with the `AmazonCloudWatch-ManageAgent` document, the configure action, and the parameter as the source.", fr: "Utiliser Run Command avec le document `AmazonCloudWatch-ManageAgent`, l'action configure et le paramètre comme source." } }
    - { id: f, text: { en: "Build a new AMI with EC2 Image Builder that includes the agent, and replace all instances.", fr: "Créer avec EC2 Image Builder une nouvelle AMI qui inclut l'agent, et remplacer toutes les instances." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "Storing one configuration in Parameter Store lets every instance load it, and a name that starts with `AmazonCloudWatch-` is readable with `CloudWatchAgentServerPolicy`. Run Command then installs the package on all managed nodes with `AWS-ConfigureAWSPackage` and applies the configuration and restarts the agent with `AmazonCloudWatch-ManageAgent`, without connecting to any instance."
    fr: "Stocker une seule configuration dans Parameter Store permet à chaque instance de la charger, et un nom qui commence par `AmazonCloudWatch-` est lisible avec `CloudWatchAgentServerPolicy`. Run Command installe ensuite le package sur tous les nœuds gérés avec `AWS-ConfigureAWSPackage`, puis applique la configuration et redémarre l'agent avec `AmazonCloudWatch-ManageAgent`, sans se connecter à aucune instance."
  options:
    b: { en: "Running the wizard on 200 instances one by one is manual work and can produce different configurations.", fr: "Exécuter l'assistant sur 200 instances une par une est un travail manuel et peut produire des configurations différentes." }
    d: { en: "`AWS-RunPatchBaseline` applies operating system patches from a patch baseline; it does not install the CloudWatch agent package.", fr: "`AWS-RunPatchBaseline` applique des correctifs du système d'exploitation selon une référence de correctifs ; il n'installe pas le package de l'agent CloudWatch." }
    f: { en: "Rebuilding and replacing every instance is far more work than installing the agent in place.", fr: "Reconstruire et remplacer chaque instance représente bien plus de travail que d'installer l'agent sur place." }
references:
  - title: Install the CloudWatch agent using AWS Systems Manager
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/installing-cloudwatch-agent-ssm.html
