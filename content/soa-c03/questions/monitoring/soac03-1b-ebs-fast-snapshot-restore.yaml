id: soac03-1b-ebs-fast-snapshot-restore
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Auto Scaling group launches Amazon EC2 instances in two Availability Zones several times each day. Each instance gets a 500 GiB gp3 data volume created from the same EBS snapshot of a reference dataset. For the first hour after launch, queries are much slower than on older instances, although the volume settings are identical.

    The company wants every new volume to deliver its full provisioned performance as soon as it is created.

    Which solution will meet these requirements?
  fr: |
    Un groupe Auto Scaling lance des instances Amazon EC2 dans deux zones de disponibilité plusieurs fois par jour. Chaque instance reçoit un volume de données gp3 de 500 Gio créé à partir du même instantané EBS d'un jeu de données de référence. Pendant la première heure après le lancement, les requêtes sont beaucoup plus lentes que sur les instances plus anciennes, alors que les paramètres des volumes sont identiques.

    L'entreprise veut que chaque nouveau volume fournisse toutes ses performances provisionnées dès sa création.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the data volumes to io2 with the same number of IOPS.", fr: "Faire passer les volumes de données en io2 avec le même nombre d'IOPS." } }
    - { id: b, text: { en: "Enable fast snapshot restore on the snapshot in both Availability Zones.", fr: "Activer la restauration rapide d'instantanés (fast snapshot restore) sur l'instantané dans les deux zones de disponibilité." } }
    - { id: c, text: { en: "Create the volumes with a volume initialization rate of 300 MiB/s.", fr: "Créer les volumes avec un taux d'initialisation de volume de 300 Mio/s." } }
    - { id: d, text: { en: "Add a user data script that reads every block of the volume with fio before the application starts.", fr: "Ajouter un script de données utilisateur qui lit chaque bloc du volume avec fio avant le démarrage de l'application." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A volume created from a snapshot must download its blocks from Amazon S3 before they are fully performant, so the first reads are slow. With fast snapshot restore, a volume created from the snapshot is fully initialized at creation and delivers its full performance immediately. Fast snapshot restore is enabled per snapshot and per Availability Zone, so both Availability Zones need it.
    fr: |
      Un volume créé à partir d'un instantané doit télécharger ses blocs depuis Amazon S3 avant d'offrir toutes ses performances : les premières lectures sont lentes. Avec la restauration rapide d'instantanés, un volume créé à partir de l'instantané est entièrement initialisé dès sa création et fournit immédiatement toutes ses performances. Elle s'active par instantané et par zone de disponibilité : les deux zones de disponibilité en ont besoin.
  options:
    a: { en: "io2 volumes restored from a snapshot also need initialization; the volume type does not remove the first-read latency.", fr: "Les volumes io2 restaurés à partir d'un instantané ont aussi besoin d'initialisation ; le type de volume ne supprime pas la latence des premières lectures." }
    c: { en: "A provisioned initialization rate makes initialization finish in a predictable time, but the volume is not fully initialized when it is created.", fr: "Un taux d'initialisation provisionné fait aboutir l'initialisation dans un délai prévisible, mais le volume n'est pas entièrement initialisé à sa création." }
    d: { en: "Reading every block initializes the volume, but it can take a long time and delays the application instead of giving full performance at creation.", fr: "Lire chaque bloc initialise le volume, mais cela peut prendre longtemps et retarde l'application au lieu de fournir toutes les performances à la création." }
references:
  - title: Amazon EBS fast snapshot restore
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-fast-snapshot-restore.html
  - title: Initialize Amazon EBS volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-initialize.html
