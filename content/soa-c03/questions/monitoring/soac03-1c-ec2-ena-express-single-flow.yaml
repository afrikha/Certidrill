id: soac03-1c-ec2-ena-express-single-flow
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two Amazon EC2 instances in different Availability Zones of the us-east-1 Region replicate data over one TCP connection. Both instance types support ENA Express and have enough aggregate network bandwidth, but the single flow never goes above about 5 Gbps. The instances must stay in different Availability Zones. The company needs the single flow to reach about 20 Gbps without changing the application.

    Which solution will meet these requirements?
  fr: |
    Deux instances Amazon EC2 situées dans des zones de disponibilité différentes de la Région us-east-1 répliquent des données sur une seule connexion TCP. Les deux types d'instance prennent en charge ENA Express et disposent d'une bande passante réseau agrégée suffisante, mais le flux unique ne dépasse jamais environ 5 Gbit/s. Les instances doivent rester dans des zones de disponibilité différentes. L'entreprise a besoin que le flux unique atteigne environ 20 Gbit/s sans modifier l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Place both instances in the same cluster placement group.", fr: "Placer les deux instances dans le même groupe de placement de cluster." } }
    - { id: b, text: { en: "Attach an Elastic Fabric Adapter (EFA) to each instance for the replication traffic.", fr: "Attacher un Elastic Fabric Adapter (EFA) à chaque instance pour le trafic de réplication." } }
    - { id: c, text: { en: "Set the MTU of both instances to 9001 bytes to use jumbo frames.", fr: "Définir le MTU des deux instances à 9 001 octets pour utiliser des trames jumbo." } }
    - { id: d, text: { en: "Enable ENA Express on the network interface attachments of both instances.", fr: "Activer ENA Express sur les attachements d'interface réseau des deux instances." } }
answer: { optionId: d }
explanation:
  correct:
    en: "ENA Express uses the AWS Scalable Reliable Datagram (SRD) protocol and raises the maximum bandwidth of a single flow from 5 Gbps to 25 Gbps, between instances in the same Availability Zone or in different Availability Zones of the same Region. It is configured on the network interface attachment and must be enabled on both instances; the application does not change."
    fr: "ENA Express utilise le protocole AWS Scalable Reliable Datagram (SRD) et fait passer la bande passante maximale d'un flux unique de 5 Gbit/s à 25 Gbit/s, entre des instances de la même zone de disponibilité ou de zones de disponibilité différentes d'une même Région. Il se configure sur l'attachement de l'interface réseau et doit être activé sur les deux instances ; l'application ne change pas."
  options:
    a:
      en: "A cluster placement group is limited to one Availability Zone, and its single-flow limit is 10 Gbps."
      fr: "Un groupe de placement de cluster est limité à une zone de disponibilité, et sa limite par flux unique est de 10 Gbit/s."
    b:
      en: "EFA traffic cannot cross Availability Zones, and using its OS-bypass interface requires applications built on libraries such as MPI or NCCL."
      fr: "Le trafic EFA ne peut pas traverser les zones de disponibilité, et son interface de contournement du système d'exploitation exige des applications construites sur des bibliothèques comme MPI ou NCCL."
    c:
      en: "Jumbo frames reduce per-packet overhead but do not raise the 5 Gbps limit of a single flow."
      fr: "Les trames jumbo réduisent la surcharge par paquet mais n'augmentent pas la limite de 5 Gbit/s d'un flux unique."
references:
  - title: Improve network performance between EC2 instances with ENA Express
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ena-express.html
  - title: Placement strategies for your placement groups
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html
