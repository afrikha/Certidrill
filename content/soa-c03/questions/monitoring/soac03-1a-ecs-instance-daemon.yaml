id: soac03-1a-ecs-instance-daemon
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon ECS cluster on Amazon EC2 container instances in an Auto Scaling group. Container Insights is turned on for the cluster. The operations team also needs EC2 instance-level metrics, such as the CPU, memory, and disk use of each container instance, in Container Insights. Instances are added and removed as the group scales.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exploite un cluster Amazon ECS sur des instances de conteneur Amazon EC2 d'un groupe Auto Scaling. Container Insights est activé pour le cluster. L'équipe des opérations a aussi besoin, dans Container Insights, de métriques au niveau des instances EC2, comme l'utilisation du processeur, de la mémoire et du disque de chaque instance de conteneur. Des instances sont ajoutées et supprimées au gré de la mise à l'échelle du groupe.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on detailed monitoring in the launch template of the container instances.", fr: "Activer la surveillance détaillée dans le modèle de lancement des instances de conteneur." }
    - id: b
      text: { en: "Run the CloudWatch agent as an ECS service with the `REPLICA` scheduling strategy and one task.", fr: "Exécuter l'agent CloudWatch en tant que service ECS avec la stratégie de planification `REPLICA` et une seule tâche." }
    - id: c
      text: { en: "Run the CloudWatch agent as an ECS service with the `DAEMON` scheduling strategy.", fr: "Exécuter l'agent CloudWatch en tant que service ECS avec la stratégie de planification `DAEMON`." }
    - id: d
      text: { en: "Add the CloudWatch agent as an extra container in the task definition of every application.", fr: "Ajouter l'agent CloudWatch comme conteneur supplémentaire dans la définition de tâche de chaque application." }
answer: { optionId: c }
explanation:
  correct:
    en: "For EC2 instance-level metrics on ECS, AWS deploys the CloudWatch agent as a daemon service: ECS runs exactly one agent task on each container instance, including instances added later. The agent task needs access to the instance metadata service and a task role with `CloudWatchAgentServerPolicy`."
    fr: "Pour les métriques au niveau des instances EC2 sur ECS, AWS déploie l'agent CloudWatch en tant que service démon : ECS exécute exactement une tâche d'agent sur chaque instance de conteneur, y compris les instances ajoutées ensuite. La tâche de l'agent a besoin d'accéder au service de métadonnées d'instance et d'un rôle de tâche avec `CloudWatchAgentServerPolicy`."
  options:
    a: { en: "Detailed monitoring makes EC2 metrics more frequent but adds no memory or disk metrics and no Container Insights data.", fr: "La surveillance détaillée rend les métriques EC2 plus fréquentes, mais n'ajoute ni métriques de mémoire ou de disque ni données Container Insights." }
    b: { en: "A single replica task runs on one instance and cannot collect metrics from the other container instances.", fr: "Une seule tâche réplica s'exécute sur une seule instance et ne peut pas collecter les métriques des autres instances de conteneur." }
    d: { en: "A sidecar in every task runs many agents per instance and is missing on instances that host none of these tasks.", fr: "Un conteneur annexe dans chaque tâche exécute de nombreux agents par instance et manque sur les instances qui n'hébergent aucune de ces tâches." }
references:
  - title: Deploying the CloudWatch agent to collect EC2 instance-level metrics on Amazon ECS
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/deploy-container-insights-ECS-instancelevel.html
