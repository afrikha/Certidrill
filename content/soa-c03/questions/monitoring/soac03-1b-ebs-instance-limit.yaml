id: soac03-1b-ebs-instance-limit
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An analytics application runs on a Nitro-based Amazon EC2 instance with four gp3 data volumes. Each volume is provisioned with 16,000 IOPS. During heavy jobs, the application reports I/O wait. CloudWatch shows the following for the job window:

    - InstanceEBSIOPSExceededCheck for the instance: 1
    - VolumeIOPSExceededCheck for each of the four volumes: 0
    - VolumeThroughputExceededCheck for each of the four volumes: 0

    Which action will improve the I/O performance of the application?
  fr: |
    Une application d'analyse s'exécute sur une instance Amazon EC2 basée sur Nitro avec quatre volumes de données gp3. Chaque volume est provisionné avec 16 000 IOPS. Pendant les traitements lourds, l'application signale de l'attente d'E/S. CloudWatch indique ce qui suit pour la fenêtre des traitements :

    - InstanceEBSIOPSExceededCheck pour l'instance : 1
    - VolumeIOPSExceededCheck pour chacun des quatre volumes : 0
    - VolumeThroughputExceededCheck pour chacun des quatre volumes : 0

    Quelle action améliorera les performances d'E/S de l'application ?
body:
  options:
    - { id: a, text: { en: "Increase the provisioned IOPS of each volume to 32,000.", fr: "Porter les IOPS provisionnées de chaque volume à 32 000." } }
    - { id: b, text: { en: "Attach a fifth gp3 volume and spread the data across five volumes.", fr: "Attacher un cinquième volume gp3 et répartir les données sur cinq volumes." } }
    - { id: c, text: { en: "Convert the four volumes to io2 Block Express with the same IOPS.", fr: "Convertir les quatre volumes en io2 Block Express avec les mêmes IOPS." } }
    - { id: d, text: { en: "Change the instance to an instance type that supports a higher maximum EBS IOPS.", fr: "Passer l'instance à un type d'instance qui prend en charge un nombre maximal d'IOPS EBS plus élevé." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      InstanceEBSIOPSExceededCheck = 1 shows that the application tried to drive more IOPS than the instance's maximum EBS IOPS, while no volume reached its own limit. The bottleneck is the instance's EBS performance, which depends on the instance type, so only a type with a higher EBS IOPS limit removes it.
    fr: |
      InstanceEBSIOPSExceededCheck = 1 montre que l'application a tenté d'obtenir plus d'IOPS que le maximum d'IOPS EBS de l'instance, alors qu'aucun volume n'a atteint sa propre limite. Le goulot d'étranglement est la performance EBS de l'instance, qui dépend du type d'instance : seul un type avec une limite d'IOPS EBS plus élevée le supprime.
  options:
    a: { en: "The volumes are not at their limits, and the instance caps the total IOPS across all attached volumes.", fr: "Les volumes ne sont pas à leurs limites, et l'instance plafonne le total des IOPS de tous les volumes attachés." }
    b: { en: "Another volume adds volume-level capacity, but the instance-level limit applies to all volumes together.", fr: "Un autre volume ajoute de la capacité au niveau des volumes, mais la limite de l'instance s'applique à l'ensemble des volumes." }
    c: { en: "A different volume type with the same IOPS does not raise the instance's EBS IOPS limit and costs more.", fr: "Un autre type de volume avec les mêmes IOPS ne relève pas la limite d'IOPS EBS de l'instance et coûte plus cher." }
references:
  - title: Amazon CloudWatch metrics for Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/using_cloudwatch_ebs.html
