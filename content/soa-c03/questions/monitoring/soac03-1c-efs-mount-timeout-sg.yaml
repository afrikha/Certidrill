id: soac03-1c-efs-mount-timeout-sg
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator creates an Amazon EFS file system with a mount target in each Availability Zone used by an application. The mount targets use the VPC's default security group. On a new Amazon EC2 instance that uses a security group named app-sg, the mount command hangs and then fails with `mount.nfs: Connection timed out`. The file system's DNS name resolves correctly from the instance.

    Which change will resolve the issue?
  fr: |
    Un administrateur crée un système de fichiers Amazon EFS avec une cible de montage dans chaque zone de disponibilité utilisée par une application. Les cibles de montage utilisent le groupe de sécurité par défaut du VPC. Sur une nouvelle instance Amazon EC2 qui utilise un groupe de sécurité nommé app-sg, la commande de montage se bloque puis échoue avec `mount.nfs: Connection timed out`. Le nom DNS du système de fichiers est correctement résolu depuis l'instance.

    Quelle modification résoudra le problème ?
body:
  options:
    - { id: a, text: { en: "Add an inbound rule to app-sg that allows TCP port 2049 from the mount target security group.", fr: "Ajouter à app-sg une règle entrante qui autorise le port TCP 2049 depuis le groupe de sécurité des cibles de montage." } }
    - { id: b, text: { en: "Enable DNS hostnames for the VPC and mount the file system again by its DNS name.", fr: "Activer les noms d'hôte DNS pour le VPC et monter de nouveau le système de fichiers par son nom DNS." } }
    - { id: c, text: { en: "Add an outbound rule to the mount target security group that allows TCP port 111 to app-sg.", fr: "Ajouter au groupe de sécurité des cibles de montage une règle sortante qui autorise le port TCP 111 vers app-sg." } }
    - { id: d, text: { en: "Add an inbound rule to the mount target security group that allows TCP port 2049 from app-sg.", fr: "Ajouter au groupe de sécurité des cibles de montage une règle entrante qui autorise le port TCP 2049 depuis app-sg." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A mount that hangs and times out usually means that NFS traffic does not reach the mount target. The default security group allows inbound traffic only from itself, so the mount target security group needs an inbound rule for NFS (TCP 2049) from the instances' security group. Security groups are stateful, so the return traffic is allowed automatically."
    fr: "Un montage qui se bloque puis expire signifie généralement que le trafic NFS n'atteint pas la cible de montage. Le groupe de sécurité par défaut n'autorise le trafic entrant que depuis lui-même : le groupe de sécurité des cibles de montage a besoin d'une règle entrante NFS (TCP 2049) depuis le groupe de sécurité des instances. Les groupes de sécurité sont avec état, le trafic de retour est donc autorisé automatiquement."
  options:
    a:
      en: "The instance opens the connection, so the inbound rule is needed on the mount target side; the reply to the instance is allowed because security groups are stateful."
      fr: "C'est l'instance qui ouvre la connexion : la règle entrante est nécessaire côté cible de montage ; la réponse vers l'instance est autorisée car les groupes de sécurité sont avec état."
    b:
      en: "The DNS name already resolves, so DNS settings are not the cause of the timeout."
      fr: "Le nom DNS est déjà résolu : les paramètres DNS ne sont pas la cause de l'expiration."
    c:
      en: "Amazon EFS uses NFSv4 on TCP port 2049 only, and outbound rules on the mount target do not let the instance open a connection."
      fr: "Amazon EFS utilise NFSv4 sur le seul port TCP 2049, et des règles sortantes sur la cible de montage ne permettent pas à l'instance d'ouvrir une connexion."
references:
  - title: Troubleshooting mount issues
    url: https://docs.aws.amazon.com/efs/latest/ug/troubleshooting-efs-mounting.html
