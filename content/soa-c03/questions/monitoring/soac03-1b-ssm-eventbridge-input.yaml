id: soac03-1b-ssm-eventbridge-input
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants every new Amazon EC2 instance to be configured by a custom Automation runbook named ConfigureNewInstance as soon as the instance enters the running state. The runbook has a required InstanceId parameter.

    An administrator creates an Amazon EventBridge rule on the default event bus that matches EC2 Instance State-change Notification events with the state running. The target is the runbook, with an IAM role that EventBridge can assume and a constant value for the AutomationAssumeRole parameter only. The rule's TriggeredRules metric increases when instances start, but no automation execution starts.

    What should the administrator do?
  fr: |
    Une entreprise veut que chaque nouvelle instance Amazon EC2 soit configurée par un runbook Automation personnalisé nommé ConfigureNewInstance dès que l'instance passe à l'état running. Le runbook a un paramètre InstanceId obligatoire.

    Un administrateur crée une règle Amazon EventBridge sur le bus d'événements par défaut qui correspond aux événements EC2 Instance State-change Notification avec l'état running. La cible est le runbook, avec un rôle IAM qu'EventBridge peut endosser et une valeur constante pour le seul paramètre AutomationAssumeRole. La métrique TriggeredRules de la règle augmente au démarrage des instances, mais aucune exécution d'automatisation ne démarre.

    Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Add an input transformer to the target that maps $.detail.instance-id into the InstanceId parameter.", fr: "Ajouter à la cible un transformateur d'entrée qui place $.detail.instance-id dans le paramètre InstanceId." } }
    - { id: b, text: { en: "Change the rule state to ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS so that more events match.", fr: "Passer l'état de la règle à ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS pour que davantage d'événements correspondent." } }
    - { id: c, text: { en: "Share the runbook with the events.amazonaws.com principal by modifying its document permissions.", fr: "Partager le runbook avec le principal events.amazonaws.com en modifiant ses autorisations de document." } }
    - { id: d, text: { en: "Replace the target with a CloudWatch log group that stores the events before the runbook starts.", fr: "Remplacer la cible par un groupe de journaux CloudWatch qui stocke les événements avant le lancement du runbook." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An Automation target must provide a value for each required runbook parameter; otherwise the rule exists but cannot start the runbook. An input transformer defines a variable from the event with an input path such as $.detail.instance-id and builds the parameter JSON with an input template, so each event starts the runbook for the instance that entered the running state.
    fr: |
      Une cible Automation doit fournir une valeur pour chaque paramètre obligatoire du runbook ; sinon, la règle existe mais ne peut pas lancer le runbook. Un transformateur d'entrée définit une variable à partir de l'événement avec un chemin d'entrée comme $.detail.instance-id et construit le JSON des paramètres avec un modèle d'entrée : chaque événement lance le runbook pour l'instance passée à l'état running.
  options:
    b: { en: "The rule already matches the EC2 events, as TriggeredRules shows; this state only adds read-only CloudTrail events.", fr: "La règle correspond déjà aux événements EC2, comme le montre TriggeredRules ; cet état ajoute seulement les événements CloudTrail en lecture seule." }
    c: { en: "Document permissions share runbooks with AWS accounts; EventBridge starts the runbook through the IAM role of the target.", fr: "Les autorisations de document partagent des runbooks avec des comptes AWS ; EventBridge lance le runbook par le rôle IAM de la cible." }
    d: { en: "A log group target only stores the events; it does not start the runbook or supply the missing parameter.", fr: "Une cible de groupe de journaux ne fait que stocker les événements ; elle ne lance pas le runbook et ne fournit pas le paramètre manquant." }
references:
  - title: Run automations based on EventBridge events
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-event-bridge.html
  - title: Amazon EventBridge input transformation
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-transform-target-input.html
