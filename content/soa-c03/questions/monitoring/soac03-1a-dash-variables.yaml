id: soac03-1a-dash-variables
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team maintains 40 copies of the same CloudWatch dashboard, one for each AWS Lambda function of an application. Each copy shows the invocations, errors, duration, and throttles of one function. Every change must be repeated 40 times. The team wants a single dashboard on which a user picks one function and every widget then shows the metrics of that function.

    Which solution will meet these requirements?
  fr: |
    Une équipe des opérations maintient 40 copies du même tableau de bord CloudWatch, une pour chaque fonction AWS Lambda d'une application. Chaque copie affiche les appels, les erreurs, la durée et les limitations d'une fonction. Chaque modification doit être répétée 40 fois. L'équipe veut un seul tableau de bord sur lequel un utilisateur choisit une fonction, puis tous les widgets affichent les métriques de cette fonction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Replace each widget with a Metrics Insights query that groups the metrics by `FunctionName`.", fr: "Remplacer chaque widget par une requête Metrics Insights qui regroupe les métriques par `FunctionName`." }
    - id: b
      text: { en: "Add a text widget with a link to each of the 40 dashboards at the top of a new dashboard.", fr: "Ajouter en haut d'un nouveau tableau de bord un widget de texte avec un lien vers chacun des 40 tableaux de bord." }
    - id: c
      text: { en: "Keep one copy and add a dashboard property variable on the `FunctionName` dimension.", fr: "Conserver une copie et y ajouter une variable de propriété de tableau de bord sur la dimension `FunctionName`." }
    - id: d
      text: { en: "Keep one copy and share it with the team so that each user can edit the dimension.", fr: "Conserver une copie et la partager avec l'équipe pour que chaque utilisateur puisse modifier la dimension." }
answer: { optionId: c }
explanation:
  correct:
    en: "A property variable changes every occurrence of a JSON property or dimension, such as `FunctionName`, in all the widgets of a dashboard, based on the value chosen in an input on the dashboard. One dashboard then replaces the 40 copies, and changes are made once."
    fr: "Une variable de propriété change toutes les occurrences d'une propriété JSON ou d'une dimension, comme `FunctionName`, dans tous les widgets d'un tableau de bord, selon la valeur choisie dans un champ du tableau de bord. Un seul tableau de bord remplace alors les 40 copies, et les modifications ne se font qu'une fois."
  options:
    a: { en: "Grouping by function shows all 40 functions at once; it does not let the user pick one function for every widget.", fr: "Regrouper par fonction affiche les 40 fonctions à la fois ; cela ne permet pas de choisir une fonction pour tous les widgets." }
    b: { en: "The 40 dashboards still exist and every change must still be repeated on each of them.", fr: "Les 40 tableaux de bord existent toujours, et chaque modification doit toujours être répétée sur chacun d'eux." }
    d: { en: "Sharing gives read-only access, and recipients of a shared dashboard cannot even change variable values.", fr: "Le partage donne un accès en lecture seule, et les destinataires d'un tableau de bord partagé ne peuvent même pas changer les valeurs des variables." }
references:
  - title: Creating flexible CloudWatch dashboards with dashboard variables
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_dashboard_variables.html
