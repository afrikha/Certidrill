id: soac03-1c-ec2-ebs-burst-bandwidth
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A database runs on an m5.large instance with one gp3 volume provisioned with 10,000 IOPS. A nightly batch job runs for 2 hours. For the first 30 minutes, the volume delivers the expected IOPS, and then the IOPS drop sharply for the rest of the job. The instance's EBSIOBalance% metric reaches 0 when the drop starts.

    Which solution will provide consistent IOPS for the whole job?
  fr: |
    Une base de données s'exécute sur une instance m5.large avec un volume gp3 provisionné à 10 000 IOPS. Un traitement par lots nocturne dure 2 heures. Pendant les 30 premières minutes, le volume fournit les IOPS attendues, puis les IOPS chutent fortement pour le reste du traitement. La métrique EBSIOBalance% de l'instance atteint 0 au moment où la chute commence.

    Quelle solution fournira des IOPS constantes pendant tout le traitement ?
body:
  options:
    - { id: a, text: { en: "Change the instance to a size whose baseline EBS performance is at least 10,000 IOPS.", fr: "Passer à une taille d'instance dont les performances EBS de référence atteignent au moins 10 000 IOPS." } }
    - { id: b, text: { en: "Increase the provisioned IOPS of the gp3 volume to 16,000.", fr: "Augmenter les IOPS provisionnées du volume gp3 à 16 000." } }
    - { id: c, text: { en: "Change the volume type to io2 Block Express with 10,000 provisioned IOPS.", fr: "Changer le type de volume en io2 Block Express avec 10 000 IOPS provisionnées." } }
    - { id: d, text: { en: "Enable EBS optimization on the instance.", fr: "Activer l'optimisation EBS sur l'instance." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Effective EBS performance is the lower of the volume's performance and the instance's EBS limit. Smaller sizes such as m5.large can reach their maximum EBS performance for only 30 minutes at least once every 24 hours and then fall back to their baseline; EBSIOBalance% shows the remaining I/O credits of that burst bucket. An instance size whose baseline meets the need sustains the IOPS."
    fr: "Les performances EBS effectives sont la plus faible des deux valeurs entre les performances du volume et la limite EBS de l'instance. Les petites tailles comme m5.large ne peuvent atteindre leurs performances EBS maximales que 30 minutes au moins une fois toutes les 24 heures, puis reviennent à leur niveau de référence ; EBSIOBalance% indique les crédits d'E/S restants de ce compartiment de rafale. Une taille d'instance dont le niveau de référence couvre le besoin maintient les IOPS."
  options:
    b:
      en: "The volume is not the limit; more IOPS on the volume cannot exceed the instance's baseline EBS performance."
      fr: "Le volume n'est pas la limite ; davantage d'IOPS sur le volume ne peut pas dépasser les performances EBS de référence de l'instance."
    c:
      en: "io2 Block Express gives the same 10,000 IOPS at a higher cost, and the instance still caps it at its baseline after the burst."
      fr: "io2 Block Express fournit les mêmes 10 000 IOPS pour un coût supérieur, et l'instance le plafonne toujours à son niveau de référence après la rafale."
    d:
      en: "m5 instances are EBS-optimized by default, so this setting changes nothing."
      fr: "Les instances m5 sont optimisées pour EBS par défaut : ce paramètre ne change rien."
references:
  - title: Amazon EBS-optimized instance types
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-optimized.html
  - title: CloudWatch metrics that are available for your instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/viewing_metrics_with_cloudwatch.html
