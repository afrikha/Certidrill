id: soac03-1a-amp-alertmanager-sns
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores metrics in an Amazon Managed Service for Prometheus workspace. The team added alerting rules and an alert manager configuration whose receiver uses `sns_configs` with the ARN of a Standard SNS topic in the same account and Region. The alerts appear as firing in the workspace, but the topic never receives a message. The topic is not encrypted and has its default access policy.

    Which solution will fix the problem?
  fr: |
    Une entreprise stocke des métriques dans un espace de travail Amazon Managed Service for Prometheus. L'équipe a ajouté des règles d'alerte et une configuration du gestionnaire d'alertes (alert manager) dont le récepteur utilise `sns_configs` avec l'ARN d'une rubrique SNS standard du même compte et de la même Région. Les alertes apparaissent comme déclenchées dans l'espace de travail, mais la rubrique ne reçoit jamais de message. La rubrique n'est pas chiffrée et a sa politique d'accès par défaut.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - id: a
      text: { en: "Allow `aps.amazonaws.com` to call `sns:Publish` and `sns:GetTopicAttributes` in the topic's access policy, with the workspace ARN as `aws:SourceArn`.", fr: "Autoriser `aps.amazonaws.com` à appeler `sns:Publish` et `sns:GetTopicAttributes` dans la politique d'accès de la rubrique, avec l'ARN de l'espace de travail comme `aws:SourceArn`." }
    - id: b
      text: { en: "Attach the `AmazonPrometheusRemoteWriteAccess` managed policy to the role that sends metrics to the workspace.", fr: "Attacher la politique gérée `AmazonPrometheusRemoteWriteAccess` au rôle qui envoie les métriques à l'espace de travail." }
    - id: c
      text: { en: "Allow `cloudwatch.amazonaws.com` to call `sns:Publish` in the topic's access policy, with the workspace ARN as `aws:SourceArn`.", fr: "Autoriser `cloudwatch.amazonaws.com` à appeler `sns:Publish` dans la politique d'accès de la rubrique, avec l'ARN de l'espace de travail comme `aws:SourceArn`." }
    - id: d
      text: { en: "Replace the topic with a FIFO topic and set a message group ID in the `sns_configs` section of the receiver.", fr: "Remplacer la rubrique par une rubrique FIFO et définir un ID de groupe de messages dans la section `sns_configs` du récepteur." }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Managed Service for Prometheus sends alert manager notifications to SNS with the `aps.amazonaws.com` service principal. The topic's access policy must allow it to call `sns:Publish` and `sns:GetTopicAttributes`, with `aws:SourceArn` and `aws:SourceAccount` conditions that limit the permission to the workspace."
    fr: "Amazon Managed Service for Prometheus envoie les notifications du gestionnaire d'alertes à SNS avec le principal de service `aps.amazonaws.com`. La politique d'accès de la rubrique doit l'autoriser à appeler `sns:Publish` et `sns:GetTopicAttributes`, avec des conditions `aws:SourceArn` et `aws:SourceAccount` qui limitent l'autorisation à l'espace de travail."
  options:
    b: { en: "Remote write permissions let collectors ingest metrics; ingestion works because the alerts already fire.", fr: "Les autorisations d'écriture distante permettent aux collecteurs d'ingérer des métriques ; l'ingestion fonctionne déjà puisque les alertes se déclenchent." }
    c: { en: "The alerts are sent by Amazon Managed Service for Prometheus, not by CloudWatch, so the CloudWatch principal does not help.", fr: "Les alertes sont envoyées par Amazon Managed Service for Prometheus, et non par CloudWatch : le principal CloudWatch n'aide pas." }
    d: { en: "AWS documents a Standard topic for this receiver, and the missing permission would remain.", fr: "AWS documente une rubrique standard pour ce récepteur, et l'autorisation manquante subsisterait." }
references:
  - title: Giving Amazon Managed Service for Prometheus permission to send alert messages to your Amazon SNS topic
    url: https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-alertmanager-receiver-AMPpermission.html
