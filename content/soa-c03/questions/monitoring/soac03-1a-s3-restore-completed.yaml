id: soac03-1a-s3-restore-completed
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores archived reports in the S3 Glacier Flexible Retrieval storage class. Users request restores, which can take several hours. The company wants Amazon S3 to send a message to an existing SNS topic, which already allows the bucket to publish, as soon as each restored copy is available.

    Which event type should the bucket's event notification use?
  fr: |
    Une entreprise stocke des rapports archivés dans la classe de stockage S3 Glacier Flexible Retrieval. Les utilisateurs demandent des restaurations, qui peuvent prendre plusieurs heures. L'entreprise veut qu'Amazon S3 envoie un message à une rubrique SNS existante, qui autorise déjà le compartiment à publier, dès que chaque copie restaurée est disponible.

    Quel type d'événement la notification d'événement du compartiment doit-elle utiliser ?
body:
  options:
    - id: a
      text: "`s3:ObjectCreated:*`"
    - id: b
      text: "`s3:ObjectRestore:Post`"
    - id: c
      text: "`s3:LifecycleTransition`"
    - id: d
      text: "`s3:ObjectRestore:Completed`"
answer: { optionId: d }
explanation:
  correct:
    en: "`s3:ObjectRestore:Completed` is sent when the restoration of an object from S3 Glacier Flexible Retrieval, S3 Glacier Deep Archive or the archive tiers of S3 Intelligent-Tiering finishes, which is when the restored copy can be read."
    fr: "`s3:ObjectRestore:Completed` est envoyé quand la restauration d'un objet depuis S3 Glacier Flexible Retrieval, S3 Glacier Deep Archive ou les niveaux d'archivage de S3 Intelligent-Tiering se termine, c'est-à-dire quand la copie restaurée peut être lue."
  options:
    a: { en: "A restore does not create a new object, so it does not send an object created event.", fr: "Une restauration ne crée pas de nouvel objet : elle n'envoie pas d'événement de création d'objet." }
    b: { en: "`s3:ObjectRestore:Post` is sent when the restore is requested, hours before the copy is available.", fr: "`s3:ObjectRestore:Post` est envoyé lors de la demande de restauration, des heures avant que la copie soit disponible." }
    c: { en: "This event reports that S3 Lifecycle moved an object to another storage class, not that a restore finished.", fr: "Cet événement signale que S3 Lifecycle a déplacé un objet vers une autre classe de stockage, et non qu'une restauration est terminée." }
references:
  - title: Event notification types and destinations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-event-types-and-destinations.html
