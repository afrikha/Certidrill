id: soac03-1a-composite-no-autoscaling
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company created a composite alarm with the rule `ALARM(HighCPU) AND ALARM(HighLatency)`. The operations team wants the Auto Scaling group of the application to add two instances each time the composite alarm goes into the ALARM state. When the team tries to set the group's step scaling policy as an action of the composite alarm, the configuration is rejected.

    Which solution will meet the requirement?
  fr: |
    Une entreprise a créé une alarme composite avec la règle `ALARM(HighCPU) AND ALARM(HighLatency)`. L'équipe des opérations veut que le groupe Auto Scaling de l'application ajoute deux instances chaque fois que l'alarme composite passe à l'état ALARM. Quand l'équipe essaie de définir la politique de mise à l'échelle par étapes du groupe comme action de l'alarme composite, la configuration est refusée.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Add a Lambda function as the ALARM action of the composite alarm, and have the function run the scaling policy with `ExecutePolicy`.", fr: "Ajouter une fonction Lambda comme action ALARM de l'alarme composite, et faire exécuter la politique de mise à l'échelle par la fonction avec `ExecutePolicy`." }
    - id: b
      text: { en: "Add an SNS topic as the ALARM action of the composite alarm, and subscribe the Auto Scaling group to the topic.", fr: "Ajouter une rubrique SNS comme action ALARM de l'alarme composite, et abonner le groupe Auto Scaling à la rubrique." }
    - id: c
      text: { en: "Add an EC2 action to the composite alarm that launches two instances from the launch template of the group.", fr: "Ajouter à l'alarme composite une action EC2 qui lance deux instances à partir du modèle de lancement du groupe." }
    - id: d
      text: { en: "Replace the step policy with two target tracking policies, one on CPU and one on latency, so that both must breach.", fr: "Remplacer la politique par étapes par deux politiques de suivi de cible, une sur le processeur et une sur la latence, pour que les deux doivent être en dépassement." }
answer: { optionId: a }
explanation:
  correct:
    en: "Composite alarms cannot trigger Auto Scaling actions, but they can invoke a Lambda function (and publish to SNS or create OpsItems). The function receives the alarm state change and can call `ExecutePolicy` to run the group's step scaling policy, so scaling happens only when both child alarms are in ALARM."
    fr: "Les alarmes composites ne peuvent pas déclencher d'actions Auto Scaling, mais elles peuvent invoquer une fonction Lambda (et publier dans SNS ou créer des OpsItems). La fonction reçoit le changement d'état de l'alarme et peut appeler `ExecutePolicy` pour exécuter la politique par étapes du groupe : la mise à l'échelle n'a lieu que lorsque les deux alarmes enfants sont à ALARM."
  options:
    b: { en: "An Auto Scaling group cannot subscribe to an SNS topic, so nothing would run the scaling policy.", fr: "Un groupe Auto Scaling ne peut pas s'abonner à une rubrique SNS : rien n'exécuterait la politique de mise à l'échelle." }
    c: { en: "EC2 alarm actions stop, terminate, reboot or recover an existing instance; they cannot launch instances, and composite alarms do not support them.", fr: "Les actions d'alarme EC2 arrêtent, résilient, redémarrent ou récupèrent une instance existante ; elles ne lancent pas d'instances, et les alarmes composites ne les prennent pas en charge." }
    d: { en: "Each target tracking policy acts on its own metric, so the group would scale out when either metric is high, not only when both are.", fr: "Chaque politique de suivi de cible agit sur sa propre métrique : le groupe augmenterait sa capacité dès que l'une des métriques est élevée, et pas seulement quand les deux le sont." }
references:
  - title: Alarm actions
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-actions.html
  - title: Create a composite alarm
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create_Composite_Alarm.html
