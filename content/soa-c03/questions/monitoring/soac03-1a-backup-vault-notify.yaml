id: soac03-1a-backup-vault-notify
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS Backup to protect Amazon EBS volumes and Amazon RDS databases. All recovery points are stored in a backup vault named `prod-vault`. The operations team wants a message in an existing Standard SNS topic in the same account each time a backup job for this vault fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Backup pour protéger des volumes Amazon EBS et des bases de données Amazon RDS. Tous les points de récupération sont stockés dans un coffre de sauvegarde nommé `prod-vault`. L'équipe des opérations veut un message dans une rubrique SNS standard existante du même compte chaque fois qu'une tâche de sauvegarde de ce coffre échoue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on CloudTrail data events for the vault and create a metric filter on the failed `StartBackupJob` calls.", fr: "Activer les événements de données CloudTrail pour le coffre et créer un filtre de métrique sur les appels `StartBackupJob` en échec." }
    - id: b
      text: { en: "Allow `backup.amazonaws.com` to publish to the topic, and run `put-backup-vault-notifications` for the `BACKUP_JOB_FAILED` event.", fr: "Autoriser `backup.amazonaws.com` à publier dans la politique de la rubrique, puis exécuter `put-backup-vault-notifications` avec l'événement `BACKUP_JOB_FAILED`." }
    - id: c
      text: { en: "Create an AWS Backup Audit Manager report plan that delivers a daily report of the failed backup jobs to the SNS topic.", fr: "Créer un plan de rapport AWS Backup Audit Manager qui livre chaque jour à la rubrique SNS un rapport des tâches de sauvegarde en échec." }
    - id: d
      text: { en: "Add the ARN of the SNS topic to each rule of the backup plan so that AWS Backup notifies the topic when a job of the rule fails.", fr: "Ajouter l'ARN de la rubrique SNS à chaque règle du plan de sauvegarde pour qu'AWS Backup notifie la rubrique quand une tâche de la règle échoue." }
answer: { optionId: b }
explanation:
  correct:
    en: "Backup vault notifications send selected vault events, such as `BACKUP_JOB_FAILED`, to an SNS topic of the same account. The binding is made with the `put-backup-vault-notifications` CLI command or API, and the topic's access policy must allow the `backup.amazonaws.com` principal to publish. Only Standard topics are supported."
    fr: "Les notifications d'un coffre de sauvegarde envoient les événements choisis du coffre, comme `BACKUP_JOB_FAILED`, à une rubrique SNS du même compte. L'association se fait avec la commande CLI ou l'API `put-backup-vault-notifications`, et la politique d'accès de la rubrique doit autoriser le principal `backup.amazonaws.com` à publier. Seules les rubriques standard sont prises en charge."
  options:
    a: { en: "Backup jobs run asynchronously; a successful API call to start a job says nothing about whether the job later fails.", fr: "Les tâches de sauvegarde s'exécutent de façon asynchrone : un appel d'API réussi pour démarrer une tâche n'indique pas si elle échoue ensuite." }
    c: { en: "Report plans produce periodic reports in an S3 bucket; they do not send a message for each failed job.", fr: "Les plans de rapport produisent des rapports périodiques dans un compartiment S3 ; ils n'envoient pas de message pour chaque tâche en échec." }
    d: { en: "Notifications are configured on the backup vault, not on the rules of a backup plan.", fr: "Les notifications se configurent sur le coffre de sauvegarde, et non sur les règles d'un plan de sauvegarde." }
references:
  - title: Notification options with AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-notifications.html
