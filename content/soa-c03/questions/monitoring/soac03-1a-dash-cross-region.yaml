id: soac03-1a-dash-cross-region
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs the same application in the us-east-1 and eu-west-1 Regions in a single AWS account. The operations team wants one CloudWatch dashboard with a graph that shows the latency metrics of both Regions side by side.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Une entreprise exécute la même application dans les Régions us-east-1 et eu-west-1 d'un seul compte AWS. L'équipe des opérations veut un seul tableau de bord CloudWatch avec un graphique qui affiche côte à côte les métriques de latence des deux Régions.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - id: a
      text: { en: "Configure CloudWatch cross-account observability with a sink in each Region.", fr: "Configurer l'observabilité multicompte CloudWatch avec un récepteur (sink) dans chaque Région." }
    - id: b
      text: { en: "Create a metric stream in eu-west-1 that copies the metrics to us-east-1.", fr: "Créer dans eu-west-1 un flux de métriques qui copie les métriques vers us-east-1." }
    - id: c
      text: { en: "Create one dashboard in each Region and add a text widget that links them.", fr: "Créer un tableau de bord dans chaque Région et ajouter un widget de texte qui les relie." }
    - id: d
      text: { en: "Add the metrics of both Regions to the same graph; no setup is needed.", fr: "Ajouter les métriques des deux Régions au même graphique ; aucune configuration n'est nécessaire." }
answer: { optionId: d }
explanation:
  correct:
    en: "Cross-Region support in CloudWatch is automatic: within one account, a graph can contain metrics from several Regions, because each metric or widget has its own `region` property. No sharing, sink or stream is needed."
    fr: "La prise en charge multirégion de CloudWatch est automatique : dans un même compte, un graphique peut contenir des métriques de plusieurs Régions, car chaque métrique ou widget a sa propre propriété `region`. Aucun partage, récepteur ni flux n'est nécessaire."
  options:
    a: { en: "Cross-account observability links accounts; it is not needed to graph metrics from several Regions of the same account.", fr: "L'observabilité multicompte relie des comptes ; elle n'est pas nécessaire pour représenter des métriques de plusieurs Régions d'un même compte." }
    b: { en: "Metric streams send metrics to a Data Firehose destination; they add cost and are not needed for a cross-Region graph.", fr: "Les flux de métriques envoient les métriques vers une destination Data Firehose ; ils ajoutent un coût et ne sont pas nécessaires pour un graphique multirégion." }
    c: { en: "Two dashboards do not give one graph with both Regions side by side.", fr: "Deux tableaux de bord ne donnent pas un seul graphique avec les deux Régions côte à côte." }
references:
  - title: Cross-account cross-Region CloudWatch console
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Cross-Account-Cross-Region.html
