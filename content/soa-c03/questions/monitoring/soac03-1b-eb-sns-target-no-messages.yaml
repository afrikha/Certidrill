id: soac03-1b-eb-sns-target-no-messages
objective: "1.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An administrator creates an Amazon EventBridge rule on the default event bus that sends AWS Health events to an existing Amazon SNS topic. The topic was created by another team with the AWS CLI.

    During a test, the rule's TriggeredRules and FailedInvocations metrics increase, but the topic's NumberOfMessagesPublished metric stays at zero.

    Which issues could cause this behavior? (Choose two.)
  fr: |
    Un administrateur crée une règle Amazon EventBridge sur le bus d'événements par défaut qui envoie les événements AWS Health à une rubrique Amazon SNS existante. La rubrique a été créée par une autre équipe avec l'AWS CLI.

    Pendant un test, les métriques TriggeredRules et FailedInvocations de la règle augmentent, mais la métrique NumberOfMessagesPublished de la rubrique reste à zéro.

    Quels problèmes peuvent expliquer ce comportement ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The topic access policy does not allow events.amazonaws.com to call sns:Publish.", fr: "La politique d'accès de la rubrique n'autorise pas events.amazonaws.com à appeler sns:Publish." } }
    - { id: b, text: { en: "The rule's event pattern does not match the AWS Health events of the test.", fr: "Le modèle d'événement de la règle ne correspond pas aux événements AWS Health du test." } }
    - { id: c, text: { en: "The email subscriptions of the topic are still pending confirmation by their recipients.", fr: "Les abonnements par e-mail de la rubrique attendent toujours la confirmation de leurs destinataires." } }
    - { id: d, text: { en: "The topic uses an AWS KMS key whose key policy does not let events.amazonaws.com use the key.", fr: "La rubrique utilise une clé AWS KMS dont la politique de clé ne permet pas à events.amazonaws.com d'utiliser la clé." } }
    - { id: e, text: { en: "The rule was created in the DISABLED state and has not been enabled since.", fr: "La règle a été créée à l'état DISABLED et n'a pas été activée depuis." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      TriggeredRules proves that the rule is enabled and matches, and FailedInvocations proves that publishing to the topic fails. The two documented causes are a topic policy without an Allow statement for events.amazonaws.com and sns:Publish (the console adds it, the CLI does not), and an encrypted topic whose KMS key policy does not let EventBridge use the key.
    fr: |
      TriggeredRules prouve que la règle est activée et correspond, et FailedInvocations prouve que la publication vers la rubrique échoue. Les deux causes documentées sont une politique de rubrique sans instruction Allow pour events.amazonaws.com et sns:Publish (la console l'ajoute, pas la CLI), et une rubrique chiffrée dont la politique de clé KMS ne permet pas à EventBridge d'utiliser la clé.
  options:
    b: { en: "If the pattern did not match, TriggeredRules would stay at zero.", fr: "Si le modèle ne correspondait pas, TriggeredRules resterait à zéro." }
    c: { en: "Unconfirmed subscriptions stop delivery to email addresses, but the message would still be published to the topic and no invocation would fail.", fr: "Des abonnements non confirmés bloquent la livraison aux adresses e-mail, mais le message serait tout de même publié dans la rubrique et aucune invocation n'échouerait." }
    e: { en: "A disabled rule does not match events, so TriggeredRules would not increase.", fr: "Une règle désactivée ne traite aucun événement : TriggeredRules n'augmenterait pas." }
references:
  - title: Troubleshooting Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-troubleshooting.html
