id: soac03-1c-s3-storage-class-analysis
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores reports in S3 Standard under the `reports/` prefix of an Amazon S3 bucket. The company wants to add an S3 Lifecycle transition to S3 Standard-IA but does not know after how many days the reports stop being read. The company wants a recommendation that is based on the observed access patterns, with the LEAST operational effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des rapports dans S3 Standard sous le préfixe `reports/` d'un compartiment Amazon S3. L'entreprise veut ajouter une transition S3 Lifecycle vers S3 Standard-IA, mais ne sait pas au bout de combien de jours les rapports cessent d'être lus. Elle veut une recommandation fondée sur les modèles d'accès observés, avec le MOINS d'effort opérationnel possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure S3 Inventory for the prefix and review the daily list of objects and their storage classes.", fr: "Configurer S3 Inventory pour le préfixe et examiner la liste quotidienne des objets et de leurs classes de stockage." } }
    - { id: b, text: { en: "Enable server access logging and query the logs with Amazon Athena to compute the age of each object when it is read.", fr: "Activer la journalisation des accès au serveur et interroger les journaux avec Amazon Athena pour calculer l'âge de chaque objet lors de sa lecture." } }
    - { id: c, text: { en: "Enable AWS CloudTrail data events for the bucket and build a CloudWatch dashboard of the GetObject calls.", fr: "Activer les événements de données AWS CloudTrail pour le compartiment et créer un tableau de bord CloudWatch des appels GetObject." } }
    - { id: d, text: { en: "Configure S3 Storage Class Analysis with a filter on the reports/ prefix and review its results after at least 30 days.", fr: "Configurer S3 Storage Class Analysis avec un filtre sur le préfixe reports/ et examiner ses résultats après au moins 30 jours." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Storage Class Analysis observes how often objects in a bucket, prefix or tag filter are retrieved, grouped by object age, and recommends when to transition S3 Standard data to S3 Standard-IA. It needs about 30 days of observation before it gives a result, and it can export daily reports, so no custom analysis is needed."
    fr: "S3 Storage Class Analysis observe la fréquence de récupération des objets d'un compartiment, d'un préfixe ou d'un filtre de balises, regroupés par âge, et recommande quand faire passer les données S3 Standard vers S3 Standard-IA. Elle a besoin d'environ 30 jours d'observation avant de donner un résultat et peut exporter des rapports quotidiens : aucune analyse personnalisée n'est nécessaire."
  options:
    a:
      en: "S3 Inventory lists objects and their metadata, such as storage class, but does not record how often they are read."
      fr: "S3 Inventory liste les objets et leurs métadonnées, comme la classe de stockage, mais n'enregistre pas la fréquence de leurs lectures."
    b:
      en: "Server access logs with Athena can give the answer, but building and maintaining the queries is much more effort than a built-in analysis."
      fr: "Les journaux d'accès au serveur avec Athena peuvent donner la réponse, mais créer et maintenir les requêtes demande beaucoup plus d'effort qu'une analyse intégrée."
    c:
      en: "Data events record each call but provide no age-based transition recommendation, and they add cost and manual analysis."
      fr: "Les événements de données enregistrent chaque appel mais ne fournissent aucune recommandation de transition fondée sur l'âge, et ils ajoutent un coût et une analyse manuelle."
references:
  - title: Amazon S3 analytics – Storage Class Analysis
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/analytics-storage-class.html
