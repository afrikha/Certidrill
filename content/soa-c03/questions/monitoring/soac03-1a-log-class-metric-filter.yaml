id: soac03-1a-log-class-metric-filter
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To reduce ingestion cost, a team created the Amazon CloudWatch Logs log group `/app/orders` with the Infrequent Access (Essentials) log class. Amazon EC2 instances send the application logs to this log group. The team now needs a metric that counts the log events that contain `ERROR` so that a CloudWatch alarm can notify the on-call engineer.

    Which solution will meet these requirements?
  fr: |
    Pour réduire le coût d'ingestion, une équipe a créé le groupe de journaux Amazon CloudWatch Logs `/app/orders` avec la classe de journaux Infrequent Access (Essentials). Des instances Amazon EC2 envoient les journaux de l'application à ce groupe de journaux. L'équipe a maintenant besoin d'une métrique qui compte les événements de journal contenant `ERROR`, afin qu'une alarme CloudWatch puisse notifier l'ingénieur d'astreinte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the log class of `/app/orders` to Standard, and then create a metric filter on the log group.", fr: "Passer la classe de journaux de `/app/orders` à Standard, puis créer un filtre de métrique sur le groupe de journaux." }
    - id: b
      text: { en: "Send the logs to a new log group of the Standard class, and then create a metric filter on that log group.", fr: "Envoyer les journaux à un nouveau groupe de journaux de classe Standard, puis créer un filtre de métrique sur ce groupe de journaux." }
    - id: c
      text: { en: "Create a subscription filter on `/app/orders` that sends the `ERROR` events to a Lambda function that publishes a metric.", fr: "Créer sur `/app/orders` un filtre d'abonnement qui envoie les événements `ERROR` à une fonction Lambda qui publie une métrique." }
    - id: d
      text: { en: "Start a CloudWatch Logs Live Tail session on `/app/orders` that filters on `ERROR` and add it to a dashboard.", fr: "Démarrer sur `/app/orders` une session CloudWatch Logs Live Tail qui filtre sur `ERROR` et l'ajouter à un tableau de bord." }
answer: { optionId: b }
explanation:
  correct:
    en: "Metric filters are available only for log groups of the Standard class, and the class of a log group cannot be changed after it is created. The team must send the logs to a Standard log group and create the metric filter there; filters only count events ingested after they are created."
    fr: "Les filtres de métrique ne sont disponibles que pour les groupes de journaux de classe Standard, et la classe d'un groupe de journaux ne peut pas être modifiée après sa création. L'équipe doit envoyer les journaux vers un groupe de journaux Standard et y créer le filtre de métrique ; un filtre ne compte que les événements ingérés après sa création."
  options:
    a: { en: "The log class is set at creation and cannot be changed afterward.", fr: "La classe de journaux est fixée à la création et ne peut pas être modifiée ensuite." }
    c: { en: "Subscription filters are also limited to the Standard log class.", fr: "Les filtres d'abonnement sont eux aussi réservés à la classe de journaux Standard." }
    d: { en: "Live Tail is an interactive view available only for Standard log groups; it produces no metric for an alarm.", fr: "Live Tail est une vue interactive disponible uniquement pour les groupes de journaux Standard ; elle ne produit aucune métrique pour une alarme." }
references:
  - title: Log classes
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatch_Logs_Log_Classes.html
  - title: Creating metrics from log events using filters
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/MonitoringLogData.html
