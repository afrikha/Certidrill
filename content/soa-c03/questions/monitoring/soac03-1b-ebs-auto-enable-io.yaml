id: soac03-1b-ebs-auto-enable-io
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EC2 instance uses an EBS volume as a local cache that the application can rebuild at any time from Amazon S3. Last week, Amazon EBS determined that the volume's data was potentially inconsistent. The volume status became impaired, I/O to the volume was disabled, and the application stopped until an operator enabled I/O manually.

    For this volume, availability matters more than data consistency. The company wants I/O to continue automatically if this happens again.

    Which solution will meet these requirements?
  fr: |
    Une instance Amazon EC2 utilise un volume EBS comme cache local que l'application peut reconstruire à tout moment depuis Amazon S3. La semaine dernière, Amazon EBS a déterminé que les données du volume étaient potentiellement incohérentes. L'état du volume est passé à impaired, les E/S vers le volume ont été désactivées, et l'application s'est arrêtée jusqu'à ce qu'un opérateur réactive les E/S manuellement.

    Pour ce volume, la disponibilité importe plus que la cohérence des données. L'entreprise veut que les E/S continuent automatiquement si cela se reproduit.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable the Auto-Enable IO attribute of the volume (autoEnableIO).", fr: "Activer l'attribut Auto-Enable IO du volume (autoEnableIO)." } }
    - { id: b, text: { en: "Change the volume type to io2 so that the I/O performance status check is used instead.", fr: "Faire passer le volume en io2 pour que la vérification de l'état des performances d'E/S soit utilisée à la place." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on StatusCheckFailed_System with the EC2 recover action.", fr: "Créer une alarme CloudWatch sur StatusCheckFailed_System avec l'action EC2 de récupération (recover)." } }
    - { id: d, text: { en: "Create an Amazon Data Lifecycle Manager policy that takes an hourly snapshot of the volume.", fr: "Créer une politique Amazon Data Lifecycle Manager qui prend un instantané du volume toutes les heures." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, when Amazon EBS finds that a volume's data is potentially inconsistent, it disables I/O from attached instances and the volume status becomes impaired until you enable I/O. With the Auto-Enable IO attribute, I/O is enabled automatically, the status check keeps passing, and an event reports the potential inconsistency. This suits a cache that can be rebuilt.
    fr: |
      Par défaut, lorsqu'Amazon EBS constate que les données d'un volume sont potentiellement incohérentes, il désactive les E/S des instances attachées et l'état du volume devient impaired jusqu'à ce que vous réactiviez les E/S. Avec l'attribut Auto-Enable IO, les E/S sont réactivées automatiquement, la vérification d'état continue de réussir et un événement signale l'incohérence potentielle. Cela convient à un cache reconstructible.
  options:
    b: { en: "The I/O performance check is an extra check for some volume types; I/O would still be disabled on a potential inconsistency.", fr: "La vérification des performances d'E/S est une vérification supplémentaire pour certains types de volumes ; les E/S seraient toujours désactivées en cas d'incohérence potentielle." }
    c: { en: "Instance recovery handles host failures; it does not change how EBS handles an inconsistent volume.", fr: "La récupération d'instance traite les pannes d'hôte ; elle ne change pas la façon dont EBS traite un volume incohérent." }
    d: { en: "Snapshots add backups but do not keep I/O enabled when the volume is flagged.", fr: "Les instantanés ajoutent des sauvegardes mais ne maintiennent pas les E/S actives lorsque le volume est signalé." }
references:
  - title: Amazon EBS volume status checks
    url: https://docs.aws.amazon.com/ebs/latest/userguide/monitoring-volume-checks.html
