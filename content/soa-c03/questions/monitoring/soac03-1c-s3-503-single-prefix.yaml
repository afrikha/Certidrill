id: soac03-1c-s3-503-single-prefix
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs an ingestion service on Amazon EC2 instances that writes sensor files to one Amazon S3 bucket. All objects are written under the same key prefix, `incoming/`. Since the fleet grew, the service writes about 6,000 objects per second, and many PutObject calls return HTTP 503 Slow Down errors even after the SDK retries them. The consumers find new files by listing the bucket and can work with any key naming scheme.

    Which solution will reduce the 503 errors?
  fr: |
    Une entreprise de logistique exécute sur des instances Amazon EC2 un service d'ingestion qui écrit des fichiers de capteurs dans un compartiment Amazon S3. Tous les objets sont écrits sous le même préfixe de clé, `incoming/`. Depuis que la flotte s'est agrandie, le service écrit environ 6 000 objets par seconde, et de nombreux appels PutObject renvoient des erreurs HTTP 503 Slow Down, même après les nouvelles tentatives du SDK. Les consommateurs trouvent les nouveaux fichiers en listant le compartiment et peuvent utiliser n'importe quel schéma de nommage des clés.

    Quelle solution réduira les erreurs 503 ?
body:
  options:
    - { id: a, text: { en: "Enable S3 Transfer Acceleration on the bucket and send the PutObject calls to the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment et envoyer les appels PutObject au point de terminaison accéléré." } }
    - { id: b, text: { en: "Turn on S3 Versioning so that each PutObject call writes a new version instead of replacing an object.", fr: "Activer la gestion des versions S3 pour que chaque appel PutObject écrive une nouvelle version au lieu de remplacer un objet." } }
    - { id: c, text: { en: "Spread the writes across several prefixes, for example incoming/<shard>/, so that each prefix receives fewer requests.", fr: "Répartir les écritures sur plusieurs préfixes, par exemple incoming/<shard>/, pour que chaque préfixe reçoive moins de requêtes." } }
    - { id: d, text: { en: "Ask AWS Support to raise the Service Quotas value for PUT requests per second on the bucket.", fr: "Demander au Support AWS d'augmenter la valeur Service Quotas des requêtes PUT par seconde sur le compartiment." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon S3 supports at least 3,500 PUT/COPY/POST/DELETE requests per second per partitioned prefix, and there is no limit on the number of prefixes in a bucket. Writing 6,000 objects per second under one prefix exceeds that rate, so S3 answers with 503 Slow Down. Spreading the keys across several prefixes multiplies the request rate that the bucket can absorb."
    fr: "Amazon S3 prend en charge au moins 3 500 requêtes PUT/COPY/POST/DELETE par seconde et par préfixe partitionné, et le nombre de préfixes d'un compartiment n'est pas limité. Écrire 6 000 objets par seconde sous un seul préfixe dépasse ce débit : S3 répond par 503 Slow Down. Répartir les clés sur plusieurs préfixes multiplie le débit de requêtes que le compartiment peut absorber."
  options:
    a:
      en: "Transfer Acceleration shortens long-distance network paths through edge locations; it does not raise the request rate per prefix, and the instances are already in AWS."
      fr: "Transfer Acceleration raccourcit les trajets réseau longue distance grâce aux emplacements périphériques ; il n'augmente pas le débit de requêtes par préfixe, et les instances sont déjà dans AWS."
    b:
      en: "Versioning keeps previous versions of objects; the same number of PUT requests still hits the single prefix."
      fr: "La gestion des versions conserve les versions précédentes des objets ; le même nombre de requêtes PUT atteint toujours l'unique préfixe."
    d:
      en: "The per-prefix request rate is not an adjustable quota of the bucket; S3 scales by prefix, so the key design must change."
      fr: "Le débit de requêtes par préfixe n'est pas un quota ajustable du compartiment ; S3 évolue par préfixe, c'est donc la conception des clés qui doit changer."
references:
  - title: "Best practices design patterns: optimizing Amazon S3 performance"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/optimizing-performance.html
