id: soac03-1c-ec2-move-into-placement-group
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon EC2 instance that runs a database must join an existing cluster placement group to get lower latency to the application servers. The instance is running, and the database can be offline for a few minutes.

    What should a CloudOps engineer do?
  fr: |
    Une instance Amazon EC2 qui exécute une base de données doit rejoindre un groupe de placement de cluster existant pour obtenir une latence plus faible vers les serveurs d'applications. L'instance est en cours d'exécution, et la base de données peut être hors ligne quelques minutes.

    Que doit faire un ingénieur CloudOps ?
body:
  options:
    - { id: a, text: { en: "Run aws ec2 modify-instance-placement with the placement group name while the instance is running.", fr: "Exécuter aws ec2 modify-instance-placement avec le nom du groupe de placement pendant que l'instance est en cours d'exécution." } }
    - { id: b, text: { en: "Create a network interface in the subnet of the placement group and attach it to the instance.", fr: "Créer une interface réseau dans le sous-réseau du groupe de placement et l'attacher à l'instance." } }
    - { id: c, text: { en: "Stop the instance, run aws ec2 modify-instance-placement with the placement group name, and start the instance.", fr: "Arrêter l'instance, exécuter aws ec2 modify-instance-placement avec le nom du groupe de placement, puis démarrer l'instance." } }
    - { id: d, text: { en: "Create a cluster placement group for the instance and merge it with the existing group.", fr: "Créer un groupe de placement de cluster pour l'instance et le fusionner avec le groupe existant." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An instance must be in the stopped state before you add it to, move it between or remove it from a placement group. After the instance is stopped, modify-instance-placement with --group-name changes its placement, and the next start places it in the cluster placement group."
    fr: "Une instance doit être à l'état arrêté avant qu'on puisse l'ajouter à un groupe de placement, l'en retirer ou la déplacer entre groupes. Une fois l'instance arrêtée, modify-instance-placement avec --group-name change son placement, et le démarrage suivant la place dans le groupe de placement de cluster."
  options:
    a:
      en: "The placement of a running instance cannot be changed; the instance must be stopped first."
      fr: "Le placement d'une instance en cours d'exécution ne peut pas être modifié ; l'instance doit d'abord être arrêtée."
    b:
      en: "Placement groups apply to instances, not to network interfaces or subnets, so a new interface does not change where the instance runs."
      fr: "Les groupes de placement s'appliquent aux instances, pas aux interfaces réseau ni aux sous-réseaux : une nouvelle interface ne change pas l'endroit où s'exécute l'instance."
    d:
      en: "Placement groups cannot be merged."
      fr: "Les groupes de placement ne peuvent pas être fusionnés."
references:
  - title: Change the placement for an EC2 instance
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/change-instance-placement-group.html
