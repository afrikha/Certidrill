id: soac03-1a-cloudtrail-insights
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has an AWS CloudTrail trail that logs read and write management events. Last month, a faulty script called the `TerminateInstances` API hundreds of times in a few minutes before anyone noticed. The operations team wants CloudTrail to flag unusual increases in the rate of write management API calls without defining a threshold for each API.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un journal de suivi (trail) AWS CloudTrail qui journalise les événements de gestion en lecture et en écriture. Le mois dernier, un script défaillant a appelé l'API `TerminateInstances` des centaines de fois en quelques minutes avant que quiconque ne s'en aperçoive. L'équipe des opérations veut que CloudTrail signale les hausses inhabituelles du taux d'appels d'API de gestion en écriture, sans définir de seuil pour chaque API.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on CloudTrail Insights for the API call rate on the trail.", fr: "Activer CloudTrail Insights pour le taux d'appels d'API sur le journal de suivi." }
    - id: b
      text: { en: "Turn on log file integrity validation on the trail.", fr: "Activer la validation de l'intégrité des fichiers journaux sur le journal de suivi." }
    - id: c
      text: { en: "Create a CloudTrail Lake event data store for management events.", fr: "Créer un magasin de données d'événements CloudTrail Lake pour les événements de gestion." }
    - id: d
      text: { en: "Configure the trail to also log data events for all resource types.", fr: "Configurer le journal de suivi pour journaliser aussi les événements de données de tous les types de ressources." }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudTrail Insights learns a baseline of API call and error rates and generates an Insights event when the current rate deviates from it. The API call rate insight analyzes write management events, which the trail already logs, so no threshold has to be defined per API. Insights events are billed in addition to the trail."
    fr: "CloudTrail Insights apprend une base de référence des taux d'appels et d'erreurs d'API, et génère un événement Insights quand le taux actuel s'en écarte. L'analyse du taux d'appels d'API porte sur les événements de gestion en écriture, que le journal de suivi journalise déjà : aucun seuil n'est à définir par API. Les événements Insights sont facturés en plus du journal de suivi."
  options:
    b: { en: "Log file validation proves whether log files were modified or deleted; it does not analyze call rates.", fr: "La validation des fichiers journaux prouve si des fichiers journaux ont été modifiés ou supprimés ; elle n'analyse pas les taux d'appels." }
    c: { en: "An event data store keeps events for SQL queries; it does not flag unusual rates on its own.", fr: "Un magasin de données d'événements conserve les événements pour des requêtes SQL ; il ne signale pas à lui seul les taux inhabituels." }
    d: { en: "`TerminateInstances` is a management event; adding data events increases cost without detecting anything.", fr: "`TerminateInstances` est un événement de gestion : ajouter les événements de données augmente le coût sans rien détecter." }
references:
  - title: Working with CloudTrail Insights
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-insights-events-with-cloudtrail.html
