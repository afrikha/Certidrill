id: soac03-1a-eventbridge-alarm-source
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team wants to start an AWS Systems Manager Automation runbook each time the CloudWatch alarm `db-cpu-high` goes into the ALARM state. The team creates an Amazon EventBridge rule on the default event bus with the runbook as the target and this event pattern:

    ```json
    {
      "source": ["aws.events"],
      "detail-type": ["CloudWatch Alarm State Change"],
      "detail": {
        "alarmName": ["db-cpu-high"],
        "state": { "value": ["ALARM"] }
      }
    }
    ```

    The alarm has gone into the ALARM state several times, but the rule has never matched an event.

    Which solution will fix the problem?
  fr: |
    Une équipe des opérations veut démarrer un runbook AWS Systems Manager Automation chaque fois que l'alarme CloudWatch `db-cpu-high` passe à l'état ALARM. L'équipe crée sur le bus d'événements par défaut une règle Amazon EventBridge avec le runbook comme cible et ce modèle d'événement :

    ```json
    {
      "source": ["aws.events"],
      "detail-type": ["CloudWatch Alarm State Change"],
      "detail": {
        "alarmName": ["db-cpu-high"],
        "state": { "value": ["ALARM"] }
      }
    }
    ```

    L'alarme est passée plusieurs fois à l'état ALARM, mais la règle n'a jamais correspondu à aucun événement.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - id: a
      text: { en: "Add an EventBridge action to the alarm so that the alarm starts publishing its state changes.", fr: "Ajouter une action EventBridge à l'alarme pour qu'elle commence à publier ses changements d'état." }
    - id: b
      text: { en: "Replace `state` with `previousState` in the event pattern.", fr: "Remplacer `state` par `previousState` dans le modèle d'événement." }
    - id: c
      text: { en: "Move the rule to a custom event bus named `aws.cloudwatch`.", fr: "Déplacer la règle vers un bus d'événements personnalisé nommé `aws.cloudwatch`." }
    - id: d
      text: { en: "Change the value of `source` in the event pattern to `aws.cloudwatch`.", fr: "Remplacer la valeur de `source` du modèle d'événement par `aws.cloudwatch`." }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudWatch sends an event to EventBridge for every alarm state change, with the source `aws.cloudwatch` and the detail type `CloudWatch Alarm State Change`. Because the pattern requires the source `aws.events`, no alarm event can match; with the correct source, the rule matches `db-cpu-high` entering ALARM and starts the runbook."
    fr: "CloudWatch envoie un événement à EventBridge à chaque changement d'état d'une alarme, avec la source `aws.cloudwatch` et le type de détail `CloudWatch Alarm State Change`. Comme le modèle exige la source `aws.events`, aucun événement d'alarme ne peut correspondre ; avec la bonne source, la règle correspond à l'entrée de `db-cpu-high` à l'état ALARM et démarre le runbook."
  options:
    a: { en: "Alarms emit state change events to EventBridge automatically; there is no EventBridge alarm action to add.", fr: "Les alarmes émettent automatiquement leurs événements de changement d'état vers EventBridge ; il n'existe aucune action d'alarme EventBridge à ajouter." }
    b: { en: "`previousState` holds the state before the change, so the rule would match alarms that leave ALARM, and the source would still be wrong.", fr: "`previousState` contient l'état avant le changement : la règle correspondrait aux alarmes qui quittent l'état ALARM, et la source resterait fausse." }
    c: { en: "AWS service events, including alarm state changes, are delivered to the default event bus.", fr: "Les événements des services AWS, dont les changements d'état des alarmes, sont livrés au bus d'événements par défaut." }
references:
  - title: Alarm events and EventBridge
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-and-eventbridge.html
