id: soac03-1c-ec2-nitro-type-change
objective: "1.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on a t2.large instance that was launched from an old custom Linux AMI. An engineer stops the instance, changes the instance type to m6i.large and starts it. The instance fails its status checks and is unreachable. After the engineer changes the type back to t2.large, the instance works again.

    Which combination of actions should the engineer take before changing the instance type again? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application sur une instance t2.large lancée à partir d'une ancienne AMI Linux personnalisée. Un ingénieur arrête l'instance, change son type en m6i.large et la démarre. L'instance échoue à ses vérifications de statut et est injoignable. Après que l'ingénieur a remis le type t2.large, l'instance fonctionne de nouveau.

    Quelle combinaison d'actions l'ingénieur doit-il effectuer avant de changer à nouveau le type d'instance ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the ENA driver in the operating system and enable the enaSupport attribute of the instance.", fr: "Installer le pilote ENA dans le système d'exploitation et activer l'attribut enaSupport de l'instance." } }
    - { id: b, text: { en: "Enable EBS optimization on the t2.large instance before the change.", fr: "Activer l'optimisation EBS sur l'instance t2.large avant la modification." } }
    - { id: c, text: { en: "Convert the AMI of the instance to paravirtual (PV) virtualization.", fr: "Convertir l'AMI de l'instance en virtualisation paravirtuelle (PV)." } }
    - { id: d, text: { en: "Install the NVMe driver and change /etc/fstab to mount file systems by UUID instead of device name.", fr: "Installer le pilote NVMe et modifier /etc/fstab pour monter les systèmes de fichiers par UUID au lieu du nom de périphérique." } }
    - { id: e, text: { en: "Attach an Elastic Fabric Adapter (EFA) to the instance.", fr: "Attacher un Elastic Fabric Adapter (EFA) à l'instance." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "m6i is a Nitro-based instance type: it requires the ENA driver for networking, and it presents EBS volumes as NVMe block devices with names such as /dev/nvme0n1. An old AMI without these drivers, or with /etc/fstab entries that use the old device names, cannot boot or reach the network. Installing both drivers, enabling enaSupport and mounting by UUID or label makes the instance compatible before the type change."
    fr: "m6i est un type d'instance basé sur Nitro : il exige le pilote ENA pour le réseau et présente les volumes EBS comme des périphériques blocs NVMe nommés par exemple /dev/nvme0n1. Une ancienne AMI sans ces pilotes, ou avec des entrées /etc/fstab qui utilisent les anciens noms de périphériques, ne peut ni démarrer ni accéder au réseau. Installer les deux pilotes, activer enaSupport et monter par UUID ou étiquette rend l'instance compatible avant le changement de type."
  options:
    b:
      en: "EBS optimization does not install drivers, and current generation types such as m6i are EBS-optimized by default."
      fr: "L'optimisation EBS n'installe aucun pilote, et les types de génération actuelle comme m6i sont optimisés pour EBS par défaut."
    c:
      en: "Nitro-based types support only HVM; an instance from a PV AMI cannot change to an HVM-only type."
      fr: "Les types basés sur Nitro ne prennent en charge que HVM ; une instance issue d'une AMI PV ne peut pas passer à un type exclusivement HVM."
    e:
      en: "An EFA adds low-latency networking for HPC and ML workloads on supported types; it does not solve missing ENA or NVMe drivers."
      fr: "Un EFA ajoute un réseau à faible latence pour les charges HPC et ML sur les types pris en charge ; il ne règle pas l'absence des pilotes ENA ou NVMe."
references:
  - title: Compatibility for changing the instance type
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/resize-limitations.html
  - title: Enable enhanced networking with ENA on your EC2 instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/enhanced-networking-ena.html
