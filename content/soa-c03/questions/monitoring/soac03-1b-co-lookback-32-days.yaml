id: soac03-1b-co-lookback-32-days
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Compute Optimizer with default settings. A fleet of Amazon EC2 instances runs a payroll workload that is mostly idle but uses a lot of CPU for two days at the end of each month. Compute Optimizer recommends smaller instance types for the fleet, and the company is concerned that these recommendations ignore the month-end peak.

    The company wants recommendations that take the monthly pattern into account, in the MOST cost-effective way.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Compute Optimizer avec les paramètres par défaut. Une flotte d'instances Amazon EC2 exécute une charge de travail de paie qui est presque toujours inactive, mais qui utilise beaucoup de processeur pendant deux jours à la fin de chaque mois. Compute Optimizer recommande des types d'instances plus petits pour la flotte, et l'entreprise craint que ces recommandations ignorent le pic de fin de mois.

    L'entreprise veut des recommandations qui tiennent compte du cycle mensuel, de la façon la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Activate the enhanced infrastructure metrics preference so that Compute Optimizer uses a 93-day lookback period.", fr: "Activer la préférence enhanced infrastructure metrics pour que Compute Optimizer utilise une période d'analyse de 93 jours." } }
    - { id: b, text: { en: "Set the lookback period in the rightsizing recommendation preferences to 32 days.", fr: "Définir la période d'analyse (lookback period) des préférences de recommandations de dimensionnement sur 32 jours." } }
    - { id: c, text: { en: "Enable detailed monitoring on the instances so that Compute Optimizer receives 1-minute CPU data points.", fr: "Activer la surveillance détaillée sur les instances pour que Compute Optimizer reçoive des points de données de processeur à 1 minute." } }
    - { id: d, text: { en: "Set the CPU headroom in the rightsizing recommendation preferences to 0 %.", fr: "Définir la marge (headroom) de processeur des préférences de recommandations de dimensionnement sur 0 %." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The default lookback period of 14 days can miss a peak that happens once a month. Rightsizing recommendation preferences offer lookback periods of 14, 32, and 93 days; the 14-day and 32-day options are free, and 32 days captures monthly workload patterns. The 93-day option also works but requires the paid enhanced infrastructure metrics preference.
    fr: |
      La période d'analyse par défaut de 14 jours peut manquer un pic qui survient une fois par mois. Les préférences de recommandations de dimensionnement proposent des périodes de 14, 32 et 93 jours ; les options de 14 et 32 jours sont gratuites, et 32 jours capture les cycles mensuels. L'option de 93 jours fonctionne aussi, mais exige la préférence payante enhanced infrastructure metrics.
  options:
    a: { en: "A 93-day lookback captures the peak, but enhanced infrastructure metrics is a paid feature, so it is not the most cost-effective choice.", fr: "Une analyse sur 93 jours capture le pic, mais enhanced infrastructure metrics est une fonctionnalité payante : ce n'est pas le choix le plus rentable." }
    c: { en: "Finer data points do not extend the 14-day window, which can still miss the month-end peak, and detailed monitoring adds charges.", fr: "Des points de données plus fins n'allongent pas la fenêtre de 14 jours, qui peut toujours manquer le pic de fin de mois, et la surveillance détaillée ajoute des frais." }
    d: { en: "Removing headroom makes recommendations even smaller and does not add the month-end data.", fr: "Supprimer la marge rend les recommandations encore plus petites et n'ajoute pas les données de fin de mois." }
references:
  - title: Rightsizing recommendation preferences
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/rightsizing-preferences.html
  - title: Enhanced infrastructure metrics
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/enhanced-infrastructure-metrics.html
