id: soac03-1a-ec2-detailed-monitoring
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances that use basic monitoring. A CloudWatch alarm on `CPUUtilization` reacts too slowly to load spikes because a new data point arrives only every 5 minutes. The operations team needs `CPUUtilization` data points every minute and must not install any software on the instances.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 qui utilisent la surveillance de base. Une alarme CloudWatch sur `CPUUtilization` réagit trop lentement aux pics de charge, car un nouveau point de données n'arrive que toutes les 5 minutes. L'équipe des opérations a besoin de points de données `CPUUtilization` toutes les minutes et ne doit installer aucun logiciel sur les instances.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the period of the alarm to 60 seconds.", fr: "Passer la période de l'alarme à 60 secondes." }
    - id: b
      text: { en: "Turn on detailed monitoring for the instances.", fr: "Activer la surveillance détaillée pour les instances." }
    - id: c
      text: { en: "Install the CloudWatch agent with a 60-second interval.", fr: "Installer l'agent CloudWatch avec un intervalle de 60 secondes." }
    - id: d
      text: { en: "Publish CPU values every minute with `PutMetricData`.", fr: "Publier les valeurs du processeur chaque minute avec `PutMetricData`." }
answer: { optionId: b }
explanation:
  correct:
    en: "With basic monitoring, Amazon EC2 publishes most default metrics, including `CPUUtilization`, in 5-minute periods. Detailed monitoring, a paid feature that can be turned on for running instances, publishes them in 1-minute periods without any agent."
    fr: "Avec la surveillance de base, Amazon EC2 publie la plupart des métriques par défaut, dont `CPUUtilization`, par périodes de 5 minutes. La surveillance détaillée, une fonctionnalité payante qui peut être activée sur des instances en cours d'exécution, les publie par périodes de 1 minute, sans aucun agent."
  options:
    a: { en: "A shorter alarm period does not create data points that the metric does not have; the metric still arrives every 5 minutes.", fr: "Une période d'alarme plus courte ne crée pas les points de données absents de la métrique : la métrique arrive toujours toutes les 5 minutes." }
    c: { en: "The agent is software that must be installed on each instance, which the requirements forbid.", fr: "L'agent est un logiciel à installer sur chaque instance, ce que les exigences interdisent." }
    d: { en: "Publishing custom metrics requires a script or code on the instances, which is software to install.", fr: "Publier des métriques personnalisées exige un script ou du code sur les instances, donc un logiciel à installer." }
references:
  - title: Manage detailed monitoring for your EC2 instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/manage-detailed-monitoring.html
