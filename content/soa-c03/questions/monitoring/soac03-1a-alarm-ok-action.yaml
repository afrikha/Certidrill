id: soac03-1a-alarm-ok-action
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CloudWatch alarm on the latency of an API publishes to an SNS topic when it goes into the ALARM state. The on-call engineers also want an email from the same topic when the alarm returns to the OK state, so that they know the incident is over. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une alarme CloudWatch sur la latence d'une API publie dans une rubrique SNS quand elle passe à l'état ALARM. Les ingénieurs d'astreinte veulent aussi un e-mail de la même rubrique quand l'alarme revient à l'état OK, pour savoir que l'incident est terminé. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the SNS topic as an OK action of the existing alarm.", fr: "Ajouter la rubrique SNS comme action OK de l'alarme existante." }
    - id: b
      text: { en: "Create a second alarm with the opposite comparison operator that notifies the topic.", fr: "Créer une seconde alarme avec l'opérateur de comparaison inverse qui notifie la rubrique." }
    - id: c
      text: { en: "Add the SNS topic as an INSUFFICIENT_DATA action of the existing alarm.", fr: "Ajouter la rubrique SNS comme action INSUFFICIENT_DATA de l'alarme existante." }
    - id: d
      text: { en: "Change the treatment of missing data of the alarm to `notBreaching`.", fr: "Passer le traitement des données manquantes de l'alarme à `notBreaching`." }
answer: { optionId: a }
explanation:
  correct:
    en: "Alarm actions can be set for each state transition: into OK, ALARM, or INSUFFICIENT_DATA. Adding the topic to the OK actions (`--ok-actions` in `put-metric-alarm`) sends a notification when the alarm returns to OK, with no additional alarm to maintain."
    fr: "Des actions d'alarme peuvent être définies pour chaque transition d'état : vers OK, ALARM ou INSUFFICIENT_DATA. Ajouter la rubrique aux actions OK (`--ok-actions` dans `put-metric-alarm`) envoie une notification quand l'alarme revient à OK, sans alarme supplémentaire à maintenir."
  options:
    b: { en: "A second alarm works but doubles the alarms to maintain, and its state can differ from the first one around the threshold.", fr: "Une seconde alarme fonctionne, mais double le nombre d'alarmes à maintenir, et son état peut différer de celui de la première autour du seuil." }
    c: { en: "INSUFFICIENT_DATA actions run when data is missing, not when the alarm returns to OK.", fr: "Les actions INSUFFICIENT_DATA s'exécutent quand des données manquent, et non quand l'alarme revient à OK." }
    d: { en: "Missing data treatment changes how gaps are evaluated; it adds no notification.", fr: "Le traitement des données manquantes change la façon d'évaluer les lacunes ; il n'ajoute aucune notification." }
references:
  - title: Alarm actions
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-actions.html
