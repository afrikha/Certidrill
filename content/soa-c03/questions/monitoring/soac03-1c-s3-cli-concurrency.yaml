id: soac03-1c-s3-cli-concurrency
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every night, a company copies about 2 million log files of 1 MB to 50 MB from an Amazon EC2 instance to an Amazon S3 bucket in the same AWS Region by using `aws s3 sync`. The instance reaches Amazon S3 through a gateway VPC endpoint. During the copy, the instance uses less than 20% of its network bandwidth and its CPU is mostly idle. The AWS CLI uses its default S3 settings.

    Which change will MOST increase the transfer throughput?
  fr: |
    Chaque nuit, une entreprise copie environ 2 millions de fichiers journaux de 1 Mo à 50 Mo d'une instance Amazon EC2 vers un compartiment Amazon S3 de la même Région AWS avec `aws s3 sync`. L'instance accède à Amazon S3 par un point de terminaison de VPC de type passerelle. Pendant la copie, l'instance utilise moins de 20 % de sa bande passante réseau et son processeur est presque inactif. L'AWS CLI utilise ses paramètres S3 par défaut.

    Quelle modification augmentera le PLUS le débit du transfert ?
body:
  options:
    - { id: a, text: { en: "Run aws configure set default.s3.use_accelerate_endpoint true after enabling S3 Transfer Acceleration on the bucket.", fr: "Exécuter aws configure set default.s3.use_accelerate_endpoint true après avoir activé S3 Transfer Acceleration sur le compartiment." } }
    - { id: b, text: { en: "Run aws configure set default.s3.max_concurrent_requests 64 so that the CLI runs more transfers in parallel.", fr: "Exécuter aws configure set default.s3.max_concurrent_requests 64 pour que la CLI exécute davantage de transferts en parallèle." } }
    - { id: c, text: { en: "Run aws configure set default.s3.max_bandwidth 10GB/s to remove the bandwidth limit of the CLI.", fr: "Exécuter aws configure set default.s3.max_bandwidth 10GB/s pour supprimer la limite de bande passante de la CLI." } }
    - { id: d, text: { en: "Run aws configure set default.s3.multipart_threshold 1GB so that fewer files use multipart upload.", fr: "Exécuter aws configure set default.s3.multipart_threshold 1GB pour que moins de fichiers utilisent le chargement partitionné." } }
answer: { optionId: b }
explanation:
  correct:
    en: "By default, the aws s3 commands run at most 10 transfer requests at the same time. With many small and medium files, idle CPU and unused bandwidth, raising max_concurrent_requests lets the CLI open more parallel connections to S3, which is how S3 throughput scales."
    fr: "Par défaut, les commandes aws s3 exécutent au plus 10 requêtes de transfert simultanées. Avec beaucoup de fichiers petits et moyens, un processeur inactif et une bande passante inutilisée, augmenter max_concurrent_requests permet à la CLI d'ouvrir davantage de connexions parallèles vers S3, ce qui est la manière dont le débit S3 évolue."
  options:
    a:
      en: "Transfer Acceleration helps clients that are far from the bucket's Region; the instance is in the same Region, so it adds cost without removing the bottleneck."
      fr: "Transfer Acceleration aide les clients éloignés de la Région du compartiment ; l'instance est dans la même Région : cela ajoute un coût sans supprimer le goulot d'étranglement."
    c:
      en: "max_bandwidth has no default value, so no limit is in place; setting it only caps the bandwidth."
      fr: "max_bandwidth n'a pas de valeur par défaut, aucune limite n'est donc en place ; la définir ne fait que plafonner la bande passante."
    d:
      en: "A higher threshold uploads the larger files in a single request instead of parallel parts, which lowers throughput."
      fr: "Un seuil plus élevé charge les gros fichiers en une seule requête au lieu de parties parallèles, ce qui réduit le débit."
references:
  - title: AWS CLI S3 Configuration
    url: https://docs.aws.amazon.com/cli/latest/topic/s3-config.html
  - title: Performance guidelines for Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/optimizing-performance-guidelines.html
