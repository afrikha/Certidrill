id: soac03-1b-eb-api-destination
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses a third-party incident management service that exposes a public HTTPS API protected by OAuth client credentials. The company wants every AWS Health event that reaches its default event bus to create a ticket in that service. The service accepts at most 10 requests each second.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise un service tiers de gestion des incidents qui expose une API HTTPS publique protégée par des identifiants client OAuth. L'entreprise veut que chaque événement AWS Health qui arrive sur son bus d'événements par défaut crée un ticket dans ce service. Le service accepte au plus 10 requêtes par seconde.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon SQS queue as the rule target, and run a polling script on an Amazon EC2 instance that calls the API.", fr: "Créer une file d'attente Amazon SQS comme cible de la règle, et exécuter sur une instance Amazon EC2 un script d'interrogation qui appelle l'API." } }
    - { id: b, text: { en: "Create an Amazon SNS topic as the rule target with an HTTPS subscription to the API endpoint.", fr: "Créer une rubrique Amazon SNS comme cible de la règle, avec un abonnement HTTPS vers le point de terminaison de l'API." } }
    - { id: c, text: { en: "Create an EventBridge connection with OAuth and an API destination limited to 10 invocations per second as the target.", fr: "Créer comme cible une connexion EventBridge avec OAuth et une destination d'API limitée à 10 invocations par seconde." } }
    - { id: d, text: { en: "Create an AWS Lambda function that gets an OAuth token and calls the API, and set the function as the rule target.", fr: "Créer une fonction AWS Lambda qui obtient un jeton OAuth et appelle l'API, et définir la fonction comme cible de la règle." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      API destinations are HTTPS endpoints that a rule can invoke like any other target. The connection defines the authorization method and credentials, and EventBridge stores the secret in AWS Secrets Manager for you. The invocation rate per second limits the calls to what the service accepts, and EventBridge retries failed requests.
    fr: |
      Les destinations d'API sont des points de terminaison HTTPS qu'une règle peut invoquer comme n'importe quelle autre cible. La connexion définit la méthode d'autorisation et les identifiants, et EventBridge stocke le secret dans AWS Secrets Manager pour vous. Le taux d'invocation par seconde limite les appels à ce que le service accepte, et EventBridge réessaie les requêtes en échec.
  options:
    a: { en: "A polling script on an instance is custom code and infrastructure to run and patch.", fr: "Un script d'interrogation sur une instance représente du code et une infrastructure personnalisés à exploiter et à corriger." }
    b: { en: "An SNS HTTPS subscription does not obtain OAuth tokens and does not limit the rate of calls to 10 per second.", fr: "Un abonnement HTTPS SNS n'obtient pas de jetons OAuth et ne limite pas le taux d'appels à 10 par seconde." }
    d: { en: "The function works, but its token handling, error handling, and rate limiting are code that the API destination already provides.", fr: "La fonction fonctionne, mais sa gestion des jetons, des erreurs et du débit représente du code que la destination d'API fournit déjà." }
references:
  - title: API destinations as targets in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
