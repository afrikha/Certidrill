id: soac03-1a-eventbridge-input-transformer
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EventBridge rule matches EC2 Instance State-change Notification events for production instances and sends them to an SNS topic that has email subscribers. The recipients receive the full JSON event and ask for a short readable message instead, such as `Instance i-0abc12345def67890 is now stopped`.

    Which solution will meet these requirements?
  fr: |
    Une règle Amazon EventBridge correspond aux événements EC2 Instance State-change Notification des instances de production et les envoie à une rubrique SNS qui a des abonnés e-mail. Les destinataires reçoivent l'événement JSON complet et demandent plutôt un message court et lisible, tel que `Instance i-0abc12345def67890 is now stopped`.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure an input transformer on the target that maps the instance ID and state into an input template.", fr: "Configurer sur la cible un transformateur d'entrée qui place l'ID d'instance et l'état dans un modèle d'entrée." }
    - id: b
      text: { en: "Add a subscription filter policy to each email subscription that keeps only the `detail.state` field.", fr: "Ajouter à chaque abonnement e-mail une politique de filtre d'abonnement qui ne conserve que le champ `detail.state`." }
    - id: c
      text: { en: "Turn on raw message delivery for the email subscriptions of the topic so that only the event detail is sent.", fr: "Activer la livraison des messages bruts pour les abonnements e-mail de la rubrique afin de n'envoyer que le détail de l'événement." }
    - id: d
      text: { en: "Set the input of the target to the part of the matched event selected by `$.detail`.", fr: "Définir l'entrée de la cible sur la partie de l'événement correspondant sélectionnée par `$.detail`." }
answer: { optionId: a }
explanation:
  correct:
    en: "An input transformer changes the event before EventBridge delivers it to the target. The input path maps variables to JSON paths, such as `$.detail.instance-id` and `$.detail.state`, and the input template builds the text that SNS publishes, so subscribers receive the short message."
    fr: "Un transformateur d'entrée modifie l'événement avant qu'EventBridge ne le livre à la cible. Le chemin d'entrée associe des variables à des chemins JSON, comme `$.detail.instance-id` et `$.detail.state`, et le modèle d'entrée construit le texte que SNS publie : les abonnés reçoivent le message court."
  options:
    b: { en: "Filter policies decide whether a subscription receives a message; they do not change the message content.", fr: "Les politiques de filtre déterminent si un abonnement reçoit un message ; elles ne modifient pas le contenu du message." }
    c: { en: "Raw message delivery only removes the SNS metadata envelope for supported endpoint types; it does not reformat the event, and email endpoints do not use it.", fr: "La livraison des messages bruts retire seulement l'enveloppe de métadonnées SNS pour les types de points de terminaison pris en charge ; elle ne reformate pas l'événement, et les points de terminaison e-mail ne l'utilisent pas." }
    d: { en: "`InputPath` passes only part of the event, which is still JSON, and cannot add text around the values.", fr: "`InputPath` transmet seulement une partie de l'événement, qui reste du JSON, et ne peut pas ajouter de texte autour des valeurs." }
references:
  - title: Amazon EventBridge input transformation
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-transform-target-input.html
