id: soac03-1b-procstat-process-cpu
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs several background services on a fleet of Amazon EC2 Linux instances. CPUUtilization is often above 90 %, and the operations team needs to know which of the services uses the most CPU and memory on each instance before it resizes the fleet. The CloudWatch agent is already installed on the instances.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute plusieurs services d'arrière-plan sur une flotte d'instances Amazon EC2 Linux. CPUUtilization dépasse souvent 90 %, et l'équipe d'exploitation doit savoir lequel des services utilise le plus de processeur et de mémoire sur chaque instance avant de redimensionner la flotte. L'agent CloudWatch est déjà installé sur les instances.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure the procstat plugin of the CloudWatch agent to collect cpu_usage and memory_rss for each service process.", fr: "Configurer le plug-in procstat de l'agent CloudWatch pour collecter cpu_usage et memory_rss pour le processus de chaque service." } }
    - { id: b, text: { en: "Enable detailed monitoring on the instances so that the CPUUtilization metric is published every minute.", fr: "Activer la surveillance détaillée sur les instances pour que la métrique CPUUtilization soit publiée chaque minute." } }
    - { id: c, text: { en: "Enable VPC Flow Logs on the subnets of the fleet and find which service sends the most traffic.", fr: "Activer les journaux de flux VPC sur les sous-réseaux de la flotte et rechercher le service qui envoie le plus de trafic." } }
    - { id: d, text: { en: "Opt in to AWS Compute Optimizer and review the finding reasons that it reports for each instance.", fr: "S'inscrire à AWS Compute Optimizer et examiner les raisons des constats (finding reasons) qu'il indique pour chaque instance." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The procstat plugin of the CloudWatch agent collects metrics from individual processes, selected by executable name (exe), command-line pattern (pattern), or PID file (pid_file). Metrics such as procstat_cpu_usage and procstat_memory_rss show the CPU and memory that each service uses.
    fr: |
      Le plug-in procstat de l'agent CloudWatch collecte des métriques de processus individuels, sélectionnés par nom d'exécutable (exe), motif de ligne de commande (pattern) ou fichier PID (pid_file). Des métriques comme procstat_cpu_usage et procstat_memory_rss montrent le processeur et la mémoire utilisés par chaque service.
  options:
    b: { en: "Detailed monitoring increases the frequency of instance-level metrics but does not split usage by process.", fr: "La surveillance détaillée augmente la fréquence des métriques au niveau de l'instance, mais ne répartit pas l'utilisation par processus." }
    c: { en: "Flow logs show network traffic between IP addresses, not CPU or memory use by process.", fr: "Les journaux de flux montrent le trafic réseau entre adresses IP, pas l'utilisation du processeur ou de la mémoire par processus." }
    d: { en: "Compute Optimizer recommends instance types for the whole instance; it does not show which process uses the resources.", fr: "Compute Optimizer recommande des types d'instances pour l'instance entière ; il ne montre pas quel processus utilise les ressources." }
references:
  - title: Collect process metrics with the procstat plugin
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-procstat-process-metrics.html
