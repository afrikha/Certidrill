id: soac03-1a-log-anomaly-detector
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application on Amazon ECS writes its logs to an Amazon CloudWatch Logs log group of the Standard class. Most log lines use the levels INFO, WARN, and ERROR. After an outage, the operations team wants CloudWatch to surface log lines with patterns that were never seen before and large changes in how often known patterns occur. The team does not want to write or maintain filter patterns or thresholds.

    Which solution will meet these requirements?
  fr: |
    Une application sur Amazon ECS écrit ses journaux dans un groupe de journaux Amazon CloudWatch Logs de classe Standard. La plupart des lignes de journal utilisent les niveaux INFO, WARN et ERROR. Après une panne, l'équipe des opérations veut que CloudWatch fasse ressortir les lignes de journal dont le modèle n'a jamais été vu et les fortes variations de fréquence des modèles connus. L'équipe ne veut ni écrire ni maintenir de modèles de filtre ou de seuils.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a metric filter for each known pattern and an anomaly detection alarm on each metric.", fr: "Créer un filtre de métrique pour chaque modèle connu et une alarme de détection d'anomalies sur chaque métrique." }
    - id: b
      text: { en: "Turn on CloudTrail Insights on the account trail to detect unusual error rates.", fr: "Activer CloudTrail Insights sur le journal de suivi du compte pour détecter les taux d'erreurs inhabituels." }
    - id: c
      text: { en: "Create a Contributor Insights rule that lists the top log lines by number of occurrences.", fr: "Créer une règle Contributor Insights qui liste les lignes de journal les plus fréquentes." }
    - id: d
      text: { en: "Create a log anomaly detector for the log group and review the anomalies that it reports.", fr: "Créer un détecteur d'anomalies de journaux pour le groupe de journaux et examiner les anomalies qu'il signale." }
answer: { optionId: d }
explanation:
  correct:
    en: "A log anomaly detector trains on the last two weeks of the log group, groups log lines into patterns, and then flags new patterns, large changes in pattern frequency and unusual token values. It needs no filter pattern or threshold, works best on application logs with level keywords, and has no charge of its own."
    fr: "Un détecteur d'anomalies de journaux s'entraîne sur les deux dernières semaines du groupe de journaux, regroupe les lignes en modèles, puis signale les nouveaux modèles, les fortes variations de fréquence et les valeurs de jetons inhabituelles. Il ne nécessite ni modèle de filtre ni seuil, convient particulièrement aux journaux d'application comportant des mots clés de niveau et n'est pas facturé en tant que tel."
  options:
    a: { en: "This requires writing a filter pattern for every known pattern and cannot surface patterns that were never seen.", fr: "Cela exige d'écrire un modèle de filtre pour chaque modèle connu et ne peut pas faire ressortir des modèles jamais vus." }
    b: { en: "CloudTrail Insights analyzes AWS API call and error rates, not application log content.", fr: "CloudTrail Insights analyse les taux d'appels et d'erreurs des API AWS, et non le contenu des journaux d'application." }
    c: { en: "A Contributor Insights rule must be defined by the team and ranks contributors; it does not detect new patterns.", fr: "Une règle Contributor Insights doit être définie par l'équipe et classe des contributeurs ; elle ne détecte pas de nouveaux modèles." }
references:
  - title: Log anomaly detection
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/LogsAnomalyDetection.html
