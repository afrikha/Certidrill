id: soac03-1a-agent-ssm-parameter-prefix
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An administrator stores a CloudWatch agent configuration in AWS Systems Manager Parameter Store as a parameter named `cwagent-config-prod`. The instance profile of the Amazon EC2 instances has only the `CloudWatchAgentServerPolicy` AWS managed policy attached. On an instance, the administrator runs this command:

    ```bash
    sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c ssm:cwagent-config-prod
    ```

    The command fails with an `AccessDeniedException` for `ssm:GetParameter`. The company does not want to add any permission to the instance profile.

    Which solution will meet these requirements?
  fr: |
    Un administrateur stocke une configuration de l'agent CloudWatch dans AWS Systems Manager Parameter Store, sous la forme d'un paramètre nommé `cwagent-config-prod`. Le profil d'instance des instances Amazon EC2 n'a que la politique gérée par AWS `CloudWatchAgentServerPolicy`. Sur une instance, l'administrateur exécute cette commande :

    ```bash
    sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c ssm:cwagent-config-prod
    ```

    La commande échoue avec une erreur `AccessDeniedException` pour `ssm:GetParameter`. L'entreprise ne veut ajouter aucune autorisation au profil d'instance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the configuration as a SecureString parameter so that the agent decrypts it with its own permissions.", fr: "Stocker la configuration dans un paramètre SecureString pour que l'agent la déchiffre avec ses propres autorisations." }
    - id: b
      text: { en: "Run the command with `-m onPremise` so that the agent reads the parameter with the credentials of the local profile.", fr: "Exécuter la commande avec `-m onPremise` pour que l'agent lise le paramètre avec les informations d'identification du profil local." }
    - id: c
      text: { en: "Save the configuration in a parameter whose name starts with `AmazonCloudWatch-` and pass that name to the command.", fr: "Enregistrer la configuration dans un paramètre dont le nom commence par `AmazonCloudWatch-` et passer ce nom à la commande." }
    - id: d
      text: { en: "Move the parameter to the advanced tier so that the instances can read it through the Systems Manager endpoint.", fr: "Passer le paramètre au niveau avancé (advanced) pour que les instances puissent le lire via le point de terminaison Systems Manager." }
answer: { optionId: c }
explanation:
  correct:
    en: "`CloudWatchAgentServerPolicy` grants `ssm:GetParameter` only on parameters that match `arn:aws:ssm:*:*:parameter/AmazonCloudWatch-*`. A parameter such as `AmazonCloudWatch-prod` can therefore be read with the existing instance profile, and the `-c ssm:` option of `fetch-config` loads it and starts the agent."
    fr: "`CloudWatchAgentServerPolicy` n'accorde `ssm:GetParameter` que sur les paramètres qui correspondent à `arn:aws:ssm:*:*:parameter/AmazonCloudWatch-*`. Un paramètre tel que `AmazonCloudWatch-prod` peut donc être lu avec le profil d'instance existant, et l'option `-c ssm:` de `fetch-config` le charge et démarre l'agent."
  options:
    a: { en: "A SecureString parameter still requires `ssm:GetParameter` on its name, plus `kms:Decrypt`; the name is still outside the policy.", fr: "Un paramètre SecureString exige toujours `ssm:GetParameter` sur son nom, en plus de `kms:Decrypt` ; le nom reste en dehors de la politique." }
    b: { en: "On an EC2 instance the mode must be `ec2`; the on-premises mode does not change the permissions needed to read the parameter.", fr: "Sur une instance EC2, le mode doit être `ec2` ; le mode sur site ne change pas les autorisations nécessaires pour lire le paramètre." }
    d: { en: "The parameter tier changes size and policy limits, not who is allowed to call `ssm:GetParameter`.", fr: "Le niveau du paramètre change les limites de taille et de politiques, et non qui est autorisé à appeler `ssm:GetParameter`." }
references:
  - title: CloudWatchAgentServerPolicy
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/CloudWatchAgentServerPolicy.html
  - title: Starting the CloudWatch agent
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/start-CloudWatch-Agent-on-premise-SSM-onprem.html
