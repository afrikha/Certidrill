id: soac03-1b-alarm-recover-system
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a legacy application on a single Amazon EC2 instance that uses Amazon EBS volumes only. Twice in the last month, the instance became unreachable because of a problem with the underlying host, and an administrator had to intervene manually.

    The company wants the instance to return to service automatically after such a host problem, with the same instance ID, private IP address, and Elastic IP address.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application héritée sur une seule instance Amazon EC2 qui utilise uniquement des volumes Amazon EBS. Deux fois le mois dernier, l'instance est devenue injoignable à cause d'un problème de l'hôte sous-jacent, et un administrateur a dû intervenir manuellement.

    L'entreprise veut que l'instance soit automatiquement remise en service après un tel problème d'hôte, avec le même ID d'instance, la même adresse IP privée et la même adresse IP Elastic.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch alarm on the StatusCheckFailed_Instance metric with the EC2 reboot action.", fr: "Créer une alarme CloudWatch sur la métrique StatusCheckFailed_Instance avec l'action EC2 de redémarrage (reboot)." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the StatusCheckFailed_System metric with the EC2 recover action.", fr: "Créer une alarme CloudWatch sur la métrique StatusCheckFailed_System avec l'action EC2 de récupération (recover)." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the CPUUtilization metric with the EC2 stop action, then start the instance from an EventBridge rule.", fr: "Créer une alarme CloudWatch sur la métrique CPUUtilization avec l'action EC2 d'arrêt (stop), puis démarrer l'instance depuis une règle EventBridge." } }
    - { id: d, text: { en: "Place the instance in an Auto Scaling group with a minimum, maximum, and desired capacity of 1.", fr: "Placer l'instance dans un groupe Auto Scaling avec une capacité minimale, maximale et souhaitée de 1." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A failed system status check means a problem with the AWS hardware or software that hosts the instance. The recover action can be used only with StatusCheckFailed_System, and it moves the instance to new hardware. The recovered instance keeps its instance ID, private IP addresses, Elastic IP addresses, and instance metadata.
    fr: |
      Un échec de la vérification de l'état du système signale un problème du matériel ou du logiciel AWS qui héberge l'instance. L'action de récupération (recover) ne peut être utilisée qu'avec StatusCheckFailed_System, et elle déplace l'instance vers un nouveau matériel. L'instance récupérée conserve son ID d'instance, ses adresses IP privées, ses adresses IP Elastic et ses métadonnées d'instance.
  options:
    a: { en: "The instance status check reports problems inside the instance, such as an operating system issue. A reboot keeps the instance on the same impaired host.", fr: "La vérification de l'état de l'instance signale des problèmes internes à l'instance, comme un problème de système d'exploitation. Un redémarrage laisse l'instance sur le même hôte défaillant." }
    c: { en: "CPU utilization does not detect a host failure, and the extra EventBridge rule adds work without guaranteeing recovery.", fr: "L'utilisation du processeur ne détecte pas une panne d'hôte, et la règle EventBridge supplémentaire ajoute du travail sans garantir la récupération." }
    d: { en: "An Auto Scaling group replaces an unhealthy instance with a new one, which has a new instance ID and a new private IP address.", fr: "Un groupe Auto Scaling remplace une instance défaillante par une nouvelle instance, qui a un nouvel ID d'instance et une nouvelle adresse IP privée." }
references:
  - title: Create alarms that stop, terminate, reboot, or recover an instance
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/UsingAlarmActions.html
