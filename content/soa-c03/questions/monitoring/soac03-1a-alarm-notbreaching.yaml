id: soac03-1a-alarm-notbreaching
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment service publishes a custom metric named `FailedPayments` only when a payment fails, with the number of failures as the value. A CloudWatch alarm goes into the ALARM state when the Sum is 5 or more in a 5-minute period. The alarm uses the default treatment of missing data and shows INSUFFICIENT_DATA most of the day, which confuses the on-call team. The team wants the alarm to show OK when no failure is reported, and ALARM when failures reach the threshold.

    How should the team configure the treatment of missing data?
  fr: |
    Un service de paiement publie une métrique personnalisée nommée `FailedPayments` uniquement quand un paiement échoue, avec le nombre d'échecs comme valeur. Une alarme CloudWatch passe à l'état ALARM quand la somme atteint 5 ou plus sur une période de 5 minutes. L'alarme utilise le traitement par défaut des données manquantes et affiche INSUFFICIENT_DATA la plupart de la journée, ce qui trouble l'équipe d'astreinte. L'équipe veut que l'alarme affiche OK quand aucun échec n'est signalé, et ALARM quand les échecs atteignent le seuil.

    Comment l'équipe doit-elle configurer le traitement des données manquantes ?
body:
  options:
    - id: a
      text: { en: "Treat missing data as `breaching`.", fr: "Traiter les données manquantes comme `breaching`." }
    - id: b
      text: { en: "Treat missing data as `notBreaching`.", fr: "Traiter les données manquantes comme `notBreaching`." }
    - id: c
      text: { en: "Treat missing data as `ignore`.", fr: "Traiter les données manquantes comme `ignore`." }
    - id: d
      text: { en: "Treat missing data as `missing`.", fr: "Traiter les données manquantes comme `missing`." }
answer: { optionId: b }
explanation:
  correct:
    en: "`notBreaching` treats missing data points as good values within the threshold, so the alarm moves to OK when no failure is published. AWS recommends it for metrics that report only when something goes wrong; real data points that reach 5 still put the alarm into ALARM."
    fr: "`notBreaching` traite les points de données manquants comme de bonnes valeurs dans le seuil : l'alarme passe à OK quand aucun échec n'est publié. AWS le recommande pour les métriques qui ne sont publiées qu'en cas de problème ; des points de données réels qui atteignent 5 font toujours passer l'alarme à ALARM."
  options:
    a: { en: "`breaching` treats silence as failure, so the alarm would be in ALARM whenever payments succeed.", fr: "`breaching` traite l'absence de données comme un dépassement : l'alarme serait à ALARM dès que les paiements réussissent." }
    c: { en: "`ignore` keeps the current state, so the alarm could stay in ALARM or INSUFFICIENT_DATA long after failures stop.", fr: "`ignore` conserve l'état actuel : l'alarme pourrait rester à ALARM ou INSUFFICIENT_DATA longtemps après la fin des échecs." }
    d: { en: "`missing` is the default that causes the problem: with no data in the evaluation range, the alarm goes to INSUFFICIENT_DATA.", fr: "`missing` est la valeur par défaut qui cause le problème : sans données dans la plage d'évaluation, l'alarme passe à INSUFFICIENT_DATA." }
references:
  - title: Configuring how CloudWatch alarms treat missing data
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-missing-data.html
