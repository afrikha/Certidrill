id: soac03-1b-eb-pattern-detail-state
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator creates an Amazon EventBridge rule on the default event bus to notify an Amazon SNS topic whenever an Amazon EC2 instance stops. The rule uses the following event pattern:

    ```json
    {
      "source": ["aws.ec2"],
      "detail-type": ["EC2 Instance State-change Notification"],
      "state": ["stopped"]
    }
    ```

    Several instances have stopped since the rule was created, but the rule's TriggeredRules metric stays at zero. The SNS topic policy allows EventBridge to publish.

    What should the administrator do to fix the rule?
  fr: |
    Un administrateur crée une règle Amazon EventBridge sur le bus d'événements par défaut pour avertir une rubrique Amazon SNS chaque fois qu'une instance Amazon EC2 s'arrête. La règle utilise le modèle d'événement suivant :

    ```json
    {
      "source": ["aws.ec2"],
      "detail-type": ["EC2 Instance State-change Notification"],
      "state": ["stopped"]
    }
    ```

    Plusieurs instances se sont arrêtées depuis la création de la règle, mais la métrique TriggeredRules de la règle reste à zéro. La politique de la rubrique SNS autorise EventBridge à publier.

    Que doit faire l'administrateur pour corriger la règle ?
body:
  options:
    - { id: a, text: { en: "Change the source value to ec2.amazonaws.com.", fr: "Remplacer la valeur de source par ec2.amazonaws.com." } }
    - { id: b, text: { en: "Create a CloudTrail trail with logging enabled so that EventBridge receives EC2 events.", fr: "Créer un journal de suivi CloudTrail avec la journalisation activée pour qu'EventBridge reçoive les événements EC2." } }
    - { id: c, text: { en: "Move the state field inside a detail object so that the pattern matches detail.state.", fr: "Déplacer le champ state dans un objet detail pour que le modèle corresponde à detail.state." } }
    - { id: d, text: { en: "Set the rule state to ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS.", fr: "Définir l'état de la règle sur ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In an EC2 Instance State-change Notification event, the new state is in the detail object of the event, not at the top level. A pattern field must follow the structure of the event, so the pattern needs `"detail": {"state": ["stopped"]}`. The top-level state field never exists in these events, so the rule never matches.
    fr: |
      Dans un événement EC2 Instance State-change Notification, le nouvel état se trouve dans l'objet detail de l'événement, pas au niveau supérieur. Un champ du modèle doit suivre la structure de l'événement : le modèle doit contenir `"detail": {"state": ["stopped"]}`. Le champ state de niveau supérieur n'existe jamais dans ces événements, donc la règle ne correspond jamais.
  options:
    a: { en: "AWS service events use the source aws.ec2; ec2.amazonaws.com is the eventSource value inside CloudTrail API call events.", fr: "Les événements des services AWS utilisent la source aws.ec2 ; ec2.amazonaws.com est la valeur d'eventSource dans les événements d'appels d'API CloudTrail." }
    b: { en: "EC2 sends state-change events to the default bus by itself; a trail is needed only for events delivered via CloudTrail.", fr: "EC2 envoie lui-même les événements de changement d'état au bus par défaut ; un journal de suivi n'est nécessaire que pour les événements livrés via CloudTrail." }
    d: { en: "This rule state only adds read-only CloudTrail management events; it does not fix a pattern that does not match the event structure.", fr: "Cet état de règle ajoute seulement les événements de gestion CloudTrail en lecture seule ; il ne corrige pas un modèle qui ne suit pas la structure de l'événement." }
references:
  - title: Amazon EventBridge event bus (default and Classic)
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-bus.html
