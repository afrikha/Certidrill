id: soac03-1a-alarm-metric-math-rate
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application runs behind an Application Load Balancer. Its traffic ranges from 50 requests per minute at night to 20,000 requests per minute at peak, so an alarm on a fixed number of errors is either too noisy or too slow. The operations team wants an alarm when more than 5 percent of the requests return a 5XX error from the targets.

    Which solution will meet these requirements?
  fr: |
    Une application s'exécute derrière un Application Load Balancer. Son trafic va de 50 requêtes par minute la nuit à 20 000 requêtes par minute en pointe : une alarme sur un nombre fixe d'erreurs est donc soit trop bruyante, soit trop lente. L'équipe des opérations veut une alarme quand plus de 5 % des requêtes renvoient une erreur 5XX depuis les cibles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an alarm on the 99th percentile of `TargetResponseTime` with a threshold of 5 seconds.", fr: "Créer une alarme sur le 99e centile de `TargetResponseTime` avec un seuil de 5 secondes." }
    - id: b
      text: { en: "Create an alarm on the expression `100 * m1 / m2`, where m1 is the Sum of `HTTPCode_Target_5XX_Count` and m2 is the Sum of `RequestCount`.", fr: "Créer une alarme sur l'expression `100 * m1 / m2`, où m1 est la somme de `HTTPCode_Target_5XX_Count` et m2 la somme de `RequestCount`." }
    - id: c
      text: { en: "Create an alarm on a SEARCH expression that returns `HTTPCode_Target_5XX_Count` for every target group of the load balancer.", fr: "Créer une alarme sur une expression SEARCH qui renvoie `HTTPCode_Target_5XX_Count` pour chaque groupe cible de l'équilibreur de charge." }
    - id: d
      text: { en: "Create an alarm on the Sum of `HTTPCode_Target_5XX_Count` with a threshold of 5 for each 1-minute period.", fr: "Créer une alarme sur la somme de `HTTPCode_Target_5XX_Count` avec un seuil de 5 par période d'une minute." }
answer: { optionId: b }
explanation:
  correct:
    en: "A metric alarm can evaluate a metric math expression that combines up to 10 metrics, as long as the expression returns a single time series. Dividing the 5XX count by the request count gives an error rate that stays meaningful at any traffic level, and a threshold of 5 matches the requirement."
    fr: "Une alarme de métrique peut évaluer une expression mathématique de métriques qui combine jusqu'à 10 métriques, tant que l'expression renvoie une seule série chronologique. Diviser le nombre de 5XX par le nombre de requêtes donne un taux d'erreur pertinent quel que soit le trafic, et un seuil de 5 correspond à l'exigence."
  options:
    a: { en: "Response time measures latency, not the share of requests that fail.", fr: "Le temps de réponse mesure la latence, et non la part des requêtes en échec." }
    c: { en: "CloudWatch cannot create an alarm on a SEARCH expression, and the result would still be a count, not a rate.", fr: "CloudWatch ne permet pas de créer une alarme sur une expression SEARCH, et le résultat resterait un nombre, et non un taux." }
    d: { en: "A fixed count is the approach that fails: 5 errors are a large share at night and a tiny share at peak.", fr: "Un nombre fixe est précisément l'approche qui échoue : 5 erreurs représentent une grande part la nuit et une part infime en pointe." }
references:
  - title: Create a CloudWatch alarm based on a metric math expression
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create-alarm-on-metric-math-expression.html
