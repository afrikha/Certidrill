id: soac03-1c-efs-archive-provisioned
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has an Amazon EFS Regional file system that has used Provisioned throughput for a year. More than half of its data has not been read for over a year and will be read only during rare audits. A CloudOps engineer tries to add a lifecycle policy that transitions files to EFS Archive after 90 days, but the change is rejected. The company wants to reduce the storage cost with the LEAST effort.

    What should the engineer do?
  fr: |
    Une entreprise dispose d'un système de fichiers Amazon EFS régional qui utilise le débit Provisioned depuis un an. Plus de la moitié de ses données n'ont pas été lues depuis plus d'un an et ne le seront que lors de rares audits. Un ingénieur CloudOps essaie d'ajouter une politique de cycle de vie qui fait passer les fichiers vers EFS Archive après 90 jours, mais la modification est refusée. L'entreprise veut réduire le coût de stockage avec le MOINS d'effort possible.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Change the file system to Bursting throughput, and then add the Transition into Archive policy.", fr: "Faire passer le système de fichiers au débit Bursting, puis ajouter la politique Transition into Archive." } }
    - { id: b, text: { en: "Change the file system to Elastic throughput, and then add the Transition into Archive policy.", fr: "Faire passer le système de fichiers au débit Elastic, puis ajouter la politique Transition into Archive." } }
    - { id: c, text: { en: "Create an EFS One Zone file system with an Archive policy, and copy the data to it with AWS DataSync.", fr: "Créer un système de fichiers EFS One Zone avec une politique Archive, puis y copier les données avec AWS DataSync." } }
    - { id: d, text: { en: "Change the performance mode of the file system to Max I/O, and then add the Transition into Archive policy.", fr: "Faire passer le mode de performance du système de fichiers à Max I/O, puis ajouter la politique Transition into Archive." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The EFS Archive storage class is supported only on Regional file systems that use Elastic throughput. After the engineer switches the throughput mode to Elastic, the Transition into Archive policy can be added, and the rarely read files move to the lowest-cost class without copying data. While an Archive policy exists, the file system cannot be changed back to Bursting or Provisioned."
    fr: "La classe de stockage EFS Archive n'est prise en charge que sur les systèmes de fichiers régionaux qui utilisent le débit Elastic. Une fois le mode de débit passé à Elastic, la politique Transition into Archive peut être ajoutée et les fichiers rarement lus passent dans la classe la moins chère sans copie de données. Tant qu'une politique Archive existe, le système de fichiers ne peut pas revenir au débit Bursting ou Provisioned."
  options:
    a:
      en: "Archive is not supported with Bursting throughput either; only Elastic throughput allows it."
      fr: "Archive n'est pas non plus pris en charge avec le débit Bursting ; seul le débit Elastic le permet."
    c:
      en: "EFS Archive is available only for Regional file systems, and copying the data is much more effort."
      fr: "EFS Archive n'est disponible que pour les systèmes de fichiers régionaux, et copier les données demande beaucoup plus d'effort."
    d:
      en: "The performance mode cannot be changed after creation, and it is not the reason the Archive policy is rejected."
      fr: "Le mode de performance ne peut pas être modifié après la création, et il n'est pas la raison du refus de la politique Archive."
references:
  - title: Features of Amazon EFS
    url: https://docs.aws.amazon.com/efs/latest/ug/features.html
