id: soac03-1a-sns-email-pending
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CloudWatch alarm publishes to an unencrypted SNS topic when it goes into the ALARM state. The alarm history shows that the SNS action ran successfully, but the operations distribution list never receives an email. In the SNS console, the email subscription of the distribution list shows the status `Pending confirmation`.

    Which solution will fix the problem?
  fr: |
    Une alarme CloudWatch publie dans une rubrique SNS non chiffrée quand elle passe à l'état ALARM. L'historique de l'alarme indique que l'action SNS s'est exécutée correctement, mais la liste de diffusion des opérations ne reçoit jamais d'e-mail. Dans la console SNS, l'abonnement e-mail de la liste de diffusion affiche l'état `Pending confirmation`.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - id: a
      text: { en: "Turn on the actions of the alarm with `EnableAlarmActions`.", fr: "Activer les actions de l'alarme avec `EnableAlarmActions`." }
    - id: b
      text: { en: "Allow `cloudwatch.amazonaws.com` to publish in the topic policy.", fr: "Autoriser `cloudwatch.amazonaws.com` à publier dans la politique de la rubrique." }
    - id: c
      text: { en: "Change the alarm so that it publishes to a FIFO topic.", fr: "Modifier l'alarme pour qu'elle publie dans une rubrique FIFO." }
    - id: d
      text: { en: "Confirm the subscription with the link in the SNS confirmation email.", fr: "Confirmer l'abonnement avec le lien de l'e-mail de confirmation SNS." }
answer: { optionId: d }
explanation:
  correct:
    en: "An email endpoint receives messages only after the subscription is confirmed. Until someone opens the confirmation email that SNS sent and confirms, the subscription stays pending and no notification is delivered; SNS deletes unconfirmed subscriptions after 48 hours."
    fr: "Un point de terminaison e-mail ne reçoit des messages qu'après la confirmation de l'abonnement. Tant que personne n'ouvre l'e-mail de confirmation envoyé par SNS pour confirmer, l'abonnement reste en attente et aucune notification n'est livrée ; SNS supprime les abonnements non confirmés après 48 heures."
  options:
    a: { en: "The actions are already enabled: the alarm history shows that the SNS action ran.", fr: "Les actions sont déjà activées : l'historique de l'alarme montre que l'action SNS s'est exécutée." }
    b: { en: "The action succeeded, so publishing to the topic works; the delivery to the endpoint is what is blocked.", fr: "L'action a réussi : la publication dans la rubrique fonctionne. C'est la livraison vers le point de terminaison qui est bloquée." }
    c: { en: "The topic type does not explain a pending subscription; the email subscription would still have to be confirmed.", fr: "Le type de rubrique n'explique pas un abonnement en attente ; l'abonnement e-mail devrait toujours être confirmé." }
references:
  - title: Amazon SNS email subscription setup and management
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-email-notifications.html
