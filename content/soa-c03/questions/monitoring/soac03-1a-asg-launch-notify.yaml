id: soac03-1a-asg-launch-notify
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations team wants an email each time an Auto Scaling group launches an instance and each time an instance launch fails. The team has an SNS topic with confirmed email subscriptions. The notifications must not change or delay how the group launches instances.

    Which solution will meet these requirements?
  fr: |
    Une équipe des opérations veut recevoir un e-mail chaque fois qu'un groupe Auto Scaling lance une instance et chaque fois qu'un lancement d'instance échoue. L'équipe dispose d'une rubrique SNS avec des abonnements e-mail confirmés. Les notifications ne doivent ni modifier ni retarder la façon dont le groupe lance les instances.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a launch lifecycle hook to the group that sends a notification to the topic.", fr: "Ajouter au groupe un hook de cycle de vie de lancement qui envoie une notification à la rubrique." }
    - id: b
      text: { en: "Create an alarm on the `GroupInServiceInstances` metric of the group that notifies the topic.", fr: "Créer une alarme sur la métrique `GroupInServiceInstances` du groupe qui notifie la rubrique." }
    - id: c
      text: { en: "Add a notification configuration for the `EC2_INSTANCE_LAUNCH` and `EC2_INSTANCE_LAUNCH_ERROR` types.", fr: "Ajouter une configuration de notification pour les types `EC2_INSTANCE_LAUNCH` et `EC2_INSTANCE_LAUNCH_ERROR`." }
    - id: d
      text: { en: "Turn on detailed monitoring in the launch template and create an alarm on `StatusCheckFailed`.", fr: "Activer la surveillance détaillée dans le modèle de lancement et créer une alarme sur `StatusCheckFailed`." }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon EC2 Auto Scaling can publish notifications to an SNS topic for successful and failed launches and terminations. `aws autoscaling put-notification-configuration` with the `autoscaling:EC2_INSTANCE_LAUNCH` and `autoscaling:EC2_INSTANCE_LAUNCH_ERROR` types sends one message per instance without affecting the launches."
    fr: "Amazon EC2 Auto Scaling peut publier dans une rubrique SNS des notifications pour les lancements et les résiliations réussis ou en échec. `aws autoscaling put-notification-configuration` avec les types `autoscaling:EC2_INSTANCE_LAUNCH` et `autoscaling:EC2_INSTANCE_LAUNCH_ERROR` envoie un message par instance sans affecter les lancements."
  options:
    a: { en: "A lifecycle hook puts each new instance in a wait state, which delays the launch, and it does not report failed launches.", fr: "Un hook de cycle de vie place chaque nouvelle instance en état d'attente, ce qui retarde le lancement, et il ne signale pas les lancements en échec." }
    b: { en: "An alarm fires on a threshold crossing, not on each launch, and it does not report a failed launch.", fr: "Une alarme se déclenche au franchissement d'un seuil, et non à chaque lancement, et elle ne signale pas un lancement en échec." }
    d: { en: "Status checks report the health of running instances, not launches or launch failures.", fr: "Les vérifications de l'état indiquent la santé des instances en cours d'exécution, et non les lancements ni leurs échecs." }
references:
  - title: Amazon SNS notification options for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-sns-notifications.html
