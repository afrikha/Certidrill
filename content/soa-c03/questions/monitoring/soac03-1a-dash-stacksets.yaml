id: soac03-1a-dash-stacksets
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. Each of the 60 member accounts in the Workloads organizational unit (OU) must contain the same standard CloudWatch dashboard in the us-east-1 and eu-west-1 Regions, so that application teams can view their own resources. Accounts that are added to the OU later must receive the dashboard automatically. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations. Chacun des 60 comptes membres de l'unité d'organisation (UO) Workloads doit contenir le même tableau de bord CloudWatch standard dans les Régions us-east-1 et eu-west-1, pour que les équipes d'application puissent voir leurs propres ressources. Les comptes ajoutés plus tard à l'UO doivent recevoir automatiquement le tableau de bord. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure CloudWatch cross-account observability for the OU, with the management account as the monitoring account.", fr: "Configurer l'observabilité multicompte CloudWatch pour l'UO, avec le compte de gestion comme compte de surveillance." }
    - id: b
      text: { en: "Create the dashboard once in the management account and share it publicly so that every team can open it.", fr: "Créer le tableau de bord une fois dans le compte de gestion et le partager publiquement pour que chaque équipe puisse l'ouvrir." }
    - id: c
      text: { en: "Write a script that assumes a role in each account and calls `PutDashboard` in each of the two Regions.", fr: "Écrire un script qui assume un rôle dans chaque compte et appelle `PutDashboard` dans chacune des deux Régions." }
    - id: d
      text: { en: "Deploy an `AWS::CloudWatch::Dashboard` template with a service-managed StackSet that targets the OU and both Regions.", fr: "Déployer un modèle `AWS::CloudWatch::Dashboard` avec un StackSet à autorisations gérées par le service qui cible l'UO et les deux Régions." }
answer: { optionId: d }
explanation:
  correct:
    en: "The `AWS::CloudWatch::Dashboard` resource creates a dashboard from a JSON `DashboardBody`. A StackSet deploys the template to many accounts and Regions in one operation, and with service-managed permissions and automatic deployment it also deploys the stack to accounts that join the target OU."
    fr: "La ressource `AWS::CloudWatch::Dashboard` crée un tableau de bord à partir d'un `DashboardBody` JSON. Un StackSet déploie le modèle dans de nombreux comptes et Régions en une seule opération et, avec les autorisations gérées par le service et le déploiement automatique, il déploie aussi la pile dans les comptes qui rejoignent l'UO cible."
  options:
    a: { en: "Cross-account observability centralizes data in one monitoring account; it does not create a dashboard in each member account.", fr: "L'observabilité multicompte centralise les données dans un compte de surveillance ; elle ne crée pas de tableau de bord dans chaque compte membre." }
    b: { en: "A public dashboard shows the data of the account that owns it, not each team's resources, and exposes it to anyone with the link.", fr: "Un tableau de bord public affiche les données du compte propriétaire, et non les ressources de chaque équipe, et les expose à toute personne disposant du lien." }
    c: { en: "A custom script must be run again for every new account, which adds operational work.", fr: "Un script personnalisé doit être relancé pour chaque nouveau compte, ce qui ajoute du travail opérationnel." }
references:
  - title: Managing stacks across accounts and Regions with StackSets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/what-is-cfnstacksets.html
  - title: AWS::CloudWatch::Dashboard
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudwatch-dashboard.html
