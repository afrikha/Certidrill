id: soac03-1b-co-fargate-no-recs
objective: "1.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company is opted in to AWS Compute Optimizer. It runs several Amazon ECS services on AWS Fargate that have run without interruption in the SteadyState status for 3 weeks. Compute Optimizer shows CPU and memory recommendations for most services, but not for two of them.

    Which configurations of these two services could prevent Compute Optimizer from generating recommendations? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise est inscrite à AWS Compute Optimizer. Elle exécute plusieurs services Amazon ECS sur AWS Fargate qui tournent sans interruption, avec le statut SteadyState, depuis 3 semaines. Compute Optimizer affiche des recommandations de processeur et de mémoire pour la plupart des services, mais pas pour deux d'entre eux.

    Quelles configurations de ces deux services peuvent empêcher Compute Optimizer de générer des recommandations ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The service uses a step scaling policy.", fr: "Le service utilise une politique de mise à l'échelle par étapes (step scaling)." } }
    - { id: b, text: { en: "The task definition sets task-level CPU and memory values.", fr: "La définition de tâche fixe des valeurs de processeur et de mémoire au niveau de la tâche." } }
    - { id: c, text: { en: "The service has one target tracking scaling policy on average CPU utilization only.", fr: "Le service a une seule politique de suivi de cible (target tracking) sur l'utilisation moyenne du processeur uniquement." } }
    - { id: d, text: { en: "The service has target tracking scaling policies on both CPU and memory utilization.", fr: "Le service a des politiques de suivi de cible sur l'utilisation du processeur et sur celle de la mémoire." } }
    - { id: e, text: { en: "The tasks use the awsvpc network mode.", fr: "Les tâches utilisent le mode réseau awsvpc." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      For ECS services on Fargate, Compute Optimizer needs at least 24 hours of CloudWatch and Amazon ECS utilization metrics in the past 14 days and a SteadyState or MoreWork status. It also generates no recommendation for a service that has a step scaling policy, or that has target tracking policies on both CPU and memory.
    fr: |
      Pour les services ECS sur Fargate, Compute Optimizer a besoin d'au moins 24 heures de métriques d'utilisation CloudWatch et Amazon ECS sur les 14 derniers jours, et d'un statut SteadyState ou MoreWork. Il ne génère pas non plus de recommandation pour un service qui a une politique de mise à l'échelle par étapes, ou des politiques de suivi de cible à la fois sur le processeur et sur la mémoire.
  options:
    b: { en: "Fargate tasks always have task-level CPU and memory; these are the values that Compute Optimizer recommends changing.", fr: "Les tâches Fargate ont toujours un processeur et une mémoire au niveau de la tâche ; ce sont justement les valeurs dont Compute Optimizer recommande la modification." }
    c: { en: "A target tracking policy on CPU alone is allowed; only policies on both CPU and memory block recommendations.", fr: "Une politique de suivi de cible sur le seul processeur est autorisée ; seules des politiques sur le processeur et la mémoire bloquent les recommandations." }
    e: { en: "Fargate tasks use the awsvpc network mode, so every service has it, including those with recommendations.", fr: "Les tâches Fargate utilisent le mode réseau awsvpc : tous les services l'ont, y compris ceux qui ont des recommandations." }
references:
  - title: Resource requirements
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/requirements.html
