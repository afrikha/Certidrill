id: soac03-1b-ssm-executescript
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator is writing a custom Automation runbook. One step must run about 40 lines of Python that read the output of a previous step, calculate a new tag value with custom logic, and return the value to the next step. The administrator does not want to create or maintain any other AWS resource for this logic.

    Which Automation action should the step use?
  fr: |
    Un administrateur rédige un runbook Automation personnalisé. Une étape doit exécuter une quarantaine de lignes de Python qui lisent la sortie d'une étape précédente, calculent une nouvelle valeur de balise avec une logique personnalisée et renvoient la valeur à l'étape suivante. L'administrateur ne veut créer ni maintenir aucune autre ressource AWS pour cette logique.

    Quelle action Automation l'étape doit-elle utiliser ?
body:
  options:
    - { id: a, text: "`aws:executeAwsApi`" }
    - { id: b, text: "`aws:invokeLambdaFunction`" }
    - { id: c, text: "`aws:runCommand`" }
    - { id: d, text: "`aws:executeScript`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      aws:executeScript runs a Python or PowerShell script embedded in the runbook. The handler receives the InputPayload, which can reference outputs of previous steps, and the value that the function returns becomes the step's Payload output for later steps. Each run can last up to 600 seconds.
    fr: |
      aws:executeScript exécute un script Python ou PowerShell intégré au runbook. Le gestionnaire reçoit l'InputPayload, qui peut faire référence aux sorties des étapes précédentes, et la valeur renvoyée par la fonction devient la sortie Payload de l'étape pour les étapes suivantes. Chaque exécution peut durer jusqu'à 600 secondes.
  options:
    a: { en: "aws:executeAwsApi calls a single AWS API operation; it does not run custom Python logic.", fr: "aws:executeAwsApi appelle une seule opération d'API AWS ; il n'exécute pas de logique Python personnalisée." }
    b: { en: "Invoking a Lambda function works, but the function is another AWS resource to create and maintain.", fr: "Invoquer une fonction Lambda fonctionne, mais la fonction est une autre ressource AWS à créer et à maintenir." }
    c: { en: "aws:runCommand runs a command on managed instances; the logic does not need an instance.", fr: "aws:runCommand exécute une commande sur des instances gérées ; la logique n'a pas besoin d'instance." }
references:
  - title: aws:executeScript – Run a script
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-executeScript.html
