id: soac03-1c-ec2-instance-store-reboot
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application on an Amazon EC2 instance keeps a large cache on an NVMe instance store volume. Rebuilding the cache takes several hours. A CloudOps engineer must apply an operating system update that requires a restart of the instance and wants to keep the cache.

    What should the engineer do after applying the update?
  fr: |
    Une application sur une instance Amazon EC2 conserve un cache volumineux sur un volume de stockage d'instance NVMe. Reconstruire le cache prend plusieurs heures. Un ingénieur CloudOps doit appliquer une mise à jour du système d'exploitation qui exige un redémarrage de l'instance et veut conserver le cache.

    Que doit faire l'ingénieur après avoir appliqué la mise à jour ?
body:
  options:
    - { id: a, text: { en: "Stop the instance from the EC2 console, and then start it.", fr: "Arrêter l'instance depuis la console EC2, puis la démarrer." } }
    - { id: b, text: { en: "Hibernate the instance, and then start it.", fr: "Mettre l'instance en veille prolongée, puis la démarrer." } }
    - { id: c, text: { en: "Reboot the instance from the operating system or the EC2 console.", fr: "Redémarrer l'instance depuis le système d'exploitation ou la console EC2." } }
    - { id: d, text: { en: "Create an EBS snapshot of the instance store volume, restart the instance, and restore the snapshot.", fr: "Créer un instantané EBS du volume de stockage d'instance, redémarrer l'instance, puis restaurer l'instantané." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Data on an instance store volume persists when the instance reboots, whether the reboot is started by the user or by AWS. The data is lost when the instance is stopped, hibernated or terminated, because every block of the volume is then cryptographically erased."
    fr: "Les données d'un volume de stockage d'instance sont conservées lorsque l'instance redémarre, que le redémarrage soit lancé par l'utilisateur ou par AWS. Elles sont perdues lorsque l'instance est arrêtée, mise en veille prolongée ou résiliée, car chaque bloc du volume est alors effacé par chiffrement."
  options:
    a:
      en: "Stopping the instance erases the instance store volume, so the cache would have to be rebuilt."
      fr: "Arrêter l'instance efface le volume de stockage d'instance : le cache devrait être reconstruit."
    b:
      en: "Hibernation also erases instance store data; only the RAM content saved to the EBS root volume is kept."
      fr: "La veille prolongée efface aussi les données du stockage d'instance ; seul le contenu de la mémoire enregistré sur le volume racine EBS est conservé."
    d:
      en: "EBS snapshots apply to EBS volumes only; an instance store volume cannot be snapshotted."
      fr: "Les instantanés EBS ne s'appliquent qu'aux volumes EBS ; un volume de stockage d'instance ne peut pas faire l'objet d'un instantané."
references:
  - title: Data persistence for Amazon EC2 instance store volumes
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-store-lifetime.html
