id: soac03-1b-eb-lambda-target-permission
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator uses the AWS CLI to create an Amazon EventBridge rule on the default event bus and to add an AWS Lambda function as its target with the put-targets command. The function tags new Amazon EBS volumes.

    After new volumes are created, the rule's TriggeredRules and FailedInvocations metrics both increase, but the function's Invocations metric stays at zero. The function works when it is invoked manually.

    What should the administrator do to fix the issue?
  fr: |
    Un administrateur utilise l'AWS CLI pour créer une règle Amazon EventBridge sur le bus d'événements par défaut et lui ajouter une fonction AWS Lambda comme cible avec la commande put-targets. La fonction balise les nouveaux volumes Amazon EBS.

    Après la création de nouveaux volumes, les métriques TriggeredRules et FailedInvocations de la règle augmentent toutes les deux, mais la métrique Invocations de la fonction reste à zéro. La fonction fonctionne lorsqu'elle est invoquée manuellement.

    Que doit faire l'administrateur pour résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Add the lambda:InvokeFunction permission for the function to the function's own execution role.", fr: "Ajouter l'autorisation lambda:InvokeFunction sur la fonction au propre rôle d'exécution de la fonction." } }
    - { id: b, text: { en: "Add a dead-letter queue to the rule target so that EventBridge can deliver the events later.", fr: "Ajouter une file d'attente de lettres mortes à la cible de la règle pour qu'EventBridge puisse livrer les événements plus tard." } }
    - { id: c, text: { en: "Change the event pattern so that it matches the CreateVolume API call instead of the EBS volume notification.", fr: "Modifier le modèle d'événement pour qu'il corresponde à l'appel d'API CreateVolume au lieu de la notification de volume EBS." } }
    - { id: d, text: { en: "Run aws lambda add-permission to let events.amazonaws.com invoke the function, with the rule ARN as source ARN.", fr: "Exécuter aws lambda add-permission pour permettre à events.amazonaws.com d'invoquer la fonction, avec l'ARN de la règle comme ARN source." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      TriggeredRules shows that the pattern matches, and FailedInvocations shows that delivery to the target fails. When a target is added with the CLI, EventBridge does not add the permission that the console adds. The function's resource-based policy must allow events.amazonaws.com to call lambda:InvokeFunction, scoped to the rule ARN.
    fr: |
      TriggeredRules montre que le modèle correspond, et FailedInvocations montre que la livraison à la cible échoue. Lorsqu'une cible est ajoutée avec la CLI, EventBridge n'ajoute pas l'autorisation que la console ajoute. La politique basée sur les ressources de la fonction doit autoriser events.amazonaws.com à appeler lambda:InvokeFunction, limitée à l'ARN de la règle.
  options:
    a: { en: "The execution role controls what the function can call; it does not let EventBridge invoke the function.", fr: "Le rôle d'exécution contrôle ce que la fonction peut appeler ; il ne permet pas à EventBridge d'invoquer la fonction." }
    b: { en: "A dead-letter queue keeps events that could not be delivered; it does not grant EventBridge permission to invoke the function.", fr: "Une file d'attente de lettres mortes conserve les événements non livrés ; elle n'accorde pas à EventBridge l'autorisation d'invoquer la fonction." }
    c: { en: "The pattern already matches, as TriggeredRules shows; changing it does not fix the failed invocations.", fr: "Le modèle correspond déjà, comme le montre TriggeredRules ; le modifier ne corrige pas les invocations en échec." }
references:
  - title: Troubleshooting Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-troubleshooting.html
