id: soac03-1b-ssm-state-manager-runbook
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a custom Automation runbook that removes temporary files and restarts a logging service on an Amazon EC2 instance. The runbook takes an InstanceId parameter. The company wants the runbook to run every day on all instances that have the tag Env=prod, on no more than 20 % of the instances at a time, and wants each run to be tracked by Systems Manager without custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un runbook Automation personnalisé qui supprime des fichiers temporaires et redémarre un service de journalisation sur une instance Amazon EC2. Le runbook prend un paramètre InstanceId. L'entreprise veut que le runbook s'exécute chaque jour sur toutes les instances qui ont la balise Env=prod, sur au plus 20 % des instances à la fois, et que chaque exécution soit suivie par Systems Manager sans code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a State Manager association for the runbook with a rate(1 day) schedule, tag targets, 20 % concurrency, and an AutomationAssumeRole.", fr: "Créer une association State Manager pour le runbook avec une planification rate(1 day), des cibles par balise, une simultanéité de 20 % et un AutomationAssumeRole." } }
    - { id: b, text: { en: "Create the same State Manager association without an AutomationAssumeRole, so that it uses the permissions of its creator.", fr: "Créer la même association State Manager sans AutomationAssumeRole, pour qu'elle utilise les autorisations de son créateur." } }
    - { id: c, text: { en: "Create a CloudWatch alarm with a 1-day period on CPUUtilization for each instance and set the runbook as the alarm action.", fr: "Créer pour chaque instance une alarme CloudWatch avec une période de 1 jour sur CPUUtilization et définir le runbook comme action de l'alarme." } }
    - { id: d, text: { en: "Add the runbook to a Patch Manager patch baseline and a patch group for the instances that have the tag Env=prod.", fr: "Ajouter le runbook à une référence de correctifs Patch Manager et à un groupe de correctifs pour les instances qui ont la balise Env=prod." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A State Manager association can run an Automation runbook on a schedule, with rate expressions as the preferred schedule type. It targets resources by tag, resource group, or parameter values, supports concurrency and error thresholds, and records each run. For runbook associations, the AutomationAssumeRole is required, because State Manager uses that role to call AWS services on your behalf.
    fr: |
      Une association State Manager peut exécuter un runbook Automation selon une planification, les expressions rate étant le type de planification recommandé. Elle cible les ressources par balise, groupe de ressources ou valeurs de paramètres, prend en charge les seuils de simultanéité et d'erreurs, et enregistre chaque exécution. Pour les associations de runbooks, l'AutomationAssumeRole est obligatoire, car State Manager utilise ce rôle pour appeler les services AWS en votre nom.
  options:
    b: { en: "Associations that run runbooks require an AutomationAssumeRole; they do not run with the creator's permissions.", fr: "Les associations qui exécutent des runbooks exigent un AutomationAssumeRole ; elles ne s'exécutent pas avec les autorisations de leur créateur." }
    c: { en: "Alarm actions cannot start an Automation runbook directly, and an alarm on CPU is not a daily schedule.", fr: "Les actions d'alarme ne peuvent pas lancer directement un runbook Automation, et une alarme sur le processeur n'est pas une planification quotidienne." }
    d: { en: "A patch baseline defines which patches are approved; it does not run Automation runbooks.", fr: "Une référence de correctifs définit les correctifs approuvés ; elle n'exécute pas de runbooks Automation." }
references:
  - title: Scheduling automations with State Manager associations
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/scheduling-automations-state-manager-associations.html
