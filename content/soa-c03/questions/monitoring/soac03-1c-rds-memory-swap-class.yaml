id: soac03-1c-rds-memory-swap-class
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon RDS for PostgreSQL DB instance runs on the db.m6g.large instance class. Over the past month, FreeableMemory has dropped close to zero during business hours, SwapUsage has grown and ReadIOPS has increased, while CPUUtilization stays below 40%. The data set and the number of users keep growing.

    Which solution will MOST improve performance?
  fr: |
    Une instance de base de données Amazon RDS for PostgreSQL utilise la classe d'instance db.m6g.large. Au cours du dernier mois, FreeableMemory est tombée presque à zéro pendant les heures de bureau, SwapUsage a augmenté et ReadIOPS s'est accru, alors que CPUUtilization reste sous 40 %. Le jeu de données et le nombre d'utilisateurs continuent de croître.

    Quelle solution améliorera le PLUS les performances ?
body:
  options:
    - { id: a, text: { en: "Modify the DB instance to a burstable instance class, such as db.t4g.large.", fr: "Faire passer l'instance de base de données à une classe d'instance à capacité extensible, comme db.t4g.large." } }
    - { id: b, text: { en: "Increase the allocated storage so that the DB instance has more space for swap.", fr: "Augmenter le stockage alloué pour que l'instance de base de données dispose de plus d'espace de swap." } }
    - { id: c, text: { en: "Modify the DB instance to a memory optimized instance class, such as db.r6g.large.", fr: "Faire passer l'instance de base de données à une classe d'instance à mémoire optimisée, comme db.r6g.large." } }
    - { id: d, text: { en: "Convert the deployment to Multi-AZ so that the standby shares the memory load.", fr: "Convertir le déploiement en Multi-AZ pour que l'instance de secours partage la charge mémoire." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Low FreeableMemory with growing SwapUsage and more read I/O means that the working set no longer fits in memory, so the engine swaps and reads more pages from storage. CPU is not the limit, so a memory optimized class (R family), which has twice the memory of the M class with the same vCPUs, addresses the bottleneck directly."
    fr: "Une FreeableMemory faible avec une SwapUsage croissante et davantage d'E/S de lecture signifie que l'ensemble de travail ne tient plus en mémoire : le moteur utilise le swap et lit davantage de pages depuis le stockage. Le processeur n'est pas la limite : une classe à mémoire optimisée (famille R), qui a deux fois plus de mémoire que la classe M pour le même nombre de vCPU, traite directement le goulot d'étranglement."
  options:
    a:
      en: "A db.t4g.large has the same amount of memory as a db.m6g.large and adds CPU credit behavior, so the memory shortage remains."
      fr: "Une db.t4g.large a la même quantité de mémoire qu'une db.m6g.large et ajoute le fonctionnement par crédits de processeur : le manque de mémoire demeure."
    b:
      en: "Swapping is the symptom; more storage does not add RAM, and swapped pages stay much slower than memory."
      fr: "Le swap est le symptôme ; plus de stockage n'ajoute pas de mémoire vive, et les pages en swap restent bien plus lentes que la mémoire."
    d:
      en: "In a Multi-AZ DB instance deployment, the standby does not serve traffic, so it does not share any memory load."
      fr: "Dans un déploiement d'instance de base de données Multi-AZ, l'instance de secours ne traite pas de trafic : elle ne partage aucune charge mémoire."
references:
  - title: Amazon CloudWatch metrics for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-metrics.html
  - title: DB instance class types
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.Types.html
