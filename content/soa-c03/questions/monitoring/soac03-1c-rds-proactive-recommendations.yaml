id: soac03-1c-rds-proactive-recommendations
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company enabled Amazon CloudWatch Database Insights for its Amazon RDS for PostgreSQL DB instances with the default 7-day retention of performance data. The database team wants Amazon RDS to generate proactive recommendations when metrics cross thresholds learned from each instance's baseline behavior, but no proactive recommendations appear on the Recommendations page of the RDS console.

    What should a CloudOps engineer do?
  fr: |
    Une entreprise a activé Amazon CloudWatch Database Insights pour ses instances de base de données Amazon RDS for PostgreSQL avec la conservation par défaut de 7 jours des données de performance. L'équipe de bases de données veut qu'Amazon RDS génère des recommandations proactives lorsque des métriques franchissent des seuils déduits du comportement de référence de chaque instance, mais aucune recommandation proactive n'apparaît sur la page Recommendations de la console RDS.

    Que doit faire un ingénieur CloudOps ?
body:
  options:
    - { id: a, text: { en: "Enable the collection of detailed per-query and database counter metrics with a paid retention period.", fr: "Activer la collecte des métriques détaillées par requête et des compteurs de base de données avec une période de conservation payante." } }
    - { id: b, text: { en: "Turn on Enhanced Monitoring with a granularity of 1 second for each DB instance.", fr: "Activer la surveillance améliorée avec une granularité de 1 seconde pour chaque instance de base de données." } }
    - { id: c, text: { en: "Publish the PostgreSQL logs of each DB instance to Amazon CloudWatch Logs.", fr: "Publier les journaux PostgreSQL de chaque instance de base de données dans Amazon CloudWatch Logs." } }
    - { id: d, text: { en: "Create CloudWatch anomaly detection alarms on the DBLoad metric of each DB instance.", fr: "Créer des alarmes CloudWatch de détection d'anomalies sur la métrique DBLoad de chaque instance de base de données." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon RDS generates proactive recommendations when monitored metrics cross thresholds derived from the resource's baseline, and they appear on the RDS Recommendations page. To receive them, the DB instance must collect detailed per-query and database counter metrics with a paid tier retention period; the free 7-day default is not enough."
    fr: "Amazon RDS génère des recommandations proactives lorsque des métriques surveillées franchissent des seuils déduits du comportement de référence de la ressource, et elles apparaissent sur la page Recommendations de RDS. Pour les recevoir, l'instance doit collecter les métriques détaillées par requête et les compteurs de base de données avec une période de conservation payante ; la valeur gratuite par défaut de 7 jours ne suffit pas."
  options:
    b:
      en: "Enhanced Monitoring adds OS metrics in CloudWatch Logs but is not the prerequisite for proactive recommendations."
      fr: "La surveillance améliorée ajoute des métriques du système d'exploitation dans CloudWatch Logs mais n'est pas le prérequis des recommandations proactives."
    c:
      en: "Exporting engine logs lets you search them in CloudWatch Logs, but it does not turn on proactive recommendations."
      fr: "Exporter les journaux du moteur permet de les rechercher dans CloudWatch Logs, mais n'active pas les recommandations proactives."
    d:
      en: "Anomaly detection alarms notify on unusual values but do not create RDS recommendations with analysis and recommended actions."
      fr: "Les alarmes de détection d'anomalies signalent des valeurs inhabituelles mais ne créent pas de recommandations RDS avec analyse et actions recommandées."
references:
  - title: Viewing Database Insights proactive recommendations
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PerfInsights.InsightsRecommendationViewDetails.html
