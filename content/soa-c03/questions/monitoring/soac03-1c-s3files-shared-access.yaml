id: soac03-1c-s3files-shared-access
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company keeps a 200 TB dataset in an Amazon S3 general purpose bucket that has versioning enabled. Existing applications read and write the objects through the S3 API. New file-based tools that run on Amazon EC2 instances and in AWS Lambda functions must open, lock and modify the same data as files over NFS, without copying the dataset to another storage service. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de recherche conserve un jeu de données de 200 To dans un compartiment Amazon S3 à usage général dont la gestion des versions est activée. Des applications existantes lisent et écrivent les objets par l'API S3. De nouveaux outils orientés fichiers, exécutés sur des instances Amazon EC2 et dans des fonctions AWS Lambda, doivent ouvrir, verrouiller et modifier les mêmes données sous forme de fichiers via NFS, sans copier le jeu de données vers un autre service de stockage. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Mount the bucket on the EC2 instances with Mountpoint for Amazon S3, and have the Lambda functions call the S3 API directly.", fr: "Monter le compartiment sur les instances EC2 avec Mountpoint for Amazon S3, et faire appeler directement l'API S3 par les fonctions Lambda." } }
    - { id: b, text: { en: "Deploy an Amazon S3 File Gateway on an EC2 instance, and mount its NFS file share from the instances and the functions.", fr: "Déployer une passerelle Amazon S3 File Gateway sur une instance EC2, puis monter son partage de fichiers NFS depuis les instances et les fonctions." } }
    - { id: c, text: { en: "Create an Amazon EFS file system, and schedule AWS DataSync tasks that copy data between the bucket and the file system both ways.", fr: "Créer un système de fichiers Amazon EFS, puis planifier des tâches AWS DataSync qui copient les données dans les deux sens entre le compartiment et le système de fichiers." } }
    - { id: d, text: { en: "Create an Amazon S3 Files file system linked to the bucket, and mount it from the instances and the functions.", fr: "Créer un système de fichiers Amazon S3 Files lié au compartiment, puis le monter depuis les instances et les fonctions." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon S3 Files presents the objects of a bucket or prefix as files and directories over NFS 4.1 and 4.2, with file locking, POSIX permissions and read-after-write consistency, while the data stays in S3. It can be mounted on EC2, Lambda, ECS and EKS, and it synchronizes changes between the file system and the bucket in both directions, so the S3 API applications keep working on the same data."
    fr: "Amazon S3 Files présente les objets d'un compartiment ou d'un préfixe sous forme de fichiers et de répertoires via NFS 4.1 et 4.2, avec le verrouillage de fichiers, les autorisations POSIX et la cohérence lecture après écriture, tandis que les données restent dans S3. Il peut être monté sur EC2, Lambda, ECS et EKS, et synchronise les modifications entre le système de fichiers et le compartiment dans les deux sens : les applications qui utilisent l'API S3 continuent de travailler sur les mêmes données."
  options:
    a:
      en: "The Lambda functions would not get file access, and Mountpoint for Amazon S3 is not an NFS file system with file locking."
      fr: "Les fonctions Lambda n'auraient pas d'accès fichier, et Mountpoint for Amazon S3 n'est pas un système de fichiers NFS avec verrouillage de fichiers."
    b:
      en: "A file gateway is an appliance to deploy and maintain, and Lambda functions cannot mount its NFS share."
      fr: "Une passerelle de fichiers est une appliance à déployer et à maintenir, et les fonctions Lambda ne peuvent pas monter son partage NFS."
    c:
      en: "This copies the 200 TB dataset to another service and needs two-way sync jobs to operate, which the company wants to avoid."
      fr: "Cette solution copie le jeu de données de 200 To vers un autre service et nécessite des tâches de synchronisation dans les deux sens, ce que l'entreprise veut éviter."
references:
  - title: Working with Amazon S3 Files
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files.html
