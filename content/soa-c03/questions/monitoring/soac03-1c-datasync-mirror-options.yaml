id: soac03-1c-datasync-mirror-options
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS DataSync to copy an on-premises NFS share to an Amazon S3 bucket every night. The bucket must be an exact mirror of the share: files that are deleted from the share must also be removed from the bucket. Each nightly run must copy only the files that changed since the previous run.

    Which combination of task settings will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise AWS DataSync pour copier chaque nuit un partage NFS sur site vers un compartiment Amazon S3. Le compartiment doit être un miroir exact du partage : les fichiers supprimés du partage doivent aussi être supprimés du compartiment. Chaque exécution nocturne ne doit copier que les fichiers modifiés depuis l'exécution précédente.

    Quelle combinaison de paramètres de tâche répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set Transfer mode to Transfer all data (TransferMode ALL).", fr: "Définir le mode de transfert sur Transfer all data (TransferMode ALL)." } }
    - { id: b, text: { en: "Turn off Overwrite files (OverwriteMode NEVER).", fr: "Désactiver Overwrite files (OverwriteMode NEVER)." } }
    - { id: c, text: { en: "Set Transfer mode to Transfer only data that has changed (TransferMode CHANGED).", fr: "Définir le mode de transfert sur Transfer only data that has changed (TransferMode CHANGED)." } }
    - { id: d, text: { en: "Set Verification to Don't verify data after transfer (VerifyMode NONE).", fr: "Définir la vérification sur Don't verify data after transfer (VerifyMode NONE)." } }
    - { id: e, text: { en: "Turn off Keep deleted files (PreserveDeletedFiles REMOVE).", fr: "Désactiver Keep deleted files (PreserveDeletedFiles REMOVE)." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "With TransferMode CHANGED, DataSync compares the locations after the first full copy and transfers only data and metadata that differ. Turning off Keep deleted files makes DataSync delete from the destination the objects that no longer exist in the source, which is only possible because the CHANGED mode scans the destination."
    fr: "Avec TransferMode CHANGED, DataSync compare les emplacements après la première copie complète et ne transfère que les données et métadonnées qui diffèrent. Désactiver Keep deleted files fait supprimer par DataSync, dans la destination, les objets qui n'existent plus dans la source, ce qui n'est possible que parce que le mode CHANGED analyse la destination."
  options:
    a:
      en: "Transfer all data copies everything at every run without comparing the locations, and it cannot remove deleted files from the destination."
      fr: "Transfer all data copie tout à chaque exécution sans comparer les emplacements, et ne peut pas supprimer de la destination les fichiers supprimés."
    b:
      en: "With overwriting turned off, files that change on the share are never updated in the bucket, so it would no longer be a mirror."
      fr: "Si l'écrasement est désactivé, les fichiers modifiés sur le partage ne sont jamais mis à jour dans le compartiment, qui ne serait plus un miroir."
    d:
      en: "Skipping the final verification does not delete files or limit the copy to changed data; it only removes an integrity check."
      fr: "Sauter la vérification finale ne supprime pas de fichiers et ne limite pas la copie aux données modifiées ; cela retire seulement un contrôle d'intégrité."
references:
  - title: Configuring how to handle files, objects, and metadata
    url: https://docs.aws.amazon.com/datasync/latest/userguide/configure-metadata.html
