id: soac03-1a-alarm-reboot-instance-check
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legacy application runs on a single Amazon EC2 instance with an EBS root volume. A few times each month, the operating system stops responding. During these events, `StatusCheckFailed_Instance` reports 1 and `StatusCheckFailed_System` reports 0. A reboot always fixes the problem. The operations team wants CloudWatch to fix the problem automatically.

    Which solution will meet these requirements?
  fr: |
    Une application héritée s'exécute sur une seule instance Amazon EC2 dotée d'un volume racine EBS. Quelques fois par mois, le système d'exploitation cesse de répondre. Pendant ces incidents, `StatusCheckFailed_Instance` indique 1 et `StatusCheckFailed_System` indique 0. Un redémarrage résout toujours le problème. L'équipe des opérations veut que CloudWatch résolve automatiquement le problème.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an alarm on `StatusCheckFailed_System` with the EC2 recover action.", fr: "Créer une alarme sur `StatusCheckFailed_System` avec l'action EC2 de récupération (recover)." }
    - id: b
      text: { en: "Create an alarm on `StatusCheckFailed_Instance` with the EC2 recover action.", fr: "Créer une alarme sur `StatusCheckFailed_Instance` avec l'action EC2 de récupération (recover)." }
    - id: c
      text: { en: "Create an alarm on `StatusCheckFailed_Instance` with the EC2 reboot action.", fr: "Créer une alarme sur `StatusCheckFailed_Instance` avec l'action EC2 de redémarrage (reboot)." }
    - id: d
      text: { en: "Create an EventBridge rule for EC2 instance state-change events that reboots the instance.", fr: "Créer une règle EventBridge sur les événements de changement d'état d'instance EC2 qui redémarre l'instance." }
answer: { optionId: c }
explanation:
  correct:
    en: "The instance status check detects problems in the operating system of the instance, and AWS recommends the reboot alarm action for `StatusCheckFailed_Instance`. The instance stays on the same host and keeps its IP addresses and instance store data. The recover action is reserved for system status check failures."
    fr: "La vérification de l'état de l'instance détecte les problèmes du système d'exploitation de l'instance, et AWS recommande l'action d'alarme de redémarrage pour `StatusCheckFailed_Instance`. L'instance reste sur le même hôte et conserve ses adresses IP et les données de son stockage d'instance. L'action de récupération est réservée aux échecs de la vérification de l'état du système."
  options:
    a: { en: "The system check reports 0 during the events, so this alarm never fires; recover also targets host problems, not a hung operating system.", fr: "La vérification du système indique 0 pendant les incidents : cette alarme ne se déclenche jamais, et la récupération vise les problèmes d'hôte, non un système d'exploitation bloqué." }
    b: { en: "The recover action cannot be used with `StatusCheckFailed_Instance`.", fr: "L'action de récupération ne peut pas être utilisée avec `StatusCheckFailed_Instance`." }
    d: { en: "A hung operating system does not change the instance state (it stays running), so no state-change event is emitted.", fr: "Un système d'exploitation bloqué ne change pas l'état de l'instance (elle reste en cours d'exécution) : aucun événement de changement d'état n'est émis." }
references:
  - title: Create alarms that stop, terminate, reboot, or recover an instance
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/UsingAlarmActions.html
