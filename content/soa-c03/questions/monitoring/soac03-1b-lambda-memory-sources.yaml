id: soac03-1b-lambda-memory-sources
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company configures its AWS Lambda functions with 3,008 MB of memory by default. An administrator suspects that most functions use much less memory and wants to measure the maximum memory that each function actually uses, in order to lower the memory settings.

    Which solutions will provide this information? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise configure par défaut ses fonctions AWS Lambda avec 3 008 Mo de mémoire. Un administrateur soupçonne que la plupart des fonctions utilisent beaucoup moins de mémoire et veut mesurer la mémoire maximale réellement utilisée par chaque fonction, afin de réduire les paramètres de mémoire.

    Quelles solutions fournissent cette information ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Graph the Duration metric of each function with the Maximum statistic over the last 14 days.", fr: "Représenter la métrique Duration de chaque fonction avec la statistique Maximum sur les 14 derniers jours." } }
    - { id: b, text: { en: "Run a CloudWatch Logs Insights query that filters on @type = \"REPORT\" and compares max(@maxMemoryUsed) with @memorySize.", fr: "Exécuter une requête CloudWatch Logs Insights qui filtre sur @type = \"REPORT\" et compare max(@maxMemoryUsed) à @memorySize." } }
    - { id: c, text: { en: "Graph the ConcurrentExecutions metric of each function with the Maximum statistic over the last 14 days.", fr: "Représenter la métrique ConcurrentExecutions de chaque fonction avec la statistique Maximum sur les 14 derniers jours." } }
    - { id: d, text: { en: "Enable CloudWatch Lambda Insights on the functions and review the used_memory_max and memory_utilization metrics.", fr: "Activer CloudWatch Lambda Insights sur les fonctions et examiner les métriques used_memory_max et memory_utilization." } }
    - { id: e, text: { en: "Enable CloudTrail data events for Lambda and count the Invoke events recorded for each function.", fr: "Activer les événements de données CloudTrail pour Lambda et compter les événements Invoke enregistrés pour chaque fonction." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Every invocation writes a REPORT line to CloudWatch Logs with the configured memory size and the maximum memory used, and a Logs Insights query on these fields shows how much memory is over-provisioned. Lambda Insights publishes used_memory_max and memory_utilization (memory used as a percentage of the allocated memory) as CloudWatch metrics.
    fr: |
      Chaque invocation écrit dans CloudWatch Logs une ligne REPORT avec la taille mémoire configurée et la mémoire maximale utilisée, et une requête Logs Insights sur ces champs montre la mémoire surprovisionnée. Lambda Insights publie used_memory_max et memory_utilization (mémoire utilisée en pourcentage de la mémoire allouée) comme métriques CloudWatch.
  options:
    a: { en: "Duration measures processing time, not memory use.", fr: "Duration mesure le temps de traitement, pas l'utilisation de la mémoire." }
    c: { en: "ConcurrentExecutions counts function instances that process events at the same time; it says nothing about memory.", fr: "ConcurrentExecutions compte les instances de fonction qui traitent des événements en même temps ; il n'indique rien sur la mémoire." }
    e: { en: "Data events record who invoked the function, not the memory that each invocation used.", fr: "Les événements de données enregistrent qui a invoqué la fonction, pas la mémoire utilisée par chaque invocation." }
references:
  - title: Sample queries
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-examples.html
  - title: Metrics collected by Lambda Insights
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Lambda-Insights-metrics.html
