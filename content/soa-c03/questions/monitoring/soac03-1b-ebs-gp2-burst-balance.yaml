id: soac03-1b-ebs-gp2-burst-balance
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nightly batch job reads and writes data on a 200 GiB gp2 volume attached to an Amazon EC2 instance. The job runs at normal speed for about the first 40 minutes and then slows down sharply until it finishes. The instance's CPU utilization stays below 30 % during the whole job.

    Which CloudWatch metric should an administrator examine to confirm that the volume has run out of I/O credits?
  fr: |
    Un traitement par lots nocturne lit et écrit des données sur un volume gp2 de 200 Gio attaché à une instance Amazon EC2. Le traitement s'exécute à vitesse normale pendant environ les 40 premières minutes, puis ralentit fortement jusqu'à la fin. L'utilisation du processeur de l'instance reste sous 30 % pendant tout le traitement.

    Quelle métrique CloudWatch un administrateur doit-il examiner pour confirmer que le volume a épuisé ses crédits d'E/S ?
body:
  options:
    - { id: a, text: "VolumeThroughputPercentage" }
    - { id: b, text: "CPUCreditBalance" }
    - { id: c, text: "BurstBalance" }
    - { id: d, text: "VolumeIdleTime" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A 200 GiB gp2 volume has a baseline of 600 IOPS (3 IOPS per GiB) and can burst to 3,000 IOPS by spending I/O credits. BurstBalance reports the percentage of I/O credits left in the burst bucket of gp2, st1, and sc1 volumes; when it reaches 0, the volume drops to its baseline, which matches the slowdown.
    fr: |
      Un volume gp2 de 200 Gio a une performance de base de 600 IOPS (3 IOPS par Gio) et peut monter en rafale à 3 000 IOPS en dépensant des crédits d'E/S. BurstBalance indique le pourcentage de crédits d'E/S restant dans le compartiment de rafale des volumes gp2, st1 et sc1 ; lorsqu'il atteint 0, le volume revient à sa performance de base, ce qui correspond au ralentissement.
  options:
    a: { en: "VolumeThroughputPercentage applies only to Provisioned IOPS SSD volumes.", fr: "VolumeThroughputPercentage ne s'applique qu'aux volumes SSD à IOPS provisionnées." }
    b: { en: "CPUCreditBalance tracks CPU credits of burstable instances, not I/O credits of a volume, and CPU stays low here.", fr: "CPUCreditBalance suit les crédits de processeur des instances à performances extensibles, pas les crédits d'E/S d'un volume, et le processeur reste faible ici." }
    d: { en: "VolumeIdleTime counts the seconds with no I/O; it does not show the credit balance.", fr: "VolumeIdleTime compte les secondes sans E/S ; il n'indique pas le solde de crédits." }
references:
  - title: Amazon CloudWatch metrics for Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/using_cloudwatch_ebs.html
  - title: Amazon EBS General Purpose SSD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
