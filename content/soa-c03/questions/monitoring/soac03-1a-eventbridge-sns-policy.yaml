id: soac03-1a-eventbridge-sns-policy
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer creates an Amazon EventBridge rule with the AWS CLI. The rule matches AWS Config compliance change events and targets an SNS topic that AWS CloudFormation created with the default access policy. No IAM role is set on the target, and the topic is not encrypted. The `FailedInvocations` metric of the rule increases each time a compliance change occurs, and the subscribers receive nothing.

    Which solution will fix the problem?
  fr: |
    Un ingénieur crée une règle Amazon EventBridge avec l'AWS CLI. La règle correspond aux événements de changement de conformité d'AWS Config et cible une rubrique SNS qu'AWS CloudFormation a créée avec la politique d'accès par défaut. Aucun rôle IAM n'est défini sur la cible, et la rubrique n'est pas chiffrée. La métrique `FailedInvocations` de la règle augmente à chaque changement de conformité, et les abonnés ne reçoivent rien.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - id: a
      text: { en: "Add `sns:Publish` on the topic to the IAM identity of the engineer who created the rule.", fr: "Ajouter `sns:Publish` sur la rubrique à l'identité IAM de l'ingénieur qui a créé la règle." }
    - id: b
      text: { en: "Turn on delivery status logging for the topic so that SNS accepts the messages that EventBridge sends.", fr: "Activer la journalisation de l'état de livraison de la rubrique pour que SNS accepte les messages d'EventBridge." }
    - id: c
      text: { en: "Add a statement to the topic's access policy that allows `events.amazonaws.com` to call `sns:Publish` on the topic.", fr: "Ajouter à la politique d'accès de la rubrique une déclaration qui autorise `events.amazonaws.com` à appeler `sns:Publish` sur la rubrique." }
    - id: d
      text: { en: "Replace the topic with a FIFO topic so that EventBridge can deliver the compliance events in order.", fr: "Remplacer la rubrique par une rubrique FIFO pour qu'EventBridge puisse livrer les événements de conformité dans l'ordre." }
answer: { optionId: c }
explanation:
  correct:
    en: "When no execution role is set on an SNS target, EventBridge publishes with its service principal, so the topic's resource-based policy must allow `events.amazonaws.com` to call `sns:Publish`. `FailedInvocations` counts these permanently failed deliveries."
    fr: "Quand aucun rôle d'exécution n'est défini sur une cible SNS, EventBridge publie avec son principal de service : la politique basée sur les ressources de la rubrique doit autoriser `events.amazonaws.com` à appeler `sns:Publish`. `FailedInvocations` compte ces livraisons définitivement en échec."
  options:
    a: { en: "EventBridge does not publish with the identity of the rule's creator, so the engineer's permissions do not matter.", fr: "EventBridge ne publie pas avec l'identité du créateur de la règle : les autorisations de l'ingénieur n'ont aucune importance." }
    b: { en: "Delivery status logging records deliveries to subscribers; it grants no permission to publish.", fr: "La journalisation de l'état de livraison enregistre les livraisons aux abonnés ; elle n'accorde aucune autorisation de publication." }
    d: { en: "The problem is a missing permission, not ordering; a FIFO topic still needs a policy that allows EventBridge.", fr: "Le problème est une autorisation manquante, et non l'ordre ; une rubrique FIFO a aussi besoin d'une politique qui autorise EventBridge." }
references:
  - title: Using resource-based policies for Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-use-resource-based.html
  - title: Monitoring Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-monitoring.html
