id: soac03-1c-efs-throughput-metric-math
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EFS file system uses Provisioned throughput. Users report slow file operations at peak hours. A CloudOps engineer wants to build a CloudWatch metric math expression that shows whether the file system is using all of the throughput that it is allowed to drive.

    Which two metrics should the engineer compare? (Choose two.)
  fr: |
    Un système de fichiers Amazon EFS utilise le débit Provisioned. Les utilisateurs signalent des opérations sur les fichiers lentes aux heures de pointe. Un ingénieur CloudOps veut créer une expression mathématique de métriques CloudWatch qui montre si le système de fichiers utilise tout le débit qu'il est autorisé à atteindre.

    Quelles sont les deux métriques que l'ingénieur doit comparer ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "PercentIOLimit", fr: "PercentIOLimit" } }
    - { id: b, text: { en: "MeteredIOBytes", fr: "MeteredIOBytes" } }
    - { id: c, text: { en: "ClientConnections", fr: "ClientConnections" } }
    - { id: d, text: { en: "StorageBytes", fr: "StorageBytes" } }
    - { id: e, text: { en: "PermittedThroughput", fr: "PermittedThroughput" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "PermittedThroughput is the maximum throughput that the file system can drive, and MeteredIOBytes is the metered throughput of data reads, data writes and metadata operations, with reads discounted like the throughput limit. Converting MeteredIOBytes to a rate with metric math and comparing it with PermittedThroughput shows how much of the allowed throughput is used; equal values mean the file system is at its limit."
    fr: "PermittedThroughput est le débit maximal que le système de fichiers peut atteindre, et MeteredIOBytes est le débit mesuré des lectures, écritures et opérations de métadonnées, avec la même remise sur les lectures que la limite de débit. Convertir MeteredIOBytes en débit par une expression mathématique et le comparer à PermittedThroughput montre la part du débit autorisé utilisée ; des valeurs égales signifient que le système de fichiers est à sa limite."
  options:
    a:
      en: "PercentIOLimit shows how close the file system is to the I/O limit of the General Purpose performance mode, not to its throughput limit."
      fr: "PercentIOLimit indique à quel point le système de fichiers est proche de la limite d'E/S du mode de performance General Purpose, pas de sa limite de débit."
    c:
      en: "ClientConnections counts connected clients and says nothing about the throughput used."
      fr: "ClientConnections compte les clients connectés et n'indique rien sur le débit utilisé."
    d:
      en: "StorageBytes reports the size of the file system per storage class, not its throughput."
      fr: "StorageBytes indique la taille du système de fichiers par classe de stockage, pas son débit."
references:
  - title: CloudWatch metrics for Amazon EFS
    url: https://docs.aws.amazon.com/efs/latest/ug/efs-metrics.html
