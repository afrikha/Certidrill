id: soac03-1a-trail-log-validation
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's AWS CloudTrail trail delivers log files to an Amazon S3 bucket. External auditors require the company to prove whether any log file was modified or deleted after CloudTrail delivered it.

    Which solution will meet this requirement?
  fr: |
    Le journal de suivi (trail) AWS CloudTrail d'une entreprise livre ses fichiers journaux dans un compartiment Amazon S3. Des auditeurs externes exigent que l'entreprise prouve si un fichier journal a été modifié ou supprimé après sa livraison par CloudTrail.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Encrypt the log files with SSE-KMS and audit the use of the key.", fr: "Chiffrer les fichiers journaux avec SSE-KMS et auditer l'utilisation de la clé." }
    - id: b
      text: { en: "Configure the trail to also deliver the events to CloudWatch Logs.", fr: "Configurer le journal de suivi pour livrer aussi les événements à CloudWatch Logs." }
    - id: c
      text: { en: "Turn on log file integrity validation and run `aws cloudtrail validate-logs`.", fr: "Activer la validation de l'intégrité des fichiers journaux et exécuter `aws cloudtrail validate-logs`." }
    - id: d
      text: { en: "Turn on CloudTrail Insights for the API error rate on the trail.", fr: "Activer CloudTrail Insights pour le taux d'erreurs d'API sur le journal de suivi." }
answer: { optionId: c }
explanation:
  correct:
    en: "With log file integrity validation, CloudTrail hashes every log file and delivers an hourly digest file that is signed and chained to the previous digest. The AWS CLI `validate-logs` command uses the digests to report whether each log file is unchanged, modified or deleted."
    fr: "Avec la validation de l'intégrité des fichiers journaux, CloudTrail calcule le hachage de chaque fichier journal et livre toutes les heures un fichier de synthèse signé et chaîné au précédent. La commande AWS CLI `validate-logs` utilise ces fichiers de synthèse pour indiquer si chaque fichier journal est inchangé, modifié ou supprimé."
  options:
    a: { en: "Encryption protects confidentiality; it does not prove that a file was not replaced or deleted.", fr: "Le chiffrement protège la confidentialité ; il ne prouve pas qu'un fichier n'a pas été remplacé ou supprimé." }
    b: { en: "A second copy in CloudWatch Logs does not prove the integrity of the files in the S3 bucket.", fr: "Une seconde copie dans CloudWatch Logs ne prouve pas l'intégrité des fichiers du compartiment S3." }
    d: { en: "Insights detects unusual API error rates; it does not check log files.", fr: "Insights détecte les taux d'erreurs d'API inhabituels ; il ne vérifie pas les fichiers journaux." }
references:
  - title: Validating CloudTrail log file integrity
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
