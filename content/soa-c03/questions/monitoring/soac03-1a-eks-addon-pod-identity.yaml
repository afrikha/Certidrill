id: soac03-1a-eks-addon-pod-identity
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is installing the Amazon CloudWatch Observability EKS add-on on an Amazon EKS cluster that already runs the EKS Pod Identity Agent. The security team requires that only the CloudWatch agent pods receive permissions to send metrics and logs to CloudWatch. The other pods that run on the same nodes must not receive these permissions. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise installe le module complémentaire EKS Amazon CloudWatch Observability sur un cluster Amazon EKS qui exécute déjà l'agent EKS Pod Identity. L'équipe de sécurité exige que seuls les pods de l'agent CloudWatch reçoivent les autorisations d'envoyer des métriques et des journaux à CloudWatch. Les autres pods qui s'exécutent sur les mêmes nœuds ne doivent pas recevoir ces autorisations. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach `CloudWatchAgentServerPolicy` to the IAM role of the worker nodes, and then create the add-on.", fr: "Attacher `CloudWatchAgentServerPolicy` au rôle IAM des nœuds de travail, puis créer le module complémentaire." }
    - id: b
      text: { en: "Create the add-on with a Pod Identity association for the `cloudwatch-agent` service account and a role that has `CloudWatchAgentServerPolicy`.", fr: "Créer le module complémentaire avec une association Pod Identity pour le compte de service `cloudwatch-agent` et un rôle doté de `CloudWatchAgentServerPolicy`." }
    - id: c
      text: { en: "Attach `CloudWatchAgentServerPolicy` to the IAM role of the EKS cluster, and then create the add-on.", fr: "Attacher `CloudWatchAgentServerPolicy` au rôle IAM du cluster EKS, puis créer le module complémentaire." }
    - id: d
      text: { en: "Create an IAM user with `CloudWatchAgentServerPolicy`, and store its access keys in a Kubernetes secret that the agent reads.", fr: "Créer un utilisateur IAM avec `CloudWatchAgentServerPolicy` et stocker ses clés d'accès dans un secret Kubernetes que l'agent lit." }
answer: { optionId: b }
explanation:
  correct:
    en: "EKS Pod Identity, the recommended option for recent versions of the add-on, gives the role only to pods that use the associated service account. Passing `--pod-identity-associations serviceAccount=cloudwatch-agent,roleArn=...` to `aws eks create-addon` sets this up in one step, with no OIDC provider or secret to manage."
    fr: "EKS Pod Identity, l'option recommandée pour les versions récentes du module complémentaire, n'attribue le rôle qu'aux pods qui utilisent le compte de service associé. Passer `--pod-identity-associations serviceAccount=cloudwatch-agent,roleArn=...` à `aws eks create-addon` configure cela en une seule étape, sans fournisseur OIDC ni secret à gérer."
  options:
    a: { en: "Permissions on the node role are available to every pod on the nodes, which the security team forbids.", fr: "Les autorisations du rôle des nœuds sont accessibles à tous les pods des nœuds, ce que l'équipe de sécurité interdit." }
    c: { en: "The cluster IAM role is used by the EKS control plane; pods do not receive its permissions.", fr: "Le rôle IAM du cluster est utilisé par le plan de contrôle EKS ; les pods ne reçoivent pas ses autorisations." }
    d: { en: "Long-term access keys must be stored, protected and rotated, which adds risk and operational work.", fr: "Des clés d'accès à long terme doivent être stockées, protégées et renouvelées, ce qui ajoute des risques et du travail opérationnel." }
references:
  - title: Install the CloudWatch agent with the Amazon CloudWatch Observability EKS add-on or the Helm chart
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Observability-EKS-addon.html
