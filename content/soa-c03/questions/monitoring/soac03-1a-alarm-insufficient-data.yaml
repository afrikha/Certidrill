id: soac03-1a-alarm-insufficient-data
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An administrator creates a CloudWatch alarm in the us-east-1 Region on the `Invocations` metric of the `AWS/Lambda` namespace, with the dimension `FunctionName` set to `orders-api`. The alarm must detect when the function stops receiving traffic. The function is invoked every few seconds, but the alarm has stayed in the INSUFFICIENT_DATA state since it was created.

    Which two issues could cause this behavior? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur crée dans la Région us-east-1 une alarme CloudWatch sur la métrique `Invocations` de l'espace de noms `AWS/Lambda`, avec la dimension `FunctionName` définie à `orders-api`. L'alarme doit détecter l'arrêt du trafic de la fonction. La fonction est invoquée toutes les quelques secondes, mais l'alarme reste à l'état INSUFFICIENT_DATA depuis sa création.

    Quelles sont les deux causes possibles de ce comportement ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The email subscription of the alarm's SNS topic has not been confirmed.", fr: "L'abonnement e-mail de la rubrique SNS de l'alarme n'a pas été confirmé." } }
    - { id: b, text: { en: "The function is deployed in the eu-west-1 Region.", fr: "La fonction est déployée dans la Région eu-west-1." } }
    - { id: c, text: { en: "The actions of the alarm are disabled.", fr: "Les actions de l'alarme sont désactivées." } }
    - { id: d, text: { en: "The name of the function is `orders-api-prod`.", fr: "Le nom de la fonction est `orders-api-prod`." } }
    - { id: e, text: { en: "The threshold is higher than any value that the metric reports.", fr: "Le seuil est supérieur à toutes les valeurs que la métrique indique." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "An alarm watches exactly one metric, identified by its Region, namespace, name and dimensions. Alarms do not support cross-Region metrics, so an alarm in us-east-1 receives no data for a function in eu-west-1. A dimension value that does not match the real function name points to a metric that has no data. In both cases the evaluation range is empty and the alarm stays in INSUFFICIENT_DATA."
    fr: "Une alarme surveille exactement une métrique, identifiée par sa Région, son espace de noms, son nom et ses dimensions. Les alarmes ne prennent pas en charge les métriques d'une autre Région : une alarme de us-east-1 ne reçoit aucune donnée pour une fonction de eu-west-1. Une valeur de dimension qui ne correspond pas au vrai nom de la fonction désigne une métrique sans données. Dans les deux cas, la plage d'évaluation est vide et l'alarme reste à INSUFFICIENT_DATA."
  options:
    a: { en: "Subscriptions affect the delivery of notifications, not the state that the alarm computes.", fr: "Les abonnements concernent la livraison des notifications, et non l'état calculé par l'alarme." }
    c: { en: "Disabled actions stop the notifications, but the alarm still evaluates and changes state.", fr: "Des actions désactivées empêchent les notifications, mais l'alarme est toujours évaluée et change d'état." }
    e: { en: "With data and a threshold that is never crossed, the alarm would be in a definite state (OK or ALARM, depending on the operator), not INSUFFICIENT_DATA.", fr: "Avec des données et un seuil jamais franchi, l'alarme serait dans un état déterminé (OK ou ALARM selon l'opérateur), et non à INSUFFICIENT_DATA." }
references:
  - title: Cross-account cross-Region CloudWatch console
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Cross-Account-Cross-Region.html
  - title: Configuring how CloudWatch alarms treat missing data
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-missing-data.html
