id: soac03-1a-s3-sns-standard-region
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company wants an Amazon S3 bucket in the eu-west-1 Region to send a notification to Amazon SNS each time an object is created. An administrator tries to add an event notification to the bucket that targets an existing FIFO topic, `uploads.fifo`, in the us-east-1 Region. The topic has its default access policy. The request fails, and the notification configuration is not saved.

    Which combination of actions will meet the requirement? (Choose two.)
  fr: |
    Une entreprise veut qu'un compartiment Amazon S3 de la Région eu-west-1 envoie une notification à Amazon SNS chaque fois qu'un objet est créé. Un administrateur essaie d'ajouter au compartiment une notification d'événement qui cible une rubrique FIFO existante, `uploads.fifo`, dans la Région us-east-1. La rubrique a sa politique d'accès par défaut. La requête échoue et la configuration de notification n'est pas enregistrée.

    Quelle combinaison d'actions répond à cette exigence ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on content-based deduplication on the `uploads.fifo` topic.", fr: "Activer la déduplication basée sur le contenu sur la rubrique `uploads.fifo`." } }
    - { id: b, text: { en: "Create a Standard SNS topic in eu-west-1 and use it as the destination.", fr: "Créer une rubrique SNS standard dans eu-west-1 et l'utiliser comme destination." } }
    - { id: c, text: { en: "Add a bucket policy that allows `sns.amazonaws.com` to call `s3:GetObject` on the bucket.", fr: "Ajouter une politique de compartiment qui autorise `sns.amazonaws.com` à appeler `s3:GetObject` sur le compartiment." } }
    - { id: d, text: { en: "Encrypt the destination topic with the AWS managed key `aws/sns`.", fr: "Chiffrer la rubrique de destination avec la clé gérée par AWS `aws/sns`." } }
    - { id: e, text: { en: "Add a statement to the topic's access policy that allows `s3.amazonaws.com` to publish, with the bucket ARN as `aws:SourceArn`.", fr: "Ajouter à la politique d'accès de la rubrique une déclaration qui autorise `s3.amazonaws.com` à publier, avec l'ARN du compartiment comme `aws:SourceArn`." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "S3 event notifications support only Standard SNS topics, not FIFO topics, and the topic must be in the same Region as the bucket. S3 must also be allowed to publish: the topic's access policy needs a statement for the `s3.amazonaws.com` principal with `SNS:Publish`, scoped with `aws:SourceArn` and `aws:SourceAccount`."
    fr: "Les notifications d'événements S3 ne prennent en charge que les rubriques SNS standard, et non les rubriques FIFO, et la rubrique doit être dans la même Région que le compartiment. S3 doit aussi être autorisé à publier : la politique d'accès de la rubrique doit contenir une déclaration pour le principal `s3.amazonaws.com` avec `SNS:Publish`, limitée par `aws:SourceArn` et `aws:SourceAccount`."
  options:
    a: { en: "Deduplication does not make a FIFO topic a supported S3 destination, and the topic would still be in another Region.", fr: "La déduplication ne fait pas d'une rubrique FIFO une destination S3 prise en charge, et la rubrique serait toujours dans une autre Région." }
    c: { en: "SNS does not read the bucket; S3 needs permission to publish to the topic, which is granted in the topic's policy.", fr: "SNS ne lit pas le compartiment ; c'est S3 qui doit être autorisé à publier dans la rubrique, ce qui s'accorde dans la politique de la rubrique." }
    d: { en: "AWS services cannot use the `aws/sns` key to publish to an encrypted topic; a customer managed key would be needed if encryption were required.", fr: "Les services AWS ne peuvent pas utiliser la clé `aws/sns` pour publier dans une rubrique chiffrée ; une clé gérée par le client serait nécessaire si le chiffrement était exigé." }
references:
  - title: Event notification types and destinations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-event-types-and-destinations.html
  - title: Granting permissions to publish event notification messages to a destination
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/grant-destinations-permissions-to-s3.html
