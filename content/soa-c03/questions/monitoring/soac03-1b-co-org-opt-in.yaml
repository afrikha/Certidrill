id: soac03-1b-co-org-opt-in
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 40 AWS accounts in an organization in AWS Organizations with all features enabled. The cloud operations team wants AWS Compute Optimizer to analyze the resources of every account in the organization, with the LEAST administrative effort.

    What should the team do?
  fr: |
    Une entreprise possède 40 comptes AWS dans une organisation AWS Organizations dont toutes les fonctionnalités sont activées. L'équipe des opérations cloud veut qu'AWS Compute Optimizer analyse les ressources de tous les comptes de l'organisation, avec le MOINS d'effort administratif.

    Que doit faire l'équipe ?
body:
  options:
    - { id: a, text: { en: "Sign in to each member account and opt in to Compute Optimizer for that account only.", fr: "Se connecter à chaque compte membre et inscrire ce seul compte à Compute Optimizer." } }
    - { id: b, text: { en: "Activate cost allocation tags in the management account so that Compute Optimizer can find the member accounts.", fr: "Activer des balises de répartition des coûts dans le compte de gestion pour que Compute Optimizer trouve les comptes membres." } }
    - { id: c, text: { en: "From the management account, opt in to Compute Optimizer for the management account and all member accounts.", fr: "Depuis le compte de gestion, inscrire à Compute Optimizer le compte de gestion et tous les comptes membres." } }
    - { id: d, text: { en: "Create an SCP that allows compute-optimizer:* actions and attach it to the organization root.", fr: "Créer une SCP qui autorise les actions compute-optimizer:* et l'attacher à la racine de l'organisation." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Compute Optimizer requires an opt-in. From the management account, you can opt in only that account or the management account and all member accounts; the second option needs all features enabled in Organizations and turns on trusted access for Compute Optimizer. One action covers the 40 accounts.
    fr: |
      Compute Optimizer exige une inscription (opt-in). Depuis le compte de gestion, vous pouvez inscrire ce seul compte, ou le compte de gestion et tous les comptes membres ; la seconde option exige que toutes les fonctionnalités d'Organizations soient activées et active l'accès approuvé (trusted access) pour Compute Optimizer. Une seule action couvre les 40 comptes.
  options:
    a: { en: "Opting in account by account works but repeats the task 40 times, and member opt-ins analyze only their own account.", fr: "L'inscription compte par compte fonctionne, mais répète la tâche 40 fois, et l'inscription d'un compte membre n'analyse que ce compte." }
    b: { en: "Cost allocation tags are for billing reports; they do not opt accounts in to Compute Optimizer.", fr: "Les balises de répartition des coûts servent aux rapports de facturation ; elles n'inscrivent pas de comptes à Compute Optimizer." }
    d: { en: "SCPs only limit the maximum permissions in accounts; they do not opt accounts in to a service.", fr: "Les SCP ne font que limiter les autorisations maximales des comptes ; elles n'inscrivent pas de comptes à un service." }
references:
  - title: Getting started with AWS Compute Optimizer
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/getting-started.html
