id: soac03-1c-efs-lifecycle-first-access
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon EFS file system with a lifecycle policy that moves files to EFS Infrequent Access (IA) after 30 days without access. Once a quarter, a latency-sensitive reporting application reads thousands of small old files several times during the same week, and users complain that these repeated reads are slow. The company wants to keep the storage savings for the files that are not read.

    Which change will meet these requirements?
  fr: |
    Une entreprise utilise un système de fichiers Amazon EFS avec une politique de cycle de vie qui déplace les fichiers vers EFS Infrequent Access (IA) après 30 jours sans accès. Une fois par trimestre, une application de rapports sensible à la latence lit des milliers de petits fichiers anciens plusieurs fois au cours de la même semaine, et les utilisateurs se plaignent de la lenteur de ces lectures répétées. L'entreprise veut conserver les économies de stockage pour les fichiers qui ne sont pas lus.

    Quelle modification répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set Transition into IA to None so that all files stay in EFS Standard.", fr: "Définir Transition into IA sur None pour que tous les fichiers restent dans EFS Standard." } }
    - { id: b, text: { en: "Switch the file system from Elastic throughput to Provisioned throughput.", fr: "Faire passer le système de fichiers du débit Elastic au débit Provisioned." } }
    - { id: c, text: { en: "Set Transition into Standard to On first access so that files read from IA move back to EFS Standard.", fr: "Définir Transition into Standard sur On first access pour que les fichiers lus dans IA reviennent dans EFS Standard." } }
    - { id: d, text: { en: "Add a Transition into Archive policy of 90 days so that old files leave IA sooner.", fr: "Ajouter une politique Transition into Archive de 90 jours pour que les anciens fichiers quittent IA plus tôt." } }
answer: { optionId: c }
explanation:
  correct:
    en: "By default, files that are read in IA stay in IA, so every read pays the higher first-byte latency of that class. Setting Transition into Standard to On first access (AFTER_1_ACCESS) moves a file back to EFS Standard when it is first read, so the following reads of the same week are served at Standard latency, while unread files stay in IA."
    fr: "Par défaut, les fichiers lus dans IA restent dans IA : chaque lecture subit la latence du premier octet plus élevée de cette classe. Définir Transition into Standard sur On first access (AFTER_1_ACCESS) ramène un fichier dans EFS Standard à sa première lecture : les lectures suivantes de la semaine sont servies avec la latence de Standard, tandis que les fichiers non lus restent dans IA."
  options:
    a:
      en: "Keeping every file in EFS Standard removes the latency problem but also removes the savings for files that are never read."
      fr: "Garder tous les fichiers dans EFS Standard supprime le problème de latence mais aussi les économies sur les fichiers jamais lus."
    b:
      en: "The slowness comes from the latency of the IA storage class, not from a throughput limit."
      fr: "La lenteur vient de la latence de la classe de stockage IA, pas d'une limite de débit."
    d:
      en: "EFS Archive has a latency similar to IA and a 90-day minimum storage duration, so the repeated reads would not be faster."
      fr: "EFS Archive a une latence semblable à IA et une durée de stockage minimale de 90 jours : les lectures répétées ne seraient pas plus rapides."
references:
  - title: Managing storage lifecycle
    url: https://docs.aws.amazon.com/efs/latest/ug/lifecycle-management-efs.html
  - title: Configuring lifecycle policies
    url: https://docs.aws.amazon.com/efs/latest/ug/enable-lifecycle-management.html
