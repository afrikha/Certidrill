id: soac03-1b-eb-iam-us-east-1
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs all its workloads in the eu-west-1 Region. An administrator creates an Amazon EventBridge rule on the default event bus in eu-west-1 that matches AWS API Call via CloudTrail events with the eventName CreateAccessKey from the source aws.iam. The target is an Amazon SNS topic in eu-west-1.

    A multi-Region CloudTrail trail is logging, and new access keys are created regularly, but the rule never runs.

    What should the administrator do to receive the notifications?
  fr: |
    Une entreprise exécute toutes ses charges de travail dans la Région eu-west-1. Un administrateur crée une règle Amazon EventBridge sur le bus d'événements par défaut de eu-west-1, qui correspond aux événements AWS API Call via CloudTrail ayant l'eventName CreateAccessKey et la source aws.iam. La cible est une rubrique Amazon SNS de eu-west-1.

    Un journal de suivi CloudTrail multi-Région enregistre les événements et de nouvelles clés d'accès sont créées régulièrement, mais la règle ne s'exécute jamais.

    Que doit faire l'administrateur pour recevoir les notifications ?
body:
  options:
    - { id: a, text: { en: "Create the rule in the us-east-1 Region, because events from global services such as IAM appear only in that Region.", fr: "Créer la règle dans la Région us-east-1, car les événements des services globaux comme IAM n'apparaissent que dans cette Région." } }
    - { id: b, text: { en: "Change the source of the pattern to iam.amazonaws.com, because IAM events use the service endpoint as their source.", fr: "Remplacer la source du modèle par iam.amazonaws.com, car les événements IAM utilisent le point de terminaison du service comme source." } }
    - { id: c, text: { en: "Turn on IAM data events in the trail, because access key creation is logged as a data event.", fr: "Activer les événements de données IAM dans le journal de suivi, car la création de clés d'accès est enregistrée comme événement de données." } }
    - { id: d, text: { en: "Create a second trail in eu-west-1 that is limited to that Region, because multi-Region trails do not send events to EventBridge.", fr: "Créer un second journal de suivi limité à eu-west-1, car les journaux de suivi multi-Région n'envoient pas d'événements à EventBridge." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Global services such as IAM and Route 53 are available only in US East (N. Virginia), so their CloudTrail API call events appear only in us-east-1. A rule in eu-west-1 never sees them. Creating the rule in us-east-1 fixes the issue; that rule can notify a topic in us-east-1 or forward the events to a bus in another Region.
    fr: |
      Les services globaux comme IAM et Route 53 ne sont disponibles que dans US East (N. Virginia) : leurs événements d'appels d'API CloudTrail n'apparaissent que dans us-east-1. Une règle de eu-west-1 ne les voit jamais. Créer la règle dans us-east-1 résout le problème ; cette règle peut avertir une rubrique de us-east-1 ou transférer les événements vers un bus d'une autre Région.
  options:
    b: { en: "The source of these events is aws.iam; iam.amazonaws.com is the eventSource value inside the detail object.", fr: "La source de ces événements est aws.iam ; iam.amazonaws.com est la valeur d'eventSource dans l'objet detail." }
    c: { en: "CreateAccessKey changes a resource, so it is a write management event that rules in the ENABLED state can match.", fr: "CreateAccessKey modifie une ressource : c'est un événement de gestion en écriture que les règles à l'état ENABLED peuvent prendre en compte." }
    d: { en: "The existing trail already records the events; the problem is the Region in which the events appear.", fr: "Le journal de suivi existant enregistre déjà les événements ; le problème est la Région dans laquelle les événements apparaissent." }
references:
  - title: Troubleshooting Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-troubleshooting.html
