id: soac03-1a-dash-metrics-insights-top
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs several hundred Amazon EC2 instances in Auto Scaling groups that replace instances many times each day. The operations team wants a dashboard widget that always shows the 10 instances with the highest CPU utilization. New instances must appear in the widget without anyone editing the dashboard.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute plusieurs centaines d'instances Amazon EC2 dans des groupes Auto Scaling qui remplacent des instances plusieurs fois par jour. L'équipe des opérations veut un widget de tableau de bord qui affiche toujours les 10 instances dont l'utilisation du processeur est la plus élevée. Les nouvelles instances doivent apparaître dans le widget sans que personne ne modifie le tableau de bord.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a metric widget that lists the `CPUUtilization` metric of each current instance by instance ID, sorted by maximum value.", fr: "Ajouter un widget de métrique qui liste la métrique `CPUUtilization` de chaque instance actuelle par ID d'instance, triée par valeur maximale." }
    - id: b
      text: { en: "Add an alarm widget with one CPU alarm for each instance of the groups, sorted by the time of the last state change.", fr: "Ajouter un widget d'alarmes avec une alarme de processeur par instance des groupes, triées par heure du dernier changement d'état." }
    - id: c
      text: { en: "Add a metric widget with the query `SELECT MAX(CPUUtilization) FROM SCHEMA(\"AWS/EC2\", InstanceId) GROUP BY InstanceId ORDER BY MAX() DESC LIMIT 10`.", fr: "Ajouter un widget de métrique avec la requête `SELECT MAX(CPUUtilization) FROM SCHEMA(\"AWS/EC2\", InstanceId) GROUP BY InstanceId ORDER BY MAX() DESC LIMIT 10`." }
    - id: d
      text: { en: "Add a gauge widget on the `CPUUtilization` metric with the `AutoScalingGroupName` dimension of each group, from 0 to 100.", fr: "Ajouter un widget de jauge sur la métrique `CPUUtilization` avec la dimension `AutoScalingGroupName` de chaque groupe, de 0 à 100." }
answer: { optionId: c }
explanation:
  correct:
    en: "A Metrics Insights query is evaluated each time the widget refreshes, so it includes whatever instances exist at that time. `GROUP BY InstanceId` returns one series per instance, and `ORDER BY ... LIMIT 10` keeps the top 10, which is the documented way to build top-N views."
    fr: "Une requête Metrics Insights est évaluée à chaque actualisation du widget : elle inclut toutes les instances qui existent à ce moment-là. `GROUP BY InstanceId` renvoie une série par instance, et `ORDER BY ... LIMIT 10` conserve les 10 premières, ce qui est la façon documentée de créer des vues top N."
  options:
    a: { en: "A static list of instance IDs must be edited every time instances are replaced.", fr: "Une liste statique d'ID d'instance doit être modifiée chaque fois que des instances sont remplacées." }
    b: { en: "Per-instance alarms must be created for each new instance, and an alarm list does not rank instances by CPU.", fr: "Des alarmes par instance doivent être créées pour chaque nouvelle instance, et une liste d'alarmes ne classe pas les instances par processeur." }
    d: { en: "Group-level CPU is an aggregate of each group; it does not show individual instances.", fr: "Le processeur au niveau d'un groupe est un agrégat du groupe ; il n'affiche pas les instances individuelles." }
references:
  - title: Query your CloudWatch metrics with CloudWatch Metrics Insights
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/query_with_cloudwatch-metrics-insights.html
