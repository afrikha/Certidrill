id: soac03-1a-agent-drop-original
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs 400 Amazon EC2 instances in several Auto Scaling groups. The CloudWatch agent on every instance uses this `metrics` section:

    ```json
    "metrics": {
      "append_dimensions": {
        "AutoScalingGroupName": "${aws:AutoScalingGroupName}",
        "InstanceId": "${aws:InstanceId}"
      },
      "aggregation_dimensions": [["AutoScalingGroupName"]],
      "metrics_collected": {
        "mem": { "measurement": ["mem_used_percent"] },
        "disk": { "measurement": ["used_percent"], "resources": ["/"] }
      }
    }
    ```

    The dashboards and alarms use only the group-level series. The CloudWatch bill shows thousands of per-instance custom metrics. The company wants to reduce the number of custom metrics and keep the group-level series.

    Which change will meet these requirements?
  fr: |
    Une entreprise exploite 400 instances Amazon EC2 dans plusieurs groupes Auto Scaling. L'agent CloudWatch de chaque instance utilise cette section `metrics` :

    ```json
    "metrics": {
      "append_dimensions": {
        "AutoScalingGroupName": "${aws:AutoScalingGroupName}",
        "InstanceId": "${aws:InstanceId}"
      },
      "aggregation_dimensions": [["AutoScalingGroupName"]],
      "metrics_collected": {
        "mem": { "measurement": ["mem_used_percent"] },
        "disk": { "measurement": ["used_percent"], "resources": ["/"] }
      }
    }
    ```

    Les tableaux de bord et les alarmes n'utilisent que les séries au niveau des groupes. La facture CloudWatch fait apparaître des milliers de métriques personnalisées par instance. L'entreprise veut réduire le nombre de métriques personnalisées tout en conservant les séries au niveau des groupes.

    Quelle modification répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add `drop_original_metrics` to the `mem` and `disk` collectors with the names of the two metrics.", fr: "Ajouter `drop_original_metrics` aux collecteurs `mem` et `disk` avec le nom des deux métriques." }
    - id: b
      text: { en: "Remove the `append_dimensions` block so that the agent stops adding the `InstanceId` dimension.", fr: "Supprimer le bloc `append_dimensions` pour que l'agent cesse d'ajouter la dimension `InstanceId`." }
    - id: c
      text: { en: "Set `metrics_collection_interval` to 300 seconds in the `agent` section of the configuration.", fr: "Définir `metrics_collection_interval` à 300 secondes dans la section `agent` de la configuration." }
    - id: d
      text: { en: "Replace the value of `aggregation_dimensions` with `[[]]` so that the agent aggregates all the dimensions.", fr: "Remplacer la valeur de `aggregation_dimensions` par `[[]]` pour que l'agent agrège toutes les dimensions." }
answer: { optionId: a }
explanation:
  correct:
    en: "By default, the agent sends the original metrics with all their dimensions in addition to the series that `aggregation_dimensions` produces. `drop_original_metrics` stops the original per-instance series of the listed metrics while the agent still publishes the aggregated `AutoScalingGroupName` series, which reduces the number of custom metrics."
    fr: "Par défaut, l'agent envoie les métriques d'origine avec toutes leurs dimensions, en plus des séries produites par `aggregation_dimensions`. `drop_original_metrics` supprime les séries d'origine par instance des métriques indiquées, tandis que l'agent publie toujours les séries agrégées par `AutoScalingGroupName`, ce qui réduit le nombre de métriques personnalisées."
  options:
    b: { en: "Without `append_dimensions` the agent no longer adds `AutoScalingGroupName`, so the group-level aggregation is lost, and the per-host series are still published.", fr: "Sans `append_dimensions`, l'agent n'ajoute plus `AutoScalingGroupName` : l'agrégation par groupe est perdue et des séries par hôte sont toujours publiées." }
    c: { en: "A longer interval sends fewer data points but keeps exactly the same number of custom metrics.", fr: "Un intervalle plus long envoie moins de points de données, mais conserve exactement le même nombre de métriques personnalisées." }
    d: { en: "An empty dimension list aggregates across every instance of every group, so the per-group series are lost.", fr: "Une liste de dimensions vide agrège toutes les instances de tous les groupes : les séries par groupe sont perdues." }
references:
  - title: Manually create or edit the CloudWatch agent configuration file
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
