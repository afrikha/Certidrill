id: soac03-1b-ec2-detailed-monitoring
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Users of an application that runs on Amazon EC2 instances report freezes that last 1–2 minutes. The CloudWatch graphs of CPUUtilization for the instances show 5-minute data points only, and the short peaks are not visible. The instances use the default monitoring settings.

    An administrator needs CPUUtilization data points at a 1-minute period, without installing software on the instances.

    What should the administrator do?
  fr: |
    Les utilisateurs d'une application qui s'exécute sur des instances Amazon EC2 signalent des blocages de 1 à 2 minutes. Les graphiques CloudWatch de CPUUtilization des instances ne montrent que des points de données à 5 minutes, et les pics courts ne sont pas visibles. Les instances utilisent les paramètres de surveillance par défaut.

    Un administrateur a besoin de points de données CPUUtilization sur une période de 1 minute, sans installer de logiciel sur les instances.

    Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Change the period of the CloudWatch dashboard graphs to 1 minute.", fr: "Passer la période des graphiques du tableau de bord CloudWatch à 1 minute." } }
    - { id: b, text: { en: "Activate the enhanced infrastructure metrics preference in AWS Compute Optimizer.", fr: "Activer la préférence enhanced infrastructure metrics dans AWS Compute Optimizer." } }
    - { id: c, text: { en: "Enable detailed monitoring on the instances with the aws ec2 monitor-instances command.", fr: "Activer la surveillance détaillée des instances avec la commande aws ec2 monitor-instances." } }
    - { id: d, text: { en: "Create a CloudWatch anomaly detection model for the CPUUtilization metric.", fr: "Créer un modèle de détection d'anomalies CloudWatch pour la métrique CPUUtilization." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With basic monitoring, default EC2 metrics other than status checks are published in 5-minute periods at no charge. Detailed monitoring publishes the default instance metrics in 1-minute periods, for a charge. It can be enabled on a running instance with the monitor-instances command and needs no agent.
    fr: |
      Avec la surveillance de base, les métriques EC2 par défaut autres que les vérifications d'état sont publiées sur des périodes de 5 minutes, sans frais. La surveillance détaillée publie les métriques d'instance par défaut sur des périodes de 1 minute, moyennant des frais. Elle s'active sur une instance en cours d'exécution avec la commande monitor-instances et ne nécessite pas d'agent.
  options:
    a: { en: "A graph cannot show data points more often than the instance publishes them.", fr: "Un graphique ne peut pas afficher des points de données plus souvent que l'instance ne les publie." }
    b: { en: "Enhanced infrastructure metrics extends the Compute Optimizer lookback period; it does not change the metric period.", fr: "Enhanced infrastructure metrics allonge la période d'analyse de Compute Optimizer ; il ne change pas la période des métriques." }
    d: { en: "Anomaly detection models the existing data; it does not create 1-minute data points.", fr: "La détection d'anomalies modélise les données existantes ; elle ne crée pas de points de données à 1 minute." }
references:
  - title: Manage detailed monitoring for your EC2 instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/manage-detailed-monitoring.html
