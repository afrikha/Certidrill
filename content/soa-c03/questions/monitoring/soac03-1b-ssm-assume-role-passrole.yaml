id: soac03-1b-ssm-assume-role-passrole
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has a custom Automation runbook that stops Amazon EC2 instances, creates snapshots of their volumes, and starts the instances again. Junior operators must be able to run the runbook, but the security team does not allow them to have any direct Amazon EC2 permissions. When an operator runs the runbook today, the first step fails with an AccessDenied error.

    Which combination of steps will meet these requirements while following the principle of least privilege? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise dispose d'un runbook Automation personnalisé qui arrête des instances Amazon EC2, crée des instantanés de leurs volumes et redémarre les instances. Des opérateurs juniors doivent pouvoir exécuter le runbook, mais l'équipe de sécurité ne les autorise à avoir aucune autorisation Amazon EC2 directe. Aujourd'hui, lorsqu'un opérateur exécute le runbook, la première étape échoue avec une erreur AccessDenied.

    Quelle combinaison d'étapes répond à ces exigences tout en respectant le principe du moindre privilège ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach the AmazonEC2FullAccess managed policy to the operators' IAM group so that every runbook step succeeds.", fr: "Attacher la politique gérée AmazonEC2FullAccess au groupe IAM des opérateurs pour que chaque étape du runbook réussisse." } }
    - { id: b, text: { en: "Create an IAM service role that ssm.amazonaws.com can assume, with only the EC2 actions that the runbook needs, and pass its ARN in the AutomationAssumeRole parameter.", fr: "Créer un rôle de service IAM que ssm.amazonaws.com peut endosser, avec uniquement les actions EC2 dont le runbook a besoin, et transmettre son ARN dans le paramètre AutomationAssumeRole." } }
    - { id: c, text: { en: "Add the EC2 actions that the runbook needs to the instance profile role that is attached to the target instances.", fr: "Ajouter les actions EC2 dont le runbook a besoin au rôle du profil d'instance attaché aux instances cibles." } }
    - { id: d, text: { en: "Grant the operators ssm:StartAutomationExecution and iam:PassRole on the Automation service role only.", fr: "Accorder aux opérateurs ssm:StartAutomationExecution et iam:PassRole uniquement sur le rôle de service Automation." } }
    - { id: e, text: { en: "Create an IAM role that ec2.amazonaws.com can assume and attach it to the runbook through its document permissions.", fr: "Créer un rôle IAM que ec2.amazonaws.com peut endosser et l'attacher au runbook par ses autorisations de document." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Without an assume role, Automation runs with the permissions of the user who starts it, which explains the AccessDenied error. A service role trusted by ssm.amazonaws.com and passed in AutomationAssumeRole lets the runbook act with elevated permissions that the operators do not have. To pass that role to the service, the operators need iam:PassRole on it, plus the permission to start automations.
    fr: |
      Sans rôle à endosser, Automation s'exécute avec les autorisations de l'utilisateur qui la lance, ce qui explique l'erreur AccessDenied. Un rôle de service approuvé par ssm.amazonaws.com et transmis dans AutomationAssumeRole permet au runbook d'agir avec des autorisations élevées que les opérateurs n'ont pas. Pour transmettre ce rôle au service, les opérateurs ont besoin de iam:PassRole sur ce rôle, ainsi que de l'autorisation de lancer des automatisations.
  options:
    a: { en: "This gives the operators direct EC2 permissions, which the security team forbids, and far more than the runbook needs.", fr: "Cela donne aux opérateurs des autorisations EC2 directes, ce que l'équipe de sécurité interdit, et bien plus que ce dont le runbook a besoin." }
    c: { en: "The instance profile is used by software on the instance; Automation API calls such as StopInstances use the caller or the assume role.", fr: "Le profil d'instance est utilisé par les logiciels de l'instance ; les appels d'API d'Automation comme StopInstances utilisent l'appelant ou le rôle à endosser." }
    e: { en: "Automation assumes roles trusted by ssm.amazonaws.com, and document permissions share runbooks with accounts; they do not attach roles.", fr: "Automation endosse des rôles approuvés par ssm.amazonaws.com, et les autorisations de document partagent des runbooks avec des comptes ; elles n'attachent pas de rôles." }
references:
  - title: Setting up Automation
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-setup.html
  - title: Grant a user permissions to pass a role to an AWS service
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html
