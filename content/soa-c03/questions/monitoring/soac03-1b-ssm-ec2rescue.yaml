id: soac03-1b-ssm-ec2rescue
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    After an operating system update, an Amazon EC2 Linux instance with an unencrypted EBS root volume fails its instance status check and is no longer reachable through SSH or Session Manager. The instance does not use instance store volumes.

    An administrator wants to diagnose and, where possible, repair the operating system configuration with an AWS-provided automated procedure, without building a recovery instance by hand.

    Which solution will meet these requirements?
  fr: |
    Après une mise à jour du système d'exploitation, une instance Amazon EC2 Linux dont le volume racine EBS n'est pas chiffré échoue à la vérification de l'état de l'instance et n'est plus joignable par SSH ni par Session Manager. L'instance n'utilise pas de volumes de stockage d'instance.

    Un administrateur veut diagnostiquer et, si possible, réparer la configuration du système d'exploitation par une procédure automatisée fournie par AWS, sans construire à la main une instance de récupération.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the AWS-RunShellScript document on the instance with Systems Manager Run Command.", fr: "Exécuter le document AWS-RunShellScript sur l'instance avec Systems Manager Run Command." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on StatusCheckFailed_System with the EC2 recover action.", fr: "Créer une alarme CloudWatch sur StatusCheckFailed_System avec l'action EC2 de récupération (recover)." } }
    - { id: c, text: { en: "Run the AWSSupport-ExecuteEC2Rescue Automation runbook with the ID of the unreachable instance.", fr: "Exécuter le runbook Automation AWSSupport-ExecuteEC2Rescue avec l'ID de l'instance injoignable." } }
    - { id: d, text: { en: "Run the AWS-ResizeInstance Automation runbook to move the instance to a larger instance type.", fr: "Exécuter le runbook Automation AWS-ResizeInstance pour passer l'instance à un type d'instance plus grand." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AWSSupport-ExecuteEC2Rescue uses the EC2Rescue tool to troubleshoot and, where possible, repair common connectivity issues of an unreachable Linux or Windows Server instance. The runbook stops the instance, creates a backup AMI, works from a separate EC2Rescue instance, and returns a summary. Encrypted root volumes are not supported, and the public IP address changes unless the instance has an Elastic IP address.
    fr: |
      AWSSupport-ExecuteEC2Rescue utilise l'outil EC2Rescue pour diagnostiquer et, si possible, réparer les problèmes de connectivité courants d'une instance Linux ou Windows Server injoignable. Le runbook arrête l'instance, crée une AMI de sauvegarde, travaille depuis une instance EC2Rescue distincte et renvoie un résumé. Les volumes racines chiffrés ne sont pas pris en charge, et l'adresse IP publique change sauf si l'instance a une adresse IP Elastic.
  options:
    a: { en: "Run Command needs a working SSM Agent on a reachable operating system, which this instance no longer has.", fr: "Run Command exige un SSM Agent fonctionnel sur un système d'exploitation joignable, ce qui n'est plus le cas de cette instance." }
    b: { en: "The recover action handles failures of the underlying host, not a broken operating system configuration.", fr: "L'action de récupération traite les pannes de l'hôte sous-jacent, pas une configuration de système d'exploitation défectueuse." }
    d: { en: "A larger instance type does not repair the operating system configuration that blocks access.", fr: "Un type d'instance plus grand ne répare pas la configuration du système d'exploitation qui bloque l'accès." }
references:
  - title: AWSSupport-ExecuteEC2Rescue
    url: https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-awssupport-executeec2rescue.html
