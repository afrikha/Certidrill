id: soac03-1c-ec2-ena-pps-allowance
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a lookup service on a c6i.large instance that answers UDP requests of about 200 bytes. During peaks, clients see timeouts, while CPU utilization stays at 45%. An engineer runs the following command during a peak. One minute earlier, the pps_allowance_exceeded counter was 18342.

    ```bash
    $ ethtool -S eth0 | grep allowance
         bw_in_allowance_exceeded: 0
         bw_out_allowance_exceeded: 0
         pps_allowance_exceeded: 96410
         conntrack_allowance_exceeded: 0
         linklocal_allowance_exceeded: 0
    ```

    Which solution will resolve the timeouts?
  fr: |
    Une entreprise exécute un service de recherche sur une instance c6i.large qui répond à des requêtes UDP d'environ 200 octets. Pendant les pics, les clients subissent des expirations de délai, alors que l'utilisation du processeur reste à 45 %. Un ingénieur exécute la commande suivante pendant un pic. Une minute plus tôt, le compteur pps_allowance_exceeded valait 18342.

    ```bash
    $ ethtool -S eth0 | grep allowance
         bw_in_allowance_exceeded: 0
         bw_out_allowance_exceeded: 0
         pps_allowance_exceeded: 96410
         conntrack_allowance_exceeded: 0
         linklocal_allowance_exceeded: 0
    ```

    Quelle solution résoudra les expirations de délai ?
body:
  options:
    - { id: a, text: { en: "Set the MTU of eth0 to 9001 so that the instance uses jumbo frames.", fr: "Définir le MTU de eth0 à 9001 pour que l'instance utilise des trames jumbo." } }
    - { id: b, text: { en: "Add security group rules that allow all traffic so that the connections are no longer tracked.", fr: "Ajouter des règles de groupe de sécurité qui autorisent tout le trafic pour que les connexions ne soient plus suivies." } }
    - { id: c, text: { en: "Enable detailed monitoring on the instance so that network metrics are published every minute.", fr: "Activer la surveillance détaillée sur l'instance pour que les métriques réseau soient publiées chaque minute." } }
    - { id: d, text: { en: "Change the instance to a larger size in the same family, such as c6i.4xlarge.", fr: "Passer à une taille d'instance plus grande de la même famille, comme c6i.4xlarge." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The pps_allowance_exceeded counter keeps rising, which means that packets are queued or dropped because the bidirectional packets per second exceed the maximum of the instance. The bandwidth and connection tracking counters stay at zero, so the fix is an instance with a higher PPS allowance; larger sizes of a family have higher network allowances."
    fr: "Le compteur pps_allowance_exceeded continue d'augmenter : des paquets sont mis en file d'attente ou abandonnés car le nombre de paquets par seconde, dans les deux sens, dépasse le maximum de l'instance. Les compteurs de bande passante et de suivi des connexions restent à zéro : la solution est une instance avec une allocation PPS plus élevée ; les tailles plus grandes d'une famille disposent d'allocations réseau plus élevées."
  options:
    a:
      en: "Jumbo frames reduce the packet count only for large payloads; requests of 200 bytes still need one packet each."
      fr: "Les trames jumbo ne réduisent le nombre de paquets que pour les charges utiles volumineuses ; des requêtes de 200 octets nécessitent toujours un paquet chacune."
    b:
      en: "Untracked connections address the connection tracking allowance, but conntrack_allowance_exceeded is zero here."
      fr: "Les connexions non suivies répondent à l'allocation de suivi des connexions, mais conntrack_allowance_exceeded vaut zéro ici."
    c:
      en: "Detailed monitoring changes how often metrics are reported; it does not raise any network allowance."
      fr: "La surveillance détaillée change la fréquence de publication des métriques ; elle n'augmente aucune allocation réseau."
references:
  - title: Monitor network performance for ENA settings on your EC2 instance
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/monitoring-network-performance-ena.html
