id: soac03-1a-health-global-region
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs all its workloads in the eu-west-1 Region. An Amazon EventBridge rule in eu-west-1 matches events with the source `aws.health` and sends them to an SNS topic in eu-west-1. The team receives AWS Health notifications about Amazon EC2 and Amazon RDS in eu-west-1. However, the team never received a notification about an AWS Health event for AWS Identity and Access Management (IAM) that appeared in the AWS Health Dashboard.

    Which solution will meet the requirement to receive these notifications?
  fr: |
    Une entreprise exécute toutes ses charges de travail dans la Région eu-west-1. Une règle Amazon EventBridge de eu-west-1 correspond aux événements de source `aws.health` et les envoie à une rubrique SNS de eu-west-1. L'équipe reçoit les notifications AWS Health concernant Amazon EC2 et Amazon RDS dans eu-west-1. En revanche, l'équipe n'a jamais reçu de notification pour un événement AWS Health concernant AWS Identity and Access Management (IAM) qui figurait dans le tableau de bord AWS Health (AWS Health Dashboard).

    Quelle solution permet de recevoir ces notifications ?
body:
  options:
    - id: a
      text: { en: "Add `\"service\": [\"IAM\"]` to the `detail` section of the event pattern of the existing rule.", fr: "Ajouter `\"service\": [\"IAM\"]` à la section `detail` du modèle d'événement de la règle existante." }
    - id: b
      text: { en: "Create the same rule in the us-east-1 Region with a target SNS topic in us-east-1.", fr: "Créer la même règle dans la Région us-east-1, avec comme cible une rubrique SNS de us-east-1." }
    - id: c
      text: { en: "Turn on organizational view in AWS Health for the management account of the organization.", fr: "Activer la vue organisationnelle d'AWS Health pour le compte de gestion de l'organisation." }
    - id: d
      text: { en: "Move the existing rule from the default event bus to a new custom event bus in eu-west-1.", fr: "Déplacer la règle existante du bus d'événements par défaut vers un nouveau bus d'événements personnalisé de eu-west-1." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Health delivers Regional events to EventBridge in the Region of the event, so a rule is needed in each Region of interest. Global events, such as IAM events, are not tied to a Region and are delivered in US East (N. Virginia), so a rule in us-east-1 is required to receive them."
    fr: "AWS Health livre les événements régionaux à EventBridge dans la Région de l'événement : une règle est nécessaire dans chaque Région concernée. Les événements globaux, comme ceux d'IAM, ne sont liés à aucune Région et sont livrés dans USA Est (Virginie du Nord) : une règle dans us-east-1 est nécessaire pour les recevoir."
  options:
    a: { en: "The rule in eu-west-1 never receives global events, so a narrower pattern there cannot match them.", fr: "La règle de eu-west-1 ne reçoit jamais les événements globaux : un modèle plus restreint ne peut pas y correspondre." }
    c: { en: "Organizational view aggregates events of other accounts; the missing events belong to this account but are delivered in another Region.", fr: "La vue organisationnelle agrège les événements d'autres comptes ; les événements manquants appartiennent à ce compte mais sont livrés dans une autre Région." }
    d: { en: "AWS service events arrive on the default event bus; a custom bus in the same Region receives none of them.", fr: "Les événements des services AWS arrivent sur le bus d'événements par défaut ; un bus personnalisé de la même Région n'en reçoit aucun." }
references:
  - title: Creating EventBridge rules for AWS Region coverage
    url: https://docs.aws.amazon.com/health/latest/ug/choosing-a-region.html
