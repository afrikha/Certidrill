id: soac03-1c-ec2-spread-pg-limit
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs critical license servers on Amazon EC2. Each instance must run on distinct hardware so that one hardware failure affects at most one instance. An engineer launched seven instances in a spread placement group in one Availability Zone, and the launch of the eighth instance fails. The company needs 10 instances, and the application can run in any Availability Zone of the Region.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des serveurs de licences critiques sur Amazon EC2. Chaque instance doit s'exécuter sur un matériel distinct pour qu'une panne matérielle touche au plus une instance. Un ingénieur a lancé sept instances dans un groupe de placement réparti (spread) dans une zone de disponibilité, et le lancement de la huitième instance échoue. L'entreprise a besoin de 10 instances, et l'application peut s'exécuter dans n'importe quelle zone de disponibilité de la Région.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Launch the remaining instances into the same spread placement group in a second Availability Zone.", fr: "Lancer les instances restantes dans le même groupe de placement réparti, dans une deuxième zone de disponibilité." } }
    - { id: b, text: { en: "Request a service quota increase for the number of instances per spread placement group.", fr: "Demander une augmentation du quota de service du nombre d'instances par groupe de placement réparti." } }
    - { id: c, text: { en: "Move all the instances to a cluster placement group in the same Availability Zone.", fr: "Déplacer toutes les instances vers un groupe de placement de cluster dans la même zone de disponibilité." } }
    - { id: d, text: { en: "Move all the instances to a partition placement group that has one partition.", fr: "Déplacer toutes les instances vers un groupe de placement de partition qui comporte une seule partition." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A rack-level spread placement group can have at most seven running instances per Availability Zone, but it can span several Availability Zones of the Region. Launching the other three instances into the same group in a second Availability Zone keeps every instance on distinct hardware."
    fr: "Un groupe de placement réparti au niveau des racks peut contenir au plus sept instances en cours d'exécution par zone de disponibilité, mais il peut couvrir plusieurs zones de disponibilité de la Région. Lancer les trois autres instances dans le même groupe dans une deuxième zone de disponibilité garde chaque instance sur un matériel distinct."
  options:
    b:
      en: "The limit of seven running instances per Availability Zone in a spread group is a fixed rule, not an adjustable quota."
      fr: "La limite de sept instances en cours d'exécution par zone de disponibilité dans un groupe réparti est une règle fixe, pas un quota ajustable."
    c:
      en: "A cluster placement group packs instances close together for low latency, which increases the risk that one failure affects several instances."
      fr: "Un groupe de placement de cluster regroupe les instances pour une faible latence, ce qui augmente le risque qu'une panne touche plusieurs instances."
    d:
      en: "Instances in the same partition share racks, so a single partition does not keep each instance on distinct hardware."
      fr: "Les instances d'une même partition partagent des racks : une seule partition ne garde pas chaque instance sur un matériel distinct."
references:
  - title: Placement strategies for your placement groups
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html
