id: soac03-1c-s3-byte-range-downloads
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A genomics company stores files of 30 GB to 60 GB in Amazon S3. A processing job on a large Amazon EC2 instance in the same AWS Region downloads each file with one GetObject request before it starts its analysis. Monitoring shows that each download uses only a fraction of the instance's network bandwidth and that the instance's EBS volume is not a bottleneck. The objects were uploaded by multipart upload in parts of 100 MB.

    Which solution will reduce the download time?
  fr: |
    Une entreprise de génomique stocke des fichiers de 30 Go à 60 Go dans Amazon S3. Une tâche de traitement sur une grande instance Amazon EC2 de la même Région AWS télécharge chaque fichier avec une seule requête GetObject avant de commencer son analyse. La surveillance montre que chaque téléchargement n'utilise qu'une fraction de la bande passante réseau de l'instance et que le volume EBS de l'instance n'est pas un goulot d'étranglement. Les objets ont été chargés par chargement partitionné, en parties de 100 Mo.

    Quelle solution réduira la durée des téléchargements ?
body:
  options:
    - { id: a, text: { en: "Enable S3 Transfer Acceleration and download the files through the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration et télécharger les fichiers par le point de terminaison accéléré." } }
    - { id: b, text: { en: "Add an S3 Lifecycle rule that transitions the files to S3 Intelligent-Tiering after upload.", fr: "Ajouter une règle S3 Lifecycle qui fait passer les fichiers vers S3 Intelligent-Tiering après leur chargement." } }
    - { id: c, text: { en: "Increase the provisioned throughput of the instance's gp3 volume to its maximum value.", fr: "Augmenter le débit provisionné du volume gp3 de l'instance jusqu'à sa valeur maximale." } }
    - { id: d, text: { en: "Download each file with concurrent GET requests that use the Range header, aligned to the 100 MB parts.", fr: "Télécharger chaque fichier avec des requêtes GET simultanées qui utilisent l'en-tête Range, alignées sur les parties de 100 Mo." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Byte-range fetches let a client issue concurrent GET requests for different ranges of the same object, which gives a higher aggregate throughput than one request for the whole object. Aligning the ranges to the part boundaries of a multipart upload is the recommended pattern, and smaller ranges also make retries faster."
    fr: "Les extractions par plage d'octets permettent à un client d'émettre des requêtes GET simultanées sur différentes plages d'un même objet, ce qui donne un débit agrégé plus élevé qu'une seule requête pour tout l'objet. Aligner les plages sur les limites des parties d'un chargement partitionné est le modèle recommandé, et des plages plus petites rendent aussi les nouvelles tentatives plus rapides."
  options:
    a:
      en: "Transfer Acceleration reduces latency caused by distance; the instance is in the bucket's Region, so it does not help a single slow connection."
      fr: "Transfer Acceleration réduit la latence due à la distance ; l'instance est dans la Région du compartiment, cela n'aide donc pas une connexion unique trop lente."
    b:
      en: "A storage class change affects cost, not the throughput of a single GET request, and the files would move only after a period without access."
      fr: "Un changement de classe de stockage agit sur le coût, pas sur le débit d'une requête GET unique, et les fichiers ne changeraient de niveau qu'après une période sans accès."
    c:
      en: "The stem states that the EBS volume is not the bottleneck; the limit is the single request to S3."
      fr: "L'énoncé indique que le volume EBS n'est pas le goulot d'étranglement ; la limite est la requête unique vers S3."
references:
  - title: Performance guidelines for Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/optimizing-performance-guidelines.html
