id: soac03-1b-ssm-onfailure-rollback
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A custom Automation runbook changes the instance type of an Amazon EC2 instance in three steps: stopInstance, changeType, and startInstance, which has `isEnd: true`. A fourth step named restoreType, placed after startInstance, sets the original instance type back, starts the instance, and also has `isEnd: true`.

    If the changeType step fails, the automation must run restoreType instead of stopping with the instance left in the stopped state. If changeType succeeds, the automation must continue with startInstance.

    Which property should the administrator add to the changeType step?
  fr: |
    Un runbook Automation personnalisé modifie le type d'une instance Amazon EC2 en trois étapes : stopInstance, changeType et startInstance, qui possède `isEnd: true`. Une quatrième étape nommée restoreType, placée après startInstance, rétablit le type d'instance d'origine, démarre l'instance et possède aussi `isEnd: true`.

    Si l'étape changeType échoue, l'automatisation doit exécuter restoreType au lieu de s'arrêter en laissant l'instance arrêtée. Si changeType réussit, l'automatisation doit continuer avec startInstance.

    Quelle propriété l'administrateur doit-il ajouter à l'étape changeType ?
body:
  options:
    - { id: a, text: "`onFailure: Continue`" }
    - { id: b, text: "`maxAttempts: 3`" }
    - { id: c, text: "`onFailure: step:restoreType`" }
    - { id: d, text: "`nextStep: restoreType`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The onFailure property accepts Abort (the default), Continue, or `step:step_name`. With `step:restoreType`, a failure of changeType sends the automation to the restoreType step, while a success follows the normal order to startInstance. Because restoreType has `isEnd: true`, the automation stops after the rollback.
    fr: |
      La propriété onFailure accepte Abort (valeur par défaut), Continue ou `step:nom_de_l'étape`. Avec `step:restoreType`, un échec de changeType envoie l'automatisation à l'étape restoreType, tandis qu'une réussite suit l'ordre normal vers startInstance. Comme restoreType possède `isEnd: true`, l'automatisation s'arrête après le retour arrière.
  options:
    a: { en: "Continue moves on to startInstance after a failure, so the original instance type is never restored.", fr: "Continue passe à startInstance après un échec : le type d'instance d'origine n'est jamais rétabli." }
    b: { en: "maxAttempts retries the step, but if all attempts fail the automation still aborts with the instance stopped.", fr: "maxAttempts réessaie l'étape, mais si toutes les tentatives échouent l'automatisation s'interrompt toujours avec l'instance arrêtée." }
    d: { en: "nextStep applies after a successful step, so it would send every successful run to restoreType instead of startInstance.", fr: "nextStep s'applique après une étape réussie : il enverrait chaque exécution réussie vers restoreType au lieu de startInstance." }
references:
  - title: Systems Manager Automation actions reference
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-actions.html
