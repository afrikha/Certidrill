id: soac03-1c-rds-read-replica-reporting
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an order processing application on an Amazon RDS for MySQL Multi-AZ DB instance deployment. Business analysts run long reporting queries during the day. CloudWatch shows that ReadIOPS and CPUUtilization spike during these queries, which slows down order processing. The reports can use data that is a few seconds old.

    Which solution will reduce the impact on order processing?
  fr: |
    Une entreprise exécute une application de traitement des commandes sur un déploiement d'instance de base de données Multi-AZ Amazon RDS for MySQL. Des analystes métier exécutent de longues requêtes de rapport pendant la journée. CloudWatch montre que ReadIOPS et CPUUtilization augmentent fortement pendant ces requêtes, ce qui ralentit le traitement des commandes. Les rapports peuvent utiliser des données datant de quelques secondes.

    Quelle solution réduira l'impact sur le traitement des commandes ?
body:
  options:
    - { id: a, text: { en: "Point the reporting tool to the standby DB instance of the Multi-AZ deployment.", fr: "Diriger l'outil de rapport vers l'instance de secours du déploiement Multi-AZ." } }
    - { id: b, text: { en: "Create a read replica of the DB instance and point the reporting tool to the replica endpoint.", fr: "Créer un réplica en lecture de l'instance de base de données et diriger l'outil de rapport vers le point de terminaison du réplica." } }
    - { id: c, text: { en: "Put RDS Proxy in front of the DB instance and send the reporting queries through the proxy.", fr: "Placer RDS Proxy devant l'instance de base de données et faire passer les requêtes de rapport par le proxy." } }
    - { id: d, text: { en: "Increase the allocated storage of the DB instance to raise its baseline IOPS.", fr: "Augmenter le stockage alloué de l'instance de base de données pour relever ses IOPS de référence." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A read replica is a separate DB instance that accepts read-only connections and is kept up to date by asynchronous replication, which fits reports that accept a few seconds of lag. Sending the reporting queries to the replica moves their CPU and read I/O off the primary DB instance."
    fr: "Un réplica en lecture est une instance de base de données distincte qui accepte des connexions en lecture seule et reste à jour par réplication asynchrone, ce qui convient à des rapports qui tolèrent quelques secondes de retard. Envoyer les requêtes de rapport au réplica retire leur charge processeur et leurs E/S de lecture de l'instance principale."
  options:
    a:
      en: "In a Multi-AZ DB instance deployment, the standby replica cannot serve read traffic."
      fr: "Dans un déploiement d'instance de base de données Multi-AZ, le réplica de secours ne peut pas traiter de trafic de lecture."
    c:
      en: "RDS Proxy pools connections but still sends the queries to the same DB instance, so their CPU and I/O load remain on it."
      fr: "RDS Proxy mutualise les connexions mais envoie toujours les requêtes à la même instance : leur charge processeur et d'E/S y reste."
    d:
      en: "More storage performance does not remove the CPU load of the reports from the instance that processes orders."
      fr: "Davantage de performances de stockage ne retire pas la charge processeur des rapports de l'instance qui traite les commandes."
references:
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
