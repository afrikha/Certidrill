id: soac03-1b-eb-test-event-pattern
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator is writing a complex event pattern for an Amazon EventBridge rule that will start a remediation workflow. The administrator has a sample event saved as a JSON file and wants to confirm that the pattern matches the sample before creating the rule, without sending test events to the production event bus.

    Which solution will meet these requirements?
  fr: |
    Un administrateur rédige un modèle d'événement complexe pour une règle Amazon EventBridge qui lancera un flux de correction. L'administrateur dispose d'un exemple d'événement enregistré dans un fichier JSON et veut vérifier que le modèle correspond à cet exemple avant de créer la règle, sans envoyer d'événements de test au bus d'événements de production.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create the rule with a CloudWatch log group target and send the sample event with the PutEvents API.", fr: "Créer la règle avec une cible de groupe de journaux CloudWatch et envoyer l'exemple d'événement avec l'API PutEvents." } }
    - { id: b, text: { en: "Run the aws events test-event-pattern command with the pattern and the sample event.", fr: "Exécuter la commande aws events test-event-pattern avec le modèle et l'exemple d'événement." } }
    - { id: c, text: { en: "Create an archive on the event bus and replay the sample event to the new rule.", fr: "Créer une archive sur le bus d'événements et rejouer l'exemple d'événement vers la nouvelle règle." } }
    - { id: d, text: { en: "Create the rule in the DISABLED state and check its TriggeredRules metric after the next real event.", fr: "Créer la règle à l'état DISABLED et vérifier sa métrique TriggeredRules après le prochain événement réel." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The TestEventPattern API (aws events test-event-pattern in the AWS CLI) evaluates an event pattern against a sample event and returns whether it matches, without creating a rule or sending an event. The Sandbox page of the EventBridge console offers the same check.
    fr: |
      L'API TestEventPattern (aws events test-event-pattern dans l'AWS CLI) évalue un modèle d'événement par rapport à un exemple d'événement et indique s'il y a correspondance, sans créer de règle ni envoyer d'événement. La page Sandbox de la console EventBridge propose la même vérification.
  options:
    a: { en: "PutEvents sends the sample to the production bus, which the administrator wants to avoid.", fr: "PutEvents envoie l'exemple au bus de production, ce que l'administrateur veut éviter." }
    c: { en: "An archive keeps events that the bus received; the sample event was never sent to the bus, and a replay also uses the production bus.", fr: "Une archive conserve les événements reçus par le bus ; l'exemple n'a jamais été envoyé au bus, et un rejeu utilise aussi le bus de production." }
    d: { en: "A disabled rule does not match events, so its metrics do not show whether the pattern is correct.", fr: "Une règle désactivée ne traite pas les événements : ses métriques ne montrent pas si le modèle est correct." }
references:
  - title: Troubleshooting Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-troubleshooting.html
