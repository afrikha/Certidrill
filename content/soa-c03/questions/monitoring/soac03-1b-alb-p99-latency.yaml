id: soac03-1b-alb-p99-latency
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs a web application behind an Application Load Balancer. Customers report that some checkout pages are very slow, but a CloudWatch graph of the TargetResponseTime metric with the Average statistic stays below 200 ms.

    An administrator needs a graph that shows the response time experienced by the slowest requests, while ignoring the top 1 % of outliers.

    Which statistic should the administrator use for the TargetResponseTime metric?
  fr: |
    Une entreprise de distribution exécute une application web derrière un Application Load Balancer. Des clients signalent que certaines pages de paiement sont très lentes, mais un graphique CloudWatch de la métrique TargetResponseTime avec la statistique Average reste sous 200 ms.

    Un administrateur a besoin d'un graphique qui montre le temps de réponse subi par les requêtes les plus lentes, en ignorant le 1 % de valeurs aberrantes les plus élevées.

    Quelle statistique l'administrateur doit-il utiliser pour la métrique TargetResponseTime ?
body:
  options:
    - { id: a, text: "Maximum" }
    - { id: b, text: "SampleCount" }
    - { id: c, text: "tm99" }
    - { id: d, text: "p99" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The p99 percentile ignores the 1 % of data points with the highest values and returns the highest of the remaining values, so it shows the worst experience of most customers. For TargetResponseTime, the most useful statistics are Average and percentiles, and an average can hide a slow tail of requests.
    fr: |
      Le percentile p99 ignore le 1 % de points de données les plus élevés et renvoie la valeur la plus haute parmi les valeurs restantes : il montre la pire expérience de la plupart des clients. Pour TargetResponseTime, les statistiques les plus utiles sont Average et les percentiles, et une moyenne peut masquer une traîne de requêtes lentes.
  options:
    a: { en: "Maximum includes the outliers that the administrator wants to ignore.", fr: "Maximum inclut les valeurs aberrantes que l'administrateur veut ignorer." }
    b: { en: "SampleCount is the number of data points, not a response time.", fr: "SampleCount est le nombre de points de données, pas un temps de réponse." }
    c: { en: "tm99 is the average of the remaining 99 %, so it shows the typical experience, not the slowest requests.", fr: "tm99 est la moyenne des 99 % restants : il montre l'expérience typique, pas celle des requêtes les plus lentes." }
references:
  - title: CloudWatch statistics definitions
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Statistics-definitions.html
  - title: CloudWatch metrics for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-cloudwatch-metrics.html
