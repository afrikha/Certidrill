id: soac03-1a-agent-asg-aggregation
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The web tier of a company runs in an Auto Scaling group named `web-asg`. The CloudWatch agent on each instance publishes `mem_used_percent` with only the `InstanceId` dimension. The operations team wants a single CloudWatch alarm on the average memory use of the whole group. The alarm must keep working when instances are replaced.

    Which solution will meet these requirements?
  fr: |
    Le niveau web d'une entreprise s'exécute dans un groupe Auto Scaling nommé `web-asg`. Sur chaque instance, l'agent CloudWatch publie `mem_used_percent` avec la seule dimension `InstanceId`. L'équipe des opérations veut une seule alarme CloudWatch sur l'utilisation moyenne de la mémoire de tout le groupe. L'alarme doit continuer de fonctionner quand des instances sont remplacées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an alarm on a metric math expression that averages the results of a SEARCH expression for `mem_used_percent`.", fr: "Créer une alarme sur une expression mathématique de métriques qui fait la moyenne des résultats d'une expression SEARCH sur `mem_used_percent`." }
    - id: b
      text: { en: "Turn on detailed monitoring for the group so that Amazon EC2 publishes memory metrics with the `AutoScalingGroupName` dimension.", fr: "Activer la surveillance détaillée pour le groupe afin qu'Amazon EC2 publie des métriques de mémoire avec la dimension `AutoScalingGroupName`." }
    - id: c
      text: { en: "Create one alarm for each instance and a composite alarm that combines them with the AND operator.", fr: "Créer une alarme pour chaque instance et une alarme composite qui les combine avec l'opérateur AND." }
    - id: d
      text: { en: "Add `AutoScalingGroupName` to `append_dimensions`, set `aggregation_dimensions` to `[[\"AutoScalingGroupName\"]]`, and alarm on the aggregated metric.", fr: "Ajouter `AutoScalingGroupName` à `append_dimensions`, définir `aggregation_dimensions` à `[[\"AutoScalingGroupName\"]]` et créer l'alarme sur la métrique agrégée." }
answer: { optionId: d }
explanation:
  correct:
    en: "`append_dimensions` with `\"AutoScalingGroupName\": \"${aws:AutoScalingGroupName}\"` tags each metric with its group, and `aggregation_dimensions` makes the agent also publish a series rolled up on that dimension alone. The alarm watches the `mem_used_percent` series for `web-asg`, which does not depend on instance IDs and survives instance replacement."
    fr: "`append_dimensions` avec `\"AutoScalingGroupName\": \"${aws:AutoScalingGroupName}\"` associe chaque métrique à son groupe, et `aggregation_dimensions` fait aussi publier par l'agent une série agrégée sur cette seule dimension. L'alarme surveille la série `mem_used_percent` de `web-asg`, qui ne dépend pas des ID d'instance et résiste au remplacement des instances."
  options:
    a: { en: "CloudWatch cannot create an alarm on a SEARCH expression.", fr: "CloudWatch ne permet pas de créer une alarme sur une expression SEARCH." }
    b: { en: "Amazon EC2 never publishes memory metrics, with or without detailed monitoring.", fr: "Amazon EC2 ne publie jamais de métriques de mémoire, avec ou sans surveillance détaillée." }
    c: { en: "Per-instance alarms break when instances are replaced, and AND does not compute an average.", fr: "Des alarmes par instance ne fonctionnent plus quand les instances sont remplacées, et AND ne calcule pas de moyenne." }
references:
  - title: Manually create or edit the CloudWatch agent configuration file
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
  - title: Create a CloudWatch alarm based on a metric math expression
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create-alarm-on-metric-math-expression.html
