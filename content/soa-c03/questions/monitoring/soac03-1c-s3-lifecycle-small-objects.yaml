id: soac03-1c-s3-lifecycle-small-objects
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In 2025, a company created an S3 Lifecycle rule without a filter that transitions all objects in a bucket to S3 Standard-IA 45 days after creation. Three months later, S3 Storage Lens shows that millions of objects of 20 KB to 100 KB that are older than 45 days are still in S3 Standard, while the larger objects were transitioned. The small objects are rarely read. The company wants the MOST cost-effective storage for them.

    What should a CloudOps engineer do?
  fr: |
    En 2025, une entreprise a créé une règle S3 Lifecycle sans filtre qui fait passer tous les objets d'un compartiment vers S3 Standard-IA 45 jours après leur création. Trois mois plus tard, S3 Storage Lens montre que des millions d'objets de 20 Ko à 100 Ko, âgés de plus de 45 jours, sont toujours dans S3 Standard, alors que les objets plus gros ont été transférés. Les petits objets sont rarement lus. L'entreprise veut le stockage le PLUS rentable pour ces objets.

    Que doit faire un ingénieur CloudOps ?
body:
  options:
    - { id: a, text: { en: "Add an ObjectSizeGreaterThan filter of 0 bytes to the rule so that the small objects also move to S3 Standard-IA.", fr: "Ajouter à la règle un filtre ObjectSizeGreaterThan de 0 octet pour que les petits objets passent aussi vers S3 Standard-IA." } }
    - { id: b, text: { en: "Add a second rule that transitions the objects smaller than 128 KB to S3 Glacier Instant Retrieval.", fr: "Ajouter une deuxième règle qui fait passer les objets de moins de 128 Ko vers S3 Glacier Instant Retrieval." } }
    - { id: c, text: { en: "Keep the rule as it is and leave the small objects in S3 Standard.", fr: "Conserver la règle telle quelle et laisser les petits objets dans S3 Standard." } }
    - { id: d, text: { en: "Add a second rule that transitions the objects smaller than 128 KB to S3 One Zone-IA.", fr: "Ajouter une deuxième règle qui fait passer les objets de moins de 128 Ko vers S3 One Zone-IA." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Since September 2024, S3 Lifecycle does not transition objects smaller than 128 KB by default, because each transition is billed as a request and the savings would not cover it. S3 Standard-IA, S3 One Zone-IA and S3 Glacier Instant Retrieval also bill a minimum object size of 128 KB, so a 50 KB object would be charged as 128 KB. Leaving these objects in S3 Standard is the cheapest option."
    fr: "Depuis septembre 2024, S3 Lifecycle ne fait pas passer par défaut les objets de moins de 128 Ko, car chaque transition est facturée comme une requête et les économies ne la couvriraient pas. S3 Standard-IA, S3 One Zone-IA et S3 Glacier Instant Retrieval facturent aussi une taille minimale d'objet de 128 Ko : un objet de 50 Ko serait facturé comme 128 Ko. Laisser ces objets dans S3 Standard est l'option la moins chère."
  options:
    a:
      en: "The filter forces the transitions, but each object then pays a transition request and is billed as 128 KB in S3 Standard-IA, which costs more than S3 Standard."
      fr: "Le filtre force les transitions, mais chaque objet paie alors une requête de transition et est facturé comme 128 Ko dans S3 Standard-IA, ce qui coûte plus cher que S3 Standard."
    b:
      en: "S3 Glacier Instant Retrieval also has a 128 KB minimum billable size and a 90-day minimum duration, so the small objects would cost more."
      fr: "S3 Glacier Instant Retrieval a aussi une taille minimale facturable de 128 Ko et une durée minimale de 90 jours : les petits objets coûteraient plus cher."
    d:
      en: "S3 One Zone-IA bills a 128 KB minimum per object as well, and the transition requests add cost without savings."
      fr: "S3 One Zone-IA facture aussi un minimum de 128 Ko par objet, et les requêtes de transition ajoutent un coût sans économie."
references:
  - title: Transitioning objects using Amazon S3 Lifecycle
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
