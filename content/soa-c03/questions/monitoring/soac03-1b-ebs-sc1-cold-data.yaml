id: soac03-1b-ebs-sc1-cold-data
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company keeps 8 TiB of log archives on a gp3 data volume attached to an Amazon EC2 instance. A vendor tool that must read the files from a local block device scans the archives sequentially once each quarter. The volume is not a boot volume, and the scan can take several hours.

    Which EBS volume type is the MOST cost-effective for this data?
  fr: |
    Une entreprise conserve 8 Tio d'archives de journaux sur un volume de données gp3 attaché à une instance Amazon EC2. Un outil tiers, qui doit lire les fichiers depuis un périphérique de bloc local, parcourt les archives séquentiellement une fois par trimestre. Le volume n'est pas un volume de démarrage, et le parcours peut durer plusieurs heures.

    Quel type de volume EBS est le PLUS rentable pour ces données ?
body:
  options:
    - { id: a, text: "st1" }
    - { id: b, text: "gp2" }
    - { id: c, text: "io2" }
    - { id: d, text: "sc1" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      sc1 (Cold HDD) is the lowest-cost EBS volume type and fits large, sequential, cold-data workloads that are accessed infrequently. Its throughput is lower than st1, which is acceptable for a quarterly scan that can take hours. Like st1, it cannot be a boot volume, which does not matter for this data volume.
    fr: |
      sc1 (Cold HDD) est le type de volume EBS le moins cher et convient aux charges de travail de données froides, séquentielles et volumineuses, rarement consultées. Son débit est inférieur à celui de st1, ce qui est acceptable pour un parcours trimestriel qui peut durer des heures. Comme st1, il ne peut pas servir de volume de démarrage, ce qui n'a pas d'importance pour ce volume de données.
  options:
    a: { en: "st1 is designed for frequently accessed, throughput-intensive workloads and costs more than sc1.", fr: "st1 est conçu pour des charges de travail fréquemment sollicitées et gourmandes en débit, et coûte plus cher que sc1." }
    b: { en: "gp2 is an SSD volume type that costs more per GiB than HDD volumes for rarely read data.", fr: "gp2 est un type de volume SSD qui coûte plus cher par Gio que les volumes HDD pour des données rarement lues." }
    c: { en: "io2 is designed for I/O-intensive workloads with provisioned IOPS, which this scan does not need.", fr: "io2 est conçu pour des charges de travail intensives en E/S avec des IOPS provisionnées, dont ce parcours n'a pas besoin." }
references:
  - title: Amazon EBS Throughput Optimized HDD and Cold HDD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/hdd-vols.html
