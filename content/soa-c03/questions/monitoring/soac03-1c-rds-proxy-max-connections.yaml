id: soac03-1c-rds-proxy-max-connections
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web application connects to an Amazon RDS for PostgreSQL DB instance through RDS Proxy. The DB instance's max_connections parameter is 1,000, and the proxy target group has MaxConnectionsPercent set to 20. At peak, the proxy's DatabaseConnections metric stays at MaxDatabaseConnectionsAllowed, DatabaseConnectionsBorrowLatency rises sharply and query latency grows, while the CPU utilization of the DB instance stays at 30%.

    Which solution will reduce the latency MOST cost-effectively?
  fr: |
    Une application web se connecte à une instance de base de données Amazon RDS for PostgreSQL par RDS Proxy. Le paramètre max_connections de l'instance vaut 1 000, et le groupe cible du proxy a MaxConnectionsPercent défini à 20. Au pic, la métrique DatabaseConnections du proxy reste à MaxDatabaseConnectionsAllowed, DatabaseConnectionsBorrowLatency augmente fortement et la latence des requêtes croît, alors que l'utilisation du processeur de l'instance reste à 30 %.

    Quelle solution réduira la latence de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Modify the DB instance to a larger instance class with more vCPUs.", fr: "Faire passer l'instance de base de données à une classe d'instance plus grande avec plus de vCPU." } }
    - { id: b, text: { en: "Raise MaxConnectionsPercent on the proxy target group so that the proxy can open more database connections.", fr: "Augmenter MaxConnectionsPercent sur le groupe cible du proxy pour que le proxy puisse ouvrir plus de connexions de base de données." } }
    - { id: c, text: { en: "Create a read replica and update the application to send all of its queries to the replica.", fr: "Créer un réplica en lecture et modifier l'application pour qu'elle envoie toutes ses requêtes au réplica." } }
    - { id: d, text: { en: "Lower the IdleClientTimeout of the proxy so that idle client connections are closed sooner.", fr: "Diminuer l'IdleClientTimeout du proxy pour que les connexions clientes inactives soient fermées plus tôt." } }
answer: { optionId: b }
explanation:
  correct:
    en: "MaxConnectionsPercent limits the proxy's connection pool to a percentage of max_connections, here 200 connections. When DatabaseConnections stays at MaxDatabaseConnectionsAllowed and borrow latency rises, requests are waiting for a pooled connection. The database still has spare CPU, so raising the percentage (AWS recommends at least 30% above recent peak usage) removes the wait at no extra cost."
    fr: "MaxConnectionsPercent limite le pool de connexions du proxy à un pourcentage de max_connections, ici 200 connexions. Lorsque DatabaseConnections reste à MaxDatabaseConnectionsAllowed et que la latence d'emprunt augmente, les requêtes attendent une connexion du pool. La base de données a encore du processeur disponible : augmenter ce pourcentage (AWS recommande au moins 30 % au-dessus du pic récent) supprime l'attente sans coût supplémentaire."
  options:
    a:
      en: "The DB instance runs at 30% CPU, so a larger class adds cost without removing the limit of the proxy's pool."
      fr: "L'instance tourne à 30 % de processeur : une classe plus grande ajoute un coût sans supprimer la limite du pool du proxy."
    c:
      en: "A read replica adds cost, cannot serve the application's writes, and does not change the pool limit of the proxy in front of the primary."
      fr: "Un réplica en lecture ajoute un coût, ne peut pas traiter les écritures de l'application et ne change pas la limite du pool du proxy placé devant l'instance principale."
    d:
      en: "IdleClientTimeout closes idle client connections, while the bottleneck is the number of database connections that the proxy is allowed to open."
      fr: "IdleClientTimeout ferme les connexions clientes inactives, alors que le goulot d'étranglement est le nombre de connexions de base de données que le proxy est autorisé à ouvrir."
references:
  - title: RDS Proxy connection considerations
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy-connections.html
