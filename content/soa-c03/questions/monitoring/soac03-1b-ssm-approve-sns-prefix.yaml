id: soac03-1b-ssm-approve-sns-prefix
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A custom Automation runbook deletes old AMIs. An administrator adds the following step before the deletion so that a manager approves each run:

    ```yaml
    - name: getApproval
      action: aws:approve
      timeoutSeconds: 3600
      onFailure: Abort
      inputs:
        NotificationArn: arn:aws:sns:eu-west-1:111122223333:ops-approvals
        Message: Approve deletion of old AMIs
        MinRequiredApprovals: 1
        Approvers:
          - arn:aws:iam::111122223333:role/OpsManager
    ```

    When the runbook runs, it waits at the getApproval step, but the manager, who is subscribed to the ops-approvals topic, never receives the approval request. The topic delivers other messages to the manager normally.

    What should the administrator do?
  fr: |
    Un runbook Automation personnalisé supprime les anciennes AMI. Un administrateur ajoute l'étape suivante avant la suppression pour qu'un responsable approuve chaque exécution :

    ```yaml
    - name: getApproval
      action: aws:approve
      timeoutSeconds: 3600
      onFailure: Abort
      inputs:
        NotificationArn: arn:aws:sns:eu-west-1:111122223333:ops-approvals
        Message: Approve deletion of old AMIs
        MinRequiredApprovals: 1
        Approvers:
          - arn:aws:iam::111122223333:role/OpsManager
    ```

    Lorsque le runbook s'exécute, il attend à l'étape getApproval, mais le responsable, abonné à la rubrique ops-approvals, ne reçoit jamais la demande d'approbation. La rubrique livre normalement d'autres messages au responsable.

    Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Increase timeoutSeconds to 604800 so that the request stays open for 7 days.", fr: "Porter timeoutSeconds à 604800 pour que la demande reste ouverte 7 jours." } }
    - { id: b, text: { en: "Change MinRequiredApprovals to 0 so that the step sends the request without waiting.", fr: "Remplacer MinRequiredApprovals par 0 pour que l'étape envoie la demande sans attendre." } }
    - { id: c, text: { en: "Replace the role ARN in Approvers with the manager's email address.", fr: "Remplacer l'ARN du rôle dans Approvers par l'adresse e-mail du responsable." } }
    - { id: d, text: { en: "Use an SNS topic whose name starts with Automation, such as AutomationApprovals, in NotificationArn.", fr: "Utiliser dans NotificationArn une rubrique SNS dont le nom commence par Automation, par exemple AutomationApprovals." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The NotificationArn input of aws:approve must point to an Amazon SNS topic whose name is prefixed with Automation. The ops-approvals topic does not follow this naming rule, so the manager does not receive the request and the step waits until it times out. Approvers can be IAM user names, user ARNs, or role ARNs.
    fr: |
      L'entrée NotificationArn de aws:approve doit désigner une rubrique Amazon SNS dont le nom commence par Automation. La rubrique ops-approvals ne respecte pas cette règle de nommage : le responsable ne reçoit pas la demande et l'étape attend jusqu'à son expiration. Les approbateurs peuvent être des noms d'utilisateurs IAM, des ARN d'utilisateurs ou des ARN de rôles.
  options:
    a: { en: "A longer timeout only extends the wait; the request is still not delivered to the topic.", fr: "Un délai plus long ne fait que prolonger l'attente ; la demande n'est toujours pas livrée à la rubrique." }
    b: { en: "MinRequiredApprovals must be a positive integer, and removing the approval would defeat its purpose.", fr: "MinRequiredApprovals doit être un entier positif, et supprimer l'approbation irait à l'encontre de son objectif." }
    c: { en: "Approvers must be IAM principals; an email address is not a valid approver, and the role ARN is already valid.", fr: "Les approbateurs doivent être des principaux IAM ; une adresse e-mail n'est pas un approbateur valide, et l'ARN de rôle est déjà valide." }
references:
  - title: aws:approve – Pause an automation for manual approval
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-approve.html
