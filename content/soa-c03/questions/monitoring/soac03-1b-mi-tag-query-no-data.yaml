id: soac03-1b-mi-tag-query-no-data
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company tags every Amazon EC2 instance with a team tag. The payments team wants a CloudWatch dashboard widget that always shows the 10 instances of the team with the highest CPU utilization, including instances launched later. An administrator creates the widget with the following CloudWatch Metrics Insights query:

    `SELECT MAX(CPUUtilization) FROM "AWS/EC2" WHERE tag.team = 'payments' GROUP BY InstanceId ORDER BY MAX() DESC LIMIT 10`

    The query returns no data, although 25 running instances have the tag team=payments and their CPUUtilization metrics appear in CloudWatch.

    What should the administrator do?
  fr: |
    Une entreprise attribue à chaque instance Amazon EC2 une balise team. L'équipe des paiements veut un widget de tableau de bord CloudWatch qui affiche toujours les 10 instances de l'équipe dont l'utilisation du processeur est la plus élevée, y compris les instances lancées plus tard. Un administrateur crée le widget avec la requête CloudWatch Metrics Insights suivante :

    `SELECT MAX(CPUUtilization) FROM "AWS/EC2" WHERE tag.team = 'payments' GROUP BY InstanceId ORDER BY MAX() DESC LIMIT 10`

    La requête ne renvoie aucune donnée, alors que 25 instances en cours d'exécution ont la balise team=payments et que leurs métriques CPUUtilization apparaissent dans CloudWatch.

    Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Activate team as a user-defined cost allocation tag in the Billing and Cost Management console.", fr: "Activer team comme balise de répartition des coûts définie par l'utilisateur dans la console Billing and Cost Management." } }
    - { id: b, text: { en: "Enable detailed monitoring on the instances so that Metrics Insights can read their tags.", fr: "Activer la surveillance détaillée sur les instances pour que Metrics Insights puisse lire leurs balises." } }
    - { id: c, text: { en: "Turn on the resource tags for telemetry setting in the CloudWatch console settings.", fr: "Activer le paramètre de balises de ressources pour la télémétrie (resource tags for telemetry) dans les paramètres de la console CloudWatch." } }
    - { id: d, text: { en: "Install the CloudWatch agent on the instances and add the team tag with the append_dimensions setting.", fr: "Installer l'agent CloudWatch sur les instances et ajouter la balise team avec le paramètre append_dimensions." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Tag-based Metrics Insights queries work on vended AWS metrics only after resource tags for telemetry is enabled in the account. CloudWatch then enriches metrics from supported resources, including EC2 instances, with their resource tags, so tag.team can be used in WHERE and GROUP BY clauses. The query then follows tag changes and new instances automatically.
    fr: |
      Les requêtes Metrics Insights fondées sur les balises ne fonctionnent sur les métriques AWS fournies par les services qu'après l'activation des balises de ressources pour la télémétrie dans le compte. CloudWatch enrichit alors les métriques des ressources prises en charge, dont les instances EC2, avec leurs balises de ressources : tag.team peut être utilisé dans les clauses WHERE et GROUP BY. La requête suit ensuite automatiquement les modifications de balises et les nouvelles instances.
  options:
    a: { en: "Cost allocation tags affect billing reports, not CloudWatch metric queries.", fr: "Les balises de répartition des coûts concernent les rapports de facturation, pas les requêtes de métriques CloudWatch." }
    b: { en: "Detailed monitoring changes the metric period to 1 minute; it does not add tags to the metrics.", fr: "La surveillance détaillée fait passer la période des métriques à 1 minute ; elle n'ajoute pas de balises aux métriques." }
    d: { en: "The agent publishes its own metrics in a custom namespace; it does not add tags to the AWS/EC2 CPUUtilization metric used by the query.", fr: "L'agent publie ses propres métriques dans un espace de noms personnalisé ; il n'ajoute pas de balises à la métrique AWS/EC2 CPUUtilization utilisée par la requête." }
references:
  - title: Using resource tags for telemetry
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/UsingResourceTagsForTelemetry.html
  - title: Query components and syntax in CloudWatch Metrics Insights
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-metrics-insights-querylanguage.html
