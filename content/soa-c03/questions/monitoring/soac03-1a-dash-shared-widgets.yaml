id: soac03-1a-dash-shared-widgets
objective: "1.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company shared a CloudWatch dashboard with specific email addresses and did not change the IAM policy that the sharing created. The viewers report that some widgets are blank, while the company's engineers see every widget.

    Which three widget types require a change to the policy of the sharing role before the viewers can see them? (Choose three.)
  fr: |
    Une entreprise a partagé un tableau de bord CloudWatch avec des adresses e-mail précises et n'a pas modifié la politique IAM créée par le partage. Les destinataires signalent que certains widgets sont vides, alors que les ingénieurs de l'entreprise voient tous les widgets.

    Quels sont les trois types de widgets qui exigent une modification de la politique du rôle de partage avant que les destinataires puissent les voir ? (Choisissez-en trois.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "A widget that shows the state of a composite alarm", fr: "Un widget qui affiche l'état d'une alarme composite" } }
    - { id: b, text: { en: "A line graph of the `CPUUtilization` metric of several EC2 instances", fr: "Un graphique linéaire de la métrique `CPUUtilization` de plusieurs instances EC2" } }
    - { id: c, text: { en: "A widget that runs a CloudWatch Logs Insights query", fr: "Un widget qui exécute une requête CloudWatch Logs Insights" } }
    - { id: d, text: { en: "A text widget with links to the runbooks of the team", fr: "Un widget de texte avec des liens vers les runbooks de l'équipe" } }
    - { id: e, text: { en: "A custom widget that a Lambda function renders", fr: "Un widget personnalisé généré par une fonction Lambda" } }
    - { id: f, text: { en: "A number widget of the `RequestCount` metric of a load balancer", fr: "Un widget de valeur de la métrique `RequestCount` d'un équilibreur de charge" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "The sharing role grants `cloudwatch:GetMetricData` for all metrics and `cloudwatch:DescribeAlarms` limited to the alarms on the dashboard when it was shared. Composite alarm widgets need `DescribeAlarms` on all alarms, Logs Insights widgets need Logs permissions such as `logs:StartQuery` on the shared log groups, and custom widgets need `lambda:InvokeFunction` on their functions."
    fr: "Le rôle de partage accorde `cloudwatch:GetMetricData` pour toutes les métriques et `cloudwatch:DescribeAlarms` limité aux alarmes présentes sur le tableau de bord au moment du partage. Les widgets d'alarme composite exigent `DescribeAlarms` sur toutes les alarmes, les widgets Logs Insights des autorisations Logs comme `logs:StartQuery` sur les groupes de journaux partagés, et les widgets personnalisés `lambda:InvokeFunction` sur leurs fonctions."
  options:
    b: { en: "Metric graphs use `GetMetricData`, which the sharing role already grants for all metrics.", fr: "Les graphiques de métriques utilisent `GetMetricData`, que le rôle de partage accorde déjà pour toutes les métriques." }
    d: { en: "A text widget only renders Markdown stored in the dashboard and needs no permission.", fr: "Un widget de texte affiche seulement du Markdown stocké dans le tableau de bord et ne nécessite aucune autorisation." }
    f: { en: "A number widget is a metric widget, which `GetMetricData` already covers.", fr: "Un widget de valeur est un widget de métrique, déjà couvert par `GetMetricData`." }
references:
  - title: Sharing CloudWatch dashboards
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-dashboard-sharing.html
