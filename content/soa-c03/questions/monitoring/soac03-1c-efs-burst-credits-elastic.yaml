id: soac03-1c-efs-burst-credits-elastic
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a content management system on Amazon EC2 instances that share a 200 GiB Amazon EFS file system in Bursting throughput mode. The traffic is spiky and unpredictable. Every afternoon, the BurstCreditBalance metric reaches zero and pages load slowly, while the file system is almost idle at night. The company wants to fix the performance problem without storing extra data and with the LEAST management effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un système de gestion de contenu sur des instances Amazon EC2 qui partagent un système de fichiers Amazon EFS de 200 Gio en mode de débit Bursting. Le trafic est irrégulier et imprévisible. Chaque après-midi, la métrique BurstCreditBalance tombe à zéro et les pages se chargent lentement, alors que le système de fichiers est presque inactif la nuit. L'entreprise veut corriger le problème de performance sans stocker de données supplémentaires et avec le MOINS d'effort de gestion possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Switch the file system to Elastic throughput mode.", fr: "Faire passer le système de fichiers en mode de débit Elastic." } }
    - { id: b, text: { en: "Change the file system to the Max I/O performance mode.", fr: "Faire passer le système de fichiers en mode de performance Max I/O." } }
    - { id: c, text: { en: "Write large placeholder files to the file system to raise its baseline throughput.", fr: "Écrire de gros fichiers de remplissage dans le système de fichiers pour augmenter son débit de référence." } }
    - { id: d, text: { en: "Create more mount targets so that each instance connects to a different mount target.", fr: "Créer d'autres cibles de montage pour que chaque instance se connecte à une cible de montage différente." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In Bursting mode, the baseline throughput depends on the amount of data in EFS Standard, so a 200 GiB file system runs out of burst credits under a sustained peak. Elastic throughput scales automatically with the workload, uses no burst credits and is billed for the data actually read and written, which suits spiky, unpredictable traffic and needs no capacity planning."
    fr: "En mode Bursting, le débit de référence dépend de la quantité de données dans EFS Standard : un système de fichiers de 200 Gio épuise ses crédits de rafale lors d'un pic prolongé. Le débit Elastic s'adapte automatiquement à la charge, n'utilise pas de crédits de rafale et est facturé selon les données réellement lues et écrites, ce qui convient à un trafic irrégulier et imprévisible sans planification de capacité."
  options:
    b:
      en: "The performance mode is chosen at creation, Max I/O is a previous-generation mode with higher latency, and it does not add throughput or burst credits."
      fr: "Le mode de performance est choisi à la création, Max I/O est un mode d'ancienne génération à latence plus élevée, et il n'ajoute ni débit ni crédits de rafale."
    c:
      en: "Padding the file system raises the baseline but stores extra data and adds storage cost, which the company wants to avoid."
      fr: "Remplir le système de fichiers augmente le débit de référence mais stocke des données supplémentaires et ajoute un coût de stockage, ce que l'entreprise veut éviter."
    d:
      en: "Throughput limits apply to the whole file system; EFS allows one mount target per Availability Zone, and more connections do not add burst credits."
      fr: "Les limites de débit s'appliquent à l'ensemble du système de fichiers ; EFS autorise une cible de montage par zone de disponibilité, et davantage de connexions n'ajoutent pas de crédits de rafale."
references:
  - title: Amazon EFS performance specifications
    url: https://docs.aws.amazon.com/efs/latest/ug/performance.html
