id: soac03-1b-ssm-multi-account-roles
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. The operations team wants to run an AWS-owned Automation runbook from a central operations account, which is registered as a delegated administrator for Systems Manager. The runbook must run in all accounts of two organizational units (OUs) and in three AWS Regions with a single start-automation-execution command that uses the --target-locations option.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise AWS Organizations. L'équipe d'exploitation veut exécuter un runbook Automation fourni par AWS depuis un compte d'exploitation central, enregistré comme administrateur délégué pour Systems Manager. Le runbook doit s'exécuter dans tous les comptes de deux unités d'organisation (UO) et dans trois Régions AWS, avec une seule commande start-automation-execution qui utilise l'option --target-locations.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the AWS-SystemsManager-AutomationAdministrationRole IAM role in the central operations account.", fr: "Créer le rôle IAM AWS-SystemsManager-AutomationAdministrationRole dans le compte d'exploitation central." } }
    - { id: b, text: { en: "Create the AWS-SystemsManager-AutomationExecutionRole IAM role in every target account, for example with CloudFormation StackSets.", fr: "Créer le rôle IAM AWS-SystemsManager-AutomationExecutionRole dans chaque compte cible, par exemple avec CloudFormation StackSets." } }
    - { id: c, text: { en: "Share the AWS-owned runbook with every target account by using AWS Resource Access Manager.", fr: "Partager le runbook fourni par AWS avec chaque compte cible à l'aide d'AWS Resource Access Manager." } }
    - { id: d, text: { en: "Create an IAM user with access keys in every target account and store the keys in Parameter Store in the central account.", fr: "Créer un utilisateur IAM avec des clés d'accès dans chaque compte cible et stocker les clés dans Parameter Store dans le compte central." } }
    - { id: e, text: { en: "Create a State Manager association in every target account that points to the central operations account.", fr: "Créer dans chaque compte cible une association State Manager qui pointe vers le compte d'exploitation central." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Multi-account and multi-Region automations need two roles. AWS-SystemsManager-AutomationAdministrationRole is created only in the central account and lets it run automations in other accounts and OUs. AWS-SystemsManager-AutomationExecutionRole must exist in every target account, and AWS recommends deploying it with StackSets. Running across OUs requires the management account or a delegated administrator, which the central account already is.
    fr: |
      Les automatisations multicomptes et multi-Régions exigent deux rôles. AWS-SystemsManager-AutomationAdministrationRole est créé uniquement dans le compte central et lui permet d'exécuter des automatisations dans d'autres comptes et UO. AWS-SystemsManager-AutomationExecutionRole doit exister dans chaque compte cible, et AWS recommande de le déployer avec StackSets. L'exécution sur des UO exige le compte de gestion ou un administrateur délégué, ce qu'est déjà le compte central.
  options:
    c: { en: "Only custom runbooks must be shared with the target accounts; AWS-owned runbooks are already available in every account.", fr: "Seuls les runbooks personnalisés doivent être partagés avec les comptes cibles ; les runbooks fournis par AWS sont déjà disponibles dans chaque compte." }
    d: { en: "Long-term access keys are not part of the solution and are a security risk; Automation uses IAM roles.", fr: "Des clés d'accès à long terme ne font pas partie de la solution et présentent un risque de sécurité ; Automation utilise des rôles IAM." }
    e: { en: "Associations run locally on a schedule; they do not let the central account run a runbook in other accounts with --target-locations.", fr: "Les associations s'exécutent localement selon une planification ; elles ne permettent pas au compte central d'exécuter un runbook dans d'autres comptes avec --target-locations." }
references:
  - title: Running automations in multiple AWS Regions and accounts
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-multiple-accounts-regions.html
