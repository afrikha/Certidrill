id: soac03-1c-rds-dbload-vcpu-alarm
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs 40 Amazon RDS for MySQL DB instances of different instance classes, from 2 to 64 vCPUs. The operations team wants a single CloudWatch alarm definition, deployed to every DB instance with the same threshold, that goes into the ALARM state when the database load exceeds the number of vCPUs of the instance for 15 minutes.

    Which metric and threshold should the alarm use?
  fr: |
    Une entreprise exécute 40 instances de base de données Amazon RDS for MySQL de différentes classes d'instance, de 2 à 64 vCPU. L'équipe d'exploitation veut une seule définition d'alarme CloudWatch, déployée sur chaque instance avec le même seuil, qui passe à l'état ALARM lorsque la charge de la base de données dépasse le nombre de vCPU de l'instance pendant 15 minutes.

    Quelle métrique et quel seuil l'alarme doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "DBLoad, with a threshold greater than 1", fr: "DBLoad, avec un seuil supérieur à 1" } }
    - { id: b, text: { en: "DBLoadCPU, with a threshold greater than 1", fr: "DBLoadCPU, avec un seuil supérieur à 1" } }
    - { id: c, text: { en: "DBLoadRelativeToNumVCPUs, with a threshold greater than 1", fr: "DBLoadRelativeToNumVCPUs, avec un seuil supérieur à 1" } }
    - { id: d, text: { en: "CPUUtilization, with a threshold of 100 percent", fr: "CPUUtilization, avec un seuil de 100 %" } }
answer: { optionId: c }
explanation:
  correct:
    en: "DBLoadRelativeToNumVCPUs is the ratio of the DB load (average active sessions) to the number of vCPUs of the DB instance, and it is published to CloudWatch in the AWS/RDS namespace. A value above 1 means that more sessions are active than the instance has vCPUs, whatever its size, so one threshold works for all 40 instances."
    fr: "DBLoadRelativeToNumVCPUs est le rapport entre la charge de la base de données (sessions actives moyennes) et le nombre de vCPU de l'instance, et elle est publiée dans CloudWatch dans l'espace de noms AWS/RDS. Une valeur supérieure à 1 signifie que plus de sessions sont actives que l'instance n'a de vCPU, quelle que soit sa taille : un seul seuil fonctionne pour les 40 instances."
  options:
    a:
      en: "DBLoad is an absolute number of active sessions, so the threshold would have to match the vCPU count of each instance class."
      fr: "DBLoad est un nombre absolu de sessions actives : le seuil devrait correspondre au nombre de vCPU de chaque classe d'instance."
    b:
      en: "DBLoadCPU counts only sessions in the CPU wait state and is also absolute, so a threshold of 1 does not mean that the load exceeds the vCPUs."
      fr: "DBLoadCPU ne compte que les sessions dans l'état d'attente CPU et est aussi absolue : un seuil de 1 ne signifie pas que la charge dépasse les vCPU."
    d:
      en: "CPUUtilization cannot exceed 100 percent and does not count sessions waiting for other resources, so it cannot show load above the vCPU count."
      fr: "CPUUtilization ne peut pas dépasser 100 % et ne compte pas les sessions qui attendent d'autres ressources : elle ne peut pas montrer une charge supérieure au nombre de vCPU."
references:
  - title: Amazon CloudWatch metrics for Amazon RDS Performance Insights
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PerfInsights.Cloudwatch.html
