id: soac03-1a-rds-sub-encrypted-topic
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company created an Amazon RDS event subscription for the failover and low storage events of its production DB instances. The subscription targets an SNS topic that uses server-side encryption with a customer managed AWS KMS key. The topic's access policy allows Amazon RDS to publish. The email subscriptions are confirmed, and a test message published from the SNS console reaches them. A failover test produced no notification.

    Which solution will fix the problem?
  fr: |
    Une entreprise a créé un abonnement aux événements Amazon RDS pour les événements de basculement et de stockage faible de ses instances de base de données de production. L'abonnement cible une rubrique SNS qui utilise le chiffrement côté serveur avec une clé AWS KMS gérée par le client. La politique d'accès de la rubrique autorise Amazon RDS à publier. Les abonnements e-mail sont confirmés, et un message de test publié depuis la console SNS leur parvient. Un test de basculement n'a produit aucune notification.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - id: a
      text: { en: "Switch the encryption of the topic to the AWS managed key `aws/sns` for Amazon SNS.", fr: "Passer le chiffrement de la rubrique à la clé gérée par AWS `aws/sns` d'Amazon SNS." }
    - id: b
      text: { en: "Add `sns:Publish` on the topic to the permissions of the service-linked role of Amazon RDS.", fr: "Ajouter `sns:Publish` sur la rubrique aux autorisations du rôle lié au service d'Amazon RDS." }
    - id: c
      text: { en: "Recreate the event subscription with the source type set to all DB instances.", fr: "Recréer l'abonnement aux événements avec le type de source défini sur toutes les instances de base de données." }
    - id: d
      text: { en: "Allow `events.rds.amazonaws.com` to use `kms:GenerateDataKey*` and `kms:Decrypt` in the key policy.", fr: "Autoriser `events.rds.amazonaws.com` à utiliser `kms:GenerateDataKey*` et `kms:Decrypt` dans la politique de clé." }
answer: { optionId: d }
explanation:
  correct:
    en: "An AWS service that publishes to an encrypted topic must be able to use the KMS key. For Amazon RDS events, the key policy of the customer managed key must allow the `events.rds.amazonaws.com` service principal to call `kms:GenerateDataKey*` and `kms:Decrypt`. The console test works because the engineer has access to the key."
    fr: "Un service AWS qui publie dans une rubrique chiffrée doit pouvoir utiliser la clé KMS. Pour les événements Amazon RDS, la politique de la clé gérée par le client doit autoriser le principal de service `events.rds.amazonaws.com` à appeler `kms:GenerateDataKey*` et `kms:Decrypt`. Le test depuis la console fonctionne, car l'ingénieur a accès à la clé."
  options:
    a: { en: "AWS services that publish to encrypted topics need a customer managed key; the key policy of `aws/sns` cannot be changed to allow them.", fr: "Les services AWS qui publient dans des rubriques chiffrées ont besoin d'une clé gérée par le client ; la politique de clé de `aws/sns` ne peut pas être modifiée pour les autoriser." }
    b: { en: "The publish permission already exists in the topic policy; the missing permission is the use of the KMS key.", fr: "L'autorisation de publication existe déjà dans la politique de la rubrique ; l'autorisation manquante est l'utilisation de la clé KMS." }
    c: { en: "The subscription already covers the production DB instances; widening it does not fix the encryption permission.", fr: "L'abonnement couvre déjà les instances de base de données de production ; l'élargir ne corrige pas l'autorisation de chiffrement." }
references:
  - title: Managing Amazon SNS encryption keys and costs
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-key-management.html
