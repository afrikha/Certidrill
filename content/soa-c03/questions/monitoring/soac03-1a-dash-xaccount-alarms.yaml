id: soac03-1a-dash-xaccount-alarms
objective: "1.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations with 30 member accounts. All workloads run in the eu-central-1 Region. The central operations team works in a dedicated monitoring account. From that account, the team must build dashboards that show the metrics of all the member accounts and must create CloudWatch alarms on those metrics. Accounts that join the organization later must be included automatically.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise AWS Organizations avec 30 comptes membres. Toutes les charges de travail s'exécutent dans la Région eu-central-1. L'équipe centrale des opérations travaille dans un compte de surveillance dédié. Depuis ce compte, l'équipe doit créer des tableaux de bord qui affichent les métriques de tous les comptes membres et créer des alarmes CloudWatch sur ces métriques. Les comptes qui rejoindront l'organisation plus tard doivent être inclus automatiquement.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In each member account, create the CloudWatch-CrossAccountSharingRole role, and then turn on the cross-account cross-Region console in the monitoring account.", fr: "Dans chaque compte membre, créer le rôle CloudWatch-CrossAccountSharingRole, puis activer la console multicompte et multirégion dans le compte de surveillance." } }
    - { id: b, text: { en: "In eu-central-1, configure the monitoring account as a CloudWatch cross-account observability monitoring account with a sink that the organization can link to.", fr: "Dans eu-central-1, configurer le compte de surveillance comme compte de surveillance de l'observabilité multicompte CloudWatch, avec un récepteur (sink) auquel l'organisation peut se lier." } }
    - { id: c, text: { en: "In each member account, create a CloudWatch metric stream that sends the metrics to a Data Firehose stream in the monitoring account.", fr: "Dans chaque compte membre, créer un flux de métriques CloudWatch qui envoie les métriques à un flux Data Firehose du compte de surveillance." } }
    - { id: d, text: { en: "Link the organization to the sink as source accounts, so that the member accounts share their metrics with the monitoring account.", fr: "Lier l'organisation au récepteur en tant que comptes sources, pour que les comptes membres partagent leurs métriques avec le compte de surveillance." } }
    - { id: e, text: { en: "Create an AWS Config aggregator in the monitoring account that collects the configuration of all the member accounts.", fr: "Créer dans le compte de surveillance un agrégateur AWS Config qui collecte la configuration de tous les comptes membres." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "With CloudWatch cross-account observability, source accounts link to a sink in the monitoring account of the Region. In the monitoring account, the team can then graph source-account metrics on dashboards and create alarms on them. Linking through AWS Organizations onboards new accounts automatically."
    fr: "Avec l'observabilité multicompte CloudWatch, les comptes sources se lient à un récepteur du compte de surveillance dans la Région. Dans le compte de surveillance, l'équipe peut alors représenter les métriques des comptes sources dans des tableaux de bord et créer des alarmes sur ces métriques. La liaison via AWS Organizations intègre automatiquement les nouveaux comptes."
  options:
    a: { en: "The cross-account cross-Region console can display other accounts' metrics, but it cannot create alarms on metrics in other accounts.", fr: "La console multicompte et multirégion peut afficher les métriques d'autres comptes, mais elle ne permet pas de créer des alarmes sur les métriques d'autres comptes." }
    c: { en: "Metric streams deliver metrics to a Firehose destination, not to CloudWatch metrics of the monitoring account on which alarms can be created.", fr: "Les flux de métriques livrent les métriques à une destination Firehose, et non dans les métriques CloudWatch du compte de surveillance sur lesquelles des alarmes peuvent être créées." }
    e: { en: "A Config aggregator collects resource configuration and compliance data, not CloudWatch metrics.", fr: "Un agrégateur Config collecte des données de configuration et de conformité des ressources, et non des métriques CloudWatch." }
references:
  - title: CloudWatch cross-account observability
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Unified-Cross-Account.html
  - title: Using Amazon CloudWatch dashboards
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Dashboards.html
