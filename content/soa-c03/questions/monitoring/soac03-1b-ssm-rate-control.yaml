id: soac03-1b-ssm-rate-control
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator must run a custom Automation runbook that restarts an application service on 200 Amazon EC2 instances that have the tag Role=web. The runbook takes an InstanceId parameter. To keep the website available, no more than 10 % of the instances can run the runbook at the same time, and the operation must stop if more than 5 instances fail.

    Which AWS CLI command will meet these requirements?
  fr: |
    Un administrateur doit exécuter un runbook Automation personnalisé qui redémarre un service applicatif sur 200 instances Amazon EC2 qui ont la balise Role=web. Le runbook prend un paramètre InstanceId. Pour que le site web reste disponible, au plus 10 % des instances peuvent exécuter le runbook en même temps, et l'opération doit s'arrêter si plus de 5 instances échouent.

    Quelle commande AWS CLI répond à ces exigences ?
body:
  options:
    - { id: a, text: "`aws ssm start-automation-execution --document-name RestartWebService --targets Key=tag:Role,Values=web --target-parameter-name InstanceId --max-concurrency 10% --max-errors 5`" }
    - { id: b, text: "`aws ssm start-automation-execution --document-name RestartWebService --targets Key=tag:Role,Values=web --target-parameter-name InstanceId --max-concurrency 5 --max-errors 10%`" }
    - { id: c, text: "`aws ssm send-command --document-name RestartWebService --targets Key=tag:Role,Values=web --max-concurrency 10% --max-errors 5`" }
    - { id: d, text: "`aws ssm start-automation-execution --document-name RestartWebService --parameters InstanceId=tag:Role=web --max-concurrency 10% --max-errors 5`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Rate control in Automation uses targets (here, a tag) together with --target-parameter-name, which names the runbook parameter that receives each target's ID. --max-concurrency limits how many targets run at the same time and accepts a number or a percentage, and --max-errors sets how many failures are allowed before Automation stops sending the runbook to other targets.
    fr: |
      Le contrôle du débit d'Automation utilise des cibles (ici, une balise) avec --target-parameter-name, qui nomme le paramètre du runbook recevant l'ID de chaque cible. --max-concurrency limite le nombre de cibles traitées en même temps et accepte un nombre ou un pourcentage, et --max-errors fixe le nombre d'échecs autorisés avant qu'Automation cesse d'envoyer le runbook à d'autres cibles.
  options:
    b: { en: "The values are swapped: this allows only 5 concurrent targets and stops after 10 % of the targets (20 instances) fail.", fr: "Les valeurs sont inversées : cette commande n'autorise que 5 cibles simultanées et s'arrête après l'échec de 10 % des cibles (20 instances)." }
    c: { en: "send-command runs Command documents with Run Command; it cannot run an Automation runbook.", fr: "send-command exécute des documents de type Command avec Run Command ; il ne peut pas exécuter un runbook Automation." }
    d: { en: "A tag expression is not a valid InstanceId value; targeting by tag requires --targets and --target-parameter-name.", fr: "Une expression de balise n'est pas une valeur valide pour InstanceId ; le ciblage par balise exige --targets et --target-parameter-name." }
references:
  - title: Run automated operations at scale
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-scale.html
