id: soac03-1b-lambda-throttles-reserved
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function processes image uploads for a photo-sharing application. During a marketing campaign, users report failed uploads. CloudWatch shows that the function's Throttles metric is high and that its ConcurrentExecutions metric stays flat at exactly 50. The function has a reserved concurrency of 50. The account's Regional concurrency quota is 1,000, and the other functions in the account use fewer than 200 concurrent executions.

    Which solutions will stop the throttling? (Choose two.)
  fr: |
    Une fonction AWS Lambda traite les chargements d'images d'une application de partage de photos. Pendant une campagne marketing, des utilisateurs signalent des chargements en échec. CloudWatch montre que la métrique Throttles de la fonction est élevée et que sa métrique ConcurrentExecutions reste plate à exactement 50. La fonction a une simultanéité réservée de 50. Le quota de simultanéité régional du compte est de 1 000, et les autres fonctions du compte utilisent moins de 200 exécutions simultanées.

    Quelles solutions mettent fin à la limitation (throttling) ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the memory size of the function so that each invocation finishes faster.", fr: "Augmenter la taille mémoire de la fonction pour que chaque invocation se termine plus vite." } }
    - { id: b, text: { en: "Increase the reserved concurrency of the function to a value that covers the peak load.", fr: "Augmenter la simultanéité réservée de la fonction jusqu'à une valeur qui couvre le pic de charge." } }
    - { id: c, text: { en: "Increase the timeout of the function so that invocations are not stopped early.", fr: "Augmenter le délai d'expiration de la fonction pour que les invocations ne soient pas arrêtées trop tôt." } }
    - { id: d, text: { en: "Remove the reserved concurrency setting so that the function uses the unreserved concurrency pool of the account.", fr: "Supprimer le paramètre de simultanéité réservée pour que la fonction utilise le pool de simultanéité non réservée du compte." } }
    - { id: e, text: { en: "Configure an on-failure destination that sends failed invocation records to an Amazon SQS queue.", fr: "Configurer une destination en cas d'échec qui envoie les enregistrements d'invocation en échec vers une file d'attente Amazon SQS." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Reserved concurrency is both a floor and a ceiling: the function cannot scale beyond it, and Lambda throttles extra requests once ConcurrentExecutions reaches it. A flat line at 50 with throttles shows that the reserved value is the bottleneck. Raising the reserved value, or removing it so that the function shares the large unreserved pool, lets the function scale.
    fr: |
      La simultanéité réservée est à la fois un plancher et un plafond : la fonction ne peut pas monter au-delà, et Lambda limite les requêtes supplémentaires dès que ConcurrentExecutions l'atteint. Une ligne plate à 50 accompagnée de limitations montre que la valeur réservée est le goulot d'étranglement. Augmenter la valeur réservée, ou la supprimer pour que la fonction partage le grand pool non réservé, permet à la fonction de monter en charge.
  options:
    a: { en: "More memory can shorten each invocation, but the ceiling of 50 concurrent executions stays and the campaign peak still exceeds it.", fr: "Plus de mémoire peut raccourcir chaque invocation, mais le plafond de 50 exécutions simultanées demeure et le pic de la campagne le dépasse toujours." }
    c: { en: "A longer timeout keeps execution environments busy longer, which can make throttling worse.", fr: "Un délai d'expiration plus long occupe plus longtemps les environnements d'exécution, ce qui peut aggraver la limitation." }
    e: { en: "A destination records failures after they occur; it does not add concurrency.", fr: "Une destination enregistre les échecs après coup ; elle n'ajoute pas de simultanéité." }
references:
  - title: Configuring reserved concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html
  - title: Types of metrics for Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics-types.html
