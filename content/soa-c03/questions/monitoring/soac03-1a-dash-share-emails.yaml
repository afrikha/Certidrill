id: soac03-1a-dash-share-emails
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has a CloudWatch dashboard that shows the availability metrics of its platform. Three external auditors must view this dashboard during an audit. The auditors must not receive AWS credentials, and each auditor must sign in with a password before seeing the dashboard. Nobody else outside the company may view it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un tableau de bord CloudWatch qui affiche les métriques de disponibilité de sa plateforme. Trois auditeurs externes doivent consulter ce tableau de bord pendant un audit. Les auditeurs ne doivent pas recevoir d'informations d'identification AWS, et chacun doit se connecter avec un mot de passe avant de voir le tableau de bord. Personne d'autre en dehors de l'entreprise ne doit pouvoir le consulter.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Share the dashboard publicly and send the link only to the three auditors.", fr: "Partager le tableau de bord publiquement et n'envoyer le lien qu'aux trois auditeurs." }
    - id: b
      text: { en: "Create an IAM user for each auditor with the CloudWatchReadOnlyAccess policy.", fr: "Créer un utilisateur IAM pour chaque auditeur avec la politique CloudWatchReadOnlyAccess." }
    - id: c
      text: { en: "Share the dashboard with the email addresses of the three auditors.", fr: "Partager le tableau de bord avec les adresses e-mail des trois auditeurs." }
    - id: d
      text: { en: "Export the dashboard JSON source and send the file to the three auditors.", fr: "Exporter la source JSON du tableau de bord et envoyer le fichier aux trois auditeurs." }
answer: { optionId: c }
explanation:
  correct:
    en: "A dashboard can be shared with up to five specific email addresses. Each recipient creates a password and signs in through the Amazon Cognito resources that the sharing creates, without any AWS account or IAM credentials."
    fr: "Un tableau de bord peut être partagé avec cinq adresses e-mail précises au maximum. Chaque destinataire crée un mot de passe et se connecte via les ressources Amazon Cognito créées par le partage, sans compte AWS ni informations d'identification IAM."
  options:
    a: { en: "Anyone who has the link of a public dashboard can view it, without a password.", fr: "Toute personne qui possède le lien d'un tableau de bord public peut le consulter, sans mot de passe." }
    b: { en: "IAM users are AWS credentials, which the auditors must not receive.", fr: "Les utilisateurs IAM sont des informations d'identification AWS, que les auditeurs ne doivent pas recevoir." }
    d: { en: "The JSON source describes the widgets; it contains no metric data that the auditors could view.", fr: "La source JSON décrit les widgets ; elle ne contient aucune donnée de métrique que les auditeurs pourraient consulter." }
references:
  - title: Sharing CloudWatch dashboards
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-dashboard-sharing.html
