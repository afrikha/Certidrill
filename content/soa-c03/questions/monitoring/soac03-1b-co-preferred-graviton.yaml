id: soac03-1b-co-preferred-graviton
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has validated its applications only on AWS Graviton-based instance families M7g, C7g, and R7g. AWS Compute Optimizer often recommends x86-based instance types for the company's Amazon EC2 instances, so the operations team ignores those recommendations.

    The team wants Compute Optimizer to recommend only instance types from the validated families, including future generations of those families, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise n'a validé ses applications que sur les familles d'instances AWS Graviton M7g, C7g et R7g. AWS Compute Optimizer recommande souvent des types d'instances x86 pour les instances Amazon EC2 de l'entreprise, et l'équipe d'exploitation ignore donc ces recommandations.

    L'équipe veut que Compute Optimizer ne recommande que des types d'instances des familles validées, y compris les futures générations de ces familles, avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Export the recommendations to Amazon S3 every week and filter out x86 instance types with Amazon Athena.", fr: "Exporter chaque semaine les recommandations vers Amazon S3 et exclure les types d'instances x86 avec Amazon Athena." } }
    - { id: b, text: { en: "Set the CPU utilization threshold to P90 and the CPU headroom to 30 % in the rightsizing preferences.", fr: "Définir le seuil d'utilisation du processeur sur P90 et la marge de processeur sur 30 % dans les préférences de dimensionnement." } }
    - { id: c, text: { en: "Create an SCP that denies ec2:RunInstances for x86 instance types in all accounts.", fr: "Créer une SCP qui refuse ec2:RunInstances pour les types d'instances x86 dans tous les comptes." } }
    - { id: d, text: { en: "Configure the preferred EC2 instances preference with the M7g, C7g, and R7g families and the option to include future versions.", fr: "Configurer la préférence preferred EC2 instances avec les familles M7g, C7g et R7g et l'option d'inclure les versions futures." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The preferred EC2 instances preference defines the set of instance types and families that Compute Optimizer considers in its recommendations. It can automatically include future versions of the chosen families. AWS advises not to restrict the set too much, because a narrow set can reduce savings.
    fr: |
      La préférence preferred EC2 instances définit l'ensemble des types et familles d'instances que Compute Optimizer prend en compte dans ses recommandations. Elle peut inclure automatiquement les versions futures des familles choisies. AWS conseille de ne pas trop restreindre l'ensemble, car un ensemble étroit peut réduire les économies.
  options:
    a: { en: "Filtering exports by hand every week adds recurring work, and the filtered list loses the next-best Graviton options.", fr: "Filtrer les exportations à la main chaque semaine ajoute un travail récurrent, et la liste filtrée perd les meilleures options Graviton suivantes." }
    b: { en: "Thresholds and headroom change how much capacity is recommended, not which instance families are considered.", fr: "Les seuils et la marge changent la capacité recommandée, pas les familles d'instances prises en compte." }
    c: { en: "An SCP blocks launches but does not change the recommendations that Compute Optimizer shows.", fr: "Une SCP bloque des lancements mais ne change pas les recommandations affichées par Compute Optimizer." }
references:
  - title: Rightsizing recommendation preferences
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/rightsizing-preferences.html
