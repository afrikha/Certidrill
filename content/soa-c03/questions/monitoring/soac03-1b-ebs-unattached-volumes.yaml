id: soac03-1b-ebs-unattached-volumes
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cost review shows that an AWS account pays for many EBS volumes that remained after Amazon EC2 instances were terminated. Before it snapshots and deletes them, an administrator must list every EBS volume in the Region that is not attached to any instance.

    Which AWS CLI command should the administrator run?
  fr: |
    Une revue des coûts montre qu'un compte AWS paie de nombreux volumes EBS restés en place après la résiliation d'instances Amazon EC2. Avant de créer leurs instantanés et de les supprimer, un administrateur doit lister tous les volumes EBS de la Région qui ne sont attachés à aucune instance.

    Quelle commande AWS CLI l'administrateur doit-il exécuter ?
body:
  options:
    - { id: a, text: "`aws ec2 describe-volumes --filters Name=status,Values=in-use`" }
    - { id: b, text: "`aws ec2 describe-volume-status --filters Name=volume-status.status,Values=impaired`" }
    - { id: c, text: "`aws ec2 describe-volumes --filters Name=attachment.status,Values=detaching`" }
    - { id: d, text: "`aws ec2 describe-volumes --filters Name=status,Values=available`" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A volume in the available state is not attached to an instance, and a volume in the in-use state is attached. The status filter of describe-volumes returns the volumes in a given state, so Values=available lists the unattached volumes that still incur storage charges.
    fr: |
      Un volume à l'état available n'est attaché à aucune instance, et un volume à l'état in-use est attaché. Le filtre status de describe-volumes renvoie les volumes d'un état donné : Values=available liste les volumes non attachés qui génèrent toujours des frais de stockage.
  options:
    a: { en: "in-use returns the volumes that are attached to instances, the opposite of the requirement.", fr: "in-use renvoie les volumes attachés à des instances, soit l'inverse de l'exigence." }
    b: { en: "Volume status checks report impaired volumes, not whether a volume is attached.", fr: "Les vérifications de l'état des volumes signalent les volumes défaillants, pas le fait qu'un volume soit attaché." }
    c: { en: "detaching shows only volumes that are being detached at this moment, not volumes that are already unattached.", fr: "detaching ne montre que les volumes en cours de détachement à cet instant, pas ceux déjà détachés." }
references:
  - title: View information about an Amazon EBS volume
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-describing-volumes.html
