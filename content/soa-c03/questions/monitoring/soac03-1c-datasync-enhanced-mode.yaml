id: soac03-1c-datasync-enhanced-mode
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an AWS DataSync task in Basic mode to copy about 400 million small objects from an Amazon S3 bucket to another S3 bucket in a different AWS Region. The task execution fails because the number of objects exceeds the DataSync quota for a Basic mode task execution. The copy must finish as soon as possible, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise une tâche AWS DataSync en mode Basic pour copier environ 400 millions de petits objets d'un compartiment Amazon S3 vers un autre compartiment S3 situé dans une autre Région AWS. L'exécution de la tâche échoue, car le nombre d'objets dépasse le quota DataSync d'une exécution de tâche en mode Basic. La copie doit se terminer le plus tôt possible, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a new DataSync task in Enhanced mode with the same source and destination locations, and start it.", fr: "Créer une nouvelle tâche DataSync en mode Enhanced avec les mêmes emplacements source et destination, puis la démarrer." } }
    - { id: b, text: { en: "Update the existing task to change its task mode from Basic to Enhanced, and start a new execution.", fr: "Mettre à jour la tâche existante pour faire passer son mode de Basic à Enhanced, puis démarrer une nouvelle exécution." } }
    - { id: c, text: { en: "Deploy a DataSync agent on an Amazon EC2 instance in the destination Region and recreate the task in Basic mode.", fr: "Déployer un agent DataSync sur une instance Amazon EC2 de la Région de destination et recréer la tâche en mode Basic." } }
    - { id: d, text: { en: "Request a quota increase for objects per Basic mode task execution, and rerun the task after approval.", fr: "Demander une augmentation du quota d'objets par exécution de tâche en mode Basic, puis relancer la tâche après approbation." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Enhanced mode handles a virtually unlimited number of objects per task execution and lists, prepares, transfers and verifies data in parallel, so it is generally faster than Basic mode. S3-to-S3 transfers need no agent. Because the task mode is chosen when a task is created, the company must create a new task in Enhanced mode."
    fr: "Le mode Enhanced traite un nombre d'objets pratiquement illimité par exécution de tâche et liste, prépare, transfère et vérifie les données en parallèle : il est généralement plus rapide que le mode Basic. Les transferts de S3 vers S3 ne nécessitent pas d'agent. Comme le mode est choisi à la création de la tâche, l'entreprise doit créer une nouvelle tâche en mode Enhanced."
  options:
    b:
      en: "The task mode of an existing DataSync task cannot be changed after the task is created."
      fr: "Le mode d'une tâche DataSync existante ne peut pas être modifié après sa création."
    c:
      en: "An agent does not change the Basic mode object quota, and transfers between S3 buckets do not need an agent."
      fr: "Un agent ne change pas le quota d'objets du mode Basic, et les transferts entre compartiments S3 ne nécessitent pas d'agent."
    d:
      en: "A quota request takes days to process, and the rerun would still use the slower sequential Basic mode."
      fr: "Une demande de quota prend plusieurs jours, et la nouvelle exécution utiliserait toujours le mode Basic, séquentiel et plus lent."
references:
  - title: Choosing a task mode for your data transfer
    url: https://docs.aws.amazon.com/datasync/latest/userguide/choosing-task-mode.html
  - title: AWS DataSync quotas
    url: https://docs.aws.amazon.com/datasync/latest/userguide/datasync-limits.html
