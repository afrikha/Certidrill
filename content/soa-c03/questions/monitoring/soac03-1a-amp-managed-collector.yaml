id: soac03-1a-amp-managed-collector
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs its workloads on an Amazon EKS cluster. The pods expose metrics in Prometheus format. The site reliability team wants to store these metrics in an Amazon Managed Service for Prometheus workspace and query them with PromQL. The team does not want to install, patch, or scale any metrics collector inside the cluster.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute ses charges de travail sur un cluster Amazon EKS. Les pods exposent des métriques au format Prometheus. L'équipe d'ingénierie de fiabilité veut stocker ces métriques dans un espace de travail Amazon Managed Service for Prometheus et les interroger avec PromQL. L'équipe ne veut installer, corriger ni mettre à l'échelle aucun collecteur de métriques dans le cluster.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy the AWS Distro for OpenTelemetry collector as a DaemonSet that scrapes the pods and uses remote write.", fr: "Déployer le collecteur AWS Distro for OpenTelemetry en tant que DaemonSet qui collecte les pods et utilise l'écriture distante (remote write)." } }
    - { id: b, text: { en: "Create an Amazon Managed Service for Prometheus workspace in the Region of the cluster.", fr: "Créer un espace de travail Amazon Managed Service for Prometheus dans la Région du cluster." } }
    - { id: c, text: { en: "Install the Amazon CloudWatch Observability EKS add-on to send the Prometheus metrics to CloudWatch.", fr: "Installer le module complémentaire EKS Amazon CloudWatch Observability pour envoyer les métriques Prometheus à CloudWatch." } }
    - { id: d, text: { en: "Create an AWS managed collector (scraper) for the cluster with a scrape configuration that targets the workspace.", fr: "Créer un collecteur géré par AWS (scraper) pour le cluster, avec une configuration de collecte qui cible l'espace de travail." } }
    - { id: e, text: { en: "Create an Amazon Managed Grafana workspace and add the EKS cluster as a Prometheus data source.", fr: "Créer un espace de travail Amazon Managed Grafana et ajouter le cluster EKS comme source de données Prometheus." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "An AWS managed collector is an agentless scraper that AWS runs: it discovers the pods with Kubernetes service discovery, scrapes their Prometheus endpoints and writes the samples to an Amazon Managed Service for Prometheus workspace. The cluster, the scraper and the workspace must be in the same Region, and nothing has to be deployed or maintained in the cluster."
    fr: "Un collecteur géré par AWS est un scraper sans agent qu'AWS exécute : il découvre les pods grâce à la découverte de services Kubernetes, collecte leurs points de terminaison Prometheus et écrit les échantillons dans un espace de travail Amazon Managed Service for Prometheus. Le cluster, le scraper et l'espace de travail doivent être dans la même Région, et rien n'est à déployer ni à maintenir dans le cluster."
  options:
    a: { en: "The ADOT collector works, but it runs in the cluster and the team must operate it, which the requirements exclude.", fr: "Le collecteur ADOT fonctionne, mais il s'exécute dans le cluster et l'équipe doit l'exploiter, ce que les exigences excluent." }
    c: { en: "The add-on deploys the CloudWatch agent and Fluent Bit in the cluster and sends data to CloudWatch, not to the Prometheus workspace.", fr: "Le module complémentaire déploie l'agent CloudWatch et Fluent Bit dans le cluster et envoie les données à CloudWatch, et non à l'espace de travail Prometheus." }
    e: { en: "Grafana visualizes data from a data source; it does not scrape the pods or store their metrics.", fr: "Grafana visualise les données d'une source de données ; il ne collecte pas les métriques des pods et ne les stocke pas." }
references:
  - title: Set up managed collectors for Amazon EKS
    url: https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-collector-how-to.html
