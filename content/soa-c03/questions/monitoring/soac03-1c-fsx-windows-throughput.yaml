id: soac03-1c-fsx-windows-throughput
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses an Amazon FSx for Windows File Server Multi-AZ file system as the home-directory share for 2,000 users. During the morning logon peak, the Monitoring & performance dashboard in the Amazon FSx console warns that the file server's throughput and CPU utilization are near their limits, while only 40% of the storage capacity is used. The company wants to remove the bottleneck while users keep access to their files during the change.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un système de fichiers Amazon FSx for Windows File Server Multi-AZ comme partage de répertoires personnels pour 2 000 utilisateurs. Pendant le pic de connexion du matin, le tableau de bord Monitoring & performance de la console Amazon FSx signale que le débit et l'utilisation du processeur du serveur de fichiers sont proches de leurs limites, alors que seulement 40 % de la capacité de stockage est utilisée. L'entreprise veut supprimer le goulot d'étranglement tout en laissant les utilisateurs accéder à leurs fichiers pendant la modification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the storage capacity of the file system to add more SSD storage.", fr: "Augmenter la capacité de stockage du système de fichiers pour ajouter du stockage SSD." } }
    - { id: b, text: { en: "Increase the throughput capacity of the file system during a period of low activity.", fr: "Augmenter la capacité de débit du système de fichiers pendant une période de faible activité." } }
    - { id: c, text: { en: "Enable data deduplication on the file system to reduce the amount of data that is read.", fr: "Activer la déduplication des données sur le système de fichiers pour réduire la quantité de données lues." } }
    - { id: d, text: { en: "Create a second file system in Single-AZ mode and move half of the users to it.", fr: "Créer un second système de fichiers en mode Single-AZ et y déplacer la moitié des utilisateurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Throughput capacity sets how fast the file server can serve data and also brings more IOPS and cache memory. On a Multi-AZ file system, a throughput change switches file servers through an automatic failover and failback, and the other server keeps serving clients, so users keep access. AWS recommends doing it during a period of low load."
    fr: "La capacité de débit fixe la vitesse à laquelle le serveur de fichiers sert les données et apporte aussi davantage d'IOPS et de mémoire cache. Sur un système de fichiers Multi-AZ, un changement de débit remplace les serveurs de fichiers par un basculement et une restauration automatiques, et l'autre serveur continue de servir les clients : les utilisateurs gardent l'accès. AWS recommande de le faire pendant une période de faible charge."
  options:
    a:
      en: "Storage is only 40% used, and the warning concerns the file server's throughput and CPU, which storage capacity does not raise."
      fr: "Le stockage n'est utilisé qu'à 40 %, et l'alerte concerne le débit et le processeur du serveur de fichiers, que la capacité de stockage n'augmente pas."
    c:
      en: "Data deduplication saves storage space but runs jobs that use file server CPU and memory, so it adds load instead of removing it."
      fr: "La déduplication des données économise de l'espace mais exécute des tâches qui consomment le processeur et la mémoire du serveur de fichiers : elle ajoute de la charge au lieu d'en retirer."
    d:
      en: "Migrating half of the users requires copying data and changing their mappings, and a Single-AZ file system lowers availability."
      fr: "Migrer la moitié des utilisateurs exige de copier des données et de modifier leurs mappages, et un système de fichiers Single-AZ réduit la disponibilité."
references:
  - title: Managing throughput capacity
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/managing-throughput-capacity.html
