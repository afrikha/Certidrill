id: soac03-1b-ebs-read-latency
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Users report slow page loads from a content management system that runs on a Nitro-based Amazon EC2 instance in an AWS Region. An administrator suspects the gp3 data volume and wants a CloudWatch graph of the average time, in milliseconds, that each read operation on that volume takes.

    Which solutions will provide this graph? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Des utilisateurs signalent des chargements de pages lents dans un système de gestion de contenu qui s'exécute sur une instance Amazon EC2 basée sur Nitro dans une Région AWS. Un administrateur soupçonne le volume de données gp3 et veut un graphique CloudWatch du temps moyen, en millisecondes, que prend chaque opération de lecture sur ce volume.

    Quelles solutions fournissent ce graphique ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Graph the VolumeQueueLength metric of the volume.", fr: "Représenter la métrique VolumeQueueLength du volume." } }
    - { id: b, text: { en: "Graph the VolumeAvgReadLatency metric of the volume.", fr: "Représenter la métrique VolumeAvgReadLatency du volume." } }
    - { id: c, text: { en: "Graph the metric math expression (Sum(VolumeTotalReadTime) / Sum(VolumeReadOps)) × 1000 for the volume.", fr: "Représenter l'expression mathématique de métriques (Sum(VolumeTotalReadTime) / Sum(VolumeReadOps)) × 1000 pour le volume." } }
    - { id: d, text: { en: "Graph the metric math expression (Sum(VolumeReadBytes) / Sum(VolumeReadOps)) / 1024 for the volume.", fr: "Représenter l'expression mathématique de métriques (Sum(VolumeReadBytes) / Sum(VolumeReadOps)) / 1024 pour le volume." } }
    - { id: e, text: { en: "Graph the VolumeIdleTime metric of the volume.", fr: "Représenter la métrique VolumeIdleTime du volume." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      VolumeAvgReadLatency reports the average time, in milliseconds, to complete the read operations of the last minute. The same value can be derived from the total time spent by read operations divided by the number of reads, converted from seconds to milliseconds, which is the formula the EBS console uses for its latency graph.
    fr: |
      VolumeAvgReadLatency indique le temps moyen, en millisecondes, nécessaire pour terminer les opérations de lecture de la dernière minute. La même valeur peut être obtenue en divisant le temps total des opérations de lecture par le nombre de lectures, converti de secondes en millisecondes : c'est la formule qu'utilise la console EBS pour son graphique de latence.
  options:
    a: { en: "VolumeQueueLength is the number of requests waiting to complete, not the time per operation.", fr: "VolumeQueueLength est le nombre de requêtes en attente, pas le temps par opération." }
    d: { en: "This formula gives the average read size in KiB per operation, not the latency.", fr: "Cette formule donne la taille moyenne de lecture en Kio par opération, pas la latence." }
    e: { en: "VolumeIdleTime is the time with no I/O submitted, which does not measure the duration of each read.", fr: "VolumeIdleTime est le temps sans E/S soumises, ce qui ne mesure pas la durée de chaque lecture." }
references:
  - title: Amazon CloudWatch metrics for Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/using_cloudwatch_ebs.html
