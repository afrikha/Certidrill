id: soac03-1b-eb-pattern-wildcard-match
objective: "1.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company enables Amazon EventBridge notifications on an Amazon S3 bucket. An administrator creates a rule on the default event bus with the following event pattern:

    ```json
    {
      "source": ["aws.s3"],
      "detail-type": ["Object Created"],
      "detail": {
        "bucket": { "name": ["anycompany-reports"] },
        "object": { "key": [{ "wildcard": "exports/*.csv" }] },
        "reason": [{ "anything-but": ["CopyObject"] }]
      }
    }
    ```

    All the events below come from the anycompany-reports bucket. Which events match the rule? (Choose two.)
  fr: |
    Une entreprise active les notifications Amazon EventBridge sur un compartiment Amazon S3. Un administrateur crée une règle sur le bus d'événements par défaut avec le modèle d'événement suivant :

    ```json
    {
      "source": ["aws.s3"],
      "detail-type": ["Object Created"],
      "detail": {
        "bucket": { "name": ["anycompany-reports"] },
        "object": { "key": [{ "wildcard": "exports/*.csv" }] },
        "reason": [{ "anything-but": ["CopyObject"] }]
      }
    }
    ```

    Tous les événements ci-dessous proviennent du compartiment anycompany-reports. Quels événements correspondent à la règle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Object key `exports/sales-2026-11.csv`, reason `PutObject`", fr: "Clé d'objet `exports/sales-2026-11.csv`, reason `PutObject`" } }
    - { id: b, text: { en: "Object key `exports/sales.csv.gz`, reason `PutObject`", fr: "Clé d'objet `exports/sales.csv.gz`, reason `PutObject`" } }
    - { id: c, text: { en: "Object key `archive/exports/sales.csv`, reason `PutObject`", fr: "Clé d'objet `archive/exports/sales.csv`, reason `PutObject`" } }
    - { id: d, text: { en: "Object key `exports/eu.csv`, reason `CompleteMultipartUpload`", fr: "Clé d'objet `exports/eu.csv`, reason `CompleteMultipartUpload`" } }
    - { id: e, text: { en: "Object key `exports/sales.csv`, reason `CopyObject`", fr: "Clé d'objet `exports/sales.csv`, reason `CopyObject`" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      All the fields of a pattern must match. The wildcard value exports/*.csv matches keys that start with exports/ and end with .csv, and anything-but accepts every reason except CopyObject. Both a PutObject upload and a multipart upload (CompleteMultipartUpload) of a key such as exports/eu.csv therefore match.
    fr: |
      Tous les champs d'un modèle doivent correspondre. La valeur générique exports/*.csv correspond aux clés qui commencent par exports/ et se terminent par .csv, et anything-but accepte toutes les valeurs de reason sauf CopyObject. Un chargement PutObject comme un chargement partitionné (CompleteMultipartUpload) d'une clé comme exports/eu.csv correspondent donc.
  options:
    b: { en: "The key ends with .gz, so it does not match a value that must end with .csv.", fr: "La clé se termine par .gz : elle ne correspond pas à une valeur qui doit se terminer par .csv." }
    c: { en: "A wildcard value is compared with the whole key, which here starts with archive/ instead of exports/.", fr: "Une valeur générique est comparée à la clé entière, qui commence ici par archive/ au lieu de exports/." }
    e: { en: "anything-but excludes the CopyObject reason, so this event fails the reason condition.", fr: "anything-but exclut la valeur CopyObject : cet événement échoue à la condition sur reason." }
references:
  - title: Comparison operators for use in event patterns in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-create-pattern-operators.html
  - title: EventBridge event message structure
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/ev-events.html
