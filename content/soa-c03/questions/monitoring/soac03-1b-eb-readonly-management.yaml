id: soac03-1b-eb-readonly-management
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security team wants to be notified in near real time whenever someone calls the Amazon EC2 GetPasswordData API operation in a production account. The account has a CloudTrail trail with logging enabled for management events. An administrator creates the following rule on the default event bus, in the ENABLED state, with an Amazon SNS topic as the target:

    ```json
    {
      "source": ["aws.ec2"],
      "detail-type": ["AWS API Call via CloudTrail"],
      "detail": {
        "eventSource": ["ec2.amazonaws.com"],
        "eventName": ["GetPasswordData"]
      }
    }
    ```

    The GetPasswordData calls appear in CloudTrail, but the rule never matches. A similar rule for the StopInstances operation works.

    What should the administrator do?
  fr: |
    Une équipe de sécurité veut être avertie en temps quasi réel chaque fois que quelqu'un appelle l'opération d'API Amazon EC2 GetPasswordData dans un compte de production. Le compte possède un journal de suivi CloudTrail dont la journalisation est activée pour les événements de gestion. Un administrateur crée la règle suivante sur le bus d'événements par défaut, à l'état ENABLED, avec une rubrique Amazon SNS comme cible :

    ```json
    {
      "source": ["aws.ec2"],
      "detail-type": ["AWS API Call via CloudTrail"],
      "detail": {
        "eventSource": ["ec2.amazonaws.com"],
        "eventName": ["GetPasswordData"]
      }
    }
    ```

    Les appels GetPasswordData apparaissent dans CloudTrail, mais la règle ne correspond jamais. Une règle similaire pour l'opération StopInstances fonctionne.

    Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Configure the trail to log data events for Amazon EC2.", fr: "Configurer le journal de suivi pour qu'il enregistre les événements de données d'Amazon EC2." } }
    - { id: b, text: { en: "Change the rule state to ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS.", fr: "Passer l'état de la règle à ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS." } }
    - { id: c, text: { en: "Move the rule to a custom event bus and forward the CloudTrail events to it.", fr: "Déplacer la règle vers un bus d'événements personnalisé et y transférer les événements CloudTrail." } }
    - { id: d, text: { en: "Enable CloudTrail Insights on the trail so that it sends AWS Insight via CloudTrail events.", fr: "Activer CloudTrail Insights sur le journal de suivi pour qu'il envoie des événements AWS Insight via CloudTrail." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      GetPasswordData only reads data, so CloudTrail records it as a read-only management event. A rule in the default ENABLED state matches only write (mutating) management events such as StopInstances. Read-only management events are matched only by rules whose state is ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS.
    fr: |
      GetPasswordData ne fait que lire des données : CloudTrail l'enregistre comme événement de gestion en lecture seule. Une règle à l'état ENABLED par défaut ne correspond qu'aux événements de gestion en écriture (qui modifient), comme StopInstances. Les événements de gestion en lecture seule ne sont pris en compte que par les règles dont l'état est ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS.
  options:
    a: { en: "GetPasswordData is a management event, not a data event, and the trail already records it.", fr: "GetPasswordData est un événement de gestion, pas un événement de données, et le journal de suivi l'enregistre déjà." }
    c: { en: "CloudTrail events are delivered to the default bus only; a forwarding rule would face the same read-only restriction.", fr: "Les événements CloudTrail sont livrés uniquement au bus par défaut ; une règle de transfert se heurterait à la même restriction de lecture seule." }
    d: { en: "Insights events report unusual API activity rates; they do not deliver each GetPasswordData call.", fr: "Les événements Insights signalent des volumes d'activité d'API inhabituels ; ils ne livrent pas chaque appel GetPasswordData." }
references:
  - title: AWS service events delivered via AWS CloudTrail
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
