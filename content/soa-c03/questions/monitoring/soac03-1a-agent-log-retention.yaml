id: soac03-1a-agent-log-retention
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company creates new Amazon EC2 environments every week. The CloudWatch agent on each instance collects application logs with this entry, and the agent creates the log group when it does not exist:

    ```json
    {
      "file_path": "/var/log/app/*.log",
      "log_group_name": "/app/web",
      "log_stream_name": "{instance_id}"
    }
    ```

    The log groups that the agent creates keep their log events forever. Company policy requires 30 days of retention for these log groups, with no manual step.

    Which change will meet these requirements?
  fr: |
    Une entreprise crée chaque semaine de nouveaux environnements Amazon EC2. Sur chaque instance, l'agent CloudWatch collecte les journaux de l'application avec cette entrée, et l'agent crée le groupe de journaux lorsqu'il n'existe pas :

    ```json
    {
      "file_path": "/var/log/app/*.log",
      "log_group_name": "/app/web",
      "log_stream_name": "{instance_id}"
    }
    ```

    Les groupes de journaux créés par l'agent conservent leurs événements indéfiniment. La politique de l'entreprise exige une conservation de 30 jours pour ces groupes de journaux, sans aucune étape manuelle.

    Quelle modification répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add `\"auto_removal\": true` to the entry.", fr: "Ajouter `\"auto_removal\": true` à l'entrée." }
    - id: b
      text: { en: "Add `\"retention_in_days\": 30` to the entry.", fr: "Ajouter `\"retention_in_days\": 30` à l'entrée." }
    - id: c
      text: { en: "Set `force_flush_interval` to 30 in the `logs` section.", fr: "Définir `force_flush_interval` à 30 dans la section `logs`." }
    - id: d
      text: { en: "Add `\"log_group_class\": \"INFREQUENT_ACCESS\"` to the entry.", fr: "Ajouter `\"log_group_class\": \"INFREQUENT_ACCESS\"` à l'entrée." }
answer: { optionId: b }
explanation:
  correct:
    en: "`retention_in_days` sets the retention of the log group that the agent writes to. Without it, a log group that the agent creates never expires its events. With the setting in the configuration, every new environment gets 30-day retention automatically."
    fr: "`retention_in_days` définit la conservation du groupe de journaux dans lequel l'agent écrit. Sans ce paramètre, un groupe de journaux créé par l'agent n'expire jamais ses événements. Avec ce paramètre dans la configuration, chaque nouvel environnement obtient automatiquement une conservation de 30 jours."
  options:
    a: { en: "`auto_removal` deletes rotated log files on the instance after they are read; it does not affect the log group.", fr: "`auto_removal` supprime sur l'instance les fichiers journaux renouvelés une fois lus ; il n'a aucun effet sur le groupe de journaux." }
    c: { en: "`force_flush_interval` controls how often buffered logs are sent, not how long they are kept.", fr: "`force_flush_interval` contrôle la fréquence d'envoi des journaux mis en mémoire tampon, et non leur durée de conservation." }
    d: { en: "The log class changes the features and ingestion price, not the retention period.", fr: "La classe de journaux change les fonctionnalités et le prix d'ingestion, et non la durée de conservation." }
references:
  - title: Manually create or edit the CloudWatch agent configuration file
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
