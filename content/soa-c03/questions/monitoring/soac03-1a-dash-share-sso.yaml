id: soac03-1a-dash-share-sso
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    About 200 support employees must view all the CloudWatch dashboards of an AWS account. The employees sign in to every application through the company's SAML 2.0 identity provider, and the company does not want to create IAM users or roles for them.

    Which solution will meet these requirements?
  fr: |
    Environ 200 employés du support doivent consulter tous les tableaux de bord CloudWatch d'un compte AWS. Les employés se connectent à toutes les applications via le fournisseur d'identité SAML 2.0 de l'entreprise, et l'entreprise ne veut pas créer d'utilisateurs ou de rôles IAM pour eux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Share each dashboard with the email addresses of the support employees.", fr: "Partager chaque tableau de bord avec les adresses e-mail des employés du support." }
    - id: b
      text: { en: "Set up dashboard sharing through an SSO provider that uses the SAML identity provider.", fr: "Configurer le partage des tableaux de bord via un fournisseur SSO qui utilise le fournisseur d'identité SAML." }
    - id: c
      text: { en: "Share every dashboard publicly and publish the links on the company intranet.", fr: "Partager chaque tableau de bord publiquement et publier les liens sur l'intranet de l'entreprise." }
    - id: d
      text: { en: "Turn on the cross-account cross-Region console and add the employees' accounts.", fr: "Activer la console multicompte et multirégion et y ajouter les comptes des employés." }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch can share all the dashboards of an account with users of a third-party SAML single sign-on provider that is integrated with Amazon Cognito. The employees sign in with their corporate identity, and no IAM user or role is created for them."
    fr: "CloudWatch peut partager tous les tableaux de bord d'un compte avec les utilisateurs d'un fournisseur d'authentification unique SAML tiers intégré à Amazon Cognito. Les employés se connectent avec leur identité d'entreprise, et aucun utilisateur ou rôle IAM n'est créé pour eux."
  options:
    a: { en: "Sharing with email addresses is limited to five addresses per dashboard and does not use the corporate sign-in.", fr: "Le partage par adresses e-mail est limité à cinq adresses par tableau de bord et n'utilise pas la connexion de l'entreprise." }
    c: { en: "Public dashboards can be viewed by anyone who has the link, with no sign-in at all.", fr: "Les tableaux de bord publics peuvent être consultés par toute personne qui a le lien, sans aucune connexion." }
    d: { en: "The cross-account console lets a monitoring account view data of other AWS accounts; it does not give people access through a SAML provider.", fr: "La console multicompte permet à un compte de surveillance de voir les données d'autres comptes AWS ; elle ne donne pas accès à des personnes via un fournisseur SAML." }
references:
  - title: Sharing CloudWatch dashboards
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-dashboard-sharing.html
