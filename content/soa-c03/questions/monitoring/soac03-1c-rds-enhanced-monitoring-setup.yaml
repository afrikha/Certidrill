id: soac03-1c-rds-enhanced-monitoring-setup
objective: "1.3.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A CloudOps engineer must collect operating system metrics, including the CPU and memory used by each process, every second for an Amazon RDS for MySQL DB instance. The engineer will turn on the feature with the AWS CLI by modifying the existing DB instance.

    Which combination of actions must the engineer take? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un ingénieur CloudOps doit collecter chaque seconde les métriques du système d'exploitation d'une instance de base de données Amazon RDS for MySQL, y compris le processeur et la mémoire utilisés par chaque processus. L'ingénieur activera la fonctionnalité avec l'AWS CLI en modifiant l'instance de base de données existante.

    Quelle combinaison d'actions l'ingénieur doit-il effectuer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an IAM role that monitoring.rds.amazonaws.com can assume, with the AmazonRDSEnhancedMonitoringRole managed policy.", fr: "Créer un rôle IAM que monitoring.rds.amazonaws.com peut assumer, avec la politique gérée AmazonRDSEnhancedMonitoringRole." } }
    - { id: b, text: { en: "Install the CloudWatch agent on the DB instance by using AWS Systems Manager Run Command.", fr: "Installer l'agent CloudWatch sur l'instance de base de données à l'aide d'AWS Systems Manager Run Command." } }
    - { id: c, text: { en: "Turn on EC2 detailed monitoring for the DB instance to get CloudWatch metrics every minute.", fr: "Activer la surveillance détaillée EC2 pour l'instance de base de données afin d'obtenir des métriques CloudWatch chaque minute." } }
    - { id: d, text: { en: "Reboot the DB instance with failover so that the monitoring agent starts.", fr: "Redémarrer l'instance de base de données avec basculement pour que l'agent de surveillance démarre." } }
    - { id: e, text: { en: "Run aws rds modify-db-instance with --monitoring-interval 1 and --monitoring-role-arn set to the role ARN.", fr: "Exécuter aws rds modify-db-instance avec --monitoring-interval 1 et --monitoring-role-arn défini sur l'ARN du rôle." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Enhanced Monitoring collects OS metrics and the process list from an agent on the DB instance and sends them to CloudWatch Logs, which requires an IAM role trusted by monitoring.rds.amazonaws.com. With the AWS CLI, the role must exist beforehand, and modify-db-instance sets the interval (1, 5, 10, 15, 30 or 60 seconds) and the role ARN. No reboot is needed."
    fr: "La surveillance améliorée collecte les métriques du système d'exploitation et la liste des processus à partir d'un agent sur l'instance de base de données et les envoie à CloudWatch Logs, ce qui exige un rôle IAM approuvé par monitoring.rds.amazonaws.com. Avec l'AWS CLI, le rôle doit exister au préalable, et modify-db-instance définit l'intervalle (1, 5, 10, 15, 30 ou 60 secondes) et l'ARN du rôle. Aucun redémarrage n'est nécessaire."
  options:
    b:
      en: "RDS is a managed service: you cannot install software on the DB instance host, and Enhanced Monitoring provides its own agent."
      fr: "RDS est un service géré : on ne peut pas installer de logiciel sur l'hôte de l'instance de base de données, et la surveillance améliorée fournit son propre agent."
    c:
      en: "EC2 detailed monitoring is an EC2 setting; RDS OS metrics at 1-second granularity come from Enhanced Monitoring."
      fr: "La surveillance détaillée EC2 est un paramètre EC2 ; les métriques du système d'exploitation RDS à la seconde viennent de la surveillance améliorée."
    d:
      en: "Turning on Enhanced Monitoring by modifying a DB instance takes effect without a reboot."
      fr: "Activer la surveillance améliorée en modifiant une instance de base de données prend effet sans redémarrage."
references:
  - title: Setting up and enabling Enhanced Monitoring
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Monitoring.OS.Enabling.html
  - title: Monitoring OS metrics with Enhanced Monitoring
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Monitoring.OS.html
