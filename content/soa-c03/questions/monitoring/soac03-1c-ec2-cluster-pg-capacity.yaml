id: soac03-1c-ec2-cluster-pg-capacity
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs eight c6i.8xlarge instances in a cluster placement group for a tightly coupled simulation. To add capacity, an engineer launches four more c6i.8xlarge instances into the same placement group, and the launch fails with an InsufficientInstanceCapacity error. The simulation can be paused for a short time.

    What should the engineer do to add the instances to the cluster placement group?
  fr: |
    Une entreprise exécute huit instances c6i.8xlarge dans un groupe de placement de cluster pour une simulation fortement couplée. Pour ajouter de la capacité, un ingénieur lance quatre instances c6i.8xlarge supplémentaires dans le même groupe de placement, et le lancement échoue avec une erreur InsufficientInstanceCapacity. La simulation peut être interrompue pendant une courte durée.

    Que doit faire l'ingénieur pour ajouter les instances au groupe de placement de cluster ?
body:
  options:
    - { id: a, text: { en: "Launch the four instances into a new cluster placement group, and then merge the two placement groups.", fr: "Lancer les quatre instances dans un nouveau groupe de placement de cluster, puis fusionner les deux groupes de placement." } }
    - { id: b, text: { en: "Stop and start all the instances in the placement group, and then launch the four new instances again.", fr: "Arrêter puis démarrer toutes les instances du groupe de placement, puis relancer les quatre nouvelles instances." } }
    - { id: c, text: { en: "Purchase zonal Reserved Instances for c6i.8xlarge to reserve capacity in the placement group.", fr: "Acheter des instances réservées zonales c6i.8xlarge pour réserver de la capacité dans le groupe de placement." } }
    - { id: d, text: { en: "Launch the four instances as m6i.8xlarge instances in the same placement group.", fr: "Lancer les quatre instances en tant qu'instances m6i.8xlarge dans le même groupe de placement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Instances in a cluster placement group are packed close together in one Availability Zone, so adding instances later can fail for lack of capacity on that hardware. AWS recommends stopping and starting all the instances of the group and then retrying the launch, because the start can move the group to hardware that has room for every instance."
    fr: "Les instances d'un groupe de placement de cluster sont regroupées dans une même zone de disponibilité : en ajouter plus tard peut échouer faute de capacité sur ce matériel. AWS recommande d'arrêter puis de démarrer toutes les instances du groupe, puis de relancer le lancement, car le démarrage peut déplacer le groupe vers un matériel qui a de la place pour toutes les instances."
  options:
    a:
      en: "Placement groups cannot be merged, and two cluster groups would not give the low latency of a single group."
      fr: "Les groupes de placement ne peuvent pas être fusionnés, et deux groupes de cluster n'offriraient pas la faible latence d'un groupe unique."
    c:
      en: "Zonal Reserved Instances cannot reserve capacity in a placement group; only an On-Demand Capacity Reservation in the group can."
      fr: "Les instances réservées zonales ne peuvent pas réserver de capacité dans un groupe de placement ; seule une réservation de capacité à la demande dans le groupe le peut."
    d:
      en: "Mixing instance types in a cluster placement group increases the chance of an insufficient capacity error."
      fr: "Mélanger des types d'instance dans un groupe de placement de cluster augmente le risque d'erreur de capacité insuffisante."
references:
  - title: Placement strategies for your placement groups
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html
