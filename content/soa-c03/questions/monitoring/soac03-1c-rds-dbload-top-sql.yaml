id: soac03-1c-rds-dbload-top-sql
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon RDS for PostgreSQL DB instance with 8 vCPUs becomes slow every day at noon. In the Amazon CloudWatch Database Insights dashboard, the DB load chart stays above the Max vCPU line during this period, and most of the load is in the CPU wait state. A CloudOps engineer must find which queries cause the load before tuning them.

    What should the engineer do?
  fr: |
    Une instance de base de données Amazon RDS for PostgreSQL à 8 vCPU devient lente chaque jour à midi. Dans le tableau de bord Amazon CloudWatch Database Insights, le graphique de charge de la base de données reste au-dessus de la ligne Max vCPU pendant cette période, et la majeure partie de la charge est dans l'état d'attente CPU. Un ingénieur CloudOps doit trouver quelles requêtes provoquent cette charge avant de les optimiser.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Enable Enhanced Monitoring and review the OS process list of the DB instance.", fr: "Activer la surveillance améliorée (Enhanced Monitoring) et examiner la liste des processus du système d'exploitation de l'instance." } }
    - { id: b, text: { en: "Create an RDS event subscription for the DB instance to be notified of the slow periods.", fr: "Créer un abonnement aux événements RDS pour l'instance de base de données afin d'être averti des périodes de lenteur." } }
    - { id: c, text: { en: "Review the AWS CloudTrail event history for API calls made to the DB instance at noon.", fr: "Examiner l'historique des événements AWS CloudTrail pour les appels d'API adressés à l'instance de base de données à midi." } }
    - { id: d, text: { en: "Slice the DB load chart by Top SQL to see which statements contribute most to the load.", fr: "Découper le graphique de charge de la base de données par Top SQL pour voir quelles instructions contribuent le plus à la charge." } }
answer: { optionId: d }
explanation:
  correct:
    en: "DB load measures active sessions, and it can be sliced by dimensions such as wait events, SQL statements, hosts and users. When the load stays above the Max vCPU line with CPU as the main wait state, the CPU is overloaded, and the Top SQL dimension shows which statements contribute most of that load, so the engineer knows which queries to tune."
    fr: "La charge de la base de données mesure les sessions actives et peut être découpée par dimensions comme les événements d'attente, les instructions SQL, les hôtes et les utilisateurs. Lorsque la charge reste au-dessus de la ligne Max vCPU avec CPU comme état d'attente principal, le processeur est surchargé, et la dimension Top SQL montre les instructions qui contribuent le plus à cette charge : l'ingénieur sait quelles requêtes optimiser."
  options:
    a:
      en: "Enhanced Monitoring shows OS-level processes and their resource use, not the SQL statements that create the database load."
      fr: "La surveillance améliorée montre les processus du système d'exploitation et leur consommation de ressources, pas les instructions SQL qui créent la charge de la base de données."
    b:
      en: "RDS events report changes such as failovers or configuration changes; they do not identify queries."
      fr: "Les événements RDS signalent des changements comme des basculements ou des modifications de configuration ; ils n'identifient pas les requêtes."
    c:
      en: "CloudTrail records RDS management API calls, not the SQL queries that run inside the database."
      fr: "CloudTrail enregistre les appels d'API de gestion RDS, pas les requêtes SQL exécutées dans la base de données."
references:
  - title: Maximum CPU
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PerfInsights.Overview.MaxCPU.html
  - title: Database load
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PerfInsights.Overview.ActiveSessions.html
