id: soac03-5b-tgw-attachment-az
objective: "5.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A VPC has application subnets in three Availability Zones: us-east-1a, us-east-1b and us-east-1c. Its transit gateway VPC attachment uses one subnet in us-east-1a and one in us-east-1b. All application subnets use the same route table, which sends 10.0.0.0/8 to the transit gateway. Instances in us-east-1a and us-east-1b reach the shared services VPC through the transit gateway, but instances in us-east-1c cannot. Security groups and network ACLs allow the traffic.

    Which action will resolve the issue?
  fr: |
    Un VPC possède des sous-réseaux d'application dans trois zones de disponibilité : us-east-1a, us-east-1b et us-east-1c. Son attachement de VPC à la passerelle de transit utilise un sous-réseau dans us-east-1a et un autre dans us-east-1b. Tous les sous-réseaux d'application utilisent la même table de routage, qui envoie 10.0.0.0/8 vers la passerelle de transit. Les instances de us-east-1a et us-east-1b joignent le VPC de services partagés par la passerelle de transit, mais pas celles de us-east-1c. Les groupes de sécurité et les ACL réseau autorisent le trafic.

    Quelle action résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add a route for 10.0.0.0/8 that targets the transit gateway to a new route table for the us-east-1c subnets.", fr: "Ajouter une route pour 10.0.0.0/8 qui cible la passerelle de transit dans une nouvelle table de routage pour les sous-réseaux de us-east-1c." }
    - id: b
      text: { en: "Turn on appliance mode for the transit gateway VPC attachment.", fr: "Activer le mode appliance pour l'attachement de VPC à la passerelle de transit." }
    - id: c
      text: { en: "Add a static route for the VPC CIDR to the transit gateway route table.", fr: "Ajouter une route statique pour le CIDR du VPC dans la table de routage de la passerelle de transit." }
    - id: d
      text: { en: "Modify the transit gateway VPC attachment to add a subnet in us-east-1c.", fr: "Modifier l'attachement de VPC à la passerelle de transit pour ajouter un sous-réseau dans us-east-1c." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Resources in an Availability Zone where the VPC attachment has no subnet cannot reach the transit gateway, even when their route table points to it. Adding a subnet in us-east-1c to the attachment creates a transit gateway network interface in that zone and lets the us-east-1c instances use the transit gateway.
    fr: |
      Les ressources d'une zone de disponibilité dans laquelle l'attachement de VPC n'a pas de sous-réseau ne peuvent pas joindre la passerelle de transit, même si leur table de routage pointe vers elle. Ajouter à l'attachement un sous-réseau dans us-east-1c crée une interface réseau de la passerelle de transit dans cette zone et permet aux instances de us-east-1c d'utiliser la passerelle de transit.
  options:
    a:
      en: |
        The us-east-1c subnets already have this route through the shared route table; a route alone does not make the zone reachable.
      fr: |
        Les sous-réseaux de us-east-1c possèdent déjà cette route par la table de routage partagée ; une route seule ne rend pas la zone joignable.
    b:
      en: |
        Appliance mode keeps flows symmetric for stateful appliances; it does not give a zone without an attachment subnet access to the transit gateway.
      fr: |
        Le mode appliance maintient des flux symétriques pour les appliances avec état ; il ne donne pas accès à la passerelle de transit à une zone sans sous-réseau d'attachement.
    c:
      en: |
        Return routing already works for the other zones; the traffic from us-east-1c never reaches the transit gateway.
      fr: |
        Le routage de retour fonctionne déjà pour les autres zones ; le trafic de us-east-1c n'atteint jamais la passerelle de transit.
references:
  - title: Amazon VPC attachments in AWS Transit Gateway
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-vpc-attachments.html
