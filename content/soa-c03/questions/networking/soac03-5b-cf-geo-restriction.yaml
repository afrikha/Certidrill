id: soac03-5b-cf-geo-restriction
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company delivers its whole catalog through one Amazon CloudFront distribution. For licensing reasons, viewers in two countries must not receive any content from the distribution. The company wants the simplest solution that adds no service charges beyond CloudFront.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias diffuse tout son catalogue par une seule distribution Amazon CloudFront. Pour des raisons de licence, les utilisateurs de deux pays ne doivent recevoir aucun contenu de la distribution. L'entreprise veut la solution la plus simple, sans frais de service supplémentaires au-delà de CloudFront.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Associate an AWS WAF web ACL with the distribution, and add a geographic match rule that blocks the two countries.", fr: "Associer une liste ACL web AWS WAF à la distribution, et ajouter une règle de correspondance géographique qui bloque les deux pays." }
    - id: b
      text: { en: "Turn on CloudFront geographic restrictions, and add the two countries to a block list.", fr: "Activer les restrictions géographiques CloudFront, et ajouter les deux pays à une liste de blocage." }
    - id: c
      text: { en: "Create Route 53 geolocation records that return no address for the two countries.", fr: "Créer des enregistrements de géolocalisation Route 53 qui ne renvoient aucune adresse pour les deux pays." }
    - id: d
      text: { en: "Add a Lambda@Edge function on viewer requests that looks up the client IP address and rejects the two countries.", fr: "Ajouter une fonction Lambda@Edge sur les requêtes utilisateur qui recherche l'adresse IP du client et refuse les deux pays." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CloudFront geographic restrictions use an allow list or a block list of countries and apply to the entire distribution. Viewers in blocked countries receive HTTP 403 (Forbidden), optionally with a custom error page, and the feature has no extra charge.
    fr: |
      Les restrictions géographiques CloudFront utilisent une liste d'autorisation ou une liste de blocage de pays et s'appliquent à toute la distribution. Les utilisateurs des pays bloqués reçoivent HTTP 403 (Forbidden), éventuellement avec une page d'erreur personnalisée, et la fonctionnalité n'entraîne pas de frais supplémentaires.
  options:
    a:
      en: |
        A geographic match rule would block the countries, but AWS WAF adds charges for the web ACL, rules and requests.
      fr: |
        Une règle de correspondance géographique bloquerait les pays, mais AWS WAF ajoute des frais pour la liste ACL web, les règles et les requêtes.
    c:
      en: |
        DNS answers do not block anyone: viewers can use other resolvers or the distribution's domain name, and the content stays reachable.
      fr: |
        Les réponses DNS ne bloquent personne : les utilisateurs peuvent passer par d'autres résolveurs ou par le nom de domaine de la distribution, et le contenu reste accessible.
    d:
      en: |
        Custom code needs a geolocation source and adds Lambda@Edge charges, which is neither simple nor free.
      fr: |
        Du code personnalisé a besoin d'une source de géolocalisation et ajoute des frais Lambda@Edge, ce qui n'est ni simple ni gratuit.
references:
  - title: Restrict the geographic distribution of your content
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html
