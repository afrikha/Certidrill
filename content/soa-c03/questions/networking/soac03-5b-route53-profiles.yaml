id: soac03-5b-route53-profiles
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 60 VPCs in 20 accounts of an organization in AWS Organizations, all in eu-central-1. Every VPC must use the same 12 Route 53 private hosted zones, the same Resolver forwarding rules and the same DNS Firewall rule groups. Teams create new VPCs every week, and the DNS team changes the zones and rules every month. Today, engineers apply each change to every VPC with scripts, and some VPCs are missed. The company wants every change to reach all VPCs with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 60 VPC dans 20 comptes d'une organisation AWS Organizations, tous dans eu-central-1. Chaque VPC doit utiliser les mêmes 12 zones hébergées privées Route 53, les mêmes règles de transfert Resolver et les mêmes groupes de règles DNS Firewall. Les équipes créent de nouveaux VPC chaque semaine, et l'équipe DNS modifie les zones et les règles chaque mois. Aujourd'hui, les ingénieurs appliquent chaque modification à chaque VPC avec des scripts, et certains VPC sont oubliés. L'entreprise veut que chaque modification atteigne tous les VPC avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a Route 53 Profile that contains the zones, rules and rule groups, share it with the organization by using AWS RAM, and associate it with each VPC.", fr: "Créer un profil Route 53 (Route 53 Profile) qui contient les zones, les règles et les groupes de règles, le partager avec l'organisation à l'aide d'AWS RAM, et l'associer à chaque VPC." }
    - id: b
      text: { en: "Create an Amazon EventBridge rule for CreateVpc events that invokes an AWS Lambda function to associate all the zones, rules and rule groups with each new VPC.", fr: "Créer une règle Amazon EventBridge pour les événements CreateVpc qui appelle une fonction AWS Lambda afin d'associer toutes les zones, règles et groupes de règles à chaque nouveau VPC." }
    - id: c
      text: { en: "Share the forwarding rules and the DNS Firewall rule groups by using AWS RAM, and create a VPC association authorization for each private hosted zone and each VPC.", fr: "Partager les règles de transfert et les groupes de règles DNS Firewall à l'aide d'AWS RAM, et créer une autorisation d'association de VPC pour chaque zone hébergée privée et chaque VPC." }
    - id: d
      text: { en: "Associate the private hosted zones and the rules with a central VPC, and connect every VPC to the central VPC by using VPC peering.", fr: "Associer les zones hébergées privées et les règles à un VPC central, et relier chaque VPC au VPC central par un peering de VPC." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Route 53 Profile groups private hosted zones, Resolver rules, DNS Firewall rule groups and other DNS settings, and it can be shared with accounts through AWS RAM. When the DNS team updates the Profile, the change propagates to every VPC associated with it, so each new VPC needs only one Profile association.
    fr: |
      Un profil Route 53 regroupe des zones hébergées privées, des règles Resolver, des groupes de règles DNS Firewall et d'autres paramètres DNS, et il peut être partagé avec des comptes par AWS RAM. Lorsque l'équipe DNS met à jour le profil, la modification se propage à tous les VPC qui lui sont associés : chaque nouveau VPC n'a besoin que d'une association de profil.
  options:
    b:
      en: |
        Custom code must be written and maintained, and it handles only new VPCs, not the monthly changes to existing ones.
      fr: |
        Du code personnalisé doit être écrit et maintenu, et il ne traite que les nouveaux VPC, pas les modifications mensuelles des VPC existants.
    c:
      en: |
        This works, but every zone must be authorized and associated with every VPC, and each monthly change must be repeated in all VPCs.
      fr: |
        Cela fonctionne, mais chaque zone doit être autorisée et associée à chaque VPC, et chaque modification mensuelle doit être répétée dans tous les VPC.
    d:
      en: |
        Peering does not extend private hosted zones or Resolver rules to the peer VPC; each VPC still needs its own associations.
      fr: |
        Le peering n'étend pas les zones hébergées privées ni les règles Resolver au VPC pair ; chaque VPC a toujours besoin de ses propres associations.
references:
  - title: What are Amazon Route 53 Profiles?
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/profiles.html
