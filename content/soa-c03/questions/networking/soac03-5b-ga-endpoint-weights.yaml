id: soac03-5b-ga-endpoint-weights
objective: "5.2.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A company uses an AWS Global Accelerator standard accelerator with endpoint groups in eu-west-1 and ap-southeast-1. The eu-west-1 endpoint group contains two Application Load Balancers: blue-alb runs the current version and green-alb runs a new version. About 10% of the traffic that reaches the eu-west-1 endpoint group must go to green-alb. The traffic split between the two Regions must not change.

    Which configuration will meet these requirements?
  fr: |
    Une entreprise utilise un accélérateur standard AWS Global Accelerator avec des groupes de points de terminaison dans eu-west-1 et ap-southeast-1. Le groupe de points de terminaison eu-west-1 contient deux Application Load Balancers : blue-alb exécute la version actuelle et green-alb une nouvelle version. Environ 10 % du trafic qui atteint le groupe de points de terminaison eu-west-1 doit aller vers green-alb. La répartition du trafic entre les deux Régions ne doit pas changer.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Weight 128 for blue-alb, weight 128 for green-alb, and a traffic dial of 10 for the eu-west-1 endpoint group", fr: "Poids 128 pour blue-alb, poids 128 pour green-alb, et un cadran de trafic (traffic dial) de 10 pour le groupe de points de terminaison eu-west-1" }
    - id: b
      text: { en: "Weight 0 for blue-alb, weight 24 for green-alb, and a traffic dial of 100 for the eu-west-1 endpoint group", fr: "Poids 0 pour blue-alb, poids 24 pour green-alb, et un cadran de trafic de 100 pour le groupe de points de terminaison eu-west-1" }
    - id: c
      text: { en: "Weight 216 for blue-alb, weight 24 for green-alb, and a traffic dial of 100 for the eu-west-1 endpoint group", fr: "Poids 216 pour blue-alb, poids 24 pour green-alb, et un cadran de trafic de 100 pour le groupe de points de terminaison eu-west-1" }
    - id: d
      text: { en: "Weight 128 for blue-alb, weight 128 for green-alb, and a traffic dial of 100 for the eu-west-1 endpoint group", fr: "Poids 128 pour blue-alb, poids 128 pour green-alb, et un cadran de trafic de 100 pour le groupe de points de terminaison eu-west-1" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Endpoint weights split the traffic of one endpoint group in proportion to each endpoint's weight divided by the total: 24 / (216 + 24) = 10%. Keeping the traffic dial at 100 leaves the share of traffic that the eu-west-1 Region receives unchanged.
    fr: |
      Les poids de points de terminaison répartissent le trafic d'un groupe de points de terminaison en proportion du poids de chaque point de terminaison divisé par le total : 24 / (216 + 24) = 10 %. Laisser le cadran de trafic à 100 ne modifie pas la part du trafic que reçoit la Région eu-west-1.
  options:
    a:
      en: |
        With a traffic dial of 10, eu-west-1 keeps only 10% of the traffic directed to it and the rest goes to the other Region, which changes the split between Regions; equal weights then give green-alb half of what remains.
      fr: |
        Avec un cadran de trafic de 10, eu-west-1 ne conserve que 10 % du trafic qui lui est destiné et le reste part vers l'autre Région, ce qui modifie la répartition entre Régions ; des poids égaux donnent ensuite à green-alb la moitié de ce qui reste.
    b:
      en: |
        A weight of 0 stops traffic to blue-alb, so green-alb receives all the traffic of the endpoint group.
      fr: |
        Un poids de 0 arrête le trafic vers blue-alb : green-alb reçoit tout le trafic du groupe de points de terminaison.
    d:
      en: |
        Equal weights send about half of the endpoint group's traffic to green-alb.
      fr: |
        Des poids égaux envoient environ la moitié du trafic du groupe de points de terminaison vers green-alb.
references:
  - title: How endpoint weights work to manage traffic volume
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoints-endpoint-weights.html
  - title: Use traffic dials to adjust traffic flow to Regions
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoint-groups-traffic-dial.html
