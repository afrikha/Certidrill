id: soac03-5a-netfw-stateless-logs
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Network Firewall firewall inspects internet traffic for a VPC and uses a Classic Network Firewall policy. The policy contains a stateless rule group with a rule that uses the `aws:drop` action for inbound TCP port 23. Alert logs and flow logs are configured to an Amazon CloudWatch Logs log group. Auditors require a log record of every blocked Telnet attempt, but the log group contains no records for this traffic, even though the CloudWatch metrics show dropped packets.

    Which solution will meet the auditors' requirement?
  fr: |
    Un pare-feu AWS Network Firewall inspecte le trafic Internet d'un VPC et utilise une politique Classic Network Firewall. La politique contient un groupe de règles sans état avec une règle qui utilise l'action `aws:drop` pour le port TCP 23 entrant. Les journaux d'alertes et les journaux de flux sont configurés vers un groupe de journaux Amazon CloudWatch Logs. Les auditeurs exigent un enregistrement de journal pour chaque tentative Telnet bloquée, mais le groupe de journaux ne contient aucun enregistrement pour ce trafic, alors que les métriques CloudWatch montrent des paquets abandonnés.

    Quelle solution répond à l'exigence des auditeurs ?
body:
  options:
    - id: a
      text: { en: "Change the log destination of the alert logs from CloudWatch Logs to an Amazon S3 bucket.", fr: "Changer la destination des journaux d'alertes de CloudWatch Logs vers un compartiment Amazon S3." }
    - id: b
      text: { en: "Add a TLS inspection configuration to the firewall and turn on TLS logs for the firewall.", fr: "Ajouter une configuration d'inspection TLS au pare-feu et activer les journaux TLS du pare-feu." }
    - id: c
      text: { en: "Forward port 23 traffic to the stateful engine and drop it with a stateful rule that sends an alert.", fr: "Transférer le trafic du port 23 au moteur avec état et l'abandonner avec une règle avec état qui envoie une alerte." }
    - id: d
      text: { en: "Give the stateless drop rule a lower priority number than the other stateless rules in the group.", fr: "Donner à la règle sans état d'abandon un numéro de priorité inférieur à celui des autres règles sans état du groupe." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Network Firewall logs only traffic that the stateful engine handles; stateless rules do not produce flow or alert logs, although metrics cover both engines. When the stateless rule forwards port 23 traffic to the stateful engine, a stateful drop rule with an alert (for example a `drop` rule with the `alert` keyword in a Suricata-compatible rule group) writes an alert log record for each blocked attempt.
    fr: |
      Network Firewall ne journalise que le trafic traité par le moteur avec état ; les règles sans état ne produisent ni journaux de flux ni journaux d'alertes, même si les métriques couvrent les deux moteurs. Lorsque la règle sans état transfère le trafic du port 23 au moteur avec état, une règle d'abandon avec état qui envoie une alerte (par exemple une règle `drop` avec le mot-clé `alert` dans un groupe de règles compatible Suricata) écrit un enregistrement d'alerte pour chaque tentative bloquée.
  options:
    a:
      en: |
        The destination is not the issue. No log type records traffic that is dropped by the stateless engine.
      fr: |
        La destination n'est pas en cause. Aucun type de journal n'enregistre le trafic abandonné par le moteur sans état.
    b:
      en: |
        TLS logs report TLS inspection events. Telnet is not TLS traffic, and the stateless drop would still happen before any stateful processing.
      fr: |
        Les journaux TLS signalent des événements d'inspection TLS. Telnet n'est pas du trafic TLS, et l'abandon sans état aurait toujours lieu avant tout traitement avec état.
    d:
      en: |
        Priority changes the order of evaluation inside the stateless engine. The traffic would still be dropped without a log record.
      fr: |
        La priorité modifie l'ordre d'évaluation dans le moteur sans état. Le trafic serait toujours abandonné sans enregistrement de journal.
references:
  - title: Logging network traffic from AWS Network Firewall
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-logging.html
