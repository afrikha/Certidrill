id: soac03-5b-multivalue-health
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company runs a UDP service on six Amazon EC2 instances. Each instance has an Elastic IP address, and the company does not want to add a load balancer. Clients look up play.example.com in a Route 53 public hosted zone. Each DNS response must contain several instance addresses, and addresses of unhealthy instances must not be returned.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo exécute un service UDP sur six instances Amazon EC2. Chaque instance possède une adresse IP Elastic, et l'entreprise ne veut pas ajouter d'équilibreur de charge. Les clients recherchent play.example.com dans une zone hébergée publique Route 53. Chaque réponse DNS doit contenir plusieurs adresses d'instances, et les adresses des instances défaillantes ne doivent pas être renvoyées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create one simple routing record that contains the six addresses, and associate a health check with the record.", fr: "Créer un seul enregistrement de routage simple qui contient les six adresses, et associer une vérification de l'état à cet enregistrement." }
    - id: b
      text: { en: "Create six weighted records with equal weights, one per address, without health checks.", fr: "Créer six enregistrements pondérés de poids égal, un par adresse, sans vérification de l'état." }
    - id: c
      text: { en: "Create six multivalue answer records, one per address, and associate a health check with each record.", fr: "Créer six enregistrements de réponse à valeurs multiples, un par adresse, et associer une vérification de l'état à chaque enregistrement." }
    - id: d
      text: { en: "Create six failover records, one per address, and associate a health check with each record.", fr: "Créer six enregistrements de basculement, un par adresse, et associer une vérification de l'état à chaque enregistrement." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Multivalue answer routing returns up to eight healthy records in each response. With a health check associated with each record, Route 53 returns an address only while its health check is healthy. It is not a substitute for a load balancer, but it fits a design without one.
    fr: |
      Le routage de réponse à valeurs multiples renvoie jusqu'à huit enregistrements sains dans chaque réponse. Avec une vérification de l'état associée à chaque enregistrement, Route 53 ne renvoie une adresse que tant que sa vérification de l'état est saine. Ce n'est pas un substitut à un équilibreur de charge, mais cela convient à une conception qui n'en utilise pas.
  options:
    a:
      en: |
        Simple routing does not support health checks; it returns all the values of the record whether the instances are healthy or not.
      fr: |
        Le routage simple ne prend pas en charge les vérifications de l'état ; il renvoie toutes les valeurs de l'enregistrement, que les instances soient saines ou non.
    b:
      en: |
        A weighted response contains one record, and without health checks Route 53 keeps returning failed instances.
      fr: |
        Une réponse pondérée contient un seul enregistrement, et sans vérification de l'état Route 53 continue de renvoyer des instances défaillantes.
    d:
      en: |
        Failover routing supports only one primary and one secondary record, and each response contains a single address.
      fr: |
        Le routage de basculement ne prend en charge qu'un enregistrement principal et un secondaire, et chaque réponse contient une seule adresse.
references:
  - title: Multivalue answer routing
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-multivalue.html
