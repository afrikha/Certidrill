id: soac03-5a-dnsfw-alert-test
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team created a custom domain list that it plans to block with Route 53 Resolver DNS Firewall in a production VPC. Before blocking, the team must find out which workloads query these domains, without changing any DNS responses that the workloads receive.

    Which solution will meet these requirements?
  fr: |
    Une équipe de sécurité a créé une liste de domaines personnalisée qu'elle prévoit de bloquer avec Route 53 Resolver DNS Firewall dans un VPC de production. Avant le blocage, l'équipe doit déterminer quelles charges de travail interrogent ces domaines, sans modifier les réponses DNS que reçoivent les charges de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a rule with the ALERT action for the domain list, and review the Resolver query logs of the VPC.", fr: "Ajouter une règle avec l'action ALERT pour la liste de domaines, puis examiner les journaux de requêtes Resolver du VPC." }
    - id: b
      text: { en: "Add a rule with the BLOCK action and an OVERRIDE response that returns a CNAME to a monitoring host.", fr: "Ajouter une règle avec l'action BLOCK et une réponse OVERRIDE qui renvoie un CNAME vers un hôte de surveillance." }
    - id: c
      text: { en: "Add a rule with the ALLOW action for the domain list, and review VPC flow logs for DNS traffic.", fr: "Ajouter une règle avec l'action ALLOW pour la liste de domaines, puis examiner les journaux de flux VPC pour le trafic DNS." }
    - id: d
      text: { en: "Turn on fail open in the DNS Firewall configuration of the VPC, and then add a BLOCK rule.", fr: "Activer l'ouverture en cas d'échec (fail open) dans la configuration DNS Firewall du VPC, puis ajouter une règle BLOCK." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The ALERT action lets the query through unchanged and records an alert in the Resolver query logs, with fields such as `firewall_rule_action` and the source instance. AWS recommends testing a new blocking rule with ALERT first, measuring what it would have blocked, and then changing the action to BLOCK.
    fr: |
      L'action ALERT laisse passer la requête sans modification et enregistre une alerte dans les journaux de requêtes Resolver, avec des champs comme `firewall_rule_action` et l'instance source. AWS recommande de tester d'abord une nouvelle règle de blocage avec ALERT, de mesurer ce qu'elle aurait bloqué, puis de passer l'action à BLOCK.
  options:
    b:
      en: |
        An OVERRIDE response replaces the real answer, which changes the DNS responses that the workloads receive.
      fr: |
        Une réponse OVERRIDE remplace la vraie réponse, ce qui modifie les réponses DNS reçues par les charges de travail.
    c:
      en: |
        ALLOW records no DNS Firewall action, and VPC flow logs do not capture queries that instances send to the Amazon DNS server.
      fr: |
        ALLOW n'enregistre aucune action DNS Firewall, et les journaux de flux VPC ne capturent pas les requêtes que les instances envoient au serveur DNS Amazon.
    d:
      en: |
        Fail open controls what happens when DNS Firewall does not respond. With a BLOCK rule, the matching queries would be blocked during normal operation.
      fr: |
        L'ouverture en cas d'échec ne régit que le comportement lorsque DNS Firewall ne répond pas. Avec une règle BLOCK, les requêtes correspondantes seraient bloquées en fonctionnement normal.
references:
  - title: Rule actions in DNS Firewall
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-dns-firewall-rule-actions.html
  - title: Values that appear in VPC Resolver query logs
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs-format.html
