id: soac03-5a-nlb-cross-zone-cost
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Network Load Balancer is enabled in three Availability Zones, and cross-zone load balancing is turned on. An Auto Scaling group keeps the same number of healthy targets in each zone, and client traffic reaches the three load balancer nodes evenly. The monthly bill shows a high data transfer charge between Availability Zones for this workload. The company wants to lower this charge while keeping targets in all three zones.

    Which solution will meet these requirements?
  fr: |
    Un Network Load Balancer est activé dans trois zones de disponibilité, et l'équilibrage de charge entre zones (cross-zone) est activé. Un groupe Auto Scaling maintient le même nombre de cibles saines dans chaque zone, et le trafic des clients atteint les trois nœuds de l'équilibreur de manière égale. La facture mensuelle montre des frais élevés de transfert de données entre zones de disponibilité pour cette charge de travail. L'entreprise veut réduire ces frais tout en conservant des cibles dans les trois zones.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on stickiness for the target group so that each client keeps using the same target.", fr: "Activer la persistance (stickiness) du groupe cible pour que chaque client utilise toujours la même cible." }
    - id: b
      text: { en: "Place an AWS Global Accelerator standard accelerator in front of the load balancer.", fr: "Placer un accélérateur standard AWS Global Accelerator devant l'équilibreur de charge." }
    - id: c
      text: { en: "Turn off cross-zone load balancing so that each node sends traffic only to targets in its zone.", fr: "Désactiver l'équilibrage entre zones pour que chaque nœud n'envoie du trafic qu'aux cibles de sa zone." }
    - id: d
      text: { en: "Increase the deregistration delay of the target group so that connections are drained longer.", fr: "Augmenter le délai de désinscription du groupe cible pour que les connexions soient drainées plus longtemps." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With cross-zone load balancing, each Network Load Balancer node also sends traffic to targets in the other zones, and EC2 data transfer charges apply to that traffic. Because the targets and the client traffic are already balanced across zones, turning off cross-zone load balancing (the default for Network Load Balancers) keeps each flow inside its zone and removes most of that charge.
    fr: |
      Avec l'équilibrage entre zones, chaque nœud du Network Load Balancer envoie aussi du trafic aux cibles des autres zones, et des frais de transfert de données EC2 s'appliquent à ce trafic. Comme les cibles et le trafic des clients sont déjà répartis de façon égale entre les zones, désactiver l'équilibrage entre zones (valeur par défaut des Network Load Balancers) garde chaque flux dans sa zone et supprime l'essentiel de ces frais.
  options:
    a:
      en: |
        Stickiness keeps a client on one target, but that target can still be in another zone, so cross-zone traffic continues.
      fr: |
        La persistance garde un client sur une cible, mais cette cible peut toujours se trouver dans une autre zone : le trafic entre zones continue.
    b:
      en: |
        An accelerator adds its own charges and does not change how the load balancer nodes distribute traffic between zones.
      fr: |
        Un accélérateur ajoute ses propres frais et ne change pas la façon dont les nœuds de l'équilibreur répartissent le trafic entre les zones.
    d:
      en: |
        The deregistration delay only controls how long in-flight requests continue when a target is removed. It does not affect where traffic goes.
      fr: |
        Le délai de désinscription ne règle que la durée pendant laquelle les requêtes en cours se poursuivent lorsqu'une cible est retirée. Il n'influe pas sur la destination du trafic.
