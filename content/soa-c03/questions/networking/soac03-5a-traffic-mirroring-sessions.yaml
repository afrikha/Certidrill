id: soac03-5a-traffic-mirroring-sessions
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    For a two-week investigation, a network team used VPC Traffic Mirroring to copy the traffic of 40 network interfaces to a monitoring fleet behind a Network Load Balancer. When the investigation ended, the team stopped the source Amazon EC2 instances that it no longer needed and removed all rules from the traffic mirror filter. A month later, the bill still shows hourly Traffic Mirroring charges for these network interfaces.

    Which action will stop the Traffic Mirroring charges?
  fr: |
    Pour une enquête de deux semaines, une équipe réseau a utilisé VPC Traffic Mirroring pour copier le trafic de 40 interfaces réseau vers une flotte de surveillance située derrière un Network Load Balancer. À la fin de l'enquête, l'équipe a arrêté les instances Amazon EC2 sources dont elle n'avait plus besoin et a supprimé toutes les règles du filtre de mise en miroir. Un mois plus tard, la facture montre toujours des frais horaires de Traffic Mirroring pour ces interfaces réseau.

    Quelle action arrête les frais de Traffic Mirroring ?
body:
  options:
    - id: a
      text: { en: "Detach the mirrored network interfaces from the stopped source instances.", fr: "Détacher les interfaces réseau mises en miroir des instances sources arrêtées." }
    - id: b
      text: { en: "Stop the instances of the monitoring fleet behind the Network Load Balancer.", fr: "Arrêter les instances de la flotte de surveillance situées derrière le Network Load Balancer." }
    - id: c
      text: { en: "Delete the traffic mirror sessions that use the 40 network interfaces as sources.", fr: "Supprimer les sessions de mise en miroir qui utilisent les 40 interfaces réseau comme sources." }
    - id: d
      text: { en: "Add a reject rule for all traffic to the traffic mirror filter of the sessions.", fr: "Ajouter une règle de rejet pour tout le trafic au filtre de mise en miroir des sessions." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Traffic Mirroring is billed per hour for each active session, and the charge continues until the session is deleted. It still applies when the source is stopped or terminated, when the network interface is detached from the source or when the filter mirrors nothing. Deleting the 40 sessions stops the charges.
    fr: |
      Traffic Mirroring est facturé à l'heure pour chaque session active, et les frais continuent jusqu'à la suppression de la session. Ils s'appliquent même lorsque la source est arrêtée ou résiliée, lorsque l'interface réseau est détachée de la source ou lorsque le filtre ne met rien en miroir. Supprimer les 40 sessions arrête les frais.
  options:
    a:
      en: |
        AWS keeps charging for a session after its network interface is detached from the mirror source, as long as the session is not deleted.
      fr: |
        AWS continue de facturer une session après le détachement de son interface réseau de la source de mise en miroir, tant que la session n'est pas supprimée.
    b:
      en: |
        Stopping the target fleet reduces EC2 charges, but the sessions remain active and are still billed.
      fr: |
        Arrêter la flotte cible réduit les frais EC2, mais les sessions restent actives et sont toujours facturées.
    d:
      en: |
        Filter rules decide which packets are copied. The hourly charge applies to the active session, whatever its filter mirrors.
      fr: |
        Les règles de filtre déterminent les paquets copiés. Les frais horaires s'appliquent à la session active, quoi que son filtre mette en miroir.
references:
  - title: What is Traffic Mirroring?
    url: https://docs.aws.amazon.com/vpc/latest/mirroring/what-is-traffic-mirroring.html
  - title: Amazon VPC Pricing
    url: https://aws.amazon.com/vpc/pricing/
