id: soac03-5a-config-netfw-logging
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Network Firewall in several VPCs of one AWS account, and new firewalls are added regularly. AWS Config is already recording resources in the account. Auditors want a continuous compliance report that shows any firewall that does not send its flow logs to a logging destination, with the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Network Firewall dans plusieurs VPC d'un même compte AWS, et de nouveaux pare-feu sont ajoutés régulièrement. AWS Config enregistre déjà les ressources du compte. Les auditeurs veulent un rapport de conformité continu qui signale tout pare-feu qui n'envoie pas ses journaux de flux vers une destination de journalisation, avec le MOINS d'effort de développement possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy the vpc-flow-logs-enabled AWS Config managed rule for the firewall VPCs.", fr: "Déployer la règle gérée AWS Config vpc-flow-logs-enabled pour les VPC des pare-feu." }
    - id: b
      text: { en: "Deploy the wafv2-logging-enabled AWS Config managed rule with its default settings.", fr: "Déployer la règle gérée AWS Config wafv2-logging-enabled avec ses paramètres par défaut." }
    - id: c
      text: { en: "Deploy the netfw-logging-enabled AWS Config managed rule with logType set to flow.", fr: "Déployer la règle gérée AWS Config netfw-logging-enabled avec logType défini sur flow." }
    - id: d
      text: { en: "Create a CloudWatch alarm on the DroppedPackets metric of each new firewall.", fr: "Créer une alarme CloudWatch sur la métrique DroppedPackets de chaque nouveau pare-feu." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `netfw-logging-enabled` managed rule (NETFW_LOGGING_ENABLED) checks the logging configuration of Network Firewall firewalls and is NON_COMPLIANT when a log type is not configured. Its optional `logType` parameter accepts `alert`, `flow` or `both`, so setting it to `flow` reports exactly the firewalls without flow logging, including new ones.
    fr: |
      La règle gérée `netfw-logging-enabled` (NETFW_LOGGING_ENABLED) vérifie la configuration de journalisation des pare-feu Network Firewall et est NON_COMPLIANT lorsqu'un type de journal n'est pas configuré. Son paramètre facultatif `logType` accepte `alert`, `flow` ou `both` : avec `flow`, elle signale exactement les pare-feu sans journaux de flux, y compris les nouveaux.
  options:
    a:
      en: |
        This rule checks whether VPC flow logs exist for VPCs. It does not evaluate the logging configuration of Network Firewall firewalls.
      fr: |
        Cette règle vérifie l'existence de journaux de flux VPC pour les VPC. Elle n'évalue pas la configuration de journalisation des pare-feu Network Firewall.
    b:
      en: |
        This rule checks logging on AWS WAF web ACLs, not on Network Firewall firewalls.
      fr: |
        Cette règle vérifie la journalisation des listes ACL web AWS WAF, pas celle des pare-feu Network Firewall.
    d:
      en: |
        A metric alarm reports traffic volumes, not the logging configuration, and it produces no compliance report.
      fr: |
        Une alarme sur une métrique signale des volumes de trafic, pas la configuration de journalisation, et elle ne produit aucun rapport de conformité.
references:
  - title: netfw-logging-enabled
    url: https://docs.aws.amazon.com/config/latest/developerguide/netfw-logging-enabled.html
