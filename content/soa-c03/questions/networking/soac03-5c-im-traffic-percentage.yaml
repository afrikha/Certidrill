id: soac03-5c-im-traffic-percentage
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon CloudWatch Internet Monitor for an application behind a Network Load Balancer. To limit costs, the monitor was created with the percentage of application traffic to monitor set to 25 %. Local health event thresholds are turned on. Customers in a small city reported that the application was unreachable through their internet service provider for an hour, but Internet Monitor created no health event. The company now wants health events for issues that affect any of its client locations.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise Amazon CloudWatch Internet Monitor pour une application placée derrière un Network Load Balancer. Pour limiter les coûts, le moniteur a été créé avec un pourcentage de trafic de l'application à surveiller de 25 %. Les seuils locaux d'événements de santé sont activés. Des clients d'une petite ville ont signalé que l'application était injoignable par leur fournisseur d'accès à Internet pendant une heure, mais Internet Monitor n'a créé aucun événement de santé. L'entreprise veut désormais des événements de santé pour les problèmes qui touchent n'importe lequel de ses lieux clients.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Lower the overall availability score threshold of the monitor from 95 % to 90 %.", fr: "Abaisser le seuil global du score de disponibilité du moniteur de 95 % à 90 %." } }
    - { id: b, text: { en: "Set the traffic percentage to monitor to 100 % and do not set a maximum number of city-networks.", fr: "Définir le pourcentage de trafic à surveiller à 100 % et ne fixer aucun nombre maximal de city-networks." } }
    - { id: c, text: { en: "Turn on the publication of internet measurements for all city-networks to an Amazon S3 bucket.", fr: "Activer la publication des mesures Internet de tous les city-networks dans un compartiment Amazon S3." } }
    - { id: d, text: { en: "Create an Amazon EventBridge rule that matches all events whose source is aws.internetmonitor.", fr: "Créer une règle Amazon EventBridge qui correspond à tous les événements dont la source est aws.internetmonitor." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The traffic percentage decides how many city-networks, ranked by traffic, Internet Monitor monitors. With 25 %, low-traffic locations such as a small city can be left out, and no health event is created for traffic that is not monitored. Monitoring 100 % of the traffic without a city-network maximum covers every client location."
    fr: "Le pourcentage de trafic détermine combien de city-networks, classés par volume de trafic, Internet Monitor surveille. Avec 25 %, des lieux à faible trafic comme une petite ville peuvent être exclus, et aucun événement de santé n'est créé pour un trafic qui n'est pas surveillé. Surveiller 100 % du trafic sans maximum de city-networks couvre tous les lieux clients."
  options:
    a:
      en: "A lower threshold creates fewer health events, and it still does not cover the city-networks that are not monitored."
      fr: "Un seuil plus bas crée moins d'événements de santé, et il ne couvre toujours pas les city-networks qui ne sont pas surveillés."
    c:
      en: "Publishing to S3 only exports measurements of monitored city-networks; it does not add traffic to the monitor or create health events."
      fr: "La publication dans S3 exporte seulement les mesures des city-networks surveillés ; elle n'ajoute pas de trafic au moniteur et ne crée pas d'événements de santé."
    d:
      en: "EventBridge delivers the health events that Internet Monitor creates; it cannot deliver events for traffic that is not monitored."
      fr: "EventBridge transmet les événements de santé créés par Internet Monitor ; il ne peut pas transmettre d'événements pour un trafic qui n'est pas surveillé."
references:
  - title: Choose a percentage of traffic to monitor for your application
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/IMTrafficPercentage.html
