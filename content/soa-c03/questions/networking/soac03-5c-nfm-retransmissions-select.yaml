id: soac03-5c-nfm-retransmissions-select
objective: "5.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs microservices on Amazon EC2 instances in three Availability Zones. The microservices call each other and Amazon DynamoDB. Requests are slow at times, and the operations team suspects network problems. The team must see TCP round-trip time, retransmissions and retransmission timeouts for these flows, find the flows that contribute most to the problem, and learn whether an AWS network issue was involved.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des microservices sur des instances Amazon EC2 réparties dans trois zones de disponibilité. Les microservices s'appellent entre eux et appellent Amazon DynamoDB. Les demandes sont parfois lentes, et l'équipe d'exploitation soupçonne des problèmes réseau. L'équipe doit voir le temps aller-retour TCP, les retransmissions et les expirations de retransmission de ces flux, trouver les flux qui contribuent le plus au problème et savoir si un problème du réseau AWS est en cause.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Internet Monitor monitor for the VPC and review the round-trip time of each city-network.", fr: "Créer un moniteur Internet Monitor pour le VPC et consulter le temps aller-retour de chaque city-network." } }
    - { id: b, text: { en: "Create Network Synthetic Monitor probes from each subnet to the private IP addresses of the other instances.", fr: "Créer des sondes Network Synthetic Monitor depuis chaque sous-réseau vers les adresses IP privées des autres instances." } }
    - { id: c, text: { en: "Run VPC Reachability Analyzer between the instances and review the analysis for each path.", fr: "Exécuter VPC Reachability Analyzer entre les instances et consulter l'analyse de chaque chemin." } }
    - { id: d, text: { en: "Install Network Flow Monitor agents on the instances and use Workload insights and monitors.", fr: "Installer des agents Network Flow Monitor sur les instances et utiliser Workload insights et des moniteurs." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Network Flow Monitor agents collect TCP round-trip time, retransmissions, retransmission timeouts and bytes transferred for flows between instances and toward AWS services such as DynamoDB. Workload insights shows the top contributors, and a monitor's network health indicator shows whether an AWS network issue affected the tracked flows."
    fr: "Les agents Network Flow Monitor collectent le temps aller-retour TCP, les retransmissions, les expirations de retransmission et les octets transférés pour les flux entre instances et vers des services AWS comme DynamoDB. Workload insights affiche les principaux contributeurs (top contributors), et l'indicateur de santé du réseau (NHI) d'un moniteur indique si un problème du réseau AWS a touché les flux suivis."
  options:
    a:
      en: "Internet Monitor measures internet traffic between the application and its clients, not traffic between instances or to DynamoDB."
      fr: "Internet Monitor mesure le trafic Internet entre l'application et ses clients, pas le trafic entre instances ni vers DynamoDB."
    b:
      en: "Network Synthetic Monitor sends probes to on-premises destinations; it does not report the TCP metrics of the real application flows."
      fr: "Network Synthetic Monitor envoie des sondes vers des destinations sur site ; il ne rapporte pas les métriques TCP des vrais flux de l'application."
    c:
      en: "Reachability Analyzer checks whether a path is allowed by the configuration; it does not measure latency or retransmissions."
      fr: "Reachability Analyzer vérifie si un chemin est autorisé par la configuration ; il ne mesure ni la latence ni les retransmissions."
references:
  - title: What is Network Flow Monitor?
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-NetworkFlowMonitor-What-is-NetworkFlowMonitor.html
