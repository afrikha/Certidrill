id: soac03-5b-outbound-forward-causes
objective: "5.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has a VPC in us-east-2 that is connected to its data center through AWS Direct Connect. A CloudOps engineer created a Route 53 VPC Resolver outbound endpoint in the VPC and a forwarding rule for corp.example.com that targets the on-premises DNS servers 10.100.0.10 and 10.100.0.11. Amazon EC2 instances in the VPC still cannot resolve corp.example.com names. The on-premises DNS servers are healthy and reachable from the VPC.

    Which two issues could cause this problem? (Choose two.)
  fr: |
    Une entreprise possède un VPC dans us-east-2 relié à son centre de données par AWS Direct Connect. Un ingénieur CloudOps a créé un point de terminaison sortant Route 53 VPC Resolver dans le VPC et une règle de transfert pour corp.example.com qui cible les serveurs DNS sur site 10.100.0.10 et 10.100.0.11. Les instances Amazon EC2 du VPC ne parviennent toujours pas à résoudre les noms de corp.example.com. Les serveurs DNS sur site sont sains et joignables depuis le VPC.

    Quels sont les deux problèmes qui pourraient en être la cause ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The VPC does not have a Resolver inbound endpoint.", fr: "Le VPC ne possède pas de point de terminaison entrant Resolver." } }
    - { id: b, text: { en: "The forwarding rule is not associated with the VPC.", fr: "La règle de transfert n'est pas associée au VPC." } }
    - { id: c, text: { en: "No private hosted zone for corp.example.com is associated with the VPC.", fr: "Aucune zone hébergée privée pour corp.example.com n'est associée au VPC." } }
    - { id: d, text: { en: "The IP addresses of the outbound endpoint are in two Availability Zones.", fr: "Les adresses IP du point de terminaison sortant se trouvent dans deux zones de disponibilité." } }
    - { id: e, text: { en: "The security group of the outbound endpoint does not allow outbound TCP and UDP port 53 to 10.100.0.0/24.", fr: "Le groupe de sécurité du point de terminaison sortant n'autorise pas le trafic sortant TCP et UDP sur le port 53 vers 10.100.0.0/24." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A forwarding rule takes effect only in the VPCs it is associated with; without the association, the VPC Resolver resolves corp.example.com recursively on the internet. The outbound endpoint's security group must also allow outbound TCP and UDP on port 53 to the target DNS servers, or the forwarded queries are dropped.
    fr: |
      Une règle de transfert ne s'applique que dans les VPC auxquels elle est associée ; sans association, le VPC Resolver résout corp.example.com de manière récursive sur Internet. Le groupe de sécurité du point de terminaison sortant doit aussi autoriser le trafic sortant TCP et UDP sur le port 53 vers les serveurs DNS cibles, sinon les requêtes transférées sont rejetées.
  options:
    a:
      en: |
        An inbound endpoint is needed only for queries that come from the data center into the VPC.
      fr: |
        Un point de terminaison entrant n'est nécessaire que pour les requêtes venant du centre de données vers le VPC.
    c:
      en: |
        The records are hosted on premises, so no private hosted zone is needed; a zone for the same name would be overridden by the rule anyway.
      fr: |
        Les enregistrements sont hébergés sur site : aucune zone hébergée privée n'est nécessaire, et une zone du même nom serait de toute façon supplantée par la règle.
    d:
      en: |
        Placing endpoint IP addresses in at least two Availability Zones is the recommended configuration for redundancy.
      fr: |
        Placer les adresses IP du point de terminaison dans au moins deux zones de disponibilité est la configuration recommandée pour la redondance.
references:
  - title: How Resolver endpoints forward DNS queries from your VPCs to your network
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-overview-forward-vpc-to-network.html
  - title: Managing forwarding rules
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-rules-managing.html
