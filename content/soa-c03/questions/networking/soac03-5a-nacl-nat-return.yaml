id: soac03-5a-nacl-nat-return
objective: "5.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Amazon Linux instances in a private subnet download patches over HTTPS through a NAT gateway in a public subnet. A CloudOps engineer associates a new custom network ACL with the private subnet. The network ACL contains only its default rules, which deny all inbound and outbound traffic. The public subnet's network ACL allows all traffic, and the security groups allow the required traffic. The engineer must add only the rules that the patch downloads need.

    Which network ACL rules should the engineer add to the private subnet's network ACL? (Choose two.)
  fr: |
    Des instances Amazon Linux d'un sous-réseau privé téléchargent des correctifs en HTTPS par une passerelle NAT située dans un sous-réseau public. Un ingénieur CloudOps associe une nouvelle ACL réseau personnalisée au sous-réseau privé. Cette ACL réseau ne contient que ses règles par défaut, qui refusent tout le trafic entrant et sortant. L'ACL réseau du sous-réseau public autorise tout le trafic, et les groupes de sécurité autorisent le trafic requis. L'ingénieur doit ajouter uniquement les règles nécessaires aux téléchargements de correctifs.

    Quelles règles l'ingénieur doit-il ajouter à l'ACL réseau du sous-réseau privé ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An inbound rule that allows TCP 443 from 0.0.0.0/0", fr: "Une règle entrante qui autorise TCP 443 depuis 0.0.0.0/0" } }
    - { id: b, text: { en: "An outbound rule that allows TCP 443 to 0.0.0.0/0", fr: "Une règle sortante qui autorise TCP 443 vers 0.0.0.0/0" } }
    - { id: c, text: { en: "An outbound rule that allows TCP 1024-65535 to 0.0.0.0/0", fr: "Une règle sortante qui autorise TCP 1024-65535 vers 0.0.0.0/0" } }
    - { id: d, text: { en: "An inbound rule that allows TCP 1024-65535 from 0.0.0.0/0", fr: "Une règle entrante qui autorise TCP 1024-65535 depuis 0.0.0.0/0" } }
    - { id: e, text: { en: "An inbound rule that allows all traffic from the NAT gateway's Elastic IP address", fr: "Une règle entrante qui autorise tout le trafic depuis l'adresse IP Elastic de la passerelle NAT" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Network ACLs are stateless, so the request and the response each need a rule. The instances start the connections, which needs an outbound rule for TCP 443. The replies come back to the instances' ephemeral ports (32768-61000 on Amazon Linux); a rule for 1024-65535 covers every client type, including traffic that a NAT gateway forwards.
    fr: |
      Les ACL réseau sont sans état : la requête et la réponse ont chacune besoin d'une règle. Les instances ouvrent les connexions, ce qui exige une règle sortante pour TCP 443. Les réponses reviennent sur les ports éphémères des instances (32768-61000 sur Amazon Linux) ; une règle pour 1024-65535 couvre tous les types de clients, y compris le trafic transmis par une passerelle NAT.
  options:
    a:
      en: |
        Nothing on the internet starts connections to port 443 of these instances. The responses arrive on ephemeral ports, not on port 443.
      fr: |
        Rien sur Internet n'ouvre de connexion vers le port 443 de ces instances. Les réponses arrivent sur des ports éphémères, pas sur le port 443.
    c:
      en: |
        Outbound ephemeral ports would be needed only if the instances answered connections started by other hosts, which is not the case here.
      fr: |
        Des ports éphémères sortants ne seraient nécessaires que si les instances répondaient à des connexions ouvertes par d'autres hôtes, ce qui n'est pas le cas ici.
    e:
      en: |
        A public NAT gateway translates only the source address of outbound packets. The responses that reach the private subnet keep the internet server's address as their source, so a rule for the Elastic IP address never matches them.
      fr: |
        Une passerelle NAT publique ne traduit que l'adresse source des paquets sortants. Les réponses qui atteignent le sous-réseau privé gardent l'adresse du serveur Internet comme source : une règle pour l'adresse IP Elastic ne leur correspond jamais.
references:
  - title: Custom network ACLs for your VPC
    url: https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html
