id: soac03-5c-cf-hit-rate-misses
objective: "5.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A CloudOps team at AnyCompany manages an Amazon CloudFront distribution that uses only the default distribution metrics. The team must receive an Amazon CloudWatch alarm notification when the cache hit rate of the distribution drops below 70 %. The team must also identify which URL paths cause the most cache misses.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe CloudOps d'AnyCompany gère une distribution Amazon CloudFront qui n'utilise que les métriques de distribution par défaut. L'équipe doit recevoir une notification d'alarme Amazon CloudWatch lorsque le taux d'accès au cache de la distribution descend sous 70 %. L'équipe doit aussi identifier les chemins d'URL qui provoquent le plus d'échecs d'accès au cache (cache misses).

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the alarm on the default Requests metric of the distribution in the Region of the origin.", fr: "Créer l'alarme sur la métrique par défaut Requests de la distribution dans la Région de l'origine." } }
    - { id: b, text: { en: "Turn on additional metrics for the distribution and create the alarm on the cache hit rate metric in us-east-1.", fr: "Activer les métriques supplémentaires de la distribution et créer l'alarme sur la métrique de taux d'accès au cache dans us-east-1." } }
    - { id: c, text: { en: "Turn on VPC Flow Logs for the origin subnets and count the flows that come from CloudFront.", fr: "Activer les journaux de flux VPC pour les sous-réseaux de l'origine et compter les flux qui proviennent de CloudFront." } }
    - { id: d, text: { en: "Create a CloudWatch Logs metric filter that reads the CloudFront log files that are stored in Amazon S3.", fr: "Créer un filtre de métriques CloudWatch Logs qui lit les fichiers journaux CloudFront stockés dans Amazon S3." } }
    - { id: e, text: { en: "Turn on standard logging and query the x-edge-result-type and cs-uri-stem fields with Amazon Athena.", fr: "Activer la journalisation standard et interroger les champs x-edge-result-type et cs-uri-stem avec Amazon Athena." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Cache hit rate is one of the additional distribution metrics, which must be turned on per distribution and are sent to CloudWatch in US East (N. Virginia), where the alarm is created. Standard logs record, for each request, the URL path and the result type (Hit, RefreshHit, Miss), so an Athena query can rank the paths with the most misses."
    fr: "Le taux d'accès au cache fait partie des métriques de distribution supplémentaires, qui doivent être activées pour chaque distribution et sont envoyées à CloudWatch dans USA Est (Virginie du Nord), où l'alarme est créée. Les journaux standard enregistrent pour chaque demande le chemin d'URL et le type de résultat (Hit, RefreshHit, Miss) : une requête Athena peut donc classer les chemins qui ont le plus d'échecs."
  options:
    a:
      en: "The Requests metric counts all requests and does not show whether they were cache hits; CloudFront metrics are also not published in the origin's Region."
      fr: "La métrique Requests compte toutes les demandes sans indiquer s'il s'agit d'accès au cache ; les métriques CloudFront ne sont pas non plus publiées dans la Région de l'origine."
    c:
      en: "Flow logs record IP traffic in the VPC, not CloudFront cache results or URL paths."
      fr: "Les journaux de flux enregistrent le trafic IP dans le VPC, pas les résultats de cache de CloudFront ni les chemins d'URL."
    d:
      en: "Metric filters work on CloudWatch Logs log groups, not on log files stored in an S3 bucket."
      fr: "Les filtres de métriques fonctionnent sur des groupes de journaux CloudWatch Logs, pas sur des fichiers journaux stockés dans un compartiment S3."
references:
  - title: View CloudFront and edge function metrics
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewing-cloudfront-metrics.html
  - title: Standard logging reference
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/standard-logs-reference.html
