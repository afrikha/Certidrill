id: soac03-5b-healthcheck-prefix-list
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Route 53 failover records for portal.example.com. The primary record points to the Elastic IP address of an Amazon EC2 instance in us-east-1 and has an HTTPS health check on port 443. The instance's security group allows TCP port 443 only from a partner range, 192.0.2.0/24. The health check reports the endpoint as unhealthy, although the partner can use the application. The security group must keep blocking all other internet traffic, and the company does not want to maintain lists of IP addresses.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise des enregistrements de basculement Route 53 pour portal.example.com. L'enregistrement principal pointe vers l'adresse IP Elastic d'une instance Amazon EC2 dans us-east-1 et possède une vérification de l'état HTTPS sur le port 443. Le groupe de sécurité de l'instance n'autorise le port TCP 443 que depuis une plage partenaire, 192.0.2.0/24. La vérification de l'état signale le point de terminaison comme défaillant, alors que le partenaire peut utiliser l'application. Le groupe de sécurité doit continuer à bloquer tout autre trafic Internet, et l'entreprise ne veut pas maintenir de listes d'adresses IP.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an inbound rule that allows TCP port 443 from the AWS-managed prefix list com.amazonaws.us-east-1.route53-healthchecks.", fr: "Ajouter une règle entrante qui autorise le port TCP 443 depuis la liste de préfixes gérée par AWS com.amazonaws.us-east-1.route53-healthchecks." }
    - id: b
      text: { en: "Add an inbound rule that allows TCP port 443 from 0.0.0.0/0, and keep the partner rule.", fr: "Ajouter une règle entrante qui autorise le port TCP 443 depuis 0.0.0.0/0, et conserver la règle du partenaire." }
    - id: c
      text: { en: "Change the health check to a TCP health check on port 443.", fr: "Remplacer la vérification de l'état par une vérification de l'état TCP sur le port 443." }
    - id: d
      text: { en: "Add inbound rules for the ranges that ip-ranges.json lists for the ROUTE53 service.", fr: "Ajouter des règles entrantes pour les plages que ip-ranges.json indique pour le service ROUTE53." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Route 53 health checkers connect from AWS address ranges, so the security group must allow them on the health-check port. The AWS-managed prefix list com.amazonaws.<region>.route53-healthchecks contains all the required ranges and is kept up to date by AWS, so nobody has to maintain the addresses.
    fr: |
      Les vérificateurs d'état Route 53 se connectent depuis des plages d'adresses AWS : le groupe de sécurité doit donc les autoriser sur le port de la vérification. La liste de préfixes gérée par AWS com.amazonaws.<region>.route53-healthchecks contient toutes les plages nécessaires et est tenue à jour par AWS : personne n'a à maintenir les adresses.
  options:
    b:
      en: |
        Opening port 443 to the whole internet breaks the requirement to keep blocking all other traffic.
      fr: |
        Ouvrir le port 443 à tout Internet enfreint l'exigence de continuer à bloquer tout autre trafic.
    c:
      en: |
        A TCP health check still needs a connection from the health checkers, which the security group blocks.
      fr: |
        Une vérification de l'état TCP nécessite toujours une connexion depuis les vérificateurs d'état, que le groupe de sécurité bloque.
    d:
      en: |
        The health checkers use the ROUTE53_HEALTHCHECKS ranges, and copying ranges by hand is the maintenance the company wants to avoid.
      fr: |
        Les vérificateurs d'état utilisent les plages ROUTE53_HEALTHCHECKS, et copier des plages à la main est précisément la maintenance que l'entreprise veut éviter.
references:
  - title: Configuring router and firewall rules for Amazon Route 53 health checks
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-router-firewall-rules.html
