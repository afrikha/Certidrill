id: soac03-5b-inbound-endpoint-udp
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company created a Route 53 VPC Resolver inbound endpoint so that its on-premises DNS servers (172.16.0.0/16) can resolve a private hosted zone over AWS Direct Connect. Most forwarded queries time out. A few queries that the on-premises servers retry over TCP succeed. The security group of the endpoint has the following inbound rules and the default outbound rule:

    ```json
    [
      {
        "IpProtocol": "tcp",
        "FromPort": 53,
        "ToPort": 53,
        "IpRanges": [{ "CidrIp": "172.16.0.0/16" }]
      }
    ]
    ```

    Which change will resolve the issue?
  fr: |
    Une entreprise a créé un point de terminaison entrant Route 53 VPC Resolver pour que ses serveurs DNS sur site (172.16.0.0/16) puissent résoudre une zone hébergée privée par AWS Direct Connect. La plupart des requêtes transférées expirent. Quelques requêtes que les serveurs sur site retentent en TCP réussissent. Le groupe de sécurité du point de terminaison possède les règles entrantes suivantes et la règle sortante par défaut :

    ```json
    [
      {
        "IpProtocol": "tcp",
        "FromPort": 53,
        "ToPort": 53,
        "IpRanges": [{ "CidrIp": "172.16.0.0/16" }]
      }
    ]
    ```

    Quelle modification résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add an outbound rule to the security group that allows UDP port 53 to 172.16.0.0/16.", fr: "Ajouter au groupe de sécurité une règle sortante qui autorise le port UDP 53 vers 172.16.0.0/16." }
    - id: b
      text: { en: "Add an inbound rule to the security group that allows UDP port 53 from 172.16.0.0/16.", fr: "Ajouter au groupe de sécurité une règle entrante qui autorise le port UDP 53 depuis 172.16.0.0/16." }
    - id: c
      text: { en: "Add an inbound rule to the security group that allows TCP port 443 from 172.16.0.0/16.", fr: "Ajouter au groupe de sécurité une règle entrante qui autorise le port TCP 443 depuis 172.16.0.0/16." }
    - id: d
      text: { en: "Add a third IP address to the endpoint in another Availability Zone.", fr: "Ajouter une troisième adresse IP au point de terminaison dans une autre zone de disponibilité." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The security group of an inbound endpoint must allow both TCP and UDP on port 53 from the resolvers that forward queries. DNS uses UDP for most queries, so the UDP queries are dropped and only the TCP retries succeed.
    fr: |
      Le groupe de sécurité d'un point de terminaison entrant doit autoriser à la fois TCP et UDP sur le port 53 depuis les résolveurs qui transfèrent les requêtes. Le DNS utilise UDP pour la plupart des requêtes : les requêtes UDP sont rejetées et seules les nouvelles tentatives en TCP réussissent.
  options:
    a:
      en: |
        Security groups are stateful: responses to allowed inbound queries are allowed out. The queries are blocked on the way in.
      fr: |
        Les groupes de sécurité sont avec état : les réponses aux requêtes entrantes autorisées sortent. Les requêtes sont bloquées à l'entrée.
    c:
      en: |
        Port 443 is needed only when the endpoint uses DNS over HTTPS (DoH); the on-premises servers send standard DNS queries.
      fr: |
        Le port 443 n'est nécessaire que si le point de terminaison utilise DNS over HTTPS (DoH) ; les serveurs sur site envoient des requêtes DNS standard.
    d:
      en: |
        More IP addresses add capacity and redundancy, but the new addresses use the same security group, which still blocks UDP.
      fr: |
        Davantage d'adresses IP ajoutent de la capacité et de la redondance, mais les nouvelles adresses utilisent le même groupe de sécurité, qui bloque toujours UDP.
references:
  - title: Values that you specify when you create or edit inbound endpoints
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-forwarding-inbound-queries-values.html
