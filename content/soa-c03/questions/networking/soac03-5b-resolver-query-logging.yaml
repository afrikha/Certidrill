id: soac03-5b-resolver-query-logging
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security team must find which Amazon EC2 instances in a VPC look up a suspicious domain name. The team needs the instance ID, the queried name and the response for each DNS query that the instances send to the Amazon-provided DNS server. The records must be stored in an Amazon S3 bucket.

    Which solution will meet these requirements?
  fr: |
    Une équipe de sécurité doit trouver quelles instances Amazon EC2 d'un VPC recherchent un nom de domaine suspect. L'équipe a besoin de l'ID d'instance, du nom demandé et de la réponse pour chaque requête DNS que les instances envoient au serveur DNS fourni par Amazon. Les enregistrements doivent être stockés dans un compartiment Amazon S3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create VPC flow logs for the VPC with an S3 destination, and filter the records on port 53.", fr: "Créer des journaux de flux VPC pour le VPC avec une destination S3, et filtrer les enregistrements sur le port 53." }
    - id: b
      text: { en: "Create a Route 53 VPC Resolver query logging configuration with an S3 destination, and associate it with the VPC.", fr: "Créer une configuration de journalisation des requêtes Route 53 VPC Resolver avec une destination S3, et l'associer au VPC." }
    - id: c
      text: { en: "Turn on public DNS query logging for the company's public hosted zones, and export the logs to S3.", fr: "Activer la journalisation des requêtes DNS publiques pour les zones hébergées publiques de l'entreprise, et exporter les journaux vers S3." }
    - id: d
      text: { en: "Create an AWS CloudTrail trail that logs Route 53 data events to an S3 bucket.", fr: "Créer un journal de suivi AWS CloudTrail qui enregistre les événements de données Route 53 dans un compartiment S3." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Resolver query logging records the queries that originate in the associated VPCs and their responses, including the source IP address and instance ID, the queried name, the record type and the response code. The destination can be a CloudWatch Logs log group, an S3 bucket or a Firehose stream.
    fr: |
      La journalisation des requêtes Resolver enregistre les requêtes émises dans les VPC associés et leurs réponses, avec l'adresse IP source et l'ID d'instance, le nom demandé, le type d'enregistrement et le code de réponse. La destination peut être un groupe de journaux CloudWatch Logs, un compartiment S3 ou un flux Firehose.
  options:
    a:
      en: |
        Flow logs do not capture the traffic that instances send to the Amazon DNS server, and they never contain the queried names.
      fr: |
        Les journaux de flux ne capturent pas le trafic que les instances envoient au serveur DNS Amazon, et ils ne contiennent jamais les noms demandés.
    c:
      en: |
        Public query logs contain only queries for the company's own hosted zones, sent by resolvers; they do not identify instances.
      fr: |
        Les journaux de requêtes publiques ne contiennent que les requêtes visant les zones hébergées de l'entreprise, envoyées par des résolveurs ; ils n'identifient pas les instances.
    d:
      en: |
        CloudTrail records API calls to Route 53, not the DNS queries that instances resolve.
      fr: |
        CloudTrail enregistre les appels d'API vers Route 53, pas les requêtes DNS que résolvent les instances.
references:
  - title: Resolver query logging
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs.html
  - title: Flow log limitations
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-limitations.html
