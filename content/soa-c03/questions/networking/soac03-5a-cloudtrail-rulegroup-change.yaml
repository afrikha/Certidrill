id: soac03-5a-cloudtrail-rulegroup-change
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Yesterday afternoon, an AWS Network Firewall firewall started dropping traffic that it had always allowed. A CloudOps engineer suspects that someone changed one of the firewall's rule groups. The account has no trail and AWS Config is not enabled. The engineer must find out who made the change.

    Which solution will provide this information?
  fr: |
    Hier après-midi, un pare-feu AWS Network Firewall a commencé à abandonner du trafic qu'il avait toujours autorisé. Un ingénieur CloudOps soupçonne que quelqu'un a modifié l'un des groupes de règles du pare-feu. Le compte n'a aucun journal de suivi (trail) et AWS Config n'est pas activé. L'ingénieur doit déterminer qui a effectué la modification.

    Quelle solution fournit cette information ?
body:
  options:
    - id: a
      text: { en: "Search CloudTrail event history in the firewall's Region for UpdateRuleGroup events.", fr: "Rechercher les événements UpdateRuleGroup dans l'historique des événements CloudTrail de la Région du pare-feu." }
    - id: b
      text: { en: "Query the firewall's alert logs for the rule that started dropping the traffic.", fr: "Interroger les journaux d'alertes du pare-feu pour trouver la règle qui a commencé à abandonner le trafic." }
    - id: c
      text: { en: "Query the VPC flow logs of the firewall subnets for REJECT records from yesterday.", fr: "Interroger les journaux de flux VPC des sous-réseaux du pare-feu pour les enregistrements REJECT d'hier." }
    - id: d
      text: { en: "Review the firewall's DroppedPackets metric in CloudWatch for the time of the change.", fr: "Examiner la métrique DroppedPackets du pare-feu dans CloudWatch au moment de la modification." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      All Network Firewall API actions are logged by AWS CloudTrail. Event history keeps the last 90 days of management events in each Region without any trail, and a lookup on the event name `UpdateRuleGroup` shows the identity, time and source of each change.
    fr: |
      Toutes les actions de l'API Network Firewall sont journalisées par AWS CloudTrail. L'historique des événements conserve les 90 derniers jours d'événements de gestion de chaque Région sans aucun journal de suivi, et une recherche sur le nom d'événement `UpdateRuleGroup` montre l'identité, l'heure et la source de chaque modification.
  options:
    b:
      en: |
        Alert logs show which traffic matched which rule. They do not record who changed the rule group.
      fr: |
        Les journaux d'alertes montrent quel trafic a correspondu à quelle règle. Ils n'enregistrent pas qui a modifié le groupe de règles.
    c:
      en: |
        Flow logs describe network traffic, not configuration changes or the identities that made them.
      fr: |
        Les journaux de flux décrivent le trafic réseau, pas les modifications de configuration ni les identités qui les ont faites.
    d:
      en: |
        The metric confirms when drops increased but contains no information about who changed the configuration.
      fr: |
        La métrique confirme quand les abandons ont augmenté, mais ne contient aucune information sur l'auteur de la modification.
references:
  - title: Logging calls to the AWS Network Firewall API with AWS CloudTrail
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/logging-using-cloudtrail.html
  - title: Working with CloudTrail event history
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
