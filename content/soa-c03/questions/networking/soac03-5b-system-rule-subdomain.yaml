id: soac03-5b-system-rule-subdomain
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's VPC uses a Route 53 VPC Resolver forwarding rule for example.com. The rule sends queries through an outbound endpoint to DNS servers in the company's data center. The company created a Route 53 private hosted zone named aws.example.com and associated it with the VPC. Amazon EC2 instances in the VPC still receive answers from the on-premises servers for aws.example.com names, and those servers do not host this zone. All other example.com names must still be resolved on premises.

    Which solution will meet these requirements?
  fr: |
    Le VPC d'une entreprise utilise une règle de transfert Route 53 VPC Resolver pour example.com. Cette règle envoie les requêtes, par un point de terminaison sortant, vers des serveurs DNS du centre de données de l'entreprise. L'entreprise a créé une zone hébergée privée Route 53 nommée aws.example.com et l'a associée au VPC. Les instances Amazon EC2 du VPC reçoivent toujours des réponses des serveurs sur site pour les noms de aws.example.com, et ces serveurs n'hébergent pas cette zone. Tous les autres noms de example.com doivent toujours être résolus sur site.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Disassociate the example.com forwarding rule from the VPC, and associate the private hosted zone with the VPC again.", fr: "Dissocier la règle de transfert example.com du VPC, puis associer de nouveau la zone hébergée privée au VPC." }
    - id: b
      text: { en: "Create an inbound endpoint in the VPC, and associate the aws.example.com private hosted zone with the inbound endpoint.", fr: "Créer un point de terminaison entrant dans le VPC, et associer la zone hébergée privée aws.example.com à ce point de terminaison entrant." }
    - id: c
      text: { en: "Create a forwarding rule for aws.example.com that targets the IP addresses of the outbound endpoint, and associate it with the VPC.", fr: "Créer une règle de transfert pour aws.example.com qui cible les adresses IP du point de terminaison sortant, et l'associer au VPC." }
    - id: d
      text: { en: "Create a system rule for aws.example.com, and associate the rule with the VPC.", fr: "Créer une règle système pour aws.example.com, et associer cette règle au VPC." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A forwarding rule applies to its domain and all subdomains, and it takes precedence over a private hosted zone for the same names. A system rule for aws.example.com overrides the forwarding rule for that subdomain only, so the VPC Resolver answers aws.example.com from the private hosted zone while other example.com names are still forwarded.
    fr: |
      Une règle de transfert s'applique à son domaine et à tous ses sous-domaines, et elle prévaut sur une zone hébergée privée pour les mêmes noms. Une règle système pour aws.example.com remplace la règle de transfert pour ce seul sous-domaine : le VPC Resolver répond pour aws.example.com à partir de la zone hébergée privée, et les autres noms de example.com sont toujours transférés.
  options:
    a:
      en: |
        Without the forwarding rule, the other example.com names are no longer sent to the data center, which breaks a stated requirement.
      fr: |
        Sans la règle de transfert, les autres noms de example.com ne sont plus envoyés au centre de données, ce qui enfreint une exigence énoncée.
    b:
      en: |
        Private hosted zones are associated with VPCs, not with endpoints, and an inbound endpoint only receives queries from outside the VPC.
      fr: |
        Les zones hébergées privées sont associées à des VPC, pas à des points de terminaison, et un point de terminaison entrant ne reçoit que des requêtes venant de l'extérieur du VPC.
    c:
      en: |
        Outbound endpoint addresses are the sources of forwarded queries, not DNS servers; a forwarding rule still bypasses the private hosted zone.
      fr: |
        Les adresses d'un point de terminaison sortant sont la source des requêtes transférées, pas des serveurs DNS ; une règle de transfert contourne toujours la zone hébergée privée.
references:
  - title: Using rules to control which queries are forwarded to your network
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-overview-forward-vpc-to-network-using-rules.html
  - title: Considerations when working with a private hosted zone
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-considerations.html
