id: soac03-5a-shield-alarm-cloudfront
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company subscribes to AWS Shield Advanced and protects an Amazon CloudFront distribution whose origin is an Application Load Balancer in the eu-west-1 Region. The operations team works in eu-west-1 and wants an Amazon CloudWatch alarm that goes off whenever Shield Advanced detects a DDoS event on the distribution. In the eu-west-1 CloudWatch console, the team cannot find any Shield Advanced metric for the distribution.

    Which solution will meet this requirement?
  fr: |
    Une entreprise a souscrit à AWS Shield Advanced et protège une distribution Amazon CloudFront dont l'origine est un Application Load Balancer de la Région eu-west-1. L'équipe d'exploitation travaille dans eu-west-1 et veut une alarme Amazon CloudWatch qui se déclenche chaque fois que Shield Advanced détecte un événement DDoS sur la distribution. Dans la console CloudWatch d'eu-west-1, l'équipe ne trouve aucune métrique Shield Advanced pour la distribution.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "In eu-west-1, create an alarm on the DDoSAttackRequestsPerSecond metric of the Application Load Balancer.", fr: "Dans eu-west-1, créer une alarme sur la métrique DDoSAttackRequestsPerSecond de l'Application Load Balancer." }
    - id: b
      text: { en: "In eu-west-1, create an alarm on the BlockedRequests metric of the web ACL that is associated with the distribution.", fr: "Dans eu-west-1, créer une alarme sur la métrique BlockedRequests de la liste ACL web associée à la distribution." }
    - id: c
      text: { en: "Turn on CloudFront standard logging and create a metric filter that counts requests from attacking IP addresses.", fr: "Activer la journalisation standard CloudFront et créer un filtre de métrique qui compte les requêtes des adresses IP d'attaque." }
    - id: d
      text: { en: "In us-east-1, create an alarm on the distribution's DDoSDetected metric in AWS/DDoSProtection.", fr: "Dans us-east-1, créer une alarme sur la métrique DDoSDetected de la distribution dans AWS/DDoSProtection." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Shield Advanced publishes its metrics in the `AWS/DDoSProtection` namespace. Metrics for CloudFront distributions, Route 53 hosted zones and protection groups are reported in us-east-1, so the alarm must be created there. AWS recommends an alarm for each protected resource that goes off when `DDoSDetected` is greater than 0.
    fr: |
      Shield Advanced publie ses métriques dans l'espace de noms `AWS/DDoSProtection`. Les métriques des distributions CloudFront, des zones hébergées Route 53 et des groupes de protection sont publiées dans us-east-1 : l'alarme doit donc y être créée. AWS recommande, pour chaque ressource protégée, une alarme qui se déclenche lorsque `DDoSDetected` est supérieure à 0.
  options:
    a:
      en: |
        An alarm on the origin does not report detection for the distribution, which is the protected resource, and the attack traffic may never reach the origin.
      fr: |
        Une alarme sur l'origine ne signale pas la détection pour la distribution, qui est la ressource protégée, et le trafic d'attaque peut ne jamais atteindre l'origine.
    b:
      en: |
        Web ACL metrics count requests that rules block for any reason; they do not indicate that Shield Advanced detected a DDoS event.
      fr: |
        Les métriques de la liste ACL web comptent les requêtes bloquées par les règles pour n'importe quelle raison ; elles n'indiquent pas que Shield Advanced a détecté un événement DDoS.
    c:
      en: |
        A custom metric filter needs a list of attacking addresses and much more work, and it does not reflect Shield Advanced detection.
      fr: |
        Un filtre de métrique personnalisé exige une liste des adresses d'attaque et beaucoup plus de travail, et il ne reflète pas la détection de Shield Advanced.
references:
  - title: AWS Shield Advanced metrics
    url: https://docs.aws.amazon.com/waf/latest/developerguide/shield-metrics.html
