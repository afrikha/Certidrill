id: soac03-5b-ip-based-routing
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A video company publishes media.example.com in a Route 53 public hosted zone. A partner internet service provider (ISP) hosts a cache cluster for the company inside its own network. The ISP's customers use the address ranges 198.51.100.0/24 and 203.0.113.0/24 and live in the same countries as the company's other users. DNS queries from these ranges must receive the address of the partner cache cluster. All other users must receive the address of the company's main endpoint.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de vidéo publie media.example.com dans une zone hébergée publique Route 53. Un fournisseur d'accès Internet (FAI) partenaire héberge un cluster de cache pour l'entreprise dans son propre réseau. Les clients du FAI utilisent les plages d'adresses 198.51.100.0/24 et 203.0.113.0/24 et vivent dans les mêmes pays que les autres utilisateurs de l'entreprise. Les requêtes DNS provenant de ces plages doivent recevoir l'adresse du cluster de cache partenaire. Tous les autres utilisateurs doivent recevoir l'adresse du point de terminaison principal de l'entreprise.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create geolocation records: one for the countries of the ISP's customers that points to the partner cache, and one for the Default location that points to the main endpoint.", fr: "Créer des enregistrements de géolocalisation : un pour les pays des clients du FAI, qui pointe vers le cache partenaire, et un pour l'emplacement Default, qui pointe vers le point de terminaison principal." }
    - id: b
      text: { en: "Create a CIDR collection with a location that contains both ranges, then IP-based records: one for that location that points to the partner cache, and one for the default (*) location that points to the main endpoint.", fr: "Créer une collection CIDR avec un emplacement qui contient les deux plages, puis des enregistrements fondés sur l'IP : un pour cet emplacement, qui pointe vers le cache partenaire, et un pour l'emplacement par défaut (*), qui pointe vers le point de terminaison principal." }
    - id: c
      text: { en: "Create geoproximity records: one with the latitude and longitude of the ISP's network that points to the partner cache, and one for the main endpoint's Region.", fr: "Créer des enregistrements de géoproximité : un avec la latitude et la longitude du réseau du FAI, qui pointe vers le cache partenaire, et un pour la Région du point de terminaison principal." }
    - id: d
      text: { en: "Create latency records: one that points to the partner cache and one that points to the main endpoint, and associate a health check with each record.", fr: "Créer des enregistrements de latence : un qui pointe vers le cache partenaire et un qui pointe vers le point de terminaison principal, et associer une vérification de l'état à chaque enregistrement." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      IP-based routing uses address ranges that the company uploads: a CIDR collection holds named locations, each a list of CIDR blocks. Queries from the ISP's ranges match that location and get the partner cache; queries that match no location use the default (*) record. This is the documented way to route users of specific ISPs to specific endpoints.
    fr: |
      Le routage fondé sur l'IP utilise des plages d'adresses que l'entreprise charge : une collection CIDR contient des emplacements nommés, chacun étant une liste de blocs CIDR. Les requêtes provenant des plages du FAI correspondent à cet emplacement et reçoivent le cache partenaire ; les requêtes qui ne correspondent à aucun emplacement utilisent l'enregistrement par défaut (*). C'est la méthode documentée pour router les utilisateurs de FAI précis vers des points de terminaison précis.
  options:
    a:
      en: |
        The ISP's customers live in the same countries as other users, so a country record would send every user in those countries to the partner cache.
      fr: |
        Les clients du FAI vivent dans les mêmes pays que les autres utilisateurs : un enregistrement par pays enverrait tous les utilisateurs de ces pays vers le cache partenaire.
    c:
      en: |
        Geoproximity chooses by distance, so every nearby user would reach the partner cache, not only the ISP's customers.
      fr: |
        La géoproximité choisit selon la distance : tous les utilisateurs proches atteindraient le cache partenaire, pas seulement les clients du FAI.
    d:
      en: |
        Latency records are tied to AWS Regions and choose by measured latency; they cannot select users by their address range.
      fr: |
        Les enregistrements de latence sont liés à des Régions AWS et choisissent selon la latence mesurée ; ils ne peuvent pas sélectionner les utilisateurs selon leur plage d'adresses.
references:
  - title: IP-based routing
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-ipbased.html
