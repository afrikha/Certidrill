id: soac03-5a-cloudfront-origin-egress
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company serves large installer files to customers worldwide directly from Amazon EC2 instances behind an Application Load Balancer. The same files are downloaded many times, and the data transfer out to the internet is now the largest item on the bill. The company wants to reduce the load on the instances and the cost of serving the files, with the LEAST change to the application.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels sert de gros fichiers d'installation à des clients du monde entier directement depuis des instances Amazon EC2 situées derrière un Application Load Balancer. Les mêmes fichiers sont téléchargés de nombreuses fois, et le transfert de données sortant vers Internet est devenu le premier poste de la facture. L'entreprise veut réduire la charge des instances et le coût de distribution des fichiers, avec le MOINS de modifications possible de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Put an Amazon CloudFront distribution in front of the load balancer.", fr: "Placer une distribution Amazon CloudFront devant l'équilibreur de charge." }
    - id: b
      text: { en: "Put an AWS Global Accelerator standard accelerator in front of the load balancer.", fr: "Placer un accélérateur standard AWS Global Accelerator devant l'équilibreur de charge." }
    - id: c
      text: { en: "Turn on S3 Transfer Acceleration and move the installer files to an S3 bucket.", fr: "Activer S3 Transfer Acceleration et déplacer les fichiers d'installation dans un compartiment S3." }
    - id: d
      text: { en: "Move all instances into one Availability Zone to remove data transfer between zones.", fr: "Regrouper toutes les instances dans une seule zone de disponibilité pour supprimer le transfert entre zones." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CloudFront caches the files at edge locations, so repeated downloads are served from the cache instead of the instances. AWS does not charge for data transfer from AWS origins, such as an Application Load Balancer, to CloudFront edge locations, so the company pays mainly for CloudFront delivery. Only the DNS name that customers use has to point to the distribution.
    fr: |
      CloudFront met les fichiers en cache dans les emplacements périphériques : les téléchargements répétés sont servis depuis le cache au lieu des instances. AWS ne facture pas le transfert de données depuis des origines AWS, comme un Application Load Balancer, vers les emplacements périphériques CloudFront : l'entreprise paie surtout la diffusion CloudFront. Seul le nom DNS utilisé par les clients doit pointer vers la distribution.
  options:
    b:
      en: |
        Global Accelerator improves the network path but does not cache content, so every download still reaches the instances, and it adds its own charges.
      fr: |
        Global Accelerator améliore le chemin réseau mais ne met pas de contenu en cache : chaque téléchargement atteint toujours les instances, et il ajoute ses propres frais.
    c:
      en: |
        Transfer Acceleration speeds up transfers to and from a bucket at an extra per-GB charge. It does not cache files and requires changing where the application serves them.
      fr: |
        Transfer Acceleration accélère les transferts vers et depuis un compartiment moyennant des frais supplémentaires par Go. Il ne met pas de fichiers en cache et exige de changer l'endroit d'où l'application les sert.
    d:
      en: |
        The main cost is data transfer to the internet, not between zones, and a single zone reduces availability.
      fr: |
        Le coût principal est le transfert vers Internet, pas entre zones, et une seule zone réduit la disponibilité.
references:
  - title: Amazon CloudFront FAQs
    url: https://aws.amazon.com/cloudfront/faqs/
