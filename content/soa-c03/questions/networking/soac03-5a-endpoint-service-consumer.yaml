id: soac03-5a-endpoint-service-consumer
objective: "5.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company publishes an internal service through an AWS PrivateLink endpoint service that uses a Network Load Balancer. Acceptance required is turned on, and the company's security policy says that the provider must approve every new consumer connection. A partner account, 444455556666, must now create an interface endpoint to the service, but the partner cannot connect to the endpoint service.

    Which combination of actions must the provider take? (Choose two.)
  fr: |
    Une entreprise publie un service interne par un service de point de terminaison AWS PrivateLink qui utilise un Network Load Balancer. L'option d'acceptation obligatoire (acceptance required) est activée, et la politique de sécurité de l'entreprise impose que le fournisseur approuve chaque nouvelle connexion de consommateur. Un compte partenaire, 444455556666, doit maintenant créer un point de terminaison d'interface vers le service, mais le partenaire ne peut pas se connecter au service de point de terminaison.

    Quelle combinaison d'actions le fournisseur doit-il effectuer ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add arn:aws:iam::444455556666:root to the allowed principals of the endpoint service.", fr: "Ajouter arn:aws:iam::444455556666:root aux principaux autorisés du service de point de terminaison." } }
    - { id: b, text: { en: "Turn off acceptance required so that the partner's connection becomes available.", fr: "Désactiver l'acceptation obligatoire pour que la connexion du partenaire devienne disponible." } }
    - { id: c, text: { en: "Accept the partner's endpoint connection request on the Endpoint connections tab.", fr: "Accepter la demande de connexion du point de terminaison du partenaire dans l'onglet Endpoint connections." } }
    - { id: d, text: { en: "Create a VPC peering connection between the provider VPC and the partner VPC.", fr: "Créer une connexion d'appairage de VPC entre le VPC du fournisseur et le VPC du partenaire." } }
    - { id: e, text: { en: "Add the CIDR block of the partner VPC to the allowed principals of the endpoint service.", fr: "Ajouter le bloc CIDR du VPC du partenaire aux principaux autorisés du service de point de terminaison." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      By default, no consumer can use an endpoint service. The provider grants access by adding principals by ARN, for example the partner account's root ARN. Because acceptance is required, the partner's endpoint then stays in the `pendingAcceptance` state until the provider accepts the connection request, which satisfies the approval policy.
    fr: |
      Par défaut, aucun consommateur ne peut utiliser un service de point de terminaison. Le fournisseur accorde l'accès en ajoutant des principaux par ARN, par exemple l'ARN racine du compte partenaire. Comme l'acceptation est obligatoire, le point de terminaison du partenaire reste ensuite à l'état `pendingAcceptance` jusqu'à ce que le fournisseur accepte la demande de connexion, ce qui respecte la politique d'approbation.
  options:
    b:
      en: |
        Turning off acceptance would accept every request from allowed principals automatically, which breaks the rule that the provider approves each connection. It also does not grant the missing permission.
      fr: |
        Désactiver l'acceptation accepterait automatiquement toutes les demandes des principaux autorisés, ce qui enfreint la règle d'approbation de chaque connexion. Cela n'accorde pas non plus l'autorisation manquante.
    d:
      en: |
        PrivateLink does not need peering. Peering would also open IP connectivity between the whole VPCs instead of a single service.
      fr: |
        PrivateLink n'a pas besoin d'appairage. L'appairage ouvrirait en outre une connectivité IP entre les VPC entiers au lieu d'un seul service.
    e:
      en: |
        Allowed principals are IAM ARNs (accounts, users or roles) or `*`. A CIDR block is not a valid principal.
      fr: |
        Les principaux autorisés sont des ARN IAM (comptes, utilisateurs ou rôles) ou `*`. Un bloc CIDR n'est pas un principal valide.
references:
  - title: Configure an endpoint service
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/configure-endpoint-service.html
  - title: AWS PrivateLink concepts
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html
