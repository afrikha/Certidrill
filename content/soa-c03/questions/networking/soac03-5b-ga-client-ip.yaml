id: soac03-5b-ga-client-ip
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a TCP application on Amazon EC2 instances in two Regions behind an AWS Global Accelerator standard accelerator. The endpoint groups contain the Elastic IP addresses that are associated with the instances. The application must record the original IP address of each client for fraud analysis, but it currently sees addresses that belong to Global Accelerator.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application TCP sur des instances Amazon EC2 dans deux Régions, derrière un accélérateur standard AWS Global Accelerator. Les groupes de points de terminaison contiennent les adresses IP Elastic associées aux instances. L'application doit enregistrer l'adresse IP d'origine de chaque client pour l'analyse des fraudes, mais elle voit actuellement des adresses qui appartiennent à Global Accelerator.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on client IP address preservation for the existing Elastic IP address endpoints.", fr: "Activer la préservation de l'adresse IP du client pour les points de terminaison d'adresse IP Elastic existants." }
    - id: b
      text: { en: "Replace the Elastic IP address endpoints with EC2 instance endpoints for the same instances.", fr: "Remplacer les points de terminaison d'adresse IP Elastic par des points de terminaison d'instance EC2 pour les mêmes instances." }
    - id: c
      text: { en: "Place a Network Load Balancer without security groups in front of the instances, and add it as the endpoint.", fr: "Placer un Network Load Balancer sans groupe de sécurité devant les instances, et l'ajouter comme point de terminaison." }
    - id: d
      text: { en: "Configure the listener to add an X-Forwarded-For header that contains the client IP address.", fr: "Configurer l'écouteur pour qu'il ajoute un en-tête X-Forwarded-For contenant l'adresse IP du client." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      EC2 instance endpoints always preserve the client IP address, so the application receives the original source address. Elastic IP address endpoints do not support client IP address preservation. Before switching, the instances' security groups must allow the client addresses, because traffic now arrives with the clients' source IPs.
    fr: |
      Les points de terminaison d'instance EC2 préservent toujours l'adresse IP du client : l'application reçoit l'adresse source d'origine. Les points de terminaison d'adresse IP Elastic ne prennent pas en charge la préservation de l'adresse IP du client. Avant la bascule, les groupes de sécurité des instances doivent autoriser les adresses des clients, car le trafic arrive désormais avec leurs adresses IP sources.
  options:
    a:
      en: |
        Client IP address preservation is not available for Elastic IP address endpoints.
      fr: |
        La préservation de l'adresse IP du client n'est pas disponible pour les points de terminaison d'adresse IP Elastic.
    c:
      en: |
        Global Accelerator does not preserve the client IP address for Network Load Balancers without security groups.
      fr: |
        Global Accelerator ne préserve pas l'adresse IP du client pour les Network Load Balancers sans groupe de sécurité.
    d:
      en: |
        Global Accelerator works at the network layer and does not add HTTP headers; the application uses raw TCP.
      fr: |
        Global Accelerator fonctionne au niveau de la couche réseau et n'ajoute pas d'en-têtes HTTP ; l'application utilise du TCP brut.
references:
  - title: Preserve client IP addresses in AWS Global Accelerator
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/preserve-client-ip-address.html
  - title: Guidelines and restrictions for client IP address preservation in Global Accelerator
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/preserve-client-ip-address.how-to-enable-preservation.html
