id: soac03-5b-alb-logs-athena
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores the access logs of its Application Load Balancers in an Amazon S3 bucket. During incidents, CloudOps engineers need to run ad hoc SQL queries on several weeks of logs, for example to count HTTP 5xx responses per target. The company does not want to provision or manage any servers or clusters.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke les journaux d'accès de ses Application Load Balancers dans un compartiment Amazon S3. Pendant les incidents, les ingénieurs CloudOps doivent exécuter des requêtes SQL ponctuelles sur plusieurs semaines de journaux, par exemple pour compter les réponses HTTP 5xx par cible. L'entreprise ne veut provisionner ni gérer aucun serveur ni cluster.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon Athena table over the S3 prefix of the access logs, and query it with SQL.", fr: "Créer une table Amazon Athena sur le préfixe S3 des journaux d'accès, et l'interroger en SQL." }
    - id: b
      text: { en: "Run Amazon CloudWatch Logs Insights queries directly against the S3 bucket.", fr: "Exécuter des requêtes Amazon CloudWatch Logs Insights directement sur le compartiment S3." }
    - id: c
      text: { en: "Load the log files into an Amazon RDS for PostgreSQL DB instance each day, and query the tables.", fr: "Charger chaque jour les fichiers journaux dans une instance de base de données Amazon RDS for PostgreSQL, et interroger les tables." }
    - id: d
      text: { en: "Configure the ALBs to send their access logs to an Amazon DynamoDB table, and query it with PartiQL.", fr: "Configurer les ALB pour qu'ils envoient leurs journaux d'accès vers une table Amazon DynamoDB, et l'interroger avec PartiQL." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Amazon Athena is serverless and queries data in place in Amazon S3 with SQL. AWS documents table definitions for ALB access logs, including a version with partition projection, so engineers can query weeks of logs without loading data or managing infrastructure.
    fr: |
      Amazon Athena est sans serveur et interroge en SQL les données directement dans Amazon S3. AWS documente des définitions de table pour les journaux d'accès d'ALB, y compris une version avec projection de partitions : les ingénieurs peuvent interroger des semaines de journaux sans charger de données ni gérer d'infrastructure.
  options:
    b:
      en: |
        CloudWatch Logs Insights queries log groups in CloudWatch Logs; ALB access logs are delivered only to S3.
      fr: |
        CloudWatch Logs Insights interroge des groupes de journaux CloudWatch Logs ; les journaux d'accès d'ALB ne sont livrés que dans S3.
    c:
      en: |
        A DB instance is a server to provision and manage, and the daily load adds a custom pipeline.
      fr: |
        Une instance de base de données est un serveur à provisionner et à gérer, et le chargement quotidien ajoute un pipeline personnalisé.
    d:
      en: |
        ALBs cannot deliver access logs to DynamoDB; their only destination is an S3 bucket.
      fr: |
        Les ALB ne peuvent pas livrer leurs journaux d'accès dans DynamoDB ; leur seule destination est un compartiment S3.
references:
  - title: Query Application Load Balancer logs
    url: https://docs.aws.amazon.com/athena/latest/ug/application-load-balancer-logs.html
