id: soac03-5a-peering-edge-nat
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    VPC A has no internet gateway and no NAT gateway. It is peered with VPC B, which has a NAT gateway in a public subnet. To give instances in VPC A outbound internet access, a CloudOps engineer added a `0.0.0.0/0` route to the peering connection in VPC A and a route back to VPC A's CIDR block in VPC B. The instances in VPC A still cannot reach the internet. The instances must get outbound-only internet access.

    Which solution will meet this requirement?
  fr: |
    Le VPC A n'a ni passerelle Internet ni passerelle NAT. Il est appairé avec le VPC B, qui possède une passerelle NAT dans un sous-réseau public. Pour donner aux instances du VPC A un accès Internet sortant, un ingénieur CloudOps a ajouté dans le VPC A une route `0.0.0.0/0` vers la connexion d'appairage, et dans le VPC B une route de retour vers le bloc CIDR du VPC A. Les instances du VPC A ne peuvent toujours pas joindre Internet. Les instances doivent obtenir un accès Internet en sortie uniquement.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Add the route back to VPC A in the route table of the NAT gateway's subnet in VPC B.", fr: "Ajouter la route de retour vers le VPC A dans la table de routage du sous-réseau de la passerelle NAT du VPC B." }
    - id: b
      text: { en: "Attach an internet gateway to VPC A and create a NAT gateway in a public subnet of VPC A.", fr: "Attacher une passerelle Internet au VPC A et créer une passerelle NAT dans un sous-réseau public du VPC A." }
    - id: c
      text: { en: "Turn on DNS resolution for the peering connection so that VPC A uses the NAT gateway's name.", fr: "Activer la résolution DNS de la connexion d'appairage pour que le VPC A utilise le nom de la passerelle NAT." }
    - id: d
      text: { en: "Add an inbound network ACL rule for VPC A's CIDR block to the public subnet of VPC B.", fr: "Ajouter une règle entrante d'ACL réseau pour le bloc CIDR du VPC A dans le sous-réseau public du VPC B." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      VPC peering does not support edge-to-edge routing: a peered VPC cannot use the other VPC's internet gateway, NAT device, VPN connection, Direct Connect connection or gateway endpoint. VPC A therefore needs its own egress path, such as an internet gateway with a public NAT gateway that the private subnets use as their default route.
    fr: |
      L'appairage de VPC ne prend pas en charge le routage de périphérie à périphérie (edge-to-edge) : un VPC appairé ne peut pas utiliser la passerelle Internet, le dispositif NAT, la connexion VPN, la connexion Direct Connect ou le point de terminaison de passerelle de l'autre VPC. Le VPC A a donc besoin de son propre chemin de sortie, par exemple une passerelle Internet et une passerelle NAT publique que les sous-réseaux privés utilisent comme route par défaut.
  options:
    a:
      en: |
        No route in VPC B can make the peering connection forward VPC A's traffic to the NAT gateway, because edge-to-edge routing is not supported.
      fr: |
        Aucune route du VPC B ne peut amener la connexion d'appairage à transférer le trafic du VPC A vers la passerelle NAT, car le routage de périphérie à périphérie n'est pas pris en charge.
    c:
      en: |
        DNS resolution only changes how public DNS hostnames resolve across the connection. It does not change the routing limits of peering.
      fr: |
        La résolution DNS ne change que la résolution des noms d'hôte DNS publics à travers la connexion. Elle ne modifie pas les limites de routage de l'appairage.
    d:
      en: |
        The traffic is not blocked by a network ACL; peering simply cannot carry it to the NAT gateway.
      fr: |
        Le trafic n'est pas bloqué par une ACL réseau : l'appairage ne peut tout simplement pas l'acheminer jusqu'à la passerelle NAT.
references:
  - title: How VPC peering connections work
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html
