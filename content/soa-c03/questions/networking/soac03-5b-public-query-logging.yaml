id: soac03-5b-public-query-logging
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs its workloads in eu-west-1 and hosts example.com in a Route 53 public hosted zone. A CloudOps engineer tries to configure query logging for the hosted zone and selects an Amazon CloudWatch Logs log group in eu-west-1, but the configuration fails. The company wants to keep using CloudWatch Logs for the query logs.

    Which combination of actions will allow the engineer to configure query logging? (Choose two.)
  fr: |
    Une entreprise exécute ses charges de travail dans eu-west-1 et héberge example.com dans une zone hébergée publique Route 53. Un ingénieur CloudOps essaie de configurer la journalisation des requêtes pour la zone hébergée et sélectionne un groupe de journaux Amazon CloudWatch Logs dans eu-west-1, mais la configuration échoue. L'entreprise veut continuer à utiliser CloudWatch Logs pour les journaux de requêtes.

    Quelle combinaison d'actions permettra à l'ingénieur de configurer la journalisation des requêtes ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the log group in us-east-1.", fr: "Créer le groupe de journaux dans us-east-1." } }
    - { id: b, text: { en: "Create an IAM role that Route 53 assumes to write to the log group.", fr: "Créer un rôle IAM que Route 53 endosse pour écrire dans le groupe de journaux." } }
    - { id: c, text: { en: "Add a CloudWatch Logs resource policy that allows Route 53 to create log streams and put log events in the log group.", fr: "Ajouter une politique de ressource CloudWatch Logs qui autorise Route 53 à créer des flux de journaux et à y écrire des événements dans le groupe de journaux." } }
    - { id: d, text: { en: "Create a Route 53 VPC Resolver query logging configuration and associate it with the hosted zone.", fr: "Créer une configuration de journalisation des requêtes Route 53 VPC Resolver et l'associer à la zone hébergée." } }
    - { id: e, text: { en: "Encrypt the eu-west-1 log group with a customer managed AWS KMS key.", fr: "Chiffrer le groupe de journaux de eu-west-1 avec une clé AWS KMS gérée par le client." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Public DNS query logging sends logs only to CloudWatch Logs, and the log group must be in US East (N. Virginia). Route 53 writes to the log group through a CloudWatch Logs resource policy, which the console can create with Grant permissions. The logs can later be exported to Amazon S3 if needed.
    fr: |
      La journalisation des requêtes DNS publiques n'envoie les journaux qu'à CloudWatch Logs, et le groupe de journaux doit se trouver dans la Région USA Est (Virginie du Nord). Route 53 écrit dans le groupe de journaux grâce à une politique de ressource CloudWatch Logs, que la console peut créer avec Grant permissions. Les journaux peuvent ensuite être exportés vers Amazon S3 si nécessaire.
  options:
    b:
      en: |
        Route 53 does not assume a role for query logging; the permission comes from a CloudWatch Logs resource policy.
      fr: |
        Route 53 n'endosse pas de rôle pour la journalisation des requêtes ; l'autorisation provient d'une politique de ressource CloudWatch Logs.
    d:
      en: |
        Resolver query logging records queries made from VPCs; it is associated with VPCs, not with public hosted zones.
      fr: |
        La journalisation des requêtes Resolver enregistre les requêtes émises depuis des VPC ; elle s'associe à des VPC, pas à des zones hébergées publiques.
    e:
      en: |
        Encryption does not change the Region requirement; a log group in eu-west-1 is still rejected.
      fr: |
        Le chiffrement ne change pas l'exigence de Région ; un groupe de journaux dans eu-west-1 est toujours refusé.
references:
  - title: Public DNS query logging
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/query-logs.html
