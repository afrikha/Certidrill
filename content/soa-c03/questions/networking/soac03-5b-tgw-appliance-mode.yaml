id: soac03-5b-tgw-appliance-mode
objective: "5.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company routes all traffic between its spoke VPCs through an inspection VPC that runs stateful firewall instances in two Availability Zones. All VPCs are attached to one transit gateway. Connections between instances in the same Availability Zone work. Many connections between instances in different Availability Zones fail, and the firewall logs show response packets for flows that the firewall never saw start.

    Which solution will resolve the issue?
  fr: |
    Une entreprise fait passer tout le trafic entre ses VPC en étoile (spokes) par un VPC d'inspection qui exécute des instances de pare-feu avec état dans deux zones de disponibilité. Tous les VPC sont attachés à une même passerelle de transit. Les connexions entre instances d'une même zone de disponibilité fonctionnent. De nombreuses connexions entre instances de zones de disponibilité différentes échouent, et les journaux du pare-feu montrent des paquets de réponse pour des flux dont le pare-feu n'a jamais vu le début.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Turn on appliance mode for the transit gateway attachment of the inspection VPC.", fr: "Activer le mode appliance pour l'attachement à la passerelle de transit du VPC d'inspection." }
    - id: b
      text: { en: "Turn on security group referencing for the transit gateway and all its VPC attachments.", fr: "Activer le référencement de groupes de sécurité pour la passerelle de transit et tous ses attachements de VPC." }
    - id: c
      text: { en: "Add firewall instances in a third Availability Zone of the inspection VPC.", fr: "Ajouter des instances de pare-feu dans une troisième zone de disponibilité du VPC d'inspection." }
    - id: d
      text: { en: "Associate each spoke VPC attachment with its own transit gateway route table.", fr: "Associer chaque attachement de VPC en étoile à sa propre table de routage de passerelle de transit." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without appliance mode, the transit gateway keeps traffic in the Availability Zone where it originated, so the request and the response of a cross-zone flow can pass through firewalls in different zones. The second firewall drops the response because it never saw the request. Appliance mode makes the transit gateway use the same zone and network interface of the inspection VPC for both directions of a flow.
    fr: |
      Sans mode appliance, la passerelle de transit garde le trafic dans la zone de disponibilité d'origine : la requête et la réponse d'un flux entre zones peuvent passer par des pare-feu de zones différentes. Le second pare-feu rejette la réponse, car il n'a jamais vu la requête. Le mode appliance fait utiliser à la passerelle de transit la même zone et la même interface réseau du VPC d'inspection pour les deux sens d'un flux.
  options:
    b:
      en: |
        Security group referencing simplifies security group rules across attachments; it does not change which zone carries a flow.
      fr: |
        Le référencement de groupes de sécurité simplifie les règles de groupes de sécurité entre attachements ; il ne change pas la zone qui transporte un flux.
    c:
      en: |
        More zones add more places where the two directions of a flow can split; the asymmetry remains.
      fr: |
        Davantage de zones ajoutent d'autres endroits où les deux sens d'un flux peuvent se séparer ; l'asymétrie demeure.
    d:
      en: |
        Separate route tables change which attachments can reach each other, not the Availability Zone used for each direction.
      fr: |
        Des tables de routage séparées changent les attachements qui peuvent se joindre, pas la zone de disponibilité utilisée dans chaque sens.
references:
  - title: How AWS Transit Gateway works
    url: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-appliance-scenario.html
