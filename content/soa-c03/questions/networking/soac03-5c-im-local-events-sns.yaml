id: soac03-5c-im-local-events-sns
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company monitors its web application with Amazon CloudWatch Internet Monitor, with both overall and local health event thresholds turned on. A regional support team must receive an email through an Amazon SNS topic for every local health event, that is, an event that affects specific client locations and ASNs. The team must not receive notifications for overall (global) health events.

    Which solution will meet these requirements?
  fr: |
    Une entreprise surveille son application web avec Amazon CloudWatch Internet Monitor, avec les seuils globaux et locaux d'événements de santé activés. Une équipe de support régionale doit recevoir un e-mail par une rubrique Amazon SNS pour chaque événement de santé local, c'est-à-dire un événement qui touche des lieux clients et des ASN précis. L'équipe ne doit pas recevoir de notifications pour les événements de santé globaux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge rule that matches source aws.internetmonitor and impactType AVAILABILITY or PERFORMANCE, targeting the SNS topic.", fr: "Créer une règle EventBridge qui correspond à la source aws.internetmonitor et à impactType AVAILABILITY ou PERFORMANCE, ciblant la rubrique SNS." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the overall availability score of the monitor that notifies the SNS topic below 95 %.", fr: "Créer une alarme CloudWatch sur le score de disponibilité global du moniteur qui notifie la rubrique SNS sous 95 %." } }
    - { id: c, text: { en: "Create an EventBridge rule that matches source aws.internetmonitor and impactType LOCAL_AVAILABILITY or LOCAL_PERFORMANCE, targeting the SNS topic.", fr: "Créer une règle EventBridge qui correspond à la source aws.internetmonitor et à impactType LOCAL_AVAILABILITY ou LOCAL_PERFORMANCE, ciblant la rubrique SNS." } }
    - { id: d, text: { en: "Create a CloudWatch Logs subscription filter on the Internet Monitor log group with the SNS topic as the destination.", fr: "Créer un filtre d'abonnement CloudWatch Logs sur le groupe de journaux d'Internet Monitor avec la rubrique SNS comme destination." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Internet Monitor publishes both overall and local health events to EventBridge with the source aws.internetmonitor. Local events have the impact type LOCAL_AVAILABILITY or LOCAL_PERFORMANCE, so a rule that matches only these values sends only local events to the SNS topic."
    fr: "Internet Monitor publie les événements de santé globaux et locaux dans EventBridge avec la source aws.internetmonitor. Les événements locaux ont le type d'impact LOCAL_AVAILABILITY ou LOCAL_PERFORMANCE : une règle qui ne correspond qu'à ces valeurs n'envoie à la rubrique SNS que les événements locaux."
  options:
    a:
      en: "AVAILABILITY and PERFORMANCE are the impact types of overall (global) health events, which the team must not receive."
      fr: "AVAILABILITY et PERFORMANCE sont les types d'impact des événements de santé globaux, que l'équipe ne doit pas recevoir."
    b:
      en: "The overall score reflects the whole application, so this alarm follows global conditions rather than each local health event."
      fr: "Le score global reflète l'ensemble de l'application : cette alarme suit les conditions globales plutôt que chaque événement de santé local."
    d:
      en: "Subscription filters send log events to Kinesis Data Streams, Data Firehose, Lambda or OpenSearch Service, not to an SNS topic, and they do not separate local from global health events."
      fr: "Les filtres d'abonnement envoient les événements de journaux vers Kinesis Data Streams, Data Firehose, Lambda ou OpenSearch Service, pas vers une rubrique SNS, et ils ne séparent pas les événements de santé locaux des globaux."
references:
  - title: Using Internet Monitor with Amazon EventBridge
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-IM-EventBridge-integration.html
