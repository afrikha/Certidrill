id: soac03-5c-cf-compression-skipped
objective: "5.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany turned on automatic compression for an Amazon CloudFront cache behavior yesterday. The cache policy of the behavior enables both Gzip and Brotli. Viewers send `Accept-Encoding: gzip, br` over HTTP/2. JavaScript files that were first uploaded to the custom origin today are still served uncompressed. The files are about 300 KB, and the origin returns them with HTTP status 200 and `Content-Type: application/javascript`.

    Which two issues could cause this behavior? (Choose two.)
  fr: |
    AnyCompany a activé hier la compression automatique pour un comportement de cache Amazon CloudFront. La politique de cache du comportement active à la fois Gzip et Brotli. Les utilisateurs envoient `Accept-Encoding: gzip, br` en HTTP/2. Des fichiers JavaScript chargés pour la première fois aujourd'hui sur l'origine personnalisée sont toujours servis sans compression. Les fichiers font environ 300 Ko, et l'origine les renvoie avec le code d'état HTTP 200 et `Content-Type: application/javascript`.

    Quels sont les deux problèmes qui peuvent expliquer ce comportement ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The origin returns the files with a Content-Encoding: identity header.", fr: "L'origine renvoie les fichiers avec un en-tête Content-Encoding: identity." } }
    - { id: b, text: { en: "The files are larger than the maximum object size that CloudFront compresses.", fr: "Les fichiers dépassent la taille d'objet maximale que CloudFront compresse." } }
    - { id: c, text: { en: "The origin sends the files with chunked transfer encoding and no Content-Length header.", fr: "L'origine envoie les fichiers en transfert par blocs (chunked), sans en-tête Content-Length." } }
    - { id: d, text: { en: "No origin request policy forwards the Accept-Encoding header to the origin.", fr: "Aucune politique de demande d'origine ne transmet l'en-tête Accept-Encoding à l'origine." } }
    - { id: e, text: { en: "Brotli compression works only with the legacy cache settings, not with a cache policy.", fr: "La compression Brotli ne fonctionne qu'avec les anciens paramètres de cache, pas avec une politique de cache." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "CloudFront does not compress a response that already has a Content-Encoding header, whatever its value. It also needs a valid Content-Length header to check that the object is between 1,000 and 10,000,000 bytes; without it, CloudFront serves the object uncompressed. The files were first cached after compression was turned on, so stale cache entries do not explain the problem."
    fr: "CloudFront ne compresse pas une réponse qui comporte déjà un en-tête Content-Encoding, quelle que soit sa valeur. Il a aussi besoin d'un en-tête Content-Length valide pour vérifier que l'objet fait entre 1 000 et 10 000 000 octets ; sans cet en-tête, CloudFront sert l'objet sans compression. Les fichiers ont été mis en cache après l'activation de la compression : des entrées de cache anciennes n'expliquent donc pas le problème."
  options:
    b:
      en: "CloudFront compresses objects up to 10,000,000 bytes, so 300 KB files are within the range."
      fr: "CloudFront compresse les objets jusqu'à 10 000 000 octets : des fichiers de 300 Ko sont dans la plage."
    d:
      en: "With Gzip and Brotli enabled in the cache policy, CloudFront normalizes Accept-Encoding into the cache key and compresses at the edge itself; no origin request policy is needed."
      fr: "Lorsque Gzip et Brotli sont activés dans la politique de cache, CloudFront normalise Accept-Encoding dans la clé de cache et compresse lui-même en périphérie ; aucune politique de demande d'origine n'est nécessaire."
    e:
      en: "It is the reverse: Brotli compression requires a cache policy and is not supported with the legacy cache settings."
      fr: "C'est l'inverse : la compression Brotli exige une politique de cache et n'est pas prise en charge avec les anciens paramètres de cache."
references:
  - title: Serve compressed files
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/ServingCompressedFiles.html
