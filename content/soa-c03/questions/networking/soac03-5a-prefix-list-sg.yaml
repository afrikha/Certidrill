id: soac03-5a-prefix-list-sg
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company allows HTTPS from 40 partner CIDR blocks to 25 security groups in one AWS account and Region. The partner list changes every month, and engineers update each security group by hand, which has caused missed updates. The company wants every security group to use the current list with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise autorise le HTTPS depuis 40 blocs CIDR de partenaires vers 25 groupes de sécurité dans un même compte AWS et une même Région. La liste des partenaires change chaque mois, et les ingénieurs mettent à jour chaque groupe de sécurité à la main, ce qui a provoqué des oublis. L'entreprise veut que chaque groupe de sécurité utilise la liste à jour avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a customer-managed prefix list with the partner CIDR blocks and reference it in one rule of each security group.", fr: "Créer une liste de préfixes gérée par le client avec les blocs CIDR des partenaires et la référencer dans une règle de chaque groupe de sécurité." }
    - id: b
      text: { en: "Reference an AWS-managed prefix list in each security group and add the partner CIDR blocks to that prefix list.", fr: "Référencer une liste de préfixes gérée par AWS dans chaque groupe de sécurité et y ajouter les blocs CIDR des partenaires." }
    - id: c
      text: { en: "Move the partner CIDR blocks into network ACL rules on every subnet and allow all HTTPS traffic in the security groups.", fr: "Déplacer les blocs CIDR des partenaires dans des règles d'ACL réseau sur chaque sous-réseau et autoriser tout le HTTPS dans les groupes de sécurité." }
    - id: d
      text: { en: "Schedule an AWS Lambda function that reads the partner list each month and rewrites the rules of all security groups.", fr: "Planifier une fonction AWS Lambda qui lit la liste des partenaires chaque mois et réécrit les règles de tous les groupes de sécurité." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A customer-managed prefix list groups CIDR blocks that you maintain, and a security group rule can reference it as one unit. When an entry changes, the prefix list gets a new version and every referencing security group uses it automatically. Keep in mind that the prefix list's maximum number of entries counts against the security group rule quota.
    fr: |
      Une liste de préfixes gérée par le client regroupe des blocs CIDR que vous maintenez, et une règle de groupe de sécurité peut la référencer comme une seule unité. Quand une entrée change, la liste de préfixes reçoit une nouvelle version et chaque groupe de sécurité qui la référence l'utilise automatiquement. Le nombre maximal d'entrées de la liste compte dans le quota de règles du groupe de sécurité.
  options:
    b:
      en: |
        AWS-managed prefix lists contain the address ranges of AWS services, and customers cannot add their own entries to them.
      fr: |
        Les listes de préfixes gérées par AWS contiennent les plages d'adresses de services AWS, et les clients ne peuvent pas y ajouter leurs propres entrées.
    c:
      en: |
        Network ACLs cannot reference prefix lists, so the 40 entries would still be edited by hand on every network ACL, and the security groups would become too permissive.
      fr: |
        Les ACL réseau ne peuvent pas référencer de listes de préfixes : les 40 entrées devraient toujours être modifiées à la main dans chaque ACL réseau, et les groupes de sécurité deviendraient trop permissifs.
    d:
      en: |
        Custom code works but adds a function, a schedule and error handling to maintain, which is more overhead than a native prefix list.
      fr: |
        Du code personnalisé fonctionne mais ajoute une fonction, une planification et une gestion des erreurs à maintenir, ce qui représente plus de charge qu'une liste de préfixes native.
references:
  - title: Consolidate and manage network CIDR blocks with managed prefix lists
    url: https://docs.aws.amazon.com/vpc/latest/userguide/managed-prefix-lists.html
