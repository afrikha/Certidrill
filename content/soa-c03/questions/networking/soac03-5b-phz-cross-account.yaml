id: soac03-5b-phz-cross-account
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses two AWS accounts. Account A (111111111111) owns a Route 53 private hosted zone for corp.internal. Account B (222222222222) owns a VPC named vpc-0b22 in us-east-1. Amazon EC2 instances in vpc-0b22 must resolve the records of corp.internal. The administrators use the AWS CLI.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise deux comptes AWS. Le compte A (111111111111) possède une zone hébergée privée Route 53 pour corp.internal. Le compte B (222222222222) possède un VPC nommé vpc-0b22 dans us-east-1. Les instances Amazon EC2 de vpc-0b22 doivent résoudre les enregistrements de corp.internal. Les administrateurs utilisent l'AWS CLI.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "In account A, run create-vpc-association-authorization for vpc-0b22. Then, in account B, run associate-vpc-with-hosted-zone.", fr: "Dans le compte A, exécuter create-vpc-association-authorization pour vpc-0b22. Ensuite, dans le compte B, exécuter associate-vpc-with-hosted-zone." }
    - id: b
      text: { en: "In account B, run create-vpc-association-authorization for vpc-0b22. Then, in account A, run associate-vpc-with-hosted-zone.", fr: "Dans le compte B, exécuter create-vpc-association-authorization pour vpc-0b22. Ensuite, dans le compte A, exécuter associate-vpc-with-hosted-zone." }
    - id: c
      text: { en: "In account A, run associate-vpc-with-hosted-zone for vpc-0b22. No action is required in account B.", fr: "Dans le compte A, exécuter associate-vpc-with-hosted-zone pour vpc-0b22. Aucune action n'est nécessaire dans le compte B." }
    - id: d
      text: { en: "In account A, share the private hosted zone with account B by using AWS RAM. Then, in account B, accept the resource share.", fr: "Dans le compte A, partager la zone hébergée privée avec le compte B à l'aide d'AWS RAM. Ensuite, dans le compte B, accepter le partage de ressources." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For a VPC and a private hosted zone in different accounts, the account that owns the hosted zone first authorizes the association of that VPC. The account that owns the VPC then creates the association. AWS recommends deleting the authorization afterward; the existing association is not affected.
    fr: |
      Lorsque le VPC et la zone hébergée privée sont dans des comptes différents, le compte propriétaire de la zone hébergée autorise d'abord l'association de ce VPC. Le compte propriétaire du VPC crée ensuite l'association. AWS recommande de supprimer ensuite l'autorisation ; l'association existante n'est pas affectée.
  options:
    b:
      en: |
        The roles are reversed: only the hosted zone owner can authorize an association, and the VPC owner performs it.
      fr: |
        Les rôles sont inversés : seul le propriétaire de la zone hébergée peut autoriser une association, et c'est le propriétaire du VPC qui la réalise.
    c:
      en: |
        Account A cannot associate a VPC that it does not own without an authorization and an association request from the VPC owner.
      fr: |
        Le compte A ne peut pas associer un VPC qui ne lui appartient pas sans une autorisation et une demande d'association venant du propriétaire du VPC.
    d:
      en: |
        A private hosted zone is not shared through an AWS RAM resource share; cross-account association uses the authorization process.
      fr: |
        Une zone hébergée privée ne se partage pas par un partage de ressources AWS RAM ; l'association entre comptes passe par le processus d'autorisation.
references:
  - title: Associating an Amazon VPC and a private hosted zone that you created with different AWS accounts
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-associate-vpcs-different-accounts.html
