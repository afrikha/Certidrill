id: soac03-5b-cf-alb-origin-lockdown
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses an internet-facing Application Load Balancer (ALB) as the origin of an Amazon CloudFront distribution. Users bypass CloudFront by sending requests to the ALB's DNS name. The ALB must accept network connections only from CloudFront, and it must serve only the requests that come through the company's own distribution.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise un Application Load Balancer (ALB) accessible depuis Internet comme origine d'une distribution Amazon CloudFront. Des utilisateurs contournent CloudFront en envoyant des requêtes au nom DNS de l'ALB. L'ALB ne doit accepter de connexions réseau que depuis CloudFront, et il ne doit servir que les requêtes qui passent par la distribution de l'entreprise.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Allow inbound HTTPS in the ALB's security group only from the com.amazonaws.global.cloudfront.origin-facing managed prefix list.", fr: "N'autoriser le HTTPS entrant dans le groupe de sécurité de l'ALB que depuis la liste de préfixes gérée com.amazonaws.global.cloudfront.origin-facing." } }
    - { id: b, text: { en: "Configure origin access control (OAC) for the ALB origin, and set signing to Always.", fr: "Configurer un contrôle d'accès d'origine (OAC) pour l'origine ALB, et définir la signature sur Always." } }
    - { id: c, text: { en: "Add a secret custom origin header in the distribution, and add ALB listener rules that forward only requests with that header and return 403 for all others.", fr: "Ajouter un en-tête d'origine personnalisé secret dans la distribution, et ajouter des règles d'écouteur ALB qui ne transfèrent que les requêtes portant cet en-tête et renvoient 403 pour toutes les autres." } }
    - { id: d, text: { en: "Turn on geographic restrictions in the distribution with an allow list of the countries of the company's users.", fr: "Activer les restrictions géographiques dans la distribution avec une liste d'autorisation des pays des utilisateurs de l'entreprise." } }
    - { id: e, text: { en: "Add network ACL rules to the ALB subnets for the CloudFront address ranges copied from ip-ranges.json.", fr: "Ajouter aux sous-réseaux de l'ALB des règles d'ACL réseau pour les plages d'adresses CloudFront copiées depuis ip-ranges.json." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The AWS-managed prefix list for CloudFront origin-facing servers limits network access to CloudFront and is updated by AWS. Because any distribution uses the same addresses, the ALB must also check a secret custom header that only the company's distribution adds, forwarding matching requests and returning a fixed 403 response to the rest.
    fr: |
      La liste de préfixes gérée par AWS pour les serveurs CloudFront orientés vers l'origine limite l'accès réseau à CloudFront et est mise à jour par AWS. Comme toutes les distributions utilisent les mêmes adresses, l'ALB doit aussi vérifier un en-tête personnalisé secret que seule la distribution de l'entreprise ajoute, en transférant les requêtes correspondantes et en renvoyant une réponse fixe 403 aux autres.
  options:
    b:
      en: |
        OAC is not used to restrict an ALB origin; the documented method for an ALB is the custom header with listener rules.
      fr: |
        L'OAC ne sert pas à restreindre une origine ALB ; la méthode documentée pour un ALB est l'en-tête personnalisé avec des règles d'écouteur.
    d:
      en: |
        Geographic restrictions apply to viewers that come through CloudFront; they do nothing for requests sent directly to the ALB.
      fr: |
        Les restrictions géographiques s'appliquent aux utilisateurs qui passent par CloudFront ; elles sont sans effet sur les requêtes envoyées directement à l'ALB.
    e:
      en: |
        Copied ranges must be maintained by hand as CloudFront adds addresses, and they do not distinguish the company's distribution from others.
      fr: |
        Les plages copiées doivent être maintenues à la main quand CloudFront ajoute des adresses, et elles ne distinguent pas la distribution de l'entreprise des autres.
references:
  - title: Restrict access to Application Load Balancers
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/restrict-access-to-load-balancer.html
  - title: Restrict access with VPC origins
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html
