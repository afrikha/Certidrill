id: soac03-5c-im-isp-select
objective: "5.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company streams videos through an Amazon CloudFront distribution. Viewers who use one internet service provider in one city report buffering, while other viewers are not affected. The company wants to know whether a problem is caused by a specific internet service provider or by the AWS network, and wants alerts for similar issues in the future. The company does not want to change the application or the video players.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias diffuse des vidéos via une distribution Amazon CloudFront. Les spectateurs qui utilisent un fournisseur d'accès à Internet dans une ville signalent des mises en mémoire tampon, alors que les autres spectateurs ne sont pas touchés. L'entreprise veut savoir si un problème est causé par un fournisseur d'accès précis ou par le réseau AWS, et veut des alertes pour les problèmes similaires à l'avenir. L'entreprise ne veut modifier ni l'application ni les lecteurs vidéo.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create CloudWatch Synthetics canaries in several AWS Regions that load a video from the distribution.", fr: "Créer dans plusieurs Régions AWS des canaris CloudWatch Synthetics qui chargent une vidéo depuis la distribution." } }
    - { id: b, text: { en: "Create a Network Synthetic Monitor monitor with probes from a VPC subnet to the distribution.", fr: "Créer un moniteur Network Synthetic Monitor avec des sondes allant d'un sous-réseau du VPC vers la distribution." } }
    - { id: c, text: { en: "Create an Internet Monitor monitor that includes the CloudFront distribution and use its health events.", fr: "Créer un moniteur Internet Monitor qui inclut la distribution CloudFront et utiliser ses événements de santé." } }
    - { id: d, text: { en: "Install Network Flow Monitor agents on the origin servers and review the flows in Workload insights.", fr: "Installer des agents Network Flow Monitor sur les serveurs d'origine et consulter les flux dans Workload insights." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Internet Monitor uses connectivity data from the AWS global network to compute performance and availability for each city-network, that is a client location and its ASN, typically an internet service provider. When an issue is caused by a specific ASN or by the AWS network, it says so in a health event, and it needs no code in the application or the clients."
    fr: "Internet Monitor utilise les données de connectivité du réseau mondial d'AWS pour calculer les performances et la disponibilité de chaque city-network, c'est-à-dire un lieu client et son ASN, généralement un fournisseur d'accès à Internet. Lorsqu'un problème est causé par un ASN précis ou par le réseau AWS, il l'indique dans un événement de santé, sans code dans l'application ni chez les clients."
  options:
    a:
      en: "Canaries run from AWS Regions, not from the viewers' internet service providers, so they cannot show the issue that these viewers see."
      fr: "Les canaris s'exécutent depuis des Régions AWS, pas depuis les fournisseurs d'accès des spectateurs : ils ne peuvent pas révéler le problème que voient ces spectateurs."
    b:
      en: "Network Synthetic Monitor probes hybrid paths from AWS to on-premises IP addresses; it does not measure the internet paths of viewers."
      fr: "Network Synthetic Monitor sonde les chemins hybrides d'AWS vers des adresses IP sur site ; il ne mesure pas les chemins Internet des spectateurs."
    d:
      en: "Network Flow Monitor measures TCP flows inside AWS from instances that run its agent, not the internet paths between viewers and CloudFront."
      fr: "Network Flow Monitor mesure les flux TCP dans AWS depuis les instances qui exécutent son agent, pas les chemins Internet entre les spectateurs et CloudFront."
references:
  - title: How Internet Monitor works
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-IM-inside-internet-monitor.html
  - title: Components and terms for Internet Monitor
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-IM-components.html
