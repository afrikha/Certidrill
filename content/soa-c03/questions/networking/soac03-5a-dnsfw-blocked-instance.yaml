id: soac03-5a-dnsfw-blocked-instance
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Route 53 Resolver DNS Firewall blocks queries for a list of malicious domains in a VPC. The instances use the Amazon-provided DNS server. For an incident review, a CloudOps engineer must identify which Amazon EC2 instances sent queries that DNS Firewall blocked.

    Which solution will provide this information?
  fr: |
    Route 53 Resolver DNS Firewall bloque les requêtes pour une liste de domaines malveillants dans un VPC. Les instances utilisent le serveur DNS fourni par Amazon. Pour l'analyse d'un incident, un ingénieur CloudOps doit identifier les instances Amazon EC2 qui ont envoyé des requêtes bloquées par DNS Firewall.

    Quelle solution fournit cette information ?
body:
  options:
    - id: a
      text: { en: "Create VPC flow logs for the VPC and filter the records for UDP and TCP port 53.", fr: "Créer des journaux de flux VPC pour le VPC et filtrer les enregistrements sur les ports UDP et TCP 53." }
    - id: b
      text: { en: "Turn on query logging for the public hosted zones that contain the blocked domains.", fr: "Activer la journalisation des requêtes des zones hébergées publiques qui contiennent les domaines bloqués." }
    - id: c
      text: { en: "Search AWS CloudTrail event history for the DNS Firewall API calls of the last day.", fr: "Rechercher dans l'historique des événements AWS CloudTrail les appels d'API DNS Firewall de la dernière journée." }
    - id: d
      text: { en: "Turn on Resolver query logging for the VPC and filter on firewall_rule_action.", fr: "Activer la journalisation des requêtes Resolver pour le VPC et filtrer sur firewall_rule_action." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Resolver query logging records the queries that the VPC Resolver handles, including those affected by DNS Firewall rules. When a query matches a rule with the alert or block action, the record contains `firewall_rule_action`, `firewall_rule_group_id` and `firewall_domain_list_id`, and the `srcids` field contains the ID of the instance that sent the query.
    fr: |
      La journalisation des requêtes Resolver enregistre les requêtes traitées par le Resolver du VPC, y compris celles concernées par des règles DNS Firewall. Lorsqu'une requête correspond à une règle avec l'action alert ou block, l'enregistrement contient `firewall_rule_action`, `firewall_rule_group_id` et `firewall_domain_list_id`, et le champ `srcids` contient l'ID de l'instance qui a envoyé la requête.
  options:
    a:
      en: |
        Flow logs do not capture the traffic that instances send to the Amazon DNS server, and they would not show the query name or the firewall action.
      fr: |
        Les journaux de flux ne capturent pas le trafic que les instances envoient au serveur DNS Amazon, et ils n'indiqueraient ni le nom interrogé ni l'action du pare-feu.
    b:
      en: |
        Public hosted zone query logs record queries that reach Route 53 authoritative servers. Blocked queries never leave the VPC Resolver, and the company may not own those domains.
      fr: |
        Les journaux de requêtes des zones hébergées publiques enregistrent les requêtes qui atteignent les serveurs faisant autorité de Route 53. Les requêtes bloquées ne quittent jamais le Resolver du VPC, et l'entreprise ne possède sans doute pas ces domaines.
    c:
      en: |
        CloudTrail records API calls that change or read DNS Firewall configuration. It does not record individual DNS queries.
      fr: |
        CloudTrail enregistre les appels d'API qui modifient ou lisent la configuration DNS Firewall. Il n'enregistre pas les requêtes DNS individuelles.
references:
  - title: Resolver query logging
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs.html
  - title: Values that appear in VPC Resolver query logs
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-query-logs-format.html
