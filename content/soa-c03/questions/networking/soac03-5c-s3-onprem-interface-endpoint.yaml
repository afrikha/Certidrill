id: soac03-5c-s3-onprem-interface-endpoint
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company connects its data center to a VPC in us-east-1 with an AWS Site-to-Site VPN connection. The VPC has a gateway VPC endpoint for Amazon S3 that is associated with the route tables of the private subnets. On-premises servers must upload files to S3 buckets in us-east-1 over the VPN connection without using the internet. The network team added routes on the customer gateway device that send the S3 address ranges to the VPN, but the uploads from the data center time out.

    Which solution will meet these requirements?
  fr: |
    Une entreprise relie son centre de données à un VPC de us-east-1 avec une connexion AWS Site-to-Site VPN. Le VPC possède un point de terminaison de VPC de type passerelle pour Amazon S3, associé aux tables de routage des sous-réseaux privés. Les serveurs sur site doivent charger des fichiers dans des compartiments S3 de us-east-1 par la connexion VPN, sans utiliser Internet. L'équipe réseau a ajouté sur le périphérique de passerelle client des routes qui envoient les plages d'adresses S3 vers le VPN, mais les chargements depuis le centre de données expirent.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an interface VPC endpoint for Amazon S3 and configure the servers to use its endpoint-specific DNS names.", fr: "Créer un point de terminaison de VPC d'interface pour Amazon S3 et configurer les serveurs pour qu'ils utilisent ses noms DNS propres au point de terminaison." } }
    - { id: b, text: { en: "Add the CIDR block of the data center to the policy of the gateway VPC endpoint for Amazon S3.", fr: "Ajouter le bloc d'adresses CIDR du centre de données à la politique du point de terminaison de VPC de type passerelle pour Amazon S3." } }
    - { id: c, text: { en: "Enable route propagation from the virtual private gateway on the route tables of the private subnets.", fr: "Activer la propagation des routes depuis la passerelle privée virtuelle sur les tables de routage des sous-réseaux privés." } }
    - { id: d, text: { en: "Enable DNS hostnames and DNS resolution for the VPC so that the gateway endpoint resolves for the servers.", fr: "Activer les noms d'hôte DNS et la résolution DNS pour le VPC afin que le point de terminaison de passerelle soit résolu pour les serveurs." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A gateway endpoint cannot be extended out of the VPC: resources on the other side of a VPN, Direct Connect, peering or transit gateway connection cannot use it. An interface endpoint for S3 has private IP addresses in the VPC that on-premises servers can reach over the VPN, by using the endpoint-specific DNS names."
    fr: "Un point de terminaison de passerelle ne peut pas être étendu hors du VPC : les ressources situées de l'autre côté d'une connexion VPN, Direct Connect, d'appairage ou de passerelle de transit ne peuvent pas l'utiliser. Un point de terminaison d'interface pour S3 possède des adresses IP privées dans le VPC que les serveurs sur site peuvent joindre par le VPN, en utilisant les noms DNS propres au point de terminaison."
  options:
    b:
      en: "An endpoint policy controls which requests are allowed through the endpoint, but traffic from the VPN can never use a gateway endpoint."
      fr: "Une politique de point de terminaison contrôle les demandes autorisées via le point de terminaison, mais le trafic venant du VPN ne peut jamais utiliser un point de terminaison de passerelle."
    c:
      en: "Route propagation adds on-premises routes to VPC route tables; it does not let on-premises traffic use the gateway endpoint."
      fr: "La propagation des routes ajoute des routes sur site aux tables de routage du VPC ; elle ne permet pas au trafic sur site d'utiliser le point de terminaison de passerelle."
    d:
      en: "These DNS settings affect only resources inside the VPC; traffic that comes from the data center still cannot use a gateway endpoint."
      fr: "Ces paramètres DNS ne concernent que les ressources du VPC ; le trafic qui vient du centre de données ne peut toujours pas utiliser un point de terminaison de passerelle."
references:
  - title: Gateway endpoints for Amazon S3
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html
  - title: Access an AWS service using an interface VPC endpoint
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html
