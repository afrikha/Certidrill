id: soac03-5a-cfn-route-dependson
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CloudOps engineer deploys the following AWS CloudFormation template. Stack creation sometimes fails on the `DefaultPublicRoute` resource with an error that says the internet gateway is not attached to the VPC. When the stack is created again, it usually succeeds.

    ```yaml
    Resources:
      VPC:
        Type: AWS::EC2::VPC
        Properties:
          CidrBlock: 10.30.0.0/16
      InternetGateway:
        Type: AWS::EC2::InternetGateway
      GatewayAttachment:
        Type: AWS::EC2::VPCGatewayAttachment
        Properties:
          VpcId: !Ref VPC
          InternetGatewayId: !Ref InternetGateway
      PublicRouteTable:
        Type: AWS::EC2::RouteTable
        Properties:
          VpcId: !Ref VPC
      DefaultPublicRoute:
        Type: AWS::EC2::Route
        Properties:
          RouteTableId: !Ref PublicRouteTable
          DestinationCidrBlock: 0.0.0.0/0
          GatewayId: !Ref InternetGateway
    ```

    Which change will make stack creation succeed every time?
  fr: |
    Un ingénieur CloudOps déploie le modèle AWS CloudFormation suivant. La création de la pile échoue parfois sur la ressource `DefaultPublicRoute` avec une erreur indiquant que la passerelle Internet n'est pas attachée au VPC. Lorsque la pile est recréée, la création réussit généralement.

    ```yaml
    Resources:
      VPC:
        Type: AWS::EC2::VPC
        Properties:
          CidrBlock: 10.30.0.0/16
      InternetGateway:
        Type: AWS::EC2::InternetGateway
      GatewayAttachment:
        Type: AWS::EC2::VPCGatewayAttachment
        Properties:
          VpcId: !Ref VPC
          InternetGatewayId: !Ref InternetGateway
      PublicRouteTable:
        Type: AWS::EC2::RouteTable
        Properties:
          VpcId: !Ref VPC
      DefaultPublicRoute:
        Type: AWS::EC2::Route
        Properties:
          RouteTableId: !Ref PublicRouteTable
          DestinationCidrBlock: 0.0.0.0/0
          GatewayId: !Ref InternetGateway
    ```

    Quelle modification permet à la création de la pile de réussir à chaque fois ?
body:
  options:
    - id: a
      text: { en: "Add DependsOn: InternetGateway to the DefaultPublicRoute resource.", fr: "Ajouter DependsOn: InternetGateway à la ressource DefaultPublicRoute." }
    - id: b
      text: { en: "Set GatewayId of DefaultPublicRoute to !Ref GatewayAttachment.", fr: "Définir GatewayId de DefaultPublicRoute sur !Ref GatewayAttachment." }
    - id: c
      text: { en: "Add a CreationPolicy attribute to the InternetGateway resource.", fr: "Ajouter un attribut CreationPolicy à la ressource InternetGateway." }
    - id: d
      text: { en: "Add DependsOn: GatewayAttachment to the DefaultPublicRoute resource.", fr: "Ajouter DependsOn: GatewayAttachment à la ressource DefaultPublicRoute." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The route references only the internet gateway, so CloudFormation can create it in parallel with the gateway attachment. A route that targets an internet gateway depends on the VPC-gateway attachment when both are declared in the same template, and `DependsOn` makes CloudFormation create the route only after the attachment is complete.
    fr: |
      La route ne référence que la passerelle Internet : CloudFormation peut donc la créer en parallèle de l'attachement de la passerelle. Une route qui cible une passerelle Internet dépend de l'attachement VPC-passerelle lorsque les deux sont déclarés dans le même modèle, et `DependsOn` oblige CloudFormation à créer la route seulement après la fin de l'attachement.
  options:
    a:
      en: |
        The `!Ref InternetGateway` already creates this dependency. The gateway exists before the route, but it can still be unattached.
      fr: |
        `!Ref InternetGateway` crée déjà cette dépendance. La passerelle existe avant la route, mais elle peut encore ne pas être attachée.
    b:
      en: |
        The reference to the attachment resource does not return an internet gateway ID, so the route would have an invalid target.
      fr: |
        La référence à la ressource d'attachement ne renvoie pas un ID de passerelle Internet : la route aurait une cible non valide.
    c:
      en: |
        A CreationPolicy waits for success signals, typically from instances or Auto Scaling groups. It does not order the route after the gateway attachment.
      fr: |
        Un attribut CreationPolicy attend des signaux de réussite, généralement envoyés par des instances ou des groupes Auto Scaling. Il n'ordonne pas la route après l'attachement de la passerelle.
references:
  - title: DependsOn attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-dependson.html
