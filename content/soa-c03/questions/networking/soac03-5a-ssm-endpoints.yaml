id: soac03-5a-ssm-endpoints
objective: "5.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs Amazon EC2 instances in private subnets of a VPC in the eu-west-1 Region. The VPC has no internet gateway and no NAT gateway, and DNS resolution and DNS hostnames are turned on. The instances run an SSM Agent version that is earlier than 3.3.40.0, and their instance profile includes the AmazonSSMManagedInstanceCore policy. Administrators must connect to the instances with AWS Systems Manager Session Manager. Session data is not encrypted with AWS KMS, and session logging is turned off.

    Which interface VPC endpoints must the company create? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute des instances Amazon EC2 dans les sous-réseaux privés d'un VPC de la Région eu-west-1. Le VPC n'a ni passerelle Internet ni passerelle NAT, et la résolution DNS et les noms d'hôte DNS sont activés. Les instances exécutent une version de SSM Agent antérieure à 3.3.40.0, et leur profil d'instance inclut la politique AmazonSSMManagedInstanceCore. Les administrateurs doivent se connecter aux instances avec AWS Systems Manager Session Manager. Les données de session ne sont pas chiffrées avec AWS KMS, et la journalisation des sessions est désactivée.

    Quels points de terminaison de VPC d'interface l'entreprise doit-elle créer ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: "com.amazonaws.eu-west-1.ec2" }
    - { id: b, text: "com.amazonaws.eu-west-1.ssm" }
    - { id: c, text: "com.amazonaws.eu-west-1.kms" }
    - { id: d, text: "com.amazonaws.eu-west-1.ssmmessages" }
    - { id: e, text: "com.amazonaws.eu-west-1.ec2messages" }
    - { id: f, text: "com.amazonaws.eu-west-1.logs" }
answer: { optionIds: [ b, d, e ] }
explanation:
  correct:
    en: |
      Managed nodes without internet access need interface endpoints for `ssm` (the Systems Manager service), `ssmmessages` (Session Manager and the agent's message channel) and `ec2messages` (used by SSM Agent to call Systems Manager). Agents from version 3.3.40.0 prefer `ssmmessages` over `ec2messages` when it is available, but this older agent still needs `ec2messages`. The endpoints' security group must allow HTTPS (443) from the instances.
    fr: |
      Des nœuds gérés sans accès Internet ont besoin de points de terminaison d'interface pour `ssm` (le service Systems Manager), `ssmmessages` (Session Manager et le canal de messages de l'agent) et `ec2messages` (utilisé par SSM Agent pour appeler Systems Manager). Les agents à partir de la version 3.3.40.0 préfèrent `ssmmessages` à `ec2messages` lorsqu'il est disponible, mais cet agent plus ancien a toujours besoin de `ec2messages`. Le groupe de sécurité des points de terminaison doit autoriser le HTTPS (443) depuis les instances.
  options:
    a:
      en: |
        The `ec2` endpoint is needed only for specific tasks such as creating VSS-enabled snapshots, not for Session Manager connections.
      fr: |
        Le point de terminaison `ec2` n'est nécessaire que pour des tâches précises comme la création d'instantanés compatibles VSS, pas pour les connexions Session Manager.
    c:
      en: |
        The `kms` endpoint is optional and needed only when session data or parameters are encrypted with AWS KMS.
      fr: |
        Le point de terminaison `kms` est facultatif et n'est nécessaire que si les données de session ou des paramètres sont chiffrés avec AWS KMS.
    f:
      en: |
        The `logs` endpoint is needed only to send session or agent logs to Amazon CloudWatch Logs, and session logging is turned off.
      fr: |
        Le point de terminaison `logs` n'est nécessaire que pour envoyer des journaux de session ou de l'agent vers Amazon CloudWatch Logs, et la journalisation des sessions est désactivée.
references:
  - title: Improve the security of EC2 instances by using VPC endpoints for Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/setup-create-vpc.html
