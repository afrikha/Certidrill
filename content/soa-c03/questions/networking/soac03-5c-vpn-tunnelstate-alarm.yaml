id: soac03-5c-vpn-tunnelstate-alarm
objective: "5.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company monitors an AWS Site-to-Site VPN connection with an Amazon CloudWatch alarm on the `TunnelState` metric for the `VpnId` dimension. The alarm uses the Average statistic over 5 minutes and goes to the ALARM state when the value is less than or equal to 0. Last week, tunnel 1 was down for 3 hours while tunnel 2 stayed up, and the alarm stayed in the OK state. The network team must be notified whenever at least one tunnel of the connection is down.

    Which solution will meet these requirements?
  fr: |
    Une entreprise surveille une connexion AWS Site-to-Site VPN avec une alarme Amazon CloudWatch sur la métrique `TunnelState` pour la dimension `VpnId`. L'alarme utilise la statistique Average sur 5 minutes et passe à l'état ALARM lorsque la valeur est inférieure ou égale à 0. La semaine dernière, le tunnel 1 a été DOWN pendant 3 heures alors que le tunnel 2 restait UP, et l'alarme est restée à l'état OK. L'équipe réseau doit être avertie chaque fois qu'au moins un tunnel de la connexion est DOWN.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the alarm condition so that the alarm goes to the ALARM state when TunnelState is less than 1.", fr: "Modifier la condition de l'alarme pour qu'elle passe à l'état ALARM lorsque TunnelState est inférieur à 1." } }
    - { id: b, text: { en: "Replace the alarm with an alarm that triggers when the Sum of TunnelDataIn is 0 for 5 minutes.", fr: "Remplacer l'alarme par une alarme qui se déclenche lorsque la somme (Sum) de TunnelDataIn vaut 0 pendant 5 minutes." } }
    - { id: c, text: { en: "Change the statistic of the alarm to Sum and keep the threshold of less than or equal to 0.", fr: "Remplacer la statistique de l'alarme par Sum et conserver le seuil inférieur ou égal à 0." } }
    - { id: d, text: { en: "Change the period of the alarm to 1 minute and keep the threshold of less than or equal to 0.", fr: "Réduire la période de l'alarme à 1 minute et conserver le seuil inférieur ou égal à 0." } }
answer: { optionId: a }
explanation:
  correct:
    en: "For the VpnId dimension, TunnelState is 1 when all tunnels are up, 0 when none are up, and a value between 0 and 1 when at least one tunnel is not up. With one of the two tunnels down, the value stays above 0, so it never meets a threshold of 0. A threshold of less than 1 catches the loss of any single tunnel."
    fr: "Pour la dimension VpnId, TunnelState vaut 1 lorsque tous les tunnels sont UP, 0 lorsqu'aucun ne l'est, et une valeur entre 0 et 1 lorsqu'au moins un tunnel n'est pas UP. Avec l'un des deux tunnels DOWN, la valeur reste supérieure à 0 : elle n'atteint donc jamais un seuil de 0. Un seuil inférieur à 1 détecte la perte de n'importe quel tunnel."
  options:
    b:
      en: "TunnelDataIn can report bytes even when a tunnel is down because of status checks and ARP and BGP traffic, and it is 0 for a healthy tunnel with no traffic."
      fr: "TunnelDataIn peut indiquer des octets même lorsqu'un tunnel est DOWN, à cause des vérifications d'état et du trafic ARP et BGP, et il vaut 0 pour un tunnel sain sans trafic."
    c:
      en: "While tunnel 2 is up, the data points stay above 0, so their sum is also above 0 and the alarm still does not fire."
      fr: "Tant que le tunnel 2 est UP, les points de données restent supérieurs à 0 : leur somme l'est aussi et l'alarme ne se déclenche toujours pas."
    d:
      en: "A shorter period does not change the fact that the value stays above 0 while one tunnel is up, so the threshold is still never reached."
      fr: "Une période plus courte ne change pas le fait que la valeur reste supérieure à 0 tant qu'un tunnel est UP : le seuil n'est toujours jamais atteint."
references:
  - title: Monitor AWS Site-to-Site VPN tunnels using Amazon CloudWatch
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/monitoring-cloudwatch-vpn.html
