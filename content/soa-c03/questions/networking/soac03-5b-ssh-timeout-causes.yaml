id: soac03-5b-ssh-timeout-causes
objective: "5.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EC2 instance has a public IPv4 address and runs in a subnet of a VPC that has an internet gateway attached. Administrators in the office network (198.51.100.0/24) connect to it with SSH, and their connections time out. The SSH daemon on the instance is running.

    Which two configurations could cause this issue? (Choose two.)
  fr: |
    Une instance Amazon EC2 possède une adresse IPv4 publique et s'exécute dans un sous-réseau d'un VPC auquel une passerelle Internet est attachée. Les administrateurs du réseau du bureau (198.51.100.0/24) s'y connectent en SSH, et leurs connexions expirent. Le démon SSH de l'instance est en cours d'exécution.

    Quelles sont les deux configurations qui pourraient provoquer ce problème ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The security group allows inbound TCP port 22 only from 203.0.113.0/24.", fr: "Le groupe de sécurité n'autorise le port TCP 22 entrant que depuis 203.0.113.0/24." } }
    - { id: b, text: { en: "The security group has no outbound rule that allows TCP ports 1024-65535.", fr: "Le groupe de sécurité n'a aucune règle sortante qui autorise les ports TCP 1024-65535." } }
    - { id: c, text: { en: "The subnet's route table has no route for 0.0.0.0/0 to the internet gateway.", fr: "La table de routage du sous-réseau n'a pas de route 0.0.0.0/0 vers la passerelle Internet." } }
    - { id: d, text: { en: "The enableDnsHostnames attribute of the VPC is set to false.", fr: "L'attribut enableDnsHostnames du VPC est défini sur false." } }
    - { id: e, text: { en: "The subnet uses the default network ACL of the VPC with its original rules.", fr: "Le sous-réseau utilise l'ACL réseau par défaut du VPC avec ses règles d'origine." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A security group allows only the traffic that its rules list, so SSH from 198.51.100.0/24 is dropped if the only source is another range. Without a route to the internet gateway, the subnet is not public and packets between the instance and the office have no path, even though the instance has a public address.
    fr: |
      Un groupe de sécurité n'autorise que le trafic indiqué dans ses règles : le SSH depuis 198.51.100.0/24 est rejeté si la seule source autorisée est une autre plage. Sans route vers la passerelle Internet, le sous-réseau n'est pas public et les paquets entre l'instance et le bureau n'ont aucun chemin, même si l'instance possède une adresse publique.
  options:
    b:
      en: |
        Security groups are stateful: responses to allowed inbound connections leave regardless of the outbound rules.
      fr: |
        Les groupes de sécurité sont avec état : les réponses aux connexions entrantes autorisées sortent quelles que soient les règles sortantes.
    d:
      en: |
        Without DNS hostnames the instance has no public DNS name, but SSH to its public IP address still works.
      fr: |
        Sans noms d'hôte DNS, l'instance n'a pas de nom DNS public, mais le SSH vers son adresse IP publique fonctionne toujours.
    e:
      en: |
        The default network ACL allows all inbound and outbound traffic, so it does not block SSH.
      fr: |
        L'ACL réseau par défaut autorise tout le trafic entrant et sortant : elle ne bloque pas le SSH.
references:
  - title: Control traffic to your AWS resources using security groups
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
  - title: Enable internet access for a VPC using an internet gateway
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html
