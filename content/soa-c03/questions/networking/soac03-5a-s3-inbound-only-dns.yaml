id: soac03-5a-s3-inbound-only-dns
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has an interface VPC endpoint for Amazon S3 with private DNS turned on and the option to enable private DNS only for inbound endpoints cleared. On-premises servers resolve S3 names through a Route 53 Resolver inbound endpoint and reach S3 through the interface endpoint over AWS Direct Connect. Amazon EC2 instances in the same VPC also send several hundred terabytes each month to S3 through the interface endpoint. The company wants to reduce the endpoint charges without changing any application or on-premises DNS configuration.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un point de terminaison de VPC d'interface pour Amazon S3 dont le DNS privé est activé et dont l'option d'activation du DNS privé uniquement pour les points de terminaison entrants est désactivée. Des serveurs sur site résolvent les noms S3 par un point de terminaison entrant Route 53 Resolver et joignent S3 par le point de terminaison d'interface via AWS Direct Connect. Des instances Amazon EC2 du même VPC envoient aussi plusieurs centaines de téraoctets par mois vers S3 par le point de terminaison d'interface. L'entreprise veut réduire les frais du point de terminaison sans modifier la configuration des applications ni celle du DNS sur site.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn off private DNS on the interface endpoint so that the instances resolve S3 to its public addresses.", fr: "Désactiver le DNS privé du point de terminaison d'interface pour que les instances résolvent S3 vers ses adresses publiques." }
    - id: b
      text: { en: "Add an endpoint policy to the interface endpoint that denies requests from the VPC CIDR block.", fr: "Ajouter au point de terminaison d'interface une politique qui refuse les requêtes provenant du bloc CIDR du VPC." }
    - id: c
      text: { en: "Route the instances' S3 traffic through a NAT gateway and keep the interface endpoint for on premises.", fr: "Faire passer le trafic S3 des instances par une passerelle NAT et garder le point de terminaison d'interface pour le site." }
    - id: d
      text: { en: "Create an S3 gateway endpoint for the VPC's route tables and select private DNS only for inbound endpoints.", fr: "Créer un point de terminaison de passerelle S3 pour les tables de routage du VPC et sélectionner le DNS privé uniquement pour les points de terminaison entrants." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With the option to enable private DNS only for inbound endpoints, queries that come through the inbound Resolver endpoint still get the interface endpoint's addresses, while queries from inside the VPC get the public S3 addresses, which the gateway endpoint route captures. Gateway endpoints have no hourly or data processing charge, and the option requires a gateway endpoint in the VPC. On premises keeps using the interface endpoint with no change.
    fr: |
      Avec l'option d'activation du DNS privé uniquement pour les points de terminaison entrants, les requêtes qui arrivent par le point de terminaison Resolver entrant obtiennent toujours les adresses du point de terminaison d'interface, tandis que les requêtes internes au VPC obtiennent les adresses S3 publiques, que la route du point de terminaison de passerelle intercepte. Les points de terminaison de passerelle n'ont ni frais horaires ni frais de traitement des données, et l'option exige un point de terminaison de passerelle dans le VPC. Le site continue d'utiliser le point de terminaison d'interface sans modification.
  options:
    a:
      en: |
        Without private DNS, the on-premises servers would also resolve S3 to public addresses and stop using the private path, which changes their behavior.
      fr: |
        Sans DNS privé, les serveurs sur site résoudraient aussi S3 vers des adresses publiques et cesseraient d'utiliser le chemin privé, ce qui modifie leur comportement.
    b:
      en: |
        Denying the VPC's requests would make the instances' S3 calls fail instead of sending them over a cheaper path.
      fr: |
        Refuser les requêtes du VPC ferait échouer les appels S3 des instances au lieu de les faire passer par un chemin moins cher.
    c:
      en: |
        A NAT gateway charges per GB processed as well as per hour, which costs more than a gateway endpoint for this volume.
      fr: |
        Une passerelle NAT facture chaque Go traité en plus d'un tarif horaire, ce qui coûte plus cher qu'un point de terminaison de passerelle pour ce volume.
references:
  - title: AWS PrivateLink for Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html
