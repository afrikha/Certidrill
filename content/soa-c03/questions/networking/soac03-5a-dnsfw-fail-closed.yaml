id: soac03-5a-dnsfw-fail-closed
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An audit of a VPC that uses Route 53 Resolver DNS Firewall finds that the VPC's DNS Firewall configuration has fail open turned on. The company's policy says that security takes priority over availability: no query may be resolved without DNS Firewall filtering, even when DNS Firewall does not respond.

    Which action will bring the VPC into compliance?
  fr: |
    L'audit d'un VPC qui utilise Route 53 Resolver DNS Firewall révèle que l'ouverture en cas d'échec (fail open) est activée dans la configuration DNS Firewall du VPC. La politique de l'entreprise fait primer la sécurité sur la disponibilité : aucune requête ne doit être résolue sans filtrage DNS Firewall, même lorsque DNS Firewall ne répond pas.

    Quelle action met le VPC en conformité ?
body:
  options:
    - id: a
      text: { en: "Turn on Resolver query logging for the VPC so that unfiltered queries are recorded.", fr: "Activer la journalisation des requêtes Resolver pour le VPC afin d'enregistrer les requêtes non filtrées." }
    - id: b
      text: { en: "Update the VPC's DNS Firewall configuration to turn off fail open, so that it fails closed.", fr: "Mettre à jour la configuration DNS Firewall du VPC pour désactiver l'ouverture en cas d'échec, afin qu'il échoue en mode fermé." }
    - id: c
      text: { en: "Give the VPC's rule group association a lower priority number than the other associations.", fr: "Donner à l'association du groupe de règles du VPC un numéro de priorité inférieur à celui des autres associations." }
    - id: d
      text: { en: "Add a rule at the end of the rule group that blocks every domain with an NXDOMAIN response.", fr: "Ajouter à la fin du groupe de règles une règle qui bloque tous les domaines avec une réponse NXDOMAIN." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The VPC's DNS Firewall configuration decides what the VPC Resolver does when it gets no reply from DNS Firewall. With fail open turned off (the default), the Resolver blocks those queries and returns `SERVFAIL`, which favors security over availability. The setting is changed with `UpdateFirewallConfig` or in the console.
    fr: |
      La configuration DNS Firewall du VPC détermine ce que fait le Resolver du VPC lorsqu'il ne reçoit pas de réponse de DNS Firewall. Avec l'ouverture en cas d'échec désactivée (valeur par défaut), le Resolver bloque ces requêtes et renvoie `SERVFAIL`, ce qui privilégie la sécurité sur la disponibilité. Le paramètre se modifie avec `UpdateFirewallConfig` ou dans la console.
  options:
    a:
      en: |
        Logging records what happens but does not stop queries from being resolved without filtering.
      fr: |
        La journalisation enregistre ce qui se passe, mais n'empêche pas la résolution de requêtes sans filtrage.
    c:
      en: |
        Association priority sets the order in which rule groups are evaluated when DNS Firewall works. It has no effect when DNS Firewall does not respond.
      fr: |
        La priorité d'association fixe l'ordre d'évaluation des groupes de règles lorsque DNS Firewall fonctionne. Elle n'a aucun effet lorsque DNS Firewall ne répond pas.
    d:
      en: |
        A catch-all block rule would break all normal name resolution, and it would also not apply when DNS Firewall does not respond.
      fr: |
        Une règle de blocage générale casserait toute la résolution de noms normale, et elle ne s'appliquerait pas non plus lorsque DNS Firewall ne répond pas.
references:
  - title: DNS Firewall VPC configuration
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-dns-firewall-vpc-configuration.html
