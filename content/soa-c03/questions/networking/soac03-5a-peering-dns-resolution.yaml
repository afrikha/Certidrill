id: soac03-5a-peering-dns-resolution
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two VPCs in the same account and Region are connected by an active VPC peering connection, and the route tables send each VPC's CIDR block through it. An application in VPC A connects to an Amazon EC2 instance in VPC B by using the instance's public IPv4 DNS hostname. VPC flow logs show that this traffic leaves through the internet instead of the peering connection. Both VPCs have DNS resolution and DNS hostnames turned on. The application configuration must not change.

    Which solution will send the traffic over the peering connection?
  fr: |
    Deux VPC du même compte et de la même Région sont reliés par une connexion d'appairage de VPC active, et les tables de routage envoient le bloc CIDR de chaque VPC par cette connexion. Une application du VPC A se connecte à une instance Amazon EC2 du VPC B en utilisant le nom d'hôte DNS IPv4 public de l'instance. Les journaux de flux VPC montrent que ce trafic sort par Internet au lieu de la connexion d'appairage. Les deux VPC ont la résolution DNS et les noms d'hôte DNS activés. La configuration de l'application ne doit pas changer.

    Quelle solution fait passer le trafic par la connexion d'appairage ?
body:
  options:
    - id: a
      text: { en: "Create a Route 53 private hosted zone for the public EC2 domain and associate it with VPC A.", fr: "Créer une zone hébergée privée Route 53 pour le domaine EC2 public et l'associer au VPC A." }
    - id: b
      text: { en: "Add a route for the instance's public IPv4 address to the peering connection in VPC A.", fr: "Ajouter dans le VPC A une route vers la connexion d'appairage pour l'adresse IPv4 publique de l'instance." }
    - id: c
      text: { en: "Create a Route 53 Resolver outbound endpoint in VPC A that forwards queries to VPC B.", fr: "Créer un point de terminaison sortant Route 53 Resolver dans le VPC A qui transfère les requêtes au VPC B." }
    - id: d
      text: { en: "Turn on DNS resolution for the peering connection so that hostnames resolve to private IPs.", fr: "Activer la résolution DNS de la connexion d'appairage pour que les noms d'hôte se résolvent en adresses IP privées." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, a public DNS hostname resolves to the instance's public IPv4 address even when queried from a peered VPC. When DNS resolution is turned on for the peering connection, which requires DNS resolution and DNS hostnames in both VPCs, the hostname resolves to the private IPv4 address. The existing peering routes then carry the traffic.
    fr: |
      Par défaut, un nom d'hôte DNS public se résout vers l'adresse IPv4 publique de l'instance, même depuis un VPC appairé. Lorsque la résolution DNS est activée sur la connexion d'appairage, ce qui exige la résolution DNS et les noms d'hôte DNS dans les deux VPC, le nom d'hôte se résout vers l'adresse IPv4 privée. Les routes d'appairage existantes transportent alors le trafic.
  options:
    a:
      en: |
        Overriding an AWS-owned domain with a private hosted zone would require one record per instance and could break name resolution for every other EC2 hostname.
      fr: |
        Remplacer un domaine appartenant à AWS par une zone hébergée privée exigerait un enregistrement par instance et pourrait casser la résolution de tous les autres noms d'hôte EC2.
    b:
      en: |
        A peering connection carries only traffic between the private address ranges of the VPCs; it does not deliver traffic sent to a public IPv4 address.
      fr: |
        Une connexion d'appairage ne transporte que le trafic entre les plages d'adresses privées des VPC ; elle ne remet pas le trafic envoyé vers une adresse IPv4 publique.
    c:
      en: |
        Outbound Resolver endpoints forward queries to DNS servers on other networks, such as on premises. Instances cannot query the Amazon DNS server of a peer VPC.
      fr: |
        Les points de terminaison Resolver sortants transfèrent des requêtes vers des serveurs DNS d'autres réseaux, par exemple sur site. Les instances ne peuvent pas interroger le serveur DNS Amazon d'un VPC appairé.
references:
  - title: Enable DNS resolution for a VPC peering connection
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-dns.html
