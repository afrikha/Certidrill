id: soac03-5a-ipv6-public-web
objective: "5.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Web servers on current-generation Amazon EC2 instances run in a public subnet and serve HTTPS to IPv4 clients. The VPC and the subnet already have Amazon-provided IPv6 CIDR blocks, and the subnet uses the default network ACL, which allows all IPv4 and IPv6 traffic. The instances have only IPv4 addresses, the security group allows TCP 443 from `0.0.0.0/0`, and the subnet's route table has a `0.0.0.0/0` route to the internet gateway. The web servers must also accept HTTPS connections from IPv6 clients on the internet.

    Which combination of actions will meet this requirement? (Choose three.)
  fr: |
    Des serveurs web sur des instances Amazon EC2 de génération actuelle s'exécutent dans un sous-réseau public et servent du HTTPS à des clients IPv4. Le VPC et le sous-réseau ont déjà des blocs CIDR IPv6 fournis par Amazon, et le sous-réseau utilise l'ACL réseau par défaut, qui autorise tout le trafic IPv4 et IPv6. Les instances n'ont que des adresses IPv4, le groupe de sécurité autorise TCP 443 depuis `0.0.0.0/0`, et la table de routage du sous-réseau contient une route `0.0.0.0/0` vers la passerelle Internet. Les serveurs web doivent aussi accepter des connexions HTTPS de clients IPv6 sur Internet.

    Quelle combinaison d'actions répond à cette exigence ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create an egress-only internet gateway and add a ::/0 route to it in the subnet's route table.", fr: "Créer une passerelle Internet de sortie uniquement et ajouter une route ::/0 vers elle dans la table de routage du sous-réseau." } }
    - { id: b, text: { en: "Assign an IPv6 address from the subnet's IPv6 range to each web server instance.", fr: "Attribuer à chaque instance de serveur web une adresse IPv6 de la plage IPv6 du sous-réseau." } }
    - { id: c, text: { en: "Add an outbound security group rule that allows all traffic to ::/0 for the responses.", fr: "Ajouter une règle sortante de groupe de sécurité qui autorise tout le trafic vers ::/0 pour les réponses." } }
    - { id: d, text: { en: "Add a ::/0 route to the internet gateway in the subnet's route table.", fr: "Ajouter une route ::/0 vers la passerelle Internet dans la table de routage du sous-réseau." } }
    - { id: e, text: { en: "Turn on DNS64 for the subnet so that IPv6 clients can reach the IPv4 addresses.", fr: "Activer DNS64 sur le sous-réseau pour que les clients IPv6 joignent les adresses IPv4." } }
    - { id: f, text: { en: "Add an inbound security group rule that allows TCP 443 from ::/0.", fr: "Ajouter une règle entrante de groupe de sécurité qui autorise TCP 443 depuis ::/0." } }
answer: { optionIds: [ b, d, f ] }
explanation:
  correct:
    en: |
      Each instance needs an IPv6 address from the subnet range. The public subnet needs a `::/0` route to the internet gateway, because the existing `0.0.0.0/0` route covers only IPv4. Security group rules for `0.0.0.0/0` do not match IPv6 traffic, so an inbound rule for TCP 443 from `::/0` is also required. The default network ACL already received IPv6 allow rules when the IPv6 CIDR block was associated.
    fr: |
      Chaque instance a besoin d'une adresse IPv6 de la plage du sous-réseau. Le sous-réseau public a besoin d'une route `::/0` vers la passerelle Internet, car la route `0.0.0.0/0` existante ne couvre que l'IPv4. Les règles de groupe de sécurité pour `0.0.0.0/0` ne s'appliquent pas au trafic IPv6 : une règle entrante pour TCP 443 depuis `::/0` est donc aussi nécessaire. L'ACL réseau par défaut a déjà reçu des règles d'autorisation IPv6 lors de l'association du bloc CIDR IPv6.
  options:
    a:
      en: |
        An egress-only internet gateway blocks connections that start on the internet, so IPv6 clients could not reach the web servers.
      fr: |
        Une passerelle Internet de sortie uniquement bloque les connexions initiées depuis Internet : les clients IPv6 ne pourraient pas joindre les serveurs web.
    c:
      en: |
        Security groups are stateful, so responses to allowed inbound connections are allowed automatically. No outbound rule is needed for the replies.
      fr: |
        Les groupes de sécurité sont avec état : les réponses aux connexions entrantes autorisées sont autorisées automatiquement. Aucune règle sortante n'est nécessaire pour les réponses.
    e:
      en: |
        DNS64 helps IPv6-only clients inside the VPC reach IPv4-only destinations through NAT64. It does not let internet clients reach the instances.
      fr: |
        DNS64 aide des clients IPv6 uniquement situés dans le VPC à joindre des destinations IPv4 uniquement par NAT64. Il ne permet pas aux clients Internet de joindre les instances.
references:
  - title: Add IPv6 support for your VPC
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-migrate-ipv6-add.html
