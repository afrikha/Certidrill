id: soac03-5c-vpn-log-no-proposal
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A network engineer at AnyCompany creates a new AWS Site-to-Site VPN connection to a branch office. The tunnels never come up. The engineer turns on Site-to-Site VPN logs, and the tunnel activity log in Amazon CloudWatch Logs repeatedly shows entries that contain the following fields:

    ```json
    {
      "details": "No Proposal Match Found by AWS",
      "dpd_enabled": true,
      "nat_t_detected": false,
      "ike_phase1_state": "down",
      "ike_phase2_state": "down"
    }
    ```

    The customer gateway device is configured to propose 3DES encryption with SHA-1 for IKE phase 1 and phase 2.

    Which solution will bring the tunnels up?
  fr: |
    Un ingénieur réseau d'AnyCompany crée une nouvelle connexion AWS Site-to-Site VPN vers une agence. Les tunnels ne montent jamais. L'ingénieur active les journaux Site-to-Site VPN, et le journal d'activité des tunnels dans Amazon CloudWatch Logs affiche de façon répétée des entrées qui contiennent les champs suivants :

    ```json
    {
      "details": "No Proposal Match Found by AWS",
      "dpd_enabled": true,
      "nat_t_detected": false,
      "ike_phase1_state": "down",
      "ike_phase2_state": "down"
    }
    ```

    Le périphérique de passerelle client (customer gateway) est configuré pour proposer le chiffrement 3DES avec SHA-1 pour les phases 1 et 2 d'IKE.

    Quelle solution permet d'établir les tunnels ?
body:
  options:
    - { id: a, text: { en: "Generate a new pre-shared key and configure it on both tunnels and on the customer gateway device.", fr: "Générer une nouvelle clé prépartagée et la configurer sur les deux tunnels et sur le périphérique de passerelle client." } }
    - { id: b, text: { en: "Change the startup action of both tunnels so that AWS initiates the IKE negotiation.", fr: "Modifier l'action de démarrage des deux tunnels pour qu'AWS lance la négociation IKE." } }
    - { id: c, text: { en: "Increase the dead peer detection (DPD) timeout of both tunnels to 60 seconds.", fr: "Porter à 60 secondes le délai de détection d'homologue mort (DPD) des deux tunnels." } }
    - { id: d, text: { en: "Configure the customer gateway device to propose AES256 encryption for IKE phase 1 and phase 2.", fr: "Configurer le périphérique de passerelle client pour qu'il propose le chiffrement AES256 pour les phases 1 et 2 d'IKE." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The message means that the encryption, integrity or Diffie-Hellman values that the customer gateway proposes are not accepted by the AWS endpoint; 3DES is not a supported algorithm. Configuring a supported algorithm such as AES256 on the device lets IKE phase 1 and phase 2 complete."
    fr: "Ce message signifie que les valeurs de chiffrement, d'intégrité ou de groupe Diffie-Hellman proposées par la passerelle client ne sont pas acceptées par le point de terminaison AWS ; 3DES n'est pas un algorithme pris en charge. Configurer sur le périphérique un algorithme pris en charge comme AES256 permet aux phases 1 et 2 d'IKE d'aboutir."
  options:
    a:
      en: "A key problem produces a pre-shared key mismatch message, not a proposal mismatch."
      fr: "Un problème de clé produit un message d'incompatibilité de clé prépartagée, pas d'incompatibilité de proposition."
    b:
      en: "If AWS initiated the negotiation, the device would still answer with 3DES, and the proposals would still not match."
      fr: "Si AWS lançait la négociation, le périphérique répondrait toujours avec 3DES et les propositions ne correspondraient toujours pas."
    c:
      en: "DPD detects a peer that stops responding on an established tunnel; it does not affect the choice of IKE algorithms."
      fr: "Le DPD détecte un homologue qui ne répond plus sur un tunnel établi ; il n'a pas d'effet sur le choix des algorithmes IKE."
references:
  - title: AWS Site-to-Site VPN logs
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/monitoring-logs.html
