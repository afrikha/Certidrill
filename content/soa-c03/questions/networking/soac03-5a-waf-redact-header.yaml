id: soac03-5a-waf-redact-header
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS WAF web ACL sends its logs to an Amazon S3 bucket. An auditor finds that the logs contain the values of the `authorization` header, which hold bearer tokens. The company must keep a log record for every request and keep all other request details, but the token values must not be stored in the logs.

    Which solution will meet these requirements?
  fr: |
    Une liste ACL web AWS WAF envoie ses journaux vers un compartiment Amazon S3. Un auditeur constate que les journaux contiennent les valeurs de l'en-tête `authorization`, qui contiennent des jetons d'authentification (bearer tokens). L'entreprise doit conserver un enregistrement de journal pour chaque requête et garder tous les autres détails des requêtes, mais les valeurs des jetons ne doivent pas être stockées dans les journaux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the authorization header as a single header redacted field in the logging configuration.", fr: "Ajouter l'en-tête authorization comme champ masqué de type Single header dans la configuration de journalisation." }
    - id: b
      text: { en: "Add a logging filter that drops the log records of requests that contain the header.", fr: "Ajouter un filtre de journalisation qui supprime les enregistrements des requêtes qui contiennent l'en-tête." }
    - id: c
      text: { en: "Turn on SSE-KMS with a customer managed key on the bucket that receives the logs.", fr: "Activer SSE-KMS avec une clé gérée par le client sur le compartiment qui reçoit les journaux." }
    - id: d
      text: { en: "Turn off sampled requests for the web ACL in the visibility configuration.", fr: "Désactiver les requêtes échantillonnées de la liste ACL web dans la configuration de visibilité." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The AWS WAF logging configuration can redact the URI path, the query string, the HTTP method or a single named header. A redacted field appears as `REDACTED` in each log record, so every request is still logged with its other details, and the token values are never written.
    fr: |
      La configuration de journalisation AWS WAF peut masquer le chemin URI, la chaîne de requête, la méthode HTTP ou un en-tête nommé (Single header). Un champ masqué apparaît sous la forme `REDACTED` dans chaque enregistrement : chaque requête reste journalisée avec ses autres détails, et les valeurs des jetons ne sont jamais écrites.
  options:
    b:
      en: |
        A filter that drops records removes whole requests from the logs, which breaks the requirement to keep a record for every request.
      fr: |
        Un filtre qui supprime des enregistrements retire des requêtes entières des journaux, ce qui enfreint l'exigence de conserver un enregistrement pour chaque requête.
    c:
      en: |
        Encryption at rest protects the objects, but anyone allowed to read them still sees the token values in the logs.
      fr: |
        Le chiffrement au repos protège les objets, mais toute personne autorisée à les lire voit toujours les valeurs des jetons dans les journaux.
    d:
      en: |
        Sampled requests are separate from logging. Turning them off does not change the content of the log records.
      fr: |
        Les requêtes échantillonnées sont distinctes de la journalisation. Les désactiver ne change pas le contenu des enregistrements de journal.
references:
  - title: Finding your protection pack (web ACL) records
    url: https://docs.aws.amazon.com/waf/latest/developerguide/logging-management.html
