id: soac03-5b-failover-alias-etr
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application behind an Application Load Balancer (ALB) in us-east-1 and a standby copy behind an ALB in us-west-2. The company wants Route 53 to send app.example.com traffic to us-west-2 only when the us-east-1 ALB has no healthy targets. The company does not want to create or pay for Route 53 health checks.

    Which combination of records will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute une application derrière un Application Load Balancer (ALB) dans us-east-1 et une copie de secours derrière un ALB dans us-west-2. L'entreprise veut que Route 53 envoie le trafic de app.example.com vers us-west-2 uniquement lorsque l'ALB de us-east-1 n'a aucune cible saine. L'entreprise ne veut pas créer ni payer de vérifications de l'état Route 53.

    Quelle combinaison d'enregistrements répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A primary failover alias record for app.example.com that targets the us-east-1 ALB, with Evaluate Target Health set to Yes", fr: "Un enregistrement d'alias de basculement principal pour app.example.com qui cible l'ALB de us-east-1, avec Evaluate Target Health défini sur Yes" } }
    - { id: b, text: { en: "A primary failover alias record for app.example.com that targets the us-east-1 ALB, with Evaluate Target Health set to No", fr: "Un enregistrement d'alias de basculement principal pour app.example.com qui cible l'ALB de us-east-1, avec Evaluate Target Health défini sur No" } }
    - { id: c, text: { en: "A secondary failover alias record for app.example.com that targets the us-west-2 ALB", fr: "Un enregistrement d'alias de basculement secondaire pour app.example.com qui cible l'ALB de us-west-2" } }
    - { id: d, text: { en: "Multivalue answer records for app.example.com that contain the current IP addresses of both ALBs", fr: "Des enregistrements de réponse à valeurs multiples pour app.example.com qui contiennent les adresses IP actuelles des deux ALB" } }
    - { id: e, text: { en: "A latency alias record for app.example.com that targets the us-west-2 ALB", fr: "Un enregistrement d'alias de latence pour app.example.com qui cible l'ALB de us-west-2" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      An alias record that targets a load balancer can use Evaluate Target Health instead of a Route 53 health check: Route 53 checks whether the ALB has healthy targets before it answers with the record. When the primary ALB has none, Route 53 answers with the secondary failover record, which targets the us-west-2 ALB.
    fr: |
      Un enregistrement d'alias qui cible un équilibreur de charge peut utiliser Evaluate Target Health au lieu d'une vérification de l'état Route 53 : Route 53 vérifie que l'ALB possède des cibles saines avant de répondre avec l'enregistrement. Lorsque l'ALB principal n'en a aucune, Route 53 répond avec l'enregistrement de basculement secondaire, qui cible l'ALB de us-west-2.
  options:
    b:
      en: |
        With Evaluate Target Health set to No and no health check, Route 53 considers the primary always healthy and never fails over.
      fr: |
        Avec Evaluate Target Health défini sur No et sans vérification de l'état, Route 53 considère le principal comme toujours sain et ne bascule jamais.
    d:
      en: |
        ALB addresses change over time, and multivalue answers would send traffic to both Regions instead of using us-west-2 only as a standby.
      fr: |
        Les adresses d'un ALB changent au fil du temps, et des réponses à valeurs multiples enverraient du trafic vers les deux Régions au lieu d'utiliser us-west-2 seulement en secours.
    e:
      en: |
        A latency record cannot be combined with failover records for the same name, and latency routing sends users to both Regions.
      fr: |
        Un enregistrement de latence ne peut pas être combiné avec des enregistrements de basculement pour le même nom, et le routage par latence envoie des utilisateurs vers les deux Régions.
references:
  - title: How health checks work in complex Amazon Route 53 configurations
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-complex-configs.html
