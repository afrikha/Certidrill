id: soac03-5a-public-ipv4-reduce
objective: "5.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company's web servers run in an Auto Scaling group in public subnets behind an internet-facing Application Load Balancer. Each instance receives an auto-assigned public IPv4 address, but the instances reach AWS services only through VPC endpoints and need no direct internet access. The account also holds 15 Elastic IP addresses that are not associated with any resource and that no workload needs. The company wants to reduce its public IPv4 address charges without affecting the application.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les serveurs web d'une entreprise s'exécutent dans un groupe Auto Scaling, dans des sous-réseaux publics, derrière un Application Load Balancer accessible depuis Internet. Chaque instance reçoit une adresse IPv4 publique attribuée automatiquement, mais les instances ne joignent les services AWS que par des points de terminaison de VPC et n'ont besoin d'aucun accès Internet direct. Le compte détient aussi 15 adresses IP Elastic qui ne sont associées à aucune ressource et dont aucune charge de travail n'a besoin. L'entreprise veut réduire ses frais d'adresses IPv4 publiques sans affecter l'application.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace each auto-assigned public address with an Elastic IP address from the account.", fr: "Remplacer chaque adresse publique attribuée automatiquement par une adresse IP Elastic du compte." } }
    - { id: b, text: { en: "Replace the load balancer with an internal Application Load Balancer in the same subnets.", fr: "Remplacer l'équilibreur de charge par un Application Load Balancer interne dans les mêmes sous-réseaux." } }
    - { id: c, text: { en: "Release the 15 Elastic IP addresses that are not associated with any resource.", fr: "Libérer les 15 adresses IP Elastic qui ne sont associées à aucune ressource." } }
    - { id: d, text: { en: "Launch the instances without public IPv4 addresses, and then start an instance refresh.", fr: "Lancer les instances sans adresse IPv4 publique, puis démarrer une actualisation des instances." } }
    - { id: e, text: { en: "Route the instances' outbound traffic through a new NAT gateway in each zone.", fr: "Faire passer le trafic sortant des instances par une nouvelle passerelle NAT dans chaque zone." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      AWS charges for every public IPv4 address, whether it is in use or idle. Releasing Elastic IP addresses that no workload needs removes their idle charge. The load balancer forwards requests to the instances' private addresses, so launching the instances without public IPv4 addresses (for example by setting the launch template to not associate one) and replacing them with an instance refresh removes those charges without affecting clients.
    fr: |
      AWS facture chaque adresse IPv4 publique, qu'elle soit utilisée ou inactive. Libérer les adresses IP Elastic dont aucune charge de travail n'a besoin supprime leurs frais d'inactivité. L'équilibreur de charge transmet les requêtes aux adresses privées des instances : lancer les instances sans adresse IPv4 publique (par exemple en configurant le modèle de lancement pour ne pas en associer) et les remplacer par une actualisation des instances supprime ces frais sans affecter les clients.
  options:
    a:
      en: |
        Elastic IP addresses are public IPv4 addresses and are charged at the same rate, so the cost would not go down.
      fr: |
        Les adresses IP Elastic sont des adresses IPv4 publiques facturées au même tarif : le coût ne baisserait pas.
    b:
      en: |
        An internal load balancer cannot receive requests from internet clients, so the application would stop working for them.
      fr: |
        Un équilibreur de charge interne ne peut pas recevoir les requêtes des clients Internet : l'application cesserait de fonctionner pour eux.
    e:
      en: |
        The instances need no internet access, and NAT gateways add hourly charges, data processing charges and their own public addresses.
      fr: |
        Les instances n'ont besoin d'aucun accès Internet, et les passerelles NAT ajoutent des frais horaires, des frais de traitement des données et leurs propres adresses publiques.
references:
  - title: Amazon VPC Pricing
    url: https://aws.amazon.com/vpc/pricing/
  - title: Amazon EC2 instance IP addressing
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-instance-addressing.html
