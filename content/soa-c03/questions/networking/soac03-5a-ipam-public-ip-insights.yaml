id: soac03-5a-ipam-public-ip-insights
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS account is billed for many public IPv4 addresses in several Regions. To reduce the charge, a CloudOps engineer needs an inventory of every public IPv4 address in the account: Elastic IP addresses, auto-assigned EC2 public addresses and addresses that AWS services such as Amazon RDS manage, with whether each address is associated with a resource. The engineer wants the LEAST operational effort.

    Which solution will meet these requirements?
  fr: |
    Un compte AWS est facturé pour de nombreuses adresses IPv4 publiques dans plusieurs Régions. Pour réduire ces frais, un ingénieur CloudOps a besoin d'un inventaire de toutes les adresses IPv4 publiques du compte : adresses IP Elastic, adresses publiques EC2 attribuées automatiquement et adresses gérées par des services AWS comme Amazon RDS, en indiquant si chaque adresse est associée à une ressource. L'ingénieur veut le MOINS d'effort opérationnel possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run aws ec2 describe-addresses in each Region and combine the results in a spreadsheet.", fr: "Exécuter aws ec2 describe-addresses dans chaque Région et regrouper les résultats dans une feuille de calcul." }
    - id: b
      text: { en: "Create an Amazon VPC IP Address Manager (IPAM) and review its public IP insights.", fr: "Créer un Amazon VPC IP Address Manager (IPAM) et consulter ses informations sur les adresses IP publiques (public IP insights)." }
    - id: c
      text: { en: "Review the Unassociated Elastic IP Addresses check in AWS Trusted Advisor.", fr: "Consulter le contrôle Unassociated Elastic IP Addresses d'AWS Trusted Advisor." }
    - id: d
      text: { en: "Filter AWS Cost Explorer on the public IPv4 usage types and group the results by Region.", fr: "Filtrer AWS Cost Explorer sur les types d'utilisation IPv4 publics et regrouper les résultats par Région." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Public IP insights in IPAM shows the public IPv4 addresses used across Regions for the account (or the organization): Elastic IP addresses, EC2 public addresses, BYOIP addresses and service-managed addresses. It shows whether each one is associated and which service or resource holds it, so idle addresses can be released.
    fr: |
      Les informations sur les adresses IP publiques d'IPAM montrent les adresses IPv4 publiques utilisées dans toutes les Régions pour le compte (ou l'organisation) : adresses IP Elastic, adresses publiques EC2, adresses BYOIP et adresses gérées par des services. Elles indiquent si chaque adresse est associée et quel service ou quelle ressource la détient, ce qui permet de libérer les adresses inutilisées.
  options:
    a:
      en: |
        `describe-addresses` lists only Elastic IP addresses, so the auto-assigned and service-managed addresses would be missing, and the manual work is greater.
      fr: |
        `describe-addresses` ne liste que les adresses IP Elastic : les adresses attribuées automatiquement et celles gérées par des services manqueraient, et le travail manuel serait plus important.
    c:
      en: |
        This check covers only Elastic IP addresses that are not associated. It does not inventory the other public IPv4 addresses.
      fr: |
        Ce contrôle ne couvre que les adresses IP Elastic non associées. Il ne recense pas les autres adresses IPv4 publiques.
    d:
      en: |
        Cost Explorer shows the cost and usage totals, not a list of addresses with their association status.
      fr: |
        Cost Explorer montre les totaux de coût et d'utilisation, pas une liste des adresses avec leur état d'association.
references:
  - title: View public IP insights
    url: https://docs.aws.amazon.com/vpc/latest/ipam/view-public-ip-insights.html
  - title: Amazon VPC Pricing
    url: https://aws.amazon.com/vpc/pricing/
