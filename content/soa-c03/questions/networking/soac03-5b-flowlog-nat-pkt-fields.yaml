id: soac03-5b-flowlog-nat-pkt-fields
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A partner reports that the public IP address of a company's NAT gateway connects to its server at 203.0.113.77. Dozens of Amazon EC2 instances in private subnets use the NAT gateway. The VPC already has a flow log in the default format, and its records on the NAT gateway's network interface show only the NAT gateway's private IP address as the source of traffic to 203.0.113.77. A CloudOps engineer must identify which instances send this traffic.

    Which solution will meet these requirements?
  fr: |
    Un partenaire signale que l'adresse IP publique de la passerelle NAT d'une entreprise se connecte à son serveur 203.0.113.77. Des dizaines d'instances Amazon EC2 de sous-réseaux privés utilisent la passerelle NAT. Le VPC possède déjà un journal de flux au format par défaut, et ses enregistrements sur l'interface réseau de la passerelle NAT n'affichent que l'adresse IP privée de la passerelle NAT comme source du trafic vers 203.0.113.77. Un ingénieur CloudOps doit identifier les instances qui envoient ce trafic.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Edit the existing flow log to add the pkt-srcaddr and pkt-dstaddr fields to its format.", fr: "Modifier le journal de flux existant pour ajouter les champs pkt-srcaddr et pkt-dstaddr à son format." }
    - id: b
      text: { en: "Search the existing records on the NAT gateway's interface for dstaddr 203.0.113.77, and read their srcaddr field.", fr: "Rechercher dans les enregistrements existants de l'interface de la passerelle NAT ceux dont dstaddr vaut 203.0.113.77, et lire leur champ srcaddr." }
    - id: c
      text: { en: "Create a flow log for the internet gateway of the VPC in the default format.", fr: "Créer un journal de flux pour la passerelle Internet du VPC au format par défaut." }
    - id: d
      text: { en: "Create a new flow log for the NAT gateway's interface in a custom format that includes pkt-dstaddr, and filter on 203.0.113.77.", fr: "Créer un nouveau journal de flux pour l'interface de la passerelle NAT dans un format personnalisé qui inclut pkt-dstaddr, et filtrer sur 203.0.113.77." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On the NAT gateway's interface, the record for traffic from an instance shows the instance as srcaddr and the NAT gateway as dstaddr; the pkt-dstaddr field shows the real destination, 203.0.113.77. A custom format with these packet-level fields links each instance to the destination. The format of an existing flow log cannot be changed, so a new flow log is needed.
    fr: |
      Sur l'interface de la passerelle NAT, l'enregistrement du trafic venant d'une instance affiche l'instance comme srcaddr et la passerelle NAT comme dstaddr ; le champ pkt-dstaddr affiche la vraie destination, 203.0.113.77. Un format personnalisé avec ces champs au niveau du paquet relie chaque instance à la destination. Le format d'un journal de flux existant ne peut pas être modifié : il faut un nouveau journal de flux.
  options:
    a:
      en: |
        A flow log's configuration and record format cannot be changed after creation; it must be deleted or a new one created.
      fr: |
        La configuration et le format d'enregistrement d'un journal de flux ne peuvent pas être modifiés après la création ; il faut le supprimer ou en créer un nouveau.
    b:
      en: |
        After translation the source of these records is the NAT gateway's private address, which is exactly what the engineer already sees.
      fr: |
        Après la traduction, la source de ces enregistrements est l'adresse privée de la passerelle NAT, c'est-à-dire ce que l'ingénieur voit déjà.
    c:
      en: |
        Flow logs are created for VPCs, subnets, network interfaces and transit gateways, not for internet gateways, and the traffic is already translated there.
      fr: |
        Les journaux de flux se créent pour des VPC, des sous-réseaux, des interfaces réseau et des passerelles de transit, pas pour des passerelles Internet, et le trafic y est déjà traduit.
references:
  - title: Flow log record examples
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-records-examples.html
  - title: Flow log limitations
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-limitations.html
