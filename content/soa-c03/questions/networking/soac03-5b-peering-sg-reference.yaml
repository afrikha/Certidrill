id: soac03-5b-peering-sg-reference
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    VPC A (10.10.0.0/16) in us-east-1 and VPC B (10.20.0.0/16) in eu-west-1 are connected by an active VPC peering connection, and both route tables contain routes to the peer CIDR through the connection. A database in VPC B must accept TCP port 5432 only from the application servers in VPC A. When a CloudOps engineer adds an inbound rule to the database security group that references the security group of the application servers, the rule is rejected.

    Which solution will meet the requirement?
  fr: |
    Le VPC A (10.10.0.0/16) dans us-east-1 et le VPC B (10.20.0.0/16) dans eu-west-1 sont reliés par une connexion de peering de VPC active, et les deux tables de routage contiennent des routes vers le CIDR pair par cette connexion. Une base de données du VPC B ne doit accepter le port TCP 5432 que depuis les serveurs d'application du VPC A. Lorsqu'un ingénieur CloudOps ajoute au groupe de sécurité de la base de données une règle entrante qui référence le groupe de sécurité des serveurs d'application, la règle est refusée.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Turn on DNS resolution for the peering connection, and then add the security group reference again.", fr: "Activer la résolution DNS pour la connexion de peering, puis ajouter de nouveau la référence au groupe de sécurité." }
    - id: b
      text: { en: "Add an inbound rule that allows TCP port 5432 from the CIDR block of the subnets that contain the application servers.", fr: "Ajouter une règle entrante qui autorise le port TCP 5432 depuis le bloc d'adresse CIDR des sous-réseaux qui contiennent les serveurs d'application." }
    - id: c
      text: { en: "Add an outbound rule to the application security group that references the database security group.", fr: "Ajouter au groupe de sécurité des applications une règle sortante qui référence le groupe de sécurité de la base de données." }
    - id: d
      text: { en: "Delete the peering connection, and create a second peering connection with security group referencing turned on.", fr: "Supprimer la connexion de peering, et créer une seconde connexion de peering avec le référencement de groupes de sécurité activé." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A security group of a peer VPC can be referenced only when both VPCs are in the same Region. For inter-Region peering, the rule must use IP addresses, so allowing port 5432 from the CIDR blocks of the application subnets in VPC A limits access to those servers.
    fr: |
      Un groupe de sécurité d'un VPC pair ne peut être référencé que si les deux VPC se trouvent dans la même Région. Pour un peering entre Régions, la règle doit utiliser des adresses IP : autoriser le port 5432 depuis les blocs d'adresse CIDR des sous-réseaux d'application du VPC A limite l'accès à ces serveurs.
  options:
    a:
      en: |
        DNS resolution for peering only lets public DNS hostnames resolve to private addresses; it does not allow cross-Region security group references.
      fr: |
        La résolution DNS pour le peering permet seulement aux noms d'hôte DNS publics de se résoudre en adresses privées ; elle n'autorise pas les références de groupes de sécurité entre Régions.
    c:
      en: |
        Outbound rules in VPC A do not open the database's inbound path, and a cross-Region reference is rejected in either direction.
      fr: |
        Des règles sortantes dans le VPC A n'ouvrent pas le chemin entrant de la base de données, et une référence entre Régions est refusée dans les deux sens.
    d:
      en: |
        Peering connections have no setting that enables cross-Region references, and only one peering connection can exist between two VPCs.
      fr: |
        Les connexions de peering n'ont aucun paramètre qui active les références entre Régions, et une seule connexion de peering peut exister entre deux VPC.
references:
  - title: How VPC peering connections work
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html
