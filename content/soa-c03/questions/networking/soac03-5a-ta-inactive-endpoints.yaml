id: soac03-5a-ta-inactive-endpoints
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Over several years, teams created more than 150 interface VPC endpoints in one AWS account. The company believes that many of them are no longer used and wants to delete the endpoints that have processed no data in the last 30 days. The company's support plan gives access to all AWS Trusted Advisor checks.

    Which solution will identify these endpoints with the LEAST effort?
  fr: |
    En plusieurs années, les équipes ont créé plus de 150 points de terminaison de VPC d'interface dans un même compte AWS. L'entreprise pense que beaucoup ne sont plus utilisés et veut supprimer ceux qui n'ont traité aucune donnée au cours des 30 derniers jours. Le plan de support de l'entreprise donne accès à tous les contrôles AWS Trusted Advisor.

    Quelle solution identifie ces points de terminaison avec le MOINS d'effort ?
body:
  options:
    - id: a
      text: { en: "Review the idle resource recommendations in AWS Compute Optimizer for the account.", fr: "Consulter les recommandations de ressources inactives d'AWS Compute Optimizer pour le compte." }
    - id: b
      text: { en: "Turn on VPC flow logs for every endpoint network interface and query them after 30 days.", fr: "Activer les journaux de flux VPC sur chaque interface réseau de point de terminaison et les interroger après 30 jours." }
    - id: c
      text: { en: "Group the VPC endpoint costs in AWS Cost Explorer by usage type for the last 30 days.", fr: "Regrouper les coûts des points de terminaison de VPC dans AWS Cost Explorer par type d'utilisation sur 30 jours." }
    - id: d
      text: { en: "Review the Inactive VPC interface endpoints check in AWS Trusted Advisor.", fr: "Consulter le contrôle Inactive VPC interface endpoints d'AWS Trusted Advisor." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Inactive VPC interface endpoints cost optimization check flags each interface endpoint that has processed 0 bytes in the last 30 days. Interface endpoints have hourly and data processing charges, so deleting the flagged endpoints that are not needed removes their hourly cost.
    fr: |
      Le contrôle d'optimisation des coûts Inactive VPC interface endpoints signale chaque point de terminaison d'interface qui a traité 0 octet au cours des 30 derniers jours. Les points de terminaison d'interface ont des frais horaires et des frais de traitement des données : supprimer ceux qui sont signalés et inutiles supprime leur coût horaire.
  options:
    a:
      en: |
        Compute Optimizer idle recommendations cover resources such as EC2 instances, EBS volumes, RDS databases and NAT gateways, but not interface VPC endpoints.
      fr: |
        Les recommandations de ressources inactives de Compute Optimizer couvrent des ressources comme les instances EC2, les volumes EBS, les bases RDS et les passerelles NAT, mais pas les points de terminaison de VPC d'interface.
    b:
      en: |
        Flow logs could reveal traffic, but configuring and querying 150 of them and waiting 30 days is far more effort than an existing check.
      fr: |
        Les journaux de flux pourraient révéler le trafic, mais configurer et interroger 150 journaux et attendre 30 jours demande bien plus d'effort qu'un contrôle existant.
    c:
      en: |
        Cost Explorer shows endpoint charges in total. Idle endpoints still incur hourly charges, so costs alone do not show which endpoints processed no data.
      fr: |
        Cost Explorer montre les frais des points de terminaison dans leur ensemble. Les points de terminaison inactifs ont toujours des frais horaires : les coûts seuls n'indiquent pas lesquels n'ont traité aucune donnée.
references:
  - title: Cost optimization
    url: https://docs.aws.amazon.com/awssupport/latest/user/cost-optimization-checks.html
  - title: Viewing idle resource recommendations
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/view-idle-recommendations.html
