id: soac03-5b-waf-log-group-name
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company protects an Application Load Balancer in eu-west-1 with an AWS WAF web ACL. A CloudOps engineer creates an Amazon CloudWatch Logs log group named prod-waf-requests in eu-west-1 in the same account and tries to select it as the logging destination of the web ACL, but the log group cannot be used.

    Which action will resolve the issue?
  fr: |
    Une entreprise protège un Application Load Balancer dans eu-west-1 avec une liste ACL web AWS WAF. Un ingénieur CloudOps crée un groupe de journaux Amazon CloudWatch Logs nommé prod-waf-requests dans eu-west-1, dans le même compte, et essaie de le sélectionner comme destination de journalisation de la liste ACL web, mais le groupe de journaux ne peut pas être utilisé.

    Quelle action résout le problème ?
body:
  options:
    - id: a
      text: { en: "Create the log group in us-east-1, and select it as the logging destination.", fr: "Créer le groupe de journaux dans us-east-1, et le sélectionner comme destination de journalisation." }
    - id: b
      text: { en: "Create a log group whose name starts with aws-waf-logs-, and select it as the logging destination.", fr: "Créer un groupe de journaux dont le nom commence par aws-waf-logs-, et le sélectionner comme destination de journalisation." }
    - id: c
      text: { en: "Turn on request sampling for every rule of the web ACL.", fr: "Activer l'échantillonnage des requêtes pour chaque règle de la liste ACL web." }
    - id: d
      text: { en: "Add a subscription filter to the prod-waf-requests log group for AWS WAF.", fr: "Ajouter au groupe de journaux prod-waf-requests un filtre d'abonnement pour AWS WAF." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS WAF requires the name of a CloudWatch Logs log group used for web ACL logs to begin with aws-waf-logs-, followed by any suffix. The log group must also be in the same Region and account as the web ACL, which is already the case here.
    fr: |
      AWS WAF exige que le nom d'un groupe de journaux CloudWatch Logs utilisé pour les journaux d'une liste ACL web commence par aws-waf-logs-, suivi d'un suffixe quelconque. Le groupe de journaux doit aussi se trouver dans la même Région et le même compte que la liste ACL web, ce qui est déjà le cas ici.
  options:
    a:
      en: |
        The log group must be in the same Region as the web ACL, which is eu-west-1 for this regional web ACL; the name is what fails.
      fr: |
        Le groupe de journaux doit se trouver dans la même Région que la liste ACL web, soit eu-west-1 pour cette liste ACL web régionale ; c'est le nom qui pose problème.
    c:
      en: |
        Request sampling shows a sample of requests in the console; it does not change which log groups can receive logs.
      fr: |
        L'échantillonnage des requêtes affiche un échantillon de requêtes dans la console ; il ne change pas les groupes de journaux qui peuvent recevoir les journaux.
    d:
      en: |
        Subscription filters send events out of a log group to other services; they do not make AWS WAF deliver logs into it.
      fr: |
        Les filtres d'abonnement envoient des événements d'un groupe de journaux vers d'autres services ; ils ne font pas livrer les journaux d'AWS WAF dans ce groupe.
references:
  - title: Sending protection pack (web ACL) traffic logs to a Amazon CloudWatch Logs log group
    url: https://docs.aws.amazon.com/waf/latest/developerguide/logging-cw-logs.html
