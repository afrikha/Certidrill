id: soac03-5c-nfm-agent-setup
objective: "5.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A CloudOps engineer at AnyCompany has initialized Network Flow Monitor with a scope that includes the company's account and Region. The engineer must now get network flow metrics from a fleet of Amazon EC2 Linux instances that are managed by AWS Systems Manager. No Network Flow Monitor data appears yet.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Un ingénieur CloudOps d'AnyCompany a initialisé Network Flow Monitor avec une étendue (scope) qui inclut le compte et la Région de l'entreprise. L'ingénieur doit maintenant obtenir les métriques de flux réseau d'une flotte d'instances Amazon EC2 Linux gérées par AWS Systems Manager. Aucune donnée Network Flow Monitor n'apparaît encore.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the CloudWatch agent with a configuration that collects the TCP connection metrics of the instances.", fr: "Installer l'agent CloudWatch avec une configuration qui collecte les métriques de connexion TCP des instances." } }
    - { id: b, text: { en: "Attach the CloudWatchAgentServerPolicy managed policy to the IAM roles of the instances.", fr: "Associer la politique gérée CloudWatchAgentServerPolicy aux rôles IAM des instances." } }
    - { id: c, text: { en: "Attach the CloudWatchNetworkFlowMonitorAgentPublishPolicy managed policy to the IAM roles of the instances.", fr: "Associer la politique gérée CloudWatchNetworkFlowMonitorAgentPublishPolicy aux rôles IAM des instances." } }
    - { id: d, text: { en: "Turn on VPC Flow Logs for the subnets of the instances with Network Flow Monitor as the destination.", fr: "Activer les journaux de flux VPC pour les sous-réseaux des instances avec Network Flow Monitor comme destination." } }
    - { id: e, text: { en: "Install the Network Flow Monitor agent on the instances, for example with Systems Manager Distributor.", fr: "Installer l'agent Network Flow Monitor sur les instances, par exemple avec Systems Manager Distributor." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Network Flow Monitor gets its metrics from its own lightweight agents, which can be installed on EC2 instances with Systems Manager Distributor or other methods. The agents can send metrics only if the instance role has the CloudWatchNetworkFlowMonitorAgentPublishPolicy managed policy attached."
    fr: "Network Flow Monitor obtient ses métriques de ses propres agents légers, qui peuvent être installés sur les instances EC2 avec Systems Manager Distributor ou d'autres méthodes. Les agents ne peuvent envoyer de métriques que si le rôle de l'instance possède la politique gérée CloudWatchNetworkFlowMonitorAgentPublishPolicy."
  options:
    a:
      en: "The CloudWatch agent publishes system metrics and logs to CloudWatch; it does not send flow data to Network Flow Monitor."
      fr: "L'agent CloudWatch publie des métriques système et des journaux dans CloudWatch ; il n'envoie pas de données de flux à Network Flow Monitor."
    b:
      en: "This policy is for the CloudWatch agent; it does not give the Network Flow Monitor agent permission to publish to its backend."
      fr: "Cette politique est destinée à l'agent CloudWatch ; elle ne donne pas à l'agent Network Flow Monitor l'autorisation de publier vers son service."
    d:
      en: "Network Flow Monitor does not use flow logs; its TCP performance metrics come from the agents on the instances."
      fr: "Network Flow Monitor n'utilise pas les journaux de flux ; ses métriques de performances TCP proviennent des agents des instances."
references:
  - title: Configure permissions for agents
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-NetworkFlowMonitor-agents-ec2-permissions.html
  - title: Install and manage agents for EC2 instances
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-NetworkFlowMonitor-agents-ec2.html
