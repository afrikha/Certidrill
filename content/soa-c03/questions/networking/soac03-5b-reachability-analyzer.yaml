id: soac03-5b-reachability-analyzer
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application on an Amazon EC2 instance cannot connect to an Amazon RDS DB instance in another subnet of the same VPC. The path involves several route tables, network ACLs and security groups. A CloudOps engineer must identify which component blocks the path, without generating test traffic or installing software on the instance.

    Which solution will meet these requirements?
  fr: |
    Une application sur une instance Amazon EC2 ne parvient pas à se connecter à une instance de base de données Amazon RDS dans un autre sous-réseau du même VPC. Le chemin implique plusieurs tables de routage, ACL réseau et groupes de sécurité. Un ingénieur CloudOps doit identifier le composant qui bloque le chemin, sans générer de trafic de test ni installer de logiciel sur l'instance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create VPC flow logs for both subnets, and look for REJECT records between the two addresses.", fr: "Créer des journaux de flux VPC pour les deux sous-réseaux, et rechercher les enregistrements REJECT entre les deux adresses." }
    - id: b
      text: { en: "Configure VPC Traffic Mirroring from the instance to a packet analyzer.", fr: "Configurer la mise en miroir du trafic VPC (Traffic Mirroring) de l'instance vers un analyseur de paquets." }
    - id: c
      text: { en: "Run AWS Trusted Advisor security checks for the VPC.", fr: "Exécuter les vérifications de sécurité AWS Trusted Advisor pour le VPC." }
    - id: d
      text: { en: "Run a Reachability Analyzer analysis with the instance as the source and the DB instance as the destination.", fr: "Exécuter une analyse Reachability Analyzer avec l'instance comme source et l'instance de base de données comme destination." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Reachability Analyzer is a configuration analysis tool that tests connectivity between a source and a destination. When the destination is not reachable, it identifies the blocking component, such as a security group, network ACL or route table, without sending traffic or needing an agent.
    fr: |
      Reachability Analyzer est un outil d'analyse de configuration qui teste la connectivité entre une source et une destination. Lorsque la destination n'est pas joignable, il identifie le composant bloquant, par exemple un groupe de sécurité, une ACL réseau ou une table de routage, sans envoyer de trafic ni nécessiter d'agent.
  options:
    a:
      en: |
        Flow logs need real traffic to produce records, and a REJECT record does not say which rule or component rejected the packet.
      fr: |
        Les journaux de flux ont besoin de trafic réel pour produire des enregistrements, et un enregistrement REJECT n'indique pas quelle règle ni quel composant a rejeté le paquet.
    b:
      en: |
        Traffic Mirroring copies real packets to an analyzer; it requires traffic and a monitoring target, and it does not name the blocking component.
      fr: |
        La mise en miroir du trafic copie des paquets réels vers un analyseur ; elle nécessite du trafic et une cible de surveillance, et elle ne désigne pas le composant bloquant.
    c:
      en: |
        Trusted Advisor flags risky configurations such as open ports; it does not analyze the path between two resources.
      fr: |
        Trusted Advisor signale des configurations à risque, comme des ports ouverts ; il n'analyse pas le chemin entre deux ressources.
references:
  - title: What is Reachability Analyzer?
    url: https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html
