id: soac03-5a-eigw-replace-route
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs dual-stack Amazon EC2 instances in a private subnet. Because of a configuration error, the subnet's route table sends `::/0` to the VPC's internet gateway. A security review requires that hosts on the internet cannot start IPv6 connections to these instances, and the instances must keep outbound IPv6 access. A CloudOps engineer created an egress-only internet gateway and ran the following command, which fails because a route for `::/0` already exists.

    ```bash
    aws ec2 create-route --route-table-id rtb-0123456789abcdef0 \
      --destination-ipv6-cidr-block ::/0 \
      --egress-only-internet-gateway-id eigw-0a1b2c3d4e5f60789
    ```

    Which solution will meet these requirements with the LEAST disruption?
  fr: |
    Une entreprise exécute des instances Amazon EC2 à double pile (dual-stack) dans un sous-réseau privé. À la suite d'une erreur de configuration, la table de routage du sous-réseau envoie `::/0` vers la passerelle Internet du VPC. Un audit de sécurité exige que les hôtes d'Internet ne puissent pas ouvrir de connexions IPv6 vers ces instances, et les instances doivent conserver leur accès IPv6 sortant. Un ingénieur CloudOps a créé une passerelle Internet de sortie uniquement (egress-only internet gateway) et a exécuté la commande suivante, qui échoue parce qu'une route pour `::/0` existe déjà.

    ```bash
    aws ec2 create-route --route-table-id rtb-0123456789abcdef0 \
      --destination-ipv6-cidr-block ::/0 \
      --egress-only-internet-gateway-id eigw-0a1b2c3d4e5f60789
    ```

    Quelle solution répond à ces exigences avec le MOINS de perturbation possible ?
body:
  options:
    - id: a
      text: { en: "Detach the internet gateway from the VPC, and then run the same create-route command again.", fr: "Détacher la passerelle Internet du VPC, puis exécuter de nouveau la même commande create-route." }
    - id: b
      text: { en: "Add an inbound security group rule that denies all IPv6 traffic from ::/0 to the instances.", fr: "Ajouter une règle entrante de groupe de sécurité qui refuse tout le trafic IPv6 provenant de ::/0 vers les instances." }
    - id: c
      text: { en: "Run aws ec2 replace-route for ::/0 with the egress-only internet gateway ID as the new target.", fr: "Exécuter aws ec2 replace-route pour ::/0 avec l'ID de la passerelle Internet de sortie uniquement comme nouvelle cible." }
    - id: d
      text: { en: "Modify the subnet to stop assigning IPv6 addresses automatically to new network interfaces.", fr: "Modifier le sous-réseau pour qu'il n'attribue plus automatiquement d'adresses IPv6 aux nouvelles interfaces réseau." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A route table cannot send `::/0` to both an internet gateway and an egress-only internet gateway, so the existing route must be changed rather than added. `replace-route` swaps the target of the `::/0` route in one step. The egress-only internet gateway lets the instances start IPv6 connections and receive the responses, but it blocks connections that start on the internet.
    fr: |
      Une table de routage ne peut pas envoyer `::/0` à la fois vers une passerelle Internet et vers une passerelle Internet de sortie uniquement : il faut donc modifier la route existante au lieu d'en ajouter une. `replace-route` remplace la cible de la route `::/0` en une seule étape. La passerelle Internet de sortie uniquement permet aux instances d'ouvrir des connexions IPv6 et de recevoir les réponses, mais elle bloque les connexions initiées depuis Internet.
  options:
    a:
      en: |
        Detaching the internet gateway removes internet access from every public subnet of the VPC, which causes a wide outage that the requirement does not need.
      fr: |
        Détacher la passerelle Internet supprime l'accès Internet de tous les sous-réseaux publics du VPC, ce qui provoque une large interruption inutile.
    b:
      en: |
        Security groups support only allow rules. They cannot contain a deny rule.
      fr: |
        Les groupes de sécurité ne prennent en charge que des règles d'autorisation. Ils ne peuvent pas contenir de règle de refus.
    d:
      en: |
        This setting affects only new network interfaces. The existing instances keep their IPv6 addresses and stay reachable through the internet gateway route.
      fr: |
        Ce paramètre ne concerne que les nouvelles interfaces réseau. Les instances existantes gardent leurs adresses IPv6 et restent joignables par la route vers la passerelle Internet.
references:
  - title: Enable outbound IPv6 traffic using an egress-only internet gateway
    url: https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html
  - title: Add IPv6 support for your VPC
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-migrate-ipv6-add.html
