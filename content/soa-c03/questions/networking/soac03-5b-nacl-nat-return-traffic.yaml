id: soac03-5b-nacl-nat-return-traffic
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon EC2 instances in a private subnet download packages over HTTPS through a NAT gateway in a public subnet. After a custom network ACL is associated with the private subnet, the downloads time out. The network ACL has the following rules:

    ```text
    Inbound
    Rule  Type   Protocol  Port   Source           Allow/Deny
    100   SSH    TCP       22     172.16.0.0/16    ALLOW
    *     All    All       All    0.0.0.0/0        DENY

    Outbound
    Rule  Type   Protocol  Port   Destination      Allow/Deny
    100   All    All       All    0.0.0.0/0        ALLOW
    *     All    All       All    0.0.0.0/0        DENY
    ```

    Which change will resolve the issue?
  fr: |
    Des instances Amazon EC2 d'un sous-réseau privé téléchargent des paquets en HTTPS par une passerelle NAT située dans un sous-réseau public. Après l'association d'une ACL réseau personnalisée au sous-réseau privé, les téléchargements expirent. L'ACL réseau contient les règles suivantes :

    ```text
    Inbound
    Rule  Type   Protocol  Port   Source           Allow/Deny
    100   SSH    TCP       22     172.16.0.0/16    ALLOW
    *     All    All       All    0.0.0.0/0        DENY

    Outbound
    Rule  Type   Protocol  Port   Destination      Allow/Deny
    100   All    All       All    0.0.0.0/0        ALLOW
    *     All    All       All    0.0.0.0/0        DENY
    ```

    Quelle modification résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add an inbound rule to the network ACL that allows TCP port 443 from 0.0.0.0/0.", fr: "Ajouter à l'ACL réseau une règle entrante qui autorise le port TCP 443 depuis 0.0.0.0/0." }
    - id: b
      text: { en: "Add an inbound rule to the instances' security group that allows TCP ports 1024-65535 from 0.0.0.0/0.", fr: "Ajouter au groupe de sécurité des instances une règle entrante qui autorise les ports TCP 1024-65535 depuis 0.0.0.0/0." }
    - id: c
      text: { en: "Add an inbound rule to the network ACL that allows TCP ports 1024-65535 from 0.0.0.0/0.", fr: "Ajouter à l'ACL réseau une règle entrante qui autorise les ports TCP 1024-65535 depuis 0.0.0.0/0." }
    - id: d
      text: { en: "Associate the same custom network ACL with the public subnet of the NAT gateway.", fr: "Associer la même ACL réseau personnalisée au sous-réseau public de la passerelle NAT." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Network ACLs are stateless. The HTTPS responses come back from port 443 to the ephemeral source ports that the instances opened, and the inbound rules deny them. An inbound rule for TCP 1024-65535 from 0.0.0.0/0 lets the return traffic in, because the responses keep the internet server's address as their source after the NAT gateway.
    fr: |
      Les ACL réseau sont sans état. Les réponses HTTPS reviennent du port 443 vers les ports sources éphémères ouverts par les instances, et les règles entrantes les refusent. Une règle entrante pour TCP 1024-65535 depuis 0.0.0.0/0 laisse entrer le trafic de retour, car les réponses gardent l'adresse du serveur Internet comme source après la passerelle NAT.
  options:
    a:
      en: |
        The responses are addressed to the instances' ephemeral ports, not to port 443, so this rule does not match them.
      fr: |
        Les réponses sont adressées aux ports éphémères des instances, pas au port 443 : cette règle ne les couvre pas.
    b:
      en: |
        Security groups are stateful and already allow responses to outbound connections; the block is in the network ACL.
      fr: |
        Les groupes de sécurité sont avec état et autorisent déjà les réponses aux connexions sortantes ; le blocage se trouve dans l'ACL réseau.
    d:
      en: |
        The same rules would also block the return traffic at the NAT gateway's subnet and break more traffic.
      fr: |
        Les mêmes règles bloqueraient aussi le trafic de retour dans le sous-réseau de la passerelle NAT et casseraient davantage de trafic.
references:
  - title: Control subnet traffic with network access control lists
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
