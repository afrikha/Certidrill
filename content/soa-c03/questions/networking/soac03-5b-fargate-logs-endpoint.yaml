id: soac03-5b-fargate-logs-endpoint
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs Amazon ECS tasks on AWS Fargate in private subnets of a VPC that has no internet gateway and no NAT gateway. The tasks pull their images through interface VPC endpoints for Amazon ECR and a gateway endpoint for Amazon S3. The task definition sends container logs to Amazon CloudWatch Logs with the awslogs log driver, and the task execution role has the required CloudWatch Logs permissions. The tasks stop during startup with a ResourceInitializationError that reports a timeout while the logger is being set up.

    Which solution will resolve the issue?
  fr: |
    Une entreprise exécute des tâches Amazon ECS sur AWS Fargate dans des sous-réseaux privés d'un VPC qui n'a ni passerelle Internet ni passerelle NAT. Les tâches extraient leurs images par des points de terminaison de VPC d'interface pour Amazon ECR et un point de terminaison de type passerelle pour Amazon S3. La définition de tâche envoie les journaux des conteneurs vers Amazon CloudWatch Logs avec le pilote de journalisation awslogs, et le rôle d'exécution de tâche possède les autorisations CloudWatch Logs nécessaires. Les tâches s'arrêtent au démarrage avec une erreur ResourceInitializationError qui signale un délai dépassé pendant la configuration du journaliseur.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add the logs:CreateLogStream and logs:PutLogEvents permissions to the task role of the containers.", fr: "Ajouter les autorisations logs:CreateLogStream et logs:PutLogEvents au rôle de tâche des conteneurs." }
    - id: b
      text: { en: "Create a gateway VPC endpoint for CloudWatch Logs, and add it to the route tables of the private subnets.", fr: "Créer un point de terminaison de VPC de type passerelle pour CloudWatch Logs, et l'ajouter aux tables de routage des sous-réseaux privés." }
    - id: c
      text: { en: "Create an interface VPC endpoint for CloudWatch Logs with private DNS enabled in the task subnets, and allow HTTPS from the tasks in its security group.", fr: "Créer un point de terminaison de VPC d'interface pour CloudWatch Logs avec le DNS privé activé dans les sous-réseaux des tâches, et autoriser le HTTPS depuis les tâches dans son groupe de sécurité." }
    - id: d
      text: { en: "Change the log driver to awsfirelens, and send the logs to CloudWatch Logs through a Fluent Bit sidecar container.", fr: "Remplacer le pilote de journalisation par awsfirelens, et envoyer les journaux vers CloudWatch Logs par un conteneur annexe (sidecar) Fluent Bit." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a VPC has no internet gateway and tasks use the awslogs driver, an interface VPC endpoint for CloudWatch Logs is required. With private DNS enabled, the logs endpoint name resolves to the endpoint's private addresses, and its security group must allow HTTPS from the tasks. The ECR and S3 endpoints cover only the image pull.
    fr: |
      Lorsqu'un VPC n'a pas de passerelle Internet et que les tâches utilisent le pilote awslogs, un point de terminaison de VPC d'interface pour CloudWatch Logs est nécessaire. Avec le DNS privé activé, le nom du point de terminaison de CloudWatch Logs se résout en adresses privées du point de terminaison, dont le groupe de sécurité doit autoriser le HTTPS depuis les tâches. Les points de terminaison ECR et S3 ne couvrent que l'extraction des images.
  options:
    a:
      en: |
        The awslogs driver uses the task execution role, which already has the permissions, and the error is a network timeout, not an authorization failure.
      fr: |
        Le pilote awslogs utilise le rôle d'exécution de tâche, qui possède déjà les autorisations, et l'erreur est un délai réseau dépassé, pas un refus d'autorisation.
    b:
      en: |
        Gateway endpoints exist only for Amazon S3 and DynamoDB; CloudWatch Logs is reached through an interface endpoint.
      fr: |
        Les points de terminaison de type passerelle n'existent que pour Amazon S3 et DynamoDB ; CloudWatch Logs se joint par un point de terminaison d'interface.
    d:
      en: |
        Fluent Bit still needs a network path to the CloudWatch Logs endpoint, so the timeout remains.
      fr: |
        Fluent Bit a toujours besoin d'un chemin réseau vers le point de terminaison de CloudWatch Logs : le délai dépassé demeure.
references:
  - title: Amazon ECS interface VPC endpoints (AWS PrivateLink)
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/vpc-endpoints.html
  - title: Send Amazon ECS logs to CloudWatch
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/using_awslogs.html
