id: soac03-5b-alb-logs-sse-kms
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A CloudOps engineer enables access logs for an Application Load Balancer in account 111122223333 and selects an Amazon S3 bucket named alb-logs-example in the same Region. The operation fails with an access denied error for the bucket. The bucket has the following bucket policy, and its default encryption uses SSE-KMS with a customer managed AWS KMS key.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "Service": "logdelivery.elasticloadbalancing.amazonaws.com" },
          "Action": "s3:PutObject",
          "Resource": "arn:aws:s3:::alb-logs-example/AWSLogs/111122223333/*"
        }
      ]
    }
    ```

    Which change will allow the access logs to be delivered?
  fr: |
    Un ingénieur CloudOps active les journaux d'accès d'un Application Load Balancer dans le compte 111122223333 et sélectionne un compartiment Amazon S3 nommé alb-logs-example dans la même Région. L'opération échoue avec une erreur d'accès refusé pour le compartiment. Le compartiment possède la politique de compartiment suivante, et son chiffrement par défaut utilise SSE-KMS avec une clé AWS KMS gérée par le client.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": { "Service": "logdelivery.elasticloadbalancing.amazonaws.com" },
          "Action": "s3:PutObject",
          "Resource": "arn:aws:s3:::alb-logs-example/AWSLogs/111122223333/*"
        }
      ]
    }
    ```

    Quelle modification permettra de livrer les journaux d'accès ?
body:
  options:
    - id: a
      text: { en: "Change the default encryption of the bucket to SSE-S3.", fr: "Modifier le chiffrement par défaut du compartiment en SSE-S3." }
    - id: b
      text: { en: "Add a statement to the KMS key policy that allows logdelivery.elasticloadbalancing.amazonaws.com to use the key.", fr: "Ajouter à la politique de la clé KMS une instruction qui autorise logdelivery.elasticloadbalancing.amazonaws.com à utiliser la clé." }
    - id: c
      text: { en: "Replace the service principal with the Elastic Load Balancing account ID of the Region.", fr: "Remplacer le principal de service par l'ID de compte Elastic Load Balancing de la Région." }
    - id: d
      text: { en: "Change the resource of the policy to arn:aws:s3:::alb-logs-example/*.", fr: "Modifier la ressource de la politique en arn:aws:s3:::alb-logs-example/*." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The bucket policy is the recommended one: it grants s3:PutObject to the log delivery service principal on the AWSLogs/account-ID path. However, ALB access logs support only SSE-S3 for server-side encryption, so a bucket that encrypts with SSE-KMS causes the access denied error.
    fr: |
      La politique de compartiment est celle qui est recommandée : elle accorde s3:PutObject au principal de service de livraison des journaux sur le chemin AWSLogs/ID-de-compte. Cependant, les journaux d'accès d'ALB ne prennent en charge que SSE-S3 pour le chiffrement côté serveur : un compartiment qui chiffre avec SSE-KMS provoque l'erreur d'accès refusé.
  options:
    b:
      en: |
        SSE-KMS is not supported for ALB access logs, so key permissions do not fix the delivery.
      fr: |
        SSE-KMS n'est pas pris en charge pour les journaux d'accès d'ALB : des autorisations sur la clé ne corrigent pas la livraison.
    c:
      en: |
        The Region-specific account policy is the legacy form; the service principal policy is the recommended one and is already correct.
      fr: |
        La politique avec l'ID de compte propre à la Région est la forme historique ; la politique avec principal de service est la forme recommandée et elle est déjà correcte.
    d:
      en: |
        The path already matches the delivery location, and AWS recommends keeping the account ID in the resource so that only this account's load balancers can write.
      fr: |
        Le chemin correspond déjà à l'emplacement de livraison, et AWS recommande de garder l'ID de compte dans la ressource pour que seuls les équilibreurs de charge de ce compte puissent écrire.
references:
  - title: Enable access logs for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/enable-access-logging.html
