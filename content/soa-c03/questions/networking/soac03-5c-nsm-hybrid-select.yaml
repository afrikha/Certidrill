id: soac03-5c-nsm-hybrid-select
objective: "5.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs applications in a VPC that call servers in its data center over AWS Direct Connect. Users report slow responses at random times. The operations team must continuously measure the round-trip time and packet loss between subnets of the VPC and specific on-premises IP addresses, and must learn whether a degradation is inside the AWS network. The team must not install agents on any server.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute dans un VPC des applications qui appellent des serveurs de son centre de données par AWS Direct Connect. Les utilisateurs signalent des réponses lentes à des moments aléatoires. L'équipe d'exploitation doit mesurer en continu le temps aller-retour et la perte de paquets entre des sous-réseaux du VPC et des adresses IP précises sur site, et doit savoir si une dégradation se situe dans le réseau AWS. L'équipe ne doit installer d'agent sur aucun serveur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Network Synthetic Monitor monitor with probes from the VPC subnets to the on-premises IP addresses.", fr: "Créer un moniteur Network Synthetic Monitor avec des sondes allant des sous-réseaux du VPC vers les adresses IP sur site." } }
    - { id: b, text: { en: "Create an Internet Monitor monitor that includes the VPC and review its performance and availability scores.", fr: "Créer un moniteur Internet Monitor qui inclut le VPC et consulter ses scores de performances et de disponibilité." } }
    - { id: c, text: { en: "Create a Network Flow Monitor monitor for the VPC subnets and review the TCP retransmissions of the flows.", fr: "Créer un moniteur Network Flow Monitor pour les sous-réseaux du VPC et consulter les retransmissions TCP des flux." } }
    - { id: d, text: { en: "Turn on VPC Flow Logs for the subnets and query the records with CloudWatch Logs Insights.", fr: "Activer les journaux de flux VPC pour les sous-réseaux et interroger les enregistrements avec CloudWatch Logs Insights." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Network Synthetic Monitor sends ICMP or TCP probes from a VPC subnet to on-premises destination IP addresses and publishes round-trip time and packet loss to CloudWatch, without agents. For paths through Direct Connect, its network health indicator shows whether a degradation is within the AWS network."
    fr: "Network Synthetic Monitor envoie des sondes ICMP ou TCP depuis un sous-réseau du VPC vers des adresses IP de destination sur site et publie le temps aller-retour et la perte de paquets dans CloudWatch, sans agent. Pour les chemins via Direct Connect, son indicateur de santé du réseau (NHI) montre si une dégradation se situe dans le réseau AWS."
  options:
    b:
      en: "Internet Monitor measures internet traffic between the application and its users, not the Direct Connect path to the data center."
      fr: "Internet Monitor mesure le trafic Internet entre l'application et ses utilisateurs, pas le chemin Direct Connect vers le centre de données."
    c:
      en: "Network Flow Monitor collects its metrics with agents that must be installed on the instances, which the team must not do."
      fr: "Network Flow Monitor collecte ses métriques avec des agents à installer sur les instances, ce que l'équipe ne doit pas faire."
    d:
      en: "Flow log records describe accepted and rejected IP traffic; they do not measure round-trip time or packet loss."
      fr: "Les enregistrements de journaux de flux décrivent le trafic IP accepté et rejeté ; ils ne mesurent ni le temps aller-retour ni la perte de paquets."
references:
  - title: Using Network Synthetic Monitor
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/what-is-network-monitor.html
  - title: Network Monitoring
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Network-Monitoring-Sections.html
