id: soac03-5c-cf-refreshhit-ttl
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An online store serves product images from an Amazon S3 origin through an Amazon CloudFront distribution. The cache policy has a minimum TTL of 0 seconds, a default TTL of 86,400 seconds, and a maximum TTL of 31,536,000 seconds, and its cache key includes no query strings, headers or cookies. Each image object has the metadata `Cache-Control: max-age=30`. Images change at most once a week, and an image that is up to 1 day old is acceptable. The CloudFront standard logs contain many records like the following:

    ```text
    cs-uri-stem        sc-status  x-edge-result-type  time-taken
    /img/p/1042.jpg    200        RefreshHit          0.081
    /img/p/2210.jpg    200        RefreshHit          0.092
    /img/p/1042.jpg    200        Hit                 0.002
    /img/p/1042.jpg    200        RefreshHit          0.079
    ```

    The company wants to reduce the number of requests that CloudFront sends to the origin.

    Which solution will meet these requirements?
  fr: |
    Une boutique en ligne sert des images de produits depuis une origine Amazon S3 via une distribution Amazon CloudFront. La politique de cache a une durée de vie (TTL) minimale de 0 seconde, un TTL par défaut de 86 400 secondes et un TTL maximal de 31 536 000 secondes, et sa clé de cache n'inclut ni chaînes de requête, ni en-têtes, ni cookies. Chaque objet image possède les métadonnées `Cache-Control: max-age=30`. Les images changent au plus une fois par semaine, et une image vieille de jusqu'à 1 jour est acceptable. Les journaux standard de CloudFront contiennent de nombreux enregistrements comme les suivants :

    ```text
    cs-uri-stem        sc-status  x-edge-result-type  time-taken
    /img/p/1042.jpg    200        RefreshHit          0.081
    /img/p/2210.jpg    200        RefreshHit          0.092
    /img/p/1042.jpg    200        Hit                 0.002
    /img/p/1042.jpg    200        RefreshHit          0.079
    ```

    L'entreprise veut réduire le nombre de demandes que CloudFront envoie à l'origine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the default TTL of the cache policy to 604,800 seconds and keep the object metadata.", fr: "Définir le TTL par défaut de la politique de cache à 604 800 secondes et conserver les métadonnées des objets." } }
    - { id: b, text: { en: "Turn on the additional distribution metrics and track the cache hit rate of the distribution.", fr: "Activer les métriques supplémentaires de la distribution et suivre le taux d'accès au cache de la distribution." } }
    - { id: c, text: { en: "Change the cache key so that it includes the Accept-Encoding header and the If-None-Match header.", fr: "Modifier la clé de cache pour qu'elle inclue l'en-tête Accept-Encoding et l'en-tête If-None-Match." } }
    - { id: d, text: { en: "Change the Cache-Control metadata of the image objects to max-age=86400.", fr: "Remplacer les métadonnées Cache-Control des objets image par max-age=86400." } }
answer: { optionId: d }
explanation:
  correct:
    en: "RefreshHit means that the edge location had the object, but it had expired, so CloudFront asked the origin to confirm it. The object metadata sets max-age=30, and with a minimum TTL of 0 CloudFront honors it, so images expire every 30 seconds. A max-age of 86,400 seconds keeps the images fresh at the edge for 1 day, which removes most origin requests."
    fr: "RefreshHit signifie que l'emplacement périphérique avait l'objet, mais qu'il avait expiré : CloudFront a donc demandé à l'origine de le confirmer. Les métadonnées de l'objet définissent max-age=30 et, avec un TTL minimal de 0, CloudFront les respecte : les images expirent toutes les 30 secondes. Un max-age de 86 400 secondes garde les images valides en périphérie pendant 1 jour, ce qui supprime la plupart des demandes à l'origine."
  options:
    a:
      en: "CloudFront uses the default TTL only for objects that have no Cache-Control or Expires header, so these images still expire after 30 seconds."
      fr: "CloudFront n'utilise le TTL par défaut que pour les objets sans en-tête Cache-Control ni Expires : ces images expirent donc toujours après 30 secondes."
    b:
      en: "Additional metrics only report the cache hit rate; they do not change how long objects stay in the cache."
      fr: "Les métriques supplémentaires ne font que mesurer le taux d'accès au cache ; elles ne changent pas la durée pendant laquelle les objets restent en cache."
    c:
      en: "Adding headers to the cache key creates more cache entries and lowers the hit ratio; the records show that the objects are found but expired."
      fr: "Ajouter des en-têtes à la clé de cache crée davantage d'entrées et réduit le taux d'accès ; les enregistrements montrent que les objets sont trouvés mais expirés."
references:
  - title: Standard logging reference
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/standard-logs-reference.html
  - title: Manage how long content stays in the cache (expiration)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html
