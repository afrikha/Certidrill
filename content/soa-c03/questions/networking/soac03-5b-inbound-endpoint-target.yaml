id: soac03-5b-inbound-endpoint-target
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company connects its data center to a VPC through an AWS Site-to-Site VPN connection. The VPC uses the 10.20.0.0/16 CIDR block, and an Amazon Route 53 private hosted zone named app.example.internal is associated with the VPC. The on-premises DNS servers must resolve the records of this zone by using a conditional forwarder.

    Which solution will meet these requirements?
  fr: |
    Une entreprise relie son centre de données à un VPC par une connexion AWS Site-to-Site VPN. Le VPC utilise le bloc d'adresse CIDR 10.20.0.0/16, et une zone hébergée privée Amazon Route 53 nommée app.example.internal est associée au VPC. Les serveurs DNS sur site doivent résoudre les enregistrements de cette zone à l'aide d'un redirecteur conditionnel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a Route 53 VPC Resolver outbound endpoint in the VPC, and forward app.example.internal queries from the on-premises DNS servers to the endpoint's IP addresses.", fr: "Créer un point de terminaison sortant Route 53 VPC Resolver dans le VPC, et transférer les requêtes app.example.internal des serveurs DNS sur site vers les adresses IP du point de terminaison." }
    - id: b
      text: { en: "Forward app.example.internal queries from the on-premises DNS servers to 10.20.0.2, the Amazon DNS server address of the VPC.", fr: "Transférer les requêtes app.example.internal des serveurs DNS sur site vers 10.20.0.2, l'adresse du serveur DNS Amazon du VPC." }
    - id: c
      text: { en: "Create a Route 53 VPC Resolver inbound endpoint in the VPC, and forward app.example.internal queries from the on-premises DNS servers to the endpoint's IP addresses.", fr: "Créer un point de terminaison entrant Route 53 VPC Resolver dans le VPC, et transférer les requêtes app.example.internal des serveurs DNS sur site vers les adresses IP du point de terminaison." }
    - id: d
      text: { en: "Forward app.example.internal queries from the on-premises DNS servers to 169.254.169.253, the link-local address of the Amazon DNS server.", fr: "Transférer les requêtes app.example.internal des serveurs DNS sur site vers 169.254.169.253, l'adresse de lien local du serveur DNS Amazon." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An inbound endpoint gives the VPC Resolver private IP addresses in the VPC that on-premises DNS resolvers can reach over the VPN or AWS Direct Connect. The on-premises conditional forwarder sends app.example.internal queries to those addresses, and the VPC Resolver answers them from the private hosted zone associated with the VPC.
    fr: |
      Un point de terminaison entrant donne au VPC Resolver des adresses IP privées dans le VPC, que les résolveurs DNS sur site peuvent joindre par le VPN ou AWS Direct Connect. Le redirecteur conditionnel sur site envoie les requêtes app.example.internal vers ces adresses, et le VPC Resolver y répond à partir de la zone hébergée privée associée au VPC.
  options:
    a:
      en: |
        An outbound endpoint carries queries in the other direction, from the VPC to resolvers on the company's network. Its IP addresses are the sources of forwarded queries; they do not accept queries from on premises.
      fr: |
        Un point de terminaison sortant achemine les requêtes dans l'autre sens, du VPC vers les résolveurs du réseau de l'entreprise. Ses adresses IP sont la source des requêtes transférées ; elles n'acceptent pas de requêtes venant du site.
    b:
      en: |
        The VPC+2 address serves resources inside the VPC. Queries that arrive from an on-premises network need an inbound endpoint; that is the purpose of the feature.
      fr: |
        L'adresse VPC+2 sert les ressources situées dans le VPC. Les requêtes qui arrivent d'un réseau sur site ont besoin d'un point de terminaison entrant : c'est précisément le rôle de cette fonctionnalité.
    d:
      en: |
        A link-local address is reachable only from the instance itself; it cannot be routed over a VPN connection from the data center.
      fr: |
        Une adresse de lien local n'est joignable que depuis l'instance elle-même ; elle ne peut pas être routée depuis le centre de données par une connexion VPN.
references:
  - title: Values that you specify when you create or edit inbound endpoints
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-forwarding-inbound-queries-values.html
  - title: What is Route 53 VPC Resolver?
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver.html
