id: soac03-5c-client-vpn-intermittent
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company gives remote employees access to a VPC through an AWS Client VPN endpoint. The endpoint is associated with subnet A and subnet B in two Availability Zones, and the route table of each subnet has a 0.0.0.0/0 route to a NAT gateway. An authorization rule allows all users to access 0.0.0.0/0. The Client VPN endpoint route table contains the routes for the VPC CIDR block to both subnets and one 0.0.0.0/0 route that targets subnet A. Some employees cannot reach the internet until they disconnect and reconnect, but resources in the VPC always work. All internet traffic from remote employees must pass through the VPC.

    Which solution will meet these requirements?
  fr: |
    Une entreprise donne aux employés distants l'accès à un VPC par un point de terminaison AWS Client VPN. Le point de terminaison est associé au sous-réseau A et au sous-réseau B, dans deux zones de disponibilité, et la table de routage de chaque sous-réseau possède une route 0.0.0.0/0 vers une passerelle NAT. Une règle d'autorisation permet à tous les utilisateurs d'accéder à 0.0.0.0/0. La table de routage du point de terminaison Client VPN contient les routes du bloc d'adresses CIDR du VPC vers les deux sous-réseaux et une seule route 0.0.0.0/0 qui cible le sous-réseau A. Certains employés ne peuvent pas joindre Internet tant qu'ils ne se déconnectent pas et ne se reconnectent pas, mais les ressources du VPC fonctionnent toujours. Tout le trafic Internet des employés distants doit passer par le VPC.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a second authorization rule for 0.0.0.0/0 that applies to the association with subnet B.", fr: "Ajouter une deuxième règle d'autorisation pour 0.0.0.0/0 qui s'applique à l'association avec le sous-réseau B." } }
    - { id: b, text: { en: "Add a 0.0.0.0/0 route that targets subnet B to the route table of the Client VPN endpoint.", fr: "Ajouter à la table de routage du point de terminaison Client VPN une route 0.0.0.0/0 qui cible le sous-réseau B." } }
    - { id: c, text: { en: "Turn on split-tunnel on the Client VPN endpoint so that clients keep their local default route.", fr: "Activer le tunnel partagé (split-tunnel) sur le point de terminaison Client VPN pour que les clients conservent leur route par défaut locale." } }
    - { id: d, text: { en: "Add the mssfix 1328 directive to the Client VPN configuration file of every employee.", fr: "Ajouter la directive mssfix 1328 au fichier de configuration Client VPN de chaque employé." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Clients connect through any associated subnet, chosen by DNS round robin. Employees whose connection lands on subnet B have no 0.0.0.0/0 route through that subnet, so they lose internet access until a reconnection lands on subnet A. Adding the same 0.0.0.0/0 route for each associated subnet gives every client the same routes."
    fr: "Les clients se connectent par n'importe quel sous-réseau associé, choisi par tourniquet DNS (round robin). Les employés dont la connexion arrive sur le sous-réseau B n'ont pas de route 0.0.0.0/0 par ce sous-réseau : ils perdent l'accès à Internet jusqu'à ce qu'une reconnexion arrive sur le sous-réseau A. Ajouter la même route 0.0.0.0/0 pour chaque sous-réseau associé donne les mêmes routes à tous les clients."
  options:
    a:
      en: "Authorization rules apply to destination networks for users or groups, not to a subnet association, and the existing rule already authorizes 0.0.0.0/0."
      fr: "Les règles d'autorisation s'appliquent à des réseaux de destination pour des utilisateurs ou des groupes, pas à une association de sous-réseau, et la règle existante autorise déjà 0.0.0.0/0."
    c:
      en: "Split-tunnel would send internet traffic directly from the employees' devices, which breaks the requirement that it passes through the VPC."
      fr: "Le tunnel partagé enverrait le trafic Internet directement depuis les appareils des employés, ce qui ne respecte pas l'exigence de passage par le VPC."
    d:
      en: "mssfix addresses packet size problems that affect every connection; it does not explain failures that depend on the subnet the client lands on."
      fr: "mssfix corrige des problèmes de taille de paquets qui touchent toutes les connexions ; il n'explique pas des échecs qui dépendent du sous-réseau sur lequel arrive le client."
references:
  - title: "Troubleshooting AWS Client VPN: Access to a peered VPC, Amazon S3, or the internet is intermittent"
    url: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/intermittent-access.html
