id: soac03-5b-share-resolver-rules
objective: "5.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. A networking account owns a Route 53 VPC Resolver outbound endpoint and forwarding rules that send queries for on-premises domains to the data center. Thirty workload accounts in an organizational unit (OU) own VPCs in the same Region. The workload VPCs must use the same forwarding rules. The company wants to use AWS RAM and does not want to create Resolver endpoints in the workload accounts.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise AWS Organizations. Un compte réseau possède un point de terminaison sortant Route 53 VPC Resolver et des règles de transfert qui envoient au centre de données les requêtes pour les domaines sur site. Trente comptes de charge de travail d'une unité d'organisation (OU) possèdent des VPC dans la même Région. Les VPC de charge de travail doivent utiliser les mêmes règles de transfert. L'entreprise veut utiliser AWS RAM et ne veut pas créer de points de terminaison Resolver dans les comptes de charge de travail.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the networking account, share the forwarding rules with the OU by using AWS RAM.", fr: "Dans le compte réseau, partager les règles de transfert avec l'OU à l'aide d'AWS RAM." } }
    - { id: b, text: { en: "In each workload account, edit the shared rules to use a new outbound endpoint in the account's VPC.", fr: "Dans chaque compte de charge de travail, modifier les règles partagées pour utiliser un nouveau point de terminaison sortant dans le VPC du compte." } }
    - { id: c, text: { en: "In each workload account, create a DHCP options set that points to the IP addresses of the outbound endpoint.", fr: "Dans chaque compte de charge de travail, créer un ensemble d'options DHCP qui pointe vers les adresses IP du point de terminaison sortant." } }
    - { id: d, text: { en: "In each workload account, associate the shared forwarding rules with the account's VPCs.", fr: "Dans chaque compte de charge de travail, associer les règles de transfert partagées aux VPC du compte." } }
    - { id: e, text: { en: "In the networking account, associate the forwarding rules with the VPC IDs of the workload accounts without sharing them.", fr: "Dans le compte réseau, associer les règles de transfert aux ID des VPC des comptes de charge de travail sans les partager." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Resolver rules can be shared with accounts, OUs or the whole organization through AWS RAM. Each account that receives the rules then associates them with its own VPCs, exactly as it would associate its own rules. The queries still leave through the outbound endpoint that the rule owner configured, so no endpoint is needed in the workload accounts.
    fr: |
      Les règles Resolver peuvent être partagées avec des comptes, des OU ou toute l'organisation par AWS RAM. Chaque compte qui reçoit les règles les associe ensuite à ses propres VPC, exactement comme il associerait ses propres règles. Les requêtes sortent toujours par le point de terminaison sortant configuré par le propriétaire de la règle : aucun point de terminaison n'est nécessaire dans les comptes de charge de travail.
  options:
    b:
      en: |
        An account that receives a shared rule cannot change or delete it, and the company does not want endpoints in the workload accounts.
      fr: |
        Un compte qui reçoit une règle partagée ne peut ni la modifier ni la supprimer, et l'entreprise ne veut pas de points de terminaison dans les comptes de charge de travail.
    c:
      en: |
        Outbound endpoint addresses are the sources of forwarded queries; they are not DNS servers that instances can query.
      fr: |
        Les adresses d'un point de terminaison sortant sont la source des requêtes transférées ; ce ne sont pas des serveurs DNS que les instances peuvent interroger.
    e:
      en: |
        A rule can be associated only with VPCs of the account that uses it; other accounts must receive the rule through AWS RAM first.
      fr: |
        Une règle ne peut être associée qu'aux VPC du compte qui l'utilise ; les autres comptes doivent d'abord recevoir la règle par AWS RAM.
references:
  - title: Managing forwarding rules
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-rules-managing.html
