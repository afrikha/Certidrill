id: soac03-5c-cf-error-caching-ttl
objective: "5.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon CloudFront distribution at AnyCompany has a custom error response for HTTP 503 that returns `/errors/maintenance.html` with an error caching minimum TTL of 600 seconds. The origin does not send Cache-Control headers with its error responses. After a 2-minute origin outage, some viewers keep receiving the maintenance page for up to 10 minutes. The company wants to keep the maintenance page during outages and wants viewers to receive normal pages within about 10 seconds after the origin recovers, without any manual action.

    Which solution will meet these requirements?
  fr: |
    Une distribution Amazon CloudFront d'AnyCompany possède une réponse d'erreur personnalisée pour HTTP 503 qui renvoie `/errors/maintenance.html`, avec une durée de vie (TTL) minimale de mise en cache des erreurs de 600 secondes. L'origine n'envoie pas d'en-tête Cache-Control avec ses réponses d'erreur. Après une panne de l'origine de 2 minutes, certains utilisateurs continuent de recevoir la page de maintenance pendant jusqu'à 10 minutes. L'entreprise veut conserver la page de maintenance pendant les pannes et veut que les utilisateurs reçoivent les pages normales environ 10 secondes après le rétablissement de l'origine, sans aucune action manuelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the error caching minimum TTL of the 503 custom error response to 10 seconds.", fr: "Définir à 10 secondes le TTL minimal de mise en cache des erreurs de la réponse d'erreur personnalisée 503." } }
    - { id: b, text: { en: "Create an invalidation for the /* path each time that the origin recovers.", fr: "Créer une invalidation pour le chemin /* chaque fois que l'origine est rétablie." } }
    - { id: c, text: { en: "Set the default TTL of the cache policy of each cache behavior to 10 seconds.", fr: "Définir à 10 secondes le TTL par défaut de la politique de cache de chaque comportement de cache." } }
    - { id: d, text: { en: "Configure the origin to return Cache-Control: max-age=10 with its 503 error responses.", fr: "Configurer l'origine pour qu'elle renvoie Cache-Control: max-age=10 avec ses réponses d'erreur 503." } }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudFront caches a 503 response, or its custom error page, for the longer of the error caching minimum TTL and any max-age or s-maxage that the origin returned. The origin sends no Cache-Control header, so lowering the error caching minimum TTL to 10 seconds makes CloudFront retry the origin every 10 seconds while keeping the maintenance page."
    fr: "CloudFront met en cache une réponse 503, ou sa page d'erreur personnalisée, pendant la plus longue des durées entre le TTL minimal de mise en cache des erreurs et un éventuel max-age ou s-maxage renvoyé par l'origine. L'origine n'envoie pas d'en-tête Cache-Control : abaisser ce TTL à 10 secondes fait réessayer l'origine toutes les 10 secondes tout en conservant la page de maintenance."
  options:
    b:
      en: "An invalidation removes the cached error, but it is a manual action after every outage, which the company wants to avoid."
      fr: "Une invalidation supprime l'erreur en cache, mais c'est une action manuelle après chaque panne, ce que l'entreprise veut éviter."
    c:
      en: "The default TTL controls normal objects that have no caching headers; cached error responses follow the error caching minimum TTL."
      fr: "Le TTL par défaut s'applique aux objets normaux sans en-têtes de mise en cache ; les réponses d'erreur en cache suivent le TTL minimal de mise en cache des erreurs."
    d:
      en: "CloudFront caches an error for the longer of the error caching minimum TTL and the origin max-age, so the error is still cached for 600 seconds."
      fr: "CloudFront met une erreur en cache pendant la plus longue des durées entre le TTL minimal de mise en cache des erreurs et le max-age de l'origine : l'erreur reste donc en cache 600 secondes."
references:
  - title: How CloudFront processes HTTP 4xx and 5xx status codes from your origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HTTPStatusCodes.html
