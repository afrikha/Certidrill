id: soac03-5a-gwep-route-table
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A VPC has private subnets in two Availability Zones, and each zone's private subnets use their own route table. A CloudOps engineer created a gateway VPC endpoint for Amazon S3 and associated it with the route table of zone A. VPC flow logs show that instances in zone B still send their S3 traffic through the NAT gateway. The endpoint policy allows full access.

    Which solution will make the zone B instances use the gateway endpoint?
  fr: |
    Un VPC possède des sous-réseaux privés dans deux zones de disponibilité, et les sous-réseaux privés de chaque zone utilisent leur propre table de routage. Un ingénieur CloudOps a créé un point de terminaison de VPC de passerelle pour Amazon S3 et l'a associé à la table de routage de la zone A. Les journaux de flux VPC montrent que les instances de la zone B envoient toujours leur trafic S3 par la passerelle NAT. La politique du point de terminaison autorise un accès complet.

    Quelle solution permet aux instances de la zone B d'utiliser le point de terminaison de passerelle ?
body:
  options:
    - id: a
      text: { en: "Modify the endpoint to add the private subnets of zone B to its list of subnets.", fr: "Modifier le point de terminaison pour ajouter les sous-réseaux privés de la zone B à sa liste de sous-réseaux." }
    - id: b
      text: { en: "Modify the endpoint to associate it with the route table of zone B as well.", fr: "Modifier le point de terminaison pour l'associer également à la table de routage de la zone B." }
    - id: c
      text: { en: "Turn on private DNS for the gateway endpoint so that S3 names resolve to it.", fr: "Activer le DNS privé du point de terminaison de passerelle pour que les noms S3 se résolvent vers lui." }
    - id: d
      text: { en: "Update the endpoint policy to allow requests from the CIDR blocks of zone B.", fr: "Mettre à jour la politique du point de terminaison pour autoriser les requêtes des blocs CIDR de la zone B." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A gateway endpoint works through route tables. When a route table is associated with the endpoint, AWS adds a route whose destination is the S3 prefix list and whose target is the endpoint. The zone B route table has no such route, so its S3 traffic follows the default route to the NAT gateway until that route table is associated.
    fr: |
      Un point de terminaison de passerelle fonctionne par les tables de routage. Lorsqu'une table de routage est associée au point de terminaison, AWS ajoute une route dont la destination est la liste de préfixes S3 et dont la cible est le point de terminaison. La table de routage de la zone B n'a pas cette route : son trafic S3 suit la route par défaut vers la passerelle NAT tant que cette table n'est pas associée.
  options:
    a:
      en: |
        Subnets are selected for interface endpoints, which place network interfaces in them. A gateway endpoint is associated with route tables, not subnets.
      fr: |
        Ce sont les points de terminaison d'interface qui se configurent par sous-réseau, car ils y placent des interfaces réseau. Un point de terminaison de passerelle est associé à des tables de routage, pas à des sous-réseaux.
    c:
      en: |
        Private DNS is an option of interface endpoints. Gateway endpoints do not change DNS; S3 names keep resolving to public S3 addresses that the prefix list route matches.
      fr: |
        Le DNS privé est une option des points de terminaison d'interface. Les points de terminaison de passerelle ne modifient pas le DNS : les noms S3 continuent de se résoudre vers des adresses S3 publiques que la route de la liste de préfixes intercepte.
    d:
      en: |
        The policy already allows full access. Traffic from zone B never reaches the endpoint because no route sends it there.
      fr: |
        La politique autorise déjà un accès complet. Le trafic de la zone B n'atteint jamais le point de terminaison, car aucune route ne l'y envoie.
references:
  - title: Gateway endpoints for Amazon S3
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html
