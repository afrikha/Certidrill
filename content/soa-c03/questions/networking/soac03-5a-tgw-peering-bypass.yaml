id: soac03-5a-tgw-peering-bypass
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fifteen VPCs in one Region are attached to a transit gateway, and each VPC route table sends `10.0.0.0/8` to the transit gateway. Two of the VPCs, `10.12.0.0/16` and `10.13.0.0/16`, exchange about 300 TB of data each month, while the other VPCs exchange little traffic. The transit gateway data processing charge for these two VPCs is now the largest networking cost. The company wants to reduce this cost without changing how the other VPCs connect.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Quinze VPC d'une même Région sont attachés à une passerelle de transit, et chaque table de routage de VPC envoie `10.0.0.0/8` vers la passerelle de transit. Deux de ces VPC, `10.12.0.0/16` et `10.13.0.0/16`, échangent environ 300 To de données par mois, tandis que les autres VPC échangent peu de trafic. Les frais de traitement des données de la passerelle de transit pour ces deux VPC sont désormais le premier coût réseau. L'entreprise veut réduire ce coût sans modifier la façon dont les autres VPC se connectent.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Peer the two VPCs, and add a route to the other VPC's /16 through the peering connection in each VPC.", fr: "Appairer les deux VPC, et ajouter dans chacun une route vers le /16 de l'autre VPC par la connexion d'appairage." }
    - id: b
      text: { en: "Create a second transit gateway for the two VPCs and connect it to the first one with a peering attachment.", fr: "Créer une seconde passerelle de transit pour les deux VPC et la relier à la première par un attachement d'appairage." }
    - id: c
      text: { en: "Publish the receiving application through an endpoint service and reach it through an interface endpoint.", fr: "Publier l'application réceptrice par un service de point de terminaison et la joindre par un point de terminaison d'interface." }
    - id: d
      text: { en: "Turn on appliance mode for the two VPC attachments so that the flows stay in one Availability Zone.", fr: "Activer le mode appliance sur les deux attachements de VPC pour que les flux restent dans une seule zone de disponibilité." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Transit Gateway charges for every GB that a VPC sends to it, while VPC peering has no hourly or data processing charge (only data transfer between Availability Zones is billed). A `/16` route to the peering connection is more specific than the `10.0.0.0/8` route, so longest prefix match sends only the traffic between these two VPCs over peering, and every other flow keeps using the transit gateway.
    fr: |
      Transit Gateway facture chaque Go qu'un VPC lui envoie, alors que l'appairage de VPC n'a ni frais horaires ni frais de traitement des données (seul le transfert de données entre zones de disponibilité est facturé). Une route `/16` vers la connexion d'appairage est plus spécifique que la route `10.0.0.0/8` : la correspondance du préfixe le plus long n'envoie par l'appairage que le trafic entre ces deux VPC, et tous les autres flux continuent d'utiliser la passerelle de transit.
  options:
    b:
      en: |
        Traffic from the VPCs is still processed by a transit gateway, so the per-GB charge remains, and a second gateway adds attachment hours.
      fr: |
        Le trafic des VPC est toujours traité par une passerelle de transit : les frais par Go demeurent, et une seconde passerelle ajoute des heures d'attachement.
    c:
      en: |
        Interface endpoints add hourly charges and their own per-GB data processing charge, and they support only connections started by the consumer.
      fr: |
        Les points de terminaison d'interface ajoutent des frais horaires et leurs propres frais de traitement par Go, et ils ne prennent en charge que les connexions ouvertes par le consommateur.
    d:
      en: |
        Appliance mode keeps both directions of a flow on the same path through an inspection appliance. It does not remove the data processing charge.
      fr: |
        Le mode appliance garde les deux sens d'un flux sur le même chemin à travers une appliance d'inspection. Il ne supprime pas les frais de traitement des données.
references:
  - title: How route priority works
    url: https://docs.aws.amazon.com/vpc/latest/userguide/route-tables-priority.html
  - title: AWS Transit Gateway pricing
    url: https://aws.amazon.com/transit-gateway/pricing/
