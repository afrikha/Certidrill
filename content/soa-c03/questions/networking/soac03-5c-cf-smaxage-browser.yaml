id: soac03-5c-cf-smaxage-browser
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company serves article pages through an Amazon CloudFront distribution with a custom origin. The cache behavior uses a cache policy with a minimum TTL of 0 seconds, a default TTL of 300 seconds, and a maximum TTL of 31,536,000 seconds. The origin returns `Cache-Control: max-age=60` with each page. Pages must stay cached at edge locations for 1 day, and browsers must cache them for no more than 60 seconds so that readers see corrections soon after the company invalidates a page.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias sert des pages d'articles via une distribution Amazon CloudFront dotée d'une origine personnalisée. Le comportement de cache utilise une politique de cache avec une durée de vie (TTL) minimale de 0 seconde, un TTL par défaut de 300 secondes et un TTL maximal de 31 536 000 secondes. L'origine renvoie `Cache-Control: max-age=60` avec chaque page. Les pages doivent rester en cache dans les emplacements périphériques pendant 1 jour, et les navigateurs ne doivent pas les mettre en cache plus de 60 secondes, afin que les lecteurs voient les corrections peu après que l'entreprise a invalidé une page.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the default TTL of the cache policy to 86,400 seconds and keep the current origin header.", fr: "Définir le TTL par défaut de la politique de cache à 86 400 secondes et conserver l'en-tête actuel de l'origine." } }
    - { id: b, text: { en: "Configure the origin to return Cache-Control: max-age=60, s-maxage=86400 with each page.", fr: "Configurer l'origine pour qu'elle renvoie Cache-Control: max-age=60, s-maxage=86400 avec chaque page." } }
    - { id: c, text: { en: "Configure the origin to return Cache-Control: max-age=60 and an Expires header set 1 day ahead.", fr: "Configurer l'origine pour qu'elle renvoie Cache-Control: max-age=60 et un en-tête Expires fixé à 1 jour plus tard." } }
    - { id: d, text: { en: "Set the maximum TTL of the cache policy to 86,400 seconds and keep the current origin header.", fr: "Définir le TTL maximal de la politique de cache à 86 400 secondes et conserver l'en-tête actuel de l'origine." } }
answer: { optionId: b }
explanation:
  correct:
    en: "When the origin sends both max-age and s-maxage and the minimum TTL is 0, CloudFront caches the object for the lesser of s-maxage and the maximum TTL, here 86,400 seconds. Browsers ignore s-maxage and use max-age, so they cache each page for only 60 seconds."
    fr: "Lorsque l'origine envoie à la fois max-age et s-maxage et que le TTL minimal est 0, CloudFront met l'objet en cache pendant la plus petite des valeurs entre s-maxage et le TTL maximal, ici 86 400 secondes. Les navigateurs ignorent s-maxage et utilisent max-age : ils mettent donc chaque page en cache pendant 60 secondes seulement."
  options:
    a:
      en: "CloudFront uses the default TTL only when the origin sends no Cache-Control or Expires header; here it keeps using max-age=60."
      fr: "CloudFront n'utilise le TTL par défaut que lorsque l'origine n'envoie ni en-tête Cache-Control ni en-tête Expires ; ici, il continue d'utiliser max-age=60."
    c:
      en: "When an origin sends both Cache-Control max-age and Expires, CloudFront uses only max-age, so pages stay cached for 60 seconds."
      fr: "Lorsqu'une origine envoie à la fois Cache-Control max-age et Expires, CloudFront n'utilise que max-age : les pages restent en cache 60 secondes."
    d:
      en: "With a minimum TTL of 0, CloudFront caches for the lesser of max-age and the maximum TTL, which is still 60 seconds."
      fr: "Avec un TTL minimal de 0, CloudFront met en cache pendant la plus petite des valeurs entre max-age et le TTL maximal, soit toujours 60 secondes."
references:
  - title: Manage how long content stays in the cache (expiration)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html
