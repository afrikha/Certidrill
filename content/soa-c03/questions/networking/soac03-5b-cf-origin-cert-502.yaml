id: soac03-5b-cf-origin-cert-502
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company configures an Amazon CloudFront distribution with a custom origin named origin.example.com, which resolves to an Amazon EC2 instance that runs NGINX. The origin protocol policy is HTTPS Only. NGINX uses a self-signed certificate for origin.example.com. Every request through CloudFront returns HTTP 502, and the X-Cache response header is "Error from cloudfront". Traffic between CloudFront and the origin must stay encrypted.

    Which solution will resolve the issue?
  fr: |
    Une entreprise configure une distribution Amazon CloudFront avec une origine personnalisée nommée origin.example.com, qui se résout vers une instance Amazon EC2 exécutant NGINX. La politique de protocole d'origine est HTTPS Only. NGINX utilise un certificat auto-signé pour origin.example.com. Chaque requête passant par CloudFront renvoie HTTP 502, et l'en-tête de réponse X-Cache vaut « Error from cloudfront ». Le trafic entre CloudFront et l'origine doit rester chiffré.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Import the self-signed certificate into AWS Certificate Manager (ACM) in us-east-1, and attach it to the distribution.", fr: "Importer le certificat auto-signé dans AWS Certificate Manager (ACM) dans us-east-1, et l'associer à la distribution." }
    - id: b
      text: { en: "Change the viewer protocol policy of the default cache behavior to Redirect HTTP to HTTPS.", fr: "Modifier la politique de protocole utilisateur du comportement de cache par défaut en Redirect HTTP to HTTPS." }
    - id: c
      text: { en: "Change the origin protocol policy to HTTP Only, and keep HTTPS between the viewers and CloudFront.", fr: "Modifier la politique de protocole d'origine en HTTP Only, et conserver le HTTPS entre les utilisateurs et CloudFront." }
    - id: d
      text: { en: "Place the instance behind an ALB with a public ACM certificate for origin.example.com, and point origin.example.com to the ALB.", fr: "Placer l'instance derrière un ALB doté d'un certificat ACM public pour origin.example.com, et faire pointer origin.example.com vers l'ALB." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      CloudFront does not accept self-signed origin certificates: it drops the connection and returns 502 with "Error from cloudfront". The origin must present a certificate from a trusted authority that includes the origin domain name. An Application Load Balancer can use a public ACM certificate for origin.example.com, which keeps the origin connection encrypted.
    fr: |
      CloudFront n'accepte pas les certificats d'origine auto-signés : il coupe la connexion et renvoie 502 avec « Error from cloudfront ». L'origine doit présenter un certificat émis par une autorité approuvée qui inclut le nom de domaine de l'origine. Un Application Load Balancer peut utiliser un certificat ACM public pour origin.example.com, ce qui garde la connexion vers l'origine chiffrée.
  options:
    a:
      en: |
        The certificate attached to a distribution secures viewer connections; it does not change the self-signed certificate that the origin presents.
      fr: |
        Le certificat associé à une distribution sécurise les connexions des utilisateurs ; il ne change pas le certificat auto-signé que présente l'origine.
    b:
      en: |
        The viewer protocol policy controls the viewer side only; the failure is on the connection from CloudFront to the origin.
      fr: |
        La politique de protocole utilisateur ne contrôle que le côté utilisateur ; l'échec se produit sur la connexion de CloudFront vers l'origine.
    c:
      en: |
        HTTP Only would remove the error but leave the traffic between CloudFront and the origin unencrypted, which breaks the requirement.
      fr: |
        HTTP Only supprimerait l'erreur mais laisserait le trafic entre CloudFront et l'origine non chiffré, ce qui enfreint l'exigence.
references:
  - title: Require HTTPS for communication between CloudFront and your custom origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-https-cloudfront-to-custom-origin.html
