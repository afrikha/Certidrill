id: soac03-5a-subnet-full-asg
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Auto Scaling group launches instances into two `/27` subnets, one in each of two Availability Zones, in a VPC whose CIDR block is `10.20.0.0/16`. During peak load, scaling activities fail because the subnets have no free IPv4 addresses. Most of the VPC CIDR block is not allocated to any subnet.

    Which solution will allow the group to scale out?
  fr: |
    Un groupe Auto Scaling lance des instances dans deux sous-réseaux `/27`, un dans chacune de deux zones de disponibilité, dans un VPC dont le bloc CIDR est `10.20.0.0/16`. Lors des pics de charge, les activités de mise à l'échelle échouent parce que les sous-réseaux n'ont plus d'adresse IPv4 libre. La plus grande partie du bloc CIDR du VPC n'est attribuée à aucun sous-réseau.

    Quelle solution permet au groupe d'augmenter sa capacité ?
body:
  options:
    - id: a
      text: { en: "Modify the two existing subnets to change their CIDR blocks from /27 to /24.", fr: "Modifier les deux sous-réseaux existants pour faire passer leur bloc CIDR de /27 à /24." }
    - id: b
      text: { en: "Associate a secondary IPv4 CIDR block with the VPC and keep the group's subnets unchanged.", fr: "Associer un bloc CIDR IPv4 secondaire au VPC et ne pas modifier les sous-réseaux du groupe." }
    - id: c
      text: { en: "Create larger subnets from the unused VPC range in the same zones and add them to the group.", fr: "Créer des sous-réseaux plus grands dans la plage inutilisée du VPC, dans les mêmes zones, et les ajouter au groupe." }
    - id: d
      text: { en: "Associate an IPv6 CIDR block with the two subnets so that new instances use IPv6 addresses.", fr: "Associer un bloc CIDR IPv6 aux deux sous-réseaux pour que les nouvelles instances utilisent des adresses IPv6." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A `/27` subnet has 32 addresses, and AWS reserves 5 of them, so each subnet holds at most 27 network interfaces. The VPC still has free space, so new and larger subnets can be created in the same Availability Zones and added to the Auto Scaling group. The group then launches instances in all of its subnets.
    fr: |
      Un sous-réseau `/27` contient 32 adresses, dont 5 sont réservées par AWS : chaque sous-réseau accueille donc au plus 27 interfaces réseau. Le VPC dispose encore d'espace libre : on peut créer des sous-réseaux plus grands dans les mêmes zones de disponibilité et les ajouter au groupe Auto Scaling, qui lance ensuite des instances dans tous ses sous-réseaux.
  options:
    a:
      en: |
        The subnet attributes that can be modified do not include the IPv4 CIDR block, so an existing subnet cannot be resized.
      fr: |
        Les attributs modifiables d'un sous-réseau n'incluent pas le bloc CIDR IPv4 : un sous-réseau existant ne peut pas être agrandi.
    b:
      en: |
        A secondary CIDR block adds space to the VPC, not to existing subnets. Instances still launch only into the two full subnets, and the VPC already has free space.
      fr: |
        Un bloc CIDR secondaire ajoute de l'espace au VPC, pas aux sous-réseaux existants. Les instances se lancent toujours dans les deux sous-réseaux pleins, et le VPC a déjà de l'espace libre.
    d:
      en: |
        In a dual-stack subnet, each instance still needs a private IPv4 address, so the subnets remain full.
      fr: |
        Dans un sous-réseau à double pile, chaque instance a toujours besoin d'une adresse IPv4 privée : les sous-réseaux restent pleins.
references:
  - title: Subnet CIDR blocks
    url: https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html
  - title: ModifySubnetAttribute
    url: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifySubnetAttribute.html
