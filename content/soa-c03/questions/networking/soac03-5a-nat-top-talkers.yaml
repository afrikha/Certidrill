id: soac03-5a-nat-top-talkers
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AWS Cost Explorer shows that a company's NAT gateway data processing charges doubled last month. The NAT gateway's `BytesInFromSource` metric shows large spikes every evening. About 300 Amazon EC2 instances in the VPC's private subnets use the NAT gateway. A CloudOps engineer must find which instances send the most data through the NAT gateway before deciding how to reduce the cost.

    Which solution will meet this requirement?
  fr: |
    AWS Cost Explorer montre que les frais de traitement des données de la passerelle NAT d'une entreprise ont doublé le mois dernier. La métrique `BytesInFromSource` de la passerelle NAT présente de forts pics chaque soir. Environ 300 instances Amazon EC2 des sous-réseaux privés du VPC utilisent la passerelle NAT. Un ingénieur CloudOps doit déterminer quelles instances envoient le plus de données par la passerelle NAT avant de décider comment réduire le coût.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Group the NAT gateway costs in Cost Explorer by usage type and by Availability Zone.", fr: "Regrouper les coûts de la passerelle NAT dans Cost Explorer par type d'utilisation et par zone de disponibilité." }
    - id: b
      text: { en: "Run Reachability Analyzer from each instance to the NAT gateway and compare the paths.", fr: "Exécuter Reachability Analyzer depuis chaque instance vers la passerelle NAT et comparer les chemins." }
    - id: c
      text: { en: "Use IPAM public IP insights to list the public addresses that the instances use.", fr: "Utiliser les informations sur les adresses IP publiques (public IP insights) d'IPAM pour lister les adresses publiques des instances." }
    - id: d
      text: { en: "Create a flow log for the NAT gateway interface and sum bytes by source in Logs Insights.", fr: "Créer un journal de flux pour l'interface de la passerelle NAT et additionner les octets par source dans Logs Insights." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      VPC flow logs on the NAT gateway's network interface record the source and destination of each flow. In CloudWatch Logs Insights, filtering on records whose destination is the NAT gateway's private IP address and summing bytes by source address over the spike window ranks the instances that upload the most data. Athena can run the same analysis if the flow logs go to Amazon S3.
    fr: |
      Les journaux de flux VPC sur l'interface réseau de la passerelle NAT enregistrent la source et la destination de chaque flux. Dans CloudWatch Logs Insights, filtrer les enregistrements dont la destination est l'adresse IP privée de la passerelle NAT et additionner les octets par adresse source sur la période des pics classe les instances qui envoient le plus de données. Athena peut faire la même analyse si les journaux de flux sont envoyés vers Amazon S3.
  options:
    a:
      en: |
        Cost Explorer shows how much the NAT gateway costs, but not which instances generate the processed bytes.
      fr: |
        Cost Explorer montre combien coûte la passerelle NAT, mais pas quelles instances génèrent les octets traités.
    b:
      en: |
        Reachability Analyzer checks whether a path exists between two resources. It does not measure traffic volume.
      fr: |
        Reachability Analyzer vérifie si un chemin existe entre deux ressources. Il ne mesure pas le volume de trafic.
    c:
      en: |
        Instances in private subnets send traffic through the NAT gateway's address, and public IP insights inventories addresses, not the data that flows through them.
      fr: |
        Les instances des sous-réseaux privés passent par l'adresse de la passerelle NAT, et les informations sur les adresses IP publiques recensent des adresses, pas les données qui y transitent.
references:
  - title: Flow log record examples
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-records-examples.html
  - title: Amazon VPC Pricing
    url: https://aws.amazon.com/vpc/pricing/
