id: soac03-5b-calculated-health-check
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Route 53 failover records for www.example.com, with a primary site and a secondary site. The primary site is usable only when both its web endpoint and its API endpoint work. The company already has one Route 53 endpoint health check for the web endpoint and one for the API endpoint. Route 53 must fail over to the secondary site when either endpoint of the primary site fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise des enregistrements de basculement Route 53 pour www.example.com, avec un site principal et un site secondaire. Le site principal n'est utilisable que lorsque son point de terminaison web et son point de terminaison d'API fonctionnent tous les deux. L'entreprise dispose déjà d'une vérification de l'état de point de terminaison Route 53 pour le point de terminaison web et d'une autre pour le point de terminaison d'API. Route 53 doit basculer vers le site secondaire lorsque l'un ou l'autre des points de terminaison du site principal tombe en panne.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a calculated health check with both health checks as children that is healthy when 2 children are healthy, and associate it with the primary record.", fr: "Créer une vérification de l'état calculée avec les deux vérifications comme enfants, saine lorsque 2 enfants sont sains, et l'associer à l'enregistrement principal." }
    - id: b
      text: { en: "Create a calculated health check with both health checks as children that is healthy when at least 1 child is healthy, and associate it with the primary record.", fr: "Créer une vérification de l'état calculée avec les deux vérifications comme enfants, saine lorsqu'au moins 1 enfant est sain, et l'associer à l'enregistrement principal." }
    - id: c
      text: { en: "Associate both endpoint health checks with the primary failover record.", fr: "Associer les deux vérifications de l'état de point de terminaison à l'enregistrement de basculement principal." }
    - id: d
      text: { en: "Associate the web endpoint health check with the primary record, and set its failure threshold to 1.", fr: "Associer la vérification de l'état du point de terminaison web à l'enregistrement principal, et définir son seuil d'échec à 1." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A calculated health check monitors child health checks and compares the number of healthy children with the number that you require. With both children required, the parent becomes unhealthy as soon as either the web or the API endpoint fails, and Route 53 answers with the secondary record.
    fr: |
      Une vérification de l'état calculée surveille des vérifications enfants et compare le nombre d'enfants sains au nombre requis. Avec les deux enfants requis, la vérification parente devient défaillante dès que le point de terminaison web ou celui d'API tombe en panne, et Route 53 répond avec l'enregistrement secondaire.
  options:
    b:
      en: |
        With a threshold of 1, the parent stays healthy while one endpoint still works, so Route 53 does not fail over when only one endpoint fails.
      fr: |
        Avec un seuil de 1, la vérification parente reste saine tant qu'un point de terminaison fonctionne : Route 53 ne bascule pas lorsqu'un seul point de terminaison tombe en panne.
    c:
      en: |
        A record can have only one associated health check; combining several checks requires a calculated health check.
      fr: |
        Un enregistrement ne peut avoir qu'une seule vérification de l'état associée ; combiner plusieurs vérifications nécessite une vérification de l'état calculée.
    d:
      en: |
        A lower threshold makes the web check react faster, but failures of the API endpoint are still ignored.
      fr: |
        Un seuil plus bas fait réagir plus vite la vérification web, mais les pannes du point de terminaison d'API restent ignorées.
references:
  - title: How Amazon Route 53 determines whether a health check is healthy
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-determining-health-of-endpoints.html
