id: soac03-5b-nat-port-allocation
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Hundreds of containers in a private subnet call a third-party payment API at one IP address on TCP port 443 through a single NAT gateway. During peak hours, some new connections fail while others succeed. The Amazon CloudWatch metric ErrorPortAllocation for the NAT gateway is greater than zero during those periods. The routing and the security rules are correct.

    Which solution will resolve the issue with the LEAST change to the architecture?
  fr: |
    Des centaines de conteneurs d'un sous-réseau privé appellent une API de paiement tierce, à une seule adresse IP sur le port TCP 443, par une seule passerelle NAT. Aux heures de pointe, certaines nouvelles connexions échouent tandis que d'autres réussissent. La métrique Amazon CloudWatch ErrorPortAllocation de la passerelle NAT est supérieure à zéro pendant ces périodes. Le routage et les règles de sécurité sont corrects.

    Quelle solution résout le problème avec le MOINS de modifications de l'architecture ?
body:
  options:
    - id: a
      text: { en: "Replace the NAT gateway with a NAT instance on a larger instance type.", fr: "Remplacer la passerelle NAT par une instance NAT sur un type d'instance plus grand." }
    - id: b
      text: { en: "Associate additional secondary IPv4 addresses with the NAT gateway.", fr: "Associer des adresses IPv4 secondaires supplémentaires à la passerelle NAT." }
    - id: c
      text: { en: "Enable TCP keepalive on the containers with an interval of 600 seconds.", fr: "Activer le keepalive TCP sur les conteneurs avec un intervalle de 600 secondes." }
    - id: d
      text: { en: "Resize the private subnet to a larger CIDR block.", fr: "Agrandir le sous-réseau privé avec un bloc d'adresse CIDR plus grand." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      ErrorPortAllocation counts the times the NAT gateway could not allocate a source port, which means too many concurrent connections. Each IPv4 address of a NAT gateway supports up to 55,000 concurrent connections to one destination, so associating secondary IPv4 addresses adds source ports without changing the routes or the subnets.
    fr: |
      ErrorPortAllocation compte les fois où la passerelle NAT n'a pas pu allouer de port source, ce qui signifie un trop grand nombre de connexions simultanées. Chaque adresse IPv4 d'une passerelle NAT prend en charge jusqu'à 55 000 connexions simultanées vers une même destination : associer des adresses IPv4 secondaires ajoute des ports sources sans modifier les routes ni les sous-réseaux.
  options:
    a:
      en: |
        A NAT instance adds patching and failover work, and with a single address it has the same port limit toward one destination.
      fr: |
        Une instance NAT ajoute des correctifs et une gestion du basculement, et avec une seule adresse elle a la même limite de ports vers une destination.
    c:
      en: |
        Keepalive keeps idle connections open; an interval longer than the 350-second idle timeout does not even prevent timeouts, and it adds no ports.
      fr: |
        Le keepalive maintient ouvertes les connexions inactives ; un intervalle plus long que le délai d'inactivité de 350 secondes n'empêche même pas les expirations, et il n'ajoute aucun port.
    d:
      en: |
        The limit is on source ports of the NAT gateway's address, not on the number of addresses in the private subnet; a subnet CIDR cannot be resized either.
      fr: |
        La limite porte sur les ports sources de l'adresse de la passerelle NAT, pas sur le nombre d'adresses du sous-réseau privé ; le CIDR d'un sous-réseau ne peut d'ailleurs pas être modifié.
references:
