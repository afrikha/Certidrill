id: soac03-5b-flowlog-nacl-reject
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Users cannot open an HTTPS application that runs on an Amazon EC2 instance (10.0.1.25) in a public subnet. A CloudOps engineer finds the following VPC flow log records (default format) for the instance's network interface:

    ```text
    2 111122223333 eni-0a1b2c3d4e5f6a7b8 198.51.100.7 10.0.1.25 50432 443 6 5 340 1763980800 1763980860 ACCEPT OK
    2 111122223333 eni-0a1b2c3d4e5f6a7b8 10.0.1.25 198.51.100.7 443 50432 6 5 620 1763980800 1763980860 REJECT OK
    ```

    Which change will resolve the issue?
  fr: |
    Les utilisateurs ne parviennent pas à ouvrir une application HTTPS qui s'exécute sur une instance Amazon EC2 (10.0.1.25) dans un sous-réseau public. Un ingénieur CloudOps trouve les enregistrements de journaux de flux VPC suivants (format par défaut) pour l'interface réseau de l'instance :

    ```text
    2 111122223333 eni-0a1b2c3d4e5f6a7b8 198.51.100.7 10.0.1.25 50432 443 6 5 340 1763980800 1763980860 ACCEPT OK
    2 111122223333 eni-0a1b2c3d4e5f6a7b8 10.0.1.25 198.51.100.7 443 50432 6 5 620 1763980800 1763980860 REJECT OK
    ```

    Quelle modification résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add an inbound rule to the security group that allows TCP port 443 from 0.0.0.0/0.", fr: "Ajouter au groupe de sécurité une règle entrante qui autorise le port TCP 443 depuis 0.0.0.0/0." }
    - id: b
      text: { en: "Add an outbound rule to the security group that allows TCP ports 1024-65535 to 0.0.0.0/0.", fr: "Ajouter au groupe de sécurité une règle sortante qui autorise les ports TCP 1024-65535 vers 0.0.0.0/0." }
    - id: c
      text: { en: "Add an outbound rule to the subnet's network ACL that allows TCP ports 1024-65535 to 0.0.0.0/0.", fr: "Ajouter à l'ACL réseau du sous-réseau une règle sortante qui autorise les ports TCP 1024-65535 vers 0.0.0.0/0." }
    - id: d
      text: { en: "Add an inbound rule to the subnet's network ACL that allows TCP port 443 from 0.0.0.0/0.", fr: "Ajouter à l'ACL réseau du sous-réseau une règle entrante qui autorise le port TCP 443 depuis 0.0.0.0/0." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The request to port 443 is accepted, so both the security group and the network ACL allow it in. The response from port 443 to the client's ephemeral port 50432 is rejected. A security group would allow this response automatically because it is stateful, so the stateless network ACL is missing an outbound rule for the ephemeral ports.
    fr: |
      La requête vers le port 443 est acceptée : le groupe de sécurité et l'ACL réseau la laissent donc entrer. La réponse du port 443 vers le port éphémère 50432 du client est rejetée. Un groupe de sécurité autoriserait automatiquement cette réponse, car il est avec état ; c'est donc l'ACL réseau, sans état, qui manque d'une règle sortante pour les ports éphémères.
  options:
    a:
      en: |
        The inbound request is already accepted, as the ACCEPT record shows.
      fr: |
        La requête entrante est déjà acceptée, comme le montre l'enregistrement ACCEPT.
    b:
      en: |
        A security group lets responses to allowed inbound traffic leave regardless of its outbound rules, so it is not what rejects the response.
      fr: |
        Un groupe de sécurité laisse sortir les réponses au trafic entrant autorisé quelles que soient ses règles sortantes : ce n'est pas lui qui rejette la réponse.
    d:
      en: |
        Inbound traffic to port 443 is already allowed; the rejected record is the outbound response.
      fr: |
        Le trafic entrant vers le port 443 est déjà autorisé ; l'enregistrement rejeté est la réponse sortante.
references:
  - title: Flow log record examples
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-records-examples.html
  - title: Control subnet traffic with network access control lists
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
