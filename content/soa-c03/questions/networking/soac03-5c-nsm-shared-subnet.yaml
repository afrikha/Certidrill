id: soac03-5c-nsm-shared-subnet
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An enterprise uses a networking account that owns a VPC and shares its subnets with several workload accounts through AWS Resource Access Manager (AWS RAM). An application team in a workload account wants to use Network Synthetic Monitor to measure the path from one of the shared subnets to an on-premises database server. The team cannot create the monitor with the shared subnet as the source.

    Which solution will meet these requirements?
  fr: |
    Une grande entreprise utilise un compte réseau qui possède un VPC et partage ses sous-réseaux avec plusieurs comptes de charges de travail par AWS Resource Access Manager (AWS RAM). Une équipe d'application d'un compte de charges de travail veut utiliser Network Synthetic Monitor pour mesurer le chemin entre l'un des sous-réseaux partagés et un serveur de base de données sur site. L'équipe ne parvient pas à créer le moniteur avec le sous-réseau partagé comme source.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Grant the IAM role of the application team the ec2:CreateNetworkInterface permission on the shared subnet.", fr: "Accorder au rôle IAM de l'équipe d'application l'autorisation ec2:CreateNetworkInterface sur le sous-réseau partagé." } }
    - { id: b, text: { en: "Create an Internet Monitor monitor for the VPC in the workload account instead.", fr: "Créer plutôt un moniteur Internet Monitor pour le VPC dans le compte de charges de travail." } }
    - { id: c, text: { en: "Install the CloudWatch agent on an instance in the shared subnet and publish ping results as custom metrics.", fr: "Installer l'agent CloudWatch sur une instance du sous-réseau partagé et publier les résultats de ping comme métriques personnalisées." } }
    - { id: d, text: { en: "Create the monitor and its probes in the networking account that owns the subnet.", fr: "Créer le moniteur et ses sondes dans le compte réseau qui possède le sous-réseau." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The source subnets of a Network Synthetic Monitor monitor must be owned by the account that owns the monitor. The networking account owns the shared subnet, so the monitor and its probes are created there; the metrics are then available in that account's CloudWatch."
    fr: "Les sous-réseaux sources d'un moniteur Network Synthetic Monitor doivent appartenir au compte propriétaire du moniteur. Le compte réseau possède le sous-réseau partagé : le moniteur et ses sondes y sont donc créés, et les métriques sont alors disponibles dans le CloudWatch de ce compte."
  options:
    a:
      en: "More IAM permissions in the workload account do not change the rule that the monitor and its source subnets must belong to the same account."
      fr: "Des autorisations IAM supplémentaires dans le compte de charges de travail ne changent pas la règle selon laquelle le moniteur et ses sous-réseaux sources doivent appartenir au même compte."
    b:
      en: "Internet Monitor measures internet traffic to the application's users, not the hybrid path to an on-premises server."
      fr: "Internet Monitor mesure le trafic Internet vers les utilisateurs de l'application, pas le chemin hybride vers un serveur sur site."
    c:
      en: "A self-built ping script adds an instance and code to maintain, and it gives no network health indicator for the AWS part of the path."
      fr: "Un script de ping maison ajoute une instance et du code à maintenir, et ne fournit aucun indicateur de santé du réseau pour la partie AWS du chemin."
references:
  - title: Using Network Synthetic Monitor
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/what-is-network-monitor.html
