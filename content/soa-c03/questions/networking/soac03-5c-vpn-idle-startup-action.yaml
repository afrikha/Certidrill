id: soac03-5c-vpn-idle-startup-action
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has an AWS Site-to-Site VPN connection between a VPC and a remote site. The customer gateway resource specifies the static public IP address of the remote device, and the tunnels use IKEv2. At night there is no traffic, the tunnels go down, and the first requests that applications in the VPC send to the remote site in the morning fail until the remote device brings the tunnels up again. The configuration of the remote device cannot be changed.

    Which solution will keep the tunnels established with the LEAST operational overhead?
  fr: |
    Une entreprise dispose d'une connexion AWS Site-to-Site VPN entre un VPC et un site distant. La ressource de passerelle client (customer gateway) indique l'adresse IP publique statique du périphérique distant, et les tunnels utilisent IKEv2. La nuit, il n'y a aucun trafic, les tunnels tombent, et les premières demandes que les applications du VPC envoient au site distant le matin échouent jusqu'à ce que le périphérique distant rétablisse les tunnels. La configuration du périphérique distant ne peut pas être modifiée.

    Quelle solution maintient les tunnels établis avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Set the DPD timeout of both tunnels to 10 seconds so that AWS detects the idle peer sooner.", fr: "Définir à 10 secondes le délai DPD des deux tunnels pour qu'AWS détecte plus tôt l'homologue inactif." } }
    - { id: b, text: { en: "Set the DPD timeout action of both tunnels to Clear so that AWS removes the idle IKE sessions.", fr: "Définir l'action de délai DPD des deux tunnels sur Clear pour qu'AWS supprime les sessions IKE inactives." } }
    - { id: c, text: { en: "Set the startup action of both tunnels to Start and their DPD timeout action to Restart.", fr: "Définir l'action de démarrage des deux tunnels sur Start et leur action de délai DPD sur Restart." } }
    - { id: d, text: { en: "Change both tunnels to Large Bandwidth Tunnels so that they can carry more traffic.", fr: "Convertir les deux tunnels en Large Bandwidth Tunnels pour qu'ils puissent transporter plus de trafic." } }
answer: { optionId: c }
explanation:
  correct:
    en: "By default the customer gateway must start the IKE negotiation, and after a DPD timeout AWS ends the IKE session and the tunnel goes down. With the startup action Start, AWS initiates IKE itself, which requires IKEv2 and the device's public IP address, and the Restart DPD timeout action makes AWS restart the IKE session after a timeout."
    fr: "Par défaut, la passerelle client doit lancer la négociation IKE et, après un délai DPD, AWS met fin à la session IKE et le tunnel tombe. Avec l'action de démarrage Start, AWS lance lui-même IKE, ce qui exige IKEv2 et l'adresse IP publique du périphérique, et l'action de délai DPD Restart fait redémarrer la session IKE par AWS après un délai."
  options:
    a:
      en: "The DPD timeout must be 30 seconds or more, and a shorter timeout would only take the tunnels down faster."
      fr: "Le délai DPD doit être d'au moins 30 secondes, et un délai plus court ne ferait que faire tomber les tunnels plus vite."
    b:
      en: "Clear is the default action: it stops the IKE session and removes the routes, which is the current behavior."
      fr: "Clear est l'action par défaut : elle arrête la session IKE et supprime les routes, ce qui correspond au comportement actuel."
    d:
      en: "Tunnel bandwidth does not affect which side initiates IKE or what happens after a DPD timeout."
      fr: "La bande passante d'un tunnel n'a pas d'effet sur le côté qui lance IKE ni sur ce qui se passe après un délai DPD."
references:
  - title: AWS Site-to-Site VPN tunnel initiation options
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/initiate-vpn-tunnels.html
