id: soac03-5a-flow-logs-s3-parquet
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company publishes VPC flow logs for all its VPCs to Amazon CloudWatch Logs and must now keep them for one year for audits. The network team queries the logs only a few times each month, usually for a specific hour, and wants to use Amazon Athena for these queries. The company wants to minimize the cost of storing and querying the flow logs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise publie les journaux de flux VPC de tous ses VPC dans Amazon CloudWatch Logs et doit désormais les conserver un an pour des audits. L'équipe réseau n'interroge les journaux que quelques fois par mois, généralement pour une heure précise, et veut utiliser Amazon Athena pour ces requêtes. L'entreprise veut réduire au minimum le coût de stockage et d'interrogation des journaux de flux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep publishing to CloudWatch Logs, set a one-year retention, and query with Logs Insights.", fr: "Continuer à publier dans CloudWatch Logs, définir une conservation d'un an et interroger avec Logs Insights." }
    - id: b
      text: { en: "Publish the flow logs to Amazon S3 in Parquet format with hourly partitions.", fr: "Publier les journaux de flux dans Amazon S3 au format Parquet avec des partitions horaires." }
    - id: c
      text: { en: "Publish the flow logs to Amazon S3 in plain text format with daily partitions.", fr: "Publier les journaux de flux dans Amazon S3 au format texte brut avec des partitions quotidiennes." }
    - id: d
      text: { en: "Stream the flow logs through Amazon Data Firehose to an Amazon OpenSearch Service domain.", fr: "Diffuser les journaux de flux par Amazon Data Firehose vers un domaine Amazon OpenSearch Service." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Flow logs published to Amazon S3 can be stored in Apache Parquet format, which takes about 20 percent less storage than Gzip-compressed text and is 10 to 100 times faster to query. Hourly partitions let Athena scan only the hour that the team targets, which lowers query cost. S3 storage for a year of rarely read logs is cheaper than keeping them in CloudWatch Logs.
    fr: |
      Les journaux de flux publiés dans Amazon S3 peuvent être stockés au format Apache Parquet, qui occupe environ 20 % d'espace en moins que du texte compressé Gzip et s'interroge 10 à 100 fois plus vite. Les partitions horaires permettent à Athena de n'analyser que l'heure ciblée, ce qui réduit le coût des requêtes. Le stockage S3 d'un an de journaux rarement lus coûte moins cher que leur conservation dans CloudWatch Logs.
  options:
    a:
      en: |
        Logs Insights does not meet the Athena requirement, and a year of storage in CloudWatch Logs costs more than in Amazon S3.
      fr: |
        Logs Insights ne répond pas à l'exigence d'utiliser Athena, et un an de stockage dans CloudWatch Logs coûte plus cher que dans Amazon S3.
    c:
      en: |
        Plain text takes more storage and is slower to query, and daily partitions make Athena scan a whole day for a one-hour query.
      fr: |
        Le texte brut occupe plus d'espace et s'interroge plus lentement, et des partitions quotidiennes obligent Athena à analyser une journée entière pour une requête d'une heure.
    d:
      en: |
        An OpenSearch Service domain runs continuously and costs far more than S3 storage for logs that are queried a few times a month; it also does not use Athena.
      fr: |
        Un domaine OpenSearch Service fonctionne en continu et coûte bien plus cher que le stockage S3 pour des journaux interrogés quelques fois par mois ; il n'utilise pas non plus Athena.
references:
