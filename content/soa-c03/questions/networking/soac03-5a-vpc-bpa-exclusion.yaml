id: soac03-5a-vpc-bpa-exclusion
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS account has 12 VPCs in the eu-west-1 Region, and teams create new VPCs every month. A new security rule states that no VPC in the Region can send or receive internet traffic through internet gateways or egress-only internet gateways. The only exception is the public subnets of one inspection VPC, which must keep inbound and outbound internet access. The rule must also apply to VPCs that are created later, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un compte AWS possède 12 VPC dans la Région eu-west-1, et les équipes créent de nouveaux VPC chaque mois. Une nouvelle règle de sécurité impose qu'aucun VPC de la Région ne puisse envoyer ni recevoir de trafic Internet par des passerelles Internet ou des passerelles Internet de sortie uniquement. La seule exception concerne les sous-réseaux publics d'un VPC d'inspection, qui doivent conserver un accès Internet entrant et sortant. La règle doit aussi s'appliquer aux VPC créés plus tard, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on VPC Block Public Access in ingress-only mode, and create a bidirectional exclusion for the inspection VPC's public subnets.", fr: "Activer VPC Block Public Access en mode entrant uniquement (ingress-only) et créer une exclusion bidirectionnelle pour les sous-réseaux publics du VPC d'inspection." }
    - id: b
      text: { en: "Turn on VPC Block Public Access in bidirectional mode, and create a bidirectional exclusion for the inspection VPC's public subnets.", fr: "Activer VPC Block Public Access en mode bidirectionnel et créer une exclusion bidirectionnelle pour les sous-réseaux publics du VPC d'inspection." }
    - id: c
      text: { en: "Create an AWS Config rule that finds internet gateways outside the inspection VPC, with automatic remediation that detaches them.", fr: "Créer une règle AWS Config qui détecte les passerelles Internet hors du VPC d'inspection, avec une correction automatique qui les détache." }
    - id: d
      text: { en: "Remove the internet routes from all route tables except the inspection VPC's, and add deny rules to the network ACLs.", fr: "Supprimer les routes Internet de toutes les tables de routage sauf celles du VPC d'inspection, et ajouter des règles de refus aux ACL réseau." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      VPC Block Public Access is an account setting per Region, so it also covers VPCs that are created later. Bidirectional mode blocks traffic to and from internet gateways and egress-only internet gateways. An exclusion in bidirectional mode on the inspection VPC's public subnets keeps their inbound and outbound internet access.
    fr: |
      VPC Block Public Access est un paramètre de compte par Région : il couvre donc aussi les VPC créés plus tard. Le mode bidirectionnel bloque le trafic vers et depuis les passerelles Internet et les passerelles Internet de sortie uniquement. Une exclusion en mode bidirectionnel sur les sous-réseaux publics du VPC d'inspection leur conserve l'accès Internet entrant et sortant.
  options:
    a:
      en: |
        Ingress-only mode blocks only inbound internet traffic. Outbound traffic through NAT gateways and egress-only internet gateways would still be allowed in every VPC.
      fr: |
        Le mode entrant uniquement ne bloque que le trafic Internet entrant. Le trafic sortant par les passerelles NAT et les passerelles Internet de sortie uniquement resterait autorisé dans tous les VPC.
    c:
      en: |
        Config remediation acts after a resource is detected, so traffic can flow until it runs, and the rule and its remediation must be built and maintained.
      fr: |
        La correction AWS Config agit après la détection d'une ressource : le trafic peut circuler jusqu'à son exécution, et la règle et sa correction doivent être construites et maintenues.
    d:
      en: |
        Manual route and network ACL changes must be repeated for every new VPC and can be undone by any team, so they do not enforce the rule for future VPCs.
      fr: |
        Des modifications manuelles des routes et des ACL réseau doivent être répétées pour chaque nouveau VPC et peuvent être annulées par n'importe quelle équipe : elles n'imposent pas la règle aux futurs VPC.
references:
  - title: Block public access to VPCs and subnets
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa.html
