id: soac03-5b-cf-realtime-logs
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A streaming company needs a live operations dashboard for its Amazon CloudFront distribution. The dashboard must show the status codes, edge result types and time taken of viewer requests within seconds of each request. To control costs, only about 10% of the requests must be logged.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de streaming a besoin d'un tableau de bord d'exploitation en direct pour sa distribution Amazon CloudFront. Le tableau de bord doit afficher les codes d'état, les types de résultat en périphérie et la durée des requêtes des utilisateurs dans les secondes qui suivent chaque requête. Pour maîtriser les coûts, seules environ 10 % des requêtes doivent être journalisées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on standard logging (v2) with an Amazon CloudWatch Logs destination, and build the dashboard from the log group.", fr: "Activer la journalisation standard (v2) avec une destination Amazon CloudWatch Logs, et construire le tableau de bord à partir du groupe de journaux." }
    - id: b
      text: { en: "Create a real-time log configuration with a sampling rate of 10 that sends the logs to an Amazon Kinesis data stream, and attach it to the cache behaviors.", fr: "Créer une configuration de journaux en temps réel avec un taux d'échantillonnage de 10, qui envoie les journaux vers un flux de données Amazon Kinesis, et l'associer aux comportements de cache." }
    - id: c
      text: { en: "Create an AWS CloudTrail trail for CloudFront, and build the dashboard from the trail's events.", fr: "Créer un journal de suivi AWS CloudTrail pour CloudFront, et construire le tableau de bord à partir des événements du journal de suivi." }
    - id: d
      text: { en: "Build the dashboard from the default CloudFront metrics in Amazon CloudWatch, with a period of 10 seconds.", fr: "Construire le tableau de bord à partir des métriques CloudFront par défaut dans Amazon CloudWatch, avec une période de 10 secondes." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CloudFront real-time access logs are delivered to a Kinesis data stream within seconds of the requests. The configuration sets a sampling rate from 1 to 100, which here limits logging to about 10% of the requests, and the fields to include, such as sc-status, x-edge-result-type and time-taken. It is attached to one or more cache behaviors.
    fr: |
      Les journaux d'accès en temps réel de CloudFront sont livrés dans un flux de données Kinesis dans les secondes qui suivent les requêtes. La configuration définit un taux d'échantillonnage de 1 à 100, qui limite ici la journalisation à environ 10 % des requêtes, et les champs à inclure, comme sc-status, x-edge-result-type et time-taken. Elle est associée à un ou plusieurs comportements de cache.
  options:
    a:
      en: |
        Standard logs are designed for historical analysis rather than live monitoring, and they record every request instead of a sample.
      fr: |
        Les journaux standard sont conçus pour l'analyse historique plutôt que pour la surveillance en direct, et ils enregistrent chaque requête au lieu d'un échantillon.
    c:
      en: |
        CloudTrail records API calls that manage CloudFront, not viewer requests.
      fr: |
        CloudTrail enregistre les appels d'API qui gèrent CloudFront, pas les requêtes des utilisateurs.
    d:
      en: |
        The default metrics are aggregated counts and rates; they do not contain per-request fields such as the edge result type of each request.
      fr: |
        Les métriques par défaut sont des comptages et des taux agrégés ; elles ne contiennent pas de champs par requête, comme le type de résultat en périphérie de chaque requête.
references:
  - title: Use real-time access logs
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/real-time-logs.html
  - title: CloudFront and edge function logging
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/logging.html
