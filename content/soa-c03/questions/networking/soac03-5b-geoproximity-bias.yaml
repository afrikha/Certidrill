id: soac03-5b-geoproximity-bias
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Route 53 geoproximity records for api.example.com. One record points to resources in us-east-1, and the other points to resources in eu-west-1. Both records have a bias of 0. The eu-west-1 resources are near their capacity, and the company has added capacity in us-east-1. Users must still be routed by location, but the area that us-east-1 serves must grow so that some users near the boundary move to us-east-1.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise des enregistrements de géoproximité Route 53 pour api.example.com. Un enregistrement pointe vers des ressources dans us-east-1, et l'autre vers des ressources dans eu-west-1. Les deux enregistrements ont un biais de 0. Les ressources de eu-west-1 approchent de leur capacité maximale, et l'entreprise a ajouté de la capacité dans us-east-1. Les utilisateurs doivent toujours être routés selon leur emplacement, mais la zone servie par us-east-1 doit s'agrandir pour que certains utilisateurs proches de la limite passent vers us-east-1.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set a positive bias, such as 20, on the eu-west-1 record.", fr: "Définir un biais positif, par exemple 20, sur l'enregistrement eu-west-1." }
    - id: b
      text: { en: "Replace the records with weighted records that give us-east-1 a higher weight.", fr: "Remplacer les enregistrements par des enregistrements pondérés qui donnent un poids plus élevé à us-east-1." }
    - id: c
      text: { en: "Lower the TTL of both records so that resolvers query Route 53 more often.", fr: "Réduire la durée de vie (TTL) des deux enregistrements pour que les résolveurs interrogent Route 53 plus souvent." }
    - id: d
      text: { en: "Set a positive bias, such as 20, on the us-east-1 record.", fr: "Définir un biais positif, par exemple 20, sur l'enregistrement us-east-1." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A positive bias from 1 to 99 expands the geographic area from which Route 53 routes traffic to a resource and shrinks the adjacent areas. Raising the bias of the us-east-1 record moves users near the boundary to us-east-1 while routing stays location based. AWS recommends changing the bias in small steps.
    fr: |
      Un biais positif de 1 à 99 agrandit la zone géographique depuis laquelle Route 53 route le trafic vers une ressource et réduit les zones voisines. Augmenter le biais de l'enregistrement us-east-1 fait passer vers us-east-1 les utilisateurs proches de la limite, tout en conservant un routage par emplacement. AWS recommande de modifier le biais par petites étapes.
  options:
    a:
      en: |
        A positive bias on eu-west-1 enlarges the area that eu-west-1 serves and sends it even more users.
      fr: |
        Un biais positif sur eu-west-1 agrandit la zone servie par eu-west-1 et lui envoie encore plus d'utilisateurs.
    b:
      en: |
        Weighted routing ignores the user's location, which breaks the requirement to keep routing by location.
      fr: |
        Le routage pondéré ignore l'emplacement de l'utilisateur, ce qui enfreint l'exigence de conserver un routage par emplacement.
    c:
      en: |
        The TTL changes how long answers are cached, not which Region Route 53 chooses for a user.
      fr: |
        La durée de vie modifie la durée de mise en cache des réponses, pas la Région que Route 53 choisit pour un utilisateur.
references:
  - title: Geoproximity routing
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-geoproximity.html
