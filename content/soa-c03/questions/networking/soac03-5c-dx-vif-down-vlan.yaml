id: soac03-5c-dx-vif-down-vlan
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has an AWS Direct Connect dedicated connection whose state is available, and the port on the on-premises router is up. The company creates a private virtual interface with VLAN 123, but the virtual interface stays down and the router cannot ping the Amazon peer IP address. The engineer configured the customer peer IP address directly on the physical interface `GigabitEthernet0/1`. The connection passes through a switch at the colocation provider.

    Which solution will bring the virtual interface up?
  fr: |
    AnyCompany dispose d'une connexion dédiée AWS Direct Connect dont l'état est available, et le port du routeur sur site est actif. L'entreprise crée une interface virtuelle privée avec le VLAN 123, mais l'interface virtuelle reste DOWN et le routeur ne parvient pas à envoyer un ping à l'adresse IP d'homologue Amazon. L'ingénieur a configuré l'adresse IP d'homologue client directement sur l'interface physique `GigabitEthernet0/1`. La connexion passe par un commutateur chez le fournisseur de colocation.

    Quelle solution permet d'activer l'interface virtuelle ?
body:
  options:
    - { id: a, text: { en: "Configure the BGP MD5 authentication key from the router configuration file that AWS provides.", fr: "Configurer la clé d'authentification MD5 de BGP à partir du fichier de configuration de routeur fourni par AWS." } }
    - { id: b, text: { en: "Move the peer IP address to an 802.1Q subinterface for VLAN 123, and trunk VLAN 123 on the provider switch.", fr: "Déplacer l'adresse IP d'homologue sur une sous-interface 802.1Q pour le VLAN 123, et transporter le VLAN 123 sur le commutateur du fournisseur." } }
    - { id: c, text: { en: "Enable route propagation from the virtual private gateway on the route tables of the VPC that use the connection.", fr: "Activer la propagation des routes depuis la passerelle privée virtuelle sur les tables de routage du VPC qui utilisent la connexion." } }
    - { id: d, text: { en: "Reduce the number of prefixes that the router advertises on the virtual interface to fewer than 100.", fr: "Réduire à moins de 100 le nombre de préfixes que le routeur annonce sur l'interface virtuelle." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A virtual interface that is down while the physical connection is up points to a layer 2 issue. The peer IP address must be on the VLAN subinterface (for example GigabitEthernet0/1.123), not on the physical interface, and intermediate devices must trunk the 802.1Q tag, because AWS cannot establish ARP until it receives tagged traffic."
    fr: "Une interface virtuelle DOWN alors que la connexion physique est active indique un problème de couche 2. L'adresse IP d'homologue doit se trouver sur la sous-interface VLAN (par exemple GigabitEthernet0/1.123), pas sur l'interface physique, et les équipements intermédiaires doivent transporter la balise 802.1Q, car AWS ne peut pas établir l'ARP tant qu'il ne reçoit pas de trafic balisé."
  options:
    a:
      en: "The MD5 key matters for the BGP session, which comes after layer 2 works; the router cannot even ping the Amazon peer IP address yet."
      fr: "La clé MD5 concerne la session BGP, qui vient après le bon fonctionnement de la couche 2 ; le routeur ne peut même pas encore envoyer de ping à l'adresse IP d'homologue Amazon."
    c:
      en: "Route propagation fixes routing after BGP is established; it does not bring up a virtual interface."
      fr: "La propagation des routes corrige le routage une fois BGP établi ; elle n'active pas une interface virtuelle."
    d:
      en: "The prefix limit affects the BGP session, not the layer 2 connectivity that prevents the ping to the Amazon peer IP address."
      fr: "La limite de préfixes concerne la session BGP, pas la connectivité de couche 2 qui empêche le ping vers l'adresse IP d'homologue Amazon."
references:
  - title: Troubleshoot layer 2 (data link) issues
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/ts-layer-2.html
