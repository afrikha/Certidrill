id: soac03-5b-weighted-canary
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company serves app.example.com from an Application Load Balancer (ALB) named blue-alb. The record is a Route 53 alias record in a public hosted zone. The company deployed a new version of the application behind a second ALB named green-alb in the same Region. About 10% of DNS responses must point to green-alb, and the company wants to increase this share gradually.

    Which solution will meet these requirements?
  fr: |
    Une entreprise sert app.example.com depuis un Application Load Balancer (ALB) nommé blue-alb. L'enregistrement est un enregistrement d'alias Route 53 dans une zone hébergée publique. L'entreprise a déployé une nouvelle version de l'application derrière un second ALB nommé green-alb dans la même Région. Environ 10 % des réponses DNS doivent pointer vers green-alb, et l'entreprise veut augmenter cette part progressivement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create two weighted alias records for app.example.com, one for each ALB, with weights of 90 and 10.", fr: "Créer deux enregistrements d'alias pondérés pour app.example.com, un par ALB, avec des poids de 90 et 10." }
    - id: b
      text: { en: "Create two latency alias records for app.example.com, one for each ALB, and set Evaluate Target Health to Yes.", fr: "Créer deux enregistrements d'alias de latence pour app.example.com, un par ALB, et définir Evaluate Target Health sur Yes." }
    - id: c
      text: { en: "Create two failover alias records for app.example.com, with blue-alb as primary and green-alb as secondary.", fr: "Créer deux enregistrements d'alias de basculement pour app.example.com, avec blue-alb comme principal et green-alb comme secondaire." }
    - id: d
      text: { en: "Create multivalue answer records for app.example.com that contain the current IP addresses of both ALBs.", fr: "Créer des enregistrements de réponse à valeurs multiples pour app.example.com contenant les adresses IP actuelles des deux ALB." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Weighted routing answers each record in proportion to its weight divided by the sum of the weights, so weights of 90 and 10 send about 10% of the responses to green-alb. Changing the weights later shifts traffic gradually, and a weight of 0 stops traffic to a record.
    fr: |
      Le routage pondéré renvoie chaque enregistrement en proportion de son poids divisé par la somme des poids : des poids de 90 et 10 envoient environ 10 % des réponses vers green-alb. Modifier ensuite les poids déplace le trafic progressivement, et un poids de 0 arrête le trafic vers un enregistrement.
  options:
    b:
      en: |
        Both ALBs are in the same Region, so latency routing has no basis for a split and cannot set a percentage.
      fr: |
        Les deux ALB sont dans la même Région : le routage par latence n'a aucune base pour répartir le trafic et ne permet pas de fixer un pourcentage.
    c:
      en: |
        Failover routing sends all traffic to the primary while it is healthy; the secondary receives traffic only after a failure.
      fr: |
        Le routage de basculement envoie tout le trafic vers le principal tant qu'il est sain ; le secondaire ne reçoit du trafic qu'après une défaillance.
    d:
      en: |
        ALB IP addresses change over time, and multivalue answer routing returns values without a configurable proportion.
      fr: |
        Les adresses IP d'un ALB changent au fil du temps, et le routage de réponse à valeurs multiples renvoie des valeurs sans proportion configurable.
references:
  - title: Weighted routing
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-weighted.html
