id: soac03-5b-geolocation-default
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Route 53 geolocation records for shop.example.com. One record for Europe points to an Application Load Balancer (ALB) in eu-west-1, and one record for North America points to an ALB in us-east-1. Customers in Asia and some customers who use public DNS resolvers report that shop.example.com does not resolve; their queries get a NOERROR response with no address. All these customers must be sent to the us-east-1 ALB.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise des enregistrements de géolocalisation Route 53 pour shop.example.com. Un enregistrement pour l'Europe pointe vers un Application Load Balancer (ALB) dans eu-west-1, et un enregistrement pour l'Amérique du Nord pointe vers un ALB dans us-east-1. Des clients en Asie et certains clients qui utilisent des résolveurs DNS publics signalent que shop.example.com ne se résout pas : leurs requêtes reçoivent une réponse NOERROR sans adresse. Tous ces clients doivent être envoyés vers l'ALB de us-east-1.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a geolocation record for each of the remaining continents that points to the us-east-1 ALB.", fr: "Ajouter un enregistrement de géolocalisation pour chacun des autres continents, qui pointe vers l'ALB de us-east-1." }
    - id: b
      text: { en: "Add a simple routing record for shop.example.com that points to the us-east-1 ALB.", fr: "Ajouter un enregistrement de routage simple pour shop.example.com qui pointe vers l'ALB de us-east-1." }
    - id: c
      text: { en: "Add a geolocation record with the Default location that points to the us-east-1 ALB.", fr: "Ajouter un enregistrement de géolocalisation avec l'emplacement Default qui pointe vers l'ALB de us-east-1." }
    - id: d
      text: { en: "Lower the TTL of both geolocation records to 60 seconds so that resolvers query Route 53 again.", fr: "Réduire la durée de vie (TTL) des deux enregistrements de géolocalisation à 60 secondes pour que les résolveurs interrogent de nouveau Route 53." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Without a default record, Route 53 returns no answer for queries from locations that have no geolocation record and for IP addresses it cannot map to a location. A record with the Default location handles both cases and sends these customers to the us-east-1 ALB.
    fr: |
      Sans enregistrement par défaut, Route 53 ne renvoie aucune réponse pour les requêtes provenant d'emplacements sans enregistrement de géolocalisation et pour les adresses IP qu'il ne peut associer à aucun emplacement. Un enregistrement avec l'emplacement Default traite ces deux cas et envoie ces clients vers l'ALB de us-east-1.
  options:
    a:
      en: |
        Continent records fix the Asian customers, but queries from IP addresses that Route 53 cannot map to any location still get no answer.
      fr: |
        Des enregistrements par continent règlent le cas des clients asiatiques, mais les requêtes provenant d'adresses IP que Route 53 ne peut associer à aucun emplacement restent sans réponse.
    b:
      en: |
        Route 53 does not accept a simple record with the same name and type as records that use another routing policy; the fallback is the Default location.
      fr: |
        Route 53 n'accepte pas un enregistrement simple portant le même nom et le même type que des enregistrements utilisant une autre politique de routage ; le repli est l'emplacement Default.
    d:
      en: |
        The TTL controls caching only; Route 53 would still have no record to return for these locations.
      fr: |
        La durée de vie ne contrôle que la mise en cache ; Route 53 n'aurait toujours aucun enregistrement à renvoyer pour ces emplacements.
references:
  - title: Geolocation routing
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-geo.html
