id: soac03-5a-main-rt-implicit
objective: "5.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    In a VPC, the main route table has a `0.0.0.0/0` route to the internet gateway. The three existing public subnets have no explicit route table association. Teams that create new subnets have found that the new subnets are public by default. The company wants new subnets to be private unless someone explicitly makes them public, and the existing public subnets must keep their internet access.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Dans un VPC, la table de routage principale contient une route `0.0.0.0/0` vers la passerelle Internet. Les trois sous-réseaux publics existants n'ont pas d'association explicite à une table de routage. Les équipes qui créent de nouveaux sous-réseaux ont constaté que ceux-ci sont publics par défaut. L'entreprise veut que les nouveaux sous-réseaux soient privés à moins que quelqu'un ne les rende explicitement publics, et les sous-réseaux publics existants doivent conserver leur accès Internet.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Delete the main route table and create a new main route table that has only the local route.", fr: "Supprimer la table de routage principale et créer une nouvelle table principale qui ne contient que la route locale." } }
    - { id: b, text: { en: "Create a custom route table with a 0.0.0.0/0 route to the internet gateway and explicitly associate the three public subnets with it.", fr: "Créer une table de routage personnalisée avec une route 0.0.0.0/0 vers la passerelle Internet et y associer explicitement les trois sous-réseaux publics." } }
    - { id: c, text: { en: "Turn off automatic public IPv4 address assignment on every subnet of the VPC.", fr: "Désactiver l'attribution automatique d'adresses IPv4 publiques sur chaque sous-réseau du VPC." } }
    - { id: d, text: { en: "Remove the 0.0.0.0/0 route from the main route table so that it keeps only the local route.", fr: "Supprimer la route 0.0.0.0/0 de la table de routage principale pour qu'elle ne garde que la route locale." } }
    - { id: e, text: { en: "Add an outbound deny rule for 0.0.0.0/0 to the default network ACL of the VPC.", fr: "Ajouter une règle sortante de refus pour 0.0.0.0/0 à l'ACL réseau par défaut du VPC." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A subnet without an explicit association uses the main route table, so a main route table with an internet route makes every new subnet public. AWS recommends leaving the main route table with only the local route and explicitly associating subnets with custom route tables. Associate the public subnets with the new custom route table first, then remove the internet route from the main route table, so that the public subnets never lose access.
    fr: |
      Un sous-réseau sans association explicite utilise la table de routage principale : une table principale qui contient une route Internet rend donc publics tous les nouveaux sous-réseaux. AWS recommande de laisser la table principale avec la seule route locale et d'associer explicitement les sous-réseaux à des tables personnalisées. Il faut d'abord associer les sous-réseaux publics à la nouvelle table personnalisée, puis supprimer la route Internet de la table principale, afin que les sous-réseaux publics ne perdent jamais leur accès.
  options:
    a:
      en: |
        The main route table cannot be deleted. Another route table can be made the main route table instead.
      fr: |
        La table de routage principale ne peut pas être supprimée. On peut en revanche désigner une autre table comme table principale.
    c:
      en: |
        Public address assignment does not decide whether a subnet is public; the route to the internet gateway does. This change would also remove public addresses from new instances in the real public subnets.
      fr: |
        L'attribution d'adresses publiques ne détermine pas si un sous-réseau est public : c'est la route vers la passerelle Internet qui le fait. Cette modification retirerait aussi les adresses publiques des nouvelles instances des vrais sous-réseaux publics.
    e:
      en: |
        Subnets that use the default network ACL include the existing public subnets, which would lose internet access, and new subnets can be associated with another network ACL.
      fr: |
        Les sous-réseaux qui utilisent l'ACL réseau par défaut incluent les sous-réseaux publics existants, qui perdraient l'accès Internet, et les nouveaux sous-réseaux peuvent être associés à une autre ACL réseau.
references:
  - title: Subnet route tables
    url: https://docs.aws.amazon.com/vpc/latest/userguide/subnet-route-tables.html
