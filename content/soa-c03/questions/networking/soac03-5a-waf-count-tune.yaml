id: soac03-5a-waf-count-tune
objective: "5.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company plans to add an AWS managed rule group to the AWS WAF web ACL that protects its production Application Load Balancer. Before the rule group blocks anything, the security team must spend one week finding out which legitimate requests it would block. The web ACL has CloudWatch metrics and sampled requests turned on.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise prévoit d'ajouter un groupe de règles géré par AWS à la liste ACL web AWS WAF qui protège son Application Load Balancer de production. Avant que le groupe de règles ne bloque quoi que ce soit, l'équipe de sécurité doit passer une semaine à déterminer quelles requêtes légitimes il bloquerait. La liste ACL web a les métriques CloudWatch et les requêtes échantillonnées activées.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the default action of the web ACL to Block during the test week.", fr: "Définir l'action par défaut de la liste ACL web sur Block pendant la semaine de test." } }
    - { id: b, text: { en: "Add the rule group to the web ACL with its override action set to Count.", fr: "Ajouter le groupe de règles à la liste ACL web avec son action de remplacement définie sur Count." } }
    - { id: c, text: { en: "Review the rule group's metrics and the sampled requests that matched its rules.", fr: "Examiner les métriques du groupe de règles et les requêtes échantillonnées qui ont correspondu à ses règles." } }
    - { id: d, text: { en: "Subscribe to AWS Shield Advanced so that the Shield Response Team reviews the rules.", fr: "Souscrire à AWS Shield Advanced pour que la Shield Response Team examine les règles." } }
    - { id: e, text: { en: "Add the rule group to a separate web ACL that is not associated with any resource.", fr: "Ajouter le groupe de règles à une liste ACL web distincte qui n'est associée à aucune ressource." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Setting the rule group's override action to Count makes every rule in the group count matching requests instead of blocking them, without editing the group. The CloudWatch metrics show how many requests each rule would act on, and the sampled requests (or full web ACL logs) show which ones they are, so the team can find false positives before switching to the rules' own actions.
    fr: |
      Définir l'action de remplacement du groupe de règles sur Count fait compter les requêtes correspondantes par chaque règle du groupe au lieu de les bloquer, sans modifier le groupe. Les métriques CloudWatch montrent combien de requêtes chaque règle traiterait, et les requêtes échantillonnées (ou les journaux complets de la liste ACL web) montrent lesquelles : l'équipe peut ainsi repérer les faux positifs avant de revenir aux actions propres aux règles.
  options:
    a:
      en: |
        A Block default action blocks every request that no rule allows, which would disrupt production instead of measuring the new rules.
      fr: |
        Une action par défaut Block bloque toute requête qu'aucune règle n'autorise, ce qui perturberait la production au lieu de mesurer les nouvelles règles.
    d:
      en: |
        Shield Advanced adds DDoS protection and response support. It is not needed to test rule matches.
      fr: |
        Shield Advanced ajoute une protection DDoS et une assistance à la réponse. Il n'est pas nécessaire pour tester les correspondances des règles.
    e:
      en: |
        A web ACL that is not associated with a resource inspects no traffic, so it would collect no matches.
      fr: |
        Une liste ACL web qui n'est associée à aucune ressource n'inspecte aucun trafic : elle ne collecterait aucune correspondance.
references:
  - title: Testing and tuning your AWS WAF protections
    url: https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-testing.html
