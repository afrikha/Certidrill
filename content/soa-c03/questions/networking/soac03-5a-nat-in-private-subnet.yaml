id: soac03-5a-nat-in-private-subnet
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Instances in a private subnet of a VPC cannot download updates from the internet. A CloudOps engineer collects the following configuration. The NAT gateway is a public NAT gateway in zonal availability mode, and its state is `available`. Security groups and network ACLs allow the traffic.

    ```text
    NAT gateway nat-0c1d2e3f4a5b6c7d8   subnet: private-a (10.0.11.0/24)
    Route table of private-a:  10.0.0.0/16 -> local
                               0.0.0.0/0   -> nat-0c1d2e3f4a5b6c7d8
    Route table of public-a:   10.0.0.0/16 -> local
                               0.0.0.0/0   -> igw-0f1e2d3c4b5a69788
    ```

    Which solution will restore internet access for the instances?
  fr: |
    Les instances d'un sous-réseau privé d'un VPC ne peuvent pas télécharger de mises à jour depuis Internet. Un ingénieur CloudOps relève la configuration suivante. La passerelle NAT est une passerelle NAT publique en mode de disponibilité zonal, et son état est `available`. Les groupes de sécurité et les ACL réseau autorisent le trafic.

    ```text
    NAT gateway nat-0c1d2e3f4a5b6c7d8   subnet: private-a (10.0.11.0/24)
    Route table of private-a:  10.0.0.0/16 -> local
                               0.0.0.0/0   -> nat-0c1d2e3f4a5b6c7d8
    Route table of public-a:   10.0.0.0/16 -> local
                               0.0.0.0/0   -> igw-0f1e2d3c4b5a69788
    ```

    Quelle solution rétablit l'accès Internet des instances ?
body:
  options:
    - id: a
      text: { en: "Add a 0.0.0.0/0 route to the internet gateway in the route table of private-a.", fr: "Ajouter une route 0.0.0.0/0 vers la passerelle Internet dans la table de routage de private-a." }
    - id: b
      text: { en: "Associate an Elastic IP address with each instance in private-a.", fr: "Associer une adresse IP Elastic à chaque instance de private-a." }
    - id: c
      text: { en: "Create a private NAT gateway in public-a and point the private-a default route to it.", fr: "Créer une passerelle NAT privée dans public-a et faire pointer la route par défaut de private-a vers elle." }
    - id: d
      text: { en: "Create a public NAT gateway in public-a and point the private-a default route to it.", fr: "Créer une passerelle NAT publique dans public-a et faire pointer la route par défaut de private-a vers elle." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A zonal public NAT gateway must sit in a public subnet whose route table sends internet traffic to the internet gateway. This NAT gateway is in private-a, whose only default route points back to the NAT gateway, so its traffic never reaches the internet gateway. A new NAT gateway in public-a, used as the target of the private-a default route, fixes the path; the old NAT gateway can then be deleted.
    fr: |
      Une passerelle NAT publique zonale doit se trouver dans un sous-réseau public dont la table de routage envoie le trafic Internet vers la passerelle Internet. Cette passerelle NAT est dans private-a, dont la seule route par défaut renvoie vers la passerelle NAT elle-même : son trafic n'atteint donc jamais la passerelle Internet. Une nouvelle passerelle NAT dans public-a, utilisée comme cible de la route par défaut de private-a, corrige le chemin ; l'ancienne passerelle NAT peut ensuite être supprimée.
  options:
    a:
      en: |
        A route table cannot contain two routes for the same destination, and sending the instances directly to the internet gateway would make the subnet public without giving the instances public addresses.
      fr: |
        Une table de routage ne peut pas contenir deux routes pour la même destination, et envoyer les instances directement vers la passerelle Internet rendrait le sous-réseau public sans leur donner d'adresses publiques.
    b:
      en: |
        Elastic IP addresses do not help while the subnet's default route points to the NAT gateway, and the requirement is outbound access from a private subnet.
      fr: |
        Les adresses IP Elastic n'aident pas tant que la route par défaut du sous-réseau pointe vers la passerelle NAT, et l'exigence porte sur un accès sortant depuis un sous-réseau privé.
    c:
      en: |
        A private NAT gateway has no Elastic IP address and cannot send traffic to the internet; an internet gateway drops the traffic that it receives from a private NAT gateway.
      fr: |
        Une passerelle NAT privée n'a pas d'adresse IP Elastic et ne peut pas envoyer de trafic vers Internet ; une passerelle Internet abandonne le trafic qu'elle reçoit d'une passerelle NAT privée.
references:
  - title: NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
  - title: Troubleshoot NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-troubleshooting.html
