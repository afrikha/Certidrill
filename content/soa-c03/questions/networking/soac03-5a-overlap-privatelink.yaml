id: soac03-5a-overlap-privatelink
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company acquired another business. Applications in the acquired company's VPC must call one TCP-based API that runs behind a Network Load Balancer in the company's VPC. Both VPCs use the CIDR block `10.0.0.0/16`, and neither VPC can be readdressed. Only the applications in the acquired company's VPC start connections.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a racheté une autre société. Les applications du VPC de la société rachetée doivent appeler une API TCP qui s'exécute derrière un Network Load Balancer dans le VPC de l'entreprise. Les deux VPC utilisent le bloc CIDR `10.0.0.0/16`, et aucun des deux ne peut être réadressé. Seules les applications du VPC de la société rachetée ouvrent des connexions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a VPC peering connection and add routes for only the subnets that host the API and its clients.", fr: "Créer une connexion d'appairage de VPC et ajouter des routes uniquement pour les sous-réseaux qui hébergent l'API et ses clients." }
    - id: b
      text: { en: "Associate a new secondary CIDR block with each VPC, and then peer the VPCs over the new ranges.", fr: "Associer un nouveau bloc CIDR secondaire à chaque VPC, puis appairer les VPC sur les nouvelles plages." }
    - id: c
      text: { en: "Create an endpoint service for the Network Load Balancer and an interface endpoint in the acquired VPC.", fr: "Créer un service de point de terminaison pour le Network Load Balancer et un point de terminaison d'interface dans le VPC racheté." }
    - id: d
      text: { en: "Create a gateway VPC endpoint in the acquired VPC that targets the Network Load Balancer.", fr: "Créer un point de terminaison de VPC de passerelle dans le VPC racheté qui cible le Network Load Balancer." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AWS PrivateLink exposes a service behind a Network Load Balancer through an endpoint service. The consumer reaches it through an interface endpoint whose network interfaces use addresses of the consumer VPC, so the provider and consumer VPCs can have overlapping CIDR blocks. Only the consumer side can start connections, which matches the requirement.
    fr: |
      AWS PrivateLink expose un service situé derrière un Network Load Balancer par un service de point de terminaison. Le consommateur le joint par un point de terminaison d'interface dont les interfaces réseau utilisent des adresses du VPC consommateur : les VPC du fournisseur et du consommateur peuvent donc avoir des blocs CIDR qui se chevauchent. Seul le côté consommateur peut ouvrir des connexions, ce qui correspond à l'exigence.
  options:
    a:
      en: |
        VPCs with matching or overlapping CIDR blocks cannot be peered, even if routes cover only some subnets.
      fr: |
        Des VPC dont les blocs CIDR sont identiques ou se chevauchent ne peuvent pas être appairés, même si les routes ne couvrent que certains sous-réseaux.
    b:
      en: |
        The peering restriction applies to all CIDR blocks of the VPCs, even if only the non-overlapping blocks would be used.
      fr: |
        La restriction d'appairage s'applique à tous les blocs CIDR des VPC, même si seuls les blocs qui ne se chevauchent pas étaient utilisés.
    d:
      en: |
        Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB. They cannot target a load balancer.
      fr: |
        Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB. Ils ne peuvent pas cibler un équilibreur de charge.
references:
  - title: AWS PrivateLink
    url: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/aws-privatelink.html
  - title: How VPC peering connections work
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html
