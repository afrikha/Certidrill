id: soac03-5c-vpce-timeout-causes
objective: "5.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An application on Amazon EC2 instances in subnet App (10.0.1.0/24) sends messages to Amazon SQS through an interface VPC endpoint whose network interfaces are in subnet Endpoints (10.0.2.0/24). Private DNS is enabled on the endpoint, and on the instances the SQS endpoint name resolves to addresses in 10.0.2.0/24. The security group of the instances allows all outbound traffic. Every HTTPS connection from the application to SQS times out.

    Which two issues could cause the timeouts? (Choose two.)
  fr: |
    Une application exécutée sur des instances Amazon EC2 dans le sous-réseau App (10.0.1.0/24) envoie des messages à Amazon SQS par un point de terminaison de VPC d'interface dont les interfaces réseau se trouvent dans le sous-réseau Endpoints (10.0.2.0/24). Le DNS privé est activé sur le point de terminaison et, sur les instances, le nom du point de terminaison SQS se résout en adresses de 10.0.2.0/24. Le groupe de sécurité des instances autorise tout le trafic sortant. Chaque connexion HTTPS de l'application vers SQS expire.

    Quels sont les deux problèmes qui peuvent provoquer ces expirations ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The security group of the endpoint has no inbound rule that allows TCP port 443 from 10.0.1.0/24.", fr: "Le groupe de sécurité du point de terminaison n'a aucune règle entrante qui autorise le port TCP 443 depuis 10.0.1.0/24." } }
    - { id: b, text: { en: "The endpoint policy of the interface endpoint does not allow the sqs:SendMessage action.", fr: "La politique du point de terminaison d'interface n'autorise pas l'action sqs:SendMessage." } }
    - { id: c, text: { en: "The endpoint network interfaces do not reply to ping requests from the instances.", fr: "Les interfaces réseau du point de terminaison ne répondent pas aux requêtes ping des instances." } }
    - { id: d, text: { en: "The network ACL of subnet App denies inbound TCP ports 1024-65535 from 10.0.2.0/24.", fr: "La liste ACL réseau du sous-réseau App refuse en entrée les ports TCP 1024-65535 depuis 10.0.2.0/24." } }
    - { id: e, text: { en: "The security group of the instances has no inbound rule that allows TCP port 443 from 10.0.2.0/24.", fr: "Le groupe de sécurité des instances n'a aucune règle entrante qui autorise le port TCP 443 depuis 10.0.2.0/24." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The endpoint network interfaces are protected by the endpoint's security group, which must allow inbound HTTPS from the clients. Network ACLs are stateless, so the ACL of subnet App must also allow the return traffic, which comes back from port 443 to the ephemeral port of each client connection."
    fr: "Les interfaces réseau du point de terminaison sont protégées par le groupe de sécurité du point de terminaison, qui doit autoriser le HTTPS entrant depuis les clients. Les listes ACL réseau sont sans état : la liste ACL du sous-réseau App doit aussi autoriser le trafic de retour, qui revient du port 443 vers le port éphémère de chaque connexion cliente."
  options:
    b:
      en: "An endpoint policy that does not allow an action makes SQS return an access denied error; it does not make the connection time out."
      fr: "Une politique de point de terminaison qui n'autorise pas une action fait renvoyer une erreur d'accès refusé par SQS ; elle ne fait pas expirer la connexion."
    c:
      en: "Interface endpoints never reply to ping, even when they work, so this does not explain HTTPS timeouts; use nc or nmap to test them."
      fr: "Les points de terminaison d'interface ne répondent jamais au ping, même lorsqu'ils fonctionnent : cela n'explique pas les expirations HTTPS ; utilisez nc ou nmap pour les tester."
    e:
      en: "Security groups are stateful, so the responses to connections that the instances start are allowed without an inbound rule."
      fr: "Les groupes de sécurité sont avec état : les réponses aux connexions lancées par les instances sont autorisées sans règle entrante."
references:
  - title: Access an AWS service using an interface VPC endpoint
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html
