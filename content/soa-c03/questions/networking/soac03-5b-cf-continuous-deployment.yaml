id: soac03-5b-cf-continuous-deployment
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to test a new cache behavior and a new origin for its Amazon CloudFront distribution, which serves www.example.com. About 5% of real viewer requests must use the new configuration, and each viewer must stay on the same configuration during a session. If the test succeeds, the company wants to apply the new configuration to all traffic without re-creating it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise veut tester un nouveau comportement de cache et une nouvelle origine pour sa distribution Amazon CloudFront, qui sert www.example.com. Environ 5 % des requêtes réelles des utilisateurs doivent utiliser la nouvelle configuration, et chaque utilisateur doit rester sur la même configuration pendant une session. Si le test réussit, l'entreprise veut appliquer la nouvelle configuration à tout le trafic sans la recréer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a staging distribution and a continuous deployment policy with a header-based configuration that uses an aws-cf-cd- header, then promote the staging configuration.", fr: "Créer une distribution intermédiaire et une politique de déploiement continu avec une configuration fondée sur un en-tête aws-cf-cd-, puis promouvoir la configuration intermédiaire." }
    - id: b
      text: { en: "Create a second distribution with the new settings, and use Route 53 weighted records to send 5% of www.example.com queries to it.", fr: "Créer une seconde distribution avec les nouveaux paramètres, et utiliser des enregistrements pondérés Route 53 pour lui envoyer 5 % des requêtes www.example.com." }
    - id: c
      text: { en: "Create a staging distribution and a continuous deployment policy with a 5% weight-based configuration and session stickiness, then promote the staging configuration.", fr: "Créer une distribution intermédiaire et une politique de déploiement continu avec une configuration pondérée à 5 % et l'adhérence de session (session stickiness), puis promouvoir la configuration intermédiaire." }
    - id: d
      text: { en: "Add a CloudFront function on viewer requests that rewrites 5% of the request paths to the new cache behavior.", fr: "Ajouter une fonction CloudFront sur les requêtes utilisateur qui réécrit 5 % des chemins de requête vers le nouveau comportement de cache." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CloudFront continuous deployment sends part of the primary distribution's traffic to a staging distribution. A weight-based policy sets the percentage, and session stickiness uses a cookie so that a viewer stays on one distribution during a session. Promotion copies the staging configuration to the primary distribution.
    fr: |
      Le déploiement continu CloudFront envoie une partie du trafic de la distribution principale vers une distribution intermédiaire. Une politique pondérée fixe le pourcentage, et l'adhérence de session utilise un cookie pour qu'un utilisateur reste sur une même distribution pendant une session. La promotion copie la configuration intermédiaire dans la distribution principale.
  options:
    a:
      en: |
        Header-based routing sends only requests that carry the chosen header, so ordinary viewers never reach the staging distribution.
      fr: |
        Le routage fondé sur un en-tête n'envoie que les requêtes qui portent l'en-tête choisi : les utilisateurs ordinaires n'atteignent jamais la distribution intermédiaire.
    b:
      en: |
        DNS caching makes the split imprecise, and the new settings must be re-created on the main distribution after the test.
      fr: |
        La mise en cache DNS rend la répartition imprécise, et les nouveaux paramètres doivent être recréés dans la distribution principale après le test.
    d:
      en: |
        A function that picks requests at random gives no session stickiness, and the test changes stay in the production configuration.
      fr: |
        Une fonction qui choisit des requêtes au hasard n'offre aucune adhérence de session, et les modifications de test restent dans la configuration de production.
references:
  - title: Learn how continuous deployment works
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/understanding-continuous-deployment.html
