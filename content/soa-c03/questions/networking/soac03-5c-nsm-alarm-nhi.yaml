id: soac03-5c-nsm-alarm-nhi
objective: "5.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has a Network Synthetic Monitor monitor with probes from a VPC subnet to on-premises servers over AWS Direct Connect. The operations team wants to be notified when the packet loss of any probe exceeds 0.1 %. When that happens, the team also wants to know quickly whether the degradation is inside the AWS network or in the on-premises network.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise dispose d'un moniteur Network Synthetic Monitor avec des sondes allant d'un sous-réseau du VPC vers des serveurs sur site par AWS Direct Connect. L'équipe d'exploitation veut être avertie lorsque la perte de paquets d'une sonde dépasse 0,1 %. Dans ce cas, l'équipe veut aussi savoir rapidement si la dégradation se situe dans le réseau AWS ou dans le réseau sur site.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on VPC Flow Logs for the source subnet and calculate packet loss from the rejected records.", fr: "Activer les journaux de flux VPC pour le sous-réseau source et calculer la perte de paquets à partir des enregistrements rejetés." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the packet loss metric of each probe with a static threshold of 0.1 %.", fr: "Créer une alarme CloudWatch sur la métrique de perte de paquets de chaque sonde avec un seuil statique de 0,1 %." } }
    - { id: c, text: { en: "Create an Internet Monitor monitor for the VPC so that it reports the health of the Direct Connect path.", fr: "Créer un moniteur Internet Monitor pour le VPC afin qu'il rapporte l'état du chemin Direct Connect." } }
    - { id: d, text: { en: "Check the network health indicator (NHI) of the monitor, where a value of 100 means a degradation in the AWS network.", fr: "Consulter l'indicateur de santé du réseau (NHI) du moniteur, où une valeur de 100 signifie une dégradation dans le réseau AWS." } }
    - { id: e, text: { en: "Install the CloudWatch agent on the on-premises servers to publish the packet loss of the AWS network path.", fr: "Installer l'agent CloudWatch sur les serveurs sur site pour publier la perte de paquets du chemin réseau AWS." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Network Synthetic Monitor publishes round-trip time and packet loss for each probe to CloudWatch, where the team can set an alarm with a static 0.1 % threshold. For paths through Direct Connect, the network health indicator is 100 when a degradation was observed in the AWS-controlled path and 0 when none was observed, which points the team to AWS or to its own network."
    fr: "Network Synthetic Monitor publie dans CloudWatch le temps aller-retour et la perte de paquets de chaque sonde : l'équipe peut y définir une alarme avec un seuil statique de 0,1 %. Pour les chemins via Direct Connect, l'indicateur de santé du réseau (NHI) vaut 100 lorsqu'une dégradation a été observée sur le chemin contrôlé par AWS et 0 sinon, ce qui oriente l'équipe vers AWS ou vers son propre réseau."
  options:
    a:
      en: "Flow logs record accepted and rejected traffic, not packet loss on the path, and they do not say where a degradation occurs."
      fr: "Les journaux de flux enregistrent le trafic accepté et rejeté, pas la perte de paquets sur le chemin, et ils n'indiquent pas où se produit une dégradation."
    c:
      en: "Internet Monitor measures internet traffic between the application and its users; it does not monitor Direct Connect paths to on-premises servers."
      fr: "Internet Monitor mesure le trafic Internet entre l'application et ses utilisateurs ; il ne surveille pas les chemins Direct Connect vers des serveurs sur site."
    e:
      en: "The CloudWatch agent collects system metrics and logs; it cannot tell whether loss happens inside the AWS network, and Network Synthetic Monitor needs no agents."
      fr: "L'agent CloudWatch collecte des métriques système et des journaux ; il ne peut pas dire si la perte se produit dans le réseau AWS, et Network Synthetic Monitor n'a besoin d'aucun agent."
references:
  - title: How Network Synthetic Monitor works
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/nw-monitor-how-it-works.html
