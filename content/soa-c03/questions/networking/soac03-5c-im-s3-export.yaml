id: soac03-5c-im-s3-export
objective: "5.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company monitors 100 % of the traffic of a global application with Amazon CloudWatch Internet Monitor, which covers more than 20,000 city-networks. Analysts want to query the internet measurements of every monitored city-network with Amazon Athena. In CloudWatch Logs, they find measurements for only 500 city-networks.

    Which solution will meet these requirements?
  fr: |
    Une entreprise surveille 100 % du trafic d'une application mondiale avec Amazon CloudWatch Internet Monitor, qui couvre plus de 20 000 city-networks. Les analystes veulent interroger avec Amazon Athena les mesures Internet de chaque city-network surveillé. Dans CloudWatch Logs, ils ne trouvent des mesures que pour 500 city-networks.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the retention period of the Internet Monitor log group in CloudWatch Logs to 10 years.", fr: "Porter à 10 ans la période de conservation du groupe de journaux d'Internet Monitor dans CloudWatch Logs." } }
    - { id: b, text: { en: "Configure the monitor to publish internet measurements to an Amazon S3 bucket.", fr: "Configurer le moniteur pour qu'il publie les mesures Internet dans un compartiment Amazon S3." } }
    - { id: c, text: { en: "Set the maximum number of city-networks to monitor to 500,000.", fr: "Définir le nombre maximal de city-networks à surveiller à 500 000." } }
    - { id: d, text: { en: "Add a subscription filter to the log group that streams the measurements to Amazon S3 through Data Firehose.", fr: "Ajouter au groupe de journaux un filtre d'abonnement qui diffuse les mesures vers Amazon S3 par Data Firehose." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Internet Monitor writes measurements to CloudWatch Logs every five minutes for only the top 500 city-networks of a monitor. The optional publication to Amazon S3 includes all monitored city-networks, up to the 500,000 limit, and Athena can query the files in the bucket."
    fr: "Internet Monitor écrit des mesures dans CloudWatch Logs toutes les cinq minutes pour les 500 premiers city-networks d'un moniteur seulement. La publication facultative dans Amazon S3 inclut tous les city-networks surveillés, jusqu'à la limite de 500 000, et Athena peut interroger les fichiers du compartiment."
  options:
    a:
      en: "Retention keeps log data longer, but the log group still receives measurements for only the top 500 city-networks."
      fr: "La conservation garde les journaux plus longtemps, mais le groupe de journaux ne reçoit toujours les mesures que des 500 premiers city-networks."
    c:
      en: "All traffic is already monitored; a higher maximum does not change the 500 city-networks that are written to CloudWatch Logs."
      fr: "Tout le trafic est déjà surveillé ; un maximum plus élevé ne change pas les 500 city-networks écrits dans CloudWatch Logs."
    d:
      en: "A subscription filter copies only what is in the log group, which contains measurements for 500 city-networks."
      fr: "Un filtre d'abonnement ne copie que le contenu du groupe de journaux, qui contient les mesures de 500 city-networks."
references:
  - title: How Internet Monitor works
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-IM-inside-internet-monitor.html
