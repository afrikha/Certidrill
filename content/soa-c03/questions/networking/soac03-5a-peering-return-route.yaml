id: soac03-5a-peering-return-route
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    VPC A (`10.1.0.0/16`) and VPC B (`10.2.0.0/16`) are in the same account and Region and are connected by VPC peering connection `pcx-0a11b22c33d44e55f`, which is `active`. Security groups and network ACLs in both VPCs allow the traffic. Connections from instances in VPC A to an application in VPC B time out. The route tables are shown below.

    ```text
    VPC A subnets:  10.1.0.0/16 -> local
                    10.2.0.0/16 -> pcx-0a11b22c33d44e55f
    VPC B subnets:  10.2.0.0/16 -> local
                    0.0.0.0/0   -> nat-0b1c2d3e4f5a6b7c8
    ```

    Which solution will fix the connectivity?
  fr: |
    Le VPC A (`10.1.0.0/16`) et le VPC B (`10.2.0.0/16`) se trouvent dans le même compte et la même Région et sont reliés par la connexion d'appairage de VPC `pcx-0a11b22c33d44e55f`, dont l'état est `active`. Les groupes de sécurité et les ACL réseau des deux VPC autorisent le trafic. Les connexions des instances du VPC A vers une application du VPC B expirent. Les tables de routage sont présentées ci-dessous.

    ```text
    VPC A subnets:  10.1.0.0/16 -> local
                    10.2.0.0/16 -> pcx-0a11b22c33d44e55f
    VPC B subnets:  10.2.0.0/16 -> local
                    0.0.0.0/0   -> nat-0b1c2d3e4f5a6b7c8
    ```

    Quelle solution corrige la connectivité ?
body:
  options:
    - id: a
      text: { en: "Add a route for 10.1.0.0/16 with the peering connection as the target to the VPC B route table.", fr: "Ajouter une route pour 10.1.0.0/16 avec la connexion d'appairage comme cible dans la table de routage du VPC B." }
    - id: b
      text: { en: "Turn on DNS resolution for the peering connection on both the requester and accepter sides.", fr: "Activer la résolution DNS de la connexion d'appairage du côté demandeur et du côté accepteur." }
    - id: c
      text: { en: "Create a second peering connection with VPC B as the requester to carry the return traffic.", fr: "Créer une seconde connexion d'appairage, avec le VPC B comme demandeur, pour transporter le trafic retour." }
    - id: d
      text: { en: "Add a route for 10.1.0.0/16 with the NAT gateway as the target to the VPC B route table.", fr: "Ajouter une route pour 10.1.0.0/16 avec la passerelle NAT comme cible dans la table de routage du VPC B." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Peering traffic needs a route in each VPC. VPC A sends requests over the peering connection, but VPC B has no route back to `10.1.0.0/16`, so its responses follow the default route to the NAT gateway and are lost. A route to VPC A's CIDR block through `pcx-0a11b22c33d44e55f` in VPC B completes the return path.
    fr: |
      Le trafic d'appairage a besoin d'une route dans chaque VPC. Le VPC A envoie les requêtes par la connexion d'appairage, mais le VPC B n'a pas de route de retour vers `10.1.0.0/16` : ses réponses suivent la route par défaut vers la passerelle NAT et sont perdues. Une route vers le bloc CIDR du VPC A par `pcx-0a11b22c33d44e55f` dans le VPC B complète le chemin retour.
  options:
    b:
      en: |
        DNS resolution changes how public DNS hostnames resolve across the connection. It does not add routes, and the instances already connect by IP address.
      fr: |
        La résolution DNS change la façon dont les noms d'hôte DNS publics se résolvent à travers la connexion. Elle n'ajoute pas de routes, et les instances se connectent déjà par adresse IP.
    c:
      en: |
        Two VPCs can have only one peering connection between them, and a peering connection already carries traffic in both directions.
      fr: |
        Deux VPC ne peuvent avoir qu'une seule connexion d'appairage entre eux, et une connexion d'appairage transporte déjà le trafic dans les deux sens.
    d:
      en: |
        Sending the responses to the NAT gateway does not create a path to VPC A, which is reachable only through the peering connection.
      fr: |
        Envoyer les réponses vers la passerelle NAT ne crée aucun chemin vers le VPC A, joignable uniquement par la connexion d'appairage.
references:
  - title: Update your route tables for a VPC peering connection
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-routing.html
