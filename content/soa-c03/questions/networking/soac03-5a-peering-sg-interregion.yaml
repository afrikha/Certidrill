id: soac03-5a-peering-sg-interregion
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application tier in a VPC in the us-east-1 Region reaches a database tier in a VPC in the eu-west-1 Region through an active VPC peering connection in the same account. The routes are in place. A CloudOps engineer tries to add an inbound rule to the database security group that references the application tier's security group, but the rule is rejected. Only the application tier must be allowed to reach the database port.

    Which solution will meet these requirements?
  fr: |
    Le niveau application d'un VPC de la Région us-east-1 joint le niveau base de données d'un VPC de la Région eu-west-1 par une connexion d'appairage de VPC active du même compte. Les routes sont en place. Un ingénieur CloudOps tente d'ajouter au groupe de sécurité de la base de données une règle entrante qui référence le groupe de sécurité du niveau application, mais la règle est refusée. Seul le niveau application doit pouvoir joindre le port de la base de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Reference the application security group in the account-id/sg-id format in the database rule.", fr: "Référencer le groupe de sécurité de l'application au format account-id/sg-id dans la règle de la base de données." }
    - id: b
      text: { en: "Allow the database port from the CIDR blocks of the application tier subnets in us-east-1.", fr: "Autoriser le port de la base de données depuis les blocs CIDR des sous-réseaux du niveau application dans us-east-1." }
    - id: c
      text: { en: "Turn on DNS resolution for the peering connection, and then add the security group reference again.", fr: "Activer la résolution DNS de la connexion d'appairage, puis ajouter de nouveau la référence au groupe de sécurité." }
    - id: d
      text: { en: "Add the application security group ID to a customer-managed prefix list and reference the prefix list.", fr: "Ajouter l'ID du groupe de sécurité de l'application à une liste de préfixes gérée par le client et référencer cette liste." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A security group rule can reference a security group of a peer VPC only when both VPCs are in the same Region. For inter-Region peering, the rule must use the CIDR blocks of the peer VPC or, to keep least privilege, of the application tier subnets.
    fr: |
      Une règle de groupe de sécurité ne peut référencer un groupe de sécurité d'un VPC appairé que si les deux VPC sont dans la même Région. Pour un appairage entre Régions, la règle doit utiliser les blocs CIDR du VPC appairé ou, pour respecter le moindre privilège, ceux des sous-réseaux du niveau application.
  options:
    a:
      en: |
        The `account-id/sg-id` format is for peer VPCs in another account of the same Region. It does not work across Regions.
      fr: |
        Le format `account-id/sg-id` sert aux VPC appairés d'un autre compte dans la même Région. Il ne fonctionne pas entre Régions.
    c:
      en: |
        DNS resolution affects how hostnames resolve across the connection. It does not allow security group references between Regions.
      fr: |
        La résolution DNS agit sur la résolution des noms d'hôte à travers la connexion. Elle ne permet pas de référencer des groupes de sécurité entre Régions.
    d:
      en: |
        Prefix list entries are CIDR blocks. A prefix list cannot contain security group IDs.
      fr: |
        Les entrées d'une liste de préfixes sont des blocs CIDR. Une liste de préfixes ne peut pas contenir d'ID de groupe de sécurité.
references:
  - title: Update your security groups to reference peer security groups
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-security-groups.html
