id: soac03-5b-ga-traffic-dial
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses an AWS Global Accelerator standard accelerator with one listener and two endpoint groups, one in us-west-2 and one in eu-west-1. Each endpoint group contains an Application Load Balancer. The company must perform maintenance in us-west-2 and needs Global Accelerator to stop sending new connections to that Region while eu-west-1 keeps serving users.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un accélérateur standard AWS Global Accelerator avec un écouteur et deux groupes de points de terminaison, l'un dans us-west-2 et l'autre dans eu-west-1. Chaque groupe de points de terminaison contient un Application Load Balancer. L'entreprise doit effectuer une maintenance dans us-west-2 et a besoin que Global Accelerator cesse d'envoyer de nouvelles connexions vers cette Région pendant que eu-west-1 continue de servir les utilisateurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the traffic dial of the us-west-2 endpoint group to 0.", fr: "Définir le cadran de trafic (traffic dial) du groupe de points de terminaison us-west-2 sur 0." }
    - id: b
      text: { en: "Delete the listener of the accelerator, and re-create it after the maintenance.", fr: "Supprimer l'écouteur de l'accélérateur, et le recréer après la maintenance." }
    - id: c
      text: { en: "Disable the accelerator until the maintenance is complete.", fr: "Désactiver l'accélérateur jusqu'à la fin de la maintenance." }
    - id: d
      text: { en: "Increase the health check threshold count of the us-west-2 endpoint group to 10.", fr: "Augmenter le nombre de seuils de vérification de l'état du groupe de points de terminaison us-west-2 à 10." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The traffic dial sets the percentage of traffic that an endpoint group (a Region) receives; the default is 100. Setting it to 0 cuts off new connections to us-west-2 while existing connections are not terminated, and the dial can be returned to 100 after the maintenance.
    fr: |
      Le cadran de trafic fixe le pourcentage de trafic que reçoit un groupe de points de terminaison (une Région) ; la valeur par défaut est 100. Le définir sur 0 coupe les nouvelles connexions vers us-west-2 sans terminer les connexions existantes, et le cadran peut être remis à 100 après la maintenance.
  options:
    b:
      en: |
        The listener serves both Regions, so deleting it stops traffic to eu-west-1 as well.
      fr: |
        L'écouteur sert les deux Régions : le supprimer arrête aussi le trafic vers eu-west-1.
    c:
      en: |
        A disabled accelerator stops accepting traffic for every Region.
      fr: |
        Un accélérateur désactivé cesse d'accepter le trafic pour toutes les Régions.
    d:
      en: |
        The threshold count only changes how many checks are needed to change health status; it does not drain a healthy Region.
      fr: |
        Le nombre de seuils ne change que le nombre de vérifications nécessaires pour changer d'état ; il ne vide pas une Région saine.
references:
  - title: Use traffic dials to adjust traffic flow to Regions
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoint-groups-traffic-dial.html
