id: soac03-5b-tgw-vpc-route-missing
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    VPC A (10.1.0.0/16) and VPC B (10.2.0.0/16) are attached to the same transit gateway. Both attachments are associated with the default transit gateway route table and propagate their routes to it. The subnets of VPC B route 10.1.0.0/16 to the transit gateway. Instances in VPC A cannot reach instances in VPC B. The route table of the VPC A subnets contains the following routes:

    ```text
    Destination      Target
    10.1.0.0/16      local
    0.0.0.0/0        nat-0123456789abcdef0
    ```

    Security groups and network ACLs allow the traffic. Which action will resolve the issue?
  fr: |
    Le VPC A (10.1.0.0/16) et le VPC B (10.2.0.0/16) sont attachés à la même passerelle de transit. Les deux attachements sont associés à la table de routage par défaut de la passerelle de transit et y propagent leurs routes. Les sous-réseaux du VPC B routent 10.1.0.0/16 vers la passerelle de transit. Les instances du VPC A ne parviennent pas à joindre les instances du VPC B. La table de routage des sous-réseaux du VPC A contient les routes suivantes :

    ```text
    Destination      Target
    10.1.0.0/16      local
    0.0.0.0/0        nat-0123456789abcdef0
    ```

    Les groupes de sécurité et les ACL réseau autorisent le trafic. Quelle action résout le problème ?
body:
  options:
    - id: a
      text: { en: "Turn on route propagation from the VPC B attachment to the transit gateway route table.", fr: "Activer la propagation des routes de l'attachement du VPC B vers la table de routage de la passerelle de transit." }
    - id: b
      text: { en: "Add a static route for 10.2.0.0/16 to the transit gateway route table that targets the VPC B attachment.", fr: "Ajouter à la table de routage de la passerelle de transit une route statique pour 10.2.0.0/16 qui cible l'attachement du VPC B." }
    - id: c
      text: { en: "Add a route for 10.2.0.0/16 that targets the transit gateway to the route table of the VPC A subnets.", fr: "Ajouter à la table de routage des sous-réseaux du VPC A une route pour 10.2.0.0/16 qui cible la passerelle de transit." }
    - id: d
      text: { en: "Turn on DNS support for the VPC A attachment.", fr: "Activer la prise en charge DNS pour l'attachement du VPC A." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Transit gateway route tables learn the VPC CIDRs through propagation, but the VPC route tables do not learn routes from the transit gateway. Without a route for 10.2.0.0/16, traffic from VPC A follows the default route to the NAT gateway. A route for 10.2.0.0/16 that targets the transit gateway sends the traffic to VPC B.
    fr: |
      Les tables de routage de la passerelle de transit apprennent les CIDR des VPC par propagation, mais les tables de routage des VPC n'apprennent pas de routes depuis la passerelle de transit. Sans route pour 10.2.0.0/16, le trafic du VPC A suit la route par défaut vers la passerelle NAT. Une route pour 10.2.0.0/16 qui cible la passerelle de transit envoie le trafic vers le VPC B.
  options:
    a:
      en: |
        Propagation is already on; the transit gateway knows 10.2.0.0/16, but VPC A never sends the traffic to it.
      fr: |
        La propagation est déjà activée ; la passerelle de transit connaît 10.2.0.0/16, mais le VPC A ne lui envoie jamais le trafic.
    b:
      en: |
        A static route duplicates the propagated route and does not change the VPC A route table, where the traffic is misrouted.
      fr: |
        Une route statique double la route propagée et ne modifie pas la table de routage du VPC A, où le trafic est mal routé.
    d:
      en: |
        DNS support affects name resolution of public DNS hostnames, not the routing of packets to IP addresses.
      fr: |
        La prise en charge DNS concerne la résolution des noms d'hôte DNS publics, pas le routage de paquets vers des adresses IP.
references:
  - title: Transit gateway route tables in AWS Transit Gateway
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-route-tables.html
  - title: Amazon VPC attachments in AWS Transit Gateway
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-vpc-attachments.html
