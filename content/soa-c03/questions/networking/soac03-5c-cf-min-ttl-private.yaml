id: soac03-5c-cf-min-ttl-private
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company serves its website through an Amazon CloudFront distribution with an Application Load Balancer origin. Account pages use the same URLs for every signed-in user, for example `/account/summary`. The `/account/*` cache behavior uses a custom cache policy, attached to no other behavior, with a minimum TTL of 60 seconds, a default TTL of 300 seconds, and a maximum TTL of 3,600 seconds. The origin returns `Cache-Control: private, no-store` with account pages, but users sometimes see account pages that belong to other users. The company must stop serving one user's account pages to other users.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de vente au détail sert son site web via une distribution Amazon CloudFront dont l'origine est un Application Load Balancer. Les pages de compte utilisent les mêmes URL pour tous les utilisateurs connectés, par exemple `/account/summary`. Le comportement de cache `/account/*` utilise une politique de cache personnalisée, associée à aucun autre comportement, avec une durée de vie (TTL) minimale de 60 secondes, un TTL par défaut de 300 secondes et un TTL maximal de 3 600 secondes. L'origine renvoie `Cache-Control: private, no-store` avec les pages de compte, mais des utilisateurs voient parfois des pages de compte qui appartiennent à d'autres utilisateurs. L'entreprise doit cesser de servir les pages de compte d'un utilisateur à d'autres utilisateurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the Cache-Control header to an origin request policy that is attached to the /account/* behavior.", fr: "Ajouter l'en-tête Cache-Control à une politique de demande d'origine associée au comportement /account/*." } }
    - { id: b, text: { en: "Lower the maximum TTL of the cache policy that the /account/* behavior uses to 60 seconds.", fr: "Abaisser à 60 secondes le TTL maximal de la politique de cache utilisée par le comportement /account/*." } }
    - { id: c, text: { en: "Set the minimum TTL of the cache policy that the /account/* behavior uses to 0 seconds.", fr: "Définir à 0 seconde le TTL minimal de la politique de cache utilisée par le comportement /account/*." } }
    - { id: d, text: { en: "Add a CloudFront function on viewer request that adds Cache-Control: no-cache to /account/* requests.", fr: "Ajouter une fonction CloudFront sur la demande de l'utilisateur qui ajoute Cache-Control: no-cache aux demandes /account/*." } }
answer: { optionId: c }
explanation:
  correct:
    en: "When the minimum TTL is greater than 0, CloudFront caches objects for at least the minimum TTL even if the origin sends no-cache, no-store or private. With a minimum TTL of 0, CloudFront respects these directives, so account pages are no longer cached and served to other users. The policy is attached only to /account/*, so the other behaviors keep their settings."
    fr: "Lorsque le TTL minimal est supérieur à 0, CloudFront met les objets en cache pendant au moins ce TTL minimal, même si l'origine envoie no-cache, no-store ou private. Avec un TTL minimal de 0, CloudFront respecte ces directives : les pages de compte ne sont plus mises en cache ni servies à d'autres utilisateurs. La politique n'est associée qu'à /account/*, donc les autres comportements conservent leurs paramètres."
  options:
    a:
      en: "An origin request policy only adds values to the requests sent to the origin; it does not change how long CloudFront caches the responses."
      fr: "Une politique de demande d'origine ajoute seulement des valeurs aux demandes envoyées à l'origine ; elle ne change pas la durée de mise en cache des réponses par CloudFront."
    b:
      en: "The minimum TTL of 60 seconds still applies, so CloudFront keeps caching each account page for at least 60 seconds."
      fr: "Le TTL minimal de 60 secondes s'applique toujours : CloudFront continue de mettre chaque page de compte en cache pendant au moins 60 secondes."
    d:
      en: "CloudFront ignores Cache-Control and Pragma headers in viewer requests, so a request header cannot force CloudFront to go back to the origin."
      fr: "CloudFront ignore les en-têtes Cache-Control et Pragma dans les demandes des utilisateurs : un en-tête de demande ne peut pas obliger CloudFront à retourner à l'origine."
references:
  - title: Manage how long content stays in the cache (expiration)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html
  - title: Understand cache policies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-key-understand-cache-policy.html
