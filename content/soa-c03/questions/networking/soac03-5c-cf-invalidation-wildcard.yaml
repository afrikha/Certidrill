id: soac03-5c-cf-invalidation-wildcard
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A CloudOps engineer at AnyCompany deploys new style sheets for a website that is served by an Amazon CloudFront distribution. The cache policy of the behavior does not include query strings, headers or cookies in the cache key. After the deployment, the engineer runs the following command:

    ```bash
    aws cloudfront create-invalidation --distribution-id E2EXAMPLE1 --paths "/assets/*.css"
    ```

    The invalidation reaches the Completed status, but viewers still receive the old versions of `/assets/site.css` and `/assets/print.css`.

    Which solution will make viewers receive the new style sheets?
  fr: |
    Un ingénieur CloudOps d'AnyCompany déploie de nouvelles feuilles de style pour un site web servi par une distribution Amazon CloudFront. La politique de cache du comportement n'inclut ni chaînes de requête, ni en-têtes, ni cookies dans la clé de cache. Après le déploiement, l'ingénieur exécute la commande suivante :

    ```bash
    aws cloudfront create-invalidation --distribution-id E2EXAMPLE1 --paths "/assets/*.css"
    ```

    L'invalidation atteint le statut Completed, mais les utilisateurs reçoivent toujours les anciennes versions de `/assets/site.css` et `/assets/print.css`.

    Quelle solution permet aux utilisateurs de recevoir les nouvelles feuilles de style ?
body:
  options:
    - { id: a, text: { en: "Run the same invalidation again with the AWS CLI configured for the us-east-1 Region.", fr: "Exécuter de nouveau la même invalidation avec l'AWS CLI configurée pour la Région us-east-1." } }
    - { id: b, text: { en: "Also invalidate the Gzip and Brotli variants of each style sheet with their own paths.", fr: "Invalider aussi les variantes Gzip et Brotli de chaque feuille de style avec leurs propres chemins." } }
    - { id: c, text: { en: "Wait for the default TTL to expire, because an invalidation applies only to new requests.", fr: "Attendre l'expiration du TTL par défaut, car une invalidation ne s'applique qu'aux nouvelles demandes." } }
    - { id: d, text: { en: "Create a new invalidation with the path /assets/* or with the path of each style sheet.", fr: "Créer une nouvelle invalidation avec le chemin /assets/* ou avec le chemin de chaque feuille de style." } }
answer: { optionId: d }
explanation:
  correct:
    en: "In an invalidation path, the * wildcard must be the last character. An asterisk anywhere else is matched as a literal character, so /assets/*.css matched no cached file. The path /assets/* or the exact path of each file removes the old style sheets from the edge caches."
    fr: "Dans un chemin d'invalidation, le caractère générique * doit être le dernier caractère. Un astérisque placé ailleurs est traité comme un caractère littéral : /assets/*.css ne correspondait donc à aucun fichier en cache. Le chemin /assets/* ou le chemin exact de chaque fichier supprime les anciennes feuilles de style des caches périphériques."
  options:
    a:
      en: "The Region of the CLI does not change how an invalidation path is matched; the same path would again match no file."
      fr: "La Région de la CLI ne change pas la façon dont un chemin d'invalidation est mis en correspondance ; le même chemin ne correspondrait de nouveau à aucun fichier."
    b:
      en: "Invalidating a file removes every cached version of it, whatever the header values, so compressed variants need no separate paths."
      fr: "L'invalidation d'un fichier supprime toutes ses versions en cache, quelles que soient les valeurs d'en-tête : les variantes compressées n'ont pas besoin de chemins distincts."
    c:
      en: "A successful invalidation removes matching objects from the cache at once; the problem is that this path matched nothing."
      fr: "Une invalidation réussie supprime immédiatement les objets correspondants du cache ; le problème est que ce chemin ne correspondait à rien."
references:
  - title: What you need to know when invalidating paths
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/invalidation-specifying-objects.html
