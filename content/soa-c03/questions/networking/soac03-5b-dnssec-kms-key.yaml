id: soac03-5b-dnssec-kms-key
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs its workloads in eu-west-1 and hosts example.com in a Route 53 public hosted zone. A CloudOps engineer enables DNSSEC signing for the zone. To create the key-signing key (KSK), the engineer selects a customer managed AWS KMS key that was created in eu-west-1 with the SYMMETRIC_DEFAULT key spec. The KSK creation fails.

    Which KMS key must the engineer use?
  fr: |
    Une entreprise exécute ses charges de travail dans eu-west-1 et héberge example.com dans une zone hébergée publique Route 53. Un ingénieur CloudOps active la signature DNSSEC pour la zone. Pour créer la clé de signature de clé (KSK), l'ingénieur sélectionne une clé AWS KMS gérée par le client, créée dans eu-west-1 avec la spécification de clé SYMMETRIC_DEFAULT. La création de la KSK échoue.

    Quelle clé KMS l'ingénieur doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "An asymmetric ECC_NIST_P256 customer managed key in us-east-1 whose key policy allows Route 53 DNSSEC to use the key", fr: "Une clé asymétrique ECC_NIST_P256 gérée par le client dans us-east-1, dont la politique de clé autorise Route 53 DNSSEC à utiliser la clé" }
    - id: b
      text: { en: "An asymmetric ECC_NIST_P256 customer managed key in eu-west-1 whose key policy allows Route 53 DNSSEC to use the key", fr: "Une clé asymétrique ECC_NIST_P256 gérée par le client dans eu-west-1, dont la politique de clé autorise Route 53 DNSSEC à utiliser la clé" }
    - id: c
      text: { en: "A symmetric customer managed key in us-east-1 whose key policy allows Route 53 DNSSEC to use the key", fr: "Une clé symétrique gérée par le client dans us-east-1, dont la politique de clé autorise Route 53 DNSSEC à utiliser la clé" }
    - id: d
      text: { en: "An asymmetric RSA_2048 customer managed key in us-east-1 whose key policy allows Route 53 DNSSEC to use the key", fr: "Une clé asymétrique RSA_2048 gérée par le client dans us-east-1, dont la politique de clé autorise Route 53 DNSSEC à utiliser la clé" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Route 53 DNSSEC signing requires an asymmetric customer managed key with the ECC_NIST_P256 key spec in US East (N. Virginia), whatever Region the workloads use. The key policy must give Route 53 the permissions it needs to create and use the KSK.
    fr: |
      La signature DNSSEC de Route 53 exige une clé asymétrique gérée par le client, avec la spécification de clé ECC_NIST_P256, dans la Région USA Est (Virginie du Nord), quelle que soit la Région des charges de travail. La politique de clé doit accorder à Route 53 les autorisations nécessaires pour créer et utiliser la KSK.
  options:
    b:
      en: |
        The key spec is correct, but the key must be in us-east-1, not in the Region where the workloads run.
      fr: |
        La spécification de clé est correcte, mais la clé doit se trouver dans us-east-1, et non dans la Région où s'exécutent les charges de travail.
    c:
      en: |
        The Region is correct, but a symmetric key cannot sign; DNSSEC needs an asymmetric ECC_NIST_P256 key.
      fr: |
        La Région est correcte, mais une clé symétrique ne peut pas signer ; DNSSEC a besoin d'une clé asymétrique ECC_NIST_P256.
    d:
      en: |
        Route 53 accepts only the ECC_NIST_P256 key spec for the KSK; an RSA key is rejected.
      fr: |
        Route 53 n'accepte que la spécification de clé ECC_NIST_P256 pour la KSK ; une clé RSA est refusée.
references:
  - title: Working with customer managed keys for DNSSEC
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-configuring-dnssec-cmk-requirements.html
