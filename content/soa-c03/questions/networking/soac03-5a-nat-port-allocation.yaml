id: soac03-5a-nat-port-allocation
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A nightly batch job runs on many Amazon EC2 instances in one private subnet. The instances reach the internet through a single public NAT gateway that has one Elastic IP address. During the job, the instances open tens of thousands of concurrent connections to the same IP address and port of a partner API. Amazon CloudWatch shows that the NAT gateway's `ErrorPortAllocation` and `PacketsDropCount` metrics rise above zero, and some connections fail. The network team does not allow route table changes for this subnet.

    Which solution will resolve the connection failures?
  fr: |
    Un traitement par lots nocturne s'exécute sur de nombreuses instances Amazon EC2 d'un même sous-réseau privé. Les instances accèdent à Internet par une seule passerelle NAT publique dotée d'une adresse IP Elastic. Pendant le traitement, les instances ouvrent des dizaines de milliers de connexions simultanées vers la même adresse IP et le même port d'une API de partenaire. Amazon CloudWatch montre que les métriques `ErrorPortAllocation` et `PacketsDropCount` de la passerelle NAT dépassent zéro, et certaines connexions échouent. L'équipe réseau n'autorise aucune modification de la table de routage de ce sous-réseau.

    Quelle solution résout les échecs de connexion ?
body:
  options:
    - id: a
      text: { en: "Associate secondary Elastic IP addresses with the existing NAT gateway.", fr: "Associer des adresses IP Elastic secondaires à la passerelle NAT existante." }
    - id: b
      text: { en: "Request a quota increase for the number of NAT gateways in the Availability Zone.", fr: "Demander une augmentation du quota du nombre de passerelles NAT dans la zone de disponibilité." }
    - id: c
      text: { en: "Turn on TCP keepalive on the instances with an interval that is shorter than 350 seconds.", fr: "Activer le keepalive TCP sur les instances avec un intervalle inférieur à 350 secondes." }
    - id: d
      text: { en: "Replace the NAT gateway with a regional NAT gateway that runs in automatic mode.", fr: "Remplacer la passerelle NAT par une passerelle NAT régionale en mode automatique." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each IPv4 address of a NAT gateway supports up to 55,000 simultaneous connections to each unique destination (destination IP, port and protocol). `ErrorPortAllocation` shows that the gateway has run out of ports for that destination. Each secondary address adds another set of ports; a NAT gateway can have up to 8 IPv4 addresses, and public NAT gateways are limited to 2 Elastic IP addresses until a quota increase is approved.
    fr: |
      Chaque adresse IPv4 d'une passerelle NAT prend en charge jusqu'à 55 000 connexions simultanées vers chaque destination unique (adresse IP, port et protocole de destination). `ErrorPortAllocation` montre que la passerelle n'a plus de ports pour cette destination. Chaque adresse secondaire ajoute un nouveau jeu de ports ; une passerelle NAT peut avoir jusqu'à 8 adresses IPv4, et les passerelles NAT publiques sont limitées à 2 adresses IP Elastic tant qu'une augmentation de quota n'est pas accordée.
  options:
    b:
      en: |
        More NAT gateways help only if some instances route to them, which requires route table changes that the network team does not allow.
      fr: |
        Des passerelles NAT supplémentaires n'aident que si des instances y sont routées, ce qui exige des modifications de table de routage que l'équipe réseau n'autorise pas.
    c:
      en: |
        Keepalive prevents idle connections from timing out after 350 seconds. It does not add ports for new concurrent connections.
      fr: |
        Le keepalive empêche les connexions inactives d'expirer après 350 secondes. Il n'ajoute pas de ports pour de nouvelles connexions simultanées.
    d:
      en: |
        A new regional NAT gateway has a different ID, so the subnet's default route would have to change, which the network team does not allow. Adding addresses to the existing gateway solves the problem in place.
      fr: |
        Une nouvelle passerelle NAT régionale a un ID différent : la route par défaut du sous-réseau devrait changer, ce que l'équipe réseau n'autorise pas. Ajouter des adresses à la passerelle existante règle le problème sur place.
references:
  - title: Work with NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-working-with.html
  - title: Troubleshoot NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-troubleshooting.html
