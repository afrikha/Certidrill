id: soac03-5b-public-ip-missing
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CloudOps engineer launches an Amazon EC2 instance in a subnet whose route table sends 0.0.0.0/0 to an internet gateway. The instance's security group allows all outbound traffic, and the subnet uses the default network ACL. The instance cannot reach the internet. The instance has only a private IPv4 address, and the subnet does not assign public IPv4 addresses automatically.

    Which action will resolve the issue?
  fr: |
    Un ingénieur CloudOps lance une instance Amazon EC2 dans un sous-réseau dont la table de routage envoie 0.0.0.0/0 vers une passerelle Internet. Le groupe de sécurité de l'instance autorise tout le trafic sortant, et le sous-réseau utilise l'ACL réseau par défaut. L'instance ne parvient pas à joindre Internet. L'instance ne possède qu'une adresse IPv4 privée, et le sous-réseau n'attribue pas automatiquement d'adresses IPv4 publiques.

    Quelle action résout le problème ?
body:
  options:
    - id: a
      text: { en: "Set the enableDnsHostnames attribute of the VPC to true.", fr: "Définir l'attribut enableDnsHostnames du VPC sur true." }
    - id: b
      text: { en: "Add an outbound rule to the network ACL that allows all traffic to 0.0.0.0/0.", fr: "Ajouter à l'ACL réseau une règle sortante qui autorise tout le trafic vers 0.0.0.0/0." }
    - id: c
      text: { en: "Add a route for 0.0.0.0/0 to a NAT gateway in the same route table.", fr: "Ajouter une route 0.0.0.0/0 vers une passerelle NAT dans la même table de routage." }
    - id: d
      text: { en: "Allocate an Elastic IP address and associate it with the instance.", fr: "Allouer une adresse IP Elastic et l'associer à l'instance." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      To communicate through an internet gateway over IPv4, an instance in a public subnet needs a public IPv4 address or an Elastic IP address. The route and the security group are already correct, so associating an Elastic IP address gives the instance internet access.
    fr: |
      Pour communiquer par une passerelle Internet en IPv4, une instance d'un sous-réseau public a besoin d'une adresse IPv4 publique ou d'une adresse IP Elastic. La route et le groupe de sécurité sont déjà corrects : associer une adresse IP Elastic donne à l'instance l'accès à Internet.
  options:
    a:
      en: |
        DNS hostnames do not give the instance an address that is routable on the internet.
      fr: |
        Les noms d'hôte DNS ne donnent pas à l'instance une adresse routable sur Internet.
    b:
      en: |
        The default network ACL already allows all inbound and outbound traffic.
      fr: |
        L'ACL réseau par défaut autorise déjà tout le trafic entrant et sortant.
    c:
      en: |
        A route table can have only one route for 0.0.0.0/0, which already targets the internet gateway; a NAT gateway is for private subnets.
      fr: |
        Une table de routage ne peut avoir qu'une seule route pour 0.0.0.0/0, qui cible déjà la passerelle Internet ; une passerelle NAT sert aux sous-réseaux privés.
references:
  - title: Enable internet access for a VPC using an internet gateway
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html
