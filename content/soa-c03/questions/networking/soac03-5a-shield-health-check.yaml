id: soac03-5a-shield-health-check
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company protects an Application Load Balancer with AWS Shield Advanced. A review of a recent request flood shows that detection started late, while the application was already slow. The company wants Shield Advanced to detect and mitigate attacks at lower thresholds when the application is unhealthy, and it plans to enable proactive engagement with the Shield Response Team.

    Which configuration should a CloudOps engineer add?
  fr: |
    Une entreprise protège un Application Load Balancer avec AWS Shield Advanced. L'analyse d'une récente attaque par inondation de requêtes (request flood) montre que la détection a commencé tard, alors que l'application était déjà lente. L'entreprise veut que Shield Advanced détecte et atténue les attaques avec des seuils plus bas lorsque l'application n'est pas saine, et elle prévoit d'activer l'engagement proactif (proactive engagement) avec la Shield Response Team.

    Quelle configuration un ingénieur CloudOps doit-il ajouter ?
body:
  options:
    - id: a
      text: { en: "Turn on automatic application layer DDoS mitigation for the protected load balancer.", fr: "Activer l'atténuation DDoS automatique de la couche application pour l'équilibreur de charge protégé." }
    - id: b
      text: { en: "Associate a Route 53 health check that reflects application health with the protection.", fr: "Associer à la protection une vérification de l'état Route 53 qui reflète l'état de l'application." }
    - id: c
      text: { en: "Shorten the health check interval of the load balancer's target group to 5 seconds.", fr: "Réduire à 5 secondes l'intervalle des vérifications de l'état du groupe cible de l'équilibreur." }
    - id: d
      text: { en: "Create a CloudWatch composite alarm on the load balancer's latency and error metrics.", fr: "Créer une alarme composite CloudWatch sur les métriques de latence et d'erreurs de l'équilibreur." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Shield Advanced health-based detection uses a Route 53 health check that is associated with the protected resource. When the health check is unhealthy, Shield Advanced alerts on smaller traffic deviations and can mitigate faster and at lower thresholds. Associated health checks are also required for proactive engagement.
    fr: |
      La détection basée sur l'état de Shield Advanced utilise une vérification de l'état Route 53 associée à la ressource protégée. Lorsque la vérification signale un état non sain, Shield Advanced alerte sur de plus petits écarts de trafic et peut atténuer plus vite et avec des seuils plus bas. Les vérifications de l'état associées sont aussi obligatoires pour l'engagement proactif.
  options:
    a:
      en: |
        Automatic application layer mitigation creates AWS WAF rules during an attack. It does not use application health to lower detection thresholds and does not meet the proactive engagement prerequisite.
      fr: |
        L'atténuation automatique de la couche application crée des règles AWS WAF pendant une attaque. Elle n'utilise pas l'état de l'application pour abaisser les seuils de détection et ne remplit pas le prérequis de l'engagement proactif.
    c:
      en: |
        Target group health checks decide which targets receive traffic. Shield Advanced does not use them for detection.
      fr: |
        Les vérifications de l'état du groupe cible déterminent les cibles qui reçoivent du trafic. Shield Advanced ne les utilise pas pour la détection.
    d:
      en: |
        A composite alarm can notify the team, but Shield Advanced does not use a CloudWatch alarm to change its detection.
      fr: |
        Une alarme composite peut avertir l'équipe, mais Shield Advanced n'utilise pas d'alarme CloudWatch pour modifier sa détection.
references:
  - title: Health-based detection using health checks with Shield Advanced and Route 53
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-advanced-health-checks.html
