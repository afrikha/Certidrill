id: soac03-5a-waf-log-group-name
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company protects an Application Load Balancer in the eu-west-1 Region with an AWS WAF web ACL. For an audit, a CloudOps engineer must send the web ACL's traffic logs to Amazon CloudWatch Logs. The engineer created a log group named `waf-prod-alb` in eu-west-1 in the same account, but the log group does not appear as a destination when the engineer configures logging for the web ACL.

    What should the engineer do?
  fr: |
    Une entreprise protège un Application Load Balancer de la Région eu-west-1 avec une liste ACL web AWS WAF. Pour un audit, un ingénieur CloudOps doit envoyer les journaux de trafic de la liste ACL web vers Amazon CloudWatch Logs. L'ingénieur a créé un groupe de journaux nommé `waf-prod-alb` dans eu-west-1, dans le même compte, mais ce groupe de journaux n'apparaît pas comme destination lorsqu'il configure la journalisation de la liste ACL web.

    Que doit faire l'ingénieur ?
body:
  options:
    - id: a
      text: { en: "Create the log group in the us-east-1 Region, and then select it as the logging destination.", fr: "Créer le groupe de journaux dans la Région us-east-1, puis le sélectionner comme destination de journalisation." }
    - id: b
      text: { en: "Create an Amazon Data Firehose stream named waf-prod-alb that delivers to the log group.", fr: "Créer un flux Amazon Data Firehose nommé waf-prod-alb qui livre dans le groupe de journaux." }
    - id: c
      text: { en: "Create a log group whose name starts with aws-waf-logs-, and then select it as the destination.", fr: "Créer un groupe de journaux dont le nom commence par aws-waf-logs-, puis le sélectionner comme destination." }
    - id: d
      text: { en: "Turn on sampled requests for the web ACL so that the log group becomes available.", fr: "Activer les requêtes échantillonnées de la liste ACL web pour que le groupe de journaux devienne disponible." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AWS WAF logging destinations must have names that start with `aws-waf-logs-`, for example `aws-waf-logs-prod-alb`. The log group must also be in the same Region and account as the web ACL, which is already the case here.
    fr: |
      Les destinations de journalisation AWS WAF doivent avoir un nom qui commence par `aws-waf-logs-`, par exemple `aws-waf-logs-prod-alb`. Le groupe de journaux doit aussi se trouver dans la même Région et le même compte que la liste ACL web, ce qui est déjà le cas ici.
  options:
    a:
      en: |
        The log group must be in the same Region as the web ACL. This web ACL protects a regional resource in eu-west-1.
      fr: |
        Le groupe de journaux doit se trouver dans la même Région que la liste ACL web. Cette liste protège une ressource régionale d'eu-west-1.
    b:
      en: |
        Firehose streams used as WAF logging destinations have the same naming requirement, so a stream named `waf-prod-alb` would not be accepted either.
      fr: |
        Les flux Firehose utilisés comme destinations de journalisation WAF ont la même exigence de nommage : un flux nommé `waf-prod-alb` ne serait pas accepté non plus.
    d:
      en: |
        Sampled requests are a separate console feature. They do not change which log groups can receive logs.
      fr: |
        Les requêtes échantillonnées sont une fonctionnalité distincte de la console. Elles ne changent pas les groupes de journaux qui peuvent recevoir les journaux.
references:
  - title: Sending protection pack (web ACL) traffic logs to a Amazon CloudWatch Logs log group
    url: https://docs.aws.amazon.com/waf/latest/developerguide/logging-cw-logs.html
