id: soac03-5b-waf-log-filter
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company sends the logs of an AWS WAF web ACL to Amazon CloudWatch Logs. The web ACL inspects millions of requests each day, and the logging costs are high. The security team needs log records only for the requests that AWS WAF blocks. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise envoie les journaux d'une liste ACL web AWS WAF vers Amazon CloudWatch Logs. La liste ACL web inspecte des millions de requêtes par jour, et les coûts de journalisation sont élevés. L'équipe de sécurité n'a besoin d'enregistrements de journaux que pour les requêtes bloquées par AWS WAF. L'entreprise veut la solution avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a metric filter to the log group that counts records whose action is BLOCK, and shorten the log retention.", fr: "Ajouter au groupe de journaux un filtre de métriques qui compte les enregistrements dont l'action est BLOCK, et réduire la durée de conservation des journaux." }
    - id: b
      text: { en: "Turn off logging, and use the sampled requests of the web ACL to review blocked requests.", fr: "Désactiver la journalisation, et utiliser les requêtes échantillonnées de la liste ACL web pour examiner les requêtes bloquées." }
    - id: c
      text: { en: "Send the logs to Amazon Data Firehose with an AWS Lambda transformation that drops allowed requests before delivery.", fr: "Envoyer les journaux vers Amazon Data Firehose avec une transformation AWS Lambda qui supprime les requêtes autorisées avant la livraison." }
    - id: d
      text: { en: "Add a logging filter to the web ACL logging configuration that keeps records with the BLOCK action and drops all others.", fr: "Ajouter à la configuration de journalisation de la liste ACL web un filtre de journalisation qui conserve les enregistrements avec l'action BLOCK et supprime tous les autres." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The logging configuration of a web ACL can filter which requests are kept in the logs and which are dropped, based on the rule action or on labels. Keeping only BLOCK records reduces the volume sent to CloudWatch Logs without any custom component.
    fr: |
      La configuration de journalisation d'une liste ACL web peut filtrer les requêtes conservées dans les journaux et celles qui sont supprimées, selon l'action de la règle ou selon des étiquettes. Ne conserver que les enregistrements BLOCK réduit le volume envoyé à CloudWatch Logs sans aucun composant personnalisé.
  options:
    a:
      en: |
        A metric filter reads the records after they are ingested, so every request is still logged and billed.
      fr: |
        Un filtre de métriques lit les enregistrements après leur ingestion : chaque requête est toujours journalisée et facturée.
    b:
      en: |
        Sampled requests are only a sample and do not give a record of every blocked request.
      fr: |
        Les requêtes échantillonnées ne sont qu'un échantillon et ne fournissent pas d'enregistrement pour chaque requête bloquée.
    c:
      en: |
        This would work, but a Lambda function and a Firehose stream add components to build and run, while a logging filter does the same natively.
      fr: |
        Cela fonctionnerait, mais une fonction Lambda et un flux Firehose ajoutent des composants à créer et à exploiter, alors qu'un filtre de journalisation fait la même chose nativement.
references:
  - title: Finding your protection pack (web ACL) records
    url: https://docs.aws.amazon.com/waf/latest/developerguide/logging-management.html
