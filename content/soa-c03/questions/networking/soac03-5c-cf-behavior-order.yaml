id: soac03-5c-cf-behavior-order
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon CloudFront distribution at a logistics company has the following cache behaviors, in this order:

    1. `/static/*`, with the managed CachingOptimized cache policy
    2. `/static/reports/*`, with the managed CachingDisabled cache policy
    3. Default (`*`), with the managed CachingDisabled cache policy

    The origin generates each report under `/static/reports/` when it is requested and sends no Cache-Control header. Users report that they receive reports that were generated hours earlier. Other files under `/static/` must stay cached.

    Which solution will meet these requirements?
  fr: |
    Une distribution Amazon CloudFront d'une entreprise de logistique possède les comportements de cache suivants, dans cet ordre :

    1. `/static/*`, avec la politique de cache gérée CachingOptimized
    2. `/static/reports/*`, avec la politique de cache gérée CachingDisabled
    3. Par défaut (`*`), avec la politique de cache gérée CachingDisabled

    L'origine génère chaque rapport sous `/static/reports/` au moment où il est demandé et n'envoie pas d'en-tête Cache-Control. Les utilisateurs signalent qu'ils reçoivent des rapports générés plusieurs heures auparavant. Les autres fichiers sous `/static/` doivent rester en cache.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the path pattern of the second cache behavior to /static/reports* and keep its position.", fr: "Remplacer le modèle de chemin du deuxième comportement de cache par /static/reports* et conserver sa position." } }
    - { id: b, text: { en: "Move the /static/reports/* cache behavior so that it is evaluated before the /static/* cache behavior.", fr: "Déplacer le comportement de cache /static/reports/* pour qu'il soit évalué avant le comportement de cache /static/*." } }
    - { id: c, text: { en: "Delete the /static/reports/* cache behavior so that the default cache behavior applies to the reports.", fr: "Supprimer le comportement de cache /static/reports/* afin que le comportement de cache par défaut s'applique aux rapports." } }
    - { id: d, text: { en: "Schedule an hourly invalidation for the /static/reports/* path with an Amazon EventBridge rule.", fr: "Planifier une invalidation toutes les heures pour le chemin /static/reports/* avec une règle Amazon EventBridge." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudFront compares the request path with the path patterns in the order in which the behaviors are listed, and the first match wins. A report path matches /static/* first, so the CachingOptimized policy applies. Listing /static/reports/* above /static/* applies CachingDisabled to reports and keeps caching the other static files."
    fr: "CloudFront compare le chemin demandé aux modèles de chemin dans l'ordre dans lequel les comportements sont listés, et la première correspondance l'emporte. Le chemin d'un rapport correspond d'abord à /static/*, donc la politique CachingOptimized s'applique. Placer /static/reports/* avant /static/* applique CachingDisabled aux rapports et conserve la mise en cache des autres fichiers statiques."
  options:
    a:
      en: "The new pattern still sits after /static/*, which matches the reports first, so they stay cached."
      fr: "Le nouveau modèle reste après /static/*, qui correspond en premier aux rapports : ils restent donc en cache."
    c:
      en: "The default behavior is always evaluated last, so the reports would still match /static/* and stay cached."
      fr: "Le comportement par défaut est toujours évalué en dernier : les rapports correspondraient toujours à /static/* et resteraient en cache."
    d:
      en: "Users would still receive reports up to 1 hour old, and the scheduled invalidations add work and cost without fixing the behavior order."
      fr: "Les utilisateurs recevraient toujours des rapports vieux de jusqu'à 1 heure, et les invalidations planifiées ajoutent du travail et des coûts sans corriger l'ordre des comportements."
references:
  - title: Cache behavior settings
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesCacheBehavior.html
