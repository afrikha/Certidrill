id: soac03-5c-cf-path-pattern-case
objective: "5.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A photo-sharing company uses an Amazon CloudFront distribution with two cache behaviors. The `*.jpg` behavior uses a cache policy with long TTLs. The default (`*`) behavior uses the managed CachingDisabled cache policy. A new mobile app uploads photos with names such as `IMG_0042.JPG`, and the origin load has increased because these photos are never cached. All photos must be cached in the same way.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de partage de photos utilise une distribution Amazon CloudFront avec deux comportements de cache. Le comportement `*.jpg` utilise une politique de cache avec des TTL longs. Le comportement par défaut (`*`) utilise la politique de cache gérée CachingDisabled. Une nouvelle application mobile charge des photos dont les noms sont du type `IMG_0042.JPG`, et la charge de l'origine a augmenté parce que ces photos ne sont jamais mises en cache. Toutes les photos doivent être mises en cache de la même manière.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Move the *.jpg cache behavior so that it is evaluated after the default cache behavior.", fr: "Déplacer le comportement de cache *.jpg pour qu'il soit évalué après le comportement de cache par défaut." } }
    - { id: b, text: { en: "Create an invalidation for the /*.jpg path so that CloudFront fetches the new photos again.", fr: "Créer une invalidation pour le chemin /*.jpg afin que CloudFront récupère de nouveau les nouvelles photos." } }
    - { id: c, text: { en: "Add a *.JPG cache behavior that uses the same cache policy as the *.jpg cache behavior.", fr: "Ajouter un comportement de cache *.JPG qui utilise la même politique de cache que le comportement de cache *.jpg." } }
    - { id: d, text: { en: "Turn on automatic compression for the *.jpg cache behavior so that larger photos are cached.", fr: "Activer la compression automatique pour le comportement de cache *.jpg afin que les photos plus grandes soient mises en cache." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Path patterns are case-sensitive, so *.jpg does not match IMG_0042.JPG, and these requests fall through to the default behavior, which does not cache. A separate *.JPG behavior with the same cache policy caches the new photos like the others."
    fr: "Les modèles de chemin sont sensibles à la casse : *.jpg ne correspond pas à IMG_0042.JPG, et ces demandes tombent dans le comportement par défaut, qui ne met pas en cache. Un comportement *.JPG distinct avec la même politique de cache met les nouvelles photos en cache comme les autres."
  options:
    a:
      en: "The default behavior is always evaluated last and cannot be moved; the order is not the issue, the letter case is."
      fr: "Le comportement par défaut est toujours évalué en dernier et ne peut pas être déplacé ; le problème n'est pas l'ordre, mais la casse."
    b:
      en: "An invalidation removes cached objects; these photos are not cached at all because they match the CachingDisabled behavior."
      fr: "Une invalidation supprime des objets en cache ; ces photos ne sont pas du tout en cache, car elles correspondent au comportement CachingDisabled."
    d:
      en: "Compression changes how objects are encoded, not which cache behavior a path matches, so the photos would still use the CachingDisabled behavior."
      fr: "La compression change l'encodage des objets, pas le comportement de cache auquel un chemin correspond : les photos utiliseraient toujours le comportement CachingDisabled."
references:
  - title: Cache behavior settings
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesCacheBehavior.html
