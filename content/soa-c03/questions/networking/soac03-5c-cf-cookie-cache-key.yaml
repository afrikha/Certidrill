id: soac03-5c-cf-cookie-cache-key
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company serves its website through an Amazon CloudFront distribution. The origin returns each page in English or in French depending on the value of a `lang` cookie. The cache policy of the cache behavior has its cookie setting set to None, and an origin request policy forwards all cookies to the origin. Viewers sometimes receive pages in the wrong language. Browsers also send several analytics cookies whose values are unique to each visitor. The company must fix the problem and keep the highest possible cache hit ratio.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages sert son site web via une distribution Amazon CloudFront. L'origine renvoie chaque page en anglais ou en français selon la valeur d'un cookie `lang`. Le paramètre de cookies de la politique de cache du comportement de cache est défini sur None, et une politique de demande d'origine transmet tous les cookies à l'origine. Les utilisateurs reçoivent parfois des pages dans la mauvaise langue. Les navigateurs envoient aussi plusieurs cookies d'analyse dont les valeurs sont propres à chaque visiteur. L'entreprise doit corriger le problème et conserver le taux d'accès au cache (cache hit ratio) le plus élevé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the cache policy so that only the lang cookie is included in the cache key.", fr: "Modifier la politique de cache pour que seul le cookie lang soit inclus dans la clé de cache." } }
    - { id: b, text: { en: "Change the cache policy so that all viewer cookies are included in the cache key.", fr: "Modifier la politique de cache pour que tous les cookies des utilisateurs soient inclus dans la clé de cache." } }
    - { id: c, text: { en: "Change the origin request policy so that it forwards only the lang cookie to the origin.", fr: "Modifier la politique de demande d'origine pour qu'elle ne transmette que le cookie lang à l'origine." } }
    - { id: d, text: { en: "Create an invalidation for the page each time that a viewer changes the lang cookie.", fr: "Créer une invalidation pour la page chaque fois qu'un utilisateur change le cookie lang." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The cache key decides which cached object a request receives. With the cookie setting None, CloudFront stores a single copy per URL, so one language is served to everyone until it expires. Including only lang in the cache key stores one copy per language and ignores the unique analytics cookies, which keeps the hit ratio high."
    fr: "La clé de cache détermine l'objet en cache qu'une demande reçoit. Avec le paramètre de cookies None, CloudFront stocke une seule copie par URL : une seule langue est servie à tout le monde jusqu'à l'expiration. N'inclure que lang dans la clé de cache stocke une copie par langue et ignore les cookies d'analyse uniques, ce qui garde un taux d'accès élevé."
  options:
    b:
      en: "This fixes the language, but the unique analytics cookies make almost every cache key different, so the hit ratio drops sharply."
      fr: "Cela corrige la langue, mais les cookies d'analyse uniques rendent presque chaque clé de cache différente : le taux d'accès chute fortement."
    c:
      en: "Values in an origin request policy reach the origin but are not part of the cache key, so CloudFront still serves one copy for both languages."
      fr: "Les valeurs d'une politique de demande d'origine parviennent à l'origine mais ne font pas partie de la clé de cache : CloudFront sert toujours une seule copie pour les deux langues."
    d:
      en: "An invalidation removes the page for every viewer, and the next request again caches a single copy in one language, so the problem continues."
      fr: "Une invalidation supprime la page pour tous les utilisateurs, et la demande suivante remet en cache une seule copie dans une seule langue : le problème continue."
references:
  - title: Understand cache policies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-key-understand-cache-policy.html
