id: soac03-5b-cf-vpc-origin
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application behind an internal Application Load Balancer (ALB) in private subnets of a VPC. The VPC has an internet gateway for other workloads. The company must deliver the application to internet users through Amazon CloudFront. Security policy forbids internet-facing load balancers and public IP addresses for the application.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web derrière un Application Load Balancer (ALB) interne dans des sous-réseaux privés d'un VPC. Le VPC possède une passerelle Internet pour d'autres charges de travail. L'entreprise doit diffuser l'application aux utilisateurs d'Internet par Amazon CloudFront. La politique de sécurité interdit les équilibreurs de charge accessibles depuis Internet et les adresses IP publiques pour l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a custom origin in the distribution that uses the DNS name of the internal ALB.", fr: "Créer dans la distribution une origine personnalisée qui utilise le nom DNS de l'ALB interne." }
    - id: b
      text: { en: "Create a CloudFront VPC origin for the internal ALB, and use it as the origin of the distribution.", fr: "Créer une origine VPC CloudFront pour l'ALB interne, et l'utiliser comme origine de la distribution." }
    - id: c
      text: { en: "Configure origin access control (OAC) on an origin that uses the DNS name of the internal ALB.", fr: "Configurer un contrôle d'accès d'origine (OAC) sur une origine qui utilise le nom DNS de l'ALB interne." }
    - id: d
      text: { en: "Re-create the ALB as internet-facing, and allow only the CloudFront managed prefix list in its security group.", fr: "Recréer l'ALB comme accessible depuis Internet, et n'autoriser que la liste de préfixes gérée CloudFront dans son groupe de sécurité." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CloudFront VPC origins let a distribution use ALBs, NLBs and EC2 instances in private subnets as origins, so CloudFront becomes the only entry point and the origin needs no public access. The VPC must have an internet gateway, but the gateway is not used for the origin traffic.
    fr: |
      Les origines VPC CloudFront permettent à une distribution d'utiliser comme origines des ALB, des NLB et des instances EC2 situés dans des sous-réseaux privés : CloudFront devient le seul point d'entrée et l'origine n'a besoin d'aucun accès public. Le VPC doit posséder une passerelle Internet, mais celle-ci n'est pas utilisée pour le trafic vers l'origine.
  options:
    a:
      en: |
        The DNS name of an internal ALB resolves to private addresses, which CloudFront cannot reach through a standard custom origin.
      fr: |
        Le nom DNS d'un ALB interne se résout en adresses privées, que CloudFront ne peut pas joindre par une origine personnalisée standard.
    c:
      en: |
        OAC signs requests to origins such as Amazon S3; it does not give CloudFront network access to a private load balancer.
      fr: |
        L'OAC signe les requêtes vers des origines comme Amazon S3 ; il ne donne pas à CloudFront d'accès réseau à un équilibreur de charge privé.
    d:
      en: |
        An internet-facing ALB breaks the security policy, even if its security group allows only CloudFront.
      fr: |
        Un ALB accessible depuis Internet enfreint la politique de sécurité, même si son groupe de sécurité n'autorise que CloudFront.
references:
  - title: Restrict access with VPC origins
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html
