id: soac03-5a-interface-endpoint-second-az
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Applications in private subnets in two Availability Zones call AWS Secrets Manager through an interface VPC endpoint with private DNS turned on. The endpoint was created with a single subnet in Availability Zone A. During an impairment of Availability Zone A, the applications in Availability Zone B could not reach Secrets Manager. The company wants the endpoint to remain reachable if one Availability Zone fails.

    Which solution will meet this requirement?
  fr: |
    Des applications situées dans des sous-réseaux privés de deux zones de disponibilité appellent AWS Secrets Manager par un point de terminaison de VPC d'interface dont le DNS privé est activé. Le point de terminaison a été créé avec un seul sous-réseau, dans la zone de disponibilité A. Lors d'une dégradation de la zone A, les applications de la zone B n'ont pas pu joindre Secrets Manager. L'entreprise veut que le point de terminaison reste joignable en cas de défaillance d'une zone de disponibilité.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Modify the interface endpoint to add a subnet in Availability Zone B.", fr: "Modifier le point de terminaison d'interface pour ajouter un sous-réseau de la zone B." }
    - id: b
      text: { en: "Create a gateway VPC endpoint for Secrets Manager in Availability Zone B.", fr: "Créer un point de terminaison de VPC de passerelle pour Secrets Manager dans la zone B." }
    - id: c
      text: { en: "Associate the route table of Availability Zone B with the interface endpoint.", fr: "Associer la table de routage de la zone B au point de terminaison d'interface." }
    - id: d
      text: { en: "Allow HTTPS from the Availability Zone B subnets in the endpoint security group.", fr: "Autoriser le HTTPS depuis les sous-réseaux de la zone B dans le groupe de sécurité du point de terminaison." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An interface endpoint creates one network interface in each subnet that you select, with at most one subnet per Availability Zone. When a subnet is added, AWS creates a new endpoint network interface in it, and the endpoint's DNS names return the addresses of the interfaces in every selected zone. With interfaces in both zones, the endpoint stays reachable if one zone fails.
    fr: |
      Un point de terminaison d'interface crée une interface réseau dans chaque sous-réseau sélectionné, avec au plus un sous-réseau par zone de disponibilité. Lorsqu'un sous-réseau est ajouté, AWS y crée une nouvelle interface réseau de point de terminaison, et les noms DNS du point de terminaison renvoient les adresses des interfaces de toutes les zones sélectionnées. Avec des interfaces dans les deux zones, le point de terminaison reste joignable si une zone tombe en panne.
  options:
    b:
      en: |
        Gateway endpoints are available only for Amazon S3 and Amazon DynamoDB, not for Secrets Manager.
      fr: |
        Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB, pas pour Secrets Manager.
    c:
      en: |
        Interface endpoints are not associated with route tables; clients reach their network interfaces through the local VPC route.
      fr: |
        Les points de terminaison d'interface ne sont pas associés à des tables de routage ; les clients joignent leurs interfaces réseau par la route locale du VPC.
    d:
      en: |
        The applications in zone B reached the endpoint before the impairment, so the security group already allows them. The problem is that the only endpoint interface was in the failed zone.
      fr: |
        Les applications de la zone B joignaient le point de terminaison avant la dégradation : le groupe de sécurité les autorise donc déjà. Le problème est que la seule interface du point de terminaison se trouvait dans la zone défaillante.
references:
  - title: Configure an interface endpoint
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/interface-endpoints.html
  - title: Access an AWS service using an interface VPC endpoint
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html
