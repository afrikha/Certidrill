id: soac03-5c-vpn-route-propagation
objective: "5.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany connects its data center to a VPC with an AWS Site-to-Site VPN connection that uses dynamic routing (BGP) and a virtual private gateway. Both tunnels are UP, and the customer gateway device advertises 192.168.0.0/16 and receives the VPC CIDR block. Servers in the data center cannot reach Amazon EC2 instances in a private subnet. The route table of the private subnet contains only the local route and a 0.0.0.0/0 route to a NAT gateway. The security groups of the instances allow traffic from 192.168.0.0/16, and the subnet uses the default network ACL.

    Which solution will allow the servers in the data center to reach the instances?
  fr: |
    AnyCompany relie son centre de données à un VPC avec une connexion AWS Site-to-Site VPN qui utilise le routage dynamique (BGP) et une passerelle privée virtuelle (virtual private gateway). Les deux tunnels sont UP, et le périphérique de passerelle client (customer gateway) annonce 192.168.0.0/16 et reçoit le bloc d'adresses CIDR du VPC. Les serveurs du centre de données ne peuvent pas joindre les instances Amazon EC2 d'un sous-réseau privé. La table de routage du sous-réseau privé ne contient que la route locale et une route 0.0.0.0/0 vers une passerelle NAT. Les groupes de sécurité des instances autorisent le trafic provenant de 192.168.0.0/16, et le sous-réseau utilise la liste ACL réseau par défaut.

    Quelle solution permet aux serveurs du centre de données de joindre les instances ?
body:
  options:
    - { id: a, text: { en: "Add a static route for 192.168.0.0/16 to the Site-to-Site VPN connection.", fr: "Ajouter une route statique pour 192.168.0.0/16 à la connexion Site-to-Site VPN." } }
    - { id: b, text: { en: "Enable route propagation from the virtual private gateway on the route table of the private subnet.", fr: "Activer la propagation des routes depuis la passerelle privée virtuelle sur la table de routage du sous-réseau privé." } }
    - { id: c, text: { en: "Enable equal-cost multi-path (ECMP) routing on the virtual private gateway to use both tunnels.", fr: "Activer le routage ECMP (equal-cost multi-path) sur la passerelle privée virtuelle pour utiliser les deux tunnels." } }
    - { id: d, text: { en: "Change the tunnel startup action so that AWS initiates the IKE negotiation.", fr: "Modifier l'action de démarrage des tunnels pour qu'AWS lance la négociation IKE." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Traffic from the VPC reaches the data center only if the subnet route table has a route for the remote network that targets the virtual private gateway. Enabling route propagation adds the BGP-learned 192.168.0.0/16 route to the table automatically, so return traffic from the instances goes over the VPN instead of to the NAT gateway."
    fr: "Le trafic du VPC n'atteint le centre de données que si la table de routage du sous-réseau contient une route vers le réseau distant ciblant la passerelle privée virtuelle. Activer la propagation des routes ajoute automatiquement à la table la route 192.168.0.0/16 apprise par BGP : le trafic de retour des instances passe alors par le VPN au lieu de la passerelle NAT."
  options:
    a:
      en: "A VPN connection that uses BGP cannot also have static routes, and the missing route is in the VPC route table, not on the VPN connection."
      fr: "Une connexion VPN qui utilise BGP ne peut pas avoir aussi des routes statiques, et la route manquante se trouve dans la table de routage du VPC, pas sur la connexion VPN."
    c:
      en: "ECMP is not supported for VPN connections on a virtual private gateway, and it would not add the missing route."
      fr: "ECMP n'est pas pris en charge pour les connexions VPN sur une passerelle privée virtuelle, et il n'ajouterait pas la route manquante."
    d:
      en: "Both tunnels are already established; the startup action only controls which side starts the IKE negotiation."
      fr: "Les deux tunnels sont déjà établis ; l'action de démarrage détermine seulement quel côté lance la négociation IKE."
references:
  - title: Route tables and AWS Site-to-Site VPN route priority
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/vpn-route-priority.html
