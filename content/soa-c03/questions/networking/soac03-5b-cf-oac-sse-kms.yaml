id: soac03-5b-cf-oac-sse-kms
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon CloudFront distribution serves files from an Amazon S3 bucket through origin access control (OAC). The bucket policy allows s3:GetObject to the cloudfront.amazonaws.com service principal with an AWS:SourceArn condition for the distribution. The company then changed the bucket's default encryption to SSE-KMS with a customer managed AWS KMS key. Files uploaded since the change return HTTP 403 errors through CloudFront, and older files still work.

    Which solution will resolve the issue?
  fr: |
    Une distribution Amazon CloudFront sert des fichiers depuis un compartiment Amazon S3 par un contrôle d'accès d'origine (OAC). La politique du compartiment autorise s3:GetObject au principal de service cloudfront.amazonaws.com avec une condition AWS:SourceArn pour la distribution. L'entreprise a ensuite modifié le chiffrement par défaut du compartiment en SSE-KMS avec une clé AWS KMS gérée par le client. Les fichiers chargés depuis ce changement renvoient des erreurs HTTP 403 par CloudFront, et les fichiers plus anciens fonctionnent toujours.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Replace OAC with an origin access identity (OAI), and grant the OAI s3:GetObject in the bucket policy.", fr: "Remplacer l'OAC par une identité d'accès d'origine (OAI), et accorder s3:GetObject à l'OAI dans la politique du compartiment." }
    - id: b
      text: { en: "Add a key policy statement that allows the cloudfront.amazonaws.com service principal to use the key for decryption, with an AWS:SourceArn condition for the distribution.", fr: "Ajouter à la politique de clé une instruction qui autorise le principal de service cloudfront.amazonaws.com à utiliser la clé pour le déchiffrement, avec une condition AWS:SourceArn pour la distribution." }
    - id: c
      text: { en: "Add kms:Decrypt to the existing bucket policy statement for the cloudfront.amazonaws.com service principal.", fr: "Ajouter kms:Decrypt à l'instruction existante de la politique du compartiment pour le principal de service cloudfront.amazonaws.com." }
    - id: d
      text: { en: "Change the origin protocol policy of the S3 origin to HTTPS only so that CloudFront can request encrypted objects.", fr: "Modifier la politique de protocole d'origine de l'origine S3 en HTTPS uniquement pour que CloudFront puisse demander des objets chiffrés." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With SSE-KMS, reading an object also requires permission to use the KMS key. For OAC, the key policy must allow the cloudfront.amazonaws.com service principal to use the key, scoped to the distribution with AWS:SourceArn. Older objects still work because they were encrypted before the change and do not use the KMS key.
    fr: |
      Avec SSE-KMS, lire un objet exige aussi l'autorisation d'utiliser la clé KMS. Pour l'OAC, la politique de clé doit autoriser le principal de service cloudfront.amazonaws.com à utiliser la clé, limité à la distribution par AWS:SourceArn. Les objets plus anciens fonctionnent toujours, car ils ont été chiffrés avant le changement et n'utilisent pas la clé KMS.
  options:
    a:
      en: |
        OAI is the legacy method and does not support SSE-KMS, so the new objects would still fail.
      fr: |
        L'OAI est la méthode historique et ne prend pas en charge SSE-KMS : les nouveaux objets échoueraient toujours.
    c:
      en: |
        KMS permissions are granted in the key policy (or by IAM for principals in the account), not by a bucket policy, which controls only S3 actions.
      fr: |
        Les autorisations KMS s'accordent dans la politique de clé (ou par IAM pour les principaux du compte), pas par une politique de compartiment, qui ne contrôle que les actions S3.
    d:
      en: |
        OAC already signs requests over HTTPS; the error is an authorization failure on the KMS key, not a protocol problem.
      fr: |
        L'OAC signe déjà les requêtes en HTTPS ; l'erreur est un refus d'autorisation sur la clé KMS, pas un problème de protocole.
references:
  - title: Restrict access to an Amazon S3 origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
