id: soac03-5b-ga-udp-health-check
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company uses an AWS Global Accelerator standard accelerator with a UDP listener on port 7000. The endpoint groups contain Amazon EC2 instance endpoints. The game server listens only on UDP port 7000. Each instance also runs an HTTP status page on TCP port 8080, and the security groups allow TCP 8080 from the Route 53 health checker ranges. The endpoint groups use the default health check settings, and Global Accelerator reports every endpoint as unhealthy.

    Which solution will resolve the issue?
  fr: |
    Une entreprise de jeux vidéo utilise un accélérateur standard AWS Global Accelerator avec un écouteur UDP sur le port 7000. Les groupes de points de terminaison contiennent des points de terminaison d'instance Amazon EC2. Le serveur de jeu n'écoute que sur le port UDP 7000. Chaque instance exécute aussi une page d'état HTTP sur le port TCP 8080, et les groupes de sécurité autorisent TCP 8080 depuis les plages des vérificateurs d'état Route 53. Les groupes de points de terminaison utilisent les paramètres de vérification de l'état par défaut, et Global Accelerator signale tous les points de terminaison comme défaillants.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Set the health check protocol of the endpoint groups to UDP on port 7000.", fr: "Définir le protocole de vérification de l'état des groupes de points de terminaison sur UDP sur le port 7000." }
    - id: b
      text: { en: "Add a port override on the endpoint groups that maps listener port 7000 to endpoint port 8080.", fr: "Ajouter aux groupes de points de terminaison un remplacement de port (port override) qui associe le port d'écouteur 7000 au port de point de terminaison 8080." }
    - id: c
      text: { en: "Set the health check protocol of the endpoint groups to HTTP, the port to 8080 and the path to the status page.", fr: "Définir le protocole de vérification de l'état des groupes de points de terminaison sur HTTP, le port sur 8080 et le chemin sur la page d'état." }
    - id: d
      text: { en: "Increase the health check threshold count and interval of the endpoint groups.", fr: "Augmenter le nombre de seuils et l'intervalle de vérification de l'état des groupes de points de terminaison." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For EC2 instance endpoints, Global Accelerator uses the health check settings of the endpoint group. With a UDP listener and default settings, it checks the listener port over TCP, and nothing listens on TCP 7000, so every endpoint fails. Pointing the health check to the HTTP status page on TCP 8080, which the security groups already allow, fixes the checks.
    fr: |
      Pour les points de terminaison d'instance EC2, Global Accelerator utilise les paramètres de vérification de l'état du groupe de points de terminaison. Avec un écouteur UDP et les paramètres par défaut, il vérifie le port de l'écouteur en TCP, et rien n'écoute sur TCP 7000 : tous les points de terminaison échouent. Diriger la vérification vers la page d'état HTTP sur TCP 8080, que les groupes de sécurité autorisent déjà, corrige les vérifications.
  options:
    a:
      en: |
        Global Accelerator health checks use TCP, HTTP or HTTPS; for a UDP listener it checks over TCP, so a UDP health check is not an option.
      fr: |
        Les vérifications de l'état de Global Accelerator utilisent TCP, HTTP ou HTTPS ; pour un écouteur UDP, elles se font en TCP : une vérification UDP n'est pas possible.
    b:
      en: |
        A port override redirects client traffic, so game packets would be sent to port 8080; health check ports cannot be overridden this way.
      fr: |
        Un remplacement de port redirige le trafic des clients : les paquets du jeu seraient envoyés vers le port 8080 ; les ports de vérification de l'état ne peuvent pas être remplacés de cette façon.
    d:
      en: |
        Waiting longer does not help, because the checks target a TCP port where no server listens.
      fr: |
        Attendre plus longtemps n'aide pas, car les vérifications visent un port TCP sur lequel aucun serveur n'écoute.
references:
  - title: Ensure health check access for your accelerator
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoint-groups-health-check-options.html
