id: soac03-5a-eip-existing-instance
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CloudOps engineer launched an Amazon EC2 instance in a subnet whose route table has a `0.0.0.0/0` route to an internet gateway. The subnet does not assign public IPv4 addresses automatically, and the instance has only a private IPv4 address. The security group already allows the required inbound traffic. The instance must become reachable from the internet at an address that does not change, without replacing the instance.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur CloudOps a lancé une instance Amazon EC2 dans un sous-réseau dont la table de routage contient une route `0.0.0.0/0` vers une passerelle Internet. Le sous-réseau n'attribue pas automatiquement d'adresses IPv4 publiques, et l'instance n'a qu'une adresse IPv4 privée. Le groupe de sécurité autorise déjà le trafic entrant requis. L'instance doit devenir joignable depuis Internet à une adresse qui ne change pas, sans remplacer l'instance.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on automatic public IPv4 assignment for the subnet, and then reboot the instance.", fr: "Activer l'attribution automatique d'adresses IPv4 publiques sur le sous-réseau, puis redémarrer l'instance." }
    - id: b
      text: { en: "Allocate an Elastic IP address and associate it with the instance's network interface.", fr: "Allouer une adresse IP Elastic et l'associer à l'interface réseau de l'instance." }
    - id: c
      text: { en: "Create a NAT gateway in the subnet and point the subnet's default route to the NAT gateway.", fr: "Créer une passerelle NAT dans le sous-réseau et faire pointer la route par défaut du sous-réseau vers elle." }
    - id: d
      text: { en: "Stop and start the instance so that it receives a public IPv4 address from Amazon's pool.", fr: "Arrêter puis démarrer l'instance pour qu'elle reçoive une adresse IPv4 publique du pool d'Amazon." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Elastic IP address is a static public IPv4 address that you can associate with an existing instance at any time. Because the subnet already routes to an internet gateway and the security group allows the traffic, the instance becomes reachable at that address, and the address stays the same across stops and starts.
    fr: |
      Une adresse IP Elastic est une adresse IPv4 publique statique que l'on peut associer à tout moment à une instance existante. Comme le sous-réseau route déjà vers une passerelle Internet et que le groupe de sécurité autorise le trafic, l'instance devient joignable à cette adresse, qui reste la même après un arrêt et un démarrage.
  options:
    a:
      en: |
        The subnet attribute applies only when a network interface is created, so a reboot does not add a public address. An auto-assigned address would also change after a stop and start.
      fr: |
        L'attribut du sous-réseau ne s'applique qu'à la création d'une interface réseau : un redémarrage n'ajoute donc pas d'adresse publique. Une adresse attribuée automatiquement changerait en outre après un arrêt et un démarrage.
    c:
      en: |
        A NAT gateway provides only outbound connections. Hosts on the internet cannot start connections to the instance through it.
      fr: |
        Une passerelle NAT ne fournit que des connexions sortantes. Les hôtes d'Internet ne peuvent pas ouvrir de connexion vers l'instance par son intermédiaire.
    d:
      en: |
        A stop and start does not change the subnet setting, so the instance still gets no public IPv4 address, and a pool address would not be static anyway.
      fr: |
        Un arrêt et un démarrage ne modifient pas le paramètre du sous-réseau : l'instance ne reçoit toujours pas d'adresse IPv4 publique, et une adresse du pool ne serait de toute façon pas statique.
references:
  - title: Amazon EC2 instance IP addressing
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-instance-addressing.html
