id: soac03-5b-vpc-dns-hostnames
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A CloudOps engineer creates a VPC by using the AWS CLI and associates a Route 53 private hosted zone named db.internal with it. Amazon EC2 instances in the VPC resolve public domain names, but queries for the records of db.internal fail. The engineer runs the following command:

    ```bash
    $ aws ec2 describe-vpc-attribute --vpc-id vpc-0a1b2c3d --attribute enableDnsHostnames
    {
        "VpcId": "vpc-0a1b2c3d",
        "EnableDnsHostnames": {
            "Value": false
        }
    }
    ```

    Which action will resolve the issue?
  fr: |
    Un ingénieur CloudOps crée un VPC à l'aide de l'AWS CLI et y associe une zone hébergée privée Route 53 nommée db.internal. Les instances Amazon EC2 du VPC résolvent les noms de domaine publics, mais les requêtes pour les enregistrements de db.internal échouent. L'ingénieur exécute la commande suivante :

    ```bash
    $ aws ec2 describe-vpc-attribute --vpc-id vpc-0a1b2c3d --attribute enableDnsHostnames
    {
        "VpcId": "vpc-0a1b2c3d",
        "EnableDnsHostnames": {
            "Value": false
        }
    }
    ```

    Quelle action résout le problème ?
body:
  options:
    - id: a
      text: { en: "Create a DHCP options set with domain-name set to db.internal, and associate it with the VPC.", fr: "Créer un ensemble d'options DHCP dont domain-name vaut db.internal, et l'associer au VPC." }
    - id: b
      text: { en: "Create a Route 53 VPC Resolver inbound endpoint in the VPC.", fr: "Créer un point de terminaison entrant Route 53 VPC Resolver dans le VPC." }
    - id: c
      text: { en: "Set the enableDnsHostnames attribute of the VPC to true.", fr: "Définir l'attribut enableDnsHostnames du VPC sur true." }
    - id: d
      text: { en: "Re-create db.internal as a public hosted zone, and keep the same records.", fr: "Recréer db.internal en tant que zone hébergée publique, en conservant les mêmes enregistrements." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Private hosted zones require both enableDnsSupport and enableDnsHostnames set to true on the VPC. enableDnsSupport is already true (public names resolve), but enableDnsHostnames is false by default in a nondefault VPC. Setting it to true lets the VPC Resolver answer from the associated private hosted zone.
    fr: |
      Les zones hébergées privées exigent que enableDnsSupport et enableDnsHostnames soient tous deux définis sur true dans le VPC. enableDnsSupport vaut déjà true (les noms publics se résolvent), mais enableDnsHostnames vaut false par défaut dans un VPC autre que le VPC par défaut. Le passer à true permet au VPC Resolver de répondre à partir de la zone hébergée privée associée.
  options:
    a:
      en: |
        The domain-name option only sets the DNS suffix given to instances; it does not make the VPC Resolver answer from the private hosted zone.
      fr: |
        L'option domain-name ne définit que le suffixe DNS fourni aux instances ; elle ne permet pas au VPC Resolver de répondre à partir de la zone hébergée privée.
    b:
      en: |
        An inbound endpoint serves queries from outside the VPC. The instances already query the VPC Resolver directly.
      fr: |
        Un point de terminaison entrant sert les requêtes venant de l'extérieur du VPC. Les instances interrogent déjà directement le VPC Resolver.
    d:
      en: |
        A public hosted zone would publish internal records on the internet, and .internal names are not delegated in public DNS.
      fr: |
        Une zone hébergée publique exposerait des enregistrements internes sur Internet, et les noms en .internal ne sont pas délégués dans le DNS public.
references:
  - title: Understanding Amazon DNS
    url: https://docs.aws.amazon.com/vpc/latest/userguide/AmazonDNS-concepts.html
  - title: Considerations when working with a private hosted zone
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-considerations.html
