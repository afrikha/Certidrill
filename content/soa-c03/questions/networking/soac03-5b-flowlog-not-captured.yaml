id: soac03-5b-flowlog-not-captured
objective: "5.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company enables VPC flow logs for all network interfaces in a VPC to audit network traffic. The auditors notice that some traffic generated by the Amazon EC2 instances never appears in the flow logs.

    Which two types of traffic are NOT captured by VPC flow logs? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise active les journaux de flux VPC pour toutes les interfaces réseau d'un VPC afin d'auditer le trafic réseau. Les auditeurs remarquent qu'une partie du trafic généré par les instances Amazon EC2 n'apparaît jamais dans les journaux de flux.

    Quels sont les deux types de trafic qui ne sont PAS capturés par les journaux de flux VPC ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Requests to the instance metadata service at 169.254.169.254", fr: "Les requêtes vers le service de métadonnées d'instance à l'adresse 169.254.169.254" } }
    - { id: b, text: { en: "Traffic to a self-managed DNS server that runs on another instance", fr: "Le trafic vers un serveur DNS autogéré qui s'exécute sur une autre instance" } }
    - { id: c, text: { en: "Traffic that a security group rejects", fr: "Le trafic rejeté par un groupe de sécurité" } }
    - { id: d, text: { en: "DHCP traffic", fr: "Le trafic DHCP" } }
    - { id: e, text: { en: "Traffic to Amazon S3 through a gateway VPC endpoint", fr: "Le trafic vers Amazon S3 par un point de terminaison de VPC de type passerelle" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Flow logs do not capture traffic to and from 169.254.169.254 (instance metadata), DHCP traffic, traffic to the Amazon DNS server, traffic to the Amazon Time Sync Service, Windows license activation traffic and traffic to the reserved IP address of the default VPC router.
    fr: |
      Les journaux de flux ne capturent pas le trafic vers et depuis 169.254.169.254 (métadonnées d'instance), le trafic DHCP, le trafic vers le serveur DNS Amazon, le trafic vers Amazon Time Sync Service, le trafic d'activation de licence Windows ni le trafic vers l'adresse IP réservée du routeur du VPC par défaut.
  options:
    b:
      en: |
        Only traffic to the Amazon DNS server is excluded; traffic to a DNS server that the company runs is logged like any other traffic.
      fr: |
        Seul le trafic vers le serveur DNS Amazon est exclu ; le trafic vers un serveur DNS exploité par l'entreprise est journalisé comme tout autre trafic.
    c:
      en: |
        Rejected traffic is captured and shows REJECT in the action field.
      fr: |
        Le trafic rejeté est capturé et affiche REJECT dans le champ action.
    e:
      en: |
        Traffic sent to a gateway endpoint leaves the instance's network interface and is captured like other traffic.
      fr: |
        Le trafic envoyé vers un point de terminaison de type passerelle quitte l'interface réseau de l'instance et est capturé comme tout autre trafic.
references:
  - title: Flow log limitations
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-limitations.html
