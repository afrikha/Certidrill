id: soac03-5c-nsm-tcp-source-ports
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Network Synthetic Monitor to watch the path from a VPC subnet (10.20.4.0/24) to an on-premises server (10.50.8.20) over AWS Direct Connect. The probe uses TCP to port 443. The monitor reports packet loss of about 40 % for this probe, but the application servers in the same subnet reach 10.50.8.20 on port 443 without errors. The on-premises firewall allows TCP from 10.20.4.0/24 to 10.50.8.20 port 443 only from source ports 32768–60999, the ephemeral range of the application servers. The network health indicator of the monitor is 0.

    Which solution will remove the false packet loss from the probe results?
  fr: |
    Une entreprise utilise Network Synthetic Monitor pour surveiller le chemin entre un sous-réseau du VPC (10.20.4.0/24) et un serveur sur site (10.50.8.20) par AWS Direct Connect. La sonde utilise TCP vers le port 443. Le moniteur signale une perte de paquets d'environ 40 % pour cette sonde, mais les serveurs d'application du même sous-réseau joignent 10.50.8.20 sur le port 443 sans erreur. Le pare-feu sur site autorise TCP de 10.20.4.0/24 vers 10.50.8.20 port 443 uniquement depuis les ports sources 32768–60999, la plage éphémère des serveurs d'application. L'indicateur de santé du réseau (NHI) du moniteur vaut 0.

    Quelle solution supprime la fausse perte de paquets des résultats de la sonde ?
body:
  options:
    - { id: a, text: { en: "Allow TCP from 10.20.4.0/24 to 10.50.8.20 port 443 from source ports 1024–65535 on the on-premises firewall.", fr: "Autoriser sur le pare-feu sur site TCP de 10.20.4.0/24 vers 10.50.8.20 port 443 depuis les ports sources 1024–65535." } }
    - { id: b, text: { en: "Change the aggregation period of the monitor from 30 seconds to 60 seconds.", fr: "Faire passer la période d'agrégation du moniteur de 30 secondes à 60 secondes." } }
    - { id: c, text: { en: "Reduce the packet size of the probe so that the packets are not fragmented on the Direct Connect link.", fr: "Réduire la taille de paquet de la sonde pour que les paquets ne soient pas fragmentés sur la liaison Direct Connect." } }
    - { id: d, text: { en: "Open a case with AWS Support, because the loss is inside the AWS network between the VPC and the Direct Connect location.", fr: "Ouvrir un dossier auprès d'AWS Support, car la perte se situe dans le réseau AWS entre le VPC et l'emplacement Direct Connect." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Network Synthetic Monitor periodically switches the source port of TCP probes across the range 1024–65535, and firewall rules must allow that whole range to the destination port. Probes that use a source port below 32768 or above 60999 are dropped by the firewall and counted as lost, so allowing 1024–65535 removes the false loss."
    fr: "Network Synthetic Monitor change périodiquement le port source des sondes TCP dans la plage 1024–65535, et les règles de pare-feu doivent autoriser toute cette plage vers le port de destination. Les sondes qui utilisent un port source inférieur à 32768 ou supérieur à 60999 sont rejetées par le pare-feu et comptées comme perdues : autoriser 1024–65535 supprime cette fausse perte."
  options:
    b:
      en: "The aggregation period only changes how often results are reported; the dropped probes would still be counted as lost."
      fr: "La période d'agrégation change seulement la fréquence de rapport des résultats ; les sondes rejetées seraient toujours comptées comme perdues."
    c:
      en: "The application traffic crosses the same link without errors, and the loss comes from the source ports that the firewall rejects, not from packet size."
      fr: "Le trafic de l'application traverse la même liaison sans erreur, et la perte vient des ports sources rejetés par le pare-feu, pas de la taille des paquets."
    d:
      en: "An NHI of 0 means that no degradation was observed in the AWS network along the path, so the cause is outside AWS."
      fr: "Un NHI de 0 signifie qu'aucune dégradation n'a été observée dans le réseau AWS le long du chemin : la cause se situe hors d'AWS."
references:
  - title: How Network Synthetic Monitor works
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/nw-monitor-how-it-works.html
