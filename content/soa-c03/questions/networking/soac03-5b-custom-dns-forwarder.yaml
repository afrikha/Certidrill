id: soac03-5b-custom-dns-forwarder
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A VPC uses the 10.50.0.0/16 CIDR block. Its DHCP options set lists two self-managed BIND DNS servers that run on Amazon EC2 instances in the VPC. The BIND servers forward every query that they cannot answer to the company's on-premises DNS servers. The company has associated a Route 53 private hosted zone named svc.internal with the VPC, but the instances cannot resolve its records. The instances must keep using the BIND servers as their DNS servers.

    Which solution will meet these requirements?
  fr: |
    Un VPC utilise le bloc d'adresse CIDR 10.50.0.0/16. Son ensemble d'options DHCP indique deux serveurs DNS BIND autogérés qui s'exécutent sur des instances Amazon EC2 du VPC. Les serveurs BIND transfèrent toutes les requêtes auxquelles ils ne savent pas répondre vers les serveurs DNS sur site de l'entreprise. L'entreprise a associé une zone hébergée privée Route 53 nommée svc.internal au VPC, mais les instances ne parviennent pas à résoudre ses enregistrements. Les instances doivent continuer à utiliser les serveurs BIND comme serveurs DNS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure the BIND servers to forward queries for svc.internal to the on-premises DNS servers.", fr: "Configurer les serveurs BIND pour qu'ils transfèrent les requêtes pour svc.internal vers les serveurs DNS sur site." }
    - id: b
      text: { en: "Replace the DHCP options set with one that uses AmazonProvidedDNS as the domain name server.", fr: "Remplacer l'ensemble d'options DHCP par un ensemble qui utilise AmazonProvidedDNS comme serveur de noms de domaine." }
    - id: c
      text: { en: "Associate the private hosted zone with the network interfaces of the BIND instances.", fr: "Associer la zone hébergée privée aux interfaces réseau des instances BIND." }
    - id: d
      text: { en: "Configure the BIND servers to forward queries for svc.internal to 10.50.0.2.", fr: "Configurer les serveurs BIND pour qu'ils transfèrent les requêtes pour svc.internal vers 10.50.0.2." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Records in a private hosted zone are answered by the VPC Resolver, at the base of the VPC CIDR plus two (10.50.0.2 here). When a VPC uses custom DNS servers, those servers must forward queries for the private domain to that address. The instances keep using the BIND servers.
    fr: |
      Les enregistrements d'une zone hébergée privée sont fournis par le VPC Resolver, à l'adresse de base du CIDR du VPC plus deux (ici 10.50.0.2). Lorsqu'un VPC utilise des serveurs DNS personnalisés, ceux-ci doivent transférer les requêtes pour le domaine privé vers cette adresse. Les instances continuent d'utiliser les serveurs BIND.
  options:
    a:
      en: |
        The on-premises servers do not host svc.internal, which is what happens today: the queries are already sent there and fail.
      fr: |
        Les serveurs sur site n'hébergent pas svc.internal ; c'est ce qui se passe déjà aujourd'hui : les requêtes y sont envoyées et échouent.
    b:
      en: |
        This would fix the resolution, but the instances would stop using the BIND servers, which the company requires.
      fr: |
        Cela corrigerait la résolution, mais les instances cesseraient d'utiliser les serveurs BIND, ce que l'entreprise exige.
    c:
      en: |
        Private hosted zones are associated with VPCs, not with network interfaces, and the zone is already associated with this VPC.
      fr: |
        Les zones hébergées privées sont associées à des VPC, pas à des interfaces réseau, et la zone est déjà associée à ce VPC.
references:
  - title: Considerations when working with a private hosted zone
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-considerations.html
  - title: Understanding Amazon DNS
    url: https://docs.aws.amazon.com/vpc/latest/userguide/AmazonDNS-concepts.html
