id: soac03-5c-vpce-private-dns
objective: "5.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Amazon EC2 instances in private subnets of a VPC have no internet access and must call AWS Secrets Manager through the AWS SDK default endpoint. DNS hostnames and DNS resolution are enabled for the VPC. A CloudOps engineer created an interface VPC endpoint for Secrets Manager, but the calls time out. The engineer runs the following command:

    ```bash
    aws ec2 describe-vpc-endpoints --vpc-endpoint-ids vpce-0123456789abcdef0 \
      --query "VpcEndpoints[0].[ServiceName,State,PrivateDnsEnabled]"
    ```

    ```json
    ["com.amazonaws.us-east-1.secretsmanager", "available", false]
    ```

    Which solution will meet these requirements?
  fr: |
    Des instances Amazon EC2 situées dans des sous-réseaux privés d'un VPC n'ont pas d'accès à Internet et doivent appeler AWS Secrets Manager par le point de terminaison par défaut du kit SDK AWS. Les noms d'hôte DNS et la résolution DNS sont activés pour le VPC. Un ingénieur CloudOps a créé un point de terminaison de VPC d'interface pour Secrets Manager, mais les appels expirent. L'ingénieur exécute la commande suivante :

    ```bash
    aws ec2 describe-vpc-endpoints --vpc-endpoint-ids vpce-0123456789abcdef0 \
      --query "VpcEndpoints[0].[ServiceName,State,PrivateDnsEnabled]"
    ```

    ```json
    ["com.amazonaws.us-east-1.secretsmanager", "available", false]
    ```

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a gateway VPC endpoint for Secrets Manager and associate it with the route tables of the private subnets.", fr: "Créer un point de terminaison de VPC de type passerelle pour Secrets Manager et l'associer aux tables de routage des sous-réseaux privés." } }
    - { id: b, text: { en: "Add an outbound rule to the security group of the endpoint that allows HTTPS to 0.0.0.0/0.", fr: "Ajouter au groupe de sécurité du point de terminaison une règle sortante qui autorise HTTPS vers 0.0.0.0/0." } }
    - { id: c, text: { en: "Add a NAT gateway in a public subnet and a default route to it in the private route tables.", fr: "Ajouter une passerelle NAT dans un sous-réseau public et une route par défaut vers celle-ci dans les tables de routage privées." } }
    - { id: d, text: { en: "Modify the interface endpoint to enable private DNS for the Secrets Manager service name.", fr: "Modifier le point de terminaison d'interface pour activer le DNS privé pour le nom du service Secrets Manager." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With private DNS disabled, the default public Secrets Manager endpoint name resolves to public IP addresses, which the instances cannot reach without internet access. Enabling private DNS on the endpoint makes the default service name resolve to the private IP addresses of the endpoint network interfaces; the VPC already has DNS hostnames and DNS resolution enabled."
    fr: "Lorsque le DNS privé est désactivé, le nom public par défaut de Secrets Manager se résout en adresses IP publiques, que les instances ne peuvent pas joindre sans accès à Internet. Activer le DNS privé sur le point de terminaison fait résoudre le nom de service par défaut en adresses IP privées des interfaces réseau du point de terminaison ; le VPC a déjà les noms d'hôte DNS et la résolution DNS activés."
  options:
    a:
      en: "Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; Secrets Manager is reached through interface endpoints."
      fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB ; Secrets Manager est joint par des points de terminaison d'interface."
    b:
      en: "Clients connect to the endpoint network interfaces, so the endpoint security group needs inbound HTTPS from the instances; the timeouts here come from name resolution to public addresses."
      fr: "Les clients se connectent aux interfaces réseau du point de terminaison : le groupe de sécurité du point de terminaison a besoin d'une règle entrante HTTPS depuis les instances ; ici, les expirations viennent de la résolution du nom vers des adresses publiques."
    c:
      en: "A NAT gateway would send the calls over the internet, which the instances must not use, and the endpoint would stay unused."
      fr: "Une passerelle NAT ferait passer les appels par Internet, que les instances ne doivent pas utiliser, et le point de terminaison resterait inutilisé."
references:
  - title: Access an AWS service using an interface VPC endpoint
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html
