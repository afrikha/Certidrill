id: soac03-5b-nat-gateway-public-subnet
objective: "5.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Amazon EC2 instances in the private subnets of a VPC cannot download software updates from the internet. A CloudOps engineer finds that the NAT gateway was created in app-subnet-a, a private subnet. All private subnets, including app-subnet-a, use the following route table:

    ```text
    Destination      Target
    10.0.0.0/16      local
    0.0.0.0/0        nat-0a1b2c3d4e5f67890
    ```

    The VPC has an internet gateway and a public subnet whose route table sends 0.0.0.0/0 to the internet gateway. The instances must stay private.

    Which combination of steps will resolve the issue? (Choose two.)
  fr: |
    Les instances Amazon EC2 des sous-réseaux privés d'un VPC ne parviennent pas à télécharger des mises à jour logicielles depuis Internet. Un ingénieur CloudOps constate que la passerelle NAT a été créée dans app-subnet-a, un sous-réseau privé. Tous les sous-réseaux privés, y compris app-subnet-a, utilisent la table de routage suivante :

    ```text
    Destination      Target
    10.0.0.0/16      local
    0.0.0.0/0        nat-0a1b2c3d4e5f67890
    ```

    Le VPC possède une passerelle Internet et un sous-réseau public dont la table de routage envoie 0.0.0.0/0 vers la passerelle Internet. Les instances doivent rester privées.

    Quelle combinaison d'étapes résout le problème ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a new NAT gateway in the public subnet.", fr: "Créer une nouvelle passerelle NAT dans le sous-réseau public." } }
    - { id: b, text: { en: "Add a route for 0.0.0.0/0 to the internet gateway in the route table of the private subnets.", fr: "Ajouter une route 0.0.0.0/0 vers la passerelle Internet dans la table de routage des sous-réseaux privés." } }
    - { id: c, text: { en: "Change the 0.0.0.0/0 route of the private route table to target the new NAT gateway.", fr: "Modifier la route 0.0.0.0/0 de la table de routage privée pour qu'elle cible la nouvelle passerelle NAT." } }
    - { id: d, text: { en: "Create an egress-only internet gateway, and add a route to it in the private route table.", fr: "Créer une passerelle Internet de sortie uniquement (egress-only internet gateway), et y ajouter une route dans la table de routage privée." } }
    - { id: e, text: { en: "Associate an Elastic IP address with each instance in the private subnets.", fr: "Associer une adresse IP Elastic à chaque instance des sous-réseaux privés." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A NAT gateway must be in a public subnet whose route table sends internet traffic to an internet gateway. The current NAT gateway sits in a subnet whose default route points back to the NAT gateway itself, so its traffic never reaches the internet. A new NAT gateway in the public subnet, used as the target of the private default route, fixes the path.
    fr: |
      Une passerelle NAT doit se trouver dans un sous-réseau public dont la table de routage envoie le trafic Internet vers une passerelle Internet. La passerelle NAT actuelle est dans un sous-réseau dont la route par défaut renvoie vers la passerelle NAT elle-même : son trafic n'atteint jamais Internet. Une nouvelle passerelle NAT dans le sous-réseau public, utilisée comme cible de la route par défaut privée, corrige le chemin.
  options:
    b:
      en: |
        A route table can have only one 0.0.0.0/0 route, and the instances have no public IP addresses to use an internet gateway; it would also make the subnets public.
      fr: |
        Une table de routage ne peut avoir qu'une seule route 0.0.0.0/0, et les instances n'ont pas d'adresse IP publique pour utiliser une passerelle Internet ; cela rendrait aussi les sous-réseaux publics.
    d:
      en: |
        An egress-only internet gateway carries IPv6 traffic only; the instances download updates over IPv4.
      fr: |
        Une passerelle Internet de sortie uniquement ne transporte que du trafic IPv6 ; les instances téléchargent les mises à jour en IPv4.
    e:
      en: |
        Public addresses would expose the instances, which must stay private, and their route table still has no path to the internet gateway.
      fr: |
        Des adresses publiques exposeraient les instances, qui doivent rester privées, et leur table de routage n'a toujours aucun chemin vers la passerelle Internet.
references:
  - title: Troubleshoot NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-troubleshooting.html
