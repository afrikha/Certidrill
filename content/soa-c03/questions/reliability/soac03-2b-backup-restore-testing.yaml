id: soac03-2b-backup-restore-testing
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company protects Amazon RDS DB instances and Amazon EBS volumes with AWS Backup. Auditors now require proof every month that the latest recovery points can actually be restored, with the time each restore takes. The restored resources must not be kept after the test. The company wants to automate this with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise protège des instances de base de données Amazon RDS et des volumes Amazon EBS avec AWS Backup. Les auditeurs exigent désormais la preuve, chaque mois, que les derniers points de récupération peuvent réellement être restaurés, avec la durée de chaque restauration. Les ressources restaurées ne doivent pas être conservées après le test. L'entreprise veut automatiser cela avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the restore time control to an AWS Backup Audit Manager framework and generate a monthly compliance report.", fr: "Ajouter le contrôle de durée de restauration à un framework AWS Backup Audit Manager et générer un rapport de conformité mensuel." } }
    - { id: b, text: { en: "Create a monthly AWS Backup restore testing plan for the latest recovery points that deletes the restored resources after the test.", fr: "Créer un plan de test de restauration AWS Backup mensuel sur les derniers points de récupération, qui supprime les ressources restaurées après le test." } }
    - { id: c, text: { en: "Add a monthly copy action to the backup plan that copies the recovery points to a vault in another Region.", fr: "Ajouter au plan de sauvegarde une action de copie mensuelle qui copie les points de récupération vers un coffre d'une autre Région." } }
    - { id: d, text: { en: "Turn on continuous backups for the resources so that AWS Backup validates each recovery point when it is created.", fr: "Activer les sauvegardes continues pour les ressources afin qu'AWS Backup valide chaque point de récupération lors de sa création." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An AWS Backup restore testing plan runs on a schedule, picks the latest (or a random) recovery point of each selected resource within a selection window, starts the restore jobs and monitors how long they take. By default, the restored resources are deleted after the test; Amazon RDS and Amazon EBS are supported resource types.
    fr: |
      Un plan de test de restauration AWS Backup s'exécute selon une planification, choisit le dernier point de récupération (ou un point aléatoire) de chaque ressource sélectionnée dans une fenêtre de sélection, lance les tâches de restauration et mesure leur durée. Par défaut, les ressources restaurées sont supprimées après le test ; Amazon RDS et Amazon EBS font partie des types de ressources pris en charge.
  options:
    a: { en: "Audit Manager controls evaluate compliance; they do not start any restore job.", fr: "Les contrôles d'Audit Manager évaluent la conformité ; ils ne lancent aucune tâche de restauration." }
    c: { en: "A copy job duplicates recovery points; it does not prove that they can be restored or measure a restore time.", fr: "Une tâche de copie duplique les points de récupération ; elle ne prouve pas qu'ils peuvent être restaurés et ne mesure pas de durée de restauration." }
    d: { en: "Continuous backups allow point-in-time restores of supported resources; they do not perform or validate restores, and Amazon EBS does not support them.", fr: "Les sauvegardes continues permettent des restaurations à un instant dans le passé des ressources prises en charge ; elles n'effectuent ni ne valident de restauration, et Amazon EBS ne les prend pas en charge." }
references:
  - title: Restore testing
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/restore-testing.html
