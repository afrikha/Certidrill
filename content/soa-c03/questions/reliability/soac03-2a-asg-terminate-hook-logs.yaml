id: soac03-2a-asg-terminate-hook-logs
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a stateless processing tier in an Auto Scaling group. Each instance writes application logs to its root volume, and a cron job copies the logs to an Amazon S3 bucket every hour. During scale-in events, the logs written since the last copy are lost. An operations engineer must make sure that the latest logs are copied to Amazon S3 before an instance is terminated by the group. The copy takes less than 5 minutes.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany exécute une couche de traitement sans état dans un groupe Auto Scaling. Chaque instance écrit les journaux de l'application sur son volume racine, et une tâche cron copie les journaux dans un compartiment Amazon S3 toutes les heures. Lors des diminutions de capacité, les journaux écrits depuis la dernière copie sont perdus. Un ingénieur des opérations doit s'assurer que les journaux les plus récents sont copiés dans Amazon S3 avant que le groupe ne résilie une instance. La copie dure moins de 5 minutes.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Enable instance scale-in protection for the group, and have an operator copy the logs and remove the protection from each instance to be removed.", fr: "Activer la protection contre la diminution de la taille (scale-in protection) pour le groupe, et faire copier les journaux par un opérateur qui retire ensuite la protection de chaque instance à supprimer." } }
    - { id: b, text: { en: "Enable EC2 termination protection on the instances, and change the cron job so that it copies the logs every 5 minutes.", fr: "Activer la protection contre la résiliation EC2 sur les instances, et modifier la tâche cron pour copier les journaux toutes les 5 minutes." } }
    - { id: c, text: { en: "Suspend the Terminate process of the group, and resume it each time a scheduled job has copied the logs from every instance.", fr: "Suspendre le processus Terminate du groupe, et le reprendre chaque fois qu'une tâche planifiée a copié les journaux de toutes les instances." } }
    - { id: d, text: { en: "Add an EC2_INSTANCE_TERMINATING lifecycle hook, with an EventBridge rule that uses Run Command to copy the logs and complete the lifecycle action.", fr: "Ajouter un hook de cycle de vie EC2_INSTANCE_TERMINATING, avec une règle EventBridge qui utilise Run Command pour copier les journaux et terminer l'action de cycle de vie." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A termination lifecycle hook puts the instance in a wait state before it is terminated. Amazon EC2 Auto Scaling sends the lifecycle event to EventBridge, which can start Run Command on that instance to copy the logs and then call complete-lifecycle-action, all without manual work. The default one-hour heartbeat timeout leaves plenty of time for a 5-minute copy."
    fr: "Un hook de cycle de vie de résiliation place l'instance dans un état d'attente avant sa résiliation. Amazon EC2 Auto Scaling envoie l'événement de cycle de vie à EventBridge, qui peut lancer Run Command sur cette instance pour copier les journaux puis appeler complete-lifecycle-action, sans aucune intervention manuelle. Le délai de pulsation par défaut d'une heure laisse largement le temps d'une copie de 5 minutes."
  options:
    a:
      en: "Scale-in protection blocks automatic scale-in entirely, so every scale-in needs an operator. This is the most manual option."
      fr: "La protection contre la diminution de la taille bloque complètement la diminution automatique : chaque diminution exige un opérateur. C'est l'option la plus manuelle."
    b:
      en: "EC2 termination protection does not stop Amazon EC2 Auto Scaling from terminating instances, and copying every 5 minutes can still lose up to 5 minutes of logs."
      fr: "La protection contre la résiliation EC2 n'empêche pas Amazon EC2 Auto Scaling de résilier des instances, et une copie toutes les 5 minutes peut encore perdre jusqu'à 5 minutes de journaux."
    c:
      en: "Suspending Terminate also stops scale-in and the replacement of unhealthy instances, and it needs a scheduled job and manual resumes."
      fr: "Suspendre Terminate arrête aussi la diminution de capacité et le remplacement des instances défaillantes, et exige une tâche planifiée et des reprises manuelles."
references:
  - title: Amazon EC2 Auto Scaling lifecycle hooks
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
  - title: Use instance scale-in protection to control instance termination
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-instance-protection.html
