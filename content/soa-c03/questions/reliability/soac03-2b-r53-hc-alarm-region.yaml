id: soac03-2b-r53-hc-alarm-region
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's Route 53 health checks monitor application endpoints that run in eu-west-1. The operations team wants to receive an email whenever one of these health checks becomes unhealthy. An engineer tried to create a CloudWatch alarm on the health check status metric in eu-west-1, but the metric is not available in that Region.

    Which combination of actions will meet this requirement? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les vérifications de l'état Route 53 d'une entreprise surveillent des points de terminaison applicatifs qui s'exécutent dans eu-west-1. L'équipe des opérations veut recevoir un e-mail chaque fois que l'une de ces vérifications devient défaillante. Un ingénieur a tenté de créer une alarme CloudWatch sur la métrique d'état de la vérification dans eu-west-1, mais la métrique n'est pas disponible dans cette Région.

    Quelle combinaison d'actions permet de répondre à cette exigence ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the CloudWatch alarms on the health check status metric in the US East (N. Virginia) Region.", fr: "Créer les alarmes CloudWatch sur la métrique d'état des vérifications dans la Région USA Est (Virginie du Nord)." } }
    - { id: b, text: { en: "Enable latency measurements on each health check so that its metrics are published in eu-west-1.", fr: "Activer les mesures de latence sur chaque vérification pour que ses métriques soient publiées dans eu-west-1." } }
    - { id: c, text: { en: "Choose health checker Regions that include eu-west-1 so that the metrics appear in that Region.", fr: "Choisir des Régions de vérificateurs qui incluent eu-west-1 pour que les métriques apparaissent dans cette Région." } }
    - { id: d, text: { en: "Use an Amazon SNS topic in the US East (N. Virginia) Region with an email subscription as the alarm action.", fr: "Utiliser comme action d'alarme une rubrique Amazon SNS de la Région USA Est (Virginie du Nord) avec un abonnement par e-mail." } }
    - { id: e, text: { en: "Create a CloudTrail trail in eu-west-1 that sends health check status changes to CloudWatch Logs.", fr: "Créer un journal de suivi CloudTrail dans eu-west-1 qui envoie les changements d'état des vérifications à CloudWatch Logs." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Route 53 health check metrics are published only in the US East (N. Virginia) Region, whatever the location of the endpoint, so the alarms must be created there. The notification goes through an Amazon SNS topic in that same Region, with an email subscription that the recipients confirm.
    fr: |
      Les métriques des vérifications de l'état Route 53 ne sont publiées que dans la Région USA Est (Virginie du Nord), quel que soit l'emplacement du point de terminaison : les alarmes doivent donc y être créées. La notification passe par une rubrique Amazon SNS de cette même Région, avec un abonnement par e-mail que les destinataires confirment.
  options:
    b: { en: "Latency measurements add latency graphs; they do not move any metric to another Region.", fr: "Les mesures de latence ajoutent des graphiques de latence ; elles ne déplacent aucune métrique vers une autre Région." }
    c: { en: "Health checker Regions decide where the checks come from, not where CloudWatch publishes the metrics.", fr: "Les Régions de vérificateurs déterminent d'où partent les vérifications, pas où CloudWatch publie les métriques." }
    e: { en: "CloudTrail records API calls such as health check creation; it does not record health status changes.", fr: "CloudTrail enregistre des appels d'API comme la création de vérifications ; il n'enregistre pas les changements d'état de santé." }
references:
  - title: Monitoring health checks using CloudWatch
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/monitoring-health-checks.html
  - title: Values that you specify when you create or update health checks
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-creating-values.html
