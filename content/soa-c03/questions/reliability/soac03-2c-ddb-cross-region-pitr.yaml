id: soac03-2c-ddb-cross-region-pitr
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores product data in an Amazon DynamoDB table named `Catalog` in us-east-1, with point-in-time recovery turned on. The table is encrypted with an AWS KMS key. For a recovery exercise, an operator must create a copy of the table in us-west-2 from its latest restorable time, with the least operational effort.

    Which `aws dynamodb` command should the operator run, with us-west-2 as the default Region?
  fr: |
    Une entreprise stocke des données de produits dans une table Amazon DynamoDB nommée `Catalog` dans us-east-1, avec la PITR activée. La table est chiffrée avec une clé AWS KMS. Pour un exercice de reprise, un opérateur doit créer une copie de la table dans us-west-2 à partir de son heure de restauration la plus récente, avec le moins d'efforts opérationnels possible.

    Quelle commande `aws dynamodb` l'opérateur doit-il exécuter, avec us-west-2 comme Région par défaut ?
body:
  options:
    - { id: a, text: { en: "`restore-table-to-point-in-time` with `--source-table-name Catalog`, `--target-table-name Catalog` and `--use-latest-restorable-time`", fr: "`restore-table-to-point-in-time` avec `--source-table-name Catalog`, `--target-table-name Catalog` et `--use-latest-restorable-time`" } }
    - { id: b, text: { en: "`export-table-to-point-in-time` to Amazon S3, followed by `import-table` from the exported data", fr: "`export-table-to-point-in-time` vers Amazon S3, suivie de `import-table` à partir des données exportées" } }
    - { id: c, text: { en: "`restore-table-to-point-in-time` with `--source-table-arn`, `--use-latest-restorable-time` and `--sse-specification-override`", fr: "`restore-table-to-point-in-time` avec `--source-table-arn`, `--use-latest-restorable-time` et `--sse-specification-override`" } }
    - { id: d, text: { en: "`update-continuous-backups` on `Catalog` with a recovery period that covers us-west-2", fr: "`update-continuous-backups` sur `Catalog` avec une période de récupération qui couvre us-west-2" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DynamoDB can restore a point-in-time backup to a different Region. For a cross-Region restore from the CLI, the operator runs the command in the destination Region, identifies the source with `--source-table-arn`, and must specify `--sse-specification-override` because the encryption settings are mandatory for a cross-Region restore.
    fr: |
      DynamoDB peut restaurer une sauvegarde PITR dans une autre Région. Pour une restauration interrégionale avec la CLI, l'opérateur exécute la commande dans la Région de destination, identifie la source avec `--source-table-arn`, et doit indiquer `--sse-specification-override`, car les paramètres de chiffrement sont obligatoires pour une restauration interrégionale.
  options:
    a: { en: "In us-west-2, a table name refers to a table in that Region; a cross-Region restore must identify the source table by its ARN and override the encryption settings.", fr: "Dans us-west-2, un nom de table désigne une table de cette Région ; une restauration interrégionale doit identifier la table source par son ARN et remplacer les paramètres de chiffrement." }
    b: { en: "An export to S3 followed by an import works but needs more steps and a bucket, which is more effort than a direct cross-Region restore.", fr: "Un export vers S3 suivi d'une importation fonctionne, mais demande plus d'étapes et un compartiment, ce qui représente plus d'efforts qu'une restauration interrégionale directe." }
    d: { en: "This command configures point-in-time recovery on an existing table; it does not create a copy in another Region.", fr: "Cette commande configure la PITR sur une table existante ; elle ne crée pas de copie dans une autre Région." }
references:
  - title: Restoring a DynamoDB table to a point in time - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery.Tutorial.html
