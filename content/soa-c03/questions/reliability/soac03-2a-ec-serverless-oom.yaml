id: soac03-2a-ec-serverless-oom
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon ElastiCache Serverless for Valkey cache stores session data. The cache has a maximum data storage limit of 10 GB, and the application writes all keys without a TTL. After a marketing campaign doubled the number of users, write requests fail with out of memory (OOM) errors, while ECPU usage stays well below its maximum. Existing sessions must not be lost.

    Which solution will resolve the errors?
  fr: |
    Un cache Amazon ElastiCache Serverless for Valkey stocke des données de session. Le cache a une limite maximale de stockage de données de 10 Go, et l'application écrit toutes les clés sans TTL. Après une campagne marketing qui a doublé le nombre d'utilisateurs, les requêtes d'écriture échouent avec des erreurs de mémoire insuffisante (OOM), alors que l'utilisation des ECPU reste bien en dessous de son maximum. Les sessions existantes ne doivent pas être perdues.

    Quelle solution permet de résoudre les erreurs ?
body:
  options:
    - { id: a, text: { en: "Raise the maximum data storage limit of the cache.", fr: "Relever la limite maximale de stockage de données du cache." } }
    - { id: b, text: { en: "Raise the maximum ECPU per second limit of the cache.", fr: "Relever la limite maximale d'ECPU par seconde du cache." } }
    - { id: c, text: { en: "Add a replica to each shard of the cache so that more memory is available.", fr: "Ajouter un réplica à chaque partition du cache pour disposer de plus de mémoire." } }
    - { id: d, text: { en: "Set a TTL on new keys so that ElastiCache can evict them when the limit is reached.", fr: "Définir une TTL sur les nouvelles clés pour qu'ElastiCache puisse les évincer quand la limite est atteinte." } }
answer: { optionId: a }
explanation:
  correct:
    en: "When a serverless cache reaches its maximum data storage limit, ElastiCache evicts keys that have a TTL, using LRU logic. Here no key has a TTL, so nothing can be evicted and writes fail with OOM errors. Raising the maximum lets the cache scale its storage while keeping every session."
    fr: "Quand un cache sans serveur atteint sa limite maximale de stockage de données, ElastiCache évince les clés qui ont une TTL, selon une logique LRU. Ici, aucune clé n'a de TTL : rien ne peut être évincé et les écritures échouent avec des erreurs OOM. Relever le maximum permet au cache d'augmenter son stockage tout en conservant toutes les sessions."
  options:
    b:
      en: "Reaching the ECPU limit causes throttling, not OOM errors, and ECPU usage is well below its maximum here."
      fr: "Atteindre la limite d'ECPU provoque une limitation des requêtes, pas des erreurs OOM, et l'utilisation des ECPU est ici bien en dessous du maximum."
    c:
      en: "A serverless cache has no user-managed shards or replicas, and replicas would not add room for more data."
      fr: "Un cache sans serveur n'a pas de partitions ni de réplicas gérés par l'utilisateur, et des réplicas n'ajouteraient pas de place pour davantage de données."
    d:
      en: "Keys with a TTL can then be evicted when the cache is full, which loses session data instead of adding capacity."
      fr: "Les clés avec une TTL peuvent alors être évincées quand le cache est plein, ce qui fait perdre des données de session au lieu d'ajouter de la capacité."
references:
  - title: Scaling ElastiCache Serverless clusters
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Scaling-serverless.html
