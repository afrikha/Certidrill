id: soac03-2c-dr-rpo-backup-frequency
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses a backup and restore disaster recovery strategy for an internal application. An AWS Backup plan rule backs up the application's Amazon EC2 instances and Amazon RDS database once a day at 01:00 UTC and copies each recovery point to a backup vault in a second Region. A new business requirement sets an RPO of 4 hours for a Regional disaster. The RTO stays at 24 hours.

    Which change will meet the new requirement?
  fr: |
    Une entreprise utilise une stratégie de reprise après sinistre de type sauvegarde et restauration pour une application interne. Une règle de plan AWS Backup sauvegarde les instances Amazon EC2 et la base de données Amazon RDS de l'application une fois par jour à 01:00 UTC et copie chaque point de récupération dans un coffre de sauvegarde d'une seconde Région. Une nouvelle exigence métier fixe un RPO de 4 heures pour un sinistre régional. Le RTO reste de 24 heures.

    Quelle modification permet de répondre à la nouvelle exigence ?
body:
  options:
    - { id: a, text: { en: "Increase the retention period of the recovery points in the second Region to 35 days.", fr: "Porter à 35 jours la période de rétention des points de récupération dans la seconde Région." } }
    - { id: b, text: { en: "Apply AWS Backup Vault Lock to the backup vault in the second Region.", fr: "Appliquer AWS Backup Vault Lock au coffre de sauvegarde de la seconde Région." } }
    - { id: c, text: { en: "Move the backup window of the daily rule from 01:00 UTC to 12:00 UTC.", fr: "Déplacer la fenêtre de sauvegarde de la règle quotidienne de 01:00 UTC à 12:00 UTC." } }
    - { id: d, text: { en: "Change the backup rule to run every hour, and keep the copy action to the second Region.", fr: "Modifier la règle de sauvegarde pour qu'elle s'exécute toutes les heures, et conserver l'action de copie vers la seconde Région." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In a backup and restore strategy, the RPO is set by how often backups are created and copied out of the Region. With one copy a day, almost 24 hours of data can be lost; an hourly rule with the cross-Region copy action keeps the newest copy in the second Region well within 4 hours, while restores still fit the 24-hour RTO.
    fr: |
      Dans une stratégie de sauvegarde et restauration, le RPO dépend de la fréquence à laquelle les sauvegardes sont créées et copiées hors de la Région. Avec une copie par jour, près de 24 heures de données peuvent être perdues ; une règle horaire avec l'action de copie interrégionale maintient la copie la plus récente de la seconde Région bien en deçà de 4 heures, tandis que les restaurations respectent toujours le RTO de 24 heures.
  options:
    a: { en: "A longer retention keeps older recovery points but does not make the newest one more recent.", fr: "Une rétention plus longue conserve des points de récupération plus anciens, mais ne rend pas le plus récent plus frais." }
    b: { en: "Vault Lock protects recovery points from deletion; it does not change how often they are created.", fr: "Vault Lock protège les points de récupération contre la suppression ; il ne change pas leur fréquence de création." }
    c: { en: "Moving a daily window still leaves up to 24 hours between recovery points.", fr: "Déplacer une fenêtre quotidienne laisse toujours jusqu'à 24 heures entre deux points de récupération." }
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  - title: Creating backup copies across AWS Regions - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html
