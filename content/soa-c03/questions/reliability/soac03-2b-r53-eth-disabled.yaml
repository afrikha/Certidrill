id: soac03-2b-r53-eth-disabled
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application behind an Application Load Balancer in us-east-1 and a standby copy behind another Application Load Balancer in us-west-2. In Route 53, a primary failover alias record points to the us-east-1 load balancer and a secondary failover alias record points to the us-west-2 load balancer. Both records have Evaluate Target Health set to No, and neither has an associated health check. During a test, all targets of the us-east-1 load balancer became unhealthy, but Route 53 kept answering with the us-east-1 load balancer.

    Which change will make Route 53 fail over automatically?
  fr: |
    Une entreprise exécute une application derrière un Application Load Balancer dans us-east-1 et une copie de secours derrière un autre Application Load Balancer dans us-west-2. Dans Route 53, un enregistrement d'alias de basculement principal pointe vers l'équilibreur de charge de us-east-1 et un enregistrement d'alias de basculement secondaire vers celui de us-west-2. Les deux enregistrements ont Evaluate Target Health défini sur No, et aucun n'est associé à une vérification de l'état. Lors d'un test, toutes les cibles de l'équilibreur de charge de us-east-1 sont devenues défaillantes, mais Route 53 a continué de répondre avec l'équilibreur de charge de us-east-1.

    Quelle modification permet à Route 53 de basculer automatiquement ?
body:
  options:
    - { id: a, text: { en: "Lower the TTL of the primary alias record to 60 seconds so that resolvers query Route 53 more often.", fr: "Réduire le TTL de l'enregistrement d'alias principal à 60 secondes pour que les résolveurs interrogent Route 53 plus souvent." } }
    - { id: b, text: { en: "Replace both records with weighted alias records that have weights of 255 and 0, without health checks.", fr: "Remplacer les deux enregistrements par des enregistrements d'alias pondérés avec des poids de 255 et 0, sans vérification de l'état." } }
    - { id: c, text: { en: "Turn on cross-zone load balancing for the target group of the us-east-1 load balancer.", fr: "Activer l'équilibrage de charge entre zones pour le groupe cible de l'équilibreur de charge de us-east-1." } }
    - { id: d, text: { en: "Set Evaluate Target Health to Yes on the alias records so that Route 53 uses the health of each load balancer.", fr: "Définir Evaluate Target Health sur Yes sur les enregistrements d'alias pour que Route 53 utilise l'état de chaque équilibreur de charge." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With Evaluate Target Health set to No and no health check, Route 53 keeps routing to the records that an alias record refers to even when the resources behind them fail. With Yes on an alias record that points to a load balancer, Route 53 checks whether the load balancer has healthy targets and routes traffic away from it when it does not, so the secondary record is returned.
    fr: |
      Avec Evaluate Target Health défini sur No et sans vérification de l'état, Route 53 continue de router vers ce que désigne un enregistrement d'alias, même lorsque les ressources derrière sont en panne. Avec Yes sur un enregistrement d'alias qui pointe vers un équilibreur de charge, Route 53 vérifie si l'équilibreur a des cibles saines et route le trafic ailleurs dans le cas contraire : l'enregistrement secondaire est alors renvoyé.
  options:
    a: { en: "An alias record to a load balancer has no TTL of its own to set, and a lower TTL would not make Route 53 evaluate health anyway.", fr: "Un enregistrement d'alias vers un équilibreur de charge n'a pas de TTL propre à définir, et un TTL plus court ne ferait de toute façon pas évaluer l'état par Route 53." }
    b: { en: "Weighted records also need health evaluation; without it, Route 53 considers both records healthy and keeps returning the first one.", fr: "Les enregistrements pondérés ont aussi besoin d'une évaluation de l'état ; sans elle, Route 53 considère les deux enregistrements sains et continue de renvoyer le premier." }
    c: { en: "Cross-zone load balancing spreads requests across Availability Zones inside the load balancer; it does not tell Route 53 that the load balancer has no healthy targets.", fr: "L'équilibrage de charge entre zones répartit les requêtes entre zones de disponibilité dans l'équilibreur ; il n'indique pas à Route 53 que l'équilibreur n'a plus de cible saine." }
references:
  - title: How health checks work in complex Amazon Route 53 configurations
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-complex-configs.html
  - title: Values specific for simple alias records
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resource-record-sets-values-alias.html
