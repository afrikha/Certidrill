id: soac03-2a-ecs-service-cluster-scaling
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs an Amazon ECS service on a cluster of EC2 container instances that belong to an Auto Scaling group. The number of tasks must change automatically to keep the service's average CPU utilization near 60%. When new tasks cannot be placed because the instances are full, EC2 instances must be added automatically, and instances that are no longer needed must be removed.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    AnyCompany exécute un service Amazon ECS sur un cluster d'instances de conteneur EC2 qui appartiennent à un groupe Auto Scaling. Le nombre de tâches doit varier automatiquement pour maintenir l'utilisation moyenne du processeur du service autour de 60 %. Quand de nouvelles tâches ne peuvent pas être placées parce que les instances sont pleines, des instances EC2 doivent être ajoutées automatiquement, et les instances devenues inutiles doivent être supprimées.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an Application Auto Scaling target tracking policy for the service's desired count with the ECSServiceAverageCPUUtilization metric.", fr: "Créer une politique de suivi de cible Application Auto Scaling pour le nombre souhaité de tâches du service avec la métrique ECSServiceAverageCPUUtilization." } }
    - { id: b, text: { en: "Create an EC2 Auto Scaling target tracking policy on the Auto Scaling group with the ASGAverageCPUUtilization metric.", fr: "Créer une politique de suivi de cible EC2 Auto Scaling sur le groupe Auto Scaling avec la métrique ASGAverageCPUUtilization." } }
    - { id: c, text: { en: "Enable Capacity Rebalancing on the Auto Scaling group so that instances are added when tasks are pending.", fr: "Activer Capacity Rebalancing sur le groupe Auto Scaling pour que des instances soient ajoutées quand des tâches sont en attente." } }
    - { id: d, text: { en: "Create an Auto Scaling group capacity provider with managed scaling turned on, and use it in the service's capacity provider strategy.", fr: "Créer un fournisseur de capacité de groupe Auto Scaling avec la mise à l'échelle gérée activée, et l'utiliser dans la stratégie de fournisseur de capacité du service." } }
    - { id: e, text: { en: "Create a scheduled action on the Auto Scaling group that raises the desired capacity during business hours.", fr: "Créer une action planifiée sur le groupe Auto Scaling qui augmente la capacité souhaitée pendant les heures de bureau." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Amazon ECS service auto scaling uses Application Auto Scaling, and a target tracking policy on ECSServiceAverageCPUUtilization adjusts the number of tasks. Cluster auto scaling with a capacity provider that has managed scaling turned on makes Amazon ECS manage the group's capacity from the CapacityProviderReservation metric, adding instances for tasks that cannot be placed and removing unneeded ones."
    fr: "La mise à l'échelle automatique des services Amazon ECS utilise Application Auto Scaling, et une politique de suivi de cible sur ECSServiceAverageCPUUtilization ajuste le nombre de tâches. La mise à l'échelle automatique du cluster, avec un fournisseur de capacité dont la mise à l'échelle gérée est activée, fait gérer par Amazon ECS la capacité du groupe à partir de la métrique CapacityProviderReservation, en ajoutant des instances pour les tâches impossibles à placer et en supprimant celles qui ne servent plus."
  options:
    b:
      en: "Instance CPU does not reflect tasks that are waiting for capacity, and Amazon ECS advises against managing the group's desired capacity with other scaling policies."
      fr: "Le processeur des instances ne reflète pas les tâches en attente de capacité, et Amazon ECS déconseille de gérer la capacité souhaitée du groupe avec d'autres politiques de mise à l'échelle."
    c:
      en: "Capacity Rebalancing proactively replaces Spot Instances at risk of interruption; it does not react to pending tasks."
      fr: "Capacity Rebalancing remplace de manière proactive les instances Spot exposées à une interruption ; il ne réagit pas aux tâches en attente."
    e:
      en: "A fixed schedule does not follow the actual task placement needs and does not remove instances when they are no longer needed."
      fr: "Un calendrier fixe ne suit pas les besoins réels de placement des tâches et ne supprime pas les instances devenues inutiles."
references:
  - title: Automatically scale your Amazon ECS service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-auto-scaling.html
  - title: Automatically manage Amazon ECS capacity with cluster auto scaling
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/cluster-auto-scaling.html
