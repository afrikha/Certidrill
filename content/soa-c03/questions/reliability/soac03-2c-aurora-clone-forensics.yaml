id: soac03-2c-aurora-clone-forensics
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial company runs a 12 TB Amazon Aurora PostgreSQL-Compatible Edition DB cluster. The security team needs a separate, writable copy of the current production data in the same AWS Region within minutes so that analysts can run investigation queries for 2 days without affecting production. The company wants to minimize the storage cost of the copy.

    Which solution will meet these requirements?
  fr: |
    Une société financière exécute un cluster de bases de données Amazon Aurora PostgreSQL-Compatible Edition de 12 To. L'équipe de sécurité a besoin en quelques minutes d'une copie distincte et accessible en écriture des données de production actuelles, dans la même Région AWS, afin que des analystes y exécutent des requêtes d'enquête pendant 2 jours sans affecter la production. L'entreprise veut réduire au minimum le coût de stockage de la copie.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Take a manual DB cluster snapshot, and restore the snapshot to a new DB cluster for the analysts.", fr: "Prendre un instantané de cluster manuel, et restaurer l'instantané dans un nouveau cluster pour les analystes." } }
    - { id: b, text: { en: "Add an Aurora Replica to the production cluster, and give the analysts a custom endpoint for it.", fr: "Ajouter un réplica Aurora au cluster de production, et fournir aux analystes un point de terminaison personnalisé pour celui-ci." } }
    - { id: c, text: { en: "Export the latest snapshot to Amazon S3, and let the analysts query the exported data with Amazon Athena.", fr: "Exporter le dernier instantané vers Amazon S3, et laisser les analystes interroger les données exportées avec Amazon Athena." } }
    - { id: d, text: { en: "Create an Aurora clone of the production cluster, and add a DB instance to the clone for the analysts.", fr: "Créer un clone Aurora du cluster de production, et ajouter une instance de base de données au clone pour les analystes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Aurora cloning uses a copy-on-write protocol: the clone initially shares the data pages of the source, so it is created quickly and no data is copied. Only the pages that change in the clone or the source consume new storage, which keeps the cost of a 2-day investigation copy low. The clone is an independent, writable cluster in the same Region.
    fr: |
      Le clonage Aurora utilise un protocole de copie sur écriture : le clone partage au départ les pages de données de la source, il est donc créé rapidement et aucune donnée n'est copiée. Seules les pages modifiées dans le clone ou dans la source consomment du nouveau stockage, ce qui limite le coût d'une copie d'enquête de 2 jours. Le clone est un cluster indépendant, accessible en écriture, dans la même Région.
  options:
    a: { en: "Restoring a 12 TB snapshot is slower than cloning and creates a full copy of the storage, which costs more.", fr: "Restaurer un instantané de 12 To est plus lent que le clonage et crée une copie complète du stockage, ce qui coûte plus cher." }
    b: { en: "An Aurora Replica is read-only and shares the production cluster volume, so it is not a separate, writable copy.", fr: "Un réplica Aurora est en lecture seule et partage le volume du cluster de production : ce n'est pas une copie distincte accessible en écriture." }
    c: { en: "A snapshot export takes far longer than minutes for 12 TB and does not give the analysts a writable PostgreSQL database.", fr: "Un export d'instantané prend bien plus que quelques minutes pour 12 To et ne fournit pas aux analystes de base PostgreSQL accessible en écriture." }
references:
  - title: Cloning a volume for an Amazon Aurora DB cluster
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Clone.html
