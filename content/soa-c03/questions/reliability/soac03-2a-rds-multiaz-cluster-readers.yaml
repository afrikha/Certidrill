id: soac03-2a-rds-multiaz-cluster-readers
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs Amazon RDS for PostgreSQL as a Multi-AZ DB instance deployment. Read traffic is growing. The company wants the standby DB instances that provide automatic failover to also serve read queries through a reader endpoint. The database must stay on RDS for PostgreSQL.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute Amazon RDS for PostgreSQL dans un déploiement d'instance de base de données Multi-AZ. Le trafic de lecture augmente. L'entreprise veut que les instances de secours qui assurent le basculement automatique servent aussi les requêtes de lecture via un point de terminaison du lecteur. La base de données doit rester sur RDS for PostgreSQL.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send read queries to the standby DB instance of the Multi-AZ DB instance deployment.", fr: "Envoyer les requêtes de lecture à l'instance de secours du déploiement d'instance de base de données Multi-AZ." } }
    - { id: b, text: { en: "Create a cross-Region read replica, and send read queries to its endpoint.", fr: "Créer un réplica en lecture entre Régions, et envoyer les requêtes de lecture à son point de terminaison." } }
    - { id: c, text: { en: "Move the database to a Multi-AZ DB cluster deployment, and send read queries to its reader endpoint.", fr: "Passer la base de données à un déploiement de cluster de bases de données Multi-AZ, et envoyer les requêtes de lecture à son point de terminaison du lecteur." } }
    - { id: d, text: { en: "Add an RDS Proxy, and configure its target group to route read queries to the standby DB instance.", fr: "Ajouter un RDS Proxy, et configurer son groupe cible pour acheminer les requêtes de lecture vers l'instance de secours." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A Multi-AZ DB cluster deployment has a writer and two readable standby DB instances in different Availability Zones. The standbys provide failover and also serve read traffic through the cluster's reader endpoint."
    fr: "Un déploiement de cluster de bases de données Multi-AZ comprend une instance d'écriture et deux instances de secours lisibles dans des zones de disponibilité différentes. Les instances de secours assurent le basculement et servent aussi le trafic de lecture via le point de terminaison du lecteur du cluster."
  options:
    a:
      en: "The standby of a Multi-AZ DB instance deployment cannot serve read traffic; it exists only for failover."
      fr: "L'instance de secours d'un déploiement d'instance de base de données Multi-AZ ne peut pas servir de trafic de lecture ; elle n'existe que pour le basculement."
    b:
      en: "A read replica serves reads but is not a standby that RDS fails over to automatically, and a cross-Region copy adds latency for no stated need."
      fr: "Un réplica en lecture sert des lectures, mais ce n'est pas une instance de secours vers laquelle RDS bascule automatiquement, et une copie dans une autre Région ajoute de la latence sans besoin exprimé."
    d:
      en: "RDS Proxy pools connections to the DB instance; it cannot make a non-readable standby serve queries."
      fr: "RDS Proxy regroupe les connexions vers l'instance ; il ne peut pas faire servir des requêtes par une instance de secours non lisible."
references:
  - title: Configuring and managing a Multi-AZ deployment for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html
