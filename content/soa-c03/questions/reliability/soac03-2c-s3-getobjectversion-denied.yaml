id: soac03-2c-s3-getobjectversion-denied
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An internal tool lets support engineers download earlier versions of invoices from a versioning-enabled Amazon S3 bucket named `invoices-prod`. The tool lists versions successfully and downloads current versions, but every `GetObject` request that includes a `versionId` returns `AccessDenied`. The tool's IAM role has the following policy.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        { "Effect": "Allow",
          "Action": [ "s3:ListBucket", "s3:ListBucketVersions" ],
          "Resource": "arn:aws:s3:::invoices-prod" },
        { "Effect": "Allow",
          "Action": [ "s3:GetObject" ],
          "Resource": "arn:aws:s3:::invoices-prod/*" }
      ]
    }
    ```

    Which change will fix the issue while following the principle of least privilege?
  fr: |
    Un outil interne permet aux ingénieurs du support de télécharger des versions antérieures de factures depuis un compartiment Amazon S3 nommé `invoices-prod` dont la gestion des versions est activée. L'outil liste les versions et télécharge les versions actuelles sans problème, mais chaque requête `GetObject` qui inclut un `versionId` renvoie `AccessDenied`. Le rôle IAM de l'outil dispose de la politique suivante.

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        { "Effect": "Allow",
          "Action": [ "s3:ListBucket", "s3:ListBucketVersions" ],
          "Resource": "arn:aws:s3:::invoices-prod" },
        { "Effect": "Allow",
          "Action": [ "s3:GetObject" ],
          "Resource": "arn:aws:s3:::invoices-prod/*" }
      ]
    }
    ```

    Quelle modification corrige le problème en respectant le principe du moindre privilège ?
body:
  options:
    - { id: a, text: { en: "Add `s3:GetBucketVersioning` to the first statement.", fr: "Ajouter `s3:GetBucketVersioning` à la première instruction." } }
    - { id: b, text: { en: "Replace `s3:GetObject` with `s3:*` in the second statement.", fr: "Remplacer `s3:GetObject` par `s3:*` dans la seconde instruction." } }
    - { id: c, text: { en: "Add `s3:GetObjectVersion` to the second statement.", fr: "Ajouter `s3:GetObjectVersion` à la seconde instruction." } }
    - { id: d, text: { en: "Add `s3:ListBucketVersions` to the second statement.", fr: "Ajouter `s3:ListBucketVersions` à la seconde instruction." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A `GetObject` request that includes a `versionId` requires the `s3:GetObjectVersion` permission on the object; `s3:GetObject` covers only requests for the current version. Adding `s3:GetObjectVersion` on `arn:aws:s3:::invoices-prod/*` grants exactly the missing access.
    fr: |
      Une requête `GetObject` qui inclut un `versionId` exige l'autorisation `s3:GetObjectVersion` sur l'objet ; `s3:GetObject` ne couvre que les requêtes portant sur la version actuelle. Ajouter `s3:GetObjectVersion` sur `arn:aws:s3:::invoices-prod/*` accorde exactement l'accès manquant.
  options:
    a: { en: "`s3:GetBucketVersioning` only reads the versioning state of the bucket; it does not allow downloading a specific version.", fr: "`s3:GetBucketVersioning` ne lit que l'état de gestion des versions du compartiment ; il ne permet pas de télécharger une version précise." }
    b: { en: "`s3:*` would fix the issue but grants far more than needed, including deletions, which violates least privilege.", fr: "`s3:*` corrigerait le problème mais accorderait bien plus que nécessaire, y compris des suppressions, ce qui enfreint le moindre privilège." }
    d: { en: "`s3:ListBucketVersions` is a bucket-level action that is already granted; it does not allow reading object versions.", fr: "`s3:ListBucketVersions` est une action au niveau du compartiment déjà accordée ; elle ne permet pas de lire des versions d'objets." }
references:
  - title: GetObject - Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html
