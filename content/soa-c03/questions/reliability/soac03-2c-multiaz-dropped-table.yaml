id: soac03-2c-multiaz-dropped-table
objective: "2.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs a production Amazon RDS for PostgreSQL Multi-AZ DB instance with one read replica. Fifteen minutes ago, a developer dropped the `coupons` table by mistake. Customers have placed hundreds of valid orders in other tables since then. The company must recover the `coupons` table without losing the orders placed after the mistake.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute en production une instance de base de données Amazon RDS for PostgreSQL Multi-AZ avec un réplica en lecture. Il y a quinze minutes, un développeur a supprimé par erreur la table `coupons`. Depuis, les clients ont passé des centaines de commandes valides dans d'autres tables. L'entreprise doit récupérer la table `coupons` sans perdre les commandes passées après l'erreur.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Reboot the production DB instance with failover so that the standby becomes the new primary DB instance.", fr: "Redémarrer l'instance de production avec basculement pour que le réplica de secours devienne la nouvelle instance principale." } }
    - { id: b, text: { en: "Restore the DB instance to a point in time just before the table was dropped, as a new DB instance.", fr: "Restaurer l'instance à un instant juste avant la suppression de la table, en tant que nouvelle instance." } }
    - { id: c, text: { en: "Promote the read replica to a standalone DB instance, and point the application to it.", fr: "Promouvoir le réplica en lecture en instance autonome, et faire pointer l'application vers celle-ci." } }
    - { id: d, text: { en: "Dump the `coupons` table from the restored DB instance, and load it into the production DB instance.", fr: "Exporter la table `coupons` de l'instance restaurée avec un dump, et la charger dans l'instance de production." } }
    - { id: e, text: { en: "Rename the production DB instance, and give its name to the restored DB instance.", fr: "Renommer l'instance de production, et donner son nom à l'instance restaurée." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Point-in-time recovery creates a new DB instance with the state just before the DROP, which still contains the `coupons` table. Copying only that table back into production, for example with `pg_dump` and `pg_restore`, recovers it while keeping every order written to production after the mistake.
    fr: |
      La restauration à un instant dans le passé crée une nouvelle instance dans l'état précédant juste l'instruction DROP, qui contient encore la table `coupons`. Ne recopier que cette table dans la production, par exemple avec `pg_dump` et `pg_restore`, la récupère tout en conservant toutes les commandes écrites en production après l'erreur.
  options:
    a: { en: "The Multi-AZ standby is synchronous, so the table is already dropped on it as well.", fr: "Le réplica de secours Multi-AZ est synchrone : la table y est donc déjà supprimée aussi." }
    c: { en: "The read replica replays the DROP within seconds, so it no longer has the table.", fr: "Le réplica en lecture rejoue l'instruction DROP en quelques secondes : il ne contient plus la table." }
    e: { en: "Replacing production with the restored instance would lose every order placed after the restore time.", fr: "Remplacer la production par l'instance restaurée ferait perdre toutes les commandes passées après l'instant de restauration." }
references:
  - title: Restoring a DB instance to a specified time for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
