id: soac03-2c-dr-arc-region-switch
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an active/passive application whose resources are spread across three AWS accounts in us-east-1 and us-west-2. A Regional failover requires several ordered steps, including an Aurora global database failover and the redirection of user traffic. The company wants a managed way to orchestrate these steps across accounts, started manually or by a CloudWatch alarm, that does not depend on the Region being deactivated, shows progress in real time, and avoids maintaining custom recovery scripts.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application active/passive dont les ressources sont réparties sur trois comptes AWS dans us-east-1 et us-west-2. Un basculement régional exige plusieurs étapes ordonnées, dont un basculement de base de données globale Aurora et la redirection du trafic des utilisateurs. L'entreprise veut un moyen géré d'orchestrer ces étapes entre les comptes, lancé manuellement ou par une alarme CloudWatch, qui ne dépend pas de la Région désactivée, affiche la progression en temps réel et évite de maintenir des scripts de reprise personnalisés.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an ARC Region switch plan with workflows whose steps fail over the database and redirect the traffic.", fr: "Créer un plan Region switch d'ARC avec des flux de travail dont les étapes basculent la base de données et redirigent le trafic." } }
    - { id: b, text: { en: "Write a Systems Manager Automation runbook in us-east-1 that calls the failover APIs in each account.", fr: "Écrire dans us-east-1 un runbook Systems Manager Automation qui appelle les API de basculement dans chaque compte." } }
    - { id: c, text: { en: "Build an AWS Step Functions state machine in us-east-1 that invokes Lambda functions for each failover step.", fr: "Créer dans us-east-1 une machine d'état AWS Step Functions qui invoque des fonctions Lambda pour chaque étape de basculement." } }
    - { id: d, text: { en: "Use CloudFormation StackSets to redeploy the application stacks in us-west-2 in every account during a disaster.", fr: "Utiliser CloudFormation StackSets pour redéployer les piles de l'application dans us-west-2 dans chaque compte en cas de sinistre." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Region switch in Amazon Application Recovery Controller (ARC) orchestrates multi-step recovery across AWS accounts through plans made of workflows, steps and execution blocks. Plans can run manually or from CloudWatch alarms, each Region has its own data plane so execution does not depend on the Region being deactivated, and dashboards show the recovery in real time without custom scripts.
    fr: |
      Region switch d'Amazon Application Recovery Controller (ARC) orchestre une reprise en plusieurs étapes entre comptes AWS au moyen de plans composés de flux de travail, d'étapes et de blocs d'exécution. Les plans peuvent être lancés manuellement ou par des alarmes CloudWatch, chaque Région possède son propre plan de données, de sorte que l'exécution ne dépend pas de la Région désactivée, et des tableaux de bord montrent la reprise en temps réel sans scripts personnalisés.
  options:
    b: { en: "The runbook runs in the Region that may be impaired and is custom recovery code that the company must maintain.", fr: "Le runbook s'exécute dans la Région qui peut être dégradée et constitue du code de reprise personnalisé que l'entreprise doit maintenir." }
    c: { en: "The state machine depends on us-east-1 and on custom Lambda code, which the requirements rule out.", fr: "La machine d'état dépend de us-east-1 et de code Lambda personnalisé, ce que les exigences excluent." }
    d: { en: "Redeploying stacks is a provisioning step, not an orchestration of the database failover and traffic redirection.", fr: "Redéployer des piles est une étape de provisionnement, et non une orchestration du basculement de la base de données et de la redirection du trafic." }
references:
  - title: Region switch in ARC - Amazon Application Recovery Controller (ARC)
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/region-switch.html
