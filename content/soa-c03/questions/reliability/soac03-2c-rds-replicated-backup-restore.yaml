id: soac03-2c-rds-replicated-backup-restore
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance in eu-west-1 and has turned on cross-Region automated backup replication to eu-central-1. The company does not run any read replica. During a disaster recovery exercise, eu-west-1 is treated as unavailable, and the operator must recover the database in eu-central-1 with the smallest data loss.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL dans eu-west-1 et a activé la réplication interrégionale des sauvegardes automatisées vers eu-central-1. L'entreprise n'exécute aucun réplica en lecture. Pendant un exercice de reprise après sinistre, eu-west-1 est considérée comme indisponible, et l'opérateur doit récupérer la base de données dans eu-central-1 avec la plus petite perte de données.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Copy the latest automated DB snapshot from eu-west-1 to eu-central-1, and restore the copy.", fr: "Copier le dernier instantané automatisé de eu-west-1 vers eu-central-1, et restaurer la copie." } }
    - { id: b, text: { en: "Promote the replicated automated backup in eu-central-1 to a standalone DB instance.", fr: "Promouvoir la sauvegarde automatisée répliquée dans eu-central-1 en instance autonome." } }
    - { id: c, text: { en: "Start an AWS Backup restore job in eu-west-1 that creates a new DB instance from the latest recovery point in eu-central-1.", fr: "Lancer dans eu-west-1 une tâche de restauration AWS Backup qui crée une nouvelle instance à partir du dernier point de récupération dans eu-central-1." } }
    - { id: d, text: { en: "In eu-central-1, restore the replicated automated backup to its latest restorable time as a new DB instance.", fr: "Dans eu-central-1, restaurer la sauvegarde automatisée répliquée à son heure de restauration la plus récente en tant que nouvelle instance." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Cross-Region automated backup replication copies the snapshots and transaction logs of the DB instance to the destination Region. From the Replicated backups tab, or with `restore-db-instance-to-point-in-time` and `--source-db-instance-automated-backups-arn`, the operator restores a new DB instance in eu-central-1 to the latest restorable time without any call to eu-west-1.
    fr: |
      La réplication interrégionale des sauvegardes automatisées copie les instantanés et les journaux de transactions de l'instance dans la Région de destination. Depuis l'onglet des sauvegardes répliquées, ou avec `restore-db-instance-to-point-in-time` et `--source-db-instance-automated-backups-arn`, l'opérateur restaure une nouvelle instance dans eu-central-1 à l'heure de restauration la plus récente, sans aucun appel à eu-west-1.
  options:
    a: { en: "The copy depends on the unavailable source Region, and a daily snapshot loses the changes made after it was taken.", fr: "La copie dépend de la Région source indisponible, et un instantané quotidien perd les modifications effectuées après sa création." }
    b: { en: "Only a read replica can be promoted; a replicated backup is restored, not promoted.", fr: "Seul un réplica en lecture peut être promu ; une sauvegarde répliquée se restaure, elle ne se promeut pas." }
    c: { en: "The job runs in the unavailable Region, and the company protects the instance with RDS backup replication, not with an AWS Backup plan that has recovery points in eu-central-1.", fr: "La tâche s'exécute dans la Région indisponible, et l'entreprise protège l'instance par la réplication des sauvegardes RDS, et non par un plan AWS Backup qui aurait des points de récupération dans eu-central-1." }
references:
  - title: Restoring to a specified time from a replicated backup for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/AutomatedBackups.PiTR.html
