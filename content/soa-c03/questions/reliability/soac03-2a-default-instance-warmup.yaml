id: soac03-2a-default-instance-warmup
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Auto Scaling group uses a target tracking scaling policy that keeps average CPU utilization at 50%. When a new instance starts, it loads data into memory and uses close to 100% CPU for about 3 minutes before it serves traffic. During scale-out events, the group launches more instances than it needs and later scales in again. The policy has no warmup value, the group has no default instance warmup, and the group's default cooldown is set to 0 seconds.

    Which change will stop the over-provisioning with the LEAST operational overhead?
  fr: |
    Un groupe Auto Scaling utilise une politique de suivi de cible qui maintient l'utilisation moyenne du processeur à 50 %. Au démarrage, une nouvelle instance charge des données en mémoire et utilise près de 100 % du processeur pendant environ 3 minutes avant de servir du trafic. Lors des augmentations de capacité, le groupe lance plus d'instances que nécessaire, puis réduit de nouveau sa capacité plus tard. La politique n'a pas de valeur de préchauffage, le groupe n'a pas de préchauffage d'instance par défaut, et le temps de stabilisation par défaut du groupe est défini sur 0 seconde.

    Quelle modification met fin au surprovisionnement avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Set the default instance warmup of the group to 300 seconds.", fr: "Définir le préchauffage d'instance par défaut du groupe sur 300 secondes." } }
    - { id: b, text: { en: "Set the health check grace period of the group to 300 seconds.", fr: "Définir la période de grâce de la vérification de l'état du groupe sur 300 secondes." } }
    - { id: c, text: { en: "Enable detailed monitoring so that the policy receives CPU metrics every minute.", fr: "Activer la surveillance détaillée pour que la politique reçoive les métriques du processeur toutes les minutes." } }
    - { id: d, text: { en: "Replace the target tracking policy with simple scaling policies, alarms and a 300-second cooldown.", fr: "Remplacer la politique de suivi de cible par des politiques de mise à l'échelle simple, des alarmes et un temps de stabilisation de 300 secondes." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The default instance warmup is the time after an instance enters InService before its metrics count in the group's aggregated metrics. Without it, target tracking falls back to the default cooldown, which is 0 here, so the startup CPU spikes trigger more scale-out. A 300-second warmup covers the 3-minute startup with one setting that applies to all policies."
    fr: "Le préchauffage d'instance par défaut est le délai entre le passage d'une instance à InService et la prise en compte de ses métriques dans les métriques agrégées du groupe. Sans lui, le suivi de cible utilise le temps de stabilisation par défaut, qui vaut 0 ici : les pics de processeur au démarrage déclenchent d'autres augmentations. Un préchauffage de 300 secondes couvre les 3 minutes de démarrage avec un seul paramètre qui s'applique à toutes les politiques."
  options:
    b:
      en: "The grace period only delays health check replacement of new instances. It does not exclude their metrics from scaling decisions."
      fr: "La période de grâce retarde seulement le remplacement des nouvelles instances après vérification de l'état. Elle n'exclut pas leurs métriques des décisions de mise à l'échelle."
    c:
      en: "One-minute metrics make the policy react faster to the startup spikes, which makes the over-provisioning worse."
      fr: "Des métriques à une minute font réagir la politique plus vite aux pics de démarrage, ce qui aggrave le surprovisionnement."
    d:
      en: "Rebuilding the scaling with simple scaling policies and alarms is more work, and simple scaling reacts more slowly to real load changes."
      fr: "Reconstruire la mise à l'échelle avec des politiques simples et des alarmes demande plus de travail, et la mise à l'échelle simple réagit plus lentement aux vrais changements de charge."
references:
  - title: Set the default instance warmup for an Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-default-instance-warmup.html
