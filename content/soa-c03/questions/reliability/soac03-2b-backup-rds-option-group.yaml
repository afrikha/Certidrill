id: soac03-2b-backup-rds-option-group
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Backup plan takes daily snapshots of an Amazon RDS for Oracle DB instance in eu-west-1 and copies each recovery point to a backup vault in eu-central-1. The DB instance uses a custom option group that contains a persistent option. The backups in eu-west-1 succeed, but every copy job fails with an error that states that the snapshot requires a target option group with the following options.

    Which solution will resolve the issue?
  fr: |
    Un plan AWS Backup prend des instantanés quotidiens d'une instance de base de données Amazon RDS for Oracle dans eu-west-1 et copie chaque point de récupération dans un coffre de sauvegarde de eu-central-1. L'instance utilise un groupe d'options personnalisé qui contient une option persistante. Les sauvegardes dans eu-west-1 réussissent, mais chaque tâche de copie échoue avec une erreur indiquant que l'instantané nécessite un groupe d'options cible contenant les options suivantes.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Create an option group with the same options in eu-central-1 before the next copy jobs run.", fr: "Créer dans eu-central-1 un groupe d'options avec les mêmes options avant les prochaines tâches de copie." } }
    - { id: b, text: { en: "Change the copy action to move the copies to cold storage in eu-central-1.", fr: "Modifier l'action de copie pour placer les copies en stockage à froid dans eu-central-1." } }
    - { id: c, text: { en: "Turn on continuous backups for the DB instance so that the copies include the transaction logs.", fr: "Activer les sauvegardes continues pour l'instance afin que les copies incluent les journaux de transactions." } }
    - { id: d, text: { en: "Change the destination of the copy action to the default backup vault in eu-central-1.", fr: "Remplacer la destination de l'action de copie par le coffre de sauvegarde par défaut de eu-central-1." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When an RDS DB instance uses a custom option group with persistent options, a cross-Region copy fails unless the destination Region has an option group with the same options. Option groups cannot be copied to another Region, so the engineer creates the matching option group in eu-central-1 first; the following copy jobs then succeed.
    fr: |
      Lorsqu'une instance RDS utilise un groupe d'options personnalisé avec des options persistantes, une copie entre Régions échoue sauf si la Région de destination dispose d'un groupe d'options avec les mêmes options. Les groupes d'options ne peuvent pas être copiés vers une autre Région : l'ingénieur crée donc d'abord le groupe correspondant dans eu-central-1, et les tâches de copie suivantes réussissent.
  options:
    b: { en: "AWS Backup does not support cross-Region copies into cold storage, and the storage tier does not fix the missing option group.", fr: "AWS Backup ne prend pas en charge les copies entre Régions vers le stockage à froid, et le niveau de stockage ne corrige pas le groupe d'options manquant." }
    c: { en: "Continuous backups of RDS cannot be copied as such; AWS Backup copies a snapshot instead, which still needs the option group.", fr: "Les sauvegardes continues RDS ne peuvent pas être copiées telles quelles ; AWS Backup copie à la place un instantané, qui exige toujours le groupe d'options." }
    d: { en: "The vault that receives the copy does not change the option group requirement of the snapshot.", fr: "Le coffre qui reçoit la copie ne change pas l'exigence de groupe d'options de l'instantané." }
references:
  - title: Creating backup copies across AWS Regions
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html
