id: soac03-2b-r53-request-interval
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Route 53 failover routing for an application. The primary record is associated with a health check that monitors the application endpoint with a request interval of 30 seconds and a failure threshold of 3. The company now requires Route 53 to detect failures faster by using a request interval of 10 seconds, and it wants to keep a failure threshold of 3 to avoid failovers caused by a single slow response.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise le routage de basculement Route 53 pour une application. L'enregistrement principal est associé à une vérification de l'état qui surveille le point de terminaison de l'application avec un intervalle de requête de 30 secondes et un seuil d'échec de 3. L'entreprise exige désormais que Route 53 détecte les pannes plus vite avec un intervalle de requête de 10 secondes, et veut conserver un seuil d'échec de 3 pour éviter des basculements dus à une seule réponse lente.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Edit the existing health check and change its request interval to Fast (10 seconds).", fr: "Modifier la vérification de l'état existante et passer son intervalle de requête à Fast (10 secondes)." } }
    - { id: b, text: { en: "Edit the existing health check and lower its failure threshold to 1 to detect failures sooner.", fr: "Modifier la vérification de l'état existante et abaisser son seuil d'échec à 1 pour détecter les pannes plus tôt." } }
    - { id: c, text: { en: "Create a new health check with a Fast (10 seconds) request interval and a failure threshold of 3, and associate it with the primary record.", fr: "Créer une vérification de l'état avec un intervalle de requête Fast (10 secondes) et un seuil d'échec de 3, et l'associer à l'enregistrement principal." } }
    - { id: d, text: { en: "Create a CloudWatch alarm with a 10-second period on the health check status, and associate an alarm-based health check with the primary record.", fr: "Créer une alarme CloudWatch avec une période de 10 secondes sur l'état de la vérification, et associer une vérification basée sur cette alarme à l'enregistrement principal." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The request interval of a Route 53 health check is set at creation and cannot be changed afterward. To use the Fast (10 seconds) interval, the engineer creates a new health check with the same failure threshold and associates it with the primary record instead of the old one; the Fast interval has an additional charge.
    fr: |
      L'intervalle de requête d'une vérification de l'état Route 53 est défini à la création et ne peut plus être modifié ensuite. Pour utiliser l'intervalle Fast (10 secondes), l'ingénieur crée une nouvelle vérification avec le même seuil d'échec et l'associe à l'enregistrement principal à la place de l'ancienne ; l'intervalle Fast est facturé en supplément.
  options:
    a: { en: "Route 53 does not allow the request interval of an existing health check to be changed.", fr: "Route 53 ne permet pas de modifier l'intervalle de requête d'une vérification de l'état existante." }
    b: { en: "A threshold of 1 breaks the requirement to keep 3 consecutive failures, and the interval stays at 30 seconds.", fr: "Un seuil de 1 enfreint l'exigence de conserver 3 échecs consécutifs, et l'intervalle reste de 30 secondes." }
    d: { en: "Alarm-based health checks support only standard-resolution metrics, and an alarm on the existing 30-second health check cannot detect failures any faster.", fr: "Les vérifications basées sur une alarme ne prennent en charge que des métriques à résolution standard, et une alarme sur la vérification existante à 30 secondes ne peut pas détecter les pannes plus vite." }
references:
