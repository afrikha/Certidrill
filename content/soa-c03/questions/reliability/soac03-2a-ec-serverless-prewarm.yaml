id: soac03-2a-ec-serverless-prewarm
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A gaming company uses Amazon ElastiCache Serverless for Valkey. For cost control, the cache has a maximum limit of 50,000 ECPUs per second. A game launch next week is expected to need about 200,000 ECPUs per second within seconds of the start. The company wants to avoid request throttling and high latency when the launch begins.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de jeux vidéo utilise Amazon ElastiCache Serverless for Valkey. Pour maîtriser les coûts, le cache a une limite maximale de 50 000 ECPU par seconde. Le lancement d'un jeu la semaine prochaine devrait nécessiter environ 200 000 ECPU par seconde dans les secondes qui suivent le début. L'entreprise veut éviter la limitation (throttling) des requêtes et une latence élevée au début du lancement.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add two read replicas to the serverless cache before the launch.", fr: "Ajouter deux réplicas en lecture au cache sans serveur avant le lancement." } }
    - { id: b, text: { en: "Register the cache with Application Auto Scaling, and create a scheduled action that adds shards before the launch.", fr: "Enregistrer le cache auprès d'Application Auto Scaling, et créer une action planifiée qui ajoute des partitions avant le lancement." } }
    - { id: c, text: { en: "Raise the maximum ECPU per second limit of the cache above 200,000.", fr: "Relever la limite maximale d'ECPU par seconde du cache au-dessus de 200 000." } }
    - { id: d, text: { en: "Set the minimum data storage limit of the cache to 0 so that more capacity is available for ECPUs.", fr: "Définir la limite minimale de stockage de données du cache sur 0 pour libérer de la capacité pour les ECPU." } }
    - { id: e, text: { en: "Set the minimum ECPU per second limit of the cache to 200,000 at least 60 minutes before the launch.", fr: "Définir la limite minimale d'ECPU par seconde du cache sur 200 000 au moins 60 minutes avant le lancement." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "When usage exceeds the maximum ECPU per second limit, ElastiCache Serverless throttles requests, so the 50,000 cap must be raised above the expected peak. ElastiCache Serverless scales automatically but at a limited rate from its baseline, so for a sudden peak AWS recommends setting the minimum to the expected peak at least 60 minutes in advance; the minimum is billed once it takes effect."
    fr: "Quand l'utilisation dépasse la limite maximale d'ECPU par seconde, ElastiCache Serverless limite les requêtes : le plafond de 50 000 doit donc être relevé au-dessus de la pointe attendue. ElastiCache Serverless s'adapte automatiquement, mais à un rythme limité à partir de sa capacité de base : pour une pointe soudaine, AWS recommande de définir le minimum sur la pointe attendue au moins 60 minutes à l'avance ; le minimum est facturé dès qu'il prend effet."
  options:
    a:
      en: "A serverless cache has no user-managed nodes, so replicas cannot be added; ElastiCache manages its capacity."
      fr: "Un cache sans serveur n'a pas de nœuds gérés par l'utilisateur : on ne peut pas y ajouter de réplicas ; ElastiCache gère sa capacité."
    b:
      en: "ElastiCache Auto Scaling applies to node-based Valkey and Redis OSS clusters with cluster mode enabled, not to serverless caches."
      fr: "ElastiCache Auto Scaling s'applique aux clusters Valkey et Redis OSS basés sur des nœuds avec le mode cluster activé, pas aux caches sans serveur."
    d:
      en: "Data storage and ECPU limits are separate settings; lowering the storage minimum does not add compute capacity."
      fr: "Les limites de stockage de données et d'ECPU sont des paramètres distincts ; réduire le minimum de stockage n'ajoute pas de capacité de calcul."
references:
  - title: Scaling ElastiCache Serverless clusters
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Scaling-serverless.html
