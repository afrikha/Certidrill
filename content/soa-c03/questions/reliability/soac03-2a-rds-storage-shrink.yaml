id: soac03-2a-rds-storage-shrink
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon RDS for MySQL DB instance has 4,000 GiB of allocated storage after a one-time data load. After old data was archived, the database uses only 600 GiB. The company wants to reduce its storage costs and keep the downtime as short as possible.

    Which solution will meet these requirements?
  fr: |
    Une instance de base de données Amazon RDS for MySQL dispose de 4 000 Gio de stockage alloué à la suite d'un chargement de données ponctuel. Après l'archivage des anciennes données, la base n'utilise plus que 600 Gio. L'entreprise veut réduire ses coûts de stockage en limitant au maximum l'interruption de service.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Modify the DB instance, and lower its allocated storage to 800 GiB with Apply immediately.", fr: "Modifier l'instance de base de données, et ramener son stockage alloué à 800 Gio avec Apply immediately." } }
    - { id: b, text: { en: "Turn off storage autoscaling so that Amazon RDS releases the unused storage.", fr: "Désactiver la mise à l'échelle automatique du stockage pour qu'Amazon RDS libère le stockage inutilisé." } }
    - { id: c, text: { en: "Change the storage type from gp2 to gp3 so that billing is based on the storage that is used.", fr: "Passer le type de stockage de gp2 à gp3 pour que la facturation porte sur le stockage utilisé." } }
    - { id: d, text: { en: "Create a blue/green deployment with less allocated storage, and switch over to it.", fr: "Créer un déploiement bleu/vert avec moins de stockage alloué, et basculer vers lui." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon RDS cannot decrease the allocated storage of a DB instance. To reduce it, AWS documents using a blue/green deployment or a new DB instance; a blue/green deployment keeps the green environment in sync and switches over with a short interruption."
    fr: "Amazon RDS ne peut pas réduire le stockage alloué d'une instance de base de données. Pour le réduire, AWS indique d'utiliser un déploiement bleu/vert ou une nouvelle instance ; un déploiement bleu/vert garde l'environnement vert synchronisé et bascule avec une courte interruption."
  options:
    a:
      en: "Allocated storage can only be increased; a request to lower it is rejected."
      fr: "Le stockage alloué ne peut qu'augmenter ; une demande de réduction est refusée."
    b:
      en: "Turning off storage autoscaling only stops future increases; it does not release storage that is already allocated."
      fr: "Désactiver la mise à l'échelle automatique du stockage empêche seulement les augmentations futures ; cela ne libère pas le stockage déjà alloué."
    c:
      en: "gp3, like gp2, is billed on allocated storage, so changing the type does not remove the unused 3,400 GiB from the bill."
      fr: "gp3, comme gp2, est facturé sur le stockage alloué : changer de type ne retire pas de la facture les 3 400 Gio inutilisés."
references:
  - title: Managing capacity automatically with Amazon RDS storage autoscaling
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.Autoscaling.html
  - title: Increasing DB instance storage capacity
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.ModifyingExisting.html
