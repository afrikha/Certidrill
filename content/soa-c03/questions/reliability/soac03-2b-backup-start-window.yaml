id: soac03-2b-backup-start-window
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Backup rule backs up 300 Amazon EFS file systems every day at 01:00 UTC. The backup window of the rule is set to start within 1 hour and to complete within 7 days. Every morning, the console shows several backup jobs with the status EXPIRED, and no recovery point is created for those file systems that day. The jobs that start always complete successfully.

    Which change will MOST likely prevent the expired jobs?
  fr: |
    Une règle AWS Backup sauvegarde 300 systèmes de fichiers Amazon EFS chaque jour à 01 h 00 UTC. La fenêtre de sauvegarde de la règle est définie pour démarrer dans un délai de 1 heure et se terminer dans un délai de 7 jours. Chaque matin, la console affiche plusieurs tâches de sauvegarde à l'état EXPIRED, et aucun point de récupération n'est créé ce jour-là pour ces systèmes de fichiers. Les tâches qui démarrent se terminent toujours avec succès.

    Quelle modification permet le PLUS probablement d'éviter les tâches expirées ?
body:
  options:
    - { id: a, text: { en: "Increase the completion window of the rule from 7 days to 14 days.", fr: "Porter la fenêtre d'achèvement de la règle de 7 à 14 jours." } }
    - { id: b, text: { en: "Increase the retention period of the recovery points created by the rule.", fr: "Augmenter la période de rétention des points de récupération créés par la règle." } }
    - { id: c, text: { en: "Increase the start window of the rule, for example to the default of 8 hours.", fr: "Augmenter la fenêtre de démarrage de la règle, par exemple jusqu'à la valeur par défaut de 8 heures." } }
    - { id: d, text: { en: "Turn on continuous backups in the rule for the EFS file systems.", fr: "Activer les sauvegardes continues dans la règle pour les systèmes de fichiers EFS." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A backup job stays in the CREATED state until it starts; AWS Backup retries retryable errors at least every 10 minutes until the job runs or until the start window ends, when the job becomes EXPIRED. A 1-hour start window gives the 300 jobs little time to begin, whereas the default start window is 8 hours.
    fr: |
      Une tâche de sauvegarde reste à l'état CREATED jusqu'à son démarrage ; AWS Backup relance les erreurs pouvant être retentées au moins toutes les 10 minutes jusqu'à l'exécution de la tâche ou jusqu'à la fin de la fenêtre de démarrage, où la tâche passe à l'état EXPIRED. Une fenêtre de démarrage de 1 heure laisse peu de temps aux 300 tâches pour commencer, alors que la fenêtre de démarrage par défaut est de 8 heures.
  options:
    a: { en: "The completion window applies to jobs that have started; the expired jobs never started, and the started jobs already complete.", fr: "La fenêtre d'achèvement s'applique aux tâches démarrées ; les tâches expirées n'ont jamais démarré, et les tâches démarrées se terminent déjà." }
    b: { en: "Retention controls how long recovery points are kept, not whether a job manages to start.", fr: "La rétention détermine la durée de conservation des points de récupération, pas la capacité d'une tâche à démarrer." }
    d: { en: "AWS Backup supports continuous backups only for Amazon S3, Amazon RDS, Aurora and SAP HANA on Amazon EC2, not for Amazon EFS.", fr: "AWS Backup ne prend en charge les sauvegardes continues que pour Amazon S3, Amazon RDS, Aurora et SAP HANA sur Amazon EC2, pas pour Amazon EFS." }
references:
  - title: Backup plan options and configuration
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/plan-options-and-configuration.html
