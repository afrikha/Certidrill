id: soac03-2b-regional-nat-gateway
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A VPC has private subnets in three Availability Zones. Every private subnet routes 0.0.0.0/0 to a single zonal NAT gateway in a public subnet in the first Availability Zone, so an outage of that zone would stop outbound internet access everywhere. The company will add subnets in a fourth Availability Zone next quarter. The workloads need only outbound access to the public internet. The company wants outbound access to survive the loss of an Availability Zone with the LEAST ongoing effort to manage NAT gateways and routes.

    Which solution will meet these requirements?
  fr: |
    Un VPC comporte des sous-réseaux privés dans trois zones de disponibilité. Chaque sous-réseau privé route 0.0.0.0/0 vers une seule passerelle NAT zonale située dans un sous-réseau public de la première zone : une panne de cette zone couperait l'accès sortant à Internet partout. L'entreprise ajoutera des sous-réseaux dans une quatrième zone de disponibilité au prochain trimestre. Les charges de travail ont uniquement besoin d'un accès sortant à Internet. L'entreprise veut que l'accès sortant résiste à la perte d'une zone de disponibilité avec le MOINS d'effort continu de gestion des passerelles NAT et des itinéraires.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a regional NAT gateway in automatic mode and route 0.0.0.0/0 from all private subnets to it.", fr: "Créer une passerelle NAT régionale en mode automatique et router 0.0.0.0/0 de tous les sous-réseaux privés vers elle." } }
    - { id: b, text: { en: "Create a zonal NAT gateway in a public subnet of each Availability Zone, with one route table per zone that targets the local NAT gateway.", fr: "Créer une passerelle NAT zonale dans un sous-réseau public de chaque zone, avec une table de routage par zone qui cible la passerelle NAT locale." } }
    - { id: c, text: { en: "Create a second zonal NAT gateway in another zone and add a second 0.0.0.0/0 route to it in each private route table.", fr: "Créer une seconde passerelle NAT zonale dans une autre zone et ajouter une seconde route 0.0.0.0/0 vers elle dans chaque table de routage privée." } }
    - { id: d, text: { en: "Replace the NAT gateway with an egress-only internet gateway and route 0.0.0.0/0 from all private subnets to it.", fr: "Remplacer la passerelle NAT par une passerelle Internet de sortie uniquement et router 0.0.0.0/0 de tous les sous-réseaux privés vers elle." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A regional NAT gateway expands automatically to the Availability Zones where the VPC has network interfaces and contracts from zones without workloads. It needs no public subnet, and a single NAT gateway ID serves every zone, so one route entry covers all private subnets, including those of the fourth zone. Regional NAT gateways do not support private NAT, which these workloads do not need.
    fr: |
      Une passerelle NAT régionale s'étend automatiquement aux zones de disponibilité où le VPC possède des interfaces réseau et se retire des zones sans charge de travail. Elle n'exige aucun sous-réseau public, et un seul ID de passerelle NAT sert toutes les zones : une seule entrée de route couvre tous les sous-réseaux privés, y compris ceux de la quatrième zone. Les passerelles NAT régionales ne prennent pas en charge le NAT privé, dont ces charges de travail n'ont pas besoin.
  options:
    b: { en: "One zonal NAT gateway per zone is resilient, but each new zone needs another public subnet, NAT gateway and route table, which is more ongoing effort.", fr: "Une passerelle NAT zonale par zone est résiliente, mais chaque nouvelle zone exige un sous-réseau public, une passerelle NAT et une table de routage de plus, soit davantage d'effort continu." }
    c: { en: "A route table cannot contain two routes with the same destination, so a second default route cannot be added.", fr: "Une table de routage ne peut pas contenir deux routes ayant la même destination : une seconde route par défaut ne peut pas être ajoutée." }
    d: { en: "An egress-only internet gateway handles outbound IPv6 traffic only; it does not translate IPv4 traffic.", fr: "Une passerelle Internet de sortie uniquement ne traite que le trafic IPv6 sortant ; elle ne traduit pas le trafic IPv4." }
references:
  - title: Regional NAT gateways for automatic multi-AZ expansion
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html
  - title: NAT gateway basics
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html
