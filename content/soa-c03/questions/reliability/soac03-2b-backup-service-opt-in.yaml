id: soac03-2b-backup-service-opt-in
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company created an AWS Backup plan whose resource assignment includes all supported resource types in the account. Daily recovery points of the company's Amazon EBS volumes and Amazon RDS DB instances appear in the backup vault. However, AWS Backup never creates a backup job for the company's Amazon FSx for Windows File Server file systems in the same Region.

    Which action will resolve the issue?
  fr: |
    Une entreprise a créé un plan AWS Backup dont l'attribution de ressources inclut tous les types de ressources pris en charge du compte. Les points de récupération quotidiens des volumes Amazon EBS et des instances de base de données Amazon RDS de l'entreprise apparaissent dans le coffre de sauvegarde. En revanche, AWS Backup ne crée jamais de tâche de sauvegarde pour les systèmes de fichiers Amazon FSx for Windows File Server de l'entreprise dans la même Région.

    Quelle action permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Turn on daily automatic backups in the settings of each FSx file system.", fr: "Activer les sauvegardes automatiques quotidiennes dans les paramètres de chaque système de fichiers FSx." } }
    - { id: b, text: { en: "Increase the completion window of the backup rule to 14 days.", fr: "Porter la fenêtre d'achèvement de la règle de sauvegarde à 14 jours." } }
    - { id: c, text: { en: "Opt in to Amazon FSx in the Service opt-in settings of AWS Backup for the Region.", fr: "Activer Amazon FSx dans les paramètres d'adhésion aux services (Service opt-in) d'AWS Backup pour la Région." } }
    - { id: d, text: { en: "Add an access policy to the backup vault that allows the Amazon FSx service to write to it.", fr: "Ajouter au coffre de sauvegarde une politique d'accès qui autorise le service Amazon FSx à y écrire." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A backup plan includes a service only after you opt in to that service in the AWS Backup settings of the Region (Service opt-in, or `aws backup update-region-settings`). The opt-in settings apply even when resources are assigned by type, by tag or with all resources, so the FSx file systems are skipped until Amazon FSx is turned on there.
    fr: |
      Un plan de sauvegarde n'inclut un service qu'après l'activation de ce service dans les paramètres AWS Backup de la Région (Service opt-in, ou `aws backup update-region-settings`). Ces paramètres s'appliquent même lorsque les ressources sont attribuées par type, par balise ou en incluant toutes les ressources : les systèmes de fichiers FSx sont ignorés tant qu'Amazon FSx n'y est pas activé.
  options:
    a: { en: "FSx automatic backups are a separate feature; they do not make the AWS Backup plan include the file systems.", fr: "Les sauvegardes automatiques FSx sont une fonctionnalité distincte ; elles ne font pas inclure les systèmes de fichiers dans le plan AWS Backup." }
    b: { en: "No job is created at all, so the time allowed for a job to complete is not the cause.", fr: "Aucune tâche n'est créée : la durée accordée à une tâche pour se terminer n'est pas en cause." }
    d: { en: "AWS Backup writes recovery points to the vault itself; a missing vault permission would make jobs fail, not prevent their creation.", fr: "AWS Backup écrit lui-même les points de récupération dans le coffre ; une autorisation manquante sur le coffre ferait échouer les tâches, sans empêcher leur création." }
references:
  - title: Select AWS services to backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/assigning-resources.html
