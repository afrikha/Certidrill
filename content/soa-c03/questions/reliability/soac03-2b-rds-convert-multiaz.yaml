id: soac03-2b-rds-convert-multiaz
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an internal application on a Single-AZ Amazon RDS for MariaDB DB instance. The company wants the database to fail over automatically to another Availability Zone if its current Availability Zone becomes unavailable. The database must stay available during the change, and the application must keep using the same endpoint.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application interne sur une instance de base de données Amazon RDS for MariaDB mono-AZ. L'entreprise veut que la base de données bascule automatiquement vers une autre zone de disponibilité si sa zone actuelle devient indisponible. La base de données doit rester disponible pendant la modification, et l'application doit continuer d'utiliser le même point de terminaison.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a read replica in another Availability Zone and point the application to it when the primary fails.", fr: "Créer un réplica en lecture dans une autre zone de disponibilité et y diriger l'application en cas de panne du primaire." } }
    - { id: b, text: { en: "Take a DB snapshot, restore it to a new Multi-AZ DB instance, and update the application endpoint.", fr: "Prendre un instantané de base de données, le restaurer dans une nouvelle instance Multi-AZ et mettre à jour le point de terminaison de l'application." } }
    - { id: c, text: { en: "Create an RDS Proxy for the DB instance that uses subnets in two Availability Zones.", fr: "Créer un RDS Proxy pour l'instance de base de données qui utilise des sous-réseaux dans deux zones de disponibilité." } }
    - { id: d, text: { en: "Modify the DB instance to convert it to a Multi-AZ deployment.", fr: "Modifier l'instance de base de données pour la convertir en déploiement Multi-AZ." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Modifying the DB instance to Multi-AZ makes Amazon RDS snapshot the primary's volumes, create a standby in another Availability Zone from that snapshot, and start synchronous replication. The conversion involves minimal downtime (with a possible performance impact while the volumes initialize) and keeps the same endpoint, which fails over automatically to the standby.
    fr: |
      Modifier l'instance pour la passer en Multi-AZ amène Amazon RDS à prendre un instantané des volumes du primaire, à créer à partir de celui-ci une instance de secours dans une autre zone de disponibilité, puis à activer la réplication synchrone. La conversion implique un temps d'arrêt minimal (avec un impact possible sur les performances pendant l'initialisation des volumes) et conserve le même point de terminaison, qui bascule automatiquement vers l'instance de secours.
  options:
    a: { en: "A read replica uses its own endpoint and requires a manual promotion and an application change, so the failover is not automatic.", fr: "Un réplica en lecture a son propre point de terminaison et exige une promotion manuelle et une modification de l'application : le basculement n'est pas automatique." }
    b: { en: "Restoring a snapshot creates a new DB instance with a new endpoint, and writes made after the snapshot are lost unless the application stops.", fr: "Restaurer un instantané crée une nouvelle instance avec un nouveau point de terminaison, et les écritures postérieures à l'instantané sont perdues sauf si l'application s'arrête." }
    c: { en: "RDS Proxy pools connections, but it has no standby DB instance to fail over to when the Availability Zone of the database fails.", fr: "RDS Proxy mutualise les connexions, mais il ne dispose d'aucune instance de secours vers laquelle basculer en cas de panne de la zone de la base de données." }
references:
  - title: Converting a DB instance to a Multi-AZ deployment for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.Migrating.html
