id: soac03-2b-alb-fail-open
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in two Availability Zones behind an Application Load Balancer. A faulty deployment made the health check endpoint return HTTP 500 on every instance, and all targets of the target group became unhealthy at the same time. The monitoring team noticed that the load balancer kept forwarding client requests to the instances instead of returning errors directly.

    Which statement explains this behavior?
  fr: |
    Une entreprise exécute une application sur des instances Amazon EC2 dans deux zones de disponibilité derrière un Application Load Balancer. Un déploiement défectueux a fait renvoyer HTTP 500 au point de terminaison de vérification de l'état sur chaque instance, et toutes les cibles du groupe cible sont devenues défaillantes en même temps. L'équipe de supervision a remarqué que l'équilibreur de charge continuait de transférer les requêtes des clients aux instances au lieu de renvoyer directement des erreurs.

    Quelle affirmation explique ce comportement ?
body:
  options:
    - { id: a, text: { en: "The load balancer keeps sending requests to unhealthy targets until the deregistration delay of the target group expires.", fr: "L'équilibreur de charge continue d'envoyer des requêtes aux cibles défaillantes jusqu'à l'expiration du délai d'annulation de l'enregistrement du groupe cible." } }
    - { id: b, text: { en: "The load balancer sends requests to unhealthy targets only while slow start mode is enabled on the target group.", fr: "L'équilibreur de charge n'envoie des requêtes aux cibles défaillantes que lorsque le mode de démarrage lent est activé sur le groupe cible." } }
    - { id: c, text: { en: "The load balancer sends requests to unhealthy targets only when cross-zone load balancing is turned off for the target group.", fr: "L'équilibreur de charge n'envoie des requêtes aux cibles défaillantes que lorsque l'équilibrage de charge entre zones est désactivé pour le groupe cible." } }
    - { id: d, text: { en: "When every registered target of a target group is unhealthy, the load balancer fails open and routes requests to all targets.", fr: "Lorsque toutes les cibles enregistrées d'un groupe cible sont défaillantes, l'équilibreur de charge passe en mode fail-open et route les requêtes vers toutes les cibles." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      If a target group contains only unhealthy registered targets, the load balancer routes requests to all of them regardless of their health status: it fails open. Routing to every target in every enabled Availability Zone is preferred to dropping all traffic when health checks fail everywhere at once, for example because of a faulty health check endpoint.
    fr: |
      Si un groupe cible ne contient que des cibles enregistrées défaillantes, l'équilibreur de charge route les requêtes vers toutes ces cibles quel que soit leur état : il passe en mode fail-open. Router vers toutes les cibles de toutes les zones de disponibilité activées est préféré au rejet de tout le trafic lorsque les vérifications échouent partout en même temps, par exemple à cause d'un point de terminaison de vérification défectueux.
  options:
    a: { en: "The deregistration delay applies to targets that are being deregistered; unhealthy targets remain registered and are not draining.", fr: "Le délai d'annulation de l'enregistrement s'applique aux cibles en cours de désenregistrement ; les cibles défaillantes restent enregistrées et ne sont pas en vidange." }
    b: { en: "Slow start gradually increases the share of requests that a newly healthy target receives; it does not send traffic to unhealthy targets.", fr: "Le démarrage lent augmente progressivement la part de requêtes d'une cible redevenue saine ; il n'envoie pas de trafic aux cibles défaillantes." }
    c: { en: "Fail-open does not depend on cross-zone load balancing; it happens when all targets fail health checks in all enabled Availability Zones.", fr: "Le mode fail-open ne dépend pas de l'équilibrage de charge entre zones ; il se produit quand toutes les cibles échouent aux vérifications dans toutes les zones activées." }
references:
  - title: Health checks for Application Load Balancer target groups
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
