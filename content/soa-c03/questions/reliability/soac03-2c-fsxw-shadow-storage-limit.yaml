id: soac03-2c-fsxw-shadow-storage-limit
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon FSx for Windows File Server file system was created with 1 TiB of SSD storage, and shadow copies were configured with the default storage and schedule. Last month, an operator increased the storage capacity to 4 TiB because users now modify many large files every day. Users now report that Previous Versions shows only the last 2 or 3 days, although the company requires 1 week of previous versions. The file system has enough free space and throughput capacity.

    Which solution will meet the requirement?
  fr: |
    Un système de fichiers Amazon FSx for Windows File Server a été créé avec 1 Tio de stockage SSD, et les clichés instantanés (shadow copies) ont été configurés avec le stockage et la planification par défaut. Le mois dernier, un opérateur a porté la capacité de stockage à 4 Tio, car les utilisateurs modifient désormais chaque jour de nombreux fichiers volumineux. Les utilisateurs signalent maintenant que Versions précédentes n'affiche que les 2 ou 3 derniers jours, alors que l'entreprise exige 1 semaine de versions précédentes. Le système de fichiers dispose de suffisamment d'espace libre et de capacité de débit.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Increase the automatic daily backup retention period of the file system to 7 days.", fr: "Porter à 7 jours la période de rétention des sauvegardes quotidiennes automatiques du système de fichiers." } }
    - { id: b, text: { en: "Change the shadow copy schedule to take a shadow copy every hour.", fr: "Modifier la planification des clichés instantanés pour en prendre un toutes les heures." } }
    - { id: c, text: { en: "Increase the storage capacity of the file system again so that the shadow copy storage grows with it.", fr: "Augmenter de nouveau la capacité de stockage du système de fichiers pour que le stockage des clichés instantanés augmente avec elle." } }
    - { id: d, text: { en: "Raise the maximum shadow copy storage with `Set-FsxShadowStorage` through the remote PowerShell endpoint.", fr: "Augmenter le stockage maximal des clichés instantanés avec `Set-FsxShadowStorage` via le point de terminaison PowerShell distant." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The default shadow copy storage is 10% of the storage capacity at the time it is set, and it is not increased when the file system grows. When that limit is reached, Windows deletes the oldest shadow copies to make room for new ones, which explains the short history. Raising the maximum with `Set-FsxShadowStorage` keeps more shadow copies.
    fr: |
      Le stockage par défaut des clichés instantanés représente 10 % de la capacité de stockage au moment où il est défini, et il n'augmente pas lorsque le système de fichiers grandit. Lorsque cette limite est atteinte, Windows supprime les clichés instantanés les plus anciens pour faire place aux nouveaux, ce qui explique l'historique court. Augmenter le maximum avec `Set-FsxShadowStorage` conserve davantage de clichés instantanés.
  options:
    a: { en: "Automatic backups are restored to a new file system; they do not appear in Previous Versions.", fr: "Les sauvegardes automatiques se restaurent dans un nouveau système de fichiers ; elles n'apparaissent pas dans Versions précédentes." }
    b: { en: "More frequent shadow copies consume the same limited storage faster, so the oldest copies are deleted even sooner.", fr: "Des clichés instantanés plus fréquents consomment plus vite le même stockage limité : les copies les plus anciennes sont supprimées encore plus tôt." }
    c: { en: "Increasing the storage capacity does not increase the shadow copy storage that is already allocated, as the last increase showed.", fr: "Augmenter la capacité de stockage n'augmente pas le stockage déjà alloué aux clichés instantanés, comme l'a montré la dernière augmentation." }
references:
  - title: Configuring shadow copies to use the default storage and schedule
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/setting-up-fsx-shadow-copies.html
  - title: Protecting your data with shadow copies - Amazon FSx for Windows File Server
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/shadow-copies-fsxW.html
