id: soac03-2a-ec-autoscaling-shards
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon ElastiCache for Redis OSS 7.1 cluster with cluster mode enabled on cache.r7g.large nodes. The workload is write-heavy, and write traffic rises sharply on weekdays at times that change from week to week. The company wants the cluster to add capacity automatically when the primary nodes are busy and to remove it when the load drops, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster Amazon ElastiCache for Redis OSS 7.1 avec le mode cluster activé sur des nœuds cache.r7g.large. La charge de travail est dominée par les écritures, et le trafic d'écriture augmente fortement en semaine à des heures qui changent d'une semaine à l'autre. L'entreprise veut que le cluster ajoute automatiquement de la capacité quand les nœuds primaires sont occupés et la retire quand la charge baisse, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure ElastiCache Auto Scaling for shards with a target tracking policy on the ElastiCachePrimaryEngineCPUUtilization metric.", fr: "Configurer ElastiCache Auto Scaling pour les partitions avec une politique de suivi de cible sur la métrique ElastiCachePrimaryEngineCPUUtilization." } }
    - { id: b, text: { en: "Configure ElastiCache Auto Scaling for replicas with a target tracking policy on the ElastiCacheReplicaEngineCPUUtilization metric.", fr: "Configurer ElastiCache Auto Scaling pour les réplicas avec une politique de suivi de cible sur la métrique ElastiCacheReplicaEngineCPUUtilization." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on EngineCPUUtilization that invokes an AWS Lambda function to change the node type of the cluster.", fr: "Créer une alarme CloudWatch sur EngineCPUUtilization qui invoque une fonction AWS Lambda chargée de changer le type de nœud du cluster." } }
    - { id: d, text: { en: "Create scheduled scaling actions that add shards at 08:00 and remove them at 18:00 every weekday.", fr: "Créer des actions de mise à l'échelle planifiées qui ajoutent des partitions à 08:00 et les retirent à 18:00 chaque jour de la semaine." } }
answer: { optionId: a }
explanation:
  correct:
    en: "ElastiCache Auto Scaling works with Valkey 7.2 or later and Redis OSS 6.0 or later clusters that have cluster mode enabled, on supported node types such as R7g large nodes. It uses Application Auto Scaling, and a target tracking policy on the shard dimension with ElastiCachePrimaryEngineCPUUtilization adds or removes shards as the write load on the primaries changes."
    fr: "ElastiCache Auto Scaling fonctionne avec les clusters Valkey 7.2 ou version ultérieure et Redis OSS 6.0 ou version ultérieure dont le mode cluster est activé, sur des types de nœuds pris en charge comme les nœuds R7g de taille large. Il utilise Application Auto Scaling, et une politique de suivi de cible sur la dimension des partitions avec ElastiCachePrimaryEngineCPUUtilization ajoute ou retire des partitions selon la charge d'écriture des primaires."
  options:
    b:
      en: "Replicas add read capacity only; writes still go to the same primary nodes, so busy primaries stay busy."
      fr: "Les réplicas n'ajoutent que de la capacité de lecture ; les écritures vont toujours aux mêmes nœuds primaires, qui restent occupés."
    c:
      en: "A custom alarm and function to change node types must be built and maintained, and changing node types on every peak is slow and disruptive compared with built-in auto scaling."
      fr: "Une alarme et une fonction personnalisées pour changer de type de nœud doivent être construites et maintenues, et changer de type de nœud à chaque pointe est lent et perturbant par rapport à la mise à l'échelle automatique intégrée."
    d:
      en: "The peaks happen at times that change, so a fixed schedule misses some of them and keeps extra shards when they are not needed."
      fr: "Les pointes surviennent à des heures variables : un calendrier fixe en manque certaines et garde des partitions supplémentaires quand elles ne servent pas."
references:
  - title: Auto Scaling Valkey and Redis OSS clusters
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoScaling.html
