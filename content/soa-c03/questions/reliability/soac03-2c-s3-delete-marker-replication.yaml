id: soac03-2c-s3-delete-marker-replication
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company replicates a versioning-enabled Amazon S3 bucket in us-east-1 to a bucket in us-west-2 with a replication rule filtered on the `catalog/` prefix. When users delete an object in the source bucket, the object is still returned by the destination bucket. The company wants user deletions in the source bucket to also hide the objects in the destination bucket.

    Which solution will meet this requirement?
  fr: |
    Une entreprise réplique un compartiment Amazon S3 de us-east-1, dont la gestion des versions est activée, vers un compartiment de us-west-2 avec une règle de réplication filtrée sur le préfixe `catalog/`. Lorsque des utilisateurs suppriment un objet dans le compartiment source, l'objet est toujours renvoyé par le compartiment de destination. L'entreprise veut que les suppressions des utilisateurs dans le compartiment source masquent aussi les objets dans le compartiment de destination.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Turn on S3 Replication Time Control for the replication rule.", fr: "Activer S3 Replication Time Control pour la règle de réplication." } }
    - { id: b, text: { en: "Turn on delete marker replication for the replication rule.", fr: "Activer la réplication des marqueurs de suppression pour la règle de réplication." } }
    - { id: c, text: { en: "Run an S3 Batch Replication job every night on the source bucket.", fr: "Exécuter chaque nuit une tâche S3 Batch Replication sur le compartiment source." } }
    - { id: d, text: { en: "Suspend versioning on the destination bucket so that it accepts deletions.", fr: "Suspendre la gestion des versions sur le compartiment de destination pour qu'il accepte les suppressions." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      By default, with the current replication configuration, a delete without a version ID adds a delete marker only in the source bucket, which protects the destination from accidental or malicious deletions. Turning on delete marker replication for the prefix-based rule copies the delete markers, so the object appears deleted in both buckets.
    fr: |
      Par défaut, avec la configuration de réplication actuelle, une suppression sans ID de version ajoute un marqueur de suppression uniquement dans le compartiment source, ce qui protège la destination contre les suppressions accidentelles ou malveillantes. Activer la réplication des marqueurs de suppression pour la règle fondée sur un préfixe copie les marqueurs de suppression : l'objet apparaît supprimé dans les deux compartiments.
  options:
    a: { en: "S3 RTC sets a 15-minute replication time objective for objects; it does not make delete markers replicate.", fr: "S3 RTC fixe un objectif de temps de réplication de 15 minutes pour les objets ; il ne fait pas répliquer les marqueurs de suppression." }
    c: { en: "Batch Replication replicates existing objects; it does not change how the rule handles delete markers.", fr: "Batch Replication réplique des objets existants ; il ne change pas la façon dont la règle traite les marqueurs de suppression." }
    d: { en: "Replication requires versioning on both buckets, and suspending it on the destination breaks replication.", fr: "La réplication exige la gestion des versions sur les deux compartiments, et la suspendre sur la destination casse la réplication." }
references:
  - title: Replicating delete markers between buckets - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/delete-marker-replication.html
