id: soac03-2b-ecs-spread-binpack
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon ECS service that uses the EC2 launch type. The container instances belong to an Auto Scaling group that spans three Availability Zones. To reduce costs, an engineer set the task placement strategy of the service to binpack on memory only. Most tasks now run on container instances in the same Availability Zone, and the service lost most of its capacity during an impairment of that zone. The company wants the tasks spread across the zones while still packing tasks onto as few instances as possible within each zone.

    Which placement configuration will meet these requirements?
  fr: |
    Une entreprise exécute un service Amazon ECS qui utilise le type de lancement EC2. Les instances de conteneur appartiennent à un groupe Auto Scaling réparti sur trois zones de disponibilité. Pour réduire les coûts, un ingénieur a défini la stratégie de placement des tâches du service sur binpack sur la mémoire uniquement. La plupart des tâches s'exécutent désormais sur des instances de conteneur de la même zone, et le service a perdu l'essentiel de sa capacité lors d'une dégradation de cette zone. L'entreprise veut répartir les tâches entre les zones tout en regroupant les tâches sur le moins d'instances possible dans chaque zone.

    Quelle configuration de placement permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A spread strategy on attribute:ecs.availability-zone, followed by a binpack strategy on memory.", fr: "Une stratégie spread sur attribute:ecs.availability-zone, suivie d'une stratégie binpack sur la mémoire." } }
    - { id: b, text: { en: "A random placement strategy, with no other strategy or constraint.", fr: "Une stratégie de placement random, sans autre stratégie ni contrainte." } }
    - { id: c, text: { en: "A binpack strategy on memory, followed by a distinctInstance placement constraint.", fr: "Une stratégie binpack sur la mémoire, suivie d'une contrainte de placement distinctInstance." } }
    - { id: d, text: { en: "A spread strategy on instanceId, followed by a binpack strategy on CPU.", fr: "Une stratégie spread sur instanceId, suivie d'une stratégie binpack sur le processeur." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Placement strategies are applied in order. Spreading first on `attribute:ecs.availability-zone` places tasks evenly across the zones, and binpack on memory then fills the fewest instances within each zone. Spread on the Availability Zone attribute is also the default strategy for ECS services, which the engineer had replaced.
    fr: |
      Les stratégies de placement s'appliquent dans l'ordre. Répartir d'abord sur `attribute:ecs.availability-zone` place les tâches uniformément entre les zones, puis binpack sur la mémoire remplit le moins d'instances possible dans chaque zone. La répartition sur l'attribut de zone de disponibilité est d'ailleurs la stratégie par défaut des services ECS, que l'ingénieur avait remplacée.
  options:
    b: { en: "Random placement guarantees neither an even spread across zones nor dense packing on few instances.", fr: "Le placement random ne garantit ni une répartition uniforme entre zones ni un regroupement dense sur peu d'instances." }
    c: { en: "distinctInstance places each task on a different instance, which defeats packing and does not balance zones.", fr: "distinctInstance place chaque tâche sur une instance différente, ce qui annule le regroupement et n'équilibre pas les zones." }
    d: { en: "Spreading on instanceId distributes tasks across all instances, which uses as many instances as possible instead of few.", fr: "Répartir sur instanceId distribue les tâches sur toutes les instances, ce qui en utilise le plus possible au lieu de peu." }
references:
  - title: Use strategies to define Amazon ECS task placement
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-placement-strategies.html
