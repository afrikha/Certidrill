id: soac03-2a-aurora-sv2-capacity-metrics
objective: "2.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An Amazon Aurora Serverless v2 DB cluster has a writer with a capacity range of 0.5 to 16 ACUs. Users report slow queries at peak times. Before raising the maximum capacity, an operations engineer wants to confirm in Amazon CloudWatch that the writer reaches the top of its configured capacity range.

    Which two metrics should the engineer review? (Choose two.)
  fr: |
    Un cluster de bases de données Amazon Aurora Serverless v2 possède une instance d'écriture dont la plage de capacité va de 0,5 à 16 ACU. Les utilisateurs signalent des requêtes lentes en période de pointe. Avant de relever la capacité maximale, un ingénieur des opérations veut vérifier dans Amazon CloudWatch que l'instance d'écriture atteint le haut de sa plage de capacité configurée.

    Quelles sont les deux métriques que l'ingénieur doit examiner ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "CPUCreditBalance", fr: "CPUCreditBalance" } }
    - { id: b, text: { en: "ServerlessDatabaseCapacity", fr: "ServerlessDatabaseCapacity" } }
    - { id: c, text: { en: "AuroraReplicaLag", fr: "AuroraReplicaLag" } }
    - { id: d, text: { en: "ACUUtilization", fr: "ACUUtilization" } }
    - { id: e, text: { en: "FreeLocalStorage", fr: "FreeLocalStorage" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "ServerlessDatabaseCapacity shows the current capacity of the writer in ACUs, and ACUUtilization shows that capacity as a percentage of the configured maximum. If the writer often sits at 16 ACUs and near 100% ACUUtilization, raising the maximum capacity lets Aurora scale further."
    fr: "ServerlessDatabaseCapacity indique la capacité actuelle de l'instance d'écriture en ACU, et ACUUtilization exprime cette capacité en pourcentage du maximum configuré. Si l'instance reste souvent à 16 ACU et près de 100 % d'ACUUtilization, relever la capacité maximale permet à Aurora d'aller plus loin."
  options:
    a:
      en: "CPU credits apply to burstable DB instance classes, not to Aurora Serverless v2 capacity."
      fr: "Les crédits de processeur s'appliquent aux classes d'instances à performances extensibles, pas à la capacité d'Aurora Serverless v2."
    c:
      en: "Replica lag measures how far readers are behind the writer; it says nothing about the writer's capacity."
      fr: "Le retard des réplicas mesure le décalage des lecteurs par rapport à l'instance d'écriture ; il n'indique rien sur la capacité de l'instance d'écriture."
    e:
      en: "Local storage for temporary data is not the capacity that Aurora Serverless v2 scales in ACUs."
      fr: "Le stockage local des données temporaires n'est pas la capacité qu'Aurora Serverless v2 ajuste en ACU."
references:
  - title: How Aurora serverless works
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html
