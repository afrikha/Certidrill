id: soac03-2c-dr-corruption-not-replication
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an active/active application in us-east-1 and eu-west-1. It stores data in an Amazon DynamoDB global table and in an Amazon S3 bucket that is replicated to the other Region with S3 Cross-Region Replication. Last week, a faulty batch job overwrote thousands of items and objects, and the bad data was replicated to both Regions within seconds. The company must be able to restore the data as it was before such a job in the future.

    Which combination of actions will meet this requirement? (Choose two.)
  fr: |
    Une entreprise exécute une application active/active dans us-east-1 et eu-west-1. Elle stocke des données dans une table globale Amazon DynamoDB et dans un compartiment Amazon S3 répliqué vers l'autre Région avec S3 Cross-Region Replication. La semaine dernière, une tâche par lots défectueuse a écrasé des milliers d'éléments et d'objets, et les mauvaises données ont été répliquées dans les deux Régions en quelques secondes. L'entreprise doit pouvoir, à l'avenir, restaurer les données telles qu'elles étaient avant une telle tâche.

    Quelle combinaison d'actions permet de répondre à cette exigence ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a replica of the global table in a third Region to keep another copy of the data.", fr: "Ajouter un réplica de la table globale dans une troisième Région pour conserver une autre copie des données." } }
    - { id: b, text: { en: "Turn on point-in-time recovery for the replicas of the global table.", fr: "Activer la PITR pour les réplicas de la table globale." } }
    - { id: c, text: { en: "Restore overwritten S3 objects from the previous versions that S3 Versioning keeps.", fr: "Restaurer les objets S3 écrasés à partir des versions précédentes que S3 Versioning conserve." } }
    - { id: d, text: { en: "Turn on S3 Replication Time Control for the replication rule.", fr: "Activer S3 Replication Time Control pour la règle de réplication." } }
    - { id: e, text: { en: "Add Route 53 health checks that fail over users to the other Region when errors increase.", fr: "Ajouter des vérifications de l'état Route 53 qui basculent les utilisateurs vers l'autre Région lorsque les erreurs augmentent." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Replication protects against the loss of a Region but copies corruption and deletions as fast as valid writes, so data disasters need point-in-time backups and object versioning. DynamoDB point-in-time recovery restores a table to any second in its recovery period, and S3 Versioning, which replication requires on both buckets, keeps the previous version of every overwritten object.
    fr: |
      La réplication protège contre la perte d'une Région, mais copie la corruption et les suppressions aussi vite que les écritures valides : les sinistres de données exigent des sauvegardes à un instant donné et la gestion des versions des objets. La PITR de DynamoDB restaure une table à n'importe quelle seconde de sa période de récupération, et S3 Versioning, que la réplication exige sur les deux compartiments, conserve la version précédente de chaque objet écrasé.
  options:
    a: { en: "A third replica receives the same bad writes, so it adds Regional resilience but no way to go back in time.", fr: "Un troisième réplica reçoit les mêmes écritures erronées : il ajoute de la résilience régionale, mais aucun moyen de revenir dans le passé." }
    d: { en: "S3 RTC makes replication faster and predictable, which spreads bad data even more reliably.", fr: "S3 RTC rend la réplication plus rapide et prévisible, ce qui propage les mauvaises données de façon encore plus fiable." }
    e: { en: "Failing over to the other Region does not help because the bad data is already replicated there.", fr: "Basculer vers l'autre Région n'aide pas, car les mauvaises données y sont déjà répliquées." }
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  - title: Enable point-in-time recovery in DynamoDB - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery_Howitworks.html
