id: soac03-2b-rds-failover-events
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs several Amazon RDS Multi-AZ DB instance deployments in one AWS account. The on-call team wants to receive an email each time any of these DB instances fails over to its standby. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute plusieurs déploiements d'instance de base de données Multi-AZ Amazon RDS dans un même compte AWS. L'équipe d'astreinte veut recevoir un e-mail chaque fois que l'une de ces instances bascule vers son instance de secours. L'entreprise veut la solution présentant le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch alarm on the DatabaseConnections metric of each DB instance that triggers when the value drops to 0.", fr: "Créer sur chaque instance une alarme CloudWatch sur la métrique DatabaseConnections qui se déclenche quand la valeur tombe à 0." } }
    - { id: b, text: { en: "Create an RDS event subscription for DB instances with the failover category that sends to an Amazon SNS topic with an email subscription.", fr: "Créer un abonnement aux événements RDS pour les instances avec la catégorie failover, qui envoie vers une rubrique Amazon SNS dotée d'un abonnement par e-mail." } }
    - { id: c, text: { en: "Turn on Enhanced Monitoring for each DB instance and review the operating system process list after each incident.", fr: "Activer la surveillance améliorée sur chaque instance et consulter la liste des processus du système d'exploitation après chaque incident." } }
    - { id: d, text: { en: "Turn on Performance Insights for each DB instance and add its database load chart to a CloudWatch dashboard.", fr: "Activer Performance Insights sur chaque instance et ajouter son graphique de charge de base de données à un tableau de bord CloudWatch." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Amazon RDS publishes DB instance events in categories, including failover (for example, "Multi-AZ instance failover started" and "Multi-AZ instance failover completed"). An event subscription filtered on that category for DB instances sends the events to an Amazon SNS topic, which emails the on-call team without any per-instance alarm to maintain.
    fr: |
      Amazon RDS publie les événements des instances de base de données par catégorie, dont failover (par exemple « Multi-AZ instance failover started » et « Multi-AZ instance failover completed »). Un abonnement aux événements filtré sur cette catégorie pour les instances envoie ces événements vers une rubrique Amazon SNS, qui prévient l'équipe d'astreinte par e-mail sans alarme à maintenir pour chaque instance.
  options:
    a: { en: "Connections can drop to 0 for many reasons, and a brief failover may never bring the metric to 0; one alarm per instance is also more work.", fr: "Les connexions peuvent tomber à 0 pour de nombreuses raisons, et un bref basculement peut ne jamais amener la métrique à 0 ; une alarme par instance demande aussi plus de travail." }
    c: { en: "Enhanced Monitoring shows operating system metrics; reviewing them by hand does not send any notification.", fr: "La surveillance améliorée affiche des métriques du système d'exploitation ; les consulter manuellement n'envoie aucune notification." }
    d: { en: "Performance Insights analyzes database load; a dashboard does not notify anyone of a failover.", fr: "Performance Insights analyse la charge de la base de données ; un tableau de bord ne prévient personne d'un basculement." }
references:
  - title: Amazon RDS event categories and event messages
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Events.Messages.html
  - title: Failing over a Multi-AZ DB instance for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.Failover.html
