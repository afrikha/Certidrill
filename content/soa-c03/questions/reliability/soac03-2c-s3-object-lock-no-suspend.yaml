id: soac03-2c-s3-object-lock-no-suspend
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores audit exports in an Amazon S3 bucket that has S3 Object Lock enabled with a default retention of 1 year in governance mode. The export job overwrites the same keys every night, and the storage cost of noncurrent versions keeps growing. An administrator tries to suspend versioning on the bucket, and the request fails.

    Which solution will reduce the storage cost?
  fr: |
    Une entreprise stocke des exports d'audit dans un compartiment Amazon S3 où S3 Object Lock est activé avec une rétention par défaut de 1 an en mode gouvernance. La tâche d'export écrase les mêmes clés chaque nuit, et le coût de stockage des versions non actuelles ne cesse d'augmenter. Un administrateur tente de suspendre la gestion des versions sur le compartiment, et la demande échoue.

    Quelle solution permet de réduire le coût de stockage ?
body:
  options:
    - { id: a, text: { en: "Disable Object Lock on the bucket, and then suspend versioning to stop new versions.", fr: "Désactiver Object Lock sur le compartiment, puis suspendre la gestion des versions pour arrêter les nouvelles versions." } }
    - { id: b, text: { en: "Suspend versioning as the root user of the account, which is allowed to bypass the Object Lock settings.", fr: "Suspendre la gestion des versions en tant qu'utilisateur root du compte, qui est autorisé à contourner les paramètres Object Lock." } }
    - { id: c, text: { en: "Turn on MFA delete, and then suspend versioning with a valid MFA code from the root user.", fr: "Activer la suppression MFA, puis suspendre la gestion des versions avec un code MFA valide de l'utilisateur root." } }
    - { id: d, text: { en: "Keep versioning, and add a lifecycle rule that expires noncurrent versions after their retention ends.", fr: "Conserver la gestion des versions, et ajouter une règle de cycle de vie qui fait expirer les versions non actuelles à la fin de leur rétention." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      After Object Lock is enabled on a bucket, versioning can no longer be suspended and Object Lock cannot be disabled. The supported way to control the cost is a lifecycle rule with a `NoncurrentVersionExpiration` action, set so that noncurrent versions are deleted only after their 1-year retention has expired.
    fr: |
      Une fois Object Lock activé sur un compartiment, la gestion des versions ne peut plus être suspendue et Object Lock ne peut pas être désactivé. La méthode prise en charge pour maîtriser le coût est une règle de cycle de vie avec une action `NoncurrentVersionExpiration`, réglée pour que les versions non actuelles ne soient supprimées qu'après l'expiration de leur rétention de 1 an.
  options:
    a: { en: "Object Lock cannot be disabled after it has been enabled on a bucket.", fr: "Object Lock ne peut pas être désactivé après avoir été activé sur un compartiment." }
    b: { en: "No user, including the root user, can suspend versioning on a bucket that has Object Lock enabled.", fr: "Aucun utilisateur, y compris l'utilisateur root, ne peut suspendre la gestion des versions sur un compartiment où Object Lock est activé." }
    c: { en: "MFA delete protects version deletions and versioning changes, but it does not make suspension possible on an Object Lock bucket.", fr: "La suppression MFA protège les suppressions de versions et les changements de gestion des versions, mais ne rend pas la suspension possible sur un compartiment Object Lock." }
references:
  - title: Configuring S3 Object Lock - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-configure.html
