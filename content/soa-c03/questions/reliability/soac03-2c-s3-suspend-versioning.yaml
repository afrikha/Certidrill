id: soac03-2c-s3-suspend-versioning
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company turned on S3 Versioning for an Amazon S3 bucket that stores temporary build artifacts. The team now wants the bucket to stop creating new object versions. The existing object versions must stay available until the team reviews them, and the bucket name and its objects must not change.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a activé S3 Versioning pour un compartiment Amazon S3 qui stocke des artefacts de build temporaires. L'équipe veut maintenant que le compartiment cesse de créer de nouvelles versions d'objets. Les versions d'objets existantes doivent rester disponibles jusqu'à ce que l'équipe les examine, et le nom du compartiment ainsi que ses objets ne doivent pas changer.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the versioning state of the bucket back to Unversioned (Disabled).", fr: "Remettre l'état de gestion des versions du compartiment sur Non versionné (Disabled)." } }
    - { id: b, text: { en: "Suspend versioning on the bucket.", fr: "Suspendre la gestion des versions sur le compartiment." } }
    - { id: c, text: { en: "Add a lifecycle rule that expires noncurrent versions 1 day after they become noncurrent.", fr: "Ajouter une règle de cycle de vie qui fait expirer les versions non actuelles 1 jour après qu'elles le deviennent." } }
    - { id: d, text: { en: "Copy the objects to a new bucket without versioning, and delete the original bucket.", fr: "Copier les objets dans un nouveau compartiment sans gestion des versions, et supprimer le compartiment d'origine." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Once versioning has been enabled, a bucket can never return to the unversioned state, but versioning can be suspended. Suspending stops new versions from accruing and does not change the object versions that already exist, so the team can review them later.
    fr: |
      Une fois la gestion des versions activée, un compartiment ne peut jamais revenir à l'état non versionné, mais la gestion des versions peut être suspendue. La suspension empêche l'accumulation de nouvelles versions et ne modifie pas les versions d'objets existantes : l'équipe peut donc les examiner plus tard.
  options:
    a: { en: "A version-enabled bucket can never return to the unversioned state; only Enabled and Suspended can be set.", fr: "Un compartiment dont la gestion des versions a été activée ne peut jamais revenir à l'état non versionné ; seuls Enabled et Suspended peuvent être définis." }
    c: { en: "The rule permanently deletes the noncurrent versions that the team wants to review, and the bucket keeps creating versions.", fr: "La règle supprime définitivement les versions non actuelles que l'équipe veut examiner, et le compartiment continue de créer des versions." }
    d: { en: "A new bucket changes the bucket name, and deleting the original bucket loses the existing versions.", fr: "Un nouveau compartiment change le nom du compartiment, et la suppression du compartiment d'origine fait perdre les versions existantes." }
references:
  - title: Retaining multiple versions of objects with S3 Versioning - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html
