id: soac03-2c-s3-remove-delete-marker
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A user deleted the object `contracts/acme.pdf` from a versioning-enabled Amazon S3 bucket named `legal-docs`. An operator runs `aws s3api list-object-versions --bucket legal-docs --prefix contracts/acme.pdf` and gets the following output (abridged).

    ```json
    {
      "Versions": [
        { "Key": "contracts/acme.pdf", "VersionId": "3HL4kqtJlcpXroDTDmJ.rmSpXd3dIbrHY",
          "IsLatest": false, "LastModified": "2026-11-17T10:02:11.000Z", "Size": 482113 }
      ],
      "DeleteMarkers": [
        { "Key": "contracts/acme.pdf", "VersionId": "Mzhjb2xqQk9oN2dtbWp2b1F2dXdPRzZa",
          "IsLatest": true, "LastModified": "2026-11-19T16:45:03.000Z" }
      ]
    }
    ```

    The object must be available again with its version `3HL4kqtJlcpXroDTDmJ.rmSpXd3dIbrHY` as the current version, and no new object version may be created.

    Which command should the operator run?
  fr: |
    Un utilisateur a supprimé l'objet `contracts/acme.pdf` d'un compartiment Amazon S3 nommé `legal-docs` dont la gestion des versions est activée. Un opérateur exécute `aws s3api list-object-versions --bucket legal-docs --prefix contracts/acme.pdf` et obtient la sortie suivante (abrégée).

    ```json
    {
      "Versions": [
        { "Key": "contracts/acme.pdf", "VersionId": "3HL4kqtJlcpXroDTDmJ.rmSpXd3dIbrHY",
          "IsLatest": false, "LastModified": "2026-11-17T10:02:11.000Z", "Size": 482113 }
      ],
      "DeleteMarkers": [
        { "Key": "contracts/acme.pdf", "VersionId": "Mzhjb2xqQk9oN2dtbWp2b1F2dXdPRzZa",
          "IsLatest": true, "LastModified": "2026-11-19T16:45:03.000Z" }
      ]
    }
    ```

    L'objet doit être de nouveau disponible avec sa version `3HL4kqtJlcpXroDTDmJ.rmSpXd3dIbrHY` comme version actuelle, et aucune nouvelle version d'objet ne doit être créée.

    Quelle commande l'opérateur doit-il exécuter ?
body:
  options:
    - { id: a, text: "`aws s3api delete-object --bucket legal-docs --key contracts/acme.pdf --version-id Mzhjb2xqQk9oN2dtbWp2b1F2dXdPRzZa`" }
    - { id: b, text: "`aws s3api delete-object --bucket legal-docs --key contracts/acme.pdf`" }
    - { id: c, text: "`aws s3api copy-object --bucket legal-docs --key contracts/acme.pdf --copy-source legal-docs/contracts/acme.pdf?versionId=3HL4kqtJlcpXroDTDmJ.rmSpXd3dIbrHY`" }
    - { id: d, text: "`aws s3api restore-object --bucket legal-docs --key contracts/acme.pdf --version-id 3HL4kqtJlcpXroDTDmJ.rmSpXd3dIbrHY`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Deleting an object without a version ID only added a delete marker, which is now the current version. Permanently deleting that delete marker by its version ID makes the previous version, `3HL4kqtJlcpXroDTDmJ.rmSpXd3dIbrHY`, the current version again, without creating a new version.
    fr: |
      La suppression d'un objet sans ID de version a seulement ajouté un marqueur de suppression, qui est maintenant la version actuelle. Supprimer définitivement ce marqueur de suppression par son ID de version fait de nouveau de la version précédente, `3HL4kqtJlcpXroDTDmJ.rmSpXd3dIbrHY`, la version actuelle, sans créer de nouvelle version.
  options:
    b: { en: "A delete request without a version ID does not remove the delete marker; it adds another delete marker.", fr: "Une demande de suppression sans ID de version ne retire pas le marqueur de suppression ; elle en ajoute un autre." }
    c: { en: "Copying the previous version in place also makes the content current, but it creates a new object version, which the requirement forbids.", fr: "Copier la version précédente sur place rend aussi le contenu actuel, mais crée une nouvelle version d'objet, ce que l'exigence interdit." }
    d: { en: "`restore-object` retrieves archived objects from the S3 Glacier storage classes; it does not undelete objects.", fr: "`restore-object` récupère des objets archivés dans les classes de stockage S3 Glacier ; il ne restaure pas des objets supprimés." }
references:
  - title: Managing delete markers - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/ManagingDelMarkers.html
