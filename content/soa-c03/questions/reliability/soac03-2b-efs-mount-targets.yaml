id: soac03-2b-efs-mount-targets
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs Linux instances in an Auto Scaling group across three Availability Zones. The instances need a shared file system that remains available if any one Availability Zone fails. Each instance must mount the file system through an endpoint in its own Availability Zone to avoid cross-AZ data access charges.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute des instances Linux dans un groupe Auto Scaling réparti sur trois zones de disponibilité. Les instances ont besoin d'un système de fichiers partagé qui reste disponible en cas de panne de l'une des zones. Chaque instance doit monter le système de fichiers via un point de terminaison situé dans sa propre zone de disponibilité pour éviter les frais d'accès aux données entre zones.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an Amazon EFS file system that uses the Regional storage classes.", fr: "Créer un système de fichiers Amazon EFS qui utilise les classes de stockage régionales." } }
    - { id: b, text: { en: "Create one EFS One Zone file system in each Availability Zone and synchronize them with AWS DataSync.", fr: "Créer un système de fichiers EFS One Zone dans chaque zone de disponibilité et les synchroniser avec AWS DataSync." } }
    - { id: c, text: { en: "Create a mount target in one subnet of each of the three Availability Zones.", fr: "Créer une cible de montage dans un sous-réseau de chacune des trois zones de disponibilité." } }
    - { id: d, text: { en: "Mount the file system on all instances by using the IP address of the mount target in the first Availability Zone.", fr: "Monter le système de fichiers sur toutes les instances à l'aide de l'adresse IP de la cible de montage de la première zone." } }
    - { id: e, text: { en: "Turn on EFS replication to a file system in another AWS Region.", fr: "Activer la réplication EFS vers un système de fichiers d'une autre Région AWS." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A file system that uses the Regional storage classes stores data across Availability Zones and can have a mount target in each Availability Zone of the Region (one per zone, in any of its subnets). Instances that mount through the mount target of their own zone avoid cross-AZ data access charges, and the file system stays reachable from the other zones if one zone fails.
    fr: |
      Un système de fichiers qui utilise les classes de stockage régionales stocke les données sur plusieurs zones de disponibilité et peut avoir une cible de montage dans chaque zone de la Région (une par zone, dans n'importe lequel de ses sous-réseaux). Les instances qui montent via la cible de montage de leur zone évitent les frais d'accès entre zones, et le système de fichiers reste accessible depuis les autres zones si une zone tombe en panne.
  options:
    b: { en: "Separate One Zone file systems are not one shared file system; periodic synchronization leaves each copy different between runs.", fr: "Des systèmes de fichiers One Zone distincts ne forment pas un système partagé ; une synchronisation périodique laisse chaque copie différente entre deux exécutions." }
    d: { en: "A single mount target makes every other zone depend on the first zone and adds cross-AZ data access charges.", fr: "Une seule cible de montage rend toutes les autres zones dépendantes de la première et ajoute des frais d'accès entre zones." }
    e: { en: "Replication to another Region protects against a Regional event; it does not give instances a mount target in their own zone.", fr: "La réplication vers une autre Région protège contre un incident régional ; elle ne donne pas aux instances une cible de montage dans leur propre zone." }
references:
  - title: Managing mount targets
    url: https://docs.aws.amazon.com/efs/latest/ug/accessing-fs.html
