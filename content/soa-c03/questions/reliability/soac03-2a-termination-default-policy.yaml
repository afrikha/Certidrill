id: soac03-2a-termination-default-policy
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Auto Scaling group uses the default termination policy and version 3 of launch template lt-app. All instances are the same instance type, are healthy, and are not protected from scale-in. The group contains the following instances:

    ```text
    Instance  Availability Zone  Launch template version
    i-01      us-east-1a         3
    i-02      us-east-1a         3
    i-03      us-east-1a         2
    i-04      us-east-1b         1
    i-05      us-east-1b         3
    ```

    A scale-in event removes one instance.

    Which instance will Amazon EC2 Auto Scaling terminate?
  fr: |
    Un groupe Auto Scaling utilise la politique de résiliation par défaut et la version 3 du modèle de lancement lt-app. Toutes les instances sont du même type, sont saines et ne sont pas protégées contre la diminution de la taille. Le groupe contient les instances suivantes :

    ```text
    Instance  Availability Zone  Launch template version
    i-01      us-east-1a         3
    i-02      us-east-1a         3
    i-03      us-east-1a         2
    i-04      us-east-1b         1
    i-05      us-east-1b         3
    ```

    Une diminution de capacité supprime une instance.

    Quelle instance Amazon EC2 Auto Scaling va-t-il résilier ?
body:
  options:
    - { id: a, text: { en: "i-01", fr: "i-01" } }
    - { id: b, text: { en: "i-04", fr: "i-04" } }
    - { id: c, text: { en: "i-03", fr: "i-03" } }
    - { id: d, text: { en: "i-05", fr: "i-05" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The default termination policy first keeps the Availability Zones balanced, so it selects us-east-1a, which has the most instances. Inside that zone it looks for outdated configurations and picks the instance that uses the oldest version of the current launch template, which is i-03 (version 2)."
    fr: "La politique de résiliation par défaut garde d'abord les zones de disponibilité équilibrées : elle choisit us-east-1a, qui compte le plus d'instances. Dans cette zone, elle cherche les configurations obsolètes et choisit l'instance qui utilise la plus ancienne version du modèle de lancement actuel, c'est-à-dire i-03 (version 2)."
  options:
    a:
      en: "i-01 uses the current version 3. The billing-hour step is used only when no instance in the selected zone has an outdated configuration."
      fr: "i-01 utilise la version actuelle 3. L'étape de l'heure de facturation ne sert que si aucune instance de la zone choisie n'a une configuration obsolète."
    b:
      en: "i-04 uses the oldest version, but it is in us-east-1b. Zone balance comes first, and us-east-1a has more instances."
      fr: "i-04 utilise la plus ancienne version, mais elle se trouve dans us-east-1b. L'équilibre entre zones passe en premier, et us-east-1a compte plus d'instances."
    d:
      en: "i-05 is in the zone with fewer instances and uses the current launch template version."
      fr: "i-05 se trouve dans la zone qui compte le moins d'instances et utilise la version actuelle du modèle de lancement."
references:
  - title: Configure termination policies for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-termination-policies.html
