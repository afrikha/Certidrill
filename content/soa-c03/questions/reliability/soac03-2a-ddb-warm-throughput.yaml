id: soac03-2a-ddb-warm-throughput
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retailer uses an Amazon DynamoDB table in on-demand capacity mode. For a flash sale next week, the company expects write traffic to rise from about 1,000 to 30,000 writes per second within seconds of the start. The company must avoid throttling when the sale begins and wants to keep on-demand mode.

    Which solution will meet these requirements?
  fr: |
    Un détaillant utilise une table Amazon DynamoDB en mode de capacité à la demande. Pour une vente flash la semaine prochaine, l'entreprise s'attend à ce que le trafic d'écriture passe d'environ 1 000 à 30 000 écritures par seconde dans les secondes qui suivent le début. L'entreprise doit éviter toute limitation au début de la vente et veut conserver le mode à la demande.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set a maximum on-demand write throughput of 30,000 write request units per second on the table.", fr: "Définir sur la table un débit d'écriture maximal à la demande de 30 000 unités de requête d'écriture par seconde." } }
    - { id: b, text: { en: "Increase the warm throughput of the table to 30,000 write units per second before the sale.", fr: "Augmenter le débit préchauffé (warm throughput) de la table à 30 000 unités d'écriture par seconde avant la vente." } }
    - { id: c, text: { en: "Switch the table to provisioned capacity mode with auto scaling and a target utilization of 20%.", fr: "Passer la table en mode de capacité provisionnée avec la mise à l'échelle automatique et une utilisation cible de 20 %." } }
    - { id: d, text: { en: "Add a DynamoDB Accelerator (DAX) cluster in front of the table to absorb the writes.", fr: "Ajouter un cluster DynamoDB Accelerator (DAX) devant la table pour absorber les écritures." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Warm throughput is the number of reads and writes that a table can support instantly. Pre-warming raises it before an expected peak, without changing the billing mode, so the table can take the sudden jump at the start of the sale. Pre-warming is charged, and the values cannot be decreased afterward."
    fr: "Le débit préchauffé est le nombre de lectures et d'écritures qu'une table peut prendre en charge instantanément. Le préchauffage l'augmente avant une pointe prévue, sans changer le mode de facturation : la table peut absorber le saut brutal du début de la vente. Le préchauffage est facturé, et les valeurs ne peuvent plus être réduites ensuite."
  options:
    a:
      en: "A maximum throughput only caps usage; it does not prepare the table to serve a sudden increase."
      fr: "Un débit maximal ne fait que plafonner l'utilisation ; il ne prépare pas la table à servir une hausse soudaine."
    c:
      en: "The company wants to keep on-demand mode, and auto scaling reacts over several minutes, so the first minutes of the sale would be throttled."
      fr: "L'entreprise veut conserver le mode à la demande, et la mise à l'échelle automatique réagit en plusieurs minutes : les premières minutes de la vente seraient limitées."
    d:
      en: "DAX caches reads; writes still go through to the table, so it does not add write capacity."
      fr: "DAX met en cache les lectures ; les écritures vont toujours jusqu'à la table : DAX n'ajoute pas de capacité d'écriture."
references:
  - title: Understanding DynamoDB warm throughput
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/warm-throughput.html
