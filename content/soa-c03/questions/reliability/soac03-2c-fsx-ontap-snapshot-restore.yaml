id: soac03-2c-fsx-ontap-snapshot-restore
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research team mounts an Amazon FSx for NetApp ONTAP volume on Linux instances over NFS. The volume uses the `default` snapshot policy. Two hours ago, a researcher overwrote the file `results/run42.csv` with bad data. Other files on the volume have changed since then and must not be affected. The team wants to recover the file with the least effort.

    Which solution will meet these requirements?
  fr: |
    Une équipe de recherche monte un volume Amazon FSx for NetApp ONTAP sur des instances Linux via NFS. Le volume utilise la politique de snapshots `default`. Il y a deux heures, un chercheur a écrasé le fichier `results/run42.csv` avec de mauvaises données. D'autres fichiers du volume ont changé depuis et ne doivent pas être affectés. L'équipe veut récupérer le fichier avec le moins d'efforts possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Restore the latest backup of the volume to a new volume, and copy the file from the new volume.", fr: "Restaurer la dernière sauvegarde du volume dans un nouveau volume, et copier le fichier depuis le nouveau volume." } }
    - { id: b, text: { en: "Copy the file from the `.snapshot` directory of the most recent hourly snapshot taken before the change.", fr: "Copier le fichier depuis le répertoire `.snapshot` du snapshot horaire le plus récent pris avant la modification." } }
    - { id: c, text: { en: "Restore the whole volume to the most recent hourly snapshot taken before the change.", fr: "Restaurer l'ensemble du volume à partir du snapshot horaire le plus récent pris avant la modification." } }
    - { id: d, text: { en: "Turn on S3 Versioning for the file system's data repository, and download the previous version.", fr: "Activer S3 Versioning pour le référentiel de données du système de fichiers, et télécharger la version précédente." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `default` snapshot policy keeps hourly, daily and weekly snapshots of every volume, and Linux clients see them in the `.snapshot` directory at the root of the volume. The researcher copies the earlier `run42.csv` from the right snapshot back to its directory, without touching other files.
    fr: |
      La politique de snapshots `default` conserve des snapshots horaires, quotidiens et hebdomadaires de chaque volume, et les clients Linux les voient dans le répertoire `.snapshot` à la racine du volume. Le chercheur recopie le fichier `run42.csv` antérieur depuis le bon snapshot vers son répertoire, sans toucher aux autres fichiers.
  options:
    a: { en: "Restoring a backup to a new volume works but takes much longer than copying the file from a snapshot that is already on the volume.", fr: "Restaurer une sauvegarde dans un nouveau volume fonctionne, mais prend bien plus de temps que de copier le fichier depuis un snapshot déjà présent sur le volume." }
    c: { en: "Reverting the whole volume would also undo the valid changes made to the other files since the snapshot.", fr: "Rétablir l'ensemble du volume annulerait aussi les modifications valides apportées aux autres fichiers depuis le snapshot." }
    d: { en: "An FSx for ONTAP volume does not store its files in an S3 bucket, so S3 Versioning does not apply.", fr: "Un volume FSx for ONTAP ne stocke pas ses fichiers dans un compartiment S3 : S3 Versioning ne s'applique pas." }
references:
  - title: Restoring files from snapshots - FSx for ONTAP
    url: https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/user-restore-all-clients.html
  - title: Protecting your data with snapshots - FSx for ONTAP
    url: https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/snapshots-ontap.html
