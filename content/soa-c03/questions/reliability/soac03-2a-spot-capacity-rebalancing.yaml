id: soac03-2a-spot-capacity-rebalancing
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs stateless batch workers in an Auto Scaling group across three Availability Zones. The group uses only Spot Instances of a single instance type with the lowest-price allocation strategy. Workers are often interrupted, and Amazon EC2 Auto Scaling launches a replacement only after an instance has been interrupted. The company wants fewer interruptions and wants instances at elevated risk of interruption to be replaced before they are interrupted.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une entreprise exécute des programmes de traitement par lots sans état dans un groupe Auto Scaling réparti sur trois zones de disponibilité. Le groupe utilise uniquement des instances Spot d'un seul type, avec la stratégie d'allocation lowest-price. Les programmes sont souvent interrompus, et Amazon EC2 Auto Scaling ne lance un remplacement qu'après l'interruption d'une instance. L'entreprise veut moins d'interruptions et veut que les instances exposées à un risque élevé d'interruption soient remplacées avant d'être interrompues.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable instance scale-in protection for all Spot Instances in the group.", fr: "Activer la protection contre la diminution de la taille pour toutes les instances Spot du groupe." } }
    - { id: b, text: { en: "Enable Capacity Rebalancing on the Auto Scaling group.", fr: "Activer Capacity Rebalancing sur le groupe Auto Scaling." } }
    - { id: c, text: { en: "Add a lifecycle hook for EC2_INSTANCE_TERMINATING to delay Spot interruptions until the workers finish.", fr: "Ajouter un hook de cycle de vie pour EC2_INSTANCE_TERMINATING afin de retarder les interruptions Spot jusqu'à la fin des traitements." } }
    - { id: d, text: { en: "Set the maximum Spot price in the launch template to the On-Demand price.", fr: "Définir le prix Spot maximal du modèle de lancement au prix à la demande." } }
    - { id: e, text: { en: "Use a mixed instances policy with several similar instance types and the price-capacity-optimized allocation strategy.", fr: "Utiliser une politique d'instances mixtes avec plusieurs types d'instances similaires et la stratégie d'allocation price-capacity-optimized." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Capacity Rebalancing reacts to EC2 rebalance recommendations by launching a new Spot Instance and terminating the at-risk one after the new instance is healthy. Several instance types with price-capacity-optimized give the group more Spot pools and place instances in pools that are least likely to be interrupted, which AWS recommends with Capacity Rebalancing instead of lowest-price."
    fr: "Capacity Rebalancing réagit aux recommandations de rééquilibrage EC2 en lançant une nouvelle instance Spot puis en résiliant l'instance à risque une fois la nouvelle instance saine. Plusieurs types d'instances avec price-capacity-optimized donnent au groupe davantage de pools Spot et placent les instances dans les pools les moins susceptibles d'être interrompus, ce qu'AWS recommande avec Capacity Rebalancing à la place de lowest-price."
  options:
    a:
      en: "Scale-in protection does not stop Amazon EC2 from reclaiming Spot capacity, so interruptions continue."
      fr: "La protection contre la diminution de la taille n'empêche pas Amazon EC2 de récupérer la capacité Spot : les interruptions continuent."
    c:
      en: "A lifecycle hook cannot delay the termination of a Spot Instance when EC2 reclaims the capacity; it only gives time for cleanup."
      fr: "Un hook de cycle de vie ne peut pas retarder la résiliation d'une instance Spot quand EC2 récupère la capacité ; il laisse seulement le temps d'un nettoyage."
    d:
      en: "Most interruptions here come from capacity being reclaimed in a few pools, and a maximum price does not add pools or replace at-risk instances early."
      fr: "Ici, la plupart des interruptions viennent de la capacité récupérée dans quelques pools, et un prix maximal n'ajoute pas de pools ni ne remplace à l'avance les instances à risque."
references:
  - title: Capacity Rebalancing in Auto Scaling to replace at-risk Spot Instances
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-capacity-rebalancing.html
