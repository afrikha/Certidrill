id: soac03-2a-cf-error-caching-ttl
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A news company publishes articles through an Amazon CloudFront distribution with a custom origin. Editors sometimes share the URL of a new article a few seconds before the origin can serve it, so the first requests receive an HTTP 404 response. After the article becomes available, viewers keep receiving the 404 response for about 5 minutes. The distribution has a custom error response for 404 with an error caching minimum TTL of 300 seconds, and the origin's 404 responses do not include a Cache-Control header.

    Which change will make new articles available to viewers within about 10 seconds of their publication?
  fr: |
    Une entreprise de presse publie des articles via une distribution Amazon CloudFront dotée d'une origine personnalisée. Les rédacteurs partagent parfois l'URL d'un nouvel article quelques secondes avant que l'origine puisse le servir : les premières requêtes reçoivent alors une réponse HTTP 404. Une fois l'article disponible, les utilisateurs continuent de recevoir la réponse 404 pendant environ 5 minutes. La distribution possède une réponse d'erreur personnalisée pour 404 avec une durée de vie minimale de mise en cache des erreurs de 300 secondes, et les réponses 404 de l'origine ne contiennent pas d'en-tête Cache-Control.

    Quelle modification rend les nouveaux articles disponibles pour les utilisateurs environ 10 secondes après leur publication ?
body:
  options:
    - { id: a, text: { en: "Set the error caching minimum TTL of the 404 custom error response to 10 seconds.", fr: "Définir la durée de vie minimale de mise en cache des erreurs de la réponse d'erreur personnalisée 404 sur 10 secondes." } }
    - { id: b, text: { en: "Reduce the default TTL of the cache policy of the cache behavior to 10 seconds.", fr: "Réduire la TTL par défaut de la politique de cache du comportement de cache à 10 secondes." } }
    - { id: c, text: { en: "Add a Cache-Control: no-store header to the origin's successful responses for articles.", fr: "Ajouter un en-tête Cache-Control: no-store aux réponses réussies de l'origine pour les articles." } }
    - { id: d, text: { en: "Enable Origin Shield for the origin so that 404 responses are cached in a single location.", fr: "Activer Origin Shield pour l'origine afin que les réponses 404 soient mises en cache à un seul endroit." } }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudFront always caches 404 responses, for the greater of the error caching minimum TTL and any max-age that the origin returns with the error. Without a Cache-Control header, the 300-second setting decides, so lowering it to 10 seconds makes edge locations ask the origin again after about 10 seconds."
    fr: "CloudFront met toujours en cache les réponses 404, pendant la plus grande valeur entre la durée de vie minimale de mise en cache des erreurs et le max-age éventuellement renvoyé par l'origine avec l'erreur. Sans en-tête Cache-Control, c'est le paramètre de 300 secondes qui décide : le ramener à 10 secondes fait interroger de nouveau l'origine par les emplacements périphériques après environ 10 secondes."
  options:
    b:
      en: "The cache policy TTLs apply to successful responses. The time that an error response stays cached is set by the error caching minimum TTL."
      fr: "Les TTL de la politique de cache s'appliquent aux réponses réussies. La durée de mise en cache d'une réponse d'erreur est fixée par la durée de vie minimale de mise en cache des erreurs."
    c:
      en: "Headers on successful responses do not change how long the earlier 404 response stays cached, and no-store would reduce caching of the articles."
      fr: "Les en-têtes des réponses réussies ne changent pas la durée de mise en cache de la réponse 404 précédente, et no-store réduirait la mise en cache des articles."
    d:
      en: "Origin Shield adds a caching layer in front of the origin; the 404 response would still be cached for 300 seconds."
      fr: "Origin Shield ajoute une couche de cache devant l'origine ; la réponse 404 serait toujours mise en cache pendant 300 secondes."
references:
  - title: How CloudFront processes HTTP 4xx and 5xx status codes from your origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HTTPStatusCodes.html
