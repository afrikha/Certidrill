id: soac03-2c-fsxw-shadow-self-restore
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm stores case documents on an Amazon FSx for Windows File Server file system that uses SSD storage and daily automatic backups. Each week, the operations team restores entire backups to new file systems only to recover a few files that lawyers changed or deleted by mistake. The firm wants lawyers to recover earlier versions of their own files from Windows File Explorer, with the least operational effort.

    Which solution will meet these requirements?
  fr: |
    Un cabinet d'avocats stocke des documents de dossiers sur un système de fichiers Amazon FSx for Windows File Server qui utilise un stockage SSD et des sauvegardes automatiques quotidiennes. Chaque semaine, l'équipe d'exploitation restaure des sauvegardes complètes dans de nouveaux systèmes de fichiers uniquement pour récupérer quelques fichiers que des avocats ont modifiés ou supprimés par erreur. Le cabinet veut que les avocats récupèrent eux-mêmes les versions antérieures de leurs fichiers depuis l'Explorateur de fichiers Windows, avec le moins d'efforts opérationnels possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable shadow copies on the file system with the default storage and schedule.", fr: "Activer les clichés instantanés (shadow copies) sur le système de fichiers avec le stockage et la planification par défaut." } }
    - { id: b, text: { en: "Increase the automatic backup retention to 90 days, and give the lawyers permission to restore backups.", fr: "Porter la rétention des sauvegardes automatiques à 90 jours, et accorder aux avocats l'autorisation de restaurer les sauvegardes." } }
    - { id: c, text: { en: "Move the documents to an Amazon S3 bucket with S3 Versioning, and map it as a network drive.", fr: "Déplacer les documents dans un compartiment Amazon S3 avec S3 Versioning, et le monter comme lecteur réseau." } }
    - { id: d, text: { en: "Create an hourly AWS Backup plan for the file system, and restore the recovery points to new file systems.", fr: "Créer un plan AWS Backup horaire pour le système de fichiers, et restaurer les points de récupération dans de nouveaux systèmes de fichiers." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Shadow copies are point-in-time snapshots of the file system that users open through Restore previous versions in Windows File Explorer to recover changed or deleted files themselves. They are not enabled by default; an administrator turns them on with `Set-FsxShadowStorage -Default` and `Set-FsxShadowCopySchedule -Default` through the file system's remote PowerShell endpoint.
    fr: |
      Les clichés instantanés sont des instantanés à un moment donné du système de fichiers, que les utilisateurs ouvrent via Restaurer les versions précédentes dans l'Explorateur de fichiers Windows pour récupérer eux-mêmes les fichiers modifiés ou supprimés. Ils ne sont pas activés par défaut ; un administrateur les active avec `Set-FsxShadowStorage -Default` et `Set-FsxShadowCopySchedule -Default` via le point de terminaison PowerShell distant du système de fichiers.
  options:
    b: { en: "A backup is restored to a whole new file system, which is slow and still needs administrator work for every file.", fr: "Une sauvegarde se restaure dans un système de fichiers entièrement nouveau, ce qui est lent et demande toujours un travail d'administrateur pour chaque fichier." }
    c: { en: "Moving to S3 changes the storage service and the way lawyers access files, which is far more effort than enabling a feature.", fr: "Passer à S3 change de service de stockage et de mode d'accès aux fichiers pour les avocats, ce qui demande bien plus d'efforts qu'activer une fonctionnalité." }
    d: { en: "Each restore still creates a new file system and needs the operations team, so users cannot recover files themselves.", fr: "Chaque restauration crée toujours un nouveau système de fichiers et mobilise l'équipe d'exploitation : les utilisateurs ne peuvent pas récupérer eux-mêmes leurs fichiers." }
references:
  - title: Protecting your data with shadow copies - Amazon FSx for Windows File Server
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/shadow-copies-fsxW.html
  - title: Configuring shadow copies to use the default storage and schedule
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/setting-up-fsx-shadow-copies.html
