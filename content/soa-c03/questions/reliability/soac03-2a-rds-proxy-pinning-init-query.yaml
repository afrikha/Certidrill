id: soac03-2a-rds-proxy-pinning-init-query
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application connects to an Amazon RDS for MySQL DB instance through RDS Proxy. Each time it opens a connection, the application runs the same SET statements for the session time zone and the SQL mode. CloudWatch shows that DatabaseConnectionsCurrentlySessionPinned is almost equal to DatabaseConnections, and the proxy opens far more database connections than the number of concurrent transactions would require.

    Which change will improve connection reuse by the proxy?
  fr: |
    Une application se connecte à une instance de base de données Amazon RDS for MySQL via RDS Proxy. Chaque fois qu'elle ouvre une connexion, l'application exécute les mêmes instructions SET pour le fuseau horaire de la session et le mode SQL. CloudWatch montre que DatabaseConnectionsCurrentlySessionPinned est presque égal à DatabaseConnections, et le proxy ouvre bien plus de connexions à la base de données que le nombre de transactions simultanées ne l'exigerait.

    Quelle modification améliore la réutilisation des connexions par le proxy ?
body:
  options:
    - { id: a, text: { en: "Raise MaxConnectionsPercent of the proxy's target group to 100 to allow more connections.", fr: "Porter MaxConnectionsPercent du groupe cible du proxy à 100 pour autoriser plus de connexions." } }
    - { id: b, text: { en: "Lower IdleClientTimeout of the proxy so that idle client connections are closed sooner.", fr: "Réduire IdleClientTimeout du proxy pour que les connexions clientes inactives soient fermées plus tôt." } }
    - { id: c, text: { en: "Move the SET statements into the initialization query of the proxy.", fr: "Déplacer les instructions SET dans la requête d'initialisation du proxy." } }
    - { id: d, text: { en: "Turn on IAM database authentication for the proxy and the application.", fr: "Activer l'authentification de base de données IAM pour le proxy et l'application." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Setting session variables pins a client connection to one database connection until the session ends, which stops the proxy from multiplexing transactions. When identical SET statements run in the proxy's initialization query, RDS Proxy applies them each time it opens a database connection. The application then drops its own SET statements, no longer changes session state, and its connections can be reused."
    fr: "Définir des variables de session épingle une connexion cliente à une connexion de base de données jusqu'à la fin de la session, ce qui empêche le proxy de multiplexer les transactions. Quand les instructions SET identiques s'exécutent dans la requête d'initialisation du proxy, RDS Proxy les applique à chaque ouverture de connexion à la base de données. L'application supprime alors ses propres instructions SET, ne modifie plus l'état de la session, et ses connexions peuvent être réutilisées."
  options:
    a:
      en: "A higher MaxConnectionsPercent only lets the proxy open more database connections; pinned sessions still cannot share them."
      fr: "Un MaxConnectionsPercent plus élevé permet seulement au proxy d'ouvrir davantage de connexions à la base de données ; les sessions épinglées ne peuvent toujours pas les partager."
    b:
      en: "Closing idle client connections sooner does not stop each new session from pinning again when it runs the SET statements."
      fr: "Fermer plus tôt les connexions clientes inactives n'empêche pas chaque nouvelle session de s'épingler de nouveau quand elle exécute les instructions SET."
    d:
      en: "IAM authentication changes how clients authenticate to the proxy; it has no effect on pinning."
      fr: "L'authentification IAM change la façon dont les clients s'authentifient auprès du proxy ; elle n'a aucun effet sur l'épinglage."
references:
  - title: Avoiding pinning an RDS Proxy
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy-pinning.html
