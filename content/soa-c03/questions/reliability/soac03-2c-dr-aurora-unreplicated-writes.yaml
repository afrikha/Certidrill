id: soac03-2c-dr-aurora-unreplicated-writes
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    During a Regional outage, a company performed a managed failover of its Amazon Aurora PostgreSQL global database from us-east-1 to us-west-2. Us-east-1 is healthy again, and Aurora has added the old primary DB cluster back to the global database as a secondary. The finance team must now find the transactions that were committed in us-east-1 just before the outage but never reached us-west-2.

    Which solution will meet this requirement?
  fr: |
    Pendant une panne régionale, une entreprise a effectué un basculement géré de sa base de données globale Amazon Aurora PostgreSQL de us-east-1 vers us-west-2. La Région us-east-1 est de nouveau saine, et Aurora a rajouté l'ancien cluster principal à la base de données globale en tant que secondaire. L'équipe financière doit maintenant retrouver les transactions validées dans us-east-1 juste avant la panne mais qui n'ont jamais atteint us-west-2.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Query the old primary cluster in us-east-1 directly, because it still contains the transactions that it never replicated.", fr: "Interroger directement l'ancien cluster principal de us-east-1, car il contient toujours les transactions qu'il n'a jamais répliquées." } }
    - { id: b, text: { en: "Restore the new primary cluster in us-west-2 to a point in time just before the outage, and query the restored cluster.", fr: "Restaurer le nouveau cluster principal de us-west-2 à un instant juste avant la panne, et interroger le cluster restauré." } }
    - { id: c, text: { en: "Restore the `rds:unplanned-global-failover-...` snapshot that Aurora took of the old primary, and compare it with the new primary.", fr: "Restaurer l'instantané `rds:unplanned-global-failover-...` qu'Aurora a pris de l'ancien cluster principal, et le comparer au nouveau cluster principal." } }
    - { id: d, text: { en: "Search the AWS CloudTrail event history of us-east-1 for the SQL statements that ran just before the outage.", fr: "Rechercher dans l'historique des événements AWS CloudTrail de us-east-1 les instructions SQL exécutées juste avant la panne." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      During a managed failover, Aurora attempts to snapshot the old primary's storage volume at the point of failure and names it `rds:unplanned-global-failover-<old-cluster-name>-<timestamp>`. Restoring that snapshot gives the data as it was in us-east-1, including the writes that were not replicated. It is a system snapshot subject to the backup retention period, so it should be copied to a manual snapshot to keep it.
    fr: |
      Lors d'un basculement géré, Aurora tente de prendre un instantané du volume de stockage de l'ancien cluster principal au moment de la défaillance et le nomme `rds:unplanned-global-failover-<ancien-cluster>-<horodatage>`. Restaurer cet instantané donne les données telles qu'elles étaient dans us-east-1, y compris les écritures non répliquées. Il s'agit d'un instantané système soumis à la période de rétention des sauvegardes : il faut le copier en instantané manuel pour le conserver.
  options:
    a: { en: "When the old primary rejoins as a secondary, Aurora rebuilds it from the new primary, so the unreplicated writes are no longer there.", fr: "Lorsque l'ancien cluster principal revient comme secondaire, Aurora le reconstruit à partir du nouveau cluster principal : les écritures non répliquées n'y sont plus." }
    b: { en: "The us-west-2 cluster never received those writes, so no point in time of its backups contains them.", fr: "Le cluster de us-west-2 n'a jamais reçu ces écritures : aucun instant de ses sauvegardes ne les contient." }
    d: { en: "CloudTrail records AWS API calls, not the SQL statements that run inside the database.", fr: "CloudTrail enregistre les appels d'API AWS, et non les instructions SQL exécutées dans la base de données." }
references:
  - title: Using switchover or failover in Amazon Aurora Global Database - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html
