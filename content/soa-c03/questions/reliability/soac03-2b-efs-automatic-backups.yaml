id: soac03-2b-efs-automatic-backups
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company creates Amazon EFS file systems that use the Regional storage classes with the AWS CLI from a provisioning pipeline. An audit finds that these file systems have no backups, while file systems that engineers created in the EFS console are backed up every day. The company wants daily backups of the pipeline's file systems with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise crée, avec l'AWS CLI depuis un pipeline de provisionnement, des systèmes de fichiers Amazon EFS qui utilisent les classes de stockage régionales. Un audit constate que ces systèmes de fichiers n'ont aucune sauvegarde, alors que ceux créés par les ingénieurs dans la console EFS sont sauvegardés chaque jour. L'entreprise veut des sauvegardes quotidiennes des systèmes de fichiers du pipeline avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an aws efs put-backup-policy command with Status=ENABLED for each new file system to the pipeline.", fr: "Ajouter au pipeline une commande aws efs put-backup-policy avec Status=ENABLED pour chaque nouveau système de fichiers." } }
    - { id: b, text: { en: "Turn on EFS replication for each new file system to a file system in the same Region.", fr: "Activer la réplication EFS de chaque nouveau système de fichiers vers un système de fichiers de la même Région." } }
    - { id: c, text: { en: "Schedule a nightly AWS DataSync task that copies each file system to an S3 bucket.", fr: "Planifier une tâche AWS DataSync nocturne qui copie chaque système de fichiers vers un compartiment S3." } }
    - { id: d, text: { en: "Create an Amazon Data Lifecycle Manager policy that targets the file systems by tag.", fr: "Créer une politique Amazon Data Lifecycle Manager qui cible les systèmes de fichiers par balise." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      File systems created in the EFS console are backed up automatically by AWS Backup with a default plan (daily backups, 35-day retention). With the CLI or API, automatic backups are on by default only for One Zone file systems; `put-backup-policy` with `Status=ENABLED` turns them on for an existing file system.
    fr: |
      Les systèmes de fichiers créés dans la console EFS sont sauvegardés automatiquement par AWS Backup avec un plan par défaut (sauvegardes quotidiennes, rétention de 35 jours). Avec la CLI ou l'API, les sauvegardes automatiques ne sont activées par défaut que pour les systèmes One Zone ; `put-backup-policy` avec `Status=ENABLED` les active pour un système de fichiers existant.
  options:
    b: { en: "Replication keeps a copy of the current data, so deletions and corruptions are replicated as well; it does not keep daily recovery points.", fr: "La réplication conserve une copie des données actuelles : les suppressions et corruptions sont répliquées aussi ; elle ne conserve pas de points de récupération quotidiens." }
    c: { en: "A DataSync copy is custom work to schedule and manage, and each run overwrites the previous copy instead of keeping recovery points.", fr: "Une copie DataSync est un travail personnalisé à planifier et gérer, et chaque exécution écrase la copie précédente au lieu de conserver des points de récupération." }
    d: { en: "Amazon Data Lifecycle Manager manages EBS snapshots and EBS-backed AMIs, not EFS file systems.", fr: "Amazon Data Lifecycle Manager gère les instantanés EBS et les AMI basées sur EBS, pas les systèmes de fichiers EFS." }
references:
  - title: Backing up EFS file systems
    url: https://docs.aws.amazon.com/efs/latest/ug/awsbackup.html
  - title: Managing automatic backups of EFS file systems
    url: https://docs.aws.amazon.com/efs/latest/ug/automatic-backups.html
