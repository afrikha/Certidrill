id: soac03-2b-backup-failed-notify
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Backup to protect its resources in one AWS account. The operations team wants to receive an email within a few minutes each time a backup job fails. An Amazon SNS topic with the team's email subscription already exists, and its access policy allows the AWS services that will publish to it.

    Which solutions will meet this requirement? (Choose two.) Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise AWS Backup pour protéger ses ressources dans un compte AWS. L'équipe des opérations veut recevoir un e-mail dans les minutes qui suivent chaque échec d'une tâche de sauvegarde. Une rubrique Amazon SNS avec l'abonnement par e-mail de l'équipe existe déjà, et sa politique d'accès autorise les services AWS qui y publieront.

    Quelles solutions permettent de répondre à cette exigence ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure notifications on the backup vault that send the BACKUP_JOB_FAILED event to the SNS topic.", fr: "Configurer sur le coffre de sauvegarde des notifications qui envoient l'événement BACKUP_JOB_FAILED à la rubrique SNS." } }
    - { id: b, text: { en: "Create an AWS Backup Audit Manager report plan that delivers a daily backup jobs report to an S3 bucket.", fr: "Créer un plan de rapport AWS Backup Audit Manager qui livre un rapport quotidien des tâches de sauvegarde dans un compartiment S3." } }
    - { id: c, text: { en: "Create an AWS Config rule that checks the minimum frequency and retention of the backup plans.", fr: "Créer une règle AWS Config qui vérifie la fréquence et la rétention minimales des plans de sauvegarde." } }
    - { id: d, text: { en: "Create a CloudWatch Logs metric filter on StartBackupJob events from CloudTrail, with an alarm that notifies the topic.", fr: "Créer un filtre de métriques CloudWatch Logs sur les événements StartBackupJob de CloudTrail, avec une alarme qui notifie la rubrique." } }
    - { id: e, text: { en: "Create an EventBridge rule that matches Backup Job State Change events in the FAILED state and targets the SNS topic.", fr: "Créer une règle EventBridge qui correspond aux événements Backup Job State Change à l'état FAILED et qui cible la rubrique SNS." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Backup vault notifications publish selected AWS Backup events, including `BACKUP_JOB_FAILED`, to an Amazon SNS topic. AWS Backup also sends events to Amazon EventBridge when the state of a backup job changes (`Backup Job State Change` with state `FAILED`), so a rule that targets the topic is another complete solution.
    fr: |
      Les notifications d'un coffre de sauvegarde publient des événements AWS Backup choisis, dont `BACKUP_JOB_FAILED`, vers une rubrique Amazon SNS. AWS Backup envoie aussi des événements à Amazon EventBridge lorsque l'état d'une tâche de sauvegarde change (`Backup Job State Change` avec l'état `FAILED`) : une règle qui cible la rubrique constitue une autre solution complète.
  options:
    b: { en: "A daily report is delivered to S3 once a day; it does not send an email within minutes of each failure.", fr: "Un rapport quotidien est livré dans S3 une fois par jour ; il n'envoie pas d'e-mail dans les minutes qui suivent chaque échec." }
    c: { en: "This rule evaluates the settings of backup plans, not the outcome of individual backup jobs.", fr: "Cette règle évalue les paramètres des plans de sauvegarde, pas le résultat de chaque tâche de sauvegarde." }
    d: { en: "StartBackupJob records a request to start a job; it does not indicate whether the job later fails.", fr: "StartBackupJob enregistre une demande de démarrage de tâche ; il n'indique pas si la tâche échoue ensuite." }
references:
  - title: Notification options with AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-notifications.html
  - title: Monitoring AWS Backup events using Amazon EventBridge
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/eventbridge.html
