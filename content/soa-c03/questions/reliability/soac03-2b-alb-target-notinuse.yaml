id: soac03-2b-alb-target-notinuse
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An internet-facing Application Load Balancer is configured with subnets in us-east-1a and us-east-1b. An engineer registered a new Amazon EC2 instance that runs in us-east-1c in the load balancer's target group. The other instances of the target group, in us-east-1a and us-east-1b, are healthy and serve traffic, but the new instance never receives requests. The engineer runs the following command:

    ```bash
    aws elbv2 describe-target-health --target-group-arn arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/web-tg/0123456789abcdef --targets Id=i-0abc1234def567890
    ```

    ```json
    {
      "TargetHealthDescriptions": [
        {
          "Target": { "Id": "i-0abc1234def567890", "Port": 80 },
          "HealthCheckPort": "80",
          "TargetHealth": { "State": "unused", "Reason": "Target.NotInUse" }
        }
      ]
    }
    ```

    Which solution will make the new instance receive traffic?
  fr: |
    Un Application Load Balancer accessible sur Internet est configuré avec des sous-réseaux dans us-east-1a et us-east-1b. Un ingénieur a enregistré dans le groupe cible de l'équilibreur de charge une nouvelle instance Amazon EC2 qui s'exécute dans us-east-1c. Les autres instances du groupe cible, dans us-east-1a et us-east-1b, sont saines et servent le trafic, mais la nouvelle instance ne reçoit jamais de requête. L'ingénieur exécute la commande suivante :

    ```bash
    aws elbv2 describe-target-health --target-group-arn arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/web-tg/0123456789abcdef --targets Id=i-0abc1234def567890
    ```

    ```json
    {
      "TargetHealthDescriptions": [
        {
          "Target": { "Id": "i-0abc1234def567890", "Port": 80 },
          "HealthCheckPort": "80",
          "TargetHealth": { "State": "unused", "Reason": "Target.NotInUse" }
        }
      ]
    }
    ```

    Quelle solution permet à la nouvelle instance de recevoir du trafic ?
body:
  options:
    - { id: a, text: { en: "Add an inbound rule to the instance's security group that allows port 80 from the load balancer's security group.", fr: "Ajouter au groupe de sécurité de l'instance une règle entrante qui autorise le port 80 depuis le groupe de sécurité de l'équilibreur de charge." } }
    - { id: b, text: { en: "Add a subnet in us-east-1c to the load balancer.", fr: "Ajouter à l'équilibreur de charge un sous-réseau de us-east-1c." } }
    - { id: c, text: { en: "Deregister the instance and register it again by using its private IP address.", fr: "Désenregistrer l'instance et l'enregistrer de nouveau à l'aide de son adresse IP privée." } }
    - { id: d, text: { en: "Add a listener rule that forwards requests to the target group.", fr: "Ajouter une règle d'écouteur qui transfère les requêtes vers le groupe cible." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `unused` state with `Target.NotInUse` means that the target group is not used by the load balancer or that the target is in an Availability Zone that is not enabled for the load balancer. The target group already serves traffic through the other instances, so the cause is us-east-1c: enabling that zone by adding one of its subnets lets the load balancer health check the instance and route requests to it.
    fr: |
      L'état `unused` avec `Target.NotInUse` signifie que le groupe cible n'est pas utilisé par l'équilibreur de charge ou que la cible se trouve dans une zone de disponibilité non activée pour l'équilibreur. Le groupe cible sert déjà le trafic via les autres instances : la cause est donc us-east-1c. Activer cette zone en ajoutant l'un de ses sous-réseaux permet à l'équilibreur de vérifier l'état de l'instance et de lui router des requêtes.
  options:
    a: { en: "A blocked health check would show the unhealthy state with Target.Timeout, not unused with Target.NotInUse.", fr: "Une vérification de l'état bloquée afficherait l'état unhealthy avec Target.Timeout, et non unused avec Target.NotInUse." }
    c: { en: "The target type of an existing target group cannot be switched, and an IP target in us-east-1c would still be in a zone that is not enabled.", fr: "Le type de cible d'un groupe cible existant ne peut pas être changé, et une cible IP dans us-east-1c serait toujours dans une zone non activée." }
    d: { en: "A listener already forwards to this target group, because its other targets are healthy and receive requests.", fr: "Un écouteur transfère déjà vers ce groupe cible, puisque ses autres cibles sont saines et reçoivent des requêtes." }
references:
  - title: Health checks for Application Load Balancer target groups
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
