id: soac03-2a-ec-cme-add-shards
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company uses an Amazon ElastiCache for Valkey cluster with cluster mode enabled, 3 shards and 1 replica per shard. The workload is write-heavy. CloudWatch shows that EngineCPUUtilization on the primary nodes is above 85% at peak and that the Evictions metric is rising, while the replicas are lightly used. The company wants to spread the write load and add memory capacity without changing the node type.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo utilise un cluster Amazon ElastiCache for Valkey avec le mode cluster activé, 3 partitions (shards) et 1 réplica par partition. La charge de travail est dominée par les écritures. CloudWatch montre que EngineCPUUtilization des nœuds primaires dépasse 85 % en pointe et que la métrique Evictions augmente, alors que les réplicas sont peu utilisés. L'entreprise veut répartir la charge d'écriture et ajouter de la capacité mémoire sans changer de type de nœud.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a second replica to each shard of the cluster.", fr: "Ajouter un deuxième réplica à chaque partition du cluster." } }
    - { id: b, text: { en: "Configure the client to send read requests to the replicas so that the primary nodes handle only writes.", fr: "Configurer le client pour envoyer les requêtes de lecture aux réplicas afin que les nœuds primaires ne traitent que les écritures." } }
    - { id: c, text: { en: "Add shards to the cluster by using online resharding.", fr: "Ajouter des partitions au cluster grâce au repartitionnement en ligne (online resharding)." } }
    - { id: d, text: { en: "Lower the reserved-memory-percent parameter so that the engine has more memory for data.", fr: "Réduire le paramètre reserved-memory-percent pour que le moteur dispose de plus de mémoire pour les données." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With cluster mode enabled, data and writes are partitioned across shards, and only the primary node of each shard accepts writes. Adding shards spreads the keyspace over more primary nodes, which lowers the write load per primary and adds memory for data, so evictions drop without a node type change."
    fr: "Avec le mode cluster activé, les données et les écritures sont réparties entre les partitions, et seul le nœud primaire de chaque partition accepte les écritures. Ajouter des partitions répartit l'espace de clés sur davantage de nœuds primaires, ce qui réduit la charge d'écriture par primaire et ajoute de la mémoire pour les données : les évictions diminuent sans changer de type de nœud."
  options:
    a:
      en: "Replicas serve reads and hold a copy of the same data, so they add neither write capacity nor memory for more keys."
      fr: "Les réplicas servent les lectures et contiennent une copie des mêmes données : ils n'ajoutent ni capacité d'écriture ni mémoire pour davantage de clés."
    b:
      en: "The workload is write-heavy, so moving the few reads to replicas leaves the write load and the evictions on the primary nodes."
      fr: "La charge est dominée par les écritures : déplacer les quelques lectures vers les réplicas laisse la charge d'écriture et les évictions sur les nœuds primaires."
    d:
      en: "Reserved memory is kept for operations such as backups and failover; lowering it risks swapping and does not add write capacity."
      fr: "La mémoire réservée sert à des opérations comme les sauvegardes et le basculement ; la réduire expose à l'utilisation du swap et n'ajoute pas de capacité d'écriture."
references:
