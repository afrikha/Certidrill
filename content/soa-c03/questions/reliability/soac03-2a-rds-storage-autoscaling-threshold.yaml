id: soac03-2a-rds-storage-autoscaling-threshold
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon RDS for PostgreSQL DB instance has 950 GiB of allocated gp3 storage. Storage autoscaling is enabled with a maximum storage threshold of 1,000 GiB. FreeStorageSpace has stayed below 5% of the allocated storage for 2 hours, but Amazon RDS has not increased the storage. No storage modification has taken place in the past week.

    Which action will allow storage autoscaling to increase the storage?
  fr: |
    Une instance de base de données Amazon RDS for PostgreSQL dispose de 950 Gio de stockage gp3 alloué. La mise à l'échelle automatique du stockage est activée avec un seuil de stockage maximal de 1 000 Gio. FreeStorageSpace reste sous 5 % du stockage alloué depuis 2 heures, mais Amazon RDS n'a pas augmenté le stockage. Aucune modification du stockage n'a eu lieu depuis une semaine.

    Quelle action permettra à la mise à l'échelle automatique du stockage d'augmenter le stockage ?
body:
  options:
    - { id: a, text: { en: "Modify the DB instance with Apply immediately so that the pending storage autoscaling change runs now.", fr: "Modifier l'instance de base de données avec Apply immediately pour que la modification de stockage en attente s'exécute maintenant." } }
    - { id: b, text: { en: "Convert the DB instance to a Multi-AZ deployment so that storage autoscaling can extend the storage of both instances.", fr: "Convertir l'instance de base de données en déploiement Multi-AZ pour que la mise à l'échelle automatique puisse étendre le stockage des deux instances." } }
    - { id: c, text: { en: "Raise the maximum storage threshold of the DB instance well above the current allocated storage.", fr: "Relever le seuil de stockage maximal de l'instance de base de données nettement au-dessus du stockage alloué actuel." } }
    - { id: d, text: { en: "Wait for the next maintenance window, when Amazon RDS applies storage autoscaling changes.", fr: "Attendre la prochaine fenêtre de maintenance, pendant laquelle Amazon RDS applique les modifications de mise à l'échelle automatique du stockage." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Storage autoscaling adds the greatest of 10 GiB, 10% of the allocated storage or the predicted growth, which here is at least 95 GiB. 950 + 95 GiB would exceed the 1,000 GiB threshold, and autoscaling does not run when an increase would go past the maximum. AWS recommends a threshold at least 26% above the allocated storage."
    fr: "La mise à l'échelle automatique du stockage ajoute la plus grande valeur entre 10 Gio, 10 % du stockage alloué et la croissance prévue, soit ici au moins 95 Gio. 950 + 95 Gio dépasseraient le seuil de 1 000 Gio, et la mise à l'échelle automatique ne s'exécute pas quand une augmentation dépasserait le maximum. AWS recommande un seuil supérieur d'au moins 26 % au stockage alloué."
  options:
    a:
      en: "Storage autoscaling does not queue a pending change; it starts on its own when its conditions are met, and Apply immediately does not affect it."
      fr: "La mise à l'échelle automatique du stockage ne met pas de modification en attente ; elle démarre seule quand ses conditions sont réunies, et Apply immediately n'a aucun effet sur elle."
    b:
      en: "Multi-AZ adds a standby for high availability; it does not remove the limit set by the maximum storage threshold."
      fr: "Multi-AZ ajoute une instance de secours pour la haute disponibilité ; il ne lève pas la limite fixée par le seuil de stockage maximal."
    d:
      en: "Storage autoscaling does not wait for a maintenance window, and the threshold would still block the increase."
      fr: "La mise à l'échelle automatique du stockage n'attend pas de fenêtre de maintenance, et le seuil bloquerait toujours l'augmentation."
references:
  - title: Managing capacity automatically with Amazon RDS storage autoscaling
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.Autoscaling.html
