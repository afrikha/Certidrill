id: soac03-2c-dr-aurora-global-failover
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon Aurora global database with its primary DB cluster in us-east-1 and a secondary DB cluster in us-west-2. The applications connect through the global writer endpoint. An unplanned outage makes us-east-1 unavailable. The business accepts losing the last few seconds of writes and requires write traffic to resume as fast as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une base de données globale Amazon Aurora avec son cluster principal dans us-east-1 et un cluster secondaire dans us-west-2. Les applications se connectent via le point de terminaison d'écriture global. Une panne non planifiée rend us-east-1 indisponible. L'entreprise accepte de perdre les dernières secondes d'écritures et exige que les écritures reprennent le plus vite possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run `aws rds failover-global-cluster` with the us-west-2 cluster as the target and the `--allow-data-loss` option.", fr: "Exécuter `aws rds failover-global-cluster` avec le cluster de us-west-2 comme cible et l'option `--allow-data-loss`." } }
    - { id: b, text: { en: "Run `aws rds switchover-global-cluster` with the us-west-2 cluster as the target.", fr: "Exécuter `aws rds switchover-global-cluster` avec le cluster de us-west-2 comme cible." } }
    - { id: c, text: { en: "Restore the latest DB cluster snapshot copy in us-west-2 as a new DB cluster, and update the connection strings.", fr: "Restaurer dans us-west-2 la dernière copie d'instantané de cluster en tant que nouveau cluster, et mettre à jour les chaînes de connexion." } }
    - { id: d, text: { en: "Reboot the writer DB instance of the us-east-1 cluster with failover to an Aurora Replica.", fr: "Redémarrer l'instance d'écriture du cluster de us-east-1 avec basculement vers un réplica Aurora." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A managed global database failover promotes the selected secondary cluster to primary without waiting for replication to catch up, which is the method for an unplanned Regional outage; the `--allow-data-loss` option acknowledges an RPO of a few seconds. Because the applications use the global writer endpoint, they reach the new primary without connection changes.
    fr: |
      Un basculement géré de base de données globale promeut le cluster secondaire choisi en cluster principal sans attendre le rattrapage de la réplication : c'est la méthode pour une panne régionale non planifiée ; l'option `--allow-data-loss` accepte un RPO de quelques secondes. Comme les applications utilisent le point de terminaison d'écriture global, elles atteignent le nouveau cluster principal sans modifier leurs connexions.
  options:
    b: { en: "A switchover is for planned operations: it synchronizes the secondary with a healthy primary first, which is impossible while us-east-1 is down.", fr: "Une permutation (switchover) sert aux opérations planifiées : elle synchronise d'abord le secondaire avec un cluster principal sain, ce qui est impossible tant que us-east-1 est en panne." }
    c: { en: "Restoring a snapshot takes much longer and loses all changes since the snapshot, while the secondary cluster is already up to date within seconds.", fr: "Restaurer un instantané prend bien plus de temps et perd toutes les modifications depuis l'instantané, alors que le cluster secondaire est déjà à jour à quelques secondes près." }
    d: { en: "An in-Region failover cannot help when the whole us-east-1 Region is unavailable.", fr: "Un basculement au sein de la Région ne sert à rien lorsque toute la Région us-east-1 est indisponible." }
references:
  - title: Using switchover or failover in Amazon Aurora Global Database - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html
