id: soac03-2c-s3-suspended-null-version
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon S3 bucket had S3 Versioning enabled for a year. During that time, the object `reports/daily.csv` received two versions with the version IDs `111` and `222`. Last month, an administrator suspended versioning on the bucket. Since then, the application has uploaded `reports/daily.csv` twice more.

    Which versions of `reports/daily.csv` does the bucket now contain?
  fr: |
    S3 Versioning a été activé pendant un an sur un compartiment Amazon S3. Pendant cette période, l'objet `reports/daily.csv` a reçu deux versions avec les ID de version `111` et `222`. Le mois dernier, un administrateur a suspendu la gestion des versions sur le compartiment. Depuis, l'application a chargé `reports/daily.csv` deux fois de plus.

    Quelles versions de `reports/daily.csv` le compartiment contient-il maintenant ?
body:
  options:
    - { id: a, text: { en: "Four versions: `111`, `222`, and two new versions that each have a unique version ID.", fr: "Quatre versions : `111`, `222`, et deux nouvelles versions qui ont chacune un ID de version unique." } }
    - { id: b, text: { en: "Two versions: `111`, and version `222`, which now holds the content of the latest upload.", fr: "Deux versions : `111`, et la version `222`, qui contient désormais le contenu du dernier chargement." } }
    - { id: c, text: { en: "One version with the `null` version ID, because suspending versioning removed the earlier versions.", fr: "Une seule version avec l'ID de version `null`, car la suspension de la gestion des versions a supprimé les versions antérieures." } }
    - { id: d, text: { en: "Three versions: `111`, `222`, and one version with the `null` version ID that holds the latest upload.", fr: "Trois versions : `111`, `222`, et une version avec l'ID de version `null` qui contient le dernier chargement." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In a versioning-suspended bucket, each upload is stored with the `null` version ID and overwrites any existing `null` version. The second upload therefore replaced the first one. Versions with real IDs, such as `111` and `222`, are not affected by the suspension and remain as noncurrent versions.
    fr: |
      Dans un compartiment dont la gestion des versions est suspendue, chaque chargement est stocké avec l'ID de version `null` et écrase toute version `null` existante. Le second chargement a donc remplacé le premier. Les versions dotées d'un véritable ID, comme `111` et `222`, ne sont pas affectées par la suspension et restent des versions non actuelles.
  options:
    a: { en: "After suspension, new uploads no longer receive unique version IDs; they all use the `null` version ID.", fr: "Après la suspension, les nouveaux chargements ne reçoivent plus d'ID de version unique ; ils utilisent tous l'ID de version `null`." }
    b: { en: "Existing versions with real IDs are never overwritten; uploads in a suspended bucket write the `null` version.", fr: "Les versions existantes dotées d'un véritable ID ne sont jamais écrasées ; les chargements dans un compartiment suspendu écrivent la version `null`." }
    c: { en: "Suspending versioning changes only how future requests are handled; it does not delete existing versions.", fr: "La suspension de la gestion des versions ne change que le traitement des requêtes futures ; elle ne supprime pas les versions existantes." }
references:
  - title: Working with objects in a versioning-suspended bucket - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/VersionSuspendedBehavior.html
