id: soac03-2c-fsxw-shadow-plus-backups
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is moving its Windows file shares to an Amazon FSx for Windows File Server Multi-AZ file system with SSD storage. The company has two requirements. First, users must be able to restore files that they changed or deleted earlier the same working day by themselves. Second, if the file system is deleted or corrupted, the operations team must be able to recover the whole file system as it was on any day of the last 30 days.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise déplace ses partages de fichiers Windows vers un système de fichiers Amazon FSx for Windows File Server Multi-AZ avec stockage SSD. L'entreprise a deux exigences. D'abord, les utilisateurs doivent pouvoir restaurer eux-mêmes les fichiers qu'ils ont modifiés ou supprimés plus tôt dans la même journée de travail. Ensuite, si le système de fichiers est supprimé ou corrompu, l'équipe d'exploitation doit pouvoir récupérer l'ensemble du système de fichiers tel qu'il était n'importe quel jour des 30 derniers jours.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the shadow copy storage to UNBOUNDED, and rely on 30 days of shadow copies instead of backups.", fr: "Définir le stockage des clichés instantanés sur UNBOUNDED, et s'appuyer sur 30 jours de clichés instantanés au lieu de sauvegardes." } }
    - { id: b, text: { en: "Rely on the standby file server of the Multi-AZ deployment to recover the file system after a deletion.", fr: "S'appuyer sur le serveur de fichiers de secours du déploiement Multi-AZ pour récupérer le système de fichiers après une suppression." } }
    - { id: c, text: { en: "Enable shadow copies with a custom schedule that takes a shadow copy every hour during working hours.", fr: "Activer les clichés instantanés avec une planification personnalisée qui en prend un toutes les heures pendant les heures de travail." } }
    - { id: d, text: { en: "Turn off automatic daily backups, and take a user-initiated backup at the end of each week.", fr: "Désactiver les sauvegardes quotidiennes automatiques, et effectuer une sauvegarde lancée par l'utilisateur à la fin de chaque semaine." } }
    - { id: e, text: { en: "Keep automatic daily backups, and set their retention period to 30 days.", fr: "Conserver les sauvegardes quotidiennes automatiques, et définir leur période de rétention sur 30 jours." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Hourly shadow copies let users open Previous Versions in Windows File Explorer and restore files changed earlier the same day. Shadow copies are stored with the file system data and are not a substitute for backups, so daily automatic backups with a 30-day retention (configurable from 0 to 90 days) let the team restore the whole file system to a new file system for any of the last 30 days.
    fr: |
      Des clichés instantanés horaires permettent aux utilisateurs d'ouvrir Versions précédentes dans l'Explorateur de fichiers Windows et de restaurer les fichiers modifiés plus tôt dans la journée. Les clichés instantanés sont stockés avec les données du système de fichiers et ne remplacent pas les sauvegardes : des sauvegardes automatiques quotidiennes avec une rétention de 30 jours (configurable de 0 à 90 jours) permettent à l'équipe de restaurer l'ensemble du système de fichiers dans un nouveau système de fichiers pour n'importe lequel des 30 derniers jours.
  options:
    a: { en: "Shadow copies live inside the file system, so they are lost if it is deleted; AWS states that they do not replace backups.", fr: "Les clichés instantanés résident dans le système de fichiers : ils sont perdus si celui-ci est supprimé ; AWS précise qu'ils ne remplacent pas les sauvegardes." }
    b: { en: "The Multi-AZ standby protects availability and replicates every change, including deletions and corruption; it is not a point-in-time copy.", fr: "Le serveur de secours Multi-AZ protège la disponibilité et réplique chaque modification, y compris les suppressions et la corruption ; ce n'est pas une copie à un instant donné." }
    d: { en: "Weekly backups cannot restore the file system as it was on any day, only on the day of each weekly backup.", fr: "Des sauvegardes hebdomadaires ne permettent pas de restaurer le système de fichiers tel qu'il était n'importe quel jour, seulement le jour de chaque sauvegarde hebdomadaire." }
references:
