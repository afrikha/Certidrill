    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/shadow-copies-fsxW.html
  - title: Protecting your data with backups - Amazon FSx for Windows File Server
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/using-backups.html
