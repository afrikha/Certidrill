id: soac03-2a-ec-cmd-read-replicas
objective: "2.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company uses an Amazon ElastiCache for Valkey cluster with cluster mode disabled. The cluster has one primary node with 2 vCPUs and no replicas, and the application sends all reads and writes to the primary endpoint. About 90% of the requests are reads, and the node's CPUUtilization is often above 45%. The company wants to scale read capacity horizontally without changing the node type.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise un cluster Amazon ElastiCache for Valkey avec le mode cluster désactivé. Le cluster comprend un nœud primaire de 2 vCPU sans réplica, et l'application envoie toutes ses lectures et écritures au point de terminaison principal. Environ 90 % des requêtes sont des lectures, et CPUUtilization du nœud dépasse souvent 45 %. L'entreprise veut augmenter horizontalement la capacité de lecture sans changer de type de nœud.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure the application to use the configuration endpoint with an Auto Discovery client.", fr: "Configurer l'application pour utiliser le point de terminaison de configuration avec un client Auto Discovery." } }
    - { id: b, text: { en: "Add read replicas to the cluster.", fr: "Ajouter des réplicas en lecture au cluster." } }
    - { id: c, text: { en: "Change the application to send read requests to the reader endpoint.", fr: "Modifier l'application pour envoyer les requêtes de lecture au point de terminaison du lecteur." } }
    - { id: d, text: { en: "Enable data tiering on the cluster so that reads are served from SSD.", fr: "Activer la hiérarchisation des données (data tiering) sur le cluster pour que les lectures soient servies depuis le SSD." } }
    - { id: e, text: { en: "Increase the reserved memory of the node so that more reads are served from memory.", fr: "Augmenter la mémoire réservée du nœud pour que davantage de lectures soient servies depuis la mémoire." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "For a read-heavy Valkey workload, AWS recommends adding read replicas; a cluster with cluster mode disabled supports up to 5. Writes keep going to the primary endpoint, and the reader endpoint spreads read connections across the replicas, so the application must send its reads there."
    fr: "Pour une charge Valkey dominée par les lectures, AWS recommande d'ajouter des réplicas en lecture ; un cluster dont le mode cluster est désactivé en accepte jusqu'à 5. Les écritures continuent d'aller au point de terminaison principal, et le point de terminaison du lecteur répartit les connexions de lecture entre les réplicas : l'application doit donc y envoyer ses lectures."
  options:
    a:
      en: "Auto Discovery is for Memcached, and the configuration endpoint applies to Memcached and to Valkey with cluster mode enabled, not to this cluster."
      fr: "Auto Discovery concerne Memcached, et le point de terminaison de configuration s'applique à Memcached et à Valkey avec le mode cluster activé, pas à ce cluster."
    d:
      en: "Data tiering needs specific node types, so it would mean changing the node type, and it adds capacity for data rather than read throughput."
      fr: "La hiérarchisation des données exige des types de nœuds précis, donc un changement de type de nœud, et elle ajoute de la capacité de stockage plutôt que du débit de lecture."
    e:
      en: "More reserved memory leaves less memory for data and does nothing to spread the read load across more nodes."
      fr: "Plus de mémoire réservée laisse moins de mémoire pour les données et ne répartit pas la charge de lecture sur davantage de nœuds."
references:
  - title: Finding connection endpoints in ElastiCache
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Endpoints.html
  - title: Which Metrics Should I Monitor?
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/CacheMetrics.WhichShouldIMonitor.html
