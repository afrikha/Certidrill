id: soac03-2a-launch-template-version-pin
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Auto Scaling group is configured to use version 3 of a launch template. An operations engineer created version 5 of the template with a patched AMI and set version 5 as the template's default version. Instances that the group launches still use the old AMI. All instances must run the patched AMI, and they must be replaced gradually without the group's healthy capacity dropping below 90%.

    Which solution will meet these requirements?
  fr: |
    Un groupe Auto Scaling est configuré pour utiliser la version 3 d'un modèle de lancement. Un ingénieur des opérations a créé la version 5 du modèle avec une AMI corrigée et a défini la version 5 comme version par défaut du modèle. Les instances lancées par le groupe utilisent toujours l'ancienne AMI. Toutes les instances doivent exécuter l'AMI corrigée, et elles doivent être remplacées progressivement sans que la capacité saine du groupe descende sous 90 %.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Reboot each instance of the group so that it picks up the default version of the launch template.", fr: "Redémarrer chaque instance du groupe pour qu'elle prenne en compte la version par défaut du modèle de lancement." } }
    - { id: b, text: { en: "Keep the group configuration, and wait for scale-out events to launch instances from version 5.", fr: "Conserver la configuration du groupe, et attendre que les augmentations de capacité lancent des instances à partir de la version 5." } }
    - { id: c, text: { en: "Create version 6 of the template with the same patched AMI, and set version 6 as the default version.", fr: "Créer la version 6 du modèle avec la même AMI corrigée, et définir la version 6 comme version par défaut." } }
    - { id: d, text: { en: "Update the group to use version 5 of the template, and start an instance refresh with a minimum healthy percentage of 90.", fr: "Configurer le groupe pour utiliser la version 5 du modèle, et démarrer une actualisation d'instance avec un pourcentage minimal d'instances saines de 90." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The group launches instances from the launch template version it references, here the specific version 3, so changing the template's default version has no effect on it. Pointing the group at version 5 fixes new launches, and an instance refresh with a minimum healthy percentage of 90 replaces existing instances in a rolling fashion."
    fr: "Le groupe lance ses instances à partir de la version du modèle de lancement qu'il référence, ici la version précise 3 : changer la version par défaut du modèle n'a donc aucun effet sur lui. Configurer le groupe sur la version 5 corrige les nouveaux lancements, et une actualisation d'instance avec un pourcentage minimal d'instances saines de 90 remplace progressivement les instances existantes."
  options:
    a:
      en: "Rebooting an instance keeps its AMI and root volume; a launch template only applies when an instance is launched."
      fr: "Redémarrer une instance conserve son AMI et son volume racine ; un modèle de lancement ne s'applique qu'au lancement d'une instance."
    b:
      en: "The group references version 3, so scale-out events keep launching the old AMI, and existing instances are never replaced."
      fr: "Le groupe référence la version 3 : les augmentations de capacité continuent de lancer l'ancienne AMI, et les instances existantes ne sont jamais remplacées."
    c:
      en: "The group is pinned to version 3, so a new default version is ignored just like version 5 was."
      fr: "Le groupe est fixé sur la version 3 : une nouvelle version par défaut est ignorée, comme la version 5."
references:
  - title: Create an Auto Scaling group using a launch template
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/create-asg-launch-template.html
  - title: Use an instance refresh to update instances in an Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh.html
