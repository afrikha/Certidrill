id: soac03-2c-dr-air-gapped-vault
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company backs up its Amazon EC2 instances and Amazon EFS file systems with AWS Backup in its production account. The ransomware recovery plan states that if the production account is compromised, the company must still be able to restore the backups from a separate recovery account. The backups must be immutable during their retention period, including for administrators of the production account.

    Which solution will meet these requirements?
  fr: |
    Une entreprise sauvegarde ses instances Amazon EC2 et ses systèmes de fichiers Amazon EFS avec AWS Backup dans son compte de production. Le plan de reprise après rançongiciel stipule que, si le compte de production est compromis, l'entreprise doit toujours pouvoir restaurer les sauvegardes depuis un compte de reprise distinct. Les sauvegardes doivent être immuables pendant leur période de rétention, y compris pour les administrateurs du compte de production.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Copy the recovery points to a logically air-gapped vault, and share the vault with the recovery account by using AWS RAM.", fr: "Copier les points de récupération dans un coffre isolé logiquement (logically air-gapped vault), et partager le coffre avec le compte de reprise à l'aide d'AWS RAM." } }
    - { id: b, text: { en: "Apply AWS Backup Vault Lock in governance mode to the backup vault in the production account.", fr: "Appliquer AWS Backup Vault Lock en mode gouvernance au coffre de sauvegarde du compte de production." } }
    - { id: c, text: { en: "Add a copy action that copies the recovery points to a standard backup vault in another Region of the production account.", fr: "Ajouter une action de copie qui copie les points de récupération dans un coffre de sauvegarde standard d'une autre Région du compte de production." } }
    - { id: d, text: { en: "Turn on AWS Backup Audit Manager frameworks in the production account to report on backup compliance.", fr: "Activer les cadres AWS Backup Audit Manager dans le compte de production pour rendre compte de la conformité des sauvegardes." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A logically air-gapped vault is locked by default with Vault Lock in compliance mode, so its retention cannot be shortened or bypassed, and its backups are stored in an AWS Backup service-owned account. The vault can be shared with another account through AWS RAM, and that account can restore the backups even if the owning account is compromised.
    fr: |
      Un coffre isolé logiquement est verrouillé par défaut avec Vault Lock en mode conformité : sa rétention ne peut être ni raccourcie ni contournée, et ses sauvegardes sont stockées dans un compte appartenant au service AWS Backup. Le coffre peut être partagé avec un autre compte via AWS RAM, et ce compte peut restaurer les sauvegardes même si le compte propriétaire est compromis.
  options:
    b: { en: "Governance mode can be removed by users with sufficient permissions, and the backups stay reachable only from the production account.", fr: "Le mode gouvernance peut être retiré par des utilisateurs disposant d'autorisations suffisantes, et les sauvegardes restent accessibles uniquement depuis le compte de production." }
    c: { en: "A copy in another Region of the same account is still controlled by the compromised account's administrators.", fr: "Une copie dans une autre Région du même compte reste contrôlée par les administrateurs du compte compromis." }
    d: { en: "Audit Manager reports on compliance; it does not make the backups immutable or restorable from another account.", fr: "Audit Manager rend compte de la conformité ; il ne rend pas les sauvegardes immuables ni restaurables depuis un autre compte." }
references:
  - title: Logically Air-Gapped Vault - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html
