id: soac03-2b-rds-retention-zero
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A deployment script creates Amazon RDS for PostgreSQL DB instances with `--backup-retention-period 0` to speed up test environments. The same script was reused to create a production DB instance. The operations team discovers that the production DB instance has no automated backups and cannot be restored to a point in time. The company requires point-in-time restore for the last 7 days.

    Which solution will meet this requirement?
  fr: |
    Un script de déploiement crée des instances de base de données Amazon RDS for PostgreSQL avec `--backup-retention-period 0` pour accélérer les environnements de test. Le même script a été réutilisé pour créer une instance de production. L'équipe des opérations découvre que l'instance de production n'a pas de sauvegardes automatisées et ne peut pas être restaurée à un instant dans le passé. L'entreprise exige une restauration à un instant dans le passé sur les 7 derniers jours.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Create a manual DB snapshot every day with a scheduled script and keep the last 7 snapshots.", fr: "Créer chaque jour un instantané manuel de base de données avec un script planifié et conserver les 7 derniers instantanés." } }
    - { id: b, text: { en: "Create a read replica of the DB instance in another Availability Zone.", fr: "Créer un réplica en lecture de l'instance de base de données dans une autre zone de disponibilité." } }
    - { id: c, text: { en: "Turn on Multi-AZ for the DB instance so that the standby keeps the transaction logs.", fr: "Activer Multi-AZ pour l'instance afin que l'instance de secours conserve les journaux de transactions." } }
    - { id: d, text: { en: "Modify the DB instance to set its backup retention period to 7 days.", fr: "Modifier l'instance de base de données pour définir sa période de rétention des sauvegardes sur 7 jours." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A backup retention period of 0 disables automated backups; a value from 1 to 35 days enables them and allows a restore to any point within the retention period. Changing the retention period from 0 to a nonzero value causes an outage, so the team should plan the change for a convenient time.
    fr: |
      Une période de rétention des sauvegardes de 0 désactive les sauvegardes automatisées ; une valeur de 1 à 35 jours les active et permet une restauration à n'importe quel instant de la période de rétention. Passer la période de rétention de 0 à une valeur non nulle provoque une interruption : l'équipe doit planifier la modification à un moment opportun.
  options:
    a: { en: "Daily snapshots allow restores only to the time of each snapshot, not to any point in time, and they add a script to maintain.", fr: "Des instantanés quotidiens ne permettent de restaurer qu'à l'heure de chaque instantané, pas à n'importe quel instant, et ajoutent un script à maintenir." }
    b: { en: "A read replica copies the current data; it does not keep history for a restore to an earlier point in time.", fr: "Un réplica en lecture copie les données actuelles ; il ne conserve pas d'historique pour une restauration à un instant antérieur." }
    c: { en: "A Multi-AZ standby protects availability; point-in-time restore still requires automated backups.", fr: "Une instance de secours Multi-AZ protège la disponibilité ; la restauration à un instant dans le passé exige toujours les sauvegardes automatisées." }
references:
  - title: Backup retention period
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.BackupRetention.html
