id: soac03-2b-spread-placement-group
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a legacy three-node cluster on Amazon EC2 instances. The cluster software requires all nodes to be in the same Availability Zone, and it survives the loss of one node but not of two nodes at once. The company wants to reduce the risk that a single hardware failure in the zone stops more than one node.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster hérité de trois nœuds sur des instances Amazon EC2. Le logiciel de cluster exige que tous les nœuds se trouvent dans la même zone de disponibilité, et il survit à la perte d'un nœud mais pas de deux nœuds en même temps. L'entreprise veut réduire le risque qu'une seule panne matérielle dans la zone arrête plus d'un nœud.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Launch the three instances in a cluster placement group.", fr: "Lancer les trois instances dans un groupe de placement de cluster." } }
    - { id: b, text: { en: "Launch the three instances as Dedicated Instances.", fr: "Lancer les trois instances en tant qu'instances dédiées." } }
    - { id: c, text: { en: "Launch the three instances in a spread placement group.", fr: "Lancer les trois instances dans un groupe de placement réparti (spread)." } }
    - { id: d, text: { en: "Launch the three instances in a partition placement group that has one partition.", fr: "Lancer les trois instances dans un groupe de placement de partition qui comporte une seule partition." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A spread placement group places each instance on a distinct rack, which reduces correlated failures. A rack-level spread placement group supports up to seven running instances per Availability Zone, so the three nodes fit in one zone.
    fr: |
      Un groupe de placement réparti place chaque instance sur un rack distinct, ce qui réduit les pannes corrélées. Un groupe de placement réparti au niveau du rack prend en charge jusqu'à sept instances en cours d'exécution par zone de disponibilité : les trois nœuds tiennent dans une zone.
  options:
    a: { en: "A cluster placement group packs instances close together for low network latency, which increases the risk of correlated failures.", fr: "Un groupe de placement de cluster rapproche les instances pour une faible latence réseau, ce qui augmente le risque de pannes corrélées." }
    b: { en: "Dedicated Instances run on hardware dedicated to one account; they can still share the same host or rack.", fr: "Les instances dédiées s'exécutent sur du matériel dédié à un compte ; elles peuvent toujours partager le même hôte ou le même rack." }
    d: { en: "Instances in the same partition can share racks; a single partition gives no separation between the nodes.", fr: "Les instances d'une même partition peuvent partager des racks ; une partition unique n'apporte aucune séparation entre les nœuds." }
references:
  - title: Placement strategies for your placement groups
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html
