id: soac03-2a-aurora-sv2-promotion-tier
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Aurora Serverless v2 DB cluster has a writer and one reader that exists only to take over if the writer fails. The reader is in promotion tier 2. During peak hours, the writer runs at about 40 ACUs while the reader stays near its minimum capacity. After a test failover, the new writer was slow for several minutes. The reader must be ready to handle the writer's workload at any time.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un cluster de bases de données Amazon Aurora Serverless v2 comprend une instance d'écriture et une instance de lecture qui n'existe que pour prendre le relais en cas de défaillance de l'instance d'écriture. L'instance de lecture est au niveau de promotion 2. Aux heures de pointe, l'instance d'écriture fonctionne à environ 40 ACU, alors que l'instance de lecture reste proche de sa capacité minimale. Après un test de basculement, la nouvelle instance d'écriture a été lente pendant plusieurs minutes. L'instance de lecture doit être prête à tout moment à absorber la charge de l'instance d'écriture.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Set the promotion tier of the reader to 15 so that Aurora gives it more capacity.", fr: "Passer le niveau de promotion de l'instance de lecture à 15 pour qu'Aurora lui donne plus de capacité." } }
    - { id: b, text: { en: "Set the promotion tier of the reader to 0 or 1 so that its capacity scales with the writer.", fr: "Passer le niveau de promotion de l'instance de lecture à 0 ou 1 pour que sa capacité suive celle de l'instance d'écriture." } }
    - { id: c, text: { en: "Configure Aurora Auto Scaling for the cluster so that it adds readers when the writer is busy.", fr: "Configurer Aurora Auto Scaling pour le cluster afin qu'il ajoute des instances de lecture quand l'instance d'écriture est occupée." } }
    - { id: d, text: { en: "Raise the maximum capacity of the cluster so that the reader can scale higher after a failover.", fr: "Relever la capacité maximale du cluster pour que l'instance de lecture puisse monter plus haut après un basculement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Aurora Serverless v2 readers in promotion tiers 0 and 1 scale with the writer: their minimum capacity follows the writer's current capacity, so they can take over the workload right after a failover. Readers in tiers 2 to 15 scale independently on their own load, which is why this reader stayed small."
    fr: "Les instances de lecture Aurora Serverless v2 des niveaux de promotion 0 et 1 suivent l'instance d'écriture : leur capacité minimale s'aligne sur la capacité actuelle de l'instance d'écriture, ce qui leur permet de reprendre la charge juste après un basculement. Les instances des niveaux 2 à 15 s'adaptent indépendamment à leur propre charge, ce qui explique que cette instance soit restée petite."
  options:
    a:
      en: "Tier 15 is the lowest failover priority, and like tiers 2 to 14 it scales independently of the writer."
      fr: "Le niveau 15 est la plus faible priorité de basculement et, comme les niveaux 2 à 14, il évolue indépendamment de l'instance d'écriture."
    c:
      en: "Aurora Auto Scaling adds readers based on the load of the readers; it does not size the failover reader to match the writer."
      fr: "Aurora Auto Scaling ajoute des instances de lecture selon la charge des lecteurs ; il ne dimensionne pas l'instance de basculement sur l'instance d'écriture."
    d:
      en: "A higher maximum does not make an idle reader scale up in advance; it would still start a failover at low capacity."
      fr: "Un maximum plus élevé ne fait pas monter à l'avance une instance de lecture inactive ; elle aborderait toujours un basculement avec une faible capacité."
references:
  - title: How Aurora serverless works
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html
