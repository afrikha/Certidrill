id: soac03-2c-rds-restore-default-groups
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An operator restores an Amazon RDS for Oracle DB instance to a point in time by running the following AWS CLI command. The source DB instance uses a custom DB parameter group and a custom option group.

    ```bash
    aws rds restore-db-instance-to-point-in-time \
      --source-db-instance-identifier erp-prod \
      --target-db-instance-identifier erp-pitr \
      --restore-time 2026-11-18T09:30:00Z
    ```

    After the restore, the application reports errors on `erp-pitr` that do not occur on `erp-prod`.

    Which two settings of `erp-pitr` are different from the source because they were not specified in the command? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un opérateur restaure une instance de base de données Amazon RDS for Oracle à un instant dans le passé en exécutant la commande AWS CLI suivante. L'instance source utilise un groupe de paramètres de base de données personnalisé et un groupe d'options personnalisé.

    ```bash
    aws rds restore-db-instance-to-point-in-time \
      --source-db-instance-identifier erp-prod \
      --target-db-instance-identifier erp-pitr \
      --restore-time 2026-11-18T09:30:00Z
    ```

    Après la restauration, l'application signale sur `erp-pitr` des erreurs qui ne se produisent pas sur `erp-prod`.

    Quels sont les deux paramètres de `erp-pitr` qui diffèrent de la source parce qu'ils n'ont pas été indiqués dans la commande ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The DB engine and its major version", fr: "Le moteur de base de données et sa version majeure" } }
    - { id: b, text: { en: "The DB parameter group", fr: "Le groupe de paramètres de base de données" } }
    - { id: c, text: { en: "The master user name", fr: "Le nom d'utilisateur principal" } }
    - { id: d, text: { en: "The allocated storage size", fr: "La taille du stockage alloué" } }
    - { id: e, text: { en: "The option group", fr: "Le groupe d'options" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A point-in-time restore is automatically associated with the default DB parameter group and the default option group unless custom groups are specified in the request (for example, with `--db-parameter-group-name` and `--option-group-name`). The custom parameters and options of `erp-prod` are therefore missing on `erp-pitr`. The operator can associate the custom groups after the restore or specify them in the next restore.
    fr: |
      Une restauration à un instant dans le passé est automatiquement associée au groupe de paramètres de base de données par défaut et au groupe d'options par défaut, sauf si des groupes personnalisés sont indiqués dans la requête (par exemple avec `--db-parameter-group-name` et `--option-group-name`). Les paramètres et options personnalisés de `erp-prod` manquent donc sur `erp-pitr`. L'opérateur peut associer les groupes personnalisés après la restauration ou les indiquer lors de la prochaine restauration.
  options:
    a: { en: "The restored instance is created from the source's backups and transaction logs, so it runs the same engine and version.", fr: "L'instance restaurée est créée à partir des sauvegardes et des journaux de transactions de la source : elle exécute le même moteur et la même version." }
    c: { en: "Users, including the master user, are part of the restored database data, so the master user name is the same as on the source.", fr: "Les utilisateurs, y compris l'utilisateur principal, font partie des données restaurées : le nom d'utilisateur principal est le même que sur la source." }
    d: { en: "Without `--allocated-storage`, the restore uses the storage size of the source; storage can never be reduced during a restore.", fr: "Sans `--allocated-storage`, la restauration utilise la taille de stockage de la source ; le stockage ne peut jamais être réduit lors d'une restauration." }
references:
  - title: Restoring a DB instance to a specified time for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html
