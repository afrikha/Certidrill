id: soac03-2a-cf-min-ttl-override
objective: "2.1.2"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A cache behavior of an Amazon CloudFront distribution uses a custom cache policy with a minimum TTL of 300 seconds, a default TTL of 3,600 seconds and a maximum TTL of 86,400 seconds. The origin returns the /prices.json object with the header Cache-Control: max-age=60.

    For how long will a CloudFront edge location cache /prices.json before it checks the origin for a newer version?
  fr: |
    Un comportement de cache d'une distribution Amazon CloudFront utilise une politique de cache personnalisée avec une TTL minimale de 300 secondes, une TTL par défaut de 3 600 secondes et une TTL maximale de 86 400 secondes. L'origine renvoie l'objet /prices.json avec l'en-tête Cache-Control: max-age=60.

    Pendant combien de temps un emplacement périphérique CloudFront met-il /prices.json en cache avant de vérifier auprès de l'origine s'il existe une version plus récente ?
body:
  options:
    - { id: a, text: { en: "60 seconds", fr: "60 secondes" } }
    - { id: b, text: { en: "300 seconds", fr: "300 secondes" } }
    - { id: c, text: { en: "3,600 seconds", fr: "3 600 secondes" } }
    - { id: d, text: { en: "86,400 seconds", fr: "86 400 secondes" } }
answer: { optionId: b }
explanation:
  correct:
    en: "When the minimum TTL is greater than 0 and the origin's max-age is lower than the minimum TTL, CloudFront caches the object for the minimum TTL. max-age=60 is below 300, so edge locations keep the object for 300 seconds; viewers' browsers still use the 60-second max-age."
    fr: "Quand la TTL minimale est supérieure à 0 et que le max-age de l'origine est inférieur à la TTL minimale, CloudFront met l'objet en cache pendant la TTL minimale. max-age=60 est inférieur à 300 : les emplacements périphériques gardent l'objet 300 secondes, et les navigateurs des utilisateurs utilisent toujours le max-age de 60 secondes."
  options:
    a:
      en: "max-age is used as is only when it falls between the minimum and maximum TTL; here it is below the minimum TTL."
      fr: "max-age n'est utilisé tel quel que s'il se situe entre la TTL minimale et la TTL maximale ; ici, il est inférieur à la TTL minimale."
    c:
      en: "The default TTL applies only when the origin sends no Cache-Control or Expires header."
      fr: "La TTL par défaut ne s'applique que si l'origine n'envoie ni en-tête Cache-Control ni en-tête Expires."
    d:
      en: "The maximum TTL caps a max-age that is higher than it; it is not used for a max-age below the minimum TTL."
      fr: "La TTL maximale plafonne un max-age qui la dépasse ; elle ne sert pas pour un max-age inférieur à la TTL minimale."
references:
  - title: Manage how long content stays in the cache (expiration)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html
