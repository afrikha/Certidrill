id: soac03-2b-aurora-serverless-tier
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon Aurora PostgreSQL DB cluster uses Aurora Serverless v2 for its writer DB instance and for one reader DB instance in another Availability Zone. The reader was created with promotion tier 3 and receives almost no queries, so it usually runs at the minimum capacity of the cluster. During a recent failover under heavy load, the promoted reader had to scale up, and the application was slow for several minutes. The company wants the reader to be ready to take over the writer's workload at any time.

    Which solution will meet this requirement?
  fr: |
    Un cluster de bases de données Amazon Aurora PostgreSQL utilise Aurora Serverless v2 pour son instance d'écriture et pour une instance de lecture dans une autre zone de disponibilité. L'instance de lecture a été créée avec le niveau de promotion 3 et ne reçoit presque aucune requête : elle fonctionne généralement à la capacité minimale du cluster. Lors d'un récent basculement sous forte charge, l'instance de lecture promue a dû augmenter sa capacité, et l'application a été lente pendant plusieurs minutes. L'entreprise veut que l'instance de lecture soit prête à reprendre à tout moment la charge de l'instance d'écriture.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Increase the maximum capacity in Aurora capacity units (ACUs) of the DB cluster.", fr: "Augmenter la capacité maximale en unités de capacité Aurora (ACU) du cluster." } }
    - { id: b, text: { en: "Add a second Serverless v2 reader in promotion tier 3 in a third Availability Zone.", fr: "Ajouter une seconde instance de lecture Serverless v2 au niveau de promotion 3 dans une troisième zone de disponibilité." } }
    - { id: c, text: { en: "Create an RDS Proxy for the DB cluster and connect the application through it.", fr: "Créer un RDS Proxy pour le cluster et y connecter l'application." } }
    - { id: d, text: { en: "Modify the reader DB instance to use promotion tier 0 or 1.", fr: "Modifier l'instance de lecture pour qu'elle utilise le niveau de promotion 0 ou 1." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For Aurora Serverless v2 readers in promotion tiers 0 and 1, the minimum capacity follows the current capacity of the writer, so these readers are always at least as large as the writer and can take over its workload after a failover. Readers in tiers 2–15 scale independently and can sit at low capacity while the writer is busy. Changing the promotion tier does not trigger a failover.
    fr: |
      Pour les instances de lecture Aurora Serverless v2 aux niveaux de promotion 0 et 1, la capacité minimale suit la capacité actuelle de l'instance d'écriture : ces lecteurs sont toujours au moins aussi grands que l'instance d'écriture et peuvent reprendre sa charge après un basculement. Les lecteurs des niveaux 2 à 15 évoluent indépendamment et peuvent rester à faible capacité pendant que l'instance d'écriture est chargée. Modifier le niveau de promotion ne déclenche pas de basculement.
  options:
    a: { en: "A higher maximum lets instances scale further, but an idle reader in tier 3 still stays near the minimum capacity until it is promoted.", fr: "Un maximum plus élevé permet d'évoluer davantage, mais une instance de lecture inactive au niveau 3 reste proche de la capacité minimale jusqu'à sa promotion." }
    b: { en: "Another reader in tier 3 also scales independently of the writer and has the same problem when it is promoted.", fr: "Une autre instance de lecture au niveau 3 évolue aussi indépendamment de l'instance d'écriture et présente le même problème lors de sa promotion." }
    c: { en: "RDS Proxy helps applications reconnect during a failover; it does not give the promoted reader more capacity.", fr: "RDS Proxy aide les applications à se reconnecter pendant un basculement ; il ne donne pas davantage de capacité à l'instance de lecture promue." }
references:
