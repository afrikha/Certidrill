id: soac03-2b-backup-cold-retention
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company backs up Amazon EFS file systems with AWS Backup. Each recovery point must stay in warm storage for 45 days so that recent restores are fast, and must then move to cold storage to reduce costs. The company wants each recovery point to be deleted as early as AWS Backup allows after it moves to cold storage.

    Which lifecycle settings should the engineer configure in the backup rule?
  fr: |
    Une entreprise sauvegarde des systèmes de fichiers Amazon EFS avec AWS Backup. Chaque point de récupération doit rester 45 jours en stockage chaud pour que les restaurations récentes soient rapides, puis passer en stockage à froid pour réduire les coûts. L'entreprise veut que chaque point de récupération soit supprimé le plus tôt possible après son passage en stockage à froid, dans la limite de ce qu'autorise AWS Backup.

    Quels paramètres de cycle de vie l'ingénieur doit-il configurer dans la règle de sauvegarde ?
body:
  options:
    - { id: a, text: { en: "Move to cold storage after 45 days, and retain for 90 days in total.", fr: "Passage en stockage à froid après 45 jours, et rétention totale de 90 jours." } }
    - { id: b, text: { en: "Move to cold storage after 45 days, and retain for 135 days in total.", fr: "Passage en stockage à froid après 45 jours, et rétention totale de 135 jours." } }
    - { id: c, text: { en: "Move to cold storage after 90 days, and retain for 135 days in total.", fr: "Passage en stockage à froid après 90 jours, et rétention totale de 135 jours." } }
    - { id: d, text: { en: "Move to cold storage after 45 days, and retain for 180 days in total.", fr: "Passage en stockage à froid après 45 jours, et rétention totale de 180 jours." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Recovery points that transition to cold storage must stay there for a minimum of 90 days in addition to the time in warm storage. With a transition after 45 days, the shortest total retention is therefore 45 + 90 = 135 days, which meets both the warm-storage requirement and the earliest deletion.
    fr: |
      Les points de récupération qui passent en stockage à froid doivent y rester au minimum 90 jours en plus du temps passé en stockage chaud. Avec un passage après 45 jours, la rétention totale la plus courte est donc de 45 + 90 = 135 jours, ce qui respecte à la fois l'exigence de stockage chaud et la suppression la plus précoce.
  options:
    a: { en: "A total of 90 days leaves only 45 days in cold storage, below the 90-day minimum.", fr: "Une rétention totale de 90 jours ne laisse que 45 jours en stockage à froid, sous le minimum de 90 jours." }
    c: { en: "A transition after 90 days leaves only 45 days in cold storage, and it keeps recovery points in warm storage longer than required.", fr: "Un passage après 90 jours ne laisse que 45 jours en stockage à froid, et garde les points de récupération en stockage chaud plus longtemps que nécessaire." }
    d: { en: "These settings are valid, but they keep each recovery point 45 days longer than the earliest deletion that AWS Backup allows.", fr: "Ces paramètres sont valides, mais ils conservent chaque point de récupération 45 jours de plus que la suppression la plus précoce autorisée par AWS Backup." }
references:
  - title: Backup plan options and configuration
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/plan-options-and-configuration.html
