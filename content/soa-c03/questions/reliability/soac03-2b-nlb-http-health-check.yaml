id: soac03-2b-nlb-http-health-check
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances behind a Network Load Balancer that has a TCP listener on port 80. The target group uses the default TCP health check. When the application's worker process hangs, the web server still accepts TCP connections on port 80, so the target stays healthy and clients receive errors. The application exposes a `/health` page on port 80 that returns HTTP 500 when the worker process hangs.

    Which solution will remove these targets from service automatically?
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 derrière un Network Load Balancer doté d'un écouteur TCP sur le port 80. Le groupe cible utilise la vérification de l'état TCP par défaut. Lorsque le processus de travail de l'application se bloque, le serveur web accepte toujours les connexions TCP sur le port 80 : la cible reste saine et les clients reçoivent des erreurs. L'application expose une page `/health` sur le port 80 qui renvoie HTTP 500 lorsque le processus de travail est bloqué.

    Quelle solution permet de retirer automatiquement ces cibles du service ?
body:
  options:
    - { id: a, text: { en: "Decrease the health check interval of the target group to 10 seconds and the healthy threshold to 2.", fr: "Réduire l'intervalle de vérification de l'état du groupe cible à 10 secondes et le seuil d'état sain à 2." } }
    - { id: b, text: { en: "Turn on cross-zone load balancing for the Network Load Balancer and its target group.", fr: "Activer l'équilibrage de charge entre zones pour le Network Load Balancer et son groupe cible." } }
    - { id: c, text: { en: "Change the health check protocol of the target group to HTTP and set the health check path to /health.", fr: "Passer le protocole de la vérification de l'état du groupe cible à HTTP et définir le chemin de vérification sur /health." } }
    - { id: d, text: { en: "Set the success codes of the target group health check to 200-299 instead of the default codes.", fr: "Définir les codes de réussite de la vérification de l'état du groupe cible sur 200-299 au lieu des codes par défaut." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Network Load Balancer target groups support TCP, HTTP and HTTPS health checks. A TCP health check only confirms that a connection opens, which still succeeds when the worker hangs. An HTTP health check on `/health` evaluates the status code (200-399 by default for Network Load Balancers), so the HTTP 500 marks the target unhealthy.
    fr: |
      Les groupes cibles de Network Load Balancer prennent en charge des vérifications de l'état TCP, HTTP et HTTPS. Une vérification TCP confirme seulement qu'une connexion s'établit, ce qui réussit encore quand le processus est bloqué. Une vérification HTTP sur `/health` évalue le code d'état (200-399 par défaut pour les Network Load Balancers) : le code HTTP 500 marque la cible comme défaillante.
  options:
    a: { en: "More frequent TCP checks with a lower threshold still succeed because the connection still opens.", fr: "Des vérifications TCP plus fréquentes avec un seuil plus bas réussissent toujours, car la connexion s'établit toujours." }
    b: { en: "Cross-zone load balancing changes how traffic is spread across Availability Zones, not how target health is detected.", fr: "L'équilibrage de charge entre zones modifie la répartition du trafic entre zones de disponibilité, pas la détection de l'état des cibles." }
    d: { en: "Success codes do not apply to TCP health checks, which never read an HTTP status code.", fr: "Les codes de réussite ne s'appliquent pas aux vérifications TCP, qui ne lisent jamais de code d'état HTTP." }
references:
  - title: Health checks for Network Load Balancer target groups
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/target-group-health-checks.html
