id: soac03-2a-asg-maintenance-launch-first
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a licensed reporting server on a single Amazon EC2 instance in an Auto Scaling group with a minimum, maximum and desired capacity of 1. A maximum instance lifetime of 7 days replaces the instance every week to meet a compliance rule. Each replacement causes an outage of several minutes, because the old instance is terminated before the new one is ready. The weekly replacement must continue, and the service must stay available during each replacement.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un serveur de rapports sous licence sur une seule instance Amazon EC2 d'un groupe Auto Scaling dont les capacités minimale, maximale et souhaitée valent 1. Une durée de vie maximale des instances de 7 jours remplace l'instance chaque semaine pour respecter une règle de conformité. Chaque remplacement provoque une interruption de plusieurs minutes, car l'ancienne instance est résiliée avant que la nouvelle soit prête. Le remplacement hebdomadaire doit continuer, et le service doit rester disponible pendant chaque remplacement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable instance scale-in protection on the instance so that it is not terminated until its replacement is in service.", fr: "Activer la protection contre la diminution de la taille sur l'instance pour qu'elle ne soit pas résiliée avant que son remplacement soit en service." } }
    - { id: b, text: { en: "Increase the maximum size of the group to 2, and keep the default replacement behavior.", fr: "Porter la taille maximale du groupe à 2, et conserver le comportement de remplacement par défaut." } }
    - { id: c, text: { en: "Increase the health check grace period of the group so that the new instance has time to start.", fr: "Augmenter la période de grâce de la vérification de l'état du groupe pour laisser à la nouvelle instance le temps de démarrer." } }
    - { id: d, text: { en: "Set an instance maintenance policy with a minimum healthy percentage of 100 and a maximum healthy percentage of 200.", fr: "Définir une politique de maintenance des instances avec un pourcentage minimal d'instances saines de 100 et un pourcentage maximal de 200." } }
answer: { optionId: d }
explanation:
  correct:
    en: "By default, replacements for maximum instance lifetime use terminate and launch, which leaves a one-instance group empty for a while. An instance maintenance policy with a minimum healthy percentage of 100 and a maximum above 100 makes the group launch the new instance and wait until it is healthy and warmed up before it terminates the old one."
    fr: "Par défaut, les remplacements dus à la durée de vie maximale des instances résilient puis lancent, ce qui laisse un groupe d'une seule instance vide pendant un moment. Une politique de maintenance des instances avec un pourcentage minimal de 100 et un maximum supérieur à 100 fait lancer la nouvelle instance par le groupe, qui attend qu'elle soit saine et préchauffée avant de résilier l'ancienne."
  options:
    a:
      en: "Protected instances are not terminated even when they reach their maximum lifetime, so the weekly replacement would stop."
      fr: "Les instances protégées ne sont pas résiliées même quand elles atteignent leur durée de vie maximale : le remplacement hebdomadaire s'arrêterait."
    b:
      en: "A larger maximum size alone does not change the order of the replacement: the default behavior still terminates the old instance first."
      fr: "Une taille maximale plus grande ne change pas à elle seule l'ordre du remplacement : le comportement par défaut résilie toujours l'ancienne instance en premier."
    c:
      en: "The grace period only delays health checks on the new instance. The old instance is still terminated before the new one is ready."
      fr: "La période de grâce retarde seulement les vérifications de l'état de la nouvelle instance. L'ancienne instance est toujours résiliée avant que la nouvelle soit prête."
references:
  - title: Instance maintenance policy for Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/instance-maintenance-policy-overview-and-considerations.html
  - title: Replace Auto Scaling instances based on maximum instance lifetime
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-max-instance-lifetime.html
