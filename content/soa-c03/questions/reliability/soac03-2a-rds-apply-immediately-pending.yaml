id: soac03-2a-rds-apply-immediately-pending
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations engineer scheduled a change of an Amazon RDS for MySQL Single-AZ DB instance from db.r6g.large to db.r6g.xlarge for the next maintenance window. Later that day, during business hours, another engineer changed the backup retention period of the same DB instance from 7 days to 14 days and chose Apply immediately. The DB instance became unavailable for several minutes.

    What caused the outage?
  fr: |
    Un ingénieur des opérations a programmé le passage d'une instance de base de données Amazon RDS for MySQL Single-AZ de db.r6g.large à db.r6g.xlarge pour la prochaine fenêtre de maintenance. Plus tard dans la journée, pendant les heures de bureau, un autre ingénieur a fait passer la période de conservation des sauvegardes de la même instance de 7 à 14 jours en choisissant Apply immediately. L'instance de base de données est devenue indisponible pendant plusieurs minutes.

    Quelle est la cause de l'interruption ?
body:
  options:
    - { id: a, text: { en: "Apply immediately also applied the pending instance class change, which causes downtime.", fr: "Apply immediately a aussi appliqué la modification de classe d'instance en attente, qui provoque une interruption." } }
    - { id: b, text: { en: "A change of the backup retention period between two nonzero values always requires a reboot.", fr: "Un changement de la période de conservation des sauvegardes entre deux valeurs non nulles exige toujours un redémarrage." } }
    - { id: c, text: { en: "Amazon RDS takes a full snapshot when the retention period increases, which suspends I/O for several minutes.", fr: "Amazon RDS prend un instantané complet quand la période de conservation augmente, ce qui suspend les E/S pendant plusieurs minutes." } }
    - { id: d, text: { en: "Apply immediately converts a Single-AZ DB instance to Multi-AZ, which restarts the DB instance.", fr: "Apply immediately convertit une instance de base de données Single-AZ en Multi-AZ, ce qui redémarre l'instance." } }
answer: { optionId: a }
explanation:
  correct:
    en: "When a modification is applied immediately, Amazon RDS also applies every change already in the pending modifications queue instead of waiting for the maintenance window. The queued instance class change requires downtime, so it caused the outage. Pending changes appear in PendingModifiedValues of describe-db-instances and should be checked before using Apply immediately."
    fr: "Quand une modification est appliquée immédiatement, Amazon RDS applique aussi toutes les modifications déjà présentes dans la file des modifications en attente au lieu d'attendre la fenêtre de maintenance. La modification de classe d'instance en attente exige une interruption : c'est elle qui a provoqué la panne. Les modifications en attente apparaissent dans PendingModifiedValues de describe-db-instances et doivent être vérifiées avant d'utiliser Apply immediately."
  options:
    b:
      en: "Changing the retention between nonzero values does not take the DB instance offline; it only changes how long automated backups are kept."
      fr: "Changer la conservation entre deux valeurs non nulles ne met pas l'instance hors ligne ; cela change seulement la durée de conservation des sauvegardes automatisées."
    c:
      en: "Changing the retention period does not start a long I/O suspension; the snapshot-related suspension that RDS documents is very brief."
      fr: "Changer la période de conservation ne déclenche pas de longue suspension des E/S ; la suspension liée aux instantanés documentée par RDS est très brève."
    d:
      en: "Apply immediately only controls when changes are applied; it never converts a DB instance to Multi-AZ on its own."
      fr: "Apply immediately contrôle seulement le moment où les modifications sont appliquées ; il ne convertit jamais de lui-même une instance en Multi-AZ."
references:
  - title: Using the schedule modifications setting
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ModifyInstance.ApplyImmediately.html
  - title: Settings for DB instances
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ModifyInstance.Settings.html
