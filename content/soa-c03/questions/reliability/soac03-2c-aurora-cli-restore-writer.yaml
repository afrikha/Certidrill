id: soac03-2c-aurora-cli-restore-writer
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company automates database recovery with a script. The script restores an Amazon Aurora MySQL-Compatible Edition DB cluster to a point in time with the following AWS CLI command, which succeeds.

    ```bash
    aws rds restore-db-cluster-to-point-in-time \
      --source-db-cluster-identifier sales-prod \
      --db-cluster-identifier sales-recovered \
      --restore-to-time 2026-11-19T06:15:00Z
    ```

    The new cluster `sales-recovered` reaches the `available` status, but the application cannot connect to its cluster endpoint. The `DBClusterMembers` list of the cluster is empty.

    What should the operator add to the script to make the restored cluster usable?
  fr: |
    Une entreprise automatise la reprise de ses bases de données à l'aide d'un script. Le script restaure un cluster de bases de données Amazon Aurora MySQL-Compatible Edition à un instant dans le passé avec la commande AWS CLI suivante, qui réussit.

    ```bash
    aws rds restore-db-cluster-to-point-in-time \
      --source-db-cluster-identifier sales-prod \
      --db-cluster-identifier sales-recovered \
      --restore-to-time 2026-11-19T06:15:00Z
    ```

    Le nouveau cluster `sales-recovered` atteint le statut `available`, mais l'application ne peut pas se connecter à son point de terminaison de cluster. La liste `DBClusterMembers` du cluster est vide.

    Que doit ajouter l'opérateur au script pour rendre le cluster restauré utilisable ?
body:
  options:
    - { id: a, text: { en: "Run `aws rds modify-db-cluster` with `--apply-immediately` on `sales-recovered` to activate the cluster endpoint.", fr: "Exécuter `aws rds modify-db-cluster` avec `--apply-immediately` sur `sales-recovered` pour activer le point de terminaison du cluster." } }
    - { id: b, text: { en: "Run `aws rds create-db-instance` with `--db-cluster-identifier sales-recovered` to create the primary DB instance.", fr: "Exécuter `aws rds create-db-instance` avec `--db-cluster-identifier sales-recovered` pour créer l'instance de base de données principale." } }
    - { id: c, text: { en: "Run `aws rds failover-db-cluster` on `sales-recovered` so that Aurora promotes a writer DB instance.", fr: "Exécuter `aws rds failover-db-cluster` sur `sales-recovered` pour qu'Aurora promeuve une instance de base de données d'écriture." } }
    - { id: d, text: { en: "Run `aws rds reboot-db-cluster` on `sales-recovered` so that its storage volume is mounted.", fr: "Exécuter `aws rds reboot-db-cluster` sur `sales-recovered` pour que son volume de stockage soit monté." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When an Aurora DB cluster is restored to a point in time with the AWS CLI or the RDS API, only the cluster and its storage volume are created. The operator must explicitly create the primary (writer) DB instance with `create-db-instance` and the cluster name in `--db-cluster-identifier`. The console creates the writer automatically, which is why a manual restore worked differently.
    fr: |
      Lorsqu'un cluster de bases de données Aurora est restauré à un instant dans le passé avec l'AWS CLI ou l'API RDS, seuls le cluster et son volume de stockage sont créés. L'opérateur doit créer explicitement l'instance de base de données principale (writer) avec `create-db-instance` et le nom du cluster dans `--db-cluster-identifier`. La console crée l'instance d'écriture automatiquement, ce qui explique qu'une restauration manuelle se comportait différemment.
  options:
    a: { en: "Modifying the cluster does not add compute capacity; a cluster without DB instances has nothing to serve connections.", fr: "Modifier le cluster n'ajoute pas de capacité de calcul ; un cluster sans instance de base de données n'a rien pour servir les connexions." }
    c: { en: "A failover needs at least one Aurora Replica to promote, and the cluster has no DB instance at all.", fr: "Un basculement nécessite au moins un réplica Aurora à promouvoir, et le cluster ne contient aucune instance de base de données." }
    d: { en: "Rebooting does not create a DB instance, and the Aurora storage volume does not need to be mounted by the operator.", fr: "Un redémarrage ne crée pas d'instance de base de données, et le volume de stockage Aurora n'a pas à être monté par l'opérateur." }
references:
  - title: Restoring a DB cluster to a specified time - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-pitr.html
