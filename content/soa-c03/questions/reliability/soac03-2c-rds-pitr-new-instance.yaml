id: soac03-2c-rds-pitr-new-instance
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs its order database on an Amazon RDS for MySQL DB instance with automated backups and a 7-day backup retention period. At 14:05 UTC today, an operator ran a script that deleted thousands of order rows by mistake. The company must recover the database as it was just before the script ran and keep the current DB instance unchanged for investigation.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce de détail exécute sa base de données de commandes sur une instance de base de données Amazon RDS for MySQL avec des sauvegardes automatisées et une période de rétention des sauvegardes de 7 jours. Aujourd'hui à 14:05 UTC, un opérateur a exécuté par erreur un script qui a supprimé des milliers de lignes de commandes. L'entreprise doit récupérer la base de données telle qu'elle était juste avant l'exécution du script et conserver l'instance de base de données actuelle inchangée pour l'enquête.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Reboot the DB instance with failover so that the standby replica takes over with the data from before 14:05.", fr: "Redémarrer l'instance de base de données avec basculement afin que le réplica de secours prenne le relais avec les données d'avant 14:05." } }
    - { id: b, text: { en: "Restore the most recent manual DB snapshot over the existing DB instance, and then replay the binary logs up to 14:04.", fr: "Restaurer l'instantané de base de données manuel le plus récent par-dessus l'instance existante, puis rejouer les journaux binaires jusqu'à 14:04." } }
    - { id: c, text: { en: "Restore the DB instance to a point in time of 14:04 UTC as a new DB instance, and point the application to it.", fr: "Restaurer l'instance de base de données à un instant de 14:04 UTC en tant que nouvelle instance, et faire pointer l'application vers celle-ci." } }
    - { id: d, text: { en: "Create a read replica of the DB instance with a replication delay of 1 hour, and promote the read replica.", fr: "Créer un réplica en lecture de l'instance de base de données avec un délai de réplication d'une heure, et promouvoir le réplica en lecture." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Point-in-time recovery uses the automated backups and transaction logs to create a new DB instance at any time inside the backup retention period. The source DB instance is not modified, so it stays available for the investigation. The application is then pointed to the new instance.
    fr: |
      La restauration à un instant dans le passé utilise les sauvegardes automatisées et les journaux de transactions pour créer une nouvelle instance de base de données à n'importe quel instant de la période de rétention des sauvegardes. L'instance source n'est pas modifiée : elle reste disponible pour l'enquête. L'application est ensuite redirigée vers la nouvelle instance.
  options:
    a: { en: "A Multi-AZ standby is updated synchronously, so it already contains the deletions; a failover does not go back in time.", fr: "Un réplica de secours Multi-AZ est mis à jour de façon synchrone : il contient déjà les suppressions, et un basculement ne revient pas dans le passé." }
    b: { en: "Amazon RDS cannot restore a snapshot over an existing DB instance; every restore creates a new DB instance, and the existing instance must stay unchanged.", fr: "Amazon RDS ne peut pas restaurer un instantané par-dessus une instance existante ; chaque restauration crée une nouvelle instance, et l'instance existante doit rester inchangée." }
    d: { en: "A new read replica starts from the current data, which already lacks the deleted rows, so promoting it does not recover them.", fr: "Un nouveau réplica en lecture part des données actuelles, où les lignes supprimées manquent déjà : sa promotion ne les récupère pas." }
references:
  - title: Restoring a DB instance to a specified time for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html
