id: soac03-2b-r53-calculated-hc
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company serves an API from five Amazon EC2 instances. Each instance is monitored by its own Route 53 health check. The operations team wants one Route 53 health check that stays healthy as long as at least three of the five instances are healthy. A CloudWatch alarm on that health check will then notify the team only when capacity drops below that level.

    Which solution will meet these requirements?
  fr: |
    Une entreprise sert une API depuis cinq instances Amazon EC2. Chaque instance est surveillée par sa propre vérification de l'état Route 53. L'équipe des opérations veut une seule vérification de l'état Route 53 qui reste saine tant qu'au moins trois des cinq instances sont saines. Une alarme CloudWatch sur cette vérification préviendra ensuite l'équipe uniquement quand la capacité passe sous ce niveau.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the failure threshold of each instance health check to 3.", fr: "Définir le seuil d'échec de chaque vérification de l'état d'instance sur 3." } }
    - { id: b, text: { en: "Create a calculated health check that monitors the five health checks and reports healthy when at least 3 of them are healthy.", fr: "Créer une vérification de l'état calculée qui surveille les cinq vérifications et signale un état sain quand au moins 3 d'entre elles sont saines." } }
    - { id: c, text: { en: "Create a health check that monitors a CloudWatch alarm on the percentage of health checkers that report one instance as healthy.", fr: "Créer une vérification de l'état qui surveille une alarme CloudWatch sur le pourcentage de vérificateurs qui signalent une instance comme saine." } }
    - { id: d, text: { en: "Create multivalue answer records for the five instances and associate each record with its health check.", fr: "Créer des enregistrements de réponse à valeurs multiples pour les cinq instances et associer chaque enregistrement à sa vérification de l'état." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A calculated health check monitors other health checks: Route 53 counts the healthy child health checks and compares the count with the threshold that you set ("report healthy when at least x of y selected health checks are healthy"). With a threshold of 3 of 5, the parent becomes unhealthy only when fewer than three instances are healthy, and the alarm can watch that single health check.
    fr: |
      Une vérification de l'état calculée surveille d'autres vérifications : Route 53 compte les vérifications enfants saines et compare ce nombre au seuil défini (« état sain quand au moins x des y vérifications sélectionnées sont saines »). Avec un seuil de 3 sur 5, la vérification parente ne devient défaillante que lorsque moins de trois instances sont saines, et l'alarme peut surveiller cette seule vérification.
  options:
    a: { en: "The failure threshold is the number of consecutive checks needed to change the status of one endpoint; it does not combine several instances.", fr: "Le seuil d'échec est le nombre de vérifications consécutives nécessaires pour changer l'état d'un point de terminaison ; il ne combine pas plusieurs instances." }
    c: { en: "The percentage of health checkers describes one endpoint only; it says nothing about how many of the five instances are healthy.", fr: "Le pourcentage de vérificateurs ne concerne qu'un point de terminaison ; il n'indique pas combien des cinq instances sont saines." }
    d: { en: "Multivalue answer routing returns healthy records to clients; it does not produce a single health check status for an alarm.", fr: "Le routage de réponse à valeurs multiples renvoie des enregistrements sains aux clients ; il ne produit pas un état de vérification unique pour une alarme." }
references:
  - title: Values that you specify when you create or update health checks
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-creating-values.html
  - title: How Amazon Route 53 determines whether a health check is healthy
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-determining-health-of-endpoints.html
