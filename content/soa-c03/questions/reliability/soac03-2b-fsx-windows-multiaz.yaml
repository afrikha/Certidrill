id: soac03-2b-fsx-windows-multiaz
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is creating an Amazon FSx for Windows File Server file system for the home folders of its Windows users. The file system must remain available during an Availability Zone outage and during planned maintenance, and the Windows clients must keep using the same DNS name.

    Which solution will meet these requirements?
  fr: |
    Une entreprise crée un système de fichiers Amazon FSx for Windows File Server pour les dossiers personnels de ses utilisateurs Windows. Le système de fichiers doit rester disponible pendant une panne de zone de disponibilité et pendant la maintenance planifiée, et les clients Windows doivent continuer d'utiliser le même nom DNS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Single-AZ file system and turn on daily automatic backups.", fr: "Créer un système de fichiers Single-AZ et activer les sauvegardes automatiques quotidiennes." } }
    - { id: b, text: { en: "Create a Single-AZ file system and turn on shadow copies for the shares.", fr: "Créer un système de fichiers Single-AZ et activer les clichés instantanés (shadow copies) pour les partages." } }
    - { id: c, text: { en: "Create two Single-AZ file systems in different zones and give the clients both DNS names.", fr: "Créer deux systèmes de fichiers Single-AZ dans des zones différentes et donner les deux noms DNS aux clients." } }
    - { id: d, text: { en: "Create a Multi-AZ file system with its preferred and standby subnets in different zones.", fr: "Créer un système de fichiers Multi-AZ avec ses sous-réseaux préféré et de secours dans des zones différentes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Multi-AZ file system is a high-availability cluster of Windows file servers in a preferred and a standby Availability Zone, with synchronous replication between them. It fails over automatically during a zone outage, a failure of the preferred file server or planned maintenance, and the DNS name stays the same, so the failover is transparent to Windows clients.
    fr: |
      Un système de fichiers Multi-AZ est un cluster haute disponibilité de serveurs de fichiers Windows répartis entre une zone préférée et une zone de secours, avec une réplication synchrone entre elles. Il bascule automatiquement lors d'une panne de zone, d'une défaillance du serveur préféré ou d'une maintenance planifiée, et le nom DNS reste le même : le basculement est transparent pour les clients Windows.
  options:
    a: { en: "Backups allow a restore to a new file system later; a Single-AZ file system is still unavailable during a zone outage or maintenance.", fr: "Les sauvegardes permettent une restauration ultérieure vers un nouveau système de fichiers ; un système Single-AZ reste indisponible pendant une panne de zone ou une maintenance." }
    b: { en: "Shadow copies let users restore earlier versions of files; they do not keep the file server available.", fr: "Les clichés instantanés permettent aux utilisateurs de restaurer des versions antérieures des fichiers ; ils ne maintiennent pas le serveur de fichiers disponible." }
    c: { en: "Two independent file systems hold different data and use different DNS names, so clients would have to switch manually.", fr: "Deux systèmes de fichiers indépendants contiennent des données différentes et utilisent des noms DNS différents : les clients devraient basculer manuellement." }
references:
  - title: "Availability and durability: Single-AZ and Multi-AZ file systems"
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/high-availability-multiAZ.html
