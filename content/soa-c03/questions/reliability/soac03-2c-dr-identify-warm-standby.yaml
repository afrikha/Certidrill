id: soac03-2c-dr-identify-warm-standby
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A new operator reviews the disaster recovery environment of a web application. Production runs in us-east-1 with 24 instances. In us-west-2, an Aurora global database secondary cluster receives continuous replication, an Application Load Balancer is deployed, and the operator gets the following output for the Auto Scaling group. The us-west-2 stack can serve user requests right now, but Route 53 sends it no traffic in normal operation.

    ```json
    {
      "AutoScalingGroupName": "web-dr-usw2",
      "MinSize": 2,
      "DesiredCapacity": 2,
      "MaxSize": 30,
      "Instances": [
        { "InstanceId": "i-0a1b2c3d4e5f60718", "LifecycleState": "InService", "HealthStatus": "Healthy" },
        { "InstanceId": "i-0f9e8d7c6b5a40312", "LifecycleState": "InService", "HealthStatus": "Healthy" }
      ]
    }
    ```

    Which disaster recovery strategy does this environment implement?
  fr: |
    Un nouvel opérateur examine l'environnement de reprise après sinistre d'une application web. La production s'exécute dans us-east-1 avec 24 instances. Dans us-west-2, un cluster secondaire de base de données globale Aurora reçoit une réplication continue, un Application Load Balancer est déployé, et l'opérateur obtient la sortie suivante pour le groupe Auto Scaling. La pile de us-west-2 peut servir des requêtes d'utilisateurs dès maintenant, mais Route 53 ne lui envoie aucun trafic en fonctionnement normal.

    ```json
    {
      "AutoScalingGroupName": "web-dr-usw2",
      "MinSize": 2,
      "DesiredCapacity": 2,
      "MaxSize": 30,
      "Instances": [
        { "InstanceId": "i-0a1b2c3d4e5f60718", "LifecycleState": "InService", "HealthStatus": "Healthy" },
        { "InstanceId": "i-0f9e8d7c6b5a40312", "LifecycleState": "InService", "HealthStatus": "Healthy" }
      ]
    }
    ```

    Quelle stratégie de reprise après sinistre cet environnement met-il en œuvre ?
body:
  options:
    - { id: a, text: { en: "Pilot light", fr: "Veilleuse (pilot light)" } }
    - { id: b, text: { en: "Warm standby", fr: "Secours semi-actif (warm standby)" } }
    - { id: c, text: { en: "Backup and restore", fr: "Sauvegarde et restauration (backup and restore)" } }
    - { id: d, text: { en: "Multi-site active/active", fr: "Multisite actif/actif (multi-site active/active)" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A warm standby runs a scaled-down but fully functional copy of production in the recovery Region, with continuous data replication. It can handle traffic immediately at reduced capacity, as the two healthy instances behind the load balancer show, and it only needs to scale up during a failover.
    fr: |
      Un secours semi-actif exécute dans la Région de reprise une copie réduite mais entièrement fonctionnelle de la production, avec une réplication continue des données. Il peut traiter du trafic immédiatement à capacité réduite, comme le montrent les deux instances saines derrière l'équilibreur de charge, et n'a besoin que de monter en charge lors d'un basculement.
  options:
    a: { en: "In a pilot light, the application servers are switched off, so the Region cannot process requests before they are started.", fr: "Dans une veilleuse, les serveurs d'application sont éteints : la Région ne peut pas traiter de requêtes avant leur démarrage." }
    c: { en: "Backup and restore runs nothing in the recovery Region; it keeps only backups and templates to redeploy.", fr: "La sauvegarde et restauration n'exécute rien dans la Région de reprise ; elle conserve seulement des sauvegardes et des modèles pour redéployer." }
    d: { en: "In active/active, every Region serves production traffic, whereas this Region receives none in normal operation.", fr: "En actif/actif, chaque Région sert du trafic de production, alors que cette Région n'en reçoit aucun en fonctionnement normal." }
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
