id: soac03-2b-asg-single-subnet
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's web application runs on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. The load balancer is enabled in us-west-2a and us-west-2b, but the Auto Scaling group was created with a single subnet in us-west-2a. During an impairment of us-west-2a, the application became unavailable.

    Which solution will make the application tolerate the loss of one Availability Zone?
  fr: |
    L'application web d'une entreprise s'exécute sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer. L'équilibreur de charge est activé dans us-west-2a et us-west-2b, mais le groupe Auto Scaling a été créé avec un seul sous-réseau dans us-west-2a. Lors d'une dégradation de us-west-2a, l'application est devenue indisponible.

    Quelle solution permet à l'application de tolérer la perte d'une zone de disponibilité ?
body:
  options:
    - { id: a, text: { en: "Increase the minimum capacity of the Auto Scaling group from 2 to 4 instances.", fr: "Porter la capacité minimale du groupe Auto Scaling de 2 à 4 instances." } }
    - { id: b, text: { en: "Add a subnet in us-west-2b to the Auto Scaling group.", fr: "Ajouter au groupe Auto Scaling un sous-réseau de us-west-2b." } }
    - { id: c, text: { en: "Turn on cross-zone load balancing for the target group.", fr: "Activer l'équilibrage de charge entre zones pour le groupe cible." } }
    - { id: d, text: { en: "Create a second load balancer in us-west-2b and attach it to the same Auto Scaling group.", fr: "Créer un second équilibreur de charge dans us-west-2b et l'attacher au même groupe Auto Scaling." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Auto Scaling group launches instances only in the Availability Zones of its subnets and balances them across those zones. With a subnet in each zone where the load balancer is enabled, instances run in both zones, and the group launches replacement capacity in the healthy zone if one zone fails.
    fr: |
      Un groupe Auto Scaling ne lance des instances que dans les zones de disponibilité de ses sous-réseaux et les répartit entre ces zones. Avec un sous-réseau dans chaque zone où l'équilibreur est activé, des instances s'exécutent dans les deux zones, et le groupe lance de la capacité de remplacement dans la zone saine si une zone tombe en panne.
  options:
    a: { en: "More instances in the same subnet still fail together with us-west-2a.", fr: "Davantage d'instances dans le même sous-réseau tombent toujours en panne avec us-west-2a." }
    c: { en: "Cross-zone load balancing spreads requests across registered targets; it cannot help when every target is in the failed zone.", fr: "L'équilibrage de charge entre zones répartit les requêtes entre les cibles enregistrées ; il ne sert à rien quand toutes les cibles sont dans la zone en panne." }
    d: { en: "A second load balancer still sends traffic to the same instances, which all run in us-west-2a.", fr: "Un second équilibreur de charge envoie toujours le trafic vers les mêmes instances, qui s'exécutent toutes dans us-west-2a." }
references:
  - title: Auto Scaling group Availability Zone distribution
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-availability-zone-balanced.html
