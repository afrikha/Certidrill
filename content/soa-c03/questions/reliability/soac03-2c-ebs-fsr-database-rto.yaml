id: soac03-2c-ebs-fsr-database-rto
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a self-managed PostgreSQL database on an Amazon EC2 instance. The data is on a 2 TiB Amazon EBS io2 volume, and Amazon Data Lifecycle Manager creates a snapshot every 4 hours. During a recovery test, a volume restored from the latest snapshot showed very high I/O latency for more than an hour, and the database missed its RTO. The database must reach its provisioned performance as soon as the restored volume is attached.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une base de données PostgreSQL autogérée sur une instance Amazon EC2. Les données se trouvent sur un volume Amazon EBS io2 de 2 Tio, et Amazon Data Lifecycle Manager crée un instantané toutes les 4 heures. Lors d'un test de reprise, un volume restauré à partir du dernier instantané a présenté une latence d'E/S très élevée pendant plus d'une heure, et la base de données n'a pas respecté son RTO. La base de données doit atteindre ses performances provisionnées dès que le volume restauré est attaché.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Restore the snapshot to a volume with twice the provisioned IOPS, and reduce the IOPS after the database starts.", fr: "Restaurer l'instantané dans un volume avec deux fois plus d'IOPS provisionnées, et réduire les IOPS après le démarrage de la base de données." } }
    - { id: b, text: { en: "Copy each snapshot to a second Region, and restore the volume from the copy during the recovery.", fr: "Copier chaque instantané dans une seconde Région, et restaurer le volume à partir de la copie pendant la reprise." } }
    - { id: c, text: { en: "Enable fast snapshot restore on the snapshots in the Availability Zone where the volume is restored.", fr: "Activer la restauration rapide d'instantanés (fast snapshot restore) sur les instantanés dans la zone de disponibilité où le volume est restauré." } }
    - { id: d, text: { en: "Restore the snapshot to a gp3 volume with the maximum throughput, and then modify the volume back to io2.", fr: "Restaurer l'instantané dans un volume gp3 avec le débit maximal, puis modifier le volume pour revenir à io2." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A volume created from a snapshot normally loads its blocks from Amazon S3 on first access, which adds latency until the volume is initialized. Fast snapshot restore, enabled per snapshot and per Availability Zone, creates volumes that are fully initialized at creation and deliver their provisioned performance immediately. It is billed per snapshot and per Availability Zone while it is enabled.
    fr: |
      Un volume créé à partir d'un instantané charge normalement ses blocs depuis Amazon S3 lors du premier accès, ce qui ajoute de la latence jusqu'à l'initialisation du volume. La restauration rapide d'instantanés, activée par instantané et par zone de disponibilité, crée des volumes entièrement initialisés dès leur création, qui fournissent immédiatement leurs performances provisionnées. Elle est facturée par instantané et par zone de disponibilité tant qu'elle est activée.
  options:
    a: { en: "More provisioned IOPS do not remove the first-access penalty of blocks that have not been loaded from the snapshot yet.", fr: "Davantage d'IOPS provisionnées ne suppriment pas la pénalité de premier accès des blocs qui n'ont pas encore été chargés depuis l'instantané." }
    b: { en: "A cross-Region copy protects against a Regional outage but restores in the same way, with the same first-access latency.", fr: "Une copie interrégionale protège contre une panne régionale, mais se restaure de la même façon, avec la même latence de premier accès." }
    d: { en: "Changing the volume type does not initialize the blocks, and the extra modification lengthens the recovery.", fr: "Changer de type de volume n'initialise pas les blocs, et la modification supplémentaire allonge la reprise." }
references:
  - title: Amazon EBS fast snapshot restore
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-fast-snapshot-restore.html
