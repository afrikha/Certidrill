id: soac03-2b-backup-windows-vss
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs Microsoft SQL Server on Windows Server Amazon EC2 instances of the m6i.large instance type. An AWS Backup plan backs up the instances every night, but the database team reports that the recovery points are only crash-consistent. The instances already run SSM Agent, have the VSS components installed, and use an instance profile with the permissions that AWS Backup requires for Windows VSS. The company wants application-consistent backups.

    Which solution will meet this requirement?
  fr: |
    Une entreprise exécute Microsoft SQL Server sur des instances Amazon EC2 Windows Server du type m6i.large. Un plan AWS Backup sauvegarde les instances chaque nuit, mais l'équipe des bases de données signale que les points de récupération ne sont que cohérents après plantage (crash-consistent). Les instances exécutent déjà SSM Agent, ont les composants VSS installés et utilisent un profil d'instance doté des autorisations qu'exige AWS Backup pour Windows VSS. L'entreprise veut des sauvegardes cohérentes au niveau de l'application.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Select Windows VSS in the advanced backup settings for Amazon EC2 in the backup plan.", fr: "Sélectionner Windows VSS dans les paramètres de sauvegarde avancés pour Amazon EC2 du plan de sauvegarde." } }
    - { id: b, text: { en: "Replace the backup plan with an Amazon Data Lifecycle Manager policy that creates multi-volume snapshots of the instances.", fr: "Remplacer le plan de sauvegarde par une politique Amazon Data Lifecycle Manager qui crée des instantanés multivolumes des instances." } }
    - { id: c, text: { en: "Change the resource assignment so that the plan backs up the EBS volumes instead of the EC2 instances.", fr: "Modifier l'attribution de ressources pour que le plan sauvegarde les volumes EBS au lieu des instances EC2." } }
    - { id: d, text: { en: "Turn on continuous backups in the backup rule for the EC2 instances.", fr: "Activer les sauvegardes continues dans la règle de sauvegarde pour les instances EC2." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AWS Backup takes application-consistent Windows VSS backups of EC2 instances when Windows VSS is selected in the advanced backup settings of the plan or of an on-demand backup. The prerequisites (SSM Agent, VSS components and an IAM role on the instance) are already met, and m6i.large is not one of the small instance types that VSS backups exclude.
    fr: |
      AWS Backup effectue des sauvegardes Windows VSS cohérentes au niveau de l'application pour les instances EC2 lorsque Windows VSS est sélectionné dans les paramètres de sauvegarde avancés du plan ou d'une sauvegarde à la demande. Les prérequis (SSM Agent, composants VSS et rôle IAM sur l'instance) sont déjà remplis, et m6i.large ne fait pas partie des petits types d'instances exclus des sauvegardes VSS.
  options:
    b: { en: "Multi-volume snapshots are taken at the same point in time across volumes, but they are crash-consistent unless the application is quiesced by other means.", fr: "Les instantanés multivolumes sont pris au même instant sur tous les volumes, mais ils restent cohérents après plantage si l'application n'est pas mise au repos par d'autres moyens." }
    c: { en: "Windows VSS backups are supported for EC2 instances only, so backing up the volumes separately loses the option.", fr: "Les sauvegardes Windows VSS ne sont prises en charge que pour les instances EC2 : sauvegarder les volumes séparément fait perdre cette option." }
    d: { en: "Continuous backups are not available for Amazon EC2, and they would not add VSS coordination.", fr: "Les sauvegardes continues ne sont pas disponibles pour Amazon EC2, et elles n'ajouteraient pas de coordination VSS." }
references:
  - title: Create Windows VSS backups
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/windows-backups.html
