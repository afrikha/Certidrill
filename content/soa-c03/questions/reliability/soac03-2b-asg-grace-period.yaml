id: soac03-2b-asg-grace-period
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an AWS CLI script to create an Auto Scaling group behind an Application Load Balancer. The group uses ELB health checks, and the script does not set a health check grace period. The application needs about 4 minutes to start after an instance launches. During scale-out events, new instances are marked unhealthy and terminated before the application finishes starting, and the group keeps launching replacements. Instances that become unhealthy after they have started must still be replaced automatically.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un script AWS CLI pour créer un groupe Auto Scaling derrière un Application Load Balancer. Le groupe utilise les vérifications de l'état ELB, et le script ne définit pas de délai de grâce de la vérification de l'état. L'application met environ 4 minutes à démarrer après le lancement d'une instance. Lors des augmentations de capacité, les nouvelles instances sont marquées comme défaillantes et résiliées avant la fin du démarrage de l'application, et le groupe lance sans cesse des remplacements. Les instances qui deviennent défaillantes après leur démarrage doivent toujours être remplacées automatiquement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the health check grace period of the Auto Scaling group to 300 seconds.", fr: "Définir le délai de grâce de la vérification de l'état du groupe Auto Scaling sur 300 secondes." } }
    - { id: b, text: { en: "Change the health check type of the Auto Scaling group from ELB to EC2.", fr: "Passer le type de vérification de l'état du groupe Auto Scaling de ELB à EC2." } }
    - { id: c, text: { en: "Increase the deregistration delay of the target group to 300 seconds.", fr: "Porter le délai d'annulation de l'enregistrement du groupe cible à 300 secondes." } }
    - { id: d, text: { en: "Set the default instance warmup of the Auto Scaling group to 300 seconds.", fr: "Définir la préparation d'instance par défaut (default instance warmup) du groupe Auto Scaling sur 300 secondes." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A group created with the AWS CLI or an SDK has a default grace period of 0 seconds (the console default is 300 seconds), so failed ELB health checks terminate instances that are still starting. The grace period is the minimum time that Amazon EC2 Auto Scaling keeps a new instance in service before it terminates it for failing health checks; after that, ELB health checks keep replacing unhealthy instances.
    fr: |
      Un groupe créé avec l'AWS CLI ou un SDK a un délai de grâce par défaut de 0 seconde (300 secondes par défaut dans la console) : les échecs de vérification ELB résilient des instances encore en démarrage. Le délai de grâce est la durée minimale pendant laquelle Amazon EC2 Auto Scaling garde une nouvelle instance en service avant de la résilier pour échec des vérifications ; ensuite, les vérifications ELB continuent de remplacer les instances défaillantes.
  options:
    b: { en: "EC2 health checks ignore the load balancer, so instances whose application fails later would no longer be replaced.", fr: "Les vérifications EC2 ignorent l'équilibreur de charge : les instances dont l'application tombe en panne plus tard ne seraient plus remplacées." }
    c: { en: "The deregistration delay applies to targets that are leaving the target group, not to new targets that are starting.", fr: "Le délai d'annulation de l'enregistrement s'applique aux cibles qui quittent le groupe cible, pas aux nouvelles cibles en démarrage." }
    d: { en: "Instance warmup controls when a new instance contributes to the scaling metrics; it does not delay health check replacement.", fr: "La préparation d'instance détermine quand une nouvelle instance contribue aux métriques de mise à l'échelle ; elle ne retarde pas le remplacement après une vérification de l'état." }
references:
  - title: Set the health check grace period for an Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-check-grace-period.html
