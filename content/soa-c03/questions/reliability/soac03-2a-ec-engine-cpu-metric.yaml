id: soac03-2a-ec-engine-cpu-metric
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon ElastiCache for Valkey cluster uses cache.r7g.xlarge nodes, which have 4 vCPUs. Application latency increases at peak times, but the CPUUtilization metric of the primary node never goes above 30%. An operations engineer must create a CloudWatch alarm that detects when the Valkey engine itself is close to saturation, so that the team can scale the cluster in time.

    Which alarm should the engineer create?
  fr: |
    Un cluster Amazon ElastiCache for Valkey utilise des nœuds cache.r7g.xlarge, qui disposent de 4 vCPU. La latence de l'application augmente en période de pointe, mais la métrique CPUUtilization du nœud primaire ne dépasse jamais 30 %. Un ingénieur des opérations doit créer une alarme CloudWatch qui détecte quand le moteur Valkey lui-même approche de la saturation, afin que l'équipe puisse mettre le cluster à l'échelle à temps.

    Quelle alarme l'ingénieur doit-il créer ?
body:
  options:
    - { id: a, text: { en: "An alarm on CPUUtilization with a threshold of 90%", fr: "Une alarme sur CPUUtilization avec un seuil de 90 %" } }
    - { id: b, text: { en: "An alarm on EngineCPUUtilization with a threshold of 90%", fr: "Une alarme sur EngineCPUUtilization avec un seuil de 90 %" } }
    - { id: c, text: { en: "An alarm on CurrConnections with a threshold based on the maximum number of clients", fr: "Une alarme sur CurrConnections avec un seuil fondé sur le nombre maximal de clients" } }
    - { id: d, text: { en: "An alarm on SwapUsage with a threshold of 50 MB", fr: "Une alarme sur SwapUsage avec un seuil de 50 Mo" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Valkey and Redis OSS process commands on a single engine thread, so on a 4-vCPU node the host-level CPUUtilization stays low even when the engine core is saturated. AWS recommends EngineCPUUtilization, which reports the usage of the engine core, for nodes with 4 vCPUs or more."
    fr: "Valkey et Redis OSS traitent les commandes sur un seul thread de moteur : sur un nœud de 4 vCPU, CPUUtilization au niveau de l'hôte reste faible même quand le cœur du moteur est saturé. AWS recommande EngineCPUUtilization, qui mesure l'utilisation du cœur du moteur, pour les nœuds de 4 vCPU ou plus."
  options:
    a:
      en: "Host-level CPUUtilization averages all 4 vCPUs, so with one saturated engine thread it would rarely reach 90% and the alarm would not fire."
      fr: "CPUUtilization au niveau de l'hôte fait la moyenne des 4 vCPU : avec un seul thread de moteur saturé, elle atteindrait rarement 90 % et l'alarme ne se déclencherait pas."
    c:
      en: "The connection count can point to an application problem, but it does not measure how busy the engine is."
      fr: "Le nombre de connexions peut signaler un problème applicatif, mais il ne mesure pas l'occupation du moteur."
    d:
      en: "SwapUsage is a sign of memory pressure, not of engine CPU saturation."
      fr: "SwapUsage est un signe de pression sur la mémoire, pas de saturation du processeur du moteur."
references:
  - title: Which Metrics Should I Monitor?
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/CacheMetrics.WhichShouldIMonitor.html
