id: soac03-2b-asg-tag-backup
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The Amazon EC2 instances of an Auto Scaling group are replaced often. The company wants AWS Backup to back up every instance of the group daily as an EC2 resource, including instances that the group launches in the future, with the LEAST operational overhead. An AWS Backup plan with a daily rule already exists but has no resource assignment. The Auto Scaling group has no tags.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les instances Amazon EC2 d'un groupe Auto Scaling sont souvent remplacées. L'entreprise veut qu'AWS Backup sauvegarde chaque jour chaque instance du groupe en tant que ressource EC2, y compris les instances que le groupe lancera à l'avenir, avec le MOINS de charge opérationnelle. Un plan AWS Backup avec une règle quotidienne existe déjà, mais n'a aucune attribution de ressources. Le groupe Auto Scaling n'a aucune balise.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a lifecycle hook to the group that starts an on-demand backup job when each instance launches.", fr: "Ajouter au groupe un hook de cycle de vie qui lance une tâche de sauvegarde à la demande au lancement de chaque instance." } }
    - { id: b, text: { en: "Create a resource assignment in the plan that lists the instance IDs that the group currently runs.", fr: "Créer dans le plan une attribution de ressources qui répertorie les ID des instances que le groupe exécute actuellement." } }
    - { id: c, text: { en: "Add the tag backup=daily to the Auto Scaling group with PropagateAtLaunch set to true.", fr: "Ajouter la balise backup=daily au groupe Auto Scaling avec PropagateAtLaunch défini sur true." } }
    - { id: d, text: { en: "Turn on instance scale-in protection for all instances in the group.", fr: "Activer la protection contre la diminution de la capacité (scale-in protection) pour toutes les instances du groupe." } }
    - { id: e, text: { en: "Create a resource assignment in the plan for the EC2 resource type with the tag condition backup=daily.", fr: "Créer dans le plan une attribution de ressources pour le type de ressource EC2 avec la condition de balise backup=daily." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      When an Auto Scaling group launches instances, it adds the group's propagated tags to the instances during resource creation, so every new instance carries `backup=daily`. A tag-based resource assignment includes every resource that has the tag when the backup runs, so replaced instances are covered without any change to the plan.
    fr: |
      Lorsqu'un groupe Auto Scaling lance des instances, il leur ajoute les balises propagées du groupe pendant la création de la ressource : chaque nouvelle instance porte `backup=daily`. Une attribution de ressources par balise inclut toute ressource qui porte la balise au moment de la sauvegarde : les instances remplacées sont couvertes sans modifier le plan.
  options:
    a: { en: "A backup at launch time is not a daily backup, and the hook adds custom code to maintain.", fr: "Une sauvegarde au lancement n'est pas une sauvegarde quotidienne, et le hook ajoute du code personnalisé à maintenir." }
    b: { en: "A static list of instance IDs misses every instance that the group launches later.", fr: "Une liste statique d'ID d'instances ignore toutes les instances que le groupe lancera ensuite." }
    d: { en: "Scale-in protection keeps instances from being terminated during scale-in; it does not add them to a backup plan.", fr: "La protection contre la diminution de la capacité empêche la résiliation d'instances lors d'une réduction ; elle ne les ajoute pas à un plan de sauvegarde." }
references:
  - title: Tag Auto Scaling groups and instances
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-tagging.html
  - title: Assign resources with AWS CLI
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/assigning-resources-json.html
