id: soac03-2b-ecs-hc-traffic-port
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an Amazon ECS service on Amazon EC2 container instances. The task definition uses dynamic host port mapping, so each task listens on a random host port, and the service registers the tasks in an Application Load Balancer target group. Nothing listens on port 80 on the container instances. While troubleshooting an earlier issue, an engineer changed the health check port of the target group from its default value to port 80. Since then, every new task fails its health checks and ECS keeps replacing the tasks.

    Which solution will resolve the issue?
  fr: |
    Une entreprise exécute un service Amazon ECS sur des instances de conteneur Amazon EC2. La définition de tâche utilise le mappage dynamique des ports d'hôte : chaque tâche écoute sur un port d'hôte aléatoire, et le service enregistre les tâches dans un groupe cible d'Application Load Balancer. Rien n'écoute sur le port 80 des instances de conteneur. Lors du dépannage d'un problème précédent, un ingénieur a remplacé la valeur par défaut du port de la vérification de l'état du groupe cible par le port 80. Depuis, chaque nouvelle tâche échoue à ses vérifications de l'état et ECS remplace les tâches en permanence.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Add a rule to the container instances' security group that allows port 80 from the load balancer.", fr: "Ajouter au groupe de sécurité des instances de conteneur une règle qui autorise le port 80 depuis l'équilibreur de charge." } }
    - { id: b, text: { en: "Increase the health check grace period of the ECS service to 10 minutes.", fr: "Porter le délai de grâce de la vérification de l'état du service ECS à 10 minutes." } }
    - { id: c, text: { en: "Create a new target group with the ip target type and register the tasks in it.", fr: "Créer un groupe cible de type de cible ip et y enregistrer les tâches." } }
    - { id: d, text: { en: "Set the health check port of the target group back to traffic-port.", fr: "Remettre le port de la vérification de l'état du groupe cible sur traffic-port." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, the health check port is the port on which each target receives traffic (traffic-port). With dynamic host port mapping, every task is registered with its own host port, so only traffic-port sends each health check to the port where that task listens. A fixed port 80 reaches nothing, and every task fails.
    fr: |
      Par défaut, le port de la vérification de l'état est le port sur lequel chaque cible reçoit le trafic (traffic-port). Avec le mappage dynamique des ports d'hôte, chaque tâche est enregistrée avec son propre port d'hôte : seul traffic-port envoie chaque vérification au port où écoute la tâche. Un port 80 fixe n'atteint rien, et toutes les tâches échouent.
  options:
    a: { en: "Opening port 80 does not help because no process listens on that port on the container instances.", fr: "Ouvrir le port 80 n'aide pas, car aucun processus n'écoute sur ce port sur les instances de conteneur." }
    b: { en: "A grace period only delays the moment when ECS acts on failed checks; the checks still target port 80 and keep failing.", fr: "Un délai de grâce retarde seulement le moment où ECS réagit aux échecs ; les vérifications visent toujours le port 80 et échouent toujours." }
    c: { en: "The ip target type is used with the awsvpc network mode; it does not fix a health check that targets a port where nothing listens.", fr: "Le type de cible ip s'utilise avec le mode réseau awsvpc ; il ne corrige pas une vérification de l'état qui vise un port où rien n'écoute." }
references:
  - title: Health checks for Application Load Balancer target groups
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
