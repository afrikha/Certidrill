id: soac03-2c-rds-rename-keep-endpoint
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company restored its Amazon RDS for PostgreSQL DB instance named `billing` to a point in time before a data corruption. The restored DB instance is named `billing-restored`. Dozens of legacy applications connect to the endpoint of `billing`, and their connection strings cannot be changed in the next few weeks. The company must move the applications to the restored data with the least effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a restauré son instance de base de données Amazon RDS for PostgreSQL nommée `billing` à un instant antérieur à une corruption de données. L'instance restaurée se nomme `billing-restored`. Des dizaines d'applications héritées se connectent au point de terminaison de `billing`, et leurs chaînes de connexion ne peuvent pas être modifiées dans les prochaines semaines. L'entreprise doit faire passer les applications sur les données restaurées avec le moins d'efforts possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Stop the traffic, rename `billing` to `billing-old`, and then rename `billing-restored` to `billing`.", fr: "Arrêter le trafic, renommer `billing` en `billing-old`, puis renommer `billing-restored` en `billing`." } }
    - { id: b, text: { en: "Create a read replica of `billing-restored` named `billing`, and promote it to a standalone DB instance.", fr: "Créer un réplica en lecture de `billing-restored` nommé `billing`, et le promouvoir en instance autonome." } }
    - { id: c, text: { en: "Modify `billing` to use the storage volume of `billing-restored`, and reboot `billing`.", fr: "Modifier `billing` pour qu'elle utilise le volume de stockage de `billing-restored`, et redémarrer `billing`." } }
    - { id: d, text: { en: "Create a Route 53 CNAME record named `billing.db.example.com` in the company's hosted zone that points to `billing-restored`.", fr: "Créer un enregistrement CNAME Route 53 nommé `billing.db.example.com` dans la zone hébergée de l'entreprise qui pointe vers `billing-restored`." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The endpoint of an RDS DB instance contains its identifier, so renaming changes the endpoint. Renaming the original instance frees its name, and giving that name to the restored instance makes it answer on the original endpoint after about 10 minutes, without changing any application. This is the documented way to replace an instance with one restored from a snapshot or a point in time.
    fr: |
      Le point de terminaison d'une instance RDS contient son identifiant : le renommage change donc le point de terminaison. Renommer l'instance d'origine libère son nom, et donner ce nom à l'instance restaurée la fait répondre sur le point de terminaison d'origine après une dizaine de minutes, sans modifier aucune application. C'est la méthode documentée pour remplacer une instance par une instance restaurée à partir d'un instantané ou d'un instant dans le passé.
  options:
    b: { en: "The name `billing` is still used by the original instance, and an extra replica and promotion add time and cost without solving the endpoint problem.", fr: "Le nom `billing` est encore utilisé par l'instance d'origine, et un réplica supplémentaire avec sa promotion ajoutent du temps et des coûts sans régler le problème du point de terminaison." }
    c: { en: "Amazon RDS does not let you attach the storage of one DB instance to another DB instance.", fr: "Amazon RDS ne permet pas d'attacher le stockage d'une instance de base de données à une autre instance." }
    d: { en: "The applications connect to the RDS endpoint of `billing`, not to a company DNS name, so a new record does nothing unless their connection strings change.", fr: "Les applications se connectent au point de terminaison RDS de `billing`, et non à un nom DNS de l'entreprise : un nouvel enregistrement ne sert à rien sans modifier leurs chaînes de connexion." }
references:
  - title: Renaming a DB instance - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_RenameInstance.html
