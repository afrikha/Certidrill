id: soac03-2c-ddb-restore-settings
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A gaming company restores an Amazon DynamoDB table named `Players` to a point in time as a new table named `Players-restored`. The source table uses provisioned capacity with auto scaling, two global secondary indexes, encryption with a customer managed AWS KMS key, and a Time to Live (TTL) attribute that removes expired sessions. Before switching the application to the new table, an operator must reconfigure every setting that the restore did not copy.

    Which two settings must the operator configure on `Players-restored`? (Choose two.)
  fr: |
    Une société de jeux vidéo restaure une table Amazon DynamoDB nommée `Players` à un instant dans le passé dans une nouvelle table nommée `Players-restored`. La table source utilise la capacité provisionnée avec l'auto scaling, deux index secondaires globaux, le chiffrement avec une clé AWS KMS gérée par le client, et un attribut de durée de vie (TTL) qui supprime les sessions expirées. Avant de faire passer l'application sur la nouvelle table, un opérateur doit reconfigurer chaque paramètre que la restauration n'a pas copié.

    Quels sont les deux paramètres que l'opérateur doit configurer sur `Players-restored` ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The global secondary indexes", fr: "Les index secondaires globaux" } }
    - { id: b, text: { en: "The auto scaling policies", fr: "Les politiques d'auto scaling" } }
    - { id: c, text: { en: "The encryption settings", fr: "Les paramètres de chiffrement" } }
    - { id: d, text: { en: "The TTL settings", fr: "Les paramètres TTL" } }
    - { id: e, text: { en: "The provisioned read and write capacity", fr: "La capacité de lecture et d'écriture provisionnée" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A DynamoDB point-in-time restore copies the table data, the global and local secondary indexes, the provisioned capacity and the encryption settings. Auto scaling policies, TTL settings, IAM policies, CloudWatch alarms, tags, Streams settings and the PITR setting are not copied and must be set up manually on the restored table.
    fr: |
      Une restauration DynamoDB à un instant dans le passé copie les données de la table, les index secondaires globaux et locaux, la capacité provisionnée et les paramètres de chiffrement. Les politiques d'auto scaling, les paramètres TTL, les politiques IAM, les alarmes CloudWatch, les balises, les paramètres Streams et le paramètre PITR ne sont pas copiés et doivent être configurés manuellement sur la table restaurée.
  options:
    a: { en: "Global secondary indexes are restored with the table unless the operator excludes them with an override.", fr: "Les index secondaires globaux sont restaurés avec la table, sauf si l'opérateur les exclut par un remplacement (override)." }
    c: { en: "The encryption settings of the source are copied to the restored table.", fr: "Les paramètres de chiffrement de la source sont copiés dans la table restaurée." }
    e: { en: "The provisioned read and write capacity is copied; only the auto scaling policies that adjust it are missing.", fr: "La capacité de lecture et d'écriture provisionnée est copiée ; seules les politiques d'auto scaling qui l'ajustent manquent." }
references:
  - title: Restoring a DynamoDB table to a point in time - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery.Tutorial.html
