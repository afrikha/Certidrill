id: soac03-2a-memcached-auto-discovery
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company scaled out an Amazon ElastiCache for Memcached cluster from 3 to 6 nodes. The application connects to the three original node endpoints, which are listed in its configuration file, so the new nodes receive no traffic. The company adds and removes nodes often and wants the application to use all nodes without configuration changes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a fait passer un cluster Amazon ElastiCache for Memcached de 3 à 6 nœuds. L'application se connecte aux points de terminaison des trois nœuds d'origine, listés dans son fichier de configuration : les nouveaux nœuds ne reçoivent aucun trafic. L'entreprise ajoute et supprime souvent des nœuds et veut que l'application utilise tous les nœuds sans modifier sa configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the application to connect to the reader endpoint of the cluster.", fr: "Modifier l'application pour qu'elle se connecte au point de terminaison du lecteur du cluster." } }
    - { id: b, text: { en: "Create an Amazon Route 53 multivalue answer record that contains the six node endpoints.", fr: "Créer un enregistrement Amazon Route 53 de réponse à valeurs multiples qui contient les six points de terminaison des nœuds." } }
    - { id: c, text: { en: "Change the application to connect to the primary endpoint of the cluster.", fr: "Modifier l'application pour qu'elle se connecte au point de terminaison principal du cluster." } }
    - { id: d, text: { en: "Connect an Auto Discovery client to the configuration endpoint of the cluster.", fr: "Connecter un client Auto Discovery au point de terminaison de configuration du cluster." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With Auto Discovery, the client connects to the configuration endpoint, gets the current list of nodes and connects to all of them. Every node keeps metadata about the other nodes that is updated when nodes are added or removed, so the application follows scaling without hard-coded endpoints."
    fr: "Avec Auto Discovery, le client se connecte au point de terminaison de configuration, obtient la liste actuelle des nœuds et se connecte à tous. Chaque nœud conserve des métadonnées sur les autres nœuds, mises à jour à chaque ajout ou suppression de nœud : l'application suit la mise à l'échelle sans points de terminaison codés en dur."
  options:
    a:
      en: "The reader endpoint exists for Valkey and Redis OSS clusters with cluster mode disabled and replicas, not for Memcached."
      fr: "Le point de terminaison du lecteur existe pour les clusters Valkey et Redis OSS avec le mode cluster désactivé et des réplicas, pas pour Memcached."
    b:
      en: "The DNS record would have to be updated by hand each time a node is added or removed, which the company wants to avoid."
      fr: "L'enregistrement DNS devrait être mis à jour manuellement à chaque ajout ou suppression de nœud, ce que l'entreprise veut éviter."
    c:
      en: "The primary endpoint belongs to Valkey and Redis OSS clusters with cluster mode disabled; Memcached nodes are all read/write and have no primary."
      fr: "Le point de terminaison principal appartient aux clusters Valkey et Redis OSS avec le mode cluster désactivé ; les nœuds Memcached sont tous en lecture/écriture et n'ont pas de primaire."
references:
  - title: Automatically identify nodes in your cluster (Memcached)
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoDiscovery.html
  - title: Finding connection endpoints in ElastiCache
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Endpoints.html
