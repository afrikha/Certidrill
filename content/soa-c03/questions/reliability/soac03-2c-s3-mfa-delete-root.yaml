id: soac03-2c-s3-mfa-delete-root
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company must turn on MFA delete for a versioning-enabled Amazon S3 bucket that stores financial records. An administrator who signs in as an IAM user with full Amazon S3 permissions and an MFA device cannot find any setting for MFA delete in the bucket properties in the console.

    Which solution will meet the requirement?
  fr: |
    Une entreprise doit activer la suppression MFA (MFA delete) pour un compartiment Amazon S3 dont la gestion des versions est activée et qui stocke des registres financiers. Un administrateur connecté en tant qu'utilisateur IAM disposant de toutes les autorisations Amazon S3 et d'un dispositif MFA ne trouve aucun paramètre de suppression MFA dans les propriétés du compartiment de la console.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Attach an IAM policy that requires `aws:MultiFactorAuthPresent` to the administrator, and edit the versioning settings in the console again.", fr: "Attacher à l'administrateur une politique IAM qui exige `aws:MultiFactorAuthPresent`, et modifier de nouveau les paramètres de gestion des versions dans la console." } }
    - { id: b, text: { en: "Turn on S3 Object Lock in governance mode, which enables MFA delete on the bucket.", fr: "Activer S3 Object Lock en mode gouvernance, ce qui active la suppression MFA sur le compartiment." } }
    - { id: c, text: { en: "Ask AWS Support to turn on MFA delete for the bucket, because it cannot be configured by customers.", fr: "Demander à AWS Support d'activer la suppression MFA pour le compartiment, car elle ne peut pas être configurée par les clients." } }
    - { id: d, text: { en: "As the root user of the bucket owner account, run `aws s3api put-bucket-versioning` with `MFADelete=Enabled` and the `--mfa` parameter.", fr: "En tant qu'utilisateur root du compte propriétaire du compartiment, exécuter `aws s3api put-bucket-versioning` avec `MFADelete=Enabled` et le paramètre `--mfa`." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Only the bucket owner's root user can enable MFA delete, and it cannot be enabled in the AWS Management Console. The root user runs `put-bucket-versioning` with `Status=Enabled,MFADelete=Enabled` and passes the MFA device serial number or ARN and a current code in `--mfa`. After that, changing the versioning state or permanently deleting a version requires MFA.
    fr: |
      Seul l'utilisateur root du propriétaire du compartiment peut activer la suppression MFA, et celle-ci ne peut pas être activée dans l'AWS Management Console. L'utilisateur root exécute `put-bucket-versioning` avec `Status=Enabled,MFADelete=Enabled` et transmet dans `--mfa` le numéro de série ou l'ARN du dispositif MFA et un code valide. Ensuite, changer l'état de gestion des versions ou supprimer définitivement une version exige MFA.
  options:
    a: { en: "An IAM condition key controls who can call S3 actions but does not turn on MFA delete, which an IAM user cannot enable and the console does not offer.", fr: "Une clé de condition IAM contrôle qui peut appeler des actions S3 mais n'active pas la suppression MFA, qu'un utilisateur IAM ne peut pas activer et que la console ne propose pas." }
    b: { en: "Object Lock is a separate retention feature; turning it on does not enable MFA delete.", fr: "Object Lock est une fonctionnalité de rétention distincte ; l'activer n'active pas la suppression MFA." }
    c: { en: "MFA delete is configured by the customer through the AWS CLI or the S3 API; no support case is needed.", fr: "La suppression MFA est configurée par le client via l'AWS CLI ou l'API S3 ; aucun dossier de support n'est nécessaire." }
references:
  - title: Configuring MFA delete - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiFactorAuthenticationDelete.html
