id: soac03-2a-cf-origin-request-cookie
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company serves a product catalog through an Amazon CloudFront distribution with a custom origin. The origin reads a cookie named session-analytics to record visits, but the page content is the same for every viewer. The cache behavior uses a custom cache policy that includes all cookies in the cache key, and the cache hit ratio is below 10%. The origin must keep receiving the session-analytics cookie.

    Which solution will increase the cache hit ratio and meet this requirement?
  fr: |
    Une entreprise sert un catalogue de produits via une distribution Amazon CloudFront dotée d'une origine personnalisée. L'origine lit un cookie nommé session-analytics pour enregistrer les visites, mais le contenu des pages est identique pour tous les utilisateurs. Le comportement de cache utilise une politique de cache personnalisée qui inclut tous les cookies dans la clé de cache, et le taux d'accès au cache est inférieur à 10 %. L'origine doit continuer à recevoir le cookie session-analytics.

    Quelle solution augmente le taux d'accès au cache tout en répondant à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Remove cookies from the cache policy, and attach an origin request policy that forwards the session-analytics cookie to the origin.", fr: "Retirer les cookies de la politique de cache, et associer une politique de requête d'origine qui transmet le cookie session-analytics à l'origine." } }
    - { id: b, text: { en: "Keep all cookies in the cache policy, and also add the session-analytics cookie to an origin request policy.", fr: "Conserver tous les cookies dans la politique de cache, et ajouter aussi le cookie session-analytics à une politique de requête d'origine." } }
    - { id: c, text: { en: "Remove cookies from the cache policy, and add a CloudFront function that deletes the session-analytics cookie from viewer requests.", fr: "Retirer les cookies de la politique de cache, et ajouter une fonction CloudFront qui supprime le cookie session-analytics des requêtes des utilisateurs." } }
    - { id: d, text: { en: "Keep the cache policy settings, and increase its default TTL and maximum TTL to 7 days.", fr: "Conserver les paramètres de la politique de cache, et porter sa durée de vie (TTL) par défaut et sa TTL maximale à 7 jours." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Every unique cookie value in the cache key creates a separate cached object, which explains the low hit ratio. An origin request policy sends values to the origin on cache misses without adding them to the cache key, so the origin still gets session-analytics while all viewers share one cached copy of each page."
    fr: "Chaque valeur de cookie distincte dans la clé de cache crée un objet mis en cache différent, ce qui explique le faible taux d'accès au cache. Une politique de requête d'origine envoie des valeurs à l'origine lors des absences dans le cache sans les ajouter à la clé de cache : l'origine reçoit toujours session-analytics, et tous les utilisateurs partagent une seule copie en cache de chaque page."
  options:
    b:
      en: "Values in the cache policy stay in the cache key whatever the origin request policy says, so the hit ratio does not improve."
      fr: "Les valeurs de la politique de cache restent dans la clé de cache quelle que soit la politique de requête d'origine : le taux d'accès au cache ne s'améliore pas."
    c:
      en: "Deleting the cookie in a viewer request function means the origin no longer receives it, which breaks the visit recording."
      fr: "Supprimer le cookie dans une fonction de requête utilisateur empêche l'origine de le recevoir, ce qui casse l'enregistrement des visites."
    d:
      en: "Longer TTLs keep objects longer, but each visitor's unique cookie value still creates its own cache entry, so most requests still miss."
      fr: "Des TTL plus longues gardent les objets plus longtemps, mais la valeur de cookie propre à chaque visiteur crée toujours sa propre entrée de cache : la plupart des requêtes restent des absences."
references:
  - title: Control origin requests with a policy
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-origin-requests.html
  - title: Control the cache key with a policy
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html
