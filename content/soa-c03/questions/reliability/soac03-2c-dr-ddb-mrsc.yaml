id: soac03-2c-dr-ddb-mrsc
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company is building a new ledger service on Amazon DynamoDB that must keep running if an entire AWS Region fails. The disaster recovery requirements state an RPO of zero for every acknowledged write, and every Region must return the latest committed data on strongly consistent reads. The service does not use transactions, TTL or local secondary indexes, and the company accepts higher write latency.

    Which solution will meet these requirements?
  fr: |
    Une société de paiement construit sur Amazon DynamoDB un nouveau service de registre comptable qui doit continuer de fonctionner si une Région AWS entière tombe en panne. Les exigences de reprise après sinistre imposent un RPO nul pour chaque écriture confirmée, et chaque Région doit renvoyer les dernières données validées lors des lectures fortement cohérentes. Le service n'utilise ni transactions, ni TTL, ni index secondaires locaux, et l'entreprise accepte une latence d'écriture plus élevée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a global table with multi-Region eventual consistency (MREC) and replicas in two Regions.", fr: "Créer une table globale avec la cohérence éventuelle multi-Région (MREC) et des réplicas dans deux Régions." } }
    - { id: b, text: { en: "Create a new global table with multi-Region strong consistency (MRSC) across three Regions.", fr: "Créer une nouvelle table globale avec la cohérence forte multi-Région (MRSC) sur trois Régions." } }
    - { id: c, text: { en: "Create a single-Region table with point-in-time recovery, and restore it to another Region during a disaster.", fr: "Créer une table mono-Région avec la PITR, et la restaurer dans une autre Région en cas de sinistre." } }
    - { id: d, text: { en: "Create tables in two Regions, and replicate the items with DynamoDB Streams and an AWS Lambda function.", fr: "Créer des tables dans deux Régions, et répliquer les éléments avec DynamoDB Streams et une fonction AWS Lambda." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An MRSC global table replicates each write synchronously to at least one other Region before the write succeeds, which gives an RPO of zero, and strongly consistent reads return the latest version on any replica. MRSC needs exactly three Regions, as three replicas or two replicas plus a witness, and it must be created from an empty table. It does not support transactions, TTL or local secondary indexes, which the service does not use.
    fr: |
      Une table globale MRSC réplique chaque écriture de façon synchrone vers au moins une autre Région avant que l'écriture ne réussisse, ce qui donne un RPO nul, et les lectures fortement cohérentes renvoient la dernière version sur n'importe quel réplica. MRSC exige exactement trois Régions, sous forme de trois réplicas ou de deux réplicas et un témoin, et doit être créée à partir d'une table vide. Elle ne prend en charge ni les transactions, ni le TTL, ni les index secondaires locaux, que le service n'utilise pas.
  options:
    a: { en: "MREC replicates asynchronously, so its RPO equals the replication delay, and strongly consistent reads can be stale for items written in another Region.", fr: "MREC réplique de façon asynchrone : son RPO égale le délai de réplication, et les lectures fortement cohérentes peuvent être obsolètes pour les éléments écrits dans une autre Région." }
    c: { en: "A PITR restore loses the most recent minutes of writes and takes time, so it gives neither an RPO of zero nor a running service in every Region.", fr: "Une restauration PITR perd les dernières minutes d'écritures et prend du temps : elle n'offre ni un RPO nul ni un service actif dans chaque Région." }
    d: { en: "Stream-based replication is asynchronous custom code, so acknowledged writes can be lost if the Region fails.", fr: "La réplication fondée sur les flux est du code personnalisé asynchrone : des écritures confirmées peuvent être perdues si la Région tombe en panne." }
references:
  - title: How DynamoDB global tables work - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
