id: soac03-2c-dr-restore-testing
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company protects its Amazon RDS databases and Amazon EBS volumes with AWS Backup. Auditors now require proof, every month, that recent recovery points can actually be restored and that each restore finishes within the documented RTO. The restored test resources must not be left running. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise protège ses bases de données Amazon RDS et ses volumes Amazon EBS avec AWS Backup. Les auditeurs exigent désormais la preuve, chaque mois, que des points de récupération récents peuvent réellement être restaurés et que chaque restauration se termine dans le RTO documenté. Les ressources de test restaurées ne doivent pas rester en service. L'entreprise veut la solution avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Schedule an AWS Lambda function each month that starts restore jobs, measures their duration, and deletes the restored resources.", fr: "Planifier chaque mois une fonction AWS Lambda qui lance des tâches de restauration, mesure leur durée et supprime les ressources restaurées." } }
    - { id: b, text: { en: "Turn on AWS Backup Vault Lock in compliance mode on the backup vaults, and send the vault configuration to the auditors.", fr: "Activer AWS Backup Vault Lock en mode conformité sur les coffres de sauvegarde, et transmettre la configuration des coffres aux auditeurs." } }
    - { id: c, text: { en: "Create an AWS Backup restore testing plan with a monthly schedule, and track restore times with AWS Backup Audit Manager.", fr: "Créer un plan de test de restauration AWS Backup avec une planification mensuelle, et suivre les durées de restauration avec AWS Backup Audit Manager." } }
    - { id: d, text: { en: "Create a monthly AWS Backup report of completed backup jobs and their durations, and send it to the auditors.", fr: "Créer un rapport AWS Backup mensuel des tâches de sauvegarde terminées et de leurs durées, et l'envoyer aux auditeurs." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AWS Backup restore testing runs restore jobs on a schedule against selected recovery points, measures how long each restore takes, and deletes the restored resources after a configurable retention period of 1 to 168 hours. Its integration with AWS Backup Audit Manager includes a control that checks whether restores finish within the target restore time, which gives the auditors evidence without custom code.
    fr: |
      Le test de restauration AWS Backup exécute des tâches de restauration planifiées sur des points de récupération sélectionnés, mesure la durée de chaque restauration et supprime les ressources restaurées après une période de rétention configurable de 1 à 168 heures. Son intégration avec AWS Backup Audit Manager comprend un contrôle qui vérifie si les restaurations se terminent dans la durée cible, ce qui fournit des preuves aux auditeurs sans code personnalisé.
  options:
    a: { en: "Custom restore automation works but must be written, tested and maintained, which is more overhead than the managed restore testing feature.", fr: "Une automatisation de restauration personnalisée fonctionne, mais doit être écrite, testée et maintenue, ce qui représente plus de charge que la fonctionnalité gérée de test de restauration." }
    b: { en: "Vault Lock prevents the deletion of recovery points but does not prove that they can be restored within the RTO.", fr: "Vault Lock empêche la suppression des points de récupération, mais ne prouve pas qu'ils peuvent être restaurés dans le RTO." }
    d: { en: "A successful backup job does not prove that the recovery point can be restored or how long the restore takes.", fr: "Une tâche de sauvegarde réussie ne prouve pas que le point de récupération peut être restauré, ni combien de temps prend la restauration." }
references:
  - title: Restore testing - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/restore-testing.html
