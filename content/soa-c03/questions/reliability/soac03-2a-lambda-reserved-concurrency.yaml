id: soac03-2a-lambda-reserved-concurrency
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function is invoked by Amazon S3 Event Notifications when images are uploaded to a bucket. Each invocation writes metadata to an Amazon RDS for PostgreSQL DB instance. During upload peaks, the function scales to hundreds of concurrent executions, and the database runs out of connections. The function must never run more than 50 concurrent executions.

    Which solution will meet this requirement with the LEAST operational overhead?
  fr: |
    Une fonction AWS Lambda est invoquée par les notifications d'événements Amazon S3 lorsque des images sont chargées dans un compartiment. Chaque invocation écrit des métadonnées dans une instance de base de données Amazon RDS for PostgreSQL. Lors des pics de chargement, la fonction monte à plusieurs centaines d'exécutions simultanées, et la base de données manque de connexions. La fonction ne doit jamais dépasser 50 exécutions simultanées.

    Quelle solution répond à cette exigence avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Configure a reserved concurrency of 50 on the function with put-function-concurrency.", fr: "Configurer une simultanéité réservée de 50 sur la fonction avec put-function-concurrency." } }
    - { id: b, text: { en: "Configure a provisioned concurrency of 50 on an alias of the function.", fr: "Configurer une simultanéité provisionnée de 50 sur un alias de la fonction." } }
    - { id: c, text: { en: "Request a decrease of the account's concurrent executions quota in the Region to 50.", fr: "Demander une réduction à 50 du quota d'exécutions simultanées du compte dans la Région." } }
    - { id: d, text: { en: "Increase the memory of the function so that each invocation finishes faster.", fr: "Augmenter la mémoire de la fonction pour que chaque invocation se termine plus vite." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Reserved concurrency sets the maximum number of concurrent executions of a function and reserves that capacity for it, at no extra charge. Limiting concurrency to protect downstream resources such as database connections is one of its documented uses."
    fr: "La simultanéité réservée fixe le nombre maximal d'exécutions simultanées d'une fonction et lui réserve cette capacité, sans frais supplémentaires. Limiter la simultanéité pour protéger des ressources en aval, comme les connexions à une base de données, fait partie de ses usages documentés."
  options:
    b:
      en: "Provisioned concurrency keeps execution environments initialized to reduce startup latency, at an extra cost. It does not cap how far the function can scale."
      fr: "La simultanéité provisionnée garde des environnements d'exécution initialisés pour réduire la latence de démarrage, avec un coût supplémentaire. Elle ne plafonne pas la montée en charge de la fonction."
    c:
      en: "The account quota applies to every function in the Region, so other workloads would be throttled too."
      fr: "Le quota du compte s'applique à toutes les fonctions de la Région : les autres charges de travail seraient aussi limitées."
    d:
      en: "Faster invocations may lower concurrency a little, but nothing guarantees that it stays at 50 or below during peaks."
      fr: "Des invocations plus rapides peuvent réduire un peu la simultanéité, mais rien ne garantit qu'elle reste à 50 ou moins pendant les pics."
references:
  - title: Configuring reserved concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html
