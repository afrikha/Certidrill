id: soac03-2b-r53-hc-prefix-list
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company hosts a public website on Amazon EC2 instances in us-east-1 that have Elastic IP addresses. Route 53 failover records use health checks that monitor each instance by IP address over HTTPS. A security team restricted the instances' security group so that it allows HTTPS only from the CloudFront origin-facing managed prefix list. Since then, all Route 53 health checks report the endpoints as unhealthy, although users reach the website without errors.

    Which solution will make the health checks work with the LEAST operational overhead?
  fr: |
    Une entreprise héberge un site web public sur des instances Amazon EC2 dans us-east-1 qui disposent d'adresses IP Elastic. Des enregistrements de basculement Route 53 utilisent des vérifications de l'état qui surveillent chaque instance par adresse IP en HTTPS. Une équipe de sécurité a restreint le groupe de sécurité des instances pour n'autoriser HTTPS que depuis la liste de préfixes gérée CloudFront orientée vers l'origine. Depuis, toutes les vérifications de l'état Route 53 signalent les points de terminaison comme défaillants, alors que les utilisateurs accèdent au site sans erreur.

    Quelle solution permet de faire fonctionner les vérifications de l'état avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Add an inbound HTTPS rule for the source IP address that appears in the web server logs for the health check requests.", fr: "Ajouter une règle HTTPS entrante pour l'adresse IP source qui apparaît dans les journaux du serveur web pour les requêtes de vérification de l'état." } }
    - { id: b, text: { en: "Change the health checks to TCP health checks on port 443 so that the security group does not evaluate them.", fr: "Transformer les vérifications de l'état en vérifications TCP sur le port 443 pour que le groupe de sécurité ne les évalue pas." } }
    - { id: c, text: { en: "Add an inbound HTTPS rule whose source is the AWS-managed prefix list com.amazonaws.us-east-1.route53-healthchecks.", fr: "Ajouter une règle HTTPS entrante dont la source est la liste de préfixes gérée par AWS com.amazonaws.us-east-1.route53-healthchecks." } }
    - { id: d, text: { en: "Enable latency measurements on the health checks and choose health checker Regions close to us-east-1.", fr: "Activer les mesures de latence sur les vérifications de l'état et choisir des Régions de vérificateurs proches de us-east-1." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Route 53 health checkers connect from their own IP address ranges, which the security group must allow. The AWS-managed prefix list for Route 53 health checks in the Region of the instance adds all the necessary ranges automatically and is maintained by AWS, so no list of addresses has to be updated by hand.
    fr: |
      Les vérificateurs de l'état Route 53 se connectent depuis leurs propres plages d'adresses IP, que le groupe de sécurité doit autoriser. La liste de préfixes gérée par AWS pour les vérifications de l'état Route 53 dans la Région de l'instance ajoute automatiquement toutes les plages nécessaires et est tenue à jour par AWS : aucune liste d'adresses n'est à mettre à jour manuellement.
  options:
    a: { en: "Health checks can come from many addresses, and the address seen in one Region can change at any time, so a single allowed address breaks again.", fr: "Les vérifications proviennent de nombreuses adresses, et l'adresse observée dans une Région peut changer à tout moment : une adresse unique autorisée finit par ne plus suffire." }
    b: { en: "Security groups evaluate every inbound TCP connection; a TCP health check is blocked exactly like an HTTPS one.", fr: "Les groupes de sécurité évaluent chaque connexion TCP entrante ; une vérification TCP est bloquée exactement comme une vérification HTTPS." }
    d: { en: "Latency measurements and the choice of checker Regions do not change the fact that the security group drops the checkers' traffic.", fr: "Les mesures de latence et le choix des Régions de vérificateurs ne changent rien au fait que le groupe de sécurité rejette le trafic des vérificateurs." }
references:
  - title: Configuring router and firewall rules for Amazon Route 53 health checks
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-router-firewall-rules.html
