id: soac03-2a-cf-cache-hit-rate-alarm
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations team wants to be notified when the cache hit rate of an Amazon CloudFront distribution drops below 80%. The distribution's origin is in the eu-west-1 Region, and the team cannot find a cache hit rate metric for the distribution in Amazon CloudWatch.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe des opérations veut être avertie quand le taux d'accès au cache d'une distribution Amazon CloudFront passe sous 80 %. L'origine de la distribution se trouve dans la Région eu-west-1, et l'équipe ne trouve aucune métrique de taux d'accès au cache pour la distribution dans Amazon CloudWatch.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Enable standard logging to Amazon S3, and run scheduled Amazon Athena queries that compute the cache hit rate.", fr: "Activer la journalisation standard vers Amazon S3, et exécuter des requêtes Amazon Athena planifiées qui calculent le taux d'accès au cache." } }
    - { id: b, text: { en: "Turn on additional metrics for the distribution, and create the alarm on the CacheHitRate metric in the eu-west-1 Region.", fr: "Activer les métriques supplémentaires de la distribution, et créer l'alarme sur la métrique CacheHitRate dans la Région eu-west-1." } }
    - { id: c, text: { en: "Send real-time logs to Amazon Kinesis Data Streams, and compute the cache hit rate with an AWS Lambda function.", fr: "Envoyer les journaux en temps réel vers Amazon Kinesis Data Streams, et calculer le taux d'accès au cache avec une fonction AWS Lambda." } }
    - { id: d, text: { en: "Turn on additional metrics for the distribution, and create the alarm on the CacheHitRate metric in the us-east-1 Region.", fr: "Activer les métriques supplémentaires de la distribution, et créer l'alarme sur la métrique CacheHitRate dans la Région us-east-1." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Cache hit rate is one of the additional CloudFront metrics, which must be turned on for each distribution at an extra monthly charge. CloudFront sends its metrics to CloudWatch in US East (N. Virginia), us-east-1, whatever the origin Region, so the alarm must be created there."
    fr: "Le taux d'accès au cache fait partie des métriques CloudFront supplémentaires, qui doivent être activées pour chaque distribution moyennant des frais mensuels. CloudFront envoie ses métriques à CloudWatch dans la Région USA Est (Virginie du Nord), us-east-1, quelle que soit la Région de l'origine : l'alarme doit donc y être créée."
  options:
    a:
      en: "Computing the rate from logs with scheduled queries works but needs custom queries, scheduling and alerting, which is more overhead than a built-in metric."
      fr: "Calculer le taux à partir des journaux avec des requêtes planifiées fonctionne, mais exige des requêtes, une planification et des alertes personnalisées : c'est plus de charge qu'une métrique intégrée."
    b:
      en: "CloudFront metrics are not published in the origin's Region, so no CacheHitRate metric exists in eu-west-1 to alarm on."
      fr: "Les métriques CloudFront ne sont pas publiées dans la Région de l'origine : aucune métrique CacheHitRate n'existe dans eu-west-1 pour créer l'alarme."
    c:
      en: "A real-time log pipeline with custom code is far more to build and run than turning on a built-in metric."
      fr: "Un pipeline de journaux en temps réel avec du code personnalisé demande bien plus de travail à construire et à exploiter que l'activation d'une métrique intégrée."
references:
  - title: View CloudFront and edge function metrics
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewing-cloudfront-metrics.html
