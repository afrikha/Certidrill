id: soac03-2c-dr-pilot-light-failover
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an ordering application in us-east-1 on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer, with an Amazon RDS for MySQL DB instance. For disaster recovery, us-west-2 contains a cross-Region read replica of the DB instance, a copy of the application AMI, a launch template, an Application Load Balancer, and an Auto Scaling group with a minimum and desired capacity of 0. A Region-wide outage affects us-east-1, and the company declares a disaster.

    Which combination of steps should the operations team perform to recover the application in us-west-2? (Choose three.)
  fr: |
    Une entreprise exécute une application de commandes dans us-east-1 sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer, avec une instance de base de données Amazon RDS for MySQL. Pour la reprise après sinistre, us-west-2 contient un réplica en lecture interrégional de l'instance de base de données, une copie de l'AMI de l'application, un modèle de lancement, un Application Load Balancer et un groupe Auto Scaling dont la capacité minimale et souhaitée est de 0. Une panne régionale touche us-east-1, et l'entreprise déclare un sinistre.

    Quelle combinaison d'étapes l'équipe d'exploitation doit-elle effectuer pour récupérer l'application dans us-west-2 ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Promote the read replica in us-west-2 to a standalone DB instance.", fr: "Promouvoir le réplica en lecture de us-west-2 en instance de base de données autonome." } }
    - { id: b, text: { en: "Restore the latest automated DB snapshot of the primary DB instance in us-west-2.", fr: "Restaurer dans us-west-2 le dernier instantané automatisé de l'instance de base de données principale." } }
    - { id: c, text: { en: "Copy the application AMI from us-east-1 to us-west-2 again, and update the launch template to use the copy.", fr: "Copier de nouveau l'AMI de l'application de us-east-1 vers us-west-2, et mettre à jour le modèle de lancement pour qu'il utilise la copie." } }
    - { id: d, text: { en: "Set the minimum and desired capacity of the Auto Scaling group in us-west-2 to the production size.", fr: "Définir la capacité minimale et souhaitée du groupe Auto Scaling de us-west-2 sur la taille de production." } }
    - { id: e, text: { en: "Modify the DB instance in us-east-1 to a Multi-AZ deployment.", fr: "Modifier l'instance de base de données de us-east-1 en déploiement Multi-AZ." } }
    - { id: f, text: { en: "Update the Route 53 record of the application to point to the Application Load Balancer in us-west-2.", fr: "Mettre à jour l'enregistrement Route 53 de l'application pour qu'il pointe vers l'Application Load Balancer de us-west-2." } }
answer: { optionIds: [ a, d, f ] }
explanation:
  correct:
    en: |
      In a pilot light strategy, the data is already replicated and the core infrastructure exists, but the application servers are switched off. Failover therefore promotes the replica so that it accepts writes, scales the Auto Scaling group from 0 to production capacity, and redirects users to the recovery Region by changing DNS.
    fr: |
      Dans une stratégie de veilleuse (pilot light), les données sont déjà répliquées et l'infrastructure de base existe, mais les serveurs d'application sont éteints. Le basculement promeut donc le réplica pour qu'il accepte les écritures, fait passer le groupe Auto Scaling de 0 à la capacité de production, et redirige les utilisateurs vers la Région de reprise en modifiant le DNS.
  options:
    b: { en: "A snapshot loses the changes made since it was taken and takes longer to restore than promoting the continuously updated replica.", fr: "Un instantané perd les modifications effectuées depuis sa création et se restaure plus lentement que la promotion du réplica mis à jour en continu." }
    c: { en: "The AMI is already copied to us-west-2, and an operation that depends on the failed Region should not be part of the failover.", fr: "L'AMI est déjà copiée dans us-west-2, et une opération qui dépend de la Région en panne ne doit pas faire partie du basculement." }
    e: { en: "Changing the failed primary in us-east-1 does not recover the application in us-west-2.", fr: "Modifier l'instance principale en panne de us-east-1 ne récupère pas l'application dans us-west-2." }
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  - title: Promoting a read replica to be a standalone DB instance - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.Promote.html
