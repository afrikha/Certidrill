id: soac03-2a-cf-api-behavior-nocache
objective: "2.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company uses one Amazon CloudFront distribution for its website. The default cache behavior serves static files from an Amazon S3 bucket with the CachingOptimized managed cache policy. The company adds an API that runs behind an Application Load Balancer under the /api/* path. API responses are specific to each user and must never be cached, and the API needs all viewer headers, cookies and query strings.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une entreprise utilise une seule distribution Amazon CloudFront pour son site web. Le comportement de cache par défaut sert des fichiers statiques depuis un compartiment Amazon S3 avec la politique de cache gérée CachingOptimized. L'entreprise ajoute une API qui s'exécute derrière un Application Load Balancer sous le chemin /api/*. Les réponses de l'API sont propres à chaque utilisateur et ne doivent jamais être mises en cache, et l'API a besoin de tous les en-têtes, cookies et chaînes de requête des utilisateurs.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a cache behavior for /api/* that uses the load balancer as its origin and the CachingDisabled managed cache policy.", fr: "Créer un comportement de cache pour /api/* qui utilise l'équilibreur de charge comme origine et la politique de cache gérée CachingDisabled." } }
    - { id: b, text: { en: "Use the CachingOptimized managed cache policy for /api/*, and create an invalidation after each API call.", fr: "Utiliser la politique de cache gérée CachingOptimized pour /api/*, et créer une invalidation après chaque appel d'API." } }
    - { id: c, text: { en: "Attach an origin request policy to the /api/* cache behavior that forwards all viewer headers, cookies and query strings.", fr: "Associer au comportement de cache /api/* une politique de requête d'origine qui transmet tous les en-têtes, cookies et chaînes de requête des utilisateurs." } }
    - { id: d, text: { en: "Change the default cache behavior to the CachingDisabled managed cache policy so that no response is cached.", fr: "Passer le comportement de cache par défaut à la politique de cache gérée CachingDisabled pour qu'aucune réponse ne soit mise en cache." } }
    - { id: e, text: { en: "Enable Origin Shield for the load balancer origin so that API responses are cached in a single Region.", fr: "Activer Origin Shield pour l'origine équilibreur de charge afin que les réponses de l'API soient mises en cache dans une seule Région." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A separate cache behavior for /api/* lets the API use its own origin and policies while static files keep CachingOptimized. CachingDisabled sets all TTLs to 0 and puts nothing in the cache key, so nothing is forwarded beyond the defaults; an origin request policy then sends all viewer headers, cookies and query strings to the API without caching."
    fr: "Un comportement de cache distinct pour /api/* permet à l'API d'utiliser sa propre origine et ses propres politiques, tandis que les fichiers statiques conservent CachingOptimized. CachingDisabled fixe toutes les TTL à 0 et ne met rien dans la clé de cache, donc rien n'est transmis au-delà des valeurs par défaut ; une politique de requête d'origine envoie alors tous les en-têtes, cookies et chaînes de requête des utilisateurs à l'API, sans mise en cache."
  options:
    b:
      en: "CachingOptimized caches responses and ignores cookies and query strings in the cache key, so users could receive each other's data before any invalidation completes."
      fr: "CachingOptimized met les réponses en cache et ignore les cookies et chaînes de requête dans la clé de cache : des utilisateurs pourraient recevoir les données d'autres utilisateurs avant la fin d'une invalidation."
    d:
      en: "Disabling caching on the default behavior removes caching for the static files, which should stay cached, and does not route /api/* to the load balancer."
      fr: "Désactiver la mise en cache du comportement par défaut supprime la mise en cache des fichiers statiques, qui doivent rester en cache, et n'achemine pas /api/* vers l'équilibreur de charge."
    e:
      en: "Origin Shield is an extra caching layer for cacheable content; it does not prevent caching and does not forward viewer values."
      fr: "Origin Shield est une couche de cache supplémentaire pour le contenu pouvant être mis en cache ; il n'empêche pas la mise en cache et ne transmet pas les valeurs des utilisateurs."
references:
  - title: Use managed cache policies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html
  - title: Control origin requests with a policy
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-origin-requests.html
