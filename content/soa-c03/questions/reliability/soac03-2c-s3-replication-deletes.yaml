id: soac03-2c-s3-replication-deletes
objective: "2.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An operator reviews the replication configuration of a versioning-enabled Amazon S3 bucket. The source bucket also has a lifecycle rule that expires current versions after 365 days.

    ```json
    {
      "Role": "arn:aws:iam::111122223333:role/s3-replication",
      "Rules": [
        { "ID": "docs", "Priority": 1, "Status": "Enabled",
          "Filter": { "Prefix": "docs/" },
          "DeleteMarkerReplication": { "Status": "Enabled" },
          "Destination": { "Bucket": "arn:aws:s3:::dr-docs" } },
        { "ID": "tagged", "Priority": 2, "Status": "Enabled",
          "Filter": { "Tag": { "Key": "replicate", "Value": "yes" } },
          "DeleteMarkerReplication": { "Status": "Disabled" },
          "Destination": { "Bucket": "arn:aws:s3:::dr-docs" } }
      ]
    }
    ```

    Which two statements about deletions in the source bucket are true? (Choose two.)
  fr: |
    Un opérateur examine la configuration de réplication d'un compartiment Amazon S3 dont la gestion des versions est activée. Le compartiment source comporte aussi une règle de cycle de vie qui fait expirer les versions actuelles après 365 jours.

    ```json
    {
      "Role": "arn:aws:iam::111122223333:role/s3-replication",
      "Rules": [
        { "ID": "docs", "Priority": 1, "Status": "Enabled",
          "Filter": { "Prefix": "docs/" },
          "DeleteMarkerReplication": { "Status": "Enabled" },
          "Destination": { "Bucket": "arn:aws:s3:::dr-docs" } },
        { "ID": "tagged", "Priority": 2, "Status": "Enabled",
          "Filter": { "Tag": { "Key": "replicate", "Value": "yes" } },
          "DeleteMarkerReplication": { "Status": "Disabled" },
          "Destination": { "Bucket": "arn:aws:s3:::dr-docs" } }
      ]
    }
    ```

    Quelles sont les deux affirmations vraies concernant les suppressions dans le compartiment source ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A delete request that specifies a version ID of an object under `docs/` removes that version only from the source bucket.", fr: "Une demande de suppression qui indique un ID de version d'un objet sous `docs/` supprime cette version uniquement du compartiment source." } }
    - { id: b, text: { en: "A delete request without a version ID for a tagged object outside `docs/` adds a delete marker in both buckets.", fr: "Une demande de suppression sans ID de version pour un objet balisé hors de `docs/` ajoute un marqueur de suppression dans les deux compartiments." } }
    - { id: c, text: { en: "Changing the `tagged` rule to enable delete marker replication will make its delete markers replicate.", fr: "Modifier la règle `tagged` pour activer la réplication des marqueurs de suppression fera répliquer ses marqueurs de suppression." } }
    - { id: d, text: { en: "Delete markers that the lifecycle expiration rule creates under `docs/` are not replicated to `dr-docs`.", fr: "Les marqueurs de suppression que la règle d'expiration du cycle de vie crée sous `docs/` ne sont pas répliqués vers `dr-docs`." } }
    - { id: e, text: { en: "Permanent deletions of object versions under `docs/` are replicated because delete marker replication is enabled.", fr: "Les suppressions définitives de versions d'objets sous `docs/` sont répliquées, car la réplication des marqueurs de suppression est activée." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A DELETE request with a version ID deletes that version in the source bucket only; S3 never replicates it, which protects the replica from malicious deletions. Delete markers created by an S3 Lifecycle expiration rule on the source bucket are not replicated either, even when delete marker replication is enabled for the rule.
    fr: |
      Une demande DELETE avec un ID de version supprime cette version uniquement dans le compartiment source ; S3 ne la réplique jamais, ce qui protège le réplica contre les suppressions malveillantes. Les marqueurs de suppression créés par une règle d'expiration S3 Lifecycle sur le compartiment source ne sont pas répliqués non plus, même lorsque la réplication des marqueurs de suppression est activée pour la règle.
  options:
    b: { en: "The `tagged` rule does not replicate delete markers, so the delete marker is added only in the source bucket.", fr: "La règle `tagged` ne réplique pas les marqueurs de suppression : le marqueur est ajouté uniquement dans le compartiment source." }
    c: { en: "Delete marker replication is not supported for tag-based replication rules.", fr: "La réplication des marqueurs de suppression n'est pas prise en charge pour les règles de réplication fondées sur des balises." }
    e: { en: "Delete marker replication copies delete markers only; deletions of specific versions are never replicated.", fr: "La réplication des marqueurs de suppression ne copie que les marqueurs ; les suppressions de versions précises ne sont jamais répliquées." }
references:
  - title: What does Amazon S3 replicate? - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-what-is-isnot-replicated.html
  - title: Replicating delete markers between buckets - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/delete-marker-replication.html
