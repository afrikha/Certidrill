id: soac03-2a-target-tracking-two-policies
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Auto Scaling group behind an Application Load Balancer has two target tracking scaling policies. One policy keeps ASGAverageCPUUtilization at 60%, and the other keeps ALBRequestCountPerTarget at 1,000. Scale-in is enabled in both policies. The current metrics show an average CPU utilization of 35% and 1,400 requests per target. The group is between its minimum and maximum size, and no instances are warming up.

    How will Amazon EC2 Auto Scaling respond?
  fr: |
    Un groupe Auto Scaling placé derrière un Application Load Balancer possède deux politiques de suivi de cible. L'une maintient ASGAverageCPUUtilization à 60 %, et l'autre maintient ALBRequestCountPerTarget à 1 000. La diminution de capacité est activée dans les deux politiques. Les métriques actuelles indiquent une utilisation moyenne du processeur de 35 % et 1 400 requêtes par cible. Le groupe se situe entre sa taille minimale et sa taille maximale, et aucune instance n'est en cours de préchauffage.

    Comment Amazon EC2 Auto Scaling va-t-il réagir ?
body:
  options:
    - { id: a, text: { en: "It scales in, because the CPU utilization policy is below its target and has scale-in enabled.", fr: "Il réduit la capacité, car la politique d'utilisation du processeur est sous sa cible et a la diminution activée." } }
    - { id: b, text: { en: "It scales out, because one policy is above its target and any policy can start a scale-out.", fr: "Il augmente la capacité, car une politique est au-dessus de sa cible et n'importe quelle politique peut déclencher une augmentation." } }
    - { id: c, text: { en: "It makes no change, because the two policies disagree and cancel each other out.", fr: "Il ne change rien, car les deux politiques sont en désaccord et s'annulent." } }
    - { id: d, text: { en: "It scales out only after the CPU utilization policy also rises above its target.", fr: "Il n'augmente la capacité qu'une fois que la politique d'utilisation du processeur dépasse aussi sa cible." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With several target tracking policies, the group scales out as soon as any policy is ready to scale out, and it scales in only when all policies that have scale-in enabled are ready to scale in. The request count policy is 40% above its target, so the group adds instances even though CPU utilization is low."
    fr: "Avec plusieurs politiques de suivi de cible, le groupe augmente sa capacité dès qu'une politique est prête à le faire, et ne la réduit que lorsque toutes les politiques dont la diminution est activée sont prêtes à réduire. La politique sur le nombre de requêtes dépasse sa cible de 40 % : le groupe ajoute des instances même si l'utilisation du processeur est faible."
  options:
    a:
      en: "Scale-in needs every policy with scale-in enabled to agree, and the request count policy wants more capacity."
      fr: "La diminution exige l'accord de toutes les politiques dont la diminution est activée, et la politique sur le nombre de requêtes demande plus de capacité."
    c:
      en: "The policies do not cancel each other: availability wins, and the scale-out request is applied."
      fr: "Les politiques ne s'annulent pas : la disponibilité l'emporte, et la demande d'augmentation est appliquée."
    d:
      en: "Each policy can start a scale-out on its own; the group does not wait for all policies to be above target."
      fr: "Chaque politique peut déclencher seule une augmentation ; le groupe n'attend pas que toutes les politiques dépassent leur cible."
references:
  - title: Target tracking scaling policies for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
