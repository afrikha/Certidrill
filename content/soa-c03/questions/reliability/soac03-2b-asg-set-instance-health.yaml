id: soac03-2b-asg-set-instance-health
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a batch-processing fleet of Amazon EC2 instances in an Auto Scaling group that is not attached to a load balancer. A monitoring script on each instance detects when the processing agent enters a failed state that only a new instance can fix. In that state, the instance still passes its EC2 status checks. The company wants the Auto Scaling group to replace such an instance as soon as the script detects the failure.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une flotte de traitement par lots d'instances Amazon EC2 dans un groupe Auto Scaling qui n'est attaché à aucun équilibreur de charge. Un script de surveillance sur chaque instance détecte quand l'agent de traitement entre dans un état d'échec que seule une nouvelle instance peut corriger. Dans cet état, l'instance réussit toujours ses vérifications du statut EC2. L'entreprise veut que le groupe Auto Scaling remplace une telle instance dès que le script détecte l'échec.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Make the script run aws autoscaling enter-standby for the instance.", fr: "Faire exécuter par le script aws autoscaling enter-standby pour l'instance." } }
    - { id: b, text: { en: "Make the script run aws ec2 reboot-instances for the instance.", fr: "Faire exécuter par le script aws ec2 reboot-instances pour l'instance." } }
    - { id: c, text: { en: "Make the script stop the processing agent so that the instance fails its EC2 status checks.", fr: "Faire arrêter l'agent de traitement par le script pour que l'instance échoue à ses vérifications du statut EC2." } }
    - { id: d, text: { en: "Make the script run aws autoscaling set-instance-health with --health-status Unhealthy for the instance.", fr: "Faire exécuter par le script aws autoscaling set-instance-health avec --health-status Unhealthy pour l'instance." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A custom health check reports the result of your own checks to Amazon EC2 Auto Scaling: `set-instance-health --health-status Unhealthy` marks the instance unhealthy, and the group terminates it and launches a replacement. By default, the command respects the health check grace period of the group.
    fr: |
      Une vérification de l'état personnalisée transmet à Amazon EC2 Auto Scaling le résultat de vos propres contrôles : `set-instance-health --health-status Unhealthy` marque l'instance comme défaillante, et le groupe la résilie et lance un remplacement. Par défaut, la commande respecte le délai de grâce de la vérification de l'état du groupe.
  options:
    a: { en: "An instance in Standby stays in the group and keeps running; it is taken out of service, not replaced by a new instance.", fr: "Une instance à l'état Standby reste dans le groupe et continue de s'exécuter ; elle est retirée du service, pas remplacée par une nouvelle instance." }
    b: { en: "A reboot keeps the same instance, and the failure can only be fixed by a new instance.", fr: "Un redémarrage conserve la même instance, alors que l'échec ne peut être corrigé que par une nouvelle instance." }
    c: { en: "EC2 status checks test the instance and its host, not the processes that run on it, so stopping the agent does not make them fail.", fr: "Les vérifications du statut EC2 testent l'instance et son hôte, pas les processus qui y tournent : arrêter l'agent ne les fait pas échouer." }
references:
  - title: Set up a custom health check for your Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/set-up-a-custom-health-check.html
