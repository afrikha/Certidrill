id: soac03-2a-ec-cmd-scale-up-writes
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon ElastiCache for Valkey cluster with cluster mode disabled, one primary node and two replicas. The application uses the primary endpoint for writes and the reader endpoint for reads, and its client library does not support cluster mode. The workload has become write-heavy, and EngineCPUUtilization of the primary node stays above 90% at peak, while the replicas are lightly used. The company does not want to change the application.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un cluster Amazon ElastiCache for Valkey avec le mode cluster désactivé, un nœud primaire et deux réplicas. L'application utilise le point de terminaison principal pour les écritures et le point de terminaison du lecteur pour les lectures, et sa bibliothèque cliente ne prend pas en charge le mode cluster. La charge de travail est devenue dominée par les écritures, et EngineCPUUtilization du nœud primaire reste au-dessus de 90 % en pointe, alors que les réplicas sont peu utilisés. L'entreprise ne veut pas modifier l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add three more replicas to the cluster, and keep sending reads to the reader endpoint.", fr: "Ajouter trois réplicas supplémentaires au cluster, et continuer à envoyer les lectures au point de terminaison du lecteur." } }
    - { id: b, text: { en: "Scale up the cluster to a node type with more compute and memory capacity.", fr: "Faire passer le cluster à un type de nœud doté de plus de capacité de calcul et de mémoire." } }
    - { id: c, text: { en: "Enable cluster mode, add shards, and connect to the configuration endpoint.", fr: "Activer le mode cluster, ajouter des partitions et se connecter au point de terminaison de configuration." } }
    - { id: d, text: { en: "Configure ElastiCache Auto Scaling for replicas with a target tracking policy on engine CPU.", fr: "Configurer ElastiCache Auto Scaling pour les réplicas avec une politique de suivi de cible sur le processeur du moteur." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With cluster mode disabled, all writes go to the single primary node, so AWS recommends scaling up to a larger node type for a write-heavy workload. The primary and reader endpoints stay the same, so the application does not change."
    fr: "Avec le mode cluster désactivé, toutes les écritures vont au seul nœud primaire : AWS recommande donc de passer à un type de nœud plus grand pour une charge dominée par les écritures. Les points de terminaison principal et du lecteur restent les mêmes : l'application ne change pas."
  options:
    a:
      en: "Replicas handle reads only, so more replicas leave the write load on the same primary node."
      fr: "Les réplicas ne traitent que les lectures : davantage de réplicas laissent la charge d'écriture sur le même nœud primaire."
    c:
      en: "Shards would spread the writes, but the application would need a cluster-aware client and the configuration endpoint, which the company does not want."
      fr: "Des partitions répartiraient les écritures, mais l'application aurait besoin d'un client compatible avec le mode cluster et du point de terminaison de configuration, ce que l'entreprise ne veut pas."
    d:
      en: "ElastiCache Auto Scaling needs cluster mode enabled, and adding replicas would not relieve the primary node anyway."
      fr: "ElastiCache Auto Scaling exige le mode cluster activé, et ajouter des réplicas ne soulagerait de toute façon pas le nœud primaire."
references:
  - title: Which Metrics Should I Monitor?
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/CacheMetrics.WhichShouldIMonitor.html
