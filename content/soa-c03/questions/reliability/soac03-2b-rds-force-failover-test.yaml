id: soac03-2b-rds-force-failover-test
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL Multi-AZ DB instance deployment. Before a compliance audit, the operations team must demonstrate that the application reconnects correctly when the database fails over to its standby DB instance.

    Which action should the team take to trigger the failover?
  fr: |
    Une entreprise exécute un déploiement d'instance de base de données Multi-AZ Amazon RDS for MySQL. Avant un audit de conformité, l'équipe des opérations doit démontrer que l'application se reconnecte correctement lorsque la base de données bascule vers son instance de secours.

    Quelle action l'équipe doit-elle effectuer pour déclencher le basculement ?
body:
  options:
    - { id: a, text: { en: "Reboot the DB instance with failover (aws rds reboot-db-instance --force-failover).", fr: "Redémarrer l'instance avec basculement (aws rds reboot-db-instance --force-failover)." } }
    - { id: b, text: { en: "Promote the standby DB instance to a standalone instance by running aws rds promote-read-replica.", fr: "Promouvoir l'instance de secours en instance autonome en exécutant aws rds promote-read-replica." } }
    - { id: c, text: { en: "Stop the DB instance, wait until its status is stopped, and then start it again.", fr: "Arrêter l'instance, attendre que son état soit stopped, puis la démarrer de nouveau." } }
    - { id: d, text: { en: "Modify the DB instance to turn off Multi-AZ, and then turn it on again.", fr: "Modifier l'instance de base de données pour désactiver Multi-AZ, puis le réactiver." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Rebooting a Multi-AZ DB instance with failover forces Amazon RDS to promote the standby. The failover changes the DNS record of the DB instance to point to the new primary, so the test shows whether the application re-establishes its connections; failovers typically take 60–120 seconds.
    fr: |
      Redémarrer une instance de base de données Multi-AZ avec basculement force Amazon RDS à promouvoir l'instance de secours. Le basculement modifie l'enregistrement DNS de l'instance pour qu'il pointe vers le nouveau primaire : le test montre si l'application rétablit ses connexions ; un basculement dure généralement 60 à 120 secondes.
  options:
    b: { en: "The standby of a Multi-AZ DB instance deployment is not a read replica and cannot be promoted with this command.", fr: "L'instance de secours d'un déploiement d'instance de base de données Multi-AZ n'est pas un réplica en lecture et ne peut pas être promue avec cette commande." }
    c: { en: "Stopping and starting the DB instance causes an outage but does not exercise the failover to the standby.", fr: "Arrêter puis démarrer l'instance provoque une interruption, mais ne teste pas le basculement vers l'instance de secours." }
    d: { en: "Turning Multi-AZ off removes the standby and turning it on creates a new one; neither step performs a failover.", fr: "Désactiver Multi-AZ supprime l'instance de secours et le réactiver en crée une nouvelle ; aucune de ces étapes n'effectue de basculement." }
references:
  - title: Failing over a Multi-AZ DB instance for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.Failover.html
