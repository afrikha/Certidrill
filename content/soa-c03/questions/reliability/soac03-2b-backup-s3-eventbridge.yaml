id: soac03-2b-backup-s3-eventbridge
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company protects an Amazon S3 bucket with an AWS Backup plan that has a continuous backup rule. Last month, a developer added an Amazon SQS notification to the bucket by running the following command:

    ```bash
    aws s3api put-bucket-notification-configuration --bucket example-orders --notification-configuration file://notify.json
    ```

    ```json
    {
      "QueueConfigurations": [
        {
          "QueueArn": "arn:aws:sqs:us-east-1:111122223333:orders-events",
          "Events": ["s3:ObjectCreated:*"]
        }
      ]
    }
    ```

    During a restore test, the engineer finds that the continuous backup does not contain object changes made after that date. No backup job failed, and the daily snapshot jobs of the bucket still succeed.

    Which solution will restore continuous tracking of the bucket?
  fr: |
    Une entreprise protège un compartiment Amazon S3 avec un plan AWS Backup qui comporte une règle de sauvegarde continue. Le mois dernier, un développeur a ajouté une notification Amazon SQS au compartiment en exécutant la commande suivante :

    ```bash
    aws s3api put-bucket-notification-configuration --bucket example-orders --notification-configuration file://notify.json
    ```

    ```json
    {
      "QueueConfigurations": [
        {
          "QueueArn": "arn:aws:sqs:us-east-1:111122223333:orders-events",
          "Events": ["s3:ObjectCreated:*"]
        }
      ]
    }
    ```

    Lors d'un test de restauration, l'ingénieur constate que la sauvegarde continue ne contient pas les modifications d'objets effectuées après cette date. Aucune tâche de sauvegarde n'a échoué, et les tâches d'instantané quotidiennes du compartiment réussissent toujours.

    Quelle solution permet de rétablir le suivi continu du compartiment ?
body:
  options:
    - { id: a, text: { en: "Add the continuous backup rule for the bucket to a second backup plan that uses another vault.", fr: "Ajouter la règle de sauvegarde continue du compartiment à un second plan de sauvegarde qui utilise un autre coffre." } }
    - { id: b, text: { en: "Increase the retention period of the continuous backup rule to the maximum of 35 days.", fr: "Porter la période de rétention de la règle de sauvegarde continue au maximum de 35 jours." } }
    - { id: c, text: { en: "Suspend and then re-enable S3 Versioning on the bucket to restart change tracking.", fr: "Suspendre puis réactiver S3 Versioning sur le compartiment pour relancer le suivi des modifications." } }
    - { id: d, text: { en: "Run the command again with the queue configuration plus an empty EventBridgeConfiguration element.", fr: "Exécuter de nouveau la commande avec la configuration de la file d'attente et un élément EventBridgeConfiguration vide." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Continuous backups of S3 receive object events through Amazon EventBridge, so the bucket-level EventBridge notification setting must stay on. `put-bucket-notification-configuration` replaces the whole configuration: the command removed `EventBridgeConfiguration`, and tracking stopped silently while periodic snapshots kept running. The new configuration must include the existing queue configuration and `"EventBridgeConfiguration": {}`.
    fr: |
      Les sauvegardes continues S3 reçoivent les événements d'objets via Amazon EventBridge : le paramètre de notification EventBridge du compartiment doit rester activé. `put-bucket-notification-configuration` remplace toute la configuration : la commande a supprimé `EventBridgeConfiguration`, et le suivi s'est arrêté silencieusement tandis que les instantanés périodiques continuaient. La nouvelle configuration doit inclure la configuration de file d'attente existante et `"EventBridgeConfiguration": {}`.
  options:
    a: { en: "Continuous backups of a bucket should be configured in only one backup plan, and a second rule would not receive the missing events either.", fr: "Les sauvegardes continues d'un compartiment ne doivent être configurées que dans un seul plan, et une seconde règle ne recevrait pas davantage les événements manquants." }
    b: { en: "A longer retention keeps recovery data longer, but no new changes are tracked while EventBridge notifications are off.", fr: "Une rétention plus longue conserve plus longtemps les données de récupération, mais aucune nouvelle modification n'est suivie tant que les notifications EventBridge sont désactivées." }
    c: { en: "Versioning is still enabled and is not the cause; suspending it would also stop protecting new object versions in the meantime.", fr: "La gestion des versions est toujours activée et n'est pas en cause ; la suspendre cesserait en outre de protéger les nouvelles versions d'objets dans l'intervalle." }
references:
  - title: Amazon S3 backups
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/s3-backups.html
  - title: Continuous backups and point-in-time recovery (PITR)
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/point-in-time-recovery.html
