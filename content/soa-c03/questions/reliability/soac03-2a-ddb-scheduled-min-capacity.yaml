id: soac03-2a-ddb-scheduled-min-capacity
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Amazon DynamoDB table in provisioned capacity mode uses auto scaling for its read capacity, with a target utilization of 70%, a minimum of 200 RCUs and a maximum of 20,000 RCUs. Every weekday at 09:00, read traffic jumps from about 300 to 12,000 RCUs within one minute and stays high until 11:00. Reads are throttled for several minutes each morning. The company wants to keep provisioned capacity mode and auto scaling, and to keep costs low outside the peak.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une table Amazon DynamoDB en mode de capacité provisionnée utilise la mise à l'échelle automatique pour sa capacité de lecture, avec une utilisation cible de 70 %, un minimum de 200 RCU et un maximum de 20 000 RCU. Chaque jour de la semaine à 09:00, le trafic de lecture passe d'environ 300 à 12 000 RCU en une minute et reste élevé jusqu'à 11:00. Les lectures sont limitées pendant plusieurs minutes chaque matin. L'entreprise veut conserver le mode de capacité provisionnée et la mise à l'échelle automatique, et garder des coûts faibles en dehors de la pointe.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an Application Auto Scaling scheduled action at 08:45 on weekdays that raises the minimum read capacity of the table to 18,000 RCUs.", fr: "Créer une action planifiée Application Auto Scaling à 08:45 les jours de semaine qui porte la capacité de lecture minimale de la table à 18 000 RCU." } }
    - { id: b, text: { en: "Create an Application Auto Scaling scheduled action at 11:15 on weekdays that sets the minimum read capacity back to 200 RCUs.", fr: "Créer une action planifiée Application Auto Scaling à 11:15 les jours de semaine qui ramène la capacité de lecture minimale à 200 RCU." } }
    - { id: c, text: { en: "Lower the target utilization of the scaling policy to 10% so that capacity always stays far above traffic.", fr: "Abaisser l'utilisation cible de la politique à 10 % pour que la capacité reste toujours très au-dessus du trafic." } }
    - { id: d, text: { en: "Increase the maximum read capacity of the scalable target to 40,000 RCUs so that auto scaling reacts faster.", fr: "Porter la capacité de lecture maximale de la cible évolutive à 40 000 RCU pour que la mise à l'échelle automatique réagisse plus vite." } }
    - { id: e, text: { en: "Change the application to use strongly consistent reads so that fewer RCUs are consumed.", fr: "Modifier l'application pour utiliser des lectures à cohérence forte afin de consommer moins de RCU." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Auto scaling raises capacity only after consumed capacity stays above the target for a few minutes, so a jump within one minute is throttled. A scheduled action that raises the minimum before 09:00 provisions about 12,000 / 0.7 RCUs in advance, and a second scheduled action after 11:00 lowers the minimum again so that auto scaling can scale in and costs stay low."
    fr: "La mise à l'échelle automatique n'augmente la capacité qu'après plusieurs minutes de consommation au-dessus de la cible : un saut en une minute est donc limité. Une action planifiée qui relève le minimum avant 09:00 provisionne à l'avance environ 12 000 / 0,7 RCU, et une seconde action planifiée après 11:00 abaisse de nouveau le minimum pour que la mise à l'échelle automatique puisse réduire la capacité et que les coûts restent faibles."
  options:
    c:
      en: "The target utilization can only be set between 20% and 90%, and a very low target would keep extra capacity all day."
      fr: "L'utilisation cible ne peut être définie qu'entre 20 % et 90 %, et une cible très basse garderait de la capacité en trop toute la journée."
    d:
      en: "The maximum only limits how high auto scaling can go; it does not change how fast it reacts, and 20,000 already covers the peak."
      fr: "Le maximum limite seulement jusqu'où la mise à l'échelle automatique peut monter ; il ne change pas sa vitesse de réaction, et 20 000 couvre déjà la pointe."
    e:
      en: "Strongly consistent reads consume twice the read capacity of eventually consistent reads, which makes the throttling worse."
      fr: "Les lectures à cohérence forte consomment deux fois plus de capacité de lecture que les lectures à cohérence éventuelle, ce qui aggrave la limitation."
references:
  - title: Managing throughput capacity automatically with DynamoDB auto scaling
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/AutoScaling.html
