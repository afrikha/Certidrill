id: soac03-2c-backup-continuous-retention
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company protects an Amazon RDS for PostgreSQL DB instance with an AWS Backup plan that has a continuous backup rule with a retention of 7 days and a daily snapshot rule with a retention of 90 days. A new requirement states that the database must be restorable to any second of the last 21 days. When an operator tries to change the backup retention period in the Amazon RDS console, the change is not allowed.

    Which solution will meet the requirement?
  fr: |
    Une entreprise protège une instance de base de données Amazon RDS for PostgreSQL avec un plan AWS Backup qui comporte une règle de sauvegarde continue avec une rétention de 7 jours et une règle d'instantanés quotidiens avec une rétention de 90 jours. Une nouvelle exigence stipule que la base de données doit pouvoir être restaurée à n'importe quelle seconde des 21 derniers jours. Lorsqu'un opérateur tente de modifier la période de rétention des sauvegardes dans la console Amazon RDS, la modification n'est pas autorisée.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Change the retention of the continuous backup rule in the AWS Backup plan to 21 days.", fr: "Passer à 21 jours la rétention de la règle de sauvegarde continue dans le plan AWS Backup." } }
    - { id: b, text: { en: "Change the daily snapshot rule to run every hour, and keep the continuous backup rule at 7 days.", fr: "Faire exécuter la règle d'instantanés quotidiens toutes les heures, et laisser la règle de sauvegarde continue à 7 jours." } }
    - { id: c, text: { en: "Add a second continuous backup rule with a 21-day retention to the same backup plan.", fr: "Ajouter au même plan de sauvegarde une seconde règle de sauvegarde continue avec une rétention de 21 jours." } }
    - { id: d, text: { en: "Remove the DB instance from the backup plan, and set the RDS backup retention period to 21 days in the console.", fr: "Retirer l'instance du plan de sauvegarde, et définir la période de rétention des sauvegardes RDS sur 21 jours dans la console." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When AWS Backup manages continuous backups of an RDS DB instance, the point-in-time recovery settings can no longer be changed in Amazon RDS and must be changed in AWS Backup. Continuous backups allow restores to any second for up to 35 days, so raising the rule's retention to 21 days meets the requirement while the snapshot rule keeps the 90-day copies.
    fr: |
      Lorsqu'AWS Backup gère les sauvegardes continues d'une instance RDS, les paramètres de restauration à un instant dans le passé ne peuvent plus être modifiés dans Amazon RDS et doivent l'être dans AWS Backup. Les sauvegardes continues permettent de restaurer à n'importe quelle seconde jusqu'à 35 jours en arrière : porter la rétention de la règle à 21 jours répond à l'exigence, tandis que la règle d'instantanés conserve les copies de 90 jours.
  options:
    b: { en: "Hourly snapshots can be restored only to the time of each snapshot, not to any second of the last 21 days.", fr: "Des instantanés horaires ne peuvent être restaurés qu'à l'heure de chaque instantané, et non à n'importe quelle seconde des 21 derniers jours." }
    c: { en: "A resource can have only one continuous backup; a duplicate continuous rule causes the backups to complete with issues.", fr: "Une ressource ne peut avoir qu'une seule sauvegarde continue ; une règle continue en double fait se terminer les sauvegardes avec des problèmes (Completed with issues)." }
    d: { en: "Handing control back to RDS requires deleting the continuous recovery points or waiting for them to expire, and it drops the centrally managed 90-day backups.", fr: "Rendre le contrôle à RDS impose de supprimer les points de récupération continus ou d'attendre leur expiration, et abandonne les sauvegardes de 90 jours gérées de façon centralisée." }
references:
  - title: Continuous backups and point-in-time recovery (PITR) - AWS Backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/point-in-time-recovery.html
