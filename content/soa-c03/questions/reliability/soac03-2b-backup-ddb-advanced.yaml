id: soac03-2b-backup-ddb-advanced
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has used AWS Backup since 2019. One backup plan protects Amazon DynamoDB tables and Amazon EFS file systems. The company added a copy action to another Region and a rule to move recovery points to cold storage after 30 days. The EFS recovery points are copied and moved to cold storage as expected, but no copy job is created for the DynamoDB recovery points, and they never move to cold storage.

    Which solution will resolve the issue?
  fr: |
    Une entreprise utilise AWS Backup depuis 2019. Un plan de sauvegarde protège des tables Amazon DynamoDB et des systèmes de fichiers Amazon EFS. L'entreprise a ajouté une action de copie vers une autre Région et une règle de passage des points de récupération en stockage à froid après 30 jours. Les points de récupération EFS sont copiés et passent en stockage à froid comme prévu, mais aucune tâche de copie n'est créée pour les points de récupération DynamoDB, qui ne passent jamais en stockage à froid.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Turn on point-in-time recovery for each DynamoDB table.", fr: "Activer la restauration à un instant dans le passé pour chaque table DynamoDB." } }
    - { id: b, text: { en: "Convert each DynamoDB table to a global table with a replica in the other Region.", fr: "Convertir chaque table DynamoDB en table globale avec un réplica dans l'autre Région." } }
    - { id: c, text: { en: "Turn on advanced features for DynamoDB backups in the AWS Backup settings.", fr: "Activer les fonctionnalités avancées des sauvegardes DynamoDB dans les paramètres AWS Backup." } }
    - { id: d, text: { en: "Turn on DynamoDB Streams for each table so that AWS Backup can track the changes.", fr: "Activer DynamoDB Streams sur chaque table pour qu'AWS Backup puisse suivre les modifications." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Advanced DynamoDB backup adds cross-Region and cross-account copies, cold storage tiering and tag inheritance to DynamoDB backups made by AWS Backup. Customers who started using AWS Backup after November 2021 have it on by default, but earlier customers must turn it on in the AWS Backup settings (or with `update-region-settings`); it applies to new backups.
    fr: |
      La sauvegarde DynamoDB avancée ajoute aux sauvegardes DynamoDB effectuées par AWS Backup les copies entre Régions et entre comptes, le passage en stockage à froid et l'héritage des balises. Les clients qui ont commencé à utiliser AWS Backup après novembre 2021 en bénéficient par défaut, mais les clients plus anciens doivent l'activer dans les paramètres AWS Backup (ou avec `update-region-settings`) ; elle s'applique aux nouvelles sauvegardes.
  options:
    a: { en: "Point-in-time recovery is a DynamoDB restore feature; it does not enable copy or cold storage for AWS Backup recovery points.", fr: "La restauration à un instant dans le passé est une fonctionnalité de restauration DynamoDB ; elle n'active ni la copie ni le stockage à froid pour les points de récupération AWS Backup." }
    b: { en: "Global tables replicate live data to another Region; they do not create copies of the backups or move them to cold storage.", fr: "Les tables globales répliquent les données actives vers une autre Région ; elles ne créent pas de copies des sauvegardes et ne les placent pas en stockage à froid." }
    d: { en: "Streams capture item changes for applications; AWS Backup does not need them for copies or lifecycle.", fr: "Les flux capturent les modifications d'éléments pour les applications ; AWS Backup n'en a pas besoin pour les copies ni pour le cycle de vie." }
references:
  - title: Advanced DynamoDB backup
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/advanced-ddb-backup.html
