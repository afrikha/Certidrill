id: soac03-2c-dr-warm-standby-scale-first
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses a warm standby strategy. In us-west-2, an Auto Scaling group with a target tracking policy runs 2 instances, while production in us-east-1 runs 20. During a disaster recovery test, the operators promoted the database in us-west-2 and then moved 100% of the traffic to us-west-2 at once. For the next 25 minutes, users received HTTP 503 errors while the group scaled out. The company wants the next failover to serve full production traffic as soon as traffic arrives.

    Which change to the failover runbook will meet this requirement?
  fr: |
    Une entreprise utilise une stratégie de secours semi-actif (warm standby). Dans us-west-2, un groupe Auto Scaling doté d'une politique de suivi de cible exécute 2 instances, alors que la production de us-east-1 en exécute 20. Lors d'un test de reprise après sinistre, les opérateurs ont promu la base de données dans us-west-2, puis ont déplacé d'un coup 100 % du trafic vers us-west-2. Pendant les 25 minutes suivantes, les utilisateurs ont reçu des erreurs HTTP 503 pendant que le groupe montait en charge. L'entreprise veut que le prochain basculement serve tout le trafic de production dès son arrivée.

    Quelle modification du runbook de basculement permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Scale the us-west-2 group to production size and check quotas, then move traffic once the instances are healthy.", fr: "Porter le groupe de us-west-2 à la taille de production et vérifier les quotas, puis déplacer le trafic une fois les instances saines." } }
    - { id: b, text: { en: "Lower the TTL of the application's Route 53 record to 60 seconds before moving traffic to us-west-2.", fr: "Abaisser à 60 secondes le TTL de l'enregistrement Route 53 de l'application avant de déplacer le trafic vers us-west-2." } }
    - { id: c, text: { en: "Replace the target tracking policy in us-west-2 with a step scaling policy that adds more instances per step.", fr: "Remplacer la politique de suivi de cible de us-west-2 par une politique de mise à l'échelle par étapes qui ajoute plus d'instances par étape." } }
    - { id: d, text: { en: "Turn on cross-zone load balancing on the us-west-2 Application Load Balancer to spread the load evenly.", fr: "Activer l'équilibrage de charge entre zones sur l'Application Load Balancer de us-west-2 pour répartir la charge uniformément." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A warm standby can serve traffic immediately but only at reduced capacity, so it must be scaled up to production capacity before it receives full traffic. AWS recommends scaling up before failover and making sure that the service quotas in the recovery Region allow production capacity. Moving traffic after the new instances are healthy avoids the errors seen during the test.
    fr: |
      Un secours semi-actif peut servir du trafic immédiatement, mais seulement à capacité réduite : il doit donc être porté à la capacité de production avant de recevoir tout le trafic. AWS recommande de monter en charge avant le basculement et de vérifier que les quotas de service de la Région de reprise permettent la capacité de production. Déplacer le trafic une fois les nouvelles instances saines évite les erreurs observées pendant le test.
  options:
    b: { en: "A shorter TTL moves users faster, which sends the full load to the 2 instances even sooner.", fr: "Un TTL plus court déplace les utilisateurs plus vite, ce qui envoie encore plus tôt toute la charge sur les 2 instances." }
    c: { en: "Any reactive scaling policy still launches instances only after the load arrives, so users get errors while they start.", fr: "Toute politique de mise à l'échelle réactive ne lance des instances qu'après l'arrivée de la charge : les utilisateurs reçoivent des erreurs pendant leur démarrage." }
    d: { en: "Cross-zone load balancing spreads requests across zones but does not add the missing capacity.", fr: "L'équilibrage de charge entre zones répartit les requêtes entre les zones, mais n'ajoute pas la capacité manquante." }
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
