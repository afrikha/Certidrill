id: soac03-2b-aurora-failover-target
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Aurora PostgreSQL DB cluster has its writer DB instance in us-east-1a and Aurora Replicas in us-east-1b and us-east-1c. During a game day, the operations team must make the replica in us-east-1c the new writer immediately and observe how the application behaves.

    Which action will meet this requirement?
  fr: |
    Un cluster de bases de données Amazon Aurora PostgreSQL a son instance d'écriture dans us-east-1a et des réplicas Aurora dans us-east-1b et us-east-1c. Lors d'un exercice de simulation (game day), l'équipe des opérations doit faire immédiatement du réplica de us-east-1c la nouvelle instance d'écriture et observer le comportement de l'application.

    Quelle action permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Run aws rds reboot-db-instance --force-failover on the current writer DB instance.", fr: "Exécuter aws rds reboot-db-instance --force-failover sur l'instance d'écriture actuelle." } }
    - { id: b, text: { en: "Set the promotion tier of the replica in us-east-1c to 0 and wait for the next maintenance window.", fr: "Définir le niveau de promotion du réplica de us-east-1c sur 0 et attendre la prochaine fenêtre de maintenance." } }
    - { id: c, text: { en: "Run aws rds failover-db-cluster with --target-db-instance-identifier set to the replica in us-east-1c.", fr: "Exécuter aws rds failover-db-cluster avec --target-db-instance-identifier défini sur le réplica de us-east-1c." } }
    - { id: d, text: { en: "Run aws rds promote-read-replica-db-cluster for the DB cluster of the replica in us-east-1c.", fr: "Exécuter aws rds promote-read-replica-db-cluster pour le cluster du réplica de us-east-1c." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `failover-db-cluster` forces a failover of an Aurora DB cluster, and `--target-db-instance-identifier` names the Aurora Replica to promote to writer. The cluster endpoint then points to the promoted instance, so the team can observe how the application reconnects.
    fr: |
      `failover-db-cluster` force le basculement d'un cluster Aurora, et `--target-db-instance-identifier` désigne le réplica Aurora à promouvoir comme instance d'écriture. Le point de terminaison de cluster pointe ensuite vers l'instance promue : l'équipe peut observer la reconnexion de l'application.
  options:
    a: { en: "Reboot with failover applies to Multi-AZ DB instance deployments; it cannot choose which Aurora Replica becomes the writer.", fr: "Le redémarrage avec basculement s'applique aux déploiements d'instance de base de données Multi-AZ ; il ne permet pas de choisir quel réplica Aurora devient l'instance d'écriture." }
    b: { en: "Changing a promotion tier does not trigger a failover; the tier is used only when a failover happens.", fr: "Modifier un niveau de promotion ne déclenche pas de basculement ; le niveau n'est utilisé que lorsqu'un basculement se produit." }
    d: { en: "This command promotes a read replica DB cluster, such as a cross-Region replica, to a standalone cluster; it does not fail over within the cluster.", fr: "Cette commande promeut un cluster réplica en lecture, comme un réplica entre Régions, en cluster autonome ; elle n'effectue pas de basculement à l'intérieur du cluster." }
references:
  - title: High availability for Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html
