id: soac03-2a-step-scaling-adjustments
objective: "2.1.1"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    An Auto Scaling group has 6 running instances, a minimum size of 2 and a maximum size of 12. A step scaling policy is attached to a CloudWatch alarm that enters the ALARM state when average CPU utilization is at or above 60%. The policy uses the following settings, with bounds relative to the alarm threshold:

    ```json
    {
      "AdjustmentType": "ChangeInCapacity",
      "StepAdjustments": [
        { "MetricIntervalLowerBound": 0, "MetricIntervalUpperBound": 10, "ScalingAdjustment": 1 },
        { "MetricIntervalLowerBound": 10, "MetricIntervalUpperBound": 20, "ScalingAdjustment": 2 },
        { "MetricIntervalLowerBound": 20, "ScalingAdjustment": 4 }
      ]
    }
    ```

    No instances are warming up. The alarm enters the ALARM state with an average CPU utilization of 75%.

    What will the desired capacity of the group be after the scaling activity?
  fr: |
    Un groupe Auto Scaling compte 6 instances en cours d'exécution, une taille minimale de 2 et une taille maximale de 12. Une politique de mise à l'échelle par étapes est associée à une alarme CloudWatch qui passe à l'état ALARM quand l'utilisation moyenne du processeur est supérieure ou égale à 60 %. La politique utilise les paramètres suivants, avec des bornes relatives au seuil de l'alarme :

    ```json
    {
      "AdjustmentType": "ChangeInCapacity",
      "StepAdjustments": [
        { "MetricIntervalLowerBound": 0, "MetricIntervalUpperBound": 10, "ScalingAdjustment": 1 },
        { "MetricIntervalLowerBound": 10, "MetricIntervalUpperBound": 20, "ScalingAdjustment": 2 },
        { "MetricIntervalLowerBound": 20, "ScalingAdjustment": 4 }
      ]
    }
    ```

    Aucune instance n'est en cours de préchauffage. L'alarme passe à l'état ALARM avec une utilisation moyenne du processeur de 75 %.

    Quelle sera la capacité souhaitée du groupe après l'activité de mise à l'échelle ?
body:
  options:
    - { id: a, text: { en: "7 instances", fr: "7 instances" } }
    - { id: b, text: { en: "8 instances", fr: "8 instances" } }
    - { id: c, text: { en: "10 instances", fr: "10 instances" } }
    - { id: d, text: { en: "13 instances", fr: "13 instances" } }
answer: { optionId: b }
explanation:
  correct:
    en: "With the AWS CLI or an SDK, step bounds are relative to the alarm threshold. 75% is 15 points above the 60% threshold, which falls in the step from 10 (inclusive) to 20 (exclusive), so the policy adds 2 instances: 6 + 2 = 8. Only one step applies to a breach, and 8 stays within the maximum size of 12."
    fr: "Avec l'AWS CLI ou un SDK, les bornes des étapes sont relatives au seuil de l'alarme. 75 % se situe 15 points au-dessus du seuil de 60 %, ce qui tombe dans l'étape de 10 (inclus) à 20 (exclu) : la politique ajoute 2 instances, soit 6 + 2 = 8. Une seule étape s'applique à un dépassement, et 8 reste sous la taille maximale de 12."
  options:
    a:
      en: "Adding 1 instance is the first step, which covers values from 60% up to 70% only."
      fr: "Ajouter 1 instance correspond à la première étape, qui couvre seulement les valeurs de 60 % à 70 %."
    c:
      en: "Adding 4 instances is the last step, which applies only at 80% or more."
      fr: "Ajouter 4 instances correspond à la dernière étape, qui s'applique seulement à partir de 80 %."
    d:
      en: "Step adjustments are not added together: only the step whose interval contains the breach is applied."
      fr: "Les ajustements par étapes ne s'additionnent pas : seule l'étape dont l'intervalle contient le dépassement est appliquée."
references:
  - title: Step and simple scaling policies for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-simple-step.html
