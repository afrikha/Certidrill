id: soac03-2c-ddb-restore-exclude-gsi
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company must restore a large Amazon DynamoDB table named `Orders` to a point in time after a bad batch job. The table has five global secondary indexes (GSIs). The order service, which must be back online as soon as possible, reads the restored data only by the table's primary key. The GSIs serve reporting queries that can wait until the next day.

    Which restore approach will meet the RTO of the order service MOST effectively?
  fr: |
    Une entreprise doit restaurer à un instant dans le passé une grande table Amazon DynamoDB nommée `Orders` après une tâche par lots défectueuse. La table comporte cinq index secondaires globaux (GSI). Le service de commandes, qui doit être de nouveau disponible le plus vite possible, ne lit les données restaurées que par la clé primaire de la table. Les GSI servent des requêtes de reporting qui peuvent attendre le lendemain.

    Quelle approche de restauration respecte le PLUS efficacement le RTO du service de commandes ?
body:
  options:
    - { id: a, text: { en: "Restore the table with all its GSIs, and switch the order service to the new table when the restore completes.", fr: "Restaurer la table avec tous ses GSI, et faire passer le service de commandes sur la nouvelle table à la fin de la restauration." } }
    - { id: b, text: { en: "Restore the table with `--global-secondary-index-override '[]'`, switch the order service, and create the GSIs on the new table later.", fr: "Restaurer la table avec `--global-secondary-index-override '[]'`, faire passer le service de commandes, et créer les GSI plus tard sur la nouvelle table." } }
    - { id: c, text: { en: "Restore the table with `--billing-mode-override PAY_PER_REQUEST` so that the restore is not throttled by provisioned capacity.", fr: "Restaurer la table avec `--billing-mode-override PAY_PER_REQUEST` pour que la restauration ne soit pas limitée par la capacité provisionnée." } }
    - { id: d, text: { en: "Delete the five GSIs from the source table, restore the table, and re-create the GSIs on both tables.", fr: "Supprimer les cinq GSI de la table source, restaurer la table, puis recréer les GSI sur les deux tables." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A point-in-time restore can exclude secondary indexes with `--global-secondary-index-override '[]'`, and the documentation notes that this can make restores faster and more cost-efficient. The order service only needs primary-key reads, so it can use the restored table sooner, and the GSIs can be added afterward for the reporting queries.
    fr: |
      Une restauration PITR peut exclure les index secondaires avec `--global-secondary-index-override '[]'`, et la documentation indique que cela peut rendre les restaurations plus rapides et plus économiques. Le service de commandes n'a besoin que de lectures par clé primaire : il peut donc utiliser plus tôt la table restaurée, et les GSI peuvent être ajoutés ensuite pour les requêtes de reporting.
  options:
    a: { en: "Restoring the five GSIs with the table lengthens the restore, although the order service does not need them.", fr: "Restaurer les cinq GSI avec la table allonge la restauration, alors que le service de commandes n'en a pas besoin." }
    c: { en: "The billing mode override only sets how the restored table is billed and scales afterward; the restore still rebuilds the five GSIs that the order service does not need.", fr: "Le remplacement du mode de facturation définit seulement la facturation et la mise à l'échelle de la table restaurée ensuite ; la restauration reconstruit toujours les cinq GSI dont le service de commandes n'a pas besoin." }
    d: { en: "Deleting the GSIs of the source table breaks the current reporting queries and adds work, whereas the restore can exclude the indexes directly.", fr: "Supprimer les GSI de la table source casse les requêtes de reporting actuelles et ajoute du travail, alors que la restauration peut exclure directement les index." }
references:
  - title: Restoring a DynamoDB table to a point in time - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery.Tutorial.html
