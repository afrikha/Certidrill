id: soac03-2b-aurora-cluster-endpoint
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application writes to an Amazon Aurora MySQL DB cluster that has a writer DB instance and two Aurora Replicas in different Availability Zones. The application configuration contains the instance endpoint of the DB instance that was the writer when the application was deployed. After an automatic failover, the application cannot write to the database until an engineer edits the configuration.

    Which solution will let the application keep writing after future failovers without manual changes?
  fr: |
    Une application écrit dans un cluster de bases de données Amazon Aurora MySQL qui comprend une instance d'écriture et deux réplicas Aurora dans des zones de disponibilité différentes. La configuration de l'application contient le point de terminaison d'instance de l'instance qui était l'instance d'écriture lors du déploiement de l'application. Après un basculement automatique, l'application ne peut plus écrire dans la base de données tant qu'un ingénieur ne modifie pas la configuration.

    Quelle solution permet à l'application de continuer à écrire après les futurs basculements sans modification manuelle ?
body:
  options:
    - { id: a, text: { en: "Configure the application to use the reader endpoint of the cluster for all its connections.", fr: "Configurer l'application pour qu'elle utilise le point de terminaison de lecteur du cluster pour toutes ses connexions." } }
    - { id: b, text: { en: "Configure the application to use the cluster endpoint for its write connections.", fr: "Configurer l'application pour qu'elle utilise le point de terminaison de cluster pour ses connexions d'écriture." } }
    - { id: c, text: { en: "Set the promotion tier of the current writer DB instance to 0 so that it is always the writer.", fr: "Définir le niveau de promotion de l'instance d'écriture actuelle sur 0 pour qu'elle reste toujours l'instance d'écriture." } }
    - { id: d, text: { en: "Create a Route 53 CNAME record for the instance endpoint of the writer and use it in the application.", fr: "Créer un enregistrement CNAME Route 53 pour le point de terminaison d'instance de l'instance d'écriture et l'utiliser dans l'application." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The cluster endpoint always connects to the current primary DB instance. After a failover, Aurora points it to the newly promoted or created primary, so the application reconnects to the writer without any change. Instance endpoints do not follow failovers, so they are not recommended for high availability.
    fr: |
      Le point de terminaison de cluster se connecte toujours à l'instance principale actuelle. Après un basculement, Aurora le fait pointer vers la nouvelle instance principale, promue ou créée : l'application se reconnecte à l'instance d'écriture sans modification. Les points de terminaison d'instance ne suivent pas les basculements et ne sont donc pas recommandés pour la haute disponibilité.
  options:
    a: { en: "The reader endpoint balances connections among the Aurora Replicas, which do not accept writes.", fr: "Le point de terminaison de lecteur répartit les connexions entre les réplicas Aurora, qui n'acceptent pas les écritures." }
    c: { en: "Promotion tiers decide which replica is promoted when the writer fails; they cannot keep a failed instance as the writer.", fr: "Les niveaux de promotion déterminent quel réplica est promu en cas de panne de l'instance d'écriture ; ils ne peuvent pas garder une instance en panne comme instance d'écriture." }
    d: { en: "The CNAME still resolves to the endpoint of the former writer, which is a reader or unavailable after the failover.", fr: "Le CNAME pointe toujours vers le point de terminaison de l'ancienne instance d'écriture, qui est un lecteur ou indisponible après le basculement." }
references:
  - title: Amazon Aurora endpoint connections
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html
