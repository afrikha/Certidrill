id: soac03-2b-dynamodb-az-resilience
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores shopping cart data in an Amazon DynamoDB table in eu-central-1. The application runs only in that Region. A resilience review requires the table to remain available if a single Availability Zone in eu-central-1 fails; Region-wide outages are out of scope for this review.

    Which solution will meet this requirement MOST cost-effectively?
  fr: |
    Une entreprise stocke les données des paniers d'achat dans une table Amazon DynamoDB dans eu-central-1. L'application ne s'exécute que dans cette Région. Une revue de résilience exige que la table reste disponible en cas de panne d'une seule zone de disponibilité de eu-central-1 ; les pannes à l'échelle d'une Région sont hors du périmètre de cette revue.

    Quelle solution permet de répondre à cette exigence de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Convert the table to a global table with a replica in eu-west-1, so that a second Region holds a copy of every item.", fr: "Convertir la table en table globale avec un réplica dans eu-west-1, afin qu'une seconde Région détienne une copie de chaque élément." } }
    - { id: b, text: { en: "Add a DynamoDB Accelerator (DAX) cluster with nodes in three zones, so that reads are served from several zones.", fr: "Ajouter un cluster DynamoDB Accelerator (DAX) avec des nœuds dans trois zones, afin que les lectures soient servies depuis plusieurs zones." } }
    - { id: c, text: { en: "Keep the table unchanged, because DynamoDB already replicates its data across multiple zones in the Region.", fr: "Conserver la table telle quelle, car DynamoDB réplique déjà ses données sur plusieurs zones de la Région." } }
    - { id: d, text: { en: "Turn on point-in-time recovery for the table, so that it can be restored into another zone after a failure.", fr: "Activer la restauration à un instant dans le passé pour la table, afin de pouvoir la restaurer dans une autre zone après une panne." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DynamoDB automatically replicates table data across three Availability Zones in a Region, which provides built-in high availability and durability. The loss of one zone therefore does not make the table unavailable, and no additional resource or cost is needed for this requirement.
    fr: |
      DynamoDB réplique automatiquement les données d'une table sur trois zones de disponibilité d'une Région, ce qui fournit une haute disponibilité et une durabilité intégrées. La perte d'une zone ne rend donc pas la table indisponible, et aucune ressource ni aucun coût supplémentaire n'est nécessaire pour cette exigence.
  options:
    a: { en: "Global tables protect against a Regional outage, which is out of scope, and add replicated write and storage costs.", fr: "Les tables globales protègent contre une panne régionale, hors périmètre, et ajoutent des coûts d'écritures répliquées et de stockage." }
    b: { en: "DAX is an in-memory cache that improves read latency; it adds cost and does not change the availability of the table itself.", fr: "DAX est un cache en mémoire qui améliore la latence des lectures ; il ajoute un coût et ne change pas la disponibilité de la table elle-même." }
    d: { en: "Point-in-time recovery protects against accidental writes and deletes; a DynamoDB table is not tied to one zone and is not restored into a zone.", fr: "La restauration à un instant dans le passé protège contre les écritures et suppressions accidentelles ; une table DynamoDB n'est pas liée à une zone et n'est pas restaurée dans une zone." }
references:
  - title: Resilience and disaster recovery in Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/disaster-recovery-resiliency.html
