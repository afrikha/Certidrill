id: soac03-2c-s3-newer-noncurrent-versions
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores device configuration files under the `config/` prefix of a versioning-enabled Amazon S3 bucket. Some files change several times a day, and others change once a year. The company wants to always keep the five most recent noncurrent versions of each file, whatever their age. Older noncurrent versions must be permanently deleted once they have been noncurrent for more than 30 days.

    Which lifecycle rule action, in a rule filtered on the `config/` prefix, will meet these requirements?
  fr: |
    Une entreprise stocke des fichiers de configuration d'appareils sous le préfixe `config/` d'un compartiment Amazon S3 dont la gestion des versions est activée. Certains fichiers changent plusieurs fois par jour, d'autres une fois par an. L'entreprise veut toujours conserver les cinq versions non actuelles les plus récentes de chaque fichier, quel que soit leur âge. Les versions non actuelles plus anciennes doivent être supprimées définitivement dès qu'elles sont non actuelles depuis plus de 30 jours.

    Quelle action de règle de cycle de vie, dans une règle filtrée sur le préfixe `config/`, permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: "`\"NoncurrentVersionExpiration\": { \"NoncurrentDays\": 30, \"NewerNoncurrentVersions\": 5 }`" }
    - { id: b, text: "`\"NoncurrentVersionExpiration\": { \"NoncurrentDays\": 150 }`" }
    - { id: c, text: "`\"NoncurrentVersionTransition\": { \"NoncurrentDays\": 30, \"NewerNoncurrentVersions\": 5, \"StorageClass\": \"GLACIER\" }`" }
    - { id: d, text: "`\"Expiration\": { \"Days\": 30 }`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `NewerNoncurrentVersions` sets how many newer noncurrent versions S3 retains (1 to 100), and a noncurrent version is deleted only when both its `NoncurrentDays` and the `NewerNoncurrentVersions` count are exceeded. The five most recent noncurrent versions are therefore always kept, and older ones are deleted after 30 days as noncurrent. A filter is required when `NewerNoncurrentVersions` is used.
    fr: |
      `NewerNoncurrentVersions` définit combien de versions non actuelles plus récentes S3 conserve (de 1 à 100), et une version non actuelle n'est supprimée que lorsque ses `NoncurrentDays` et le nombre `NewerNoncurrentVersions` sont tous deux dépassés. Les cinq versions non actuelles les plus récentes sont donc toujours conservées, et les plus anciennes sont supprimées après 30 jours à l'état non actuel. Un filtre est obligatoire lorsque `NewerNoncurrentVersions` est utilisé.
  options:
    b: { en: "A days-only rule ignores the number of versions: a file that changes rarely could lose all its noncurrent versions, and frequent versions are kept far longer than needed.", fr: "Une règle fondée uniquement sur les jours ignore le nombre de versions : un fichier qui change rarement pourrait perdre toutes ses versions non actuelles, et les versions fréquentes sont conservées bien plus longtemps que nécessaire." }
    c: { en: "A transition moves the older noncurrent versions to another storage class but never deletes them.", fr: "Une transition déplace les versions non actuelles plus anciennes vers une autre classe de stockage, mais ne les supprime jamais." }
    d: { en: "`Expiration` acts on current versions: in a versioned bucket it adds delete markers to every file after 30 days and does not delete old noncurrent versions.", fr: "`Expiration` agit sur les versions actuelles : dans un compartiment versionné, il ajoute des marqueurs de suppression à chaque fichier après 30 jours et ne supprime pas les anciennes versions non actuelles." }
references:
  - title: Lifecycle configuration elements - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
