id: soac03-2b-r53-string-match
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company monitors the `/status` page of its website with a Route 53 HTTPS health check. When the backend database is unavailable, the page still returns HTTP 200, but its body contains `db=down` instead of `db=up`. Route 53 reports the endpoint as healthy during database outages. The company wants the health check to fail whenever the database is unavailable.

    Which solution will meet this requirement?
  fr: |
    Une entreprise surveille la page `/status` de son site web avec une vérification de l'état HTTPS Route 53. Lorsque la base de données dorsale est indisponible, la page renvoie toujours HTTP 200, mais son corps contient `db=down` au lieu de `db=up`. Route 53 signale le point de terminaison comme sain pendant les pannes de la base de données. L'entreprise veut que la vérification de l'état échoue chaque fois que la base de données est indisponible.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Create a new HTTPS health check for /status with string matching enabled and the search string db=up.", fr: "Créer une vérification de l'état HTTPS pour /status avec la correspondance de chaîne activée et la chaîne de recherche db=up." } }
    - { id: b, text: { en: "Enable latency measurements on the existing health check and create an alarm on high latency values.", fr: "Activer les mesures de latence sur la vérification de l'état existante et créer une alarme sur les latences élevées." } }
    - { id: c, text: { en: "Lower the failure threshold of the existing health check to 1 so that a single failed check counts.", fr: "Abaisser le seuil d'échec de la vérification de l'état existante à 1 pour qu'un seul échec suffise." } }
    - { id: d, text: { en: "Create a new TCP health check on port 443 for the same endpoint and associate it with the records.", fr: "Créer une vérification de l'état TCP sur le port 443 pour le même point de terminaison et l'associer aux enregistrements." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With string matching, Route 53 considers the endpoint healthy only if the search string appears in the first 5,120 bytes of the response body; otherwise the check fails even with an HTTP 200 status. String matching cannot be changed after a health check is created, so the engineer creates a new health check and associates it with the records in place of the old one.
    fr: |
      Avec la correspondance de chaîne, Route 53 ne considère le point de terminaison comme sain que si la chaîne recherchée figure dans les 5 120 premiers octets du corps de la réponse ; sinon, la vérification échoue même avec un code HTTP 200. La correspondance de chaîne ne peut pas être modifiée après la création d'une vérification : l'ingénieur crée donc une nouvelle vérification et l'associe aux enregistrements à la place de l'ancienne.
  options:
    b: { en: "Latency measurements cannot be added after creation either, and a slow page is not the symptom: the page answers quickly with a body that reports the outage.", fr: "Les mesures de latence ne peuvent pas non plus être ajoutées après la création, et la lenteur n'est pas le symptôme : la page répond vite avec un corps qui signale la panne." }
    c: { en: "Every check already succeeds because the status code is 200; a lower failure threshold does not make a successful check fail.", fr: "Chaque vérification réussit déjà, car le code d'état est 200 ; un seuil d'échec plus bas ne fait pas échouer une vérification réussie." }
    d: { en: "A TCP health check only verifies that a connection can be opened, which is even less than the current HTTPS check.", fr: "Une vérification TCP vérifie seulement qu'une connexion peut être établie, ce qui est encore moins que la vérification HTTPS actuelle." }
references:
  - title: Values that you specify when you create or update health checks
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-creating-values.html
