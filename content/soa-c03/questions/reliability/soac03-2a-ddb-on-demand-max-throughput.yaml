id: soac03-2a-ddb-on-demand-max-throughput
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses an Amazon DynamoDB table in on-demand capacity mode. A nightly batch job sometimes runs with a defect and sends a flood of writes to the table, which raises costs. The company wants to keep on-demand mode and limit the table to about 2,000 write request units per second.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise une table Amazon DynamoDB en mode de capacité à la demande. Un traitement par lots nocturne s'exécute parfois avec un défaut et envoie un afflux d'écritures à la table, ce qui augmente les coûts. L'entreprise veut conserver le mode à la demande et limiter la table à environ 2 000 unités de requête d'écriture par seconde.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Set the maximum on-demand write throughput of the table to 2,000 write request units per second.", fr: "Définir le débit d'écriture maximal à la demande de la table sur 2 000 unités de requête d'écriture par seconde." } }
    - { id: b, text: { en: "Switch the table to provisioned capacity mode with auto scaling and a maximum of 2,000 WCUs.", fr: "Passer la table en mode de capacité provisionnée avec la mise à l'échelle automatique et un maximum de 2 000 WCU." } }
    - { id: c, text: { en: "Purchase DynamoDB reserved capacity for 2,000 WCUs in the Region.", fr: "Acheter de la capacité réservée DynamoDB pour 2 000 WCU dans la Région." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on ConsumedWriteCapacityUnits that invokes a Lambda function to stop the batch job.", fr: "Créer une alarme CloudWatch sur ConsumedWriteCapacityUnits qui invoque une fonction Lambda pour arrêter le traitement par lots." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An on-demand table or global secondary index can have an optional maximum read or write throughput per second. Requests above the maximum are throttled with a ThrottlingException, which bounds the cost of runaway writes while the table stays in on-demand mode."
    fr: "Une table à la demande ou un index secondaire global peut avoir un débit maximal facultatif de lecture ou d'écriture par seconde. Les requêtes au-delà du maximum sont limitées avec une ThrottlingException, ce qui borne le coût d'écritures incontrôlées tout en gardant la table en mode à la demande."
  options:
    b:
      en: "Provisioned mode would cap the writes, but the company wants to keep on-demand mode."
      fr: "Le mode provisionné plafonnerait les écritures, mais l'entreprise veut conserver le mode à la demande."
    c:
      en: "Reserved capacity applies to provisioned capacity, not to on-demand tables, and it does not cap anything."
      fr: "La capacité réservée s'applique à la capacité provisionnée, pas aux tables à la demande, et elle ne plafonne rien."
    d:
      en: "A custom alarm and function react after the cost is already incurred and must be built and maintained."
      fr: "Une alarme et une fonction personnalisées réagissent une fois le coût déjà engagé, et elles doivent être construites et maintenues."
references:
  - title: DynamoDB maximum throughput for on-demand tables
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode-max-throughput.html
