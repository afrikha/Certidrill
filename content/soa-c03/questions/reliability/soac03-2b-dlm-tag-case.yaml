id: soac03-2b-dlm-tag-case
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer created an Amazon Data Lifecycle Manager policy to snapshot the company's Amazon EBS data volumes every 12 hours. The policy is enabled and uses the default role, but no snapshots are created. The data volumes have a tag with the key `Backup` and the value `Yes`. The policy details are:

    ```json
    {
      "PolicyType": "EBS_SNAPSHOT_MANAGEMENT",
      "ResourceTypes": ["VOLUME"],
      "TargetTags": [{ "Key": "backup", "Value": "yes" }],
      "Schedules": [
        {
          "Name": "Every12Hours",
          "CreateRule": { "Interval": 12, "IntervalUnit": "HOURS", "Times": ["00:00"] },
          "RetainRule": { "Count": 14 }
        }
      ]
    }
    ```

    Which change will make the policy create the snapshots?
  fr: |
    Un ingénieur a créé une politique Amazon Data Lifecycle Manager pour prendre des instantanés des volumes de données Amazon EBS de l'entreprise toutes les 12 heures. La politique est activée et utilise le rôle par défaut, mais aucun instantané n'est créé. Les volumes de données ont une balise de clé `Backup` et de valeur `Yes`. Les détails de la politique sont les suivants :

    ```json
    {
      "PolicyType": "EBS_SNAPSHOT_MANAGEMENT",
      "ResourceTypes": ["VOLUME"],
      "TargetTags": [{ "Key": "backup", "Value": "yes" }],
      "Schedules": [
        {
          "Name": "Every12Hours",
          "CreateRule": { "Interval": 12, "IntervalUnit": "HOURS", "Times": ["00:00"] },
          "RetainRule": { "Count": 14 }
        }
      ]
    }
    ```

    Quelle modification permet à la politique de créer les instantanés ?
body:
  options:
    - { id: a, text: { en: "Change the resource type of the policy from VOLUME to INSTANCE.", fr: "Passer le type de ressource de la politique de VOLUME à INSTANCE." } }
    - { id: b, text: { en: "Change the target tag of the policy to the key Backup with the value Yes.", fr: "Remplacer la balise cible de la politique par la clé Backup avec la valeur Yes." } }
    - { id: c, text: { en: "Replace the count-based retention rule with an age-based retention rule of 7 days.", fr: "Remplacer la règle de rétention basée sur le nombre par une règle de rétention basée sur l'âge de 7 jours." } }
    - { id: d, text: { en: "Remove the Times parameter so that the schedule starts as soon as the policy is saved.", fr: "Supprimer le paramètre Times pour que la planification démarre dès l'enregistrement de la politique." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Amazon Data Lifecycle Manager backs up only the resources that have the specified tag key and value pairs, and target resource tags are case sensitive. The policy looks for `backup=yes`, which matches no volume tagged `Backup=Yes`; using the exact key and value makes the volumes targets of the schedule.
    fr: |
      Amazon Data Lifecycle Manager ne sauvegarde que les ressources qui portent les paires clé-valeur de balise spécifiées, et les balises des ressources cibles sont sensibles à la casse. La politique cherche `backup=yes`, qui ne correspond à aucun volume balisé `Backup=Yes` ; utiliser exactement la même clé et la même valeur fait des volumes les cibles de la planification.
  options:
    a: { en: "The INSTANCE type creates multi-volume snapshots of tagged instances; the tag mismatch would remain and the data volumes are the ones that are tagged.", fr: "Le type INSTANCE crée des instantanés multivolumes d'instances balisées ; l'écart de balise subsisterait, et ce sont les volumes de données qui sont balisés." }
    c: { en: "The retention rule only decides which snapshots are deleted; it does not cause snapshots to be skipped.", fr: "La règle de rétention détermine seulement quels instantanés sont supprimés ; elle ne fait pas ignorer la création d'instantanés." }
    d: { en: "The start time only sets when the schedule runs; no volume matches the target tags, so no snapshot would be created at any time.", fr: "L'heure de début fixe seulement le moment d'exécution de la planification ; aucun volume ne correspond aux balises cibles, donc aucun instantané ne serait jamais créé." }
references:
  - title: Create Amazon Data Lifecycle Manager custom policy for EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-ami-policy.html
