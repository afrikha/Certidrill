id: soac03-2a-instance-refresh-rollback
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Auto Scaling group behind an Application Load Balancer uses launch template lt-web with the version set to $Latest. Version 6 of the template is in use, and an operations engineer has created version 7 with a new AMI. The engineer must replace all instances in a rolling fashion. If the load balancer's HTTPCode_ELB_5XX_Count alarm enters the ALARM state during the replacement, the group must automatically return to version 6.

    Which solution will meet these requirements?
  fr: |
    Un groupe Auto Scaling placé derrière un Application Load Balancer utilise le modèle de lancement lt-web avec la version $Latest. La version 6 du modèle est en service, et un ingénieur des opérations a créé la version 7 avec une nouvelle AMI. L'ingénieur doit remplacer toutes les instances de manière progressive. Si l'alarme HTTPCode_ELB_5XX_Count de l'équilibreur de charge passe à l'état ALARM pendant le remplacement, le groupe doit revenir automatiquement à la version 6.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the group on $Latest, and start an instance refresh with AutoRollback set to true and the alarm in the alarm specification.", fr: "Laisser le groupe sur $Latest, et démarrer une actualisation d'instance avec AutoRollback défini sur true et l'alarme dans la spécification d'alarme." } }
    - { id: b, text: { en: "Start an instance refresh with a desired configuration of version 7 and the alarm in the alarm specification, and leave AutoRollback disabled.", fr: "Démarrer une actualisation d'instance avec une configuration souhaitée en version 7 et l'alarme dans la spécification d'alarme, en laissant AutoRollback désactivé." } }
    - { id: c, text: { en: "Update the group to use version 6, and then start an instance refresh with a desired configuration of version 7, AutoRollback set to true, and the alarm in the alarm specification.", fr: "Configurer le groupe sur la version 6, puis démarrer une actualisation d'instance avec une configuration souhaitée en version 7, AutoRollback défini sur true et l'alarme dans la spécification d'alarme." } }
    - { id: d, text: { en: "Start an instance refresh with checkpoints at 50% and 100%, and create an EventBridge rule that calls cancel-instance-refresh when the alarm enters the ALARM state.", fr: "Démarrer une actualisation d'instance avec des points de contrôle à 50 % et 100 %, et créer une règle EventBridge qui appelle cancel-instance-refresh quand l'alarme passe à l'état ALARM." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Auto rollback returns the group to the configuration saved before the refresh started, and it works only with a desired configuration and a specific numbered launch template version, not $Latest or $Default. Pinning the group to version 6 first gives the rollback a target, and the alarm specification makes the refresh roll back when the alarm enters ALARM."
    fr: "Le rollback automatique ramène le groupe à la configuration enregistrée avant le début de l'actualisation, et il ne fonctionne qu'avec une configuration souhaitée et une version numérotée précise du modèle de lancement, pas $Latest ni $Default. Fixer d'abord le groupe sur la version 6 donne une cible au rollback, et la spécification d'alarme déclenche le rollback quand l'alarme passe à ALARM."
  options:
    a:
      en: "Rollback is not available when the group uses $Latest or $Default, so the refresh cannot return to version 6."
      fr: "Le rollback n'est pas disponible quand le groupe utilise $Latest ou $Default : l'actualisation ne peut pas revenir à la version 6."
    b:
      en: "With an alarm but without auto rollback, the instance refresh fails when the alarm fires, but the replaced instances stay on version 7."
      fr: "Avec une alarme mais sans rollback automatique, l'actualisation d'instance échoue quand l'alarme se déclenche, mais les instances remplacées restent en version 7."
    d:
      en: "Cancelling an instance refresh only stops further replacements. Instances already replaced keep version 7, so the group does not return to version 6."
      fr: "Annuler une actualisation d'instance arrête seulement les remplacements suivants. Les instances déjà remplacées gardent la version 7 : le groupe ne revient pas à la version 6."
references:
  - title: Undo changes with a manual or auto rollback
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/instance-refresh-rollback.html
