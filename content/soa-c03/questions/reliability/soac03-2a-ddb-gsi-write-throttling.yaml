id: soac03-2a-ddb-gsi-write-throttling
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon DynamoDB table in provisioned capacity mode has auto scaling for its write capacity. A global secondary index (GSI) on the table was created with a fixed 100 WCUs and no auto scaling. As order volume grows, writes to the table are throttled even though the table's ConsumedWriteCapacityUnits stays well below its ProvisionedWriteCapacityUnits. CloudWatch reports WriteThrottleEvents for the GSI.

    Which solution will stop the throttling?
  fr: |
    Une table Amazon DynamoDB en mode de capacité provisionnée utilise la mise à l'échelle automatique pour sa capacité d'écriture. Un index secondaire global (GSI) de la table a été créé avec 100 WCU fixes et sans mise à l'échelle automatique. Avec la hausse du volume de commandes, les écritures dans la table sont limitées, alors que ConsumedWriteCapacityUnits de la table reste bien en dessous de ProvisionedWriteCapacityUnits. CloudWatch signale des WriteThrottleEvents pour le GSI.

    Quelle solution met fin à la limitation ?
body:
  options:
    - { id: a, text: { en: "Increase the maximum capacity of the table's write auto scaling policy.", fr: "Augmenter la capacité maximale de la politique de mise à l'échelle automatique en écriture de la table." } }
    - { id: b, text: { en: "Enable auto scaling for the write capacity of the GSI with settings that match the table.", fr: "Activer la mise à l'échelle automatique pour la capacité d'écriture du GSI avec des paramètres identiques à ceux de la table." } }
    - { id: c, text: { en: "Add a DynamoDB Accelerator (DAX) cluster so that writes are cached before they reach the table.", fr: "Ajouter un cluster DynamoDB Accelerator (DAX) pour que les écritures soient mises en cache avant d'atteindre la table." } }
    - { id: d, text: { en: "Switch the application to eventually consistent reads on the GSI to free write capacity.", fr: "Passer l'application aux lectures à cohérence éventuelle sur le GSI pour libérer de la capacité d'écriture." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A GSI has its own provisioned throughput, and a table write succeeds only if the table and every GSI it updates have enough write capacity. The fixed 100 WCUs of the GSI throttle the writes to the table. Auto scaling on the GSI, with settings like the table's as AWS recommends, keeps its write capacity in step with the table."
    fr: "Un GSI a son propre débit provisionné, et une écriture dans la table ne réussit que si la table et chaque GSI mis à jour disposent d'assez de capacité d'écriture. Les 100 WCU fixes du GSI limitent les écritures dans la table. La mise à l'échelle automatique du GSI, avec des paramètres semblables à ceux de la table comme le recommande AWS, maintient sa capacité d'écriture au niveau de celle de la table."
  options:
    a:
      en: "The table itself has spare write capacity; raising its maximum does not add capacity to the GSI."
      fr: "La table elle-même a de la capacité d'écriture disponible ; relever son maximum n'ajoute pas de capacité au GSI."
    c:
      en: "DAX passes writes through to DynamoDB, so the GSI still needs the same write capacity."
      fr: "DAX transmet les écritures à DynamoDB : le GSI a toujours besoin de la même capacité d'écriture."
    d:
      en: "Reads on a GSI are always eventually consistent and use read capacity, so this changes nothing for writes."
      fr: "Les lectures sur un GSI sont toujours à cohérence éventuelle et utilisent la capacité de lecture : cela ne change rien pour les écritures."
references:
  - title: Using Global Secondary Indexes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
  - title: Managing throughput capacity automatically with DynamoDB auto scaling
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/AutoScaling.html
