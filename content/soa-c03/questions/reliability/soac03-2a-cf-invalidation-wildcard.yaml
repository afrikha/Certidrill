id: soac03-2a-cf-invalidation-wildcard
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations engineer uploaded new versions of 400 files under the /assets/ path of an Amazon S3 origin. The files keep the same names, and the Amazon CloudFront distribution must serve the new versions as soon as possible. The AWS account has already used 900 invalidation paths this month.

    Which solution will meet these requirements at the LOWEST cost?
  fr: |
    Un ingénieur des opérations a chargé de nouvelles versions de 400 fichiers sous le chemin /assets/ d'une origine Amazon S3. Les fichiers gardent les mêmes noms, et la distribution Amazon CloudFront doit servir les nouvelles versions le plus vite possible. Le compte AWS a déjà utilisé 900 chemins d'invalidation ce mois-ci.

    Quelle solution répond à ces exigences au coût le PLUS FAIBLE ?
body:
  options:
    - { id: a, text: { en: "Create an invalidation that lists the paths of the 400 changed files.", fr: "Créer une invalidation qui liste les chemins des 400 fichiers modifiés." } }
    - { id: b, text: { en: "Upload the 400 files again with a Cache-Control: max-age=0 header.", fr: "Charger de nouveau les 400 fichiers avec un en-tête Cache-Control: max-age=0." } }
    - { id: c, text: { en: "Create an invalidation with the single path /assets/*.", fr: "Créer une invalidation avec le seul chemin /assets/*." } }
    - { id: d, text: { en: "Set the maximum TTL of the cache behavior to 0 seconds.", fr: "Définir la TTL maximale du comportement de cache sur 0 seconde." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The first 1,000 invalidation paths each month are free across the whole account, and a path with a * wildcard counts as one path however many files it matches. /assets/* brings the month to 901 paths, while listing 400 paths would reach 1,300 and make 300 of them billable."
    fr: "Les 1 000 premiers chemins d'invalidation de chaque mois sont gratuits pour l'ensemble du compte, et un chemin avec le caractère générique * compte pour un seul chemin, quel que soit le nombre de fichiers concernés. /assets/* porte le mois à 901 chemins, alors que lister 400 chemins atteindrait 1 300, dont 300 facturés."
  options:
    a:
      en: "Each listed path is billed separately, so 300 of the 400 paths go over the monthly free allowance."
      fr: "Chaque chemin listé est facturé séparément : 300 des 400 chemins dépassent l'allocation gratuite mensuelle."
    b:
      en: "New object metadata at the origin does not remove the copies already cached at edge locations, which keep serving the old files until they expire."
      fr: "De nouvelles métadonnées d'objet à l'origine ne suppriment pas les copies déjà en cache dans les emplacements périphériques, qui continuent de servir les anciens fichiers jusqu'à leur expiration."
    d:
      en: "Disabling caching for the whole behavior sends every request to the origin from then on, which raises origin load and cost for all files."
      fr: "Désactiver la mise en cache pour tout le comportement envoie ensuite chaque requête à l'origine, ce qui augmente la charge et le coût de l'origine pour tous les fichiers."
references:
  - title: Pay for file invalidation
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/PayingForInvalidation.html
  - title: Invalidate files to remove content
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Invalidation.html
