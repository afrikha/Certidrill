id: soac03-2a-cf-stale-if-error
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company serves product pages through Amazon CloudFront from an Application Load Balancer origin. Pages can be cached for 5 minutes. During short origin outages, the load balancer returns HTTP 503 errors, and viewers see errors as soon as the cached pages expire. The company wants CloudFront to keep serving the last cached version of a page for up to 1 hour when the origin returns 5xx errors, while still refreshing pages every 5 minutes when the origin is healthy. The cache policy has a maximum TTL of 1 day.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de vente au détail sert ses pages produits via Amazon CloudFront depuis une origine Application Load Balancer. Les pages peuvent être mises en cache pendant 5 minutes. Lors de courtes pannes de l'origine, l'équilibreur de charge renvoie des erreurs HTTP 503, et les utilisateurs voient des erreurs dès que les pages en cache expirent. L'entreprise veut que CloudFront continue de servir la dernière version en cache d'une page pendant 1 heure au maximum quand l'origine renvoie des erreurs 5xx, tout en actualisant les pages toutes les 5 minutes quand l'origine fonctionne normalement. La politique de cache a une TTL maximale de 1 jour.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the minimum TTL of the cache policy to 3,600 seconds.", fr: "Définir la TTL minimale de la politique de cache sur 3 600 secondes." } }
    - { id: b, text: { en: "Create a custom error response for 503 with an error caching minimum TTL of 3,600 seconds.", fr: "Créer une réponse d'erreur personnalisée pour 503 avec une durée de vie minimale de mise en cache des erreurs de 3 600 secondes." } }
    - { id: c, text: { en: "Configure the origin to return Cache-Control: max-age=300, stale-if-error=3600 for product pages.", fr: "Configurer l'origine pour renvoyer Cache-Control: max-age=300, stale-if-error=3600 pour les pages produits." } }
    - { id: d, text: { en: "Create an origin group that uses the same load balancer as both the primary and the secondary origin.", fr: "Créer un groupe d'origines qui utilise le même équilibreur de charge comme origine principale et comme origine secondaire." } }
answer: { optionId: c }
explanation:
  correct:
    en: "max-age=300 keeps the normal 5-minute refresh. stale-if-error=3600 lets CloudFront serve the expired cached page when the origin is unreachable or returns a 500–599 error, for up to the lesser of 3,600 seconds and the maximum TTL of 1 day, so up to 1 hour."
    fr: "max-age=300 conserve l'actualisation normale toutes les 5 minutes. stale-if-error=3600 permet à CloudFront de servir la page expirée en cache quand l'origine est injoignable ou renvoie une erreur 500 à 599, pendant la plus petite valeur entre 3 600 secondes et la TTL maximale de 1 jour, soit 1 heure au maximum."
  options:
    a:
      en: "A 1-hour minimum TTL makes pages up to 1 hour old even when the origin is healthy, which breaks the 5-minute refresh requirement."
      fr: "Une TTL minimale d'une heure rend les pages vieilles d'une heure au maximum même quand l'origine fonctionne, ce qui enfreint l'exigence d'actualisation toutes les 5 minutes."
    b:
      en: "This setting keeps the 503 error itself in the cache for an hour, so viewers would see the error even after the origin recovers."
      fr: "Ce paramètre garde l'erreur 503 elle-même en cache pendant une heure : les utilisateurs verraient l'erreur même après le rétablissement de l'origine."
    d:
      en: "Failing over to the same failing load balancer gives the same 503 errors, and origin failover does not serve cached content."
      fr: "Basculer vers le même équilibreur de charge défaillant renvoie les mêmes erreurs 503, et le basculement d'origine ne sert pas de contenu en cache."
references:
  - title: Manage how long content stays in the cache (expiration)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html
