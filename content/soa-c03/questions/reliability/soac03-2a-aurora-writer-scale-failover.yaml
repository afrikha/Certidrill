id: soac03-2a-aurora-writer-scale-failover
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon Aurora MySQL DB cluster has a provisioned writer on db.r6g.xlarge and one Aurora Replica on db.r6g.xlarge. The writer must move to db.r6g.4xlarge because of growing write load. The company wants the shortest possible interruption of writes, and the applications must keep using the cluster endpoint.

    Which solution will meet these requirements?
  fr: |
    Un cluster de bases de données Amazon Aurora MySQL comprend une instance d'écriture provisionnée en db.r6g.xlarge et un réplica Aurora en db.r6g.xlarge. L'instance d'écriture doit passer en db.r6g.4xlarge à cause de la hausse de la charge d'écriture. L'entreprise veut l'interruption des écritures la plus courte possible, et les applications doivent continuer à utiliser le point de terminaison du cluster.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Modify the instance class of the writer to db.r6g.4xlarge with Apply immediately.", fr: "Modifier la classe d'instance de l'instance d'écriture en db.r6g.4xlarge avec Apply immediately." } }
    - { id: b, text: { en: "Take a snapshot of the cluster, restore it to a new cluster with a db.r6g.4xlarge writer, and update the applications.", fr: "Prendre un instantané du cluster, le restaurer dans un nouveau cluster doté d'une instance d'écriture db.r6g.4xlarge, et mettre à jour les applications." } }
    - { id: c, text: { en: "Modify the existing Aurora Replica to db.r6g.4xlarge, and wait for Aurora to promote it automatically.", fr: "Modifier le réplica Aurora existant en db.r6g.4xlarge, et attendre qu'Aurora le promeuve automatiquement." } }
    - { id: d, text: { en: "Add an Aurora Replica on db.r6g.4xlarge in promotion tier 0, and then fail over the cluster to that replica.", fr: "Ajouter un réplica Aurora en db.r6g.4xlarge au niveau de promotion 0, puis faire basculer le cluster vers ce réplica." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A failover to an existing Aurora Replica typically restores service in less than 60 seconds, often less than 30 seconds, and the cluster endpoint then points to the new writer. Creating the larger replica first and failing over to it with failover-db-cluster replaces a longer instance class modification of the writer with a short failover."
    fr: "Un basculement vers un réplica Aurora existant rétablit généralement le service en moins de 60 secondes, souvent en moins de 30 secondes, et le point de terminaison du cluster désigne ensuite la nouvelle instance d'écriture. Créer d'abord le réplica plus grand puis basculer vers lui avec failover-db-cluster remplace une modification de classe plus longue de l'instance d'écriture par un court basculement."
  options:
    a:
      en: "Changing the instance class of the writer makes it unavailable while the change is applied, which takes longer than a failover."
      fr: "Changer la classe de l'instance d'écriture la rend indisponible pendant l'application de la modification, ce qui dure plus longtemps qu'un basculement."
    b:
      en: "A restored cluster has new endpoints and misses the writes made after the snapshot, so the applications break and data is lost."
      fr: "Un cluster restauré a de nouveaux points de terminaison et ne contient pas les écritures faites après l'instantané : les applications sont interrompues et des données sont perdues."
    c:
      en: "Aurora promotes a replica only when the writer fails or when an operator starts a failover, so the larger replica would never become the writer on its own."
      fr: "Aurora ne promeut un réplica qu'en cas de défaillance de l'instance d'écriture ou quand un opérateur lance un basculement : le réplica plus grand ne deviendrait jamais seul l'instance d'écriture."
references:
  - title: High availability for Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html
