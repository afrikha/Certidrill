id: soac03-2a-graviton-ami-mismatch
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    To reduce costs, an operations engineer created a new version of a launch template that changes the instance type from m6i.large to m7g.large, and updated an Auto Scaling group to use it. The AMI ID was not changed. Since then, the group cannot launch instances, and its activity history shows the following message:

    ```text
    The requested configuration is currently not supported. Launching EC2 instance failed.
    ```

    Which action will resolve the issue?
  fr: |
    Pour réduire les coûts, un ingénieur des opérations a créé une nouvelle version d'un modèle de lancement qui remplace le type d'instance m6i.large par m7g.large, et a configuré un groupe Auto Scaling pour l'utiliser. L'ID de l'AMI n'a pas changé. Depuis, le groupe ne parvient plus à lancer d'instances, et son historique d'activité affiche le message suivant :

    ```text
    The requested configuration is currently not supported. Launching EC2 instance failed.
    ```

    Quelle action permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Request an increase of the Running On-Demand Standard instances quota in the Region.", fr: "Demander une augmentation du quota Running On-Demand Standard instances dans la Région." } }
    - { id: b, text: { en: "Add more Availability Zones to the group so that it can find m7g.large capacity.", fr: "Ajouter des zones de disponibilité au groupe pour qu'il trouve de la capacité m7g.large." } }
    - { id: c, text: { en: "Create a template version with an arm64 AMI, and update the group to use it.", fr: "Créer une version du modèle avec une AMI arm64, et configurer le groupe pour l'utiliser." } }
    - { id: d, text: { en: "Enable Capacity Rebalancing on the group so that it retries the launch in other capacity pools.", fr: "Activer Capacity Rebalancing sur le groupe pour qu'il retente le lancement dans d'autres pools de capacité." } }
answer: { optionId: c }
explanation:
  correct:
    en: "This message means that an option of the launch template does not fit the instance type, Region or Availability Zone. m7g instances use AWS Graviton (Arm) processors, so the x86_64 AMI used with m6i cannot run on them. A new template version with an arm64 AMI, applied to the group, fixes the launches."
    fr: "Ce message signifie qu'une option du modèle de lancement ne convient pas au type d'instance, à la Région ou à la zone de disponibilité. Les instances m7g utilisent des processeurs AWS Graviton (Arm) : l'AMI x86_64 utilisée avec m6i ne peut pas y fonctionner. Une nouvelle version du modèle avec une AMI arm64, appliquée au groupe, rétablit les lancements."
  options:
    a:
      en: "A Regional instance quota problem produces a message that instances are already running, not an unsupported configuration error."
      fr: "Un problème de quota d'instances dans la Région produit un message indiquant que des instances sont déjà en cours d'exécution, pas une erreur de configuration non prise en charge."
    b:
      en: "Adding zones helps with insufficient capacity errors, but the AMI architecture would still be wrong in every zone."
      fr: "Ajouter des zones aide en cas d'erreur de capacité insuffisante, mais l'architecture de l'AMI resterait incorrecte dans toutes les zones."
    d:
      en: "Capacity Rebalancing replaces Spot Instances at risk of interruption; it does not fix an AMI that does not match the instance architecture."
      fr: "Capacity Rebalancing remplace les instances Spot exposées à une interruption ; il ne corrige pas une AMI qui ne correspond pas à l'architecture de l'instance."
references:
  - title: "Troubleshoot Amazon EC2 Auto Scaling: EC2 instance launch failures"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ts-as-capacity.html
