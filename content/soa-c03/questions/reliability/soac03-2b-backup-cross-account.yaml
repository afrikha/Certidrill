id: soac03-2b-backup-cross-account
objective: "2.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has a Production account and a Backup account in the same organization in AWS Organizations. An AWS Backup plan in the Production account backs up Amazon EFS file systems daily and has a copy action to a backup vault named central-vault in the Backup account. central-vault was created with default settings and uses a customer managed AWS KMS key of the Backup account. The company has never changed any organization-level AWS Backup setting. Every copy job fails.

    Which combination of actions will make the copy jobs succeed? (Choose two.)
  fr: |
    Une entreprise dispose d'un compte Production et d'un compte Backup dans la même organisation AWS Organizations. Un plan AWS Backup du compte Production sauvegarde chaque jour des systèmes de fichiers Amazon EFS et comporte une action de copie vers un coffre de sauvegarde nommé central-vault dans le compte Backup. central-vault a été créé avec les paramètres par défaut et utilise une clé AWS KMS gérée par le client du compte Backup. L'entreprise n'a jamais modifié aucun paramètre AWS Backup au niveau de l'organisation. Chaque tâche de copie échoue.

    Quelle combinaison d'actions permet aux tâches de copie de réussir ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Share the AWS managed key aws/backup of the Production account with the Backup account.", fr: "Partager la clé gérée par AWS aws/backup du compte Production avec le compte Backup." } }
    - { id: b, text: { en: "Turn on cross-account backup in the AWS Backup settings by using the management account of the organization.", fr: "Activer la sauvegarde entre comptes dans les paramètres AWS Backup à l'aide du compte de gestion de l'organisation." } }
    - { id: c, text: { en: "Change the destination of the copy action to the default backup vault of the Backup account.", fr: "Remplacer la destination de l'action de copie par le coffre de sauvegarde par défaut du compte Backup." } }
    - { id: d, text: { en: "Turn on AWS Backup Vault Lock in compliance mode for central-vault.", fr: "Activer AWS Backup Vault Lock en mode conformité pour central-vault." } }
    - { id: e, text: { en: "Add an access policy to central-vault that allows backup:CopyIntoBackupVault for the Production account.", fr: "Ajouter à central-vault une politique d'accès qui autorise backup:CopyIntoBackupVault pour le compte Production." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Cross-account copies require accounts in the same organization and cross-account backup turned on for the organization, which only the management account can do. The destination vault must also allow `backup:CopyIntoBackupVault` in its access policy; without it, copies into the destination account are denied. EFS is fully managed by AWS Backup, so the customer managed key of the destination vault can encrypt the copies.
    fr: |
      Les copies entre comptes exigent des comptes de la même organisation et l'activation de la sauvegarde entre comptes pour l'organisation, ce que seul le compte de gestion peut faire. Le coffre de destination doit aussi autoriser `backup:CopyIntoBackupVault` dans sa politique d'accès ; sans elle, les copies vers le compte de destination sont refusées. EFS est entièrement géré par AWS Backup : la clé gérée par le client du coffre de destination peut chiffrer les copies.
  options:
    a: { en: "Policies of AWS managed keys cannot be changed, so these keys cannot be shared with another account.", fr: "Les politiques des clés gérées par AWS ne peuvent pas être modifiées : ces clés ne peuvent pas être partagées avec un autre compte." }
    c: { en: "The default vault cannot be a cross-account destination, because its key cannot be shared with other accounts.", fr: "Le coffre par défaut ne peut pas être une destination entre comptes, car sa clé ne peut pas être partagée avec d'autres comptes." }
    d: { en: "Vault Lock prevents recovery points from being deleted or changed; it does not grant permission to copy into the vault.", fr: "Vault Lock empêche la suppression ou la modification des points de récupération ; il n'accorde pas l'autorisation de copier dans le coffre." }
references:
  - title: Creating backup copies across AWS accounts
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-account-backup.html
