id: soac03-2b-backup-s3-versioning
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineer adds several Amazon S3 buckets to an AWS Backup plan. Backup jobs succeed for most buckets, but they fail for a bucket that a team created recently with the default bucket settings.

    Which action will allow AWS Backup to back up this bucket?
  fr: |
    Un ingénieur ajoute plusieurs compartiments Amazon S3 à un plan AWS Backup. Les tâches de sauvegarde réussissent pour la plupart des compartiments, mais elles échouent pour un compartiment qu'une équipe a créé récemment avec les paramètres par défaut.

    Quelle action permet à AWS Backup de sauvegarder ce compartiment ?
body:
  options:
    - { id: a, text: { en: "Turn on S3 Object Lock for the bucket.", fr: "Activer S3 Object Lock pour le compartiment." } }
    - { id: b, text: { en: "Turn on S3 Versioning for the bucket.", fr: "Activer S3 Versioning pour le compartiment." } }
    - { id: c, text: { en: "Turn on S3 Transfer Acceleration for the bucket.", fr: "Activer S3 Transfer Acceleration pour le compartiment." } }
    - { id: d, text: { en: "Turn on server access logging for the bucket.", fr: "Activer la journalisation des accès au serveur pour le compartiment." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS Backup for Amazon S3 requires S3 Versioning on the bucket, and new buckets do not have versioning enabled by default. AWS recommends also setting a lifecycle expiration period for the object versions so that the bucket does not keep old versions forever.
    fr: |
      AWS Backup pour Amazon S3 exige l'activation de S3 Versioning sur le compartiment, et les nouveaux compartiments n'ont pas la gestion des versions activée par défaut. AWS recommande aussi de définir une période d'expiration de cycle de vie pour les versions d'objets afin que le compartiment ne conserve pas indéfiniment les anciennes versions.
  options:
    a: { en: "Object Lock protects object versions from deletion; it is not the prerequisite for AWS Backup.", fr: "Object Lock protège les versions d'objets contre la suppression ; ce n'est pas le prérequis d'AWS Backup." }
    c: { en: "Transfer Acceleration speeds up long-distance uploads and downloads; it has no role in backups.", fr: "Transfer Acceleration accélère les chargements et téléchargements à longue distance ; il ne joue aucun rôle dans les sauvegardes." }
    d: { en: "Server access logging records requests to the bucket; AWS Backup does not need it.", fr: "La journalisation des accès au serveur enregistre les requêtes adressées au compartiment ; AWS Backup n'en a pas besoin." }
references:
  - title: Amazon S3 backups
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/s3-backups.html
