id: soac03-2c-dr-ebs-snapshot-kms
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company encrypts the Amazon EBS volumes of its application with a customer managed AWS KMS key in us-east-1. For its backup and restore disaster recovery plan, an operator must copy the snapshots of these volumes to us-west-2 so that volumes can be created there if us-east-1 is unavailable. The copies must stay encrypted with a key that the company manages.

    Which solution will meet these requirements?
  fr: |
    Une entreprise chiffre les volumes Amazon EBS de son application avec une clé AWS KMS gérée par le client dans us-east-1. Pour son plan de reprise après sinistre de type sauvegarde et restauration, un opérateur doit copier les instantanés de ces volumes dans us-west-2 afin que des volumes puissent y être créés si us-east-1 est indisponible. Les copies doivent rester chiffrées avec une clé que l'entreprise gère.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Copy the snapshots to us-west-2, and specify the ARN of the us-east-1 customer managed key for the copies.", fr: "Copier les instantanés dans us-west-2, et indiquer pour les copies l'ARN de la clé gérée par le client de us-east-1." } }
    - { id: b, text: { en: "Copy the snapshots to us-west-2 without encryption, and encrypt the volumes after they are created during a recovery.", fr: "Copier les instantanés dans us-west-2 sans chiffrement, et chiffrer les volumes après leur création lors d'une reprise." } }
    - { id: c, text: { en: "Create a customer managed key in us-west-2, and specify it when copying the snapshots to us-west-2.", fr: "Créer une clé gérée par le client dans us-west-2, et l'indiquer lors de la copie des instantanés vers us-west-2." } }
    - { id: d, text: { en: "Share the snapshots with us-west-2 by modifying their create volume permissions.", fr: "Partager les instantanés avec us-west-2 en modifiant leurs autorisations de création de volume." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A standard KMS key exists in a single Region, so a cross-Region snapshot copy must be encrypted with a key that is usable in the destination Region, such as a customer managed key created there or a multi-Region replica key. The copy of an encrypted snapshot is always encrypted, and specifying the us-west-2 key keeps it under the company's control.
    fr: |
      Une clé KMS standard existe dans une seule Région : une copie interrégionale d'instantané doit donc être chiffrée avec une clé utilisable dans la Région de destination, par exemple une clé gérée par le client créée dans cette Région ou une clé réplica multi-Région. La copie d'un instantané chiffré est toujours chiffrée, et indiquer la clé de us-west-2 la garde sous le contrôle de l'entreprise.
  options:
    a: { en: "A key in us-east-1 cannot encrypt resources in us-west-2, and a copy that depends on us-east-1 keys would fail during the outage it is meant for.", fr: "Une clé de us-east-1 ne peut pas chiffrer des ressources dans us-west-2, et une copie dépendant de clés de us-east-1 échouerait pendant la panne qu'elle doit couvrir." }
    b: { en: "The copy of an encrypted snapshot is always encrypted, so an unencrypted copy is not possible, and the requirement forbids it anyway.", fr: "La copie d'un instantané chiffré est toujours chiffrée : une copie non chiffrée est impossible, et l'exigence l'interdit de toute façon." }
    d: { en: "Snapshot permissions share snapshots with other accounts in the same Region; they do not move snapshots to another Region.", fr: "Les autorisations d'instantané partagent des instantanés avec d'autres comptes de la même Région ; elles ne déplacent pas d'instantanés vers une autre Région." }
references:
  - title: Copy an Amazon EBS snapshot - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-copy-snapshot.html
