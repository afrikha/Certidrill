id: soac03-2b-alb-hc-sg-timeout
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances that are registered in a target group behind an Application Load Balancer. The target group performs HTTP health checks on port 8080. After a security review, an engineer replaced all inbound rules of the instances' security group with one rule that allows port 443 from the company's office network. Since the change, every target is unhealthy with the reason code `Target.Timeout`.

    Which solution will resolve the issue while keeping access to the instances as restricted as possible?
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 enregistrées dans un groupe cible derrière un Application Load Balancer. Le groupe cible effectue des vérifications de l'état HTTP sur le port 8080. Après un audit de sécurité, un ingénieur a remplacé toutes les règles entrantes du groupe de sécurité des instances par une seule règle qui autorise le port 443 depuis le réseau des bureaux de l'entreprise. Depuis cette modification, toutes les cibles sont défaillantes avec le code de motif `Target.Timeout`.

    Quelle solution permet de résoudre le problème tout en limitant le plus possible l'accès aux instances ?
body:
  options:
    - { id: a, text: { en: "Add an outbound rule to the load balancer's security group that allows TCP port 443 to the office network.", fr: "Ajouter au groupe de sécurité de l'équilibreur de charge une règle sortante qui autorise le port TCP 443 vers le réseau des bureaux." } }
    - { id: b, text: { en: "Add an inbound rule to the instances' security group that allows TCP port 8080 from the load balancer's security group.", fr: "Ajouter au groupe de sécurité des instances une règle entrante qui autorise le port TCP 8080 depuis le groupe de sécurité de l'équilibreur de charge." } }
    - { id: c, text: { en: "Change the success codes of the target group health check to 200-499 so that the targets pass.", fr: "Définir les codes de réussite de la vérification de l'état du groupe cible sur 200-499 pour que les cibles la réussissent." } }
    - { id: d, text: { en: "Add an inbound rule to the instances' security group that allows TCP port 8080 from 0.0.0.0/0.", fr: "Ajouter au groupe de sécurité des instances une règle entrante qui autorise le port TCP 8080 depuis 0.0.0.0/0." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The security group of the instances must allow traffic from the load balancer on the health check port and protocol; the new rule set drops the health check requests, so they time out. A rule whose source is the load balancer's security group admits only the load balancer nodes, which keeps the instances closed to everyone else.
    fr: |
      Le groupe de sécurité des instances doit autoriser le trafic de l'équilibreur de charge sur le port et le protocole de la vérification de l'état ; les nouvelles règles rejettent les requêtes de vérification, qui expirent. Une règle dont la source est le groupe de sécurité de l'équilibreur de charge n'admet que les nœuds de l'équilibreur, ce qui laisse les instances fermées à tous les autres.
  options:
    a: { en: "The health checks go from the load balancer to the instances on port 8080; an outbound rule toward the office network does not let them in.", fr: "Les vérifications de l'état vont de l'équilibreur de charge vers les instances sur le port 8080 ; une règle sortante vers le réseau des bureaux ne les laisse pas entrer." }
    c: { en: "Success codes apply only to responses that the load balancer receives; a request that times out returns no code at all.", fr: "Les codes de réussite ne s'appliquent qu'aux réponses que l'équilibreur de charge reçoit ; une requête qui expire ne renvoie aucun code." }
    d: { en: "This rule fixes the health checks but opens port 8080 to the whole internet, which does not keep access restricted.", fr: "Cette règle corrige les vérifications de l'état, mais ouvre le port 8080 à tout Internet, ce qui ne limite pas l'accès." }
references:
  - title: Troubleshoot your Application Load Balancers
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-troubleshooting.html
  - title: Health checks for Application Load Balancer target groups
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
