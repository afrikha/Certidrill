id: soac03-2a-asg-launch-hook-bootstrap
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. After launch, each instance runs a configuration script that takes about 8 minutes. Users receive errors because new instances are registered with the target group and receive requests before the script finishes. The company wants instances to receive traffic only after the script completes successfully, and instances on which the script fails must be replaced.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 d'un groupe Auto Scaling placé derrière un Application Load Balancer. Après son lancement, chaque instance exécute un script de configuration qui dure environ 8 minutes. Les utilisateurs reçoivent des erreurs, car les nouvelles instances sont enregistrées dans le groupe cible et reçoivent des requêtes avant la fin du script. L'entreprise veut que les instances ne reçoivent du trafic qu'une fois le script terminé avec succès, et les instances sur lesquelles le script échoue doivent être remplacées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the health check grace period of the Auto Scaling group to 600 seconds so that new instances are not checked while the script runs.", fr: "Porter la période de grâce de la vérification de l'état du groupe Auto Scaling à 600 secondes pour que les nouvelles instances ne soient pas vérifiées pendant le script." } }
    - { id: b, text: { en: "Add an EC2_INSTANCE_LAUNCHING lifecycle hook, and make the script call complete-lifecycle-action with CONTINUE or ABANDON.", fr: "Ajouter un hook de cycle de vie EC2_INSTANCE_LAUNCHING, et faire appeler par le script complete-lifecycle-action avec CONTINUE ou ABANDON." } }
    - { id: c, text: { en: "Set the default instance warmup of the Auto Scaling group to 600 seconds so that new instances join the target group after the script.", fr: "Définir le préchauffage d'instance par défaut du groupe Auto Scaling sur 600 secondes pour que les nouvelles instances rejoignent le groupe cible après le script." } }
    - { id: d, text: { en: "Increase the deregistration delay of the target group to 600 seconds so that new instances wait before they receive requests.", fr: "Porter le délai d'annulation de l'enregistrement du groupe cible à 600 secondes pour que les nouvelles instances attendent avant de recevoir des requêtes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A launch lifecycle hook keeps the new instance in the Pending:Wait state, so it is not put in service or registered with the load balancer until the hook completes. The script reports CONTINUE to let the instance enter service, or ABANDON so that Amazon EC2 Auto Scaling terminates and replaces the instance. If the script never answers, the hook times out after its heartbeat timeout (one hour by default)."
    fr: "Un hook de cycle de vie de lancement maintient la nouvelle instance dans l'état Pending:Wait : elle n'est ni mise en service ni enregistrée auprès de l'équilibreur de charge tant que le hook n'est pas terminé. Le script renvoie CONTINUE pour mettre l'instance en service, ou ABANDON pour qu'Amazon EC2 Auto Scaling la résilie et la remplace. Si le script ne répond jamais, le hook expire après son délai de pulsation (une heure par défaut)."
  options:
    a:
      en: "The grace period only delays the moment when a failed health check can terminate the instance. The instance is still put in service and registered immediately, so it still receives requests too early."
      fr: "La période de grâce retarde seulement le moment où une vérification de l'état échouée peut résilier l'instance. L'instance est quand même mise en service et enregistrée immédiatement : elle reçoit toujours des requêtes trop tôt."
    c:
      en: "The default instance warmup only controls when a new instance's metrics count in the group's aggregated metrics for scaling. It does not delay registration with the load balancer."
      fr: "Le préchauffage d'instance par défaut contrôle seulement le moment où les métriques d'une nouvelle instance comptent dans les métriques agrégées du groupe pour la mise à l'échelle. Il ne retarde pas l'enregistrement auprès de l'équilibreur de charge."
    d:
      en: "The deregistration delay applies to targets that are being removed from the target group, to let in-flight requests finish. It has no effect on new targets."
      fr: "Le délai d'annulation de l'enregistrement s'applique aux cibles retirées du groupe cible, pour laisser se terminer les requêtes en cours. Il n'a aucun effet sur les nouvelles cibles."
references:
  - title: Amazon EC2 Auto Scaling lifecycle hooks
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
