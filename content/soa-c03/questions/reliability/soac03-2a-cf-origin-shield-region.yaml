id: soac03-2a-cf-origin-shield-region
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company serves large media files from an on-premises HTTP origin through Amazon CloudFront. The origin has limited bandwidth, and its lowest network latency to AWS is to the us-east-1 Region. Most viewers are in Asia, and the rest are in North America and Europe. The origin logs show the same objects being requested many times from different CloudFront regional edge caches. The company wants to reduce the load on the origin.

    Which solution will meet these requirements?
  fr: |
    Une entreprise sert de gros fichiers multimédias depuis une origine HTTP sur site via Amazon CloudFront. L'origine dispose d'une bande passante limitée, et sa plus faible latence réseau vers AWS est vers la Région us-east-1. La plupart des utilisateurs sont en Asie, les autres en Amérique du Nord et en Europe. Les journaux de l'origine montrent que les mêmes objets sont demandés de nombreuses fois par différents caches périphériques régionaux CloudFront. L'entreprise veut réduire la charge de l'origine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable Origin Shield for the origin in the Asia Pacific (Tokyo) Region, where most viewers are.", fr: "Activer Origin Shield pour l'origine dans la Région Asie-Pacifique (Tokyo), où se trouvent la plupart des utilisateurs." } }
    - { id: b, text: { en: "Create an origin group with the on-premises origin as the primary origin and an Amazon S3 bucket as the secondary origin.", fr: "Créer un groupe d'origines avec l'origine sur site comme origine principale et un compartiment Amazon S3 comme origine secondaire." } }
    - { id: c, text: { en: "Turn on the additional CloudFront metrics for the distribution, and create an alarm on origin latency.", fr: "Activer les métriques CloudFront supplémentaires de la distribution, et créer une alarme sur la latence de l'origine." } }
    - { id: d, text: { en: "Enable Origin Shield for the origin in the us-east-1 Region.", fr: "Activer Origin Shield pour l'origine dans la Région us-east-1." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Origin Shield adds a central caching layer that all regional edge caches go through, so concurrent requests for the same object are consolidated and the origin can receive as few as one request. For an origin outside AWS, AWS recommends the Origin Shield Region with the lowest latency to the origin, here us-east-1."
    fr: "Origin Shield ajoute une couche de cache centrale par laquelle passent tous les caches périphériques régionaux : les requêtes simultanées pour un même objet sont regroupées, et l'origine peut ne recevoir qu'une seule requête. Pour une origine hors d'AWS, AWS recommande la Région Origin Shield qui a la plus faible latence vers l'origine, ici us-east-1."
  options:
    a:
      en: "Origin Shield should sit close to the origin, not to the viewers. A Region far from the origin adds latency on every fetch from the origin."
      fr: "Origin Shield doit être proche de l'origine, pas des utilisateurs. Une Région éloignée de l'origine ajoute de la latence à chaque récupération depuis l'origine."
    b:
      en: "An origin group provides failover when the primary origin fails; it does not reduce the number of requests that reach the primary origin."
      fr: "Un groupe d'origines assure le basculement quand l'origine principale échoue ; il ne réduit pas le nombre de requêtes qui atteignent l'origine principale."
    c:
      en: "Metrics and alarms help to observe the problem but do not reduce the requests that reach the origin."
      fr: "Les métriques et les alarmes aident à observer le problème, mais ne réduisent pas les requêtes qui atteignent l'origine."
references:
  - title: Use Amazon CloudFront Origin Shield
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-shield.html
