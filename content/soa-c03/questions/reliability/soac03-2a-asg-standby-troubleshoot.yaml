id: soac03-2a-asg-standby-troubleshoot
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An instance in an Auto Scaling group behind an Application Load Balancer returns intermittent errors. An operations engineer needs to stop and start the instance several times to troubleshoot it. During the troubleshooting, the instance must not receive load balancer traffic, Amazon EC2 Auto Scaling must not replace it or launch an additional instance, and the instance must remain a member of the group. The group's desired capacity is above its minimum size.

    What should the engineer do?
  fr: |
    Une instance d'un groupe Auto Scaling placé derrière un Application Load Balancer renvoie des erreurs intermittentes. Un ingénieur des opérations doit arrêter et démarrer l'instance plusieurs fois pour la dépanner. Pendant le dépannage, l'instance ne doit pas recevoir de trafic de l'équilibreur de charge, Amazon EC2 Auto Scaling ne doit ni la remplacer ni lancer d'instance supplémentaire, et l'instance doit rester membre du groupe. La capacité souhaitée du groupe est supérieure à sa taille minimale.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Suspend the HealthCheck and ReplaceUnhealthy processes of the group, and then stop the instance.", fr: "Suspendre les processus HealthCheck et ReplaceUnhealthy du groupe, puis arrêter l'instance." } }
    - { id: b, text: { en: "Run enter-standby for the instance with --should-decrement-desired-capacity, and run exit-standby when the troubleshooting is complete.", fr: "Exécuter enter-standby pour l'instance avec --should-decrement-desired-capacity, et exécuter exit-standby à la fin du dépannage." } }
    - { id: c, text: { en: "Run enter-standby for the instance without --should-decrement-desired-capacity, and run exit-standby when the troubleshooting is complete.", fr: "Exécuter enter-standby pour l'instance sans --should-decrement-desired-capacity, et exécuter exit-standby à la fin du dépannage." } }
    - { id: d, text: { en: "Run set-instance-protection with --protected-from-scale-in for the instance, and then stop the instance.", fr: "Exécuter set-instance-protection avec --protected-from-scale-in pour l'instance, puis arrêter l'instance." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An instance in Standby stays in the group, is deregistered from the target group, and is not health checked, so it can be stopped and started without being replaced. Decrementing the desired capacity prevents a replacement launch. exit-standby registers the instance again and increments the desired capacity."
    fr: "Une instance à l'état Standby reste dans le groupe, est retirée du groupe cible et n'est pas soumise aux vérifications de l'état : elle peut être arrêtée et démarrée sans être remplacée. Décrémenter la capacité souhaitée évite le lancement d'un remplacement. exit-standby réenregistre l'instance et incrémente la capacité souhaitée."
  options:
    a:
      en: "Suspending processes affects the whole group and does not deregister the instance, which receives traffic again each time it starts."
      fr: "Suspendre des processus agit sur tout le groupe et ne retire pas l'instance du groupe cible : elle reçoit de nouveau du trafic à chaque démarrage."
    c:
      en: "Without decrementing the desired capacity, Amazon EC2 Auto Scaling launches a replacement instance to keep the capacity, which the requirements forbid."
      fr: "Sans décrémenter la capacité souhaitée, Amazon EC2 Auto Scaling lance une instance de remplacement pour maintenir la capacité, ce que les exigences interdisent."
    d:
      en: "Scale-in protection does not stop health check replacement: a stopped instance is marked unhealthy and replaced, and it also keeps receiving traffic while running."
      fr: "La protection contre la diminution de la taille n'empêche pas le remplacement après vérification de l'état : une instance arrêtée est marquée défaillante et remplacée, et elle reçoit aussi du trafic quand elle tourne."
references:
  - title: Temporarily remove instances from your Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-enter-exit-standby.html
