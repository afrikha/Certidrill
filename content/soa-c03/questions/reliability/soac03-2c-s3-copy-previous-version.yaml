id: soac03-2c-s3-copy-previous-version
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company stores lab protocols in a versioning-enabled Amazon S3 bucket. A scientist uploaded a wrong file over the protocol `p-417.docx`. The company must make the previous content of `p-417.docx` the current version again. An audit rule requires that every object version that has ever existed in the bucket, including the wrong upload, is kept.

    Which solution will meet these requirements?
  fr: |
    Une entreprise pharmaceutique stocke des protocoles de laboratoire dans un compartiment Amazon S3 dont la gestion des versions est activée. Un scientifique a chargé un mauvais fichier par-dessus le protocole `p-417.docx`. L'entreprise doit refaire du contenu précédent de `p-417.docx` la version actuelle. Une règle d'audit exige que toutes les versions d'objet ayant existé dans le compartiment, y compris le mauvais chargement, soient conservées.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Permanently delete the current version of `p-417.docx` so that the previous version becomes current.", fr: "Supprimer définitivement la version actuelle de `p-417.docx` pour que la version précédente devienne actuelle." } }
    - { id: b, text: { en: "Delete `p-417.docx` without a version ID, and then delete the resulting delete marker.", fr: "Supprimer `p-417.docx` sans ID de version, puis supprimer le marqueur de suppression obtenu." } }
    - { id: c, text: { en: "Copy the previous version of `p-417.docx` onto the same key in the same bucket.", fr: "Copier la version précédente de `p-417.docx` sur la même clé dans le même compartiment." } }
    - { id: d, text: { en: "Suspend versioning on the bucket, and upload the previous content as a new object.", fr: "Suspendre la gestion des versions sur le compartiment, et charger le contenu précédent en tant que nouvel objet." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Copying a previous version into the same bucket and key creates a new current version with the earlier content and a new version ID. All existing versions, including the wrong upload, are preserved. The copy is done with `aws s3api copy-object` and a `--copy-source` that includes the `versionId`, because the console supports only the delete method.
    fr: |
      Copier une version précédente dans le même compartiment et sur la même clé crée une nouvelle version actuelle avec le contenu antérieur et un nouvel ID de version. Toutes les versions existantes, y compris le mauvais chargement, sont conservées. La copie se fait avec `aws s3api copy-object` et une option `--copy-source` qui inclut le `versionId`, car la console ne prend en charge que la méthode par suppression.
  options:
    a: { en: "Deleting the current version restores the earlier content but permanently removes the wrong upload, which the audit rule requires to keep.", fr: "Supprimer la version actuelle restaure le contenu antérieur, mais supprime définitivement le mauvais chargement, que la règle d'audit impose de conserver." }
    b: { en: "Removing the delete marker only brings back the wrong upload as the current version.", fr: "Retirer le marqueur de suppression ne fait que redonner au mauvais chargement le statut de version actuelle." }
    d: { en: "In a suspended bucket, the upload gets the `null` version ID and can overwrite an existing `null` version, which breaks the rule of keeping every version.", fr: "Dans un compartiment suspendu, le chargement reçoit l'ID de version `null` et peut écraser une version `null` existante, ce qui enfreint la règle de conservation de toutes les versions." }
references:
  - title: Restoring previous versions - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/RestoringPreviousVersions.html
