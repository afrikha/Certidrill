id: soac03-2b-r53-hc-sni
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company hosts several HTTPS websites on the same web servers. Each website has its own certificate, and the servers choose the certificate from the host name that the client sends during the TLS handshake; they reject handshakes that do not include a host name. A Route 53 HTTPS health check monitors the IP address of one server for `shop.example.com` and reports the endpoint as unhealthy, although browsers reach the website without errors.

    Which change will resolve the issue?
  fr: |
    Une entreprise héberge plusieurs sites web HTTPS sur les mêmes serveurs web. Chaque site possède son propre certificat, et les serveurs choisissent le certificat d'après le nom d'hôte que le client envoie pendant la négociation TLS ; ils rejettent les négociations qui n'incluent pas de nom d'hôte. Une vérification de l'état HTTPS Route 53 surveille l'adresse IP d'un serveur pour `shop.example.com` et signale le point de terminaison comme défaillant, alors que les navigateurs accèdent au site sans erreur.

    Quelle modification permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Increase the failure threshold of the health check to 10 consecutive checks.", fr: "Porter le seuil d'échec de la vérification de l'état à 10 vérifications consécutives." } }
    - { id: b, text: { en: "Change the health check to monitor the endpoint with the HTTP protocol on port 443.", fr: "Modifier la vérification de l'état pour surveiller le point de terminaison avec le protocole HTTP sur le port 443." } }
    - { id: c, text: { en: "Set the host name of the health check to shop.example.com and enable SNI.", fr: "Définir le nom d'hôte de la vérification de l'état sur shop.example.com et activer SNI." } }
    - { id: d, text: { en: "Add shop.example.com as the search string of the health check.", fr: "Ajouter shop.example.com comme chaîne de recherche de la vérification de l'état." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With SNI enabled, Route 53 sends the host name in the `client_hello` message of the TLS negotiation, so an endpoint that requires SNI can present the matching certificate. The host name of the health check must match one of the domain names in that certificate; without SNI, such endpoints fail the health check.
    fr: |
      Avec SNI activé, Route 53 envoie le nom d'hôte dans le message `client_hello` de la négociation TLS : un point de terminaison qui exige SNI peut présenter le certificat correspondant. Le nom d'hôte de la vérification doit correspondre à l'un des noms de domaine de ce certificat ; sans SNI, ces points de terminaison échouent à la vérification.
  options:
    a: { en: "Every handshake is rejected, so a higher threshold only delays the unhealthy status without fixing it.", fr: "Chaque négociation est rejetée : un seuil plus élevé retarde seulement l'état défaillant sans le corriger." }
    b: { en: "The servers expect TLS on port 443; a plain HTTP request on that port does not complete a valid exchange.", fr: "Les serveurs attendent TLS sur le port 443 ; une requête HTTP en clair sur ce port n'aboutit pas à un échange valide." }
    d: { en: "String matching inspects the response body, which the health checker never receives because the TLS handshake fails first; it also cannot be added to an existing health check.", fr: "La correspondance de chaîne examine le corps de la réponse, que le vérificateur ne reçoit jamais puisque la négociation TLS échoue avant ; elle ne peut pas non plus être ajoutée à une vérification existante." }
references:
  - title: Values that you specify when you create or update health checks
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-creating-values.html
