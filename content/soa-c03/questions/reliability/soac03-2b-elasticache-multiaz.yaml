id: soac03-2b-elasticache-multiaz
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon ElastiCache for Valkey replication group with cluster mode disabled. The replication group has one primary node in us-east-1a and no replica nodes. The application writes to the primary endpoint. The company wants writes to resume automatically if the primary node or its Availability Zone fails, without any endpoint change in the application.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise un groupe de réplication Amazon ElastiCache for Valkey avec le mode cluster désactivé. Le groupe de réplication comprend un nœud primaire dans us-east-1a et aucun nœud réplica. L'application écrit sur le point de terminaison principal. L'entreprise veut que les écritures reprennent automatiquement si le nœud primaire ou sa zone de disponibilité tombe en panne, sans aucune modification de point de terminaison dans l'application.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable automatic backups with a daily backup window for the replication group.", fr: "Activer les sauvegardes automatiques avec une fenêtre de sauvegarde quotidienne pour le groupe de réplication." } }
    - { id: b, text: { en: "Add a replica node in an Availability Zone other than us-east-1a.", fr: "Ajouter un nœud réplica dans une zone de disponibilité autre que us-east-1a." } }
    - { id: c, text: { en: "Change the application to write to the node endpoint of the primary node.", fr: "Modifier l'application pour qu'elle écrive sur le point de terminaison de nœud du nœud primaire." } }
    - { id: d, text: { en: "Enable Multi-AZ with automatic failover on the replication group.", fr: "Activer Multi-AZ avec basculement automatique sur le groupe de réplication." } }
    - { id: e, text: { en: "Schedule the TestFailover API to run every night so that the primary role moves between nodes.", fr: "Planifier l'API TestFailover chaque nuit pour que le rôle primaire passe d'un nœud à l'autre." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Multi-AZ requires at least one replica in an Availability Zone different from the primary; it can be enabled only on a cluster-mode-disabled replication group that has an available read replica. With Multi-AZ and automatic failover, ElastiCache promotes the replica and updates the primary endpoint's DNS name, so the application keeps writing to the same endpoint.
    fr: |
      Multi-AZ exige au moins un réplica dans une zone de disponibilité différente de celle du primaire ; il ne peut être activé que sur un groupe de réplication en mode cluster désactivé qui dispose d'un réplica en lecture disponible. Avec Multi-AZ et le basculement automatique, ElastiCache promeut le réplica et met à jour le nom DNS du point de terminaison principal : l'application continue d'écrire sur le même point de terminaison.
  options:
    a: { en: "Backups let you restore data into a new cache later; they do not keep the cache writable when the primary fails.", fr: "Les sauvegardes permettent de restaurer les données plus tard dans un nouveau cache ; elles ne maintiennent pas le cache accessible en écriture en cas de panne du primaire." }
    c: { en: "A node endpoint stays tied to one node; after a failover it no longer points to the primary, so the primary endpoint is the right one.", fr: "Un point de terminaison de nœud reste lié à un nœud ; après un basculement, il ne pointe plus vers le primaire : c'est le point de terminaison principal qu'il faut utiliser." }
    e: { en: "TestFailover is designed to test application behavior, not as an operational tool, and it does nothing without a replica and Multi-AZ.", fr: "TestFailover sert à tester le comportement de l'application, pas d'outil opérationnel, et il n'a aucun effet sans réplica ni Multi-AZ." }
references:
  - title: Minimizing downtime in ElastiCache by using Multi-AZ with Valkey and Redis OSS
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoFailover.html
