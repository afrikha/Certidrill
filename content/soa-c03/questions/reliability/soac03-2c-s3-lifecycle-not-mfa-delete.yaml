id: soac03-2c-s3-lifecycle-not-mfa-delete
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company stores project files in a versioning-enabled Amazon S3 bucket. A lifecycle rule permanently deletes noncurrent versions 90 days after they become noncurrent, and the company must keep this rule. An application that runs with the IAM role `editor-app` must still be able to delete objects in the normal way, but it must never be able to permanently delete an object version. The security team suggested turning on MFA delete.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias stocke des fichiers de projet dans un compartiment Amazon S3 dont la gestion des versions est activée. Une règle de cycle de vie supprime définitivement les versions non actuelles 90 jours après qu'elles le deviennent, et l'entreprise doit conserver cette règle. Une application qui s'exécute avec le rôle IAM `editor-app` doit toujours pouvoir supprimer des objets de façon normale, mais ne doit jamais pouvoir supprimer définitivement une version d'objet. L'équipe de sécurité a suggéré d'activer la suppression MFA (MFA delete).

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on MFA delete on the bucket with the root user, and keep the lifecycle rule unchanged.", fr: "Activer la suppression MFA sur le compartiment avec l'utilisateur root, et laisser la règle de cycle de vie inchangée." } }
    - { id: b, text: { en: "Add a bucket policy statement that denies `s3:DeleteObjectVersion` to the `editor-app` role, and keep the lifecycle rule.", fr: "Ajouter une instruction de politique de compartiment qui refuse `s3:DeleteObjectVersion` au rôle `editor-app`, et conserver la règle de cycle de vie." } }
    - { id: c, text: { en: "Add a bucket policy statement that denies `s3:DeleteObject` to the `editor-app` role, and keep the lifecycle rule.", fr: "Ajouter une instruction de politique de compartiment qui refuse `s3:DeleteObject` au rôle `editor-app`, et conserver la règle de cycle de vie." } }
    - { id: d, text: { en: "Add a bucket policy statement that denies `s3:PutBucketVersioning` to the `editor-app` role, and keep the lifecycle rule.", fr: "Ajouter une instruction de politique de compartiment qui refuse `s3:PutBucketVersioning` au rôle `editor-app`, et conserver la règle de cycle de vie." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Permanently deleting a specific object version requires the `s3:DeleteObjectVersion` permission, while a normal delete that only adds a delete marker requires `s3:DeleteObject`. An explicit deny of `s3:DeleteObjectVersion` for the role blocks permanent deletions by the application, and the lifecycle rule keeps expiring noncurrent versions.
    fr: |
      La suppression définitive d'une version d'objet précise exige l'autorisation `s3:DeleteObjectVersion`, alors qu'une suppression normale, qui ajoute seulement un marqueur de suppression, exige `s3:DeleteObject`. Un refus explicite de `s3:DeleteObjectVersion` pour le rôle bloque les suppressions définitives par l'application, et la règle de cycle de vie continue de faire expirer les versions non actuelles.
  options:
    a: { en: "MFA delete cannot be used with lifecycle configurations, so the company could not keep its noncurrent version expiration rule.", fr: "La suppression MFA ne peut pas être utilisée avec des configurations de cycle de vie : l'entreprise ne pourrait pas conserver sa règle d'expiration des versions non actuelles." }
    c: { en: "Denying `s3:DeleteObject` also blocks the normal deletes that the application must keep doing.", fr: "Refuser `s3:DeleteObject` bloque aussi les suppressions normales que l'application doit continuer d'effectuer." }
    d: { en: "This stops the role from suspending versioning, but the role could still permanently delete versions.", fr: "Cela empêche le rôle de suspendre la gestion des versions, mais le rôle pourrait toujours supprimer définitivement des versions." }
references:
  - title: Configuring MFA delete - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiFactorAuthenticationDelete.html
  - title: DeleteObject - Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteObject.html
