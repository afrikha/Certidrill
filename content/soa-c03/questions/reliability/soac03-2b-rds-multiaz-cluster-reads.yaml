id: soac03-2b-rds-multiaz-cluster-reads
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL Multi-AZ DB instance deployment and sends its reporting queries to a separate read replica. The company wants the DB instances that provide automatic failover to also serve the read-only reporting queries, with instances in three Availability Zones. The database must remain on RDS for PostgreSQL.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un déploiement d'instance de base de données Multi-AZ Amazon RDS for PostgreSQL et envoie ses requêtes de reporting à un réplica en lecture distinct. L'entreprise veut que les instances de base de données qui assurent le basculement automatique servent aussi les requêtes de reporting en lecture seule, avec des instances dans trois zones de disponibilité. La base de données doit rester sur RDS for PostgreSQL.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the Multi-AZ DB instance deployment and send the reporting queries to its standby DB instance.", fr: "Conserver le déploiement d'instance de base de données Multi-AZ et envoyer les requêtes de reporting à son instance de secours." } }
    - { id: b, text: { en: "Migrate to an Amazon Aurora PostgreSQL DB cluster with two Aurora Replicas in other Availability Zones.", fr: "Migrer vers un cluster de bases de données Amazon Aurora PostgreSQL avec deux réplicas Aurora dans d'autres zones de disponibilité." } }
    - { id: c, text: { en: "Migrate to a Multi-AZ DB cluster deployment and send the reporting queries to its reader DB instances.", fr: "Migrer vers un déploiement de cluster de bases de données Multi-AZ et envoyer les requêtes de reporting à ses instances de lecture." } }
    - { id: d, text: { en: "Turn on Multi-AZ for the read replica and send the reporting queries to the standby of the read replica.", fr: "Activer Multi-AZ pour le réplica en lecture et envoyer les requêtes de reporting à l'instance de secours de ce réplica." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Multi-AZ DB cluster deployment has a writer DB instance and two reader DB instances in three separate Availability Zones. Its standby instances provide failover support and can also serve read traffic, which is exactly what the company wants while it stays on RDS for PostgreSQL.
    fr: |
      Un déploiement de cluster de bases de données Multi-AZ comprend une instance d'écriture et deux instances de lecture dans trois zones de disponibilité distinctes. Ses instances de secours assurent le basculement et peuvent aussi servir le trafic en lecture, exactement ce que veut l'entreprise tout en restant sur RDS for PostgreSQL.
  options:
    a: { en: "The standby of a Multi-AZ DB instance deployment provides failover support only; it cannot serve read traffic.", fr: "L'instance de secours d'un déploiement d'instance de base de données Multi-AZ assure uniquement le basculement ; elle ne peut pas servir de trafic en lecture." }
    b: { en: "Aurora PostgreSQL is a different engine; the requirement is to remain on RDS for PostgreSQL.", fr: "Aurora PostgreSQL est un autre moteur ; l'exigence est de rester sur RDS for PostgreSQL." }
    d: { en: "The standby of a Multi-AZ DB instance deployment cannot serve reads, whether it belongs to the primary or to a read replica.", fr: "L'instance de secours d'un déploiement d'instance de base de données Multi-AZ ne peut pas servir de lectures, qu'elle appartienne au primaire ou à un réplica en lecture." }
references:
  - title: Configuring and managing a Multi-AZ deployment for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html
  - title: Multi-AZ DB cluster deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html
