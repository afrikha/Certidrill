id: soac03-2c-dr-arc-routing-control
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an active/passive application in us-east-1 and us-west-2, with Amazon Route 53 failover records for its domain name. After a false alarm caused an unwanted failover, the company decided that operators must start every Regional failover manually. The failover action must not rely on control plane operations such as editing DNS records, must not depend on resources in the impaired Region, and must include guardrails that prevent both Regions from being turned off at the same time.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application active/passive dans us-east-1 et us-west-2, avec des enregistrements de basculement Amazon Route 53 pour son nom de domaine. Après une fausse alerte qui a provoqué un basculement non souhaité, l'entreprise a décidé que les opérateurs doivent lancer manuellement chaque basculement régional. L'action de basculement ne doit pas reposer sur des opérations du plan de contrôle comme la modification d'enregistrements DNS, ne doit pas dépendre de ressources de la Région dégradée, et doit inclure des garde-fous qui empêchent de désactiver les deux Régions en même temps.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Associate Route 53 health checks that monitor each Application Load Balancer with the failover records, and let Route 53 fail over when the primary is unhealthy.", fr: "Associer aux enregistrements de basculement des vérifications de l'état Route 53 qui surveillent chaque Application Load Balancer, et laisser Route 53 basculer lorsque la Région principale est défaillante." } }
    - { id: b, text: { en: "Write a runbook that calls the Route 53 `ChangeResourceRecordSets` API to change the record values to the us-west-2 endpoint.", fr: "Écrire un runbook qui appelle l'API Route 53 `ChangeResourceRecordSets` pour remplacer les valeurs des enregistrements par le point de terminaison de us-west-2." } }
    - { id: c, text: { en: "Deploy an AWS Lambda function in us-east-1 that updates the DNS records when an operator invokes it.", fr: "Déployer dans us-east-1 une fonction AWS Lambda qui met à jour les enregistrements DNS lorsqu'un opérateur l'invoque." } }
    - { id: d, text: { en: "Create ARC routing controls with routing control health checks on the failover records and safety rules, and change their states through the cluster endpoints.", fr: "Créer des contrôles de routage ARC avec des vérifications de l'état de contrôle de routage sur les enregistrements de basculement et des règles de sécurité, et modifier leurs états via les points de terminaison du cluster." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Routing controls in Amazon Application Recovery Controller (ARC) are on-off switches that work with routing control health checks attached to the Route 53 failover records. An ARC cluster is a data plane with endpoints in five Regions, so operators can flip the switches without editing DNS records or depending on the impaired Region. Safety rules act as guardrails, for example to keep at least one Region on.
    fr: |
      Les contrôles de routage d'Amazon Application Recovery Controller (ARC) sont des interrupteurs marche-arrêt qui fonctionnent avec des vérifications de l'état de contrôle de routage associées aux enregistrements de basculement Route 53. Un cluster ARC est un plan de données doté de points de terminaison dans cinq Régions : les opérateurs peuvent actionner les interrupteurs sans modifier d'enregistrements DNS ni dépendre de la Région dégradée. Des règles de sécurité servent de garde-fous, par exemple pour garder au moins une Région active.
  options:
    a: { en: "Health-check-based failover is automatic, which is what the company wants to stop after the false alarm.", fr: "Le basculement fondé sur des vérifications de l'état est automatique, ce que l'entreprise veut éviter après la fausse alerte." }
    b: { en: "Changing record sets is a control plane operation, and the runbook has no guardrail against turning off both Regions.", fr: "Modifier des jeux d'enregistrements est une opération du plan de contrôle, et le runbook n'a aucun garde-fou contre la désactivation des deux Régions." }
    c: { en: "The function runs in the Region that may be impaired and still edits DNS records through the control plane.", fr: "La fonction s'exécute dans la Région qui peut être dégradée et modifie toujours des enregistrements DNS via le plan de contrôle." }
references:
  - title: Routing control in ARC - Amazon Application Recovery Controller (ARC)
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/routing-control.html
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
