id: soac03-2b-alb-faster-healthy
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company deploys new application versions by registering new Amazon EC2 instances in an Application Load Balancer target group. The target group uses the default health check settings: an interval of 30 seconds, a timeout of 5 seconds, a healthy threshold of 5 and an unhealthy threshold of 2. The application is ready a few seconds after launch, but new targets need about 2.5 minutes to become healthy. The company wants new targets to be marked healthy within 30 seconds of registration while keeping health checks enabled.

    Which combination of changes will meet this requirement? (Choose two.)
  fr: |
    Une entreprise déploie de nouvelles versions de son application en enregistrant de nouvelles instances Amazon EC2 dans un groupe cible d'Application Load Balancer. Le groupe cible utilise les paramètres de vérification de l'état par défaut : intervalle de 30 secondes, délai d'expiration de 5 secondes, seuil d'état sain de 5 et seuil d'état défaillant de 2. L'application est prête quelques secondes après le lancement, mais les nouvelles cibles mettent environ 2 minutes 30 à devenir saines. L'entreprise veut que les nouvelles cibles soient marquées comme saines dans les 30 secondes qui suivent leur enregistrement, tout en gardant les vérifications de l'état activées.

    Quelle combinaison de modifications permet de répondre à cette exigence ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the unhealthy threshold count to 10.", fr: "Porter le seuil d'état défaillant à 10." } }
    - { id: b, text: { en: "Decrease the health check interval to 10 seconds.", fr: "Réduire l'intervalle de vérification de l'état à 10 secondes." } }
    - { id: c, text: { en: "Turn on slow start mode for the target group with a duration of 30 seconds.", fr: "Activer le mode de démarrage lent pour le groupe cible avec une durée de 30 secondes." } }
    - { id: d, text: { en: "Decrease the deregistration delay of the target group to 30 seconds.", fr: "Réduire le délai d'annulation de l'enregistrement du groupe cible à 30 secondes." } }
    - { id: e, text: { en: "Decrease the healthy threshold count to 2.", fr: "Abaisser le seuil d'état sain à 2." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A new target becomes healthy after the healthy threshold count of consecutive successful checks, spaced by the health check interval: 5 × 30 seconds is about 2.5 minutes. With an interval of 10 seconds (allowed range 5–300) and a healthy threshold of 2 (allowed range 2–10), a target becomes healthy after about 20 seconds; either change alone still takes 50 or 60 seconds.
    fr: |
      Une nouvelle cible devient saine après un nombre de vérifications réussies consécutives égal au seuil d'état sain, espacées de l'intervalle de vérification : 5 × 30 secondes font environ 2 minutes 30. Avec un intervalle de 10 secondes (plage autorisée 5–300) et un seuil d'état sain de 2 (plage autorisée 2–10), une cible devient saine en 20 secondes environ ; une seule de ces modifications donne encore 50 ou 60 secondes.
  options:
    a: { en: "The unhealthy threshold controls how fast a target is marked unhealthy; raising it only delays failure detection.", fr: "Le seuil d'état défaillant détermine la rapidité avec laquelle une cible est marquée défaillante ; l'augmenter retarde seulement la détection des pannes." }
    c: { en: "Slow start ramps up traffic to a target after it becomes healthy; it adds time instead of removing it.", fr: "Le démarrage lent augmente progressivement le trafic d'une cible après qu'elle est devenue saine ; il ajoute du temps au lieu d'en retirer." }
    d: { en: "The deregistration delay concerns targets that leave the target group, not new targets that join it.", fr: "Le délai d'annulation de l'enregistrement concerne les cibles qui quittent le groupe cible, pas les nouvelles cibles qui le rejoignent." }
references:
  - title: Health checks for Application Load Balancer target groups
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
