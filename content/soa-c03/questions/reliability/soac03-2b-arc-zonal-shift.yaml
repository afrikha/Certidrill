id: soac03-2b-arc-zonal-shift
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group across three Availability Zones behind an Application Load Balancer. The load balancer is a managed resource in Amazon Application Recovery Controller (ARC) with zonal shift enabled. During an incident, metrics show elevated latency and errors only for requests served in us-east-1b, but the instances there still pass their health checks. The remaining zones have enough capacity. The company wants to move traffic away from us-east-1b immediately, as a temporary measure that ends automatically, without changing the configuration of the load balancer or the Auto Scaling group.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application sur des instances Amazon EC2 d'un groupe Auto Scaling réparti sur trois zones de disponibilité derrière un Application Load Balancer. L'équilibreur de charge est une ressource gérée dans Amazon Application Recovery Controller (ARC) avec le déplacement de zone (zonal shift) activé. Pendant un incident, les métriques montrent une latence et des erreurs élevées uniquement pour les requêtes servies dans us-east-1b, mais les instances de cette zone réussissent toujours leurs vérifications de l'état. Les autres zones ont une capacité suffisante. L'entreprise veut éloigner immédiatement le trafic de us-east-1b, comme mesure temporaire qui prend fin automatiquement, sans modifier la configuration de l'équilibreur de charge ni du groupe Auto Scaling.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Remove the us-east-1b subnet from the load balancer, and add it back after the incident.", fr: "Retirer le sous-réseau de us-east-1b de l'équilibreur de charge, puis le rajouter après l'incident." } }
    - { id: b, text: { en: "Create Route 53 failover records that send users to a standby load balancer in another Region.", fr: "Créer des enregistrements de basculement Route 53 qui envoient les utilisateurs vers un équilibreur de charge de secours dans une autre Région." } }
    - { id: c, text: { en: "Change the health check path of the target group to a page that fails only in us-east-1b.", fr: "Remplacer le chemin de vérification de l'état du groupe cible par une page qui échoue uniquement dans us-east-1b." } }
    - { id: d, text: { en: "Start a zonal shift away from us-east-1b for the load balancer, with an expiration of a few hours.", fr: "Démarrer un déplacement de zone hors de us-east-1b pour l'équilibreur de charge, avec une expiration de quelques heures." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A zonal shift moves traffic for a supported resource, such as an Application Load Balancer, away from an impaired Availability Zone to the healthy zones of the same Region. It is a temporary mitigation with an expiration from one minute to three days, which can be extended or canceled, and it changes no resource configuration. It works even when the targets in the impaired zone pass their health checks.
    fr: |
      Un déplacement de zone éloigne le trafic d'une ressource prise en charge, comme un Application Load Balancer, d'une zone de disponibilité dégradée vers les zones saines de la même Région. C'est une mesure d'atténuation temporaire, avec une expiration d'une minute à trois jours qu'il est possible de prolonger ou d'annuler, qui ne modifie la configuration d'aucune ressource. Il fonctionne même lorsque les cibles de la zone dégradée réussissent leurs vérifications de l'état.
  options:
    a: { en: "Removing a subnet changes the load balancer configuration and must be reverted by hand; it does not end automatically.", fr: "Retirer un sous-réseau modifie la configuration de l'équilibreur de charge et doit être annulé manuellement ; cela ne prend pas fin automatiquement." }
    b: { en: "The impairment affects one zone, not the Region; a cross-Region failover is not needed and requires a standby environment.", fr: "La dégradation touche une zone, pas la Région ; un basculement entre Régions n'est pas nécessaire et exige un environnement de secours." }
    c: { en: "Editing the health check changes the target group configuration and would require a zone-specific failing page.", fr: "Modifier la vérification de l'état change la configuration du groupe cible et exigerait une page en échec propre à une zone." }
references:
  - title: Zonal shift in ARC
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.html
  - title: Supported resources
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.resource-types.html
