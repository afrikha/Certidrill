id: soac03-2a-eks-hpa-cluster-autoscaler
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on an Amazon EKS cluster that uses a managed node group. The number of pods must increase and decrease automatically with CPU utilization. When new pods cannot be scheduled because the nodes are full, nodes must be added automatically. The Kubernetes Metrics Server is not installed in the cluster.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une entreprise exécute une application web sur un cluster Amazon EKS qui utilise un groupe de nœuds gérés. Le nombre de pods doit augmenter et diminuer automatiquement selon l'utilisation du processeur. Quand de nouveaux pods ne peuvent pas être planifiés parce que les nœuds sont pleins, des nœuds doivent être ajoutés automatiquement. Le Kubernetes Metrics Server n'est pas installé dans le cluster.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy the Kubernetes Vertical Pod Autoscaler so that it adds pod replicas when CPU utilization is high.", fr: "Déployer le Kubernetes Vertical Pod Autoscaler pour qu'il ajoute des réplicas de pods quand l'utilisation du processeur est élevée." } }
    - { id: b, text: { en: "Install the Kubernetes Metrics Server, and create a Horizontal Pod Autoscaler for the deployment with a CPU target.", fr: "Installer le Kubernetes Metrics Server, et créer un Horizontal Pod Autoscaler pour le déploiement avec une cible de processeur." } }
    - { id: c, text: { en: "Deploy the Cluster Autoscaler with permission to change the desired capacity of the node group's Auto Scaling group.", fr: "Déployer le Cluster Autoscaler avec l'autorisation de modifier la capacité souhaitée du groupe Auto Scaling du groupe de nœuds." } }
    - { id: d, text: { en: "Create a scheduled action on the node group's Auto Scaling group that adds nodes during business hours.", fr: "Créer une action planifiée sur le groupe Auto Scaling du groupe de nœuds qui ajoute des nœuds pendant les heures de bureau." } }
    - { id: e, text: { en: "Enable Capacity Rebalancing on the node group's Auto Scaling group so that nodes are added for pending pods.", fr: "Activer Capacity Rebalancing sur le groupe Auto Scaling du groupe de nœuds pour que des nœuds soient ajoutés pour les pods en attente." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "The Horizontal Pod Autoscaler changes the number of pods to meet a CPU target, and it needs a metrics source such as the Kubernetes Metrics Server. The Cluster Autoscaler watches for pods that cannot be scheduled and raises the desired capacity of the node group's Auto Scaling group, and it removes underused nodes."
    fr: "L'Horizontal Pod Autoscaler modifie le nombre de pods pour atteindre une cible de processeur, et il a besoin d'une source de métriques comme le Kubernetes Metrics Server. Le Cluster Autoscaler surveille les pods impossibles à planifier et augmente la capacité souhaitée du groupe Auto Scaling du groupe de nœuds ; il supprime aussi les nœuds sous-utilisés."
  options:
    a:
      en: "The Vertical Pod Autoscaler adjusts the CPU and memory requests of pods; it does not add replicas."
      fr: "Le Vertical Pod Autoscaler ajuste les demandes de processeur et de mémoire des pods ; il n'ajoute pas de réplicas."
    d:
      en: "A schedule does not react to pods that cannot be scheduled outside the planned hours, and it does not follow real demand."
      fr: "Un calendrier ne réagit pas aux pods impossibles à planifier en dehors des heures prévues, et il ne suit pas la demande réelle."
    e:
      en: "Capacity Rebalancing replaces Spot Instances at risk of interruption; it does not respond to pending pods."
      fr: "Capacity Rebalancing remplace les instances Spot exposées à une interruption ; il ne répond pas aux pods en attente."
references:
  - title: Scale pod deployments with Horizontal Pod Autoscaler
    url: https://docs.aws.amazon.com/eks/latest/userguide/horizontal-pod-autoscaler.html
  - title: Scale cluster compute with Karpenter and Cluster Autoscaler
    url: https://docs.aws.amazon.com/eks/latest/userguide/autoscaling.html
