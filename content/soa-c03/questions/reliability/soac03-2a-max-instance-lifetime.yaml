id: soac03-2a-max-instance-lifetime
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security policy states that no Amazon EC2 instance in a company's Auto Scaling groups can stay in service for more than 14 days, so that every instance is rebuilt regularly from the group's current launch template. Each group runs several instances behind a load balancer.

    Which solution will meet this requirement with the LEAST operational overhead?
  fr: |
    Une règle de sécurité impose qu'aucune instance Amazon EC2 des groupes Auto Scaling d'une entreprise ne reste en service plus de 14 jours, afin que chaque instance soit reconstruite régulièrement à partir du modèle de lancement actuel du groupe. Chaque groupe exécute plusieurs instances derrière un équilibreur de charge.

    Quelle solution répond à cette exigence avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge scheduled rule that invokes a Lambda function every day to terminate instances older than 14 days.", fr: "Créer une règle planifiée EventBridge qui invoque chaque jour une fonction Lambda chargée de résilier les instances de plus de 14 jours." } }
    - { id: b, text: { en: "Have an operator start an instance refresh on each group every 14 days.", fr: "Faire démarrer par un opérateur une actualisation d'instance sur chaque groupe tous les 14 jours." } }
    - { id: c, text: { en: "Set the maximum instance lifetime of each group to 1,209,600 seconds.", fr: "Définir la durée de vie maximale des instances de chaque groupe sur 1 209 600 secondes." } }
    - { id: d, text: { en: "Create scheduled actions that set the desired capacity to 0 every 14 days and then back to its normal value.", fr: "Créer des actions planifiées qui définissent la capacité souhaitée sur 0 tous les 14 jours, puis la ramènent à sa valeur normale." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The maximum instance lifetime (minimum one day) makes the group replace any instance that has been in service longer than the set number of seconds, here 14 days. Replacements use the group's current launch template and are spread out so that instances are not all replaced at once."
    fr: "La durée de vie maximale des instances (au moins un jour) fait remplacer par le groupe toute instance en service depuis plus que le nombre de secondes défini, ici 14 jours. Les remplacements utilisent le modèle de lancement actuel du groupe et sont étalés pour que les instances ne soient pas toutes remplacées en même temps."
  options:
    a:
      en: "A custom Lambda function works but must be written, secured and maintained, which is more overhead than a built-in group setting."
      fr: "Une fonction Lambda personnalisée fonctionne, mais elle doit être écrite, sécurisée et maintenue : c'est plus de charge qu'un paramètre intégré du groupe."
    b:
      en: "A manual refresh every 14 days depends on an operator and can be missed, so it has the most ongoing effort."
      fr: "Une actualisation manuelle tous les 14 jours dépend d'un opérateur et peut être oubliée : c'est l'option qui demande le plus d'effort continu."
    d:
      en: "Setting the desired capacity to 0 terminates every instance at the same time and causes an outage."
      fr: "Définir la capacité souhaitée sur 0 résilie toutes les instances en même temps et provoque une interruption."
references:
  - title: Replace Auto Scaling instances based on maximum instance lifetime
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-max-instance-lifetime.html
