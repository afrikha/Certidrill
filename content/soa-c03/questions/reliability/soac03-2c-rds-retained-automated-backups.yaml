id: soac03-2c-rds-retained-automated-backups
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Three days ago, an engineer deleted an Amazon RDS for PostgreSQL DB instance that was still needed. The engineer did not create a final DB snapshot but selected the option to retain automated backups. The DB instance had a backup retention period of 7 days. The company must recover the database as it was one hour before the deletion.

    Which solution will meet these requirements?
  fr: |
    Il y a trois jours, un ingénieur a supprimé une instance de base de données Amazon RDS for PostgreSQL qui était encore nécessaire. L'ingénieur n'a pas créé d'instantané de base de données final, mais a sélectionné l'option de conservation des sauvegardes automatisées. L'instance avait une période de rétention des sauvegardes de 7 jours. L'entreprise doit récupérer la base de données telle qu'elle était une heure avant la suppression.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Recover the deleted DB instance from the Recycle Bin, and then restore it to the required time.", fr: "Récupérer l'instance supprimée depuis la corbeille (Recycle Bin), puis la restaurer à l'instant requis." } }
    - { id: b, text: { en: "Restore a new DB instance to the required time from the retained automated backup of the deleted instance.", fr: "Restaurer une nouvelle instance à l'instant requis à partir de la sauvegarde automatisée conservée de l'instance supprimée." } }
    - { id: c, text: { en: "Restore the most recent automated DB snapshot of the deleted instance from the Snapshots page.", fr: "Restaurer le plus récent instantané automatisé de l'instance supprimée depuis la page des instantanés." } }
    - { id: d, text: { en: "Create a new DB instance with the same identifier so that RDS links it to the retained automated backup.", fr: "Créer une nouvelle instance avec le même identifiant pour que RDS la relie à la sauvegarde automatisée conservée." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Retained automated backups keep the system snapshots and transaction logs of a deleted DB instance for the backup retention period that the instance had when it was deleted. They support point-in-time restore to any time in that period, so the company can create a new DB instance as it was one hour before the deletion.
    fr: |
      Les sauvegardes automatisées conservées gardent les instantanés système et les journaux de transactions d'une instance supprimée pendant la période de rétention qu'avait l'instance au moment de sa suppression. Elles permettent une restauration à n'importe quel instant de cette période : l'entreprise peut donc créer une nouvelle instance telle qu'elle était une heure avant la suppression.
  options:
    a: { en: "Recycle Bin protects Amazon EC2 resources such as EBS snapshots and AMIs; it does not hold deleted RDS DB instances.", fr: "La corbeille (Recycle Bin) protège des ressources Amazon EC2 telles que les instantanés EBS et les AMI ; elle ne contient pas d'instances RDS supprimées." }
    c: { en: "A daily automated snapshot gives the state at the snapshot time, not one hour before the deletion; the transaction logs are needed for that point in time.", fr: "Un instantané automatisé quotidien donne l'état au moment de l'instantané, et non une heure avant la suppression ; les journaux de transactions sont nécessaires pour cet instant." }
    d: { en: "A new DB instance has a new resource ID and starts empty; reusing the identifier does not attach the retained backup to it.", fr: "Une nouvelle instance possède un nouvel ID de ressource et démarre vide ; réutiliser l'identifiant ne lui rattache pas la sauvegarde conservée." }
references:
  - title: Retaining automated backups - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.Retaining.html
