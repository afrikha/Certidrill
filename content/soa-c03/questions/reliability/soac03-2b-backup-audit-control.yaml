id: soac03-2b-backup-audit-control
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Auditors require a daily report, delivered to an Amazon S3 bucket, that lists the resources in an AWS account that are not included in any AWS Backup plan. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Des auditeurs exigent un rapport quotidien, livré dans un compartiment Amazon S3, qui répertorie les ressources d'un compte AWS qui ne sont incluses dans aucun plan AWS Backup. L'entreprise veut la solution présentant le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS Backup restore testing plan that selects all protected resources and stores the test results in the S3 bucket.", fr: "Créer un plan de test de restauration AWS Backup qui sélectionne toutes les ressources protégées et stocke les résultats des tests dans le compartiment S3." } }
    - { id: b, text: { en: "Configure vault notifications for RECOVERY_POINT_MODIFIED events and forward them to the S3 bucket through Amazon SNS.", fr: "Configurer des notifications de coffre pour les événements RECOVERY_POINT_MODIFIED et les transmettre au compartiment S3 via Amazon SNS." } }
    - { id: c, text: { en: "Run a daily CloudTrail Lake query that lists CreateBackupSelection calls and export the results to the S3 bucket.", fr: "Exécuter chaque jour une requête CloudTrail Lake qui répertorie les appels CreateBackupSelection et exporter les résultats dans le compartiment S3." } }
    - { id: d, text: { en: "Deploy an AWS Backup Audit Manager framework with the backup plan coverage control, and add a report plan for the bucket.", fr: "Déployer un framework AWS Backup Audit Manager avec le contrôle de couverture par un plan de sauvegarde, et ajouter un plan de rapport vers le compartiment." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AWS Backup Audit Manager evaluates resources against controls such as "Backup resources are included in at least one backup plan", which runs automatically every 24 hours or on configuration changes. A report plan delivers the compliance results to an S3 bucket, so the auditors receive the list of unprotected resources without custom code.
    fr: |
      AWS Backup Audit Manager évalue les ressources par rapport à des contrôles comme « Backup resources are included in at least one backup plan », qui s'exécute automatiquement toutes les 24 heures ou lors des modifications de configuration. Un plan de rapport livre les résultats de conformité dans un compartiment S3 : les auditeurs reçoivent la liste des ressources non protégées sans code personnalisé.
  options:
    a: { en: "Restore testing restores recovery points of protected resources; it cannot report resources that have no backup plan.", fr: "Le test de restauration restaure des points de récupération de ressources protégées ; il ne peut pas signaler les ressources sans plan de sauvegarde." }
    b: { en: "This event concerns existing recovery points; unprotected resources have no recovery point and produce no event.", fr: "Cet événement concerne des points de récupération existants ; les ressources non protégées n'ont pas de point de récupération et ne produisent aucun événement." }
    c: { en: "API calls show which selections were created, not which resources remain outside every plan; it also requires custom comparison work.", fr: "Les appels d'API montrent quelles sélections ont été créées, pas quelles ressources restent hors de tout plan ; cela exige en plus un travail de comparaison personnalisé." }
references:
  - title: Controls and remediation
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/controls-and-remediation.html
