id: soac03-2c-aurora-pg-pitr-not-backtrack
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs an Amazon Aurora PostgreSQL-Compatible Edition DB cluster with one writer and two Aurora Replicas. The backup retention period is 14 days. Forty minutes ago, a faulty deployment ran an UPDATE statement that overwrote the delivery status of every shipment. The company must recover the data as it was before the deployment, with the least possible data loss.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute un cluster de bases de données Amazon Aurora PostgreSQL-Compatible Edition avec une instance d'écriture et deux réplicas Aurora. La période de rétention des sauvegardes est de 14 jours. Il y a quarante minutes, un déploiement défectueux a exécuté une instruction UPDATE qui a écrasé le statut de livraison de chaque expédition. L'entreprise doit récupérer les données telles qu'elles étaient avant le déploiement, avec le moins de perte de données possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Backtrack the DB cluster to a time just before the deployment ran the UPDATE statement.", fr: "Effectuer un retour en arrière (Backtrack) du cluster à un instant juste avant l'exécution de l'instruction UPDATE par le déploiement." } }
    - { id: b, text: { en: "Restore the DB cluster to a point in time just before the deployment, as a new DB cluster.", fr: "Restaurer le cluster à un instant juste avant le déploiement, en tant que nouveau cluster." } }
    - { id: c, text: { en: "Fail over the DB cluster to one of the Aurora Replicas, which still holds the earlier data.", fr: "Basculer le cluster vers l'un des réplicas Aurora, qui contient encore les données antérieures." } }
    - { id: d, text: { en: "Restore the most recent automated DB cluster snapshot as a new DB cluster.", fr: "Restaurer l'instantané de cluster automatisé le plus récent en tant que nouveau cluster." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Aurora continuously backs up the cluster volume, so a point-in-time restore can recreate the data at any second within the 14-day retention period, up to the latest restorable time. The restore creates a new DB cluster with the state just before the UPDATE, which gives the smallest data loss.
    fr: |
      Aurora sauvegarde le volume du cluster en continu : une restauration à un instant dans le passé peut recréer les données à n'importe quelle seconde de la période de rétention de 14 jours, jusqu'à l'heure de restauration la plus récente. La restauration crée un nouveau cluster dans l'état précédant juste l'instruction UPDATE, ce qui donne la plus petite perte de données.
  options:
    a: { en: "Backtrack is available only for Aurora MySQL, not for Aurora PostgreSQL.", fr: "Le retour en arrière (Backtrack) n'est disponible que pour Aurora MySQL, pas pour Aurora PostgreSQL." }
    c: { en: "Aurora Replicas share the cluster volume, so they already contain the overwritten values.", fr: "Les réplicas Aurora partagent le volume du cluster : ils contiennent déjà les valeurs écrasées." }
    d: { en: "The latest automated snapshot is taken once a day, so restoring it can lose many hours of valid changes.", fr: "Le dernier instantané automatisé est pris une fois par jour : sa restauration peut faire perdre de nombreuses heures de modifications valides." }
references:
  - title: Restoring a DB cluster to a specified time - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-pitr.html
  - title: Backtracking an Aurora DB cluster - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Managing.Backtrack.html
