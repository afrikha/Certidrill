id: soac03-2c-dr-ami-region-specific
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses a backup and restore disaster recovery strategy. Its AWS CloudFormation template launches Amazon EC2 instances from a custom AMI whose ID, created in us-east-1, is written directly in the `ImageId` property. During a recovery test in us-west-2, in the same account, stack creation fails because the image ID does not exist. The company wants one template that works in both Regions and continues to work when new AMI versions are built.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise une stratégie de reprise après sinistre de type sauvegarde et restauration (backup and restore). Son modèle AWS CloudFormation lance des instances Amazon EC2 à partir d'une AMI personnalisée dont l'ID, créé dans us-east-1, est écrit directement dans la propriété `ImageId`. Lors d'un test de reprise dans us-west-2, dans le même compte, la création de la pile échoue car l'ID d'image n'existe pas. L'entreprise veut un seul modèle qui fonctionne dans les deux Régions et qui continue de fonctionner lorsque de nouvelles versions de l'AMI sont créées.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Share the AMI with the account by adding a launch permission for the account ID in us-east-1.", fr: "Partager l'AMI avec le compte en ajoutant une autorisation de lancement pour l'ID du compte dans us-east-1." } }
    - { id: b, text: { en: "Copy each new AMI version to us-west-2 as part of the image build process.", fr: "Copier chaque nouvelle version de l'AMI dans us-west-2 dans le cadre du processus de création d'image." } }
    - { id: c, text: { en: "Make the AMI public so that the stack can find it by its ID from every AWS Region.", fr: "Rendre l'AMI publique pour que la pile puisse la trouver par son ID depuis toutes les Régions AWS." } }
    - { id: d, text: { en: "Turn on EBS encryption by default in us-west-2 so that the encrypted AMI snapshots can be read there.", fr: "Activer le chiffrement EBS par défaut dans us-west-2 pour que les instantanés chiffrés de l'AMI puissent y être lus." } }
    - { id: e, text: { en: "Store each Region's AMI ID in a Parameter Store parameter of the same name, and reference it in the template.", fr: "Stocker l'ID d'AMI de chaque Région dans un paramètre Parameter Store du même nom, et le référencer dans le modèle." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      AMIs are Regional resources: an instance can be launched in a Region only from an AMI that exists in that Region, and a copy gets its own AMI ID. Copying every new version to us-west-2 makes the image available there, and a Parameter Store parameter with the same name in each Region lets one template resolve the right Regional ID, as the CloudFormation documentation recommends for AMI IDs.
    fr: |
      Les AMI sont des ressources régionales : une instance ne peut être lancée dans une Région qu'à partir d'une AMI qui existe dans cette Région, et une copie reçoit son propre ID d'AMI. Copier chaque nouvelle version dans us-west-2 y rend l'image disponible, et un paramètre Parameter Store du même nom dans chaque Région permet à un seul modèle de résoudre le bon ID régional, comme la documentation CloudFormation le recommande pour les ID d'AMI.
  options:
    a: { en: "The account already owns the AMI; launch permissions control other accounts, not other Regions.", fr: "Le compte possède déjà l'AMI ; les autorisations de lancement concernent d'autres comptes, pas d'autres Régions." }
    c: { en: "A public AMI is still available only in its own Region, and making a custom image public exposes it to everyone.", fr: "Une AMI publique reste disponible uniquement dans sa propre Région, et rendre publique une image personnalisée l'expose à tout le monde." }
    d: { en: "Encryption by default changes how new volumes are encrypted; it does not make the AMI exist in us-west-2.", fr: "Le chiffrement par défaut change la façon dont les nouveaux volumes sont chiffrés ; il ne fait pas exister l'AMI dans us-west-2." }
references:
  - title: Copy an Amazon EC2 AMI - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/CopyingAMIs.html
  - title: CloudFormation template Mappings syntax - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/mappings-section-structure.html
