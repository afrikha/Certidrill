id: soac03-2c-s3-noncurrent-deep-archive
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company keeps product images in a versioning-enabled Amazon S3 bucket. The current versions are read many times each day and must stay in S3 Standard. Noncurrent versions are needed only for rare legal requests, for which a retrieval time of up to 48 hours is acceptable, and they must be kept for 1 year after they become noncurrent.

    Which lifecycle configuration is the MOST cost-effective?
  fr: |
    Une entreprise conserve des images de produits dans un compartiment Amazon S3 dont la gestion des versions est activée. Les versions actuelles sont lues de nombreuses fois par jour et doivent rester dans S3 Standard. Les versions non actuelles ne servent qu'à de rares demandes juridiques, pour lesquelles un délai de récupération allant jusqu'à 48 heures est acceptable, et elles doivent être conservées 1 an après être devenues non actuelles.

    Quelle configuration de cycle de vie est la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Transition the current versions to S3 Glacier Deep Archive after 30 days, and expire noncurrent versions after 365 days.", fr: "Faire passer les versions actuelles vers S3 Glacier Deep Archive après 30 jours, et faire expirer les versions non actuelles après 365 jours." } }
    - { id: b, text: { en: "Transition all objects to S3 Intelligent-Tiering on day 0, and expire noncurrent versions after 365 days.", fr: "Faire passer tous les objets vers S3 Intelligent-Tiering dès le jour 0, et faire expirer les versions non actuelles après 365 jours." } }
    - { id: c, text: { en: "Transition noncurrent versions to S3 Glacier Deep Archive after 30 days as noncurrent, and expire them after 365 days.", fr: "Faire passer les versions non actuelles vers S3 Glacier Deep Archive après 30 jours à l'état non actuel, et les faire expirer après 365 jours." } }
    - { id: d, text: { en: "Expire noncurrent versions 30 days after they become noncurrent, and keep the current versions in S3 Standard.", fr: "Faire expirer les versions non actuelles 30 jours après qu'elles le deviennent, et conserver les versions actuelles dans S3 Standard." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `NoncurrentVersionTransition` and `NoncurrentVersionExpiration` act only on noncurrent versions, so the current versions stay in S3 Standard. S3 Glacier Deep Archive is the lowest-cost storage class, and its retrievals complete within 48 hours, which the legal requests accept. Expiring after 365 days as noncurrent keeps each version for the required year.
    fr: |
      `NoncurrentVersionTransition` et `NoncurrentVersionExpiration` n'agissent que sur les versions non actuelles : les versions actuelles restent dans S3 Standard. S3 Glacier Deep Archive est la classe de stockage la moins chère, et ses récupérations s'achèvent en 48 heures au maximum, ce que les demandes juridiques acceptent. L'expiration après 365 jours à l'état non actuel conserve chaque version pendant l'année requise.
  options:
    a: { en: "The transition would move the frequently read current versions out of S3 Standard, which breaks the requirement.", fr: "La transition déplacerait hors de S3 Standard les versions actuelles lues fréquemment, ce qui enfreint l'exigence." }
    b: { en: "Transitioning all objects also moves the frequently read current versions out of S3 Standard, which breaks the requirement, and adds a per-object monitoring charge.", fr: "Faire passer tous les objets déplace aussi hors de S3 Standard les versions actuelles lues fréquemment, ce qui enfreint l'exigence, et ajoute des frais de surveillance par objet." }
    d: { en: "Expiring noncurrent versions after 30 days deletes them long before the required year.", fr: "Faire expirer les versions non actuelles après 30 jours les supprime bien avant l'année requise." }
references:
  - title: Lifecycle configuration elements - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
  - title: Understanding archive retrieval options - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html
