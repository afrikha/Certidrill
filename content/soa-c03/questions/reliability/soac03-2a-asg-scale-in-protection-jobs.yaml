id: soac03-2a-asg-scale-in-protection-jobs
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company transcodes videos on Amazon EC2 instances in an Auto Scaling group. Each worker polls an Amazon SQS queue and processes one job at a time, and a job can run for up to 2 hours. The group scales on the queue backlog. During scale-in, the group sometimes terminates an instance in the middle of a job, and the job has to start again. Idle instances must still be removed when the group scales in.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias transcode des vidéos sur des instances Amazon EC2 d'un groupe Auto Scaling. Chaque programme de traitement interroge une file d'attente Amazon SQS et traite une tâche à la fois, et une tâche peut durer jusqu'à 2 heures. Le groupe est mis à l'échelle selon le nombre de messages en attente dans la file. Lors des diminutions de capacité, le groupe résilie parfois une instance au milieu d'une tâche, qui doit alors recommencer. Les instances inactives doivent toujours être supprimées quand le groupe réduit sa capacité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Make the worker call set-instance-protection with --protected-from-scale-in when it starts a job and with --no-protected-from-scale-in when the job ends.", fr: "Faire appeler par le programme de traitement set-instance-protection avec --protected-from-scale-in au début d'une tâche et avec --no-protected-from-scale-in à la fin de la tâche." } }
    - { id: b, text: { en: "Enable EC2 termination protection (DisableApiTermination) in the launch template so that busy instances cannot be terminated.", fr: "Activer la protection contre la résiliation EC2 (DisableApiTermination) dans le modèle de lancement pour que les instances occupées ne puissent pas être résiliées." } }
    - { id: c, text: { en: "Change the termination policy of the group to OldestInstance so that the instances most likely to have finished their jobs are terminated first.", fr: "Remplacer la politique de résiliation du groupe par OldestInstance pour que les instances les plus susceptibles d'avoir fini leur tâche soient résiliées en premier." } }
    - { id: d, text: { en: "Suspend the Terminate process of the group during the day, and resume it at night when the queue is usually empty.", fr: "Suspendre le processus Terminate du groupe pendant la journée, et le reprendre la nuit quand la file est généralement vide." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Instance scale-in protection stops Amazon EC2 Auto Scaling from choosing a protected instance during scale-in. When each worker turns protection on for the length of a job and off afterward, only idle instances can be removed. The instance role needs the autoscaling:SetInstanceProtection permission, and protection does not stop the replacement of an instance that fails its health checks."
    fr: "La protection contre la diminution de la taille empêche Amazon EC2 Auto Scaling de choisir une instance protégée lors d'une diminution de capacité. Si chaque programme de traitement active la protection pendant une tâche et la désactive ensuite, seules les instances inactives peuvent être supprimées. Le rôle de l'instance a besoin de l'autorisation autoscaling:SetInstanceProtection, et la protection n'empêche pas le remplacement d'une instance qui échoue à ses vérifications de l'état."
  options:
    b:
      en: "EC2 termination protection only blocks manual terminations through the EC2 console, CLI or API. It does not stop Amazon EC2 Auto Scaling from terminating the instance during scale-in."
      fr: "La protection contre la résiliation EC2 bloque seulement les résiliations manuelles par la console, la CLI ou l'API EC2. Elle n'empêche pas Amazon EC2 Auto Scaling de résilier l'instance lors d'une diminution de capacité."
    c:
      en: "Termination policies do not know whether an instance is processing a job, so a busy instance can still be selected."
      fr: "Les politiques de résiliation ne savent pas si une instance traite une tâche : une instance occupée peut toujours être choisie."
    d:
      en: "Suspending Terminate blocks every scale-in and health check replacement during the day, so idle instances are not removed and jobs can still run at night."
      fr: "Suspendre Terminate bloque toute diminution de capacité et tout remplacement après vérification de l'état pendant la journée : les instances inactives ne sont pas supprimées, et des tâches peuvent encore s'exécuter la nuit."
references:
  - title: Use instance scale-in protection to control instance termination
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-instance-protection.html
