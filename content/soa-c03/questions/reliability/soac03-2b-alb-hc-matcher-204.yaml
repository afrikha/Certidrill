id: soac03-2b-alb-hc-matcher-204
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company exposes a REST API on Amazon EC2 instances behind an Application Load Balancer. The developers added a `/ping` endpoint that returns HTTP 204 (No Content) when an instance is ready to serve requests. An engineer set the health check path of the target group to `/ping` and kept every other health check setting at its default value. All targets now show the reason code `Target.ResponseCodeMismatch`.

    Which change will make the health checks succeed?
  fr: |
    Une entreprise expose une API REST sur des instances Amazon EC2 derrière un Application Load Balancer. Les développeurs ont ajouté un point de terminaison `/ping` qui renvoie HTTP 204 (No Content) lorsqu'une instance est prête à traiter les requêtes. Un ingénieur a défini le chemin de la vérification de l'état du groupe cible sur `/ping` et a conservé la valeur par défaut de tous les autres paramètres de la vérification. Toutes les cibles affichent maintenant le code de motif `Target.ResponseCodeMismatch`.

    Quelle modification permet aux vérifications de l'état de réussir ?
body:
  options:
    - { id: a, text: { en: "Change the health check protocol of the target group from HTTP to HTTPS.", fr: "Passer le protocole de la vérification de l'état du groupe cible de HTTP à HTTPS." } }
    - { id: b, text: { en: "Increase the health check timeout of the target group to 30 seconds.", fr: "Porter le délai d'expiration de la vérification de l'état du groupe cible à 30 secondes." } }
    - { id: c, text: { en: "Set the success codes of the target group health check to 200,204.", fr: "Définir les codes de réussite de la vérification de l'état du groupe cible sur 200,204." } }
    - { id: d, text: { en: "Increase the healthy threshold count of the target group to 10.", fr: "Porter le seuil d'état sain du groupe cible à 10." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For HTTP health checks of an Application Load Balancer target group, the default success code is 200. A target that answers 204 therefore fails with `Target.ResponseCodeMismatch`. The matcher accepts a list or a range of codes, such as `200,204` or `200-299`.
    fr: |
      Pour les vérifications de l'état HTTP d'un groupe cible d'Application Load Balancer, le code de réussite par défaut est 200. Une cible qui répond 204 échoue donc avec `Target.ResponseCodeMismatch`. Les codes de réussite acceptent une liste ou une plage, comme `200,204` ou `200-299`.
  options:
    a: { en: "The targets already answer; the problem is the status code that they return, not the protocol, and HTTPS would also need a TLS listener on the instances.", fr: "Les cibles répondent déjà ; le problème est le code d'état renvoyé, pas le protocole, et HTTPS exigerait aussi un écouteur TLS sur les instances." }
    b: { en: "The targets respond in time; a longer timeout does not change how the response code is evaluated.", fr: "Les cibles répondent à temps ; un délai plus long ne change pas l'évaluation du code de réponse." }
    d: { en: "A higher healthy threshold only requires more consecutive successes; every check still fails on the 204 code.", fr: "Un seuil d'état sain plus élevé exige seulement davantage de réussites consécutives ; chaque vérification échoue toujours sur le code 204." }
references:
  - title: Health checks for Application Load Balancer target groups
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
