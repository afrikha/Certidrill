id: soac03-2b-elasticache-auto-backups
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a node-based Amazon ElastiCache for Redis OSS cluster that has no backups. The company now requires a daily backup that is kept for 14 days and taken during the low-traffic period that starts at 03:00 UTC. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster Amazon ElastiCache for Redis OSS basé sur des nœuds qui n'a aucune sauvegarde. L'entreprise exige désormais une sauvegarde quotidienne conservée 14 jours et effectuée pendant la période de faible trafic qui commence à 03 h 00 UTC. L'entreprise veut la solution présentant le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge Scheduler schedule that invokes a Lambda function to create a snapshot daily and delete old ones.", fr: "Créer une planification EventBridge Scheduler qui appelle une fonction Lambda pour créer un instantané chaque jour et supprimer les anciens." } }
    - { id: b, text: { en: "Create an Amazon Data Lifecycle Manager policy that targets the cache nodes by tag.", fr: "Créer une politique Amazon Data Lifecycle Manager qui cible les nœuds du cache par balise." } }
    - { id: c, text: { en: "Turn on Multi-AZ with automatic failover for the cluster.", fr: "Activer Multi-AZ avec basculement automatique pour le cluster." } }
    - { id: d, text: { en: "Turn on automatic backups with a retention limit of 14 days and a backup window that starts at 03:00 UTC.", fr: "Activer les sauvegardes automatiques avec une limite de rétention de 14 jours et une fenêtre de sauvegarde qui commence à 03 h 00 UTC." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      ElastiCache automatic backups create a daily backup at the backup start time that you choose and keep each backup for the number of days of the backup retention limit (up to 35 days; 0 turns them off). Enabling them on the existing cluster meets both requirements without any code.
    fr: |
      Les sauvegardes automatiques ElastiCache créent une sauvegarde quotidienne à l'heure de début choisie et conservent chaque sauvegarde pendant le nombre de jours de la limite de rétention (jusqu'à 35 jours ; 0 les désactive). Les activer sur le cluster existant répond aux deux exigences sans aucun code.
  options:
    a: { en: "A scheduled function works, but it is custom code to write and maintain, which is more overhead than the built-in feature.", fr: "Une fonction planifiée fonctionne, mais c'est du code personnalisé à écrire et maintenir, soit plus de charge que la fonctionnalité intégrée." }
    b: { en: "Amazon Data Lifecycle Manager manages EBS snapshots and EBS-backed AMIs; it cannot back up ElastiCache.", fr: "Amazon Data Lifecycle Manager gère les instantanés EBS et les AMI basées sur EBS ; il ne peut pas sauvegarder ElastiCache." }
    c: { en: "Multi-AZ improves availability with a replica; it does not create backups that can be restored later.", fr: "Multi-AZ améliore la disponibilité grâce à un réplica ; il ne crée pas de sauvegardes restaurables ultérieurement." }
references:
  - title: Scheduling automatic backups
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/backups-automatic.html
