id: soac03-2a-dax-add-read-replicas
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application reads an Amazon DynamoDB table through a DynamoDB Accelerator (DAX) cluster of three dax.r5.large nodes. The cache hit ratio is high and writes are rare, but the nodes reach high CPU utilization at peak read traffic. The company wants more read throughput from the cache with the least disruption to the application.

    Which solution will meet these requirements?
  fr: |
    Une application lit une table Amazon DynamoDB via un cluster DynamoDB Accelerator (DAX) de trois nœuds dax.r5.large. Le taux d'accès au cache est élevé et les écritures sont rares, mais les nœuds atteignent une forte utilisation du processeur lors des pointes de lecture. L'entreprise veut obtenir plus de débit de lecture du cache en perturbant le moins possible l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Modify the existing DAX cluster to use dax.r5.2xlarge nodes.", fr: "Modifier le cluster DAX existant pour qu'il utilise des nœuds dax.r5.2xlarge." } }
    - { id: b, text: { en: "Add read replica nodes to the DAX cluster.", fr: "Ajouter des nœuds réplicas en lecture au cluster DAX." } }
    - { id: c, text: { en: "Enable DynamoDB auto scaling on the read capacity of the table.", fr: "Activer la mise à l'échelle automatique DynamoDB sur la capacité de lecture de la table." } }
    - { id: d, text: { en: "Create a second DAX cluster, and split the writes between the two clusters by key.", fr: "Créer un second cluster DAX, et répartir les écritures entre les deux clusters selon la clé." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A DAX cluster has one primary node and up to 10 read replicas, for a total of 11 nodes, and DAX spreads the request load across all nodes. Adding replicas increases read capacity in place, with no change for the application."
    fr: "Un cluster DAX comprend un nœud primaire et jusqu'à 10 réplicas en lecture, soit 11 nœuds au total, et DAX répartit la charge des requêtes entre tous les nœuds. Ajouter des réplicas augmente la capacité de lecture sur place, sans changement pour l'application."
  options:
    a:
      en: "The node type of a DAX cluster cannot be changed after creation; a larger node type requires a new cluster and an application change."
      fr: "Le type de nœud d'un cluster DAX ne peut pas être modifié après sa création ; un type plus grand exige un nouveau cluster et une modification de l'application."
    c:
      en: "Cache hits are served by DAX without consuming table read capacity, so more table capacity does not relieve the busy DAX nodes."
      fr: "Les accès au cache sont servis par DAX sans consommer la capacité de lecture de la table : plus de capacité de table ne soulage pas les nœuds DAX occupés."
    d:
      en: "Sharding writes across clusters is for write volumes above what one primary can handle; here writes are rare and the problem is reads."
      fr: "Répartir les écritures entre clusters sert pour des volumes d'écriture supérieurs à ce qu'un primaire peut traiter ; ici, les écritures sont rares et le problème vient des lectures."
references:
  - title: DAX cluster components
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.concepts.cluster.html
  - title: Sizing your DAX cluster
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/dax-cluster-sizing.html
