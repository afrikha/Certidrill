id: soac03-2a-aurora-autoscaling-no-reader
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An operations engineer configured Aurora Auto Scaling for an Amazon Aurora PostgreSQL DB cluster that contains only a writer instance. The policy tracks the predefined average CPU utilization of Aurora Replicas with a target of 50%, a minimum capacity of 0 and a maximum capacity of 4. The application already sends its read-only queries to the reader endpoint. The writer's CPU utilization is often above 80%, but Aurora Auto Scaling has never added a replica.

    Which action will allow Aurora Auto Scaling to add replicas when the read load grows?
  fr: |
    Un ingénieur des opérations a configuré Aurora Auto Scaling pour un cluster de bases de données Amazon Aurora PostgreSQL qui ne contient qu'une instance d'écriture. La politique suit la métrique prédéfinie d'utilisation moyenne du processeur des réplicas Aurora avec une cible de 50 %, une capacité minimale de 0 et une capacité maximale de 4. L'application envoie déjà ses requêtes en lecture seule au point de terminaison du lecteur. L'utilisation du processeur de l'instance d'écriture dépasse souvent 80 %, mais Aurora Auto Scaling n'a jamais ajouté de réplica.

    Quelle action permettra à Aurora Auto Scaling d'ajouter des réplicas quand la charge de lecture augmente ?
body:
  options:
    - { id: a, text: { en: "Change the policy to track the average number of database connections to the Aurora Replicas.", fr: "Modifier la politique pour qu'elle suive le nombre moyen de connexions aux réplicas Aurora." } }
    - { id: b, text: { en: "Reduce the scale-out cooldown of the policy to 0 seconds so that it reacts sooner.", fr: "Réduire à 0 seconde le temps de stabilisation d'augmentation (scale-out cooldown) de la politique pour qu'elle réagisse plus tôt." } }
    - { id: c, text: { en: "Increase the maximum capacity of the policy to 15 Aurora Replicas.", fr: "Porter la capacité maximale de la politique à 15 réplicas Aurora." } }
    - { id: d, text: { en: "Add one Aurora Replica to the DB cluster, and set the minimum capacity of the policy to 1.", fr: "Ajouter un réplica Aurora au cluster, et définir la capacité minimale de la politique sur 1." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Aurora Auto Scaling computes its metric as the average over the reader instances only, and it needs at least one Aurora Replica to work. With a minimum of 0 and no reader, there is nothing to measure and no scaling happens. Adding a replica and keeping the minimum at 1 gives the policy a metric to track."
    fr: "Aurora Auto Scaling calcule sa métrique comme une moyenne sur les seules instances de lecture, et il a besoin d'au moins un réplica Aurora pour fonctionner. Avec un minimum de 0 et aucun lecteur, il n'y a rien à mesurer et aucune mise à l'échelle n'a lieu. Ajouter un réplica et maintenir le minimum à 1 donne à la politique une métrique à suivre."
  options:
    a:
      en: "The connections metric is also averaged over the readers, so it has no data either while the cluster has no replica."
      fr: "La métrique des connexions est aussi une moyenne sur les lecteurs : elle n'a pas non plus de données tant que le cluster n'a pas de réplica."
    b:
      en: "The cooldown only spaces out scaling activities; it cannot start scaling when the metric has no reader to measure."
      fr: "Le temps de stabilisation espace seulement les activités de mise à l'échelle ; il ne peut pas déclencher de mise à l'échelle quand la métrique n'a aucun lecteur à mesurer."
    c:
      en: "A higher maximum only allows more replicas once scaling works; the policy still cannot scale from zero readers."
      fr: "Un maximum plus élevé autorise seulement davantage de réplicas une fois la mise à l'échelle opérationnelle ; la politique ne peut toujours pas partir de zéro lecteur."
references:
  - title: Amazon Aurora Auto Scaling with Aurora Replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Integrating.AutoScaling.html
