id: soac03-2c-ddb-deleted-table-backup
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator deleted an Amazon DynamoDB table named `Invoices` by mistake yesterday. Point-in-time recovery was turned on for the table. The company has no on-demand backups and does not use AWS Backup for this table. The company must recover the table data as it was when the table was deleted.

    Which solution will meet these requirements?
  fr: |
    Un administrateur a supprimé par erreur hier une table Amazon DynamoDB nommée `Invoices`. La restauration à un instant dans le passé (PITR) était activée pour la table. L'entreprise ne dispose d'aucune sauvegarde à la demande et n'utilise pas AWS Backup pour cette table. L'entreprise doit récupérer les données de la table telles qu'elles étaient au moment de sa suppression.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Restore the system backup that DynamoDB created when the table was deleted to a new table.", fr: "Restaurer dans une nouvelle table la sauvegarde système que DynamoDB a créée lors de la suppression de la table." } }
    - { id: b, text: { en: "Re-create the `Invoices` table with the same name so that DynamoDB reattaches its continuous backups.", fr: "Recréer la table `Invoices` avec le même nom pour que DynamoDB y rattache ses sauvegardes continues." } }
    - { id: c, text: { en: "Read the table's DynamoDB stream from the last 24 hours, and replay the records into a new table.", fr: "Lire le flux DynamoDB de la table sur les dernières 24 heures, et rejouer les enregistrements dans une nouvelle table." } }
    - { id: d, text: { en: "Open an AWS Support case to request the recovery of the deleted table from the service backups.", fr: "Ouvrir un dossier AWS Support pour demander la récupération de la table supprimée à partir des sauvegardes du service." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a table with point-in-time recovery turned on is deleted, DynamoDB automatically creates a system backup of the table just before the deletion and keeps it for 35 days at no additional cost. The backup is named after the table with the `$DeletedTableBackup` suffix, and the administrator can restore it to a new table.
    fr: |
      Lorsqu'une table dont la PITR est activée est supprimée, DynamoDB crée automatiquement une sauvegarde système de la table juste avant la suppression et la conserve 35 jours sans frais supplémentaires. La sauvegarde porte le nom de la table suivi du suffixe `$DeletedTableBackup`, et l'administrateur peut la restaurer dans une nouvelle table.
  options:
    b: { en: "A new table with the same name is a different table and does not inherit the backups of the deleted one.", fr: "Une nouvelle table du même nom est une table différente et n'hérite pas des sauvegardes de la table supprimée." }
    c: { en: "A stream keeps only 24 hours of item changes, not a full copy of the table, so replaying it cannot rebuild the items that were not modified in that period.", fr: "Un flux ne conserve que 24 heures de modifications d'éléments, et non une copie complète de la table : le rejouer ne peut pas reconstruire les éléments non modifiés pendant cette période." }
    d: { en: "The recovery is self-service: the deleted-table system backup is available in the account without a support case.", fr: "La récupération est en libre-service : la sauvegarde système de la table supprimée est disponible dans le compte sans dossier de support." }
references:
  - title: Enable point-in-time recovery in DynamoDB - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery_Howitworks.html
