id: soac03-2c-dr-zonal-shift
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in an Auto Scaling group across three Availability Zones behind an Application Load Balancer (ALB). Latency is very high for requests served in one Availability Zone, but the targets there still pass their health checks. The remaining two Availability Zones have enough capacity. The company must move traffic away from the affected Availability Zone quickly, in a way that ends automatically or can be canceled at any time, with the least operational effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 d'un groupe Auto Scaling réparti sur trois zones de disponibilité derrière un Application Load Balancer (ALB). La latence est très élevée pour les requêtes servies dans une zone de disponibilité, mais les cibles de cette zone réussissent toujours leurs vérifications de l'état. Les deux autres zones de disponibilité disposent d'une capacité suffisante. L'entreprise doit détourner rapidement le trafic de la zone de disponibilité affectée, d'une manière qui prend fin automatiquement ou peut être annulée à tout moment, avec le moins d'efforts opérationnels possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Remove the subnet of the affected Availability Zone from the Auto Scaling group and from the ALB.", fr: "Retirer le sous-réseau de la zone de disponibilité affectée du groupe Auto Scaling et de l'ALB." } }
    - { id: b, text: { en: "Opt the ALB in to ARC zonal shift, and start a zonal shift away from the affected zone.", fr: "Inscrire l'ALB au décalage zonal (zonal shift) d'ARC, et lancer un décalage zonal hors de la zone affectée." } }
    - { id: c, text: { en: "Fail over the application to another AWS Region by changing the Route 53 records of the domain.", fr: "Basculer l'application vers une autre Région AWS en modifiant les enregistrements Route 53 du domaine." } }
    - { id: d, text: { en: "Turn off cross-zone load balancing in the ALB target group so that each zone serves its own clients.", fr: "Désactiver l'équilibrage de charge entre zones dans le groupe cible de l'ALB pour que chaque zone serve ses propres clients." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      ARC zonal shift temporarily moves the traffic of a supported resource, such as an ALB, away from an impaired Availability Zone to the healthy zones of the same Region. Each shift has an expiration of up to 3 days that can be extended, and it can be canceled at any time to return traffic. It works even when targets still pass health checks, and capacity in the remaining zones is confirmed first.
    fr: |
      Le décalage zonal d'ARC détourne temporairement le trafic d'une ressource prise en charge, comme un ALB, d'une zone de disponibilité dégradée vers les zones saines de la même Région. Chaque décalage a une expiration de 3 jours au maximum, qui peut être prolongée, et il peut être annulé à tout moment pour rétablir le trafic. Il fonctionne même lorsque les cibles réussissent encore les vérifications de l'état, et la capacité des zones restantes est vérifiée au préalable.
  options:
    a: { en: "Changing subnets is a manual reconfiguration that does not end on its own and must be undone step by step later.", fr: "Changer de sous-réseaux est une reconfiguration manuelle qui ne prend pas fin d'elle-même et doit être défaite pas à pas plus tard." }
    c: { en: "A Regional failover is far more disruptive than needed when two healthy Availability Zones remain in the Region.", fr: "Un basculement régional est bien plus perturbant que nécessaire lorsque deux zones de disponibilité saines restent dans la Région." }
    d: { en: "Without cross-zone load balancing, the ALB node in the affected zone keeps sending requests to its local targets, so traffic still reaches that zone.", fr: "Sans équilibrage de charge entre zones, le nœud de l'ALB de la zone affectée continue d'envoyer les requêtes à ses cibles locales : le trafic atteint toujours cette zone." }
references:
  - title: Zonal shift in ARC - Amazon Application Recovery Controller (ARC)
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.html
  - title: Supported resources - Amazon Application Recovery Controller (ARC)
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.resource-types.html
