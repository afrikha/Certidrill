id: soac03-2a-rds-class-change-multiaz
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a production Amazon RDS for MySQL Single-AZ DB instance. The DB instance must move to a larger instance class next week, and the company wants the interruption caused by that change to be as short as possible. The application must keep using the same DB instance endpoint.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une entreprise exécute en production une instance de base de données Amazon RDS for MySQL Single-AZ. L'instance doit passer à une classe d'instance plus grande la semaine prochaine, et l'entreprise veut que l'interruption causée par ce changement soit la plus courte possible. L'application doit continuer à utiliser le même point de terminaison de l'instance.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a read replica with the larger instance class, and promote it during the change.", fr: "Créer un réplica en lecture avec la classe d'instance plus grande, et le promouvoir pendant le changement." } }
    - { id: b, text: { en: "Modify the DB instance to a Multi-AZ DB instance deployment before the change.", fr: "Convertir l'instance de base de données en déploiement d'instance de base de données Multi-AZ avant le changement." } }
    - { id: c, text: { en: "Stop the DB instance, change its instance class, and start it again.", fr: "Arrêter l'instance de base de données, changer sa classe d'instance, puis la redémarrer." } }
    - { id: d, text: { en: "After the Multi-AZ conversion completes, modify the DB instance class during the maintenance window.", fr: "Une fois la conversion Multi-AZ terminée, modifier la classe de l'instance de base de données pendant la fenêtre de maintenance." } }
    - { id: e, text: { en: "Take a snapshot, and restore it to a new DB instance that uses the larger instance class.", fr: "Prendre un instantané et le restaurer dans une nouvelle instance de base de données qui utilise la classe plus grande." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Converting to Multi-AZ causes no downtime, only a possible performance impact. With Multi-AZ, Amazon RDS modifies the standby first, fails over to it, and then modifies the old primary, so the interruption of the instance class change is reduced to about the length of a failover, and the endpoint stays the same."
    fr: "La conversion en Multi-AZ ne provoque pas d'interruption, seulement un impact possible sur les performances. Avec Multi-AZ, Amazon RDS modifie d'abord l'instance de secours, bascule vers elle, puis modifie l'ancienne instance principale : l'interruption due au changement de classe se réduit à peu près à la durée d'un basculement, et le point de terminaison ne change pas."
  options:
    a:
      en: "A promoted read replica is a separate DB instance with its own endpoint, so the application would have to change its connection settings, and writes made on the source after the promotion are not replicated to it."
      fr: "Un réplica en lecture promu est une instance distincte avec son propre point de terminaison : l'application devrait modifier ses paramètres de connexion, et les écritures faites sur la source après la promotion n'y sont pas répliquées."
    c:
      en: "Stopping the DB instance makes it unavailable for the whole operation, which is longer than a Multi-AZ failover."
      fr: "Arrêter l'instance la rend indisponible pendant toute l'opération, ce qui dure plus longtemps qu'un basculement Multi-AZ."
    e:
      en: "A restored snapshot is a new DB instance with a new endpoint, and writes made after the snapshot would be missing."
      fr: "Un instantané restauré est une nouvelle instance avec un nouveau point de terminaison, et les écritures faites après l'instantané manqueraient."
references:
  - title: Settings for DB instances
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ModifyInstance.Settings.html
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
