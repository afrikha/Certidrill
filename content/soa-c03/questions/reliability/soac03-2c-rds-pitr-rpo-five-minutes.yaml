id: soac03-2c-rds-pitr-rpo-five-minutes
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MariaDB DB instance in one AWS Region. A new policy states that, after an accidental data change, the database must be recoverable in the same Region with an RPO of 15 minutes or less for the last 10 days. The company wants the MOST cost-effective solution with the least operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MariaDB dans une Région AWS. Une nouvelle politique stipule qu'après une modification accidentelle des données, la base de données doit pouvoir être récupérée dans la même Région avec un RPO de 15 minutes au maximum, sur les 10 derniers jours. L'entreprise veut la solution la PLUS rentable avec le moins de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Schedule an AWS Lambda function every 15 minutes that creates a manual DB snapshot and deletes snapshots older than 10 days.", fr: "Planifier toutes les 15 minutes une fonction AWS Lambda qui crée un instantané de base de données manuel et supprime les instantanés de plus de 10 jours." } }
    - { id: b, text: { en: "Create a read replica in the same Region, and promote it if an accidental change occurs.", fr: "Créer un réplica en lecture dans la même Région, et le promouvoir en cas de modification accidentelle." } }
    - { id: c, text: { en: "Convert the DB instance to a Multi-AZ deployment, and fail over to the standby after an accidental change.", fr: "Convertir l'instance en déploiement Multi-AZ, et basculer vers le réplica de secours après une modification accidentelle." } }
    - { id: d, text: { en: "Set the automated backup retention period to 10 days, and use point-in-time recovery when needed.", fr: "Définir la période de rétention des sauvegardes automatisées sur 10 jours, et utiliser la restauration à un instant dans le passé si nécessaire." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With automated backups, Amazon RDS uploads the transaction logs to Amazon S3 every 5 minutes, so the latest restorable time is usually about 5 minutes ago. A 10-day retention period lets the company restore to any second in that window, which meets the 15-minute RPO without any custom automation.
    fr: |
      Avec les sauvegardes automatisées, Amazon RDS charge les journaux de transactions dans Amazon S3 toutes les 5 minutes : l'heure de restauration la plus récente date donc généralement d'environ 5 minutes. Une période de rétention de 10 jours permet de restaurer à n'importe quelle seconde de cette fenêtre, ce qui respecte le RPO de 15 minutes sans automatisation personnalisée.
  options:
    a: { en: "Custom snapshot automation adds operational overhead and snapshot storage cost, and it gives a coarser RPO than point-in-time recovery.", fr: "Une automatisation personnalisée d'instantanés ajoute une charge opérationnelle et un coût de stockage, et donne un RPO moins fin que la restauration à un instant dans le passé." }
    b: { en: "A read replica applies the accidental change within seconds, so promoting it does not recover the earlier data.", fr: "Un réplica en lecture applique la modification accidentelle en quelques secondes : sa promotion ne récupère pas les données antérieures." }
    c: { en: "The Multi-AZ standby is updated synchronously and contains the accidental change; Multi-AZ protects against infrastructure failures, not data errors.", fr: "Le réplica de secours Multi-AZ est mis à jour de façon synchrone et contient la modification accidentelle ; Multi-AZ protège contre les pannes d'infrastructure, pas contre les erreurs de données." }
references:
  - title: Restoring a DB instance to a specified time for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html
