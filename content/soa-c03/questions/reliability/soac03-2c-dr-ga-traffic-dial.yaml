id: soac03-2c-dr-ga-traffic-dial
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company serves a TCP application to global clients through AWS Global Accelerator, with one endpoint group in us-east-1 and one in eu-west-1. Clients connect to the accelerator's static IP addresses. Before planned maintenance in us-east-1, the company must send all new connections to eu-west-1 without waiting for DNS caches to expire, and then return the traffic after the maintenance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise fournit une application TCP à des clients du monde entier via AWS Global Accelerator, avec un groupe de points de terminaison dans us-east-1 et un autre dans eu-west-1. Les clients se connectent aux adresses IP statiques de l'accélérateur. Avant une maintenance planifiée dans us-east-1, l'entreprise doit envoyer toutes les nouvelles connexions vers eu-west-1 sans attendre l'expiration des caches DNS, puis rétablir le trafic après la maintenance.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Lower the TTL of the Route 53 alias record that points to the accelerator to 5 seconds.", fr: "Abaisser à 5 secondes le TTL de l'enregistrement d'alias Route 53 qui pointe vers l'accélérateur." } }
    - { id: b, text: { en: "Delete the us-east-1 endpoint group, and re-create it after the maintenance ends.", fr: "Supprimer le groupe de points de terminaison de us-east-1, et le recréer à la fin de la maintenance." } }
    - { id: c, text: { en: "Set the weight of each endpoint in the eu-west-1 endpoint group to the maximum of 255.", fr: "Définir le poids de chaque point de terminaison du groupe de eu-west-1 sur le maximum de 255." } }
    - { id: d, text: { en: "Set the traffic dial of the us-east-1 endpoint group to 0%, then back to 100% afterward.", fr: "Régler sur 0 % le réglage de trafic (traffic dial) du groupe de points de terminaison de us-east-1, puis le remettre à 100 % ensuite." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Each Global Accelerator endpoint group has a traffic dial, 100% by default, that sets the share of traffic sent to that Region. Setting the us-east-1 dial to 0 cuts off new connections to the Region, and clients keep using the same static IP addresses, so DNS caching plays no role. Existing connections are not terminated, and the dial is set back to 100 after the maintenance.
    fr: |
      Chaque groupe de points de terminaison Global Accelerator possède un réglage de trafic, à 100 % par défaut, qui fixe la part du trafic envoyée vers cette Région. Régler celui de us-east-1 sur 0 coupe les nouvelles connexions vers la Région, et les clients continuent d'utiliser les mêmes adresses IP statiques : le cache DNS ne joue aucun rôle. Les connexions existantes ne sont pas interrompues, et le réglage est remis à 100 après la maintenance.
  options:
    a: { en: "The clients use the static IP addresses, and the accelerator chooses the Region; a DNS TTL does not move traffic between endpoint groups.", fr: "Les clients utilisent les adresses IP statiques, et c'est l'accélérateur qui choisit la Région ; un TTL DNS ne déplace pas le trafic entre groupes de points de terminaison." }
    b: { en: "Deleting the endpoint group loses its configuration and adds risk, while the traffic dial does the same thing reversibly.", fr: "Supprimer le groupe de points de terminaison fait perdre sa configuration et ajoute du risque, alors que le réglage de trafic fait la même chose de façon réversible." }
    c: { en: "Endpoint weights distribute traffic among endpoints inside one endpoint group; they do not move traffic away from the us-east-1 group.", fr: "Les poids répartissent le trafic entre les points de terminaison d'un même groupe ; ils ne détournent pas le trafic du groupe de us-east-1." }
references:
  - title: Use traffic dials to adjust traffic flow to Regions - AWS Global Accelerator
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoint-groups-traffic-dial.html
