id: soac03-2b-alb-hc-nacl
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs Amazon EC2 instances in two private subnets behind an internet-facing Application Load Balancer. The load balancer uses two public subnets, 10.0.0.0/24 and 10.0.1.0/24. The target group performs HTTP health checks on port 8080, and the security groups allow this traffic. The network team then associated the following custom network ACL with the private subnets, and all targets became unhealthy with the reason code `Target.Timeout`.

    ```text
    Inbound rules
    Rule  Protocol  Port range  Source        Action
    100   TCP       8080        10.0.0.0/24   ALLOW
    *     All       All         0.0.0.0/0     DENY

    Outbound rules
    Rule  Protocol  Port range  Destination   Action
    100   TCP       8080        10.0.0.0/24   ALLOW
    *     All       All         0.0.0.0/0     DENY
    ```

    Which combination of network ACL changes will restore the health checks? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute des instances Amazon EC2 dans deux sous-réseaux privés derrière un Application Load Balancer accessible sur Internet. L'équilibreur de charge utilise deux sous-réseaux publics, 10.0.0.0/24 et 10.0.1.0/24. Le groupe cible effectue des vérifications de l'état HTTP sur le port 8080, et les groupes de sécurité autorisent ce trafic. L'équipe réseau a ensuite associé aux sous-réseaux privés la liste ACL réseau personnalisée suivante, et toutes les cibles sont devenues défaillantes avec le code de motif `Target.Timeout`.

    ```text
    Inbound rules
    Rule  Protocol  Port range  Source        Action
    100   TCP       8080        10.0.0.0/24   ALLOW
    *     All       All         0.0.0.0/0     DENY

    Outbound rules
    Rule  Protocol  Port range  Destination   Action
    100   TCP       8080        10.0.0.0/24   ALLOW
    *     All       All         0.0.0.0/0     DENY
    ```

    Quelle combinaison de modifications de la liste ACL réseau permet de rétablir les vérifications de l'état ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an inbound rule that allows TCP port 8080 from 10.0.1.0/24.", fr: "Ajouter une règle entrante qui autorise le port TCP 8080 depuis 10.0.1.0/24." } }
    - { id: b, text: { en: "Add an inbound rule that allows TCP ports 1024-65535 from 0.0.0.0/0.", fr: "Ajouter une règle entrante qui autorise les ports TCP 1024-65535 depuis 0.0.0.0/0." } }
    - { id: c, text: { en: "Add an outbound rule that allows TCP port 8080 to 0.0.0.0/0.", fr: "Ajouter une règle sortante qui autorise le port TCP 8080 vers 0.0.0.0/0." } }
    - { id: d, text: { en: "Add an outbound rule that allows TCP ports 1024-65535 to 10.0.0.0/23.", fr: "Ajouter une règle sortante qui autorise les ports TCP 1024-65535 vers 10.0.0.0/23." } }
    - { id: e, text: { en: "Add an outbound rule that allows ICMP to 10.0.0.0/23 so that the load balancer can ping the targets.", fr: "Ajouter une règle sortante qui autorise ICMP vers 10.0.0.0/23 pour que l'équilibreur de charge puisse envoyer un ping aux cibles." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Network ACLs are stateless: the private subnets must allow inbound traffic on the health check port from every load balancer subnet, and outbound traffic on the ephemeral ports (1024-65535) for the responses. The current rules admit health checks only from 10.0.0.0/24 and send nothing back on ephemeral ports; 10.0.0.0/23 covers both public subnets.
    fr: |
      Les listes ACL réseau sont sans état : les sous-réseaux privés doivent autoriser le trafic entrant sur le port de vérification depuis chaque sous-réseau de l'équilibreur de charge, et le trafic sortant sur les ports éphémères (1024-65535) pour les réponses. Les règles actuelles n'admettent les vérifications que depuis 10.0.0.0/24 et ne renvoient rien sur les ports éphémères ; 10.0.0.0/23 couvre les deux sous-réseaux publics.
  options:
    b: { en: "The instances receive health check requests on port 8080; they do not receive inbound traffic on ephemeral ports for these checks, and opening them to 0.0.0.0/0 is too broad.", fr: "Les instances reçoivent les requêtes de vérification sur le port 8080 ; elles ne reçoivent pas de trafic entrant sur les ports éphémères pour ces vérifications, et les ouvrir à 0.0.0.0/0 est trop large." }
    c: { en: "The responses leave the instances from port 8080 toward the ephemeral source ports of the load balancer nodes, so an outbound rule on destination port 8080 does not match them.", fr: "Les réponses quittent les instances depuis le port 8080 vers les ports sources éphémères des nœuds de l'équilibreur : une règle sortante sur le port de destination 8080 ne leur correspond pas." }
    e: { en: "The target group uses HTTP health checks on TCP port 8080; ICMP plays no part in them.", fr: "Le groupe cible utilise des vérifications HTTP sur le port TCP 8080 ; ICMP n'y joue aucun rôle." }
references:
  - title: Troubleshoot your Application Load Balancers
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-troubleshooting.html
