id: soac03-2a-aurora-autoscaling-reader-endpoint
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon Aurora MySQL DB cluster has a writer and one manually created Aurora Replica named reader-1. The company configured Aurora Auto Scaling with a target of 60% average CPU utilization for the Aurora Replicas, and Aurora Auto Scaling has added two replicas. CPU utilization of reader-1 stays near 90%, while the new replicas are almost idle. The reporting application connects to the instance endpoint of reader-1.

    Which change will spread the read load across all the replicas?
  fr: |
    Un cluster de bases de données Amazon Aurora MySQL comprend une instance d'écriture et un réplica Aurora créé manuellement, nommé reader-1. L'entreprise a configuré Aurora Auto Scaling avec une cible de 60 % d'utilisation moyenne du processeur des réplicas Aurora, et Aurora Auto Scaling a ajouté deux réplicas. L'utilisation du processeur de reader-1 reste proche de 90 %, alors que les nouveaux réplicas sont presque inactifs. L'application de reporting se connecte au point de terminaison d'instance de reader-1.

    Quelle modification répartit la charge de lecture entre tous les réplicas ?
body:
  options:
    - { id: a, text: { en: "Change the reporting application to connect to the reader endpoint of the DB cluster.", fr: "Modifier l'application de reporting pour qu'elle se connecte au point de terminaison du lecteur du cluster." } }
    - { id: b, text: { en: "Lower the target value of the Aurora Auto Scaling policy to 40%.", fr: "Abaisser la valeur cible de la politique Aurora Auto Scaling à 40 %." } }
    - { id: c, text: { en: "Create a custom endpoint that contains only reader-1, and connect the application to it.", fr: "Créer un point de terminaison personnalisé qui ne contient que reader-1, et y connecter l'application." } }
    - { id: d, text: { en: "Change the promotion tier of reader-1 to 15 so that it receives less read traffic.", fr: "Passer le niveau de promotion de reader-1 à 15 pour qu'il reçoive moins de trafic de lecture." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An instance endpoint always connects to one specific DB instance, so the replicas added by Aurora Auto Scaling never receive the application's connections. The reader endpoint spreads connections across the available Aurora Replicas, including those that Aurora Auto Scaling adds or removes, which is why AWS recommends it with Aurora Auto Scaling."
    fr: "Un point de terminaison d'instance se connecte toujours à une instance précise : les réplicas ajoutés par Aurora Auto Scaling ne reçoivent jamais les connexions de l'application. Le point de terminaison du lecteur répartit les connexions entre les réplicas Aurora disponibles, y compris ceux qu'Aurora Auto Scaling ajoute ou retire, c'est pourquoi AWS le recommande avec Aurora Auto Scaling."
  options:
    b:
      en: "A lower target makes Aurora Auto Scaling add even more replicas, which stay idle as long as the application connects only to reader-1."
      fr: "Une cible plus basse fait ajouter encore plus de réplicas par Aurora Auto Scaling, qui restent inactifs tant que l'application ne se connecte qu'à reader-1."
    c:
      en: "A custom endpoint with only reader-1 keeps sending all connections to the same busy instance."
      fr: "Un point de terminaison personnalisé limité à reader-1 continue d'envoyer toutes les connexions à la même instance occupée."
    d:
      en: "The promotion tier only sets the failover priority; it does not change how connections are distributed."
      fr: "Le niveau de promotion ne fixe que la priorité de basculement ; il ne change pas la répartition des connexions."
references:
  - title: Amazon Aurora Auto Scaling with Aurora Replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Integrating.AutoScaling.html
