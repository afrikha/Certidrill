id: soac03-2b-web-tier-multi-az
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on two Amazon EC2 instances that were launched manually in one Availability Zone and registered in the target group of an Application Load Balancer. The load balancer uses subnets in two Availability Zones. The application stores its data in a Single-AZ Amazon RDS for MySQL DB instance. The company wants the application to keep running if any one Availability Zone fails, without changing the application code.

    Which combination of actions will meet these requirements? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application web sur deux instances Amazon EC2 lancées manuellement dans une zone de disponibilité et enregistrées dans le groupe cible d'un Application Load Balancer. L'équilibreur de charge utilise des sous-réseaux dans deux zones de disponibilité. L'application stocke ses données dans une instance de base de données Amazon RDS for MySQL mono-AZ. L'entreprise veut que l'application continue de fonctionner en cas de panne de l'une des zones, sans modifier le code de l'application.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create an Auto Scaling group that launches the instances in subnets of both Availability Zones.", fr: "Créer un groupe Auto Scaling qui lance les instances dans des sous-réseaux des deux zones de disponibilité." } }
    - { id: b, text: { en: "Create a read replica of the DB instance in the second Availability Zone.", fr: "Créer un réplica en lecture de l'instance de base de données dans la seconde zone de disponibilité." } }
    - { id: c, text: { en: "Attach the load balancer's target group to the Auto Scaling group.", fr: "Attacher le groupe cible de l'équilibreur de charge au groupe Auto Scaling." } }
    - { id: d, text: { en: "Place the instances in a cluster placement group in one Availability Zone.", fr: "Placer les instances dans un groupe de placement de cluster dans une zone de disponibilité." } }
    - { id: e, text: { en: "Modify the DB instance to convert it to a Multi-AZ deployment.", fr: "Modifier l'instance de base de données pour la convertir en déploiement Multi-AZ." } }
    - { id: f, text: { en: "Configure EC2 automatic recovery for the two existing instances with CloudWatch alarms.", fr: "Configurer la récupération automatique EC2 des deux instances existantes avec des alarmes CloudWatch." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      An Auto Scaling group with subnets in both zones keeps instances running in each zone and replaces lost capacity; attaching the target group registers the instances that the group launches with the load balancer. Converting the DB instance to Multi-AZ adds a synchronous standby in another zone, and the endpoint fails over automatically, so the application code does not change.
    fr: |
      Un groupe Auto Scaling avec des sous-réseaux dans les deux zones maintient des instances dans chaque zone et remplace la capacité perdue ; attacher le groupe cible enregistre auprès de l'équilibreur de charge les instances que lance le groupe. Convertir l'instance de base de données en Multi-AZ ajoute une instance de secours synchrone dans une autre zone, et le point de terminaison bascule automatiquement : le code de l'application ne change pas.
  options:
    b: { en: "A read replica is not promoted automatically and has its own endpoint, so writes stop until someone promotes it and changes the configuration.", fr: "Un réplica en lecture n'est pas promu automatiquement et a son propre point de terminaison : les écritures s'arrêtent jusqu'à sa promotion et la modification de la configuration." }
    d: { en: "A cluster placement group is limited to a single Availability Zone, which is the opposite of the requirement.", fr: "Un groupe de placement de cluster est limité à une seule zone de disponibilité, ce qui est l'inverse de l'exigence." }
    f: { en: "Automatic recovery restores an instance after an underlying hardware problem, in the same zone; it does not help when the zone itself fails.", fr: "La récupération automatique rétablit une instance après un problème matériel sous-jacent, dans la même zone ; elle n'aide pas quand c'est la zone elle-même qui tombe en panne." }
references:
  - title: Auto Scaling group Availability Zone distribution
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-availability-zone-balanced.html
  - title: Converting a DB instance to a Multi-AZ deployment for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.Migrating.html
