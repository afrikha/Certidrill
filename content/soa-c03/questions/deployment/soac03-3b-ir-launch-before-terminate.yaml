id: soac03-3b-ir-launch-before-terminate
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Auto Scaling group with a desired capacity of 10 runs a web application behind an Application Load Balancer. The group has no instance maintenance policy. An operator will start an instance refresh to deploy a new AMI. During the refresh, the group must never have fewer than 10 healthy instances in service, and up to 5 replacement instances can launch at the same time.

    Which combination of instance refresh preferences will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Un Auto Scaling group dont la capacité souhaitée est de 10 exécute une application web derrière un Application Load Balancer. Le groupe n'a pas de politique de maintenance des instances. Un opérateur va démarrer une actualisation d'instance (instance refresh) pour déployer une nouvelle AMI. Pendant l'actualisation, le groupe ne doit jamais avoir moins de 10 instances saines en service, et jusqu'à 5 instances de remplacement peuvent être lancées en même temps.

    Quelle combinaison de préférences d'actualisation d'instance répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "MinHealthyPercentage set to 90", fr: "MinHealthyPercentage défini à 90" } }
    - { id: b, text: { en: "MinHealthyPercentage set to 100", fr: "MinHealthyPercentage défini à 100" } }
    - { id: c, text: { en: "MaxHealthyPercentage set to 100", fr: "MaxHealthyPercentage défini à 100" } }
    - { id: d, text: { en: "MaxHealthyPercentage set to 150", fr: "MaxHealthyPercentage défini à 150" } }
    - { id: e, text: { en: "InstanceWarmup set to 0", fr: "InstanceWarmup défini à 0" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "MinHealthyPercentage 100 keeps 100% of the desired capacity in service, healthy, and ready during the refresh. MaxHealthyPercentage 150 lets the group grow to 15 instances, so Auto Scaling launches up to 5 replacements and terminates old instances only after the new ones are ready."
    fr: "MinHealthyPercentage à 100 maintient 100 % de la capacité souhaitée en service, saine et prête pendant l'actualisation. MaxHealthyPercentage à 150 permet au groupe de monter à 15 instances : Auto Scaling lance jusqu'à 5 remplacements et ne résilie les anciennes instances qu'une fois les nouvelles prêtes."
  options:
    a:
      en: "90 is the default minimum and lets capacity drop to 9 healthy instances."
      fr: "90 est le minimum par défaut et laisse la capacité descendre à 9 instances saines."
    c:
      en: "With a maximum of 100 and a minimum of 100, the group can neither terminate first nor launch extra instances, so it cannot replace anything."
      fr: "Avec un maximum de 100 et un minimum de 100, le groupe ne peut ni résilier d'abord ni lancer d'instances supplémentaires : il ne peut rien remplacer."
    e:
      en: "A zero warmup counts instances as ready before they finish initializing, which weakens the capacity guarantee."
      fr: "Un temps de préchauffage nul compte les instances comme prêtes avant la fin de leur initialisation, ce qui affaiblit la garantie de capacité."
references:
  - title: Understand the default values for an instance refresh
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/understand-instance-refresh-default-values.html
  - title: Instance maintenance policy for Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/instance-maintenance-policy-overview-and-considerations.html
