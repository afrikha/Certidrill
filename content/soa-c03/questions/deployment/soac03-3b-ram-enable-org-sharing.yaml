id: soac03-3b-ram-enable-org-sharing
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's organization in AWS Organizations has all features enabled. A network administrator wants to share VPC subnets from the network account with the Workloads organizational unit (OU) by using AWS Resource Access Manager (AWS RAM), without any invitation to accept. The administrator already ran `aws organizations enable-aws-service-access --service-principal ram.amazonaws.com` from the management account, but AWS RAM still does not offer the OU as a principal.

    What should the administrator do?
  fr: |
    L'organisation AWS Organizations d'une entreprise a toutes les fonctionnalités activées. Un administrateur réseau veut partager des sous-réseaux VPC du compte réseau avec l'unité d'organisation (OU) Workloads à l'aide d'AWS Resource Access Manager (AWS RAM), sans aucune invitation à accepter. L'administrateur a déjà exécuté `aws organizations enable-aws-service-access --service-principal ram.amazonaws.com` depuis le compte de gestion, mais AWS RAM ne propose toujours pas l'OU comme principal.

    Que doit faire l'administrateur ?
body:
  options:
    - { id: a, text: { en: "Share the subnets with each account ID in the OU, and accept the invitation in each account.", fr: "Partager les sous-réseaux avec chaque ID de compte de l'OU, et accepter l'invitation dans chaque compte." } }
    - { id: b, text: { en: "Create the AWSServiceRoleForResourceAccessManager role manually in each account of the OU.", fr: "Créer manuellement le rôle AWSServiceRoleForResourceAccessManager dans chaque compte de l'OU." } }
    - { id: c, text: { en: "Run `aws ram enable-sharing-with-aws-organization` from the management account.", fr: "Exécuter `aws ram enable-sharing-with-aws-organization` depuis le compte de gestion." } }
    - { id: d, text: { en: "Register the network account as a delegated administrator for AWS RAM.", fr: "Enregistrer le compte réseau comme administrateur délégué pour AWS RAM." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Sharing within the organization must be enabled from AWS RAM (console or enable-sharing-with-aws-organization) by the management account. Enabling trusted access from Organizations does not create the AWSServiceRoleForResourceAccessManager service-linked role, and without it sharing with the organization or its OUs does not work; once enabled, principals in the organization get access without invitations."
    fr: "Le partage au sein de l'organisation doit être activé depuis AWS RAM (console ou enable-sharing-with-aws-organization) par le compte de gestion. Activer l'accès approuvé depuis Organizations ne crée pas le rôle lié au service AWSServiceRoleForResourceAccessManager, et sans lui le partage avec l'organisation ou ses OU ne fonctionne pas ; une fois activé, les principaux de l'organisation obtiennent l'accès sans invitation."
  options:
    a:
      en: "Subnets can be shared only within the organization, and the requirement excludes invitations."
      fr: "Les sous-réseaux ne peuvent être partagés qu'au sein de l'organisation, et l'exigence exclut les invitations."
    b:
      en: "AWS RAM creates its service-linked role when organization sharing is enabled from AWS RAM; roles created by hand in member accounts do not enable sharing with the OU."
      fr: "AWS RAM crée son rôle lié au service lorsque le partage avec l'organisation est activé depuis AWS RAM ; des rôles créés à la main dans les comptes membres n'activent pas le partage avec l'OU."
    d:
      en: "Delegated administration does not replace enabling organization sharing, which is the missing step."
      fr: "L'administration déléguée ne remplace pas l'activation du partage avec l'organisation, qui est l'étape manquante."
references:
  - title: Sharing your AWS resources
    url: https://docs.aws.amazon.com/ram/latest/userguide/getting-started-sharing.html
