id: soac03-3b-ram-sg-sharing
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's network account owns a VPC whose subnets are shared through AWS Resource Access Manager (AWS RAM) with application accounts in the same organization in AWS Organizations. Sharing with AWS Organizations is enabled in AWS RAM. The network team wants every application instance in the shared subnets to use one security group that only the network team can change, and rule changes must apply to all participant instances immediately.

    Which solution will meet these requirements?
  fr: |
    Le compte réseau d'une entreprise possède un VPC dont les sous-réseaux sont partagés via AWS Resource Access Manager (AWS RAM) avec des comptes d'application de la même organisation AWS Organizations. Le partage avec AWS Organizations est activé dans AWS RAM. L'équipe réseau veut que chaque instance d'application des sous-réseaux partagés utilise un seul groupe de sécurité que seule l'équipe réseau peut modifier, et les modifications de règles doivent s'appliquer immédiatement à toutes les instances des participants.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy an identical security group into each application account with a CloudFormation StackSet that the network team manages.", fr: "Déployer un groupe de sécurité identique dans chaque compte d'application avec un StackSet CloudFormation géré par l'équipe réseau." } }
    - { id: b, text: { en: "Reference the network account's security group ID as a source in the security groups that the application accounts create.", fr: "Référencer l'ID du groupe de sécurité du compte réseau comme source dans les groupes de sécurité créés par les comptes d'application." } }
    - { id: c, text: { en: "Share the default security group of the shared VPC with the application accounts by using AWS RAM.", fr: "Partager le groupe de sécurité par défaut du VPC partagé avec les comptes d'application à l'aide d'AWS RAM." } }
    - { id: d, text: { en: "Create a new security group in the shared VPC from the network account and share it with the application accounts by using AWS RAM.", fr: "Créer un nouveau groupe de sécurité dans le VPC partagé depuis le compte réseau et le partager avec les comptes d'application à l'aide d'AWS RAM." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A VPC owner can share a security group that it owns in the shared VPC with accounts of the same organization by using AWS RAM. Participants can attach the shared group when they launch instances in the shared subnets, the owner keeps managing its rules, and rule updates apply to participant resources."
    fr: "Le propriétaire d'un VPC peut partager un groupe de sécurité qu'il possède dans le VPC partagé avec des comptes de la même organisation à l'aide d'AWS RAM. Les participants peuvent associer le groupe partagé lorsqu'ils lancent des instances dans les sous-réseaux partagés, le propriétaire continue de gérer ses règles, et les mises à jour des règles s'appliquent aux ressources des participants."
  options:
    a:
      en: "This creates one copy per account instead of a single group, and each application account owns and can change its copy."
      fr: "Cela crée une copie par compte au lieu d'un groupe unique, et chaque compte d'application possède sa copie et peut la modifier."
    b:
      en: "A reference only allows traffic from members of the network group; the application accounts still own and control their own rules."
      fr: "Une référence autorise seulement le trafic venant des membres du groupe réseau ; les comptes d'application possèdent et contrôlent toujours leurs propres règles."
    c:
      en: "Default security groups, and security groups in a default VPC, cannot be shared."
      fr: "Les groupes de sécurité par défaut, ainsi que les groupes de sécurité d'un VPC par défaut, ne peuvent pas être partagés."
references:
  - title: Share security groups with AWS Organizations
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-group-sharing.html
