id: soac03-3a-ts-instance-type-az
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Auto Scaling group uses subnets in three Availability Zones. After the launch template was changed to a newer instance type, the activity history shows that the requested instance type is not supported in the requested Availability Zone for one of the zones. Instances launch successfully in the other two zones.

    Which solution will resolve the issue?
  fr: |
    Un groupe Auto Scaling utilise des sous-réseaux dans trois zones de disponibilité. Après le passage du modèle de lancement à un type d'instance plus récent, l'historique d'activité indique, pour l'une des zones, que le type d'instance demandé n'est pas pris en charge dans la zone de disponibilité demandée. Les instances se lancent correctement dans les deux autres zones.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Use only the zones that offer the type, as shown by describe-instance-type-offerings, or choose a type that all three zones offer.", fr: "N'utiliser que les zones qui proposent le type, d'après describe-instance-type-offerings, ou choisir un type proposé dans les trois zones." } }
    - { id: b, text: { en: "Request an increase of the On-Demand vCPU quota for this instance family in the Region of the Auto Scaling group.", fr: "Demander une augmentation du quota de vCPU à la demande pour cette famille d'instances dans la Région du groupe Auto Scaling." } }
    - { id: c, text: { en: "Add a larger subnet in the same Availability Zone to the Auto Scaling group so that more instances can launch there.", fr: "Ajouter au groupe Auto Scaling un sous-réseau plus grand dans la même zone de disponibilité pour que davantage d'instances puissent s'y lancer." } }
    - { id: d, text: { en: "Purchase a zonal Reserved Instance of the new instance type in the Availability Zone where the launches fail.", fr: "Acheter une instance réservée zonale du nouveau type d'instance dans la zone de disponibilité où les lancements échouent." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Not every instance type is offered in every Availability Zone. describe-instance-type-offerings shows where the type is available; the group must then use only subnets in zones that offer the type, or use a type that is offered in all its zones.
    fr: |
      Chaque type d'instance n'est pas proposé dans toutes les zones de disponibilité. describe-instance-type-offerings indique où le type est disponible ; le groupe doit alors n'utiliser que des sous-réseaux de zones qui proposent ce type, ou utiliser un type proposé dans toutes ses zones.
  options:
    b:
      en: |
        A quota problem would return a limit error in every zone; here the instance type is not offered in one zone.
      fr: |
        Un problème de quota renverrait une erreur de limite dans toutes les zones ; ici, le type d'instance n'est pas proposé dans une zone.
    c:
      en: |
        A larger subnet in the same zone does not make the instance type available in that zone.
      fr: |
        Un sous-réseau plus grand dans la même zone ne rend pas le type d'instance disponible dans cette zone.
    d:
      en: |
        Reserved Instances apply a billing discount, and a capacity reservation when they are zonal, to instance types that a zone offers; they do not make a type available in a zone.
      fr: |
        Les instances réservées appliquent une remise de facturation, et une réservation de capacité lorsqu'elles sont zonales, aux types d'instance qu'une zone propose ; elles ne rendent pas un type disponible dans une zone.
references:
  - title: "Troubleshoot Amazon EC2 Auto Scaling: EC2 instance launch failures"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ts-as-instancelaunchfailure.html
