id: soac03-3b-ss-global-iam-role
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A self-managed AWS CloudFormation StackSet deploys a template to 12 accounts in us-east-1 and eu-west-1. The template creates Amazon CloudWatch alarms and an IAM role whose RoleName property is set to ops-readonly. All stack instances in us-east-1 are CURRENT. All stack instances in eu-west-1 are OUTDATED, and the stack events report that ops-readonly already exists. Each account needs the alarms in both Regions and exactly one ops-readonly role.

    Which solution will meet these requirements?
  fr: |
    Un StackSet AWS CloudFormation autogéré déploie un modèle dans 12 comptes dans us-east-1 et eu-west-1. Le modèle crée des alarmes Amazon CloudWatch et un rôle IAM dont la propriété RoleName est définie à ops-readonly. Toutes les instances de pile de us-east-1 sont à l'état CURRENT. Toutes les instances de pile d'eu-west-1 sont à l'état OUTDATED, et les événements de pile indiquent que ops-readonly existe déjà. Chaque compte a besoin des alarmes dans les deux Régions et d'exactement un rôle ops-readonly.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the CAPABILITY_NAMED_IAM capability to the StackSet and retry the operation in eu-west-1.", fr: "Ajouter la capacité CAPABILITY_NAMED_IAM au StackSet et relancer l'opération dans eu-west-1." } }
    - { id: b, text: { en: "Move the IAM role to a separate StackSet deployed only to us-east-1, and keep the alarms in the original StackSet.", fr: "Déplacer le rôle IAM dans un StackSet distinct déployé uniquement dans us-east-1, et garder les alarmes dans le StackSet d'origine." } }
    - { id: c, text: { en: "Set RegionConcurrencyType to PARALLEL so that both Regions create the role in the same operation.", fr: "Définir RegionConcurrencyType à PARALLEL afin que les deux Régions créent le rôle dans la même opération." } }
    - { id: d, text: { en: "Raise FailureToleranceCount to 12 so that the operation completes in eu-west-1.", fr: "Porter FailureToleranceCount à 12 afin que l'opération se termine dans eu-west-1." } }
answer: { optionId: b }
explanation:
  correct:
    en: "IAM roles are global resources: a role name is unique in an account across all Regions. The second Region tries to create a role that already exists, so global resources must be deployed in one Region only, while Regional resources such as alarms can stay in a StackSet that targets both Regions."
    fr: "Les rôles IAM sont des ressources globales : un nom de rôle est unique dans un compte pour toutes les Régions. La seconde Région tente de créer un rôle qui existe déjà : les ressources globales doivent être déployées dans une seule Région, tandis que les ressources régionales comme les alarmes peuvent rester dans un StackSet qui cible les deux Régions."
  options:
    a:
      en: "The capability is already accepted, since us-east-1 created the named role; the failure is a name conflict."
      fr: "La capacité est déjà acceptée, puisque us-east-1 a créé le rôle nommé ; l'échec vient d'un conflit de nom."
    c:
      en: "Running both Regions at once still creates the same role name twice in each account."
      fr: "Exécuter les deux Régions en même temps crée toujours deux fois le même nom de rôle dans chaque compte."
    d:
      en: "A higher tolerance lets the operation continue past failures but does not create the alarms in eu-west-1."
      fr: "Une tolérance plus élevée laisse l'opération continuer malgré les échecs, mais ne crée pas les alarmes dans eu-west-1."
references:
  - title: Troubleshooting CloudFormation StackSets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-troubleshooting.html
