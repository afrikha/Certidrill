id: soac03-3b-ram-shareable-network
objective: "3.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company's network account manages connectivity for 20 application accounts. Application teams must reference one centrally maintained list of on-premises CIDR blocks in their security group rules, and their VPCs must route to on premises through a central hub that the network account owns. The network team wants to use AWS Resource Access Manager (AWS RAM).

    Which two resources should the network account share by using AWS RAM? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le compte réseau d'une entreprise gère la connectivité de 20 comptes d'application. Les équipes d'application doivent référencer dans leurs règles de groupe de sécurité une liste unique de blocs CIDR sur site, maintenue de façon centralisée, et leurs VPC doivent être routés vers le site via un hub central qui appartient au compte réseau. L'équipe réseau veut utiliser AWS Resource Access Manager (AWS RAM).

    Quelles sont les deux ressources que le compte réseau doit partager à l'aide d'AWS RAM ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A NAT gateway", fr: "Une passerelle NAT" } }
    - { id: b, text: { en: "A customer-managed prefix list", fr: "Une liste de préfixes gérée par le client" } }
    - { id: c, text: { en: "An internet gateway", fr: "Une passerelle Internet" } }
    - { id: d, text: { en: "A transit gateway", fr: "Une passerelle de transit" } }
    - { id: e, text: { en: "An Elastic IP address", fr: "Une adresse IP Elastic" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Customer-managed prefix lists are shareable with AWS RAM, and accounts can reference a shared prefix list in their security groups and route tables. Transit gateways are also shareable, so other accounts can attach their VPCs and route traffic to on-premises networks through the shared gateway."
    fr: "Les listes de préfixes gérées par le client sont partageables avec AWS RAM, et les comptes peuvent référencer une liste partagée dans leurs groupes de sécurité et leurs tables de routage. Les passerelles de transit sont aussi partageables : les autres comptes peuvent y attacher leurs VPC et router le trafic vers les réseaux sur site via la passerelle partagée."
  options:
    a:
      en: "NAT gateways are not an AWS RAM shareable resource type, and they provide outbound internet access, not a hub to on premises."
      fr: "Les passerelles NAT ne sont pas un type de ressource partageable avec AWS RAM, et elles fournissent un accès Internet sortant, pas un hub vers le site."
    c:
      en: "Internet gateways cannot be shared with AWS RAM and do not connect VPCs to on-premises networks."
      fr: "Les passerelles Internet ne peuvent pas être partagées avec AWS RAM et ne connectent pas les VPC aux réseaux sur site."
    e:
      en: "Elastic IP addresses are not shared through AWS RAM and do not help with CIDR lists or routing."
      fr: "Les adresses IP Elastic ne sont pas partagées via AWS RAM et n'aident ni pour les listes CIDR ni pour le routage."
references:
  - title: Shareable AWS resources
    url: https://docs.aws.amazon.com/ram/latest/userguide/shareable.html
