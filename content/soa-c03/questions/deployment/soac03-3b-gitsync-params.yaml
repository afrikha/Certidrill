id: soac03-3b-gitsync-params
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CloudFormation stack is managed with Git sync from the main branch of a GitHub repository. The repository contains the following stack deployment file:

    ```yaml
    template-file-path: services/web/stack.yaml
    parameters:
      max_capacity: 5
      env: production
    ```

    The operations team must change max_capacity to 8 and keep the stack configuration in Git as the source of truth.

    What should the team do?
  fr: |
    Une pile AWS CloudFormation est gérée avec Git sync depuis la branche main d'un dépôt GitHub. Le dépôt contient le fichier de déploiement de pile suivant :

    ```yaml
    template-file-path: services/web/stack.yaml
    parameters:
      max_capacity: 5
      env: production
    ```

    L'équipe d'exploitation doit passer max_capacity à 8 et garder la configuration de la pile dans Git comme source de vérité.

    Que doit faire l'équipe ?
body:
  options:
    - { id: a, text: { en: "Update the stack in the CloudFormation console and enter 8 for the max_capacity parameter.", fr: "Mettre à jour la pile dans la console CloudFormation et saisir 8 pour le paramètre max_capacity." } }
    - { id: b, text: { en: "Change the Default value of the max_capacity parameter to 8 in services/web/stack.yaml.", fr: "Changer la valeur Default du paramètre max_capacity à 8 dans services/web/stack.yaml." } }
    - { id: c, text: { en: "Change max_capacity to 8 in the stack deployment file and merge the change into the main branch.", fr: "Passer max_capacity à 8 dans le fichier de déploiement de pile et fusionner la modification dans la branche main." } }
    - { id: d, text: { en: "Run aws cloudformation update-stack with --use-previous-template and the new parameter value.", fr: "Exécuter aws cloudformation update-stack avec --use-previous-template et la nouvelle valeur de paramètre." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With Git sync, the stack deployment file holds the parameter values, and CloudFormation updates the stack when a commit on the monitored branch changes the template or this file. Changing the value in the file keeps Git as the source of truth and triggers the update."
    fr: "Avec Git sync, le fichier de déploiement de pile contient les valeurs des paramètres, et CloudFormation met à jour la pile lorsqu'un commit sur la branche surveillée modifie le modèle ou ce fichier. Changer la valeur dans le fichier garde Git comme source de vérité et déclenche la mise à jour."
  options:
    a:
      en: "A console update is not recorded in the repository, so Git no longer matches the stack and the next sync applies the file's value again."
      fr: "Une mise à jour dans la console n'est pas enregistrée dans le dépôt : Git ne correspond plus à la pile, et la synchronisation suivante applique de nouveau la valeur du fichier."
    b:
      en: "The deployment file already sets max_capacity to 5, and that value takes precedence over the template default."
      fr: "Le fichier de déploiement définit déjà max_capacity à 5, et cette valeur l'emporte sur la valeur par défaut du modèle."
    d:
      en: "A CLI update changes the stack outside Git, so the repository is no longer the source of truth."
      fr: "Une mise à jour par la CLI modifie la pile en dehors de Git : le dépôt n'est plus la source de vérité."
references:
  - title: How Git sync works with CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/git-sync-concepts-terms.html
