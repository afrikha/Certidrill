id: soac03-3c-asg-hook-heartbeat
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Auto Scaling group has a termination lifecycle hook that was created with the AWS CLI without specifying a heartbeat timeout. An Amazon EventBridge rule starts a job that archives data from the instance and then calls complete-lifecycle-action. Archiving usually takes 40 minutes, but sometimes it takes 90 minutes, and in those cases the instance is terminated before the archive finishes.

    Which solution will ensure that the archive always finishes before termination with the LEAST change?
  fr: |
    Un groupe Auto Scaling possède un hook de cycle de vie de résiliation créé avec l'AWS CLI sans indiquer de délai de pulsation (heartbeat timeout). Une règle Amazon EventBridge lance une tâche qui archive les données de l'instance, puis appelle complete-lifecycle-action. L'archivage dure généralement 40 minutes, mais il prend parfois 90 minutes, et dans ces cas l'instance est résiliée avant la fin de l'archivage.

    Quelle solution garantit que l'archivage se termine toujours avant la résiliation avec le MOINS de modifications ?
body:
  options:
    - { id: a, text: { en: "Set the default result of the lifecycle hook to CONTINUE instead of ABANDON.", fr: "Définir le résultat par défaut du hook de cycle de vie sur CONTINUE au lieu d'ABANDON." } }
    - { id: b, text: { en: "Update the lifecycle hook with a heartbeat timeout of 7200 seconds.", fr: "Mettre à jour le hook de cycle de vie avec un délai de pulsation de 7 200 secondes." } }
    - { id: c, text: { en: "Increase the health check grace period of the group to 7200 seconds.", fr: "Porter la période de grâce de la vérification de l'état du groupe à 7 200 secondes." } }
    - { id: d, text: { en: "Increase the default cooldown of the Auto Scaling group to 7200 seconds.", fr: "Porter le temps de stabilisation par défaut du groupe Auto Scaling à 7 200 secondes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A hook created with the CLI without a heartbeat timeout uses the default of 3600 seconds (one hour), and a termination hook that times out lets the instance terminate. Raising the heartbeat timeout to 7200 seconds, the maximum, covers the 90-minute archive. The job could also call record-lifecycle-action-heartbeat to extend the wait, within the global limit of 48 hours or 100 times the heartbeat timeout."
    fr: "Un hook créé avec la CLI sans délai de pulsation utilise la valeur par défaut de 3 600 secondes (une heure), et un hook de résiliation qui expire laisse l'instance être résiliée. Porter le délai de pulsation à 7 200 secondes, la valeur maximale, couvre l'archivage de 90 minutes. La tâche pourrait aussi appeler record-lifecycle-action-heartbeat pour prolonger l'attente, dans la limite globale de 48 heures ou de 100 fois le délai de pulsation."
  options:
    a:
      en: "For termination hooks, both CONTINUE and ABANDON let the instance terminate when the hook times out; the default result does not extend the wait."
      fr: "Pour les hooks de résiliation, CONTINUE comme ABANDON laissent l'instance être résiliée à l'expiration du hook ; le résultat par défaut ne prolonge pas l'attente."
    c:
      en: "The grace period delays health checks of new instances; it does not affect how long a terminating instance waits."
      fr: "La période de grâce retarde les vérifications de l'état des nouvelles instances ; elle n'a pas d'effet sur la durée d'attente d'une instance en cours de résiliation."
    d:
      en: "The cooldown delays further simple scaling activities; it does not keep a terminating instance in the wait state."
      fr: "Le temps de stabilisation retarde les activités de mise à l'échelle simple suivantes ; il ne maintient pas une instance en cours de résiliation dans l'état d'attente."
references:
