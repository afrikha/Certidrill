id: soac03-3a-cfn-creation-signal
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An AWS CloudFormation template launches an Amazon EC2 instance whose user data runs cfn-init to install an application, which takes about 10 minutes. CloudFormation marks the instance CREATE_COMPLETE as soon as it is running, and a dependent resource that calls the application then fails. The instance must be marked CREATE_COMPLETE only after the installation succeeds, and the stack must roll back if the installation fails.

    Which combination of steps will meet these requirements? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un modèle AWS CloudFormation lance une instance Amazon EC2 dont les données utilisateur exécutent cfn-init pour installer une application, ce qui prend environ 10 minutes. CloudFormation marque l'instance CREATE_COMPLETE dès qu'elle est en cours d'exécution, et une ressource dépendante qui appelle l'application échoue ensuite. L'instance ne doit être marquée CREATE_COMPLETE qu'après la réussite de l'installation, et la pile doit être restaurée si l'installation échoue.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a DependsOn attribute to the instance that references the dependent resource.", fr: "Ajouter à l'instance un attribut DependsOn qui référence la ressource dépendante." } }
    - { id: b, text: { en: "Add an UpdatePolicy attribute with a PauseTime of 15 minutes to the instance.", fr: "Ajouter à l'instance un attribut UpdatePolicy avec un PauseTime de 15 minutes." } }
    - { id: c, text: { en: "Add a CreationPolicy with a ResourceSignal Count of 1 and a Timeout of PT15M to the instance.", fr: "Ajouter à l'instance une CreationPolicy avec un ResourceSignal de Count 1 et de Timeout PT15M." } }
    - { id: d, text: { en: "Configure the cfn-hup daemon on the instance to report the installation status to CloudFormation.", fr: "Configurer le démon cfn-hup sur l'instance pour qu'il signale l'état de l'installation à CloudFormation." } }
    - { id: e, text: { en: "At the end of the user data, run cfn-signal with the exit code of cfn-init for the instance's logical ID.", fr: "À la fin des données utilisateur, exécuter cfn-signal avec le code de sortie de cfn-init pour l'ID logique de l'instance." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      A CreationPolicy makes CloudFormation wait for the specified number of success signals before it sets the resource to CREATE_COMPLETE. cfn-signal sends the result of cfn-init: a failure signal, or no signal before the timeout, makes the resource creation fail and the stack roll back.
    fr: |
      Une CreationPolicy fait attendre à CloudFormation le nombre indiqué de signaux de réussite avant de passer la ressource à CREATE_COMPLETE. cfn-signal envoie le résultat de cfn-init : un signal d'échec, ou l'absence de signal avant le délai, fait échouer la création de la ressource et restaure la pile.
  options:
    a:
      en: |
        This reverses the dependency, and DependsOn only waits for a resource to be created, not for an application to be installed on it.
      fr: |
        Cela inverse la dépendance, et DependsOn attend seulement la création d'une ressource, pas l'installation d'une application sur celle-ci.
    b:
      en: |
        UpdatePolicy applies to updates of Auto Scaling groups and similar resources, not to the creation of an EC2 instance.
      fr: |
        UpdatePolicy s'applique aux mises à jour des groupes Auto Scaling et de ressources similaires, pas à la création d'une instance EC2.
    d:
      en: |
        cfn-hup detects metadata changes after creation and runs hooks; it does not send creation signals.
      fr: |
        cfn-hup détecte les modifications des métadonnées après la création et exécute des hooks ; il n'envoie pas de signaux de création.
references:
  - title: CreationPolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-attribute-creationpolicy.html
