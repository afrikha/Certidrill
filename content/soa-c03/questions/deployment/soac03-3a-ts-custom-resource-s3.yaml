id: soac03-3a-ts-custom-resource-s3
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CloudFormation stack contains a custom resource backed by an AWS Lambda function. The function is connected to private subnets of a VPC that have no route to a NAT gateway or an internet gateway. The function's logs show that it completes its work and then times out while it sends its response to the ResponseURL of the request. The stack operation waits until the custom resource times out and then fails.

    Which solution will fix the issue?
  fr: |
    Une pile AWS CloudFormation contient une ressource personnalisée basée sur une fonction AWS Lambda. La fonction est connectée à des sous-réseaux privés d'un VPC qui n'ont aucune route vers une passerelle NAT ou une passerelle Internet. Les journaux de la fonction montrent qu'elle termine son travail puis expire pendant l'envoi de sa réponse à la ResponseURL de la requête. L'opération de pile attend l'expiration de la ressource personnalisée puis échoue.

    Quelle solution permet de corriger le problème ?
body:
  options:
    - { id: a, text: { en: "Create an interface VPC endpoint for AWS CloudFormation in the VPC, with private DNS enabled for the function's subnets.", fr: "Créer dans le VPC un point de terminaison d'interface pour AWS CloudFormation, avec le DNS privé activé pour les sous-réseaux de la fonction." } }
    - { id: b, text: { en: "Add an S3 gateway endpoint to the route tables of the function's subnets, with a policy that allows the CloudFormation response bucket.", fr: "Ajouter un point de terminaison de passerelle S3 aux tables de routage des sous-réseaux de la fonction, avec une politique qui autorise le compartiment de réponse de CloudFormation." } }
    - { id: c, text: { en: "Set the ServiceTimeout property of the custom resource to 3600 so that the function has more time to send its response.", fr: "Définir la propriété ServiceTimeout de la ressource personnalisée sur 3600 pour que la fonction ait plus de temps pour envoyer sa réponse." } }
    - { id: d, text: { en: "Add the cloudformation:SignalResource permission to the execution role so that the function can send its response.", fr: "Ajouter l'autorisation cloudformation:SignalResource au rôle d'exécution pour que la fonction puisse envoyer sa réponse." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The ResponseURL is a presigned Amazon S3 URL: the provider must send its response to a CloudFormation bucket in the Region (cloudformation-custom-resource-response-region). From private subnets without internet access, an S3 gateway endpoint gives that access, and its policy must allow the response bucket; otherwise CloudFormation receives no response and the operation fails.
    fr: |
      La ResponseURL est une URL Amazon S3 présignée : le fournisseur doit envoyer sa réponse à un compartiment CloudFormation de la Région (cloudformation-custom-resource-response-region). Depuis des sous-réseaux privés sans accès à Internet, un point de terminaison de passerelle S3 donne cet accès, et sa politique doit autoriser le compartiment de réponse ; sinon CloudFormation ne reçoit aucune réponse et l'opération échoue.
  options:
    a:
      en: |
        Custom resource responses are not sent to the CloudFormation API but to a presigned S3 URL.
      fr: |
        Les réponses des ressources personnalisées ne sont pas envoyées à l'API CloudFormation mais à une URL S3 présignée.
    c:
      en: |
        3,600 seconds is already the default; the response still cannot reach Amazon S3.
      fr: |
        3 600 secondes est déjà la valeur par défaut ; la réponse ne peut toujours pas atteindre Amazon S3.
    d:
      en: |
        Custom resources do not use SignalResource; the presigned URL needs no IAM permission, only network access to Amazon S3.
      fr: |
        Les ressources personnalisées n'utilisent pas SignalResource ; l'URL présignée ne demande aucune autorisation IAM, seulement un accès réseau à Amazon S3.
references:
