id: soac03-3c-eb-lambda-resource-policy
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator uses the AWS CLI commands put-rule and put-targets to create an Amazon EventBridge rule that targets an AWS Lambda function. When matching events occur, the TriggeredRules metric of the rule increases, and so does its FailedInvocations metric. The function is never invoked and shows no throttles.

    Which solution will fix the issue?
  fr: |
    Un administrateur utilise les commandes AWS CLI put-rule et put-targets pour créer une règle Amazon EventBridge qui cible une fonction AWS Lambda. Lorsque des événements correspondants se produisent, la métrique TriggeredRules de la règle augmente, de même que sa métrique FailedInvocations. La fonction n'est jamais appelée et n'affiche aucune limitation.

    Quelle solution résout le problème ?
body:
  options:
    - { id: a, text: { en: "Add the lambda:InvokeFunction permission for the function's own ARN to the execution role of the function.", fr: "Ajouter l'autorisation lambda:InvokeFunction sur l'ARN de la fonction au rôle d'exécution de la fonction." } }
    - { id: b, text: { en: "Configure a dead-letter queue on the rule target so that EventBridge keeps retrying the failed events.", fr: "Configurer une file d'attente de lettres mortes sur la cible de la règle pour qu'EventBridge continue de réessayer les événements en échec." } }
    - { id: c, text: { en: "Increase the reserved concurrency of the function so that the EventBridge invocations are accepted.", fr: "Augmenter la simultanéité réservée de la fonction pour que les appels d'EventBridge soient acceptés." } }
    - { id: d, text: { en: "Add a resource-based policy statement to the function that allows events.amazonaws.com to invoke it from the rule ARN.", fr: "Ajouter à la fonction une instruction de politique basée sur une ressource qui autorise events.amazonaws.com à l'appeler depuis l'ARN de la règle." } }
answer: { optionId: d }
explanation:
  correct:
    en: "EventBridge invokes a Lambda function through the function's resource-based policy, which must allow the events.amazonaws.com principal, usually with the rule ARN as the source ARN. The console adds this permission when you add the target, but the CLI does not, so invocations fail. The aws lambda add-permission command adds the statement."
    fr: "EventBridge appelle une fonction Lambda grâce à la politique basée sur une ressource de la fonction, qui doit autoriser le principal events.amazonaws.com, en général avec l'ARN de la règle comme ARN source. La console ajoute cette autorisation lors de l'ajout de la cible, mais pas la CLI : les appels échouent donc. La commande aws lambda add-permission ajoute l'instruction."
  options:
    a:
      en: "The execution role defines what the function can do once it runs; it does not allow EventBridge to invoke the function."
      fr: "Le rôle d'exécution définit ce que la fonction peut faire une fois lancée ; il n'autorise pas EventBridge à appeler la fonction."
    b:
      en: "A dead-letter queue keeps events that could not be delivered, but delivery keeps failing until EventBridge is allowed to invoke the function."
      fr: "Une file d'attente de lettres mortes conserve les événements non remis, mais la remise continue d'échouer tant qu'EventBridge n'est pas autorisé à appeler la fonction."
    c:
      en: "The function shows no throttles, so concurrency is not the cause of the failed invocations."
      fr: "La fonction n'affiche aucune limitation : la simultanéité n'est pas la cause des appels en échec."
references:
  - title: Troubleshooting Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-troubleshooting.html
