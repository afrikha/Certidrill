id: soac03-3a-ib-distribution-ou
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses an EC2 Image Builder pipeline in us-east-1 to build a hardened AMI every week. Application teams launch instances from this AMI in us-east-1 and eu-west-1, in accounts that belong to the Workloads organizational unit (OU) in AWS Organizations. Today, an engineer copies and shares each new AMI by hand. The company wants each new AMI to be available in both Regions to all accounts of the OU as soon as a build succeeds.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise un pipeline EC2 Image Builder dans us-east-1 pour créer chaque semaine une AMI renforcée. Les équipes applicatives lancent des instances à partir de cette AMI dans us-east-1 et eu-west-1, dans des comptes qui appartiennent à l'unité d'organisation (OU) Workloads d'AWS Organizations. Aujourd'hui, un ingénieur copie et partage chaque nouvelle AMI à la main. L'entreprise souhaite que chaque nouvelle AMI soit disponible dans les deux Régions pour tous les comptes de l'OU dès qu'une création réussit.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon EventBridge rule that invokes an AWS Lambda function to copy each new AMI to eu-west-1 and to add launch permissions for every account of the OU.", fr: "Créer une règle Amazon EventBridge qui appelle une fonction AWS Lambda pour copier chaque nouvelle AMI dans eu-west-1 et ajouter des autorisations de lancement pour chaque compte de l'OU." } }
    - { id: b, text: { en: "Update the pipeline's distribution settings to include us-east-1 and eu-west-1, and grant launch permission to the Workloads OU ARN in each Region.", fr: "Mettre à jour les paramètres de distribution du pipeline pour inclure us-east-1 et eu-west-1, et accorder l'autorisation de lancement à l'ARN de l'OU Workloads dans chaque Région." } }
    - { id: c, text: { en: "Add a component at the end of the image recipe that runs the AWS CLI copy-image command to copy the AMI to eu-west-1.", fr: "Ajouter à la fin de la recette d'image un composant qui exécute la commande AWS CLI copy-image pour copier l'AMI dans eu-west-1." } }
    - { id: d, text: { en: "Create a second Image Builder pipeline with the same recipe in eu-west-1, and add the OU accounts to the launch permissions of each new AMI by hand.", fr: "Créer un second pipeline Image Builder avec la même recette dans eu-west-1, et ajouter à la main les comptes de l'OU aux autorisations de lancement de chaque nouvelle AMI." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A distribution configuration copies the output AMI to each listed Region and can authorize accounts, organizations and OUs to launch it. Image Builder distributes the image only after the build has passed its tests, so the AMI is available in both Regions to the whole OU without any custom code or manual step.
    fr: |
      Une configuration de distribution copie l'AMI produite dans chaque Région listée et peut autoriser des comptes, des organisations et des OU à la lancer. Image Builder ne distribue l'image qu'une fois que la création a réussi ses tests : l'AMI est donc disponible dans les deux Régions pour toute l'OU, sans code personnalisé ni étape manuelle.
  options:
    a:
      en: |
        This works, but it adds a Lambda function and per-account permissions to maintain, which is more overhead than the built-in distribution settings.
      fr: |
        Cela fonctionne, mais ajoute une fonction Lambda et des autorisations par compte à maintenir, ce qui représente plus de charge que les paramètres de distribution intégrés.
    c:
      en: |
        A build component runs on the build instance before the image is created and tested, so it cannot copy the final AMI, and it shares nothing with the OU.
      fr: |
        Un composant de création s'exécute sur l'instance de création avant que l'image soit créée et testée : il ne peut donc pas copier l'AMI finale, et il ne partage rien avec l'OU.
    d:
      en: |
        Two pipelines produce two different builds to keep in sync, and the manual sharing step remains.
      fr: |
        Deux pipelines produisent deux créations différentes à garder synchronisées, et l'étape de partage manuelle subsiste.
references:
  - title: Manage Image Builder distribution settings
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-distribution-settings.html
  - title: How EC2 Image Builder works
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/how-image-builder-works.html
