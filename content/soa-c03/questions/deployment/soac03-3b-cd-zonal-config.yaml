id: soac03-3b-cd-zonal-config
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AWS CodeDeploy deploys an application in place to 60 Amazon EC2 instances, 20 in each of three Availability Zones, in one deployment group. To limit the impact of a bad release, the deployment must update one Availability Zone at a time, wait 30 minutes after each zone so that the team can watch metrics, and keep at least 15 healthy instances in each zone.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AWS CodeDeploy déploie une application sur place sur 60 instances Amazon EC2, 20 dans chacune des trois zones de disponibilité, dans un seul groupe de déploiement. Pour limiter l'impact d'une mauvaise version, le déploiement doit mettre à jour une zone de disponibilité à la fois, attendre 30 minutes après chaque zone pour que l'équipe surveille les métriques, et garder au moins 15 instances saines dans chaque zone.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create a custom deployment configuration with a zonal configuration: a monitor duration of 1800 seconds and minimum healthy hosts per zone of 15 (HOST_COUNT).", fr: "Créer une configuration de déploiement personnalisée avec une configuration zonale : une durée de surveillance de 1800 secondes et un minimum d'hôtes sains par zone de 15 (HOST_COUNT)." } }
    - { id: b, text: { en: "Use CodeDeployDefault.HalfAtATime and add a zonal configuration with a monitor duration of 1800 seconds to it.", fr: "Utiliser CodeDeployDefault.HalfAtATime et lui ajouter une configuration zonale avec une durée de surveillance de 1800 secondes." } }
    - { id: c, text: { en: "Create one deployment group per Availability Zone, and start each deployment by hand 30 minutes after the previous one ends.", fr: "Créer un groupe de déploiement par zone de disponibilité, et lancer chaque déploiement à la main 30 minutes après la fin du précédent." } }
    - { id: d, text: { en: "Switch the deployment group to a blue/green deployment and add a zonal configuration with a monitor duration of 1800 seconds.", fr: "Passer le groupe de déploiement en déploiement bleu/vert et ajouter une configuration zonale avec une durée de surveillance de 1800 secondes." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A zonal configuration deploys to one Availability Zone at a time, waits the monitor duration before the next zone, and enforces a minimum number or percentage of healthy hosts per zone. It is supported only in custom deployment configurations for in-place deployments to EC2 instances."
    fr: "Une configuration zonale déploie dans une zone de disponibilité à la fois, attend la durée de surveillance avant la zone suivante, et impose un nombre ou un pourcentage minimal d'hôtes sains par zone. Elle n'est prise en charge que dans les configurations de déploiement personnalisées pour les déploiements sur place vers des instances EC2."
  options:
    b:
      en: "Predefined deployment configurations do not support the zonal configuration feature."
      fr: "Les configurations de déploiement prédéfinies ne prennent pas en charge la configuration zonale."
    c:
      en: "Separate groups and manual timing work but add groups to maintain and a manual step for every release."
      fr: "Des groupes séparés et un minutage manuel fonctionnent, mais ajoutent des groupes à maintenir et une étape manuelle à chaque version."
    d:
      en: "Zonal configuration is not supported for blue/green deployments."
      fr: "La configuration zonale n'est pas prise en charge pour les déploiements bleu/vert."
references:
  - title: Create a deployment configuration with CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations-create.html
