id: soac03-3b-ss-ops-sequential
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team updates an AWS CloudFormation StackSet that has stack instances in 40 accounts in us-east-1, eu-west-1, and ap-southeast-2. The update must run in one Region at a time, in that order, and in no more than 4 accounts at the same time. If the update fails in more than 2 accounts of a Region, CloudFormation must stop in that Region and must not continue to the next Regions.

    Which operation preferences will meet these requirements?
  fr: |
    Une équipe d'exploitation met à jour un StackSet AWS CloudFormation qui a des instances de pile dans 40 comptes dans us-east-1, eu-west-1 et ap-southeast-2. La mise à jour doit s'exécuter dans une Région à la fois, dans cet ordre, et dans 4 comptes au plus en même temps. Si la mise à jour échoue dans plus de 2 comptes d'une Région, CloudFormation doit s'arrêter dans cette Région et ne doit pas continuer vers les Régions suivantes.

    Quelles préférences d'opération répondent à ces exigences ?
body:
  options:
    - { id: a, text: { en: "RegionConcurrencyType PARALLEL, MaxConcurrentCount 4, and FailureToleranceCount 2", fr: "RegionConcurrencyType PARALLEL, MaxConcurrentCount 4 et FailureToleranceCount 2" } }
    - { id: b, text: { en: "RegionConcurrencyType SEQUENTIAL with the RegionOrder, MaxConcurrentCount 4, and FailureToleranceCount 3", fr: "RegionConcurrencyType SEQUENTIAL avec le RegionOrder, MaxConcurrentCount 4 et FailureToleranceCount 3" } }
    - { id: c, text: { en: "RegionConcurrencyType SEQUENTIAL with the RegionOrder, MaxConcurrentCount 4, and FailureToleranceCount 2", fr: "RegionConcurrencyType SEQUENTIAL avec le RegionOrder, MaxConcurrentCount 4 et FailureToleranceCount 2" } }
    - { id: d, text: { en: "RegionConcurrencyType SEQUENTIAL with the RegionOrder, MaxConcurrentPercentage 4, and FailureTolerancePercentage 2", fr: "RegionConcurrencyType SEQUENTIAL avec le RegionOrder, MaxConcurrentPercentage 4 et FailureTolerancePercentage 2" } }
answer: { optionId: c }
explanation:
  correct:
    en: "SEQUENTIAL with a RegionOrder processes one Region at a time in the listed order. FailureToleranceCount 2 lets the operation fail in 2 accounts per Region, so a third failure stops it in that Region and in all later Regions, and MaxConcurrentCount 4 caps the accounts processed at once (strict mode may lower it further)."
    fr: "SEQUENTIAL avec un RegionOrder traite une Région à la fois dans l'ordre indiqué. FailureToleranceCount 2 permet à l'opération d'échouer dans 2 comptes par Région : un troisième échec l'arrête dans cette Région et dans toutes les Régions suivantes, et MaxConcurrentCount 4 plafonne le nombre de comptes traités en même temps (le mode strict peut encore le réduire)."
  options:
    a:
      en: "PARALLEL deploys to all Regions at the same time instead of one Region after another."
      fr: "PARALLEL déploie dans toutes les Régions en même temps au lieu d'une Région après l'autre."
    b:
      en: "A tolerance of 3 lets 3 accounts fail before stopping, so the operation would continue after the third failure."
      fr: "Une tolérance de 3 laisse échouer 3 comptes avant l'arrêt : l'opération continuerait après le troisième échec."
    d:
      en: "Percentages apply to the accounts of each Region and are rounded down, so this gives 1 account at a time and no tolerated failure."
      fr: "Les pourcentages s'appliquent aux comptes de chaque Région et sont arrondis à l'inférieur : on obtient 1 compte à la fois et aucun échec toléré."
references:
  - title: StackSetOperationPreferences
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_StackSetOperationPreferences.html
