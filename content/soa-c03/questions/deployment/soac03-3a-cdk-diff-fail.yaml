id: soac03-3a-cdk-diff-fail
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team deploys an AWS CDK app from a CI job. Before each production change window, the team wants a scheduled job that reports whether the stacks defined in the main branch differ from the stacks that are deployed. The job must exit with an error when differences exist, and it must not modify any resources.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'exploitation déploie une application AWS CDK depuis une tâche CI. Avant chaque fenêtre de changement en production, l'équipe souhaite une tâche planifiée qui indique si les piles définies dans la branche main diffèrent des piles déployées. La tâche doit se terminer en erreur lorsque des différences existent, et elle ne doit modifier aucune ressource.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run cdk synth, and compare its exit code with the exit code of the previous run.", fr: "Exécuter cdk synth, et comparer son code de sortie avec celui de l'exécution précédente." } }
    - { id: b, text: { en: "Run cdk deploy --method=prepare-change-set, and check whether the command succeeds.", fr: "Exécuter cdk deploy --method=prepare-change-set, et vérifier si la commande réussit." } }
    - { id: c, text: { en: "Run cdk diff with the --fail option.", fr: "Exécuter cdk diff avec l'option --fail." } }
    - { id: d, text: { en: "Run cdk deploy --require-approval never, and check the stack events for updates.", fr: "Exécuter cdk deploy --require-approval never, et vérifier les événements de la pile pour repérer des mises à jour." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      cdk diff compares the stacks of the local CDK app with the deployed stacks without changing them. With --fail, the command exits with code 1 when differences are detected, which makes the CI job fail.
    fr: |
      cdk diff compare les piles de l'application CDK locale avec les piles déployées sans les modifier. Avec --fail, la commande se termine avec le code 1 lorsque des différences sont détectées, ce qui fait échouer la tâche CI.
  options:
    a:
      en: |
        cdk synth only produces templates; it does not compare them with the deployed stacks, and its exit code does not reflect differences.
      fr: |
        cdk synth produit seulement des modèles ; il ne les compare pas aux piles déployées, et son code de sortie ne reflète pas les différences.
    b:
      en: |
        prepare-change-set creates a CloudFormation change set without executing it; the command does not exit with an error just because changes exist.
      fr: |
        prepare-change-set crée un jeu de modifications CloudFormation sans l'exécuter ; la commande ne se termine pas en erreur du seul fait que des modifications existent.
    d:
      en: |
        This deploys every change without approval, so it modifies resources.
      fr: |
        Cela déploie toutes les modifications sans approbation : des ressources sont modifiées.
references:
  - title: cdk diff
    url: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-diff.html
