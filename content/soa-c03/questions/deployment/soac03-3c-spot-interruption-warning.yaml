id: soac03-3c-spot-interruption-warning
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs batch workers on Amazon EC2 Spot Instances. When Amazon EC2 is about to interrupt an instance, an AWS Lambda function must save the progress of the worker to Amazon DynamoDB, by using the 2-minute notice that Amazon EC2 provides before the interruption.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des processus de traitement par lots sur des instances Spot Amazon EC2. Lorsqu'Amazon EC2 s'apprête à interrompre une instance, une fonction AWS Lambda doit enregistrer la progression du processus dans Amazon DynamoDB, en utilisant le préavis de 2 minutes qu'Amazon EC2 fournit avant l'interruption.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge rule for EC2 Instance State-change Notification events with the state stopping, and target the function.", fr: "Créer une règle EventBridge pour les événements EC2 Instance State-change Notification à l'état stopping, et cibler la fonction." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the StatusCheckFailed metric of each instance, and invoke the function from the alarm.", fr: "Créer une alarme CloudWatch sur la métrique StatusCheckFailed de chaque instance, et appeler la fonction depuis l'alarme." } }
    - { id: c, text: { en: "Create an EventBridge rule for AWS Health Event events with the category scheduledChange, and target the function.", fr: "Créer une règle EventBridge pour les événements AWS Health Event de catégorie scheduledChange, et cibler la fonction." } }
    - { id: d, text: { en: "Create an EventBridge rule for EC2 Spot Instance Interruption Warning events, and target the function.", fr: "Créer une règle EventBridge pour les événements EC2 Spot Instance Interruption Warning, et cibler la fonction." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon EC2 emits an EC2 Spot Instance Interruption Warning event, with the source aws.ec2, two minutes before it stops or terminates a Spot Instance. An EventBridge rule that matches this detail-type can invoke the function to save the progress while the instance is still running."
    fr: "Amazon EC2 émet un événement EC2 Spot Instance Interruption Warning, avec la source aws.ec2, deux minutes avant d'arrêter ou de résilier une instance Spot. Une règle EventBridge qui correspond à ce detail-type peut appeler la fonction pour enregistrer la progression pendant que l'instance fonctionne encore."
  options:
    a:
      en: "The stopping state starts when the interruption is already in progress, so the 2-minute notice is lost, and terminated Spot Instances never enter stopping."
      fr: "L'état stopping commence quand l'interruption est déjà en cours, ce qui fait perdre le préavis de 2 minutes, et les instances Spot résiliées ne passent jamais par stopping."
    b:
      en: "Status checks detect impaired instances or hardware; they do not report Spot interruptions in advance."
      fr: "Les vérifications d'état détectent les instances ou le matériel défaillants ; elles ne signalent pas les interruptions Spot à l'avance."
    c:
      en: "AWS Health scheduled changes cover planned maintenance and retirements, not Spot interruptions."
      fr: "Les modifications planifiées d'AWS Health concernent la maintenance planifiée et les mises hors service, pas les interruptions Spot."
references:
  - title: Spot Instance interruption notices
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-instance-termination-notices.html
