id: soac03-3a-ts-allowed-amis-vendor
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations. The security team applied a declarative policy that enables Allowed AMIs in all member accounts, with criteria that allow only Amazon-provided AMIs and the AMIs of the company's image account. A team now cannot launch instances from a hardened AMI that an approved security vendor shares from its account 444455556666: the launch fails as if the AMI did not exist. The company wants to allow this vendor's AMIs.

    Which solution will meet this requirement?
  fr: |
    Une entreprise utilise AWS Organizations. L'équipe de sécurité a appliqué une politique déclarative qui active Allowed AMIs dans tous les comptes membres, avec des critères qui n'autorisent que les AMI fournies par Amazon et les AMI du compte image de l'entreprise. Une équipe ne peut plus lancer d'instances à partir d'une AMI renforcée qu'un éditeur de sécurité approuvé partage depuis son compte 444455556666 : le lancement échoue comme si l'AMI n'existait pas. L'entreprise souhaite autoriser les AMI de cet éditeur.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "In the member account, edit the Allowed AMIs settings of the Region to add 444455556666 as an image provider.", fr: "Dans le compte membre, modifier les paramètres Allowed AMIs de la Région pour ajouter 444455556666 comme fournisseur d'images." } }
    - { id: b, text: { en: "Update the declarative policy in AWS Organizations to add 444455556666 to the image providers of the Allowed AMIs criteria.", fr: "Mettre à jour la politique déclarative dans AWS Organizations pour ajouter 444455556666 aux fournisseurs d'images des critères Allowed AMIs." } }
    - { id: c, text: { en: "Ask the vendor to make the AMI public, because Allowed AMIs applies only to AMIs that are shared with specific accounts.", fr: "Demander à l'éditeur de rendre l'AMI publique, car Allowed AMIs ne s'applique qu'aux AMI partagées avec des comptes précis." } }
    - { id: d, text: { en: "Attach an SCP that allows ec2:RunInstances on the ARN of the vendor's AMI to the member account.", fr: "Attacher au compte membre une SCP qui autorise ec2:RunInstances sur l'ARN de l'AMI de l'éditeur." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When Allowed AMIs is enabled, users can discover and launch only public or shared AMIs that match the criteria, and InvalidAMIID.NotFound can be returned for an AMI that does not. Because a declarative policy sets the criteria, they cannot be modified in the account; the policy must add the vendor's account ID as an image provider.
    fr: |
      Lorsque Allowed AMIs est activé, les utilisateurs ne peuvent découvrir et lancer que des AMI publiques ou partagées qui respectent les critères, et InvalidAMIID.NotFound peut être renvoyé pour une AMI qui ne les respecte pas. Comme une politique déclarative définit les critères, ils ne peuvent pas être modifiés dans le compte ; c'est la politique qui doit ajouter l'ID de compte de l'éditeur comme fournisseur d'images.
  options:
    a:
      en: |
        When a declarative policy is in use, the Allowed AMIs settings cannot be modified directly in the account.
      fr: |
        Lorsqu'une politique déclarative est en vigueur, les paramètres Allowed AMIs ne peuvent pas être modifiés directement dans le compte.
    c:
      en: |
        Allowed AMIs controls both public AMIs and AMIs shared with the account, so a public AMI from this provider would still be blocked.
      fr: |
        Allowed AMIs contrôle à la fois les AMI publiques et les AMI partagées avec le compte : une AMI publique de ce fournisseur resterait bloquée.
    d:
      en: |
        SCPs never grant permissions, and Allowed AMIs is not evaluated as an IAM permission.
      fr: |
        Les SCP n'accordent jamais d'autorisations, et Allowed AMIs n'est pas évalué comme une autorisation IAM.
references:
  - title: Control the discovery and use of AMIs in Amazon EC2 with Allowed AMIs
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-allowed-amis.html
  - title: Error codes for the Amazon EC2 API
    url: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/errors-overview.html
