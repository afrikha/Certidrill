id: soac03-3a-ts-scp-explicit-deny
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations engineer deploys an AWS CloudFormation stack in a member account of an organization in AWS Organizations by using the DeployRole role, which has the AdministratorAccess managed policy. The stack fails, and the event of the NAT gateway resource contains the following message.

    ```text
    User: arn:aws:sts::222233334444:assumed-role/DeployRole/deploy-session is not authorized to perform: ec2:CreateNatGateway on resource: arn:aws:ec2:us-east-1:222233334444:natgateway/* with an explicit deny in a service control policy
    ```

    Which solution will resolve the error?
  fr: |
    Un ingénieur d'exploitation déploie une pile AWS CloudFormation dans un compte membre d'une organisation AWS Organizations à l'aide du rôle DeployRole, qui dispose de la politique gérée AdministratorAccess. La pile échoue, et l'événement de la ressource de passerelle NAT contient le message suivant.

    ```text
    User: arn:aws:sts::222233334444:assumed-role/DeployRole/deploy-session is not authorized to perform: ec2:CreateNatGateway on resource: arn:aws:ec2:us-east-1:222233334444:natgateway/* with an explicit deny in a service control policy
    ```

    Quelle solution permet de résoudre l'erreur ?
body:
  options:
    - { id: a, text: { en: "Attach a second IAM policy to DeployRole that explicitly allows ec2:CreateNatGateway.", fr: "Attacher à DeployRole une seconde politique IAM qui autorise explicitement ec2:CreateNatGateway." } }
    - { id: b, text: { en: "Create the stack with a CloudFormation service role of the account that has AdministratorAccess.", fr: "Créer la pile avec un rôle de service CloudFormation du compte qui dispose d'AdministratorAccess." } }
    - { id: c, text: { en: "Remove the permissions boundary of DeployRole, and then create the stack again.", fr: "Supprimer la limite d'autorisations de DeployRole, puis créer de nouveau la pile." } }
    - { id: d, text: { en: "Ask the organization's administrators to change the SCP that denies the action for this account.", fr: "Demander aux administrateurs de l'organisation de modifier la SCP qui refuse l'action pour ce compte." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The message names the policy type that caused the explicit deny: a service control policy. SCPs set the maximum permissions of the member account's users and roles, and an explicit deny in an SCP overrides any Allow in IAM policies, so the fix must be made in the organization's SCPs, for example by changing the SCP or moving the account to an OU where the action is allowed.
    fr: |
      Le message nomme le type de politique à l'origine du refus explicite : une politique de contrôle des services (SCP). Les SCP fixent les autorisations maximales des utilisateurs et rôles du compte membre, et un refus explicite dans une SCP l'emporte sur tout Allow des politiques IAM : la correction doit être faite dans les SCP de l'organisation, par exemple en modifiant la SCP ou en déplaçant le compte vers une OU où l'action est autorisée.
  options:
    a:
      en: |
        An explicit deny in an SCP cannot be overridden by any Allow in an identity-based policy.
      fr: |
        Un refus explicite dans une SCP ne peut être annulé par aucun Allow d'une politique basée sur l'identité.
    b:
      en: |
        A CloudFormation service role is an IAM role of the same member account, so the same SCP applies to it.
      fr: |
        Un rôle de service CloudFormation est un rôle IAM du même compte membre : la même SCP s'applique à lui.
    c:
      en: |
        The message names a service control policy, not a permissions boundary.
      fr: |
        Le message nomme une politique de contrôle des services, pas une limite d'autorisations.
references:
  - title: Troubleshoot access denied error messages
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
