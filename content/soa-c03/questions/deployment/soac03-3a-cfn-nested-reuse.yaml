id: soac03-3a-cfn-nested-reuse
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 12 AWS CloudFormation templates, one for each application. Each template contains the same block of resources for an Application Load Balancer, its listeners and its security group. When the company's load balancer standard changes, engineers must edit all 12 templates. Each application stack must still create its own load balancer.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise dispose de 12 modèles AWS CloudFormation, un par application. Chaque modèle contient le même bloc de ressources pour un Application Load Balancer, ses écouteurs et son groupe de sécurité. Lorsque la norme de l'entreprise pour les équilibreurs de charge change, les ingénieurs doivent modifier les 12 modèles. Chaque pile d'application doit toujours créer son propre équilibreur de charge.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Move the load balancer resources into one template in Amazon S3, and reference it from each template as a nested stack.", fr: "Déplacer les ressources de l'équilibreur de charge dans un modèle stocké dans Amazon S3, et le référencer depuis chaque modèle comme pile imbriquée." } }
    - { id: b, text: { en: "Deploy one load balancer stack that exports the load balancer ARN, and import the ARN in each application template with Fn::ImportValue.", fr: "Déployer une pile d'équilibreur de charge qui exporte l'ARN de l'équilibreur, et importer cet ARN dans chaque modèle d'application avec Fn::ImportValue." } }
    - { id: c, text: { en: "Deploy the load balancer template 12 times to the account with CloudFormation StackSets, once for each application.", fr: "Déployer le modèle d'équilibreur de charge 12 fois dans le compte avec CloudFormation StackSets, une fois par application." } }
    - { id: d, text: { en: "Create a change set for each of the 12 application templates whenever the load balancer standard changes.", fr: "Créer un jeu de modifications pour chacun des 12 modèles d'application chaque fois que la norme d'équilibreur de charge change." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Nested stacks separate a common configuration into a dedicated template that other templates reference with AWS::CloudFormation::Stack. Each application stack still creates its own load balancer, and a change to the standard is made once in the shared template; updates are started from each root stack.
    fr: |
      Les piles imbriquées isolent une configuration commune dans un modèle dédié que les autres modèles référencent avec AWS::CloudFormation::Stack. Chaque pile d'application crée toujours son propre équilibreur de charge, et une modification de la norme se fait une seule fois dans le modèle partagé ; les mises à jour sont lancées depuis chaque pile racine.
  options:
    b:
      en: |
        Exports share a value between stacks, so all applications would use one shared load balancer instead of their own.
      fr: |
        Les exportations partagent une valeur entre piles : toutes les applications utiliseraient un seul équilibreur partagé au lieu du leur.
    c:
      en: |
        StackSets deploy stacks across accounts and Regions; the load balancers would be separate from the application stacks and harder to manage.
      fr: |
        StackSets déploie des piles entre comptes et Régions ; les équilibreurs de charge seraient séparés des piles d'application et plus difficiles à gérer.
    d:
      en: |
        Change sets preview updates; the 12 templates would still have to be edited one by one.
      fr: |
        Les jeux de modifications prévisualisent les mises à jour ; il faudrait toujours modifier les 12 modèles un par un.
references:
  - title: Split a template into reusable pieces using nested stacks
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-nested-stacks.html
