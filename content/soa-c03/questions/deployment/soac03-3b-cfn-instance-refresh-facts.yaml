id: soac03-3b-cfn-instance-refresh-facts
objective: "3.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An operations engineer adds an AutoScalingInstanceRefresh update policy with the Rolling strategy to an Auto Scaling group in an AWS CloudFormation template. The group had no other update policy.

    Which two statements are true about how stack updates behave with this policy? (Choose two.)
  fr: |
    Un ingénieur d'exploitation ajoute une politique de mise à jour AutoScalingInstanceRefresh avec la stratégie Rolling à un Auto Scaling group dans un modèle AWS CloudFormation. Le groupe n'avait aucune autre politique de mise à jour.

    Quelles sont les deux affirmations vraies sur le comportement des mises à jour de pile avec cette politique ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A stack update that changes the LaunchTemplate or VPCZoneIdentifier property starts an instance refresh.", fr: "Une mise à jour de pile qui change la propriété LaunchTemplate ou VPCZoneIdentifier démarre une actualisation d'instance." } }
    - { id: b, text: { en: "New instances can confirm that they are ready by running cfn-signal, as with WaitOnResourceSignals.", fr: "Les nouvelles instances peuvent confirmer qu'elles sont prêtes en exécutant cfn-signal, comme avec WaitOnResourceSignals." } }
    - { id: c, text: { en: "A stack update that changes only the MaxSize property starts an instance refresh.", fr: "Une mise à jour de pile qui change uniquement la propriété MaxSize démarre une actualisation d'instance." } }
    - { id: d, text: { en: "If the instance refresh fails, CloudFormation rolls back the stack and starts a new instance refresh to restore the previous configuration.", fr: "Si l'actualisation d'instance échoue, CloudFormation annule la pile et démarre une nouvelle actualisation d'instance pour restaurer la configuration précédente." } }
    - { id: e, text: { en: "To revert a failing refresh started by CloudFormation, an operator calls the RollbackInstanceRefresh API.", fr: "Pour annuler une actualisation en échec démarrée par CloudFormation, un opérateur appelle l'API RollbackInstanceRefresh." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "CloudFormation starts an instance refresh only when LaunchTemplate, MixedInstancesPolicy, VPCZoneIdentifier, AvailabilityZones, AvailabilityZoneIds, or PlacementGroup changes. Stack rollback is the rollback mechanism: on failure, CloudFormation rolls back the stack and runs another instance refresh to restore the previous configuration."
    fr: "CloudFormation ne démarre une actualisation d'instance que si LaunchTemplate, MixedInstancesPolicy, VPCZoneIdentifier, AvailabilityZones, AvailabilityZoneIds ou PlacementGroup change. L'annulation de la pile est le mécanisme de retour arrière : en cas d'échec, CloudFormation annule la pile et exécute une autre actualisation d'instance pour restaurer la configuration précédente."
  options:
    b:
      en: "Instance refresh does not support cfn-signal; readiness is confirmed with an EC2_INSTANCE_LAUNCHING lifecycle hook and CompleteLifecycleAction."
      fr: "L'actualisation d'instance ne prend pas en charge cfn-signal ; la disponibilité se confirme avec un hook de cycle de vie EC2_INSTANCE_LAUNCHING et CompleteLifecycleAction."
    c:
      en: "MaxSize is not one of the properties that trigger an instance refresh."
      fr: "MaxSize ne fait pas partie des propriétés qui déclenchent une actualisation d'instance."
    e:
      en: "RollbackInstanceRefresh cannot be used on a refresh started by CloudFormation; use CancelInstanceRefresh or roll back the stack update."
      fr: "RollbackInstanceRefresh ne peut pas être utilisé sur une actualisation démarrée par CloudFormation ; utilisez CancelInstanceRefresh ou annulez la mise à jour de la pile."
references:
  - title: UpdatePolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatepolicy.html
