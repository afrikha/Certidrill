id: soac03-3a-ib-launch-template-version
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Auto Scaling group launches instances from the default version of a launch template. An EC2 Image Builder pipeline in the same account and Region produces a new AMI every two weeks. After each build, an operator creates a new launch template version that contains the new AMI ID and makes it the default version.

    Which solution will automate this step with the LEAST operational overhead?
  fr: |
    Un groupe Auto Scaling lance des instances à partir de la version par défaut d'un modèle de lancement. Un pipeline EC2 Image Builder du même compte et de la même Région produit une nouvelle AMI toutes les deux semaines. Après chaque création, un opérateur crée une nouvelle version du modèle de lancement qui contient l'ID de la nouvelle AMI et en fait la version par défaut.

    Quelle solution permet d'automatiser cette étape avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Add a launch template configuration for this launch template to the pipeline's distribution settings, with the option to set the new version as the default version.", fr: "Ajouter aux paramètres de distribution du pipeline une configuration de modèle de lancement pour ce modèle, avec l'option qui définit la nouvelle version comme version par défaut." } }
    - { id: b, text: { en: "Add the launch template ID to the pipeline's infrastructure configuration so that the build instances are launched from the launch template.", fr: "Ajouter l'ID du modèle de lancement à la configuration d'infrastructure du pipeline pour que les instances de création soient lancées à partir du modèle de lancement." } }
    - { id: c, text: { en: "Create an Image Builder lifecycle policy that deprecates the previous AMI so that the Auto Scaling group selects the newest AMI.", fr: "Créer une politique de cycle de vie Image Builder qui rend obsolète l'AMI précédente pour que le groupe Auto Scaling sélectionne l'AMI la plus récente." } }
    - { id: d, text: { en: "Create an AWS Config rule that detects launch templates that use an older AMI and remediates them with a custom Systems Manager Automation runbook.", fr: "Créer une règle AWS Config qui détecte les modèles de lancement utilisant une AMI ancienne et les corrige avec un runbook Systems Manager Automation personnalisé." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When launchTemplateConfigurations are present in the distribution configuration, Image Builder creates a new version of the launch template with all its original settings and the new AMI ID. The setDefaultVersion option, true by default, makes that version the default, so new instances of the group use the new AMI. Existing instances are replaced only by a separate action such as an instance refresh.
    fr: |
      Lorsque des launchTemplateConfigurations figurent dans la configuration de distribution, Image Builder crée une nouvelle version du modèle de lancement avec tous ses paramètres d'origine et l'ID de la nouvelle AMI. L'option setDefaultVersion, à true par défaut, en fait la version par défaut : les nouvelles instances du groupe utilisent la nouvelle AMI. Les instances existantes ne sont remplacées que par une action distincte, comme une actualisation des instances.
  options:
    b:
      en: |
        The infrastructure configuration controls the build and test instances, not the launch templates that consume the output AMI.
      fr: |
        La configuration d'infrastructure contrôle les instances de création et de test, pas les modèles de lancement qui utilisent l'AMI produite.
    c:
      en: |
        A launch template references a specific AMI ID; deprecating the old AMI does not change that ID, and launch templates can still use deprecated AMIs.
      fr: |
        Un modèle de lancement référence un ID d'AMI précis ; rendre l'ancienne AMI obsolète ne change pas cet ID, et les modèles de lancement peuvent toujours utiliser des AMI obsolètes.
    d:
      en: |
        This could work, but a custom rule and runbook are far more to build and maintain than a distribution setting.
      fr: |
        Cela pourrait fonctionner, mais une règle et un runbook personnalisés demandent beaucoup plus de travail de création et de maintenance qu'un paramètre de distribution.
references:
  - title: Configure AMI distribution with an EC2 launch template
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/dist-using-launch-template.html
