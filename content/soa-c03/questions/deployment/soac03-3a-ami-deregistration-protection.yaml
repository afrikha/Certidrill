id: soac03-3a-ami-deregistration-protection
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's golden AMI is used by many Auto Scaling groups. Last month, an administrator who has full Amazon EC2 permissions deregistered it by mistake. The company wants to prevent every user, whatever their IAM permissions, from deregistering this AMI. A deregistration must also remain impossible for 24 hours after someone turns this protection off.

    Which solution will meet these requirements?
  fr: |
    L'AMI de référence d'une entreprise est utilisée par de nombreux groupes Auto Scaling. Le mois dernier, un administrateur qui dispose de toutes les autorisations Amazon EC2 en a annulé l'enregistrement par erreur. L'entreprise souhaite empêcher tout utilisateur, quelles que soient ses autorisations IAM, d'annuler l'enregistrement de cette AMI. L'annulation de l'enregistrement doit aussi rester impossible pendant 24 heures après la désactivation de cette protection.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on deregistration protection for the AMI with the cooldown option.", fr: "Activer la protection contre l'annulation de l'enregistrement de l'AMI avec l'option de délai de grâce (cooldown)." } }
    - { id: b, text: { en: "Create a Recycle Bin retention rule for AMIs with a retention period of 24 hours.", fr: "Créer une règle de conservation de la Corbeille pour les AMI avec une période de conservation de 24 heures." } }
    - { id: c, text: { en: "Attach an IAM policy that denies ec2:DeregisterImage to all users and roles of the account.", fr: "Attacher une politique IAM qui refuse ec2:DeregisterImage à tous les utilisateurs et rôles du compte." } }
    - { id: d, text: { en: "Set a deprecation time on the AMI 24 hours in the future.", fr: "Définir une date d'obsolescence de l'AMI 24 heures dans le futur." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      While deregistration protection is on, no user can deregister the AMI, regardless of their IAM permissions; the protection must be turned off first. With the cooldown option (enable-image-deregistration-protection --with-cooldown), the AMI stays protected for 24 hours after the protection is turned off.
    fr: |
      Tant que la protection contre l'annulation de l'enregistrement est active, aucun utilisateur ne peut annuler l'enregistrement de l'AMI, quelles que soient ses autorisations IAM ; il faut d'abord désactiver la protection. Avec l'option de délai de grâce (enable-image-deregistration-protection --with-cooldown), l'AMI reste protégée pendant 24 heures après la désactivation.
  options:
    b:
      en: |
        The Recycle Bin can restore an AMI after it is deregistered, but it does not prevent the deregistration.
      fr: |
        La Corbeille peut restaurer une AMI après l'annulation de son enregistrement, mais elle n'empêche pas cette annulation.
    c:
      en: |
        Administrators with IAM permissions can remove or bypass this policy, so the protection depends on IAM permissions, which the requirement excludes.
      fr: |
        Des administrateurs disposant d'autorisations IAM peuvent supprimer ou contourner cette politique : la protection dépend donc des autorisations IAM, ce que l'exigence exclut.
    d:
      en: |
        Deprecation only hides the AMI from listings for other users; the owner can still deregister it.
      fr: |
        L'obsolescence masque seulement l'AMI des listes des autres utilisateurs ; le propriétaire peut toujours en annuler l'enregistrement.
references:
  - title: Protect an Amazon EC2 AMI from deregistration
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-deregistration-protection.html
