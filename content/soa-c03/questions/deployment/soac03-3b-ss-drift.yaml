id: soac03-3b-ss-drift
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A security team deploys a baseline of Amazon CloudWatch alarms to 30 accounts with an AWS CloudFormation StackSet. The team suspects that some engineers changed alarm thresholds in the console. The team must find which stack instances and which resources differ from the StackSet template.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe de sécurité déploie un socle d'alarmes Amazon CloudWatch dans 30 comptes avec un StackSet AWS CloudFormation. L'équipe soupçonne que certains ingénieurs ont modifié des seuils d'alarme dans la console. L'équipe doit trouver quelles instances de pile et quelles ressources diffèrent du modèle du StackSet.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Run detect-stack-set-drift on the StackSet, and then review the drifted resources of each stack instance.", fr: "Exécuter detect-stack-set-drift sur le StackSet, puis examiner les ressources dérivées de chaque instance de pile." } }
    - { id: b, text: { en: "Sign in to each account and run detect-stack-drift on the stack that the StackSet created.", fr: "Se connecter à chaque compte et exécuter detect-stack-drift sur la pile créée par le StackSet." } }
    - { id: c, text: { en: "Deploy an AWS Config rule that checks stack drift in each account, and review its results per account.", fr: "Déployer dans chaque compte une règle AWS Config qui vérifie la dérive des piles, et examiner ses résultats compte par compte." } }
    - { id: d, text: { en: "Run update-stack-set with the current template, and then compare the stack events before and after.", fr: "Exécuter update-stack-set avec le modèle actuel, puis comparer les événements de pile avant et après." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Drift detection on a StackSet checks every stack instance in one operation. A stack instance is DRIFTED when one of its resources differs from the template and parameters, and the per-instance resource drift results show which alarms were modified or deleted."
    fr: "La détection de dérive sur un StackSet vérifie toutes les instances de pile en une seule opération. Une instance de pile est DRIFTED lorsqu'une de ses ressources diffère du modèle et des paramètres, et les résultats de dérive par instance indiquent quelles alarmes ont été modifiées ou supprimées."
  options:
    b:
      en: "This gives the same information but needs 30 separate sessions and operations instead of one StackSet operation."
      fr: "Cela donne la même information mais demande 30 sessions et opérations séparées au lieu d'une seule opération StackSet."
    c:
      en: "A Config rule could flag drifted stacks, but deploying it and reviewing results in every account adds more work."
      fr: "Une règle Config pourrait signaler les piles dérivées, mais la déployer et examiner les résultats dans chaque compte demande plus de travail."
    d:
      en: "An update tries to apply the template again; it does not report which resources had drifted, and it may overwrite the evidence."
      fr: "Une mise à jour tente d'appliquer de nouveau le modèle ; elle n'indique pas quelles ressources avaient dérivé et peut effacer les preuves."
references:
  - title: Performing drift detection on CloudFormation StackSets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-drift.html
