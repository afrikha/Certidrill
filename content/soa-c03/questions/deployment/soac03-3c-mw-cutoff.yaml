id: soac03-3c-mw-cutoff
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Systems Manager maintenance window runs patching tasks every Saturday from 01:00 with a duration of 4 hours. Tasks that start during the last hour of the window often do not finish before 05:00, when business traffic returns. No new task can start during the last hour, but the window must keep its 4-hour duration.

    Which setting will meet these requirements?
  fr: |
    Une fenêtre de maintenance AWS Systems Manager exécute des tâches d'application de correctifs chaque samedi à partir de 01 h 00, avec une durée de 4 heures. Les tâches qui démarrent pendant la dernière heure de la fenêtre ne se terminent souvent pas avant 05 h 00, heure à laquelle le trafic métier reprend. Aucune nouvelle tâche ne doit démarrer pendant la dernière heure, mais la fenêtre doit conserver sa durée de 4 heures.

    Quel paramètre répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the duration of the maintenance window to 3 hours.", fr: "Définir la durée de la fenêtre de maintenance sur 3 heures." } }
    - { id: b, text: { en: "Set the schedule offset of the maintenance window to 1.", fr: "Définir le décalage de planification de la fenêtre de maintenance sur 1." } }
    - { id: c, text: { en: "Set the max errors value of each task to 1.", fr: "Définir la valeur max errors de chaque tâche sur 1." } }
    - { id: d, text: { en: "Set the cutoff of the maintenance window to 1 hour.", fr: "Définir le délai d'arrêt (cutoff) de la fenêtre de maintenance sur 1 heure." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The duration is how long the window can run, and the cutoff is the number of hours before the end of the window when Systems Manager stops starting new tasks. A duration of 4 and a cutoff of 1 keep the 4-hour window but prevent new tasks from starting after 04:00."
    fr: "La durée correspond au temps pendant lequel la fenêtre peut s'exécuter, et le délai d'arrêt (cutoff) au nombre d'heures avant la fin de la fenêtre à partir duquel Systems Manager ne démarre plus de nouvelles tâches. Une durée de 4 et un délai d'arrêt de 1 conservent la fenêtre de 4 heures tout en empêchant le démarrage de nouvelles tâches après 04 h 00."
  options:
    a:
      en: "Reducing the duration changes the window to 3 hours, which the requirement forbids."
      fr: "Réduire la durée ramène la fenêtre à 3 heures, ce que l'exigence interdit."
    b:
      en: "A schedule offset is a number of days to wait after the date that a cron expression specifies; it does not control task starts within the window."
      fr: "Un décalage de planification est un nombre de jours d'attente après la date indiquée par une expression cron ; il ne contrôle pas le démarrage des tâches dans la fenêtre."
    c:
      en: "The error threshold stops a task after failures; it does not stop tasks from starting late in the window."
      fr: "Le seuil d'erreurs arrête une tâche après des échecs ; il n'empêche pas les tâches de démarrer tard dans la fenêtre."
references:
  - title: Maintenance window scheduling and active period options
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/maintenance-windows-schedule-options.html
