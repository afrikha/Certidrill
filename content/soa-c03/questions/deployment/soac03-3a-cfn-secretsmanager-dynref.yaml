id: soac03-3a-cfn-secretsmanager-dynref
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CloudFormation template creates an Amazon RDS for PostgreSQL DB instance. The master password is already stored in an existing AWS Secrets Manager secret named prod/db, under the JSON key password, and other applications use the same secret. The password must not appear in the template, and engineers must not type it when they create or update the stack.

    Which solution will meet these requirements?
  fr: |
    Un modèle AWS CloudFormation crée une instance de base de données Amazon RDS for PostgreSQL. Le mot de passe principal est déjà stocké dans un secret AWS Secrets Manager existant nommé prod/db, sous la clé JSON password, et d'autres applications utilisent le même secret. Le mot de passe ne doit pas apparaître dans le modèle, et les ingénieurs ne doivent pas le saisir lorsqu'ils créent ou mettent à jour la pile.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set MasterUserPassword to the dynamic reference `{{resolve:secretsmanager:prod/db:SecretString:password}}`.", fr: "Définir MasterUserPassword sur la référence dynamique `{{resolve:secretsmanager:prod/db:SecretString:password}}`." } }
    - { id: b, text: { en: "Copy the password to a SecureString parameter, and reference it with a template parameter of type AWS::SSM::Parameter::Value<String>.", fr: "Copier le mot de passe dans un paramètre SecureString, et le référencer avec un paramètre de modèle de type AWS::SSM::Parameter::Value<String>." } }
    - { id: c, text: { en: "Add a template parameter with NoEcho set to true, and have engineers enter the password at each stack operation.", fr: "Ajouter un paramètre de modèle avec NoEcho défini sur true, et faire saisir le mot de passe aux ingénieurs à chaque opération de pile." } }
    - { id: d, text: { en: "Add a template parameter with NoEcho set to true, and set the password as the Default value of the parameter.", fr: "Ajouter un paramètre de modèle avec NoEcho défini sur true, et définir le mot de passe comme valeur Default du paramètre." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A secretsmanager dynamic reference makes CloudFormation retrieve the value from the secret when it creates or updates the resource, so the template contains only the secret name and the JSON key. The secret-id can be the secret name for a secret in the same account, and the json-key segment selects one value of the secret. The caller needs permission to call GetSecretValue on the secret.
    fr: |
      Une référence dynamique secretsmanager fait récupérer la valeur dans le secret par CloudFormation lorsqu'il crée ou met à jour la ressource : le modèle ne contient que le nom du secret et la clé JSON. Le secret-id peut être le nom du secret pour un secret du même compte, et le segment json-key sélectionne une valeur du secret. L'appelant doit être autorisé à appeler GetSecretValue sur le secret.
  options:
    b:
      en: |
        CloudFormation does not support template parameters of the SecureString Systems Manager parameter type; this also duplicates a secret that other applications already use.
      fr: |
        CloudFormation ne prend pas en charge les paramètres de modèle de type SecureString de Systems Manager ; de plus, cela duplique un secret que d'autres applications utilisent déjà.
    c:
      en: |
        NoEcho masks the value in stack descriptions, but the engineers still have to type the password at each stack operation.
      fr: |
        NoEcho masque la valeur dans les descriptions de pile, mais les ingénieurs doivent toujours saisir le mot de passe à chaque opération de pile.
    d:
      en: |
        A Default value is written in the template itself, so the password appears in the template even if NoEcho masks it in the console.
      fr: |
        Une valeur Default est écrite dans le modèle lui-même : le mot de passe apparaît dans le modèle même si NoEcho le masque dans la console.
references:
  - title: Get a secret or secret value from Secrets Manager
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-secretsmanager.html
  - title: Specify existing resources at runtime with CloudFormation-supplied parameter types
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-supplied-parameter-types.html
