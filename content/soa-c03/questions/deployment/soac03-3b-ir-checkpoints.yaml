id: soac03-3b-ir-checkpoints
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team uses an instance refresh to roll out a new launch template version to an Auto Scaling group. The refresh must replace 20% of the instances first and then wait 30 minutes so that the team can check application metrics. After the wait, the refresh must replace the remaining instances without another pause.

    Which instance refresh preferences will meet these requirements?
  fr: |
    Une équipe d'exploitation utilise une actualisation d'instance pour déployer une nouvelle version de modèle de lancement dans un Auto Scaling group. L'actualisation doit d'abord remplacer 20 % des instances, puis attendre 30 minutes pour que l'équipe vérifie les métriques de l'application. Après l'attente, l'actualisation doit remplacer les instances restantes sans nouvelle pause.

    Quelles préférences d'actualisation d'instance répondent à ces exigences ?
body:
  options:
    - { id: a, text: { en: "CheckpointPercentages set to [20, 100] and CheckpointDelay set to 1800", fr: "CheckpointPercentages défini à [20, 100] et CheckpointDelay défini à 1800" } }
    - { id: b, text: { en: "CheckpointPercentages set to [20] and CheckpointDelay set to 1800", fr: "CheckpointPercentages défini à [20] et CheckpointDelay défini à 1800" } }
    - { id: c, text: { en: "CheckpointPercentages set to [20, 100] and CheckpointDelay set to 30", fr: "CheckpointPercentages défini à [20, 100] et CheckpointDelay défini à 30" } }
    - { id: d, text: { en: "MinHealthyPercentage set to 80 and BakeTime set to 1800", fr: "MinHealthyPercentage défini à 80 et BakeTime défini à 1800" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Checkpoints are cumulative percentages of the group, and the last one must be 100 for the refresh to replace every instance. CheckpointDelay is in seconds, so 1800 pauses for 30 minutes after the 20% checkpoint; no wait applies at the final 100% checkpoint."
    fr: "Les points de contrôle sont des pourcentages cumulés du groupe, et le dernier doit être 100 pour que l'actualisation remplace toutes les instances. CheckpointDelay s'exprime en secondes : 1800 marque une pause de 30 minutes après le point de contrôle de 20 % ; aucune attente ne s'applique au point de contrôle final de 100 %."
  options:
    b:
      en: "A final checkpoint below 100 stops the refresh at that point; it does not continue to 100% on its own."
      fr: "Un dernier point de contrôle inférieur à 100 arrête l'actualisation à ce stade ; elle ne continue pas seule jusqu'à 100 %."
    c:
      en: "CheckpointDelay is expressed in seconds, so 30 gives a 30-second pause."
      fr: "CheckpointDelay s'exprime en secondes : 30 donne une pause de 30 secondes."
    d:
      en: "Bake time waits at the end of the refresh, after all instances are replaced, not after the first 20%."
      fr: "Le temps de stabilisation (bake time) s'applique à la fin de l'actualisation, après le remplacement de toutes les instances, pas après les premiers 20 %."
references:
  - title: Add checkpoints to an instance refresh
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-adding-checkpoints-instance-refresh.html
  - title: Understand the default values for an instance refresh
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/understand-instance-refresh-default-values.html
