id: soac03-3a-cdk-revert-hotswap-drift
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer ran cdk deploy --hotswap against a shared test stack to iterate quickly on AWS Lambda function code. The function code was updated directly through the service APIs, and CloudFormation drift detection now reports the function as drifted. The team wants the next deployment from the CI pipeline to bring the stack back in line with the CDK app, including the drift that hotswapping introduced.

    Which command should the pipeline run?
  fr: |
    Un développeur a exécuté cdk deploy --hotswap sur une pile de test partagée pour itérer rapidement sur le code d'une fonction AWS Lambda. Le code de la fonction a été mis à jour directement via les API du service, et la détection de dérive de CloudFormation signale maintenant la fonction comme dérivée. L'équipe souhaite que le prochain déploiement du pipeline CI réaligne la pile sur l'application CDK, y compris la dérive introduite par le hotswap.

    Quelle commande le pipeline doit-il exécuter ?
body:
  options:
    - { id: a, text: { en: "cdk deploy --hotswap-fallback", fr: "cdk deploy --hotswap-fallback" } }
    - { id: b, text: { en: "cdk diff --fail", fr: "cdk diff --fail" } }
    - { id: c, text: { en: "cdk deploy --no-rollback", fr: "cdk deploy --no-rollback" } }
    - { id: d, text: { en: "cdk deploy --revert-drift", fr: "cdk deploy --revert-drift" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Hotswap deployments deliberately introduce drift in CloudFormation stacks, which is why AWS recommends them for development only. After hotswap deployments, cdk deploy --revert-drift deploys with a drift-aware change set that reconciles the drift with the CDK app.
    fr: |
      Les déploiements hotswap introduisent délibérément une dérive dans les piles CloudFormation, c'est pourquoi AWS les réserve au développement. Après des déploiements hotswap, cdk deploy --revert-drift déploie avec un jeu de modifications tenant compte de la dérive, qui réconcilie la dérive avec l'application CDK.
  options:
    a:
      en: |
        --hotswap-fallback still hotswaps the changes it can and falls back to CloudFormation only for unsupported changes; it does not reconcile existing drift.
      fr: |
        --hotswap-fallback applique toujours en hotswap les modifications possibles et ne revient à CloudFormation que pour les modifications non prises en charge ; il ne réconcilie pas la dérive existante.
    b:
      en: |
        cdk diff compares the app with the deployed template and changes nothing.
      fr: |
        cdk diff compare l'application au modèle déployé et ne modifie rien.
    c:
      en: |
        --no-rollback only keeps partial changes in place if the deployment fails; it does not address drift.
      fr: |
        --no-rollback conserve seulement les modifications partielles si le déploiement échoue ; il ne traite pas la dérive.
references:
  - title: cdk deploy
    url: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-deploy.html
