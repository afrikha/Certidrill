id: soac03-3a-cfn-iac-generator
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team created about 150 resources by hand in the AWS Management Console in one Region, including a VPC, security groups, Amazon EC2 instances and Amazon DynamoDB tables. The company now wants to manage these existing resources with AWS CloudFormation without recreating them. The team does not want to write the properties of each resource by hand.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Une équipe a créé à la main environ 150 ressources dans la AWS Management Console d'une Région, dont un VPC, des groupes de sécurité, des instances Amazon EC2 et des tables Amazon DynamoDB. L'entreprise souhaite maintenant gérer ces ressources existantes avec AWS CloudFormation sans les recréer. L'équipe ne souhaite pas écrire à la main les propriétés de chaque ressource.

    Quelle solution permet de répondre à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Write a template that describes every resource, and then create an import change set with the identifiers of the resources.", fr: "Écrire un modèle qui décrit chaque ressource, puis créer un jeu de modifications d'importation avec les identifiants des ressources." } }
    - { id: b, text: { en: "Use the CloudFormation IaC generator to scan the account, generate a template from the resources, and import them into a stack.", fr: "Utiliser le générateur IaC de CloudFormation pour analyser le compte, générer un modèle à partir des ressources et les importer dans une pile." } }
    - { id: c, text: { en: "Create an empty stack, and run drift detection on it so that CloudFormation discovers the resources and adds them to the stack.", fr: "Créer une pile vide, et y exécuter la détection de dérive pour que CloudFormation découvre les ressources et les ajoute à la pile." } }
    - { id: d, text: { en: "Export the resource configurations with AWS Config advanced queries, and create a stack from the exported JSON file.", fr: "Exporter les configurations des ressources avec les requêtes avancées d'AWS Config, et créer une pile à partir du fichier JSON exporté." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The IaC generator scans the resources of a Region that CloudFormation does not manage yet, generates a template from the selected resources without describing each property by hand, and lets the team import the resources into a stack. A generated template can contain up to 500 resources, so 150 resources fit.
    fr: |
      Le générateur IaC analyse les ressources d'une Région que CloudFormation ne gère pas encore, génère un modèle à partir des ressources sélectionnées sans décrire chaque propriété à la main, et permet à l'équipe d'importer les ressources dans une pile. Un modèle généré peut contenir jusqu'à 500 ressources : 150 ressources tiennent dans un seul modèle.
  options:
    a:
      en: |
        A manual import works, but the team must describe every resource and its properties in the template, which is the effort it wants to avoid.
      fr: |
        Une importation manuelle fonctionne, mais l'équipe doit décrire chaque ressource et ses propriétés dans le modèle, ce qui est l'effort à éviter.
    c:
      en: |
        Drift detection compares the resources that a stack already manages with its template; it does not discover or add other resources.
      fr: |
        La détection de dérive compare les ressources déjà gérées par une pile avec son modèle ; elle ne découvre ni n'ajoute d'autres ressources.
    d:
      en: |
        AWS Config configuration items are not CloudFormation templates, and creating a stack from them would create new resources instead of importing the existing ones.
      fr: |
        Les éléments de configuration d'AWS Config ne sont pas des modèles CloudFormation, et créer une pile à partir d'eux créerait de nouvelles ressources au lieu d'importer les ressources existantes.
references:
  - title: Generate templates from existing resources with IaC generator
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/generate-IaC.html
