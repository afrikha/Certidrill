id: soac03-3b-ss-delete-retain
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is replacing an AWS CloudFormation StackSet with another tool. The StackSet has stack instances in 15 accounts and 2 Regions that run production Amazon DynamoDB tables. The StackSet must be deleted, but the tables in every account must keep running without any data loss.

    Which solution will meet these requirements?
  fr: |
    Une entreprise remplace un StackSet AWS CloudFormation par un autre outil. Le StackSet a des instances de pile dans 15 comptes et 2 Régions qui exécutent des tables Amazon DynamoDB de production. Le StackSet doit être supprimé, mais les tables de chaque compte doivent continuer à fonctionner sans aucune perte de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run delete-stack-instances with --retain-stacks for all accounts and Regions, and then run delete-stack-set.", fr: "Exécuter delete-stack-instances avec --retain-stacks pour tous les comptes et toutes les Régions, puis exécuter delete-stack-set." } }
    - { id: b, text: { en: "Run delete-stack-set directly, because deleting a StackSet keeps its stack instances by default.", fr: "Exécuter directement delete-stack-set, car la suppression d'un StackSet conserve ses instances de pile par défaut." } }
    - { id: c, text: { en: "Run delete-stack-instances with --no-retain-stacks, and then restore each table from a backup.", fr: "Exécuter delete-stack-instances avec --no-retain-stacks, puis restaurer chaque table à partir d'une sauvegarde." } }
    - { id: d, text: { en: "Turn on termination protection for the StackSet, and then run delete-stack-set.", fr: "Activer la protection contre la résiliation pour le StackSet, puis exécuter delete-stack-set." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A StackSet can be deleted only after all of its stack instances are removed. Removing them with the retain stacks option detaches the stacks from the StackSet and keeps their resources in their current state, after which delete-stack-set succeeds."
    fr: "Un StackSet ne peut être supprimé qu'après le retrait de toutes ses instances de pile. Les retirer avec l'option de conservation des piles les détache du StackSet et conserve leurs ressources dans leur état actuel ; delete-stack-set réussit ensuite."
  options:
    b:
      en: "delete-stack-set fails while the StackSet still contains stack instances."
      fr: "delete-stack-set échoue tant que le StackSet contient encore des instances de pile."
    c:
      en: "--no-retain-stacks deletes the stacks and their tables, which causes downtime and possible data loss."
      fr: "--no-retain-stacks supprime les piles et leurs tables, ce qui entraîne une interruption et une possible perte de données."
    d:
      en: "Termination protection prevents deletion; it does not keep resources when the StackSet is removed."
      fr: "La protection contre la résiliation empêche la suppression ; elle ne conserve pas les ressources lors du retrait du StackSet."
references:
  - title: Delete stacks from CloudFormation StackSets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stackinstances-delete.html
  - title: Delete CloudFormation StackSets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-delete.html
