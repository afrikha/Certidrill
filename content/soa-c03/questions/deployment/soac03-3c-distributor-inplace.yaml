id: soac03-3c-distributor-inplace
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security team provides a monitoring agent for Linux and Windows as .zip files that contain install, uninstall, and update scripts. The agent must be installed on all AWS Systems Manager managed nodes, including nodes launched later, and must move automatically to each new version that the team publishes. The agent must keep running while it is upgraded.

    Which solution will meet these requirements?
  fr: |
    Une équipe de sécurité fournit un agent de surveillance pour Linux et Windows sous forme de fichiers .zip qui contiennent des scripts d'installation, de désinstallation et de mise à jour. L'agent doit être installé sur tous les nœuds gérés AWS Systems Manager, y compris les nœuds lancés plus tard, et doit passer automatiquement à chaque nouvelle version publiée par l'équipe. L'agent doit continuer à fonctionner pendant sa mise à niveau.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the .zip files in Amazon S3, and use Run Command to download and run the install script on all managed nodes each time a version is published.", fr: "Stocker les fichiers .zip dans Amazon S3, et utiliser Run Command pour télécharger et exécuter le script d'installation sur tous les nœuds gérés à chaque publication d'une version." } }
    - { id: b, text: { en: "Create a Distributor package, and create a State Manager association that installs the package with the uninstall and reinstall installation type.", fr: "Créer un package Distributor, et créer une association State Manager qui installe le package avec le type d'installation désinstallation et réinstallation." } }
    - { id: c, text: { en: "Create a Distributor package, and create a State Manager association that installs the package with the in-place update installation type.", fr: "Créer un package Distributor, et créer une association State Manager qui installe le package avec le type d'installation mise à jour sur place." } }
    - { id: d, text: { en: "Add the agent to an EC2 Image Builder component, and rebuild the AMIs of the managed nodes each time the team publishes a new version.", fr: "Ajouter l'agent à un composant EC2 Image Builder, et reconstruire les AMI des nœuds gérés chaque fois que l'équipe publie une nouvelle version." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Distributor packages software as .zip files with install, uninstall, and optional update scripts, and a State Manager association installs the package on a schedule, on nodes when they first launch, and when the default package version changes. The in-place update installation type runs the update script, so the package stays available during the upgrade."
    fr: "Distributor empaquette des logiciels sous forme de fichiers .zip avec des scripts d'installation, de désinstallation et, en option, de mise à jour, et une association State Manager installe le package selon une planification, sur les nœuds à leur premier lancement et quand la version par défaut du package change. Le type d'installation mise à jour sur place exécute le script de mise à jour : le package reste disponible pendant la mise à niveau."
  options:
    a:
      en: "Manual Run Command runs must be repeated for each version and do not cover nodes launched later."
      fr: "Des exécutions manuelles de Run Command doivent être répétées pour chaque version et ne couvrent pas les nœuds lancés plus tard."
    b:
      en: "Uninstall and reinstall removes the current version first, so the agent is unavailable during the upgrade."
      fr: "La désinstallation et réinstallation supprime d'abord la version actuelle : l'agent est indisponible pendant la mise à niveau."
    d:
      en: "A new AMI changes only instances launched from it; running nodes keep the old version until they are replaced."
      fr: "Une nouvelle AMI ne modifie que les instances lancées à partir d'elle ; les nœuds en cours d'exécution gardent l'ancienne version jusqu'à leur remplacement."
references:
  - title: AWS Systems Manager Distributor
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/distributor.html
