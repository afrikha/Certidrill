id: soac03-3c-param-policies
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores a partner API token as a SecureString parameter in Parameter Store, in the standard tier. The token is valid until a fixed date. Parameter Store must delete the parameter automatically on that date, and the operations team must receive an email 7 days before the deletion.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise stocke le jeton d'API d'un partenaire dans un paramètre SecureString de Parameter Store, au niveau standard. Le jeton est valide jusqu'à une date fixe. Parameter Store doit supprimer automatiquement le paramètre à cette date, et l'équipe d'exploitation doit recevoir un e-mail 7 jours avant la suppression.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach Expiration and ExpirationNotification policies to the parameter, and keep it in the standard tier.", fr: "Attacher des politiques Expiration et ExpirationNotification au paramètre, et le conserver au niveau standard." } }
    - { id: b, text: { en: "Move the token to AWS Secrets Manager, and set a rotation schedule that ends on the expiration date.", fr: "Déplacer le jeton vers AWS Secrets Manager, et définir une planification de rotation qui se termine à la date d'expiration." } }
    - { id: c, text: { en: "Change the parameter to the advanced tier, and attach Expiration and ExpirationNotification policies to it.", fr: "Faire passer le paramètre au niveau avancé, et lui attacher des politiques Expiration et ExpirationNotification." } }
    - { id: d, text: { en: "Attach a NoChangeNotification policy to the parameter with After set to 7 and Unit set to Days.", fr: "Attacher au paramètre une politique NoChangeNotification avec After défini sur 7 et Unit défini sur Days." } }
    - { id: e, text: { en: "Create an EventBridge rule that matches the parameter policy notification and targets an SNS topic with an email subscription.", fr: "Créer une règle EventBridge qui correspond à la notification de politique de paramètre et cible une rubrique SNS avec un abonnement par e-mail." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Parameter policies are available only for advanced-tier parameters. An Expiration policy deletes the parameter at the given timestamp, and an ExpirationNotification policy with Before set to 7 days sends a notification before that time. Parameter Store delivers these notifications as Amazon EventBridge events, so a rule must route them to an SNS topic that emails the team."
    fr: "Les politiques de paramètre ne sont disponibles que pour les paramètres de niveau avancé. Une politique Expiration supprime le paramètre à l'horodatage indiqué, et une politique ExpirationNotification avec Before défini sur 7 jours envoie une notification avant cette date. Parameter Store remet ces notifications sous forme d'événements Amazon EventBridge : une règle doit donc les acheminer vers une rubrique SNS qui envoie un e-mail à l'équipe."
  options:
    a:
      en: "Standard-tier parameters do not support parameter policies."
      fr: "Les paramètres de niveau standard ne prennent pas en charge les politiques de paramètre."
    b:
      en: "Rotation replaces the secret value; it does not delete the secret on a date or send a warning 7 days before."
      fr: "La rotation remplace la valeur du secret ; elle ne supprime pas le secret à une date donnée et n'envoie pas d'avertissement 7 jours avant."
    d:
      en: "NoChangeNotification warns when a parameter has not been modified for a period; it neither deletes the parameter nor relates to its expiration."
      fr: "NoChangeNotification avertit quand un paramètre n'a pas été modifié pendant une période ; elle ne supprime pas le paramètre et n'est pas liée à son expiration."
references:
  - title: Assigning parameter policies in Parameter Store
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-policies.html
