id: soac03-3c-change-calendar-freeze
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs several AWS Systems Manager Automation runbooks on schedules to resize and restart Amazon EC2 instances. During a yearly change freeze from December 15 to January 5, these runbooks must not make any change. The same rule must apply every year with the least manual work.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute selon des planifications plusieurs runbooks AWS Systems Manager Automation qui redimensionnent et redémarrent des instances Amazon EC2. Pendant un gel annuel des modifications du 15 décembre au 5 janvier, ces runbooks ne doivent effectuer aucune modification. La même règle doit s'appliquer chaque année avec le moins de travail manuel possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Disable the schedules of the runbooks on December 15, and enable them again on January 5 every year.", fr: "Désactiver les planifications des runbooks le 15 décembre, et les réactiver le 5 janvier chaque année." } }
    - { id: b, text: { en: "Set ApplyOnlyAtCronInterval on the State Manager associations that run the runbooks on their schedules.", fr: "Définir ApplyOnlyAtCronInterval sur les associations State Manager qui exécutent les runbooks selon leurs planifications." } }
    - { id: c, text: { en: "Add an aws:sleep step at the start of each runbook with a duration that covers the whole freeze period.", fr: "Ajouter au début de chaque runbook une étape aws:sleep dont la durée couvre toute la période de gel." } }
    - { id: d, text: { en: "Create a Change Calendar that is open by default with a recurring event for the freeze, and make the runbooks check the calendar state.", fr: "Créer un Change Calendar ouvert par défaut avec un événement récurrent pour le gel, et faire vérifier l'état du calendrier par les runbooks." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Change Calendar defines events during which actions such as Automation runbooks can or cannot run. A calendar of type DEFAULT_OPEN is CLOSED during its events, so a recurring freeze event blocks changes every year. The runbooks check the state through a Change Calendar dependency or the GetCalendarState API and stop when the calendar is CLOSED."
    fr: "Change Calendar définit des événements pendant lesquels des actions comme les runbooks Automation peuvent ou non s'exécuter. Un calendrier de type DEFAULT_OPEN est à l'état CLOSED pendant ses événements : un événement de gel récurrent bloque donc les modifications chaque année. Les runbooks vérifient l'état par une dépendance Change Calendar ou par l'API GetCalendarState et s'arrêtent quand le calendrier est CLOSED."
  options:
    a:
      en: "This works only if someone remembers to do it twice every year, which is the manual work the company wants to avoid."
      fr: "Cela ne fonctionne que si quelqu'un pense à le faire deux fois par an, ce qui est le travail manuel que l'entreprise veut éviter."
    b:
      en: "ApplyOnlyAtCronInterval only skips the immediate run at creation and on new targets; the runbooks still run on their schedules during the freeze."
      fr: "ApplyOnlyAtCronInterval évite seulement l'exécution immédiate à la création et sur les nouvelles cibles ; les runbooks s'exécutent toujours selon leurs planifications pendant le gel."
    c:
      en: "A sleep step delays every run, all year, and the changes still happen when the wait ends."
      fr: "Une étape d'attente retarde chaque exécution, toute l'année, et les modifications ont quand même lieu à la fin de l'attente."
references:
  - title: AWS Systems Manager Change Calendar
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-change-calendar.html
