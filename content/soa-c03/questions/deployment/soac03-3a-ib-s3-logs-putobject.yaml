id: soac03-3a-ib-s3-logs-putobject
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An EC2 Image Builder infrastructure configuration specifies an S3 bucket and a key prefix for logs. Builds succeed, but no log file appears in the bucket, and the logs on the build instance show an AccessDenied error when the upload to Amazon S3 is attempted. The bucket uses SSE-S3 encryption and has no bucket policy. Engineers need the AWSTOE logs in Amazon S3 to troubleshoot future builds.

    Which solution will meet this requirement?
  fr: |
    Une configuration d'infrastructure EC2 Image Builder spécifie un compartiment S3 et un préfixe de clé pour les journaux. Les créations réussissent, mais aucun fichier journal n'apparaît dans le compartiment, et les journaux de l'instance de création montrent une erreur AccessDenied lors de la tentative de chargement vers Amazon S3. Le compartiment utilise le chiffrement SSE-S3 et n'a pas de politique de compartiment. Les ingénieurs ont besoin des journaux AWSTOE dans Amazon S3 pour dépanner les prochaines créations.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Allow s3:PutObject on arn:aws:s3:::bucket-name/* in the role of the build instances' instance profile.", fr: "Autoriser s3:PutObject sur arn:aws:s3:::bucket-name/* dans le rôle du profil d'instance des instances de création." } }
    - { id: b, text: { en: "Add a bucket policy that allows the imagebuilder.amazonaws.com service principal to call s3:PutObject on the bucket.", fr: "Ajouter une politique de compartiment qui autorise le principal de service imagebuilder.amazonaws.com à appeler s3:PutObject sur le compartiment." } }
    - { id: c, text: { en: "Add s3:PutObject on the bucket to the permissions of the Image Builder service-linked role.", fr: "Ajouter s3:PutObject sur le compartiment aux autorisations du rôle lié à un service d'Image Builder." } }
    - { id: d, text: { en: "Enable S3 server access logging on the bucket, with the key prefix that Image Builder uses as the target prefix.", fr: "Activer la journalisation des accès au serveur S3 sur le compartiment, avec le préfixe de clé utilisé par Image Builder comme préfixe cible." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The AWSTOE logs are uploaded from the build instance with the credentials of its instance profile. Image Builder documents that the instance profile must have s3:PutObject on the target bucket objects; without S3 logging permissions, the logs stay only on the build and test instances.
    fr: |
      Les journaux AWSTOE sont chargés depuis l'instance de création avec les informations d'identification de son profil d'instance. La documentation d'Image Builder indique que le profil d'instance doit disposer de s3:PutObject sur les objets du compartiment cible ; sans cette autorisation, les journaux restent uniquement sur les instances de création et de test.
  options:
    b:
      en: |
        The upload is not made by the Image Builder service principal but by the build instance's role, so this bucket policy does not fix the AccessDenied error.
      fr: |
        Le chargement n'est pas effectué par le principal de service Image Builder mais par le rôle de l'instance de création : cette politique de compartiment ne corrige pas l'erreur AccessDenied.
    c:
      en: |
        The service-linked role is not used by the instance to upload logs, and the permissions of a service-linked role cannot be edited.
      fr: |
        Le rôle lié à un service n'est pas utilisé par l'instance pour charger les journaux, et les autorisations d'un rôle lié à un service ne peuvent pas être modifiées.
    d:
      en: |
        Server access logging records the requests made to the bucket; it does not deliver the AWSTOE application logs.
      fr: |
        La journalisation des accès au serveur enregistre les requêtes adressées au compartiment ; elle ne livre pas les journaux applicatifs AWSTOE.
references:
  - title: Manage Image Builder infrastructure configuration
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-infra-config.html
  - title: Troubleshoot Image Builder issues
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/troubleshooting.html
