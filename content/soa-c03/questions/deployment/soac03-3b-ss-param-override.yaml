id: soac03-3b-ss-param-override
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CloudFormation StackSet with self-managed permissions deploys a monitoring stack to 25 accounts. The template has an InstanceType parameter with the StackSet value t3.small. One account in eu-west-1 needs m6i.large for this stack. All other stack instances must keep t3.small, and the template must not change.

    Which solution will meet these requirements?
  fr: |
    Un StackSet AWS CloudFormation avec des autorisations autogérées déploie une pile de surveillance dans 25 comptes. Le modèle a un paramètre InstanceType dont la valeur du StackSet est t3.small. Un compte dans eu-west-1 a besoin de m6i.large pour cette pile. Toutes les autres instances de pile doivent garder t3.small, et le modèle ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run update-stack-set with the new InstanceType value and the account ID in the --accounts option.", fr: "Exécuter update-stack-set avec la nouvelle valeur d'InstanceType et l'ID du compte dans l'option --accounts." } }
    - { id: b, text: { en: "Update the parameter value directly on the stack in the account by using update-stack.", fr: "Mettre à jour la valeur du paramètre directement sur la pile du compte à l'aide d'update-stack." } }
    - { id: c, text: { en: "Create a second StackSet with the m6i.large value and add the account to it.", fr: "Créer un second StackSet avec la valeur m6i.large et y ajouter le compte." } }
    - { id: d, text: { en: "Run update-stack-instances with --parameter-overrides for that account and the eu-west-1 Region.", fr: "Exécuter update-stack-instances avec --parameter-overrides pour ce compte et la Région eu-west-1." } }
answer: { optionId: d }
explanation:
  correct:
    en: "update-stack-instances with --parameter-overrides changes a parameter value only for the listed accounts and Regions. The override is kept during later StackSet updates, while the other stack instances keep the StackSet value."
    fr: "update-stack-instances avec --parameter-overrides change la valeur d'un paramètre uniquement pour les comptes et les Régions indiqués. La substitution est conservée lors des mises à jour ultérieures du StackSet, tandis que les autres instances de pile gardent la valeur du StackSet."
  options:
    a:
      en: "update-stack-set changes the StackSet's own parameter value, so the other stack instances would receive m6i.large at a later StackSet update."
      fr: "update-stack-set change la valeur de paramètre du StackSet lui-même : les autres instances de pile recevraient m6i.large lors d'une mise à jour ultérieure du StackSet."
    b:
      en: "A direct stack update bypasses the StackSet, which keeps managing the parameter values of its stack instances; the supported way is a parameter override."
      fr: "Une mise à jour directe de la pile contourne le StackSet, qui continue de gérer les valeurs de paramètres de ses instances de pile ; la méthode prise en charge est la substitution de paramètre."
    c:
      en: "A second StackSet adds a template copy to maintain, and the account would still have the first StackSet's stack."
      fr: "Un second StackSet ajoute une copie du modèle à maintenir, et le compte aurait toujours la pile du premier StackSet."
references:
  - title: Override parameter values on stacks within your CloudFormation StackSet
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stackinstances-override.html
