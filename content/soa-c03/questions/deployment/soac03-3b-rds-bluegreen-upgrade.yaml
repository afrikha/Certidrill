id: soac03-3b-rds-bluegreen-upgrade
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a production Amazon RDS for PostgreSQL DB instance on version 15 and must upgrade it to version 16. The team wants to test the new version on a copy that stays synchronized with production data. When the team switches to the new version, downtime must be short, and the application must keep using the same database endpoint.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute en production une instance de base de données Amazon RDS for PostgreSQL en version 15 et doit la mettre à niveau vers la version 16. L'équipe veut tester la nouvelle version sur une copie qui reste synchronisée avec les données de production. Lorsque l'équipe passe à la nouvelle version, l'interruption doit être courte, et l'application doit continuer à utiliser le même point de terminaison de base de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Modify the DB instance to version 16 during the next maintenance window.", fr: "Modifier l'instance de base de données vers la version 16 pendant la prochaine fenêtre de maintenance." } }
    - { id: b, text: { en: "Create a read replica, upgrade the replica to version 16, and promote it after testing.", fr: "Créer un réplica en lecture, le mettre à niveau vers la version 16, et le promouvoir après les tests." } }
    - { id: c, text: { en: "Create an RDS blue/green deployment with version 16 for the green environment, test it, and then switch over.", fr: "Créer un déploiement bleu/vert RDS avec la version 16 pour l'environnement vert, le tester, puis effectuer le basculement." } }
    - { id: d, text: { en: "Restore the latest snapshot to a new version 16 DB instance, test it, and update the application connection string.", fr: "Restaurer le dernier instantané vers une nouvelle instance de base de données en version 16, la tester, et mettre à jour la chaîne de connexion de l'application." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An RDS blue/green deployment creates a green copy of the production environment that stays synchronized through replication and can run a newer major engine version. The switchover usually takes less than a minute, and the green instances take over the production names and endpoints, so the application needs no change."
    fr: "Un déploiement bleu/vert RDS crée une copie verte de l'environnement de production qui reste synchronisée par réplication et peut exécuter une version majeure de moteur plus récente. Le basculement prend généralement moins d'une minute, et les instances vertes reprennent les noms et les points de terminaison de production : l'application n'a besoin d'aucune modification."
  options:
    a:
      en: "An in-place major version upgrade gives no synchronized copy to test first and causes a longer outage."
      fr: "Une mise à niveau majeure sur place ne fournit pas de copie synchronisée à tester d'abord et provoque une interruption plus longue."
    b:
      en: "A promoted replica becomes a separate DB instance with its own endpoint, so the application must change its connection."
      fr: "Un réplica promu devient une instance de base de données distincte avec son propre point de terminaison : l'application doit changer sa connexion."
    d:
      en: "A restored snapshot is not kept in sync with production and has a different endpoint."
      fr: "Un instantané restauré n'est pas synchronisé avec la production et a un point de terminaison différent."
references:
  - title: Overview of Amazon RDS Blue/Green Deployments
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments-overview.html
