id: soac03-3a-ami-ssm-parameter-lt
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Auto Scaling group uses a launch template. Each time the image team publishes a new golden AMI, an operator must create a new launch template version with the new AMI ID. The company wants the image team to publish the AMI ID in a single place, and wants the Auto Scaling group to use the new AMI without any new launch template or launch template version.

    Which solution will meet these requirements?
  fr: |
    Un groupe Auto Scaling utilise un modèle de lancement. Chaque fois que l'équipe image publie une nouvelle AMI de référence, un opérateur doit créer une nouvelle version du modèle de lancement avec l'ID de la nouvelle AMI. L'entreprise souhaite que l'équipe image publie l'ID d'AMI à un seul endroit, et que le groupe Auto Scaling utilise la nouvelle AMI sans nouveau modèle de lancement ni nouvelle version de modèle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace the launch template with a launch configuration, and edit the AMI ID of the launch configuration in place for each new AMI.", fr: "Remplacer le modèle de lancement par une configuration de lancement, et modifier sur place l'ID d'AMI de la configuration de lancement pour chaque nouvelle AMI." } }
    - { id: b, text: { en: "Set the launch template version of the Auto Scaling group to $Latest so that the group always uses the newest AMI.", fr: "Définir la version du modèle de lancement du groupe Auto Scaling sur $Latest pour que le groupe utilise toujours l'AMI la plus récente." } }
    - { id: c, text: { en: "Configure the EC2 Image Builder distribution settings to replace the AMI ID in the existing launch template version.", fr: "Configurer les paramètres de distribution d'EC2 Image Builder pour remplacer l'ID d'AMI dans la version existante du modèle de lancement." } }
    - { id: d, text: { en: "Publish the AMI ID in a Systems Manager parameter, and set the AMI of the launch template to resolve:ssm:parameter-name.", fr: "Publier l'ID d'AMI dans un paramètre Systems Manager, et définir l'AMI du modèle de lancement sur resolve:ssm:parameter-name." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A launch template can reference a Systems Manager parameter instead of an AMI ID, and Amazon EC2 Auto Scaling resolves the parameter when the group is created or updated. The image team only updates the parameter value, so no new launch template or version is needed; the aws:ec2:image data type validates that the value is an AMI ID.
    fr: |
      Un modèle de lancement peut référencer un paramètre Systems Manager au lieu d'un ID d'AMI, et Amazon EC2 Auto Scaling résout le paramètre lors de la création ou de la mise à jour du groupe. L'équipe image met seulement à jour la valeur du paramètre : aucun nouveau modèle ni nouvelle version n'est nécessaire ; le type de données aws:ec2:image vérifie que la valeur est un ID d'AMI.
  options:
    a:
      en: |
        Launch configurations cannot be modified after creation; each new AMI would still require a new launch configuration.
      fr: |
        Les configurations de lancement ne peuvent pas être modifiées après leur création ; chaque nouvelle AMI exigerait toujours une nouvelle configuration de lancement.
    b:
      en: |
        $Latest points to the newest launch template version, so someone must still create a new version for each AMI.
      fr: |
        $Latest désigne la version la plus récente du modèle de lancement : quelqu'un doit toujours créer une nouvelle version pour chaque AMI.
    c:
      en: |
        Image Builder does not edit an existing version: it creates a new launch template version with the new AMI ID.
      fr: |
        Image Builder ne modifie pas une version existante : il crée une nouvelle version du modèle de lancement avec l'ID de la nouvelle AMI.
references:
  - title: Use AWS Systems Manager parameters instead of AMI IDs in launch templates
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/using-systems-manager-parameters.html
