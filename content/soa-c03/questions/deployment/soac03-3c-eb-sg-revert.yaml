id: soac03-3c-eb-sg-revert
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's new AWS account has no AWS CloudTrail trail. The security team has written an AWS Lambda function that revokes security group ingress rules that open port 22 to 0.0.0.0/0. The function must run within minutes each time a user calls the AuthorizeSecurityGroupIngress API.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Le nouveau compte AWS d'une entreprise n'a aucun journal de suivi AWS CloudTrail. L'équipe de sécurité a écrit une fonction AWS Lambda qui révoque les règles entrantes de groupe de sécurité ouvrant le port 22 à 0.0.0.0/0. La fonction doit s'exécuter en quelques minutes chaque fois qu'un utilisateur appelle l'API AuthorizeSecurityGroupIngress.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a CloudTrail trail with logging enabled that records management events.", fr: "Créer un journal de suivi CloudTrail avec la journalisation activée qui enregistre les événements de gestion." } }
    - { id: b, text: { en: "Enable VPC Flow Logs on the VPC, and invoke the function from a metric filter on the flow log group.", fr: "Activer les journaux de flux VPC sur le VPC, et appeler la fonction depuis un filtre de métrique sur le groupe de journaux de flux." } }
    - { id: c, text: { en: "Create a rule on a custom event bus that matches the AuthorizeSecurityGroupIngress call and targets the function.", fr: "Créer sur un bus d'événements personnalisé une règle qui correspond à l'appel AuthorizeSecurityGroupIngress et cible la fonction." } }
    - { id: d, text: { en: "Create a rule on the default event bus that matches AWS API Call via CloudTrail events for AuthorizeSecurityGroupIngress and targets the function.", fr: "Créer sur le bus d'événements par défaut une règle qui correspond aux événements AWS API Call via CloudTrail pour AuthorizeSecurityGroupIngress et cible la fonction." } }
    - { id: e, text: { en: "Create a periodic AWS Config rule that runs every 24 hours and invokes the function for noncompliant security groups.", fr: "Créer une règle AWS Config périodique qui s'exécute toutes les 24 heures et appelle la fonction pour les groupes de sécurité non conformes." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "EventBridge receives events with the detail-type AWS API Call via CloudTrail only when a CloudTrail trail with logging is enabled. These events are delivered to the default event bus, so a rule there that matches source aws.ec2 and the eventName AuthorizeSecurityGroupIngress can invoke the function for every call. AuthorizeSecurityGroupIngress is a write management event, so a rule in the ENABLED state matches it."
    fr: "EventBridge ne reçoit les événements de type AWS API Call via CloudTrail que si un journal de suivi CloudTrail avec journalisation est activé. Ces événements sont remis au bus d'événements par défaut : une règle sur ce bus qui correspond à la source aws.ec2 et à l'eventName AuthorizeSecurityGroupIngress peut appeler la fonction à chaque appel. AuthorizeSecurityGroupIngress est un événement de gestion en écriture : une règle à l'état ENABLED y correspond."
  options:
    b:
      en: "Flow logs record network traffic, not API calls that change security group rules."
      fr: "Les journaux de flux enregistrent le trafic réseau, pas les appels d'API qui modifient les règles de groupe de sécurité."
    c:
      en: "CloudTrail events go only to the default event bus, so a rule on a custom bus never receives them unless a default-bus rule forwards them."
      fr: "Les événements CloudTrail ne vont qu'au bus d'événements par défaut : une règle sur un bus personnalisé ne les reçoit jamais, sauf si une règle du bus par défaut les transfère."
    e:
      en: "A 24-hour periodic evaluation can leave port 22 open for up to a day, which misses the within-minutes requirement."
      fr: "Une évaluation périodique de 24 heures peut laisser le port 22 ouvert pendant une journée, ce qui ne respecte pas l'exigence de quelques minutes."
references:
  - title: AWS service events delivered via AWS CloudTrail
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
