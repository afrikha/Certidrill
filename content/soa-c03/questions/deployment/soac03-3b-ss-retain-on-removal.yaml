id: soac03-3b-ss-retain-on-removal
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations and an AWS CloudFormation StackSet with service-managed permissions that targets the Analytics organizational unit (OU). The StackSet creates Amazon S3 buckets and AWS KMS keys that hold audit data in each account. Automatic deployment is activated with the default account removal behavior, and new accounts in the OU must keep receiving the stack automatically. When an account moves out of the Analytics OU, its stack must no longer be managed by the StackSet, but its buckets and keys must stay in place.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations et un StackSet AWS CloudFormation avec des autorisations gérées par le service (service-managed) qui cible l'unité d'organisation (OU) Analytics. Le StackSet crée dans chaque compte des compartiments Amazon S3 et des clés AWS KMS qui contiennent des données d'audit. Le déploiement automatique est activé avec le comportement de suppression de compte par défaut, et les nouveaux comptes de l'OU doivent continuer à recevoir la pile automatiquement. Lorsqu'un compte quitte l'OU Analytics, sa pile ne doit plus être gérée par le StackSet, mais ses compartiments et ses clés doivent rester en place.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deactivate automatic deployment so that CloudFormation never removes stack instances from accounts that leave the OU.", fr: "Désactiver le déploiement automatique pour que CloudFormation ne supprime jamais les instances de pile des comptes qui quittent l'OU." } }
    - { id: b, text: { en: "Update the StackSet automatic deployment settings to set RetainStacksOnAccountRemoval to true.", fr: "Mettre à jour les paramètres de déploiement automatique du StackSet pour définir RetainStacksOnAccountRemoval à true." } }
    - { id: c, text: { en: "Attach an SCP to the Analytics OU that denies cloudformation:DeleteStack to the StackSet execution role.", fr: "Attacher à l'OU Analytics une SCP qui refuse cloudformation:DeleteStack au rôle d'exécution du StackSet." } }
    - { id: d, text: { en: "Set FailureTolerancePercentage to 100 so that the delete operation is skipped in accounts that leave the OU.", fr: "Définir FailureTolerancePercentage à 100 pour que l'opération de suppression soit ignorée dans les comptes qui quittent l'OU." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With automatic deployment, CloudFormation runs a delete operation when an account leaves a target OU. Setting RetainStacksOnAccountRemoval to true (Retain stacks in the console) removes the stack from the StackSet but keeps its resources in their current state, while new accounts still receive the stack."
    fr: "Avec le déploiement automatique, CloudFormation exécute une opération de suppression lorsqu'un compte quitte une OU cible. Définir RetainStacksOnAccountRemoval à true (Retain stacks dans la console) retire la pile du StackSet mais conserve ses ressources dans leur état actuel, tandis que les nouveaux comptes reçoivent toujours la pile."
  options:
    a:
      en: "Without automatic deployment, new accounts added to the OU no longer receive the stack, which breaks a stated requirement."
      fr: "Sans déploiement automatique, les nouveaux comptes ajoutés à l'OU ne reçoivent plus la pile, ce qui enfreint une exigence."
    c:
      en: "The delete operation would fail and leave the stack instance in a failed state, still attached to the StackSet."
      fr: "L'opération de suppression échouerait et laisserait l'instance de pile en échec, toujours rattachée au StackSet."
    d:
      en: "Failure tolerance only decides when an operation stops after failures; it does not turn a stack deletion into a retention."
      fr: "La tolérance aux pannes décide seulement quand une opération s'arrête après des échecs ; elle ne transforme pas une suppression de pile en conservation."
references:
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
