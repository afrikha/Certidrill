id: soac03-3b-cf-continuous-deployment
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company serves its website through an Amazon CloudFront distribution with an alternate domain name. The operations team wants to test a new cache policy with about 10% of real viewers before it applies to everyone. A viewer who reaches the new configuration must keep using it for the rest of the session. After the test, the team must apply the tested configuration to the production distribution.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias diffuse son site web via une distribution Amazon CloudFront avec un nom de domaine alternatif. L'équipe d'exploitation veut tester une nouvelle politique de cache avec environ 10 % des vrais visiteurs avant de l'appliquer à tous. Un visiteur qui atteint la nouvelle configuration doit continuer à l'utiliser pendant le reste de sa session. Après le test, l'équipe doit appliquer la configuration testée à la distribution de production.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a staging distribution with a header-based continuous deployment policy, and promote it after the test.", fr: "Créer une distribution intermédiaire (staging) avec une politique de déploiement continu basée sur un en-tête, et la promouvoir après le test." } }
    - { id: b, text: { en: "Create a staging distribution with a weight-based continuous deployment policy of 10% and session stickiness, and promote it after the test.", fr: "Créer une distribution intermédiaire avec une politique de déploiement continu basée sur un poids de 10 % et l'adhérence de session, et la promouvoir après le test." } }
    - { id: c, text: { en: "Create a second distribution with the same alternate domain name, and use Route 53 weighted records to send it 10% of the traffic.", fr: "Créer une seconde distribution avec le même nom de domaine alternatif, et utiliser des enregistrements pondérés Route 53 pour lui envoyer 10 % du trafic." } }
    - { id: d, text: { en: "Add a second cache behavior with the new cache policy for a path pattern that matches 10% of the URLs.", fr: "Ajouter un second comportement de cache avec la nouvelle politique de cache pour un modèle de chemin qui correspond à 10 % des URL." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudFront continuous deployment sends part of the production traffic of the primary distribution to a staging distribution. Weight-based routing picks a share of viewers, session stickiness keeps a viewer on the same distribution for the session, and promoting copies the staging configuration to the primary distribution."
    fr: "Le déploiement continu CloudFront envoie une partie du trafic de production de la distribution principale vers une distribution intermédiaire. Le routage par poids choisit une part des visiteurs, l'adhérence de session garde un visiteur sur la même distribution pendant la session, et la promotion copie la configuration intermédiaire dans la distribution principale."
  options:
    a:
      en: "Header-based routing only reaches requests that carry a specific aws-cf-cd- header, not a share of real viewers."
      fr: "Le routage par en-tête ne concerne que les requêtes qui portent un en-tête aws-cf-cd- précis, pas une part des vrais visiteurs."
    c:
      en: "Two distributions cannot both use the same alternate domain name, and DNS weighting does not keep sessions on one configuration."
      fr: "Deux distributions ne peuvent pas utiliser le même nom de domaine alternatif, et la pondération DNS ne garde pas les sessions sur une configuration."
    d:
      en: "A path pattern splits by URL instead of by viewer, so a viewer would see both configurations during a session."
      fr: "Un modèle de chemin répartit par URL et non par visiteur : un visiteur verrait les deux configurations pendant une session."
references:
  - title: Learn how continuous deployment works
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/understanding-continuous-deployment.html
  - title: Use CloudFront continuous deployment to safely test CDN configuration changes
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/continuous-deployment.html
