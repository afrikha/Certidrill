id: soac03-3b-gitsync-pr-comments
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team manages an AWS CloudFormation stack with Git sync. Changes reach the monitored branch only through pull requests. Reviewers want to see which resources will be added, modified, or deleted before they approve a pull request. Currently, pull requests show no summary of the stack changes.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe gère une pile AWS CloudFormation avec Git sync. Les modifications n'arrivent sur la branche surveillée que par des pull requests. Les relecteurs veulent voir quelles ressources seront ajoutées, modifiées ou supprimées avant d'approuver une pull request. Actuellement, les pull requests n'affichent aucun résumé des modifications de la pile.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Edit the Git sync settings of the stack and turn on Enable comment on pull request.", fr: "Modifier les paramètres Git sync de la pile et activer Enable comment on pull request." } }
    - { id: b, text: { en: "Add a CodeBuild job that creates a change set for each pull request and posts its summary as a comment.", fr: "Ajouter un job CodeBuild qui crée un jeu de modifications pour chaque pull request et publie son résumé en commentaire." } }
    - { id: c, text: { en: "Run drift detection on the stack each time a pull request is opened, and attach the results to it.", fr: "Exécuter la détection de dérive sur la pile chaque fois qu'une pull request est ouverte, et y joindre les résultats." } }
    - { id: d, text: { en: "Require a cfn-lint check on every pull request before it can be merged.", fr: "Exiger une vérification cfn-lint sur chaque pull request avant qu'elle puisse être fusionnée." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Git sync can post a comment in a pull request that summarizes the differences between the current stack and the proposed changes, listing the resources to be added, modified, or deleted. For an existing stack, the option is turned on from the Git sync tab with Edit."
    fr: "Git sync peut publier dans une pull request un commentaire qui résume les différences entre la pile actuelle et les modifications proposées, en listant les ressources à ajouter, modifier ou supprimer. Pour une pile existante, l'option s'active depuis l'onglet Git sync avec Edit."
  options:
    b:
      en: "A custom job could produce the same summary but adds a build project and scripts to maintain."
      fr: "Un job personnalisé pourrait produire le même résumé mais ajoute un projet de build et des scripts à maintenir."
    c:
      en: "Drift detection compares deployed resources with the current template; it does not preview the changes of a pull request."
      fr: "La détection de dérive compare les ressources déployées au modèle actuel ; elle ne prévisualise pas les modifications d'une pull request."
    d:
      en: "Linting checks template syntax and rules, not which resources the update would change."
      fr: "Le lint vérifie la syntaxe et les règles du modèle, pas les ressources que la mise à jour modifierait."
references:
  - title: Enable CloudFormation to post a summary of stack changes in pull requests
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/gitsync-enable-comments-on-pull-requests.html
