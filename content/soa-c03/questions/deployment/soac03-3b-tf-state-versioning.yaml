id: soac03-3b-tf-state-versioning
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team stores Terraform state in an Amazon S3 bucket with S3 native state locking. A faulty pipeline run recently overwrote a state file with bad data, and the team had to import dozens of resources again. The team must be able to return a state file to a previous valid copy in the future.

    Which bucket configuration will meet this requirement?
  fr: |
    Une équipe stocke l'état Terraform dans un compartiment Amazon S3 avec le verrouillage natif de l'état S3. Une exécution de pipeline défectueuse a récemment écrasé un fichier d'état avec des données erronées, et l'équipe a dû importer de nouveau des dizaines de ressources. L'équipe doit pouvoir ramener à l'avenir un fichier d'état à une copie valide précédente.

    Quelle configuration de compartiment répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Default encryption with SSE-KMS and a customer managed key", fr: "Chiffrement par défaut SSE-KMS avec une clé gérée par le client" } }
    - { id: b, text: { en: "S3 Object Ownership set to Bucket owner enforced", fr: "S3 Object Ownership défini à Bucket owner enforced" } }
    - { id: c, text: { en: "A lifecycle rule that transitions state files to S3 Standard-IA after 30 days", fr: "Une règle de cycle de vie qui fait passer les fichiers d'état vers S3 Standard-IA après 30 jours" } }
    - { id: d, text: { en: "S3 Versioning on the bucket", fr: "S3 Versioning sur le compartiment" } }
answer: { optionId: d }
explanation:
  correct:
    en: "With S3 Versioning, every write of the state file keeps the previous version of the object. The team can roll back by restoring an earlier valid version of the state file."
    fr: "Avec S3 Versioning, chaque écriture du fichier d'état conserve la version précédente de l'objet. L'équipe peut revenir en arrière en restaurant une version valide antérieure du fichier d'état."
  options:
    a:
      en: "Encryption protects the state at rest but keeps no earlier copy to restore."
      fr: "Le chiffrement protège l'état au repos mais ne conserve aucune copie antérieure à restaurer."
    b:
      en: "Object Ownership controls ACLs and object ownership, not previous versions."
      fr: "Object Ownership contrôle les ACL et la propriété des objets, pas les versions précédentes."
    c:
      en: "A storage class transition changes cost, and the current object is still overwritten."
      fr: "Une transition de classe de stockage change le coût, et l'objet actuel est toujours écrasé."
references:
  - title: Backend best practices
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/terraform-aws-provider-best-practices/backend.html
