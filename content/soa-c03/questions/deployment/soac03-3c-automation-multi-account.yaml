id: soac03-3c-automation-multi-account
objective: "3.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations. The operations team wants to run the AWS owned runbook AWS-RestartEC2Instance from a delegated administrator account for Systems Manager. The runbook must run on the instances tagged Patch=pending in the 25 member accounts of one organizational unit (OU), in two AWS Regions, with one execution started from the delegated administrator account.

    Which combination of steps must the team take to meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise AWS Organizations. L'équipe d'exploitation veut exécuter le runbook détenu par AWS AWS-RestartEC2Instance depuis un compte d'administrateur délégué pour Systems Manager. Le runbook doit s'exécuter sur les instances balisées Patch=pending dans les 25 comptes membres d'une unité d'organisation (UO), dans deux Régions AWS, avec une seule exécution lancée depuis le compte d'administrateur délégué.

    Quelle combinaison d'étapes l'équipe doit-elle réaliser pour répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the AWS-SystemsManager-AutomationAdministrationRole role in each of the 25 member accounts.", fr: "Créer le rôle AWS-SystemsManager-AutomationAdministrationRole dans chacun des 25 comptes membres." } }
    - { id: b, text: { en: "Create the AWS-SystemsManager-AutomationAdministrationRole role in the delegated administrator account.", fr: "Créer le rôle AWS-SystemsManager-AutomationAdministrationRole dans le compte d'administrateur délégué." } }
    - { id: c, text: { en: "Share the AWS-RestartEC2Instance runbook with the OU by using AWS Resource Access Manager (AWS RAM).", fr: "Partager le runbook AWS-RestartEC2Instance avec l'UO à l'aide d'AWS Resource Access Manager (AWS RAM)." } }
    - { id: d, text: { en: "Activate Default Host Management Configuration in every member account and in both Regions.", fr: "Activer Default Host Management Configuration dans chaque compte membre et dans les deux Régions." } }
    - { id: e, text: { en: "Deploy the AWS-SystemsManager-AutomationExecutionRole role to every member account, for example with CloudFormation StackSets.", fr: "Déployer le rôle AWS-SystemsManager-AutomationExecutionRole dans chaque compte membre, par exemple avec CloudFormation StackSets." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Multi-account and multi-Region automations need the AWS-SystemsManager-AutomationAdministrationRole role only in the central account (management or delegated administrator account), where it is passed as AutomationAssumeRole. Every target account needs the AWS-SystemsManager-AutomationExecutionRole role, which AWS recommends deploying with StackSets. The team then starts the execution with target locations that list the OU, the Regions, and the tag target."
    fr: "Les automatisations multicomptes et multi-Régions n'ont besoin du rôle AWS-SystemsManager-AutomationAdministrationRole que dans le compte central (compte de gestion ou d'administrateur délégué), où il est transmis comme AutomationAssumeRole. Chaque compte cible a besoin du rôle AWS-SystemsManager-AutomationExecutionRole, qu'AWS recommande de déployer avec StackSets. L'équipe lance ensuite l'exécution avec des emplacements cibles qui indiquent l'UO, les Régions et la cible par balise."
  options:
    a:
      en: "The administration role belongs only in the central account; member accounts need the execution role instead."
      fr: "Le rôle d'administration n'existe que dans le compte central ; les comptes membres ont besoin du rôle d'exécution."
    c:
      en: "AWS owned runbooks are already available in every account, so they do not need to be shared."
      fr: "Les runbooks détenus par AWS sont déjà disponibles dans chaque compte : il n'est pas nécessaire de les partager."
    d:
      en: "AWS-RestartEC2Instance stops and starts instances through the EC2 API, so the instances do not need to be managed nodes for this runbook."
      fr: "AWS-RestartEC2Instance arrête et démarre les instances par l'API EC2 : les instances n'ont pas besoin d'être des nœuds gérés pour ce runbook."
references:
  - title: Running automations in multiple AWS Regions and accounts
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-multiple-accounts-regions.html
