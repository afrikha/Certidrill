id: soac03-3b-ecs-alarm-rollback
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon ECS service uses rolling updates with the deployment circuit breaker and rollback turned on. A faulty release started tasks that passed their health checks but returned HTTP 5xx errors, and the deployment completed. An Amazon CloudWatch alarm on the HTTPCode_ELB_5XX_Count metric of the load balancer entered the ALARM state. The company wants ECS to roll back automatically when this alarm fires during a deployment.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un service Amazon ECS utilise des mises à jour propagées avec le disjoncteur de déploiement et le retour arrière activés. Une version défectueuse a démarré des tâches qui ont réussi leurs contrôles de santé mais renvoyaient des erreurs HTTP 5xx, et le déploiement s'est terminé. Une alarme Amazon CloudWatch sur la métrique HTTPCode_ELB_5XX_Count de l'équilibreur de charge est passée à l'état ALARM. L'entreprise veut qu'ECS revienne en arrière automatiquement lorsque cette alarme se déclenche pendant un déploiement.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Shorten the health check grace period of the service so that the circuit breaker detects the errors sooner.", fr: "Raccourcir le délai de grâce du contrôle de santé du service pour que le disjoncteur détecte les erreurs plus tôt." } }
    - { id: b, text: { en: "Add the alarm to the alarms setting of the deployment configuration with enable and rollback set to true.", fr: "Ajouter l'alarme au paramètre alarms de la configuration de déploiement avec enable et rollback définis à true." } }
    - { id: c, text: { en: "Create an EventBridge rule on the alarm that invokes a Lambda function to update the service to the previous task definition.", fr: "Créer une règle EventBridge sur l'alarme qui appelle une fonction Lambda pour remettre le service sur la définition de tâche précédente." } }
    - { id: d, text: { en: "Move the service to the CODE_DEPLOY deployment controller and create a CodeDeploy deployment group with the alarm.", fr: "Passer le service au contrôleur de déploiement CODE_DEPLOY et créer un groupe de déploiement CodeDeploy avec l'alarme." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The circuit breaker detects tasks that cannot start, not application errors. The alarms setting of the deployment configuration (alarmNames, enable, rollback) makes ECS mark the deployment FAILED when an alarm enters ALARM and roll back to the last completed deployment, including during the bake time."
    fr: "Le disjoncteur détecte les tâches qui ne démarrent pas, pas les erreurs applicatives. Le paramètre alarms de la configuration de déploiement (alarmNames, enable, rollback) fait passer le déploiement à FAILED lorsqu'une alarme passe à ALARM et revient au dernier déploiement terminé, y compris pendant le temps de stabilisation."
  options:
    a:
      en: "The tasks pass their health checks, so the circuit breaker never sees a failure, whatever the grace period."
      fr: "Les tâches réussissent leurs contrôles de santé : le disjoncteur ne voit jamais d'échec, quel que soit le délai de grâce."
    c:
      en: "Custom code could work but adds a rule and a function to maintain for a built-in feature."
      fr: "Du code personnalisé pourrait fonctionner mais ajoute une règle et une fonction à maintenir pour une fonctionnalité intégrée."
    d:
      en: "Changing the deployment controller and adding CodeDeploy is far more work than enabling alarm-based rollback."
      fr: "Changer le contrôleur de déploiement et ajouter CodeDeploy demande bien plus de travail qu'activer le retour arrière sur alarme."
references:
  - title: How CloudWatch alarms detect Amazon ECS deployment failures
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-alarm-failure.html
