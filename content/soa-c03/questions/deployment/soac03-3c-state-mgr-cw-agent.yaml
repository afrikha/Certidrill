id: soac03-3c-state-mgr-cw-agent
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants the Amazon CloudWatch agent to be installed on every Amazon EC2 instance that has the tag Environment=prod, including instances that several teams launch later from different AMIs. If someone uninstalls the agent, it must be reinstalled within 1 hour. All the instances are AWS Systems Manager managed nodes.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise veut que l'agent Amazon CloudWatch soit installé sur chaque instance Amazon EC2 qui porte la balise Environment=prod, y compris les instances que plusieurs équipes lanceront plus tard à partir d'AMI différentes. Si quelqu'un désinstalle l'agent, il doit être réinstallé dans un délai d'une heure. Toutes les instances sont des nœuds gérés AWS Systems Manager.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Use Run Command once with the AWS-ConfigureAWSPackage document to install the AmazonCloudWatchAgent package on the tagged instances.", fr: "Utiliser Run Command une seule fois avec le document AWS-ConfigureAWSPackage pour installer le package AmazonCloudWatchAgent sur les instances balisées." } }
    - { id: b, text: { en: "Add commands to the user data of every team's launch templates to download and install the CloudWatch agent at first boot.", fr: "Ajouter aux données utilisateur des modèles de lancement de chaque équipe des commandes qui téléchargent et installent l'agent CloudWatch au premier démarrage." } }
    - { id: c, text: { en: "Create a weekly maintenance window with a Run Command task that runs AWS-ConfigureAWSPackage on the tagged instances.", fr: "Créer une fenêtre de maintenance hebdomadaire avec une tâche Run Command qui exécute AWS-ConfigureAWSPackage sur les instances balisées." } }
    - { id: d, text: { en: "Create a State Manager association that runs AWS-ConfigureAWSPackage for the AmazonCloudWatchAgent package on the tag every 30 minutes.", fr: "Créer une association State Manager qui exécute AWS-ConfigureAWSPackage pour le package AmazonCloudWatchAgent sur la balise toutes les 30 minutes." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A State Manager association defines a state that targeted nodes must keep, and it reapplies that state on its schedule. It also runs when a matching node comes online for the first time, so new tagged instances get the agent without changes to their AMIs. A 30-minute schedule reinstalls a removed agent well within the required hour."
    fr: "Une association State Manager définit un état que les nœuds ciblés doivent conserver, et réapplique cet état selon sa planification. Elle s'exécute aussi lorsqu'un nœud correspondant se connecte pour la première fois : les nouvelles instances balisées reçoivent donc l'agent sans modification de leurs AMI. Une planification de 30 minutes réinstalle un agent supprimé bien avant l'heure exigée."
  options:
    a:
      en: "A one-time command covers only the current instances; it neither installs the agent on later instances nor reinstalls a removed agent."
      fr: "Une commande ponctuelle ne couvre que les instances actuelles ; elle n'installe pas l'agent sur les instances ultérieures et ne réinstalle pas un agent supprimé."
    b:
      en: "User data runs only at first boot of instances launched from those templates, so it misses existing instances and never reinstalls a removed agent."
      fr: "Les données utilisateur ne s'exécutent qu'au premier démarrage des instances lancées à partir de ces modèles : elles ignorent les instances existantes et ne réinstallent jamais un agent supprimé."
    c:
      en: "A weekly window can leave an instance without the agent for up to a week, which misses the 1-hour requirement."
      fr: "Une fenêtre hebdomadaire peut laisser une instance sans agent pendant une semaine, ce qui ne respecte pas l'exigence d'une heure."
references:
  - title: Understanding how State Manager works
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/state-manager-about.html
  - title: AWS Systems Manager Distributor
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/distributor.html
