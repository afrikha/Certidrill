id: soac03-3c-ssm-endpoints-private
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company launches Amazon EC2 instances in private subnets that have no route to the internet and no NAT gateway, and company policy forbids internet access from these subnets. The instances have an instance profile with the AmazonSSMManagedInstanceCore policy and a current SSM Agent, but they do not appear as managed nodes in Fleet Manager. Administrators must run commands on the instances and connect to them with Session Manager.

    Which solution will meet these requirements?
  fr: |
    Une entreprise lance des instances Amazon EC2 dans des sous-réseaux privés sans route vers Internet ni passerelle NAT, et la politique de l'entreprise interdit tout accès à Internet depuis ces sous-réseaux. Les instances ont un profil d'instance avec la politique AmazonSSMManagedInstanceCore et un SSM Agent à jour, mais elles n'apparaissent pas comme nœuds gérés dans Fleet Manager. Les administrateurs doivent exécuter des commandes sur les instances et s'y connecter avec Session Manager.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon S3 gateway endpoint, and add it to the route tables of the private subnets.", fr: "Créer un point de terminaison de passerelle Amazon S3, et l'ajouter aux tables de routage des sous-réseaux privés." } }
    - { id: b, text: { en: "Allow inbound TCP port 22 from the administrators' IP range in the security group of the instances.", fr: "Autoriser le port TCP 22 entrant depuis la plage d'adresses IP des administrateurs dans le groupe de sécurité des instances." } }
    - { id: c, text: { en: "Create interface VPC endpoints for ssm, ssmmessages, and ec2messages, with a security group that allows HTTPS from the private subnets.", fr: "Créer des points de terminaison d'interface pour ssm, ssmmessages et ec2messages, avec un groupe de sécurité qui autorise HTTPS depuis les sous-réseaux privés." } }
    - { id: d, text: { en: "Create interface VPC endpoints for ec2, logs, and kms, with a security group that allows HTTPS from the private subnets.", fr: "Créer des points de terminaison d'interface pour ec2, logs et kms, avec un groupe de sécurité qui autorise HTTPS depuis les sous-réseaux privés." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Without internet access, SSM Agent reaches Systems Manager through interface VPC endpoints. The ssm, ssmmessages, and ec2messages endpoints are the ones that Session Manager needs, and ssmmessages also carries Run Command traffic. The endpoint security group must allow inbound TCP 443 from the subnets of the managed instances."
    fr: "Sans accès à Internet, SSM Agent joint Systems Manager par des points de terminaison d'interface d'un VPC. Les points de terminaison ssm, ssmmessages et ec2messages sont ceux dont Session Manager a besoin, et ssmmessages transporte aussi le trafic de Run Command. Le groupe de sécurité des points de terminaison doit autoriser le trafic TCP 443 entrant depuis les sous-réseaux des instances gérées."
  options:
    a:
      en: "The S3 endpoint is optional, for agent updates and file transfers; the agent still cannot reach the Systems Manager endpoints."
      fr: "Le point de terminaison S3 est facultatif, pour les mises à jour de l'agent et les transferts de fichiers ; l'agent ne peut toujours pas joindre les points de terminaison de Systems Manager."
    b:
      en: "SSH access does not register the instances with Systems Manager, and Session Manager does not use inbound port 22."
      fr: "Un accès SSH n'inscrit pas les instances auprès de Systems Manager, et Session Manager n'utilise pas le port 22 entrant."
    d:
      en: "These endpoints are optional extras (snapshots, logs, encryption); without the ssm and ssmmessages endpoints the nodes stay unmanaged."
      fr: "Ces points de terminaison sont des compléments facultatifs (instantanés, journaux, chiffrement) ; sans les points de terminaison ssm et ssmmessages, les nœuds restent non gérés."
references:
  - title: Improve the security of EC2 instances by using VPC endpoints for Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/setup-create-vpc.html
