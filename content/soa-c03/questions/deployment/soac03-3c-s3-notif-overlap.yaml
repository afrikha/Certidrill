id: soac03-3c-s3-notif-overlap
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon S3 bucket has an event notification that sends s3:ObjectCreated:* events to an AWS Lambda function, with no prefix or suffix filter. The function processes only objects under incoming/ and ignores the others. An administrator tries to add a second notification that sends s3:ObjectCreated:Put events for the prefix reports/ to an Amazon SQS standard queue, but Amazon S3 rejects the configuration. Objects are uploaded with PutObject.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un compartiment Amazon S3 possède une notification d'événement qui envoie les événements s3:ObjectCreated:* à une fonction AWS Lambda, sans filtre de préfixe ni de suffixe. La fonction ne traite que les objets sous incoming/ et ignore les autres. Un administrateur tente d'ajouter une seconde notification qui envoie les événements s3:ObjectCreated:Put du préfixe reports/ à une file d'attente Amazon SQS standard, mais Amazon S3 rejette la configuration. Les objets sont chargés avec PutObject.

    Quelle solution répond à ces exigences avec le MOINS d'efforts ?
body:
  options:
    - { id: a, text: { en: "Create the queue notification with the prefix reports/* so that the wildcard limits the scope of its rule.", fr: "Créer la notification de la file d'attente avec le préfixe reports/* pour que le caractère générique limite la portée de sa règle." } }
    - { id: b, text: { en: "Add the prefix filter incoming/ to the existing Lambda notification, and then add the queue notification for reports/.", fr: "Ajouter le filtre de préfixe incoming/ à la notification Lambda existante, puis ajouter la notification de la file d'attente pour reports/." } }
    - { id: c, text: { en: "Change the event type of the queue notification to s3:ObjectCreated:Post so that the event types no longer overlap.", fr: "Remplacer le type d'événement de la notification de la file d'attente par s3:ObjectCreated:Post pour que les types d'événements ne se chevauchent plus." } }
    - { id: d, text: { en: "Add a .csv suffix filter to the queue notification so that its rule is more specific than the Lambda rule.", fr: "Ajouter un filtre de suffixe .csv à la notification de la file d'attente pour que sa règle soit plus précise que la règle Lambda." } }
answer: { optionId: b }
explanation:
  correct:
    en: "S3 notification configurations cannot have overlapping prefixes, suffixes, or prefix and suffix combinations for the same event types. A rule without a filter has a default root prefix that overlaps every other rule, and s3:ObjectCreated:* includes Put. Giving the Lambda rule the prefix incoming/ removes the overlap with reports/, and the function receives the only events it processes."
    fr: "Les configurations de notification S3 ne peuvent pas avoir de préfixes, de suffixes ou de combinaisons préfixe-suffixe qui se chevauchent pour les mêmes types d'événements. Une règle sans filtre a un préfixe racine par défaut qui chevauche toutes les autres règles, et s3:ObjectCreated:* inclut Put. Donner le préfixe incoming/ à la règle Lambda supprime le chevauchement avec reports/, et la fonction reçoit les seuls événements qu'elle traite."
  options:
    a:
      en: "Key name filters do not support the * wildcard, and the Lambda rule with no filter would still overlap with reports/."
      fr: "Les filtres de nom de clé ne prennent pas en charge le caractère générique *, et la règle Lambda sans filtre chevaucherait toujours reports/."
    c:
      en: "Post is also part of s3:ObjectCreated:*, so the rules still overlap, and the objects are uploaded with Put, not Post."
      fr: "Post fait aussi partie de s3:ObjectCreated:* : les règles se chevauchent toujours, et les objets sont chargés avec Put, pas Post."
    d:
      en: "The rule without a filter also has a default root suffix that overlaps any suffix, so the configuration is still rejected."
      fr: "La règle sans filtre a aussi un suffixe racine par défaut qui chevauche tout suffixe : la configuration est toujours rejetée."
references:
  - title: Configuring event notifications using object key name filtering
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-filtering.html
