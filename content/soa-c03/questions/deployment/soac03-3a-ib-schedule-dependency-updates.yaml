id: soac03-3a-ib-schedule-dependency-updates
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The image recipe of an EC2 Image Builder pipeline uses semantic version filters (x.x.x) for its base image and its components. The pipeline runs every night on a cron schedule with the EXPRESSION_MATCH_ONLY start condition, so it produces a new AMI every night even when nothing has changed, and the security team must validate each AMI. The company wants a new AMI only on the nights when a newer version of the base image or of a component is available.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    La recette d'image d'un pipeline EC2 Image Builder utilise des filtres de version sémantique (x.x.x) pour son image de base et ses composants. Le pipeline s'exécute chaque nuit selon une planification cron avec la condition de démarrage EXPRESSION_MATCH_ONLY : il produit donc une nouvelle AMI chaque nuit même quand rien n'a changé, et l'équipe de sécurité doit valider chaque AMI. L'entreprise souhaite une nouvelle AMI uniquement les nuits où une version plus récente de l'image de base ou d'un composant est disponible.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Write an AWS Lambda function, invoked every night by Amazon EventBridge Scheduler, that compares the latest base image and component versions with the last build and starts the pipeline only when they differ.", fr: "Écrire une fonction AWS Lambda, appelée chaque nuit par Amazon EventBridge Scheduler, qui compare les dernières versions de l'image de base et des composants avec la dernière création et ne démarre le pipeline que si elles diffèrent." } }
    - { id: b, text: { en: "Keep the nightly cron expression and change the pipeline's start condition to EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE.", fr: "Conserver l'expression cron nocturne et changer la condition de démarrage du pipeline en EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE." } }
    - { id: c, text: { en: "Change the pipeline to manual runs, and have an engineer start it after reviewing the release notes of the base image and components.", fr: "Passer le pipeline en exécution manuelle, et demander à un ingénieur de le démarrer après avoir lu les notes de version de l'image de base et des composants." } }
    - { id: d, text: { en: "Add an Image Builder lifecycle policy that deletes each new image whose recipe and components are identical to those of the previous image.", fr: "Ajouter une politique de cycle de vie Image Builder qui supprime chaque nouvelle image dont la recette et les composants sont identiques à ceux de l'image précédente." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE, the schedule expression only sets how often Image Builder checks, and a new image is built only when a new base image or component version that matches the semantic version filters exists. It is a pipeline setting, so no code or manual step is needed.
    fr: |
      Avec EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE, l'expression de planification fixe seulement la fréquence des vérifications d'Image Builder, et une nouvelle image n'est créée que s'il existe une nouvelle version de l'image de base ou d'un composant qui correspond aux filtres de version sémantique. C'est un paramètre du pipeline : aucun code ni étape manuelle n'est nécessaire.
  options:
    a:
      en: |
        This reproduces the built-in start condition with custom code that must be written and maintained, so the overhead is higher.
      fr: |
        Cela reproduit la condition de démarrage intégrée avec du code personnalisé qu'il faut écrire et maintenir : la charge est plus élevée.
    c:
      en: |
        A manual review every night is the highest operational overhead and delays new images.
      fr: |
        Une revue manuelle chaque nuit représente la charge opérationnelle la plus élevée et retarde les nouvelles images.
    d:
      en: |
        Lifecycle rules select images by age or by count; they cannot compare image contents, and the unnecessary builds still run every night.
      fr: |
        Les règles de cycle de vie sélectionnent les images par âge ou par nombre ; elles ne peuvent pas comparer le contenu des images, et les créations inutiles s'exécutent toujours chaque nuit.
references:
  - title: Schedule
    url: https://docs.aws.amazon.com/imagebuilder/latest/APIReference/API_Schedule.html
