id: soac03-3a-ami-deprecate-hide
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company shares a base AMI with 40 accounts. A newer AMI replaces it. Launch templates and Auto Scaling groups in the consumer accounts still reference the old AMI ID and must keep working for 3 months. During this period, the old AMI must no longer appear when users list or select AMIs in the consumer accounts.

    Which solution will meet these requirements?
  fr: |
    Une entreprise partage une AMI de base avec 40 comptes. Une AMI plus récente la remplace. Les modèles de lancement et les groupes Auto Scaling des comptes consommateurs référencent encore l'ID de l'ancienne AMI et doivent continuer de fonctionner pendant 3 mois. Pendant cette période, l'ancienne AMI ne doit plus apparaître quand les utilisateurs listent ou sélectionnent des AMI dans les comptes consommateurs.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deregister the old AMI now, and keep its snapshots for 3 months.", fr: "Annuler maintenant l'enregistrement de l'ancienne AMI, et conserver ses instantanés pendant 3 mois." } }
    - { id: b, text: { en: "Disable the old AMI now, and delete it after 3 months.", fr: "Désactiver maintenant l'ancienne AMI, et la supprimer au bout de 3 mois." } }
    - { id: c, text: { en: "Remove the launch permissions of the 40 accounts from the old AMI now.", fr: "Retirer maintenant les autorisations de lancement des 40 comptes de l'ancienne AMI." } }
    - { id: d, text: { en: "Deprecate the old AMI now, and deregister it after 3 months.", fr: "Rendre obsolète l'ancienne AMI maintenant, et en annuler l'enregistrement au bout de 3 mois." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A deprecated AMI no longer appears in the DescribeImages results or in the console of AMI users, but it can still be launched by ID, and launch templates and Auto Scaling groups can keep referencing it. Deregistering it after 3 months removes it for good.
    fr: |
      Une AMI obsolète n'apparaît plus dans les résultats de DescribeImages ni dans la console des utilisateurs de l'AMI, mais elle peut toujours être lancée par son ID, et les modèles de lancement et groupes Auto Scaling peuvent continuer à la référencer. En annuler l'enregistrement au bout de 3 mois la supprime définitivement.
  options:
    a:
      en: |
        A deregistered AMI can no longer be used to launch instances, so the launch templates would fail immediately.
      fr: |
        Une AMI dont l'enregistrement est annulé ne peut plus servir à lancer des instances : les modèles de lancement échoueraient immédiatement.
    b:
      en: |
        Disabling an AMI makes it private and prevents new launches, so the consumer accounts could no longer use it.
      fr: |
        Désactiver une AMI la rend privée et empêche les nouveaux lancements : les comptes consommateurs ne pourraient plus l'utiliser.
    c:
      en: |
        Without launch permissions, the consumer accounts can no longer launch instances from the AMI.
      fr: |
        Sans autorisations de lancement, les comptes consommateurs ne peuvent plus lancer d'instances à partir de l'AMI.
references:
  - title: Deprecate an Amazon EC2 AMI
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-deprecate.html
