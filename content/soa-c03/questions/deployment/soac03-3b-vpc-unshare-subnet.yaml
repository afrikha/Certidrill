id: soac03-3b-vpc-unshare-subnet
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A network account shares a subnet with a participant account through AWS Resource Access Manager (AWS RAM). The participant runs Amazon EC2 instances in the subnet. The network team removes the participant account from the resource share to stop sharing the subnet.

    Which three statements describe the result? (Choose three.)
  fr: |
    Un compte réseau partage un sous-réseau avec un compte participant via AWS Resource Access Manager (AWS RAM). Le participant exécute des instances Amazon EC2 dans le sous-réseau. L'équipe réseau retire le compte participant du partage de ressources pour arrêter le partage du sous-réseau.

    Quelles sont les trois affirmations qui décrivent le résultat ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "The participant's existing instances keep running in the subnet.", fr: "Les instances existantes du participant continuent de s'exécuter dans le sous-réseau." } }
    - { id: b, text: { en: "The participant's instances are terminated automatically.", fr: "Les instances du participant sont résiliées automatiquement." } }
    - { id: c, text: { en: "The participant can no longer create new resources in the subnet.", fr: "Le participant ne peut plus créer de nouvelles ressources dans le sous-réseau." } }
    - { id: d, text: { en: "Ownership of the participant's instances moves to the network account.", fr: "La propriété des instances du participant passe au compte réseau." } }
    - { id: e, text: { en: "The network account cannot delete the subnet while the participant's resources remain in it.", fr: "Le compte réseau ne peut pas supprimer le sous-réseau tant que les ressources du participant y restent." } }
    - { id: f, text: { en: "The participant can no longer stop or delete its instances in the subnet.", fr: "Le participant ne peut plus arrêter ni supprimer ses instances dans le sous-réseau." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "After a subnet is unshared, the participant's existing resources keep running, but the participant cannot create new resources in the subnet. The participant can still modify, describe, and delete its existing resources, and the owner cannot delete the subnet or its VPC until those resources are deleted."
    fr: "Après l'arrêt du partage d'un sous-réseau, les ressources existantes du participant continuent de fonctionner, mais le participant ne peut plus créer de ressources dans le sous-réseau. Le participant peut toujours modifier, décrire et supprimer ses ressources existantes, et le propriétaire ne peut pas supprimer le sous-réseau ni son VPC tant que ces ressources ne sont pas supprimées."
  options:
    b:
      en: "Unsharing does not terminate anything; existing participant resources continue to run."
      fr: "L'arrêt du partage ne résilie rien ; les ressources existantes du participant continuent de fonctionner."
    d:
      en: "Resources stay owned by and billed to the participant account that created them."
      fr: "Les ressources restent la propriété du compte participant qui les a créées, et lui sont facturées."
    f:
      en: "The participant keeps the ability to modify, describe, and delete its existing resources."
      fr: "Le participant conserve la possibilité de modifier, décrire et supprimer ses ressources existantes."
references:
  - title: Working with shared subnets
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing-share-subnet-working-with.html
