id: soac03-3a-ami-windows-sysprep
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator created an AMI from a fully configured Windows Server instance and launched 10 instances from it. The new instances cause conflicts in the Active Directory domain because they keep the security identifier (SID) and the computer name of the source instance.

    What should the administrator do to create an AMI that avoids this problem?
  fr: |
    Un administrateur a créé une AMI à partir d'une instance Windows Server entièrement configurée et a lancé 10 instances à partir de celle-ci. Les nouvelles instances provoquent des conflits dans le domaine Active Directory, car elles conservent l'identificateur de sécurité (SID) et le nom d'ordinateur de l'instance source.

    Que doit faire l'administrateur pour créer une AMI qui évite ce problème ?
body:
  options:
    - { id: a, text: { en: "Create the AMI with the --no-reboot option so that Windows does not keep the identity of the source instance.", fr: "Créer l'AMI avec l'option --no-reboot pour que Windows ne conserve pas l'identité de l'instance source." } }
    - { id: b, text: { en: "Run Windows Sysprep with the EC2Launch v2 agent on the source instance, and then create the AMI.", fr: "Exécuter Windows Sysprep avec l'agent EC2Launch v2 sur l'instance source, puis créer l'AMI." } }
    - { id: c, text: { en: "Copy the AMI to another Region, because each copy receives a new SID.", fr: "Copier l'AMI dans une autre Région, car chaque copie reçoit un nouveau SID." } }
    - { id: d, text: { en: "Use a Systems Manager Run Command document to rename each new instance after it launches.", fr: "Utiliser un document Systems Manager Run Command pour renommer chaque nouvelle instance après son lancement." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sysprep creates a generalized version of the operating system: its generalize phase removes the SID, the computer name and other instance-specific data before the image is captured. The EC2Launch v2 agent supports running Sysprep to build a standardized AMI, and each launched instance then gets its own identity.
    fr: |
      Sysprep crée une version généralisée du système d'exploitation : sa phase de généralisation supprime le SID, le nom d'ordinateur et d'autres données propres à l'instance avant la capture de l'image. L'agent EC2Launch v2 permet d'exécuter Sysprep pour créer une AMI standardisée, et chaque instance lancée reçoit ensuite sa propre identité.
  options:
    a:
      en: |
        --no-reboot only skips the reboot during image creation; the operating system still keeps its SID and computer name.
      fr: |
        --no-reboot évite seulement le redémarrage pendant la création de l'image ; le système d'exploitation conserve toujours son SID et son nom d'ordinateur.
    c:
      en: |
        A copy contains the same operating system data as the source AMI; copying does not generalize Windows.
      fr: |
        Une copie contient les mêmes données de système d'exploitation que l'AMI source ; la copie ne généralise pas Windows.
    d:
      en: |
        Renaming changes the computer name but not the SID, so the image is still not generalized.
      fr: |
        Le renommage change le nom d'ordinateur mais pas le SID : l'image n'est toujours pas généralisée.
references:
  - title: Create an Amazon EC2 AMI using Windows Sysprep
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-create-win-sysprep.html
