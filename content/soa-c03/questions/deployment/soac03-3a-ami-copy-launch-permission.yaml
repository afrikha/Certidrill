id: soac03-3a-ami-copy-launch-permission
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company shares an AMI in us-east-1 with account 333333333333, which launches instances from it successfully. The snapshots of the AMI are not encrypted. For a new deployment, an engineer copies the AMI to ap-southeast-2 in the owning account with the copy-image command, and the copy becomes available. Account 333333333333 cannot find or launch the AMI in ap-southeast-2.

    Which solution will allow account 333333333333 to launch instances from the AMI in ap-southeast-2?
  fr: |
    Une entreprise partage une AMI de us-east-1 avec le compte 333333333333, qui lance des instances à partir de celle-ci sans problème. Les instantanés de l'AMI ne sont pas chiffrés. Pour un nouveau déploiement, un ingénieur copie l'AMI dans ap-southeast-2, dans le compte propriétaire, avec la commande copy-image, et la copie devient disponible. Le compte 333333333333 ne trouve pas l'AMI dans ap-southeast-2 et ne peut pas la lancer.

    Quelle solution permet au compte 333333333333 de lancer des instances à partir de l'AMI dans ap-southeast-2 ?
body:
  options:
    - { id: a, text: { en: "Copy the AMI again with the option to copy tags, so that the launch permissions are copied with the tags.", fr: "Copier de nouveau l'AMI avec l'option de copie des balises, pour que les autorisations de lancement soient copiées avec les balises." } }
    - { id: b, text: { en: "Add a launch permission for account 333333333333 to the new AMI ID in ap-southeast-2.", fr: "Ajouter une autorisation de lancement pour le compte 333333333333 au nouvel ID d'AMI dans ap-southeast-2." } }
    - { id: c, text: { en: "In account 333333333333, accept the AMI share in the AWS RAM console in ap-southeast-2.", fr: "Dans le compte 333333333333, accepter le partage de l'AMI dans la console AWS RAM de ap-southeast-2." } }
    - { id: d, text: { en: "Wait for AWS to apply the launch permissions of the source AMI to the copy, which can take up to 24 hours.", fr: "Attendre qu'AWS applique à la copie les autorisations de lancement de l'AMI source, ce qui peut prendre jusqu'à 24 heures." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A copied AMI is a new AMI with its own ID in the destination Region, and AWS does not copy launch permissions from the source AMI. After the copy completes, the owner must grant launch permission on the new AMI to the account that needs it.
    fr: |
      Une AMI copiée est une nouvelle AMI avec son propre ID dans la Région de destination, et AWS ne copie pas les autorisations de lancement de l'AMI source. Une fois la copie terminée, le propriétaire doit accorder sur la nouvelle AMI l'autorisation de lancement au compte qui en a besoin.
  options:
    a:
      en: |
        Copying tags copies user-defined tags only; launch permissions are not tags and are never copied.
      fr: |
        La copie des balises ne copie que les balises définies par l'utilisateur ; les autorisations de lancement ne sont pas des balises et ne sont jamais copiées.
    c:
      en: |
        AMI sharing with a specific account is done with launch permissions, not with an AWS RAM invitation to accept.
      fr: |
        Le partage d'une AMI avec un compte précis se fait avec des autorisations de lancement, pas avec une invitation AWS RAM à accepter.
    d:
      en: |
        No such propagation exists: the copy keeps no launch permissions until the owner adds them.
      fr: |
        Aucune propagation de ce type n'existe : la copie n'a aucune autorisation de lancement tant que le propriétaire ne les ajoute pas.
references:
  - title: Copy an Amazon EC2 AMI
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/CopyingAMIs.html
  - title: Share an AMI with specific AWS accounts
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sharingamis-explicit.html
