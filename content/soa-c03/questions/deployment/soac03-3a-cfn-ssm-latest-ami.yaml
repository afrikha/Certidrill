id: soac03-3a-cfn-ssm-latest-ami
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CloudFormation template launches Amazon EC2 instances that run Amazon Linux 2023, and it is deployed in eight Regions. Today, a Mappings section lists one AMI ID for each Region, and engineers update the IDs by hand when new AMIs are released. The company wants each new stack to use the latest Amazon Linux 2023 AMI of its Region without maintaining AMI IDs in the template.

    Which solution will meet these requirements?
  fr: |
    Un modèle AWS CloudFormation lance des instances Amazon EC2 qui exécutent Amazon Linux 2023, et il est déployé dans huit Régions. Aujourd'hui, une section Mappings liste un ID d'AMI par Région, et les ingénieurs mettent à jour les ID à la main quand de nouvelles AMI sont publiées. L'entreprise souhaite que chaque nouvelle pile utilise la dernière AMI Amazon Linux 2023 de sa Région sans maintenir d'ID d'AMI dans le modèle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Declare an AMI parameter of type AWS::EC2::Image::Id, and pass the ID of the latest AMI of the Region at each deployment.", fr: "Déclarer un paramètre d'AMI de type AWS::EC2::Image::Id, et transmettre l'ID de la dernière AMI de la Région à chaque déploiement." } }
    - { id: b, text: { en: "Keep the Mappings section, and select the AMI ID of each Region with Fn::FindInMap and the AWS::Region pseudo parameter.", fr: "Conserver la section Mappings, et sélectionner l'ID d'AMI de chaque Région avec Fn::FindInMap et le pseudo-paramètre AWS::Region." } }
    - { id: c, text: { en: "Declare an AMI parameter of type String whose AllowedValues list the current Amazon Linux 2023 AMI IDs of the eight Regions.", fr: "Déclarer un paramètre d'AMI de type String dont les AllowedValues listent les ID actuels des AMI Amazon Linux 2023 des huit Régions." } }
    - { id: d, text: { en: "Declare an AMI parameter of type `AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>` that defaults to the public Amazon Linux 2023 AMI parameter.", fr: "Déclarer un paramètre d'AMI de type `AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>` dont la valeur par défaut est le paramètre public de l'AMI Amazon Linux 2023." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AWS publishes the latest Amazon Linux 2023 AMI IDs as public Systems Manager parameters, such as /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64. A template parameter of this SSM parameter type resolves the parameter name to the current AMI ID of the stack's Region when the stack is created or updated, so the template contains no AMI ID.
    fr: |
      AWS publie les ID des dernières AMI Amazon Linux 2023 sous forme de paramètres Systems Manager publics, comme /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64. Un paramètre de modèle de ce type de paramètre SSM résout le nom du paramètre en ID de l'AMI actuelle de la Région de la pile lors de la création ou de la mise à jour de la pile : le modèle ne contient aucun ID d'AMI.
  options:
    a:
      en: |
        This type only validates an AMI ID; someone must still look up and pass the latest ID for each Region.
      fr: |
        Ce type ne fait que valider un ID d'AMI ; quelqu'un doit toujours rechercher et transmettre le dernier ID pour chaque Région.
    b:
      en: |
        The mapping still contains AMI IDs that must be updated by hand.
      fr: |
        Le mappage contient toujours des ID d'AMI qu'il faut mettre à jour à la main.
    c:
      en: |
        The allowed values are AMI IDs that must be maintained in the template.
      fr: |
        Les valeurs autorisées sont des ID d'AMI qu'il faut maintenir dans le modèle.
references:
  - title: AL2023 on Amazon EC2
    url: https://docs.aws.amazon.com/linux/al2023/ug/ec2.html
