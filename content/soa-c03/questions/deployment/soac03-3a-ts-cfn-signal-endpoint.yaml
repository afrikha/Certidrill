id: soac03-3a-ts-cfn-signal-endpoint
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS CloudFormation template launches an Amazon EC2 instance in a private subnet of a VPC in us-east-1, with a CreationPolicy that waits for one signal. The VPC has no internet gateway and no NAT gateway. The user data installs software from an internal repository and then runs /opt/aws/bin/cfn-signal with the --stack, --resource and --region options. The installation succeeds, but the stack rolls back after the timeout, and the instance logs show a connection timeout to cloudformation.us-east-1.amazonaws.com.

    Which solution will fix the deployment without giving the instance internet access?
  fr: |
    Un modèle AWS CloudFormation lance une instance Amazon EC2 dans un sous-réseau privé d'un VPC de us-east-1, avec une CreationPolicy qui attend un signal. Le VPC n'a ni passerelle Internet ni passerelle NAT. Les données utilisateur installent un logiciel depuis un référentiel interne puis exécutent /opt/aws/bin/cfn-signal avec les options --stack, --resource et --region. L'installation réussit, mais la pile est restaurée après le délai d'expiration, et les journaux de l'instance montrent une expiration de connexion vers cloudformation.us-east-1.amazonaws.com.

    Quelle solution permet de corriger le déploiement sans donner à l'instance un accès à Internet ?
body:
  options:
    - { id: a, text: { en: "Create a gateway VPC endpoint for Amazon S3, and associate it with the route table of the private subnet.", fr: "Créer un point de terminaison de passerelle pour Amazon S3, et l'associer à la table de routage du sous-réseau privé." } }
    - { id: b, text: { en: "Increase the Timeout of the CreationPolicy to PT1H so that the signal has more time to arrive.", fr: "Augmenter le Timeout de la CreationPolicy à PT1H pour que le signal ait plus de temps pour arriver." } }
    - { id: c, text: { en: "Create an interface VPC endpoint for com.amazonaws.us-east-1.cloudformation with private DNS enabled.", fr: "Créer un point de terminaison d'interface pour com.amazonaws.us-east-1.cloudformation avec le DNS privé activé." } }
    - { id: d, text: { en: "Create interface VPC endpoints for ssm, ssmmessages and ec2messages with private DNS enabled.", fr: "Créer des points de terminaison d'interface pour ssm, ssmmessages et ec2messages avec le DNS privé activé." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With --stack and --resource, cfn-signal calls the CloudFormation API, which the instance cannot reach. An interface endpoint for com.amazonaws.us-east-1.cloudformation with private DNS lets the default Regional name resolve to the endpoint, and its security group must allow port 443 from the private subnet.
    fr: |
      Avec --stack et --resource, cfn-signal appelle l'API CloudFormation, que l'instance ne peut pas atteindre. Un point de terminaison d'interface pour com.amazonaws.us-east-1.cloudformation avec le DNS privé permet de résoudre le nom régional par défaut vers le point de terminaison, et son groupe de sécurité doit autoriser le port 443 depuis le sous-réseau privé.
  options:
    a:
      en: |
        CloudFormation's S3 response buckets are used by custom resources and wait condition handles; the logs show that cfn-signal tries to reach the CloudFormation endpoint.
      fr: |
        Les compartiments S3 de réponse de CloudFormation servent aux ressources personnalisées et aux handles de conditions d'attente ; les journaux montrent que cfn-signal tente d'atteindre le point de terminaison CloudFormation.
    b:
      en: |
        The signal never arrives because of the network, so a longer timeout only delays the rollback.
      fr: |
        Le signal n'arrive jamais à cause du réseau : un délai plus long ne fait que retarder la restauration.
    d:
      en: |
        Systems Manager endpoints do not provide access to the CloudFormation API.
      fr: |
        Les points de terminaison de Systems Manager ne donnent pas accès à l'API CloudFormation.
references:
  - title: Access CloudFormation using an interface endpoint (AWS PrivateLink)
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/vpc-interface-endpoints.html
  - title: CreationPolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-attribute-creationpolicy.html
