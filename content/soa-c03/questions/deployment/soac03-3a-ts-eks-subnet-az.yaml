id: soac03-3a-ts-eks-subnet-az
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon EKS cluster was created with two subnets, in us-west-2a and us-west-2b. These subnets are running out of IP addresses for the network interfaces that Amazon EKS uses. An engineer updates the cluster configuration to add a new subnet that has many free addresses in us-west-2c, but the update fails.

    What should the engineer do?
  fr: |
    Un cluster Amazon EKS a été créé avec deux sous-réseaux, dans us-west-2a et us-west-2b. Ces sous-réseaux manquent d'adresses IP pour les interfaces réseau qu'utilise Amazon EKS. Un ingénieur met à jour la configuration du cluster pour ajouter un nouveau sous-réseau de us-west-2c qui compte de nombreuses adresses libres, mais la mise à jour échoue.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Add new subnets that have free addresses in us-west-2a and us-west-2b, the Availability Zones used at cluster creation.", fr: "Ajouter de nouveaux sous-réseaux ayant des adresses libres dans us-west-2a et us-west-2b, les zones de disponibilité utilisées à la création du cluster." } }
    - { id: b, text: { en: "Associate an IPv6 CIDR block with the VPC, and then change the IP family of the cluster to IPv6 to get more addresses.", fr: "Associer un bloc CIDR IPv6 au VPC, puis changer la famille d'adresses IP du cluster en IPv6 pour obtenir plus d'adresses." } }
    - { id: c, text: { en: "Remove one of the original subnets from the cluster, and add the us-west-2c subnet in the same configuration update.", fr: "Retirer l'un des sous-réseaux d'origine du cluster, et ajouter le sous-réseau de us-west-2c dans la même mise à jour de configuration." } }
    - { id: d, text: { en: "Wait up to one hour for the control plane to recognize the new subnet, and then run the same update again.", fr: "Attendre jusqu'à une heure que le plan de contrôle reconnaisse le nouveau sous-réseau, puis relancer la même mise à jour." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Amazon EKS lets you change the subnets of a cluster, but all subnets that you add must be in the same set of Availability Zones that was provided at cluster creation. New subnets with free addresses in us-west-2a and us-west-2b, created from free space or from a secondary CIDR block of the VPC, solve the shortage.
    fr: |
      Amazon EKS permet de changer les sous-réseaux d'un cluster, mais tous les sous-réseaux ajoutés doivent appartenir au même ensemble de zones de disponibilité que celui fourni à la création du cluster. De nouveaux sous-réseaux avec des adresses libres dans us-west-2a et us-west-2b, créés dans l'espace libre ou dans un bloc CIDR secondaire du VPC, résolvent la pénurie.
  options:
    b:
      en: |
        The IP family of an EKS cluster cannot be changed after the cluster is created.
      fr: |
        La famille d'adresses IP d'un cluster EKS ne peut pas être modifiée après sa création.
    c:
      en: |
        The us-west-2c subnet is still outside the cluster's original Availability Zones, so the update still fails.
      fr: |
        Le sous-réseau de us-west-2c reste en dehors des zones de disponibilité d'origine du cluster : la mise à jour échoue toujours.
    d:
      en: |
        The delay of up to one hour applies to a CIDR block newly associated with the VPC; it does not lift the Availability Zone rule.
      fr: |
        Le délai pouvant aller jusqu'à une heure concerne un bloc CIDR nouvellement associé au VPC ; il ne lève pas la règle des zones de disponibilité.
references:
  - title: View Amazon EKS networking requirements for VPC and subnets
    url: https://docs.aws.amazon.com/eks/latest/userguide/network-reqs.html
