id: soac03-3b-ss-soft-failure
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An operations team deploys an AWS CloudFormation StackSet to 200 accounts in one Region with MaxConcurrentCount set to 10 and FailureToleranceCount set to 0. The operation processes only one account at a time and takes several hours. The team wants the operation to run in up to 10 accounts at the same time, and FailureToleranceCount must stay at 0.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'exploitation déploie un StackSet AWS CloudFormation dans 200 comptes d'une Région avec MaxConcurrentCount défini à 10 et FailureToleranceCount défini à 0. L'opération ne traite qu'un compte à la fois et dure plusieurs heures. L'équipe veut que l'opération s'exécute dans 10 comptes au plus en même temps, et FailureToleranceCount doit rester à 0.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the ConcurrencyMode operation preference to SOFT_FAILURE_TOLERANCE.", fr: "Définir la préférence d'opération ConcurrencyMode à SOFT_FAILURE_TOLERANCE." } }
    - { id: b, text: { en: "Set the RegionConcurrencyType operation preference to PARALLEL.", fr: "Définir la préférence d'opération RegionConcurrencyType à PARALLEL." } }
    - { id: c, text: { en: "Replace MaxConcurrentCount with a MaxConcurrentPercentage of 5.", fr: "Remplacer MaxConcurrentCount par un MaxConcurrentPercentage de 5." } }
    - { id: d, text: { en: "Activate managed execution on the StackSet.", fr: "Activer l'exécution gérée (managed execution) sur le StackSet." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In the default STRICT_FAILURE_TOLERANCE mode, the actual concurrency starts at the lower of MaxConcurrentCount and FailureToleranceCount + 1, which is 1 here. SOFT_FAILURE_TOLERANCE decouples the two settings, so the operation runs at the MaxConcurrentCount level while keeping the failure tolerance."
    fr: "Dans le mode STRICT_FAILURE_TOLERANCE par défaut, la simultanéité réelle démarre à la plus petite valeur entre MaxConcurrentCount et FailureToleranceCount + 1, soit 1 ici. SOFT_FAILURE_TOLERANCE dissocie les deux paramètres : l'opération s'exécute au niveau de MaxConcurrentCount tout en conservant la tolérance aux pannes."
  options:
    b:
      en: "Region concurrency applies across Regions; with a single Region, accounts are still processed one at a time."
      fr: "La simultanéité des Régions s'applique entre Régions ; avec une seule Région, les comptes sont toujours traités un par un."
    c:
      en: "A percentage is subject to the same strict-mode cap of FailureToleranceCount + 1, so concurrency stays at 1."
      fr: "Un pourcentage est soumis au même plafond FailureToleranceCount + 1 du mode strict : la simultanéité reste à 1."
    d:
      en: "Managed execution runs separate non-conflicting operations concurrently; it does not change the concurrency inside one operation."
      fr: "L'exécution gérée exécute simultanément des opérations distinctes sans conflit ; elle ne change pas la simultanéité au sein d'une opération."
references:
  - title: StackSetOperationPreferences
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_StackSetOperationPreferences.html
