id: soac03-3c-eb-target-dlq
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EventBridge rule on a custom event bus sends order events to an AWS Lambda function. After an engineer replaced the resource-based policy of the function by mistake, the FailedInvocations metric of the rule increased for 2 hours, the function was never invoked, and the events of that period were lost. The company wants events that EventBridge cannot deliver to the target to be kept so that they can be processed after the issue is fixed.

    Which solution will meet these requirements?
  fr: |
    Une règle Amazon EventBridge sur un bus d'événements personnalisé envoie des événements de commande à une fonction AWS Lambda. Après qu'un ingénieur a remplacé par erreur la politique basée sur les ressources de la fonction, la métrique FailedInvocations de la règle a augmenté pendant 2 heures, la fonction n'a jamais été invoquée, et les événements de cette période ont été perdus. L'entreprise veut que les événements qu'EventBridge ne parvient pas à livrer à la cible soient conservés afin de pouvoir les traiter une fois le problème corrigé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure an Amazon SQS standard queue as the dead-letter queue of the rule target, and allow EventBridge to send messages to it.", fr: "Configurer une file d'attente Amazon SQS standard comme file d'attente de lettres mortes de la cible de la règle, et autoriser EventBridge à y envoyer des messages." } }
    - { id: b, text: { en: "Configure an on-failure destination for the asynchronous invocations of the function that sends records to an Amazon SQS queue.", fr: "Configurer pour les invocations asynchrones de la fonction une destination en cas d'échec qui envoie les enregistrements vers une file d'attente Amazon SQS." } }
    - { id: c, text: { en: "Set the retry policy of the rule target to a maximum event age of 24 hours and 185 retry attempts.", fr: "Définir la politique de nouvelles tentatives de la cible de la règle sur un âge maximal d'événement de 24 heures et 185 nouvelles tentatives." } }
    - { id: d, text: { en: "Configure an Amazon SQS FIFO queue as the dead-letter queue of the rule target, and allow EventBridge to send messages to it.", fr: "Configurer une file d'attente Amazon SQS FIFO comme file d'attente de lettres mortes de la cible de la règle, et autoriser EventBridge à y envoyer des messages." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A dead-letter queue on a rule target stores the events that EventBridge could not deliver, with attributes such as the rule ARN, the target ARN and the error code. For errors such as missing permissions to the target, EventBridge does not retry and sends the events directly to the dead-letter queue. When the queue is set with the API, the queue policy must allow EventBridge to send messages.
    fr: |
      Une file d'attente de lettres mortes sur une cible de règle stocke les événements qu'EventBridge n'a pas pu livrer, avec des attributs comme l'ARN de la règle, l'ARN de la cible et le code d'erreur. Pour des erreurs comme l'absence d'autorisations sur la cible, EventBridge ne fait pas de nouvelle tentative et envoie directement les événements à la file d'attente de lettres mortes. Lorsque la file d'attente est définie avec l'API, sa politique doit autoriser EventBridge à envoyer des messages.
  options:
    b:
      en: |
        A Lambda destination records invocations that the function received and failed to process; here the function was never invoked, so no record is created.
      fr: |
        Une destination Lambda enregistre les invocations que la fonction a reçues et n'a pas pu traiter ; ici, la fonction n'a jamais été invoquée : aucun enregistrement n'est créé.
    c:
      en: |
        These values are already the defaults, permission errors are not retried, and events are dropped once delivery fails without a dead-letter queue.
      fr: |
        Ces valeurs sont déjà celles par défaut, les erreurs d'autorisation ne donnent pas lieu à de nouvelles tentatives, et les événements sont abandonnés en cas d'échec de livraison sans file d'attente de lettres mortes.
    d:
      en: |
        EventBridge supports only standard queues as dead-letter queues; a FIFO queue cannot be used.
      fr: |
        EventBridge ne prend en charge que les files d'attente standard comme files d'attente de lettres mortes ; une file d'attente FIFO ne peut pas être utilisée.
references:
  - title: Using dead-letter queues to process undelivered events in EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rule-dlq.html
  - title: How EventBridge retries delivering events
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rule-retry-policy.html
