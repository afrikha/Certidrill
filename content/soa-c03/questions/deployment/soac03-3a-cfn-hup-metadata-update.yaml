id: soac03-3a-cfn-hup-metadata-update
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon EC2 instances that run a long-lived application are defined in an AWS CloudFormation stack. At launch, cfn-init configures each instance from the AWS::CloudFormation::Init metadata. When engineers update the metadata to change a configuration file, the stack update completes, but the running instances keep the old file. The company wants the running instances to apply metadata changes after each stack update, without being replaced.

    Which solution will meet these requirements?
  fr: |
    Des instances Amazon EC2 qui exécutent une application de longue durée sont définies dans une pile AWS CloudFormation. Au lancement, cfn-init configure chaque instance à partir des métadonnées AWS::CloudFormation::Init. Lorsque les ingénieurs mettent à jour les métadonnées pour changer un fichier de configuration, la mise à jour de la pile aboutit, mais les instances en cours d'exécution conservent l'ancien fichier. L'entreprise souhaite que les instances en cours d'exécution appliquent les modifications des métadonnées après chaque mise à jour de pile, sans être remplacées.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Move the configuration commands into the user data of the instances, because user data runs again after each stack update.", fr: "Déplacer les commandes de configuration dans les données utilisateur des instances, car les données utilisateur s'exécutent de nouveau après chaque mise à jour de pile." } }
    - { id: b, text: { en: "Add a CreationPolicy with a ResourceSignal to the instances so that they receive the updated metadata.", fr: "Ajouter aux instances une CreationPolicy avec un ResourceSignal pour qu'elles reçoivent les métadonnées mises à jour." } }
    - { id: c, text: { en: "Place the instances in an Auto Scaling group with an AutoScalingRollingUpdate update policy that replaces them in batches.", fr: "Placer les instances dans un groupe Auto Scaling avec une politique de mise à jour AutoScalingRollingUpdate qui les remplace par lots." } }
    - { id: d, text: { en: "Run cfn-hup on the instances with a post.update hook that runs cfn-init when the Init metadata changes.", fr: "Exécuter cfn-hup sur les instances avec un hook post.update qui lance cfn-init quand les métadonnées Init changent." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      cfn-hup is a daemon that detects changes in resource metadata and runs user-specified actions, by default checking every 15 minutes. A hook with triggers=post.update on the AWS::CloudFormation::Init path runs cfn-init again, so the running instances apply the new configuration without replacement.
    fr: |
      cfn-hup est un démon qui détecte les modifications des métadonnées d'une ressource et exécute des actions définies par l'utilisateur, avec une vérification toutes les 15 minutes par défaut. Un hook avec triggers=post.update sur le chemin AWS::CloudFormation::Init relance cfn-init : les instances en cours d'exécution appliquent la nouvelle configuration sans être remplacées.
  options:
    a:
      en: |
        By default, user data runs only at the first boot of an instance, not after stack updates.
      fr: |
        Par défaut, les données utilisateur ne s'exécutent qu'au premier démarrage d'une instance, pas après les mises à jour de pile.
    b:
      en: |
        A CreationPolicy only makes CloudFormation wait for signals when the resource is created; it does not push metadata changes.
      fr: |
        Une CreationPolicy fait seulement attendre des signaux à CloudFormation lors de la création de la ressource ; elle ne transmet pas les modifications des métadonnées.
    c:
      en: |
        A rolling update replaces the instances, which the requirements exclude.
      fr: |
        Une mise à jour propagée remplace les instances, ce que les exigences excluent.
references:
  - title: cfn-hup
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cfn-hup.html
