id: soac03-3b-tf-lock-timeout
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two AWS CodeBuild projects run Terraform against the same state in an Amazon S3 backend with use_lockfile = true. When both start close together, the second run fails at once with `Error acquiring the state lock` while the first run is still applying. The second run must wait up to 10 minutes for the lock and then continue, and state locking must stay in place.

    Which solution will meet these requirements?
  fr: |
    Deux projets AWS CodeBuild exécutent Terraform sur le même état dans un backend Amazon S3 avec use_lockfile = true. Lorsque les deux démarrent à peu d'intervalle, la seconde exécution échoue immédiatement avec `Error acquiring the state lock` alors que la première applique encore ses changements. La seconde exécution doit attendre le verrou jusqu'à 10 minutes puis continuer, et le verrouillage de l'état doit rester en place.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the -lock-timeout=10m option to the terraform plan and terraform apply commands.", fr: "Ajouter l'option -lock-timeout=10m aux commandes terraform plan et terraform apply." } }
    - { id: b, text: { en: "Run terraform force-unlock at the start of every build before the plan and apply commands.", fr: "Exécuter terraform force-unlock au début de chaque build avant les commandes plan et apply." } }
    - { id: c, text: { en: "Add the -lock=false option to the terraform apply command of the second project.", fr: "Ajouter l'option -lock=false à la commande terraform apply du second projet." } }
    - { id: d, text: { en: "Add an S3 Lifecycle rule that expires objects ending in .tflock after 1 day.", fr: "Ajouter une règle de cycle de vie S3 qui fait expirer les objets se terminant par .tflock après 1 jour." } }
answer: { optionId: a }
explanation:
  correct:
    en: "By default, a run that cannot get the state lock fails immediately. The -lock-timeout option makes Terraform retry for the given duration, so the second run waits for the first one to release the lock while locking still prevents concurrent writes."
    fr: "Par défaut, une exécution qui ne peut pas obtenir le verrou de l'état échoue immédiatement. L'option -lock-timeout fait réessayer Terraform pendant la durée indiquée : la seconde exécution attend que la première libère le verrou, tandis que le verrouillage empêche toujours les écritures simultanées."
  options:
    b:
      en: "Forcing an unlock removes the lock of a run that is still applying, which allows the concurrent writes that locking prevents."
      fr: "Forcer le déverrouillage supprime le verrou d'une exécution encore en cours, ce qui permet les écritures simultanées que le verrouillage empêche."
    c:
      en: "Disabling locking lets both runs write the state at the same time."
      fr: "Désactiver le verrouillage laisse les deux exécutions écrire l'état en même temps."
    d:
      en: "Expiring lock objects does not make a run wait, and it can remove a lock that is still in use."
      fr: "Faire expirer les objets de verrou ne fait pas attendre une exécution et peut supprimer un verrou encore utilisé."
references:
  - title: Backend best practices
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/terraform-aws-provider-best-practices/backend.html
