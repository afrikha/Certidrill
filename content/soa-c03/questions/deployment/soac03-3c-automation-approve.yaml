id: soac03-3c-automation-approve
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team runs a custom AWS Systems Manager Automation runbook that fails over a production database and then restarts the application servers. Before the failover step runs, at least two of the three on-call managers must approve the execution, and the managers must receive the approval request by email.

    Which runbook change will meet these requirements?
  fr: |
    Une équipe d'exploitation exécute un runbook AWS Systems Manager Automation personnalisé qui bascule une base de données de production, puis redémarre les serveurs d'applications. Avant l'étape de basculement, au moins deux des trois responsables d'astreinte doivent approuver l'exécution, et les responsables doivent recevoir la demande d'approbation par e-mail.

    Quelle modification du runbook répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an aws:pause step before the failover step, and ask the managers to resume the automation from the Systems Manager console.", fr: "Ajouter une étape aws:pause avant l'étape de basculement, et demander aux responsables de reprendre l'automatisation depuis la console Systems Manager." } }
    - { id: b, text: { en: "Add an aws:approve step with the three managers as Approvers, MinRequiredApprovals set to 2, and an Amazon SNS topic as NotificationArn.", fr: "Ajouter une étape aws:approve avec les trois responsables comme Approvers, MinRequiredApprovals défini sur 2 et une rubrique Amazon SNS comme NotificationArn." } }
    - { id: c, text: { en: "Add an aws:sleep step before the failover step, and ask the managers to cancel the automation during the wait if they disagree.", fr: "Ajouter une étape aws:sleep avant l'étape de basculement, et demander aux responsables d'annuler l'automatisation pendant l'attente s'ils ne sont pas d'accord." } }
    - { id: d, text: { en: "Add an aws:waitForAwsResourceProperty step that waits until two managers have set an approval tag on the database instance.", fr: "Ajouter une étape aws:waitForAwsResourceProperty qui attend que deux responsables aient défini une balise d'approbation sur l'instance de base de données." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The aws:approve action pauses the automation until the listed principals approve or reject it, and MinRequiredApprovals sets how many approvals are needed to resume. NotificationArn sends the request to an Amazon SNS topic, whose name must start with Automation, and an email subscription delivers it to the managers. Each decision is recorded in the step outputs."
    fr: "L'action aws:approve met l'automatisation en pause jusqu'à ce que les principaux indiqués l'approuvent ou la rejettent, et MinRequiredApprovals définit le nombre d'approbations nécessaires pour reprendre. NotificationArn envoie la demande à une rubrique Amazon SNS, dont le nom doit commencer par Automation, et un abonnement par e-mail la remet aux responsables. Chaque décision est enregistrée dans les sorties de l'étape."
  options:
    a:
      en: "aws:pause waits for a Resume signal from anyone allowed to send it; it neither notifies the managers nor counts two approvals."
      fr: "aws:pause attend un signal Resume de toute personne autorisée à l'envoyer ; elle ne prévient pas les responsables et ne compte pas deux approbations."
    c:
      en: "aws:sleep continues automatically after the delay, so the failover runs even if nobody approves."
      fr: "aws:sleep reprend automatiquement après le délai : le basculement s'exécute même si personne n'approuve."
    d:
      en: "A tag cannot record which managers approved or require two distinct approvers, and nobody is notified by email."
      fr: "Une balise ne peut pas indiquer quels responsables ont approuvé ni exiger deux approbateurs distincts, et personne n'est prévenu par e-mail."
references:
  - title: aws:approve – Pause an automation for manual approval
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-approve.html
  - title: aws:pause – Pause an automation
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-pause.html
