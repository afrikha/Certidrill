id: soac03-3b-ecs-blue-green-bake
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon ECS service on AWS Fargate runs behind an Application Load Balancer and uses the ECS deployment controller with rolling updates. For each release, the new revision must run at full size next to the current one and be tested through a test listener by an AWS Lambda function before it receives production traffic. Production traffic must then move all at once, and the previous revision must keep running for 20 minutes for an immediate rollback. The company does not want to use AWS CodeDeploy.

    Which solution will meet these requirements?
  fr: |
    Un service Amazon ECS sur AWS Fargate s'exécute derrière un Application Load Balancer et utilise le contrôleur de déploiement ECS avec des mises à jour propagées. Pour chaque version, la nouvelle révision doit s'exécuter à pleine taille à côté de la révision actuelle et être testée via un écouteur de test par une fonction AWS Lambda avant de recevoir le trafic de production. Le trafic de production doit ensuite basculer en une seule fois, et la révision précédente doit continuer à s'exécuter pendant 20 minutes pour permettre un retour arrière immédiat. L'entreprise ne veut pas utiliser AWS CodeDeploy.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the rolling update strategy, set maximumPercent to 200, and turn on the deployment circuit breaker with rollback.", fr: "Conserver la stratégie de mise à jour propagée, définir maximumPercent à 200, et activer le disjoncteur de déploiement avec retour arrière." } }
    - { id: b, text: { en: "Change the deployment controller to CODE_DEPLOY and use the CodeDeployDefault.ECSAllAtOnce configuration.", fr: "Passer le contrôleur de déploiement à CODE_DEPLOY et utiliser la configuration CodeDeployDefault.ECSAllAtOnce." } }
    - { id: c, text: { en: "Set the deployment strategy to BLUE_GREEN with bakeTimeInMinutes set to 20, and add a Lambda lifecycle hook that tests the new revision.", fr: "Définir la stratégie de déploiement à BLUE_GREEN avec bakeTimeInMinutes défini à 20, et ajouter un hook de cycle de vie Lambda qui teste la nouvelle révision." } }
    - { id: d, text: { en: "Set the deployment strategy to CANARY so that 10% of production traffic tests the new revision for 20 minutes.", fr: "Définir la stratégie de déploiement à CANARY pour que 10 % du trafic de production teste la nouvelle révision pendant 20 minutes." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon ECS blue/green deployments run the green revision next to the blue one with the ECS deployment controller, without CodeDeploy. Lambda lifecycle hooks can run tests at deployment stages such as the test traffic shift, production traffic then moves to green, and the bake time keeps blue running so the deployment can revert quickly."
    fr: "Les déploiements bleu/vert d'Amazon ECS exécutent la révision verte à côté de la bleue avec le contrôleur de déploiement ECS, sans CodeDeploy. Des hooks de cycle de vie Lambda peuvent exécuter des tests à des étapes du déploiement comme le basculement du trafic de test, le trafic de production passe ensuite au vert, et le temps de stabilisation (bake time) garde le bleu en marche pour revenir rapidement en arrière."
  options:
    a:
      en: "A rolling update replaces tasks gradually, with no test listener stage and no previous revision kept after the deployment."
      fr: "Une mise à jour propagée remplace les tâches progressivement, sans étape d'écouteur de test et sans conserver la révision précédente après le déploiement."
    b:
      en: "The CODE_DEPLOY controller uses AWS CodeDeploy, which the company does not want."
      fr: "Le contrôleur CODE_DEPLOY utilise AWS CodeDeploy, ce que l'entreprise ne veut pas."
    d:
      en: "A canary sends part of the production traffic to the new revision before full validation instead of moving it all at once."
      fr: "Un canary envoie une partie du trafic de production à la nouvelle révision avant la validation complète au lieu de tout basculer en une fois."
references:
  - title: Amazon ECS blue/green deployments
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-blue-green.html
  - title: DeploymentConfiguration
    url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_DeploymentConfiguration.html
