id: soac03-3c-hybrid-activation
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to use Run Command and Patch Manager on 50 Linux servers in its on-premises data center. The servers can reach the AWS public endpoints over HTTPS.

    Which solution will make the servers AWS Systems Manager managed nodes?
  fr: |
    Une entreprise veut utiliser Run Command et Patch Manager sur 50 serveurs Linux de son centre de données sur site. Les serveurs peuvent joindre les points de terminaison publics d'AWS en HTTPS.

    Quelle solution fait de ces serveurs des nœuds gérés AWS Systems Manager ?
body:
  options:
    - { id: a, text: { en: "Activate Default Host Management Configuration in the Region, and install SSM Agent on the servers.", fr: "Activer Default Host Management Configuration dans la Région, et installer SSM Agent sur les serveurs." } }
    - { id: b, text: { en: "Create a hybrid activation with an IAM service role, and install SSM Agent on the servers with the activation code and ID.", fr: "Créer une activation hybride avec un rôle de service IAM, et installer SSM Agent sur les serveurs avec le code et l'ID d'activation." } }
    - { id: c, text: { en: "Create an instance profile with AmazonSSMManagedInstanceCore, and reference it in the SSM Agent configuration file.", fr: "Créer un profil d'instance avec AmazonSSMManagedInstanceCore, et le référencer dans le fichier de configuration de SSM Agent." } }
    - { id: d, text: { en: "Install the CloudWatch agent with the access keys of an IAM user, and register the servers in Fleet Manager.", fr: "Installer l'agent CloudWatch avec les clés d'accès d'un utilisateur IAM, et inscrire les serveurs dans Fleet Manager." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A hybrid activation registers machines that are not EC2 instances, such as on-premises servers, as managed nodes. It uses an IAM service role that trusts ssm.amazonaws.com and returns an activation code and ID that you supply when you install SSM Agent. After registration, each server gets a managed node ID that starts with mi-."
    fr: "Une activation hybride inscrit comme nœuds gérés des machines qui ne sont pas des instances EC2, comme des serveurs sur site. Elle utilise un rôle de service IAM qui approuve ssm.amazonaws.com et renvoie un code et un ID d'activation à fournir lors de l'installation de SSM Agent. Après l'inscription, chaque serveur reçoit un ID de nœud géré qui commence par mi-."
  options:
    a:
      en: "Default Host Management Configuration applies only to Amazon EC2 instances in the account and Region."
      fr: "Default Host Management Configuration ne s'applique qu'aux instances Amazon EC2 du compte et de la Région."
    c:
      en: "Instance profiles can be attached only to EC2 instances; on-premises servers need a hybrid activation."
      fr: "Les profils d'instance ne peuvent être attachés qu'à des instances EC2 ; les serveurs sur site ont besoin d'une activation hybride."
    d:
      en: "The CloudWatch agent sends metrics and logs; it does not register servers with Systems Manager, and long-term access keys are not needed."
      fr: "L'agent CloudWatch envoie des métriques et des journaux ; il n'inscrit pas les serveurs auprès de Systems Manager, et des clés d'accès à long terme ne sont pas nécessaires."
references:
  - title: Create a hybrid activation to register nodes with Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/hybrid-activation-managed-nodes.html
