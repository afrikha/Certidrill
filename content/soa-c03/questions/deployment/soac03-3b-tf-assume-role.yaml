id: soac03-3b-tf-assume-role
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Terraform runs on an Amazon EC2 instance in a tooling account and uses the IAM role of the instance profile. It must now deploy resources in three workload accounts. The company does not allow long-term access keys, and AWS CloudTrail in each workload account must show which pipeline made each change.

    Which solution will meet these requirements?
  fr: |
    Terraform s'exécute sur une instance Amazon EC2 d'un compte d'outillage et utilise le rôle IAM du profil d'instance. Il doit maintenant déployer des ressources dans trois comptes de charge de travail. L'entreprise n'autorise pas les clés d'accès à long terme, et AWS CloudTrail dans chaque compte de charge de travail doit indiquer quel pipeline a fait chaque modification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an IAM user with access keys in each workload account, and pass the keys to Terraform as environment variables.", fr: "Créer un utilisateur IAM avec des clés d'accès dans chaque compte de charge de travail, et passer les clés à Terraform comme variables d'environnement." } }
    - { id: b, text: { en: "Create a role in each workload account that trusts the tooling role, and use provider assume_role blocks with role_arn and session_name.", fr: "Créer dans chaque compte de charge de travail un rôle qui approuve le rôle d'outillage, et utiliser des blocs assume_role de fournisseur avec role_arn et session_name." } }
    - { id: c, text: { en: "Share the instance profile of the tooling account with the workload accounts by using AWS RAM.", fr: "Partager le profil d'instance du compte d'outillage avec les comptes de charge de travail à l'aide d'AWS RAM." } }
    - { id: d, text: { en: "Add the ARNs of the workload account resources to the identity policy of the tooling role, and keep a single provider configuration.", fr: "Ajouter les ARN des ressources des comptes de charge de travail à la politique d'identité du rôle d'outillage, et garder une seule configuration de fournisseur." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Each provider configuration can assume a role in its target account with an assume_role block, which gives temporary credentials. CloudTrail records the session_name of the assumed-role session, so each workload account shows which pipeline or person ran Terraform."
    fr: "Chaque configuration de fournisseur peut endosser un rôle dans son compte cible avec un bloc assume_role, qui fournit des informations d'identification temporaires. CloudTrail enregistre le session_name de la session du rôle endossé : chaque compte de charge de travail indique quel pipeline ou quelle personne a exécuté Terraform."
  options:
    a:
      en: "IAM user access keys are long-term credentials, which the company does not allow."
      fr: "Les clés d'accès d'utilisateurs IAM sont des informations d'identification à long terme, que l'entreprise n'autorise pas."
    c:
      en: "Instance profiles and IAM roles are not resources that AWS RAM can share."
      fr: "Les profils d'instance et les rôles IAM ne sont pas des ressources qu'AWS RAM peut partager."
    d:
      en: "Cross-account access must also be granted in the target account, for example by a role trust policy; an identity policy in the tooling account alone is not enough."
      fr: "L'accès intercomptes doit aussi être accordé dans le compte cible, par exemple par une politique d'approbation de rôle ; une politique d'identité dans le compte d'outillage ne suffit pas."
references:
  - title: Security best practices
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/terraform-aws-provider-best-practices/security.html
