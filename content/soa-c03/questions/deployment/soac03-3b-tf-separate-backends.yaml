id: soac03-3b-tf-separate-backends
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps the Terraform state of its development, test, and production environments in one Amazon S3 bucket and separates them with Terraform workspaces. An engineer selected the wrong workspace and applied a development change to production. The company wants the strongest isolation for production state: most users must only read it, and only the deployment pipeline must write it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conserve l'état Terraform de ses environnements de développement, de test et de production dans un seul compartiment Amazon S3 et les sépare avec des espaces de travail (workspaces) Terraform. Un ingénieur a sélectionné le mauvais espace de travail et a appliqué un changement de développement en production. L'entreprise veut l'isolation la plus forte pour l'état de production : la plupart des utilisateurs doivent seulement le lire, et seul le pipeline de déploiement doit y écrire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the workspaces, and add a bucket policy that denies s3:DeleteObject on the production state key.", fr: "Conserver les espaces de travail, et ajouter une politique de compartiment qui refuse s3:DeleteObject sur la clé d'état de production." } }
    - { id: b, text: { en: "Keep the shared bucket, and store each environment's state under a different key prefix with its own IAM policy.", fr: "Conserver le compartiment partagé, et stocker l'état de chaque environnement sous un préfixe de clé différent avec sa propre politique IAM." } }
    - { id: c, text: { en: "Use a separate state bucket in each environment's own AWS account, with production writes limited to the pipeline role.", fr: "Utiliser un compartiment d'état distinct dans le compte AWS de chaque environnement, avec des écritures en production limitées au rôle du pipeline." } }
    - { id: d, text: { en: "Turn on S3 Versioning and MFA delete on the shared bucket, and keep the workspaces.", fr: "Activer S3 Versioning et la suppression MFA sur le compartiment partagé, et conserver les espaces de travail." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS guidance recommends distinct backends for each environment rather than shared workspaces, and the strongest isolation puts each environment and its state bucket in its own account. Production state can then be read-only for most users, with write access limited to the pipeline and break-glass roles."
    fr: "Les recommandations AWS préconisent des backends distincts pour chaque environnement plutôt que des espaces de travail partagés, et l'isolation la plus forte place chaque environnement et son compartiment d'état dans son propre compte. L'état de production peut alors être en lecture seule pour la plupart des utilisateurs, l'écriture étant limitée au pipeline et aux rôles d'urgence."
  options:
    a:
      en: "Users can still overwrite production state through the shared workspaces; denying deletion does not stop writes."
      fr: "Les utilisateurs peuvent toujours écraser l'état de production via les espaces de travail partagés ; refuser la suppression n'empêche pas les écritures."
    b:
      en: "Prefixes in one bucket give weaker isolation than separate backends in separate accounts."
      fr: "Des préfixes dans un même compartiment offrent une isolation plus faible que des backends distincts dans des comptes distincts."
    d:
      en: "Versioning and MFA delete help with recovery and deletion, but anyone with access can still write production state."
      fr: "La gestion des versions et la suppression MFA aident à la récupération et contre la suppression, mais toute personne ayant accès peut toujours écrire l'état de production."
references:
  - title: Backend best practices
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/terraform-aws-provider-best-practices/backend.html
