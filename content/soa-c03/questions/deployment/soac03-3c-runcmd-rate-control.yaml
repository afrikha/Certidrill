id: soac03-3c-runcmd-rate-control
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company must run a one-time configuration script on 400 Amazon EC2 instances that have the tag Role=web. All the instances are AWS Systems Manager managed nodes. To limit the impact of a faulty script, no more than 20 instances can run the script at the same time, and Systems Manager must stop sending the script to the remaining instances as soon as more than 5 instances report a failure.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit exécuter une seule fois un script de configuration sur 400 instances Amazon EC2 qui portent la balise Role=web. Toutes les instances sont des nœuds gérés AWS Systems Manager. Pour limiter l'impact d'un script défectueux, 20 instances au maximum peuvent exécuter le script en même temps, et Systems Manager doit cesser d'envoyer le script aux instances restantes dès que plus de 5 instances signalent un échec.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the script with Run Command, target the instances by tag, and keep the default concurrency and error threshold.", fr: "Exécuter le script avec Run Command, cibler les instances par balise et conserver la simultanéité et le seuil d'erreurs par défaut." } }
    - { id: b, text: { en: "Run the script with Run Command, target the instances by tag, and set --max-concurrency to 5 and --max-errors to 20.", fr: "Exécuter le script avec Run Command, cibler les instances par balise et définir --max-concurrency sur 5 et --max-errors sur 20." } }
    - { id: c, text: { en: "Run the script with Run Command, target the instances by tag, and set --max-concurrency to 20 and --max-errors to 5.", fr: "Exécuter le script avec Run Command, cibler les instances par balise et définir --max-concurrency sur 20 et --max-errors sur 5." } }
    - { id: d, text: { en: "Create a State Manager association that targets the tag and runs the script on a rate(30 minutes) schedule.", fr: "Créer une association State Manager qui cible la balise et exécute le script selon la planification rate(30 minutes)." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Run Command rate controls set how many targets run the command at the same time (--max-concurrency) and how many errors are allowed before Systems Manager stops sending the command to other targets (--max-errors). A value of 20 limits the run to 20 instances at a time, and a value of 5 stops sending when the sixth error arrives. Invocations that are already running are allowed to finish."
    fr: "Les contrôles de débit de Run Command définissent le nombre de cibles qui exécutent la commande en même temps (--max-concurrency) et le nombre d'erreurs autorisées avant que Systems Manager cesse d'envoyer la commande aux autres cibles (--max-errors). La valeur 20 limite l'exécution à 20 instances à la fois, et la valeur 5 arrête l'envoi à la sixième erreur. Les appels déjà en cours peuvent se terminer."
  options:
    a:
      en: "The defaults are a concurrency of 50 and an error threshold of 0, so up to 50 instances run at once and sending stops at the first error."
      fr: "Les valeurs par défaut sont une simultanéité de 50 et un seuil d'erreurs de 0 : jusqu'à 50 instances s'exécutent à la fois et l'envoi s'arrête à la première erreur."
    b:
      en: "The values are swapped: only 5 instances run at once, and up to 20 failures are tolerated instead of 5."
      fr: "Les valeurs sont inversées : seules 5 instances s'exécutent à la fois, et jusqu'à 20 échecs sont tolérés au lieu de 5."
    d:
      en: "An association runs the script again every 30 minutes and on new matching nodes, but the script must run only once, and no rate controls are set."
      fr: "Une association réexécute le script toutes les 30 minutes et sur les nouveaux nœuds correspondants, alors que le script ne doit s'exécuter qu'une fois, et aucun contrôle de débit n'est défini."
references:
  - title: Run commands at scale
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/send-commands-multiple.html
