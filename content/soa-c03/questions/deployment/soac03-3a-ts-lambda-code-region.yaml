id: soac03-3a-ts-lambda-code-region
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team deploys the same AWS CloudFormation template in us-east-1 and eu-west-1. An AWS::Lambda::Function resource references its deployment package with Code properties S3Bucket and S3Key that point to a bucket in us-east-1. The stack in us-east-1 succeeds, but the stack in eu-west-1 fails when it creates the function. The execution role and the bucket policy are correct.

    Which solution will resolve the issue?
  fr: |
    Une équipe déploie le même modèle AWS CloudFormation dans us-east-1 et eu-west-1. Une ressource AWS::Lambda::Function référence son package de déploiement avec les propriétés Code S3Bucket et S3Key, qui pointent vers un compartiment de us-east-1. La pile de us-east-1 réussit, mais celle de eu-west-1 échoue lors de la création de la fonction. Le rôle d'exécution et la politique de compartiment sont corrects.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Make the bucket public so that the Lambda service in eu-west-1 can download the deployment package.", fr: "Rendre le compartiment public pour que le service Lambda de eu-west-1 puisse télécharger le package de déploiement." } }
    - { id: b, text: { en: "Enable S3 Transfer Acceleration on the us-east-1 bucket so that eu-west-1 can download the package faster.", fr: "Activer S3 Transfer Acceleration sur le compartiment de us-east-1 pour que eu-west-1 télécharge le package plus vite." } }
    - { id: c, text: { en: "Add the Lambda service principal of eu-west-1 to the bucket policy of the us-east-1 bucket.", fr: "Ajouter le principal de service Lambda de eu-west-1 à la politique du compartiment de us-east-1." } }
    - { id: d, text: { en: "Copy the package to a bucket in eu-west-1, and point the eu-west-1 stack to that bucket with a parameter.", fr: "Copier le package dans un compartiment de eu-west-1, et faire pointer la pile de eu-west-1 vers ce compartiment avec un paramètre." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The S3Bucket of a Lambda deployment package must be in the same AWS Region as the function; it can be in another account. Each Region therefore needs a copy of the package in a local bucket, which a parameter or a mapping can select.
    fr: |
      Le S3Bucket d'un package de déploiement Lambda doit se trouver dans la même Région AWS que la fonction ; il peut appartenir à un autre compte. Chaque Région a donc besoin d'une copie du package dans un compartiment local, qu'un paramètre ou un mappage peut sélectionner.
  options:
    a:
      en: |
        Access is not the problem; the bucket is in a different Region from the function, and a public bucket exposes the code.
      fr: |
        L'accès n'est pas le problème ; le compartiment est dans une autre Région que la fonction, et un compartiment public expose le code.
    b:
      en: |
        Transfer Acceleration speeds up transfers to a bucket but does not change the Region of the bucket.
      fr: |
        Transfer Acceleration accélère les transferts vers un compartiment mais ne change pas sa Région.
    c:
      en: |
        The bucket policy is already correct; the Region requirement is not a permission.
      fr: |
        La politique de compartiment est déjà correcte ; l'exigence de Région n'est pas une question d'autorisation.
references:
  - title: FunctionCode
    url: https://docs.aws.amazon.com/lambda/latest/api/API_FunctionCode.html
