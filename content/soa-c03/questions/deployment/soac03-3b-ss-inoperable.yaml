id: soac03-3b-ss-inoperable
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An operator tried to remove one account from an AWS CloudFormation StackSet by running delete-stack-instances. The operation failed in that account, and list-stack-instances now shows the stack instance in the INOPERABLE status. Later StackSet updates skip this stack instance. The operator must remove the stack instance from the StackSet and then remove its stack from the account.

    Which solution will meet these requirements?
  fr: |
    Un opérateur a tenté de retirer un compte d'un StackSet AWS CloudFormation en exécutant delete-stack-instances. L'opération a échoué dans ce compte, et list-stack-instances affiche maintenant l'instance de pile à l'état INOPERABLE. Les mises à jour suivantes du StackSet ignorent cette instance de pile. L'opérateur doit retirer l'instance de pile du StackSet, puis supprimer sa pile du compte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run update-stack-set with --use-previous-template for that account so that the stack instance returns to CURRENT.", fr: "Exécuter update-stack-set avec --use-previous-template pour ce compte afin que l'instance de pile revienne à CURRENT." } }
    - { id: b, text: { en: "Run detect-stack-set-drift, and then delete the resources that are reported as drifted in the account.", fr: "Exécuter detect-stack-set-drift, puis supprimer dans le compte les ressources signalées comme dérivées." } }
    - { id: c, text: { en: "Run delete-stack-instances again with --retain-stacks for that account, and then delete the stack in the account.", fr: "Exécuter de nouveau delete-stack-instances avec --retain-stacks pour ce compte, puis supprimer la pile dans le compte." } }
    - { id: d, text: { en: "Run delete-stack-set, which removes inoperable stack instances before it deletes the StackSet.", fr: "Exécuter delete-stack-set, qui retire les instances de pile inopérantes avant de supprimer le StackSet." } }
answer: { optionId: c }
explanation:
  correct:
    en: "INOPERABLE means a DeleteStackInstances operation failed and left the stack unstable, so StackSet updates exclude it. The documented fix is to run DeleteStackInstances with RetainStacks set to true, which removes the instance from the StackSet, and then to delete the stack manually."
    fr: "INOPERABLE signifie qu'une opération DeleteStackInstances a échoué et a laissé la pile instable : les mises à jour du StackSet l'excluent. La correction documentée consiste à exécuter DeleteStackInstances avec RetainStacks défini à true, ce qui retire l'instance du StackSet, puis à supprimer la pile manuellement."
  options:
    a:
      en: "Inoperable stack instances are excluded from UpdateStackSet operations, so an update does not repair them."
      fr: "Les instances de pile inopérantes sont exclues des opérations UpdateStackSet : une mise à jour ne les répare pas."
    b:
      en: "Drift detection only reports differences; deleting resources by hand leaves the instance attached to the StackSet."
      fr: "La détection de dérive signale seulement des différences ; supprimer des ressources à la main laisse l'instance rattachée au StackSet."
    d:
      en: "A StackSet cannot be deleted while it still has stack instances, and the other accounts must keep their stacks."
      fr: "Un StackSet ne peut pas être supprimé tant qu'il a des instances de pile, et les autres comptes doivent garder leurs piles."
references:
  - title: StackSets concepts
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-concepts.html
