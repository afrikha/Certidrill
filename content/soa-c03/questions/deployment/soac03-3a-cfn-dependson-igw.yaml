id: soac03-3a-cfn-dependson-igw
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CloudFormation template contains the following resources. Stack creation sometimes fails on DefaultRoute because the internet gateway is not yet attached to the VPC when CloudFormation creates the route.

    ```yaml
    Resources:
      VPC:
        Type: AWS::EC2::VPC
        Properties:
          CidrBlock: 10.0.0.0/16
      InternetGateway:
        Type: AWS::EC2::InternetGateway
      GatewayAttachment:
        Type: AWS::EC2::VPCGatewayAttachment
        Properties:
          VpcId: !Ref VPC
          InternetGatewayId: !Ref InternetGateway
      PublicRouteTable:
        Type: AWS::EC2::RouteTable
        Properties:
          VpcId: !Ref VPC
      DefaultRoute:
        Type: AWS::EC2::Route
        Properties:
          RouteTableId: !Ref PublicRouteTable
          DestinationCidrBlock: 0.0.0.0/0
          GatewayId: !Ref InternetGateway
    ```

    Which change to the template will fix the problem?
  fr: |
    Un modèle AWS CloudFormation contient les ressources suivantes. La création de la pile échoue parfois sur DefaultRoute, car la passerelle Internet n'est pas encore attachée au VPC lorsque CloudFormation crée la route.

    ```yaml
    Resources:
      VPC:
        Type: AWS::EC2::VPC
        Properties:
          CidrBlock: 10.0.0.0/16
      InternetGateway:
        Type: AWS::EC2::InternetGateway
      GatewayAttachment:
        Type: AWS::EC2::VPCGatewayAttachment
        Properties:
          VpcId: !Ref VPC
          InternetGatewayId: !Ref InternetGateway
      PublicRouteTable:
        Type: AWS::EC2::RouteTable
        Properties:
          VpcId: !Ref VPC
      DefaultRoute:
        Type: AWS::EC2::Route
        Properties:
          RouteTableId: !Ref PublicRouteTable
          DestinationCidrBlock: 0.0.0.0/0
          GatewayId: !Ref InternetGateway
    ```

    Quelle modification du modèle permet de corriger le problème ?
body:
  options:
    - { id: a, text: { en: "Add DependsOn: InternetGateway to the DefaultRoute resource.", fr: "Ajouter DependsOn: InternetGateway à la ressource DefaultRoute." } }
    - { id: b, text: { en: "Add DependsOn: GatewayAttachment to the DefaultRoute resource.", fr: "Ajouter DependsOn: GatewayAttachment à la ressource DefaultRoute." } }
    - { id: c, text: { en: "Add DependsOn: DefaultRoute to the GatewayAttachment resource.", fr: "Ajouter DependsOn: DefaultRoute à la ressource GatewayAttachment." } }
    - { id: d, text: { en: "Add a CreationPolicy to the GatewayAttachment resource so that it signals when the attachment is complete.", fr: "Ajouter une CreationPolicy à la ressource GatewayAttachment pour qu'elle envoie un signal quand l'attachement est terminé." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The route references only the internet gateway, so CloudFormation can create it in parallel with the attachment. CloudFormation documents that routes that include the internet gateway, like public instances and Elastic IP addresses, depend on the VPC-gateway attachment and need an explicit DependsOn on it.
    fr: |
      La route ne référence que la passerelle Internet : CloudFormation peut donc la créer en parallèle de l'attachement. La documentation de CloudFormation indique que les routes qui incluent la passerelle Internet, comme les instances publiques et les adresses IP Elastic, dépendent de l'attachement VPC-passerelle et ont besoin d'un DependsOn explicite sur celui-ci.
  options:
    a:
      en: |
        The !Ref already creates a dependency on the gateway itself; the gateway can exist before it is attached to the VPC.
      fr: |
        Le !Ref crée déjà une dépendance sur la passerelle elle-même ; la passerelle peut exister avant d'être attachée au VPC.
    c:
      en: |
        This reverses the order: the attachment would wait for the route, which is the resource that fails.
      fr: |
        Cela inverse l'ordre : l'attachement attendrait la route, qui est justement la ressource en échec.
    d:
      en: |
        CreationPolicy is supported only on a few resource types, such as EC2 instances and Auto Scaling groups, and a gateway attachment sends no signals.
      fr: |
        CreationPolicy n'est prise en charge que par quelques types de ressources, comme les instances EC2 et les groupes Auto Scaling, et un attachement de passerelle n'envoie pas de signaux.
references:
  - title: DependsOn attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-dependson.html
