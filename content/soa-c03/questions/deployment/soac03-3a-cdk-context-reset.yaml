id: soac03-3a-cdk-context-reset
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CDK app imports a shared VPC with Vpc.fromLookup and places application resources in its private subnets. The network team has added two private subnets to the VPC, but cdk synth still produces templates that use only the original subnets. The project's cdk.context.json file also caches Availability Zone lists and AMI IDs that must not change.

    Which solution will make the app use the current subnets of the VPC?
  fr: |
    Une application AWS CDK importe un VPC partagé avec Vpc.fromLookup et place des ressources de l'application dans ses sous-réseaux privés. L'équipe réseau a ajouté deux sous-réseaux privés au VPC, mais cdk synth produit toujours des modèles qui n'utilisent que les sous-réseaux d'origine. Le fichier cdk.context.json du projet met aussi en cache des listes de zones de disponibilité et des ID d'AMI qui ne doivent pas changer.

    Quelle solution permet à l'application d'utiliser les sous-réseaux actuels du VPC ?
body:
  options:
    - { id: a, text: { en: "Run cdk context --reset with the key of the VPC lookup, then run cdk synth and commit the updated cdk.context.json file.", fr: "Exécuter cdk context --reset avec la clé de la recherche du VPC, puis exécuter cdk synth et valider le fichier cdk.context.json mis à jour." } }
    - { id: b, text: { en: "Run cdk context --clear, then run cdk synth and commit the updated cdk.context.json file.", fr: "Exécuter cdk context --clear, puis exécuter cdk synth et valider le fichier cdk.context.json mis à jour." } }
    - { id: c, text: { en: "Run cdk deploy with the --force option so that the CDK CLI deploys the stacks even if it detects no changes.", fr: "Exécuter cdk deploy avec l'option --force pour que la CLI CDK déploie les piles même si elle ne détecte aucune modification." } }
    - { id: d, text: { en: "Add the IDs of the new subnets to the VPC entry in cdk.context.json by editing the file by hand.", fr: "Ajouter les ID des nouveaux sous-réseaux à l'entrée du VPC dans cdk.context.json en modifiant le fichier à la main." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Lookup methods such as Vpc.fromLookup store their result in cdk.context.json, and the app reuses this cached value until it is reset. cdk context --reset removes one key, and the CDK refreshes that cached value from the account at the next synthesis while the other cached values stay unchanged. The file is part of the app's state, so it is committed to source control.
    fr: |
      Les méthodes de recherche comme Vpc.fromLookup stockent leur résultat dans cdk.context.json, et l'application réutilise cette valeur mise en cache jusqu'à sa réinitialisation. cdk context --reset supprime une seule clé, et le CDK actualise cette valeur depuis le compte à la synthèse suivante, tandis que les autres valeurs en cache restent inchangées. Le fichier fait partie de l'état de l'application : il est validé dans le contrôle de code source.
  options:
    b:
      en: |
        cdk context --clear removes every cached value, so the Availability Zone lists and AMI IDs would also be refreshed and could change.
      fr: |
        cdk context --clear supprime toutes les valeurs en cache : les listes de zones de disponibilité et les ID d'AMI seraient aussi actualisés et pourraient changer.
    c:
      en: |
        --force only deploys a stack even when the template has not changed; synthesis still uses the cached VPC value.
      fr: |
        --force déploie seulement une pile même lorsque le modèle n'a pas changé ; la synthèse utilise toujours la valeur du VPC en cache.
    d:
      en: |
        Cached context values are managed by the CDK, and AWS recommends not adding or changing them by editing the file by hand.
      fr: |
        Les valeurs de contexte en cache sont gérées par le CDK, et AWS recommande de ne pas les ajouter ni les modifier en éditant le fichier à la main.
references:
  - title: Context values and the AWS CDK
    url: https://docs.aws.amazon.com/cdk/v2/guide/context.html
