id: soac03-3b-tf-github-oidc-setup
objective: "3.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company's GitHub Actions workflows run Terraform against an AWS account by using the access key of an IAM user, stored as a GitHub secret. The security team requires that the workflows use only short-term credentials and that no AWS secret is stored in GitHub.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Les workflows GitHub Actions d'une entreprise exécutent Terraform sur un compte AWS avec la clé d'accès d'un utilisateur IAM, stockée comme secret GitHub. L'équipe de sécurité exige que les workflows n'utilisent que des informations d'identification à court terme et qu'aucun secret AWS ne soit stocké dans GitHub.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an IAM OIDC identity provider for token.actions.githubusercontent.com.", fr: "Créer un fournisseur d'identité OIDC IAM pour `token.actions.githubusercontent.com`." } }
    - { id: b, text: { en: "Create a SAML 2.0 identity provider in IAM that uses GitHub as the identity source.", fr: "Créer dans IAM un fournisseur d'identité SAML 2.0 qui utilise GitHub comme source d'identité." } }
    - { id: c, text: { en: "Rotate the IAM user access key every 30 days with an AWS Secrets Manager rotation function.", fr: "Faire tourner la clé d'accès de l'utilisateur IAM tous les 30 jours avec une fonction de rotation AWS Secrets Manager." } }
    - { id: d, text: { en: "Create an IAM role that the OIDC provider can assume, with a sub claim condition for the repository.", fr: "Créer un rôle IAM que le fournisseur OIDC peut endosser, avec une condition de revendication sub pour le dépôt." } }
    - { id: e, text: { en: "Create an IAM Roles Anywhere trust anchor and profile for the GitHub runners.", fr: "Créer une ancre d'approbation et un profil IAM Roles Anywhere pour les exécuteurs GitHub." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "GitHub Actions can get an OIDC token from token.actions.githubusercontent.com. With an IAM OIDC provider for that issuer and a role that trusts it, restricted on the sub claim, a workflow exchanges the token for temporary credentials with AssumeRoleWithWebIdentity, so no AWS secret is stored in GitHub."
    fr: "GitHub Actions peut obtenir un jeton OIDC de `token.actions.githubusercontent.com`. Avec un fournisseur OIDC IAM pour cet émetteur et un rôle qui l'approuve, limité sur la revendication sub, un workflow échange le jeton contre des informations d'identification temporaires avec AssumeRoleWithWebIdentity : aucun secret AWS n'est stocké dans GitHub."
  options:
    b:
      en: "GitHub Actions federates with AWS through OIDC tokens, not SAML assertions."
      fr: "GitHub Actions se fédère avec AWS par des jetons OIDC, pas par des assertions SAML."
    c:
      en: "A rotated access key is still a long-term credential stored as a GitHub secret."
      fr: "Une clé d'accès qui tourne reste une information d'identification à long terme stockée comme secret GitHub."
    e:
      en: "IAM Roles Anywhere needs X.509 certificates and private keys on the runners, which are secrets to store and manage."
      fr: "IAM Roles Anywhere exige des certificats X.509 et des clés privées sur les exécuteurs, qui sont des secrets à stocker et à gérer."
references:
  - title: Create a role for OpenID Connect federation (console)
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
  - title: Security best practices
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/terraform-aws-provider-best-practices/security.html
