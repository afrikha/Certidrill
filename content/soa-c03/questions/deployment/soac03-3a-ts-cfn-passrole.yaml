id: soac03-3a-ts-cfn-passrole
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operator runs aws cloudformation create-stack with the --role-arn option to use the CloudFormation service role cfn-network-deploy. The trust policy of the role allows cloudformation.amazonaws.com, and its permissions policy allows every action that the template needs. The command fails immediately with the following error.

    ```text
    User: arn:aws:iam::111122223333:user/ops-alice is not authorized to perform: iam:PassRole on resource: arn:aws:iam::111122223333:role/cfn-network-deploy
    ```

    Which solution will resolve the error while following the principle of least privilege?
  fr: |
    Un opérateur exécute aws cloudformation create-stack avec l'option --role-arn pour utiliser le rôle de service CloudFormation cfn-network-deploy. La politique d'approbation du rôle autorise cloudformation.amazonaws.com, et sa politique d'autorisations autorise toutes les actions dont le modèle a besoin. La commande échoue immédiatement avec l'erreur suivante.

    ```text
    User: arn:aws:iam::111122223333:user/ops-alice is not authorized to perform: iam:PassRole on resource: arn:aws:iam::111122223333:role/cfn-network-deploy
    ```

    Quelle solution permet de résoudre l'erreur en respectant le principe du moindre privilège ?
body:
  options:
    - { id: a, text: { en: "Add a policy to ops-alice that allows iam:PassRole on the ARN of the cfn-network-deploy role.", fr: "Ajouter à ops-alice une politique qui autorise iam:PassRole sur l'ARN du rôle cfn-network-deploy." } }
    - { id: b, text: { en: "Add iam:PassRole on all resources to the permissions policy of the cfn-network-deploy role.", fr: "Ajouter iam:PassRole sur toutes les ressources à la politique d'autorisations du rôle cfn-network-deploy." } }
    - { id: c, text: { en: "Add ops-alice as a principal to the trust policy of the cfn-network-deploy role.", fr: "Ajouter ops-alice comme principal dans la politique d'approbation du rôle cfn-network-deploy." } }
    - { id: d, text: { en: "Attach the AdministratorAccess managed policy to the ops-alice IAM user.", fr: "Attacher la politique gérée AdministratorAccess à l'utilisateur IAM ops-alice." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Before a user can specify a service role for a stack, the user must have permission to pass that role with iam:PassRole. Allowing iam:PassRole only on this role's ARN fixes the error without giving ops-alice the role's other permissions.
    fr: |
      Avant de pouvoir spécifier un rôle de service pour une pile, l'utilisateur doit avoir l'autorisation de transmettre ce rôle avec iam:PassRole. Autoriser iam:PassRole uniquement sur l'ARN de ce rôle corrige l'erreur sans donner à ops-alice les autres autorisations du rôle.
  options:
    b:
      en: |
        The error concerns the user who passes the role, not the role itself, and PassRole on all resources is too broad.
      fr: |
        L'erreur concerne l'utilisateur qui transmet le rôle, pas le rôle lui-même, et PassRole sur toutes les ressources est trop large.
    c:
      en: |
        Passing a role is not assuming it; CloudFormation assumes the role, and its trust policy is already correct.
      fr: |
        Transmettre un rôle n'est pas l'endosser ; c'est CloudFormation qui endosse le rôle, et sa politique d'approbation est déjà correcte.
    d:
      en: |
        This resolves the error but grants far more permissions than needed.
      fr: |
        Cela résout l'erreur mais accorde bien plus d'autorisations que nécessaire.
references:
  - title: CloudFormation service role
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-iam-servicerole.html
