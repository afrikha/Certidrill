id: soac03-3b-rds-bluegreen-facts
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An operations team creates an Amazon RDS blue/green deployment for a production RDS for MySQL DB instance named orders-db to change its DB parameter group and instance class. The team will test the green environment and then switch over.

    Which two statements are true about this deployment? (Choose two.)
  fr: |
    Une équipe d'exploitation crée un déploiement bleu/vert Amazon RDS pour une instance de base de données RDS for MySQL de production nommée orders-db afin de changer son groupe de paramètres de base de données et sa classe d'instance. L'équipe va tester l'environnement vert puis effectuer le basculement.

    Quelles sont les deux affirmations vraies sur ce déploiement ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The green DB instance is read-only by default.", fr: "L'instance de base de données verte est en lecture seule par défaut." } }
    - { id: b, text: { en: "After the switchover, RDS deletes the original blue DB instance automatically.", fr: "Après le basculement, RDS supprime automatiquement l'instance de base de données bleue d'origine." } }
    - { id: c, text: { en: "After the switchover, the application must be reconfigured to use the endpoint of the green DB instance.", fr: "Après le basculement, l'application doit être reconfigurée pour utiliser le point de terminaison de l'instance de base de données verte." } }
    - { id: d, text: { en: "After the switchover, the former production instance is renamed with a suffix such as orders-db-old1.", fr: "Après le basculement, l'ancienne instance de production est renommée avec un suffixe comme orders-db-old1." } }
    - { id: e, text: { en: "Writes made to the green DB instance during testing are replicated back to the blue DB instance.", fr: "Les écritures faites sur l'instance de base de données verte pendant les tests sont répliquées vers l'instance de base de données bleue." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "RDS replicates from the blue primary to the green primary, and the green DB instance is read-only by default to avoid replication conflicts. At switchover, the green instances take over the production names and endpoints, and the old blue instances are renamed with an -oldn suffix and kept, not deleted."
    fr: "RDS réplique de l'instance principale bleue vers l'instance principale verte, et l'instance verte est en lecture seule par défaut pour éviter les conflits de réplication. Au basculement, les instances vertes reprennent les noms et les points de terminaison de production, et les anciennes instances bleues sont renommées avec un suffixe -oldn et conservées, pas supprimées."
  options:
    b:
      en: "The previous production environment is not deleted, so it can be used for regression testing."
      fr: "L'ancien environnement de production n'est pas supprimé : il peut servir aux tests de régression."
    c:
      en: "The green instances take over the production names and endpoints, so no application change is needed."
      fr: "Les instances vertes reprennent les noms et les points de terminaison de production : aucune modification de l'application n'est nécessaire."
    e:
      en: "Replication goes only from blue to green; writes on green can cause conflicts and are not sent back to blue."
      fr: "La réplication va uniquement du bleu vers le vert ; les écritures sur le vert peuvent provoquer des conflits et ne sont pas renvoyées vers le bleu."
references:
  - title: Overview of Amazon RDS Blue/Green Deployments
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments-overview.html
