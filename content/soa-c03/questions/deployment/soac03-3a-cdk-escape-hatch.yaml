id: soac03-3a-cdk-escape-hatch
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An operations team manages Amazon S3 buckets with the L2 Bucket construct of the AWS CDK. The team must set a bucket property that AWS CloudFormation supports for AWS::S3::Bucket but that the L2 construct does not expose. The team wants to keep using the L2 construct for everything else.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'exploitation gère des compartiments Amazon S3 avec la construction L2 Bucket de l'AWS CDK. L'équipe doit définir une propriété de compartiment que AWS CloudFormation prend en charge pour AWS::S3::Bucket mais que la construction L2 n'expose pas. L'équipe souhaite continuer à utiliser la construction L2 pour tout le reste.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Cast node.defaultChild of the construct to CfnBucket and set the property, or use addPropertyOverride.", fr: "Convertir node.defaultChild de la construction en CfnBucket et définir la propriété, ou utiliser addPropertyOverride." } }
    - { id: b, text: { en: "Replace the L2 construct with an L3 pattern construct, because patterns expose every CloudFormation property.", fr: "Remplacer la construction L2 par une construction L3 de modèle (pattern), car les modèles exposent toutes les propriétés CloudFormation." } }
    - { id: c, text: { en: "Write a Lambda-backed custom resource that sets the property after the bucket is created.", fr: "Écrire une ressource personnalisée basée sur Lambda qui définit la propriété après la création du compartiment." } }
    - { id: d, text: { en: "Edit the synthesized template in the cdk.out folder after each cdk synth, before cdk deploy runs.", fr: "Modifier le modèle synthétisé dans le dossier cdk.out après chaque cdk synth, avant l'exécution de cdk deploy." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When a feature exists in CloudFormation but the L2 construct does not expose it, the CDK escape hatch is to reach the L1 resource with node.defaultChild, cast it to CfnBucket and set the property. Raw overrides such as addPropertyOverride also work when the L1 type lacks the property; the rest of the L2 construct stays unchanged.
    fr: |
      Lorsqu'une fonctionnalité existe dans CloudFormation mais que la construction L2 ne l'expose pas, la trappe de secours (escape hatch) du CDK consiste à atteindre la ressource L1 via node.defaultChild, à la convertir en CfnBucket et à définir la propriété. Les remplacements bruts comme addPropertyOverride fonctionnent aussi si le type L1 n'a pas la propriété ; le reste de la construction L2 ne change pas.
  options:
    b:
      en: |
        L3 patterns combine several resources at a higher level of abstraction; they do not expose every property of the underlying resources.
      fr: |
        Les modèles L3 combinent plusieurs ressources à un niveau d'abstraction plus élevé ; ils n'exposent pas toutes les propriétés des ressources sous-jacentes.
    c:
      en: |
        A custom resource is needed only when CloudFormation does not support the feature at all; here CloudFormation supports the property.
      fr: |
        Une ressource personnalisée n'est nécessaire que si CloudFormation ne prend pas du tout en charge la fonctionnalité ; ici, CloudFormation prend en charge la propriété.
    d:
      en: |
        Manual edits of the synthesized output are overwritten at the next synthesis and are not part of the app.
      fr: |
        Les modifications manuelles du résultat synthétisé sont écrasées à la synthèse suivante et ne font pas partie de l'application.
references:
  - title: Customize constructs from the AWS Construct Library
    url: https://docs.aws.amazon.com/cdk/v2/guide/cfn-layer.html
