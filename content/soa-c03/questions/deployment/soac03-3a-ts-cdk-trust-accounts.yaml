id: soac03-3a-ts-cdk-trust-accounts
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Account 222222222222 was bootstrapped for the AWS CDK in us-east-1 with --trust 111111111111 so that a CDK pipeline in account 111111111111 can deploy into it. A second pipeline in account 333333333333 must now also deploy into this environment. An engineer runs the following command.

    ```bash
    cdk bootstrap aws://222222222222/us-east-1 --trust 333333333333 --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess
    ```

    The second pipeline now deploys successfully, but deployments from the first pipeline fail.

    Which solution will allow both pipelines to deploy?
  fr: |
    Le compte 222222222222 a été amorcé pour l'AWS CDK dans us-east-1 avec --trust 111111111111 pour qu'un pipeline CDK du compte 111111111111 puisse y déployer. Un second pipeline du compte 333333333333 doit maintenant aussi déployer dans cet environnement. Un ingénieur exécute la commande suivante.

    ```bash
    cdk bootstrap aws://222222222222/us-east-1 --trust 333333333333 --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess
    ```

    Le second pipeline déploie maintenant correctement, mais les déploiements du premier pipeline échouent.

    Quelle solution permet aux deux pipelines de déployer ?
body:
  options:
    - { id: a, text: { en: "Run cdk bootstrap again with --trust 111111111111 --trust 333333333333 and the same execution policies.", fr: "Exécuter de nouveau cdk bootstrap avec --trust 111111111111 --trust 333333333333 et les mêmes politiques d'exécution." } }
    - { id: b, text: { en: "Delete the CDKToolkit stack, and then bootstrap the environment twice, once for each trusted account.", fr: "Supprimer la pile CDKToolkit, puis amorcer l'environnement deux fois, une fois pour chaque compte approuvé." } }
    - { id: c, text: { en: "Run cdk bootstrap for the environment again with --trust-for-lookup 111111111111 added to the command.", fr: "Exécuter de nouveau cdk bootstrap pour l'environnement en ajoutant --trust-for-lookup 111111111111 à la commande." } }
    - { id: d, text: { en: "Edit the trust policy of the CloudFormation execution role of the bootstrap stack in the IAM console to add account 111111111111.", fr: "Modifier dans la console IAM la politique d'approbation du rôle d'exécution CloudFormation de la pile d'amorçage pour ajouter le compte 111111111111." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When trusted accounts are added to an existing bootstrap stack, the command must list every account to trust, including those added before; otherwise the earlier accounts are removed. --trust also requires --cloudformation-execution-policies, and re-bootstrapping an environment simply updates the bootstrap stack.
    fr: |
      Lors de l'ajout de comptes approuvés à une pile d'amorçage existante, la commande doit lister tous les comptes à approuver, y compris ceux ajoutés auparavant ; sinon, les comptes précédents sont retirés. --trust exige aussi --cloudformation-execution-policies, et amorcer de nouveau un environnement met simplement à jour la pile d'amorçage.
  options:
    b:
      en: |
        AWS advises against deleting and recreating the bootstrap stack, and the second bootstrap would again remove the first trusted account.
      fr: |
        AWS déconseille de supprimer et recréer la pile d'amorçage, et le second amorçage retirerait de nouveau le premier compte approuvé.
    c:
      en: |
        --trust-for-lookup only allows context lookups for synthesis; it does not allow deployments.
      fr: |
        --trust-for-lookup autorise seulement les recherches de contexte pour la synthèse ; il n'autorise pas les déploiements.
    d:
      en: |
        Pipelines from other accounts use the deployment roles of the bootstrap stack, and manual edits are overwritten at the next bootstrap.
      fr: |
        Les pipelines d'autres comptes utilisent les rôles de déploiement de la pile d'amorçage, et les modifications manuelles sont écrasées au prochain amorçage.
references:
  - title: Customize AWS CDK bootstrapping
    url: https://docs.aws.amazon.com/cdk/v2/guide/bootstrapping-customizing.html
  - title: Bootstrap your environment for use with the AWS CDK
    url: https://docs.aws.amazon.com/cdk/v2/guide/bootstrapping-env.html
