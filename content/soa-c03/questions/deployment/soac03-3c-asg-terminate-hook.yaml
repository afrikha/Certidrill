id: soac03-3c-asg-terminate-hook
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group. Before an instance is terminated during scale-in, a script on the instance must copy the application logs to Amazon S3. The copy takes about 5 minutes. The instances are AWS Systems Manager managed nodes.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application sur des instances Amazon EC2 d'un groupe Auto Scaling. Avant qu'une instance soit résiliée lors d'une réduction horizontale (scale-in), un script sur l'instance doit copier les journaux de l'application vers Amazon S3. La copie dure environ 5 minutes. Les instances sont des nœuds gérés AWS Systems Manager.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a launch lifecycle hook (EC2_INSTANCE_LAUNCHING) to the group with a heartbeat timeout of 600 seconds.", fr: "Ajouter au groupe un hook de cycle de vie de lancement (EC2_INSTANCE_LAUNCHING) avec un délai de pulsation (heartbeat timeout) de 600 secondes." } }
    - { id: b, text: { en: "Add a termination lifecycle hook (EC2_INSTANCE_TERMINATING) to the group with a heartbeat timeout of 600 seconds.", fr: "Ajouter au groupe un hook de cycle de vie de résiliation (EC2_INSTANCE_TERMINATING) avec un délai de pulsation (heartbeat timeout) de 600 secondes." } }
    - { id: c, text: { en: "Create an EventBridge rule for EC2 Instance State-change Notification events with the state terminated that runs the copy script.", fr: "Créer une règle EventBridge pour les événements EC2 Instance State-change Notification à l'état terminated qui exécute le script de copie." } }
    - { id: d, text: { en: "Create an EventBridge rule for EC2 Instance-terminate Lifecycle Action events that runs the copy script with Run Command and then completes the lifecycle action.", fr: "Créer une règle EventBridge pour les événements EC2 Instance-terminate Lifecycle Action qui exécute le script de copie avec Run Command, puis termine l'action de cycle de vie." } }
    - { id: e, text: { en: "Enable instance scale-in protection on the group so that instances wait until the copy script finishes.", fr: "Activer la protection contre la réduction horizontale (scale-in protection) sur le groupe pour que les instances attendent la fin du script de copie." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A termination lifecycle hook puts the instance in a wait state before it is terminated, for up to the heartbeat timeout. Auto Scaling then sends an EC2 Instance-terminate Lifecycle Action event to EventBridge, which can run the script on the managed node with Run Command. When the copy ends, the script or the automation calls complete-lifecycle-action so that the termination continues."
    fr: "Un hook de cycle de vie de résiliation met l'instance dans un état d'attente avant sa résiliation, pendant au plus le délai de pulsation. Auto Scaling envoie alors à EventBridge un événement EC2 Instance-terminate Lifecycle Action, qui peut exécuter le script sur le nœud géré avec Run Command. À la fin de la copie, le script ou l'automatisation appelle complete-lifecycle-action pour que la résiliation se poursuive."
  options:
    a:
      en: "A launch hook pauses new instances before they enter service; it does nothing when instances are terminated."
      fr: "Un hook de lancement met en pause les nouvelles instances avant leur mise en service ; il n'agit pas lors de la résiliation des instances."
    c:
      en: "The terminated event arrives after the instance is gone, so the logs can no longer be copied from it."
      fr: "L'événement terminated arrive après la disparition de l'instance : les journaux ne peuvent plus en être copiés."
    e:
      en: "Scale-in protection prevents the group from terminating the instance at all, instead of delaying termination until the copy ends."
      fr: "La protection contre la réduction horizontale empêche totalement le groupe de résilier l'instance, au lieu de retarder la résiliation jusqu'à la fin de la copie."
references:
  - title: Amazon EC2 Auto Scaling lifecycle hooks
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/lifecycle-hooks.html
  - title: Amazon EC2 Auto Scaling event reference
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-event-reference.html
