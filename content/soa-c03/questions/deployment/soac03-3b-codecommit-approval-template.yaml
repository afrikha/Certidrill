id: soac03-3b-codecommit-approval-template
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 30 AWS CodeCommit repositories for its infrastructure code in one AWS Region. Every pull request whose destination branch is main must receive 2 approvals from users who assume the CodeCommitReview role before it can be merged. Pull requests to other branches need no approval.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise dispose de 30 dépôts AWS CodeCommit pour son code d'infrastructure dans une Région AWS. Chaque pull request dont la branche de destination est main doit recevoir 2 approbations d'utilisateurs qui endossent le rôle CodeCommitReview avant de pouvoir être fusionnée. Les pull requests vers les autres branches n'ont besoin d'aucune approbation.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Ask each author to add an approval rule that needs 2 approvals from the CodeCommitReview role to every new pull request.", fr: "Demander à chaque auteur d'ajouter à chaque nouvelle pull request une règle d'approbation qui exige 2 approbations du rôle CodeCommitReview." } }
    - { id: b, text: { en: "Create an EventBridge rule on pull request creation events that invokes a Lambda function to comment on the pull request.", fr: "Créer une règle EventBridge sur les événements de création de pull request qui appelle une fonction Lambda pour commenter la pull request." } }
    - { id: c, text: { en: "Create an approval rule template for refs/heads/main that needs 2 CodeCommitReview approvals, and associate it with the repositories.", fr: "Créer un modèle de règle d'approbation pour refs/heads/main qui exige 2 approbations CodeCommitReview, et l'associer aux dépôts." } }
    - { id: d, text: { en: "Add an IAM policy that denies codecommit:MergePullRequestByFastForward on the main branch to all developers.", fr: "Ajouter une politique IAM qui refuse codecommit:MergePullRequestByFastForward sur la branche main à tous les développeurs." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An approval rule template defines the number of approvals and an approval pool, such as an assumed-role ARN for CodeCommitReview, and can filter on destination references like refs/heads/main. When it is associated with repositories in the same Region, CodeCommit creates the approval rule automatically on each matching pull request."
    fr: "Un modèle de règle d'approbation définit le nombre d'approbations et un groupe d'approbateurs, par exemple un ARN de rôle endossé pour CodeCommitReview, et peut filtrer sur des références de destination comme refs/heads/main. Une fois associé à des dépôts de la même Région, CodeCommit crée automatiquement la règle d'approbation sur chaque pull request correspondante."
  options:
    a:
      en: "Manual rules on each pull request depend on every author and add work for every change."
      fr: "Des règles manuelles sur chaque pull request dépendent de chaque auteur et ajoutent du travail à chaque modification."
    b:
      en: "A comment does not block the merge, so pull requests can still be merged without the approvals."
      fr: "Un commentaire ne bloque pas la fusion : les pull requests peuvent toujours être fusionnées sans les approbations."
    d:
      en: "Denying a merge action does not count approvals; it only blocks that merge strategy, and the other merge strategies stay available."
      fr: "Refuser une action de fusion ne compte pas les approbations ; cela bloque seulement cette stratégie de fusion, et les autres stratégies restent disponibles."
references:
  - title: Working with approval rule templates
    url: https://docs.aws.amazon.com/codecommit/latest/userguide/approval-rule-templates.html
  - title: Create an approval rule template
    url: https://docs.aws.amazon.com/codecommit/latest/userguide/how-to-create-template.html
