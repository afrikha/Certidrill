id: soac03-3c-devops-agent-events
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS DevOps Agent to investigate production incidents. The on-call team wants a notification from an existing Amazon SNS topic whenever an investigation in the account completes or fails.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise AWS DevOps Agent pour enquêter sur les incidents de production. L'équipe d'astreinte veut recevoir une notification d'une rubrique Amazon SNS existante chaque fois qu'une investigation du compte se termine ou échoue.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create a CloudTrail trail and a metric filter that matches investigation API calls, with an alarm that publishes to the topic.", fr: "Créer un journal de suivi CloudTrail et un filtre de métrique qui correspond aux appels d'API d'investigation, avec une alarme qui publie dans la rubrique." } }
    - { id: b, text: { en: "Create a custom event bus with a resource-based policy for AWS DevOps Agent, and a rule on that bus that targets the topic.", fr: "Créer un bus d'événements personnalisé avec une politique basée sur une ressource pour AWS DevOps Agent, et une règle sur ce bus qui cible la rubrique." } }
    - { id: c, text: { en: "Create a Lambda function that polls the Agent Space for investigation status every minute and publishes to the topic.", fr: "Créer une fonction Lambda qui interroge l'Agent Space toutes les minutes sur l'état des investigations et publie dans la rubrique." } }
    - { id: d, text: { en: "Create a rule on the default event bus that matches source aws.aidevops with the Investigation Completed and Investigation Failed detail types, and target the topic.", fr: "Créer sur le bus d'événements par défaut une règle qui correspond à la source aws.aidevops avec les detail-types Investigation Completed et Investigation Failed, et cibler la rubrique." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS DevOps Agent sends investigation and mitigation lifecycle events to the default event bus with the source aws.aidevops, and it needs no extra permissions to do so. A rule that matches the Investigation Completed and Investigation Failed detail types can target the SNS topic directly."
    fr: "AWS DevOps Agent envoie les événements de cycle de vie des investigations et des atténuations au bus d'événements par défaut avec la source aws.aidevops, sans autorisation supplémentaire. Une règle qui correspond aux detail-types Investigation Completed et Investigation Failed peut cibler directement la rubrique SNS."
  options:
    a:
      en: "Investigation results are published as EventBridge events; a CloudTrail metric filter adds work and does not report completion or failure."
      fr: "Les résultats des investigations sont publiés sous forme d'événements EventBridge ; un filtre de métrique CloudTrail ajoute du travail et ne signale ni la fin ni l'échec."
    b:
      en: "The agent sends its events to the default event bus, so a rule on a custom bus does not receive them."
      fr: "L'agent envoie ses événements au bus d'événements par défaut : une règle sur un bus personnalisé ne les reçoit pas."
    c:
      en: "Polling requires custom code and adds delay, while the agent already emits the events."
      fr: "L'interrogation exige du code personnalisé et ajoute du délai, alors que l'agent émet déjà les événements."
references:
  - title: Integrating AWS DevOps Agent with Amazon EventBridge
    url: https://docs.aws.amazon.com/devopsagent/latest/userguide/configuring-integrations-and-knowledge-integrating-devops-agent-into-event-driven-applications-using-amazon-eventbridge-index.html
  - title: AWS DevOps Agent events detail reference
    url: https://docs.aws.amazon.com/devopsagent/latest/userguide/integrating-devops-agent-into-event-driven-applications-using-amazon-eventbridge-devops-agent-events-detail-reference.html
