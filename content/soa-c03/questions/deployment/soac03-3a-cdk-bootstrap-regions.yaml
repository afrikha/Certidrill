id: soac03-3a-cdk-bootstrap-regions
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations team will deploy an AWS CDK app that contains AWS Lambda function code assets to account 111122223333 in us-east-1, eu-west-1 and ap-northeast-1. No CDK app has ever been deployed to this account.

    What must the team do before the first deployment?
  fr: |
    Une équipe d'exploitation va déployer une application AWS CDK qui contient des ressources de code de fonctions AWS Lambda dans le compte 111122223333, dans us-east-1, eu-west-1 et ap-northeast-1. Aucune application CDK n'a jamais été déployée dans ce compte.

    Que doit faire l'équipe avant le premier déploiement ?
body:
  options:
    - { id: a, text: { en: "Run cdk bootstrap once in us-east-1, because the bootstrap resources are global to the account.", fr: "Exécuter cdk bootstrap une seule fois dans us-east-1, car les ressources d'amorçage sont globales au compte." } }
    - { id: b, text: { en: "Run cdk bootstrap for each of the three environments, that is, account 111122223333 in each of the Regions.", fr: "Exécuter cdk bootstrap pour chacun des trois environnements, c'est-à-dire le compte 111122223333 dans chacune des Régions." } }
    - { id: c, text: { en: "Run cdk synth in each Region so that the CDK CLI creates the asset buckets during synthesis.", fr: "Exécuter cdk synth dans chaque Région pour que la CLI CDK crée les compartiments de ressources pendant la synthèse." } }
    - { id: d, text: { en: "Create an S3 bucket for the assets in each Region, and pass the bucket names to cdk deploy.", fr: "Créer un compartiment S3 pour les ressources dans chaque Région, et transmettre les noms des compartiments à cdk deploy." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each environment, which is an account and Region pair, must be bootstrapped before the AWS CDK can deploy to it. Bootstrapping deploys the CDKToolkit stack with an S3 bucket for assets, an ECR repository and the IAM roles used for deployments, and one cdk bootstrap command can take several environments.
    fr: |
      Chaque environnement, c'est-à-dire un couple compte et Région, doit être amorcé avant que l'AWS CDK puisse y déployer. L'amorçage déploie la pile CDKToolkit avec un compartiment S3 pour les ressources, un référentiel ECR et les rôles IAM utilisés pour les déploiements, et une seule commande cdk bootstrap peut prendre plusieurs environnements.
  options:
    a:
      en: |
        Environments are independent: bootstrapping us-east-1 does not prepare eu-west-1 or ap-northeast-1.
      fr: |
        Les environnements sont indépendants : amorcer us-east-1 ne prépare ni eu-west-1 ni ap-northeast-1.
    c:
      en: |
        cdk synth only produces the CloudFormation templates and assets locally; it creates no AWS resources.
      fr: |
        cdk synth produit seulement en local les modèles CloudFormation et les ressources ; il ne crée aucune ressource AWS.
    d:
      en: |
        Modern deployments use the bootstrap stack's bucket and roles; a hand-made bucket does not replace bootstrapping.
      fr: |
        Les déploiements modernes utilisent le compartiment et les rôles de la pile d'amorçage ; un compartiment créé à la main ne remplace pas l'amorçage.
references:
  - title: AWS CDK bootstrapping
    url: https://docs.aws.amazon.com/cdk/v2/guide/bootstrapping.html
  - title: Bootstrap your environment for use with the AWS CDK
    url: https://docs.aws.amazon.com/cdk/v2/guide/bootstrapping-env.html
