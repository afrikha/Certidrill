id: soac03-3c-scheduler-timezone-stop
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A training center in Berlin uses six standalone Amazon EC2 instances for its labs. The instances must stop at 19:00 Berlin local time every weekday, all year, including after daylight saving time changes. The company does not want to write or maintain any code.

    Which solution will meet these requirements?
  fr: |
    Un centre de formation de Berlin utilise six instances Amazon EC2 autonomes pour ses travaux pratiques. Les instances doivent s'arrêter à 19 h 00, heure locale de Berlin, chaque jour ouvré, toute l'année, y compris après les changements d'heure. L'entreprise ne veut ni écrire ni maintenir de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge Scheduler schedule with a cron expression in the Europe/Berlin time zone and a universal target that calls the EC2 StopInstances API for the six instances.", fr: "Créer une planification EventBridge Scheduler avec une expression cron dans le fuseau horaire Europe/Berlin et une cible universelle qui appelle l'API EC2 StopInstances pour les six instances." } }
    - { id: b, text: { en: "Create an EventBridge scheduled rule with a cron expression for 18:00 UTC and the built-in EC2 StopInstances API call target for the six instances.", fr: "Créer une règle planifiée EventBridge avec une expression cron pour 18 h 00 UTC et la cible intégrée d'appel d'API EC2 StopInstances pour les six instances." } }
    - { id: c, text: { en: "Create an EventBridge Scheduler schedule that invokes a Lambda function every hour, and have the function stop the instances when it is 19:00 in Berlin.", fr: "Créer une planification EventBridge Scheduler qui appelle une fonction Lambda toutes les heures, et faire arrêter les instances par la fonction lorsqu'il est 19 h 00 à Berlin." } }
    - { id: d, text: { en: "Create a scheduled action in the Europe/Berlin time zone that sets the desired capacity of an Auto Scaling group to 0 at 19:00 on weekdays.", fr: "Créer une action planifiée dans le fuseau horaire Europe/Berlin qui définit la capacité souhaitée d'un groupe Auto Scaling sur 0 à 19 h 00 les jours ouvrés." } }
answer: { optionId: a }
explanation:
  correct:
    en: "EventBridge Scheduler evaluates cron schedules in the time zone that you specify, using IANA names such as Europe/Berlin, and adjusts for daylight saving time. Its universal targets call AWS API operations directly, such as StopInstances with the list of instance IDs, so no function code is needed."
    fr: "EventBridge Scheduler évalue les planifications cron dans le fuseau horaire indiqué, avec des noms IANA comme Europe/Berlin, et tient compte de l'heure d'été. Ses cibles universelles appellent directement des opérations d'API AWS, comme StopInstances avec la liste des ID d'instance : aucun code de fonction n'est nécessaire."
  options:
    b:
      en: "Scheduled rules always use UTC, so 18:00 UTC is 19:00 in Berlin only in winter and 20:00 in summer."
      fr: "Les règles planifiées utilisent toujours l'heure UTC : 18 h 00 UTC ne correspond à 19 h 00 à Berlin qu'en hiver, et à 20 h 00 en été."
    c:
      en: "This works, but the company must write and maintain the function code, which the requirements forbid."
      fr: "Cela fonctionne, mais l'entreprise doit écrire et maintenir le code de la fonction, ce que les exigences interdisent."
    d:
      en: "The instances are standalone, not in an Auto Scaling group, and setting a group to 0 would terminate instances instead of stopping them."
      fr: "Les instances sont autonomes, hors de tout groupe Auto Scaling, et réduire un groupe à 0 résilierait les instances au lieu de les arrêter."
references:
  - title: Schedule types in EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html
  - title: Creating a scheduled rule (legacy) in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-create-rule-schedule.html
