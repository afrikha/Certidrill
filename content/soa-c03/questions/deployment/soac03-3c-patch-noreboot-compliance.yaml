id: soac03-3c-patch-noreboot-compliance
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company patches Amazon Linux 2023 managed nodes by running AWS-RunPatchBaseline with Operation set to Install and RebootOption set to NoReboot, because application owners reboot their own nodes later. After each patching run, Patch Manager reports the nodes as Non-Compliant even though the approved patches were installed. The compliance report must show the nodes as Compliant once the patches are in effect.

    Which solution will meet these requirements?
  fr: |
    Une entreprise applique les correctifs sur des nœuds gérés Amazon Linux 2023 en exécutant AWS-RunPatchBaseline avec Operation défini sur Install et RebootOption défini sur NoReboot, car les propriétaires d'applications redémarrent eux-mêmes leurs nœuds plus tard. Après chaque exécution, Patch Manager signale les nœuds comme Non-Compliant alors que les correctifs approuvés ont été installés. Le rapport de conformité doit indiquer Compliant pour les nœuds dès que les correctifs sont effectifs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the auto-approval delay of the patch baseline to 0 days so that the installed patches are counted as approved.", fr: "Définir le délai d'approbation automatique du référentiel de correctifs sur 0 jour pour que les correctifs installés soient comptés comme approuvés." } }
    - { id: b, text: { en: "Run AWS-RunPatchBaseline again with Operation set to Install and an InstallOverrideList that lists the installed patches.", fr: "Exécuter de nouveau AWS-RunPatchBaseline avec Operation défini sur Install et une InstallOverrideList qui répertorie les correctifs installés." } }
    - { id: c, text: { en: "Reboot the nodes, and then run AWS-RunPatchBaseline with Operation set to Scan to update their compliance state.", fr: "Redémarrer les nœuds, puis exécuter AWS-RunPatchBaseline avec Operation défini sur Scan pour mettre à jour leur état de conformité." } }
    - { id: d, text: { en: "Update SSM Agent on the nodes, because older agents cannot report the InstalledPendingReboot patch state.", fr: "Mettre à jour SSM Agent sur les nœuds, car les anciens agents ne peuvent pas signaler l'état de correctif InstalledPendingReboot." } }
answer: { optionId: c }
explanation:
  correct:
    en: "When an Install operation runs with NoReboot, each installed patch gets the status InstalledPendingReboot and the node is marked Non-Compliant. After the node reboots and a Scan operation runs, the node's patch compliance changes to Compliant. This is expected behavior, not an error in the baseline."
    fr: "Lorsqu'une opération Install s'exécute avec NoReboot, chaque correctif installé reçoit l'état InstalledPendingReboot et le nœud est marqué Non-Compliant. Après le redémarrage du nœud et l'exécution d'une opération Scan, la conformité des correctifs du nœud passe à Compliant. Il s'agit du comportement attendu, pas d'une erreur du référentiel."
  options:
    a:
      en: "The patches are already approved and installed; the approval delay does not change the pending-reboot state."
      fr: "Les correctifs sont déjà approuvés et installés ; le délai d'approbation ne modifie pas l'état d'attente de redémarrage."
    b:
      en: "Installing the same patches again without a reboot leaves them in the InstalledPendingReboot state."
      fr: "Réinstaller les mêmes correctifs sans redémarrage les laisse dans l'état InstalledPendingReboot."
    d:
      en: "InstalledPendingReboot is the normal result of NoReboot on current agents, so updating the agent does not change the compliance state."
      fr: "InstalledPendingReboot est le résultat normal de NoReboot avec les agents actuels : mettre à jour l'agent ne modifie pas l'état de conformité."
references:
  - title: "SSM Command document for patching: AWS-RunPatchBaseline"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-aws-runpatchbaseline.html
