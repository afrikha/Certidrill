id: soac03-3b-ir-replace-root-volume
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a GPU workload on an Auto Scaling group that uses a mixed instances policy and a numbered launch template version. Capacity for these instance types is scarce in the Region, and new instances sometimes fail to launch. Each month, only the AMI changes. During updates, the instances must keep their private IP addresses, their instance store data, and their secondary EBS volumes, and the update must not depend on launching new instances.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une charge de travail GPU sur un Auto Scaling group qui utilise une politique d'instances mixtes et une version numérotée de modèle de lancement. La capacité pour ces types d'instance est rare dans la Région, et le lancement de nouvelles instances échoue parfois. Chaque mois, seule l'AMI change. Pendant les mises à jour, les instances doivent conserver leurs adresses IP privées, les données de leur stockage d'instance et leurs volumes EBS secondaires, et la mise à jour ne doit pas dépendre du lancement de nouvelles instances.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Start an instance refresh with the ReplaceRootVolume strategy and a desired configuration whose overrides set the new ImageId.", fr: "Démarrer une actualisation d'instance avec la stratégie ReplaceRootVolume et une configuration souhaitée dont les substitutions définissent le nouvel ImageId." } }
    - { id: b, text: { en: "Start an instance refresh with the Rolling strategy, MinHealthyPercentage set to 100, and MaxHealthyPercentage set to 200.", fr: "Démarrer une actualisation d'instance avec la stratégie Rolling, MinHealthyPercentage défini à 100 et MaxHealthyPercentage défini à 200." } }
    - { id: c, text: { en: "Start an instance refresh with the Rolling strategy and MinHealthyPercentage set to 0 to replace all instances at once.", fr: "Démarrer une actualisation d'instance avec la stratégie Rolling et MinHealthyPercentage défini à 0 pour remplacer toutes les instances d'un coup." } }
    - { id: d, text: { en: "Add a warm pool of stopped instances to the group, and start an instance refresh with the Rolling strategy.", fr: "Ajouter au groupe un warm pool d'instances arrêtées, et démarrer une actualisation d'instance avec la stratégie Rolling." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Root volume replacement detaches the root EBS volume and attaches a new one created from the specified AMI to the same running instance, so no new instance is launched. Network interfaces and IP addresses, non-root EBS volumes, and instance store data are preserved; the group must use a mixed instances policy whose overrides specify an ImageId."
    fr: "Le remplacement du volume racine détache le volume EBS racine et attache à la même instance en cours d'exécution un nouveau volume créé à partir de l'AMI indiquée : aucune nouvelle instance n'est lancée. Les interfaces réseau et adresses IP, les volumes EBS non racine et les données du stockage d'instance sont conservés ; le groupe doit utiliser une politique d'instances mixtes dont les substitutions précisent un ImageId."
  options:
    b:
      en: "A rolling refresh launches new instances, which needs scarce capacity and gives new IP addresses and empty instance store volumes."
      fr: "Une actualisation Rolling lance de nouvelles instances, ce qui exige la capacité rare et donne de nouvelles adresses IP et des stockages d'instance vides."
    c:
      en: "This terminates every instance, losing instance store data and capacity, and still depends on launching new instances."
      fr: "Cela résilie toutes les instances, avec perte des données du stockage d'instance et de la capacité, et dépend toujours du lancement de nouvelles instances."
    d:
      en: "A rolling refresh still replaces instances, and the replace root volume strategy cannot run on a group with a warm pool."
      fr: "Une actualisation Rolling remplace toujours les instances, et la stratégie de remplacement du volume racine ne peut pas s'exécuter sur un groupe doté d'un warm pool."
references:
  - title: Replace root volumes during instance refresh
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/replace-root-volume.html
