id: soac03-3a-ts-asg-deleted-dependencies
objective: "3.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A cleanup script deleted unused resources in an AWS account last night. Since then, every scale-out of an Auto Scaling group fails, and the activity history shows that launching an EC2 instance failed. The launch template of the group has not changed for months.

    Which two issues could cause this behavior? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un script de nettoyage a supprimé cette nuit des ressources inutilisées dans un compte AWS. Depuis, chaque montée en charge d'un groupe Auto Scaling échoue, et l'historique d'activité indique que le lancement d'une instance EC2 a échoué. Le modèle de lancement du groupe n'a pas changé depuis des mois.

    Quels sont les deux problèmes qui pourraient provoquer ce comportement ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The script deleted the security group that the launch template specifies.", fr: "Le script a supprimé le groupe de sécurité spécifié dans le modèle de lancement." } }
    - { id: b, text: { en: "The script deleted a CloudWatch alarm that a step scaling policy of the group uses.", fr: "Le script a supprimé une alarme CloudWatch utilisée par une politique de mise à l'échelle par étapes du groupe." } }
    - { id: c, text: { en: "The script deleted old EBS snapshots that AWS Backup had created from the group's instances.", fr: "Le script a supprimé d'anciens instantanés EBS créés par AWS Backup à partir des instances du groupe." } }
    - { id: d, text: { en: "The script deleted an Amazon SNS topic that receives the group's notifications.", fr: "Le script a supprimé une rubrique Amazon SNS qui reçoit les notifications du groupe." } }
    - { id: e, text: { en: "The script deleted the key pair that the launch template specifies.", fr: "Le script a supprimé la paire de clés spécifiée dans le modèle de lancement." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Amazon EC2 Auto Scaling reports launch failures when the security group or the key pair that the launch template specifies no longer exists. The fix is to create a new launch template version with valid resources and to update the group to use it.
    fr: |
      Amazon EC2 Auto Scaling signale des échecs de lancement lorsque le groupe de sécurité ou la paire de clés spécifiés dans le modèle de lancement n'existent plus. La correction consiste à créer une nouvelle version du modèle de lancement avec des ressources valides et à mettre à jour le groupe pour qu'il l'utilise.
  options:
    b:
      en: |
        Without the alarm, the scaling policy would not trigger a scale-out at all; it would not make launches fail.
      fr: |
        Sans l'alarme, la politique de mise à l'échelle ne déclencherait aucune montée en charge ; elle ne ferait pas échouer les lancements.
    c:
      en: |
        Backup snapshots of instances are separate from the AMI that the launch template uses.
      fr: |
        Les instantanés de sauvegarde des instances sont distincts de l'AMI utilisée par le modèle de lancement.
    d:
      en: |
        Notifications are sent after scaling events; a missing topic does not prevent instances from launching.
      fr: |
        Les notifications sont envoyées après les événements de mise à l'échelle ; une rubrique manquante n'empêche pas le lancement des instances.
references:
  - title: "Troubleshoot Amazon EC2 Auto Scaling: EC2 instance launch failures"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ts-as-instancelaunchfailure.html
