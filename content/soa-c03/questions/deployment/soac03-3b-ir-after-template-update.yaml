id: soac03-3b-ir-after-template-update
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operator created version 4 of a launch template with a patched AMI and updated an Auto Scaling group to use version 4. Instances launched by later scale-out events use the patched AMI, but the 12 instances that were already running still use the old AMI. All instances must run the patched AMI without downtime.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un opérateur a créé la version 4 d'un modèle de lancement avec une AMI corrigée et a mis à jour un Auto Scaling group pour utiliser la version 4. Les instances lancées par les augmentations de capacité suivantes utilisent l'AMI corrigée, mais les 12 instances déjà en cours d'exécution utilisent toujours l'ancienne AMI. Toutes les instances doivent exécuter l'AMI corrigée sans interruption de service.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Reboot the 12 instances so that they load the AMI of launch template version 4.", fr: "Redémarrer les 12 instances afin qu'elles chargent l'AMI de la version 4 du modèle de lancement." } }
    - { id: b, text: { en: "Set the desired capacity to 0, wait for all instances to terminate, and then restore the desired capacity.", fr: "Définir la capacité souhaitée à 0, attendre la résiliation de toutes les instances, puis rétablir la capacité souhaitée." } }
    - { id: c, text: { en: "Start an instance refresh on the Auto Scaling group.", fr: "Démarrer une actualisation d'instance sur l'Auto Scaling group." } }
    - { id: d, text: { en: "Create a second Auto Scaling group with version 4, and move the load balancer targets to it manually.", fr: "Créer un second Auto Scaling group avec la version 4, et y déplacer manuellement les cibles de l'équilibreur de charge." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Changing the launch template version of a group affects only instances launched afterward. An instance refresh replaces the existing instances in a rolling way while keeping a minimum healthy percentage in service, which rolls out the new AMI without downtime."
    fr: "Changer la version du modèle de lancement d'un groupe n'affecte que les instances lancées ensuite. Une actualisation d'instance remplace progressivement les instances existantes tout en gardant un pourcentage minimal d'instances saines en service, ce qui déploie la nouvelle AMI sans interruption."
  options:
    a:
      en: "A reboot keeps the same root volume, so the instances still run the old AMI."
      fr: "Un redémarrage conserve le même volume racine : les instances exécutent toujours l'ancienne AMI."
    b:
      en: "Scaling to 0 removes all capacity and causes downtime."
      fr: "Passer à 0 supprime toute la capacité et provoque une interruption de service."
    d:
      en: "A parallel group with manual target changes works but adds much more manual effort than an instance refresh."
      fr: "Un groupe parallèle avec des changements de cibles manuels fonctionne mais demande beaucoup plus d'effort manuel qu'une actualisation d'instance."
references:
  - title: Use an instance refresh to update instances in an Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh.html
