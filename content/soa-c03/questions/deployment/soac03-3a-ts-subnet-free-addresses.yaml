id: soac03-3a-ts-subnet-free-addresses
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Auto Scaling group uses two subnets: subnet-a (10.0.1.0/24) in us-east-1a and subnet-b (10.0.2.0/24) in us-east-1b. Both subnets are almost full, and scale-out fails with the InsufficientFreeAddressesInSubnet error. subnet-a contains 110 running instances and 140 stopped instances that a test team no longer needs. The VPC also has an existing subnet-c (10.0.3.0/24) in us-east-1c that has more than 200 free addresses, and the application can run in any Availability Zone.

    Which actions will allow the group to scale out? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    Un groupe Auto Scaling utilise deux sous-réseaux : subnet-a (10.0.1.0/24) dans us-east-1a et subnet-b (10.0.2.0/24) dans us-east-1b. Les deux sous-réseaux sont presque pleins, et la montée en charge échoue avec l'erreur InsufficientFreeAddressesInSubnet. subnet-a contient 110 instances en cours d'exécution et 140 instances arrêtées dont une équipe de test n'a plus besoin. Le VPC possède aussi un subnet-c existant (10.0.3.0/24) dans us-east-1c qui compte plus de 200 adresses libres, et l'application peut s'exécuter dans n'importe quelle zone de disponibilité.

    Quelles actions permettent au groupe de monter en charge ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Terminate the stopped instances that the test team no longer needs in subnet-a.", fr: "Résilier dans subnet-a les instances arrêtées dont l'équipe de test n'a plus besoin." } }
    - { id: b, text: { en: "Modify the CIDR block of subnet-a to 10.0.0.0/23.", fr: "Modifier le bloc CIDR de subnet-a en 10.0.0.0/23." } }
    - { id: c, text: { en: "Increase the maximum capacity of the Auto Scaling group.", fr: "Augmenter la capacité maximale du groupe Auto Scaling." } }
    - { id: d, text: { en: "Add subnet-c to the subnets of the Auto Scaling group.", fr: "Ajouter subnet-c aux sous-réseaux du groupe Auto Scaling." } }
    - { id: e, text: { en: "Stop more of the running instances in subnet-a to release their IP addresses.", fr: "Arrêter davantage d'instances en cours d'exécution dans subnet-a pour libérer leurs adresses IP." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      InsufficientFreeAddressesInSubnet means that the subnet does not have enough free private IP addresses, and the addresses of stopped instances count as unavailable. Terminating the unneeded stopped instances frees their addresses, and adding a subnet that has free addresses in another Availability Zone gives the group room to launch there.
    fr: |
      InsufficientFreeAddressesInSubnet signifie que le sous-réseau n'a pas assez d'adresses IP privées libres, et les adresses des instances arrêtées comptent comme indisponibles. Résilier les instances arrêtées inutiles libère leurs adresses, et ajouter un sous-réseau qui a des adresses libres dans une autre zone de disponibilité donne au groupe de la place pour y lancer des instances.
  options:
    b:
      en: |
        The IPv4 CIDR block of an existing subnet cannot be resized; a new subnet would have to be created.
      fr: |
        Le bloc CIDR IPv4 d'un sous-réseau existant ne peut pas être redimensionné ; il faudrait créer un nouveau sous-réseau.
    c:
      en: |
        The limit is the number of free addresses in the subnets, not the maximum capacity of the group.
      fr: |
        La limite est le nombre d'adresses libres dans les sous-réseaux, pas la capacité maximale du groupe.
    e:
      en: |
        Stopped instances keep their private IP addresses, so stopping instances releases no address.
      fr: |
        Les instances arrêtées conservent leurs adresses IP privées : arrêter des instances ne libère aucune adresse.
references:
  - title: Error codes for the Amazon EC2 API
    url: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/errors-overview.html
  - title: Subnet CIDR blocks
    url: https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html
