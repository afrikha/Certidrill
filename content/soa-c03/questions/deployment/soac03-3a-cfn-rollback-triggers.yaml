id: soac03-3a-cfn-rollback-triggers
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company updates the application tier of an AWS CloudFormation stack several times a week. An Amazon CloudWatch alarm already watches the HTTP 5XX error count of the application. If this alarm enters the ALARM state during a stack update or within 15 minutes after the update has deployed all resources, the whole update must be rolled back automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise met à jour le niveau application d'une pile AWS CloudFormation plusieurs fois par semaine. Une alarme Amazon CloudWatch surveille déjà le nombre d'erreurs HTTP 5XX de l'application. Si cette alarme passe à l'état ALARM pendant une mise à jour de pile ou dans les 15 minutes qui suivent le déploiement de toutes les ressources par la mise à jour, l'ensemble de la mise à jour doit être restauré automatiquement.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Add the alarm as a rollback trigger in the rollback configuration of the stack, with a monitoring time of 15 minutes.", fr: "Ajouter l'alarme comme déclencheur de restauration dans la configuration de restauration de la pile, avec une durée de surveillance de 15 minutes." } }
    - { id: b, text: { en: "Add an alarm action that publishes to an Amazon SNS topic, and subscribe an AWS Lambda function that calls cancel-update-stack.", fr: "Ajouter une action d'alarme qui publie dans une rubrique Amazon SNS, et y abonner une fonction AWS Lambda qui appelle cancel-update-stack." } }
    - { id: c, text: { en: "Set the stack failure option to roll back all stack resources, and keep termination protection enabled on the stack.", fr: "Définir l'option d'échec de pile pour restaurer toutes les ressources de la pile, et garder la protection contre la résiliation activée sur la pile." } }
    - { id: d, text: { en: "Add a CreationPolicy with a 15-minute timeout to the application resources, and link it to the alarm with DependsOn.", fr: "Ajouter aux ressources de l'application une CreationPolicy avec un délai de 15 minutes, et la lier à l'alarme avec DependsOn." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With rollback triggers, CloudFormation monitors the specified CloudWatch alarms during the stack operation and for a monitoring time, from 0 to 180 minutes, after all resources are deployed. If an alarm enters the ALARM state in that window, CloudFormation rolls back the entire stack operation. For an update, it removes the old resources only when the monitoring time ends without a breach.
    fr: |
      Avec les déclencheurs de restauration, CloudFormation surveille les alarmes CloudWatch indiquées pendant l'opération de pile et pendant une durée de surveillance, de 0 à 180 minutes, après le déploiement de toutes les ressources. Si une alarme passe à l'état ALARM dans cette fenêtre, CloudFormation restaure toute l'opération de pile. Pour une mise à jour, il ne supprime les anciennes ressources qu'à la fin de la durée de surveillance sans dépassement.
  options:
    b:
      en: |
        Custom code adds overhead, and cancel-update-stack works only while the update is still in progress, not during the 15 minutes after it completes.
      fr: |
        Le code personnalisé ajoute de la charge, et cancel-update-stack ne fonctionne que pendant que la mise à jour est en cours, pas pendant les 15 minutes qui suivent sa fin.
    c:
      en: |
        The stack failure option acts only when a resource operation fails; it does not watch CloudWatch alarms. Termination protection only prevents stack deletion.
      fr: |
        L'option d'échec de pile n'agit qu'en cas d'échec d'une opération sur une ressource ; elle ne surveille pas les alarmes CloudWatch. La protection contre la résiliation empêche seulement la suppression de la pile.
    d:
      en: |
        A CreationPolicy waits for success signals from instances during creation; it does not react to an alarm, and DependsOn only orders resource creation.
      fr: |
        Une CreationPolicy attend des signaux de réussite des instances pendant la création ; elle ne réagit pas à une alarme, et DependsOn ne fait qu'ordonner la création des ressources.
references:
  - title: Roll back your CloudFormation stack on alarm breach with rollback triggers
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-rollback-triggers.html
