id: soac03-3a-ts-cfn-init-logs
objective: "3.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An AWS CloudFormation stack failed because an Amazon Linux instance did not send the success signal that its CreationPolicy requires. The instance's user data runs cfn-init and then cfn-signal. An engineer kept the instance for investigation and connected to it with Session Manager.

    Which two log files should the engineer review first to find why the signal was not sent? (Choose two.)
  fr: |
    Une pile AWS CloudFormation a échoué, car une instance Amazon Linux n'a pas envoyé le signal de réussite exigé par sa CreationPolicy. Les données utilisateur de l'instance exécutent cfn-init puis cfn-signal. Un ingénieur a conservé l'instance pour l'analyser et s'y est connecté avec Session Manager.

    Quels sont les deux fichiers journaux que l'ingénieur doit examiner en premier pour savoir pourquoi le signal n'a pas été envoyé ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "/var/log/cfn-hup.log" }
    - { id: b, text: "/var/log/cfn-init.log" }
    - { id: c, text: "/var/log/cloud-init.log" }
    - { id: d, text: "/var/log/amazon/ssm/amazon-ssm-agent.log" }
    - { id: e, text: "/var/log/secure" }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      For a wait condition or creation policy that did not receive its signals, CloudFormation recommends checking that cfn-signal ran successfully and reviewing logs such as /var/log/cloud-init.log, for the execution of the user data, and /var/log/cfn-init.log, for the configuration steps of cfn-init.
    fr: |
      Lorsqu'une condition d'attente ou une politique de création n'a pas reçu ses signaux, CloudFormation recommande de vérifier que cfn-signal s'est bien exécuté et d'examiner des journaux comme /var/log/cloud-init.log, pour l'exécution des données utilisateur, et /var/log/cfn-init.log, pour les étapes de configuration de cfn-init.
  options:
    a:
      en: |
        cfn-hup handles metadata changes after creation; it is not involved in the initial signal.
      fr: |
        cfn-hup gère les modifications des métadonnées après la création ; il n'intervient pas dans le signal initial.
    d:
      en: |
        The SSM Agent log concerns Systems Manager features such as the Session Manager connection, not the user data or cfn-init.
      fr: |
        Le journal de l'agent SSM concerne les fonctionnalités de Systems Manager, comme la connexion Session Manager, pas les données utilisateur ni cfn-init.
    e:
      en: |
        This log records authentication events; it does not show the execution of the user data.
      fr: |
        Ce journal enregistre les événements d'authentification ; il ne montre pas l'exécution des données utilisateur.
references:
  - title: Troubleshooting CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/troubleshooting.html
