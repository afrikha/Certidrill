id: soac03-3b-tf-hcp-dynamic-creds
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An HCP Terraform workspace deploys to an AWS account with an IAM user access key stored in its workspace variables. The company wants the workspace to use only temporary credentials, without stored secrets or certificates. Plan runs must use a read-only role, and apply runs must use a role that can change resources.

    Which solution will meet these requirements?
  fr: |
    Un espace de travail HCP Terraform déploie dans un compte AWS avec une clé d'accès d'utilisateur IAM stockée dans ses variables d'espace de travail. L'entreprise veut que l'espace de travail n'utilise que des informations d'identification temporaires, sans secret ni certificat stocké. Les exécutions de plan doivent utiliser un rôle en lecture seule, et les exécutions d'application un rôle qui peut modifier les ressources.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the access key in AWS Secrets Manager with automatic rotation, and have the workspace read it at the start of each run.", fr: "Stocker la clé d'accès dans AWS Secrets Manager avec rotation automatique, et faire lire la clé par l'espace de travail au début de chaque exécution." } }
    - { id: b, text: { en: "Add an IAM OIDC provider for app.terraform.io, create plan and apply roles that trust it, and set their ARNs as workspace variables.", fr: "Ajouter un fournisseur OIDC IAM pour app.terraform.io, créer des rôles de plan et d'application qui l'approuvent, et définir leurs ARN comme variables d'espace de travail." } }
    - { id: c, text: { en: "Create an IAM Roles Anywhere trust anchor, and install a client certificate in the workspace to get temporary credentials.", fr: "Créer une ancre d'approbation IAM Roles Anywhere, et installer un certificat client dans l'espace de travail pour obtenir des informations d'identification temporaires." } }
    - { id: d, text: { en: "Create two IAM users with access keys, one read-only for plans and one for applies, and rotate the keys every 90 days.", fr: "Créer deux utilisateurs IAM avec des clés d'accès, l'un en lecture seule pour les plans et l'autre pour les applications, et faire tourner les clés tous les 90 jours." } }
answer: { optionId: b }
explanation:
  correct:
    en: "HCP Terraform dynamic provider credentials use OIDC: the account trusts app.terraform.io, and each role's trust policy checks the aud claim and a sub claim that names the workspace and run phase. The workspace variables TFC_AWS_PLAN_ROLE_ARN and TFC_AWS_APPLY_ROLE_ARN select the read-only and the change-capable role."
    fr: "Les informations d'identification dynamiques de fournisseur de HCP Terraform utilisent OIDC : le compte approuve app.terraform.io, et la politique d'approbation de chaque rôle vérifie la revendication aud et une revendication sub qui nomme l'espace de travail et la phase d'exécution. Les variables d'espace de travail TFC_AWS_PLAN_ROLE_ARN et TFC_AWS_APPLY_ROLE_ARN sélectionnent le rôle en lecture seule et le rôle capable de modifier."
  options:
    a:
      en: "A rotated access key is still a long-term credential, and reading it needs another stored credential."
      fr: "Une clé d'accès qui tourne reste une information d'identification à long terme, et sa lecture exige une autre information d'identification stockée."
    c:
      en: "IAM Roles Anywhere requires an X.509 certificate and its private key, which the company does not want to store."
      fr: "IAM Roles Anywhere exige un certificat X.509 et sa clé privée, que l'entreprise ne veut pas stocker."
    d:
      en: "IAM user access keys are long-term secrets stored in the workspace, which the requirements exclude."
      fr: "Les clés d'accès d'utilisateurs IAM sont des secrets à long terme stockés dans l'espace de travail, ce que les exigences excluent."
references:
  - title: Security best practices
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/terraform-aws-provider-best-practices/security.html
