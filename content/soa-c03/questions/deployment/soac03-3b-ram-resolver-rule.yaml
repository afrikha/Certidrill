id: soac03-3b-ram-resolver-rule
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A network account has a Route 53 Resolver outbound endpoint and a forwarding rule that sends queries for corp.example.com to on-premises DNS servers. The network team shares the rule with an application account by using AWS Resource Access Manager (AWS RAM), and the application account shows the rule as Shared with me. Instances in a VPC of the application account still cannot resolve names in corp.example.com.

    What should the operations team do to fix the issue?
  fr: |
    Un compte réseau dispose d'un point de terminaison sortant Route 53 Resolver et d'une règle de transfert qui envoie les requêtes pour corp.example.com vers des serveurs DNS sur site. L'équipe réseau partage la règle avec un compte d'application à l'aide d'AWS Resource Access Manager (AWS RAM), et le compte d'application affiche la règle comme Shared with me. Les instances d'un VPC du compte d'application ne parviennent toujours pas à résoudre les noms de corp.example.com.

    Que doit faire l'équipe d'exploitation pour corriger le problème ?
body:
  options:
    - { id: a, text: { en: "Create a private hosted zone named corp.example.com in the application account and associate it with the VPC.", fr: "Créer une zone hébergée privée nommée corp.example.com dans le compte d'application et l'associer au VPC." } }
    - { id: b, text: { en: "In the application account, associate the shared Resolver rule with the VPC.", fr: "Dans le compte d'application, associer la règle Resolver partagée au VPC." } }
    - { id: c, text: { en: "Create a Resolver outbound endpoint in the application account VPC for the shared rule to use.", fr: "Créer un point de terminaison sortant Resolver dans le VPC du compte d'application pour la règle partagée." } }
    - { id: d, text: { en: "In the application account, edit the shared rule to add the on-premises DNS server IP addresses again.", fr: "Dans le compte d'application, modifier la règle partagée pour ajouter de nouveau les adresses IP des serveurs DNS sur site." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A shared Resolver rule does nothing until the account it is shared with associates it with its VPCs, in the same way as a rule it created. After the association, queries for corp.example.com from that VPC are forwarded through the owner's outbound endpoint."
    fr: "Une règle Resolver partagée n'a aucun effet tant que le compte destinataire ne l'associe pas à ses VPC, de la même façon qu'une règle qu'il aurait créée. Après l'association, les requêtes pour corp.example.com depuis ce VPC sont transférées via le point de terminaison sortant du propriétaire."
  options:
    a:
      en: "An empty private hosted zone would answer for the domain locally instead of forwarding queries to the on-premises servers."
      fr: "Une zone hébergée privée vide répondrait localement pour le domaine au lieu de transférer les requêtes vers les serveurs sur site."
    c:
      en: "The shared rule already uses the owner's outbound endpoint; another endpoint is not needed."
      fr: "La règle partagée utilise déjà le point de terminaison sortant du propriétaire ; un autre point de terminaison n'est pas nécessaire."
    d:
      en: "The account that a rule is shared with cannot change or delete the rule."
      fr: "Le compte avec lequel une règle est partagée ne peut ni la modifier ni la supprimer."
references:
  - title: Managing forwarding rules
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-rules-managing.html
