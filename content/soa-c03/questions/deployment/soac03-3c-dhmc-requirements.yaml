id: soac03-3c-dhmc-requirements
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company activates Default Host Management Configuration (DHMC) in an AWS Region so that its Amazon EC2 instances become AWS Systems Manager managed nodes without an IAM instance profile.

    Which two conditions must each instance meet for DHMC to manage it? (Choose two.)
  fr: |
    Une entreprise active Default Host Management Configuration (DHMC) dans une Région AWS pour que ses instances Amazon EC2 deviennent des nœuds gérés AWS Systems Manager sans profil d'instance IAM.

    Quelles sont les deux conditions que chaque instance doit remplir pour que DHMC la gère ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The instance uses Instance Metadata Service Version 2 (IMDSv2).", fr: "L'instance utilise Instance Metadata Service Version 2 (IMDSv2)." } }
    - { id: b, text: { en: "The instance has a public IPv4 address or an Elastic IP address.", fr: "L'instance possède une adresse IPv4 publique ou une adresse IP Elastic." } }
    - { id: c, text: { en: "The instance carries a tag whose key the DHMC setting specifies.", fr: "L'instance porte une balise dont la clé est indiquée dans le paramètre DHMC." } }
    - { id: d, text: { en: "The instance runs SSM Agent version 3.2.582.0 or later.", fr: "L'instance exécute SSM Agent version 3.2.582.0 ou ultérieure." } }
    - { id: e, text: { en: "The instance runs on a Nitro-based instance type.", fr: "L'instance s'exécute sur un type d'instance basé sur Nitro." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "DHMC applies a default IAM role (AWSSystemsManagerDefaultEC2InstanceManagementRole by default) to the EC2 instances of the account and Region, so no instance profile is needed. It requires instances that use IMDSv2, because IMDSv1 is not supported, and SSM Agent 3.2.582.0 or later. DHMC is activated separately in each Region."
    fr: "DHMC applique un rôle IAM par défaut (AWSSystemsManagerDefaultEC2InstanceManagementRole par défaut) aux instances EC2 du compte et de la Région : aucun profil d'instance n'est nécessaire. Il exige des instances qui utilisent IMDSv2, car IMDSv1 n'est pas pris en charge, et SSM Agent 3.2.582.0 ou ultérieur. DHMC s'active séparément dans chaque Région."
  options:
    b:
      en: "DHMC has no public address requirement; instances can reach Systems Manager through a NAT gateway or VPC endpoints."
      fr: "DHMC n'impose pas d'adresse publique ; les instances peuvent joindre Systems Manager par une passerelle NAT ou des points de terminaison d'un VPC."
    c:
      en: "DHMC applies to all EC2 instances in the account and Region; it has no tag filter."
      fr: "DHMC s'applique à toutes les instances EC2 du compte et de la Région ; il n'a pas de filtre par balise."
    e:
      en: "DHMC does not depend on the instance type or hypervisor."
      fr: "DHMC ne dépend ni du type d'instance ni de l'hyperviseur."
references:
  - title: Managing EC2 instances automatically with Default Host Management Configuration
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/managed-instances-default-host-management.html
