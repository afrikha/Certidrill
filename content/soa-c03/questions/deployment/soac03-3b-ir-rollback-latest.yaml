id: soac03-3b-ir-rollback-latest
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Auto Scaling group is configured with its launch template version set to `$Latest`, and the launch template specifies the AMI ID directly. Each month, an engineer creates a new launch template version and starts an instance refresh without a desired configuration. After a bad release, the company requires that the next instance refreshes can be rolled back, automatically or manually, while they are in progress.

    Which solution will meet this requirement?
  fr: |
    Un Auto Scaling group est configuré avec la version `$Latest` de son modèle de lancement, et le modèle de lancement indique directement l'ID de l'AMI. Chaque mois, un ingénieur crée une nouvelle version du modèle de lancement et démarre une actualisation d'instance sans configuration souhaitée. Après une mauvaise version, l'entreprise exige que les prochaines actualisations d'instance puissent être annulées par retour arrière, automatiquement ou manuellement, pendant qu'elles sont en cours.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Set the group to the $Default version, and pass $Default in the desired configuration of each refresh.", fr: "Passer le groupe à la version $Default, et indiquer $Default dans la configuration souhaitée de chaque actualisation." } }
    - { id: b, text: { en: "Set the group to its current numbered version, and pass the new numbered version in the desired configuration of each refresh.", fr: "Passer le groupe à sa version numérotée actuelle, et indiquer la nouvelle version numérotée dans la configuration souhaitée de chaque actualisation." } }
    - { id: c, text: { en: "Replace the AMI ID in the launch template with a Systems Manager parameter alias that points to the latest AMI.", fr: "Remplacer l'ID d'AMI du modèle de lancement par un alias de paramètre Systems Manager qui pointe vers la dernière AMI." } }
    - { id: d, text: { en: "Keep $Latest, and add checkpoints at 50% and 100% so that the refresh can be rolled back at the first checkpoint.", fr: "Conserver $Latest, et ajouter des points de contrôle à 50 % et 100 % pour pouvoir revenir en arrière au premier point de contrôle." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Instance refresh rollback is available only when the refresh specifies a desired configuration, and only to a specific numbered launch template version. Saving a numbered version on the group gives Auto Scaling a stable previous configuration, and the desired configuration names the new numbered version."
    fr: "Le retour arrière d'une actualisation d'instance n'est disponible que si l'actualisation indique une configuration souhaitée, et uniquement vers une version numérotée précise du modèle de lancement. Enregistrer une version numérotée sur le groupe donne à Auto Scaling une configuration précédente stable, et la configuration souhaitée désigne la nouvelle version numérotée."
  options:
    a:
      en: "Rollback is not available with $Default any more than with $Latest."
      fr: "Le retour arrière n'est pas plus disponible avec $Default qu'avec $Latest."
    c:
      en: "Rollback cannot return to a launch template that uses an AMI alias from Systems Manager Parameter Store."
      fr: "Le retour arrière ne peut pas revenir à un modèle de lancement qui utilise un alias d'AMI de Systems Manager Parameter Store."
    d:
      en: "Checkpoints pause the refresh but do not remove the restriction on $Latest; rollback stays unavailable."
      fr: "Les points de contrôle mettent l'actualisation en pause mais ne lèvent pas la restriction sur $Latest ; le retour arrière reste indisponible."
references:
  - title: Undo changes with a manual or auto rollback
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/instance-refresh-rollback.html
