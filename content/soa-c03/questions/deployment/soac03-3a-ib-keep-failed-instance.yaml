id: soac03-3a-ib-keep-failed-instance
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A build component of an EC2 Image Builder pipeline fails intermittently. The logs in Amazon S3 do not give enough detail, and an engineer wants to connect to the build instance after the next failure to inspect its state. The infrastructure configuration uses the default troubleshooting settings.

    What should the engineer do?
  fr: |
    Un composant de création d'un pipeline EC2 Image Builder échoue de façon intermittente. Les journaux dans Amazon S3 ne donnent pas assez de détails, et un ingénieur souhaite se connecter à l'instance de création après le prochain échec pour examiner son état. La configuration d'infrastructure utilise les paramètres de dépannage par défaut.

    Que doit faire l'ingénieur ?
body:
  options:
    - { id: a, text: { en: "Increase the timeout of the failing step in the build component so that the instance runs longer before it fails.", fr: "Augmenter le délai d'expiration de l'étape en échec dans le composant de création pour que l'instance s'exécute plus longtemps avant l'échec." } }
    - { id: b, text: { en: "Add a test component that runs a sleep command for several hours at the end of the image recipe.", fr: "Ajouter à la fin de la recette d'image un composant de test qui exécute une commande sleep pendant plusieurs heures." } }
    - { id: c, text: { en: "Change the pipeline's start condition to EXPRESSION_MATCH_ONLY so that the pipeline runs again after each failure.", fr: "Changer la condition de démarrage du pipeline en EXPRESSION_MATCH_ONLY pour que le pipeline s'exécute de nouveau après chaque échec." } }
    - { id: d, text: { en: "Clear Terminate instance on failure in the infrastructure configuration, and specify a key pair.", fr: "Décocher Terminate instance on failure dans la configuration d'infrastructure, et spécifier une paire de clés." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, Image Builder terminates the build or test instance when the pipeline fails. Turning off terminateInstanceOnFailure keeps the failed instance running so that the engineer can connect to it; the setting should be turned back on after the investigation so that failed instances do not keep running.
    fr: |
      Par défaut, Image Builder résilie l'instance de création ou de test lorsque le pipeline échoue. Désactiver terminateInstanceOnFailure conserve l'instance en échec pour que l'ingénieur puisse s'y connecter ; il faut réactiver le paramètre après l'analyse pour que les instances en échec ne restent pas en cours d'exécution.
  options:
    a:
      en: |
        A longer timeout delays the failure but the instance is still terminated as soon as the build fails.
      fr: |
        Un délai plus long retarde l'échec, mais l'instance est toujours résiliée dès que la création échoue.
    b:
      en: |
        Test components run only after a successful build, so they never run when the build component fails.
      fr: |
        Les composants de test ne s'exécutent qu'après une création réussie : ils ne s'exécutent donc jamais quand le composant de création échoue.
    c:
      en: |
        The start condition only decides when scheduled builds start; it does not keep a failed instance available.
      fr: |
        La condition de démarrage décide seulement quand les créations planifiées démarrent ; elle ne conserve pas une instance en échec.
references:
  - title: Troubleshoot Image Builder issues
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/troubleshooting.html
  - title: Manage Image Builder infrastructure configuration
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/manage-infra-config.html
