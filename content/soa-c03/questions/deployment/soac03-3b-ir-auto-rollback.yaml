id: soac03-3b-ir-auto-rollback
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Auto Scaling group uses version 6 of a launch template. An operator created version 7 with a new AMI and will deploy it with an instance refresh. An Amazon CloudWatch alarm already tracks HTTP 5xx errors of the application. If the alarm enters the ALARM state during the refresh, the instances replaced so far must automatically return to the version 6 configuration.

    Which solution will meet these requirements?
  fr: |
    Un Auto Scaling group utilise la version 6 d'un modèle de lancement. Un opérateur a créé la version 7 avec une nouvelle AMI et va la déployer avec une actualisation d'instance. Une alarme Amazon CloudWatch suit déjà les erreurs HTTP 5xx de l'application. Si l'alarme passe à l'état ALARM pendant l'actualisation, les instances déjà remplacées doivent revenir automatiquement à la configuration de la version 6.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Start the instance refresh with the alarm in AlarmSpecification and AutoRollback left at its default value.", fr: "Démarrer l'actualisation d'instance avec l'alarme dans AlarmSpecification et AutoRollback laissé à sa valeur par défaut." } }
    - { id: b, text: { en: "Set the group to the $Latest version, and start the instance refresh with AutoRollback set to true.", fr: "Passer le groupe à la version $Latest, et démarrer l'actualisation d'instance avec AutoRollback défini à true." } }
    - { id: c, text: { en: "Start the instance refresh with a desired configuration of version 7, AutoRollback set to true, and the alarm in AlarmSpecification.", fr: "Démarrer l'actualisation d'instance avec une configuration souhaitée en version 7, AutoRollback défini à true et l'alarme dans AlarmSpecification." } }
    - { id: d, text: { en: "Create an EventBridge rule on the alarm that invokes a Lambda function to cancel the instance refresh.", fr: "Créer une règle EventBridge sur l'alarme qui appelle une fonction Lambda pour annuler l'actualisation d'instance." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Auto rollback needs a desired configuration with a numbered launch template version. With AutoRollback set to true, an alarm from AlarmSpecification that enters ALARM fails the refresh and Auto Scaling replaces the new instances with the configuration last saved on the group, here version 6."
    fr: "Le retour arrière automatique exige une configuration souhaitée avec une version numérotée du modèle de lancement. Avec AutoRollback défini à true, une alarme de AlarmSpecification qui passe à ALARM fait échouer l'actualisation, et Auto Scaling remplace les nouvelles instances par la configuration enregistrée en dernier sur le groupe, ici la version 6."
  options:
    a:
      en: "AutoRollback is disabled by default; an alarm alone makes the refresh fail without rolling back."
      fr: "AutoRollback est désactivé par défaut ; une alarme seule fait échouer l'actualisation sans retour arrière."
    b:
      en: "Rollback is not available when the group uses the $Latest or $Default launch template version."
      fr: "Le retour arrière n'est pas disponible lorsque le groupe utilise la version $Latest ou $Default du modèle de lancement."
    d:
      en: "Cancelling stops the refresh but leaves the instances already replaced on version 7."
      fr: "L'annulation arrête l'actualisation mais laisse en version 7 les instances déjà remplacées."
references:
  - title: Undo changes with a manual or auto rollback
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/instance-refresh-rollback.html
