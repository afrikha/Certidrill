id: soac03-3b-ss-delegated-admin
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations, and trusted access for AWS CloudFormation StackSets is activated. The platform team works only in a member account named Tooling. The team must create and manage StackSets with service-managed permissions that target any organizational unit (OU), without signing in to the management account.

    Which combination of actions will meet these requirements? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise AWS Organizations, et l'accès approuvé pour AWS CloudFormation StackSets est activé. L'équipe plateforme travaille uniquement dans un compte membre nommé Tooling. L'équipe doit créer et gérer des StackSets avec des autorisations gérées par le service qui ciblent n'importe quelle unité d'organisation (OU), sans se connecter au compte de gestion.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the AWSCloudFormationStackSetAdministrationRole role in the Tooling account.", fr: "Créer le rôle AWSCloudFormationStackSetAdministrationRole dans le compte Tooling." } }
    - { id: b, text: { en: "From the management account, register the Tooling account as a delegated administrator for StackSets.", fr: "Depuis le compte de gestion, enregistrer le compte Tooling comme administrateur délégué pour StackSets." } }
    - { id: c, text: { en: "Create self-managed StackSets in the Tooling account that use the OU IDs as deployment targets.", fr: "Créer dans le compte Tooling des StackSets autogérés qui utilisent les ID d'OU comme cibles de déploiement." } }
    - { id: d, text: { en: "Attach an SCP to the root that allows all cloudformation actions for the Tooling account.", fr: "Attacher à la racine une SCP qui autorise toutes les actions cloudformation pour le compte Tooling." } }
    - { id: e, text: { en: "Run the StackSet commands from the Tooling account with the --call-as DELEGATED_ADMIN parameter.", fr: "Exécuter les commandes StackSet depuis le compte Tooling avec le paramètre --call-as DELEGATED_ADMIN." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "The management account registers a member account as a delegated administrator for the StackSets service principal (up to five per organization). Users in that account then pass CallAs set to DELEGATED_ADMIN on StackSet operations; the StackSets are still created in the management account and can target the whole organization or any OU."
    fr: "Le compte de gestion enregistre un compte membre comme administrateur délégué pour le principal de service StackSets (jusqu'à cinq par organisation). Les utilisateurs de ce compte passent ensuite CallAs à DELEGATED_ADMIN dans les opérations StackSet ; les StackSets sont toujours créés dans le compte de gestion et peuvent cibler toute l'organisation ou n'importe quelle OU."
  options:
    a:
      en: "The administration role is used only by self-managed StackSets; service-managed StackSets create their own roles."
      fr: "Le rôle d'administration n'est utilisé que par les StackSets autogérés ; les StackSets gérés par le service créent leurs propres rôles."
    c:
      en: "Self-managed StackSets deploy to account IDs, not to OUs, and require execution roles in every target account."
      fr: "Les StackSets autogérés déploient vers des ID de comptes, pas vers des OU, et exigent des rôles d'exécution dans chaque compte cible."
    d:
      en: "SCPs only limit the maximum permissions; they never grant the right to act as a StackSets administrator."
      fr: "Les SCP limitent seulement les autorisations maximales ; elles n'accordent jamais le droit d'agir comme administrateur StackSets."
references:
  - title: Register a delegated administrator member account
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html
  - title: CreateStackSet
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_CreateStackSet.html
