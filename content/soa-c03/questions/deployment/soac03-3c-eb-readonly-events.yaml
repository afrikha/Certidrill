id: soac03-3c-eb-readonly-events
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has an AWS CloudTrail trail that logs all management events. An Amazon EventBridge rule on the default event bus matches PutSecretValue calls to AWS Secrets Manager and works as expected. A second rule on the same bus, in the ENABLED state, matches GetSecretValue calls with the same pattern structure, but it never invokes its target, although CloudTrail shows the calls.

    Which change will make the second rule invoke its target?
  fr: |
    Une entreprise dispose d'un journal de suivi AWS CloudTrail qui enregistre tous les événements de gestion. Une règle Amazon EventBridge sur le bus d'événements par défaut correspond aux appels PutSecretValue vers AWS Secrets Manager et fonctionne comme prévu. Une seconde règle sur le même bus, à l'état ENABLED, correspond aux appels GetSecretValue avec la même structure de modèle, mais elle n'appelle jamais sa cible, alors que CloudTrail affiche les appels.

    Quelle modification permet à la seconde règle d'appeler sa cible ?
body:
  options:
    - { id: a, text: { en: "Change the state of the second rule to ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS.", fr: "Faire passer l'état de la seconde règle à ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS." } }
    - { id: b, text: { en: "Configure the trail to also log data events for AWS Secrets Manager.", fr: "Configurer le journal de suivi pour qu'il enregistre aussi les événements de données d'AWS Secrets Manager." } }
    - { id: c, text: { en: "Move the second rule to a custom event bus that receives the CloudTrail events.", fr: "Déplacer la seconde règle vers un bus d'événements personnalisé qui reçoit les événements CloudTrail." } }
    - { id: d, text: { en: "Add the readOnly field with the value true to the event pattern of the second rule.", fr: "Ajouter le champ readOnly avec la valeur true au modèle d'événement de la seconde règle." } }
answer: { optionId: a }
explanation:
  correct:
    en: "GetSecretValue is a read-only management event, and a rule in the default ENABLED state does not match read-only management events, so its targets are not invoked. Only rules in the ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS state receive them. PutSecretValue is a write event, which is why the first rule works."
    fr: "GetSecretValue est un événement de gestion en lecture seule, et une règle à l'état ENABLED par défaut ne correspond pas aux événements de gestion en lecture seule : ses cibles ne sont pas appelées. Seules les règles à l'état ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS les reçoivent. PutSecretValue est un événement en écriture, ce qui explique que la première règle fonctionne."
  options:
    b:
      en: "GetSecretValue is a management event that the trail already logs; data events do not change how the rule state filters read-only events."
      fr: "GetSecretValue est un événement de gestion que le journal de suivi enregistre déjà ; les événements de données ne changent pas le filtrage des événements en lecture seule par l'état de la règle."
    c:
      en: "CloudTrail events are delivered only to the default bus, and a forwarding rule would face the same read-only restriction."
      fr: "Les événements CloudTrail ne sont remis qu'au bus par défaut, et une règle de transfert subirait la même restriction sur les événements en lecture seule."
    d:
      en: "A narrower pattern cannot match events that a rule in the ENABLED state never receives."
      fr: "Un modèle plus restrictif ne peut pas correspondre à des événements qu'une règle à l'état ENABLED ne reçoit jamais."
references:
  - title: AWS service events delivered via AWS CloudTrail
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
