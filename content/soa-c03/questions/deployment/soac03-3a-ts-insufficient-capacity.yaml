id: soac03-3a-ts-insufficient-capacity
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Auto Scaling group launches c7i.4xlarge On-Demand Instances in two Availability Zones. During a large sales event, scale-out fails with a message that says there is not sufficient c7i.4xlarge capacity in the requested Availability Zone. The application can run on several compute optimized instance types and in any Availability Zone of the Region.

    Which actions will improve the group's ability to launch instances? (Choose two.) Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un groupe Auto Scaling lance des instances à la demande c7i.4xlarge dans deux zones de disponibilité. Pendant un grand événement commercial, la montée en charge échoue avec un message indiquant que la capacité c7i.4xlarge est insuffisante dans la zone de disponibilité demandée. L'application peut s'exécuter sur plusieurs types d'instances optimisées pour le calcul et dans n'importe quelle zone de disponibilité de la Région.

    Quelles actions améliorent la capacité du groupe à lancer des instances ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Request an increase of the account's On-Demand vCPU quota for the instance family.", fr: "Demander une augmentation du quota de vCPU à la demande du compte pour la famille d'instances." } }
    - { id: b, text: { en: "Add subnets in additional Availability Zones to the Auto Scaling group.", fr: "Ajouter au groupe Auto Scaling des sous-réseaux dans d'autres zones de disponibilité." } }
    - { id: c, text: { en: "Replace the subnets with larger subnets in the same two Availability Zones.", fr: "Remplacer les sous-réseaux par des sous-réseaux plus grands dans les deux mêmes zones de disponibilité." } }
    - { id: d, text: { en: "Increase the health check grace period of the Auto Scaling group.", fr: "Augmenter le délai de grâce de la vérification de l'état du groupe Auto Scaling." } }
    - { id: e, text: { en: "Use a mixed instances policy that specifies several compute optimized instance types.", fr: "Utiliser une politique d'instances mixtes qui spécifie plusieurs types d'instances optimisées pour le calcul." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Insufficient capacity means that AWS does not currently have enough capacity of this instance type in that Availability Zone. Spreading the group across more Availability Zones, or allowing several instance types, lets Amazon EC2 Auto Scaling find capacity elsewhere.
    fr: |
      Une capacité insuffisante signifie qu'AWS ne dispose pas actuellement d'assez de capacité pour ce type d'instance dans cette zone de disponibilité. Répartir le groupe sur davantage de zones de disponibilité, ou autoriser plusieurs types d'instances, permet à Amazon EC2 Auto Scaling de trouver de la capacité ailleurs.
  options:
    a:
      en: |
        A quota increase raises the account limit; it does not create physical capacity in the Availability Zone.
      fr: |
        Une augmentation de quota relève la limite du compte ; elle ne crée pas de capacité physique dans la zone de disponibilité.
    c:
      en: |
        The subnets have enough addresses; the shortage is instance capacity in the same zones.
      fr: |
        Les sous-réseaux ont assez d'adresses ; la pénurie concerne la capacité d'instances dans les mêmes zones.
    d:
      en: |
        The grace period delays health checks of launched instances; it does not affect whether instances can be launched.
      fr: |
        Le délai de grâce retarde les vérifications de l'état des instances lancées ; il n'influe pas sur la possibilité de lancer des instances.
references:
