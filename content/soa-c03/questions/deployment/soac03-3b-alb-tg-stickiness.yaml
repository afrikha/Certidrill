id: soac03-3b-alb-tg-stickiness
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Application Load Balancer listener rule forwards 90% of requests to a blue target group and 10% to a green target group during a blue/green deployment. The application keeps user sessions in memory on each version. Users report that they are signed out because their requests alternate between the two versions. Each user must stay on the same version during the test.

    Which solution will meet this requirement?
  fr: |
    Une règle d'écouteur d'Application Load Balancer transfère 90 % des requêtes vers un groupe cible bleu et 10 % vers un groupe cible vert pendant un déploiement bleu/vert. L'application garde les sessions utilisateur en mémoire sur chaque version. Des utilisateurs signalent qu'ils sont déconnectés parce que leurs requêtes alternent entre les deux versions. Chaque utilisateur doit rester sur la même version pendant le test.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Turn on sticky sessions on the green target group only.", fr: "Activer les sessions permanentes (sticky sessions) uniquement sur le groupe cible vert." } }
    - { id: b, text: { en: "Increase the deregistration delay of both target groups.", fr: "Augmenter le délai d'annulation d'enregistrement des deux groupes cibles." } }
    - { id: c, text: { en: "Change the weights to 50 and 50 so that requests are distributed evenly.", fr: "Changer les poids à 50 et 50 pour que les requêtes soient réparties uniformément." } }
    - { id: d, text: { en: "Turn on target group stickiness in the forward action of the listener rule.", fr: "Activer l'adhérence au groupe cible (target group stickiness) dans l'action de transfert de la règle d'écouteur." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Weighted forwarding does not keep a client on one target group by default. With target group stickiness enabled in the forward action, the load balancer sets the AWSALBTG cookie on the first request and routes later requests with that cookie to the same target group."
    fr: "Le transfert pondéré ne garde pas par défaut un client sur un groupe cible. Avec l'adhérence au groupe cible activée dans l'action de transfert, l'équilibreur de charge place le cookie AWSALBTG à la première requête et route les requêtes suivantes portant ce cookie vers le même groupe cible."
  options:
    a:
      en: "Sticky sessions on a target group pin a client to a target inside that group, and with several target groups the forward action also needs target group stickiness."
      fr: "Les sessions permanentes d'un groupe cible attachent un client à une cible de ce groupe, et avec plusieurs groupes cibles l'action de transfert a aussi besoin de l'adhérence au groupe cible."
    b:
      en: "The deregistration delay only lets in-flight requests finish when a target is removed."
      fr: "Le délai d'annulation d'enregistrement laisse seulement se terminer les requêtes en cours lorsqu'une cible est retirée."
    c:
      en: "Different weights still send each request independently, so users keep alternating."
      fr: "Des poids différents envoient toujours chaque requête indépendamment : les utilisateurs continuent d'alterner."
references:
  - title: Action types for listener rules
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-action-types.html
