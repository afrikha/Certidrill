id: soac03-3a-ts-asg-kms-internal-error
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    After a new security requirement, an operations engineer updated a launch template so that the EBS volumes of an Auto Scaling group are encrypted with a new customer managed AWS KMS key in the same account. The engineer's IAM role is allowed to use the key. Since the change, the activity history of the group shows Client.InternalError: Client error on launch, and no instance stays running.

    Which solution will resolve the issue?
  fr: |
    Suite à une nouvelle exigence de sécurité, un ingénieur d'exploitation a mis à jour un modèle de lancement pour que les volumes EBS d'un groupe Auto Scaling soient chiffrés avec une nouvelle clé AWS KMS gérée par le client dans le même compte. Le rôle IAM de l'ingénieur est autorisé à utiliser la clé. Depuis la modification, l'historique d'activité du groupe affiche Client.InternalError: Client error on launch, et aucune instance ne reste en cours d'exécution.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Grant the engineer's IAM role the kms:CreateGrant permission on the customer managed key.", fr: "Accorder au rôle IAM de l'ingénieur l'autorisation kms:CreateGrant sur la clé gérée par le client." } }
    - { id: b, text: { en: "Encrypt the volumes with the AWS managed key aws/ebs instead of the customer managed key.", fr: "Chiffrer les volumes avec la clé gérée par AWS aws/ebs au lieu de la clé gérée par le client." } }
    - { id: c, text: { en: "Add the role of the instances' instance profile to the key policy with the kms:Decrypt permission.", fr: "Ajouter le rôle du profil d'instance des instances à la politique de clé avec l'autorisation kms:Decrypt." } }
    - { id: d, text: { en: "In the key policy, allow the AWSServiceRoleForAutoScaling service-linked role to use the key and to create grants.", fr: "Dans la politique de clé, autoriser le rôle lié à un service AWSServiceRoleForAutoScaling à utiliser la clé et à créer des octrois." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon EC2 Auto Scaling launches instances with its service-linked role, which has access to AWS managed keys but not to customer managed keys. Client.InternalError on launch occurs when that role cannot use the key, and the fix is a key policy that allows the role kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey* and kms:DescribeKey, plus kms:CreateGrant with kms:GrantIsForAWSResource.
    fr: |
      Amazon EC2 Auto Scaling lance les instances avec son rôle lié à un service, qui a accès aux clés gérées par AWS mais pas aux clés gérées par le client. Client.InternalError au lancement se produit quand ce rôle ne peut pas utiliser la clé, et la correction est une politique de clé qui autorise ce rôle à kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey* et kms:DescribeKey, plus kms:CreateGrant avec kms:GrantIsForAWSResource.
  options:
    a:
      en: |
        The launches are made by the Auto Scaling service-linked role, not by the engineer's role, so its permissions do not matter here.
      fr: |
        Les lancements sont effectués par le rôle lié à un service d'Auto Scaling, pas par le rôle de l'ingénieur : ses autorisations n'entrent pas en jeu ici.
    b:
      en: |
        This would launch instances, but it breaks the requirement to use the customer managed key.
      fr: |
        Cela permettrait de lancer des instances, mais enfreint l'exigence d'utiliser la clé gérée par le client.
    c:
      en: |
        The volumes are created and attached before the instance profile is used, by the service-linked role that lacks access.
      fr: |
        Les volumes sont créés et attachés avant toute utilisation du profil d'instance, par le rôle lié à un service qui n'a pas accès à la clé.
references:
  - title: Required AWS KMS key policy for use with encrypted volumes
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/key-policy-requirements-EBS-encryption.html
  - title: "Troubleshoot Amazon EC2 Auto Scaling: EC2 instance launch failures"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ts-as-instancelaunchfailure.html
