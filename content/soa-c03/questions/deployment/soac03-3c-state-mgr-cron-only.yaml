id: soac03-3c-state-mgr-cron-only
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An administrator created a State Manager association that runs a disk cleanup document on all managed nodes tagged Tier=batch, with the schedule cron(0 3 ? * SUN *). The association ran immediately when it was created, and it also runs whenever a new batch node comes online, which disrupts running jobs. The association must keep its targets and schedule but run only at the scheduled time.

    Which change will meet this requirement?
  fr: |
    Un administrateur a créé une association State Manager qui exécute un document de nettoyage de disque sur tous les nœuds gérés balisés Tier=batch, avec la planification cron(0 3 ? * SUN *). L'association s'est exécutée immédiatement à sa création, et elle s'exécute aussi chaque fois qu'un nouveau nœud de traitement par lots se connecte, ce qui perturbe les tâches en cours. L'association doit conserver ses cibles et sa planification, mais s'exécuter uniquement à l'heure planifiée.

    Quelle modification répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Update the association so that it applies only at the next specified cron interval (ApplyOnlyAtCronInterval).", fr: "Mettre à jour l'association pour qu'elle s'applique uniquement au prochain intervalle cron spécifié (ApplyOnlyAtCronInterval)." } }
    - { id: b, text: { en: "Add a schedule offset of 1 day to the association so that each run waits one day after its trigger.", fr: "Ajouter un décalage de planification de 1 jour à l'association pour que chaque exécution attende un jour après son déclenchement." } }
    - { id: c, text: { en: "Replace the cron expression with the rate expression rate(7 days) so that runs follow a fixed interval.", fr: "Remplacer l'expression cron par l'expression rate(7 days) pour que les exécutions suivent un intervalle fixe." } }
    - { id: d, text: { en: "Set the maximum concurrency of the association to 1 so that only one node runs the document at a time.", fr: "Définir la simultanéité maximale de l'association sur 1 pour qu'un seul nœud exécute le document à la fois." } }
answer: { optionId: a }
explanation:
  correct:
    en: "By default, State Manager runs an association when it is created and when a matching node comes online for the first time, in addition to its schedule. The ApplyOnlyAtCronInterval option (Apply association only at the next specified cron interval in the console) suppresses these immediate runs, so the document runs only at the cron time."
    fr: "Par défaut, State Manager exécute une association à sa création et lorsqu'un nœud correspondant se connecte pour la première fois, en plus de sa planification. L'option ApplyOnlyAtCronInterval (Apply association only at the next specified cron interval dans la console) supprime ces exécutions immédiates : le document ne s'exécute alors qu'à l'heure cron."
  options:
    b:
      en: "An offset delays the scheduled runs by a number of days after the cron date; it does not stop the runs at creation or on new nodes."
      fr: "Un décalage retarde les exécutions planifiées d'un certain nombre de jours après la date cron ; il n'empêche pas les exécutions à la création ni sur les nouveaux nœuds."
    c:
      en: "A rate expression changes the schedule itself, and the association still runs at creation and on new targets."
      fr: "Une expression rate modifie la planification elle-même, et l'association s'exécute toujours à la création et sur les nouvelles cibles."
    d:
      en: "Concurrency limits how many nodes run at once, not when the association runs."
      fr: "La simultanéité limite le nombre de nœuds exécutés en même temps, pas le moment où l'association s'exécute."
references:
  - title: Understanding how State Manager works
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/state-manager-about.html
