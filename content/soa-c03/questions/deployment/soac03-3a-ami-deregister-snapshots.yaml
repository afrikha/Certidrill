id: soac03-3a-ami-deregister-snapshots
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations engineer deregistered 200 obsolete custom EBS-backed AMIs to reduce costs. The AMIs were not shared with other accounts, and no instance uses them. One month later, the bill shows that the EBS snapshot storage costs did not decrease.

    Which solution will reduce these storage costs?
  fr: |
    Un ingénieur d'exploitation a annulé l'enregistrement de 200 AMI personnalisées obsolètes basées sur EBS pour réduire les coûts. Les AMI n'étaient pas partagées avec d'autres comptes, et aucune instance ne les utilise. Un mois plus tard, la facture montre que les coûts de stockage des instantanés EBS n'ont pas baissé.

    Quelle solution permet de réduire ces coûts de stockage ?
body:
  options:
    - { id: a, text: { en: "Wait for the end of the Recycle Bin retention period, after which Amazon EC2 deletes the snapshots of deregistered AMIs.", fr: "Attendre la fin de la période de conservation de la Corbeille, après laquelle Amazon EC2 supprime les instantanés des AMI dont l'enregistrement a été annulé." } }
    - { id: b, text: { en: "Move the snapshots to the EBS Snapshots Archive tier, because the snapshots of deregistered AMIs cannot be deleted.", fr: "Déplacer les instantanés vers le niveau EBS Snapshots Archive, car les instantanés des AMI dont l'enregistrement a été annulé ne peuvent pas être supprimés." } }
    - { id: c, text: { en: "Stop the instances that were launched from these AMIs in the past, because their volumes keep the snapshots billed.", fr: "Arrêter les instances lancées autrefois à partir de ces AMI, car leurs volumes maintiennent la facturation des instantanés." } }
    - { id: d, text: { en: "Delete the snapshots of the deregistered AMIs, and delete associated snapshots when deregistering AMIs in the future.", fr: "Supprimer les instantanés des AMI dont l'enregistrement a été annulé, et supprimer à l'avenir les instantanés associés lors de l'annulation de l'enregistrement." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, deregistering an AMI has no effect on the snapshots created with it, and their storage is still billed. The engineer must delete those snapshots; deregister-image also accepts --delete-associated-snapshots to delete them in the same operation, except snapshots that other AMIs still use.
    fr: |
      Par défaut, annuler l'enregistrement d'une AMI n'a aucun effet sur les instantanés créés avec elle, et leur stockage reste facturé. L'ingénieur doit supprimer ces instantanés ; deregister-image accepte aussi --delete-associated-snapshots pour les supprimer dans la même opération, sauf les instantanés encore utilisés par d'autres AMI.
  options:
    a:
      en: |
        The Recycle Bin keeps deleted resources only when a retention rule exists, and it does not delete the snapshots of a deregistered AMI for you.
      fr: |
        La Corbeille ne conserve des ressources supprimées que si une règle de conservation existe, et elle ne supprime pas à votre place les instantanés d'une AMI dont l'enregistrement a été annulé.
    b:
      en: |
        These snapshots can be deleted once their AMI is deregistered; archiving them still incurs storage costs.
      fr: |
        Ces instantanés peuvent être supprimés une fois l'enregistrement de leur AMI annulé ; les archiver entraîne toujours des coûts de stockage.
    c:
      en: |
        Instance volumes are separate resources; they do not keep the AMI snapshots billed, and no instance uses these AMIs.
      fr: |
        Les volumes des instances sont des ressources distinctes ; ils ne maintiennent pas la facturation des instantanés des AMI, et aucune instance n'utilise ces AMI.
references:
  - title: Deregister an Amazon EC2 AMI
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/deregister-ami.html
