id: soac03-3a-ts-ami-not-found-region
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CloudFormation template that creates an Amazon EC2 instance deploys successfully in us-east-1. The same template, deployed in eu-central-1 with the same parameter values, fails with InvalidAMIID.NotFound for the AMI ID passed in the ImageId parameter. The AMI is a private AMI that the same account owns.

    Which solution will resolve the error?
  fr: |
    Un modèle AWS CloudFormation qui crée une instance Amazon EC2 se déploie correctement dans us-east-1. Le même modèle, déployé dans eu-central-1 avec les mêmes valeurs de paramètres, échoue avec InvalidAMIID.NotFound pour l'ID d'AMI transmis dans le paramètre ImageId. L'AMI est une AMI privée qui appartient au même compte.

    Quelle solution permet de résoudre l'erreur ?
body:
  options:
    - { id: a, text: { en: "Share the AMI with the account itself so that the AMI ID can be used in every Region.", fr: "Partager l'AMI avec le compte lui-même pour que l'ID d'AMI puisse être utilisé dans toutes les Régions." } }
    - { id: b, text: { en: "Make the AMI public so that its ID resolves in every Region.", fr: "Rendre l'AMI publique pour que son ID soit résolu dans toutes les Régions." } }
    - { id: c, text: { en: "Copy the AMI to eu-central-1, and pass the ID of the copy to the stack in that Region.", fr: "Copier l'AMI dans eu-central-1, et transmettre l'ID de la copie à la pile dans cette Région." } }
    - { id: d, text: { en: "Add the eu-central-1 Region to the launch permissions of the AMI.", fr: "Ajouter la Région eu-central-1 aux autorisations de lancement de l'AMI." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AMIs are Regional resources: an AMI ID exists only in its Region, so InvalidAMIID.NotFound is returned elsewhere. Copying the AMI creates a new AMI with a different ID in eu-central-1, and that ID must be passed to the stack in that Region, for example through a Region-specific parameter.
    fr: |
      Les AMI sont des ressources régionales : un ID d'AMI n'existe que dans sa Région, d'où l'erreur InvalidAMIID.NotFound ailleurs. Copier l'AMI crée une nouvelle AMI avec un ID différent dans eu-central-1, et c'est cet ID qu'il faut transmettre à la pile dans cette Région, par exemple via un paramètre propre à la Région.
  options:
    a:
      en: |
        The owner already has access to its AMI; sharing does not make an AMI exist in another Region.
      fr: |
        Le propriétaire a déjà accès à son AMI ; le partage ne fait pas exister une AMI dans une autre Région.
    b:
      en: |
        A public AMI is still available only in its own Region, and making it public exposes it to everyone.
      fr: |
        Une AMI publique reste disponible uniquement dans sa propre Région, et la rendre publique l'expose à tout le monde.
    d:
      en: |
        Launch permissions grant access to accounts, organizations or OUs, not to Regions.
      fr: |
        Les autorisations de lancement donnent accès à des comptes, des organisations ou des OU, pas à des Régions.
references:
  - title: Error codes for the Amazon EC2 API
    url: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/errors-overview.html
  - title: Copy an Amazon EC2 AMI
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/CopyingAMIs.html
