id: soac03-3a-cfn-retain-db-replace-delete
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company manages an Amazon RDS for MySQL DB instance in an AWS CloudFormation stack. Two incidents happened in test environments: a template change to a property that requires replacement deleted the original DB instance during a stack update, and a stack deletion deleted another DB instance. In production, the original DB instance must stay in place with its data in both situations, and the stack operations must still be able to complete.

    Which combination of template changes will meet these requirements? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une entreprise gère une instance de base de données Amazon RDS for MySQL dans une pile AWS CloudFormation. Deux incidents se sont produits dans des environnements de test : une modification de modèle portant sur une propriété qui exige un remplacement a supprimé l'instance de base de données d'origine pendant une mise à jour de pile, et une suppression de pile a supprimé une autre instance de base de données. En production, l'instance de base de données d'origine doit rester en place avec ses données dans les deux situations, et les opérations de pile doivent toujours pouvoir aboutir.

    Quelle combinaison de modifications du modèle répond à ces exigences ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add DeletionPolicy: Snapshot to the DB instance resource.", fr: "Ajouter DeletionPolicy: Snapshot à la ressource d'instance de base de données." } }
    - { id: b, text: { en: "Add DeletionPolicy: Retain to the DB instance resource.", fr: "Ajouter DeletionPolicy: Retain à la ressource d'instance de base de données." } }
    - { id: c, text: { en: "Add a stack policy that denies Update:Replace on the DB instance.", fr: "Ajouter une politique de pile qui refuse Update:Replace sur l'instance de base de données." } }
    - { id: d, text: { en: "Add UpdateReplacePolicy: Retain to the DB instance resource.", fr: "Ajouter UpdateReplacePolicy: Retain à la ressource d'instance de base de données." } }
    - { id: e, text: { en: "Enable termination protection on the stack.", fr: "Activer la protection contre la résiliation de la pile." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      UpdateReplacePolicy applies only when a resource is replaced during a stack update: Retain keeps the old physical DB instance while CloudFormation creates the new one. DeletionPolicy applies when the stack is deleted or the resource is removed from the template: Retain keeps the DB instance. Both operations still complete, and the retained instance leaves CloudFormation's scope.
    fr: |
      UpdateReplacePolicy ne s'applique que lorsqu'une ressource est remplacée pendant une mise à jour de pile : Retain conserve l'ancienne instance de base de données physique pendant que CloudFormation crée la nouvelle. DeletionPolicy s'applique lorsque la pile est supprimée ou que la ressource est retirée du modèle : Retain conserve l'instance de base de données. Les deux opérations aboutissent, et l'instance conservée sort du périmètre de CloudFormation.
  options:
    a:
      en: |
        Snapshot keeps a snapshot of the data but deletes the DB instance itself, and the instance must stay in place.
      fr: |
        Snapshot conserve un instantané des données mais supprime l'instance de base de données elle-même, alors que l'instance doit rester en place.
    c:
      en: |
        A stack policy that denies replacement makes such updates fail instead of letting them complete.
      fr: |
        Une politique de pile qui refuse le remplacement fait échouer ces mises à jour au lieu de les laisser aboutir.
    e:
      en: |
        Termination protection makes stack deletion fail; it does not let the deletion complete while keeping the DB instance.
      fr: |
        La protection contre la résiliation fait échouer la suppression de la pile ; elle ne permet pas à la suppression d'aboutir en conservant l'instance.
references:
  - title: UpdateReplacePolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-attribute-updatereplacepolicy.html
