id: soac03-3a-cdk-removal-policy-destroy
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team creates short-lived test environments with an AWS CDK app that defines an Amazon S3 bucket and an Amazon DynamoDB table with fixed names and default construct settings. After cdk destroy, the bucket and the table still exist, and the next deployment of the environment fails because of a name conflict. In the test environments, the bucket, its objects and the table must be deleted with the stack.

    Which solution will meet these requirements?
  fr: |
    Une équipe crée des environnements de test éphémères avec une application AWS CDK qui définit un compartiment Amazon S3 et une table Amazon DynamoDB avec des noms fixes et les paramètres par défaut des constructions. Après cdk destroy, le compartiment et la table existent toujours, et le déploiement suivant de l'environnement échoue à cause d'un conflit de noms. Dans les environnements de test, le compartiment, ses objets et la table doivent être supprimés avec la pile.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run cdk destroy with the --force option.", fr: "Exécuter cdk destroy avec l'option --force." } }
    - { id: b, text: { en: "Set the removal policy of the bucket and the table to RemovalPolicy.RETAIN, and empty the bucket before each cdk destroy.", fr: "Définir la politique de suppression du compartiment et de la table sur RemovalPolicy.RETAIN, et vider le compartiment avant chaque cdk destroy." } }
    - { id: c, text: { en: "Set removalPolicy to RemovalPolicy.DESTROY on the bucket and the table, and set autoDeleteObjects to true on the bucket.", fr: "Définir removalPolicy sur RemovalPolicy.DESTROY pour le compartiment et la table, et définir autoDeleteObjects sur true pour le compartiment." } }
    - { id: d, text: { en: "Enable termination protection on the stack so that CloudFormation deletes the resources in the right order.", fr: "Activer la protection contre la résiliation de la pile pour que CloudFormation supprime les ressources dans le bon ordre." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the AWS CDK, resources that keep persistent data, such as S3 buckets and DynamoDB tables, have a removal policy whose default is RETAIN, the opposite of the CloudFormation default. DESTROY deletes them with the stack, and because CloudFormation cannot delete a bucket that contains objects, autoDeleteObjects makes the CDK empty the bucket first.
    fr: |
      Dans l'AWS CDK, les ressources qui conservent des données persistantes, comme les compartiments S3 et les tables DynamoDB, ont une politique de suppression (removal policy) dont la valeur par défaut est RETAIN, l'inverse de la valeur par défaut de CloudFormation. DESTROY les supprime avec la pile, et comme CloudFormation ne peut pas supprimer un compartiment qui contient des objets, autoDeleteObjects fait vider le compartiment par le CDK au préalable.
  options:
    a:
      en: |
        --force only skips the confirmation prompt; the retained resources are still kept.
      fr: |
        --force supprime seulement la demande de confirmation ; les ressources conservées le restent.
    b:
      en: |
        RETAIN is already the default and is the cause of the problem: the resources are orphaned when the stack is destroyed.
      fr: |
        RETAIN est déjà la valeur par défaut et c'est la cause du problème : les ressources deviennent orphelines lors de la destruction de la pile.
    d:
      en: |
        Termination protection makes the stack deletion fail; it does not delete retained resources.
      fr: |
        La protection contre la résiliation fait échouer la suppression de la pile ; elle ne supprime pas les ressources conservées.
references:
  - title: Resources and the AWS CDK
    url: https://docs.aws.amazon.com/cdk/v2/guide/resources.html
