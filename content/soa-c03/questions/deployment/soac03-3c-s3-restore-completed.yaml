id: soac03-3c-s3-restore-completed
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company stores archived video files in the S3 Glacier Flexible Retrieval storage class. Editors start restore requests and then check the bucket repeatedly to see whether the temporary copies are ready. The company wants editors to receive an email as soon as a restored copy is available.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias stocke des fichiers vidéo archivés dans la classe de stockage S3 Glacier Flexible Retrieval. Les monteurs lancent des demandes de restauration, puis consultent régulièrement le compartiment pour savoir si les copies temporaires sont prêtes. L'entreprise veut que les monteurs reçoivent un e-mail dès qu'une copie restaurée est disponible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure an S3 event notification for s3:ObjectRestore:Post events that publishes to an SNS topic with email subscriptions.", fr: "Configurer une notification d'événement S3 pour les événements s3:ObjectRestore:Post qui publie dans une rubrique SNS avec des abonnements par e-mail." } }
    - { id: b, text: { en: "Configure an S3 event notification for s3:ObjectCreated:* events that publishes to an SNS topic with email subscriptions.", fr: "Configurer une notification d'événement S3 pour les événements s3:ObjectCreated:* qui publie dans une rubrique SNS avec des abonnements par e-mail." } }
    - { id: c, text: { en: "Configure an S3 event notification for s3:ObjectRestore:Completed events that publishes to an SNS topic with email subscriptions.", fr: "Configurer une notification d'événement S3 pour les événements s3:ObjectRestore:Completed qui publie dans une rubrique SNS avec des abonnements par e-mail." } }
    - { id: d, text: { en: "Configure an S3 event notification for s3:LifecycleTransition events that publishes to an SNS topic with email subscriptions.", fr: "Configurer une notification d'événement S3 pour les événements s3:LifecycleTransition qui publie dans une rubrique SNS avec des abonnements par e-mail." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon S3 sends s3:ObjectRestore:Completed when the restore of an object from S3 Glacier Flexible Retrieval, S3 Glacier Deep Archive, or an archive tier of S3 Intelligent-Tiering finishes. Publishing these events to an SNS topic with email subscriptions tells the editors that the temporary copy is ready."
    fr: "Amazon S3 envoie s3:ObjectRestore:Completed lorsque la restauration d'un objet depuis S3 Glacier Flexible Retrieval, S3 Glacier Deep Archive ou un niveau d'archive de S3 Intelligent-Tiering est terminée. Publier ces événements dans une rubrique SNS avec des abonnements par e-mail indique aux monteurs que la copie temporaire est prête."
  options:
    a:
      en: "s3:ObjectRestore:Post is sent when the restore starts, hours before the copy is available."
      fr: "s3:ObjectRestore:Post est envoyé au démarrage de la restauration, des heures avant que la copie soit disponible."
    b:
      en: "A restore creates a temporary copy of an existing object; it is not an object creation, so ObjectCreated events are not sent."
      fr: "Une restauration crée une copie temporaire d'un objet existant ; ce n'est pas une création d'objet : les événements ObjectCreated ne sont pas envoyés."
    d:
      en: "s3:LifecycleTransition reports objects that a Lifecycle rule moves to another storage class, not completed restores."
      fr: "s3:LifecycleTransition signale les objets qu'une règle de cycle de vie déplace vers une autre classe de stockage, pas les restaurations terminées."
references:
  - title: Event notification types and destinations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-event-types-and-destinations.html
