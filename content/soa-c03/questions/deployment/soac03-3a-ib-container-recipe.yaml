id: soac03-3a-ib-container-recipe
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company already uses EC2 Image Builder components to harden its AMIs. It now wants Image Builder to build, on a schedule, a hardened Docker image that uses the same components, and to store the image in an Amazon ECR private repository. The build instances have internet access.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise déjà des composants EC2 Image Builder pour renforcer ses AMI. Elle souhaite maintenant qu'Image Builder crée, selon une planification, une image Docker renforcée qui utilise les mêmes composants, et qu'il stocke l'image dans un référentiel privé Amazon ECR. Les instances de création ont accès à Internet.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a container recipe with a Dockerfile template, the components and the target ECR repository.", fr: "Créer une recette de conteneur avec un modèle de Dockerfile, les composants et le référentiel ECR cible." } }
    - { id: b, text: { en: "Create an image recipe with a Docker output type, and add the ECR repository to the infrastructure configuration.", fr: "Créer une recette d'image avec un type de sortie Docker, et ajouter le référentiel ECR à la configuration d'infrastructure." } }
    - { id: c, text: { en: "Attach the EC2InstanceProfileForImageBuilderECRContainerBuilds policy to the instance profile role.", fr: "Attacher la politique EC2InstanceProfileForImageBuilderECRContainerBuilds au rôle du profil d'instance." } }
    - { id: d, text: { en: "Create an ECR pull through cache rule so that Image Builder can push the image to the repository.", fr: "Créer une règle de cache d'extraction ECR pour qu'Image Builder puisse transférer l'image vers le référentiel." } }
    - { id: e, text: { en: "Attach the AmazonEC2ContainerRegistryReadOnly managed policy to the Image Builder service-linked role.", fr: "Attacher la politique gérée AmazonEC2ContainerRegistryReadOnly au rôle lié à un service d'Image Builder." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Docker images are produced by a container recipe, which combines a Dockerfile template with components and defines the target ECR repository. The build instance pushes the image, so its instance profile needs the EC2InstanceProfileForImageBuilderECRContainerBuilds managed policy in addition to the usual Image Builder and Systems Manager policies.
    fr: |
      Les images Docker sont produites par une recette de conteneur, qui associe un modèle de Dockerfile à des composants et définit le référentiel ECR cible. C'est l'instance de création qui transfère l'image : son profil d'instance a donc besoin de la politique gérée EC2InstanceProfileForImageBuilderECRContainerBuilds en plus des politiques habituelles d'Image Builder et de Systems Manager.
  options:
    b:
      en: |
        Image recipes produce AMIs; container images require a container recipe, and the infrastructure configuration does not define the output repository.
      fr: |
        Les recettes d'image produisent des AMI ; les images de conteneur exigent une recette de conteneur, et la configuration d'infrastructure ne définit pas le référentiel de sortie.
    d:
      en: |
        A pull through cache caches images from an upstream registry for pulls; it is not used to push build output.
      fr: |
        Un cache d'extraction met en cache des images d'un registre en amont pour les extractions ; il ne sert pas à transférer le résultat d'une création.
    e:
      en: |
        Read-only permissions cannot push images, the push is made by the build instance, and service-linked role permissions cannot be edited.
      fr: |
        Des autorisations en lecture seule ne permettent pas de transférer des images, le transfert est fait par l'instance de création, et les autorisations d'un rôle lié à un service ne peuvent pas être modifiées.
references:
  - title: How EC2 Image Builder works
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/how-image-builder-works.html
  - title: Get set up to build custom images with Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/set-up-ib-env.html
