id: soac03-3c-inventory-data-sync
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company collects AWS Systems Manager Inventory from managed nodes in 12 accounts and 3 AWS Regions of its organization. Auditors want to run SQL queries against the installed software of all the nodes from one place, and the data must stay up to date as Inventory collects new data.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise collecte l'inventaire AWS Systems Manager (Inventory) des nœuds gérés de 12 comptes et de 3 Régions AWS de son organisation. Les auditeurs veulent exécuter des requêtes SQL sur les logiciels installés de tous les nœuds depuis un emplacement unique, et les données doivent rester à jour à mesure qu'Inventory collecte de nouvelles données.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create resource data syncs that send the inventory of every account and Region to a central Amazon S3 bucket, and query it with Amazon Athena.", fr: "Créer des synchronisations de données de ressources qui envoient l'inventaire de chaque compte et de chaque Région vers un compartiment Amazon S3 central, et l'interroger avec Amazon Athena." } }
    - { id: b, text: { en: "Use Run Command every day to list the installed packages on all nodes, send the output to an Amazon S3 bucket, and parse the files with a script.", fr: "Utiliser Run Command chaque jour pour lister les packages installés sur tous les nœuds, envoyer la sortie vers un compartiment Amazon S3 et analyser les fichiers avec un script." } }
    - { id: c, text: { en: "Open Fleet Manager in each account and Region, and export the inventory of the managed nodes to CSV files for the auditors.", fr: "Ouvrir Fleet Manager dans chaque compte et chaque Région, et exporter l'inventaire des nœuds gérés dans des fichiers CSV pour les auditeurs." } }
    - { id: d, text: { en: "Install the CloudWatch agent on all nodes to collect the installed software, and query the logs with CloudWatch Logs Insights.", fr: "Installer l'agent CloudWatch sur tous les nœuds pour collecter les logiciels installés, et interroger les journaux avec CloudWatch Logs Insights." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A resource data sync sends the inventory data of managed nodes to one Amazon S3 bucket and updates it whenever Inventory collects new data. A sync is created in each Region, all pointing to the same bucket, and the bucket policy (or an organization-based sync) lets every account write under its own accountid= prefix. Amazon Athena then runs SQL queries on the aggregated data."
    fr: "Une synchronisation de données de ressources envoie les données d'inventaire des nœuds gérés vers un seul compartiment Amazon S3 et les met à jour chaque fois qu'Inventory collecte de nouvelles données. Une synchronisation est créée dans chaque Région, toutes pointant vers le même compartiment, et la politique de compartiment (ou une synchronisation basée sur l'organisation) permet à chaque compte d'écrire sous son propre préfixe accountid=. Amazon Athena exécute ensuite des requêtes SQL sur les données agrégées."
  options:
    b:
      en: "This rebuilds Inventory with custom scripts and parsing, which is much more work and duplicates data that Inventory already collects."
      fr: "Cela reconstruit Inventory avec des scripts et une analyse personnalisés, ce qui représente bien plus de travail et duplique des données qu'Inventory collecte déjà."
    c:
      en: "Manual exports from 36 account-Region pairs are not a single queryable source and are stale as soon as Inventory collects new data."
      fr: "Des exports manuels depuis 36 couples compte-Région ne forment pas une source unique interrogeable et deviennent obsolètes dès qu'Inventory collecte de nouvelles données."
    d:
      en: "The CloudWatch agent collects metrics and log files, not the software inventory of the nodes."
      fr: "L'agent CloudWatch collecte des métriques et des fichiers journaux, pas l'inventaire logiciel des nœuds."
references:
  - title: Creating a resource data sync for Inventory
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/inventory-create-resource-data-sync.html
