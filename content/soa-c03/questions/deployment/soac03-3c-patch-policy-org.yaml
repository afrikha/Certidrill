id: soac03-3c-patch-policy-org
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations with 40 member accounts. Amazon EC2 managed nodes run in three AWS Regions in every account. The operations team must scan all nodes for missing patches every day and install approved patches every Sunday night, and it wants to manage this from one central configuration.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise AWS Organizations avec 40 comptes membres. Des nœuds gérés Amazon EC2 s'exécutent dans trois Régions AWS dans chaque compte. L'équipe d'exploitation doit analyser tous les nœuds chaque jour pour détecter les correctifs manquants et installer les correctifs approuvés chaque dimanche soir, et elle veut gérer cela depuis une configuration centrale unique.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create a maintenance window in each account and Region with two Run Command tasks that run AWS-RunPatchBaseline, one to scan and one to install.", fr: "Créer une fenêtre de maintenance dans chaque compte et chaque Région avec deux tâches Run Command qui exécutent AWS-RunPatchBaseline, l'une pour l'analyse et l'autre pour l'installation." } }
    - { id: b, text: { en: "Create a patch policy in Quick Setup from the management account that targets the organization and the three Regions, with a daily scan and a weekly install schedule.", fr: "Créer une politique de correctifs dans Quick Setup depuis le compte de gestion qui cible l'organisation et les trois Régions, avec une analyse quotidienne et une installation hebdomadaire." } }
    - { id: c, text: { en: "Create a State Manager association in the management account that runs AWS-RunPatchBaseline every day on all the managed nodes of the organization.", fr: "Créer une association State Manager dans le compte de gestion qui exécute AWS-RunPatchBaseline chaque jour sur tous les nœuds gérés de l'organisation." } }
    - { id: d, text: { en: "Create two EventBridge Scheduler schedules in each account and Region that call SendCommand with AWS-RunPatchBaseline to scan and to install.", fr: "Créer deux planifications EventBridge Scheduler dans chaque compte et chaque Région qui appellent SendCommand avec AWS-RunPatchBaseline pour l'analyse et pour l'installation." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Patch policies, created with Quick Setup, are the recommended way to configure patching across an organization. One policy can target all accounts and the chosen Regions, with separate scan and install schedules and the patch baseline of each operating system. Compliance is still reported per account-Region pair."
    fr: "Les politiques de correctifs, créées avec Quick Setup, sont la méthode recommandée pour configurer l'application des correctifs dans une organisation. Une seule politique peut cibler tous les comptes et les Régions choisies, avec des planifications distinctes d'analyse et d'installation et le référentiel de correctifs de chaque système d'exploitation. La conformité reste signalée par couple compte-Région."
  options:
    a:
      en: "Maintenance windows work in one account-Region pair each, so the team must build and maintain 120 windows instead of one configuration."
      fr: "Une fenêtre de maintenance ne s'applique qu'à un couple compte-Région : l'équipe doit créer et maintenir 120 fenêtres au lieu d'une configuration."
    c:
      en: "An association targets nodes in its own account and Region only, and a single daily install schedule does not provide the weekly install."
      fr: "Une association ne cible que les nœuds de son propre compte et de sa propre Région, et une seule planification quotidienne ne fournit pas l'installation hebdomadaire."
    d:
      en: "Schedules in every account and Region are 240 separate resources to create and maintain, which is far more overhead than one patch policy."
      fr: "Des planifications dans chaque compte et chaque Région représentent 240 ressources distinctes à créer et à maintenir, soit bien plus de charge qu'une seule politique de correctifs."
references:
  - title: Patch policy configurations in Quick Setup
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-policies.html
