id: soac03-3c-automation-executescript
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team is writing a custom AWS Systems Manager Automation runbook. One step must call several AWS APIs, loop over the returned Amazon EBS volumes, and decide which volumes to tag based on their attachment history. The step finishes in less than 2 minutes. The team does not want to maintain an EC2 instance or a separate AWS Lambda function for this logic.

    Which runbook action should the team use for this step?
  fr: |
    Une équipe d'exploitation écrit un runbook AWS Systems Manager Automation personnalisé. Une étape doit appeler plusieurs API AWS, parcourir en boucle les volumes Amazon EBS renvoyés et décider quels volumes baliser en fonction de leur historique d'attachement. L'étape se termine en moins de 2 minutes. L'équipe ne veut maintenir ni instance EC2 ni fonction AWS Lambda distincte pour cette logique.

    Quelle action de runbook l'équipe doit-elle utiliser pour cette étape ?
body:
  options:
    - { id: a, text: { en: "aws:runCommand with the AWS-RunShellScript document on a utility EC2 instance", fr: "aws:runCommand avec le document AWS-RunShellScript sur une instance EC2 utilitaire" } }
    - { id: b, text: { en: "aws:invokeLambdaFunction that calls a function containing the logic", fr: "aws:invokeLambdaFunction qui appelle une fonction contenant la logique" } }
    - { id: c, text: { en: "aws:executeAwsApi with a single API call and an output selector", fr: "aws:executeAwsApi avec un seul appel d'API et un sélecteur de sortie" } }
    - { id: d, text: { en: "aws:executeScript with a Python script that contains the logic", fr: "aws:executeScript avec un script Python qui contient la logique" } }
answer: { optionId: d }
explanation:
  correct:
    en: "aws:executeScript runs a Python or PowerShell script inside the automation, with fixed memory and disk and a maximum of 600 seconds per step. The script can call several APIs, loop and branch, and return values to the step outputs, with no instance or Lambda function to maintain."
    fr: "aws:executeScript exécute un script Python ou PowerShell au sein de l'automatisation, avec une mémoire et un disque fixes et 600 secondes au maximum par étape. Le script peut appeler plusieurs API, utiliser des boucles et des conditions, et renvoyer des valeurs dans les sorties de l'étape, sans instance ni fonction Lambda à maintenir."
  options:
    a:
      en: "Run Command needs a managed node to run the script, which is the utility instance the team does not want to maintain."
      fr: "Run Command a besoin d'un nœud géré pour exécuter le script, c'est-à-dire de l'instance utilitaire que l'équipe ne veut pas maintenir."
    b:
      en: "This action works, but the logic lives in a separate Lambda function that the team would have to deploy and maintain."
      fr: "Cette action fonctionne, mais la logique se trouve dans une fonction Lambda distincte que l'équipe devrait déployer et maintenir."
    c:
      en: "aws:executeAwsApi calls one API operation per step and cannot loop over results or apply custom decision logic."
      fr: "aws:executeAwsApi appelle une seule opération d'API par étape et ne peut ni parcourir les résultats en boucle ni appliquer une logique de décision personnalisée."
references:
  - title: aws:executeScript – Run a script
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-executeScript.html
