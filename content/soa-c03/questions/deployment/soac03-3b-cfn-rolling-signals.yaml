id: soac03-3b-cfn-rolling-signals
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CloudFormation template defines an Auto Scaling group with MinSize 2, MaxSize 8, and DesiredCapacity 6. Its instances run cfn-signal when the application is ready. When the launch template changes, CloudFormation must replace the instances inside the same group 2 at a time, keep at least 4 instances in service, and start the next batch only after each new instance of the current batch has signaled success within 15 minutes.

    Which update policy will meet these requirements?
  fr: |
    Un modèle AWS CloudFormation définit un Auto Scaling group avec MinSize 2, MaxSize 8 et DesiredCapacity 6. Ses instances exécutent cfn-signal lorsque l'application est prête. Lorsque le modèle de lancement change, CloudFormation doit remplacer les instances dans le même groupe 2 par 2, garder au moins 4 instances en service, et ne commencer le lot suivant qu'après que chaque nouvelle instance du lot en cours a signalé son succès dans un délai de 15 minutes.

    Quelle politique de mise à jour répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "AutoScalingRollingUpdate with MaxBatchSize 2, MinInstancesInService 4, WaitOnResourceSignals false, and PauseTime PT15M", fr: "AutoScalingRollingUpdate avec MaxBatchSize 2, MinInstancesInService 4, WaitOnResourceSignals false et PauseTime PT15M" } }
    - { id: b, text: { en: "AutoScalingReplacingUpdate with WillReplace true and a CreationPolicy timeout of PT15M", fr: "AutoScalingReplacingUpdate avec WillReplace true et un délai de CreationPolicy de PT15M" } }
    - { id: c, text: { en: "AutoScalingRollingUpdate with MaxBatchSize 4, MinInstancesInService 2, WaitOnResourceSignals true, and PauseTime PT15M", fr: "AutoScalingRollingUpdate avec MaxBatchSize 4, MinInstancesInService 2, WaitOnResourceSignals true et PauseTime PT15M" } }
    - { id: d, text: { en: "AutoScalingRollingUpdate with MaxBatchSize 2, MinInstancesInService 4, WaitOnResourceSignals true, and PauseTime PT15M", fr: "AutoScalingRollingUpdate avec MaxBatchSize 2, MinInstancesInService 4, WaitOnResourceSignals true et PauseTime PT15M" } }
answer: { optionId: d }
explanation:
  correct:
    en: "MaxBatchSize is the number of instances replaced at once and MinInstancesInService is the number that must stay in service. With WaitOnResourceSignals set to true, PauseTime becomes the time CloudFormation waits for the success signals of a batch before it continues or fails the update."
    fr: "MaxBatchSize est le nombre d'instances remplacées à la fois et MinInstancesInService le nombre qui doit rester en service. Avec WaitOnResourceSignals défini à true, PauseTime devient le délai pendant lequel CloudFormation attend les signaux de succès d'un lot avant de continuer ou de faire échouer la mise à jour."
  options:
    a:
      en: "Without WaitOnResourceSignals, CloudFormation only pauses 15 minutes between batches and ignores the signals."
      fr: "Sans WaitOnResourceSignals, CloudFormation marque seulement une pause de 15 minutes entre les lots et ignore les signaux."
    b:
      en: "A replacing update creates a new Auto Scaling group instead of replacing instances inside the same group."
      fr: "Une mise à jour par remplacement crée un nouvel Auto Scaling group au lieu de remplacer les instances dans le même groupe."
    c:
      en: "This replaces 4 instances at a time and keeps only 2 in service, the opposite of the requirement."
      fr: "Cela remplace 4 instances à la fois et n'en garde que 2 en service, l'inverse de l'exigence."
references:
  - title: UpdatePolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatepolicy.html
