id: soac03-3b-ram-tgw-pending
objective: "3.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A network account shares a transit gateway with application accounts by using AWS Resource Access Manager (AWS RAM). The transit gateway was created with the Auto accept shared attachments option turned off. Application teams create VPC attachments to the transit gateway, but the attachments stay in the pendingAcceptance state.

    Which two solutions will make the attachments available? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    Un compte réseau partage une passerelle de transit avec des comptes d'application à l'aide d'AWS Resource Access Manager (AWS RAM). La passerelle de transit a été créée avec l'option Auto accept shared attachments désactivée. Les équipes d'application créent des attachements de VPC à la passerelle de transit, mais les attachements restent à l'état pendingAcceptance.

    Quelles sont les deux solutions qui rendent les attachements disponibles ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the network account, accept each pending transit gateway attachment.", fr: "Dans le compte réseau, accepter chaque attachement de passerelle de transit en attente." } }
    - { id: b, text: { en: "In each application account, accept the AWS RAM resource share invitation again.", fr: "Dans chaque compte d'application, accepter de nouveau l'invitation de partage de ressources AWS RAM." } }
    - { id: c, text: { en: "Turn on default route table propagation for the transit gateway.", fr: "Activer la propagation vers la table de routage par défaut de la passerelle de transit." } }
    - { id: d, text: { en: "Turn on Auto accept shared attachments, and have the application teams create their attachments again.", fr: "Activer Auto accept shared attachments, et demander aux équipes d'application de recréer leurs attachements." } }
    - { id: e, text: { en: "Create VPC peering connections between the network VPC and each application VPC.", fr: "Créer des connexions de peering de VPC entre le VPC réseau et chaque VPC d'application." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "When Auto accept shared attachments is off, the transit gateway owner must accept or reject each cross-account attachment request. Turning the option on makes the transit gateway accept new cross-account attachments automatically, so attachments created again need no manual action."
    fr: "Lorsque Auto accept shared attachments est désactivé, le propriétaire de la passerelle de transit doit accepter ou rejeter chaque demande d'attachement intercomptes. Activer l'option accepte automatiquement les nouveaux attachements intercomptes : les attachements recréés sont acceptés sans action manuelle."
  options:
    b:
      en: "The resource share already works, since the teams could create attachments; acceptance happens on the attachment, in the owner account."
      fr: "Le partage de ressources fonctionne déjà, puisque les équipes ont pu créer des attachements ; l'acceptation se fait sur l'attachement, dans le compte propriétaire."
    c:
      en: "Route propagation controls routes for attachments that are already accepted; it does not accept pending ones."
      fr: "La propagation des routes contrôle les routes des attachements déjà acceptés ; elle n'accepte pas ceux en attente."
    e:
      en: "Peering bypasses the transit gateway design and leaves the attachments pending."
      fr: "Le peering contourne la conception autour de la passerelle de transit et laisse les attachements en attente."
references:
  - title: Create a transit gateway in AWS Transit Gateway
    url: https://docs.aws.amazon.com/vpc/latest/tgw/create-tgw.html
