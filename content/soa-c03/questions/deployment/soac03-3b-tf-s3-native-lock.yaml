id: soac03-3b-tf-s3-native-lock
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs Terraform 1.12 with an Amazon S3 backend and no state locking. Two pipelines recently ran `terraform apply` on the same state at the same time and corrupted it. The operations team must prevent concurrent writes to the state and does not want to create or manage any additional AWS resource for locking.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute Terraform 1.12 avec un backend Amazon S3 et sans verrouillage de l'état. Deux pipelines ont récemment exécuté `terraform apply` sur le même état en même temps et l'ont corrompu. L'équipe d'exploitation doit empêcher les écritures simultanées dans l'état et ne veut créer ni gérer aucune ressource AWS supplémentaire pour le verrouillage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon DynamoDB table and set the dynamodb_table argument in the S3 backend configuration.", fr: "Créer une table Amazon DynamoDB et définir l'argument dynamodb_table dans la configuration du backend S3." } }
    - { id: b, text: { en: "Set use_lockfile = true in the S3 backend configuration.", fr: "Définir use_lockfile = true dans la configuration du backend S3." } }
    - { id: c, text: { en: "Turn on S3 Object Lock in governance mode on the state bucket.", fr: "Activer S3 Object Lock en mode gouvernance sur le compartiment d'état." } }
    - { id: d, text: { en: "Turn on S3 Versioning on the state bucket.", fr: "Activer S3 Versioning sur le compartiment d'état." } }
answer: { optionId: b }
explanation:
  correct:
    en: "S3 native state locking, available in Terraform 1.11 and later, is enabled with use_lockfile = true. While a run holds the lock, Terraform writes a .tflock object next to the state file, and a competing run fails with an error instead of writing to the state."
    fr: "Le verrouillage natif de l'état dans S3, disponible à partir de Terraform 1.11, s'active avec use_lockfile = true. Tant qu'une exécution détient le verrou, Terraform écrit un objet .tflock à côté du fichier d'état, et une exécution concurrente échoue avec une erreur au lieu d'écrire dans l'état."
  options:
    a:
      en: "DynamoDB locking needs an extra table to manage, and this method is deprecated in favor of S3 native locking."
      fr: "Le verrouillage DynamoDB exige une table supplémentaire à gérer, et cette méthode est dépréciée au profit du verrouillage natif S3."
    c:
      en: "Object Lock prevents object versions from being deleted or overwritten for a retention period; it does not coordinate Terraform runs."
      fr: "Object Lock empêche la suppression ou l'écrasement de versions d'objets pendant une durée de conservation ; il ne coordonne pas les exécutions Terraform."
    d:
      en: "Versioning keeps previous state versions for recovery but does not stop two runs from writing at the same time."
      fr: "La gestion des versions conserve les versions précédentes de l'état pour la récupération, mais n'empêche pas deux exécutions d'écrire en même temps."
references:
  - title: Backend best practices
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/terraform-aws-provider-best-practices/backend.html
