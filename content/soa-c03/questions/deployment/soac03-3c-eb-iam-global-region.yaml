id: soac03-3c-eb-iam-global-region
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company operates only in the eu-west-1 Region. It created an Amazon EventBridge rule in eu-west-1, on the default event bus, that matches AWS API Call via CloudTrail events for the IAM CreateAccessKey API and sends them to an Amazon SNS topic. A multi-Region AWS CloudTrail trail is logging management events, but the rule never runs when users create access keys.

    Which solution will fix the issue?
  fr: |
    Une entreprise n'opère que dans la Région eu-west-1. Elle a créé dans eu-west-1, sur le bus d'événements par défaut, une règle Amazon EventBridge qui correspond aux événements AWS API Call via CloudTrail pour l'API IAM CreateAccessKey et les envoie à une rubrique Amazon SNS. Un journal de suivi AWS CloudTrail multi-Région enregistre les événements de gestion, mais la règle ne s'exécute jamais lorsque des utilisateurs créent des clés d'accès.

    Quelle solution résout le problème ?
body:
  options:
    - { id: a, text: { en: "Add a statement to the access policy of the SNS topic that allows the iam.amazonaws.com service principal to publish.", fr: "Ajouter à la politique d'accès de la rubrique SNS une instruction qui autorise le principal de service iam.amazonaws.com à publier." } }
    - { id: b, text: { en: "Change the source in the event pattern from aws.iam to aws.cloudtrail so that the rule matches the trail's records.", fr: "Remplacer la source aws.iam du modèle d'événement par aws.cloudtrail pour que la règle corresponde aux enregistrements du journal de suivi." } }
    - { id: c, text: { en: "Create the rule and its SNS topic in the us-east-1 Region instead of the eu-west-1 Region.", fr: "Créer la règle et sa rubrique SNS dans la Région us-east-1 au lieu de la Région eu-west-1." } }
    - { id: d, text: { en: "Enable data events for IAM on the trail, because CreateAccessKey is recorded only as a data event.", fr: "Activer les événements de données d'IAM sur le journal de suivi, car CreateAccessKey n'est enregistré que comme événement de données." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Events from AWS global services such as IAM and Route 53 are available only in US East (N. Virginia). A rule that matches IAM API calls must therefore be created in us-east-1, with a target that it can reach there. The rule in eu-west-1 never receives these events."
    fr: "Les événements des services AWS globaux comme IAM et Route 53 ne sont disponibles que dans la Région USA Est (Virginie du Nord). Une règle qui correspond à des appels d'API IAM doit donc être créée dans us-east-1, avec une cible qu'elle peut y joindre. La règle d'eu-west-1 ne reçoit jamais ces événements."
  options:
    a:
      en: "EventBridge, not IAM, publishes to the topic; the rule does not run at all, so the topic policy is not the cause."
      fr: "C'est EventBridge, et non IAM, qui publie dans la rubrique ; la règle ne s'exécute pas du tout, donc la politique de la rubrique n'est pas en cause."
    b:
      en: "CloudTrail API call events keep the source of the service that was called, aws.iam here; aws.cloudtrail would match only CloudTrail's own API calls."
      fr: "Les événements d'appel d'API CloudTrail gardent la source du service appelé, ici aws.iam ; aws.cloudtrail ne correspondrait qu'aux appels d'API de CloudTrail lui-même."
    d:
      en: "CreateAccessKey is a management event that the trail already logs; the problem is the Region of the rule."
      fr: "CreateAccessKey est un événement de gestion que le journal de suivi enregistre déjà ; le problème est la Région de la règle."
references:
  - title: Troubleshooting Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-troubleshooting.html
