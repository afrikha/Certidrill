id: soac03-3b-ss-exec-role-trust
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations team uses an AWS CloudFormation StackSet with self-managed permissions from administrator account 111122223333. The team adds account 444455556666, which belongs to a partner and is not part of the company's organization in AWS Organizations, as a new deployment target. The stack instance stays in the OUTDATED status with this reason: `Account 444455556666 should have 'AWSCloudFormationStackSetExecutionRole' role with trust relationship to Role 'AWSCloudFormationStackSetAdministrationRole'.`

    What should the team do to fix the issue?
  fr: |
    Une équipe d'exploitation utilise un StackSet AWS CloudFormation avec des autorisations autogérées (self-managed) depuis le compte administrateur 111122223333. L'équipe ajoute comme nouvelle cible de déploiement le compte 444455556666, qui appartient à un partenaire et ne fait pas partie de l'organisation AWS Organizations de l'entreprise. L'instance de pile reste à l'état OUTDATED avec ce motif : `Account 444455556666 should have 'AWSCloudFormationStackSetExecutionRole' role with trust relationship to Role 'AWSCloudFormationStackSetAdministrationRole'.`

    Que doit faire l'équipe pour corriger le problème ?
body:
  options:
    - { id: a, text: { en: "Create the AWSCloudFormationStackSetAdministrationRole role in account 444455556666, trusting CloudFormation.", fr: "Créer le rôle AWSCloudFormationStackSetAdministrationRole dans le compte 444455556666, en approuvant CloudFormation." } }
    - { id: b, text: { en: "Change the StackSet to service-managed permissions and redeploy it to account 444455556666.", fr: "Passer le StackSet en autorisations gérées par le service et le redéployer sur le compte 444455556666." } }
    - { id: c, text: { en: "Create the AWSCloudFormationStackSetExecutionRole role in account 444455556666, trusting account 111122223333.", fr: "Créer le rôle AWSCloudFormationStackSetExecutionRole dans le compte 444455556666, en approuvant le compte 111122223333." } }
    - { id: d, text: { en: "Grant iam:PassRole on the AWSCloudFormationStackSetExecutionRole role to the user who updates the StackSet.", fr: "Accorder iam:PassRole sur le rôle AWSCloudFormationStackSetExecutionRole à l'utilisateur qui met à jour le StackSet." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With self-managed permissions, the administration role in the administrator account assumes a role named AWSCloudFormationStackSetExecutionRole in each target account. That role must exist in the target account and trust the administrator account, which is exactly what the error reports as missing."
    fr: "Avec des autorisations autogérées, le rôle d'administration du compte administrateur endosse un rôle nommé AWSCloudFormationStackSetExecutionRole dans chaque compte cible. Ce rôle doit exister dans le compte cible et approuver le compte administrateur, ce que l'erreur signale justement comme manquant."
  options:
    a:
      en: "The administration role belongs in the administrator account, not in target accounts; the target needs the execution role."
      fr: "Le rôle d'administration se trouve dans le compte administrateur, pas dans les comptes cibles ; la cible a besoin du rôle d'exécution."
    b:
      en: "Service-managed permissions deploy only to accounts in the organization, and this account is outside it."
      fr: "Les autorisations gérées par le service ne déploient que vers les comptes de l'organisation, et ce compte n'en fait pas partie."
    d:
      en: "iam:PassRole is needed on the administration role in the administrator account; it does not create the missing role in the target."
      fr: "iam:PassRole est nécessaire sur le rôle d'administration du compte administrateur ; cela ne crée pas le rôle manquant dans la cible."
references:
  - title: Grant self-managed permissions
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-prereqs-self-managed.html
  - title: Troubleshooting CloudFormation StackSets
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-troubleshooting.html
