id: soac03-3b-cfn-replacing-update
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CloudFormation stack defines an Auto Scaling group whose instances run cfn-signal at the end of their user data. When the launch template changes, the company wants CloudFormation to create a completely new Auto Scaling group and keep the old group serving traffic until enough new instances have signaled success. If the new group does not receive the signals in time, the stack must keep the old group and delete the new one.

    Which solution will meet these requirements?
  fr: |
    Une pile AWS CloudFormation définit un Auto Scaling group dont les instances exécutent cfn-signal à la fin de leurs données utilisateur. Lorsque le modèle de lancement change, l'entreprise veut que CloudFormation crée un tout nouvel Auto Scaling group et que l'ancien groupe continue de servir le trafic jusqu'à ce que suffisamment de nouvelles instances aient signalé leur succès. Si le nouveau groupe ne reçoit pas les signaux à temps, la pile doit conserver l'ancien groupe et supprimer le nouveau.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an AutoScalingRollingUpdate update policy with WaitOnResourceSignals set to true and MinInstancesInService set to the desired capacity.", fr: "Ajouter une politique de mise à jour AutoScalingRollingUpdate avec WaitOnResourceSignals défini à true et MinInstancesInService défini à la capacité souhaitée." } }
    - { id: b, text: { en: "Add an AutoScalingReplacingUpdate update policy with WillReplace set to true, and a CreationPolicy with a ResourceSignal count and timeout.", fr: "Ajouter une politique de mise à jour AutoScalingReplacingUpdate avec WillReplace défini à true, et une CreationPolicy avec un nombre de signaux ResourceSignal et un délai." } }
    - { id: c, text: { en: "Add a DeletionPolicy attribute set to Retain on the Auto Scaling group, and a CreationPolicy with a ResourceSignal count.", fr: "Ajouter un attribut DeletionPolicy défini à Retain sur l'Auto Scaling group, et une CreationPolicy avec un nombre de signaux ResourceSignal." } }
    - { id: d, text: { en: "Add an AutoScalingScheduledAction update policy with IgnoreUnmodifiedGroupSizeProperties set to true.", fr: "Ajouter une politique de mise à jour AutoScalingScheduledAction avec IgnoreUnmodifiedGroupSizeProperties défini à true." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With AutoScalingReplacingUpdate and WillReplace set to true, CloudFormation creates a new group and retains the old one until the new group is created; the old group is deleted during cleanup. A matching CreationPolicy decides success, and if the signals do not arrive within the timeout, CloudFormation rolls back to the old group and deletes the new one."
    fr: "Avec AutoScalingReplacingUpdate et WillReplace défini à true, CloudFormation crée un nouveau groupe et conserve l'ancien jusqu'à la création du nouveau ; l'ancien groupe est supprimé lors du nettoyage. Une CreationPolicy correspondante décide du succès, et si les signaux n'arrivent pas dans le délai, CloudFormation revient à l'ancien groupe et supprime le nouveau."
  options:
    a:
      en: "A rolling update replaces instances in batches inside the same group instead of creating a new group."
      fr: "Une mise à jour propagée remplace les instances par lots dans le même groupe au lieu de créer un nouveau groupe."
    c:
      en: "DeletionPolicy controls what happens when the resource is deleted; it does not create a replacement group during updates."
      fr: "DeletionPolicy contrôle ce qui se passe à la suppression de la ressource ; elle ne crée pas de groupe de remplacement lors des mises à jour."
    d:
      en: "This policy only stops CloudFormation from resetting group sizes changed by scheduled actions."
      fr: "Cette politique empêche seulement CloudFormation de réinitialiser les tailles de groupe modifiées par des actions planifiées."
references:
  - title: UpdatePolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatepolicy.html
