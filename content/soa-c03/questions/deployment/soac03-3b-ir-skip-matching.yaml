id: soac03-3b-ir-skip-matching
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Auto Scaling group uses a mixed instances policy with m5.large, m6i.large, and c6i.large instances. The company removes m5.large from the policy. Only the running m5.large instances must be replaced, and the other instances must keep running. The operator will use the AWS CLI.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un Auto Scaling group utilise une politique d'instances mixtes avec des instances m5.large, m6i.large et c6i.large. L'entreprise retire m5.large de la politique. Seules les instances m5.large en cours d'exécution doivent être remplacées, et les autres instances doivent continuer à fonctionner. L'opérateur va utiliser l'AWS CLI.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Start an instance refresh with the default preferences of the start-instance-refresh command.", fr: "Démarrer une actualisation d'instance avec les préférences par défaut de la commande start-instance-refresh." } }
    - { id: b, text: { en: "Set a maximum instance lifetime of 1 day on the group so that old instances are replaced over time.", fr: "Définir une durée de vie maximale des instances de 1 jour sur le groupe pour que les anciennes instances soient remplacées au fil du temps." } }
    - { id: c, text: { en: "Turn on Capacity Rebalancing so that Auto Scaling moves the m5.large instances to other types.", fr: "Activer Capacity Rebalancing pour qu'Auto Scaling déplace les instances m5.large vers d'autres types." } }
    - { id: d, text: { en: "Start an instance refresh with SkipMatching set to true in the preferences.", fr: "Démarrer une actualisation d'instance avec SkipMatching défini à true dans les préférences." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Skip matching makes the instance refresh skip instances that already match the desired or last saved configuration. Instances whose type is no longer in the mixed instances policy are replaced, and matching m6i.large and c6i.large instances keep running."
    fr: "Le skip matching fait ignorer à l'actualisation d'instance les instances qui correspondent déjà à la configuration souhaitée ou enregistrée en dernier. Les instances dont le type ne figure plus dans la politique d'instances mixtes sont remplacées, et les instances m6i.large et c6i.large conformes continuent de fonctionner."
  options:
    a:
      en: "In the AWS CLI, SkipMatching defaults to false, so the refresh replaces every instance."
      fr: "Dans l'AWS CLI, SkipMatching vaut false par défaut : l'actualisation remplace toutes les instances."
    b:
      en: "Maximum instance lifetime eventually replaces all instances, including the ones that already match."
      fr: "La durée de vie maximale finit par remplacer toutes les instances, y compris celles qui sont déjà conformes."
    c:
      en: "Capacity Rebalancing reacts to Spot rebalance recommendations; it does not replace instances of a removed type."
      fr: "Capacity Rebalancing réagit aux recommandations de rééquilibrage Spot ; il ne remplace pas les instances d'un type retiré."
references:
  - title: Use an instance refresh with skip matching
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh-skip-matching.html
