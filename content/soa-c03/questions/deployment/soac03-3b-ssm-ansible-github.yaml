id: soac03-3b-ssm-ansible-github
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps Ansible playbooks in a private GitHub repository. The playbooks must run every Sunday on all Amazon EC2 Linux instances tagged Role=web, which are managed by AWS Systems Manager. Ansible is not installed on the instances, and the GitHub access token must not be stored in plain text.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise conserve des playbooks Ansible dans un dépôt GitHub privé. Les playbooks doivent s'exécuter chaque dimanche sur toutes les instances Amazon EC2 Linux étiquetées Role=web, qui sont gérées par AWS Systems Manager. Ansible n'est pas installé sur les instances, et le jeton d'accès GitHub ne doit pas être stocké en clair.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Add a cron job to the user data of each instance that clones the repository with the token and runs ansible-playbook.", fr: "Ajouter aux données utilisateur de chaque instance une tâche cron qui clone le dépôt avec le jeton et exécute ansible-playbook." } }
    - { id: b, text: { en: "Create a weekly State Manager association with AWS-ApplyAnsiblePlaybooks, InstallDependencies True, and a tokenInfo that references a SecureString parameter.", fr: "Créer une association State Manager hebdomadaire avec AWS-ApplyAnsiblePlaybooks, InstallDependencies à True et un tokenInfo qui fait référence à un paramètre SecureString." } }
    - { id: c, text: { en: "Run AWS-RunShellScript with Run Command each Sunday, passing the token in the command text to clone the repository.", fr: "Exécuter AWS-RunShellScript avec Run Command chaque dimanche, en passant le jeton dans le texte de la commande pour cloner le dépôt." } }
    - { id: d, text: { en: "Bake Ansible and the playbooks into a new AMI with EC2 Image Builder each week, and replace the instances with an instance refresh.", fr: "Intégrer chaque semaine Ansible et les playbooks dans une nouvelle AMI avec EC2 Image Builder, et remplacer les instances avec une actualisation d'instance." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The AWS-ApplyAnsiblePlaybooks document downloads playbooks from GitHub or Amazon S3 and runs them; with InstallDependencies set to True, Systems Manager installs Ansible where it is missing. For a private repository, tokenInfo uses the ssm-secure syntax to read a SecureString parameter, and a State Manager association with a cron expression runs it on the tagged instances each week."
    fr: "Le document AWS-ApplyAnsiblePlaybooks télécharge des playbooks depuis GitHub ou Amazon S3 et les exécute ; avec InstallDependencies défini à True, Systems Manager installe Ansible là où il manque. Pour un dépôt privé, tokenInfo utilise la syntaxe ssm-secure pour lire un paramètre SecureString, et une association State Manager avec une expression cron l'exécute chaque semaine sur les instances étiquetées."
  options:
    a:
      en: "The token ends up in plain text in user data, and each instance needs Ansible and its own scheduling."
      fr: "Le jeton se retrouve en clair dans les données utilisateur, et chaque instance a besoin d'Ansible et de sa propre planification."
    c:
      en: "The token appears in plain text in the command, Ansible is still missing, and someone must run it each week."
      fr: "Le jeton apparaît en clair dans la commande, Ansible manque toujours, et quelqu'un doit l'exécuter chaque semaine."
    d:
      en: "Replacing the fleet every week to apply configuration is far more work than a scheduled association."
      fr: "Remplacer le parc chaque semaine pour appliquer une configuration demande bien plus de travail qu'une association planifiée."
references:
  - title: Creating associations that run Ansible playbooks
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state-manager-ansible.html
