id: soac03-3a-cfn-stack-policy-override
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The stack policy of a production AWS CloudFormation stack denies all update actions on the stack's DB instance and allows updates on all other resources. A change board has approved one change to the allocated storage of the DB instance in the next stack update. The permanent stack policy must not be changed, and the protection must still be in force after the update.

    Which solution will meet these requirements?
  fr: |
    La politique de pile d'une pile AWS CloudFormation de production refuse toutes les actions de mise à jour sur l'instance de base de données de la pile et autorise les mises à jour sur toutes les autres ressources. Un comité des changements a approuvé une modification du stockage alloué de l'instance de base de données lors de la prochaine mise à jour de la pile. La politique de pile permanente ne doit pas être modifiée, et la protection doit toujours être en vigueur après la mise à jour.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run update-stack with --stack-policy-during-update-body set to a temporary policy that allows Update:Modify on the DB instance.", fr: "Exécuter update-stack avec --stack-policy-during-update-body défini sur une politique temporaire qui autorise Update:Modify sur l'instance de base de données." } }
    - { id: b, text: { en: "Run set-stack-policy with a policy that allows all updates, run the update, and then run set-stack-policy again with the original policy.", fr: "Exécuter set-stack-policy avec une politique qui autorise toutes les mises à jour, effectuer la mise à jour, puis exécuter de nouveau set-stack-policy avec la politique d'origine." } }
    - { id: c, text: { en: "Run update-stack with the --role-arn of a service role that has AdministratorAccess, because service roles are not subject to stack policies.", fr: "Exécuter update-stack avec le --role-arn d'un rôle de service qui dispose d'AdministratorAccess, car les rôles de service ne sont pas soumis aux politiques de pile." } }
    - { id: d, text: { en: "Disable termination protection on the stack, run the update, and then enable termination protection again.", fr: "Désactiver la protection contre la résiliation de la pile, effectuer la mise à jour, puis réactiver la protection contre la résiliation." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      To update protected resources, CloudFormation accepts an override policy for a single update with --stack-policy-during-update-body or --stack-policy-during-update-url. The override applies only during that update and does not permanently change the stack policy, so the DB instance is protected again afterward.
    fr: |
      Pour mettre à jour des ressources protégées, CloudFormation accepte une politique de remplacement pour une seule mise à jour avec --stack-policy-during-update-body ou --stack-policy-during-update-url. Elle ne s'applique que pendant cette mise à jour et ne modifie pas durablement la politique de pile : l'instance de base de données est de nouveau protégée ensuite.
  options:
    b:
      en: |
        This changes the permanent stack policy twice, which the requirements forbid, and leaves the DB instance unprotected if the second step is forgotten.
      fr: |
        Cela modifie deux fois la politique de pile permanente, ce que les exigences interdisent, et laisse l'instance sans protection si la seconde étape est oubliée.
    c:
      en: |
        A stack policy applies to all stack updates; a service role changes which credentials CloudFormation uses, not whether the stack policy is evaluated.
      fr: |
        Une politique de pile s'applique à toutes les mises à jour de la pile ; un rôle de service change les informations d'identification utilisées par CloudFormation, pas l'évaluation de la politique de pile.
    d:
      en: |
        Termination protection concerns stack deletion only; the stack policy still denies the update.
      fr: |
        La protection contre la résiliation ne concerne que la suppression de la pile ; la politique de pile refuse toujours la mise à jour.
references:
  - title: Prevent updates to stack resources
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/protect-stack-resources.html
