id: soac03-3a-ecr-since-image-pulled
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon ECR private repository stores thousands of container images that use many different tag formats, and its storage costs are growing. The company wants every image that nobody has pulled for 90 days to be deleted automatically, whatever its tags. Images that are still pulled regularly must be kept, even if they were pushed years ago.

    Which lifecycle policy rule will meet these requirements?
  fr: |
    Un référentiel privé Amazon ECR stocke des milliers d'images de conteneur qui utilisent de nombreux formats de balises, et ses coûts de stockage augmentent. L'entreprise souhaite que toute image que personne n'a extraite depuis 90 jours soit supprimée automatiquement, quelles que soient ses balises. Les images encore extraites régulièrement doivent être conservées, même si elles ont été transférées il y a plusieurs années.

    Quelle règle de politique de cycle de vie répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "tagStatus any, countType sinceImagePushed, countUnit days, countNumber 90, with the expire action.", fr: "tagStatus any, countType sinceImagePushed, countUnit days, countNumber 90, avec l'action expire." } }
    - { id: b, text: { en: "tagStatus untagged, countType sinceImagePulled, countUnit days, countNumber 90, with the expire action.", fr: "tagStatus untagged, countType sinceImagePulled, countUnit days, countNumber 90, avec l'action expire." } }
    - { id: c, text: { en: "tagStatus any, countType sinceImagePulled, countUnit days, countNumber 90, with the expire action.", fr: "tagStatus any, countType sinceImagePulled, countUnit days, countNumber 90, avec l'action expire." } }
    - { id: d, text: { en: "tagStatus any, countType imageCountMoreThan, countNumber 90, with the expire action.", fr: "tagStatus any, countType imageCountMoreThan, countNumber 90, avec l'action expire." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The sinceImagePulled count type expires images whose last recorded pull is older than the given number of days, and tagStatus any evaluates every image regardless of tags. An image that was never pulled is evaluated on its push time, so recently pushed images are not deleted too early.
    fr: |
      Le type de comptage sinceImagePulled fait expirer les images dont la dernière extraction enregistrée date de plus du nombre de jours indiqué, et tagStatus any évalue toutes les images quelles que soient leurs balises. Une image jamais extraite est évaluée selon sa date de transfert : les images transférées récemment ne sont donc pas supprimées trop tôt.
  options:
    a:
      en: |
        sinceImagePushed uses the push date, so old images that are still pulled every day would be deleted.
      fr: |
        sinceImagePushed utilise la date de transfert : d'anciennes images encore extraites chaque jour seraient supprimées.
    b:
      en: |
        tagStatus untagged applies only to images without tags, so unused tagged images would be kept.
      fr: |
        tagStatus untagged ne s'applique qu'aux images sans balise : les images balisées inutilisées seraient conservées.
    d:
      en: |
        imageCountMoreThan keeps the 90 most recently pushed images and ignores pull activity.
      fr: |
        imageCountMoreThan conserve les 90 images transférées le plus récemment et ignore l'activité d'extraction.
references:
  - title: Lifecycle policy properties in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/lifecycle_policy_parameters.html
  - title: Automate the cleanup of images by using lifecycle policies in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/LifecyclePolicies.html
