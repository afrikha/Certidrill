id: soac03-3c-runcmd-cw-output
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team uses Run Command with the AWS-RunShellScript document to run a nightly diagnostic script on 300 managed nodes. The script writes several hundred kilobytes of output, but the command results show only the beginning of it. The team needs the complete output, wants to search it across nodes in near real time, and wants an alarm when the output contains the string FATAL. The nodes use the AmazonSSMManagedInstanceCore and CloudWatchAgentServerPolicy managed policies.

    Which solution will meet these requirements?
  fr: |
    Une équipe d'exploitation utilise Run Command avec le document AWS-RunShellScript pour exécuter chaque nuit un script de diagnostic sur 300 nœuds gérés. Le script écrit plusieurs centaines de kilo-octets de sortie, mais les résultats de la commande n'en affichent que le début. L'équipe a besoin de la sortie complète, veut y effectuer des recherches sur tous les nœuds en temps quasi réel et veut une alarme lorsque la sortie contient la chaîne FATAL. Les nœuds utilisent les politiques gérées AmazonSSMManagedInstanceCore et CloudWatchAgentServerPolicy.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable CloudWatch output on the command to send the full output to a log group, and add a metric filter with an alarm for FATAL.", fr: "Activer la sortie CloudWatch sur la commande pour envoyer la sortie complète vers un groupe de journaux, et ajouter un filtre de métrique avec une alarme pour FATAL." } }
    - { id: b, text: { en: "Send the command output to an Amazon S3 bucket, and use S3 Event Notifications to publish each output object to an SNS topic.", fr: "Envoyer la sortie de la commande vers un compartiment Amazon S3, et utiliser S3 Event Notifications pour publier chaque objet de sortie dans une rubrique SNS." } }
    - { id: c, text: { en: "Increase the executionTimeout parameter of AWS-RunShellScript so that the command can return its complete output.", fr: "Augmenter le paramètre executionTimeout d'AWS-RunShellScript pour que la commande puisse renvoyer sa sortie complète." } }
    - { id: d, text: { en: "Read the output with aws ssm get-command-invocation, and search it for FATAL with a script on an administration host.", fr: "Lire la sortie avec aws ssm get-command-invocation, et y rechercher FATAL avec un script sur un hôte d'administration." } }
answer: { optionId: a }
explanation:
  correct:
    en: "By default, Systems Manager returns only the first 24,000 characters of command output. With CloudWatch output enabled (cloud-watch-output-config), Run Command sends all output and error logs to CloudWatch Logs, where the team can search them in near real time and build a metric filter and an alarm. The two managed policies already grant the log permissions that the nodes need."
    fr: "Par défaut, Systems Manager ne renvoie que les 24 000 premiers caractères de la sortie d'une commande. Avec la sortie CloudWatch activée (cloud-watch-output-config), Run Command envoie toute la sortie et les journaux d'erreurs vers CloudWatch Logs, où l'équipe peut les rechercher en temps quasi réel et créer un filtre de métrique et une alarme. Les deux politiques gérées accordent déjà aux nœuds les autorisations nécessaires sur les journaux."
  options:
    b:
      en: "Amazon S3 keeps the full output, but it offers no near real-time search across nodes and no alarm on the content of the output."
      fr: "Amazon S3 conserve la sortie complète, mais n'offre ni recherche en temps quasi réel sur tous les nœuds ni alarme sur le contenu de la sortie."
    c:
      en: "The execution timeout only limits how long the script can run; the returned output is still truncated."
      fr: "Le délai d'exécution limite seulement la durée du script ; la sortie renvoyée reste tronquée."
    d:
      en: "The API returns the same truncated output, and a custom script adds work without providing an alarm."
      fr: "L'API renvoie la même sortie tronquée, et un script personnalisé ajoute du travail sans fournir d'alarme."
references:
  - title: Configuring Amazon CloudWatch Logs for Run Command
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-rc-setting-up-cwlogs.html
