id: soac03-3a-ami-reboot-consistency
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations engineer must create an AMI from a running EBS-backed Amazon EC2 instance that hosts a self-managed database on an ext4 file system. The file system integrity of the AMI must be guaranteed. A short interruption of the instance during a maintenance window is acceptable.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur d'exploitation doit créer une AMI à partir d'une instance Amazon EC2 basée sur EBS en cours d'exécution qui héberge une base de données autogérée sur un système de fichiers ext4. L'intégrité du système de fichiers de l'AMI doit être garantie. Une courte interruption de l'instance pendant une fenêtre de maintenance est acceptable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run create-image without the --no-reboot option so that Amazon EC2 reboots the instance before the snapshots.", fr: "Exécuter create-image sans l'option --no-reboot pour qu'Amazon EC2 redémarre l'instance avant les instantanés." } }
    - { id: b, text: { en: "Run the create-image command with the --no-reboot option so that the instance keeps running while the snapshots are taken.", fr: "Exécuter la commande create-image avec l'option --no-reboot pour que l'instance continue de s'exécuter pendant la prise des instantanés." } }
    - { id: c, text: { en: "Create a snapshot of the root volume only, and register an AMI from that snapshot later.", fr: "Créer un instantané du volume racine uniquement, et enregistrer plus tard une AMI à partir de cet instantané." } }
    - { id: d, text: { en: "Create the AMI with an Amazon Data Lifecycle Manager AMI policy whose NoReboot parameter is true.", fr: "Créer l'AMI avec une politique d'AMI Amazon Data Lifecycle Manager dont le paramètre NoReboot est à true." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, Amazon EC2 reboots the instance when it creates the AMI so that it can snapshot the attached volumes while the data is at rest, which ensures a consistent state. With --no-reboot, AWS cannot guarantee the file system integrity of the image.
    fr: |
      Par défaut, Amazon EC2 redémarre l'instance lors de la création de l'AMI pour prendre les instantanés des volumes attachés pendant que les données sont au repos, ce qui garantit un état cohérent. Avec --no-reboot, AWS ne peut pas garantir l'intégrité du système de fichiers de l'image.
  options:
    b:
      en: |
        Without a reboot, the snapshots are taken while the database writes to the disk, and file system integrity is not guaranteed.
      fr: |
        Sans redémarrage, les instantanés sont pris pendant que la base de données écrit sur le disque, et l'intégrité du système de fichiers n'est pas garantie.
    c:
      en: |
        A snapshot of a running instance has the same consistency problem, and it omits the other attached volumes.
      fr: |
        Un instantané d'une instance en cours d'exécution a le même problème de cohérence, et il omet les autres volumes attachés.
    d:
      en: |
        NoReboot set to true skips the reboot, which Data Lifecycle Manager warns can cause data consistency issues.
      fr: |
        NoReboot à true supprime le redémarrage, ce qui, selon Data Lifecycle Manager, peut causer des problèmes de cohérence des données.
references:
  - title: Create an Amazon EBS-backed AMI
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/creating-an-ami-ebs.html
