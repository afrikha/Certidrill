id: soac03-3a-ami-block-public-access
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A security standard requires that no AMI owned by a company's production account can be public in us-east-1 or eu-west-1, the two Regions that the account uses. An audit finds one public AMI in us-east-1. Block public access for AMIs is currently disabled in both Regions.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une norme de sécurité exige qu'aucune AMI appartenant au compte de production d'une entreprise ne puisse être publique dans us-east-1 ou eu-west-1, les deux Régions utilisées par le compte. Un audit trouve une AMI publique dans us-east-1. Le blocage de l'accès public pour les AMI est actuellement désactivé dans les deux Régions.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable block public access for AMIs in us-east-1 and in eu-west-1.", fr: "Activer le blocage de l'accès public pour les AMI dans us-east-1 et dans eu-west-1." } }
    - { id: b, text: { en: "Enable block public access for AMIs once in us-east-1, because the setting applies to all Regions of the account.", fr: "Activer une seule fois le blocage de l'accès public pour les AMI dans us-east-1, car le paramètre s'applique à toutes les Régions du compte." } }
    - { id: c, text: { en: "Rely on block public access to make the existing public AMI private as soon as the setting is enabled.", fr: "Compter sur le blocage de l'accès public pour rendre privée l'AMI publique existante dès l'activation du paramètre." } }
    - { id: d, text: { en: "Remove the public launch permission (the all group) from the existing public AMI.", fr: "Retirer l'autorisation de lancement publique (le groupe all) de l'AMI publique existante." } }
    - { id: e, text: { en: "Deprecate the existing public AMI so that other accounts can no longer launch it.", fr: "Rendre obsolète l'AMI publique existante pour que les autres comptes ne puissent plus la lancer." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Block public access for AMIs blocks any new attempt to make an AMI public, and it must be configured in each Region where it is needed. Enabling it does not change AMIs that are already public, so the existing AMI must be made private by removing its public launch permission.
    fr: |
      Le blocage de l'accès public pour les AMI bloque toute nouvelle tentative de rendre une AMI publique, et il doit être configuré dans chaque Région concernée. Son activation ne modifie pas les AMI déjà publiques : il faut donc rendre privée l'AMI existante en retirant son autorisation de lancement publique.
  options:
    b:
      en: |
        The setting is per Region, so eu-west-1 would remain unprotected.
      fr: |
        Le paramètre est propre à chaque Région : eu-west-1 resterait sans protection.
    c:
      en: |
        AMIs that are already public stay publicly available after block public access is enabled.
      fr: |
        Les AMI déjà publiques restent accessibles publiquement après l'activation du blocage de l'accès public.
    e:
      en: |
        A deprecated AMI is hidden from listings but can still be launched by ID, and it remains public.
      fr: |
        Une AMI obsolète est masquée des listes mais peut toujours être lancée par son ID, et elle reste publique.
references:
  - title: Understand block public access for AMIs
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/block-public-access-to-amis.html
  - title: Deprecate an Amazon EC2 AMI
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-deprecate.html
