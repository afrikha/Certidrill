id: soac03-3c-alarm-lambda-principal
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An administrator adds an AWS Lambda action to an existing Amazon CloudWatch metric alarm so that a function restarts a stuck service when the alarm enters the ALARM state. The function is in the same account and Region. The alarm changes state, but the function is never invoked. The resource-based policy of the function has a single statement, which allows events.amazonaws.com to invoke it.

    Which solution will fix the issue?
  fr: |
    Un administrateur ajoute une action AWS Lambda à une alarme de métrique Amazon CloudWatch existante pour qu'une fonction redémarre un service bloqué lorsque l'alarme passe à l'état ALARM. La fonction se trouve dans le même compte et la même Région. L'alarme change d'état, mais la fonction n'est jamais appelée. La politique basée sur une ressource de la fonction comporte une seule instruction, qui autorise events.amazonaws.com à l'appeler.

    Quelle solution résout le problème ?
body:
  options:
    - { id: a, text: { en: "Replace the Lambda action with an Amazon SNS topic action, because alarms cannot invoke Lambda functions directly.", fr: "Remplacer l'action Lambda par une action de rubrique Amazon SNS, car les alarmes ne peuvent pas appeler directement des fonctions Lambda." } }
    - { id: b, text: { en: "Add a resource-based policy statement that allows lambda.alarms.cloudwatch.amazonaws.com to invoke the function, with conditions on the alarm's account and ARN.", fr: "Ajouter une instruction de politique basée sur une ressource qui autorise lambda.alarms.cloudwatch.amazonaws.com à appeler la fonction, avec des conditions sur le compte et l'ARN de l'alarme." } }
    - { id: c, text: { en: "Add the cloudwatch:DescribeAlarms and lambda:InvokeFunction permissions to the execution role of the function.", fr: "Ajouter les autorisations cloudwatch:DescribeAlarms et lambda:InvokeFunction au rôle d'exécution de la fonction." } }
    - { id: d, text: { en: "Change the alarm's treatment of missing data to breaching so that the action runs on every evaluation period.", fr: "Faire passer le traitement des données manquantes de l'alarme à breaching pour que l'action s'exécute à chaque période d'évaluation." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch alarms can invoke a Lambda function directly, but the function's resource-based policy must allow the lambda.alarms.cloudwatch.amazonaws.com service principal. AWS recommends the AWS:SourceAccount condition, plus AWS:SourceArn to limit invocation to one alarm, to avoid confused deputy issues. The existing events.amazonaws.com statement applies only to EventBridge."
    fr: "Les alarmes CloudWatch peuvent appeler directement une fonction Lambda, mais la politique basée sur une ressource de la fonction doit autoriser le principal de service lambda.alarms.cloudwatch.amazonaws.com. AWS recommande la condition AWS:SourceAccount, complétée par AWS:SourceArn pour limiter l'appel à une seule alarme, afin d'éviter les problèmes d'adjoint confus. L'instruction existante pour events.amazonaws.com ne s'applique qu'à EventBridge."
  options:
    a:
      en: "Lambda invocation is a supported alarm action, so an SNS topic is not required."
      fr: "L'appel d'une fonction Lambda est une action d'alarme prise en charge : une rubrique SNS n'est pas nécessaire."
    c:
      en: "The execution role controls what the function can call; permission for CloudWatch to invoke the function comes from its resource-based policy."
      fr: "Le rôle d'exécution contrôle ce que la fonction peut appeler ; l'autorisation donnée à CloudWatch d'appeler la fonction provient de sa politique basée sur une ressource."
    d:
      en: "The alarm already changes state; the action fails because CloudWatch is not authorized to invoke the function."
      fr: "L'alarme change déjà d'état ; l'action échoue parce que CloudWatch n'est pas autorisé à appeler la fonction."
references:
  - title: Invoke a Lambda function from an alarm
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-actions-Lambda.html
