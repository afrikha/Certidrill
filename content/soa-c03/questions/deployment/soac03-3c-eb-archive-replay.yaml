id: soac03-3c-eb-archive-replay
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Several Amazon EventBridge rules on a custom event bus send order events to different targets. Last week, a bug in the AWS Lambda function targeted by one rule produced wrong results for 3 days, although every invocation succeeded. In the future, after such a fix, the company wants to resend the order events of the past 7 days to that rule only, without sending them again to the targets of the other rules and without writing code.

    Which solution will meet these requirements?
  fr: |
    Plusieurs règles Amazon EventBridge sur un bus d'événements personnalisé envoient des événements de commande à différentes cibles. La semaine dernière, un bogue dans la fonction AWS Lambda ciblée par une règle a produit des résultats erronés pendant 3 jours, bien que chaque invocation ait réussi. À l'avenir, après un tel correctif, l'entreprise veut renvoyer les événements de commande des 7 derniers jours à cette seule règle, sans les renvoyer aux cibles des autres règles et sans écrire de code.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an archive of the order events on the event bus, and start a replay that selects the time frame and only the rule of the fixed function.", fr: "Créer une archive des événements de commande sur le bus d'événements, et lancer un rejeu qui sélectionne la période et uniquement la règle de la fonction corrigée." } }
    - { id: b, text: { en: "Create an archive of the order events on the event bus, and start a replay that selects the time frame and sends the events to all rules of the bus.", fr: "Créer une archive des événements de commande sur le bus d'événements, et lancer un rejeu qui sélectionne la période et envoie les événements à toutes les règles du bus." } }
    - { id: c, text: { en: "Configure an Amazon SQS standard queue as the dead-letter queue of the rule target, and redrive its messages after the fix.", fr: "Configurer une file d'attente Amazon SQS standard comme file d'attente de lettres mortes de la cible de la règle, et redistribuer ses messages après le correctif." } }
    - { id: d, text: { en: "Configure an on-failure destination for the function that sends records to an Amazon SQS queue, and process the queue after the fix.", fr: "Configurer pour la fonction une destination en cas d'échec qui envoie les enregistrements vers une file d'attente Amazon SQS, et traiter la file d'attente après le correctif." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An archive keeps the events of its source event bus that match its event pattern, for a retention period that you choose. A replay resends archived events from a time frame to the source event bus, and it can be limited to specific rules, so the other rules do not process the events again. Replayed events carry a replay-name field.
    fr: |
      Une archive conserve les événements de son bus d'événements source qui correspondent à son modèle d'événement, pendant une durée de conservation que vous choisissez. Un rejeu renvoie les événements archivés d'une période au bus d'événements source, et il peut être limité à des règles précises : les autres règles ne traitent pas de nouveau les événements. Les événements rejoués portent un champ replay-name.
  options:
    b:
      en: |
        A replay to every rule of the bus sends the events again to the targets of the other rules, which the company wants to avoid.
      fr: |
        Un rejeu vers toutes les règles du bus renvoie les événements aux cibles des autres règles, ce que l'entreprise veut éviter.
    c:
      en: |
        A dead-letter queue receives only the events that EventBridge failed to deliver; these events were delivered, so the queue stays empty.
      fr: |
        Une file d'attente de lettres mortes ne reçoit que les événements qu'EventBridge n'a pas réussi à livrer ; ces événements ont été livrés : la file d'attente reste vide.
    d:
      en: |
        An on-failure destination records only invocations that fail; the invocations succeeded, and reprocessing the records would also need code.
      fr: |
        Une destination en cas d'échec n'enregistre que les invocations en échec ; les invocations ont réussi, et retraiter les enregistrements demanderait en plus du code.
references:
  - title: Archiving and replaying events in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-archive.html
