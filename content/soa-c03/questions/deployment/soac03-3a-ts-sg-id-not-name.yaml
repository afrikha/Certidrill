id: soac03-3a-ts-sg-id-not-name
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CloudFormation template creates an Amazon EC2 instance in a subnet of a custom VPC. The SecurityGroupIds property of the instance is set to app-web-sg, which is the name of an existing security group in that VPC. The stack fails with an error that says that the security group does not exist in the VPC.

    Which solution will resolve the error?
  fr: |
    Un modèle AWS CloudFormation crée une instance Amazon EC2 dans un sous-réseau d'un VPC personnalisé. La propriété SecurityGroupIds de l'instance est définie sur app-web-sg, qui est le nom d'un groupe de sécurité existant dans ce VPC. La pile échoue avec une erreur indiquant que le groupe de sécurité n'existe pas dans le VPC.

    Quelle solution permet de résoudre l'erreur ?
body:
  options:
    - { id: a, text: { en: "Add a DependsOn attribute to the instance that references the app-web-sg security group.", fr: "Ajouter à l'instance un attribut DependsOn qui référence le groupe de sécurité app-web-sg." } }
    - { id: b, text: { en: "Recreate a security group named app-web-sg in the default VPC of the Region.", fr: "Recréer un groupe de sécurité nommé app-web-sg dans le VPC par défaut de la Région." } }
    - { id: c, text: { en: "Set SecurityGroupIds to the ID of the security group (sg-...) instead of its name.", fr: "Définir SecurityGroupIds sur l'ID du groupe de sécurité (sg-...) au lieu de son nom." } }
    - { id: d, text: { en: "Deploy the stack with the CAPABILITY_IAM capability so that CloudFormation can read the group.", fr: "Déployer la pile avec la capacité CAPABILITY_IAM pour que CloudFormation puisse lire le groupe." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      CloudFormation's troubleshooting guidance for this error is to verify that the security group exists in the specified VPC and to specify the security group ID, not its name. A parameter of type AWS::EC2::SecurityGroup::Id also validates the value when the stack is deployed.
    fr: |
      Pour cette erreur, la documentation de dépannage de CloudFormation demande de vérifier que le groupe de sécurité existe dans le VPC spécifié et d'indiquer l'ID du groupe de sécurité, pas son nom. Un paramètre de type AWS::EC2::SecurityGroup::Id valide aussi la valeur au déploiement de la pile.
  options:
    a:
      en: |
        DependsOn accepts logical IDs of resources in the same template and does not change how the property value is interpreted.
      fr: |
        DependsOn accepte des ID logiques de ressources du même modèle et ne change pas l'interprétation de la valeur de la propriété.
    b:
      en: |
        The instance is launched in the custom VPC, so a security group in the default VPC cannot be attached to it.
      fr: |
        L'instance est lancée dans le VPC personnalisé : un groupe de sécurité du VPC par défaut ne peut pas lui être attaché.
    d:
      en: |
        CAPABILITY_IAM acknowledges IAM resources in a template; it has nothing to do with security groups.
      fr: |
        CAPABILITY_IAM sert à reconnaître la présence de ressources IAM dans un modèle ; cela n'a rien à voir avec les groupes de sécurité.
references:
  - title: Troubleshooting CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/troubleshooting.html
