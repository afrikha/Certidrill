id: soac03-3a-ib-private-subnet-ssm
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team runs an EC2 Image Builder pipeline whose infrastructure configuration places the build instances in a private subnet. For compliance reasons, the VPC has no internet gateway and no NAT gateway. The role of the instance profile has the EC2InstanceProfileForImageBuilder and AmazonSSMManagedInstanceCore managed policies. Every build fails, and the failure message says that the instance never registered with Systems Manager.

    Which solution will fix the builds while keeping the VPC without internet access?
  fr: |
    Une équipe d'exploitation exécute un pipeline EC2 Image Builder dont la configuration d'infrastructure place les instances de création dans un sous-réseau privé. Pour des raisons de conformité, le VPC n'a ni passerelle Internet ni passerelle NAT. Le rôle du profil d'instance dispose des politiques gérées EC2InstanceProfileForImageBuilder et AmazonSSMManagedInstanceCore. Chaque création échoue, et le message d'échec indique que l'instance ne s'est jamais enregistrée auprès de Systems Manager.

    Quelle solution permet de corriger les créations tout en conservant un VPC sans accès à Internet ?
body:
  options:
    - { id: a, text: { en: "Attach the EC2InstanceProfileForImageBuilderECRContainerBuilds managed policy to the role of the instance profile.", fr: "Attacher la politique gérée EC2InstanceProfileForImageBuilderECRContainerBuilds au rôle du profil d'instance." } }
    - { id: b, text: { en: "In the infrastructure configuration, clear Terminate instance on failure and specify an EC2 key pair.", fr: "Dans la configuration d'infrastructure, décocher Terminate instance on failure et spécifier une paire de clés EC2." } }
    - { id: c, text: { en: "Create interface VPC endpoints for AWS Systems Manager and for EC2 Image Builder in the VPC, with private DNS enabled.", fr: "Créer dans le VPC des points de terminaison d'interface pour AWS Systems Manager et pour EC2 Image Builder, avec le DNS privé activé." } }
    - { id: d, text: { en: "Create a gateway VPC endpoint for Amazon S3 and associate it with the route table of the private subnet.", fr: "Créer un point de terminaison de passerelle pour Amazon S3 et l'associer à la table de routage du sous-réseau privé." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Image Builder drives the build and test instances through Systems Manager, so the instances must reach the Systems Manager endpoints. In a private subnet without internet access, AWS PrivateLink interface endpoints for Systems Manager and Image Builder provide that connectivity; the permissions are already correct.
    fr: |
      Image Builder pilote les instances de création et de test via Systems Manager : les instances doivent donc atteindre les points de terminaison de Systems Manager. Dans un sous-réseau privé sans accès à Internet, des points de terminaison d'interface AWS PrivateLink pour Systems Manager et Image Builder fournissent cette connectivité ; les autorisations sont déjà correctes.
  options:
    a:
      en: |
        This policy is for container image builds. The instance profile already has the permissions it needs; the problem is network access to Systems Manager.
      fr: |
        Cette politique concerne la création d'images de conteneur. Le profil d'instance dispose déjà des autorisations nécessaires ; le problème est l'accès réseau à Systems Manager.
    b:
      en: |
        These troubleshooting settings keep the failed instance for investigation, but the instance still cannot register with Systems Manager.
      fr: |
        Ces paramètres de dépannage conservent l'instance en échec pour l'analyser, mais l'instance ne peut toujours pas s'enregistrer auprès de Systems Manager.
    d:
      en: |
        An S3 gateway endpoint helps only with access to Amazon S3, for example for logs. It does not give access to the Systems Manager endpoints.
      fr: |
        Un point de terminaison de passerelle S3 aide uniquement pour l'accès à Amazon S3, par exemple pour les journaux. Il ne donne pas accès aux points de terminaison de Systems Manager.
references:
  - title: Troubleshoot Image Builder issues
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/troubleshooting.html
  - title: Get set up to build custom images with Image Builder
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/set-up-ib-env.html
