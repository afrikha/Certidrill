id: soac03-3a-ami-share-aws-managed-key
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An engineer tries to share an AMI with a second account of the company, but the operation fails. The EBS snapshots of the AMI are encrypted with the AWS managed key aws/ebs, which is the account's default key for EBS encryption. The second account must be able to launch instances from an encrypted AMI.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur tente de partager une AMI avec un second compte de l'entreprise, mais l'opération échoue. Les instantanés EBS de l'AMI sont chiffrés avec la clé gérée par AWS aws/ebs, qui est la clé par défaut du compte pour le chiffrement EBS. Le second compte doit pouvoir lancer des instances à partir d'une AMI chiffrée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Edit the key policy of the aws/ebs key to allow the second account to use it, and then share the AMI.", fr: "Modifier la politique de clé de la clé aws/ebs pour autoriser le second compte à l'utiliser, puis partager l'AMI." } }
    - { id: b, text: { en: "Create an unencrypted copy of the AMI, and share the copy with the second account.", fr: "Créer une copie non chiffrée de l'AMI, et partager la copie avec le second compte." } }
    - { id: c, text: { en: "Copy the AMI with re-encryption under a customer managed key, share that key, and share the copy.", fr: "Copier l'AMI en la rechiffrant avec une clé gérée par le client, partager cette clé, et partager la copie." } }
    - { id: d, text: { en: "Turn off EBS encryption by default in the account, and then share the existing AMI again.", fr: "Désactiver le chiffrement EBS par défaut dans le compte, puis partager de nouveau l'AMI existante." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AMIs backed by snapshots encrypted with the default AWS managed key cannot be shared. Copying the AMI with re-encryption under a customer managed key produces snapshots whose key can be shared through its key policy, and the copy can then receive a launch permission for the second account.
    fr: |
      Les AMI dont les instantanés sont chiffrés avec la clé par défaut gérée par AWS ne peuvent pas être partagées. Copier l'AMI en la rechiffrant avec une clé gérée par le client produit des instantanés dont la clé peut être partagée via sa politique de clé, puis la copie peut recevoir une autorisation de lancement pour le second compte.
  options:
    a:
      en: |
        The key policies of AWS managed keys cannot be edited, so the key cannot be opened to another account.
      fr: |
        Les politiques de clé des clés gérées par AWS ne peuvent pas être modifiées : la clé ne peut pas être ouverte à un autre compte.
    b:
      en: |
        The requirement is an encrypted AMI, and a copy of encrypted snapshots cannot be decrypted into unencrypted ones.
      fr: |
        L'exigence porte sur une AMI chiffrée, et la copie d'instantanés chiffrés ne peut pas produire des instantanés non chiffrés.
    d:
      en: |
        The default encryption setting affects new volumes only; the existing snapshots remain encrypted with aws/ebs.
      fr: |
        Le paramètre de chiffrement par défaut ne concerne que les nouveaux volumes ; les instantanés existants restent chiffrés avec aws/ebs.
references:
  - title: Share an AMI with specific AWS accounts
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sharingamis-explicit.html
  - title: Copy an Amazon EC2 AMI
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/CopyingAMIs.html
