id: soac03-3b-tf-state-secrets
objective: "3.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A team uses Terraform 1.12 and a current AWS provider to create an Amazon RDS for PostgreSQL DB instance. The master password comes from a Terraform variable marked `sensitive = true`. A security review finds the password in plain text in the state file. The password must no longer be stored in the Terraform state.

    Which two solutions will meet this requirement? (Choose two.) Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe utilise Terraform 1.12 et une version actuelle du fournisseur AWS pour créer une instance de base de données Amazon RDS for PostgreSQL. Le mot de passe principal provient d'une variable Terraform marquée `sensitive = true`. Une revue de sécurité trouve le mot de passe en clair dans le fichier d'état. Le mot de passe ne doit plus être stocké dans l'état Terraform.

    Quelles sont les deux solutions qui répondent à cette exigence ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set manage_master_user_password = true on the DB instance so that RDS generates the password and stores it in Secrets Manager.", fr: "Définir manage_master_user_password = true sur l'instance de base de données pour que RDS génère le mot de passe et le stocke dans Secrets Manager." } }
    - { id: b, text: { en: "Read the password with the aws_secretsmanager_secret_version data source and pass it to the password argument.", fr: "Lire le mot de passe avec la source de données aws_secretsmanager_secret_version et le passer à l'argument password." } }
    - { id: c, text: { en: "Read the password with an ephemeral aws_secretsmanager_secret_version resource and pass it to the password_wo argument.", fr: "Lire le mot de passe avec une ressource éphémère aws_secretsmanager_secret_version et le passer à l'argument password_wo." } }
    - { id: d, text: { en: "Keep the sensitive variable, and set encrypt = true with a KMS key in the S3 backend configuration.", fr: "Conserver la variable sensible, et définir encrypt = true avec une clé KMS dans la configuration du backend S3." } }
    - { id: e, text: { en: "Mark every output that references the password as sensitive = true.", fr: "Marquer comme sensitive = true chaque sortie qui fait référence au mot de passe." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "With manage_master_user_password, Amazon RDS generates the master password and keeps it in Secrets Manager, so Terraform never handles it. Ephemeral resources (Terraform 1.10+) read a value without saving it, and write-only arguments such as password_wo (Terraform 1.11+) are never stored; incrementing password_wo_version applies a new value."
    fr: "Avec manage_master_user_password, Amazon RDS génère le mot de passe principal et le conserve dans Secrets Manager : Terraform ne le manipule jamais. Les ressources éphémères (Terraform 1.10+) lisent une valeur sans l'enregistrer, et les arguments en écriture seule comme password_wo (Terraform 1.11+) ne sont jamais stockés ; incrémenter password_wo_version applique une nouvelle valeur."
  options:
    b:
      en: "Data source results are written to the state, and the password argument is stored as well."
      fr: "Les résultats des sources de données sont écrits dans l'état, et l'argument password l'est aussi."
    d:
      en: "Encryption protects the state object at rest, but anyone who can read the state still sees the password in plain text."
      fr: "Le chiffrement protège l'objet d'état au repos, mais toute personne qui peut lire l'état voit toujours le mot de passe en clair."
    e:
      en: "The sensitive flag hides values in CLI output only; it does not keep them out of the state."
      fr: "L'indicateur sensitive masque les valeurs uniquement dans la sortie de la CLI ; il ne les exclut pas de l'état."
references:
  - title: Security best practices
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/terraform-aws-provider-best-practices/security.html
