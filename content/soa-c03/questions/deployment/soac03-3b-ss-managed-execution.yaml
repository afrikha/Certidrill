id: soac03-3b-ss-managed-execution
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Three teams use the same AWS CloudFormation StackSet. One team adds stack instances in a new Region while another team updates parameter overrides for different accounts. Each time, the second request is rejected because another StackSet operation is already running, and the teams must resubmit it by hand. The company wants operations that do not conflict to run at the same time and conflicting operations to wait and start automatically.

    Which solution will meet these requirements?
  fr: |
    Trois équipes utilisent le même StackSet AWS CloudFormation. Une équipe ajoute des instances de pile dans une nouvelle Région pendant qu'une autre met à jour des substitutions de paramètres pour d'autres comptes. À chaque fois, la seconde demande est rejetée parce qu'une autre opération StackSet est déjà en cours, et les équipes doivent la soumettre de nouveau à la main. L'entreprise veut que les opérations sans conflit s'exécutent en même temps et que les opérations en conflit attendent puis démarrent automatiquement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set ConcurrencyMode to SOFT_FAILURE_TOLERANCE in the operation preferences of each request.", fr: "Définir ConcurrencyMode à SOFT_FAILURE_TOLERANCE dans les préférences d'opération de chaque demande." } }
    - { id: b, text: { en: "Set MaxConcurrentPercentage to 100 in the operation preferences of each request.", fr: "Définir MaxConcurrentPercentage à 100 dans les préférences d'opération de chaque demande." } }
    - { id: c, text: { en: "Register each team's account as a delegated administrator for StackSets.", fr: "Enregistrer le compte de chaque équipe comme administrateur délégué pour StackSets." } }
    - { id: d, text: { en: "Update the StackSet with --managed-execution Active=true.", fr: "Mettre à jour le StackSet avec --managed-execution Active=true." } }
answer: { optionId: d }
explanation:
  correct:
    en: "When managed execution is active, StackSets runs non-conflicting operations concurrently and queues conflicting ones, then starts the queued operations in request order. When it is inactive (the default), the StackSet performs one operation at a time."
    fr: "Lorsque l'exécution gérée est active, StackSets exécute en parallèle les opérations sans conflit et met en file d'attente les opérations en conflit, puis démarre les opérations en attente dans l'ordre des demandes. Lorsqu'elle est inactive (par défaut), le StackSet effectue une opération à la fois."
  options:
    a:
      en: "Concurrency mode controls how many accounts one operation processes at once, not whether several operations can run."
      fr: "Le mode de simultanéité contrôle le nombre de comptes traités en même temps par une opération, pas l'exécution de plusieurs opérations."
    b:
      en: "This speeds up a single operation across accounts; a second operation is still rejected while the first runs."
      fr: "Cela accélère une opération unique sur les comptes ; une seconde opération est toujours rejetée pendant l'exécution de la première."
    c:
      en: "Delegated administration changes who can manage service-managed StackSets, not how operations on one StackSet are scheduled."
      fr: "L'administration déléguée change qui peut gérer les StackSets gérés par le service, pas la planification des opérations sur un StackSet."
references:
  - title: ManagedExecution
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_ManagedExecution.html
