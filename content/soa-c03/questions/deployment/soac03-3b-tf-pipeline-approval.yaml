id: soac03-3b-tf-pipeline-approval
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS CodePipeline pipeline has a source stage connected to a Git repository, a stage with an AWS CodeBuild action that runs `terraform plan` and saves the plan file, and a stage with a CodeBuild action that runs `terraform apply` on that plan file. The operations team requires that a person reviews the plan and explicitly allows each apply.

    Which solution will meet this requirement?
  fr: |
    Un pipeline AWS CodePipeline comporte une étape source connectée à un dépôt Git, une étape avec une action AWS CodeBuild qui exécute `terraform plan` et enregistre le fichier de plan, et une étape avec une action CodeBuild qui exécute `terraform apply` sur ce fichier de plan. L'équipe d'exploitation exige qu'une personne examine le plan et autorise explicitement chaque application.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Add a manual approval action in a stage between the plan stage and the apply stage.", fr: "Ajouter une action d'approbation manuelle dans une étape entre l'étape de plan et l'étape d'application." } }
    - { id: b, text: { en: "Add an Amazon SNS notification rule that emails the team when the apply stage succeeds.", fr: "Ajouter une règle de notification Amazon SNS qui envoie un e-mail à l'équipe lorsque l'étape d'application réussit." } }
    - { id: c, text: { en: "Change the apply action to a CodeBuild batch build that runs after the plan action.", fr: "Transformer l'action d'application en build par lots CodeBuild qui s'exécute après l'action de plan." } }
    - { id: d, text: { en: "Add an EventBridge rule that logs the plan stage result to Amazon CloudWatch Logs.", fr: "Ajouter une règle EventBridge qui enregistre le résultat de l'étape de plan dans Amazon CloudWatch Logs." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A manual approval action stops the pipeline execution until an authorized user approves or rejects it; a rejection fails the stage, and an approval not given within seven days counts as a failure. It can notify reviewers through Amazon SNS and include a link to the plan output."
    fr: "Une action d'approbation manuelle arrête l'exécution du pipeline jusqu'à ce qu'un utilisateur autorisé l'approuve ou la rejette ; un rejet fait échouer l'étape, et une approbation non donnée sous sept jours compte comme un échec. Elle peut prévenir les relecteurs via Amazon SNS et inclure un lien vers le résultat du plan."
  options:
    b:
      en: "A notification after the apply informs the team but does not stop the apply for review."
      fr: "Une notification après l'application informe l'équipe mais n'arrête pas l'application pour un examen."
    c:
      en: "A batch build runs several builds; it adds no human decision before the apply."
      fr: "Un build par lots exécute plusieurs builds ; il n'ajoute aucune décision humaine avant l'application."
    d:
      en: "Logging the result does not pause the pipeline, so the apply still runs automatically."
      fr: "Enregistrer le résultat ne met pas le pipeline en pause : l'application s'exécute toujours automatiquement."
references:
  - title: Add a manual approval action to a stage
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
