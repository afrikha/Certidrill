id: soac03-3a-cfn-stack-policy-protect-db
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CloudFormation stack contains a web tier and an Amazon RDS DB instance whose logical ID is ProductionDatabase. Engineers update the stack several times a week. The company wants every stack update that would modify, replace or delete ProductionDatabase to be blocked, while updates to all other resources of the stack keep working. The protection must apply to every user who updates the stack.

    Which solution will meet these requirements?
  fr: |
    Une pile AWS CloudFormation contient un niveau web et une instance de base de données Amazon RDS dont l'ID logique est ProductionDatabase. Les ingénieurs mettent à jour la pile plusieurs fois par semaine. L'entreprise souhaite que toute mise à jour de pile qui modifierait, remplacerait ou supprimerait ProductionDatabase soit bloquée, tandis que les mises à jour de toutes les autres ressources de la pile continuent de fonctionner. La protection doit s'appliquer à tous les utilisateurs qui mettent à jour la pile.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add DeletionPolicy: Retain and UpdateReplacePolicy: Retain to ProductionDatabase.", fr: "Ajouter DeletionPolicy: Retain et UpdateReplacePolicy: Retain à ProductionDatabase." } }
    - { id: b, text: { en: "Enable termination protection on the stack so that changes to ProductionDatabase are rejected.", fr: "Activer la protection contre la résiliation de la pile pour que les modifications de ProductionDatabase soient rejetées." } }
    - { id: c, text: { en: "Attach an IAM policy to all engineers that denies cloudformation:UpdateStack on this stack.", fr: "Attacher à tous les ingénieurs une politique IAM qui refuse cloudformation:UpdateStack sur cette pile." } }
    - { id: d, text: { en: "Set a stack policy that allows Update:* on all resources and denies Update:* on ProductionDatabase.", fr: "Définir une politique de pile qui autorise Update:* sur toutes les ressources et refuse Update:* sur ProductionDatabase." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A stack policy applies to every stack update, whoever runs it. The explicit Deny on Update:* for ProductionDatabase blocks modifications, replacements and deletions of that resource, and the Allow statement keeps the other resources updatable; a Deny always overrides an Allow.
    fr: |
      Une politique de pile s'applique à toute mise à jour de la pile, quel que soit son auteur. Le Deny explicite sur Update:* pour ProductionDatabase bloque les modifications, remplacements et suppressions de cette ressource, et l'instruction Allow permet de mettre à jour les autres ressources ; un Deny l'emporte toujours sur un Allow.
  options:
    a:
      en: |
        These attributes keep the DB instance when it is replaced or removed, but they do not block in-place modifications, and the instance leaves the stack.
      fr: |
        Ces attributs conservent l'instance lorsqu'elle est remplacée ou retirée, mais ils ne bloquent pas les modifications sur place, et l'instance sort de la pile.
    b:
      en: |
        Termination protection prevents only the deletion of the stack; it does not control updates of resources.
      fr: |
        La protection contre la résiliation empêche seulement la suppression de la pile ; elle ne contrôle pas les mises à jour des ressources.
    c:
      en: |
        Denying UpdateStack blocks every update of the stack, including the web tier, and applies only to the users who have the policy.
      fr: |
        Refuser UpdateStack bloque toutes les mises à jour de la pile, y compris celles du niveau web, et ne s'applique qu'aux utilisateurs qui ont cette politique.
references:
  - title: Prevent updates to stack resources
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/protect-stack-resources.html
