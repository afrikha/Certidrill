id: soac03-3b-cd-min-healthy-hosts
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AWS CodeDeploy deploys an application in place to 12 Amazon EC2 instances behind an Application Load Balancer. At least 9 instances must serve traffic at all times during a deployment. Within that limit, deployments must finish as quickly as possible.

    Which deployment configuration should the operations team use?
  fr: |
    AWS CodeDeploy déploie une application sur place (in-place) sur 12 instances Amazon EC2 derrière un Application Load Balancer. Au moins 9 instances doivent servir le trafic à tout moment pendant un déploiement. Dans cette limite, les déploiements doivent se terminer le plus vite possible.

    Quelle configuration de déploiement l'équipe d'exploitation doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "The predefined CodeDeployDefault.OneAtATime deployment configuration", fr: "La configuration de déploiement prédéfinie CodeDeployDefault.OneAtATime" } }
    - { id: b, text: { en: "The predefined CodeDeployDefault.HalfAtATime deployment configuration", fr: "La configuration de déploiement prédéfinie CodeDeployDefault.HalfAtATime" } }
    - { id: c, text: { en: "The predefined CodeDeployDefault.AllAtOnce deployment configuration", fr: "La configuration de déploiement prédéfinie CodeDeployDefault.AllAtOnce" } }
    - { id: d, text: { en: "A custom deployment configuration with minimum healthy hosts set to HOST_COUNT 9", fr: "Une configuration de déploiement personnalisée avec un minimum d'hôtes sains défini à HOST_COUNT 9" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The minimum healthy hosts value is the number (HOST_COUNT) or percentage (FLEET_PERCENT) of instances that must remain available during a deployment. A HOST_COUNT of 9 lets CodeDeploy update 3 instances at a time, the fastest pace that still keeps 9 instances in service."
    fr: "La valeur d'hôtes sains minimum est le nombre (HOST_COUNT) ou le pourcentage (FLEET_PERCENT) d'instances qui doivent rester disponibles pendant un déploiement. Un HOST_COUNT de 9 permet à CodeDeploy de mettre à jour 3 instances à la fois, le rythme le plus rapide qui garde encore 9 instances en service."
  options:
    a:
      en: "One instance at a time keeps 11 in service but is slower than needed."
      fr: "Une instance à la fois en garde 11 en service mais est plus lente que nécessaire."
    b:
      en: "Half at a time can take 6 instances out of service at once, below the 9 required."
      fr: "La moitié à la fois peut retirer 6 instances du service en même temps, en dessous des 9 exigées."
    c:
      en: "All at once can take every instance out of service at the same time."
      fr: "Tout à la fois peut retirer toutes les instances du service en même temps."
references:
  - title: Working with deployment configurations in CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
  - title: Create a deployment configuration with CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations-create.html
