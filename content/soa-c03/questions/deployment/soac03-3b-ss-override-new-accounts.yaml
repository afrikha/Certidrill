id: soac03-3b-ss-override-new-accounts
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS CloudFormation StackSet with service-managed permissions and automatic deployment targets only the Sales organizational unit (OU). Its template has a LogRetentionDays parameter with the StackSet value 90. Last month, an operator ran update-stack-instances with --parameter-overrides LogRetentionDays=365 and --deployment-targets for the Sales OU. Accounts that joined the Sales OU since then have log groups with 90-day retention. Every account in the Sales OU, including future accounts, must use 365 days.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un StackSet AWS CloudFormation avec des autorisations gérées par le service et le déploiement automatique cible uniquement l'unité d'organisation (OU) Sales. Son modèle a un paramètre LogRetentionDays dont la valeur du StackSet est 90. Le mois dernier, un opérateur a exécuté update-stack-instances avec --parameter-overrides LogRetentionDays=365 et --deployment-targets pour l'OU Sales. Les comptes qui ont rejoint l'OU Sales depuis ont des groupes de journaux avec une conservation de 90 jours. Chaque compte de l'OU Sales, y compris les comptes futurs, doit utiliser 365 jours.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Run update-stack-instances with the same override for the Sales OU each time a new account joins it.", fr: "Exécuter update-stack-instances avec la même substitution pour l'OU Sales chaque fois qu'un nouveau compte la rejoint." } }
    - { id: b, text: { en: "Run update-stack-set to change the StackSet value of LogRetentionDays to 365.", fr: "Exécuter update-stack-set pour changer la valeur du StackSet de LogRetentionDays à 365." } }
    - { id: c, text: { en: "Activate managed execution so that parameter overrides are applied to accounts added later.", fr: "Activer l'exécution gérée afin que les substitutions de paramètres soient appliquées aux comptes ajoutés plus tard." } }
    - { id: d, text: { en: "Add an EventBridge rule on the account move event that runs update-stack-instances with the override.", fr: "Ajouter une règle EventBridge sur l'événement de déplacement de compte qui exécute update-stack-instances avec la substitution." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Parameter overrides set with OU targets apply only to the accounts that are in the OU when the override is made; accounts added later receive the StackSet values. Because every account in the only target OU needs 365, changing the StackSet value once covers current and future accounts."
    fr: "Les substitutions de paramètres définies avec des cibles d'OU ne s'appliquent qu'aux comptes présents dans l'OU au moment de la substitution ; les comptes ajoutés ensuite reçoivent les valeurs du StackSet. Comme chaque compte de la seule OU cible a besoin de 365, changer une fois la valeur du StackSet couvre les comptes actuels et futurs."
  options:
    a:
      en: "This works but must be repeated manually for every new account, which is more overhead than changing the StackSet value once."
      fr: "Cela fonctionne mais doit être répété manuellement pour chaque nouveau compte, ce qui demande plus d'effort que de changer une fois la valeur du StackSet."
    c:
      en: "Managed execution only runs non-conflicting operations concurrently; new accounts still receive the StackSet values."
      fr: "L'exécution gérée exécute seulement en parallèle des opérations sans conflit ; les nouveaux comptes reçoivent toujours les valeurs du StackSet."
    d:
      en: "Custom automation could work but adds a rule and code to maintain for something a single StackSet update solves."
      fr: "Une automatisation personnalisée pourrait fonctionner mais ajoute une règle et du code à maintenir pour un besoin qu'une seule mise à jour du StackSet résout."
references:
  - title: Override parameter values on stacks within your CloudFormation StackSet
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stackinstances-override.html
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
