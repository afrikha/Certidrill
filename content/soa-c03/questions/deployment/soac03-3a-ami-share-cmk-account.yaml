id: soac03-3a-ami-share-cmk-account
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company builds an AMI in account 111111111111. The snapshots of the AMI are encrypted with a customer managed AWS KMS key in the same Region. A partner team must launch instances from this AMI in account 222222222222, in the same Region. The AMI must not be made public, and it must not be copied.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise crée une AMI dans le compte 111111111111. Les instantanés de l'AMI sont chiffrés avec une clé AWS KMS gérée par le client dans la même Région. Une équipe partenaire doit lancer des instances à partir de cette AMI dans le compte 222222222222, dans la même Région. L'AMI ne doit pas être rendue publique, et elle ne doit pas être copiée.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Share the encrypted EBS snapshots with account 222222222222 instead of adding launch permissions to the AMI.", fr: "Partager les instantanés EBS chiffrés avec le compte 222222222222 au lieu d'ajouter des autorisations de lancement à l'AMI." } }
    - { id: b, text: { en: "Add a launch permission for account 222222222222 to the AMI with the modify-image-attribute command.", fr: "Ajouter une autorisation de lancement pour le compte 222222222222 à l'AMI avec la commande modify-image-attribute." } }
    - { id: c, text: { en: "Re-encrypt the snapshots with the AWS managed key aws/ebs so that account 222222222222 can decrypt them.", fr: "Rechiffrer les instantanés avec la clé gérée par AWS aws/ebs pour que le compte 222222222222 puisse les déchiffrer." } }
    - { id: d, text: { en: "Create a resource share in AWS RAM that contains the customer managed key and invite account 222222222222.", fr: "Créer un partage de ressources AWS RAM qui contient la clé gérée par le client et inviter le compte 222222222222." } }
    - { id: e, text: { en: "Update the key policy of the customer managed key to allow account 222222222222 to use the key, including kms:CreateGrant.", fr: "Mettre à jour la politique de clé de la clé gérée par le client pour autoriser le compte 222222222222 à utiliser la clé, y compris kms:CreateGrant." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Sharing an AMI with an account means adding a launch permission for that account. Because the snapshots are encrypted, the account must also be allowed to use the KMS key that encrypted them; for a customer managed key, the key policy of the owning account grants this access.
    fr: |
      Partager une AMI avec un compte consiste à ajouter une autorisation de lancement pour ce compte. Comme les instantanés sont chiffrés, le compte doit aussi être autorisé à utiliser la clé KMS qui les a chiffrés ; pour une clé gérée par le client, la politique de clé du compte propriétaire accorde cet accès.
  options:
    a:
      en: |
        Sharing the snapshots alone does not let the partner launch the AMI; it would need to register its own AMI from them, which is a copy of the image.
      fr: |
        Partager seulement les instantanés ne permet pas au partenaire de lancer l'AMI ; il devrait enregistrer sa propre AMI à partir d'eux, ce qui revient à copier l'image.
    c:
      en: |
        AMIs whose snapshots are encrypted with the default AWS managed key cannot be shared at all.
      fr: |
        Les AMI dont les instantanés sont chiffrés avec la clé par défaut gérée par AWS ne peuvent pas du tout être partagées.
    d:
      en: |
        KMS keys are not shared through AWS RAM; cross-account use of a key is granted in its key policy.
      fr: |
        Les clés KMS ne se partagent pas via AWS RAM ; l'utilisation d'une clé entre comptes est accordée dans sa politique de clé.
references:
  - title: Share an AMI with specific AWS accounts
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sharingamis-explicit.html
