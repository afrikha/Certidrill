id: soac03-3a-ib-lifecycle-count-rule
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An EC2 Image Builder pipeline has built an AMI from the same recipe version every week for two years. Hundreds of old AMIs and their EBS snapshots generate storage costs. The company wants to keep only the five newest images of each recipe version and to remove the older ones automatically, including their AMIs and snapshots.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un pipeline EC2 Image Builder crée chaque semaine depuis deux ans une AMI à partir de la même version de recette. Des centaines d'anciennes AMI et leurs instantanés EBS génèrent des coûts de stockage. L'entreprise souhaite ne conserver que les cinq images les plus récentes de chaque version de recette et supprimer automatiquement les plus anciennes, y compris leurs AMI et leurs instantanés.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Data Lifecycle Manager EBS-backed AMI policy that targets the build instances by tag and retains five AMIs.", fr: "Créer une politique Amazon Data Lifecycle Manager pour AMI basées sur EBS qui cible les instances de création par balise et conserve cinq AMI." } }
    - { id: b, text: { en: "Create an AWS Lambda function, run weekly, that calls deregister-image for every AMI of the pipeline that is older than five weeks.", fr: "Créer une fonction AWS Lambda, exécutée chaque semaine, qui appelle deregister-image pour chaque AMI du pipeline de plus de cinq semaines." } }
    - { id: c, text: { en: "Create an Image Builder lifecycle policy with a count-based delete rule that keeps five images and that deregisters the AMIs and deletes their snapshots.", fr: "Créer une politique de cycle de vie Image Builder avec une règle de suppression basée sur le nombre qui conserve cinq images, annule l'enregistrement des AMI et supprime leurs instantanés." } }
    - { id: d, text: { en: "Create an S3 Lifecycle rule on the bucket of the Image Builder logs that expires the objects of images older than five weeks.", fr: "Créer une règle S3 Lifecycle sur le compartiment des journaux Image Builder qui fait expirer les objets des images de plus de cinq semaines." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Image Builder lifecycle policies manage the images that Image Builder creates. A COUNT filter keeps the newest N images per recipe version, and the delete rule can also deregister the output AMIs and delete their snapshots, so the cleanup runs without custom code.
    fr: |
      Les politiques de cycle de vie Image Builder gèrent les images créées par Image Builder. Un filtre COUNT conserve les N images les plus récentes par version de recette, et la règle de suppression peut aussi annuler l'enregistrement des AMI produites et supprimer leurs instantanés : le nettoyage s'exécute sans code personnalisé.
  options:
    a:
      en: |
        Data Lifecycle Manager creates and retains AMIs from running instances that carry the target tags. Build instances are terminated after each build, and the policy does not manage AMIs that Image Builder produced.
      fr: |
        Data Lifecycle Manager crée et conserve des AMI à partir d'instances en cours d'exécution qui portent les balises cibles. Les instances de création sont résiliées après chaque création, et la politique ne gère pas les AMI produites par Image Builder.
    b:
      en: |
        Deregistering an AMI does not delete its snapshots by default, and a custom function must be written and maintained.
      fr: |
        Annuler l'enregistrement d'une AMI ne supprime pas ses instantanés par défaut, et une fonction personnalisée doit être écrite et maintenue.
    d:
      en: |
        This rule removes only log objects in Amazon S3; the AMIs and EBS snapshots are not affected.
      fr: |
        Cette règle ne supprime que des objets journaux dans Amazon S3 ; les AMI et les instantanés EBS ne sont pas concernés.
references:
  - title: How lifecycle management rules work for Image Builder image resources
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/image-lifecycle-rules.html
  - title: Create Amazon Data Lifecycle Manager custom policy for EBS-backed AMIs
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ami-policy.html
