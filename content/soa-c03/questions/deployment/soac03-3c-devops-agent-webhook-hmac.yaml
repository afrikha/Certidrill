id: soac03-3c-devops-agent-webhook-hmac
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's in-house monitoring tool must start AWS DevOps Agent investigations automatically when it detects an incident. The security team requires that each request be authenticated with a shared secret that is never sent over the network, and that old requests cannot be replayed.

    Which solution will meet these requirements?
  fr: |
    L'outil de surveillance interne d'une entreprise doit lancer automatiquement des investigations AWS DevOps Agent lorsqu'il détecte un incident. L'équipe de sécurité exige que chaque requête soit authentifiée avec un secret partagé qui n'est jamais envoyé sur le réseau, et que d'anciennes requêtes ne puissent pas être rejouées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a generic webhook of type HMAC to the Agent Space, and have the tool send a signature of the timestamp and payload with the timestamp header.", fr: "Ajouter un webhook générique de type HMAC à l'Agent Space, et faire envoyer par l'outil une signature de l'horodatage et de la charge utile avec l'en-tête d'horodatage." } }
    - { id: b, text: { en: "Add a generic webhook of type API key to the Agent Space, and have the tool send the key as a bearer token in the Authorization header.", fr: "Ajouter un webhook générique de type clé d'API à l'Agent Space, et faire envoyer la clé par l'outil comme jeton bearer dans l'en-tête Authorization." } }
    - { id: c, text: { en: "Create an EventBridge API destination with an API key connection to the webhook URL, and have the tool put its incidents on an event bus.", fr: "Créer une destination d'API EventBridge avec une connexion par clé d'API vers l'URL du webhook, et faire publier les incidents par l'outil sur un bus d'événements." } }
    - { id: d, text: { en: "Configure the ServiceNow integration of the Agent Space, and have the tool send its incidents to the integration webhook URL.", fr: "Configurer l'intégration ServiceNow de l'Agent Space, et faire envoyer les incidents par l'outil vers l'URL du webhook de l'intégration." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With an HMAC generic webhook, the sender signs the timestamp and the payload with SHA-256 and the shared secret, and sends the signature and the timestamp in the x-amzn-event-signature and x-amzn-event-timestamp headers. The secret itself is never sent, and because the timestamp is part of the signature, the service can reject stale requests. AWS recommends HMAC for generic webhooks and strict compliance requirements."
    fr: "Avec un webhook générique HMAC, l'expéditeur signe l'horodatage et la charge utile avec SHA-256 et le secret partagé, puis envoie la signature et l'horodatage dans les en-têtes x-amzn-event-signature et x-amzn-event-timestamp. Le secret lui-même n'est jamais envoyé et, comme l'horodatage fait partie de la signature, le service peut rejeter les requêtes trop anciennes. AWS recommande HMAC pour les webhooks génériques et les exigences de conformité strictes."
  options:
    b:
      en: "A bearer token is sent with every request, so a captured token can be reused until it is rotated."
      fr: "Un jeton bearer est envoyé avec chaque requête : un jeton intercepté peut être réutilisé jusqu'à sa rotation."
    c:
      en: "An API key connection also sends the key with every request, so it does not meet the requirement that the secret never be sent."
      fr: "Une connexion par clé d'API envoie aussi la clé avec chaque requête : elle ne respecte pas l'exigence selon laquelle le secret n'est jamais envoyé."
    d:
      en: "The ServiceNow integration expects ServiceNow tickets and authenticates with a bearer token, not an HMAC signature."
      fr: "L'intégration ServiceNow attend des tickets ServiceNow et s'authentifie avec un jeton bearer, pas avec une signature HMAC."
references:
  - title: Invoking DevOps Agent through Webhook
    url: https://docs.aws.amazon.com/devopsagent/latest/userguide/configuring-integrations-and-knowledge-invoking-devops-agent-through-webhook.html
