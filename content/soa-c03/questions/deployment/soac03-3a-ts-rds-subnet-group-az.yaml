id: soac03-3a-ts-rds-subnet-group-az
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineer deploys a Single-AZ Amazon RDS for PostgreSQL DB instance into a VPC with an AWS CloudFormation template. The DB subnet group in the template contains one private subnet in us-east-1a, and the creation of the DB subnet group fails.

    Which change will fix the deployment?
  fr: |
    Un ingénieur déploie une instance de base de données Amazon RDS for PostgreSQL Single-AZ dans un VPC avec un modèle AWS CloudFormation. Le groupe de sous-réseaux de base de données du modèle contient un seul sous-réseau privé dans us-east-1a, et la création du groupe de sous-réseaux échoue.

    Quelle modification permet de corriger le déploiement ?
body:
  options:
    - { id: a, text: { en: "Change the DB instance to a Multi-AZ deployment so that Amazon RDS creates the second subnet.", fr: "Passer l'instance de base de données en déploiement Multi-AZ pour qu'Amazon RDS crée le second sous-réseau." } }
    - { id: b, text: { en: "Add a private subnet in a second Availability Zone to the DB subnet group.", fr: "Ajouter au groupe de sous-réseaux de base de données un sous-réseau privé dans une seconde zone de disponibilité." } }
    - { id: c, text: { en: "Recreate the subnet in us-east-1a with a /24 CIDR block.", fr: "Recréer le sous-réseau de us-east-1a avec un bloc CIDR /24." } }
    - { id: d, text: { en: "Make the DB instance publicly accessible so that it does not need a DB subnet group.", fr: "Rendre l'instance de base de données accessible publiquement pour qu'elle n'ait pas besoin de groupe de sous-réseaux." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each DB subnet group must have subnets in at least two Availability Zones of the Region, even for Single-AZ deployments, so that the instance can be converted to Multi-AZ later. Adding a subnet in a second Availability Zone meets the requirement.
    fr: |
      Chaque groupe de sous-réseaux de base de données doit avoir des sous-réseaux dans au moins deux zones de disponibilité de la Région, même pour les déploiements Single-AZ, afin que l'instance puisse être convertie en Multi-AZ plus tard. Ajouter un sous-réseau dans une seconde zone de disponibilité répond à cette exigence.
  options:
    a:
      en: |
        Amazon RDS does not create subnets; a Multi-AZ deployment also needs a DB subnet group that covers at least two Availability Zones.
      fr: |
        Amazon RDS ne crée pas de sous-réseaux ; un déploiement Multi-AZ a aussi besoin d'un groupe de sous-réseaux couvrant au moins deux zones de disponibilité.
    c:
      en: |
        The size of the subnet is not the problem; the group still covers only one Availability Zone.
      fr: |
        La taille du sous-réseau n'est pas le problème ; le groupe ne couvre toujours qu'une seule zone de disponibilité.
    d:
      en: |
        A DB instance in a VPC always uses a DB subnet group; a publicly accessible instance needs public subnets in that group.
      fr: |
        Une instance de base de données dans un VPC utilise toujours un groupe de sous-réseaux ; une instance accessible publiquement a besoin de sous-réseaux publics dans ce groupe.
references:
  - title: Working with a DB instance in a VPC
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html
