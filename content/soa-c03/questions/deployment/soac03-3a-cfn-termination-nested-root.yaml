id: soac03-3a-cfn-termination-nested-root
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A production application is deployed as a root AWS CloudFormation stack with four nested stacks. An engineer tries to enable termination protection directly on the nested stack that contains the database, but the operation is not allowed. The company wants any attempt to delete one of the application's stacks to fail, without changing the stack structure.

    Which solution will meet these requirements?
  fr: |
    Une application de production est déployée sous forme d'une pile AWS CloudFormation racine avec quatre piles imbriquées. Un ingénieur tente d'activer la protection contre la résiliation directement sur la pile imbriquée qui contient la base de données, mais l'opération n'est pas autorisée. L'entreprise souhaite que toute tentative de suppression de l'une des piles de l'application échoue, sans modifier la structure des piles.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add DeletionPolicy: Retain to the AWS::CloudFormation::Stack resources in the root template.", fr: "Ajouter DeletionPolicy: Retain aux ressources AWS::CloudFormation::Stack du modèle racine." } }
    - { id: b, text: { en: "Set a stack policy on the root stack that denies Update:Delete on all resources.", fr: "Définir sur la pile racine une politique de pile qui refuse Update:Delete sur toutes les ressources." } }
    - { id: c, text: { en: "Enable termination protection on the root stack, which applies the same setting to its nested stacks.", fr: "Activer la protection contre la résiliation sur la pile racine, ce qui applique le même paramètre à ses piles imbriquées." } }
    - { id: d, text: { en: "Convert the nested stacks into independent stacks, and enable termination protection on each of them.", fr: "Convertir les piles imbriquées en piles indépendantes, et activer la protection contre la résiliation sur chacune d'elles." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Termination protection cannot be set directly on a nested stack. Enabling it on the root stack passes the same setting to all its nested stacks, and a direct deletion of a nested stack then fails as well.
    fr: |
      La protection contre la résiliation ne peut pas être définie directement sur une pile imbriquée. L'activer sur la pile racine transmet le même paramètre à toutes ses piles imbriquées, et la suppression directe d'une pile imbriquée échoue alors aussi.
  options:
    a:
      en: |
        DeletionPolicy keeps the nested stacks when the root stack deletes them, but direct deletion attempts still succeed.
      fr: |
        DeletionPolicy conserve les piles imbriquées lorsque la pile racine les supprime, mais les tentatives de suppression directe réussissent toujours.
    b:
      en: |
        A stack policy applies only during stack updates; it does not prevent the deletion of a stack.
      fr: |
        Une politique de pile ne s'applique que pendant les mises à jour de pile ; elle n'empêche pas la suppression d'une pile.
    d:
      en: |
        This changes the stack structure, which the requirements exclude.
      fr: |
        Cela modifie la structure des piles, ce que les exigences excluent.
references:
  - title: Protect CloudFormation stacks from being deleted
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-protect-stacks.html
