id: soac03-3b-sc-terraform-engine
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A platform team maintains Terraform configurations that create approved resources. The team wants developers in spoke accounts to provision these configurations as self-service products from AWS Service Catalog, with launch constraints, by using Terraform Community Edition. The configurations must not be rewritten in another language.

    What must the platform team do?
  fr: |
    Une équipe plateforme maintient des configurations Terraform qui créent des ressources approuvées. L'équipe veut que les développeurs des comptes spoke provisionnent ces configurations comme produits en libre-service depuis AWS Service Catalog, avec des contraintes de lancement, à l'aide de Terraform Community Edition. Les configurations ne doivent pas être réécrites dans un autre langage.

    Que doit faire l'équipe plateforme ?
body:
  options:
    - { id: a, text: { en: "Convert the Terraform configurations to CloudFormation templates, and create CloudFormation products from them.", fr: "Convertir les configurations Terraform en modèles CloudFormation, et créer des produits CloudFormation à partir de ces modèles." } }
    - { id: b, text: { en: "Create Terraform Cloud products, which run without any provisioning engine in the hub account.", fr: "Créer des produits Terraform Cloud, qui s'exécutent sans aucun moteur de provisionnement dans le compte hub." } }
    - { id: c, text: { en: "Install Terraform on each developer workstation, and share the configurations from a Service Catalog portfolio.", fr: "Installer Terraform sur le poste de chaque développeur, et partager les configurations depuis un portefeuille Service Catalog." } }
    - { id: d, text: { en: "Deploy the Terraform provisioning engine in the hub account, and create products of the External type.", fr: "Déployer le moteur de provisionnement Terraform dans le compte hub, et créer des produits de type External." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Service Catalog supports Terraform Community Edition through the External product type, formerly named Terraform Open Source. It requires a one-time setup of a Terraform provisioning engine in the administrator (hub) account, from the AWS-provided repository, before products, portfolios, and launch constraints can be shared with spoke accounts."
    fr: "Service Catalog prend en charge Terraform Community Edition avec le type de produit External, anciennement appelé Terraform Open Source. Il faut d'abord installer une fois un moteur de provisionnement Terraform dans le compte administrateur (hub), à partir du dépôt fourni par AWS, avant de partager produits, portefeuilles et contraintes de lancement avec les comptes spoke."
  options:
    a:
      en: "Rewriting the configurations in CloudFormation is what the team must avoid."
      fr: "Réécrire les configurations en CloudFormation est justement ce que l'équipe doit éviter."
    b:
      en: "Terraform Cloud products also need a provisioning engine, and they use HashiCorp's service instead of Community Edition."
      fr: "Les produits Terraform Cloud ont aussi besoin d'un moteur de provisionnement, et ils utilisent le service de HashiCorp au lieu de Community Edition."
    c:
      en: "Local runs bypass Service Catalog provisioning and its launch constraints."
      fr: "Des exécutions locales contournent le provisionnement Service Catalog et ses contraintes de lancement."
references:
  - title: "Prerequisite: Configure your Terraform provisioning engine"
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/getstarted-terraform-engine.html
  - title: Getting started with a Terraform product
    url: https://docs.aws.amazon.com/servicecatalog/latest/adminguide/getstarted-Terraform.html
