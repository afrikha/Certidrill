id: soac03-3c-patch-baseline-delay
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's Windows Server managed nodes use the predefined patch baseline AWS-DefaultPatchBaseline, and a patch policy installs approved patches every night. A new security policy requires critical and important security updates to be installed within 2 days of their release.

    Which action will meet this requirement?
  fr: |
    Les nœuds gérés Windows Server d'une entreprise utilisent le référentiel de correctifs prédéfini AWS-DefaultPatchBaseline, et une politique de correctifs installe chaque nuit les correctifs approuvés. Une nouvelle politique de sécurité exige que les mises à jour de sécurité critiques et importantes soient installées dans les 2 jours suivant leur publication.

    Quelle action répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Create a custom patch baseline with a 1-day auto-approval delay for critical and important security updates, and use it for the Windows nodes.", fr: "Créer un référentiel de correctifs personnalisé avec un délai d'approbation automatique de 1 jour pour les mises à jour de sécurité critiques et importantes, et l'utiliser pour les nœuds Windows." } }
    - { id: b, text: { en: "Edit AWS-DefaultPatchBaseline and change its auto-approval delay for critical and important security updates from 7 days to 1 day.", fr: "Modifier AWS-DefaultPatchBaseline et faire passer son délai d'approbation automatique des mises à jour de sécurité critiques et importantes de 7 jours à 1 jour." } }
    - { id: c, text: { en: "Change the patching operation of the patch policy to Install with RebootOption set to RebootIfNeeded for the Windows nodes.", fr: "Passer l'opération de la politique de correctifs à Install avec RebootOption défini sur RebootIfNeeded pour les nœuds Windows." } }
    - { id: d, text: { en: "Change the install schedule of the patch policy from every night to every 12 hours for the Windows nodes.", fr: "Faire passer la planification d'installation de la politique de correctifs de chaque nuit à toutes les 12 heures pour les nœuds Windows." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The default Windows Server baselines approve patches automatically 7 days after release, so patches cannot be installed sooner. Predefined baselines cannot be modified: to install patches faster, create a custom baseline with a shorter auto-approval delay and use it for the nodes. With a 1-day delay and nightly installs, a patch is installed within 2 days of release."
    fr: "Les référentiels Windows Server par défaut approuvent automatiquement les correctifs 7 jours après leur publication : les correctifs ne peuvent donc pas être installés plus tôt. Les référentiels prédéfinis ne sont pas modifiables : pour installer plus vite, il faut créer un référentiel personnalisé avec un délai d'approbation plus court et l'utiliser pour les nœuds. Avec un délai de 1 jour et une installation chaque nuit, un correctif est installé dans les 2 jours suivant sa publication."
  options:
    b:
      en: "Predefined baselines cannot be customized; you must copy them or create a custom baseline."
      fr: "Les référentiels prédéfinis ne sont pas personnalisables ; il faut les copier ou créer un référentiel personnalisé."
    c:
      en: "The policy already installs patches; the reboot option does not change when patches become approved."
      fr: "La politique installe déjà les correctifs ; l'option de redémarrage ne modifie pas le moment où ils sont approuvés."
    d:
      en: "Installing more often does not help, because patches are not approved until 7 days after release."
      fr: "Installer plus souvent ne sert à rien, car les correctifs ne sont approuvés que 7 jours après leur publication."
references:
  - title: Predefined and custom patch baselines
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-predefined-and-custom-patch-baselines.html
