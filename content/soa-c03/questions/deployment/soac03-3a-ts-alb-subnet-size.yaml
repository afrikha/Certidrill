id: soac03-3a-ts-alb-subnet-size
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations engineer created an internet-facing Application Load Balancer in two public subnets: 10.0.0.0/28 in us-east-1a and 10.0.0.16/28 in us-east-1b. Each subnet has 11 usable addresses, and most of them are used by NAT gateways and instances. During traffic peaks, the load balancer cannot scale, and clients receive intermittent 5xx errors and timeouts.

    Which solution will resolve the issue?
  fr: |
    Un ingénieur d'exploitation a créé un Application Load Balancer accessible depuis Internet dans deux sous-réseaux publics : 10.0.0.0/28 dans us-east-1a et 10.0.0.16/28 dans us-east-1b. Chaque sous-réseau compte 11 adresses utilisables, dont la plupart sont utilisées par des passerelles NAT et des instances. Lors des pics de trafic, l'équilibreur de charge ne peut pas monter en charge, et les clients reçoivent des erreurs 5xx et des expirations intermittentes.

    Quelle solution permet de résoudre le problème ?
body:
  options:
    - { id: a, text: { en: "Turn on cross-zone load balancing so that every load balancer node can route traffic to the targets in both zones.", fr: "Activer l'équilibrage de charge entre zones pour que chaque nœud de l'équilibreur puisse router le trafic vers les cibles des deux zones." } }
    - { id: b, text: { en: "Add a third /28 subnet in another Availability Zone so that the load balancer has more nodes during the peaks.", fr: "Ajouter un troisième sous-réseau /28 dans une autre zone de disponibilité pour que l'équilibreur ait plus de nœuds pendant les pics." } }
    - { id: c, text: { en: "Move the load balancer to new subnets of at least /27, with at least eight free IP addresses, in each Availability Zone.", fr: "Déplacer l'équilibreur de charge vers de nouveaux sous-réseaux d'au moins /27, avec au moins huit adresses IP libres, dans chaque zone de disponibilité." } }
    - { id: d, text: { en: "Allocate Elastic IP addresses and associate them with the load balancer so that its nodes keep fixed addresses.", fr: "Allouer des adresses IP Elastic et les associer à l'équilibreur de charge pour que ses nœuds gardent des adresses fixes." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each subnet of an Application Load Balancer needs a CIDR block of at least /27 and at least eight free IP addresses so that the load balancer can scale out and replace nodes. When a subnet runs out of usable addresses during scaling, the load balancer runs with insufficient capacity, which can cause 5xx errors and timeouts.
    fr: |
      Chaque sous-réseau d'un Application Load Balancer doit avoir un bloc CIDR d'au moins /27 et au moins huit adresses IP libres pour que l'équilibreur de charge puisse monter en charge et remplacer des nœuds. Lorsqu'un sous-réseau manque d'adresses utilisables pendant la montée en charge, l'équilibreur fonctionne avec une capacité insuffisante, ce qui peut provoquer des erreurs 5xx et des expirations.
  options:
    a:
      en: |
        Cross-zone load balancing changes how traffic is spread across targets; it does not give the load balancer nodes more IP addresses.
      fr: |
        L'équilibrage de charge entre zones modifie la répartition du trafic entre les cibles ; il ne donne pas plus d'adresses IP aux nœuds de l'équilibreur.
    b:
      en: |
        A third /28 subnet is still smaller than the documented /27 minimum, and the two existing subnets stay too small.
      fr: |
        Un troisième sous-réseau /28 reste plus petit que le minimum documenté de /27, et les deux sous-réseaux existants restent trop petits.
    d:
      en: |
        Application Load Balancers do not use Elastic IP addresses; their nodes take private addresses from the subnets.
      fr: |
        Les Application Load Balancers n'utilisent pas d'adresses IP Elastic ; leurs nœuds prennent des adresses privées dans les sous-réseaux.
references:
  - title: Application Load Balancers
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html
