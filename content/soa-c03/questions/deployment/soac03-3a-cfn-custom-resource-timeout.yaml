id: soac03-3a-cfn-custom-resource-timeout
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS CloudFormation stack contains a custom resource backed by an AWS Lambda function. When a bug prevents the function from sending a response, the stack operation waits 1 hour before it fails, which delays troubleshooting. When the custom resource works, it completes in less than 2 minutes. The other resources of the stack take about 40 minutes to create.

    Which solution will make a failed custom resource operation fail after 5 minutes?
  fr: |
    Une pile AWS CloudFormation contient une ressource personnalisée basée sur une fonction AWS Lambda. Lorsqu'un bogue empêche la fonction d'envoyer une réponse, l'opération de pile attend 1 heure avant d'échouer, ce qui retarde le dépannage. Quand la ressource personnalisée fonctionne, elle se termine en moins de 2 minutes. Les autres ressources de la pile mettent environ 40 minutes à être créées.

    Quelle solution permet de faire échouer au bout de 5 minutes une opération de ressource personnalisée en échec ?
body:
  options:
    - { id: a, text: { en: "Set the ServiceTimeout property of the custom resource to 300.", fr: "Définir la propriété ServiceTimeout de la ressource personnalisée sur 300." } }
    - { id: b, text: { en: "Add a CreationPolicy with a ResourceSignal Timeout of PT5M to the custom resource.", fr: "Ajouter à la ressource personnalisée une CreationPolicy avec un ResourceSignal de Timeout PT5M." } }
    - { id: c, text: { en: "Create and update the stack with the --timeout-in-minutes 5 option.", fr: "Créer et mettre à jour la pile avec l'option --timeout-in-minutes 5." } }
    - { id: d, text: { en: "Set the timeout of the Lambda function to 5 minutes.", fr: "Définir le délai d'expiration de la fonction Lambda sur 5 minutes." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      ServiceTimeout sets the maximum time, in seconds, before a custom resource operation times out; it accepts 1 to 3,600 seconds and defaults to 3,600. If no response is received before the timeout, the request is considered unsuccessful and the stack operation fails, so 300 makes it fail after 5 minutes.
    fr: |
      ServiceTimeout définit la durée maximale, en secondes, avant l'expiration d'une opération de ressource personnalisée ; il accepte de 1 à 3 600 secondes et vaut 3 600 par défaut. Si aucune réponse n'arrive avant l'expiration, la requête est considérée comme un échec et l'opération de pile échoue : 300 la fait échouer au bout de 5 minutes.
  options:
    b:
      en: |
        CreationPolicy is supported only by a few resource types, such as EC2 instances and Auto Scaling groups, not by custom resources.
      fr: |
        CreationPolicy n'est prise en charge que par quelques types de ressources, comme les instances EC2 et les groupes Auto Scaling, pas par les ressources personnalisées.
    c:
      en: |
        A stack-level timeout of 5 minutes would make every creation fail, because the other resources need about 40 minutes.
      fr: |
        Un délai de 5 minutes au niveau de la pile ferait échouer chaque création, car les autres ressources ont besoin d'environ 40 minutes.
    d:
      en: |
        When the function stops without sending a response, CloudFormation still waits for the custom resource timeout.
      fr: |
        Lorsque la fonction s'arrête sans envoyer de réponse, CloudFormation attend toujours l'expiration du délai de la ressource personnalisée.
references:
  - title: AWS::CloudFormation::CustomResource
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-cloudformation-customresource.html
  - title: CloudFormation custom resource request and response reference
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/crpg-ref-responses.html
