id: soac03-3b-ss-mgmt-account
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an AWS CloudFormation StackSet with service-managed permissions to deploy a set of Amazon CloudWatch alarms and an IAM role for incident response. The StackSet targets the root of the organization in AWS Organizations, and all member accounts have the stack. The organization's management account has no stack instance, and an audit requires the same resources in the management account too.

    Which solution will meet this requirement?
  fr: |
    Une entreprise utilise un StackSet AWS CloudFormation avec des autorisations gérées par le service pour déployer un ensemble d'alarmes Amazon CloudWatch et un rôle IAM de réponse aux incidents. Le StackSet cible la racine de l'organisation AWS Organizations, et tous les comptes membres ont la pile. Le compte de gestion de l'organisation n'a aucune instance de pile, et un audit exige les mêmes ressources dans le compte de gestion également.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Deploy the same template in the management account as a stack or as a self-managed StackSet.", fr: "Déployer le même modèle dans le compte de gestion sous forme de pile ou de StackSet autogéré." } }
    - { id: b, text: { en: "Add the management account ID to the deployment targets with the UNION account filter type.", fr: "Ajouter l'ID du compte de gestion aux cibles de déploiement avec le type de filtre de comptes UNION." } }
    - { id: c, text: { en: "Register the management account as a delegated administrator for StackSets and run the operation again.", fr: "Enregistrer le compte de gestion comme administrateur délégué pour StackSets et relancer l'opération." } }
    - { id: d, text: { en: "Deactivate and then reactivate trusted access for StackSets so that the management account is included.", fr: "Désactiver puis réactiver l'accès approuvé pour StackSets afin que le compte de gestion soit inclus." } }
answer: { optionId: a }
explanation:
  correct:
    en: "StackSets with service-managed permissions never deploy stacks to the management account, even when they target the root or an OU that contains it. The management account must receive the template another way, such as a regular stack or a StackSet with self-managed permissions."
    fr: "Les StackSets avec des autorisations gérées par le service ne déploient jamais de piles dans le compte de gestion, même lorsqu'ils ciblent la racine ou une OU qui le contient. Le compte de gestion doit recevoir le modèle d'une autre façon, par exemple une pile classique ou un StackSet avec des autorisations autogérées."
  options:
    b:
      en: "Account filters refine OU targets, but they cannot override the rule that excludes the management account."
      fr: "Les filtres de comptes affinent les cibles d'OU, mais ils ne peuvent pas contourner la règle qui exclut le compte de gestion."
    c:
      en: "Only member accounts can be delegated administrators, and delegation does not change where stacks are deployed."
      fr: "Seuls des comptes membres peuvent être administrateurs délégués, et la délégation ne change pas l'emplacement de déploiement des piles."
    d:
      en: "Trusted access is already working, since member accounts have the stack; it never includes the management account."
      fr: "L'accès approuvé fonctionne déjà, puisque les comptes membres ont la pile ; il n'inclut jamais le compte de gestion."
references:
  - title: Create CloudFormation StackSets with service-managed permissions
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-associate-stackset-with-org.html
