id: soac03-3c-guardduty-numeric-pattern
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A security team wants an Amazon EventBridge rule to send only the Amazon GuardDuty findings with a severity of 7 or higher to an AWS Lambda function that isolates the affected resources. In the finding events, the severity field is a number that can have a decimal part, for example 8.2.

    Which event pattern meets this requirement?
  fr: |
    Une équipe de sécurité veut qu'une règle Amazon EventBridge n'envoie que les résultats Amazon GuardDuty de gravité 7 ou supérieure à une fonction AWS Lambda qui isole les ressources concernées. Dans les événements de résultat, le champ severity est un nombre qui peut avoir une partie décimale, par exemple 8.2.

    Quel modèle d'événement répond à cette exigence ?
body:
  options:
    - id: a
      text: '`{"source": ["aws.guardduty"], "detail-type": ["GuardDuty Finding"], "detail": {"severity": ["HIGH", "CRITICAL"]}}`'
    - id: b
      text: '`{"source": ["aws.guardduty"], "detail-type": ["GuardDuty Finding"], "detail": {"severity": [{"prefix": "7"}]}}`'
    - id: c
      text: '`{"source": ["aws.guardduty"], "detail-type": ["GuardDuty Finding"], "detail": {"severity": [{"numeric": [">=", 7]}]}}`'
    - id: d
      text: '`{"source": ["aws.guardduty"], "detail-type": ["GuardDuty Finding"], "detail": {"severity": [7, 8, 9, 10]}}`'
answer: { optionId: c }
explanation:
  correct:
    en: "GuardDuty publishes each finding as a GuardDuty Finding event with the source aws.guardduty, and detail.severity is a number. The numeric comparison operator matches every value greater than or equal to 7, including decimal values such as 7.5 or 8.2."
    fr: "GuardDuty publie chaque résultat sous forme d'événement GuardDuty Finding avec la source aws.guardduty, et detail.severity est un nombre. L'opérateur de comparaison numeric correspond à toutes les valeurs supérieures ou égales à 7, y compris les valeurs décimales comme 7.5 ou 8.2."
  options:
    a:
      en: "The severity field holds a number, not a label such as HIGH, so the strings never match."
      fr: "Le champ severity contient un nombre, pas une étiquette comme HIGH : les chaînes ne correspondent jamais."
    b:
      en: "Prefix matching applies to string values, and even on strings it would miss 8, 9, and 10."
      fr: "La correspondance par préfixe s'applique aux chaînes, et même sur des chaînes elle ignorerait 8, 9 et 10."
    d:
      en: "Exact values match only whole numbers in the list, so findings such as 8.2 or 7.5 are missed."
      fr: "Les valeurs exactes ne correspondent qu'aux nombres entiers de la liste : des résultats comme 8.2 ou 7.5 sont ignorés."
references:
  - title: Comparison operators for use in event patterns in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-create-pattern-operators.html
  - title: Processing GuardDuty findings with Amazon EventBridge
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_eventbridge.html
