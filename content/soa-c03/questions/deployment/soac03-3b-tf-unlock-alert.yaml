id: soac03-3b-tf-unlock-alert
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores Terraform state in an Amazon S3 bucket with S3 native locking. Only the pipeline role should release locks. The security team wants an Amazon SNS notification whenever any other principal deletes a .tflock object, for example with terraform force-unlock. The account has an AWS CloudTrail trail that logs management events only.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke l'état Terraform dans un compartiment Amazon S3 avec le verrouillage natif S3. Seul le rôle du pipeline devrait libérer les verrous. L'équipe de sécurité veut une notification Amazon SNS chaque fois qu'un autre principal supprime un objet .tflock, par exemple avec terraform force-unlock. Le compte a un journal de suivi AWS CloudTrail qui n'enregistre que les événements de gestion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure S3 Event Notifications for s3:ObjectRemoved events with the .tflock suffix that publish to the SNS topic.", fr: "Configurer des notifications d'événements S3 pour les événements s3:ObjectRemoved avec le suffixe .tflock qui publient vers la rubrique SNS." } }
    - { id: b, text: { en: "Turn on S3 server access logging for the bucket, and query the logs for .tflock deletions with Amazon Athena each week.", fr: "Activer la journalisation des accès au serveur S3 pour le compartiment, et rechercher les suppressions de .tflock dans les journaux avec Amazon Athena chaque semaine." } }
    - { id: c, text: { en: "Create an EventBridge rule that matches DeleteObject calls from the existing management events trail.", fr: "Créer une règle EventBridge qui correspond aux appels DeleteObject issus du journal de suivi actuel des événements de gestion." } }
    - { id: d, text: { en: "Log S3 data events for the bucket, and add an EventBridge rule for DeleteObject on .tflock keys by identities other than the pipeline role.", fr: "Enregistrer les événements de données S3 du compartiment, et ajouter une règle EventBridge pour DeleteObject sur les clés .tflock par des identités autres que le rôle du pipeline." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Releasing a lock deletes the .tflock object, and DeleteObject is a CloudTrail data event that is not logged by default. Once the trail logs data events for the bucket, an EventBridge rule can match DeleteObject calls on keys that end in .tflock, exclude the pipeline role's assumed-role ARN, and send matches to SNS."
    fr: "Libérer un verrou supprime l'objet .tflock, et DeleteObject est un événement de données CloudTrail qui n'est pas enregistré par défaut. Une fois que le journal de suivi enregistre les événements de données du compartiment, une règle EventBridge peut cibler les appels DeleteObject sur les clés se terminant par .tflock, exclure l'ARN de rôle endossé du pipeline, et envoyer les correspondances vers SNS."
  options:
    a:
      en: "S3 Event Notifications cannot filter on the identity that deleted the object, so every normal pipeline unlock would also notify."
      fr: "Les notifications d'événements S3 ne peuvent pas filtrer sur l'identité qui a supprimé l'objet : chaque libération normale par le pipeline enverrait aussi une notification."
    b:
      en: "A weekly query is not a notification when the deletion happens."
      fr: "Une requête hebdomadaire n'est pas une notification au moment de la suppression."
    c:
      en: "Object-level calls such as DeleteObject are data events, so a trail with only management events never records them."
      fr: "Les appels au niveau objet comme DeleteObject sont des événements de données : un journal de suivi limité aux événements de gestion ne les enregistre jamais."
references:
  - title: Backend best practices
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/terraform-aws-provider-best-practices/backend.html
