id: soac03-3b-cfn-registry-third-party
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An operations team wants to manage resources of a third-party monitoring vendor in AWS CloudFormation templates. The vendor publishes a resource type as a public extension in the CloudFormation registry. Stacks that use the type fail in us-east-1 and eu-west-1 of the team's account because the type is not recognized.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe d'exploitation veut gérer dans des modèles AWS CloudFormation les ressources d'un éditeur tiers de supervision. L'éditeur publie un type de ressource comme extension publique dans le registre CloudFormation. Les piles qui utilisent ce type échouent dans us-east-1 et eu-west-1 du compte de l'équipe parce que le type n'est pas reconnu.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Activate the public extension with an execution role in both us-east-1 and eu-west-1 of the account.", fr: "Activer l'extension publique avec un rôle d'exécution dans us-east-1 et dans eu-west-1 du compte." } }
    - { id: b, text: { en: "Activate the public extension once in us-east-1, because registry activations apply to all Regions.", fr: "Activer l'extension publique une seule fois dans us-east-1, car les activations du registre s'appliquent à toutes les Régions." } }
    - { id: c, text: { en: "Add the vendor's schema to the templates with the AWS::Include transform.", fr: "Ajouter le schéma de l'éditeur aux modèles avec la transformation AWS::Include." } }
    - { id: d, text: { en: "Build the vendor's handler code and register it as a private resource type in each Region.", fr: "Compiler le code de gestionnaire de l'éditeur et l'enregistrer comme type de ressource privé dans chaque Région." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A third-party public extension must be activated in each account and Region where stacks use it; activation adds a private entry to the account's registry in that Region. The execution role gives CloudFormation the permissions that the extension's handlers need and trusts resources.cloudformation.amazonaws.com."
    fr: "Une extension publique tierce doit être activée dans chaque compte et chaque Région où des piles l'utilisent ; l'activation ajoute une entrée privée au registre du compte dans cette Région. Le rôle d'exécution donne à CloudFormation les autorisations dont les gestionnaires de l'extension ont besoin et approuve resources.cloudformation.amazonaws.com."
  options:
    b:
      en: "Activation is per account and per Region, so eu-west-1 would still not recognize the type."
      fr: "L'activation se fait par compte et par Région : eu-west-1 ne reconnaîtrait toujours pas le type."
    c:
      en: "AWS::Include inserts template snippets; it does not provide the handlers that create the vendor's resources."
      fr: "AWS::Include insère des extraits de modèle ; il ne fournit pas les gestionnaires qui créent les ressources de l'éditeur."
    d:
      en: "Registering a private copy means building and maintaining the vendor's code, which is more work than activating the public extension."
      fr: "Enregistrer une copie privée oblige à compiler et maintenir le code de l'éditeur, ce qui demande plus de travail que d'activer l'extension publique."
references:
  - title: Use third-party public extensions from the CloudFormation registry
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/registry-public.html
