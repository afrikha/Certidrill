id: soac03-3c-health-retirement-automation
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AWS sometimes schedules the retirement of Amazon EBS-backed EC2 instances that run on degraded hardware. An operations team wants such instances to be stopped and started automatically, which moves them to new hardware, as soon as AWS announces the retirement and without writing custom code.

    Which solution will meet these requirements?
  fr: |
    AWS planifie parfois la mise hors service d'instances EC2 basées sur Amazon EBS qui s'exécutent sur un matériel dégradé. Une équipe d'exploitation veut que ces instances soient arrêtées et démarrées automatiquement, ce qui les déplace vers un nouveau matériel, dès qu'AWS annonce la mise hors service et sans écrire de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch alarm on StatusCheckFailed_System for each instance, with the EC2 recover action.", fr: "Créer pour chaque instance une alarme CloudWatch sur StatusCheckFailed_System, avec l'action de récupération EC2." } }
    - { id: b, text: { en: "Create an EventBridge rule for AWS Health events with the code AWS_EC2_INSTANCE_RETIREMENT_SCHEDULED that starts the AWS-RestartEC2Instance runbook.", fr: "Créer une règle EventBridge pour les événements AWS Health de code AWS_EC2_INSTANCE_RETIREMENT_SCHEDULED qui lance le runbook AWS-RestartEC2Instance." } }
    - { id: c, text: { en: "Create an EventBridge rule for EC2 Instance State-change Notification events with the state stopping that starts the AWS-RestartEC2Instance runbook.", fr: "Créer une règle EventBridge pour les événements EC2 Instance State-change Notification à l'état stopping qui lance le runbook AWS-RestartEC2Instance." } }
    - { id: d, text: { en: "Create an AWS Config rule that detects instances scheduled for retirement and remediates them with the AWS-RestartEC2Instance runbook.", fr: "Créer une règle AWS Config qui détecte les instances dont la mise hors service est planifiée et les corrige avec le runbook AWS-RestartEC2Instance." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Health sends events with the source aws.health and the detail-type AWS Health Event to EventBridge. A retirement is a scheduledChange event with the event type code AWS_EC2_INSTANCE_RETIREMENT_SCHEDULED, and the affected instance is listed in affectedEntities. A rule can start a Systems Manager Automation runbook as its target, so the instance is stopped and started without custom code."
    fr: "AWS Health envoie à EventBridge des événements avec la source aws.health et le detail-type AWS Health Event. Une mise hors service est un événement scheduledChange de code AWS_EC2_INSTANCE_RETIREMENT_SCHEDULED, et l'instance concernée figure dans affectedEntities. Une règle peut lancer un runbook Systems Manager Automation comme cible : l'instance est arrêtée et démarrée sans code personnalisé."
  options:
    a:
      en: "The recover action acts only after a system status check fails, not when AWS announces a retirement in advance."
      fr: "L'action de récupération n'agit qu'après l'échec d'une vérification de l'état du système, pas lorsqu'AWS annonce une mise hors service à l'avance."
    c:
      en: "This rule reacts to every instance that stops, for any reason, and it does not react to the retirement announcement."
      fr: "Cette règle réagit à toute instance qui s'arrête, pour n'importe quelle raison, et ne réagit pas à l'annonce de mise hors service."
    d:
      en: "AWS Config evaluates resource configurations; a scheduled retirement is an AWS Health event, not a configuration setting that a Config rule can check."
      fr: "AWS Config évalue les configurations des ressources ; une mise hors service planifiée est un événement AWS Health, pas un paramètre de configuration qu'une règle Config peut vérifier."
references:
  - title: "Reference: AWS Health events Amazon EventBridge schema"
    url: https://docs.aws.amazon.com/health/latest/ug/aws-health-events-eventbridge-schema.html
  - title: Event bus targets in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-targets.html
