id: soac03-3c-s3-sns-topic-policy
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator configures an Amazon S3 event notification that sends s3:ObjectRemoved:* events from a bucket to an Amazon SNS standard topic in the same account and Region. The topic is not encrypted. Amazon S3 refuses to save the configuration because it cannot validate the destination.

    Which solution will fix the issue?
  fr: |
    Un administrateur configure une notification d'événement Amazon S3 qui envoie les événements s3:ObjectRemoved:* d'un compartiment à une rubrique Amazon SNS standard du même compte et de la même Région. La rubrique n'est pas chiffrée. Amazon S3 refuse d'enregistrer la configuration, car il ne peut pas valider la destination.

    Quelle solution résout le problème ?
body:
  options:
    - { id: a, text: { en: "Add a statement to the access policy of the topic that allows s3.amazonaws.com to call SNS:Publish, with the bucket ARN as aws:SourceArn.", fr: "Ajouter à la politique d'accès de la rubrique une instruction qui autorise s3.amazonaws.com à appeler SNS:Publish, avec l'ARN du compartiment comme aws:SourceArn." } }
    - { id: b, text: { en: "Add a statement to the bucket policy that allows sns.amazonaws.com to call s3:GetBucketNotification on the bucket.", fr: "Ajouter à la politique de compartiment une instruction qui autorise sns.amazonaws.com à appeler s3:GetBucketNotification sur le compartiment." } }
    - { id: c, text: { en: "Attach an IAM policy that allows SNS:Publish on the topic to the IAM user who configures the notification.", fr: "Attacher à l'utilisateur IAM qui configure la notification une politique IAM qui autorise SNS:Publish sur la rubrique." } }
    - { id: d, text: { en: "Replace the topic with an SNS FIFO topic so that Amazon S3 can deliver the events in order.", fr: "Remplacer la rubrique par une rubrique SNS FIFO pour qu'Amazon S3 puisse remettre les événements dans l'ordre." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon S3 publishes notifications with the s3.amazonaws.com service principal, so the topic's access policy must allow that principal to call SNS:Publish. The aws:SourceArn and aws:SourceAccount conditions restrict publishing to the bucket and its owner. An encrypted topic would also need a KMS key policy statement, but this topic is not encrypted."
    fr: "Amazon S3 publie les notifications avec le principal de service s3.amazonaws.com : la politique d'accès de la rubrique doit donc autoriser ce principal à appeler SNS:Publish. Les conditions aws:SourceArn et aws:SourceAccount limitent la publication au compartiment et à son propriétaire. Une rubrique chiffrée exigerait aussi une instruction dans la politique de clé KMS, mais cette rubrique n'est pas chiffrée."
  options:
    b:
      en: "SNS does not read the bucket; the missing permission is on the topic, for Amazon S3 to publish to it."
      fr: "SNS ne lit pas le compartiment ; l'autorisation manquante se trouve sur la rubrique, pour qu'Amazon S3 puisse y publier."
    c:
      en: "Amazon S3 publishes the events with its own service principal, not with the credentials of the user who configured them."
      fr: "Amazon S3 publie les événements avec son propre principal de service, pas avec les informations d'identification de l'utilisateur qui les a configurés."
    d:
      en: "S3 event notifications support only SNS standard topics, not FIFO topics."
      fr: "Les notifications d'événements S3 ne prennent en charge que les rubriques SNS standard, pas les rubriques FIFO."
references:
  - title: Granting permissions to publish event notification messages to a destination
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/grant-destinations-permissions-to-s3.html
