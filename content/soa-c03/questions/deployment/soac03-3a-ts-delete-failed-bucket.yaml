id: soac03-3a-ts-delete-failed-bucket
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An engineer deletes an AWS CloudFormation stack that is no longer needed. The stack goes to the DELETE_FAILED status because its Amazon S3 bucket contains objects. Compliance requires the bucket and its objects to be kept, but all the other resources of the stack must be deleted.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur supprime une pile AWS CloudFormation devenue inutile. La pile passe à l'état DELETE_FAILED, car son compartiment Amazon S3 contient des objets. La conformité exige de conserver le compartiment et ses objets, mais toutes les autres ressources de la pile doivent être supprimées.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Empty the bucket, and then delete the stack again to remove the remaining resources.", fr: "Vider le compartiment, puis supprimer de nouveau la pile pour retirer les ressources restantes." } }
    - { id: b, text: { en: "Run continue-update-rollback on the stack, and then delete the stack again.", fr: "Exécuter continue-update-rollback sur la pile, puis supprimer de nouveau la pile." } }
    - { id: c, text: { en: "Disable termination protection on the stack, and then delete the stack again.", fr: "Désactiver la protection contre la résiliation de la pile, puis supprimer de nouveau la pile." } }
    - { id: d, text: { en: "Delete the stack again, with the bucket's logical ID in the RetainResources parameter.", fr: "Supprimer de nouveau la pile, avec l'ID logique du compartiment dans le paramètre RetainResources." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a stack is in DELETE_FAILED because CloudFormation could not delete a resource, the deletion can be run again with the RetainResources parameter for that resource. CloudFormation then deletes the stack and its other resources and leaves the bucket and its objects in place.
    fr: |
      Lorsqu'une pile est à l'état DELETE_FAILED parce que CloudFormation n'a pas pu supprimer une ressource, la suppression peut être relancée avec le paramètre RetainResources pour cette ressource. CloudFormation supprime alors la pile et ses autres ressources et laisse le compartiment et ses objets en place.
  options:
    a:
      en: |
        Emptying the bucket deletes the objects that compliance requires to keep.
      fr: |
        Vider le compartiment supprime les objets que la conformité impose de conserver.
    b:
      en: |
        continue-update-rollback applies to stacks in UPDATE_ROLLBACK_FAILED, not to failed deletions.
      fr: |
        continue-update-rollback s'applique aux piles à l'état UPDATE_ROLLBACK_FAILED, pas aux suppressions en échec.
    c:
      en: |
        With termination protection, the deletion would not have started; the failure comes from the non-empty bucket.
      fr: |
        Avec la protection contre la résiliation, la suppression n'aurait pas commencé ; l'échec vient du compartiment non vide.
references:
  - title: Troubleshooting CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/troubleshooting.html
