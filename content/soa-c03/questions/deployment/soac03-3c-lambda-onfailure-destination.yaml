id: soac03-3c-lambda-onfailure-destination
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon S3 event notification invokes an AWS Lambda function for each uploaded object. Lambda invokes the function asynchronously, and some events still fail after Lambda's retries. For each of these events, the operations team must keep a record that contains both the original event and the error returned by the function, so that it can investigate and reprocess the event later.

    Which solution will meet these requirements?
  fr: |
    Une notification d'événement Amazon S3 invoque une fonction AWS Lambda pour chaque objet chargé. Lambda invoque la fonction de manière asynchrone, et certains événements échouent encore après les nouvelles tentatives de Lambda. Pour chacun de ces événements, l'équipe d'exploitation doit conserver un enregistrement qui contient à la fois l'événement d'origine et l'erreur renvoyée par la fonction, afin de pouvoir l'analyser et retraiter l'événement plus tard.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure an on-failure destination for asynchronous invocation that sends records to an Amazon SQS standard queue.", fr: "Configurer pour l'invocation asynchrone une destination en cas d'échec qui envoie les enregistrements vers une file d'attente Amazon SQS standard." } }
    - { id: b, text: { en: "Configure an Amazon SQS standard queue as the dead-letter queue of the function for discarded events.", fr: "Configurer une file d'attente Amazon SQS standard comme file d'attente de lettres mortes de la fonction pour les événements rejetés." } }
    - { id: c, text: { en: "Set the retry attempts of asynchronous invocation to 10, and set the maximum age of event to 6 hours.", fr: "Définir à 10 le nombre de nouvelles tentatives de l'invocation asynchrone, et définir l'âge maximal de l'événement à 6 heures." } }
    - { id: d, text: { en: "Create an Amazon CloudWatch alarm on the Errors metric of the function that notifies an Amazon SNS topic.", fr: "Créer une alarme Amazon CloudWatch sur la métrique Errors de la fonction qui notifie une rubrique Amazon SNS." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An on-failure destination receives an invocation record when an event fails all processing attempts or exceeds its maximum age. The record is a JSON document with details about the request and the response, including the error, and an SQS standard queue keeps it until the team processes it.
    fr: |
      Une destination en cas d'échec reçoit un enregistrement d'invocation lorsqu'un événement échoue à toutes les tentatives de traitement ou dépasse son âge maximal. L'enregistrement est un document JSON qui détaille la requête et la réponse, erreur comprise, et une file d'attente SQS standard le conserve jusqu'à ce que l'équipe le traite.
  options:
    b:
      en: |
        For a dead-letter queue, Lambda sends only the content of the event, without details about the response, so the error is missing.
      fr: |
        Pour une file d'attente de lettres mortes, Lambda n'envoie que le contenu de l'événement, sans détails sur la réponse : l'erreur est absente.
    c:
      en: |
        Lambda accepts 0 to 2 retry attempts for asynchronous invocation, and more retries would not keep any record of the failed events.
      fr: |
        Lambda accepte de 0 à 2 nouvelles tentatives pour l'invocation asynchrone, et davantage de tentatives ne conserverait aucun enregistrement des événements en échec.
    d:
      en: |
        An alarm signals that errors occurred, but it keeps neither the events nor the errors needed to reprocess them.
      fr: |
        Une alarme signale que des erreurs se sont produites, mais elle ne conserve ni les événements ni les erreurs nécessaires à leur retraitement.
references:
  - title: Capturing records of Lambda asynchronous invocations
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html
  - title: Configuring error handling settings for Lambda asynchronous invocations
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-configuring.html
