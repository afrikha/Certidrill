id: soac03-3a-cdk-require-approval
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations engineer deploys an AWS CDK app from a terminal. With the default settings, cdk deploy asks for confirmation only when a change broadens IAM permissions or security group rules. The company now requires the engineer to review and confirm every change to the production stack before it is applied.

    Which command will meet this requirement?
  fr: |
    Un ingénieur d'exploitation déploie une application AWS CDK depuis un terminal. Avec les paramètres par défaut, cdk deploy ne demande une confirmation que lorsqu'une modification élargit des autorisations IAM ou des règles de groupe de sécurité. L'entreprise exige désormais que l'ingénieur examine et confirme chaque modification de la pile de production avant son application.

    Quelle commande permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "cdk deploy --require-approval never", fr: "cdk deploy --require-approval never" } }
    - { id: b, text: { en: "cdk deploy --require-approval any-change", fr: "cdk deploy --require-approval any-change" } }
    - { id: c, text: { en: "cdk deploy --method=direct", fr: "cdk deploy --method=direct" } }
    - { id: d, text: { en: "cdk deploy --hotswap-fallback", fr: "cdk deploy --hotswap-fallback" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The --require-approval option accepts any-change, broadening and never, and broadening is the default. any-change requires manual approval for every change to the stack.
    fr: |
      L'option --require-approval accepte any-change, broadening et never, broadening étant la valeur par défaut. any-change exige une approbation manuelle pour toute modification de la pile.
  options:
    a:
      en: |
        never removes every approval prompt, the opposite of the requirement.
      fr: |
        never supprime toute demande d'approbation, l'inverse de l'exigence.
    c:
      en: |
        direct applies the changes immediately without a change set; it does not add an approval step.
      fr: |
        direct applique les modifications immédiatement sans jeu de modifications ; il n'ajoute pas d'étape d'approbation.
    d:
      en: |
        Hotswap deployments update resources directly to speed up development and are not meant for production.
      fr: |
        Les déploiements hotswap mettent à jour les ressources directement pour accélérer le développement et ne sont pas destinés à la production.
references:
  - title: cdk deploy
    url: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-deploy.html
