id: soac03-3a-cfn-import-requirements
objective: "3.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An engineer must bring an existing Amazon S3 bucket and an existing Amazon DynamoDB table under the management of an existing AWS CloudFormation stack. The engineer adds both resources to the stack's template with their identifier properties. In the same template change, the engineer also adds a new Amazon SQS queue that the application needs. The creation of the import change set fails validation.

    Which combination of actions will make the import succeed? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Un ingénieur doit placer un compartiment Amazon S3 existant et une table Amazon DynamoDB existante sous la gestion d'une pile AWS CloudFormation existante. L'ingénieur ajoute les deux ressources au modèle de la pile avec leurs propriétés d'identification. Dans la même modification du modèle, il ajoute aussi une nouvelle file d'attente Amazon SQS dont l'application a besoin. La création du jeu de modifications d'importation échoue à la validation.

    Quelle combinaison d'actions permet de réussir l'importation ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a DeletionPolicy attribute to the S3 bucket and DynamoDB table resources.", fr: "Ajouter un attribut DeletionPolicy aux ressources du compartiment S3 et de la table DynamoDB." } }
    - { id: b, text: { en: "Enable termination protection on the stack before the import change set is created.", fr: "Activer la protection contre la résiliation de la pile avant de créer le jeu de modifications d'importation." } }
    - { id: c, text: { en: "Run drift detection on the stack before creating the import change set.", fr: "Exécuter la détection de dérive sur la pile avant de créer le jeu de modifications d'importation." } }
    - { id: d, text: { en: "Remove the SQS queue from the import, and add it in a later stack update.", fr: "Retirer la file d'attente SQS de l'importation, et l'ajouter dans une mise à jour de pile ultérieure." } }
    - { id: e, text: { en: "Add UpdateReplacePolicy: Retain to every resource that the stack already manages.", fr: "Ajouter UpdateReplacePolicy: Retain à chaque ressource que la pile gère déjà." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Each resource to import must have a DeletionPolicy attribute, with any value, for the import to succeed. An import operation also cannot create or delete resources or change property configurations, so the new queue must be added in a normal stack update after the import.
    fr: |
      Chaque ressource à importer doit avoir un attribut DeletionPolicy, avec n'importe quelle valeur, pour que l'importation réussisse. Une opération d'importation ne peut pas non plus créer ni supprimer de ressources, ni modifier des configurations de propriétés : la nouvelle file d'attente doit être ajoutée par une mise à jour de pile normale après l'importation.
  options:
    b:
      en: |
        Termination protection only blocks stack deletion; it is not a requirement of resource import.
      fr: |
        La protection contre la résiliation bloque seulement la suppression de la pile ; ce n'est pas une condition de l'importation de ressources.
    c:
      en: |
        AWS recommends drift detection on the imported resources after the import; it does not fix the validation errors.
      fr: |
        AWS recommande la détection de dérive sur les ressources importées après l'importation ; elle ne corrige pas les erreurs de validation.
    e:
      en: |
        Only the resources being imported need a DeletionPolicy; an UpdateReplacePolicy on existing resources does not meet the import requirements.
      fr: |
        Seules les ressources importées ont besoin d'un DeletionPolicy ; un UpdateReplacePolicy sur les ressources existantes ne répond pas aux exigences de l'importation.
references:
  - title: Import AWS resources into a CloudFormation stack manually
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/import-resources-manually.html
