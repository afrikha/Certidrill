id: soac03-3b-cfn-instance-refresh-policy
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS CloudFormation stack manages an Auto Scaling group that has an instance maintenance policy with MinHealthyPercentage 100 and MaxHealthyPercentage 120. The group has an AutoScalingRollingUpdate update policy. During stack updates that change the launch template, healthy capacity drops below the desired capacity. Stack updates must honor the instance maintenance policy, and the Auto Scaling group must not be replaced because other tools reference its name.

    Which solution will meet these requirements?
  fr: |
    Une pile AWS CloudFormation gère un Auto Scaling group doté d'une politique de maintenance des instances avec MinHealthyPercentage 100 et MaxHealthyPercentage 120. Le groupe a une politique de mise à jour AutoScalingRollingUpdate. Pendant les mises à jour de pile qui changent le modèle de lancement, la capacité saine descend sous la capacité souhaitée. Les mises à jour de pile doivent respecter la politique de maintenance des instances, et l'Auto Scaling group ne doit pas être remplacé car d'autres outils font référence à son nom.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace the AutoScalingRollingUpdate policy with an AutoScalingInstanceRefresh policy that uses the Rolling strategy.", fr: "Remplacer la politique AutoScalingRollingUpdate par une politique AutoScalingInstanceRefresh qui utilise la stratégie Rolling." } }
    - { id: b, text: { en: "Add an AutoScalingInstanceRefresh policy next to the existing AutoScalingRollingUpdate policy.", fr: "Ajouter une politique AutoScalingInstanceRefresh à côté de la politique AutoScalingRollingUpdate existante." } }
    - { id: c, text: { en: "Add an AutoScalingReplacingUpdate policy with WillReplace set to true.", fr: "Ajouter une politique AutoScalingReplacingUpdate avec WillReplace défini à true." } }
    - { id: d, text: { en: "Add the ReplaceUnhealthy and AZRebalance processes to SuspendProcesses in the AutoScalingRollingUpdate policy.", fr: "Ajouter les processus ReplaceUnhealthy et AZRebalance à SuspendProcesses dans la politique AutoScalingRollingUpdate." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AutoScalingRollingUpdate does not honor the group's instance maintenance policy and does not launch new instances before terminating old ones. AutoScalingInstanceRefresh runs an Auto Scaling instance refresh during the stack update, takes its healthy percentage defaults from the instance maintenance policy, and keeps the same group."
    fr: "AutoScalingRollingUpdate ne respecte pas la politique de maintenance des instances du groupe et ne lance pas de nouvelles instances avant de résilier les anciennes. AutoScalingInstanceRefresh exécute une actualisation d'instance Auto Scaling pendant la mise à jour de la pile, reprend ses valeurs de pourcentage sain par défaut de la politique de maintenance des instances, et conserve le même groupe."
  options:
    b:
      en: "The two policies cannot be specified on the same Auto Scaling group; the stack update fails."
      fr: "Les deux politiques ne peuvent pas être indiquées sur le même Auto Scaling group ; la mise à jour de la pile échoue."
    c:
      en: "A replacing update creates a new Auto Scaling group, which breaks the tools that reference the group name."
      fr: "Une mise à jour par remplacement crée un nouvel Auto Scaling group, ce qui casse les outils qui font référence au nom du groupe."
    d:
      en: "Suspending processes does not change how the rolling update terminates and launches instances, so capacity still drops."
      fr: "Suspendre des processus ne change pas la façon dont la mise à jour propagée résilie et lance les instances : la capacité baisse toujours."
references:
  - title: UpdatePolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatepolicy.html
