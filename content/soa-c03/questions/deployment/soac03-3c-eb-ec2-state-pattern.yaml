id: soac03-3c-eb-ec2-state-pattern
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An operations team wants an email from an existing Amazon SNS topic whenever any Amazon EC2 instance in the account and Region is stopped or terminated. The team creates an Amazon EventBridge rule on the default event bus that targets the topic.

    Which event pattern should the rule use?
  fr: |
    Une équipe d'exploitation veut recevoir un e-mail d'une rubrique Amazon SNS existante chaque fois qu'une instance Amazon EC2 du compte et de la Région est arrêtée ou résiliée. L'équipe crée sur le bus d'événements par défaut une règle Amazon EventBridge qui cible la rubrique.

    Quel modèle d'événement la règle doit-elle utiliser ?
body:
  options:
    - id: a
      text: '`{"source": ["aws.ec2"], "detail-type": ["AWS API Call via CloudTrail"], "detail": {"state": ["stopped", "terminated"]}}`'
    - id: b
      text: '`{"source": ["aws.ec2"], "detail-type": ["EC2 Instance State-change Notification"], "detail": {"state": ["stopped", "terminated"]}}`'
    - id: c
      text: '`{"source": ["ec2.amazonaws.com"], "detail-type": ["EC2 Instance State-change Notification"], "detail": {"state": ["stopped", "terminated"]}}`'
    - id: d
      text: '`{"source": ["aws.ec2"], "detail-type": ["EC2 Instance State-change Notification"], "detail": {"instance-state": ["stopped", "terminated"]}}`'
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EC2 sends EC2 Instance State-change Notification events with the source aws.ec2 to the default event bus. The detail object contains instance-id and state, and the state values include stopping, stopped, shutting-down, and terminated. Listing two values in the array matches either of them."
    fr: "Amazon EC2 envoie des événements EC2 Instance State-change Notification avec la source aws.ec2 au bus d'événements par défaut. L'objet detail contient instance-id et state, et les valeurs de state incluent stopping, stopped, shutting-down et terminated. Indiquer deux valeurs dans le tableau correspond à l'une ou l'autre."
  options:
    a:
      en: "CloudTrail API call events describe API requests such as StopInstances; their detail has no state field, so the pattern never matches."
      fr: "Les événements d'appel d'API CloudTrail décrivent des requêtes d'API comme StopInstances ; leur objet detail n'a pas de champ state : le modèle ne correspond jamais."
    c:
      en: "ec2.amazonaws.com is the eventSource value inside CloudTrail records; the event source of EC2 events is aws.ec2."
      fr: "ec2.amazonaws.com est la valeur eventSource des enregistrements CloudTrail ; la source des événements EC2 est aws.ec2."
    d:
      en: "The field in the event detail is named state, not instance-state, so the pattern never matches."
      fr: "Le champ de l'objet detail s'appelle state et non instance-state : le modèle ne correspond jamais."
references:
  - title: State change events for Amazon EC2 instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/monitoring-instance-state-changes.html
