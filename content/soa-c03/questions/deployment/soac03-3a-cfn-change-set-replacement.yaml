id: soac03-3a-cfn-change-set-replacement
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before updating a production stack, an operations engineer reviews a change set. The describe-change-set output contains the following change. The template defines no UpdateReplacePolicy for the resource.

    ```json
    {
      "Type": "Resource",
      "ResourceChange": {
        "Action": "Modify",
        "LogicalResourceId": "OrdersDatabase",
        "PhysicalResourceId": "orders-db",
        "ResourceType": "AWS::RDS::DBInstance",
        "Replacement": "True",
        "Scope": ["Properties"],
        "Details": [
          {
            "Target": {
              "Attribute": "Properties",
              "Name": "DBInstanceIdentifier",
              "RequiresRecreation": "Always"
            },
            "Evaluation": "Static",
            "ChangeSource": "DirectModification"
          }
        ]
      }
    }
    ```

    What will happen to the DB instance if the change set is executed?
  fr: |
    Avant de mettre à jour une pile de production, un ingénieur d'exploitation examine un jeu de modifications. La sortie de describe-change-set contient la modification suivante. Le modèle ne définit aucun UpdateReplacePolicy pour la ressource.

    ```json
    {
      "Type": "Resource",
      "ResourceChange": {
        "Action": "Modify",
        "LogicalResourceId": "OrdersDatabase",
        "PhysicalResourceId": "orders-db",
        "ResourceType": "AWS::RDS::DBInstance",
        "Replacement": "True",
        "Scope": ["Properties"],
        "Details": [
          {
            "Target": {
              "Attribute": "Properties",
              "Name": "DBInstanceIdentifier",
              "RequiresRecreation": "Always"
            },
            "Evaluation": "Static",
            "ChangeSource": "DirectModification"
          }
        ]
      }
    }
    ```

    Qu'arrivera-t-il à l'instance de base de données si le jeu de modifications est exécuté ?
body:
  options:
    - { id: a, text: { en: "CloudFormation renames the existing DB instance in place, without interruption.", fr: "CloudFormation renomme sur place l'instance de base de données existante, sans interruption." } }
    - { id: b, text: { en: "CloudFormation modifies the DB instance during its next maintenance window and keeps the same physical ID.", fr: "CloudFormation modifie l'instance de base de données pendant sa prochaine fenêtre de maintenance et conserve le même ID physique." } }
    - { id: c, text: { en: "CloudFormation creates a new DB instance with a new physical ID, and then deletes the orders-db DB instance.", fr: "CloudFormation crée une nouvelle instance de base de données avec un nouvel ID physique, puis supprime l'instance de base de données orders-db." } }
    - { id: d, text: { en: "CloudFormation fails the update, because a property that requires replacement cannot be changed on a DB instance.", fr: "CloudFormation fait échouer la mise à jour, car une propriété qui exige un remplacement ne peut pas être modifiée sur une instance de base de données." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Replacement True means that CloudFormation replaces the resource: RequiresRecreation is Always with a Static evaluation. By default, CloudFormation creates the replacement first and then deletes the old resource, because the default UpdateReplacePolicy is Delete. The new DB instance is a different resource, so the engineer must plan how to keep the data before running the change set.
    fr: |
      Replacement True signifie que CloudFormation remplace la ressource : RequiresRecreation vaut Always avec une évaluation Static. Par défaut, CloudFormation crée d'abord la ressource de remplacement puis supprime l'ancienne, car l'UpdateReplacePolicy par défaut est Delete. La nouvelle instance de base de données est une ressource différente : l'ingénieur doit prévoir la conservation des données avant d'exécuter le jeu de modifications.
  options:
    a:
      en: |
        An in-place change would show Replacement False; this change requires recreating the resource.
      fr: |
        Une modification sur place afficherait Replacement False ; cette modification exige de recréer la ressource.
    b:
      en: |
        A replacement creates a different physical resource with a new physical ID; it is not deferred to a maintenance window.
      fr: |
        Un remplacement crée une ressource physique différente avec un nouvel ID physique ; il n'est pas reporté à une fenêtre de maintenance.
    d:
      en: |
        CloudFormation supports replacement updates; it fails them only if something else, such as a stack policy, denies them.
      fr: |
        CloudFormation prend en charge les mises à jour avec remplacement ; il ne les fait échouer que si un autre élément, comme une politique de pile, les refuse.
references:
  - title: ResourceChange
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_ResourceChange.html
  - title: UpdateReplacePolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-attribute-updatereplacepolicy.html
