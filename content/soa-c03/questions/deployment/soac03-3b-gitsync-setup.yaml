id: soac03-3b-gitsync-setup
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores an AWS CloudFormation template in a GitLab repository. The operations team wants CloudFormation to update the stack automatically whenever a commit to the main branch changes the template or its parameter values. The team does not want to build or maintain a pipeline.

    Which three items are required? (Choose three.) Each correct answer presents part of the solution.
  fr: |
    Une entreprise stocke un modèle AWS CloudFormation dans un dépôt GitLab. L'équipe d'exploitation veut que CloudFormation mette à jour la pile automatiquement chaque fois qu'un commit sur la branche main change le modèle ou ses valeurs de paramètres. L'équipe ne veut pas créer ni maintenir de pipeline.

    Quels sont les trois éléments nécessaires ? (Choisissez trois réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 3
  options:
    - { id: a, text: { en: "An AWS CodeConnections connection to the GitLab repository", fr: "Une connexion AWS CodeConnections au dépôt GitLab" } }
    - { id: b, text: { en: "An AWS CodePipeline pipeline with a CloudFormation deploy action", fr: "Un pipeline AWS CodePipeline avec une action de déploiement CloudFormation" } }
    - { id: c, text: { en: "A stack deployment file in the repository that gives the template path and the parameter values", fr: "Un fichier de déploiement de pile dans le dépôt qui indique le chemin du modèle et les valeurs des paramètres" } }
    - { id: d, text: { en: "An AWS CodeBuild project that runs aws cloudformation deploy on each commit", fr: "Un projet AWS CodeBuild qui exécute aws cloudformation deploy à chaque commit" } }
    - { id: e, text: { en: "An IAM role for Git sync that trusts the cloudformation.sync.codeconnections.amazonaws.com service principal", fr: "Un rôle IAM pour Git sync qui approuve le principal de service cloudformation.sync.codeconnections.amazonaws.com" } }
    - { id: f, text: { en: "An Amazon S3 bucket that receives the template from a GitLab CI job", fr: "Un compartiment Amazon S3 qui reçoit le modèle depuis un job GitLab CI" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "CloudFormation Git sync monitors a branch of a repository linked through AWS CodeConnections, which supports GitLab. It reads a stack deployment file (template-file-path, parameters, tags) and uses a Git sync service role trusted by cloudformation.sync.codeconnections.amazonaws.com to create and run change sets when the files change."
    fr: "CloudFormation Git sync surveille une branche d'un dépôt lié via AWS CodeConnections, qui prend en charge GitLab. Il lit un fichier de déploiement de pile (template-file-path, parameters, tags) et utilise un rôle de service Git sync approuvé par cloudformation.sync.codeconnections.amazonaws.com pour créer et exécuter des jeux de modifications lorsque les fichiers changent."
  options:
    b:
      en: "Git sync updates the stack directly from the repository; a pipeline is what the team wants to avoid."
      fr: "Git sync met à jour la pile directement depuis le dépôt ; un pipeline est justement ce que l'équipe veut éviter."
    d:
      en: "A build project is custom automation to maintain and is not needed with Git sync."
      fr: "Un projet de build est une automatisation personnalisée à maintenir, inutile avec Git sync."
    f:
      en: "Git sync reads the template from the repository, so no upload job or bucket is needed."
      fr: "Git sync lit le modèle dans le dépôt : aucun job de chargement ni compartiment n'est nécessaire."
references:
  - title: Prerequisites for syncing stacks to a Git repository using Git sync
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/git-sync-prereq.html
  - title: How Git sync works with CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/git-sync-concepts-terms.html
