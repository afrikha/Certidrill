id: soac03-3c-s3-eventbridge-filter
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company wants to process only the .csv files larger than 100 MB that are uploaded to an Amazon S3 bucket. Each matching upload must start an AWS Step Functions state machine and must also invoke an AWS Lambda function that records an audit entry. The company does not want to write filtering logic in code.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise veut traiter uniquement les fichiers .csv de plus de 100 Mo chargés dans un compartiment Amazon S3. Chaque chargement correspondant doit lancer une machine d'état AWS Step Functions et aussi appeler une fonction AWS Lambda qui enregistre une entrée d'audit. L'entreprise ne veut pas écrire de logique de filtrage dans du code.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an S3 event notification with the suffix .csv that invokes the function, and have the function start the state machine for objects larger than 100 MB.", fr: "Créer une notification d'événement S3 avec le suffixe .csv qui appelle la fonction, et faire lancer la machine d'état par la fonction pour les objets de plus de 100 Mo." } }
    - { id: b, text: { en: "Turn on the bucket setting that sends the bucket's events to Amazon EventBridge.", fr: "Activer le paramètre du compartiment qui envoie ses événements à Amazon EventBridge." } }
    - { id: c, text: { en: "Create an S3 event notification for s3:ObjectCreated:* with the suffix .csv that publishes to an SNS topic, and subscribe the state machine and the function.", fr: "Créer une notification d'événement S3 pour s3:ObjectCreated:* avec le suffixe .csv qui publie dans une rubrique SNS, et abonner la machine d'état et la fonction." } }
    - { id: d, text: { en: "Create two S3 event notifications for the suffix .csv, one that targets the function and one that targets an SQS queue for the state machine.", fr: "Créer deux notifications d'événement S3 pour le suffixe .csv, l'une qui cible la fonction et l'autre qui cible une file d'attente SQS pour la machine d'état." } }
    - { id: e, text: { en: "Create an EventBridge rule that matches Object Created events with a .csv key suffix and a numeric size filter, with the state machine and the function as targets.", fr: "Créer une règle EventBridge qui correspond aux événements Object Created avec un suffixe de clé .csv et un filtre numérique sur la taille, avec la machine d'état et la fonction comme cibles." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "When EventBridge is turned on for a bucket, Amazon S3 sends all its events, such as Object Created, to EventBridge. An event pattern can match any field of the event, including a key suffix and a numeric comparison on the object size, and one rule can have several targets, including Step Functions and Lambda. No filtering code is needed."
    fr: "Lorsqu'EventBridge est activé pour un compartiment, Amazon S3 envoie tous ses événements, comme Object Created, à EventBridge. Un modèle d'événement peut correspondre à n'importe quel champ de l'événement, y compris un suffixe de clé et une comparaison numérique sur la taille de l'objet, et une règle peut avoir plusieurs cibles, dont Step Functions et Lambda. Aucun code de filtrage n'est nécessaire."
  options:
    a:
      en: "S3 event notifications filter only on key prefix and suffix, so the size check would be filtering logic in the function code."
      fr: "Les notifications d'événements S3 ne filtrent que sur le préfixe et le suffixe de clé : la vérification de la taille serait une logique de filtrage dans le code de la fonction."
    c:
      en: "The notification cannot filter on size, so every .csv file would be processed, and SNS cannot deliver messages directly to a state machine."
      fr: "La notification ne peut pas filtrer sur la taille : chaque fichier .csv serait traité, et SNS ne peut pas remettre de messages directement à une machine d'état."
    d:
      en: "Two notifications with the same suffix and event types overlap and are rejected, and neither can filter on size."
      fr: "Deux notifications avec le même suffixe et les mêmes types d'événements se chevauchent et sont rejetées, et aucune ne peut filtrer sur la taille."
references:
  - title: Using EventBridge
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
  - title: Comparison operators for use in event patterns in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-create-pattern-operators.html
