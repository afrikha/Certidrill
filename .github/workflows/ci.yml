name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# A new push cancels the run still going for the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: certidrill_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/certidrill_test
      AUTH_SECRET: ci-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"
      # Only a boolean here: the token itself is passed to the Sonar step alone
      # (not to npm ci, whose dependency scripts could read it).
      HAS_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs the history to detect new code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm run lint
      - run: npm run typecheck
      # Unit + integration (real PostgreSQL) + React components.
      # Fails under 80 % overall or 90 % on lib/exam.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      # SonarQube Cloud Free plan: only the main branch and pull requests that
      # target it can be analysed (other branches fail on the server side).
      - name: SonarQube Cloud analysis and quality gate
        if: env.HAS_SONAR == 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main'))
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >-
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
            ${{ vars.SONAR_PROJECT_KEY && format('-Dsonar.projectKey={0}', vars.SONAR_PROJECT_KEY) || '' }}
      - name: Sonar skipped
        if: env.HAS_SONAR != 'true' || !(github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main'))
        run: echo "::notice::Sonar analysis skipped — it runs on main and on pull requests to main, with the SONAR_TOKEN secret (see README)."
      - run: npm run build

  # Developers run the app on Windows too: content loading, paths, unit and
  # component tests and the production build must work there (no PostgreSQL
  # service containers on Windows runners: database tests run on Linux).
  windows:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:components
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    # Official Playwright image: Chromium and its system libraries are
    # preinstalled, so the job doesn't depend on the Ubuntu apt mirrors
    # (`playwright install --with-deps` failed when they were unreachable).
    # Keep the tag equal to the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: certidrill_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # In a container job, services are reached by their name.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/certidrill_e2e
      AUTH_SECRET: ci-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # End-to-end journeys + non-regression suite (ARIA snapshots, access
      # control, HTTP contract) against a production build.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
